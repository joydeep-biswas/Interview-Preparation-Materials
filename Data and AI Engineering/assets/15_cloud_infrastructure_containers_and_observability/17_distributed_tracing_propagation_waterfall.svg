<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="100%" height="100%" style="background-color: #0b1120; max-width: 100%; height: auto;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arr-b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#4ade80"/>
    </marker>
    <marker id="arr-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#c084fc"/>
    </marker>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#f87171"/>
    </marker>
    <marker id="arr-c" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#2dd4bf"/>
    </marker>
    <marker id="arr-s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Base Background -->
  <rect width="980" height="440" rx="10" fill="url(#bg)"/>

  <!-- Diagram Header -->
  <g id="header">
    <text x="490" y="36" fill="#f8fafc" font-size="18" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Distributed Tracing Context Propagation Waterfall</text>
    <text x="490" y="58" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">In-Band Context Injection Across Synchronous HTTP REST and Asynchronous Kafka Event Mesh</text>
  </g>

  <!-- Diagram Body -->
  <g id="diagram-elements">
    
    <!-- Columns for 4 Actors -->
    <line x1="120" y1="95" x2="120" y2="400" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="360" y1="95" x2="360" y2="400" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="620" y1="95" x2="620" y2="400" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="860" y1="95" x2="860" y2="400" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>

    <rect x="40" y="95" width="160" height="45" rx="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
<text x="120" y="117" fill="#f8fafc" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Client Browser</text>
<text x="52" y="137" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">User checkout action</text>
    <rect x="270" y="95" width="180" height="45" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="360" y="117" fill="#38bdf8" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Order Service (Producer)</text>
<text x="282" y="137" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">FastAPI REST Microservice</text>
    <rect x="530" y="95" width="180" height="45" rx="6" fill="#231e12" stroke="#fbbf24" stroke-width="1.5"/>
<text x="620" y="117" fill="#fde68a" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Apache Kafka Topic</text>
<text x="542" y="137" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">'order-events' Distributed Log</text>
    <rect x="770" y="95" width="180" height="45" rx="6" fill="#0f291e" stroke="#4ade80" stroke-width="1.5"/>
<text x="860" y="117" fill="#86efac" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Payment Service (Consumer)</text>
<text x="782" y="137" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Background Event Worker</text>

    <!-- Step 1: Client to OrderService -->
    <line x1="120" y1="170" x2="360" y2="170" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-b)"/>
<text x="240" y="160" fill="#38bdf8" font-size="10" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">1. HTTP POST /orders (traceparent: 00-abc...-01)</text>

    <!-- Step 2: OrderService Processing &amp; Span -->
    <rect x="260" y="190" width="200" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="360" y="212" fill="#38bdf8" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Span: 'CreateOrder'</text>
<text x="272" y="232" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Context: Ingests traceparent</text>
<text x="272" y="250" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Generates SpanID: 0x1111</text>

    <!-- Step 3: OrderService to Kafka -->
    <line x1="360" y1="260" x2="620" y2="260" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arr-a)"/>
<text x="490" y="250" fill="#fbbf24" font-size="10" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">2. Produce Kafka Record (Header: traceparent)</text>

    <!-- Step 4: Kafka Persists -->
    <rect x="520" y="275" width="200" height="45" rx="6" fill="#231e12" stroke="#fbbf24" stroke-width="1.5"/>
<text x="620" y="297" fill="#fde68a" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Commit to Partition</text>
<text x="532" y="317" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Offsets &amp; headers persisted</text>

    <!-- Step 5: Kafka to PaymentService -->
    <line x1="620" y1="340" x2="860" y2="340" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-g)"/>
<text x="740" y="330" fill="#4ade80" font-size="10" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">3. Poll Record Batch (Extracts Context)</text>

    <!-- Step 6: PaymentService Child Span -->
    <rect x="760" y="355" width="200" height="55" rx="6" fill="#0f291e" stroke="#4ade80" stroke-width="1.5"/>
<text x="860" y="377" fill="#86efac" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Span: 'ProcessPayment'</text>
<text x="772" y="397" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">ParentSpanID: 0x1111</text>
<text x="772" y="415" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">TraceID: 0xabc (Identical!)</text>
<text x="772" y="433" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">End-to-End Tracing Intact!</text>

  </g>
</svg>