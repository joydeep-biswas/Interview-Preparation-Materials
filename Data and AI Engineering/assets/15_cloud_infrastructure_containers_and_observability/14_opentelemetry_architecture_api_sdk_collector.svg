<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="100%" height="100%" style="background-color: #0b1120; max-width: 100%; height: auto;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arr-b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#4ade80"/>
    </marker>
    <marker id="arr-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#c084fc"/>
    </marker>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#f87171"/>
    </marker>
    <marker id="arr-c" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#2dd4bf"/>
    </marker>
    <marker id="arr-s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Base Background -->
  <rect width="980" height="420" rx="10" fill="url(#bg)"/>

  <!-- Diagram Header -->
  <g id="header">
    <text x="490" y="36" fill="#f8fafc" font-size="18" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">OpenTelemetry (OTel) Architecture: API, SDK, and Collector Pipeline</text>
    <text x="490" y="58" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Process Boundary Decoupling, OTLP Wire Protocol, and Collector Ingestion/Export</text>
  </g>

  <!-- Diagram Body -->
  <g id="diagram-elements">
    
    <rect x="40" y="95" width="330" height="290" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="205" y="115" fill="#38bdf8" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Application Process Boundary</text>
<text x="205" y="131" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Decoupled instrumentation interfaces</text>
    <rect x="60" y="140" width="290" height="50" rx="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
<text x="205" y="162" fill="#94a3b8" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Application Business Logic</text>
<text x="72" y="182" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Calls tracer.start_as_current_span('checkout')</text>
    <rect x="60" y="200" width="290" height="75" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="205" y="222" fill="#38bdf8" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">OpenTelemetry API</text>
<text x="72" y="242" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Interface only; zero operational dependencies</text>
<text x="72" y="260" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">No-op fallback if SDK is not registered</text>
<text x="72" y="278" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Safe to embed in open-source libraries</text>
    <rect x="60" y="285" width="290" height="85" rx="6" fill="#0f291e" stroke="#4ade80" stroke-width="1.5"/>
<text x="205" y="307" fill="#86efac" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">OpenTelemetry SDK</text>
<text x="72" y="327" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Concrete implementation of OTel API</text>
<text x="72" y="345" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Manages in-memory batch buffers &amp; workers</text>
<text x="72" y="363" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Sampler, Resource detectors (host/k8s metadata)</text>
<text x="72" y="381" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Serializes spans/metrics to OTLP format</text>

    <rect x="410" y="195" width="170" height="90" rx="6" fill="#231e12" stroke="#fbbf24" stroke-width="1.5"/>
<text x="495" y="217" fill="#fde68a" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">OTLP Wire Protocol</text>
<text x="422" y="237" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Protocol Buffers (protobuf)</text>
<text x="422" y="255" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Transport: gRPC (:4317)</text>
<text x="422" y="273" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">or HTTP/JSON (:4318)</text>
<text x="422" y="291" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Traces, Metrics, Logs</text>

    <rect x="620" y="95" width="320" height="290" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="780" y="115" fill="#c084fc" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">OTel Collector Pipeline</text>
<text x="780" y="131" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Centralized Telemetry Gateway</text>
    <rect x="640" y="140" width="280" height="60" rx="6" fill="#1e1b2e" stroke="#c084fc" stroke-width="1.5"/>
<text x="780" y="162" fill="#d8b4fe" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Receivers (Ingress)</text>
<text x="652" y="182" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">OTLP gRPC/HTTP, Prometheus, Zipkin, Jaeger</text>
    <rect x="640" y="210" width="280" height="75" rx="6" fill="#1e1b2e" stroke="#c084fc" stroke-width="1.5"/>
<text x="780" y="232" fill="#d8b4fe" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Processors (Enrich &amp; Filter)</text>
<text x="652" y="252" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">batch processor (reduces network calls)</text>
<text x="652" y="270" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">memory_limiter (prevents OOM crashes)</text>
<text x="652" y="288" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">attributes/transform (scrubs PII data)</text>
    <rect x="640" y="295" width="280" height="75" rx="6" fill="#0f291e" stroke="#4ade80" stroke-width="1.5"/>
<text x="780" y="317" fill="#86efac" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Exporters (Egress)</text>
<text x="652" y="337" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Prometheus remote_write, Tempo, Datadog</text>
<text x="652" y="355" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">CloudWatch, Google Cloud Monitoring</text>
<text x="652" y="373" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Splunk, OpenSearch, BigQuery</text>

    <line x1="205" y1="190" x2="205" y2="200" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-b)"/>
    <line x1="205" y1="275" x2="205" y2="285" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-g)"/>
    <path d="M 350.0 327.0 L 360.0 327.0 C 378.0 327.0, 378.0 240.0, 396.0 240.0 L 410.0 240.0" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arr-a)"/>
<text x="380" y="273" fill="#fbbf24" font-size="10" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">OTLP Export</text>
    <line x1="580" y1="240" x2="620" y2="240" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arr-p)"/>

    <line x1="780" y1="200" x2="780" y2="210" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arr-p)"/>
    <line x1="780" y1="285" x2="780" y2="295" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-g)"/>

  </g>
</svg>