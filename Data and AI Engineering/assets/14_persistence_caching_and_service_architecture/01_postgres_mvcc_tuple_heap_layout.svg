<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%" style="background-color: #0b1120; max-width: 100%; height: auto;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arr-b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#4ade80"/>
    </marker>
    <marker id="arr-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#c084fc"/>
    </marker>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#f87171"/>
    </marker>
    <marker id="arr-c" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#2dd4bf"/>
    </marker>
    <marker id="arr-s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Base Background -->
  <rect width="900" height="360" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Diagram Header -->
  <g id="header">
    <text x="450" y="36" fill="#f8fafc" font-size="18" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">PostgreSQL MVCC Table Heap Page &amp; HOT Chain Layout</text>
    <text x="450" y="58" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Multi-Version Concurrency Control (MVCC) Heap Tuples &amp; In-Page Version Chaining</text>
  </g>

  <!-- Diagram Body -->
  <g id="diagram-elements">
    
    <rect x="40" y="90" width="820" height="240" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="450" y="110" fill="#38bdf8" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Table Heap Page (8 KB Data Block)</text>
<text x="450" y="126" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">OS Block 0: Line Pointers + Tuple Heap Storage Area</text>

    <rect x="70" y="150" width="320" height="140" rx="6" fill="#1e1b2e" stroke="#f87171" stroke-width="1.5"/>
<text x="230" y="172" fill="#fca5a5" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Tuple 1 (Dead Version - Balance: $100.00)</text>
<text x="82" y="192" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">xmin: 100 (Created by Transaction 100)</text>
<text x="82" y="210" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">xmax: 105 (Updated / Expired by TX 105)</text>
<text x="82" y="228" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">t_ctid: (Block 0, Slot 2) -&gt; Pointer to next</text>
<text x="82" y="246" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Status: Invisible to snapshots &gt; 105</text>
<text x="82" y="264" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Target for VACUUM reclamation</text>

    <rect x="490" y="150" width="340" height="140" rx="6" fill="#0f291e" stroke="#4ade80" stroke-width="1.5"/>
<text x="660" y="172" fill="#86efac" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Tuple 2 (Current Version - Balance: $150.00)</text>
<text x="502" y="192" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">xmin: 105 (Created by Transaction 105)</text>
<text x="502" y="210" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">xmax: 0 (Active / Currently Live)</text>
<text x="502" y="228" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">t_ctid: (Block 0, Slot 2) -&gt; Self-referential</text>
<text x="502" y="246" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Status: Visible to active transactions</text>
<text x="502" y="264" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">HOT Chain: Reuses existing index pointer</text>

    <line x1="390" y1="220" x2="490" y2="220" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arr-a)"/>
<text x="440" y="208" fill="#fbbf24" font-size="10" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">HOT Version Chain (t_ctid)</text>

  </g>
</svg>