<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="980" height="420" rx="10" fill="url(#bg)"/>
  <text x="490.0" y="36" fill="#f8fafc" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Write-Ahead Logging (WAL) &amp; ACID Durability Sequence</text>
  <text x="490.0" y="58" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Write-Ahead Invariant: WAL Must Flush to Disk via fsync() BEFORE Commit Acknowledgment</text>
  
  
    <rect x="40" y="110" width="190" height="160" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="135.0" y="136" fill="#93c5fd" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">1. Client App</text>
    <text x="135.0" y="152" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Transactional Client</text>
    <rect x="172" y="120" width="52" height="18" rx="9" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <text x="198.0" y="132" fill="#3b82f6" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">CLIENT</text>
    <circle cx="56" cy="165" r="2" fill="#3b82f6"/>
    <text x="64" y="168" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Executes SQL:</text>
    <circle cx="56" cy="181" r="2" fill="#3b82f6"/>
    <text x="64" y="184" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">UPDATE accounts</text>
    <circle cx="56" cy="197" r="2" fill="#3b82f6"/>
    <text x="64" y="200" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">SET balance = balance - 100</text>
    <circle cx="56" cy="213" r="2" fill="#3b82f6"/>
    <text x="64" y="216" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">WHERE id = 1;</text>
    <circle cx="56" cy="229" r="2" fill="#3b82f6"/>
    <text x="64" y="232" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Waits for commit ACK</text>

  
    <rect x="270" y="110" width="220" height="160" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="380.0" y="136" fill="#6ee7b7" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">2. Buffer Pool (RAM)</text>
    <text x="380.0" y="152" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">In-Memory Page Modification</text>
    <rect x="404" y="120" width="80" height="18" rx="9" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="444.0" y="132" fill="#10b981" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">DIRTY PAGE</text>
    <circle cx="286" cy="165" r="2" fill="#10b981"/>
    <text x="294" y="168" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Modifies 8KB Page in RAM</text>
    <circle cx="286" cy="181" r="2" fill="#10b981"/>
    <text x="294" y="184" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Page marked DIRTY (DirtyBit=1)</text>
    <circle cx="286" cy="197" r="2" fill="#10b981"/>
    <text x="294" y="200" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Tagged with LSN: PageLSN = 5024</text>
    <circle cx="286" cy="213" r="2" fill="#10b981"/>
    <text x="294" y="216" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Appends Redo Record to WAL Buffer</text>
    <circle cx="286" cy="229" r="2" fill="#10b981"/>
    <text x="294" y="232" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Zero table data flushed to disk yet!</text>

  
    <rect x="530" y="110" width="200" height="160" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="630.0" y="136" fill="#fde68a" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">3. WAL Ring Buffer</text>
    <text x="630.0" y="152" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Sequential Redo Log RAM</text>
    <rect x="644" y="120" width="80" height="18" rx="9" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="684.0" y="132" fill="#f59e0b" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">WAL BUFFER</text>
    <circle cx="546" cy="165" r="2" fill="#f59e0b"/>
    <text x="554" y="168" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Holds Redo Record:</text>
    <circle cx="546" cy="181" r="2" fill="#f59e0b"/>
    <text x="554" y="184" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">LSN: 5024, TxID: 981</text>
    <circle cx="546" cy="197" r="2" fill="#f59e0b"/>
    <text x="554" y="200" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Table: accounts, Col: balance</text>
    <circle cx="546" cy="213" r="2" fill="#f59e0b"/>
    <text x="554" y="216" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">OldVal: 500, NewVal: 400</text>
    <circle cx="546" cy="229" r="2" fill="#f59e0b"/>
    <text x="554" y="232" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Flushed via fsync() on COMMIT</text>

  
    <rect x="770" y="110" width="180" height="160" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="860.0" y="136" fill="#fca5a5" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">4. WAL Disk (SSD)</text>
    <text x="860.0" y="152" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Append-Only File on NVMe</text>
    <rect x="885" y="120" width="59" height="18" rx="9" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
    <text x="914.5" y="132" fill="#ef4444" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">DURABLE</text>
    <circle cx="786" cy="165" r="2" fill="#ef4444"/>
    <text x="794" y="168" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Synchronous fsync() write</text>
    <circle cx="786" cy="181" r="2" fill="#ef4444"/>
    <text x="794" y="184" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Guarantees hardware durability</text>
    <circle cx="786" cy="197" r="2" fill="#ef4444"/>
    <text x="794" y="200" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Sequential write is 100x faster</text>
    <circle cx="786" cy="213" r="2" fill="#ef4444"/>
    <text x="794" y="216" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">than random table heap writes!</text>
    <circle cx="786" cy="229" r="2" fill="#ef4444"/>
    <text x="794" y="232" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Commit ACK returned to client</text>

  
    <rect x="40" y="300" width="910" height="95" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="495.0" y="326" fill="#c084fc" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Asynchronous Background Checkpointer Process (Lazy Writer)</text>
    <text x="495.0" y="342" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Decoupling Transaction Latency from Slow Disk Heap Writes</text>
    <rect x="850" y="310" width="94" height="18" rx="9" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
    <text x="897.0" y="322" fill="#8b5cf6" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">CHECKPOINTER</text>
    <circle cx="56" cy="355" r="2" fill="#8b5cf6"/>
    <text x="64" y="358" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">The client transaction commits as soon as the small sequential WAL record is fsync'd to disk! The dirty 8KB table pages in RAM are NOT written to disk yet.</text>
    <circle cx="56" cy="371" r="2" fill="#8b5cf6"/>
    <text x="64" y="374" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">A background checkpointer thread asynchronously flushes dirty pages from the Buffer Pool to table heap data files every 5 minutes, keeping client latency under 1 millisecond!</text>

  
    <line x1="230" y1="190" x2="270" y2="190" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr-b)"/><text x="250.0" y="182.0" fill="#3b82f6" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">1. UPDATE</text>
  
    <line x1="490" y1="190" x2="530" y2="190" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/><text x="510.0" y="182.0" fill="#10b981" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">2. Append LSN</text>
  
    <line x1="730" y1="190" x2="770" y2="190" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-a)"/><text x="750.0" y="182.0" fill="#f59e0b" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">3. fsync()</text>
  
    <polyline points="860,270 860,290 135,290 135,270" fill="none" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/><text x="490" y="282" fill="#10b981" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">4. COMMIT ACK</text>

</svg>