  <rect width="980" height="420" rx="10" fill="url(#bg)"/>
  <text x="490.0" y="36" fill="#f8fafc" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Distributed Locks &amp; Fencing Tokens (Martin Kleppmann Safety Pattern)</text>
  <text x="490.0" y="58" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Preventing Silent Storage Corruption from GC Pauses via Monotonically Increasing Tokens</text>
  
  
    <rect x="30" y="110" width="170" height="150" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="115.0" y="136" fill="#fca5a5" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Client 1</text>
    <text x="115.0" y="152" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">GC Paused Worker</text>
    <rect x="128" y="120" width="66" height="18" rx="9" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
    <text x="161.0" y="132" fill="#ef4444" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">CLIENT 1</text>
    <circle cx="46" cy="165" r="2" fill="#ef4444"/>
    <text x="54" y="168" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Acquires lock from ZK</text>
    <circle cx="46" cy="181" r="2" fill="#ef4444"/>
    <text x="54" y="184" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Granted Token #33</text>
    <circle cx="46" cy="197" r="2" fill="#ef4444"/>
    <text x="54" y="200" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Stops-the-world (GC pause)</text>
    <circle cx="46" cy="213" r="2" fill="#ef4444"/>
    <text x="54" y="216" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Paused for 60 seconds!</text>
    <circle cx="46" cy="229" r="2" fill="#ef4444"/>
    <text x="54" y="232" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Lock lease expires!</text>

  
    <rect x="240" y="110" width="220" height="150" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="350.0" y="136" fill="#93c5fd" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">ZooKeeper / Lock Service</text>
    <text x="350.0" y="152" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Consensus Lock Coordinator</text>
    <rect x="360" y="120" width="94" height="18" rx="9" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <text x="407.0" y="132" fill="#3b82f6" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">LOCK SERVICE</text>
    <circle cx="256" cy="165" r="2" fill="#3b82f6"/>
    <text x="264" y="168" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Lock: /locks/storage_writer</text>
    <circle cx="256" cy="181" r="2" fill="#3b82f6"/>
    <text x="264" y="184" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Enforces strict monotonicity:</text>
    <circle cx="256" cy="197" r="2" fill="#3b82f6"/>
    <text x="264" y="200" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Token 33 -&amp;gt; Token 34 -&amp;gt; Token 35</text>
    <circle cx="256" cy="213" r="2" fill="#3b82f6"/>
    <text x="264" y="216" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Lease timeout expires on Client 1</text>
    <circle cx="256" cy="229" r="2" fill="#3b82f6"/>
    <text x="264" y="232" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Grants lock to Client 2 with Token #34</text>

  
    <rect x="500" y="110" width="170" height="150" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="585.0" y="136" fill="#6ee7b7" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Client 2</text>
    <text x="585.0" y="152" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Active Worker</text>
    <rect x="598" y="120" width="66" height="18" rx="9" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="631.0" y="132" fill="#10b981" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">CLIENT 2</text>
    <circle cx="516" cy="165" r="2" fill="#10b981"/>
    <text x="524" y="168" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Acquires lock from ZK</text>
    <circle cx="516" cy="181" r="2" fill="#10b981"/>
    <text x="524" y="184" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Granted Token #34</text>
    <circle cx="516" cy="197" r="2" fill="#10b981"/>
    <text x="524" y="200" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Writes data to storage</text>
    <circle cx="516" cy="213" r="2" fill="#10b981"/>
    <text x="524" y="216" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Carries Token #34 header</text>
    <circle cx="516" cy="229" r="2" fill="#10b981"/>
    <text x="524" y="232" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Succeeds instantly!</text>

  
    <rect x="710" y="110" width="240" height="150" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="830.0" y="136" fill="#c084fc" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Storage Subsystem</text>
    <text x="830.0" y="152" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Fencing Token Validator</text>
    <rect x="885" y="120" width="59" height="18" rx="9" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
    <text x="914.5" y="132" fill="#8b5cf6" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">STORAGE</text>
    <circle cx="726" cy="165" r="2" fill="#8b5cf6"/>
    <text x="734" y="168" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Maintains highest token seen:</text>
    <circle cx="726" cy="181" r="2" fill="#8b5cf6"/>
    <text x="734" y="184" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">current_highest_token = 34</text>
    <circle cx="726" cy="197" r="2" fill="#8b5cf6"/>
    <text x="734" y="200" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Rule: REJECT if token &amp;lt; current</text>
    <circle cx="726" cy="213" r="2" fill="#8b5cf6"/>
    <text x="734" y="216" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Client 2 write (token=34) -&amp;gt; ACCEPT</text>
    <circle cx="726" cy="229" r="2" fill="#8b5cf6"/>
    <text x="734" y="232" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Client 1 wakes up (token=33) -&amp;gt; REJECT!</text>

  
    <line x1="200" y1="170" x2="240" y2="170" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr-b)"/><text x="220.0" y="162.0" fill="#3b82f6" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Get Lock (Token 33)</text>
  
    <line x1="460" y1="170" x2="500" y2="170" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/><text x="480.0" y="162.0" fill="#10b981" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Get Lock (Token 34)</text>
  
    <line x1="670" y1="170" x2="710" y2="170" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/><text x="690.0" y="162.0" fill="#10b981" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Write (Token 34) ACCEPT</text>
  
    <polyline points="115,260 115,340 830,340 830,260" fill="none" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr-r)" stroke-dasharray="4,4"/><text x="470" y="355" fill="#ef4444" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Client 1 wakes from GC: Write (Token 33) REJECTED (33 &lt; 34)!</text>

</svg>