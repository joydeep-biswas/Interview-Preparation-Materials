  </defs>
  <rect width="980" height="420" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="490.0" y="36" fill="#f8fafc" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Split-Brain Mitigation: Majority Quorum Mechanics</text>
  <text x="490.0" y="58" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Preventing Dual Leaders Across Network Partitions via Majority Quorum Rules (N/2 + 1)</text>
  
  
    <rect x="30" y="95" width="430" height="240" rx="10" fill="#260b0b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="46" y="117" fill="#fca5a5" font-size="12" font-family="system-ui, sans-serif" font-weight="bold">West Partition (2 Nodes) - MINORITY</text>
  
    <rect x="45" y="140" width="190" height="75" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="140.0" y="166" fill="#fca5a5" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Node 1</text>
    <text x="140.0" y="182" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Old Leader</text>
    <circle cx="61" cy="195" r="2" fill="#ef4444"/>
    <text x="69" y="198" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Believes it is still leader</text>
    <circle cx="61" cy="211" r="2" fill="#ef4444"/>
    <text x="69" y="214" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Attempts write heartbeat</text>
  
    <rect x="250" y="140" width="195" height="75" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="347.5" y="166" fill="#fca5a5" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Node 2</text>
    <text x="347.5" y="182" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Follower</text>
    <circle cx="266" cy="195" r="2" fill="#ef4444"/>
    <text x="274" y="198" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">West partition peer</text>
    <circle cx="266" cy="211" r="2" fill="#ef4444"/>
    <text x="274" y="214" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Votes for Node 1</text>
  <text x="245" y="270" fill="#fca5a5" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Quorum Check Fails: 2 Nodes &lt; 3 Required Quorum!</text>
  <text x="245" y="295" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">Node 1 MUST step down to follower and reject client writes!</text>

  
    <rect x="520" y="95" width="430" height="240" rx="10" fill="#06231a" stroke="#10b981" stroke-width="1.5"/>
    <text x="536" y="117" fill="#6ee7b7" font-size="12" font-family="system-ui, sans-serif" font-weight="bold">East Partition (3 Nodes) - MAJORITY QUORUM</text>
  
    <rect x="535" y="140" width="125" height="75" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="597.5" y="166" fill="#6ee7b7" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Node 3</text>
    <text x="597.5" y="182" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">New Leader</text>
    <circle cx="551" cy="195" r="2" fill="#10b981"/>
    <text x="559" y="198" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Wins vote: 3 &amp;gt; 2.5</text>
    <circle cx="551" cy="211" r="2" fill="#10b981"/>
    <text x="559" y="214" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Elected Leader!</text>
  
    <rect x="675" y="140" width="125" height="75" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="737.5" y="166" fill="#6ee7b7" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Node 4</text>
    <text x="737.5" y="182" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Follower</text>
    <circle cx="691" cy="195" r="2" fill="#10b981"/>
    <text x="699" y="198" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Quorum member</text>
  
    <rect x="815" y="140" width="120" height="75" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="875.0" y="166" fill="#6ee7b7" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Node 5</text>
    <text x="875.0" y="182" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Follower</text>
    <circle cx="831" cy="195" r="2" fill="#10b981"/>
    <text x="839" y="198" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Quorum member</text>
  <text x="735" y="270" fill="#86efac" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Quorum Won: 3 Nodes &gt;= 3 Required Quorum!</text>
  <text x="735" y="295" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">Node 3 operates as legitimate leader; accepts client traffic safely!</text>

  
    <rect x="30" y="350" width="920" height="55" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="490.0" y="376" fill="#c084fc" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Split-Brain Invariant: Strictly Impossible to Form Two Majorities Simultaneously</text>
    <text x="490.0" y="392" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Why Distributed Consensus Clusters Must ALWAYS Use Odd Node Counts (3, 5, 7)</text>
    <rect x="822" y="360" width="122" height="18" rx="9" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
    <text x="883.0" y="372" fill="#8b5cf6" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">QUORUM INVARIANT</text>
    <circle cx="46" cy="405" r="2" fill="#8b5cf6"/>
    <text x="54" y="408" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">In a 5-node cluster, a majority is strictly 3 nodes. Because 2 + 2 = 4 and 3 + 3 = 6, the network CANNOT partition into two majorities simultaneously!</text>
    <circle cx="46" cy="421" r="2" fill="#8b5cf6"/>
    <text x="54" y="424" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Even if the network bisects into 2 vs 3, only the 3-node partition can make progress. Zero dual-leader split-brain data corruption occurs.</text>

</svg>