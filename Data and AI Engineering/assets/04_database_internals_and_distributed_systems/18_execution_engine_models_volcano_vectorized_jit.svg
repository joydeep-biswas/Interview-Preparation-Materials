<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="980" height="420" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="490.0" y="36" fill="#f8fafc" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Query Execution Engine Models: Volcano vs. Vectorized vs. JIT</text>
  <text x="490.0" y="58" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Evolution from Tuple-at-a-Time Iteration to SIMD Vectors and Machine Code Compilation</text>
  
  
    <rect x="30" y="95" width="290" height="290" rx="10" fill="#0b1329" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="46" y="117" fill="#93c5fd" font-size="12" font-family="system-ui, sans-serif" font-weight="bold">1. Volcano Iterator Model</text>
  
    <rect x="45" y="135" width="260" height="235" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="175.0" y="161" fill="#93c5fd" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Tuple-at-a-Time (next())</text>
    <text x="175.0" y="177" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Standard Classic RDBMS</text>
    <rect x="240" y="145" width="59" height="18" rx="9" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <text x="269.5" y="157" fill="#3b82f6" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">VOLCANO</text>
    <circle cx="61" cy="190" r="2" fill="#3b82f6"/>
    <text x="69" y="193" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Pipeline: Aggregate -&amp;gt; Filter -&amp;gt; Scan</text>
    <circle cx="61" cy="206" r="2" fill="#3b82f6"/>
    <text x="69" y="209" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Each operator exposes next() method</text>
    <circle cx="61" cy="222" r="2" fill="#3b82f6"/>
    <text x="69" y="225" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">One tuple pulled up per virtual function call</text>
    <circle cx="61" cy="238" r="2" fill="#3b82f6"/>
    <text x="69" y="241" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Drawback: Deep virtual call stack overhead</text>
    <circle cx="61" cy="254" r="2" fill="#3b82f6"/>
    <text x="69" y="257" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Severe CPU instruction cache (L1i) misses</text>
    <circle cx="61" cy="270" r="2" fill="#3b82f6"/>
    <text x="69" y="273" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Poor branch prediction on modern CPUs</text>
    <circle cx="61" cy="286" r="2" fill="#3b82f6"/>
    <text x="69" y="289" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Execution bounded by function call overhead</text>

  
    <rect x="345" y="95" width="290" height="290" rx="10" fill="#06231a" stroke="#10b981" stroke-width="1.5"/>
    <text x="361" y="117" fill="#6ee7b7" font-size="12" font-family="system-ui, sans-serif" font-weight="bold">2. Vectorized Engine (SIMD)</text>
  
    <rect x="360" y="135" width="260" height="235" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="490.0" y="161" fill="#6ee7b7" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Columnar Batch Vectors (DuckDB / ClickHouse)</text>
    <text x="490.0" y="177" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Vector-at-a-Time</text>
    <rect x="576" y="145" width="38" height="18" rx="9" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="595.0" y="157" fill="#10b981" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">SIMD</text>
    <circle cx="376" cy="190" r="2" fill="#10b981"/>
    <text x="384" y="193" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Operators process batches of 1024 values</text>
    <circle cx="376" cy="206" r="2" fill="#10b981"/>
    <text x="384" y="209" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Vectors fit entirely inside CPU L1 Data Cache</text>
    <circle cx="376" cy="222" r="2" fill="#10b981"/>
    <text x="384" y="225" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Applies SIMD registers (AVX-512 / ARM NEON):</text>
    <circle cx="376" cy="238" r="2" fill="#10b981"/>
    <text x="384" y="241" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Evaluates 8 or 16 values per single CPU clock!</text>
    <circle cx="376" cy="254" r="2" fill="#10b981"/>
    <text x="384" y="257" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Zero virtual function calls per record</text>
    <circle cx="376" cy="270" r="2" fill="#10b981"/>
    <text x="384" y="273" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Extremely high instructions-per-cycle (IPC)</text>
    <circle cx="376" cy="286" r="2" fill="#10b981"/>
    <text x="384" y="289" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Blazing fast OLAP aggregations</text>

  
    <rect x="660" y="95" width="290" height="290" rx="10" fill="#1c0d2e" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="676" y="117" fill="#c084fc" font-size="12" font-family="system-ui, sans-serif" font-weight="bold">3. Whole-Stage JIT (Spark / HyPer)</text>
  
    <rect x="675" y="135" width="260" height="235" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="805.0" y="161" fill="#c084fc" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Native Machine Code Generation</text>
    <text x="805.0" y="177" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Compiled Loop in Registers</text>
    <rect x="898" y="145" width="31" height="18" rx="9" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
    <text x="913.5" y="157" fill="#8b5cf6" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">JIT</text>
    <circle cx="691" cy="190" r="2" fill="#8b5cf6"/>
    <text x="699" y="193" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Flattens entire query plan into a single</text>
    <circle cx="691" cy="206" r="2" fill="#8b5cf6"/>
    <text x="699" y="209" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">tight native machine code loop!</text>
    <circle cx="691" cy="222" r="2" fill="#8b5cf6"/>
    <text x="699" y="225" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Values held purely in CPU hardware registers</text>
    <circle cx="691" cy="238" r="2" fill="#8b5cf6"/>
    <text x="699" y="241" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Zero memory buffer allocations between steps</text>
    <circle cx="691" cy="254" r="2" fill="#8b5cf6"/>
    <text x="699" y="257" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Zero virtual function calls anywhere</text>
    <circle cx="691" cy="270" r="2" fill="#8b5cf6"/>
    <text x="699" y="273" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Compiles via LLVM or Java Bytecode (Janino)</text>
    <circle cx="691" cy="286" r="2" fill="#8b5cf6"/>
    <text x="699" y="289" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Approaches hand-written C speed</text>

</svg>