<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="980" height="420" rx="10" fill="url(#bg)"/>
  <text x="490.0" y="36" fill="#f8fafc" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Exponential Backoff with Full Jitter: Eliminating Thundering Herds</text>
  <text x="490.0" y="58" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Mathematical Distribution: Uniform(0, min(MaxSleep, Base * 2^attempt))</text>
  
  
    <rect x="40" y="115" width="230" height="120" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="155.0" y="141" fill="#93c5fd" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">1. HTTP Request Dispatched</text>
    <text x="155.0" y="157" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Ingress Call</text>
    <rect x="191" y="125" width="73" height="18" rx="9" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <text x="227.5" y="137" fill="#3b82f6" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">HTTP CALL</text>
    <circle cx="56" cy="170" r="2" fill="#3b82f6"/>
    <text x="64" y="173" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Worker calls external SaaS API</text>
    <circle cx="56" cy="186" r="2" fill="#3b82f6"/>
    <text x="64" y="189" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Branch A: HTTP 200 OK -&amp;gt; Done</text>
    <circle cx="56" cy="202" r="2" fill="#3b82f6"/>
    <text x="64" y="205" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Branch B: HTTP 429 / 503 -&amp;gt; Retry</text>
    <circle cx="56" cy="218" r="2" fill="#3b82f6"/>
    <text x="64" y="221" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">attempt counter = 1</text>

  
    <rect x="320" y="95" width="330" height="160" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="485.0" y="121" fill="#fde68a" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">2. Exponential Cap Calculation</text>
    <text x="485.0" y="137" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Cap = min(MaxSleep, Base * 2^attempt)</text>
    <rect x="571" y="105" width="73" height="18" rx="9" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="607.5" y="117" fill="#f59e0b" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">CALCULATE</text>
    <circle cx="336" cy="150" r="2" fill="#f59e0b"/>
    <text x="344" y="153" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">If server sent 'Retry-After: 30':</text>
    <circle cx="336" cy="166" r="2" fill="#f59e0b"/>
    <text x="344" y="169" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Direct sleep for 30s + small epsilon.</text>
    <circle cx="336" cy="182" r="2" fill="#f59e0b"/>
    <text x="344" y="185" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Else calculate exponential ceiling:</text>
    <circle cx="336" cy="198" r="2" fill="#f59e0b"/>
    <text x="344" y="201" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Attempt 1: min(60, 1 * 2^1) = 2s</text>
    <circle cx="336" cy="214" r="2" fill="#f59e0b"/>
    <text x="344" y="217" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Attempt 2: min(60, 1 * 2^2) = 4s</text>
    <circle cx="336" cy="230" r="2" fill="#f59e0b"/>
    <text x="344" y="233" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Attempt 3: min(60, 1 * 2^3) = 8s...</text>

  
    <rect x="700" y="95" width="250" height="160" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="825.0" y="121" fill="#6ee7b7" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">3. Full Jitter Randomization</text>
    <text x="825.0" y="137" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Sleep = Uniform(0, Cap)</text>
    <rect x="857" y="105" width="87" height="18" rx="9" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="900.5" y="117" fill="#10b981" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">FULL JITTER</text>
    <circle cx="716" cy="150" r="2" fill="#10b981"/>
    <text x="724" y="153" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">CRITICAL AWS PROOF:</text>
    <circle cx="716" cy="166" r="2" fill="#10b981"/>
    <text x="724" y="169" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Without Jitter: 1,000 workers</text>
    <circle cx="716" cy="182" r="2" fill="#10b981"/>
    <text x="724" y="185" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">retry at exact same second (Thundering Herd)!</text>
    <circle cx="716" cy="198" r="2" fill="#10b981"/>
    <text x="724" y="201" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">With Full Jitter: Sleep duration is</text>
    <circle cx="716" cy="214" r="2" fill="#10b981"/>
    <text x="724" y="217" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">randomized evenly across [0, Cap].</text>
    <circle cx="716" cy="230" r="2" fill="#10b981"/>
    <text x="724" y="233" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Completely flattens retry spikes!</text>

  
    <rect x="320" y="280" width="630" height="110" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="635.0" y="306" fill="#c084fc" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">4. Retry Execution &amp; Budget Control Gate</text>
    <text x="635.0" y="322" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Attempt Increment &amp; Timeout Guard</text>
    <rect x="864" y="290" width="80" height="18" rx="9" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
    <text x="904.0" y="302" fill="#8b5cf6" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">RETRY GATE</text>
    <circle cx="336" cy="335" r="2" fill="#8b5cf6"/>
    <text x="344" y="338" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Worker calls time.sleep(sleep_duration).</text>
    <circle cx="336" cy="351" r="2" fill="#8b5cf6"/>
    <text x="344" y="354" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Increments attempt = attempt + 1.</text>
    <circle cx="336" cy="367" r="2" fill="#8b5cf6"/>
    <text x="344" y="370" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Gate Check: If attempt &amp;lt; MaxRetries (e.g. 5) -&amp;gt; Loops back to HTTP Request Dispatched.</text>
    <circle cx="336" cy="383" r="2" fill="#8b5cf6"/>
    <text x="344" y="386" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">If attempt &amp;gt;= MaxRetries -&amp;gt; Raises MaxRetryTimeoutException and alerts on-call!</text>

  
    <line x1="270" y1="175" x2="320" y2="175" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-a)"/><text x="295.0" y="167.0" fill="#f59e0b" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">429 Throttled</text>
  
    <line x1="650" y1="175" x2="700" y2="175" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/><text x="675.0" y="167.0" fill="#10b981" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Randomize</text>
  
    <line x1="825" y1="255" x2="825" y2="280" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arr-p)"/>
  
    <polyline points="320,335 155,335 155,235" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr-b)"/><text x="230" y="320" fill="#3b82f6" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Retry Request</text>

</svg>