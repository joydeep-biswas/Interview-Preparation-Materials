      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="980" height="420" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="490.0" y="36" fill="#f8fafc" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Buffer Pool Management &amp; Page Eviction Architecture</text>
  <text x="490.0" y="58" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Page Hash Table Lookup, Cache Hits vs. Misses, and Clock Sweep Frame Replacement</text>
  
  
    <rect x="40" y="110" width="210" height="140" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="145.0" y="136" fill="#93c5fd" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Query Engine Request</text>
    <text x="145.0" y="152" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Read Logical Page</text>
    <rect x="199" y="120" width="45" height="18" rx="9" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <text x="221.5" y="132" fill="#3b82f6" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">QUERY</text>
    <circle cx="56" cy="165" r="2" fill="#3b82f6"/>
    <text x="64" y="168" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Query executes:</text>
    <circle cx="56" cy="181" r="2" fill="#3b82f6"/>
    <text x="64" y="184" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Requests: PageID #4096</text>
    <circle cx="56" cy="197" r="2" fill="#3b82f6"/>
    <text x="64" y="200" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">PinCount incremented</text>
    <circle cx="56" cy="213" r="2" fill="#3b82f6"/>
    <text x="64" y="216" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Locks page latch in shared mode</text>
    <circle cx="56" cy="229" r="2" fill="#3b82f6"/>
    <text x="64" y="232" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Zero disk I/O if in RAM</text>

  
    <rect x="290" y="110" width="220" height="140" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="400.0" y="136" fill="#c084fc" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Page Hash Table</text>
    <text x="400.0" y="152" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">RAM Address Directory</text>
    <rect x="438" y="120" width="66" height="18" rx="9" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
    <text x="471.0" y="132" fill="#8b5cf6" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">HASH MAP</text>
    <circle cx="306" cy="165" r="2" fill="#8b5cf6"/>
    <text x="314" y="168" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Hash Table maps:</text>
    <circle cx="306" cy="181" r="2" fill="#8b5cf6"/>
    <text x="314" y="184" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">PageID #4096 -&amp;gt; FrameID #14</text>
    <circle cx="306" cy="197" r="2" fill="#8b5cf6"/>
    <text x="314" y="200" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Fast O(1) in-memory probe</text>
    <circle cx="306" cy="213" r="2" fill="#8b5cf6"/>
    <text x="314" y="216" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Branch A: Cache HIT</text>
    <circle cx="306" cy="229" r="2" fill="#8b5cf6"/>
    <text x="314" y="232" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Branch B: Cache MISS</text>

  
    <rect x="550" y="110" width="180" height="140" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="564" y="136" fill="#fca5a5" font-size="11.5" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="start">Clock Sweep Evict</text>
    <text x="564" y="152" fill="#94a3b8" font-size="9.5" font-family="system-ui, sans-serif" text-anchor="start">Second-Chance Eviction</text>
    <rect x="665" y="120" width="59" height="18" rx="9" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
    <text x="694.5" y="132" fill="#ef4444" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">EVICTOR</text>
    <circle cx="566" cy="165" r="2" fill="#ef4444"/>
    <text x="574" y="168" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Scans circular frames</text>
    <circle cx="566" cy="181" r="2" fill="#ef4444"/>
    <text x="574" y="184" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">If UsageCount == 1: Set to 0</text>
    <circle cx="566" cy="197" r="2" fill="#ef4444"/>
    <text x="574" y="200" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">If UsageCount == 0 &amp; Pin==0:</text>
    <circle cx="566" cy="213" r="2" fill="#ef4444"/>
    <text x="574" y="216" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Select as Victim Frame!</text>
    <circle cx="566" cy="229" r="2" fill="#ef4444"/>
    <text x="574" y="232" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Flushes if dirty before swap</text>

  
    <rect x="770" y="110" width="175" height="140" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="857.5" y="136" fill="#fde68a" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Disk Subsystem</text>
    <text x="857.5" y="152" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">NVMe SSD Storage</text>
    <rect x="901" y="120" width="38" height="18" rx="9" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="920.0" y="132" fill="#f59e0b" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">DISK</text>
    <circle cx="786" cy="165" r="2" fill="#f59e0b"/>
    <text x="794" y="168" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Reads Page #4096 off disk</text>
    <circle cx="786" cy="181" r="2" fill="#f59e0b"/>
    <text x="794" y="184" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Issues 8KB POSIX pread()</text>
    <circle cx="786" cy="197" r="2" fill="#f59e0b"/>
    <text x="794" y="200" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Loads raw bytes into</text>
    <circle cx="786" cy="213" r="2" fill="#f59e0b"/>
    <text x="794" y="216" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">allocated Victim Frame #14</text>

  
    <rect x="40" y="280" width="905" height="115" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="492.5" y="306" fill="#6ee7b7" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Buffer Pool Frame Array (Physical RAM Memory)</text>
    <text x="492.5" y="322" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">64 GB Dedicated Shared Buffer Pool Frames</text>
    <rect x="859" y="290" width="80" height="18" rx="9" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="899.0" y="302" fill="#10b981" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">RAM FRAMES</text>
    <circle cx="56" cy="335" r="2" fill="#10b981"/>
    <text x="64" y="338" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Frame 0 [Page #102: Pin=1] | Frame 1 [Page #9041: Pin=0, Dirty] | Frame 2 [Page #304: Pin=2] | ... | Frame 14 [Page #4096: Pin=1]</text>
    <circle cx="56" cy="351" r="2" fill="#10b981"/>
    <text x="64" y="354" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Clock Hand sweeps frames circularly. Hot pages with high usage bits survive eviction; cold pages are unpinned and evicted smoothly without latency spikes.</text>

  
    <line x1="250" y1="180" x2="290" y2="180" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr-b)"/><text x="270.0" y="172.0" fill="#3b82f6" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Probe Page</text>
  
    <line x1="400" y1="250" x2="400" y2="280" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/><text x="400.0" y="257.0" fill="#10b981" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Cache HIT: Direct RAM</text>
  
    <line x1="510" y1="180" x2="550" y2="180" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr-r)"/><text x="530.0" y="172.0" fill="#ef4444" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Cache MISS</text>
  
    <line x1="730" y1="185" x2="770" y2="185" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-a)"/><text x="750.0" y="172" fill="#f59e0b" font-size="8.5" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Evict &amp;</text><text x="750.0" y="181" fill="#f59e0b" font-size="8.5" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Read</text>
  
    <line x1="855" y1="250" x2="855" y2="280" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/><text x="855.0" y="257.0" fill="#10b981" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Populate Frame</text>

</svg>