<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="980" height="420" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="490.0" y="36" fill="#f8fafc" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Circuit Breaker Design Pattern for Upstream Fault Isolation</text>
  <text x="490.0" y="58" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Closed (Normal), Open (Fail-Fast), and Half-Open (Canary Recovery Probe) States</text>
  
  
    <rect x="40" y="140" width="240" height="160" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="160.0" y="166" fill="#6ee7b7" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">CLOSED</text>
    <text x="160.0" y="182" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Normal Operation</text>
    <rect x="215" y="150" width="59" height="18" rx="9" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="244.5" y="162" fill="#10b981" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">HEALTHY</text>
    <circle cx="56" cy="195" r="2" fill="#10b981"/>
    <text x="64" y="198" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">State: CLOSED</text>
    <circle cx="56" cy="211" r="2" fill="#10b981"/>
    <text x="64" y="214" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">All requests forwarded to upstream SaaS API.</text>
    <circle cx="56" cy="227" r="2" fill="#10b981"/>
    <text x="64" y="230" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Monitors rolling failure rate (60s window).</text>
    <circle cx="56" cy="243" r="2" fill="#10b981"/>
    <text x="64" y="246" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">If failure rate &amp;gt; 50%:</text>
    <circle cx="56" cy="259" r="2" fill="#10b981"/>
    <text x="64" y="262" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Trips Circuit Breaker to OPEN!</text>

  
    <rect x="370" y="110" width="260" height="220" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="500.0" y="136" fill="#fca5a5" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">OPEN</text>
    <text x="500.0" y="152" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Fail-Fast Protection</text>
    <rect x="551" y="120" width="73" height="18" rx="9" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
    <text x="587.5" y="132" fill="#ef4444" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">FAIL-FAST</text>
    <circle cx="386" cy="165" r="2" fill="#ef4444"/>
    <text x="394" y="168" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">State: OPEN</text>
    <circle cx="386" cy="181" r="2" fill="#ef4444"/>
    <text x="394" y="184" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Upstream is experiencing an outage.</text>
    <circle cx="386" cy="197" r="2" fill="#ef4444"/>
    <text x="394" y="200" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Fail-fast immediately in 1 microsecond!</text>
    <circle cx="386" cy="213" r="2" fill="#ef4444"/>
    <text x="394" y="216" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Zero outgoing HTTP network requests sent.</text>
    <circle cx="386" cy="229" r="2" fill="#ef4444"/>
    <text x="394" y="232" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Prevents thread exhaustion in caller.</text>
    <circle cx="386" cy="245" r="2" fill="#ef4444"/>
    <text x="394" y="248" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Starts Sleep Window Timer (e.g. 60s).</text>
    <circle cx="386" cy="261" r="2" fill="#ef4444"/>
    <text x="394" y="264" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">When timer expires: Transitions to HALF-OPEN!</text>

  
    <rect x="710" y="140" width="230" height="160" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="825.0" y="166" fill="#fde68a" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">HALF-OPEN</text>
    <text x="825.0" y="182" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Canary Trial Probe</text>
    <rect x="882" y="150" width="52" height="18" rx="9" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="908.0" y="162" fill="#f59e0b" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">CANARY</text>
    <circle cx="726" cy="195" r="2" fill="#f59e0b"/>
    <text x="734" y="198" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">State: HALF-OPEN</text>
    <circle cx="726" cy="211" r="2" fill="#f59e0b"/>
    <text x="734" y="214" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Sends a single trial canary request.</text>
    <circle cx="726" cy="227" r="2" fill="#f59e0b"/>
    <text x="734" y="230" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Canary succeeds &#x2192; Reset CLOSED</text>
    <circle cx="726" cy="243" r="2" fill="#f59e0b"/>
    <text x="734" y="246" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Canary fails &#x2192; Trip OPEN</text>

  
    <line x1="280" y1="190" x2="370" y2="190" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr-r)"/><text x="325.0" y="182.0" fill="#ef4444" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Failures &gt; 50% (60s)</text>
  
    <line x1="630" y1="190" x2="710" y2="190" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-a)"/><text x="670.0" y="182.0" fill="#f59e0b" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Sleep Window (60s) Expires</text>
  
    <polyline points="825,300 825,350 160,350 160,300" fill="none" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/><text x="490" y="365" fill="#10b981" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Canary Probe Succeeds -&gt; Reset Circuit</text>
  
    <polyline points="750,140 750,95 500,95 500,110" fill="none" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr-r)" stroke-dasharray="4,4"/><text x="625" y="85" fill="#ef4444" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Canary Fails</text>

</svg>