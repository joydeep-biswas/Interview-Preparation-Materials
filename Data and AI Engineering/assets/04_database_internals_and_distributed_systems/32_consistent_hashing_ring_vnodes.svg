    <rect x="520" y="95" width="430" height="290" rx="10" fill="#06231a" stroke="#10b981" stroke-width="1.5"/>
    <text x="536" y="117" fill="#6ee7b7" font-size="12" font-family="system-ui, sans-serif" font-weight="bold">Virtual Nodes (V-Nodes): Hotspot Elimination</text>
  
    <rect x="535" y="135" width="400" height="120" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="735.0" y="161" fill="#6ee7b7" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Why Raw Consistent Hashing Causes Hotspots</text>
    <text x="735.0" y="177" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Non-Uniform Key Distribution</text>
    <rect x="870" y="145" width="59" height="18" rx="9" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="899.5" y="157" fill="#10b981" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">V-NODES</text>
    <circle cx="551" cy="190" r="2" fill="#10b981"/>
    <text x="559" y="193" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">With only 3 physical nodes, token ranges are unevenly spaced.</text>
    <circle cx="551" cy="206" r="2" fill="#10b981"/>
    <text x="559" y="209" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">One server might own 70% of the token circumference!</text>
    <circle cx="551" cy="222" r="2" fill="#10b981"/>
    <text x="559" y="225" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Solution: Virtual Nodes (V-Nodes)!</text>
    <circle cx="551" cy="238" r="2" fill="#10b981"/>
    <text x="559" y="241" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">256 vnodes per physical node distributed across ring.</text>
    <circle cx="551" cy="254" r="2" fill="#10b981"/>
    <text x="559" y="257" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Guarantees near-perfect 33.3% load distribution across all servers.</text>
  
    <rect x="535" y="265" width="400" height="95" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="549" y="289" fill="#fde68a" font-size="11.5" font-family="system-ui, sans-serif" font-weight="bold">Node Addition / Removal Invariant</text>
    <text x="549" y="305" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">Zero Global Rehash (1/N Migration)</text>
    <rect x="828" y="275" width="101" height="18" rx="9" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="878.5" y="287" fill="#f59e0b" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">1/N REBALANCE</text>
    <circle cx="551" cy="320" r="2" fill="#f59e0b"/>
    <text x="559" y="323" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Adding Server D only takes keys from its immediate clockwise neighbors.</text>
    <circle cx="551" cy="336" r="2" fill="#f59e0b"/>
    <text x="559" y="339" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Exactly 1/N keys migrate over the network!</text>
    <circle cx="551" cy="352" r="2" fill="#f59e0b"/>
    <text x="559" y="355" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Zero cache storms; 99% of keys remain completely stationary.</text>

