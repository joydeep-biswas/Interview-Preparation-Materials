  <text x="245" y="325" fill="#10b981" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Key 'user_8412' (Hash: 1.45M) -&gt; Walks Clockwise -&gt; Assigned to Node B!</text>
