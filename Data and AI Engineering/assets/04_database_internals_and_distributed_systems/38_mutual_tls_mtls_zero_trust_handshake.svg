<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="980" height="420" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="490.0" y="34" fill="#f8fafc" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Mutual TLS (mTLS) for Zero Trust Pipeline Ingress</text>
  <text x="490.0" y="54" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Cryptographic Bidirectional Identity Verification via Corporate Certificate Authority (CA)</text>
  
  <!-- Root CA Anchor (Top Center) -->
  <rect x="310" y="75" width="360" height="110" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="490.0" y="98" fill="#c084fc" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Corporate Root CA (Trust Anchor)</text>
  <text x="490.0" y="114" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">X.509 PKI Authority</text>
  <circle cx="326" cy="132" r="2" fill="#8b5cf6"/>
  <text x="334" y="135" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Issues Server X.509 Cert with SAN &amp; Public Key</text>
  <circle cx="326" cy="148" r="2" fill="#8b5cf6"/>
  <text x="334" y="151" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Issues Client X.509 Cert with SPIFFE/SAN Identity</text>
  <circle cx="326" cy="164" r="2" fill="#8b5cf6"/>
  <text x="334" y="167" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Both peers independently verify signatures against this root</text>

  <!-- CA Distribution Conduits -->
  <path d="M 330 185 C 240 195, 175 195, 165 210" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr-p)"/>
  <text x="220" y="196" fill="#8b5cf6" font-size="9" font-family="system-ui, sans-serif" font-weight="bold">Issues Cert</text>

  <path d="M 650 185 C 740 195, 805 195, 815 210" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr-p)"/>
  <text x="735" y="196" fill="#8b5cf6" font-size="9" font-family="system-ui, sans-serif" font-weight="bold">Issues Cert</text>

  <!-- 1. Client Peer -->
  <rect x="40" y="215" width="250" height="150" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="165.0" y="238" fill="#93c5fd" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">1. Pipeline Worker (Client)</text>
  <text x="165.0" y="254" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Identity: worker.data.internal</text>
  <circle cx="56" cy="272" r="2" fill="#3b82f6"/>
  <text x="64" y="275" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Private key loaded in HSM/Vault</text>
  <circle cx="56" cy="289" r="2" fill="#3b82f6"/>
  <text x="64" y="292" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">1. Sends ClientHello (TLS ciphers)</text>
  <circle cx="56" cy="306" r="2" fill="#3b82f6"/>
  <text x="64" y="309" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">3. Verifies Server Certificate against CA</text>
  <circle cx="56" cy="323" r="2" fill="#3b82f6"/>
  <text x="64" y="326" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">4. Signs handshake hash with private key</text>
  <circle cx="56" cy="340" r="2" fill="#3b82f6"/>
  <text x="64" y="343" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Establishes AES-256-GCM session tunnel</text>

  <!-- 2. Server Gateway Peer -->
  <rect x="690" y="215" width="250" height="150" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="815.0" y="238" fill="#6ee7b7" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">2. Ingress Gateway (Server)</text>
  <text x="815.0" y="254" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Identity: ingress.prod.internal</text>
  <circle cx="706" cy="272" r="2" fill="#10b981"/>
  <text x="714" y="275" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Has server certificate from CA</text>
  <circle cx="706" cy="289" r="2" fill="#10b981"/>
  <text x="714" y="292" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">2. Sends ServerHello + Server Cert</text>
  <circle cx="706" cy="306" r="2" fill="#10b981"/>
  <text x="714" y="309" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Demands CertificateRequest from client</text>
  <circle cx="706" cy="323" r="2" fill="#10b981"/>
  <text x="714" y="326" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">5. Validates client cert + digital signature</text>
  <circle cx="706" cy="340" r="2" fill="#10b981"/>
  <text x="714" y="343" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Rejects connection if cert is invalid/untrusted</text>

  <!-- mTLS Handshake Arrows Across Clean Runway -->
  <line x1="290" y1="250" x2="690" y2="250" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr-b)"/>
  <text x="490.0" y="244.0" fill="#3b82f6" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">1. ClientHello (Cipher Suites, TLS 1.3)</text>

  <line x1="690" y1="278" x2="290" y2="278" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="490.0" y="272.0" fill="#10b981" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">2. ServerHello + Server X.509 Certificate</text>

  <line x1="690" y1="306" x2="290" y2="306" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arr-p)"/>
  <text x="490.0" y="300.0" fill="#8b5cf6" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">3. CertificateRequest (Demands Client Identity)</text>

  <line x1="290" y1="334" x2="690" y2="334" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr-b)"/>
  <text x="490.0" y="328.0" fill="#3b82f6" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">4. Client Cert + CertificateVerify (RSA Signature)</text>

  <!-- Bottom Security Banner -->
  <text x="490" y="392" fill="#10b981" font-size="11.5" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Mutual Cryptographic Trust Established: 100% End-to-End Encrypted Zero Trust Transit</text>

</svg>