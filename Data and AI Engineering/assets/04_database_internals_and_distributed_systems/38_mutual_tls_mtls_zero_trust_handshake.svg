<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="980" height="420" rx="10" fill="url(#bg)"/>
  <text x="490.0" y="36" fill="#f8fafc" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Mutual TLS (mTLS) for Zero Trust Pipeline Ingress</text>
  <text x="490.0" y="58" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Cryptographic Bidirectional Identity Verification via Corporate Certificate Authority (CA)</text>
  
  
    <rect x="40" y="110" width="220" height="200" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="150.0" y="136" fill="#93c5fd" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">1. Pipeline Worker</text>
    <text x="150.0" y="152" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Client Identity</text>
    <rect x="202" y="120" width="52" height="18" rx="9" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <text x="228.0" y="132" fill="#3b82f6" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">CLIENT</text>
    <circle cx="56" cy="165" r="2" fill="#3b82f6"/>
    <text x="64" y="168" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Has client X.509 certificate</text>
    <circle cx="56" cy="181" r="2" fill="#3b82f6"/>
    <text x="64" y="184" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Signed by Corporate Root CA</text>
    <circle cx="56" cy="197" r="2" fill="#3b82f6"/>
    <text x="64" y="200" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Private key in HSM/Vault</text>
    <circle cx="56" cy="213" r="2" fill="#3b82f6"/>
    <text x="64" y="216" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">1. Sends ClientHello (ciphers)</text>
    <circle cx="56" cy="229" r="2" fill="#3b82f6"/>
    <text x="64" y="232" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">3. Verifies Server Certificate</text>
    <circle cx="56" cy="245" r="2" fill="#3b82f6"/>
    <text x="64" y="248" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">5. Sends Client Cert + Signature</text>
    <circle cx="56" cy="261" r="2" fill="#3b82f6"/>
    <text x="64" y="264" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Encrypted AES-256-GCM tunnel</text>

  
    <rect x="360" y="110" width="260" height="200" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="490.0" y="136" fill="#c084fc" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Corporate Root CA Root</text>
    <text x="490.0" y="152" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Trust Anchor</text>
    <rect x="555" y="120" width="59" height="18" rx="9" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
    <text x="584.5" y="132" fill="#8b5cf6" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">ROOT CA</text>
    <circle cx="376" cy="165" r="2" fill="#8b5cf6"/>
    <text x="384" y="168" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Issues Server Certificate</text>
    <circle cx="376" cy="181" r="2" fill="#8b5cf6"/>
    <text x="384" y="184" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Issues Client Certificate</text>
    <circle cx="376" cy="197" r="2" fill="#8b5cf6"/>
    <text x="384" y="200" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Both parties verify digital signatures</text>
    <circle cx="376" cy="213" r="2" fill="#8b5cf6"/>
    <text x="384" y="216" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">against the exact same Root CA!</text>
    <circle cx="376" cy="229" r="2" fill="#8b5cf6"/>
    <text x="384" y="232" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Zero pre-shared API keys or passwords</text>
    <circle cx="376" cy="245" r="2" fill="#8b5cf6"/>
    <text x="384" y="248" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Immune to Man-in-the-Middle attacks</text>

  
    <rect x="720" y="110" width="220" height="200" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="830.0" y="136" fill="#6ee7b7" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">2. Ingress Gateway</text>
    <text x="830.0" y="152" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Envoy / Istio Sidecar</text>
    <rect x="826" y="120" width="108" height="18" rx="9" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="880.0" y="132" fill="#10b981" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">SERVER GATEWAY</text>
    <circle cx="736" cy="165" r="2" fill="#10b981"/>
    <text x="744" y="168" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Has server X.509 certificate</text>
    <circle cx="736" cy="181" r="2" fill="#10b981"/>
    <text x="744" y="184" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Signed by Corporate Root CA</text>
    <circle cx="736" cy="197" r="2" fill="#10b981"/>
    <text x="744" y="200" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">2. Sends ServerHello + Server Cert</text>
    <circle cx="736" cy="213" r="2" fill="#10b981"/>
    <text x="744" y="216" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">4. Sends CertificateRequest</text>
    <circle cx="736" cy="229" r="2" fill="#10b981"/>
    <text x="744" y="232" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">6. Verifies Client Cert against CA</text>
    <circle cx="736" cy="245" r="2" fill="#10b981"/>
    <text x="744" y="248" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Rejects connection if untrusted!</text>

  
    <line x1="260" y1="150" x2="720" y2="150" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr-b)"/><text x="490.0" y="142.0" fill="#3b82f6" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">1. ClientHello</text>
  
    <line x1="720" y1="190" x2="260" y2="190" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/><text x="490.0" y="182.0" fill="#10b981" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">2. ServerHello + Server Cert</text>
  
    <line x1="720" y1="230" x2="260" y2="230" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arr-p)"/><text x="490.0" y="222.0" fill="#8b5cf6" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">4. CertificateRequest (Demands Client Identity)</text>
  
    <line x1="260" y1="270" x2="720" y2="270" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr-b)"/><text x="490.0" y="262.0" fill="#3b82f6" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">5. Client Cert + RSA Signature</text>

  <text x="490" y="355" fill="#10b981" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Mutual Cryptographic Trust Established: Traffic is 100% end-to-end encrypted with Zero Trust verification</text>

</svg>