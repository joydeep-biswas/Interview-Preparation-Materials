<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="980" height="420" rx="10" fill="url(#bg)"/>
  <text x="490.0" y="36" fill="#f8fafc" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Real-Time API Paradigms: Webhooks vs. Polling vs. SSE vs. WebSockets</text>
  <text x="490.0" y="58" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Comparing Event Push, Held-Open Pulls, Unidirectional Streams, and Bidirectional TCP</text>
  
  
    <rect x="30" y="95" width="215" height="290" rx="10" fill="#0b1329" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="46" y="117" fill="#93c5fd" font-size="12" font-family="system-ui, sans-serif" font-weight="bold">1. Webhooks (Push)</text>
  
    <rect x="45" y="140" width="185" height="220" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="137.5" y="166" fill="#93c5fd" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Reverse API Push</text>
    <text x="137.5" y="182" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Producer -&gt; Consumer</text>
    <rect x="165" y="150" width="59" height="18" rx="9" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <text x="194.5" y="162" fill="#3b82f6" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">WEBHOOK</text>
    <circle cx="61" cy="195" r="2" fill="#3b82f6"/>
    <text x="69" y="198" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Server calls client webhook:</text>
    <circle cx="61" cy="211" r="2" fill="#3b82f6"/>
    <text x="69" y="214" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">POST /webhook on event</text>
    <circle cx="61" cy="227" r="2" fill="#3b82f6"/>
    <text x="69" y="230" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Zero polling overhead</text>
    <circle cx="61" cy="243" r="2" fill="#3b82f6"/>
    <text x="69" y="246" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Requires public HTTPS URL</text>
    <circle cx="61" cy="259" r="2" fill="#3b82f6"/>
    <text x="69" y="262" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Requires retry backoff</text>
    <circle cx="61" cy="275" r="2" fill="#3b82f6"/>
    <text x="69" y="278" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Signature: HMAC-SHA256</text>
    <circle cx="61" cy="291" r="2" fill="#3b82f6"/>
    <text x="69" y="294" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Ideal for Stripe / GitHub</text>

  
    <rect x="265" y="95" width="215" height="290" rx="10" fill="#1c0d2e" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="281" y="117" fill="#c084fc" font-size="12" font-family="system-ui, sans-serif" font-weight="bold">2. Long Polling</text>
  
    <rect x="280" y="140" width="185" height="220" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="372.5" y="166" fill="#c084fc" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Held-Open HTTP Pull</text>
    <text x="372.5" y="182" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Client -&gt; Server Wait</text>
    <rect x="386" y="150" width="73" height="18" rx="9" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
    <text x="422.5" y="162" fill="#8b5cf6" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">LONG POLL</text>
    <circle cx="296" cy="195" r="2" fill="#8b5cf6"/>
    <text x="304" y="198" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Client: GET /events</text>
    <circle cx="296" cy="211" r="2" fill="#8b5cf6"/>
    <text x="304" y="214" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Server holds socket open</text>
    <circle cx="296" cy="227" r="2" fill="#8b5cf6"/>
    <text x="304" y="230" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Responds when event fires</text>
    <circle cx="296" cy="243" r="2" fill="#8b5cf6"/>
    <text x="304" y="246" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">or timeout occurs (30s)</text>
    <circle cx="296" cy="259" r="2" fill="#8b5cf6"/>
    <text x="304" y="262" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Client immediately re-polls</text>
    <circle cx="296" cy="275" r="2" fill="#8b5cf6"/>
    <text x="304" y="278" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Works through strict firewalls</text>
    <circle cx="296" cy="291" r="2" fill="#8b5cf6"/>
    <text x="304" y="294" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">High HTTP header overhead</text>

  
    <rect x="500" y="95" width="215" height="290" rx="10" fill="#06231a" stroke="#10b981" stroke-width="1.5"/>
    <text x="516" y="117" fill="#6ee7b7" font-size="12" font-family="system-ui, sans-serif" font-weight="bold">3. SSE (HTTP Stream)</text>
  
    <rect x="515" y="140" width="185" height="220" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="607.5" y="166" fill="#6ee7b7" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Server-Sent Events</text>
    <text x="607.5" y="182" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Persistent HTTP GET Stream</text>
    <rect x="663" y="150" width="31" height="18" rx="9" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="678.5" y="162" fill="#10b981" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">SSE</text>
    <circle cx="531" cy="195" r="2" fill="#10b981"/>
    <text x="539" y="198" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">GET (Accept: text/event-stream)</text>
    <circle cx="531" cy="211" r="2" fill="#10b981"/>
    <text x="539" y="214" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Server streams chunks:</text>
    <circle cx="531" cy="227" r="2" fill="#10b981"/>
    <text x="539" y="230" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">data: { 'price': 104.5 }</text>
    <circle cx="531" cy="243" r="2" fill="#10b981"/>
    <text x="539" y="246" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Unidirectional: Server -&amp;gt; Client</text>
    <circle cx="531" cy="259" r="2" fill="#10b981"/>
    <text x="539" y="262" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Automatic browser reconnect</text>
    <circle cx="531" cy="275" r="2" fill="#10b981"/>
    <text x="539" y="278" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">HTTP/2 multiplexing ready</text>
    <circle cx="531" cy="291" r="2" fill="#10b981"/>
    <text x="539" y="294" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Ideal for LLM token streaming</text>

  
    <rect x="735" y="95" width="215" height="290" rx="10" fill="#291b05" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="751" y="117" fill="#fde68a" font-size="12" font-family="system-ui, sans-serif" font-weight="bold">4. WebSockets</text>
  
    <rect x="750" y="140" width="185" height="220" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="842.5" y="166" fill="#fde68a" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Full-Duplex TCP</text>
    <text x="842.5" y="182" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Bidirectional Socket</text>
    <rect x="856" y="150" width="73" height="18" rx="9" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="892.5" y="162" fill="#f59e0b" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">WEBSOCKET</text>
    <circle cx="766" cy="195" r="2" fill="#f59e0b"/>
    <text x="774" y="198" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Upgrades HTTP &#x2192; ws://</text>
    <circle cx="766" cy="211" r="2" fill="#f59e0b"/>
    <text x="774" y="214" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Bi-directional binary/text frames</text>
    <circle cx="766" cy="227" r="2" fill="#f59e0b"/>
    <text x="774" y="230" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Sub-millisecond real-time SLA</text>
    <circle cx="766" cy="243" r="2" fill="#f59e0b"/>
    <text x="774" y="246" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Lowest packet header overhead (2B)</text>
    <circle cx="766" cy="259" r="2" fill="#f59e0b"/>
    <text x="774" y="262" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Requires dedicated stateful servers</text>
    <circle cx="766" cy="275" r="2" fill="#f59e0b"/>
    <text x="774" y="278" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Ideal for gaming &amp;amp; order books</text>

</svg>