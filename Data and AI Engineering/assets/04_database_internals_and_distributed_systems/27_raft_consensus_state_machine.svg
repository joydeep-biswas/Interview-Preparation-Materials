<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="980" height="420" rx="10" fill="url(#bg)"/>
  <text x="490.0" y="36" fill="#f8fafc" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Raft Distributed Consensus State Machine</text>
  <text x="490.0" y="58" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Leader Election, Term Numbers, Heartbeat Leases, and Majority Vote Quorums</text>
  
  
    <rect x="40" y="140" width="230" height="170" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="155.0" y="166" fill="#93c5fd" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Follower</text>
    <text x="155.0" y="182" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Passive Replicated State</text>
    <rect x="198" y="150" width="66" height="18" rx="9" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <text x="231.0" y="162" fill="#3b82f6" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">FOLLOWER</text>
    <circle cx="56" cy="195" r="2" fill="#3b82f6"/>
    <text x="64" y="198" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Responds to incoming RPCs</text>
    <circle cx="56" cy="211" r="2" fill="#3b82f6"/>
    <text x="64" y="214" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Accepts AppendEntries from Leader</text>
    <circle cx="56" cy="227" r="2" fill="#3b82f6"/>
    <text x="64" y="230" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Maintains Election Timer (150-300ms)</text>
    <circle cx="56" cy="243" r="2" fill="#3b82f6"/>
    <text x="64" y="246" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Resets timer on valid heartbeat</text>
    <circle cx="56" cy="259" r="2" fill="#3b82f6"/>
    <text x="64" y="262" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">If timer expires: Becomes Candidate!</text>

  
    <rect x="370" y="110" width="250" height="220" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="495.0" y="136" fill="#fde68a" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Candidate</text>
    <text x="495.0" y="152" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Election Campaign</text>
    <rect x="541" y="120" width="73" height="18" rx="9" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="577.5" y="132" fill="#f59e0b" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">CANDIDATE</text>
    <circle cx="386" cy="165" r="2" fill="#f59e0b"/>
    <text x="394" y="168" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Increments Term Number: Term = T + 1</text>
    <circle cx="386" cy="181" r="2" fill="#f59e0b"/>
    <text x="394" y="184" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Votes for itself</text>
    <circle cx="386" cy="197" r="2" fill="#f59e0b"/>
    <text x="394" y="200" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Broadcasts RequestVote RPC to all nodes</text>
    <circle cx="386" cy="213" r="2" fill="#f59e0b"/>
    <text x="394" y="216" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Branch A: &amp;gt; N/2 votes &#x2192; LEADER!</text>
    <circle cx="386" cy="229" r="2" fill="#f59e0b"/>
    <text x="394" y="232" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Branch B: Higher Term &#x2192; Step Down</text>
    <circle cx="386" cy="245" r="2" fill="#f59e0b"/>
    <text x="394" y="248" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Branch C: Split vote / timeout -&amp;gt; Restarts</text>

  
    <rect x="710" y="140" width="230" height="170" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="825.0" y="166" fill="#6ee7b7" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Leader</text>
    <text x="825.0" y="182" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Cluster Coordinator</text>
    <rect x="882" y="150" width="52" height="18" rx="9" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="908.0" y="162" fill="#10b981" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">LEADER</text>
    <circle cx="726" cy="195" r="2" fill="#10b981"/>
    <text x="734" y="198" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Handles all client writes</text>
    <circle cx="726" cy="211" r="2" fill="#10b981"/>
    <text x="734" y="214" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Appends entries to replicated log</text>
    <circle cx="726" cy="227" r="2" fill="#10b981"/>
    <text x="734" y="230" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Sends periodic heartbeat AppendEntries</text>
    <circle cx="726" cy="243" r="2" fill="#10b981"/>
    <text x="734" y="246" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Commits entries once stored on majority</text>
    <circle cx="726" cy="259" r="2" fill="#10b981"/>
    <text x="734" y="262" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">If higher term discovered: Steps down!</text>

  
    <line x1="270" y1="205" x2="370" y2="205" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-a)"/><text x="320.0" y="197.0" fill="#f59e0b" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Election Timeout (150-300ms)</text>
  
    <line x1="620" y1="205" x2="710" y2="205" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/><text x="665.0" y="197.0" fill="#10b981" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Majority (&gt;N/2) Won</text>
  
    <polyline points="825,310 825,350 155,350 155,310" fill="none" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr-r)"/><text x="490" y="365" fill="#ef4444" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Discovers Node with Higher Term -&gt; Step Down</text>

</svg>