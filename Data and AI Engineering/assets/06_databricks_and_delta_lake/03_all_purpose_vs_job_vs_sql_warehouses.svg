<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1120" height="520" rx="10" fill="url(#bg)"/>
  <rect width="1120" height="520" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="560" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">Databricks Compute Types: All-Purpose vs Job vs SQL Warehouses</text>
  <text x="560" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">Architectural comparison, cost economics (DBU pricing), and workload suitability matrix</text>

  <!-- Column 1: All-Purpose Compute -->
  <rect x="40" y="85" width="330" height="385" rx="8" fill="#1E293B" fill-opacity="0.6" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="40" y="85" width="330" height="40" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="205" y="105" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle">1. ALL-PURPOSE COMPUTE</text>
  <text x="205" y="119" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Interactive Data Science &amp; Prototyping</text>

  <!-- Usage Box -->
  <rect x="55" y="140" width="300" height="85" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="70" y="160" font-size="11" font-weight="700" fill="#F8FAFC" text-anchor="start">Primary Workloads</text>
  <text x="70" y="177" font-size="10" fill="#CBD5E1" text-anchor="start">• Ad-hoc data exploration in Notebooks</text>
  <text x="70" y="192" font-size="10" fill="#CBD5E1" text-anchor="start">• Multiple engineers sharing 1 cluster</text>
  <text x="70" y="207" font-size="10" fill="#CBD5E1" text-anchor="start">• Real-time visual plotting &amp; debugging</text>

  <!-- Economics Box -->
  <rect x="55" y="235" width="300" height="85" rx="6" fill="#450A0A" fill-opacity="0.2" stroke="#EF4444" stroke-width="1"/>
  <text x="70" y="255" font-size="11" font-weight="700" fill="#F87171" text-anchor="start">Cost &amp; Pricing Model</text>
  <text x="70" y="272" font-size="10" fill="#CBD5E1" text-anchor="start">• <tspan fill="#EF4444" font-weight="700">Highest DBU Cost:</tspan> ~0.40 - 0.55 DBU / hour</text>
  <text x="70" y="287" font-size="10" fill="#CBD5E1" text-anchor="start">• Persistent: stays running until manual stop</text>
  <text x="70" y="302" font-size="10" fill="#F87171" text-anchor="start">• Wasted spend if auto-termination is slow</text>

  <!-- Rule Box -->
  <rect x="55" y="330" width="300" height="125" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
  <text x="70" y="350" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="start">Best Practice Guidance</text>
  <text x="70" y="370" font-size="10" fill="#F8FAFC" text-anchor="start">✔ Set auto-terminate to 20-30 mins</text>
  <text x="70" y="388" font-size="10" fill="#F8FAFC" text-anchor="start">✔ Enable Single-User or Shared Access</text>
  <text x="70" y="406" font-size="10" font-weight="700" fill="#EF4444" text-anchor="start">✖ NEVER run production jobs on All-Purpose!</text>
  <text x="70" y="428" font-size="9.5" fill="#94A3B8" text-anchor="start">Costs 2x more than Job clusters for identical work.</text>

  <!-- Column 2: Job Compute -->
  <rect x="395" y="85" width="330" height="385" rx="8" fill="#064E3B" fill-opacity="0.2" stroke="#34D399" stroke-width="1.5"/>
  <rect x="395" y="85" width="330" height="40" rx="8" fill="#064E3B" fill-opacity="0.8" stroke="#34D399" stroke-width="1.5"/>
  <text x="560" y="105" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle">2. JOB COMPUTE (AUTOMATED)</text>
  <text x="560" y="119" font-size="10" font-weight="600" fill="#A7F3D0" text-anchor="middle">Production Workflows &amp; Scheduled Pipelines</text>

  <!-- Usage Box -->
  <rect x="410" y="140" width="300" height="85" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="425" y="160" font-size="11" font-weight="700" fill="#F8FAFC" text-anchor="start">Primary Workloads</text>
  <text x="425" y="177" font-size="10" fill="#CBD5E1" text-anchor="start">• Scheduled ETL pipelines (Nightly batch)</text>
  <text x="425" y="192" font-size="10" fill="#CBD5E1" text-anchor="start">• Databricks Workflows multi-task DAGs</text>
  <text x="425" y="207" font-size="10" fill="#CBD5E1" text-anchor="start">• Non-interactive automated scripts &amp; dbt</text>

  <!-- Economics Box -->
  <rect x="410" y="235" width="300" height="85" rx="6" fill="#064E3B" fill-opacity="0.3" stroke="#34D399" stroke-width="1"/>
  <text x="425" y="255" font-size="11" font-weight="700" fill="#34D399" text-anchor="start">Cost &amp; Pricing Model</text>
  <text x="425" y="272" font-size="10" fill="#CBD5E1" text-anchor="start">• <tspan fill="#34D399" font-weight="700">50% Cheaper DBU Cost:</tspan> ~0.15 - 0.20 DBU / hr</text>
  <text x="425" y="287" font-size="10" fill="#CBD5E1" text-anchor="start">• Ephemeral: Spun up on schedule trigger</text>
  <text x="425" y="302" font-size="10" font-weight="600" fill="#34D399" text-anchor="start">• Auto-terminates IMMEDIATELY upon finish</text>

  <!-- Rule Box -->
  <rect x="410" y="330" width="300" height="125" rx="6" fill="#0F172A" stroke="#34D399" stroke-width="1"/>
  <text x="425" y="350" font-size="11" font-weight="700" fill="#34D399" text-anchor="start">Best Practice Guidance</text>
  <text x="425" y="370" font-size="10" fill="#F8FAFC" text-anchor="start">✔ Mandatory for all automated production</text>
  <text x="425" y="388" font-size="10" fill="#F8FAFC" text-anchor="start">✔ Use Instance Pools to avoid cold boot</text>
  <text x="425" y="406" font-size="10" fill="#F8FAFC" text-anchor="start">✔ Isolated clean VM environment per run</text>
  <text x="425" y="428" font-size="9.5" fill="#94A3B8" text-anchor="start">Verdict: 100% of ETL pipelines should run here.</text>

  <!-- Column 3: SQL Warehouses -->
  <rect x="750" y="85" width="330" height="385" rx="8" fill="#3B0764" fill-opacity="0.2" stroke="#C084FC" stroke-width="1.5"/>
  <rect x="750" y="85" width="330" height="40" rx="8" fill="#3B0764" fill-opacity="0.8" stroke="#C084FC" stroke-width="1.5"/>
  <text x="915" y="105" font-size="12" font-weight="700" fill="#C084FC" text-anchor="middle">3. SQL WAREHOUSES</text>
  <text x="915" y="119" font-size="10" font-weight="600" fill="#E9D5FF" text-anchor="middle">Serverless / Pro SQL Analytics &amp; BI Dashboards</text>

  <!-- Usage Box -->
  <rect x="765" y="140" width="300" height="85" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="780" y="160" font-size="11" font-weight="700" fill="#F8FAFC" text-anchor="start">Primary Workloads</text>
  <text x="780" y="177" font-size="10" fill="#CBD5E1" text-anchor="start">• BI Dashboards (Tableau, PowerBI, Looker)</text>
  <text x="780" y="192" font-size="10" fill="#CBD5E1" text-anchor="start">• High-concurrency SQL analyst queries</text>
  <text x="780" y="207" font-size="10" fill="#CBD5E1" text-anchor="start">• dbt SQL transformation models</text>

  <!-- Economics Box -->
  <rect x="765" y="235" width="300" height="85" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="780" y="255" font-size="11" font-weight="700" fill="#C084FC" text-anchor="start">Architecture &amp; Scaling</text>
  <text x="780" y="272" font-size="10" fill="#CBD5E1" text-anchor="start">• <tspan fill="#C084FC" font-weight="700">Photon-Native:</tspan> 100% C++ vectorized query engine</text>
  <text x="780" y="287" font-size="10" fill="#CBD5E1" text-anchor="start">• Serverless: Spins up in &lt; 2 seconds</text>
  <text x="780" y="302" font-size="10" fill="#CBD5E1" text-anchor="start">• Multi-cluster autoscaling for query concurrency</text>

  <!-- Rule Box -->
  <rect x="765" y="330" width="300" height="125" rx="6" fill="#0F172A" stroke="#C084FC" stroke-width="1"/>
  <text x="780" y="350" font-size="11" font-weight="700" fill="#C084FC" text-anchor="start">Best Practice Guidance</text>
  <text x="780" y="370" font-size="10" fill="#F8FAFC" text-anchor="start">✔ Use Serverless SQL for sub-second BI</text>
  <text x="780" y="388" font-size="10" fill="#F8FAFC" text-anchor="start">✔ Auto-stops in 5-10 minutes when idle</text>
  <text x="780" y="406" font-size="10" fill="#F8FAFC" text-anchor="start">✔ Outperforms Snowflake / BigQuery on Delta Lake</text>
  <text x="780" y="428" font-size="9.5" fill="#94A3B8" text-anchor="start">Verdict: Gold standard for enterprise BI &amp; SQL.</text>

  <!-- Bottom Invariant -->
  <rect x="40" y="480" width="1040" height="26" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="560" y="497" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Compute Selection Rule: All-Purpose for active developer notebooks; Job Clusters for scheduled production ETL (50% cheaper); Serverless SQL Warehouses for BI dashboards.</text>
</svg>