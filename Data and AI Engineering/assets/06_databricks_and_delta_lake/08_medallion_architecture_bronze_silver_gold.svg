<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1120" height="520" rx="10" fill="url(#bg)"/>
  <rect width="1120" height="520" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="560" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">Medallion Architecture &amp; Databricks Lakeflow Platform</text>
  <text x="560" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">How Lakeflow Connect, Lakeflow Pipelines, and Lakeflow Jobs automate Bronze, Silver, and Gold progression</text>

  <!-- Left Panel: Upstream Sources -->
  <rect x="40" y="85" width="220" height="385" rx="8" fill="#1E293B" fill-opacity="0.6" stroke="#64748B" stroke-width="1.5"/>
  <rect x="40" y="85" width="220" height="36" rx="8" fill="#0F172A" stroke="#64748B" stroke-width="1.5"/>
  <text x="150" y="108" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="middle">UPSTREAM SOURCES</text>

  <!-- DB Sources -->
  <rect x="55" y="135" width="190" height="95" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="68" y="157" font-size="10" font-weight="700" fill="#F8FAFC" text-anchor="start">OLTP Databases (CDC)</text>
  <text x="68" y="177" font-size="9" fill="#CBD5E1" text-anchor="start">• PostgreSQL, MySQL</text>
  <text x="68" y="192" font-size="9" fill="#CBD5E1" text-anchor="start">• Oracle, SQL Server</text>
  <text x="68" y="209" font-size="9" fill="#94A3B8" text-anchor="start">Write-Ahead Logs (WAL)</text>

  <!-- SaaS Sources -->
  <rect x="55" y="245" width="190" height="95" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="68" y="267" font-size="10" font-weight="700" fill="#F8FAFC" text-anchor="start">Enterprise SaaS &amp; APIs</text>
  <text x="68" y="287" font-size="9" fill="#CBD5E1" text-anchor="start">• Salesforce, Workday</text>
  <text x="68" y="302" font-size="9" fill="#CBD5E1" text-anchor="start">• ServiceNow, Marketo</text>
  <text x="68" y="319" font-size="9" fill="#94A3B8" text-anchor="start">REST API Endpoints</text>

  <!-- Event Streams -->
  <rect x="55" y="355" width="190" height="95" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="68" y="377" font-size="10" font-weight="700" fill="#F8FAFC" text-anchor="start">Streaming Event Buses</text>
  <text x="68" y="397" font-size="9" fill="#CBD5E1" text-anchor="start">• Apache Kafka, Kinesis</text>
  <text x="68" y="412" font-size="9" fill="#CBD5E1" text-anchor="start">• Azure Event Hubs</text>
  <text x="68" y="429" font-size="9" fill="#34D399" text-anchor="start">Millisecond latency</text>

  <!-- Middle Panel: Lakeflow Platform -->
  <rect x="280" y="85" width="310" height="385" rx="8" fill="#1E293B" fill-opacity="0.6" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="280" y="85" width="310" height="36" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="435" y="108" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle">DATABRICKS LAKEFLOW PLATFORM</text>

  <!-- Lakeflow Connect -->
  <rect x="295" y="135" width="280" height="95" rx="6" fill="#083344" fill-opacity="0.3" stroke="#22D3EE" stroke-width="1.5"/>
  <text x="310" y="157" font-size="11" font-weight="700" fill="#22D3EE" text-anchor="start">1. Lakeflow Connect (Ingestion)</text>
  <text x="310" y="177" font-size="9.5" fill="#CBD5E1" text-anchor="start">• Serverless connectors for databases &amp; SaaS</text>
  <text x="310" y="194" font-size="9.5" fill="#CBD5E1" text-anchor="start">• Automated Change Data Capture (CDC)</text>
  <text x="310" y="211" font-size="9.5" font-weight="600" fill="#34D399" text-anchor="start">Zero Fivetran/Airbyte required!</text>

  <!-- Lakeflow Pipelines -->
  <rect x="295" y="245" width="280" height="100" rx="6" fill="#064E3B" fill-opacity="0.2" stroke="#34D399" stroke-width="1.5"/>
  <text x="310" y="267" font-size="11" font-weight="700" fill="#34D399" text-anchor="start">2. Lakeflow Pipelines (DLT Engine)</text>
  <text x="310" y="287" font-size="9.5" fill="#CBD5E1" text-anchor="start">• Declarative pipeline DAG generation</text>
  <text x="310" y="304" font-size="9.5" fill="#CBD5E1" text-anchor="start">• Automatic incremental state tracking</text>
  <text x="310" y="321" font-size="9.5" fill="#A7F3D0" text-anchor="start">• Built-in Data Quality Expectations</text>

  <!-- Lakeflow Jobs -->
  <rect x="295" y="360" width="280" height="95" rx="6" fill="#3B0764" fill-opacity="0.2" stroke="#C084FC" stroke-width="1.5"/>
  <text x="310" y="382" font-size="11" font-weight="700" fill="#C084FC" text-anchor="start">3. Lakeflow Jobs (Orchestration)</text>
  <text x="310" y="402" font-size="9.5" fill="#CBD5E1" text-anchor="start">• Multi-task dependency management</text>
  <text x="310" y="419" font-size="9.5" fill="#CBD5E1" text-anchor="start">• Automatic retries &amp; SLA triggers</text>
  <text x="310" y="436" font-size="9.5" fill="#E9D5FF" text-anchor="start">• Unified operations &amp; observability</text>

  <!-- Connectors within Lakeflow -->
  <line x1="435" y1="230" x2="435" y2="245" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <line x1="435" y1="345" x2="435" y2="360" stroke="#C084FC" stroke-width="1.5" marker-end="url(#arr-p)"/>

  <!-- Link Sources -> Lakeflow Connect -->
  <line x1="245" y1="182" x2="295" y2="182" stroke="#22D3EE" stroke-width="2" marker-end="url(#arr-c)"/>

  <!-- Right Panel: Medallion Architecture -->
  <rect x="610" y="85" width="470" height="385" rx="8" fill="#1E293B" fill-opacity="0.6" stroke="#34D399" stroke-width="1.5"/>
  <rect x="610" y="85" width="470" height="36" rx="8" fill="#064E3B" fill-opacity="0.8" stroke="#34D399" stroke-width="1.5"/>
  <text x="845" y="108" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle">UNITY CATALOG MEDALLION LAKEHOUSE</text>

  <!-- Bronze Layer -->
  <rect x="630" y="135" width="430" height="95" rx="6" fill="#78350F" fill-opacity="0.2" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="645" y="157" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="start">BRONZE LAYER (RAW DATA LAKE)</text>
  <text x="645" y="177" font-size="9.5" fill="#CBD5E1" text-anchor="start">• Raw historical append log (snappy.parquet + _delta_log)</text>
  <text x="645" y="194" font-size="9.5" fill="#CBD5E1" text-anchor="start">• Retains all bad records in _rescue_data for auditing</text>
  <text x="645" y="211" font-size="9.5" fill="#FDE68A" text-anchor="start">Retention: Multi-year raw compliance history</text>

  <!-- Silver Layer -->
  <rect x="630" y="245" width="430" height="95" rx="6" fill="#083344" fill-opacity="0.2" stroke="#22D3EE" stroke-width="1.5"/>
  <text x="645" y="267" font-size="11" font-weight="700" fill="#22D3EE" text-anchor="start">SILVER LAYER (CLEANSED &amp; CONFORMED)</text>
  <text x="645" y="287" font-size="9.5" fill="#CBD5E1" text-anchor="start">• Deduplicated, null-checked, typed enterprise tables</text>
  <text x="645" y="304" font-size="9.5" fill="#CBD5E1" text-anchor="start">• Joined dimensions &amp; facts; Change Data Feed (CDF) enabled</text>
  <text x="645" y="321" font-size="9.5" fill="#A5F3FC" text-anchor="start">Audience: Data Engineers, Data Analysts, ML Feature Engineers</text>

  <!-- Gold Layer -->
  <rect x="630" y="355" width="430" height="95" rx="6" fill="#064E3B" fill-opacity="0.3" stroke="#34D399" stroke-width="2"/>
  <text x="645" y="377" font-size="11" font-weight="700" fill="#34D399" text-anchor="start">GOLD LAYER (AGGREGATED BUSINESS MARTS)</text>
  <text x="645" y="397" font-size="9.5" fill="#CBD5E1" text-anchor="start">• Star schemas, dimensional cubes, aggregated KPI views</text>
  <text x="645" y="414" font-size="9.5" fill="#CBD5E1" text-anchor="start">• Liquid Clustered on query predicates for sub-second BI</text>
  <text x="645" y="431" font-size="9.5" font-weight="600" fill="#34D399" text-anchor="start">Audience: PowerBI, Tableau, Executive Reporting, Production AI</text>

  <!-- Connectors Medallion Progression -->
  <line x1="845" y1="230" x2="845" y2="245" stroke="#22D3EE" stroke-width="2" marker-end="url(#arr-c)"/>
  <line x1="845" y1="340" x2="845" y2="355" stroke="#34D399" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- Link Lakeflow Pipelines -> Medallion -->
  <line x1="575" y1="295" x2="630" y2="295" stroke="#34D399" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- Bottom Invariant -->
  <rect x="40" y="480" width="1040" height="26" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="560" y="497" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Medallion Invariant: Bronze preserves the immutable raw truth, Silver cleanses and validates conformed entities, and Gold delivers sub-second aggregated business marts.</text>
</svg>