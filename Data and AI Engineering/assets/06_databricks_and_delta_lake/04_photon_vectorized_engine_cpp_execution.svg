<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1120" height="520" rx="10" fill="url(#bg)"/>
  <rect width="1120" height="520" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="560" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">Photon Vectorized Query Engine Architecture</text>
  <text x="560" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">How Databricks rewrote the physical execution engine in native C++ using SIMD vectorization to bypass JVM limits</text>

  <!-- Top Routing -->
  <rect x="40" y="85" width="1040" height="95" rx="8" fill="#1E293B" fill-opacity="0.6" stroke="#38BDF8" stroke-width="1.5"/>
  
  <rect x="60" y="105" width="230" height="55" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
  <text x="175" y="128" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">PySpark / SQL Query</text>
  <text x="175" y="145" font-size="9.5" fill="#94A3B8" text-anchor="middle">DataFrame API or SQL statement</text>

  <rect x="330" y="105" width="230" height="55" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
  <text x="445" y="128" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">Catalyst Optimizer (JVM)</text>
  <text x="445" y="145" font-size="9.5" fill="#94A3B8" text-anchor="middle">Logical &amp; Cost-Based Planning</text>

  <polygon points="630,132 720,105 810,132 720,160" fill="#1E293B" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="720" y="130" font-size="10" font-weight="700" fill="#FBBF24" text-anchor="middle">Photon Engine</text>
  <text x="720" y="143" font-size="10" font-weight="700" fill="#FBBF24" text-anchor="middle">Enabled?</text>

  <!-- Connectors Top -->
  <line x1="290" y1="132" x2="330" y2="132" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>
  <line x1="560" y1="132" x2="630" y2="132" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>

  <!-- Bottom Left: Classic JVM Engine -->
  <rect x="40" y="195" width="490" height="275" rx="8" fill="#1E293B" fill-opacity="0.6" stroke="#64748B" stroke-width="1.5"/>
  <rect x="40" y="195" width="490" height="32" rx="8" fill="#0F172A" stroke="#64748B" stroke-width="1.5"/>
  <text x="285" y="216" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="middle">CLASSIC JVM SPARK EXECUTION (PROJECT TUNGSTEN)</text>

  <text x="60" y="250" font-size="10" font-weight="600" fill="#F8FAFC" text-anchor="start">Execution Model:</text>
  <text x="60" y="267" font-size="9.5" fill="#CBD5E1" text-anchor="start">• Whole-Stage Java CodeGen via Janino in-memory compiler</text>
  <text x="60" y="284" font-size="9.5" fill="#CBD5E1" text-anchor="start">• Row-by-row iteration in compiled Java loops</text>
  <text x="60" y="301" font-size="9.5" fill="#CBD5E1" text-anchor="start">• JVM JIT compiles to x86-64 machine instructions</text>

  <rect x="60" y="320" width="450" height="135" rx="6" fill="#0F172A" stroke="#64748B" stroke-width="1"/>
  <text x="75" y="340" font-size="10" font-weight="700" fill="#94A3B8" text-anchor="start">Hardware Limitations of JVM:</text>
  <text x="75" y="358" font-size="9" fill="#CBD5E1" text-anchor="start">1. JVM JIT cannot reliably auto-vectorize complex code.</text>
  <text x="75" y="373" font-size="9" fill="#CBD5E1" text-anchor="start">2. Primitive null-checking incurs frequent conditional branch stalls.</text>
  <text x="75" y="388" font-size="9" fill="#CBD5E1" text-anchor="start">3. Java garbage collection pauses on large heap objects.</text>
  <text x="75" y="403" font-size="9" fill="#CBD5E1" text-anchor="start">4. Strings are encoded as UTF-16, wasting 50% memory bandwidth!</text>
  <text x="75" y="425" font-size="9" font-weight="600" fill="#F87171" text-anchor="start">Performance: 1x (Baseline)</text>

  <path d="M 720.0 160.0 L 720.0 171.5 Q 720.0 177.5 714.0 177.5 L 291.0 177.5 Q 285.0 177.5 285.0 183.5 L 285.0 195.0" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr-s)"/>
  <text x="450" y="175" font-size="9" fill="#94A3B8" text-anchor="middle">NO</text>

  <!-- Bottom Right: Photon Native C++ Engine -->
  <rect x="560" y="195" width="520" height="275" rx="8" fill="#064E3B" fill-opacity="0.2" stroke="#34D399" stroke-width="1.5"/>
  <rect x="560" y="195" width="520" height="32" rx="8" fill="#064E3B" fill-opacity="0.8" stroke="#34D399" stroke-width="1.5"/>
  <text x="820" y="216" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">PHOTON ENGINE: NATIVE C++ SIMD VECTORIZATION</text>

  <text x="580" y="250" font-size="10" font-weight="600" fill="#F8FAFC" text-anchor="start">Execution Model:</text>
  <text x="580" y="267" font-size="9.5" fill="#CBD5E1" text-anchor="start">• Complete rewrite of Spark physical operators in native C++</text>
  <text x="580" y="284" font-size="9.5" fill="#CBD5E1" text-anchor="start">• Columnar in-memory processing on batches of up to 2048 values</text>
  <text x="580" y="301" font-size="9.5" fill="#CBD5E1" text-anchor="start">• Explicit SIMD (AVX-512) vector instruction pipeline</text>

  <rect x="580" y="320" width="480" height="135" rx="6" fill="#0F172A" stroke="#34D399" stroke-width="1"/>
  <text x="595" y="340" font-size="10" font-weight="700" fill="#34D399" text-anchor="start">Photon Architectural Superpowers:</text>
  <text x="595" y="358" font-size="9" fill="#CBD5E1" text-anchor="start">1. <tspan fill="#34D399" font-weight="700">True SIMD Vectorization:</tspan> 1 CPU instruction filters 16 rows at once!</text>
  <text x="595" y="373" font-size="9" fill="#CBD5E1" text-anchor="start">2. <tspan fill="#34D399" font-weight="700">Zero JVM GC:</tspan> Memory managed off-heap via native C++ malloc/mmap.</text>
  <text x="595" y="388" font-size="9" fill="#CBD5E1" text-anchor="start">3. <tspan fill="#34D399" font-weight="700">Bitmask Null-Handling:</tspan> Nulls tracked via compact 1-bit flags (zero branches!).</text>
  <text x="595" y="403" font-size="9" fill="#CBD5E1" text-anchor="start">4. <tspan fill="#34D399" font-weight="700">UTF-8 Native Strings:</tspan> Operates directly on compact UTF-8 byte slices.</text>
  <text x="595" y="425" font-size="9.5" font-weight="700" fill="#34D399" text-anchor="start">Performance: 3x to 8x Faster Execution on Delta Lake!</text>

  <line x1="810" y1="132" x2="880" y2="132" stroke="#34D399" stroke-width="2"/>
  <line x1="880" y1="132" x2="880" y2="195" stroke="#34D399" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="845" y="125" font-size="9" font-weight="700" fill="#34D399" text-anchor="middle">YES</text>

  <!-- Bottom Invariant -->
  <rect x="40" y="480" width="1040" height="26" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="560" y="497" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Photon Invariant: Photon is a vectorized C++ execution engine that integrates seamlessly underneath standard Spark APIs, leveraging modern CPU SIMD registers and off-heap memory to outpace JVM bytecode.</text>
</svg>