<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1120" height="520" rx="10" fill="url(#bg)"/>
  <rect width="1120" height="520" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="560" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">Databricks Workflows Multi-Task DAG Orchestration</text>
  <text x="560" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">Enterprise job orchestration with heterogeneous tasks (Notebooks, Python, SQL, dbt), dependencies, and alerts</text>

  <!-- Main Workflow Container -->
  <rect x="40" y="85" width="1040" height="385" rx="8" fill="#1E293B" fill-opacity="0.6" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="40" y="85" width="1040" height="36" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="560" y="108" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle">DATABRICKS WORKFLOW MULTI-TASK DAG PIPELINE</text>

  <!-- Task 1: Ingest Bronze -->
  <rect x="60" y="215" width="180" height="95" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="150" y="237" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">Task 1: Ingest Bronze</text>
  <text x="150" y="255" font-size="9.5" fill="#CBD5E1" text-anchor="middle">Notebook Task</text>
  <text x="150" y="272" font-size="9" fill="#94A3B8" text-anchor="middle">CloudFiles / Auto Loader</text>
  <text x="150" y="290" font-size="8.5" fill="#34D399" text-anchor="middle">Cluster: Shared Job Cluster</text>

  <!-- Task 2: Cleanse Silver -->
  <rect x="290" y="215" width="180" height="95" rx="6" fill="#0F172A" stroke="#34D399" stroke-width="1.5"/>
  <text x="380" y="237" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">Task 2: Cleanse Silver</text>
  <text x="380" y="255" font-size="9.5" fill="#CBD5E1" text-anchor="middle">Python Script (repo/)</text>
  <text x="380" y="272" font-size="9" fill="#CBD5E1" text-anchor="middle">Deduplication &amp; Schema</text>
  <text x="380" y="290" font-size="8.5" fill="#34D399" text-anchor="middle">Cluster: Shared Job Cluster</text>

  <!-- Task 3: Gold Sales -->
  <rect x="530" y="145" width="200" height="95" rx="6" fill="#0F172A" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="630" y="167" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="middle">Task 3: Build Gold Sales</text>
  <text x="630" y="185" font-size="9.5" fill="#CBD5E1" text-anchor="middle">SQL Query / dbt Model</text>
  <text x="630" y="202" font-size="9" fill="#CBD5E1" text-anchor="middle">Aggregated Fact Table</text>
  <text x="630" y="220" font-size="8.5" fill="#C084FC" text-anchor="middle">Compute: Serverless SQL Wh</text>

  <!-- Task 4: Gold ML Features -->
  <rect x="530" y="285" width="200" height="95" rx="6" fill="#0F172A" stroke="#C084FC" stroke-width="1.5"/>
  <text x="630" y="307" font-size="11" font-weight="700" fill="#C084FC" text-anchor="middle">Task 4: ML Feature Store</text>
  <text x="630" y="325" font-size="9.5" fill="#CBD5E1" text-anchor="middle">Python Wheel Task</text>
  <text x="630" y="342" font-size="9" fill="#CBD5E1" text-anchor="middle">Customer Churn Embeddings</text>
  <text x="630" y="360" font-size="8.5" fill="#38BDF8" text-anchor="middle">Cluster: GPU Single-Node</text>

  <!-- Task 5: Webhook Notification -->
  <rect x="790" y="215" width="200" height="95" rx="6" fill="#064E3B" fill-opacity="0.3" stroke="#34D399" stroke-width="2"/>
  <text x="890" y="237" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">Task 5: Notification &amp; SLA</text>
  <text x="890" y="255" font-size="9.5" fill="#CBD5E1" text-anchor="middle">Webhook / Slack / Teams</text>
  <text x="890" y="272" font-size="9" fill="#CBD5E1" text-anchor="middle">Emits run metrics &amp; stats</text>
  <text x="890" y="290" font-size="8.5" fill="#34D399" text-anchor="middle">Condition: ALL_SUCCESS</text>

  <!-- Connectors -->
  <line x1="240" y1="262" x2="290" y2="262" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>
  <path d="M 470.0 250.0 L 480.0 250.0 C 498.0 250.0, 498.0 195.0, 516.0 195.0 L 530.0 195.0" fill="none" stroke="#34D399" stroke-width="2" marker-end="url(#arr-g)"/>
  <path d="M 470.0 275.0 L 480.0 275.0 C 498.0 275.0, 498.0 330.0, 516.0 330.0 L 530.0 330.0" fill="none" stroke="#34D399" stroke-width="2" marker-end="url(#arr-g)"/>
  <path d="M 730.0 195.0 L 740.0 195.0 C 758.0 195.0, 758.0 250.0, 776.0 250.0 L 790.0 250.0" fill="none" stroke="#FBBF24" stroke-width="2" marker-end="url(#arr-a)"/>
  <path d="M 730.0 330.0 L 740.0 330.0 C 758.0 330.0, 758.0 275.0, 776.0 275.0 L 790.0 275.0" fill="none" stroke="#C084FC" stroke-width="2" marker-end="url(#arr-p)"/>

  <!-- Legend Bottom of Workflow -->
  <rect x="60" y="405" width="1000" height="45" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="80" y="425" font-size="9.5" font-weight="700" fill="#F8FAFC" text-anchor="start">Orchestration Superpowers:</text>
  <text x="250" y="425" font-size="9" fill="#CBD5E1" text-anchor="start">✔ Shared Cluster Re-use: Tasks 1 &amp; 2 share 1 Job cluster (Zero re-boot lag!)</text>
  <text x="250" y="440" font-size="9" fill="#CBD5E1" text-anchor="start">✔ Task Values: Pass dynamic variables (e.g. partition_date) downstream via dbutils.jobs.taskValues</text>

  <!-- Bottom Invariant -->
  <rect x="40" y="480" width="1040" height="26" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="560" y="497" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Workflow Invariant: Databricks Workflows orchestrates heterogeneous tasks into directed acyclic graphs (DAGs) with cluster reuse, condition checks, and parameter passing without external tools.</text>
</svg>