    <text x="69" y="349" fill="#cbd5e1" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start">Dedicated compute clusters sized for peak load (High CapEx)</text>

  
    <rect x="520" y="95" width="430" height="290" rx="10" fill="#06231a" stroke="#10b981" stroke-width="1.5"/>
