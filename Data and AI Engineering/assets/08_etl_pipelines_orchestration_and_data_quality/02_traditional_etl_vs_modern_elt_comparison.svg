    <text x="684" y="209" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Immutable S3</text>
  
    <rect x="805" y="135" width="130" height="75" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="870.0" y="161" fill="#6ee7b7" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Gold Marts</text>
