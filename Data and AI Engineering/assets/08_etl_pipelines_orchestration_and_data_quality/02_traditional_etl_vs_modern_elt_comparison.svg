    <text x="585.0" y="161" fill="#6ee7b7" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Source DB</text>
    <text x="585.0" y="177" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">OLTP RDBMS</text>
    <circle cx="551" cy="190" r="2" fill="#10b981"/>
    <text x="559" y="193" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">WAL / CDC</text>
  
