  <text x="490.0" y="58" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Extract-Transform-Load on Rigid Compute Servers vs. Extract-Load-Transform in Cloud Engines</text>
  
  
