    <line x1="315" y1="172" x2="345" y2="172" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr-r)"/>
  
    <rect x="45" y="235" width="400" height="135" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="245.0" y="258" fill="#fca5a5" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Characteristics of Traditional ETL</text>
    <text x="245.0" y="274" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Rigid Architecture</text>
    <circle cx="61" cy="292" r="2" fill="#ef4444"/>
    <text x="69" y="295" fill="#cbd5e1" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start">Transformation occurs on dedicated servers BEFORE loading</text>
    <circle cx="61" cy="310" r="2" fill="#ef4444"/>
    <text x="69" y="313" fill="#cbd5e1" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start">Unselected raw fields permanently discarded at ingestion</text>
    <circle cx="61" cy="328" r="2" fill="#ef4444"/>
    <text x="69" y="331" fill="#cbd5e1" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start">Schema changes require rewriting the entire pipeline from scratch</text>
