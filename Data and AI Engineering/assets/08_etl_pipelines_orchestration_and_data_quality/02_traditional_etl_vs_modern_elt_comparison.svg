    <line x1="780" y1="172" x2="805" y2="172" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/>
  
    <rect x="535" y="235" width="400" height="135" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="735.0" y="258" fill="#6ee7b7" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Characteristics of Modern ELT</text>
    <text x="735.0" y="274" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Agile &amp; Elastic Architecture</text>
    <circle cx="551" cy="292" r="2" fill="#10b981"/>
    <text x="559" y="295" fill="#cbd5e1" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start">Raw records loaded directly into Bronze lakehouse without alteration</text>
    <circle cx="551" cy="310" r="2" fill="#10b981"/>
    <text x="559" y="313" fill="#cbd5e1" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start">Transformations executed in-engine via SQL/dbt on elastic compute</text>
    <circle cx="551" cy="328" r="2" fill="#10b981"/>
    <text x="559" y="331" fill="#cbd5e1" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start">Infinite replay: Logic iterations do not require source re-extraction</text>
    <circle cx="551" cy="346" r="2" fill="#10b981"/>
    <text x="559" y="349" fill="#cbd5e1" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start">Storage and compute decouple linearly with cloud commodity economics</text>

