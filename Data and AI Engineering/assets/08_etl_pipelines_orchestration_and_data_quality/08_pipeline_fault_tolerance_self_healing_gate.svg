    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="980" height="420" rx="10" fill="url(#bg)"/>
  <text x="490.0" y="36" fill="#f8fafc" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Pipeline Fault Tolerance: Self-Healing &amp; Quarantine Gate</text>
  <text x="490.0" y="58" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Distinguishing Transient Network Retries from Fatal Poison Pill Dead-Letter Routing</text>
  
  
    <rect x="40" y="115" width="210" height="130" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="145.0" y="141" fill="#93c5fd" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Task Execution</text>
    <text x="145.0" y="157" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Pipeline Operator Run</text>
    <rect x="206" y="125" width="38" height="18" rx="9" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <text x="225.0" y="137" fill="#3b82f6" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">TASK</text>
    <circle cx="56" cy="170" r="2" fill="#3b82f6"/>
    <text x="64" y="173" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Worker executes transformation</text>
    <circle cx="56" cy="186" r="2" fill="#3b82f6"/>
    <text x="64" y="189" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Branch A: Succeeds &#x2192; Commit</text>
    <circle cx="56" cy="202" r="2" fill="#3b82f6"/>
    <text x="64" y="205" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Branch B: Error occurs -&amp;gt; Evaluate</text>
    <circle cx="56" cy="218" r="2" fill="#3b82f6"/>
    <text x="64" y="221" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Monitored by Airflow / Dagster</text>

  
    <rect x="290" y="95" width="360" height="155" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="470.0" y="121" fill="#fde68a" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Transient Error Handler</text>
    <text x="470.0" y="137" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Network Timeout / Lock Wait / HTTP 503</text>
    <rect x="515" y="105" width="129" height="18" rx="9" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="579.5" y="117" fill="#f59e0b" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">RETRY WITH JITTER</text>
    <circle cx="306" cy="150" r="2" fill="#f59e0b"/>
    <text x="314" y="153" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">1. Error classified: TRANSIENT (Recoverable).</text>
    <circle cx="306" cy="166" r="2" fill="#f59e0b"/>
    <text x="314" y="169" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">2. Check Retry Budget: attempt &amp;lt; 5.</text>
    <circle cx="306" cy="182" r="2" fill="#f59e0b"/>
    <text x="314" y="185" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">3. Calculates Sleep &amp;amp; Full Jitter:</text>
    <circle cx="306" cy="198" r="2" fill="#f59e0b"/>
    <text x="314" y="201" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">   Sleep = Uniform(0, min(300, Base * 2^attempt)).</text>
    <circle cx="306" cy="214" r="2" fill="#f59e0b"/>
    <text x="314" y="217" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">4. Retries task execution cleanly.</text>

  
    <rect x="700" y="95" width="250" height="155" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="825.0" y="121" fill="#fca5a5" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Circuit Breaker Trip</text>
    <text x="825.0" y="137" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Budget Exhausted (Attempt &gt;= 5)</text>
    <rect x="850" y="105" width="94" height="18" rx="9" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
    <text x="897.0" y="117" fill="#ef4444" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">CIRCUIT TRIP</text>
    <circle cx="716" cy="150" r="2" fill="#ef4444"/>
    <text x="724" y="153" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Retry budget completely depleted!</text>
    <circle cx="716" cy="166" r="2" fill="#ef4444"/>
    <text x="724" y="169" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Upstream service experiencing hard outage.</text>
    <circle cx="716" cy="182" r="2" fill="#ef4444"/>
    <text x="724" y="185" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Action: Trips Circuit Breaker.</text>
    <circle cx="716" cy="198" r="2" fill="#ef4444"/>
    <text x="724" y="201" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Halts downstream dependent tasks.</text>
    <circle cx="716" cy="214" r="2" fill="#ef4444"/>
    <text x="724" y="217" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Fires PagerDuty alert to on-call!</text>

  
    <rect x="290" y="275" width="660" height="120" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="620.0" y="301" fill="#6ee7b7" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Fatal Poison Pill Handler: Dead Letter Queue (DLQ) Quarantine</text>
    <text x="620.0" y="317" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Corrupt Schema / Type Cast Failure / Null Violation</text>
    <rect x="836" y="285" width="108" height="18" rx="9" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="890.0" y="297" fill="#10b981" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">DLQ QUARANTINE</text>
    <circle cx="306" cy="330" r="2" fill="#10b981"/>
    <text x="314" y="333" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">1. Error classified: FATAL (Unrecoverable payload corruption - retrying 1,000 times will NEVER succeed!).</text>
    <circle cx="306" cy="346" r="2" fill="#10b981"/>
    <text x="314" y="349" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">2. Isolates bad record; routes corrupted payload to: quarantine.dlq_poison_records table.</text>
    <circle cx="306" cy="362" r="2" fill="#10b981"/>
    <text x="314" y="365" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">3. Pipeline continues processing remaining 999,999 valid records without crashing!</text>
    <circle cx="306" cy="378" r="2" fill="#10b981"/>
    <text x="314" y="381" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">4. Data engineering team inspects quarantined payload offline and patches schema mapping.</text>

  
    <line x1="250" y1="160" x2="290" y2="160" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-a)"/><text x="270.0" y="152.0" fill="#f59e0b" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Transient Error</text>
  
    <line x1="650" y1="160" x2="700" y2="160" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr-r)"/><text x="675.0" y="152.0" fill="#ef4444" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Attempts &gt;= 5</text>
  
    <polyline points="145,245 145,335 290,335" fill="none" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/><text x="215" y="320" fill="#10b981" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Fatal Corrupt Record</text>

</svg>