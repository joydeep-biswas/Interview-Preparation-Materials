<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%" style="background-color: #0b1120; max-width: 100%; height: auto;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="card-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#451a03" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="card-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="card-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="card-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#155e75" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22d3ee"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Base Canvas -->
  <rect width="1000" height="360" rx="10" fill="url(#bg)"/>

  <!-- Diagram Header -->
  <g transform="translate(0, 0)">
    <text x="500.0" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#f8fafc">Airflow Temporal Model: Data Interval vs Execution Time</text>
    <text x="500.0" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Understanding why daily DAGs trigger at the END of the data interval, not the beginning</text>
  </g>

  <!-- Diagram Body -->
  <g transform="translate(40, 95)">
  <rect width="520" height="220" rx="10" fill="#0f172a" fill-opacity="0.08" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="14" y="-12" width="442" height="22" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="235.0" y="3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Data Interval: [2026-10-01 00:00 to 2026-10-02 00:00)</text>
</g>
<g transform="translate(60, 135)">
  <rect width="210" height="85" rx="8" fill="url(#card-blue)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="105.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Interval Start (Logical Date)</text>
  <line x1="12" y1="34" x2="198" y2="34" stroke="#334155" stroke-width="1"/>
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• data_interval_start</text>
  <text x="14" y="70" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• logical_date: 2026-10-01</text>
  <text x="14" y="88" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Window boundary opens</text>
</g>
<g transform="translate(330, 135)">
  <rect width="210" height="85" rx="8" fill="url(#card-purple)" stroke="#c084fc" stroke-width="1.5"/>
  <text x="105.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Interval End</text>
  <line x1="12" y1="34" x2="198" y2="34" stroke="#334155" stroke-width="1"/>
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• data_interval_end</text>
  <text x="14" y="70" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• 2026-10-02 00:00</text>
  <text x="14" y="88" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Window boundary closes</text>
</g>
<line x1="270" y1="177" x2="330" y2="177" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr-b)"/>
<text x="300.0" y="171.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">24-hr Accumulation</text>
<g transform="translate(60, 235)">
  <rect width="480" height="65" rx="8" fill="url(#card-cyan)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="240.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Underlying Business Data Filter</text>
  <line x1="12" y1="34" x2="468" y2="34" stroke="#334155" stroke-width="1"/>
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">SELECT * FROM events WHERE event_time &gt;= '2026-10-01' AND event_time &lt; '2026-10-02'</text>
</g>
<g transform="translate(600, 95)">
  <rect width="360" height="220" rx="10" fill="#0f172a" fill-opacity="0.08" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="14" y="-12" width="218" height="22" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="123.0" y="3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#34d399">Actual Pipeline Execution</text>
</g>
<g transform="translate(620, 135)">
  <rect width="320" height="95" rx="8" fill="url(#card-green)" stroke="#34d399" stroke-width="1.5"/>
  <text x="160.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#a7f3d0">Scheduler Fires Pipeline</text>
  <line x1="12" y1="34" x2="308" y2="34" stroke="#334155" stroke-width="1"/>
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Wall-Clock Time: 2026-10-02 00:00:05</text>
  <text x="14" y="70" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Triggers IMMEDIATELY AFTER interval end</text>
  <text x="14" y="88" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Guarantees 100% of Oct 1 data has arrived!</text>
</g>
<g transform="translate(620, 245)">
  <rect width="320" height="55" rx="8" fill="url(#card-red)" stroke="#f87171" stroke-width="1.5"/>
  <text x="160.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#fca5a5">Anti-Pattern Warning</text>
  <line x1="12" y1="34" x2="308" y2="34" stroke="#334155" stroke-width="1"/>
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">Never rely on datetime.now() inside SQL templates!</text>
</g>
<line x1="540" y1="177" x2="620" y2="177" stroke="#34d399" stroke-width="1.8" marker-end="url(#arr-g)"/>
<text x="580.0" y="171.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#34d399">Interval Closes</text>
</svg>