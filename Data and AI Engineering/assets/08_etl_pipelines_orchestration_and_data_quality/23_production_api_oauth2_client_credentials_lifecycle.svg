<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="980" height="420" rx="10" fill="url(#bg)"/>
  <text x="490.0" y="36" fill="#f8fafc" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Production API Authentication: OAuth 2.0 Client Credentials Lifecycle</text>
  <text x="490.0" y="58" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Proactive Token Refresh at 55 Minutes Preventing 401 Unauthorized Pipeline Aborts</text>
  
  
    <rect x="40" y="110" width="220" height="160" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="150.0" y="136" fill="#93c5fd" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Ingestion Worker</text>
    <text x="150.0" y="152" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Pipeline Ingress Agent</text>
    <rect x="202" y="120" width="52" height="18" rx="9" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <text x="228.0" y="132" fill="#3b82f6" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">CLIENT</text>
    <circle cx="56" cy="165" r="2" fill="#3b82f6"/>
    <text x="64" y="168" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Holds client credentials in KMS:</text>
    <circle cx="56" cy="181" r="2" fill="#3b82f6"/>
    <text x="64" y="184" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">client_id, client_secret</text>
    <circle cx="56" cy="197" r="2" fill="#3b82f6"/>
    <text x="64" y="200" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">grant_type=client_credentials</text>
    <circle cx="56" cy="213" r="2" fill="#3b82f6"/>
    <text x="64" y="216" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Maintains local in-memory token cache</text>
    <circle cx="56" cy="229" r="2" fill="#3b82f6"/>
    <text x="64" y="232" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Proactively refreshes at 55 minutes</text>

  
    <rect x="360" y="110" width="260" height="160" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="490.0" y="136" fill="#c084fc" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Identity Provider (IdP)</text>
    <text x="490.0" y="152" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Okta / Azure AD / Auth0</text>
    <rect x="583" y="120" width="31" height="18" rx="9" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
    <text x="598.5" y="132" fill="#8b5cf6" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">IDP</text>
    <circle cx="376" cy="165" r="2" fill="#8b5cf6"/>
    <text x="384" y="168" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Validates client credentials</text>
    <circle cx="376" cy="181" r="2" fill="#8b5cf6"/>
    <text x="384" y="184" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Issues signed JWT Access Token:</text>
    <circle cx="376" cy="197" r="2" fill="#8b5cf6"/>
    <text x="384" y="200" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Header: Alg=RS256</text>
    <circle cx="376" cy="213" r="2" fill="#8b5cf6"/>
    <text x="384" y="216" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Payload: { sub: 'worker', exp: 3600 }</text>
    <circle cx="376" cy="229" r="2" fill="#8b5cf6"/>
    <text x="384" y="232" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Returns: expires_in = 3600 seconds</text>

  
    <rect x="710" y="110" width="230" height="160" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="825.0" y="136" fill="#6ee7b7" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">SaaS API</text>
    <text x="825.0" y="152" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Salesforce / Stripe REST API</text>
    <rect x="868" y="120" width="66" height="18" rx="9" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="901.0" y="132" fill="#10b981" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">SAAS API</text>
    <circle cx="726" cy="165" r="2" fill="#10b981"/>
    <text x="734" y="168" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Protected customer data endpoints</text>
    <circle cx="726" cy="181" r="2" fill="#10b981"/>
    <text x="734" y="184" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Validates Bearer token signature</text>
    <circle cx="726" cy="197" r="2" fill="#10b981"/>
    <text x="734" y="200" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Serves customer records</text>
    <circle cx="726" cy="213" r="2" fill="#10b981"/>
    <text x="734" y="216" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Rejects with HTTP 401 if expired!</text>

  
    <line x1="260" y1="160" x2="360" y2="160" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr-b)"/><text x="310.0" y="152.0" fill="#3b82f6" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">1. POST /oauth/token</text>
  
    <line x1="360" y1="200" x2="260" y2="200" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arr-p)"/><text x="310.0" y="192.0" fill="#8b5cf6" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">2. Return JWT (exp: 3600s)</text>
  
    <line x1="260" y1="240" x2="710" y2="240" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/><text x="485.0" y="232.0" fill="#10b981" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">3. GET /data/v1/customers (Bearer &lt;token&gt;)</text>

  
    <rect x="40" y="290" width="900" height="105" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="490.0" y="316" fill="#fde68a" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Proactive Token Expiration Invariant: The 55-Minute Refresh Rule</text>
    <text x="490.0" y="332" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Eliminating Transient 401 Unauthorized Pipeline Aborts</text>
    <rect x="805" y="300" width="129" height="18" rx="9" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="869.5" y="312" fill="#f59e0b" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">REFRESH INVARIANT</text>
    <circle cx="56" cy="345" r="2" fill="#f59e0b"/>
    <text x="64" y="348" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">A naive pipeline uses the token until the server returns HTTP 401, causing the active micro-batch to fail.</text>
    <circle cx="56" cy="361" r="2" fill="#f59e0b"/>
    <text x="64" y="364" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">A resilient production pipeline tracks token acquisition time and proactively issues a token refresh at 55 minutes (5 minutes BEFORE expiration).</text>
    <circle cx="56" cy="377" r="2" fill="#f59e0b"/>
    <text x="64" y="380" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Result: 100% uninterrupted streaming ingestion across months of continuous production runs!</text>

</svg>