    <text x="364" y="200" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">SELECT * FROM {table_name}</text>
    <circle cx="356" cy="213" r="2" fill="#8b5cf6"/>
    <text x="364" y="216" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">WHERE {watermark_col} &amp;gt; {last_sync}</text>
    <circle cx="356" cy="229" r="2" fill="#8b5cf6"/>
    <text x="364" y="232" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">LIMIT {batch_size}</text>
    <circle cx="356" cy="245" r="2" fill="#8b5cf6"/>
    <text x="364" y="248" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Spawns parallel worker threads</text>

  
