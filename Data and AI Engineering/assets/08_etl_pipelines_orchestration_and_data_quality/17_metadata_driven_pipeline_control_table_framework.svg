  <text x="490" y="395" fill="#f59e0b" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Adding 100 new tables requires ZERO code changes! Simply insert 100 configuration rows into the control catalog.</text>

