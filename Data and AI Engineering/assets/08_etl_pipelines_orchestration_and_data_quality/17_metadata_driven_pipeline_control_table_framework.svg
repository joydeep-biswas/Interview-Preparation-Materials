    <text x="684" y="248" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Watermark: order_ts</text>
  
    <rect x="660" y="285" width="280" height="85" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="800.0" y="311" fill="#6ee7b7" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Worker 3: Sync products</text>
    <text x="800.0" y="327" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Full Snapshot</text>
    <circle cx="676" cy="340" r="2" fill="#10b981"/>
