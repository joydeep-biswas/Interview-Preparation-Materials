    <text x="744" y="232" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Target Micro-Partitions</text>

  
    <line x1="230" y1="195" x2="260" y2="195" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr-b)"/><text x="245.0" y="187.0" fill="#3b82f6" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Upload File</text>
  
    <line x1="460" y1="195" x2="490" y2="195" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-a)"/><text x="475.0" y="187.0" fill="#f59e0b" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">ObjectCreated</text>
  
    <line x1="690" y1="195" x2="720" y2="195" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/><text x="705.0" y="187.0" fill="#10b981" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Consume Msg</text>

  
    <rect x="40" y="310" width="900" height="85" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="490.0" y="336" fill="#c084fc" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Snowpipe Serverless Advantage: Zero Virtual Warehouse Compute Sizing</text>
    <text x="490.0" y="352" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Decoupling Continuous Ingestion Costs from Large Query Virtual Warehouses</text>
    <rect x="784" y="320" width="150" height="18" rx="9" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
    <text x="859.0" y="332" fill="#8b5cf6" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">SERVERLESS ECONOMICS</text>
    <circle cx="56" cy="365" r="2" fill="#8b5cf6"/>
    <text x="64" y="368" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Snowpipe runs on Snowflake-managed serverless compute. You do NOT need to keep a dedicated virtual warehouse running 24/7!</text>
    <circle cx="56" cy="381" r="2" fill="#8b5cf6"/>
    <text x="64" y="384" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Charges are calculated based strictly on the exact compute used to process each micro-batch (per-second billing), reducing continuous ingestion cost by up to 70%.</text>

</svg>