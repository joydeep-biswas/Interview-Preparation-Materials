  <text x="490.0" y="36" fill="#f8fafc" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Snowflake Snowpipe Serverless Ingestion Architecture</text>
  <text x="490.0" y="58" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Event-Driven SQS Notification, IAM Storage Integration, and Micro-Partition Loading</text>
  
  
