    <text x="284" y="184" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">S3 Bucket Event notification:</text>
    <circle cx="276" cy="197" r="2" fill="#3b82f6"/>
    <text x="284" y="200" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Publishes ObjectCreated</text>
