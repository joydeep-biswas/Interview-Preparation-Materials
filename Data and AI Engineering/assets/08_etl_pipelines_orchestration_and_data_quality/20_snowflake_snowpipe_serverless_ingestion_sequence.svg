    <text x="514" y="200" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Snowpipe serverless engine</text>
    <circle cx="506" cy="213" r="2" fill="#f59e0b"/>
    <text x="514" y="216" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">polls queue continuously</text>

  
    <rect x="720" y="110" width="220" height="170" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="830.0" y="136" fill="#6ee7b7" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">4. Snowflake Snowpipe</text>
    <text x="830.0" y="152" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Serverless Ingestion Engine</text>
    <rect x="868" y="120" width="66" height="18" rx="9" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="901.0" y="132" fill="#10b981" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">SNOWPIPE</text>
