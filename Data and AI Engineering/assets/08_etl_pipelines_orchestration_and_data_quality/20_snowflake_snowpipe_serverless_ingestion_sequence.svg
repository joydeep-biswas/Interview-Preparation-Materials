    <text x="64" y="216" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">s3://company-lake/orders/</text>

  
    <rect x="260" y="110" width="200" height="170" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="360.0" y="136" fill="#93c5fd" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">2. S3 Landing Bucket</text>
