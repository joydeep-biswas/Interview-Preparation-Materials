    <text x="284" y="216" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">message to AWS SQS Queue</text>

  
    <rect x="490" y="110" width="200" height="170" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
