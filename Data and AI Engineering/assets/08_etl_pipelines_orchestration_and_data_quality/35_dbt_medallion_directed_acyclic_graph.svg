    <text x="500.0" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Staged transformations from raw sources to ephemeral business logic, incremental marts, and BI layers</text>
  </g>

