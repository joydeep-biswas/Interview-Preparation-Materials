<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 381" width="100%" height="100%" style="background-color: #0b1120; max-width: 100%; height: auto;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="card-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="card-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#451a03" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="card-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="card-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="card-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#155e75" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.2" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171" />
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22d3ee" />
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Base Canvas -->
  <rect width="1000" height="360" rx="10" fill="url(#bg)"  stroke="#1F2937" stroke-width="1.5"/>

  <!-- Diagram Header -->
  <g transform="translate(0, 0)">
    <text x="500.0" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#f8fafc">Operator Granularity: Single Task vs Modular Micro-Tasks</text>
    <text x="500.0" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Decomposing monolithic DAG scripts into atomic, independently retryable Airflow tasks</text>
  </g>

  <!-- Diagram Body -->
  <g transform="translate(40, 95)">
  <rect width="920" height="105" rx="10" fill="#0f172a" fill-opacity="0.06" stroke="#f87171" stroke-width="1.5" stroke-dasharray="6,4" />
  <rect x="14" y="-12" width="538" height="22" rx="4" fill="#0f172a" stroke="#f87171" stroke-width="1" />
  <text x="283.0" y="3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#f87171">Anti-Pattern: Monolithic Monotask (Failure Requires Full Restart)</text>
</g>
<g transform="translate(60, 125)">
  <rect width="880" height="70" rx="8" fill="url(#card-red)" stroke="#f87171" stroke-width="1.5" />
  <text x="440.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#fca5a5">Monolithic PythonOperator (Extract + Stage + Load + Transform + Notify in 1 Script)</text>
  <line x1="12" y1="34" x2="868" y2="34" stroke="#334155" stroke-width="1" />
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">Crash in dbt transformation requires re-running entire 4-hour S3 and Snowflake extraction!</text>
</g>
<g transform="translate(40, 220)">
  <rect width="920" height="115" rx="10" fill="#0f172a" fill-opacity="0.06" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6,4" />
  <rect x="14" y="-12" width="650" height="22" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="1" />
  <text x="339.0" y="3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#34d399">Best Practice: Atomic Operators with Independent Retries &amp; Isolated Idempotency</text>
</g>
<g transform="translate(60, 245)">
  <rect width="160" height="106" rx="8" fill="url(#card-blue)" stroke="#38bdf8" stroke-width="1.5" />
  <text x="80.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Extract API</text>
  <line x1="12" y1="34" x2="148" y2="34" stroke="#334155" stroke-width="1" />
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• PythonOperator</text>
  <text x="14" y="70" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Retries: 3</text>
  <text x="14" y="88" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Exponential backoff</text>
</g>
<g transform="translate(245, 245)">
  <rect width="160" height="106" rx="8" fill="url(#card-cyan)" stroke="#22d3ee" stroke-width="1.5" />
  <text x="80.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Stage S3</text>
  <line x1="12" y1="34" x2="148" y2="34" stroke="#334155" stroke-width="1" />
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• S3CreateObject</text>
  <text x="14" y="70" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Overwrite idempotent</text>
  <text x="14" y="88" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Multipart upload</text>
</g>
<g transform="translate(430, 245)">
  <rect width="160" height="106" rx="8" fill="url(#card-purple)" stroke="#c084fc" stroke-width="1.5" />
  <text x="80.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Load Snowflake</text>
  <line x1="12" y1="34" x2="148" y2="34" stroke="#334155" stroke-width="1" />
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• SnowflakeSqlApi</text>
  <text x="14" y="70" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• COPY INTO staging</text>
  <text x="14" y="88" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Metadata track</text>
</g>
<g transform="translate(615, 245)">
  <rect width="160" height="106" rx="8" fill="url(#card-amber)" stroke="#fbbf24" stroke-width="1.5" />
  <text x="80.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Transform Marts</text>
  <line x1="12" y1="34" x2="148" y2="34" stroke="#334155" stroke-width="1" />
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• DbtRunOperator</text>
  <text x="14" y="70" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Pushdown warehouse</text>
  <text x="14" y="88" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Test assertions</text>
</g>
<g transform="translate(800, 245)">
  <rect width="140" height="106" rx="8" fill="url(#card-green)" stroke="#34d399" stroke-width="1.5" />
  <text x="70.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Notify Slack</text>
  <line x1="12" y1="34" x2="128" y2="34" stroke="#334155" stroke-width="1" />
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• SlackWebhookOp</text>
  <text x="14" y="70" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Push runtime stats</text>
  <text x="14" y="88" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• SLA confirmation</text>
</g>
<g id="connectors"><line x1="220" y1="282" x2="245" y2="282" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr-b)" />
<line x1="405" y1="282" x2="430" y2="282" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arr-c)" />
<line x1="590" y1="282" x2="615" y2="282" stroke="#c084fc" stroke-width="1.8" marker-end="url(#arr-p)" />
<line x1="775" y1="282" x2="800" y2="282" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arr-a)" />
</g></svg>