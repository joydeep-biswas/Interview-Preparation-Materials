<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="980" height="420" rx="10" fill="url(#bg)"/>
  <text x="490.0" y="36" fill="#f8fafc" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Push vs. Pull Ingestion Architecture: Polling Overhead vs. Event Push</text>
  <text x="490.0" y="58" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Consumer-Initiated Ingestion with Wasted Polling vs. Producer Proactive Webhook Delivery</text>
  
  
    <rect x="30" y="95" width="430" height="290" rx="10" fill="#261a05" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="46" y="117" fill="#fde68a" font-size="12" font-family="system-ui, sans-serif" font-weight="bold">1. Pull Model: Consumer Initiates Polling</text>
  
    <rect x="45" y="140" width="180" height="85" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="135.0" y="166" fill="#fde68a" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Ingestion Worker</text>
    <text x="135.0" y="182" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Airflow / Python</text>
    <rect x="167" y="150" width="52" height="18" rx="9" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="193.0" y="162" fill="#f59e0b" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">POLLER</text>
    <circle cx="61" cy="195" r="2" fill="#f59e0b"/>
    <text x="69" y="198" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Calls GET /orders every 60s</text>
    <circle cx="61" cy="211" r="2" fill="#f59e0b"/>
    <text x="69" y="214" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Wasted compute on empty calls</text>
  
    <rect x="260" y="140" width="185" height="85" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="352.5" y="166" fill="#fde68a" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Source REST API</text>
    <text x="352.5" y="182" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Transactional Database</text>
    <rect x="408" y="150" width="31" height="18" rx="9" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="423.5" y="162" fill="#f59e0b" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">API</text>
    <circle cx="276" cy="195" r="2" fill="#f59e0b"/>
    <text x="284" y="198" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Responds with 0 rows</text>
    <circle cx="276" cy="211" r="2" fill="#f59e0b"/>
    <text x="284" y="214" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Throttles on high poll freq</text>
  
    <rect x="45" y="240" width="400" height="125" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="245.0" y="266" fill="#fde68a" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Drawbacks of Pull Polling</text>
    <text x="245.0" y="282" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Inefficient Network Overhead</text>
    <rect x="338" y="250" width="101" height="18" rx="9" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="388.5" y="262" fill="#f59e0b" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">POLL OVERHEAD</text>
    <circle cx="61" cy="295" r="2" fill="#f59e0b"/>
    <text x="69" y="298" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">1. Polling interval creates inherent data latency (1 to 15 minutes).</text>
    <circle cx="61" cy="311" r="2" fill="#f59e0b"/>
    <text x="69" y="314" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">2. 95% of API requests return empty results, wasting network &amp;amp; CPU.</text>
    <circle cx="61" cy="327" r="2" fill="#f59e0b"/>
    <text x="69" y="330" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">3. High risk of getting rate-limited (HTTP 429) by upstream SaaS provider.</text>
    <circle cx="61" cy="343" r="2" fill="#f59e0b"/>
    <text x="69" y="346" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">4. Does not scale well with thousands of independent data entities.</text>

  
    <line x1="225" y1="170" x2="260" y2="170" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-a)"/><text x="242.5" y="162.0" fill="#f59e0b" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">GET (Poll)</text>
  
    <line x1="260" y1="195" x2="225" y2="195" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-a)" stroke-dasharray="4,4"/><text x="242.5" y="209" fill="#f59e0b" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">0 rows</text>

  
    <rect x="520" y="95" width="430" height="290" rx="10" fill="#06231a" stroke="#10b981" stroke-width="1.5"/>
    <text x="536" y="117" fill="#6ee7b7" font-size="12" font-family="system-ui, sans-serif" font-weight="bold">2. Push Model: Producer Proactively Emits</text>
  
    <rect x="535" y="140" width="180" height="85" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="625.0" y="166" fill="#6ee7b7" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Producer Server</text>
    <text x="625.0" y="182" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Source Application</text>
    <rect x="650" y="150" width="59" height="18" rx="9" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="679.5" y="162" fill="#10b981" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">EMITTER</text>
    <circle cx="551" cy="195" r="2" fill="#10b981"/>
    <text x="559" y="198" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Event-driven architecture</text>
    <circle cx="551" cy="211" r="2" fill="#10b981"/>
    <text x="559" y="214" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Emits event on checkout</text>
  
    <rect x="750" y="140" width="185" height="85" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="842.5" y="166" fill="#6ee7b7" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Ingestion Webhook</text>
    <text x="842.5" y="182" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Cloud Event Gateway</text>
    <rect x="870" y="150" width="59" height="18" rx="9" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="899.5" y="162" fill="#10b981" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">WEBHOOK</text>
    <circle cx="766" cy="195" r="2" fill="#10b981"/>
    <text x="774" y="198" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Receives HTTP POST</text>
    <circle cx="766" cy="211" r="2" fill="#10b981"/>
    <text x="774" y="214" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Instantly buffers to Kafka</text>
  
    <rect x="535" y="240" width="400" height="125" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="735.0" y="266" fill="#6ee7b7" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Benefits of Push Model</text>
    <text x="735.0" y="282" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Zero-Latency Event Delivery</text>
    <rect x="856" y="250" width="73" height="18" rx="9" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="892.5" y="262" fill="#10b981" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">REAL-TIME</text>
    <circle cx="551" cy="295" r="2" fill="#10b981"/>
    <text x="559" y="298" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">1. Near-zero data latency: Events arrive within 50 milliseconds of occurrence.</text>
    <circle cx="551" cy="311" r="2" fill="#10b981"/>
    <text x="559" y="314" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">2. Zero wasted compute: Gateway only fires when real data is generated.</text>
    <circle cx="551" cy="327" r="2" fill="#10b981"/>
    <text x="559" y="330" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">3. High throughput: Buffers directly into Kafka / Event Hubs for downstream.</text>
    <circle cx="551" cy="343" r="2" fill="#10b981"/>
    <text x="559" y="346" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">4. Requires public HTTPS endpoint and HMAC-SHA256 signature verification.</text>

  
    <line x1="715" y1="182" x2="750" y2="182" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/><text x="732.5" y="174.0" fill="#10b981" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">HTTP POST (Instant)</text>

</svg>