<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%" style="background-color: #0b1120; max-width: 100%; height: auto;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="card-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#451a03" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="card-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="card-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="card-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#155e75" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22d3ee"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Base Canvas -->
  <rect width="1000" height="500" rx="10" fill="url(#bg)"/>

  <!-- Diagram Header -->
  <g transform="translate(0, 0)">
    <text x="500.0" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#f8fafc">Azure Synapse Dedicated SQL Pool (MPP) Architecture</text>
    <text x="500.0" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Shared-nothing massively parallel processing: Control node query coordination, compute nodes, and 60 storage distributions</text>
  </g>

  <!-- Diagram Body -->
  <g transform="translate(40, 95)">
  <rect width="230" height="380" rx="10" fill="#0f172a" fill-opacity="0.08" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="14" y="-12" width="234" height="22" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="131.0" y="3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">1. Control Node (The Brain)</text>
</g>
<g transform="translate(55, 130)">
  <rect width="200" height="85" rx="8" fill="url(#card-blue)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="100.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Client Apps</text>
  <line x1="12" y1="34" x2="188" y2="34" stroke="#334155" stroke-width="1"/>
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Power BI, SSMS, Python</text>
  <text x="14" y="70" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Port 1433 T-SQL</text>
  <text x="14" y="88" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Standard TDS protocol</text>
</g>
<g transform="translate(55, 250)">
  <rect width="200" height="195" rx="8" fill="url(#card-purple)" stroke="#c084fc" stroke-width="1.5"/>
  <text x="100.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Control Node Engine</text>
  <line x1="12" y1="34" x2="188" y2="34" stroke="#334155" stroke-width="1"/>
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Distributed Query Engine</text>
  <text x="14" y="70" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Translates T-SQL into MPP plans</text>
  <text x="14" y="88" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Coordinates distributed transactions</text>
  <text x="14" y="106" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Aggregates results for client</text>
</g>
<line x1="155" y1="215" x2="155" y2="250" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr-b)"/>
<text x="155.0" y="226.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">T-SQL Connection</text>
<g transform="translate(310, 95)">
  <rect width="300" height="380" rx="10" fill="#0f172a" fill-opacity="0.08" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="14" y="-12" width="202" height="22" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="115.0" y="3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#34d399">2. Compute Layer (DWUs)</text>
</g>
<g transform="translate(325, 130)">
  <rect width="270" height="95" rx="8" fill="url(#card-green)" stroke="#34d399" stroke-width="1.5"/>
  <text x="135.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#a7f3d0">Compute Node 1</text>
  <line x1="12" y1="34" x2="258" y2="34" stroke="#334155" stroke-width="1"/>
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Runs SQL Server engine</text>
  <text x="14" y="70" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Executes DMS work tasks</text>
  <text x="14" y="88" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Manages Distributions 1..20</text>
</g>
<g transform="translate(325, 240)">
  <rect width="270" height="95" rx="8" fill="url(#card-green)" stroke="#34d399" stroke-width="1.5"/>
  <text x="135.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#a7f3d0">Compute Node 2</text>
  <line x1="12" y1="34" x2="258" y2="34" stroke="#334155" stroke-width="1"/>
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Runs SQL Server engine</text>
  <text x="14" y="70" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Executes DMS work tasks</text>
  <text x="14" y="88" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Manages Distributions 21..40</text>
</g>
<g transform="translate(325, 350)">
  <rect width="270" height="95" rx="8" fill="url(#card-green)" stroke="#34d399" stroke-width="1.5"/>
  <text x="135.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#a7f3d0">Compute Node N</text>
  <line x1="12" y1="34" x2="258" y2="34" stroke="#334155" stroke-width="1"/>
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Scalable (1 to 60 nodes)</text>
  <text x="14" y="70" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Pause / Resume compute</text>
  <text x="14" y="88" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Manages Distributions 41..60</text>
</g>
<path d="M 255.0 280.0 L 265.0 280.0 C 288.0 280.0, 288.0 177.0, 311.0 177.0 L 325.0 177.0" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arr-g)"/>
<path d="M 255.0 330.0 L 265.0 330.0 C 288.0 330.0, 288.0 287.0, 311.0 287.0 L 325.0 287.0" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arr-g)"/>
<path d="M 255.0 380.0 L 265.0 380.0 C 288.0 380.0, 288.0 397.0, 311.0 397.0 L 325.0 397.0" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arr-g)"/>
<g transform="translate(650, 95)">
  <rect width="310" height="380" rx="10" fill="#0f172a" fill-opacity="0.08" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="14" y="-12" width="290" height="22" rx="4" fill="#0f172a" stroke="#22d3ee" stroke-width="1"/>
  <text x="159.0" y="3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#22d3ee">3. Storage Layer: 60 Distributions</text>
</g>
<g transform="translate(670, 130)">
  <rect width="270" height="95" rx="8" fill="url(#card-cyan)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="135.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Distributions 1..20</text>
  <line x1="12" y1="34" x2="258" y2="34" stroke="#334155" stroke-width="1"/>
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Azure Premium Storage</text>
  <text x="14" y="70" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Round-Robin / Hash partitions</text>
  <text x="14" y="88" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Clustered Columnstore Index</text>
</g>
<g transform="translate(670, 240)">
  <rect width="270" height="95" rx="8" fill="url(#card-cyan)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="135.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Distributions 21..40</text>
  <line x1="12" y1="34" x2="258" y2="34" stroke="#334155" stroke-width="1"/>
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Azure Premium Storage</text>
  <text x="14" y="70" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Independent I/O queues</text>
  <text x="14" y="88" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Transparent Data Encryption</text>
</g>
<g transform="translate(670, 350)">
  <rect width="270" height="95" rx="8" fill="url(#card-cyan)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="135.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Distributions 41..60</text>
  <line x1="12" y1="34" x2="258" y2="34" stroke="#334155" stroke-width="1"/>
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Azure Premium Storage</text>
  <text x="14" y="70" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Replicated dimension caching</text>
  <text x="14" y="88" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Automatic backup snapshots</text>
</g>
<line x1="595" y1="177" x2="670" y2="177" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arr-c)"/>
<line x1="595" y1="287" x2="670" y2="287" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arr-c)"/>
<line x1="595" y1="397" x2="670" y2="397" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arr-c)"/>
</svg>