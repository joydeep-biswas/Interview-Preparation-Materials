<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="980" height="420" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="490.0" y="36" fill="#f8fafc" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Statistical Anomaly Detection in Ingestion Volumes</text>
  <text x="490.0" y="58" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Z-Score Evaluation (Z &gt; 3.0) Detecting Data Outages and Sudden Spikes Before Gold Marts</text>
  
  
    <rect x="30" y="95" width="290" height="290" rx="10" fill="#0b1329" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="46" y="117" fill="#93c5fd" font-size="12" font-family="system-ui, sans-serif" font-weight="bold">1. Metric Extraction &amp; Baseline</text>
  
    <rect x="45" y="135" width="260" height="235" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="59" y="158" fill="#93c5fd" font-size="11" font-family="system-ui, sans-serif" font-weight="bold">30-Day Rolling Stats</text>
    <text x="59" y="174" fill="#94a3b8" font-size="9.5" font-family="system-ui, sans-serif">Baseline Training Window</text>
    <rect x="191" y="145" width="108" height="18" rx="9" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <text x="245.0" y="157" fill="#3b82f6" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">BASELINE STATS</text>
    <circle cx="61" cy="190" r="2" fill="#3b82f6"/>
    <text x="69" y="193" fill="#cbd5e1" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start">Daily ingestion row counts for 30 days.</text>
    <circle cx="61" cy="206" r="2" fill="#3b82f6"/>
    <text x="69" y="209" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Calculates Rolling Mean (μ):</text>
    <circle cx="61" cy="222" r="2" fill="#3b82f6"/>
    <text x="69" y="225" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">μ = 1,000,000 rows/day</text>
    <circle cx="61" cy="238" r="2" fill="#3b82f6"/>
    <text x="69" y="241" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Calculates Rolling Standard Dev (σ):</text>
    <circle cx="61" cy="254" r="2" fill="#3b82f6"/>
    <text x="69" y="257" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">σ = 50,000 rows/day</text>
    <circle cx="61" cy="270" r="2" fill="#3b82f6"/>
    <text x="69" y="273" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Lower Bound (-3σ): 850,000 rows</text>
    <circle cx="61" cy="286" r="2" fill="#3b82f6"/>
    <text x="69" y="289" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Upper Bound (+3σ): 1,150,000 rows</text>

  
    <rect x="345" y="95" width="290" height="290" rx="10" fill="#1c0d2e" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="361" y="117" fill="#c084fc" font-size="12" font-family="system-ui, sans-serif" font-weight="bold">2. Daily Execution Z-Score Probe</text>
  
    <rect x="360" y="135" width="260" height="235" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="374" y="158" fill="#c084fc" font-size="11.5" font-family="system-ui, sans-serif" font-weight="bold">Statistical Z-Score</text>
    <text x="374" y="174" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">Z = |X - μ| / σ</text>
    <rect x="520" y="145" width="94" height="18" rx="9" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
    <text x="567.0" y="157" fill="#8b5cf6" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Z-SCORE EVAL</text>
    <circle cx="376" cy="190" r="2" fill="#8b5cf6"/>
    <text x="384" y="193" fill="#cbd5e1" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start">Today's Count X = 400,000 (Extraction drop)</text>
    <circle cx="376" cy="210" r="2" fill="#8b5cf6"/>
    <text x="384" y="213" fill="#cbd5e1" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start">Calculates deviation:</text>
    <circle cx="376" cy="228" r="2" fill="#8b5cf6"/>
    <text x="384" y="231" fill="#cbd5e1" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start">|400,000 - 1,000,000| = 600,000</text>
    <circle cx="376" cy="246" r="2" fill="#8b5cf6"/>
    <text x="384" y="249" fill="#cbd5e1" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start">Z = 600,000 / 50,000 = 12.0σ</text>
    <circle cx="376" cy="264" r="2" fill="#8b5cf6"/>
    <text x="384" y="267" fill="#cbd5e1" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start">Evaluation: Z = 12.0 &gt; 3.0σ Threshold</text>
    <circle cx="376" cy="282" r="2" fill="#ef4444"/>
    <text x="384" y="285" fill="#fca5a5" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start" font-weight="bold">Result: EXTREME ANOMALY DETECTED!</text>

  
    <rect x="660" y="95" width="290" height="290" rx="10" fill="#260b0b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="676" y="117" fill="#fca5a5" font-size="12" font-family="system-ui, sans-serif" font-weight="bold">3. Automated Quarantine Gate</text>
  
    <rect x="675" y="135" width="260" height="235" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="689" y="158" fill="#fca5a5" font-size="11.5" font-family="system-ui, sans-serif" font-weight="bold">Circuit Breaker</text>
    <text x="689" y="174" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">Halt Before Corruption</text>
    <rect x="828" y="145" width="101" height="18" rx="9" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
    <text x="878.5" y="157" fill="#ef4444" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">HALT PIPELINE</text>
    <circle cx="691" cy="190" r="2" fill="#ef4444"/>
    <text x="699" y="193" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Action 1: Halts downstream dbt transformation jobs.</text>
    <circle cx="691" cy="206" r="2" fill="#ef4444"/>
    <text x="699" y="206" fill="#cbd5e1" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start">Action 2: Blocks corrupted 400k dataset</text>
    <text x="699" y="220" fill="#cbd5e1" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start">from overwriting production Gold mart.</text>
    <circle cx="691" cy="222" r="2" fill="#ef4444"/>
    <text x="699" y="234" fill="#cbd5e1" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start">Action 3: Fires alert to on-call team.</text>
    <circle cx="691" cy="238" r="2" fill="#ef4444"/>
    <text x="699" y="248" fill="#cbd5e1" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start">Action 4: Dashboards serve yesterday's</text>
    <text x="699" y="262" fill="#cbd5e1" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start">validated data safely without outage.</text>

  
    <line x1="295" y1="250" x2="360" y2="250" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arr-p)"/><text x="327.5" y="242" fill="#8b5cf6" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Daily Count</text>
  
    <line x1="605" y1="250" x2="675" y2="250" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr-r)"/><text x="640.0" y="242" fill="#ef4444" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Z &gt; 3.0</text>

</svg>