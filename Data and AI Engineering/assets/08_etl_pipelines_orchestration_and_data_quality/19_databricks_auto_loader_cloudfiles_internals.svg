  <rect width="980" height="420" rx="10" fill="url(#bg)"/>
  <text x="490.0" y="36" fill="#f8fafc" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Databricks Auto Loader (cloudFiles) Execution Architecture</text>
  <text x="490.0" y="58" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Cloud Notification Queues, Automatic Schema Inference, and Rescued Column Tracking</text>
  
  
    <rect x="40" y="110" width="200" height="150" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="140.0" y="136" fill="#93c5fd" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">S3 / ADLS Landing Bucket</text>
    <text x="140.0" y="152" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">s3://landing/incoming/</text>
    <rect x="175" y="120" width="59" height="18" rx="9" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <text x="204.5" y="132" fill="#3b82f6" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">STORAGE</text>
    <circle cx="56" cy="165" r="2" fill="#3b82f6"/>
    <text x="64" y="168" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Files uploaded continuously</text>
    <circle cx="56" cy="181" r="2" fill="#3b82f6"/>
    <text x="64" y="184" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">part-001.json, part-002.json...</text>
    <circle cx="56" cy="197" r="2" fill="#3b82f6"/>
    <text x="64" y="200" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Cloud storage emits event:</text>
    <circle cx="56" cy="213" r="2" fill="#3b82f6"/>
    <text x="64" y="216" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">s3:ObjectCreated:Put</text>
    <circle cx="56" cy="229" r="2" fill="#3b82f6"/>
    <text x="64" y="232" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Zero directory file listing needed</text>

  
    <rect x="275" y="110" width="210" height="150" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="380.0" y="136" fill="#fde68a" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Cloud Queue Subsystem</text>
    <text x="380.0" y="152" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">AWS SQS / Azure Event Grid</text>
    <rect x="434" y="120" width="45" height="18" rx="9" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="456.5" y="132" fill="#f59e0b" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">QUEUE</text>
    <circle cx="291" cy="165" r="2" fill="#f59e0b"/>
    <text x="299" y="168" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Event notification buffered</text>
    <circle cx="291" cy="181" r="2" fill="#f59e0b"/>
    <text x="299" y="184" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Holds exact file URI path</text>
    <circle cx="291" cy="197" r="2" fill="#f59e0b"/>
    <text x="299" y="200" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Provides O(1) file discovery</text>
    <circle cx="291" cy="213" r="2" fill="#f59e0b"/>
    <text x="299" y="216" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Scales to millions of files</text>
    <circle cx="291" cy="229" r="2" fill="#f59e0b"/>
    <text x="299" y="232" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Eliminates expensive LIST calls</text>

  
    <rect x="520" y="110" width="220" height="150" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="630.0" y="136" fill="#6ee7b7" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Auto Loader Stream Engine</text>
    <text x="630.0" y="152" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">spark.readStream.format('cloudFiles')</text>
    <rect x="647" y="120" width="87" height="18" rx="9" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="690.5" y="132" fill="#10b981" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">AUTO LOADER</text>
    <circle cx="536" cy="165" r="2" fill="#10b981"/>
    <text x="544" y="168" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Continuously consumes SQS events</text>
    <circle cx="536" cy="181" r="2" fill="#10b981"/>
    <text x="544" y="184" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Pulls file bytes via parallel tasks</text>
    <circle cx="536" cy="197" r="2" fill="#10b981"/>
    <text x="544" y="200" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Schema inference &amp; evolution enabled</text>
    <circle cx="536" cy="213" r="2" fill="#10b981"/>
    <text x="544" y="216" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Stores schema in checkpoint path</text>
    <circle cx="536" cy="229" r="2" fill="#10b981"/>
    <text x="544" y="232" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Appends rescued data on type drift</text>

  
    <rect x="775" y="110" width="175" height="150" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="862.5" y="136" fill="#67e8f9" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Bronze Delta Table</text>
    <text x="862.5" y="152" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Raw Ingestion Lake</text>
    <rect x="892" y="120" width="52" height="18" rx="9" fill="#0f172a" stroke="#06b6d4" stroke-width="1"/>
    <text x="918.0" y="132" fill="#06b6d4" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">BRONZE</text>
    <circle cx="791" cy="165" r="2" fill="#06b6d4"/>
    <text x="799" y="168" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Append-only Parquet</text>
    <circle cx="791" cy="181" r="2" fill="#06b6d4"/>
    <text x="799" y="184" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">ACID transaction log</text>
    <circle cx="791" cy="197" r="2" fill="#06b6d4"/>
    <text x="799" y="200" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Captures bad data into:</text>
    <circle cx="791" cy="213" r="2" fill="#06b6d4"/>
    <text x="799" y="216" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">_rescued_data column</text>
    <circle cx="791" cy="229" r="2" fill="#06b6d4"/>
    <text x="799" y="232" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Zero dropped records</text>

  
    <line x1="240" y1="185" x2="275" y2="185" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-a)"/><text x="257.5" y="177.0" fill="#f59e0b" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">ObjectCreated</text>
  
    <line x1="485" y1="185" x2="520" y2="185" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/><text x="502.5" y="177.0" fill="#10b981" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Consume Queue</text>
  
    <line x1="740" y1="185" x2="775" y2="185" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arr-c)"/><text x="757.5" y="177.0" fill="#06b6d4" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Commit Delta</text>

  
    <rect x="40" y="290" width="910" height="95" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="495.0" y="316" fill="#6ee7b7" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Auto Loader Schema Rescue Invariant: Zero Data Loss on Unexpected Schema Drift</text>
    <text x="495.0" y="332" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">How cloudFiles Protects Against Malformed and Unannounced Producer Schema Edits</text>
    <rect x="766" y="300" width="178" height="18" rx="9" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="855.0" y="312" fill="#10b981" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">RESCUED COLUMN INVARIANT</text>
    <circle cx="56" cy="345" r="2" fill="#10b981"/>
    <text x="64" y="348" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">If an upstream producer sends a string in a column defined as integer, or adds 5 unannounced new columns:</text>
    <circle cx="56" cy="361" r="2" fill="#10b981"/>
    <text x="64" y="364" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Auto Loader automatically routes the corrupted or unmapped fields into the `_rescued_data` JSON column without crashing the pipeline!</text>
    <circle cx="56" cy="377" r="2" fill="#10b981"/>
    <text x="64" y="380" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">The streaming pipeline continues operating 24/7 with 100% data availability.</text>

</svg>