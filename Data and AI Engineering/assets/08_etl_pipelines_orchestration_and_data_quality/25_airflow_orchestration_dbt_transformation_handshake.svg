    <text x="500.0" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Decoupling workflow scheduling and infrastructure control from in-warehouse SQL transformations</text>
  </g>

  <!-- Diagram Body -->
  <g transform="translate(40, 95)">
  <rect width="920" height="160" rx="10" fill="#0f172a" fill-opacity="0.08" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="14" y="-12" width="450" height="22" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
