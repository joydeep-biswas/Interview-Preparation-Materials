    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="980" height="420" rx="10" fill="url(#bg)"/>
  <text x="490.0" y="36" fill="#f8fafc" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Micro-Batching Execution Mechanics &amp; Checkpoint Commit</text>
  <text x="490.0" y="58" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Spark Structured Streaming: Interval Polling, Distributed DAG, and Offset Checkpointing</text>
  
  
    <rect x="40" y="110" width="200" height="150" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="140.0" y="136" fill="#93c5fd" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">1. Kafka Event Buffer</text>
    <text x="140.0" y="152" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Unbounded Commit Log</text>
    <rect x="189" y="120" width="45" height="18" rx="9" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <text x="211.5" y="132" fill="#3b82f6" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">KAFKA</text>
    <circle cx="56" cy="165" r="2" fill="#3b82f6"/>
    <text x="64" y="168" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Events buffer in Kafka partitions</text>
    <circle cx="56" cy="181" r="2" fill="#3b82f6"/>
    <text x="64" y="184" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Offsets advance continuously:</text>
    <circle cx="56" cy="197" r="2" fill="#3b82f6"/>
    <text x="64" y="200" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Partition 0: Offset 1000..1500</text>
    <circle cx="56" cy="213" r="2" fill="#3b82f6"/>
    <text x="64" y="216" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Partition 1: Offset 2000..2500</text>
    <circle cx="56" cy="229" r="2" fill="#3b82f6"/>
    <text x="64" y="232" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Waiting for engine trigger</text>

  
    <rect x="275" y="110" width="220" height="150" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="385.0" y="136" fill="#fde68a" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">2. Driver Coordinator</text>
    <text x="385.0" y="152" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Trigger Interval (e.g. 5s)</text>
    <rect x="437" y="120" width="52" height="18" rx="9" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="463.0" y="132" fill="#f59e0b" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">DRIVER</text>
    <circle cx="291" cy="165" r="2" fill="#f59e0b"/>
    <text x="299" y="168" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Trigger timer fires (5000ms)</text>
    <circle cx="291" cy="181" r="2" fill="#f59e0b"/>
    <text x="299" y="184" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Driver polls Kafka latest offsets</text>
    <circle cx="291" cy="197" r="2" fill="#f59e0b"/>
    <text x="299" y="200" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Calculates start/end offset range</text>
    <circle cx="291" cy="213" r="2" fill="#f59e0b"/>
    <text x="299" y="216" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Writes start offset to checkpoint</text>
    <circle cx="291" cy="229" r="2" fill="#f59e0b"/>
    <text x="299" y="232" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Constructs physical task DAG</text>

  
    <rect x="530" y="110" width="210" height="150" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="635.0" y="136" fill="#6ee7b7" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">3. Worker Tasks (RAM)</text>
    <text x="635.0" y="152" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Distributed Execution</text>
    <rect x="675" y="120" width="59" height="18" rx="9" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="704.5" y="132" fill="#10b981" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">WORKERS</text>
    <circle cx="546" cy="165" r="2" fill="#10b981"/>
    <text x="554" y="168" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Workers fetch assigned partitions</text>
    <circle cx="546" cy="181" r="2" fill="#10b981"/>
    <text x="554" y="184" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Applies filtering &amp; transformations</text>
    <circle cx="546" cy="197" r="2" fill="#10b981"/>
    <text x="554" y="200" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Evaluates window aggregations</text>
    <circle cx="546" cy="213" r="2" fill="#10b981"/>
    <text x="554" y="216" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Stages micro-batch output</text>
    <circle cx="546" cy="229" r="2" fill="#10b981"/>
    <text x="554" y="232" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Zero data loss on node failure</text>

  
    <rect x="775" y="110" width="175" height="150" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="862.5" y="136" fill="#c084fc" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">4. Sink &amp; Commit</text>
    <text x="862.5" y="152" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Atomic Lake Commit</text>
    <rect x="892" y="120" width="52" height="18" rx="9" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
    <text x="918.0" y="132" fill="#8b5cf6" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">COMMIT</text>
    <circle cx="791" cy="165" r="2" fill="#8b5cf6"/>
    <text x="799" y="168" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Appends micro-batch Parquet</text>
    <circle cx="791" cy="181" r="2" fill="#8b5cf6"/>
    <text x="799" y="184" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Writes commit marker file</text>
    <circle cx="791" cy="197" r="2" fill="#8b5cf6"/>
    <text x="799" y="200" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Updates Delta / Iceberg log</text>
    <circle cx="791" cy="213" r="2" fill="#8b5cf6"/>
    <text x="799" y="216" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Advances stream checkpoint</text>
    <circle cx="791" cy="229" r="2" fill="#8b5cf6"/>
    <text x="799" y="232" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Cycle repeats for next batch</text>

  
    <line x1="240" y1="185" x2="275" y2="185" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr-b)"/><text x="257.5" y="177.0" fill="#3b82f6" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Poll Offsets</text>
  
    <line x1="495" y1="185" x2="530" y2="185" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-a)"/><text x="512.5" y="177.0" fill="#f59e0b" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Schedule Tasks</text>
  
    <line x1="740" y1="185" x2="775" y2="185" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/><text x="757.5" y="177.0" fill="#10b981" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Flush Batch</text>

  
    <rect x="40" y="290" width="910" height="95" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="495.0" y="316" fill="#67e8f9" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Fault Tolerance Invariant: Exactly-Once Processing via Replayable Offsets</text>
    <text x="495.0" y="332" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">End-to-End Idempotency in Spark Structured Streaming</text>
    <rect x="850" y="300" width="94" height="18" rx="9" fill="#0f172a" stroke="#06b6d4" stroke-width="1"/>
    <text x="897.0" y="312" fill="#06b6d4" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">EXACTLY-ONCE</text>
    <circle cx="56" cy="345" r="2" fill="#06b6d4"/>
    <text x="64" y="348" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">If a worker node crashes mid-batch, the driver detects task failure and reschedules the exact same offset slice (e.g. 1000..1500).</text>
    <circle cx="56" cy="361" r="2" fill="#06b6d4"/>
    <text x="64" y="364" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Because the sink write and the commit log are atomic, no duplicate records ever commit to the Lakehouse Gold layer!</text>

</svg>