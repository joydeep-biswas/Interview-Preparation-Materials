<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="980" height="420" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="490.0" y="36" fill="#f8fafc" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Historical Backfilling Strategies: Chunked vs. Monolithic</text>
  <text x="490.0" y="58" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Comparing Fatal Full-Range Overloads with Partition-Isolated Day-by-Day Orchestration</text>
  
  
    <rect x="30" y="95" width="430" height="290" rx="10" fill="#260b0b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="46" y="117" fill="#fca5a5" font-size="12" font-family="system-ui, sans-serif" font-weight="bold">Anti-Pattern: Monolithic Backfill</text>
  
    <rect x="45" y="140" width="400" height="75" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="245.0" y="166" fill="#fca5a5" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Naive Monolithic Backfill</text>
    <text x="245.0" y="182" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Run Full 5-Year Date Range at Once</text>
    <circle cx="61" cy="198" r="2" fill="#ef4444"/>
    <text x="69" y="201" fill="#cbd5e1" font-size="9.5" font-family="system-ui, sans-serif" text-anchor="start">Single 2B-row query: WHERE date BETWEEN '2021-01-01' AND '2026-01-01'</text>
  
    <rect x="45" y="230" width="400" height="135" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="245.0" y="256" fill="#fca5a5" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Catastrophic Failure Modes</text>
    <text x="245.0" y="272" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Cluster Crash &amp; Source Database Outage</text>
    <rect x="345" y="240" width="94" height="18" rx="9" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
    <text x="392.0" y="252" fill="#ef4444" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">CATASTROPHIC</text>
    <circle cx="61" cy="285" r="2" fill="#ef4444"/>
    <text x="69" y="288" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">1. Table locks source DB tables; downs customer-facing web application!</text>
    <circle cx="61" cy="301" r="2" fill="#ef4444"/>
    <text x="69" y="304" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">2. Spark Driver JVM runs out of memory building monolithic task graph.</text>
    <circle cx="61" cy="317" r="2" fill="#ef4444"/>
    <text x="69" y="320" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">3. Single transient failure after 18 hours aborts 100% of the entire run!</text>
    <circle cx="61" cy="333" r="2" fill="#ef4444"/>
    <text x="69" y="336" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">4. Zero incremental checkpointing or progress visibility.</text>

  
    <line x1="245" y1="215" x2="245" y2="230" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr-r)"/>

  
    <rect x="520" y="95" width="430" height="290" rx="10" fill="#06231a" stroke="#10b981" stroke-width="1.5"/>
    <text x="536" y="117" fill="#6ee7b7" font-size="12" font-family="system-ui, sans-serif" font-weight="bold">Recommended: Idempotent Chunked Backfill</text>
  
    <rect x="535" y="135" width="400" height="70" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="735.0" y="161" fill="#6ee7b7" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Partitioned Day-by-Day Orchestration</text>
    <text x="735.0" y="177" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Iterative Bounded Slices</text>
    <circle cx="551" cy="190" r="2" fill="#10b981"/>
    <text x="559" y="190" fill="#cbd5e1" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start">Schedules 1 task per day in parallel:</text>
    <text x="559" y="204" fill="#cbd5e1" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start">[Chunk 1] &#x2192; [Chunk 2] &#x2192; [Chunk N]</text>
  
    <rect x="535" y="220" width="400" height="145" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="735.0" y="246" fill="#6ee7b7" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Safe Resilient Execution</text>
    <text x="735.0" y="262" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Idempotent Partition Overwrite</text>
    <rect x="856" y="230" width="73" height="18" rx="9" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="892.5" y="242" fill="#10b981" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">RESILIENT</text>
    <circle cx="551" cy="275" r="2" fill="#10b981"/>
    <text x="559" y="278" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">1. Bounded memory: Each task consumes only 500MB of RAM.</text>
    <circle cx="551" cy="291" r="2" fill="#10b981"/>
    <text x="559" y="294" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">2. Minimal source DB lock contention (short 30-second queries).</text>
    <circle cx="551" cy="307" r="2" fill="#10b981"/>
    <text x="559" y="306" fill="#cbd5e1" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start">3. Failure isolation: If Day 14 fails, ONLY Day 14</text>
    <text x="559" y="320" fill="#cbd5e1" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start">retries! Days 1-13 remain safely committed.</text>
    <circle cx="551" cy="337" r="2" fill="#10b981"/>
    <text x="559" y="340" fill="#cbd5e1" font-size="10.5" font-family="system-ui, sans-serif" text-anchor="start">4. Enables parallel concurrent worker backfilling (e.g. 5 days at a time).</text>

  
    <line x1="735" y1="205" x2="735" y2="220" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/>

</svg>