<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <!-- Node Surface Gradients -->
    <linearGradient id="card-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142e2b"/>
      <stop offset="100%" stop-color="#091d1a"/>
    </linearGradient>
    <linearGradient id="card-amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d2212"/>
      <stop offset="100%" stop-color="#181308"/>
    </linearGradient>
    <linearGradient id="card-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#261b3d"/>
      <stop offset="100%" stop-color="#130c24"/>
    </linearGradient>
    <linearGradient id="card-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b181e"/>
      <stop offset="100%" stop-color="#1f090d"/>
    </linearGradient>
    <linearGradient id="card-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#112d38"/>
      <stop offset="100%" stop-color="#071920"/>
    </linearGradient>

    <!-- Matched Arrow Markers -->
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#22d3ee"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8"/>
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Dark Card Background -->
  <rect width="1000" height="500" rx="12" fill="url(#bg)"/>
  <rect width="1000" height="500" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Centered Header Section -->
  <g id="header-group">
    <text x="500" y="32" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0.3">SFT Loss Curves: Healthy Convergence vs. Memorization &amp; Overfitting</text>
    <text x="500" y="52" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400">Tracking Train vs. Validation Cross-Entropy Loss to Identify the Early Stopping Checkpoint</text>
  </g>

  <!-- Diagram Inner Content -->
  
  <!-- Chart Background Area -->
  <rect x="120" y="100" width="760" height="300" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Grid Lines -->
  <!-- Horizontal Grid Lines (Loss 0.0 to 2.5) -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="120" y1="100" x2="880" y2="100"/>
    <line x1="120" y1="160" x2="880" y2="160"/>
    <line x1="120" y1="220" x2="880" y2="220"/>
    <line x1="120" y1="280" x2="880" y2="280"/>
    <line x1="120" y1="340" x2="880" y2="340"/>
    <line x1="120" y1="400" x2="880" y2="400"/>
  </g>

  <!-- Y-Axis Labels -->
  <text x="105" y="105" text-anchor="end" fill="#94a3b8" font-family="monospace" font-size="11">2.5</text>
  <text x="105" y="165" text-anchor="end" fill="#94a3b8" font-family="monospace" font-size="11">2.0</text>
  <text x="105" y="225" text-anchor="end" fill="#94a3b8" font-family="monospace" font-size="11">1.5</text>
  <text x="105" y="285" text-anchor="end" fill="#94a3b8" font-family="monospace" font-size="11">1.0</text>
  <text x="105" y="345" text-anchor="end" fill="#94a3b8" font-family="monospace" font-size="11">0.5</text>
  <text x="105" y="405" text-anchor="end" fill="#94a3b8" font-family="monospace" font-size="11">0.0</text>
  <text x="60" y="250" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="700" transform="rotate(-90 60 250)">Cross-Entropy Loss</text>

  <!-- X-Axis Labels (Steps 100 to 800) -->
  <!-- Step width = (880 - 180) / 7 = 100px. Steps at: 180, 280, 380, 480, 580, 680, 780, 880 -->
  <text x="180" y="420" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">100</text>
  <text x="280" y="420" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">200</text>
  <text x="380" y="420" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">300</text>
  <text x="480" y="420" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">400</text>
  <text x="580" y="420" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">500</text>
  <text x="680" y="420" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">600</text>
  <text x="780" y="420" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">700</text>
  <text x="880" y="420" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">800</text>
  <text x="530" y="445" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="700">Optimization Training Steps</text>

  <!-- Overfitting Shaded Area (Step 400 to 880) -->
  <rect x="480" y="100" width="400" height="300" fill="#ef4444" fill-opacity="0.08"/>
  <line x1="480" y1="100" x2="480" y2="400" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="420" y="80" width="120" height="24" rx="4" fill="#181308" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="480" y="96" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="700">Optimal Checkpoint</text>

  <!-- Curve 1: Healthy Train Loss (Blue)
       Points: 100:2.1 (y=148), 200:1.6 (y=208), 300:1.3 (y=244), 400:1.1 (y=268), 500:0.95 (y=286), 600:0.85 (y=298), 700:0.78 (y=306), 800:0.72 (y=313) -->
  <path d="M 180 148 L 280 208 L 380 244 L 480 268 L 580 286 L 680 298 L 780 306 L 880 313" fill="none" stroke="#38bdf8" stroke-width="3"/>

  <!-- Curve 2: Healthy Val Loss (Green)
       Points: 100:2.15 (y=142), 200:1.65 (y=202), 300:1.35 (y=238), 400:1.15 (y=262), 500:1.02 (y=278), 600:0.94 (y=287), 700:0.88 (y=294), 800:0.84 (y=299) -->
  <path d="M 180 142 L 280 202 L 380 238 L 480 262 L 580 278 L 680 287 L 780 294 L 880 299" fill="none" stroke="#34d399" stroke-width="2.5" stroke-dasharray="6 3"/>

  <!-- Curve 3: Overfitting Val Loss (Red)
       Points: 100:2.15 (y=142), 200:1.65 (y=202), 300:1.38 (y=234), 400:1.25 (y=250), 500:1.35 (y=238), 600:1.60 (y=208), 700:1.95 (y=166), 800:2.30 (y=124) -->
  <path d="M 180 142 L 280 202 L 380 234 L 480 250 L 580 238 L 680 208 L 780 166 L 880 124" fill="none" stroke="#f87171" stroke-width="3"/>

  <!-- Legend -->
  <g transform="translate(620, 115)">
    <rect width="240" height="75" rx="6" fill="#0b1120" stroke="#334155" stroke-width="1"/>
    <!-- Item 1 -->
    <line x1="15" y1="20" x2="45" y2="20" stroke="#38bdf8" stroke-width="3"/>
    <text x="55" y="24" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">Train Loss (Healthy)</text>
    <!-- Item 2 -->
    <line x1="15" y1="40" x2="45" y2="40" stroke="#34d399" stroke-width="2.5" stroke-dasharray="4 2"/>
    <text x="55" y="44" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">Val Loss (Generalizing)</text>
    <!-- Item 3 -->
    <line x1="15" y1="60" x2="45" y2="60" stroke="#f87171" stroke-width="3"/>
    <text x="55" y="64" fill="#f87171" font-family="sans-serif" font-size="11" font-weight="600">Val Loss (Overfitting / Diverging)</text>
  </g>

  <!-- Annotation in Overfitting Area -->
  <text x="750" y="240" text-anchor="middle" fill="#f87171" font-family="sans-serif" font-size="11" font-weight="700">Divergence Zone</text>
  <text x="750" y="258" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="10">Model memorizes training data</text>
  <text x="750" y="272" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="10">and loses generalization</text>

</svg>