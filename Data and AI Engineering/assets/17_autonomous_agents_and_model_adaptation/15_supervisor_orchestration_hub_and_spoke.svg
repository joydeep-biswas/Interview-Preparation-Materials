<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="100%" height="100%" style="background-color: #0b1120; max-width: 100%; height: auto;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arr-b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8" />
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#4ade80" />
    </marker>
    <marker id="arr-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#fbbf24" />
    </marker>
    <marker id="arr-p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#c084fc" />
    </marker>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#f87171" />
    </marker>
    <marker id="arr-c" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#2dd4bf" />
    </marker>
    <marker id="arr-s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Base Background -->
  <rect width="980" height="440" rx="10" fill="url(#bg)"  stroke="#1F2937" stroke-width="1.5"/>

  <!-- Diagram Header -->
  <g id="header">
    <text x="490" y="36" fill="#f8fafc" font-size="18" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Multi-Agent Pattern 1: Supervisor Hub-and-Spoke Orchestration</text>
    <text x="490" y="58" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Central Planning Orchestrator Routing Sub-Tasks Sequentially to Domain Specialists</text>
  </g>

  <!-- Diagram Body -->
  <g id="diagram-elements">
    
    <rect x="40" y="190" width="180" height="78" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
<text x="130" y="212" fill="#38bdf8" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">User Request</text>
<text x="52" y="232" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">'Analyze Q3 revenue churn</text>
<text x="52" y="250" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">and draft executive memo'</text>

    <rect x="280" y="165" width="260" height="132" rx="6" fill="#231e12" stroke="#fbbf24" stroke-width="1.5" />
<text x="410" y="187" fill="#fde68a" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Supervisor Orchestrator</text>
<text x="292" y="207" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">1. Evaluates goal &amp; decomposes plan</text>
<text x="292" y="225" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">2. Dispatches sub-tasks to workers</text>
<text x="292" y="243" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">3. Aggregates intermediate JSON data</text>
<text x="292" y="261" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">4. Enforces safety &amp; compliance</text>
<text x="292" y="279" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">5. Emits final synthesized response</text>

    <rect x="640" y="100" width="280" height="80" rx="6" fill="#0f291e" stroke="#4ade80" stroke-width="1.5" />
<text x="780" y="122" fill="#86efac" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Worker 1: SQL Specialist</text>
<text x="652" y="142" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Tools: PostgreSQL Read Replica</text>
<text x="652" y="160" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Extracts revenue data &amp; churn cohort metrics</text>
<text x="652" y="178" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Returns verified tabular dataframe</text>

    <rect x="640" y="190" width="280" height="80" rx="6" fill="#1e1b2e" stroke="#c084fc" stroke-width="1.5" />
<text x="780" y="212" fill="#d8b4fe" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Worker 2: Doc Search Specialist</text>
<text x="652" y="232" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Tools: Qdrant Vector Database</text>
<text x="652" y="250" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Retrieves Q3 board meeting policy minutes</text>
<text x="652" y="268" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Returns relevant qualitative citations</text>

    <rect x="640" y="280" width="280" height="96" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
<text x="780" y="302" fill="#38bdf8" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Worker 3: Python Specialist</text>
<text x="652" y="322" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Tools: Sandboxed E2B MicroVM</text>
<text x="652" y="340" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Plots cohort churn chart &amp; statistical model</text>
<text x="652" y="358" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Returns synthesized graph &amp; markdown report</text>

    <line x1="220" y1="225" x2="280" y2="225" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-b)" />

    <path d="M 540.0 195.0 L 550.0 195.0 C 588.0 195.0, 588.0 137.0, 626.0 137.0 L 640.0 137.0" fill="none" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-g)" />
<text x="590" y="156" fill="#4ade80" font-size="10" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">1. Query SQL</text>
    <line x1="540" y1="225" x2="640" y2="225" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arr-p)" />
<text x="590" y="215" fill="#c084fc" font-size="10" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">2. Search Docs</text>
    <path d="M 540.0 255.0 L 550.0 255.0 C 588.0 255.0, 588.0 317.0, 626.0 317.0 L 640.0 317.0" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-b)" />
<text x="590" y="276" fill="#38bdf8" font-size="10" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">3. Run Analysis</text>

    <!-- Return arrows -->
    <polyline points="640,150 590,150 590,210 540,210" fill="none" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-g)" />
    <polyline points="640,300 590,300 590,240 540,240" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-b)" />

  </g>
</svg>