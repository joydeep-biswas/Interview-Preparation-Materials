<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <!-- Node Surface Gradients -->
    <linearGradient id="card-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142e2b"/>
      <stop offset="100%" stop-color="#091d1a"/>
    </linearGradient>
    <linearGradient id="card-amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d2212"/>
      <stop offset="100%" stop-color="#181308"/>
    </linearGradient>
    <linearGradient id="card-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#261b3d"/>
      <stop offset="100%" stop-color="#130c24"/>
    </linearGradient>
    <linearGradient id="card-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b181e"/>
      <stop offset="100%" stop-color="#1f090d"/>
    </linearGradient>
    <linearGradient id="card-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#112d38"/>
      <stop offset="100%" stop-color="#071920"/>
    </linearGradient>

    <!-- Matched Arrow Markers -->
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#22d3ee"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8"/>
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Dark Card Background -->
  <rect width="1000" height="480" rx="12" fill="url(#bg)"/>
  <rect width="1000" height="480" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Centered Header Section -->
  <g id="header-group">
    <text x="500" y="32" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0.3">The SFT Autoregressive Training &amp; Optimization Loop</text>
    <text x="500" y="52" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400">Batch Tensor Flow: Ingress, Forward Logits, 1-Token Shift, Masked Loss, Backprop &amp; Paged Optimizer</text>
  </g>

  <!-- Diagram Inner Content -->
  
  <!-- Step 1: Batch Ingress -->
  <rect x="60" y="90" width="260" height="80" rx="8" fill="url(#card-blue)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="80" y="115" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">1. Masked Batch Ingress</text>
  <text x="80" y="135" fill="#cbd5e1" font-family="monospace" font-size="11">Input IDs: [B, Seq_Len]</text>
  <text x="80" y="153" fill="#94a3b8" font-family="monospace" font-size="11">Labels: [B, Seq_Len] (-100 masked)</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M 320 130 L 370 130" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-b)"/>

  <!-- Step 2: Forward Pass -->
  <rect x="370" y="90" width="260" height="80" rx="8" fill="url(#card-blue)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="390" y="115" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">2. Forward Pass (Transformer)</text>
  <text x="390" y="135" fill="#cbd5e1" font-family="sans-serif" font-size="11">Calculates raw output logits:</text>
  <text x="390" y="153" fill="#6ee7b7" font-family="monospace" font-size="11">z ∈ ℝ^(B × Seq_Len × Vocab_Size)</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M 630 130 L 680 130" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arr-p)"/>

  <!-- Step 3: Shift Logits &amp; Labels -->
  <rect x="680" y="90" width="260" height="80" rx="8" fill="url(#card-purple)" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="700" y="115" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="700">3. 1-Token Causal Shift</text>
  <text x="700" y="135" fill="#cbd5e1" font-family="monospace" font-size="10">pred = logits[:, :-1, :]</text>
  <text x="700" y="153" fill="#cbd5e1" font-family="monospace" font-size="10">targets = labels[:, 1:]</text>

  <!-- Arrow 3 Down to 4 -->
  <path d="M 810 170 L 810 230" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- Step 4: Cross-Entropy Loss -->
  <rect x="680" y="230" width="260" height="85" rx="8" fill="url(#card-green)" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="700" y="255" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">4. Cross-Entropy Loss</text>
  <text x="700" y="275" fill="#cbd5e1" font-family="sans-serif" font-size="11">Masks prompt tokens (idx=-100):</text>
  <text x="700" y="295" fill="#6ee7b7" font-family="monospace" font-size="10">Loss = -log P(y_target | x)</text>

  <!-- Arrow 4 Left to 5 -->
  <path d="M 680 272 L 630 272" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- Step 5: Autograd Backward Pass -->
  <rect x="370" y="230" width="260" height="85" rx="8" fill="url(#card-green)" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="390" y="255" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">5. Backward Pass (Autograd)</text>
  <text x="390" y="275" fill="#cbd5e1" font-family="sans-serif" font-size="11">Accumulates adapter gradients:</text>
  <text x="390" y="295" fill="#6ee7b7" font-family="monospace" font-size="10">∇_θ L_SFT (LoRA A &amp; B matrices)</text>

  <!-- Arrow 5 Left to 6 -->
  <path d="M 370 272 L 320 272" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr-a)"/>

  <!-- Step 6: Optimizer Step -->
  <rect x="60" y="230" width="260" height="85" rx="8" fill="url(#card-amber)" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="80" y="255" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="700">6. Paged AdamW Optimizer</text>
  <text x="80" y="275" fill="#cbd5e1" font-family="sans-serif" font-size="11">Updates adapter parameters:</text>
  <text x="80" y="295" fill="#fde68a" font-family="monospace" font-size="10">θ ← θ - η · m_hat / (sqrt(v_hat)+ε)</text>

  <!-- Cyclic Feedback Arrow from 6 back up to 1 -->
  <path d="M 190 230 L 190 170" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arr-a)"/>
  <rect x="135" y="190" width="110" height="20" rx="4" fill="#181308" stroke="#fbbf24" stroke-width="1"/>
  <text x="190" y="204" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="600">Next Mini-Batch</text>

  <!-- Bottom Explanatory Banner -->
  <rect x="60" y="350" width="880" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="85" y="375" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">Crucial Training Dynamics &amp; Memory Optimizations:</text>
  <text x="85" y="397" fill="#94a3b8" font-family="sans-serif" font-size="11">• Gradient Accumulation: Simulates effective batch sizes of 128-512 over limited GPU VRAM.</text>
  <text x="85" y="417" fill="#94a3b8" font-family="sans-serif" font-size="11">• Paged Optimizers: Overcomes VRAM spikes by paging optimizer state memory to CPU RAM seamlessly via CUDA Unified Memory.</text>

</svg>