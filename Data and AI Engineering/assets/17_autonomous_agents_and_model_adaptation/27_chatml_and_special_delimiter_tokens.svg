<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <!-- Node Surface Gradients -->
    <linearGradient id="card-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142e2b"/>
      <stop offset="100%" stop-color="#091d1a"/>
    </linearGradient>
    <linearGradient id="card-amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d2212"/>
      <stop offset="100%" stop-color="#181308"/>
    </linearGradient>
    <linearGradient id="card-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#261b3d"/>
      <stop offset="100%" stop-color="#130c24"/>
    </linearGradient>
    <linearGradient id="card-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b181e"/>
      <stop offset="100%" stop-color="#1f090d"/>
    </linearGradient>
    <linearGradient id="card-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#112d38"/>
      <stop offset="100%" stop-color="#071920"/>
    </linearGradient>

    <!-- Matched Arrow Markers -->
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#22d3ee"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8"/>
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Dark Card Background -->
  <rect width="1000" height="380" rx="12" fill="url(#bg)"/>
  <rect width="1000" height="380" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Centered Header Section -->
  <g id="header-group">
    <text x="500" y="32" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0.3">Standardized Multi-Turn Delimiter Token Framing</text>
    <text x="500" y="52" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400">ChatML Special Tokens Preventing Prompt Injection and Role Confusion During SFT</text>
  </g>

  <!-- Diagram Inner Content -->
  
  <!-- Top Intro Note -->
  <rect x="80" y="85" width="840" height="35" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="500" y="107" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">Special control tokens &lt;|im_start|&gt; and &lt;|im_end|&gt; establish strict role security boundaries</text>

  <!-- Turn 1: System Message -->
  <rect x="80" y="135" width="840" height="65" rx="8" fill="url(#card-blue)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="95" y="148" width="105" height="22" rx="4" fill="#0284c7"/>
  <text x="147" y="163" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700">&lt;|im_start|&gt;system</text>
  <text x="215" y="164" fill="#f8fafc" font-family="sans-serif" font-size="12">You are a financial information extraction specialist. Output valid JSON only.</text>
  <rect x="795" y="148" width="105" height="22" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="847" y="163" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">&lt;|im_end|&gt;</text>

  <!-- Connector Down -->
  <path d="M 500 200 L 500 215" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-s)"/>

  <!-- Turn 2: User Prompt -->
  <rect x="80" y="215" width="840" height="65" rx="8" fill="url(#card-purple)" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="95" y="228" width="95" height="22" rx="4" fill="#9333ea"/>
  <text x="142" y="243" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700">&lt;|im_start|&gt;user</text>
  <text x="205" y="244" fill="#f8fafc" font-family="sans-serif" font-size="12">Extract the EBITDA for fiscal year 2024 from the attached 10-K snippet...</text>
  <rect x="795" y="228" width="105" height="22" rx="4" fill="#0f172a" stroke="#c084fc" stroke-width="1"/>
  <text x="847" y="243" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="10" font-weight="700">&lt;|im_end|&gt;</text>

  <!-- Connector Down -->
  <path d="M 500 280 L 500 295" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr-s)"/>

  <!-- Turn 3: Assistant Response -->
  <rect x="80" y="295" width="840" height="65" rx="8" fill="url(#card-green)" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="95" y="308" width="125" height="22" rx="4" fill="#059669"/>
  <text x="157" y="323" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700">&lt;|im_start|&gt;assistant</text>
  <text x="235" y="324" fill="#34d399" font-family="monospace" font-size="12">{"fiscal_year": 2024, "ebitda_usd": 42000000, "currency": "USD"}</text>
  <rect x="795" y="308" width="105" height="22" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="847" y="323" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="10" font-weight="700">&lt;|im_end|&gt;</text>

</svg>