<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <!-- Node Surface Gradients -->
    <linearGradient id="card-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142e2b"/>
      <stop offset="100%" stop-color="#091d1a"/>
    </linearGradient>
    <linearGradient id="card-amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d2212"/>
      <stop offset="100%" stop-color="#181308"/>
    </linearGradient>
    <linearGradient id="card-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#261b3d"/>
      <stop offset="100%" stop-color="#130c24"/>
    </linearGradient>
    <linearGradient id="card-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b181e"/>
      <stop offset="100%" stop-color="#1f090d"/>
    </linearGradient>
    <linearGradient id="card-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#112d38"/>
      <stop offset="100%" stop-color="#071920"/>
    </linearGradient>

    <!-- Matched Arrow Markers -->
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#22d3ee"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8"/>
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Dark Card Background -->
  <rect width="1000" height="520" rx="12" fill="url(#bg)"/>
  <rect width="1000" height="520" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Centered Header Section -->
  <g id="header-group">
    <text x="500" y="32" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0.3">Enterprise Customer Support Copilot Architecture</text>
    <text x="500" y="52" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400">End-to-End Multimodal Support System: Ingress, PII Masking, Orchestration, Context &amp; Serving</text>
  </g>

  <!-- Diagram Inner Content -->
  
  <!-- Column 1: Client Ingress &amp; Security -->
  <rect x="50" y="90" width="270" height="230" rx="8" fill="url(#card-blue)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="115" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">1. Ingress &amp; Security Perimeter</text>
  
  <rect x="70" y="130" width="230" height="45" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
  <text x="85" y="148" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">Cloudflare Enterprise WAF</text>
  <text x="85" y="165" fill="#94a3b8" font-family="sans-serif" font-size="10">DDoS, WAF, WebSocket / SSE</text>

  <rect x="70" y="185" width="230" height="55" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1"/>
  <text x="85" y="203" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">Presidio PII Vault</text>
  <text x="85" y="220" fill="#cbd5e1" font-family="sans-serif" font-size="10">Redacts SSN, cards to UUID tokens</text>
  <text x="85" y="233" fill="#6ee7b7" font-family="monospace" font-size="9">&lt;CARD_1&gt; tokenization</text>

  <rect x="70" y="250" width="230" height="45" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="85" y="268" fill="#f87171" font-family="sans-serif" font-size="11" font-weight="600">Llama Guard 3</text>
  <text x="85" y="285" fill="#94a3b8" font-family="sans-serif" font-size="10">Adversarial prompt injection filter</text>

  <!-- Arrow Col 1 -> Col 2 -->
  <path d="M 320 205 L 365 205" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arr-p)"/>

  <!-- Column 2: Support Orchestration Engine -->
  <rect x="365" y="90" width="270" height="230" rx="8" fill="url(#card-purple)" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="385" y="115" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="700">2. Support Orchestrator</text>

  <rect x="385" y="130" width="230" height="70" rx="6" fill="#130c24" stroke="#9333ea" stroke-width="1"/>
  <text x="400" y="148" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">FastAPI State Coordinator</text>
  <text x="400" y="166" fill="#cbd5e1" font-family="sans-serif" font-size="10">• Multi-turn dialogue manager</text>
  <text x="400" y="182" fill="#cbd5e1" font-family="sans-serif" font-size="10">• PostgreSQL session store</text>

  <rect x="385" y="210" width="230" height="50" rx="6" fill="#130c24" stroke="#9333ea" stroke-width="1"/>
  <text x="400" y="228" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">Vision Router</text>
  <text x="400" y="246" fill="#cbd5e1" font-family="sans-serif" font-size="10">Slices damage photos into ViT patches</text>

  <!-- Arrow Col 2 -> Col 3 -->
  <path d="M 635 205 L 680 205" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- Column 3: Tools &amp; Context -->
  <rect x="680" y="90" width="270" height="230" rx="8" fill="url(#card-green)" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="700" y="115" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">3. Hybrid Context &amp; Tools</text>

  <rect x="700" y="130" width="230" height="50" rx="6" fill="#091d1a" stroke="#059669" stroke-width="1"/>
  <text x="715" y="148" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">Qdrant Vector Cluster</text>
  <text x="715" y="166" fill="#cbd5e1" font-family="sans-serif" font-size="10">Product manuals, return policies</text>

  <rect x="700" y="190" width="230" height="50" rx="6" fill="#091d1a" stroke="#059669" stroke-width="1"/>
  <text x="715" y="208" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">Salesforce CRM API</text>
  <text x="715" y="226" fill="#cbd5e1" font-family="sans-serif" font-size="10">Order status, refunds, RMA returns</text>

  <!-- Bottom Tier: Model Serving &amp; Escalation -->
  <!-- Left Bottom: vLLM GPU Serving Cluster -->
  <rect x="50" y="340" width="585" height="150" rx="8" fill="url(#card-amber)" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="365" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="700">4. High-Throughput Serving Cluster (vLLM)</text>
  <text x="70" y="390" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Cluster of 4x NVIDIA H100 SXM5 GPUs (Tensor Parallelism TP=4)</text>
  <text x="70" y="412" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Model: LLaMA-3.1-70B-Instruct FP8 quantized</text>
  <text x="70" y="432" fill="#cbd5e1" font-family="sans-serif" font-size="11">• PagedAttention + Chunked Prefill prevents TTFT stalls during burst traffic</text>
  <text x="70" y="452" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Continuous Batching handles 1,200 concurrent user streams</text>

  <!-- Arrow Orchestrator Down to Serving -->
  <path d="M 500 320 L 500 340" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arr-a)"/>

  <!-- Right Bottom: Human Escalation Desk -->
  <rect x="680" y="340" width="270" height="150" rx="8" fill="url(#card-red)" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="700" y="365" fill="#f87171" font-family="sans-serif" font-size="12" font-weight="700">5. Human Escalation Desk</text>
  <text x="700" y="390" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">Zendesk / Intercom Queue</text>
  <text x="700" y="412" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Frustration sentiment &gt; 0.85</text>
  <text x="700" y="432" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Refund claims &gt; $100 cap</text>
  <text x="700" y="452" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Full JSON dialogue handoff</text>

  <!-- Arrow Orchestrator to Escalation -->
  <path d="M 635 280 L 815 280 L 815 340" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arr-r)"/>

</svg>