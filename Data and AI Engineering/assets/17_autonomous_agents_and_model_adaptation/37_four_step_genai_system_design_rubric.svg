<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <!-- Node Surface Gradients -->
    <linearGradient id="card-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142e2b"/>
      <stop offset="100%" stop-color="#091d1a"/>
    </linearGradient>
    <linearGradient id="card-amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d2212"/>
      <stop offset="100%" stop-color="#181308"/>
    </linearGradient>
    <linearGradient id="card-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#261b3d"/>
      <stop offset="100%" stop-color="#130c24"/>
    </linearGradient>
    <linearGradient id="card-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b181e"/>
      <stop offset="100%" stop-color="#1f090d"/>
    </linearGradient>
    <linearGradient id="card-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#112d38"/>
      <stop offset="100%" stop-color="#071920"/>
    </linearGradient>

    <!-- Matched Arrow Markers -->
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#22d3ee"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8"/>
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Dark Card Background -->
  <rect width="1000" height="480" rx="12" fill="url(#bg)"/>
  <rect width="1000" height="480" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Centered Header Section -->
  <g id="header-group">
    <text x="500" y="32" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0.3">The 4-Step Generative AI System Design Rubric</text>
    <text x="500" y="52" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400">Structured Architectural Methodology: Scope, High-Level Topology, Subsystems &amp; Operational Triage</text>
  </g>

  <!-- Diagram Inner Content -->
  
  <!-- Step 1 -->
  <rect x="60" y="90" width="410" height="150" rx="8" fill="url(#card-blue)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="80" y="105" width="65" height="22" rx="4" fill="#0284c7"/>
  <text x="112" y="120" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Step 1</text>
  <text x="155" y="120" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700">Scope, Constraints &amp; Sizing</text>
  <text x="80" y="148" fill="#f8fafc" font-family="sans-serif" font-size="11">• Functional: Chat, search, API tool execution, multimodal</text>
  <text x="80" y="168" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Non-Functional SLAs: p99 TTFT &lt; 800ms, 10k concurrent QPS</text>
  <text x="80" y="188" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Budgets: Token throughput (TPM), cost limits per session</text>
  <text x="80" y="208" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Security: PII masking, SOC-2 compliance, air-gapped VPC</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M 470 165 L 530 165" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- Step 2 -->
  <rect x="530" y="90" width="410" height="150" rx="8" fill="url(#card-green)" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="550" y="105" width="65" height="22" rx="4" fill="#059669"/>
  <text x="582" y="120" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Step 2</text>
  <text x="625" y="120" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="700">High-Level Component Topology</text>
  <text x="550" y="148" fill="#f8fafc" font-family="sans-serif" font-size="11">• Ingress Pipeline: WAF, rate limiters, token bucket filters</text>
  <text x="550" y="168" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Caching Architecture: SHA-256 exact hit + semantic cache</text>
  <text x="550" y="188" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Dynamic Routing: SLM vs Frontier LLM complexity triage</text>
  <text x="550" y="208" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Plane Decoupling: Async batch ingestion vs online serving</text>

  <!-- Arrow 2 Down to 3 -->
  <path d="M 735 240 L 735 270 L 265 270 L 265 295" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arr-p)"/>

  <!-- Step 3 -->
  <rect x="60" y="300" width="410" height="150" rx="8" fill="url(#card-purple)" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="80" y="315" width="65" height="22" rx="4" fill="#9333ea"/>
  <text x="112" y="330" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Step 3</text>
  <text x="155" y="330" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="700">Deep-Dive Subsystem Mechanics</text>
  <text x="80" y="358" fill="#f8fafc" font-family="sans-serif" font-size="11">• RAG Mechanics: Hybrid search (BM25 + Dense vector + Rerank)</text>
  <text x="80" y="378" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Agent Execution: Pregel state graphs, checkpointers, HITL</text>
  <text x="80" y="398" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Context Window: Multi-turn compaction, token budget gates</text>
  <text x="80" y="418" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Tool Sandboxing: gVisor / Firecracker container isolation</text>

  <!-- Arrow 3 -> 4 -->
  <path d="M 470 375 L 530 375" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arr-a)"/>

  <!-- Step 4 -->
  <rect x="530" y="300" width="410" height="150" rx="8" fill="url(#card-amber)" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="550" y="315" width="65" height="22" rx="4" fill="#d97706"/>
  <text x="582" y="330" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Step 4</text>
  <text x="625" y="330" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="700">Resilience, Observability &amp; Triage</text>
  <text x="550" y="358" fill="#f8fafc" font-family="sans-serif" font-size="11">• Hardware Capacity: GPU VRAM sizing, KV-cache math</text>
  <text x="550" y="378" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Circuit Breakers: Provider fallbacks, exponential backoff</text>
  <text x="550" y="398" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Distributed Tracing: OpenTelemetry parent-child spans</text>
  <text x="550" y="418" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Incident Runbooks: TTFT vs ITL latency spike mitigation</text>

</svg>