<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <!-- Node Surface Gradients -->
    <linearGradient id="card-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142e2b"/>
      <stop offset="100%" stop-color="#091d1a"/>
    </linearGradient>
    <linearGradient id="card-amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d2212"/>
      <stop offset="100%" stop-color="#181308"/>
    </linearGradient>
    <linearGradient id="card-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#261b3d"/>
      <stop offset="100%" stop-color="#130c24"/>
    </linearGradient>
    <linearGradient id="card-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b181e"/>
      <stop offset="100%" stop-color="#1f090d"/>
    </linearGradient>
    <linearGradient id="card-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#112d38"/>
      <stop offset="100%" stop-color="#071920"/>
    </linearGradient>

    <!-- Matched Arrow Markers -->
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#22d3ee"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8"/>
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Dark Card Background -->
  <rect width="1000" height="420" rx="12" fill="url(#bg)"/>
  <rect width="1000" height="420" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Centered Header Section -->
  <g id="header-group">
    <text x="500" y="32" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0.3">The Three Architectural Pillars of QLoRA</text>
    <text x="500" y="52" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400">Fine-Tuning 70B Parameter Models on Single 48GB GPUs Without Performance Degradation</text>
  </g>

  <!-- Diagram Inner Content -->
  
  <!-- Pillar 1: 4-bit NormalFloat (NF4) -->
  <rect x="60" y="100" width="270" height="240" rx="8" fill="url(#card-green)" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="80" y="115" width="30" height="24" rx="4" fill="#059669"/>
  <text x="95" y="132" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">1</text>
  <text x="120" y="132" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="700">NF4 Quantization</text>
  <text x="80" y="165" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">4-bit NormalFloat Data Type</text>
  <text x="80" y="190" fill="#94a3b8" font-family="sans-serif" font-size="11">• Quantiles fit Gaussian distribution</text>
  <text x="80" y="210" fill="#94a3b8" font-family="sans-serif" font-size="11">• Zero quantization error for outliers</text>
  <text x="80" y="230" fill="#94a3b8" font-family="sans-serif" font-size="11">• Equal number of weights in each bin</text>
  <rect x="80" y="260" width="230" height="45" rx="6" fill="#091d1a" stroke="#34d399" stroke-width="1"/>
  <text x="95" y="280" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700">Benefit:</text>
  <text x="95" y="295" fill="#cbd5e1" font-family="sans-serif" font-size="10">Information-theoretically optimal precision</text>

  <!-- Pillar 2: Double Quantization (DQ) -->
  <rect x="365" y="100" width="270" height="240" rx="8" fill="url(#card-purple)" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="385" y="115" width="30" height="24" rx="4" fill="#9333ea"/>
  <text x="400" y="132" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">2</text>
  <text x="425" y="132" fill="#c084fc" font-family="sans-serif" font-size="14" font-weight="700">Double Quantization</text>
  <text x="385" y="165" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Quantizing Quant Constants</text>
  <text x="385" y="190" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Block size of 64: FP32 constants</text>
  <text x="385" y="210" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Second 8-bit quant with block 256</text>
  <text x="385" y="230" fill="#cbd5e1" font-family="sans-serif" font-size="11">• 0.5 bits/param down to 0.127</text>
  <rect x="385" y="260" width="230" height="45" rx="6" fill="#130c24" stroke="#c084fc" stroke-width="1"/>
  <text x="400" y="280" fill="#c084fc" font-family="sans-serif" font-size="10" font-weight="700">Benefit:</text>
  <text x="400" y="295" fill="#cbd5e1" font-family="sans-serif" font-size="10">Saves 0.37 bits/param (~3GB on 65B model)</text>

  <!-- Pillar 3: Paged Optimizers -->
  <rect x="670" y="100" width="270" height="240" rx="8" fill="url(#card-blue)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="690" y="115" width="30" height="24" rx="4" fill="#0284c7"/>
  <text x="705" y="132" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">3</text>
  <text x="730" y="132" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="700">Paged Optimizers</text>
  <text x="690" y="165" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">CUDA Unified Memory Paging</text>
  <text x="690" y="190" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Intermittent VRAM memory spikes</text>
  <text x="690" y="210" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Pages optimizer states to CPU RAM</text>
  <text x="690" y="230" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Zero out-of-memory crash failures</text>
  <rect x="690" y="260" width="230" height="45" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="705" y="280" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700">Benefit:</text>
  <text x="705" y="295" fill="#cbd5e1" font-family="sans-serif" font-size="10">Eliminates OOM during gradient updates</text>

  <!-- Bottom Synthesis Banner -->
  <rect x="60" y="355" width="880" height="45" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="500" y="382" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="12">Result: Full 16-bit finetuning performance achieved with <tspan fill="#34d399" font-weight="700">4-bit base weights + 16-bit LoRA adapter forward pass</tspan>.</text>

</svg>