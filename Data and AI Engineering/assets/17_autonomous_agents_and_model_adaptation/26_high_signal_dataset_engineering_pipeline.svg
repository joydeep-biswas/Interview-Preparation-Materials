<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <!-- Node Surface Gradients -->
    <linearGradient id="card-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142e2b"/>
      <stop offset="100%" stop-color="#091d1a"/>
    </linearGradient>
    <linearGradient id="card-amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d2212"/>
      <stop offset="100%" stop-color="#181308"/>
    </linearGradient>
    <linearGradient id="card-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#261b3d"/>
      <stop offset="100%" stop-color="#130c24"/>
    </linearGradient>
    <linearGradient id="card-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b181e"/>
      <stop offset="100%" stop-color="#1f090d"/>
    </linearGradient>
    <linearGradient id="card-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#112d38"/>
      <stop offset="100%" stop-color="#071920"/>
    </linearGradient>

    <!-- Matched Arrow Markers -->
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#22d3ee"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8"/>
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Dark Card Background -->
  <rect width="1000" height="380" rx="12" fill="url(#bg)"/>
  <rect width="1000" height="380" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Centered Header Section -->
  <g id="header-group">
    <text x="500" y="32" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0.3">High-Signal SFT Dataset Engineering Pipeline</text>
    <text x="500" y="52" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400">Operationalizing the LIMA Hypothesis: Quality &amp; Diversity Outweigh Raw Token Volume</text>
  </g>

  <!-- Diagram Inner Content -->
  
  <!-- Step 0: Raw Data -->
  <rect x="40" y="140" width="160" height="120" rx="8" fill="url(#card-red)" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="120" y="165" text-anchor="middle" fill="#f87171" font-family="sans-serif" font-size="12" font-weight="700">Raw Enterprise Data</text>
  <text x="120" y="190" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">100,000 Unfiltered</text>
  <text x="120" y="206" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">Production Logs</text>
  <rect x="60" y="222" width="120" height="22" rx="4" fill="#1f090d" stroke="#ef4444" stroke-width="1"/>
  <text x="120" y="237" text-anchor="middle" fill="#f87171" font-family="sans-serif" font-size="10" font-weight="600">Messy, PII, Duplicates</text>

  <!-- Arrow 0 -> 1 -->
  <path d="M 200 200 L 235 200" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-b)"/>

  <!-- Step 1: Heuristic Filtering -->
  <rect x="240" y="130" width="210" height="140" rx="8" fill="url(#card-blue)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="255" y="142" width="24" height="20" rx="4" fill="#0284c7"/>
  <text x="267" y="157" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">1</text>
  <text x="290" y="157" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">Rule &amp; PII Filtering</text>
  <text x="255" y="185" fill="#94a3b8" font-family="sans-serif" font-size="11">• Strip PII via Presidio regex</text>
  <text x="255" y="205" fill="#94a3b8" font-family="sans-serif" font-size="11">• Length: 150 &lt; chars &lt; 4000</text>
  <text x="255" y="225" fill="#94a3b8" font-family="sans-serif" font-size="11">• Drop truncated dialogues</text>
  <text x="255" y="250" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="600">Remaining: ~25,000</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M 450 200 L 485 200" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arr-p)"/>

  <!-- Step 2: Deduplication &amp; Semantic Clustering -->
  <rect x="490" y="130" width="220" height="140" rx="8" fill="url(#card-purple)" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="505" y="142" width="24" height="20" rx="4" fill="#9333ea"/>
  <text x="517" y="157" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">2</text>
  <text x="540" y="157" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="700">Deduplication &amp; Diversity</text>
  <text x="505" y="185" fill="#cbd5e1" font-family="sans-serif" font-size="11">• MinHash LSH (Jaccard &gt; 0.85)</text>
  <text x="505" y="205" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Embedding clustering (k-means)</text>
  <text x="505" y="225" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Ensure topical balance</text>
  <text x="505" y="250" fill="#c084fc" font-family="sans-serif" font-size="10" font-weight="600">Remaining: ~8,000</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M 710 200 L 745 200" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- Step 3: LLM-as-a-Judge Quality Filtering -->
  <rect x="750" y="130" width="210" height="140" rx="8" fill="url(#card-green)" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="765" y="142" width="24" height="20" rx="4" fill="#059669"/>
  <text x="777" y="157" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">3</text>
  <text x="800" y="157" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">LLM-as-a-Judge Scoring</text>
  <text x="765" y="185" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Score prompt compliance</text>
  <text x="765" y="205" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Verify logical coherence</text>
  <text x="765" y="225" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Drop scores &lt; 4.5 / 5.0</text>
  <text x="765" y="250" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="600">Remaining: 2,500 Golden</text>

  <!-- Bottom Result Banner -->
  <rect x="240" y="300" width="720" height="50" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="260" y="330" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">Curated Golden Set (2,500 Demonstrations):</text>
  <text x="560" y="330" fill="#f8fafc" font-family="sans-serif" font-size="12">Superficial Alignment Hypothesis satisfied with 40x compute reduction</text>

</svg>