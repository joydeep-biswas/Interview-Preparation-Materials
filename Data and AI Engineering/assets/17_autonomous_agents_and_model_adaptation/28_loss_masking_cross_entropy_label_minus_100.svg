<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <!-- Node Surface Gradients -->
    <linearGradient id="card-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142e2b"/>
      <stop offset="100%" stop-color="#091d1a"/>
    </linearGradient>
    <linearGradient id="card-amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d2212"/>
      <stop offset="100%" stop-color="#181308"/>
    </linearGradient>
    <linearGradient id="card-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#261b3d"/>
      <stop offset="100%" stop-color="#130c24"/>
    </linearGradient>
    <linearGradient id="card-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b181e"/>
      <stop offset="100%" stop-color="#1f090d"/>
    </linearGradient>
    <linearGradient id="card-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#112d38"/>
      <stop offset="100%" stop-color="#071920"/>
    </linearGradient>

    <!-- Matched Arrow Markers -->
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#22d3ee"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8"/>
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Dark Card Background -->
  <rect width="1000" height="390" rx="12" fill="url(#bg)"/>
  <rect width="1000" height="390" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Centered Header Section -->
  <g id="header-group">
    <text x="500" y="32" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0.3">Loss Masking Mechanics: Prompt Masking with Label -100</text>
    <text x="500" y="52" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400">Preventing the Model from Learning to Predict User Prompts: Gradients Only Flow for Assistant Tokens</text>
  </g>

  <!-- Diagram Inner Content -->
  
  <!-- Row 1: Tokenized Input Sequence -->
  <text x="60" y="115" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700">Tokenized Input Sequence (Length: 8 Tokens)</text>

  <!-- 8 Token Boxes -->
  <!-- T0 -->
  <rect x="60" y="130" width="105" height="60" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="112" y="153" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">Tok 0</text>
  <text x="112" y="173" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="600">'System'</text>

  <!-- T1 -->
  <rect x="175" y="130" width="105" height="60" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="227" y="153" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">Tok 1</text>
  <text x="227" y="173" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="600">'Prompt'</text>

  <!-- T2 -->
  <rect x="290" y="130" width="105" height="60" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="342" y="153" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">Tok 2</text>
  <text x="342" y="173" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="600">'User'</text>

  <!-- T3 -->
  <rect x="405" y="130" width="105" height="60" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="457" y="153" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">Tok 3</text>
  <text x="457" y="173" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="600">'Question'</text>

  <!-- T4 -->
  <rect x="520" y="130" width="105" height="60" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="572" y="153" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">Tok 4</text>
  <text x="572" y="173" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="600">'Assistant'</text>

  <!-- T5 (Target) -->
  <rect x="635" y="130" width="105" height="60" rx="6" fill="url(#card-green)" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="687" y="153" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="11">Tok 5</text>
  <text x="687" y="173" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">'Target'</text>

  <!-- T6 (Answer) -->
  <rect x="750" y="130" width="105" height="60" rx="6" fill="url(#card-green)" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="802" y="153" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="11">Tok 6</text>
  <text x="802" y="173" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">'Answer'</text>

  <!-- T7 (<|eot_id|>) -->
  <rect x="865" y="130" width="105" height="60" rx="6" fill="url(#card-green)" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="917" y="153" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="11">Tok 7</text>
  <text x="917" y="173" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">'&lt;|eot|&gt;'</text>

  <!-- Connecting Lines -->
  <g stroke-width="1.5">
    <line x1="112" y1="190" x2="112" y2="235" stroke="#f87171" stroke-dasharray="3 3"/>
    <line x1="227" y1="190" x2="227" y2="235" stroke="#f87171" stroke-dasharray="3 3"/>
    <line x1="342" y1="190" x2="342" y2="235" stroke="#f87171" stroke-dasharray="3 3"/>
    <line x1="457" y1="190" x2="457" y2="235" stroke="#f87171" stroke-dasharray="3 3"/>
    <line x1="572" y1="190" x2="572" y2="235" stroke="#f87171" stroke-dasharray="3 3"/>
    <line x1="687" y1="190" x2="687" y2="235" stroke="#34d399" marker-end="url(#arr-g)"/>
    <line x1="802" y1="190" x2="802" y2="235" stroke="#34d399" marker-end="url(#arr-g)"/>
    <line x1="917" y1="190" x2="917" y2="235" stroke="#34d399" marker-end="url(#arr-g)"/>
  </g>

  <!-- Row 2: Target Labels Array -->
  <text x="60" y="230" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="700">Target Labels Array (Passed to Cross-Entropy Loss with ignore_index = -100)</text>

  <!-- L0 to L4: Masked -->
  <rect x="60" y="245" width="105" height="55" rx="6" fill="url(#card-red)" stroke="#ef4444" stroke-width="1"/>
  <text x="112" y="270" text-anchor="middle" fill="#f87171" font-family="monospace" font-size="12" font-weight="700">-100</text>
  <text x="112" y="288" text-anchor="middle" fill="#fca5a5" font-family="sans-serif" font-size="9">Ignored</text>

  <rect x="175" y="245" width="105" height="55" rx="6" fill="url(#card-red)" stroke="#ef4444" stroke-width="1"/>
  <text x="227" y="270" text-anchor="middle" fill="#f87171" font-family="monospace" font-size="12" font-weight="700">-100</text>
  <text x="227" y="288" text-anchor="middle" fill="#fca5a5" font-family="sans-serif" font-size="9">Ignored</text>

  <rect x="290" y="245" width="105" height="55" rx="6" fill="url(#card-red)" stroke="#ef4444" stroke-width="1"/>
  <text x="342" y="270" text-anchor="middle" fill="#f87171" font-family="monospace" font-size="12" font-weight="700">-100</text>
  <text x="342" y="288" text-anchor="middle" fill="#fca5a5" font-family="sans-serif" font-size="9">Ignored</text>

  <rect x="405" y="245" width="105" height="55" rx="6" fill="url(#card-red)" stroke="#ef4444" stroke-width="1"/>
  <text x="457" y="270" text-anchor="middle" fill="#f87171" font-family="monospace" font-size="12" font-weight="700">-100</text>
  <text x="457" y="288" text-anchor="middle" fill="#fca5a5" font-family="sans-serif" font-size="9">Ignored</text>

  <rect x="520" y="245" width="105" height="55" rx="6" fill="url(#card-red)" stroke="#ef4444" stroke-width="1"/>
  <text x="572" y="270" text-anchor="middle" fill="#f87171" font-family="monospace" font-size="12" font-weight="700">-100</text>
  <text x="572" y="288" text-anchor="middle" fill="#fca5a5" font-family="sans-serif" font-size="9">Ignored</text>

  <!-- L5 to L7: Active Loss -->
  <rect x="635" y="245" width="105" height="55" rx="6" fill="url(#card-green)" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="687" y="268" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">Token ID</text>
  <text x="687" y="288" text-anchor="middle" fill="#6ee7b7" font-family="sans-serif" font-size="9">Loss Active</text>

  <rect x="750" y="245" width="105" height="55" rx="6" fill="url(#card-green)" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="802" y="268" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">Token ID</text>
  <text x="802" y="288" text-anchor="middle" fill="#6ee7b7" font-family="sans-serif" font-size="9">Loss Active</text>

  <rect x="865" y="245" width="105" height="55" rx="6" fill="url(#card-green)" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="917" y="268" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">Token ID</text>
  <text x="917" y="288" text-anchor="middle" fill="#6ee7b7" font-family="sans-serif" font-size="9">Loss Active</text>

  <!-- Bottom Explanatory Banner -->
  <rect x="60" y="325" width="910" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="515" y="348" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">PyTorch <tspan fill="#f87171" font-family="monospace">nn.CrossEntropyLoss(ignore_index=-100)</tspan> eliminates prompt token contribution to gradient accumulation.</text>

</svg>