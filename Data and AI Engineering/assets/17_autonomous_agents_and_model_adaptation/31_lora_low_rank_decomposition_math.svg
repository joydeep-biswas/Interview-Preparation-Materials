<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <!-- Node Surface Gradients -->
    <linearGradient id="card-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142e2b"/>
      <stop offset="100%" stop-color="#091d1a"/>
    </linearGradient>
    <linearGradient id="card-amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d2212"/>
      <stop offset="100%" stop-color="#181308"/>
    </linearGradient>
    <linearGradient id="card-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#261b3d"/>
      <stop offset="100%" stop-color="#130c24"/>
    </linearGradient>
    <linearGradient id="card-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b181e"/>
      <stop offset="100%" stop-color="#1f090d"/>
    </linearGradient>
    <linearGradient id="card-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#112d38"/>
      <stop offset="100%" stop-color="#071920"/>
    </linearGradient>

    <!-- Matched Arrow Markers -->
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#22d3ee"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8"/>
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Dark Card Background -->
  <rect width="1000" height="420" rx="12" fill="url(#bg)"/>
  <rect width="1000" height="420" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Centered Header Section -->
  <g id="header-group">
    <text x="500" y="32" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0.3">LoRA Low-Rank Decomposition Mathematics</text>
    <text x="500" y="52" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400">Factorizing Dense Weight Update ΔW into Low-Rank Matrices B · A (Rank r &lt;&lt; min(d, k))</text>
  </g>

  <!-- Diagram Inner Content -->
  
  <!-- Left Box: Dense Matrix Delta W -->
  <rect x="60" y="100" width="300" height="240" rx="8" fill="url(#card-red)" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="210" y="130" text-anchor="middle" fill="#f87171" font-family="sans-serif" font-size="14" font-weight="700">Full Weight Update ΔW</text>
  <text x="210" y="152" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">Dense Full Parameter Fine-Tuning</text>

  <!-- Large Square Graphic -->
  <rect x="135" y="170" width="150" height="110" rx="4" fill="#1f090d" stroke="#ef4444" stroke-width="1.5"/>
  <text x="210" y="215" text-anchor="middle" fill="#f87171" font-family="monospace" font-size="14" font-weight="700">4096 × 4096</text>
  <text x="210" y="235" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="11">d × k = 16,777,216 params</text>

  <text x="210" y="315" text-anchor="middle" fill="#fca5a5" font-family="sans-serif" font-size="11" font-weight="600">Requires ~67 MB VRAM per layer (FP32)</text>

  <!-- Operator / Decomposition Sign -->
  <g transform="translate(390, 200)">
    <text x="20" y="10" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="28" font-weight="700">≈</text>
    <text x="20" y="30" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">Decompose</text>
    <path d="M 5 45 L 35 45" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-b)"/>
  </g>

  <!-- Right Box: Low-Rank Factorization B * A -->
  <rect x="450" y="100" width="490" height="240" rx="8" fill="url(#card-green)" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="695" y="130" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="700">Factorized Low-Rank Decomposition: B · A</text>
  <text x="695" y="152" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">Rank r = 16 (Intrinsic Dimension of Adaptation)</text>

  <!-- Matrix B (d x r) -->
  <rect x="490" y="170" width="70" height="110" rx="4" fill="#091d1a" stroke="#34d399" stroke-width="1.5"/>
  <text x="525" y="215" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">Matrix B</text>
  <text x="525" y="235" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="10">4096 × 16</text>
  <text x="525" y="250" text-anchor="middle" fill="#6ee7b7" font-family="sans-serif" font-size="9">(Init to 0)</text>

  <!-- Multiplication Sign -->
  <text x="585" y="230" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="20" font-weight="700">×</text>

  <!-- Matrix A (r x k) -->
  <rect x="615" y="195" width="150" height="60" rx="4" fill="#091d1a" stroke="#34d399" stroke-width="1.5"/>
  <text x="690" y="222" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">Matrix A</text>
  <text x="690" y="240" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="10">16 × 4096</text>
  <text x="690" y="252" text-anchor="middle" fill="#6ee7b7" font-family="sans-serif" font-size="9">(Init Gaussian N(0, σ²))</text>

  <!-- Equals Sign -->
  <text x="790" y="230" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="20" font-weight="700">=</text>

  <!-- Summary Stats Box -->
  <rect x="815" y="180" width="105" height="90" rx="6" fill="#052e24" stroke="#34d399" stroke-width="1"/>
  <text x="867" y="202" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700">131,072</text>
  <text x="867" y="218" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="10">Parameters</text>
  <rect x="825" y="230" width="85" height="25" rx="4" fill="#047857" stroke="#10B981" stroke-width="1"/>
  <text x="867" y="247" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">-99.2%</text>

  <text x="695" y="315" text-anchor="middle" fill="#6ee7b7" font-family="sans-serif" font-size="11" font-weight="600">Forward pass: h = W_0 x + (α / r) · B(Ax)  |  Base W_0 completely frozen</text>

  <!-- Bottom Explanatory Banner -->
  <rect x="60" y="355" width="880" height="40" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="500" y="380" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">Scaling factor <tspan fill="#34d399" font-family="monospace">α/r</tspan> ensures stable learning dynamics when experimenting with rank hyperparameter r.</text>

</svg>