<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <!-- Node Surface Gradients -->
    <linearGradient id="card-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142e2b"/>
      <stop offset="100%" stop-color="#091d1a"/>
    </linearGradient>
    <linearGradient id="card-amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d2212"/>
      <stop offset="100%" stop-color="#181308"/>
    </linearGradient>
    <linearGradient id="card-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#261b3d"/>
      <stop offset="100%" stop-color="#130c24"/>
    </linearGradient>
    <linearGradient id="card-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b181e"/>
      <stop offset="100%" stop-color="#1f090d"/>
    </linearGradient>
    <linearGradient id="card-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#112d38"/>
      <stop offset="100%" stop-color="#071920"/>
    </linearGradient>

    <!-- Matched Arrow Markers -->
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#22d3ee"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8"/>
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Dark Card Background -->
  <rect width="1000" height="430" rx="12" fill="url(#bg)"/>
  <rect width="1000" height="430" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Centered Header Section -->
  <g id="header-group">
    <text x="500" y="32" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0.3">RL in Verifiable Solution Spaces (Execution-Grounded RLVR)</text>
    <text x="500" y="52" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400">Sampling K Candidate Solutions in Code/Math with Deterministic Sandbox Unit Test Feedback</text>
  </g>

  <!-- Diagram Inner Content -->
  
  <!-- Step 1: Prompt Input -->
  <rect x="40" y="100" width="180" height="90" rx="8" fill="url(#card-blue)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="125" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">Coding / Math</text>
  <text x="60" y="145" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Prompt x</text>
  <text x="60" y="165" fill="#cbd5e1" font-family="sans-serif" font-size="10">Verifiable specification</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M 220 145 L 260 145" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-b)"/>

  <!-- Step 2: Policy Sampling -->
  <rect x="260" y="100" width="210" height="90" rx="8" fill="url(#card-purple)" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="280" y="125" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="700">Policy LLM (π_θ)</text>
  <text x="280" y="145" fill="#cbd5e1" font-family="sans-serif" font-size="11">Sample K Candidates:</text>
  <text x="280" y="165" fill="#6ee7b7" font-family="monospace" font-size="11">[y_1, y_2, ..., y_K]</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M 470 145 L 510 145" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- Step 3: Deterministic Sandbox Verifier -->
  <rect x="510" y="90" width="240" height="120" rx="8" fill="url(#card-green)" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="530" y="115" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">Execution Sandbox</text>
  <text x="530" y="135" fill="#cbd5e1" font-family="sans-serif" font-size="11">Docker / E2B MicroVM:</text>
  <text x="530" y="155" fill="#34d399" font-family="monospace" font-size="11">r(y_k) = 1.0 (Passed)</text>
  <text x="530" y="175" fill="#f87171" font-family="monospace" font-size="11">r(y_k) = 0.0 (Failed / Timeout)</text>
  <text x="530" y="195" fill="#94a3b8" font-family="sans-serif" font-size="10">Zero reward hacking</text>

  <!-- Arrow 3 -> 4 -->
  <path d="M 750 145 L 790 145" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arr-a)"/>

  <!-- Step 4: Policy Optimization -->
  <rect x="790" y="90" width="170" height="120" rx="8" fill="url(#card-amber)" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="810" y="115" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="700">Policy Update</text>
  <text x="810" y="135" fill="#cbd5e1" font-family="sans-serif" font-size="11">PPO / GRPO or</text>
  <text x="810" y="155" fill="#cbd5e1" font-family="sans-serif" font-size="11">Best-of-N SFT</text>
  <text x="810" y="175" fill="#fde68a" font-family="sans-serif" font-size="10">Reinforce winning tokens</text>
  <text x="810" y="195" fill="#94a3b8" font-family="sans-serif" font-size="10">KL penalty against ref</text>

  <!-- Cycle Arrow from 4 back to 2 -->
  <path d="M 875 210 L 875 250 L 365 250 L 365 195" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arr-a)"/>
  <rect x="520" y="240" width="160" height="20" rx="4" fill="#181308" stroke="#fbbf24" stroke-width="1"/>
  <text x="600" y="254" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="600">Updated Policy Weights θ</text>

  <!-- Bottom Explanatory Banner -->
  <rect x="40" y="295" width="920" height="95" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="65" y="322" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">Why Verifiable RL (RLVR) Trumps Subjective RLHF in Technical Domains:</text>
  <text x="65" y="345" fill="#cbd5e1" font-family="sans-serif" font-size="11">1. Ground Truth Truthiness: Compilers, unit test suites, and math provers give binary 0/1 rewards without human judge noise.</text>
  <text x="65" y="365" fill="#cbd5e1" font-family="sans-serif" font-size="11">2. Overcoming Reward Gaming: Unlike subjective proxy models, an agent cannot fool an isolated sandbox unit test.</text>

</svg>