<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="100%" height="100%" style="background-color: #0b1120; max-width: 100%; height: auto;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arr-b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8" />
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#4ade80" />
    </marker>
    <marker id="arr-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#fbbf24" />
    </marker>
    <marker id="arr-p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#c084fc" />
    </marker>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#f87171" />
    </marker>
    <marker id="arr-c" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#2dd4bf" />
    </marker>
    <marker id="arr-s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Base Background -->
  <rect width="980" height="420" rx="10" fill="url(#bg)"  stroke="#1F2937" stroke-width="1.5"/>

  <!-- Diagram Header -->
  <g id="header">
    <text x="490" y="36" fill="#f8fafc" font-size="18" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Multi-Agent Governance: HITL Approval Gate State Machine</text>
    <text x="490" y="58" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">State Transitions: PlanGeneration -&gt; WorkerExecution -&gt; ApprovalGate -&gt; Paused -&gt; Approved/Rejected -&gt; Resume</text>
  </g>

  <!-- Diagram Body -->
  <g id="diagram-elements">
    
    <!-- Start node -->
    <circle cx="50" cy="190" r="10" fill="#38bdf8" />

    <rect x="90" y="150" width="180" height="96" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
<text x="180" y="172" fill="#38bdf8" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">PlanGeneration</text>
<text x="102" y="192" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Supervisor drafts plan</text>
<text x="102" y="210" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Assigns sub-tasks</text>
<text x="102" y="228" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Sets SLA timeouts</text>

    <rect x="310" y="150" width="190" height="120" rx="6" fill="#0f291e" stroke="#4ade80" stroke-width="1.5" />
<text x="405" y="172" fill="#86efac" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">WorkerExecution</text>
<text x="322" y="192" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Workers produce outputs</text>
<text x="322" y="210" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Action flagged as</text>
<text x="322" y="228" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">HIGH_IMPACT mutation</text>

    <rect x="540" y="150" width="180" height="96" rx="6" fill="#231e12" stroke="#fbbf24" stroke-width="1.5" />
<text x="630" y="172" fill="#fde68a" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">ApprovalGate</text>
<text x="552" y="192" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">interrupt() raised</text>
<text x="552" y="210" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">State checkpointed to</text>
<text x="552" y="228" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">PostgreSQL store</text>

    <rect x="760" y="150" width="180" height="120" rx="6" fill="#2b1111" stroke="#f87171" stroke-width="1.5" />
<text x="850" y="172" fill="#fca5a5" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Paused (Suspended)</text>
<text x="772" y="192" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Zero CPU consumed</text>
<text x="772" y="210" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Webhook sends Slack card</text>
<text x="772" y="228" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Awaiting human click</text>

    <rect x="760" y="280" width="180" height="96" rx="6" fill="#0f291e" stroke="#4ade80" stroke-width="1.5" />
<text x="850" y="302" fill="#86efac" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">ResumeExecution</text>
<text x="772" y="322" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">State restored from DB</text>
<text x="772" y="340" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Worker executes action</text>
<text x="772" y="358" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Mission Complete!</text>

    <rect x="310" y="280" width="190" height="96" rx="6" fill="#2b1111" stroke="#f87171" stroke-width="1.5" />
<text x="405" y="302" fill="#fca5a5" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">SupervisorRevision</text>
<text x="322" y="322" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Human rejected action</text>
<text x="322" y="340" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Feedback routed back</text>
<text x="322" y="358" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Supervisor revises plan</text>

    <line x1="60" y1="190" x2="90" y2="190" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-b)" />
    <line x1="270" y1="190" x2="310" y2="190" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-g)" />
    <line x1="500" y1="190" x2="540" y2="190" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arr-a)" />
    <line x1="720" y1="190" x2="760" y2="190" stroke="#f87171" stroke-width="1.5" marker-end="url(#arr-r)" />

    <line x1="850" y1="230" x2="850" y2="280" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-g)" />
<text x="885" y="255" fill="#4ade80" font-size="10" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Approved</text>
    <polyline points="760,190 740,190 740,320 500,320" fill="none" stroke="#f87171" stroke-width="1.5" marker-end="url(#arr-r)" />
<text x="620" y="310" fill="#f87171" font-size="10" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Rejected</text>
    <line x1="405" y1="280" x2="405" y2="230" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-b)" />
<text x="375" y="255" fill="#38bdf8" font-size="10" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Re-run</text>

  </g>
</svg>