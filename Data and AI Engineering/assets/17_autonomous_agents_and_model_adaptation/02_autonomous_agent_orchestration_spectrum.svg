<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" width="100%" height="100%" style="background-color: #0b1120; max-width: 100%; height: auto;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arr-b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#4ade80"/>
    </marker>
    <marker id="arr-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#c084fc"/>
    </marker>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#f87171"/>
    </marker>
    <marker id="arr-c" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#2dd4bf"/>
    </marker>
    <marker id="arr-s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Base Background -->
  <rect width="980" height="380" rx="10" fill="url(#bg)"/>

  <!-- Diagram Header -->
  <g id="header">
    <text x="490" y="36" fill="#f8fafc" font-size="18" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">The Orchestration Spectrum: Linear Chains vs. DAG Workflows vs. Autonomous Agents</text>
    <text x="490" y="58" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Comparing Rigid Deterministic Pipelines to Dynamic Self-Directing Tool-Calling Loops</text>
  </g>

  <!-- Diagram Body -->
  <g id="diagram-elements">
    
    <rect x="40" y="95" width="270" height="250" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="175" y="115" fill="#38bdf8" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">1. Linear Chain</text>
<text x="175" y="131" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Hardcoded, sequential execution</text>
    <rect x="60" y="140" width="230" height="40" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="175" y="162" fill="#38bdf8" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Step A: Ingest Document</text>
<text x="72" y="182" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Extract text / OCR</text>
    <rect x="60" y="195" width="230" height="40" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="175" y="217" fill="#38bdf8" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Step B: Translate Language</text>
<text x="72" y="237" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">En -&gt; Es translation</text>
    <rect x="60" y="250" width="230" height="40" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="175" y="272" fill="#38bdf8" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Step C: Summarize</text>
<text x="72" y="292" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Generate 3 bullets</text>
    <text x="175" y="325" fill="#94a3b8" font-size="10" text-anchor="middle">Zero branching; brittle to failures</text>
    <line x1="175" y1="180" x2="175" y2="195" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-b)"/>
    <line x1="175" y1="235" x2="175" y2="250" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-b)"/>

    <rect x="350" y="95" width="280" height="250" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="490" y="115" fill="#c084fc" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">2. Router / DAG Workflow</text>
<text x="490" y="131" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Conditional branching via code</text>
    <rect x="370" y="140" width="240" height="40" rx="6" fill="#1e1b2e" stroke="#c084fc" stroke-width="1.5"/>
<text x="490" y="162" fill="#d8b4fe" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Step A: Classify Intent</text>
<text x="382" y="182" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">LLM / embeddings classify</text>
    <rect x="370" y="195" width="240" height="40" rx="6" fill="#231e12" stroke="#fbbf24" stroke-width="1.5"/>
<text x="490" y="217" fill="#fde68a" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Router Logic (if/else)</text>
<text x="382" y="237" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Code determines path</text>
    <rect x="360" y="255" width="120" height="50" rx="6" fill="#0f291e" stroke="#4ade80" stroke-width="1.5"/>
<text x="420" y="277" fill="#86efac" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Billing Branch</text>
<text x="372" y="297" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Invoice lookup</text>
    <rect x="495" y="255" width="120" height="50" rx="6" fill="#0f291e" stroke="#4ade80" stroke-width="1.5"/>
<text x="555" y="277" fill="#86efac" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Tech Support</text>
<text x="507" y="297" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">K8s triage</text>
    <text x="490" y="330" fill="#94a3b8" font-size="10" text-anchor="middle">Static graph; pre-determined routes</text>
    <line x1="490" y1="180" x2="490" y2="195" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arr-p)"/>
    <path d="M 440.0 235.0 L 440.0 241.0 C 440.0 246.0, 420.0 242.0, 420.0 247.0 L 420.0 255.0" fill="none" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-g)"/>
    <path d="M 540.0 235.0 L 540.0 241.0 C 540.0 246.0, 555.0 242.0, 555.0 247.0 L 555.0 255.0" fill="none" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-g)"/>

    <rect x="660" y="95" width="280" height="250" rx="8" fill="#0f172a" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="800" y="115" fill="#4ade80" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">3. Autonomous Agent</text>
<text x="800" y="131" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Dynamic self-directed tool loops</text>
    <rect x="680" y="140" width="240" height="40" rx="6" fill="#0f291e" stroke="#4ade80" stroke-width="1.5"/>
<text x="800" y="162" fill="#86efac" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Goal: 'Fix Issue #402'</text>
<text x="692" y="182" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">User high-level intent</text>
    <rect x="680" y="195" width="240" height="55" rx="6" fill="#0f291e" stroke="#4ade80" stroke-width="1.5"/>
<text x="800" y="217" fill="#86efac" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">LLM Reasoning Core</text>
<text x="692" y="237" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">ReAct: Thought -&gt; Action -&gt; Obs</text>
<text x="692" y="255" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Tools: Git, Pytest, Bash, SQL</text>
    <rect x="680" y="265" width="240" height="45" rx="6" fill="#0f291e" stroke="#4ade80" stroke-width="1.5"/>
<text x="800" y="287" fill="#86efac" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Goal Completed</text>
<text x="692" y="307" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Autonomous task termination</text>
    <text x="800" y="330" fill="#86efac" font-size="10" text-anchor="middle">Dynamically chooses tools and steps</text>
    <line x1="800" y1="180" x2="800" y2="195" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-g)"/>
    <line x1="800" y1="250" x2="800" y2="265" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-g)"/>

  </g>
</svg>