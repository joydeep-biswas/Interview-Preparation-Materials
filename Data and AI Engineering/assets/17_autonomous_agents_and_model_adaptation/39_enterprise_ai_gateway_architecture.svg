<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <!-- Node Surface Gradients -->
    <linearGradient id="card-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142e2b"/>
      <stop offset="100%" stop-color="#091d1a"/>
    </linearGradient>
    <linearGradient id="card-amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d2212"/>
      <stop offset="100%" stop-color="#181308"/>
    </linearGradient>
    <linearGradient id="card-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#261b3d"/>
      <stop offset="100%" stop-color="#130c24"/>
    </linearGradient>
    <linearGradient id="card-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b181e"/>
      <stop offset="100%" stop-color="#1f090d"/>
    </linearGradient>
    <linearGradient id="card-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#112d38"/>
      <stop offset="100%" stop-color="#071920"/>
    </linearGradient>

    <!-- Matched Arrow Markers -->
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#22d3ee"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8"/>
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Dark Card Background -->
  <rect width="1000" height="400" rx="12" fill="url(#bg)"/>
  <rect width="1000" height="400" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Centered Header Section -->
  <g id="header-group">
    <text x="500" y="32" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0.3">Enterprise AI Gateway Architecture</text>
    <text x="500" y="52" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400">Centralized Ingress: Authentication, Distributed Rate Limiting, Routing, Circuit Breakers &amp; Observability</text>
  </g>

  <!-- Diagram Inner Content -->
  
  <!-- Pipeline Container -->
  <rect x="40" y="90" width="920" height="270" rx="10" fill="#0c1726" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="118" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700">Gateway Middleware Execution Pipeline (Sequential Interceptors)</text>

  <!-- Step 1: Virtual API Key &amp; AuthN -->
  <rect x="60" y="140" width="160" height="180" rx="8" fill="url(#card-blue)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="75" y="155" width="24" height="20" rx="4" fill="#0284c7"/>
  <text x="87" y="170" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">1</text>
  <text x="105" y="170" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">IAM &amp; AuthN</text>
  <text x="75" y="200" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Virtual API Keys</text>
  <text x="75" y="220" fill="#cbd5e1" font-family="sans-serif" font-size="11">• OIDC &amp; Okta SSO</text>
  <text x="75" y="240" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Tenant Isolation</text>
  <text x="75" y="260" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Role-Based ACL</text>
  <rect x="75" y="280" width="130" height="22" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="140" y="295" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="600">Zero-Trust Boundary</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M 220 230 L 245 230" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- Step 2: Rate Limiting &amp; Quotas -->
  <rect x="245" y="140" width="160" height="180" rx="8" fill="url(#card-green)" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="260" y="155" width="24" height="20" rx="4" fill="#059669"/>
  <text x="272" y="170" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">2</text>
  <text x="290" y="170" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">Rate Limiter</text>
  <text x="260" y="200" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Redis Token Bucket</text>
  <text x="260" y="220" fill="#cbd5e1" font-family="sans-serif" font-size="11">• RPM &amp; TPM Enforced</text>
  <text x="260" y="240" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Fair-Share Queues</text>
  <text x="260" y="260" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Tier Quota Throttling</text>
  <rect x="260" y="280" width="130" height="22" rx="4" fill="#091d1a" stroke="#34d399" stroke-width="1"/>
  <text x="325" y="295" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="600">DDoS &amp; Cost Shield</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M 405 230 L 430 230" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arr-p)"/>

  <!-- Step 3: Dynamic Model Routing -->
  <rect x="430" y="140" width="160" height="180" rx="8" fill="url(#card-purple)" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="445" y="155" width="24" height="20" rx="4" fill="#9333ea"/>
  <text x="457" y="170" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">3</text>
  <text x="475" y="170" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="700">Smart Router</text>
  <text x="445" y="200" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Complexity Classifier</text>
  <text x="445" y="220" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Cost vs SLA Optimizer</text>
  <text x="445" y="240" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Multi-Region Load</text>
  <text x="445" y="260" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Provider Balancing</text>
  <rect x="445" y="280" width="130" height="22" rx="4" fill="#130c24" stroke="#c084fc" stroke-width="1"/>
  <text x="510" y="295" text-anchor="middle" fill="#c084fc" font-family="sans-serif" font-size="10" font-weight="600">SLM / Frontier Select</text>

  <!-- Arrow 3 -> 4 -->
  <path d="M 590 230 L 615 230" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#arr-r)"/>

  <!-- Step 4: Circuit Breaker &amp; Fallback -->
  <rect x="615" y="140" width="160" height="180" rx="8" fill="url(#card-red)" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="630" y="155" width="24" height="20" rx="4" fill="#dc2626"/>
  <text x="642" y="170" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">4</text>
  <text x="660" y="170" fill="#f87171" font-family="sans-serif" font-size="12" font-weight="700">Resilience</text>
  <text x="630" y="200" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Circuit Breaker Trips</text>
  <text x="630" y="220" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Automatic Failover</text>
  <text x="630" y="240" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Exponential Backoff</text>
  <text x="630" y="260" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Request Hedging</text>
  <rect x="630" y="280" width="130" height="22" rx="4" fill="#1f090d" stroke="#ef4444" stroke-width="1"/>
  <text x="695" y="295" text-anchor="middle" fill="#f87171" font-family="sans-serif" font-size="10" font-weight="600">99.99% Uptime Shield</text>

  <!-- Arrow 4 -> 5 -->
  <path d="M 775 230 L 800 230" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arr-a)"/>

  <!-- Step 5: Telemetry &amp; Cost Metering -->
  <rect x="800" y="140" width="145" height="180" rx="8" fill="url(#card-amber)" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="815" y="155" width="24" height="20" rx="4" fill="#d97706"/>
  <text x="827" y="170" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">5</text>
  <text x="845" y="170" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="700">Telemetry</text>
  <text x="815" y="200" fill="#cbd5e1" font-family="sans-serif" font-size="11">• OpenInference</text>
  <text x="815" y="220" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Token Counting</text>
  <text x="815" y="240" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Chargeback Attribution</text>
  <text x="815" y="260" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Quality Evals</text>
  <rect x="815" y="280" width="115" height="22" rx="4" fill="#181308" stroke="#fbbf24" stroke-width="1"/>
  <text x="872" y="295" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="600">FinOps Insights</text>

</svg>