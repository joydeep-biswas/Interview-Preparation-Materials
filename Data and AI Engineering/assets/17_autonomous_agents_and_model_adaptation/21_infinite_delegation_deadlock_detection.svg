<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="100%" height="100%" style="background-color: #0b1120; max-width: 100%; height: auto;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arr-b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#4ade80"/>
    </marker>
    <marker id="arr-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#c084fc"/>
    </marker>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#f87171"/>
    </marker>
    <marker id="arr-c" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#2dd4bf"/>
    </marker>
    <marker id="arr-s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Base Background -->
  <rect width="980" height="440" rx="10" fill="url(#bg)"/>

  <!-- Diagram Header -->
  <g id="header">
    <text x="490" y="36" fill="#f8fafc" font-size="18" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Multi-Agent System Deadlock: Adversarial Verification vs. Ping-Pong Cycles</text>
    <text x="490" y="58" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Constructive Proponent/Opponent Red-Teaming vs. Infinite Delegation Loop Detection</text>
  </g>

  <!-- Diagram Body -->
  <g id="diagram-elements">
    
    <!-- Columns for 3 Actors -->
    <line x1="160" y1="95" x2="160" y2="400" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="490" y1="95" x2="490" y2="400" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="820" y1="95" x2="820" y2="400" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>

    <rect x="60" y="95" width="200" height="45" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="160" y="117" fill="#38bdf8" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Agent A (Proponent)</text>
<text x="72" y="137" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Creator / Architecture Specialist</text>
    <rect x="390" y="95" width="200" height="45" rx="6" fill="#2b1111" stroke="#f87171" stroke-width="1.5"/>
<text x="490" y="117" fill="#fca5a5" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Agent B (Opponent)</text>
<text x="402" y="137" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Red Team / Security Auditor</text>
    <rect x="720" y="95" width="200" height="45" rx="6" fill="#0f291e" stroke="#4ade80" stroke-width="1.5"/>
<text x="820" y="117" fill="#86efac" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Judge Agent (Synthesizer)</text>
<text x="732" y="137" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Evaluates Final Consensus</text>

    <!-- Round 1 -->
    <line x1="160" y1="170" x2="490" y2="170" stroke="#f87171" stroke-width="1.5" marker-end="url(#arr-r)"/>
<text x="325" y="160" fill="#f87171" font-size="10" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Round 1 Proposal: 'Dual-write to both DBs simultaneously'</text>

    <line x1="490" y1="220" x2="160" y2="220" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arr-a)"/>
<text x="325" y="210" fill="#fbbf24" font-size="10" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Round 1 Critique: 'Dual-writing risks race conditions without 2PC'</text>

    <!-- Round 2 -->
    <line x1="160" y1="275" x2="490" y2="275" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-g)"/>
<text x="325" y="265" fill="#4ade80" font-size="10" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Round 2 Revised: 'Use CDC via Debezium + Kafka stream'</text>

    <line x1="490" y1="325" x2="820" y2="325" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-g)"/>
<text x="655" y="315" fill="#4ade80" font-size="10" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Review: 'CDC mitigates race conditions; approved'</text>

    <rect x="680" y="345" width="280" height="50" rx="6" fill="#0f291e" stroke="#4ade80" stroke-width="1.5"/>
<text x="820" y="367" fill="#86efac" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Consensus Plan Delivered</text>
<text x="692" y="387" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Judge confirms robust zero-downtime architecture</text>
<text x="692" y="405" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Includes full failure mode mitigation matrix</text>

  </g>
</svg>