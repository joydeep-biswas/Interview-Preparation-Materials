<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="100%" height="100%" style="background-color: #0b1120; max-width: 100%; height: auto;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arr-b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#4ade80"/>
    </marker>
    <marker id="arr-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#c084fc"/>
    </marker>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#f87171"/>
    </marker>
    <marker id="arr-c" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#2dd4bf"/>
    </marker>
    <marker id="arr-s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Base Background -->
  <rect width="980" height="440" rx="10" fill="url(#bg)"/>

  <!-- Diagram Header -->
  <g id="header">
    <text x="490" y="36" fill="#f8fafc" font-size="18" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Human-In-The-Loop (HITL) Interrupt &amp; Resume Protocol</text>
    <text x="490" y="58" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Asynchronous State Snapshotting, Execution Suspension, and Cryptographic Human Approval Gate</text>
  </g>

  <!-- Diagram Body -->
  <g id="diagram-elements">
    
    <!-- Columns for 3 Actors -->
    <line x1="160" y1="95" x2="160" y2="400" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="490" y1="95" x2="490" y2="400" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="820" y1="95" x2="820" y2="400" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>

    <rect x="60" y="95" width="200" height="45" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="160" y="117" fill="#38bdf8" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Agent Execution Core</text>
<text x="72" y="137" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">LangGraph State Machine</text>
    <rect x="390" y="95" width="200" height="45" rx="6" fill="#231e12" stroke="#fbbf24" stroke-width="1.5"/>
<text x="490" y="117" fill="#fde68a" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">PostgreSQL Checkpointer</text>
<text x="402" y="137" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Durable State Storage</text>
    <rect x="720" y="95" width="200" height="45" rx="6" fill="#0f291e" stroke="#4ade80" stroke-width="1.5"/>
<text x="820" y="117" fill="#86efac" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Human Approver (Admin)</text>
<text x="732" y="137" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Slack / Webhook Interface</text>

    <!-- Step 1: Agent reaches interrupt -->
    <rect x="50" y="160" width="220" height="50" rx="6" fill="#2b1111" stroke="#f87171" stroke-width="1.5"/>
<text x="160" y="182" fill="#fca5a5" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Reaches Ring 2 Action</text>
<text x="62" y="202" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">execute_reboot(pod='prod-db')</text>
<text x="62" y="220" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Marked: interrupt_before</text>

    <line x1="160" y1="225" x2="490" y2="225" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arr-a)"/>
<text x="325" y="215" fill="#fbbf24" font-size="10" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">1. Persist State Snapshot &amp; Raise NodeInterrupt</text>

    <line x1="490" y1="260" x2="820" y2="260" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-b)"/>
<text x="655" y="250" fill="#38bdf8" font-size="10" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">2. Dispatch Slack Notification Card</text>

    <rect x="350" y="280" width="280" height="50" rx="8" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="490" y="300" fill="#94a3b8" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">EXECUTION FULLY SUSPENDED</text>
<text x="490" y="316" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Zero thread / memory / CPU consumption</text>

    <line x1="820" y1="345" x2="490" y2="345" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-g)"/>
<text x="655" y="335" fill="#4ade80" font-size="10" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">3. Admin Clicks 'Approve with modified args'</text>

    <line x1="490" y1="375" x2="160" y2="375" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-g)"/>
<text x="325" y="365" fill="#4ade80" font-size="10" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">4. Resume Graph Execution with Verified State</text>

  </g>
</svg>