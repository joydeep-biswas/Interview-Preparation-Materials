<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <!-- Node Surface Gradients -->
    <linearGradient id="card-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142e2b"/>
      <stop offset="100%" stop-color="#091d1a"/>
    </linearGradient>
    <linearGradient id="card-amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d2212"/>
      <stop offset="100%" stop-color="#181308"/>
    </linearGradient>
    <linearGradient id="card-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#261b3d"/>
      <stop offset="100%" stop-color="#130c24"/>
    </linearGradient>
    <linearGradient id="card-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b181e"/>
      <stop offset="100%" stop-color="#1f090d"/>
    </linearGradient>
    <linearGradient id="card-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#112d38"/>
      <stop offset="100%" stop-color="#071920"/>
    </linearGradient>

    <!-- Matched Arrow Markers -->
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#22d3ee"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8"/>
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Dark Card Background -->
  <rect width="1000" height="440" rx="12" fill="url(#bg)"/>
  <rect width="1000" height="440" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Centered Header Section -->
  <g id="header-group">
    <text x="500" y="32" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0.3">Direct Preference Optimization (DPO) Loss Formulation</text>
    <text x="500" y="52" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400">Eliminating the Explicit Reward Model: Deriving Policy Updates Directly from Implicit Log Ratios</text>
  </g>

  <!-- Diagram Inner Content -->
  
  <!-- Top Split: Implicit Reward Computations -->
  <!-- Chosen Implicit Reward -->
  <rect x="60" y="90" width="410" height="95" rx="8" fill="url(#card-green)" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="80" y="115" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="700">Implicit Reward: Chosen (y_w)</text>
  <text x="80" y="140" fill="#6ee7b7" font-family="monospace" font-size="12">r_w = β · log( π_θ(y_w | x) / π_ref(y_w | x) )</text>
  <text x="80" y="165" fill="#cbd5e1" font-family="sans-serif" font-size="11">Reward proportional to policy gain over reference model</text>

  <!-- Rejected Implicit Reward -->
  <rect x="530" y="90" width="410" height="95" rx="8" fill="url(#card-red)" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="550" y="115" fill="#f87171" font-family="sans-serif" font-size="13" font-weight="700">Implicit Reward: Rejected (y_l)</text>
  <text x="550" y="140" fill="#fca5a5" font-family="monospace" font-size="12">r_l = β · log( π_θ(y_l | x) / π_ref(y_l | x) )</text>
  <text x="550" y="165" fill="#cbd5e1" font-family="sans-serif" font-size="11">Penalizes policy for assigning probability to rejected response</text>

  <!-- Arrows to Margin -->
  <path d="M 265 185 L 265 215 L 470 215" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arr-g)"/>
  <path d="M 735 185 L 735 215 L 530 215" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arr-r)"/>

  <!-- Center Stage: Reward Margin -->
  <rect x="360" y="200" width="280" height="60" rx="8" fill="url(#card-purple)" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="500" y="225" text-anchor="middle" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="700">Reward Margin</text>
  <text x="500" y="247" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="13">Margin = (r_w - r_l)</text>

  <!-- Arrow Margin Down to Sigmoid -->
  <path d="M 500 260 L 500 285" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arr-p)"/>

  <!-- Stage 3: Negative Log Sigmoid Loss -->
  <rect x="250" y="285" width="500" height="55" rx="8" fill="#0c1726" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="500" y="310" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">Objective Function</text>
  <text x="500" y="328" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="12">L_DPO(θ; π_ref) = -E [ log σ( r_w - r_l ) ]</text>

  <!-- Arrow to Result -->
  <path d="M 500 340 L 500 365" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-b)"/>

  <!-- Stage 4: Gradient Action -->
  <rect x="180" y="365" width="640" height="50" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="500" y="386" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700">Gradient Dynamic:</text>
  <text x="500" y="404" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">Increases probability of y_w while decreasing probability of y_l scaled by mistake magnitude</text>

</svg>