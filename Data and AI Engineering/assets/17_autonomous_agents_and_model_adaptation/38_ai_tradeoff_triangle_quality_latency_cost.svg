<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <!-- Node Surface Gradients -->
    <linearGradient id="card-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142e2b"/>
      <stop offset="100%" stop-color="#091d1a"/>
    </linearGradient>
    <linearGradient id="card-amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d2212"/>
      <stop offset="100%" stop-color="#181308"/>
    </linearGradient>
    <linearGradient id="card-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#261b3d"/>
      <stop offset="100%" stop-color="#130c24"/>
    </linearGradient>
    <linearGradient id="card-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b181e"/>
      <stop offset="100%" stop-color="#1f090d"/>
    </linearGradient>
    <linearGradient id="card-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#112d38"/>
      <stop offset="100%" stop-color="#071920"/>
    </linearGradient>

    <!-- Matched Arrow Markers -->
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#22d3ee"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8"/>
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Dark Card Background -->
  <rect width="1000" height="480" rx="12" fill="url(#bg)"/>
  <rect width="1000" height="480" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Centered Header Section -->
  <g id="header-group">
    <text x="500" y="32" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0.3">The Fundamental AI Engineering Trade-Off Triangle</text>
    <text x="500" y="52" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400">Balancing Quality &amp; Reasoning Depth vs. Latency &amp; Responsiveness vs. Operational Cost</text>
  </g>

  <!-- Diagram Inner Content -->
  
  <!-- Central Triangle Visualization -->
  <!-- Top Node: Quality -->
  <rect x="360" y="85" width="280" height="100" rx="8" fill="url(#card-purple)" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="500" y="112" text-anchor="middle" fill="#c084fc" font-family="sans-serif" font-size="14" font-weight="700">Quality &amp; Reasoning Depth</text>
  <text x="500" y="132" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">• 405B Frontier Foundation Models</text>
  <text x="500" y="150" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Multi-Agent Consensus Debate (MAD)</text>
  <text x="500" y="168" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Deep Chain-of-Thought (CoT)</text>

  <!-- Left Bottom Node: Latency -->
  <rect x="60" y="320" width="280" height="100" rx="8" fill="url(#card-green)" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="200" y="347" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="700">Latency &amp; Responsiveness</text>
  <text x="200" y="367" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Sub-500ms Time-to-First-Token (TTFT)</text>
  <text x="200" y="385" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Speculative Decoding (EAGLE/Medusa)</text>
  <text x="200" y="403" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Aggressive Multi-Tier Caching</text>

  <!-- Right Bottom Node: Cost -->
  <rect x="660" y="320" width="280" height="100" rx="8" fill="url(#card-amber)" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="800" y="347" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="14" font-weight="700">Operational Cost &amp; Efficiency</text>
  <text x="800" y="367" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Self-Hosted vLLM on 4-bit / FP8</text>
  <text x="800" y="385" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">• 8B Distilled Domain-Specific SLMs</text>
  <text x="800" y="403" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Context Window Compaction</text>

  <!-- Trade-Off Connector Lines -->
  <!-- Top to Left: Quality vs Latency -->
  <line x1="410" y1="185" x2="250" y2="320" stroke="#38bdf8" stroke-width="2"/>
  <rect x="250" y="235" width="150" height="36" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="325" y="250" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700">Tension 1:</text>
  <text x="325" y="263" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="9">Reasoning depth slows TTFT</text>

  <!-- Top to Right: Quality vs Cost -->
  <line x1="590" y1="185" x2="750" y2="320" stroke="#f87171" stroke-width="2"/>
  <rect x="600" y="235" width="150" height="36" rx="4" fill="#0f172a" stroke="#f87171" stroke-width="1"/>
  <text x="675" y="250" text-anchor="middle" fill="#f87171" font-family="sans-serif" font-size="10" font-weight="700">Tension 2:</text>
  <text x="675" y="263" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="9">Frontier calls cost 50x-100x</text>

  <!-- Left to Right: Latency vs Cost -->
  <line x1="340" y1="370" x2="660" y2="370" stroke="#34d399" stroke-width="2"/>
  <rect x="425" y="352" width="150" height="36" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="500" y="367" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700">Tension 3:</text>
  <text x="500" y="380" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="9">Over-provisioning GPUs</text>

  <!-- Center Synthesis Badge -->
  <rect x="420" y="275" width="160" height="32" rx="6" fill="#0b1120" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="500" y="295" text-anchor="middle" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="700">Pareto Frontier</text>

</svg>