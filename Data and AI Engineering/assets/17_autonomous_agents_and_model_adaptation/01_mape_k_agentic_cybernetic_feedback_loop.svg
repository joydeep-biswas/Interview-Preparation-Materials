<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="100%" height="100%" style="background-color: #0b1120; max-width: 100%; height: auto;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arr-b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#4ade80"/>
    </marker>
    <marker id="arr-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#c084fc"/>
    </marker>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#f87171"/>
    </marker>
    <marker id="arr-c" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#2dd4bf"/>
    </marker>
    <marker id="arr-s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Base Background -->
  <rect width="980" height="440" rx="10" fill="url(#bg)"/>

  <!-- Diagram Header -->
  <g id="header">
    <text x="490" y="36" fill="#f8fafc" font-size="18" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">The Agentic Cybernetic Feedback Architecture (MAPE-K)</text>
    <text x="490" y="58" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Monitor, Analyze, Plan, and Execute Driven by a Centralized Memory &amp; Knowledge Base</text>
  </g>

  <!-- Diagram Body -->
  <g id="diagram-elements">
    
    <rect x="340" y="95" width="300" height="75" rx="6" fill="#231e12" stroke="#fbbf24" stroke-width="1.5"/>
<text x="490" y="117" fill="#fde68a" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Shared Knowledge Base (K)</text>
<text x="352" y="137" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Semantic Vectors: Long-term domain docs</text>
<text x="352" y="155" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Episodic Logs: Past trajectories &amp; tool errors</text>
<text x="352" y="173" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Procedural Memory: Immutable system prompts</text>

    <rect x="60" y="210" width="200" height="85" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="160" y="232" fill="#38bdf8" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">1. MONITOR (Perceive)</text>
<text x="72" y="252" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Ingests environment signals</text>
<text x="72" y="270" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Tool stdout &amp; stderr outputs</text>
<text x="72" y="288" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">User chat messages &amp; events</text>
<text x="72" y="306" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">API webhook notifications</text>

    <rect x="290" y="210" width="200" height="85" rx="6" fill="#1e1b2e" stroke="#c084fc" stroke-width="1.5"/>
<text x="390" y="232" fill="#d8b4fe" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">2. ANALYZE (Reason)</text>
<text x="302" y="252" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Synthesizes observations</text>
<text x="302" y="270" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Detects missing information</text>
<text x="302" y="288" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Evaluates progress vs. goal</text>
<text x="302" y="306" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Internal reflection phase</text>

    <rect x="520" y="210" width="200" height="85" rx="6" fill="#231e12" stroke="#fbbf24" stroke-width="1.5"/>
<text x="620" y="232" fill="#fde68a" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">3. PLAN (Decide)</text>
<text x="532" y="252" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Decomposes goals into steps</text>
<text x="532" y="270" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Selects next tool invocation</text>
<text x="532" y="288" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Evaluates schema parameters</text>
<text x="532" y="306" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Determines final response</text>

    <rect x="750" y="210" width="180" height="85" rx="6" fill="#0f291e" stroke="#4ade80" stroke-width="1.5"/>
<text x="840" y="232" fill="#86efac" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">4. EXECUTE (Act)</text>
<text x="762" y="252" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Dispatches tool invocation</text>
<text x="762" y="270" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Executes Python / SQL / Bash</text>
<text x="762" y="288" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Writes database mutations</text>
<text x="762" y="306" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Emits message to user</text>

    <line x1="260" y1="252" x2="290" y2="252" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arr-p)"/>
    <line x1="490" y1="252" x2="520" y2="252" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arr-a)"/>
    <line x1="720" y1="252" x2="750" y2="252" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-g)"/>

    <!-- Loop back from Execute to Monitor -->
    <polyline points="840,295 840,360 160,360 160,295" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-b)"/>
<text x="500" y="350" fill="#38bdf8" font-size="10" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Observation Loop: Environmental State Updates</text>

    <!-- KB connections -->
    <path d="M 200.0 210.0 L 200.0 200.0 C 200.0 180.0, 263.0 160.0, 326.0 160.0 L 340.0 160.0" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-b)"/>
    <path d="M 390.0 210.0 L 390.0 202.0 C 390.0 192.0, 430.0 192.0, 430.0 182.0 L 430.0 170.0" fill="none" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arr-p)"/>
    <path d="M 580.0 210.0 L 580.0 202.0 C 580.0 192.0, 530.0 192.0, 530.0 182.0 L 530.0 170.0" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arr-a)"/>
    <path d="M 770.0 210.0 L 770.0 200.0 C 770.0 180.0, 712.0 160.0, 654.0 160.0 L 640.0 160.0" fill="none" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-g)"/>

  </g>
</svg>