<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 454" width="100%" height="100%" style="background-color: #0b1120; max-width: 100%; height: auto;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arr-b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8" />
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#4ade80" />
    </marker>
    <marker id="arr-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#fbbf24" />
    </marker>
    <marker id="arr-p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#c084fc" />
    </marker>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#f87171" />
    </marker>
    <marker id="arr-c" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#2dd4bf" />
    </marker>
    <marker id="arr-s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Base Background -->
  <rect width="980" height="440" rx="10" fill="url(#bg)"  stroke="#1F2937" stroke-width="1.5"/>

  <!-- Diagram Header -->
  <g id="header">
    <text x="490" y="36" fill="#f8fafc" font-size="18" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Tree of Thoughts (ToT): Multi-Branch Heuristic Search</text>
    <text x="490" y="58" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Decomposing Problem States, Generating Candidate Reasoning Branches, Scoring, and Pruning Dead Ends</text>
  </g>

  <!-- Diagram Body -->
  <g id="diagram-elements">
    
    <rect x="370" y="95" width="240" height="60" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
<text x="490" y="117" fill="#38bdf8" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Root: Initial Problem State</text>
<text x="382" y="137" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Diagnose 504 Gateway Timeout</text>

    <rect x="60" y="180" width="240" height="78" rx="6" fill="#2b1111" stroke="#f87171" stroke-width="1.5" />
<text x="180" y="202" fill="#fca5a5" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Path A: 'Optimize SQL Index'</text>
<text x="72" y="222" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Heuristic Score = 0.30 (Poor fit)</text>
<text x="72" y="240" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Root cause is connection pool, not indexing</text>

    <rect x="370" y="180" width="240" height="78" rx="6" fill="#0f291e" stroke="#4ade80" stroke-width="1.5" />
<text x="490" y="202" fill="#86efac" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Path B: 'Pool &amp; Cache Resiliency'</text>
<text x="382" y="222" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Heuristic Score = 0.90 (Highly Promising)</text>
<text x="382" y="240" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Directly addresses thread exhaustion</text>

    <rect x="680" y="180" width="240" height="78" rx="6" fill="#231e12" stroke="#fbbf24" stroke-width="1.5" />
<text x="800" y="202" fill="#fde68a" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Path C: 'Scale Pod Replicas'</text>
<text x="692" y="222" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Heuristic Score = 0.60 (Secondary)</text>
<text x="692" y="240" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Scaling pods will hammer DB worse!</text>

    <!-- Path B sub-branches -->
    <rect x="230" y="310" width="240" height="114" rx="6" fill="#0f291e" stroke="#4ade80" stroke-width="1.5" />
<text x="350" y="332" fill="#86efac" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Sub-Thought B.1: PgBouncer</text>
<text x="242" y="352" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Score = 0.95 (Optimal)</text>
<text x="242" y="370" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Multiplex 5,000 clients into</text>
<text x="242" y="388" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">50 pooled connections</text>
<text x="242" y="406" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Proceeds to execute deployment!</text>

    <rect x="510" y="310" width="240" height="96" rx="6" fill="#231e12" stroke="#fbbf24" stroke-width="1.5" />
<text x="630" y="332" fill="#fde68a" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Sub-Thought B.2: Redis Cache</text>
<text x="522" y="352" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Score = 0.75 (Alternative)</text>
<text x="522" y="370" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Cache read-only catalog queries</text>
<text x="522" y="388" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Kept as fallback branch</text>

    <!-- Pruned marker on Path A -->
    <rect x="60" y="290" width="240" height="134" rx="6" fill="#2b1111" stroke="#f87171" stroke-width="1.5" />
<text x="180" y="312" fill="#fca5a5" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">[PRUNED / DISCARDED]</text>
<text x="72" y="332" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Branch pruned by self-evaluator</text>
<text x="72" y="350" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Zero compute wasted exploring further</text>

    <path d="M 430.0 140.0 L 430.0 148.0 C 430.0 158.0, 180.0 158.0, 180.0 168.0 L 180.0 180.0" fill="none" stroke="#f87171" stroke-width="1.5" marker-end="url(#arr-r)" />
    <line x1="490" y1="140" x2="490" y2="180" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-g)" />
    <path d="M 550.0 140.0 L 550.0 148.0 C 550.0 158.0, 800.0 158.0, 800.0 168.0 L 800.0 180.0" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arr-a)" />

    <line x1="180" y1="240" x2="180" y2="290" stroke="#f87171" stroke-width="1.5" marker-end="url(#arr-r)" />
    <path d="M 440.0 240.0 L 440.0 250.0 C 440.0 273.0, 350.0 273.0, 350.0 296.0 L 350.0 310.0" fill="none" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-g)" />
    <path d="M 540.0 240.0 L 540.0 250.0 C 540.0 273.0, 630.0 273.0, 630.0 296.0 L 630.0 310.0" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arr-a)" />

  </g>
</svg>