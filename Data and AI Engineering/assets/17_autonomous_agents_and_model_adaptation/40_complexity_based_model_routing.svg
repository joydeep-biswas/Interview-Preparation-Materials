<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <!-- Node Surface Gradients -->
    <linearGradient id="card-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142e2b"/>
      <stop offset="100%" stop-color="#091d1a"/>
    </linearGradient>
    <linearGradient id="card-amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d2212"/>
      <stop offset="100%" stop-color="#181308"/>
    </linearGradient>
    <linearGradient id="card-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#261b3d"/>
      <stop offset="100%" stop-color="#130c24"/>
    </linearGradient>
    <linearGradient id="card-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b181e"/>
      <stop offset="100%" stop-color="#1f090d"/>
    </linearGradient>
    <linearGradient id="card-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#112d38"/>
      <stop offset="100%" stop-color="#071920"/>
    </linearGradient>

    <!-- Matched Arrow Markers -->
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#22d3ee"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8"/>
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Dark Card Background -->
  <rect width="1000" height="480" rx="12" fill="url(#bg)"/>
  <rect width="1000" height="480" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Centered Header Section -->
  <g id="header-group">
    <text x="500" y="32" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0.3">Complexity-Based Dynamic Model Routing</text>
    <text x="500" y="52" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400">Triage Incoming Queries via Lightweight Classifiers to Slash API Costs by up to 85%</text>
  </g>

  <!-- Diagram Inner Content -->
  
  <!-- Top: User Query -->
  <rect x="360" y="85" width="280" height="50" rx="8" fill="url(#card-blue)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="500" y="115" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700">Incoming User Request</text>

  <!-- Arrow to Feature Extractor -->
  <path d="M 500 135 L 500 160" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-b)"/>

  <!-- Feature Extraction &amp; Classifier Zone -->
  <rect x="250" y="160" width="500" height="95" rx="8" fill="url(#card-purple)" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="500" y="185" text-anchor="middle" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="700">Lightweight Routing Classifier (DistilBERT / SetFit Head)</text>
  <text x="500" y="208" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11">Latency &lt; 10ms | Extracts token length, code intent, multi-step dependencies &amp; reasoning depth</text>
  <text x="500" y="228" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="11">Predicts Complexity Class: {Low, Moderate, High}</text>

  <!-- Branching Arrows to 3 Tiers -->
  <path d="M 330 255 L 330 290 L 180 290 L 180 320" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arr-g)"/>
  <path d="M 500 255 L 500 320" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-b)"/>
  <path d="M 670 255 L 670 290 L 820 290 L 820 320" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arr-p)"/>

  <!-- Tier 1: Small SLM (Low Complexity) -->
  <rect x="50" y="320" width="260" height="130" rx="8" fill="url(#card-green)" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="65" y="335" width="110" height="20" rx="4" fill="#059669"/>
  <text x="120" y="349" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700">Tier 1: SLM (Low)</text>
  <text x="65" y="375" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">Llama-3.1-8B-Instruct</text>
  <text x="65" y="395" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Factoid FAQ &amp; single QA</text>
  <text x="65" y="413" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Text summarization / regex</text>
  <text x="65" y="435" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700">Cost: $0.05 / 1M tokens</text>

  <!-- Tier 2: Mid LLM (Moderate Complexity) -->
  <rect x="370" y="320" width="260" height="130" rx="8" fill="url(#card-blue)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="385" y="335" width="115" height="20" rx="4" fill="#0284c7"/>
  <text x="442" y="349" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700">Tier 2: Mid (Moderate)</text>
  <text x="385" y="375" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">GPT-4o-mini / Haiku-3.5</text>
  <text x="385" y="395" fill="#cbd5e1" font-family="sans-serif" font-size="11">• JSON schema extraction</text>
  <text x="385" y="413" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Conversational dialogue</text>
  <text x="385" y="435" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700">Cost: $0.15 / 1M tokens</text>

  <!-- Tier 3: Frontier LLM (High Complexity) -->
  <rect x="690" y="320" width="260" height="130" rx="8" fill="url(#card-purple)" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="705" y="335" width="115" height="20" rx="4" fill="#9333ea"/>
  <text x="762" y="349" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700">Tier 3: Frontier (High)</text>
  <text x="705" y="375" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">Claude-3.5-Sonnet / o1</text>
  <text x="705" y="395" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Multi-file code refactor</text>
  <text x="705" y="413" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Complex system architecture</text>
  <text x="705" y="435" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="700">Cost: $3.00 / 1M tokens</text>

</svg>