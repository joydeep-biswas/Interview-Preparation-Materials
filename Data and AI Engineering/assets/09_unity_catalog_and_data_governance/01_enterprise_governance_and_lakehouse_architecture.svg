<polyline points="310,390 345,390 345,380 380,380" fill="none" stroke="#c084fc" stroke-width="1.8" marker-end="url(#arr-p)"/>
<g transform="translate(660, 95)">
  <rect width="300" height="360" rx="10" fill="#0f172a" fill-opacity="0.08" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="14" y="-12" width="298" height="22" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="163.0" y="3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#34d399">3. Data Reliability &amp; Observability</text>
</g>
<g transform="translate(680, 130)">
  <rect width="260" height="85" rx="8" fill="url(#card-green)" stroke="#34d399" stroke-width="1.5"/>
  <text x="130.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#a7f3d0">The 5 Pillars</text>
  <line x1="12" y1="34" x2="248" y2="34" stroke="#334155" stroke-width="1"/>
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Freshness, Volume, Quality</text>
  <text x="14" y="70" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Schema drift &amp; Lineage audit</text>
  <text x="14" y="88" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Monte Carlo / Great Expect.</text>
</g>
<g transform="translate(680, 235)">
  <rect width="260" height="85" rx="8" fill="url(#card-amber)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="130.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Statistical Anomaly Engine</text>
  <line x1="12" y1="34" x2="248" y2="34" stroke="#334155" stroke-width="1"/>
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Rolling Z-Scores &amp; IQR</text>
  <text x="14" y="70" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Time-series seasonality</text>
  <text x="14" y="88" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Detects silent data drift</text>
</g>
<g transform="translate(680, 340)">
  <rect width="260" height="95" rx="8" fill="url(#card-red)" stroke="#f87171" stroke-width="1.5"/>
  <text x="130.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#fca5a5">Pipeline Circuit Breaker</text>
  <line x1="12" y1="34" x2="248" y2="34" stroke="#334155" stroke-width="1"/>
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• CLOSED: Normal processing</text>
  <text x="14" y="70" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• TRIPPED: Automated quarantine</text>
  <text x="14" y="88" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Protects downstream BI &amp; ML!</text>
</g>
<line x1="810" y1="215" x2="810" y2="235" stroke="#34d399" stroke-width="1.8" marker-end="url(#arr-g)"/>
<line x1="810" y1="320" x2="810" y2="340" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arr-a)"/>
