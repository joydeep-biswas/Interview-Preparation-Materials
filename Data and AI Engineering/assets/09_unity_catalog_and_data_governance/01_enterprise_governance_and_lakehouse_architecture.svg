  <line x1="12" y1="34" x2="238" y2="34" stroke="#334155" stroke-width="1"/>
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Envelope encryption (Cloud KMS)</text>
  <text x="14" y="70" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Dynamic Data Masking (DDM)</text>
  <text x="14" y="88" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• mTLS 1.3 inter-node transit</text>
</g>
<line x1="185" y1="220" x2="185" y2="235" stroke="#c084fc" stroke-width="1.8" marker-end="url(#arr-p)"/>
<line x1="185" y1="325" x2="185" y2="340" stroke="#c084fc" stroke-width="1.8" marker-end="url(#arr-p)"/>
<g transform="translate(360, 95)">
