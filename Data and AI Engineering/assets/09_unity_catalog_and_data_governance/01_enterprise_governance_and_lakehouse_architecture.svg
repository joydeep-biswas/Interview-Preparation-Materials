  <rect x="14" y="-12" width="226" height="22" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="127.0" y="3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">2. Lakehouse Storage Layer</text>
</g>
<g transform="translate(380, 130)">
