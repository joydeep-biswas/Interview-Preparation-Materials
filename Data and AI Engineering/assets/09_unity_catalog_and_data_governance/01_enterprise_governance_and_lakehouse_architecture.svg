  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Cleansed, conformed Delta</text>
  <text x="14" y="70" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Dynamic masking applied</text>
  <text x="14" y="88" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Row-Level Security (RLS)</text>
</g>
<g transform="translate(380, 340)">
  <rect width="230" height="85" rx="8" fill="url(#card-green)" stroke="#34d399" stroke-width="1.5"/>
  <text x="115.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#a7f3d0">Gold Layer</text>
  <line x1="12" y1="34" x2="218" y2="34" stroke="#334155" stroke-width="1"/>
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Aggregated business marts</text>
  <text x="14" y="70" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Star schema dimensional</text>
  <text x="14" y="88" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Sub-second BI serving</text>
</g>
<line x1="495" y1="215" x2="495" y2="235" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arr-c)"/>
<line x1="495" y1="320" x2="495" y2="340" stroke="#34d399" stroke-width="1.8" marker-end="url(#arr-g)"/>
<line x1="310" y1="280" x2="380" y2="280" stroke="#c084fc" stroke-width="1.8" marker-end="url(#arr-p)"/>
