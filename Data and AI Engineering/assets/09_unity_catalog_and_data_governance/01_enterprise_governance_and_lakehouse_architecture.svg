  <text x="151.0" y="3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#c084fc">1. Governance &amp; Zero-Trust Plane</text>
</g>
<g transform="translate(60, 130)">
