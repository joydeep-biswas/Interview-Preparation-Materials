  <rect width="980" height="430" rx="10" fill="url(#bg)"/>
  <text x="490.0" y="36" fill="#f8fafc" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Lambda Architecture: Dual Batch &amp; Speed Processing</text>
  <text x="490.0" y="58" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Immutable Master Data Lake Store, Real-Time Streaming Delta, and Serving Query Merge</text>
  
  
