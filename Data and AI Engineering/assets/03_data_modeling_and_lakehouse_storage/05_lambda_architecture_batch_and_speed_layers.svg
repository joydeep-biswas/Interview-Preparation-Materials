    <text x="364" y="418" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Query: SELECT * FROM batch_view UNION speed_view</text>
    <circle cx="356" cy="431" r="2" fill="#8b5cf6"/>
    <text x="364" y="434" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Merges precomputed historical + real-time delta</text>

  
