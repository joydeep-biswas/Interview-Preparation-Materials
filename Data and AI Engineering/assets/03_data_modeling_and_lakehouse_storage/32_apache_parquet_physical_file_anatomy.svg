  <rect width="980" height="440" rx="10" fill="url(#bg)"/>
  <text x="490.0" y="36" fill="#f8fafc" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Apache Parquet Physical File Anatomy: Row Groups &amp; Pages</text>
  <text x="490.0" y="58" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Column Chunk Layout, Dictionary Pages, and Trailing Metadata Footer</text>
  
  
