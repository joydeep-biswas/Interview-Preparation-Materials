    <rect x="485" y="355" width="270" height="40" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="620.0" y="381" fill="#6ee7b7" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Column Statistics (Min / Max / Nulls)</text>
