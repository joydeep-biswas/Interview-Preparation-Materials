  <rect width="980" height="400" rx="10" fill="url(#bg)"/>
  <text x="490.0" y="36" fill="#f8fafc" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Dremel Record Shredding: Schema Tree Traversal</text>
  <text x="490.0" y="58" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Decomposing Nested Schemas into Flat Columnar Arrays with Repetition &amp; Definition Levels</text>
  
  
    <rect x="40" y="110" width="200" height="100" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
