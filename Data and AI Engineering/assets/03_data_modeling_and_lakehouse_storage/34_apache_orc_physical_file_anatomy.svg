    <rect x="862" y="200" width="52" height="18" rx="9" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="888.0" y="212" fill="#f59e0b" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">FOOTER</text>
    <circle cx="696" cy="245" r="2" fill="#f59e0b"/>
    <text x="704" y="248" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Stream byte offsets</text>
    <circle cx="696" cy="261" r="2" fill="#f59e0b"/>
    <text x="704" y="264" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Column encoding types</text>
    <circle cx="696" cy="277" r="2" fill="#f59e0b"/>
    <text x="704" y="280" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Stripe row counts</text>

  
    <line x1="330" y1="227" x2="345" y2="227" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr-b)"/>
  
    <line x1="665" y1="227" x2="680" y2="227" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/>

  
    <rect x="45" y="285" width="890" height="90" rx="10" fill="#06231a" stroke="#10b981" stroke-width="1.5"/>
    <text x="61" y="307" fill="#6ee7b7" font-size="12" font-family="system-ui, sans-serif" font-weight="bold">File Footer &amp;amp; Postscript (Evaluated from End of File)</text>
  
    <rect x="60" y="310" width="480" height="55" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="300.0" y="336" fill="#6ee7b7" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">File Metadata Footer</text>
    <text x="300.0" y="352" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Table Schema &amp;amp; Stripe Stats</text>
    <circle cx="76" cy="365" r="2" fill="#10b981"/>
    <text x="84" y="368" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Table schema, column type tree, per-stripe row counts, global column statistics</text>
  
    <rect x="560" y="310" width="360" height="55" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="740.0" y="336" fill="#6ee7b7" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Postscript (Read First)</text>
    <text x="740.0" y="352" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Compression &amp;amp; Length Trailer</text>
    <circle cx="576" cy="365" r="2" fill="#10b981"/>
    <text x="584" y="368" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Compression codec (ZSTD/Snappy), buffer size, footer length byte</text>

