    <text x="195.0" y="216" fill="#93c5fd" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Index Data (Row Index)</text>
    <text x="195.0" y="232" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Per 10,000 Rows</text>
    <rect x="279" y="200" width="45" height="18" rx="9" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <text x="301.5" y="212" fill="#3b82f6" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">INDEX</text>
    <circle cx="76" cy="245" r="2" fill="#3b82f6"/>
    <text x="84" y="248" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Column Min/Max stats</text>
    <circle cx="76" cy="261" r="2" fill="#3b82f6"/>
