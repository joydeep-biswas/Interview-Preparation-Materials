    <text x="505.0" y="216" fill="#6ee7b7" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Row Data (Column Streams)</text>
    <text x="505.0" y="232" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Decomposed Byte Streams</text>
    <rect x="600" y="200" width="59" height="18" rx="9" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="629.5" y="212" fill="#10b981" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">STREAMS</text>
    <circle cx="361" cy="245" r="2" fill="#10b981"/>
    <text x="369" y="248" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Present Stream: Null indicator bitmap</text>
    <circle cx="361" cy="261" r="2" fill="#10b981"/>
    <text x="369" y="264" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Data Stream: Encoded integer/text values</text>
    <circle cx="361" cy="277" r="2" fill="#10b981"/>
    <text x="369" y="280" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Length Stream: Variable string lengths</text>
  
    <rect x="680" y="190" width="240" height="75" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="800.0" y="216" fill="#fde68a" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Stripe Footer</text>
