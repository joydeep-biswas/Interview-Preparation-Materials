  <rect width="980" height="420" rx="10" fill="url(#bg)"/>
  <text x="490.0" y="36" fill="#f8fafc" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Apache ORC Physical File Anatomy: Stripes &amp; Streams</text>
  <text x="490.0" y="58" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Optimized Row Columnar Layout, Lightweight Indexes, and File Postscript</text>
  
  
    <rect x="30" y="95" width="920" height="300" rx="10" fill="#0a1120" stroke="#334155" stroke-width="1.5"/>
    <text x="46" y="117" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" font-weight="bold">Apache ORC Physical Layout (Optimized Row Columnar)</text>

  
    <rect x="45" y="125" width="890" height="28" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="490.0" y="151" fill="#93c5fd" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">File Header: 'ORC' (3 Bytes)</text>
    

  
    <rect x="45" y="160" width="890" height="115" rx="10" fill="#0b1329" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="61" y="182" fill="#93c5fd" font-size="12" font-family="system-ui, sans-serif" font-weight="bold">Stripe 1 (~250 MB - Unit of Read &amp;amp; Distributed Processing)</text>
  
