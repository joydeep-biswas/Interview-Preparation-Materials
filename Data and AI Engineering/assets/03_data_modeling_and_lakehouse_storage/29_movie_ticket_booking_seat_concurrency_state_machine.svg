<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="980" height="390" rx="10" fill="url(#bg)"/>
  <text x="490.0" y="36" fill="#f8fafc" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">High-Concurrency Ticket Seat Reservation State Machine</text>
  <text x="490.0" y="58" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Atomic State Transitions, 10-Minute Redis TTL Expiration, and Optimistic DB Commits</text>
  
  
    <rect x="40" y="140" width="240" height="160" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="160.0" y="166" fill="#6ee7b7" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">AVAILABLE</text>
    <text x="160.0" y="182" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Initial Idle Seat State</text>
    <rect x="236" y="150" width="38" height="18" rx="9" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="255.0" y="162" fill="#10b981" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">FREE</text>
    <circle cx="56" cy="195" r="2" fill="#10b981"/>
    <text x="64" y="198" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Seat is unassigned in showtime</text>
    <circle cx="56" cy="211" r="2" fill="#10b981"/>
    <text x="64" y="214" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Visible on interactive seating chart</text>
    <circle cx="56" cy="227" r="2" fill="#10b981"/>
    <text x="64" y="230" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Ready for user selection</text>
    <circle cx="56" cy="243" r="2" fill="#10b981"/>
    <text x="64" y="246" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Optimistic lock version: V</text>
    <circle cx="56" cy="259" r="2" fill="#10b981"/>
    <text x="64" y="262" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Zero holds in Redis cache</text>

  
    <rect x="370" y="110" width="260" height="210" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="500.0" y="136" fill="#fde68a" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">LOCKED</text>
    <text x="500.0" y="152" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Temporary Hold State</text>
    <rect x="537" y="120" width="87" height="18" rx="9" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="580.5" y="132" fill="#f59e0b" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">10-MIN HOLD</text>
    <circle cx="386" cy="165" r="2" fill="#f59e0b"/>
    <text x="394" y="168" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">User clicks seat on mobile / web</text>
    <circle cx="386" cy="181" r="2" fill="#f59e0b"/>
    <text x="394" y="184" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Acquires 10-min Redis key with TTL</text>
    <circle cx="386" cy="197" r="2" fill="#f59e0b"/>
    <text x="394" y="200" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Sets: lock_expiration = NOW() + 10m</text>
    <circle cx="386" cy="213" r="2" fill="#f59e0b"/>
    <text x="394" y="216" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Optimistic CAS increment: V + 1</text>
    <circle cx="386" cy="229" r="2" fill="#f59e0b"/>
    <text x="394" y="232" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Prevents competing users selecting</text>
    <circle cx="386" cy="245" r="2" fill="#f59e0b"/>
    <text x="394" y="248" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Payment gateway intent created</text>

  
    <rect x="720" y="140" width="220" height="160" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="830.0" y="166" fill="#fca5a5" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">BOOKED</text>
    <text x="830.0" y="182" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Terminal Final State</text>
    <rect x="896" y="150" width="38" height="18" rx="9" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
    <text x="915.0" y="162" fill="#ef4444" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">SOLD</text>
    <circle cx="736" cy="195" r="2" fill="#ef4444"/>
    <text x="744" y="198" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Stripe webhook confirms payment</text>
    <circle cx="736" cy="211" r="2" fill="#ef4444"/>
    <text x="744" y="214" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Atomic DB commit: seat_status = BOOKED</text>
    <circle cx="736" cy="227" r="2" fill="#ef4444"/>
    <text x="744" y="230" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Deletes Redis temporary hold key</text>
    <circle cx="736" cy="243" r="2" fill="#ef4444"/>
    <text x="744" y="246" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Generates QR code ticket payload</text>
    <circle cx="736" cy="259" r="2" fill="#ef4444"/>
    <text x="744" y="262" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Final non-reversible sale state</text>

  
    <line x1="280" y1="190" x2="370" y2="190" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/><text x="325.0" y="182.0" fill="#10b981" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">1. User selects seat (Redis TTL)</text>
  
    <line x1="630" y1="190" x2="720" y2="190" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr-r)"/><text x="675.0" y="182.0" fill="#ef4444" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">2. Payment confirmed (Atomic commit)</text>
  
    <polyline points="480,320 480,350 160,350 160,300" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-a)"/><text x="320" y="365" fill="#f59e0b" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">3. TTL expires (10 min) or payment fails</text>

</svg>