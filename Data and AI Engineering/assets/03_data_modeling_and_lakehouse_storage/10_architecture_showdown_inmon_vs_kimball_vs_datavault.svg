  <text x="490.0" y="36" fill="#f8fafc" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Enterprise Architecture Showdown: Inmon vs. Kimball vs. Data Vault 2.0</text>
