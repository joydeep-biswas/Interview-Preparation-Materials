    <text x="284" y="343" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">store_sk, name, state</text>
  <text x="245" y="365" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">Pros: Storage efficient. Cons: Join broadcast &amp; shuffle overhead at query</text>

  
    <line x1="225" y1="165" x2="260" y2="165" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr-b)"/>
  
    <path d="M 225.0 180.0 L 236.5 180.0 Q 242.5 180.0 242.5 186.0 L 242.5 229.0 Q 242.5 235.0 248.5 235.0 L 260.0 235.0" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr-b)"/>
  
    <path d="M 225.0 195.0 L 236.5 195.0 Q 242.5 195.0 242.5 201.0 L 242.5 304.0 Q 242.5 310.0 248.5 310.0 L 260.0 310.0" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr-b)"/>

  
