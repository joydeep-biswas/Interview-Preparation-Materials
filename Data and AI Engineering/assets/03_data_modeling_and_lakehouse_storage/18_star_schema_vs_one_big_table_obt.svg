    <text x="735.0" y="161" fill="#6ee7b7" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">analytics.obt_orders_denormalized</text>
    <text x="735.0" y="177" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Flat Columnar Table (Delta / Iceberg / BigQuery)</text>
    <rect x="849" y="145" width="80" height="18" rx="9" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="889.0" y="157" fill="#10b981" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">OBT / WIDE</text>
    <circle cx="551" cy="190" r="2" fill="#10b981"/>
    <text x="559" y="193" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">All fact &amp; dimension attributes denormalized into 1 table</text>
    <circle cx="551" cy="206" r="2" fill="#10b981"/>
    <text x="559" y="209" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Columns: order_id, date, customer_name, city, product_name,</text>
    <circle cx="551" cy="222" r="2" fill="#10b981"/>
    <text x="559" y="225" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">category, store_name, store_state, gross_amount, net_amount...</text>
    <circle cx="551" cy="238" r="2" fill="#10b981"/>
    <text x="559" y="241" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Width: 150 to 300+ columns; Depth: Billions of rows</text>
    <circle cx="551" cy="254" r="2" fill="#10b981"/>
    <text x="559" y="257" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Zero query-time joins: Scans only requested columns (columnar)</text>
    <circle cx="551" cy="270" r="2" fill="#10b981"/>
    <text x="559" y="273" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Storage cost mitigated by high Snappy/ZSTD compression</text>
    <circle cx="551" cy="286" r="2" fill="#10b981"/>
    <text x="559" y="289" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Sub-second BI dashboards without shuffle bottleneck</text>

  
    <line x1="460" y1="240" x2="520" y2="240" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/><text x="490.0" y="232" fill="#10b981" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Batch Join ETL</text>

