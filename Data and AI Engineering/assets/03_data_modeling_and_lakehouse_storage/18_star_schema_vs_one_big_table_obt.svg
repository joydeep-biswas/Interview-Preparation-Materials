    <text x="284" y="268" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">prod_sk, sku, category</text>
  
    <rect x="260" y="285" width="180" height="60" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="350.0" y="311" fill="#93c5fd" font-size="13" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">dim_store</text>
    <text x="350.0" y="327" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Dimension</text>
