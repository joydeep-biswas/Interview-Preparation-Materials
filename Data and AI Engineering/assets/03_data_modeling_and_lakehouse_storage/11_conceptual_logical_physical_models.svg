    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="980" height="400" rx="10" fill="url(#bg)"/>
  <text x="490.0" y="36" fill="#f8fafc" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Data Modeling Hierarchy: Conceptual, Logical &amp; Physical</text>
  <text x="490.0" y="58" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">From High-Level Business Domain Entities to Hardware-Optimized Storage DDL</text>
  
  
    <rect x="30" y="95" width="290" height="275" rx="10" fill="#0b1329" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="46" y="117" fill="#93c5fd" font-size="12" font-family="system-ui, sans-serif" font-weight="bold">1. Conceptual Data Model</text>
  
    <rect x="45" y="135" width="260" height="220" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="60" y="161" fill="#93c5fd" font-size="12" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="start">What Business Cares About</text>
    <text x="175.0" y="177" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Strategic Scope &amp; Entities</text>
    <rect x="233" y="145" width="66" height="18" rx="9" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <text x="266.0" y="157" fill="#3b82f6" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">BUSINESS</text>
    <circle cx="61" cy="190" r="2" fill="#3b82f6"/>
    <text x="69" y="193" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">High-level core domain concepts</text>
    <circle cx="61" cy="206" r="2" fill="#3b82f6"/>
    <text x="69" y="209" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Entities: Customer, Order, Product</text>
    <circle cx="61" cy="222" r="2" fill="#3b82f6"/>
    <text x="69" y="225" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Business relationships: 1:N, M:N</text>
    <circle cx="61" cy="238" r="2" fill="#3b82f6"/>
    <text x="69" y="241" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Zero technical jargon or DDL types</text>
    <circle cx="61" cy="254" r="2" fill="#3b82f6"/>
    <text x="69" y="257" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Audience: C-Suite, Product Owners</text>
    <circle cx="61" cy="270" r="2" fill="#3b82f6"/>
    <text x="69" y="273" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Business rules &amp; policy alignment</text>
    <circle cx="61" cy="286" r="2" fill="#3b82f6"/>
    <text x="69" y="289" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Boundary definition for bounded context</text>

  
    <rect x="345" y="95" width="290" height="275" rx="10" fill="#1c0d2e" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="361" y="117" fill="#c084fc" font-size="12" font-family="system-ui, sans-serif" font-weight="bold">2. Logical Data Model</text>
  
    <rect x="360" y="135" width="260" height="220" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="375" y="161" fill="#c084fc" font-size="12" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="start">Business Rules &amp; Structure</text>
    <text x="490.0" y="177" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Platform-Agnostic Entity Relations</text>
    <rect x="541" y="145" width="73" height="18" rx="9" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
    <text x="577.5" y="157" fill="#8b5cf6" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">ARCHITECT</text>
    <circle cx="376" cy="190" r="2" fill="#8b5cf6"/>
    <text x="384" y="193" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Explicit entity attributes &amp; keys</text>
    <circle cx="376" cy="206" r="2" fill="#8b5cf6"/>
    <text x="384" y="209" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Primary keys &amp; Foreign keys defined</text>
    <circle cx="376" cy="222" r="2" fill="#8b5cf6"/>
    <text x="384" y="225" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Normalization rules applied (3NF)</text>
    <circle cx="376" cy="238" r="2" fill="#8b5cf6"/>
    <text x="384" y="241" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Domain constraints &amp; cardinality</text>
    <circle cx="376" cy="254" r="2" fill="#8b5cf6"/>
    <text x="384" y="257" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Vendor and hardware agnostic</text>
    <circle cx="376" cy="270" r="2" fill="#8b5cf6"/>
    <text x="384" y="273" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Audience: Data Architects, Tech Leads</text>
    <circle cx="376" cy="286" r="2" fill="#8b5cf6"/>
    <text x="384" y="289" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Eliminates relational anomalies</text>

  
    <rect x="660" y="95" width="290" height="275" rx="10" fill="#06231a" stroke="#10b981" stroke-width="1.5"/>
    <text x="676" y="117" fill="#6ee7b7" font-size="12" font-family="system-ui, sans-serif" font-weight="bold">3. Physical Data Model</text>
  
    <rect x="675" y="135" width="260" height="220" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="690" y="161" fill="#6ee7b7" font-size="12" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="start">How Data Sits on Hardware</text>
    <text x="805.0" y="177" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Target Engine Optimization</text>
    <rect x="870" y="145" width="59" height="18" rx="9" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="899.5" y="157" fill="#10b981" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">STORAGE</text>
    <circle cx="691" cy="190" r="2" fill="#10b981"/>
    <text x="699" y="193" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Concrete SQL DDL (DECIMAL, BIGINT)</text>
    <circle cx="691" cy="206" r="2" fill="#10b981"/>
    <text x="699" y="209" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Storage: Parquet, Delta Lake, RocksDB</text>
    <circle cx="691" cy="222" r="2" fill="#10b981"/>
    <text x="699" y="225" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Partition keys (e.g. date=2026-10)</text>
    <circle cx="691" cy="238" r="2" fill="#10b981"/>
    <text x="699" y="241" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Z-Order &amp; Bloom filter clustering</text>
    <circle cx="691" cy="254" r="2" fill="#10b981"/>
    <text x="699" y="257" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Indexes: B-Tree, BRIN, Bitmap</text>
    <circle cx="691" cy="270" r="2" fill="#10b981"/>
    <text x="699" y="273" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Audience: Data Engineers, DBAs</text>
    <circle cx="691" cy="286" r="2" fill="#10b981"/>
    <text x="699" y="289" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="start">Hardware-level IOPS &amp; compression</text>

  
    <line x1="305" y1="245" x2="345" y2="245" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arr-p)"/><text x="325.0" y="237" fill="#8b5cf6" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Formalize</text>
  
    <line x1="620" y1="245" x2="660" y2="245" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/><text x="640.0" y="237" fill="#10b981" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">Implement</text>

</svg>