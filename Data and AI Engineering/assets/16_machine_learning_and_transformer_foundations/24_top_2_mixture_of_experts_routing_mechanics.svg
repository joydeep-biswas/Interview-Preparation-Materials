<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="100%" height="100%" style="background-color: #0b1120; max-width: 100%; height: auto;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arr-b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#4ade80"/>
    </marker>
    <marker id="arr-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#c084fc"/>
    </marker>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#f87171"/>
    </marker>
    <marker id="arr-c" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#2dd4bf"/>
    </marker>
    <marker id="arr-s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Base Background -->
  <rect width="980" height="440" rx="10" fill="url(#bg)"/>

  <!-- Diagram Header -->
  <g id="header">
    <text x="490" y="36" fill="#f8fafc" font-size="18" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Mixture-of-Experts (MoE) Sparse Architecture: Top-2 Gating Mechanics</text>
    <text x="490" y="58" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Token Vector Ingress -&gt; Linear Router Gating -&gt; Softmax -&gt; Top-2 Expert Dispatch -&gt; Weighted Output Sum</text>
  </g>

  <!-- Diagram Body -->
  <g id="diagram-elements">
    
    <rect x="40" y="180" width="160" height="60" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="120" y="202" fill="#38bdf8" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Token Vector x_t</text>
<text x="52" y="222" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">[1, HiddenDim]</text>
<text x="52" y="240" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Active embedding</text>

    <rect x="240" y="165" width="210" height="90" rx="6" fill="#1e1b2e" stroke="#c084fc" stroke-width="1.5"/>
<text x="345" y="187" fill="#d8b4fe" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Router / Gating Network</text>
<text x="252" y="207" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Linear Projection: W_gate * x_t</text>
<text x="252" y="225" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Computes logits over N=8 experts</text>
<text x="252" y="243" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Softmax normalizes to probabilities:</text>
<text x="252" y="261" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">[p_1, p_2, ..., p_8]</text>

    <rect x="490" y="165" width="180" height="90" rx="6" fill="#231e12" stroke="#fbbf24" stroke-width="1.5"/>
<text x="580" y="187" fill="#fde68a" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Top-2 Gating Selector</text>
<text x="502" y="207" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Selects top 2 probabilities:</text>
<text x="502" y="225" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Expert 2: p = 0.62 (Code)</text>
<text x="502" y="243" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Expert 1: p = 0.38 (Math)</text>
<text x="502" y="261" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Zero compute on Experts 3-8!</text>

    <rect x="710" y="95" width="240" height="230" rx="8" fill="#0f172a" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="830" y="115" fill="#4ade80" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Expert Pool (8 Parallel FFNs)</text>
<text x="830" y="131" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Only 2 of 8 experts activated per token</text>
    <rect x="725" y="140" width="210" height="40" rx="6" fill="#0f291e" stroke="#4ade80" stroke-width="1.5"/>
<text x="830" y="162" fill="#86efac" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Expert 1 (Math/Logic)</text>
<text x="737" y="182" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Active (Weight: 0.38)</text>
    <rect x="725" y="185" width="210" height="40" rx="6" fill="#0f291e" stroke="#4ade80" stroke-width="1.5"/>
<text x="830" y="207" fill="#86efac" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Expert 2 (Code/Syntax)</text>
<text x="737" y="227" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Active (Weight: 0.62)</text>
    <rect x="725" y="230" width="210" height="40" rx="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
<text x="830" y="252" fill="#94a3b8" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Experts 3 to 8</text>
<text x="737" y="272" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Inactive (0 FLOPs spent)</text>
    <text x="830" y="300" fill="#86efac" font-size="10" text-anchor="middle">Saves 75% parameter FLOPs!</text>

    <rect x="500" y="350" width="360" height="60" rx="6" fill="#0f291e" stroke="#4ade80" stroke-width="1.5"/>
<text x="680" y="372" fill="#86efac" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Weighted Linear Summation Output</text>
<text x="512" y="392" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Output y = 0.62 * Expert_2(x_t) + 0.38 * Expert_1(x_t)</text>
<text x="512" y="410" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Preserves dense capacity while executing at 4x inference speed</text>

    <line x1="200" y1="210" x2="240" y2="210" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-b)"/>
    <line x1="450" y1="210" x2="490" y2="210" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arr-p)"/>
    <line x1="670" y1="210" x2="710" y2="210" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arr-a)"/>

    <polyline points="830,180 830,350" fill="none" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-g)"/>
    <polyline points="830,225 830,350" fill="none" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-g)"/>

  </g>
</svg>