<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="100%" height="100%" style="background-color: #0b1120; max-width: 100%; height: auto;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arr-b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8" />
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#4ade80" />
    </marker>
    <marker id="arr-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#fbbf24" />
    </marker>
    <marker id="arr-p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#c084fc" />
    </marker>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#f87171" />
    </marker>
    <marker id="arr-c" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#2dd4bf" />
    </marker>
    <marker id="arr-s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Base Background -->
  <rect width="980" height="420" rx="10" fill="url(#bg)"  stroke="#1F2937" stroke-width="1.5"/>

  <!-- Diagram Header -->
  <g id="header">
    <text x="490" y="36" fill="#f8fafc" font-size="18" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Core Transformer Component: Scaled Dot-Product Attention</text>
    <text x="490" y="58" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Mathematical Operation: Attention(Q, K, V) = softmax((Q * K^T) / sqrt(d_k)) * V</text>
  </g>

  <!-- Diagram Body -->
  <g id="diagram-elements">
    
    <rect x="40" y="110" width="160" height="60" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
<text x="120" y="132" fill="#38bdf8" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Query Tensor Q</text>
<text x="52" y="152" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">[B, Heads, S, d_k]</text>
    <rect x="40" y="185" width="160" height="60" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
<text x="120" y="207" fill="#38bdf8" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Key Tensor K</text>
<text x="52" y="227" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">[B, Heads, S, d_k]</text>
    <rect x="40" y="260" width="160" height="60" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
<text x="120" y="282" fill="#38bdf8" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Value Tensor V</text>
<text x="52" y="302" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">[B, Heads, S, d_v]</text>

    <rect x="240" y="145" width="180" height="96" rx="6" fill="#1e1b2e" stroke="#c084fc" stroke-width="1.5" />
<text x="330" y="167" fill="#d8b4fe" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">MatMul: Q * K^T</text>
<text x="252" y="187" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Raw Attention Affinities</text>
<text x="252" y="205" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Shape: [SeqLen, SeqLen]</text>
<text x="252" y="223" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Token pair relevance</text>

    <rect x="460" y="145" width="150" height="96" rx="6" fill="#231e12" stroke="#fbbf24" stroke-width="1.5" />
<text x="535" y="167" fill="#fde68a" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Scale by 1/sqrt(d_k)</text>
<text x="472" y="187" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Prevents dot products</text>
<text x="472" y="205" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">from exploding for large d_k</text>
<text x="472" y="223" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Keeps Softmax in active zone</text>

    <rect x="650" y="145" width="130" height="96" rx="6" fill="#2b1111" stroke="#f87171" stroke-width="1.5" />
<text x="715" y="167" fill="#fca5a5" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Causal Mask</text>
<text x="662" y="187" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Upper triangle = -inf</text>
<text x="662" y="205" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Prevents tokens from</text>
<text x="662" y="223" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">peeking into future</text>

    <rect x="820" y="145" width="130" height="96" rx="6" fill="#0f291e" stroke="#4ade80" stroke-width="1.5" />
<text x="885" y="167" fill="#86efac" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Softmax</text>
<text x="832" y="187" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">A = softmax(scaled)</text>
<text x="832" y="205" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Probability matrix</text>
<text x="832" y="223" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Rows sum to 1.0</text>

    <rect x="500" y="280" width="190" height="96" rx="6" fill="#1e1b2e" stroke="#c084fc" stroke-width="1.5" />
<text x="595" y="302" fill="#d8b4fe" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">MatMul: A * V</text>
<text x="512" y="322" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Contextual Aggregation</text>
<text x="512" y="340" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Weighted linear sum of</text>
<text x="512" y="358" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Value vectors: [S, d_v]</text>

    <rect x="740" y="280" width="200" height="78" rx="6" fill="#0f291e" stroke="#4ade80" stroke-width="1.5" />
<text x="840" y="302" fill="#86efac" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Output Context Tensor</text>
<text x="752" y="322" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Linear Projection W_o</text>
<text x="752" y="340" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Shape: [Batch, S, HiddenDim]</text>

    <path d="M 200.0 140.0 L 208.0 140.0 C 218.0 140.0, 218.0 165.0, 228.0 165.0 L 240.0 165.0" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-b)" />
    <path d="M 200.0 215.0 L 208.0 215.0 C 218.0 215.0, 218.0 185.0, 228.0 185.0 L 240.0 185.0" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-b)" />
    <line x1="420" y1="177" x2="460" y2="177" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arr-a)" />
    <line x1="610" y1="177" x2="650" y2="177" stroke="#f87171" stroke-width="1.5" marker-end="url(#arr-r)" />
    <line x1="780" y1="177" x2="820" y2="177" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-g)" />

    <polyline points="885,210 885,312 690,312" fill="none" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-g)" />
<text x="787" y="300" fill="#4ade80" font-size="10" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Weights A</text>
    <path d="M 200.0 290.0 L 210.0 290.0 C 348.0 290.0, 348.0 312.0, 486.0 312.0 L 500.0 312.0" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-b)" />
<text x="350" y="291" fill="#38bdf8" font-size="10" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Values V</text>
    <line x1="690" y1="312" x2="740" y2="312" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-g)" />

  </g>
</svg>