<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" width="100%" height="100%" style="background-color: #0b1120; max-width: 100%; height: auto;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arr-b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#4ade80"/>
    </marker>
    <marker id="arr-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#c084fc"/>
    </marker>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#f87171"/>
    </marker>
    <marker id="arr-c" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#2dd4bf"/>
    </marker>
    <marker id="arr-s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Base Background -->
  <rect width="980" height="480" rx="10" fill="url(#bg)"/>

  <!-- Diagram Header -->
  <g id="header">
    <text x="490" y="36" fill="#f8fafc" font-size="18" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Standard Modern Decoder-Only Transformer Block (LLaMA-3 Style)</text>
    <text x="490" y="58" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Pre-RMSNorm, GQA with RoPE, Residual Stream Additions, and SwiGLU Gated Feed-Forward Network</text>
  </g>

  <!-- Diagram Body -->
  <g id="diagram-elements">
    
    <rect x="350" y="95" width="280" height="45" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="490" y="117" fill="#38bdf8" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Input Token Hidden States x_t</text>
<text x="362" y="137" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">[Batch, SeqLen, HiddenDim]</text>

    <rect x="160" y="170" width="240" height="50" rx="6" fill="#0f291e" stroke="#4ade80" stroke-width="1.5"/>
<text x="280" y="192" fill="#86efac" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">RMSNorm (Pre-Normalization)</text>
<text x="172" y="212" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Normalizes across feature dimension</text>
    <rect x="160" y="240" width="240" height="55" rx="6" fill="#1e1b2e" stroke="#c084fc" stroke-width="1.5"/>
<text x="280" y="262" fill="#d8b4fe" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Grouped-Query Attention (GQA)</text>
<text x="172" y="282" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Causal Mask + RoPE Embeddings</text>
<text x="172" y="300" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">KV Cache sharing ratio 1:4</text>
    <rect x="160" y="315" width="240" height="45" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="280" y="337" fill="#38bdf8" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Residual Addition #1</text>
<text x="172" y="357" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">x = x + Attn(RMSNorm(x))</text>

    <rect x="580" y="170" width="240" height="50" rx="6" fill="#0f291e" stroke="#4ade80" stroke-width="1.5"/>
<text x="700" y="192" fill="#86efac" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">RMSNorm (Pre-Normalization)</text>
<text x="592" y="212" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Normalizes across feature dimension</text>
    <rect x="580" y="240" width="240" height="55" rx="6" fill="#231e12" stroke="#fbbf24" stroke-width="1.5"/>
<text x="700" y="262" fill="#fde68a" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">SwiGLU Feed-Forward Network</text>
<text x="592" y="282" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Bilinear Multiplicative Gating</text>
<text x="592" y="300" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">IntermediateDim = (8/3) * HiddenDim</text>
    <rect x="580" y="315" width="240" height="45" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="700" y="337" fill="#38bdf8" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Residual Addition #2</text>
<text x="592" y="357" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">x = x + FFN(RMSNorm(x))</text>

    <rect x="350" y="400" width="280" height="45" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
<text x="490" y="422" fill="#38bdf8" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Output Hidden States x_{t+1}</text>
<text x="362" y="442" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Propagates to next layer stack</text>

    <!-- Flow into Attention Branch -->
    <polyline points="420,140 420,155 280,155 280,170" fill="none" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-g)"/>
    <line x1="280" y1="220" x2="280" y2="240" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arr-p)"/>
    <line x1="280" y1="295" x2="280" y2="315" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-b)"/>
    <!-- Skip connection 1 -->
    <polyline points="350,117 120,117 120,337 160,337" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-b)"/>
<text x="110" y="220" fill="#38bdf8" font-size="10" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Skip Residual</text>

    <!-- Flow from Add1 to FFN Branch -->
    <polyline points="400,337 500,337 500,155 700,155 700,170" fill="none" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-g)"/>
    <line x1="700" y1="220" x2="700" y2="240" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arr-a)"/>
    <line x1="700" y1="295" x2="700" y2="315" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-b)"/>
    <!-- Skip connection 2 -->
    <polyline points="500,337 540,337 540,337 580,337" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-b)"/>

    <!-- Flow to Output -->
    <polyline points="700,360 700,385 490,385 490,400" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-b)"/>

  </g>
</svg>