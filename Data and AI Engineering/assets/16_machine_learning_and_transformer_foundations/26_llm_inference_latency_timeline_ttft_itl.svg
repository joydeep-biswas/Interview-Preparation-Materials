<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" width="100%" height="100%" style="background-color: #0b1120; max-width: 100%; height: auto;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arr-b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#4ade80"/>
    </marker>
    <marker id="arr-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#c084fc"/>
    </marker>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#f87171"/>
    </marker>
    <marker id="arr-c" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#2dd4bf"/>
    </marker>
    <marker id="arr-s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Base Background -->
  <rect width="980" height="380" rx="10" fill="url(#bg)"/>

  <!-- Diagram Header -->
  <g id="header">
    <text x="490" y="36" fill="#f8fafc" font-size="18" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">LLM Inference Request Latency Timeline: TTFT vs. ITL</text>
    <text x="490" y="58" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Visual Breakdown: Gateway Enqueue -&gt; Prefill Computation -&gt; TTFT -&gt; Streaming Token Cadence (ITL) -&gt; [EOS]</text>
  </g>

  <!-- Diagram Body -->
  <g id="diagram-elements">
    
    <!-- Timeline Axis -->
    <line x1="80" y1="180" x2="900" y2="180" stroke="#475569" stroke-width="3"/>

    <!-- Nodes along Timeline -->
    <!-- T=0: Dispatch -->
    <circle cx="100" cy="180" r="10" fill="#38bdf8"/>
    <text x="100" y="150" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">T=0ms</text>
    <text x="100" y="215" fill="#f8fafc" font-size="11" text-anchor="middle">Request Dispatched</text>
    <text x="100" y="232" fill="#94a3b8" font-size="10" text-anchor="middle">Enters Gateway Queue</text>

    <!-- T=150: Prefill Starts -->
    <circle cx="280" cy="180" r="10" fill="#fbbf24"/>
    <text x="280" y="150" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">T=150ms</text>
    <text x="280" y="215" fill="#f8fafc" font-size="11" text-anchor="middle">Prefill Phase</text>
    <text x="280" y="232" fill="#94a3b8" font-size="10" text-anchor="middle">GPU processes prompt</text>

    <!-- T=450: TTFT -->
    <circle cx="480" cy="180" r="12" fill="#4ade80"/>
    <text x="480" y="145" fill="#4ade80" font-size="12" font-weight="700" text-anchor="middle">T=450ms (TTFT)</text>
    <text x="480" y="215" fill="#86efac" font-size="11" font-weight="700" text-anchor="middle">Time To First Token</text>
    <text x="480" y="232" fill="#cbd5e1" font-size="10" text-anchor="middle">Token #1 emitted to UI</text>

    <!-- T=480: ITL 1 -->
    <circle cx="620" cy="180" r="8" fill="#c084fc"/>
    <text x="620" y="150" fill="#c084fc" font-size="10" text-anchor="middle">+30ms</text>
    <text x="620" y="215" fill="#f8fafc" font-size="10" text-anchor="middle">Token #2</text>

    <!-- T=510: ITL 2 -->
    <circle cx="720" cy="180" r="8" fill="#c084fc"/>
    <text x="720" y="150" fill="#c084fc" font-size="10" text-anchor="middle">+30ms</text>
    <text x="720" y="215" fill="#f8fafc" font-size="10" text-anchor="middle">Token #3</text>

    <!-- T=880: Request Complete -->
    <circle cx="860" cy="180" r="12" fill="#f87171"/>
    <text x="860" y="145" fill="#f87171" font-size="12" font-weight="700" text-anchor="middle">T=880ms</text>
    <text x="860" y="215" fill="#fca5a5" font-size="11" font-weight="700" text-anchor="middle">[EOS] Complete</text>
    <text x="860" y="232" fill="#cbd5e1" font-size="10" text-anchor="middle">Total Latency</text>

    <!-- Latency formula bar at bottom -->
    <rect x="220" y="280" width="540" height="50" rx="6" fill="#0f291e" stroke="#4ade80" stroke-width="1.5"/>
<text x="490" y="302" fill="#86efac" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Total Generation Latency Formula</text>
<text x="232" y="322" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Total Latency = TTFT + (Generated Tokens * Inter-Token Latency)</text>

  </g>
</svg>