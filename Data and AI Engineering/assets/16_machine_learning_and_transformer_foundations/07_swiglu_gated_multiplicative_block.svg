<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 463" width="100%" height="100%" style="background-color: #0b1120; max-width: 100%; height: auto;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arr-b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8" />
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#4ade80" />
    </marker>
    <marker id="arr-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#fbbf24" />
    </marker>
    <marker id="arr-p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#c084fc" />
    </marker>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#f87171" />
    </marker>
    <marker id="arr-c" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#2dd4bf" />
    </marker>
    <marker id="arr-s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Base Background -->
  <rect width="980" height="440" rx="10" fill="url(#bg)"  stroke="#1F2937" stroke-width="1.5"/>

  <!-- Diagram Header -->
  <g id="header">
    <text x="490" y="36" fill="#f8fafc" font-size="18" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">SwiGLU Gated Multiplicative Feed-Forward Network Block</text>
    <text x="490" y="58" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Parallel Gate &amp; Up Projections, Element-Wise Hadamard Gating, and Down Projection (LLaMA-3 Architecture)</text>
  </g>

  <!-- Diagram Body -->
  <g id="diagram-elements">
    
    <rect x="350" y="95" width="280" height="60" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
<text x="490" y="117" fill="#38bdf8" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Input Hidden States x</text>
<text x="362" y="137" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">[Batch, SeqLen, HiddenDim]</text>

    <rect x="160" y="180" width="260" height="78" rx="6" fill="#231e12" stroke="#fbbf24" stroke-width="1.5" />
<text x="290" y="202" fill="#fde68a" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Gate Linear Projection: W_gate</text>
<text x="172" y="222" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Shapes: HiddenDim -&gt; IntermediateDim</text>
<text x="172" y="240" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Captures gating signal features</text>

    <rect x="560" y="180" width="260" height="78" rx="6" fill="#0f291e" stroke="#4ade80" stroke-width="1.5" />
<text x="690" y="202" fill="#86efac" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Up Linear Projection: W_up</text>
<text x="572" y="222" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Shapes: HiddenDim -&gt; IntermediateDim</text>
<text x="572" y="240" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Captures candidate content features</text>

    <rect x="160" y="275" width="260" height="91" rx="6" fill="#1e1b2e" stroke="#c084fc" stroke-width="1.5" />
<text x="290" y="297" fill="#d8b4fe" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Swish / SiLU Activation</text>
<text x="172" y="317" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">SiLU(z) = z * sigma(z)</text>
<text x="172" y="335" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Non-linear modulating gate vector</text>

    <rect x="380" y="270" width="220" height="125" rx="6" fill="#231e12" stroke="#fbbf24" stroke-width="1.5" />
<text x="490" y="292" fill="#fde68a" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Hadamard Product (odot)</text>
<text x="392" y="312" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Element-wise multiplication:</text>
<text x="392" y="330" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">SiLU(x * W_gate) odot (x * W_up)</text>
<text x="392" y="348" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Multiplicative dynamic feature gating</text>

    <rect x="350" y="355" width="280" height="78" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
<text x="490" y="377" fill="#38bdf8" font-size="13" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">Down Projection: W_down</text>
<text x="362" y="397" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Shapes: IntermediateDim -&gt; HiddenDim</text>
<text x="362" y="415" fill="#cbd5e1" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="start">Projects back to residual stream dimension</text>

    <polyline points="420,140 420,160 290,160 290,180" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arr-a)" />
    <polyline points="560,140 560,160 690,160 690,180" fill="none" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-g)" />

    <line x1="290" y1="245" x2="290" y2="275" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arr-p)" />
    <line x1="420" y1="300" x2="380" y2="300" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arr-p)" />
    <polyline points="690,245 690,300 600,300" fill="none" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr-g)" />

    <line x1="490" y1="330" x2="490" y2="355" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-b)" />

  </g>
</svg>