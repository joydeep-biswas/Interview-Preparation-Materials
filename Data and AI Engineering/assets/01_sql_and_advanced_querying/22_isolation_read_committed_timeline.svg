<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1120" height="540" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Transaction Isolation Timeline: Non-Repeatable Read Anomaly under READ COMMITTED</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Statement-level snapshot semantics: Within the same transaction, querying the same row returns contradictory values</text>

  <!-- Two Parallel Transaction Swimlanes -->
  <!-- Column 1: Transaction 1 (Reader Session) -->
  <g transform="translate(35, 90)">
    <rect width="470" height="315" rx="8" fill="#0B132B" stroke="#3B82F6" stroke-width="2"/>
    <text x="235" y="26" font-size="13" font-weight="700" fill="#93C5FD" text-anchor="middle">Transaction 1: Reader (READ COMMITTED)</text>

    <!-- Step 1 at t1 -->
    <rect x="15" y="45" width="440" height="72" rx="6" fill="#1C2541" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="25" y="66" font-size="11" font-weight="700" fill="#60A5FA" text-anchor="start">t1: BEGIN; SELECT balance FROM accounts WHERE id = 1;</text>
    <rect x="25" y="74" width="140" height="18" rx="3" fill="#1E293B" stroke="#3B82F6"/>
    <text x="95" y="87" font-size="9" fill="#93C5FD" font-weight="600" text-anchor="middle">📷 Statement Snapshot 1</text>
    <text x="25" y="106" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="start">Result: balance = $100</text>

    <!-- Step 3 at t3 -->
    <rect x="15" y="190" width="440" height="85" rx="6" fill="#4C0505" stroke="#EF4444" stroke-width="1.2"/>
    <text x="25" y="212" font-size="11" font-weight="700" fill="#FCA5A5" text-anchor="start">t3: SELECT balance FROM accounts WHERE id = 1;</text>
    <rect x="25" y="220" width="165" height="18" rx="3" fill="#2A0B0B" stroke="#EF4444"/>
    <text x="107" y="233" font-size="9" fill="#FCA5A5" font-weight="600" text-anchor="middle">📷 FRESH Statement Snapshot 2</text>
    <text x="25" y="252" font-size="12" font-weight="700" fill="#EF4444" text-anchor="start">Result: balance = $250!  (CONTRADICTION!)</text>
    <text x="25" y="267" font-size="10" fill="#FCA5A5" text-anchor="start">Within same transaction T1, balance changed without T1 modifying it</text>
  </g>

  <!-- Center Chronological Time Axis -->
  <line x1="560" y1="95" x2="560" y2="400" stroke="#64748B" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Time Marker t1 -->
  <circle cx="560" cy="145" r="14" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
  <text x="560" y="149" font-size="10" font-weight="700" fill="#93C5FD" text-anchor="middle">t1</text>

  <!-- Time Marker t2 -->
  <circle cx="560" cy="225" r="14" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
  <text x="560" y="229" font-size="10" font-weight="700" fill="#FDE68A" text-anchor="middle">t2</text>

  <!-- Time Marker t3 -->
  <circle cx="560" cy="305" r="14" fill="#1E293B" stroke="#EF4444" stroke-width="2"/>
  <text x="560" y="309" font-size="10" font-weight="700" fill="#FCA5A5" text-anchor="middle">t3</text>

  <!-- Column 2: Transaction 2 (Writer Session) -->
  <g transform="translate(615, 90)">
    <rect width="470" height="315" rx="8" fill="#2E1C05" stroke="#F59E0B" stroke-width="2"/>
    <text x="235" y="26" font-size="13" font-weight="700" fill="#FDE68A" text-anchor="middle">Transaction 2: Concurrent Writer</text>

    <!-- Step 2 at t2 -->
    <rect x="15" y="115" width="440" height="85" rx="6" fill="#451A03" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="25" y="138" font-size="11" font-weight="700" fill="#FDE68A" text-anchor="start">t2: UPDATE accounts SET balance = 250 WHERE id = 1;</text>
    <text x="25" y="158" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start">    COMMIT;</text>
    <text x="25" y="178" font-size="10" fill="#FDE68A" text-anchor="start">✓ Writes $250 to WAL &amp; buffer pool; committed globally</text>
    <text x="25" y="192" font-size="9" fill="#94A3B8" text-anchor="start">Transaction 2 terminates successfully</text>
  </g>

  <!-- Clean Horizontal Interaction Arrow: T2 Commit -> Timeline -> T1 Snapshot 2 -->
  <path d="M 615 225 L 576 225" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr-a)"/>
  <path d="M 544 305 L 507 305" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#arr-r)"/>

  <!-- Anomaly Alert Banner -->
  <rect x="35" y="415" width="1050" height="38" rx="6" fill="#4C0505" stroke="#EF4444" stroke-width="1.5"/>
  <text x="560" y="439" font-size="11" font-weight="700" fill="#FCA5A5" text-anchor="middle">⚡ NON-REPEATABLE READ ANOMALY: Same transaction observed contradictory values ($100 at t1 → $250 at t3)!</text>

  <!-- Architectural Solution Box -->
  <g transform="translate(35, 462)">
    <rect width="1050" height="65" rx="6" fill="#062828" stroke="#10B981" stroke-width="1.5"/>
    <text x="525" y="24" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">✓ Architectural Prevention: REPEATABLE READ / SERIALIZABLE</text>
    <text x="30" y="44" font-size="10" fill="#A7F3D0" text-anchor="start">• Takes a TRANSACTION-LEVEL snapshot at BEGIN, rather than statement-level.</text>
    <text x="30" y="58" font-size="10" fill="#A7F3D0" text-anchor="start">• At Time t3, T1 uses MVCC undo logs to reconstruct the row version as of t1 → consistently returns $100!</text>
  </g>
</svg>