<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="380" viewBox="0 0 1040 380">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1040" height="380" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">The Gaps &amp; Islands Problem: Difference-of-Ranks Technique</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Detecting contiguous streaks: When row_number() is subtracted from an incremental sequence, difference is constant</text>

  <!-- Main Explanatory Container -->
  <g transform="translate(30, 80)">
    <rect width="980" height="260" rx="8" fill="#0B132B" stroke="#3B82F6" stroke-width="2"/>
    <text x="490" y="28" font-size="13" font-weight="700" fill="#93C5FD" text-anchor="middle">Mathematical Mechanics: date_val - ROW_NUMBER() = Constant Island Key</text>

    <!-- Table Graphic (w=920, h=140) -->
    <g transform="translate(30, 45)">
      <!-- Header -->
      <rect width="920" height="26" fill="#1C2541" stroke="#3B82F6"/>
      <text x="120" y="18" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Event Date (sequence)</text>
      <text x="360" y="18" font-size="11" font-weight="700" fill="#93C5FD" text-anchor="middle">ROW_NUMBER() OVER(ORDER BY date)</text>
      <text x="620" y="18" font-size="11" font-weight="700" fill="#FDE68A" text-anchor="middle">Date - Interval 'rn' Day (Difference)</text>
      <text x="820" y="18" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">Group Island ID</text>

      <!-- Island 1: Rows 1-3 -->
      <rect y="26" width="920" height="24" fill="#064E3B" stroke="#10B981" opacity="0.4"/>
      <text x="120" y="42" font-size="10" fill="#FFFFFF" text-anchor="middle">2026-03-01</text>
      <text x="360" y="42" font-size="10" fill="#93C5FD" text-anchor="middle">1</text>
      <text x="620" y="42" font-size="10" font-weight="700" fill="#FDE68A" text-anchor="middle">2026-02-28</text>
      <text x="820" y="42" font-size="10" font-weight="700" fill="#6EE7B7" text-anchor="middle">Island A (3-day streak)</text>

      <rect y="50" width="920" height="24" fill="#064E3B" stroke="#10B981" opacity="0.4"/>
      <text x="120" y="66" font-size="10" fill="#FFFFFF" text-anchor="middle">2026-03-02</text>
      <text x="360" y="66" font-size="10" fill="#93C5FD" text-anchor="middle">2</text>
      <text x="620" y="66" font-size="10" font-weight="700" fill="#FDE68A" text-anchor="middle">2026-02-28</text>
      <text x="820" y="66" font-size="10" font-weight="700" fill="#6EE7B7" text-anchor="middle">Island A (3-day streak)</text>

      <rect y="74" width="920" height="24" fill="#064E3B" stroke="#10B981" opacity="0.4"/>
      <text x="120" y="90" font-size="10" fill="#FFFFFF" text-anchor="middle">2026-03-03</text>
      <text x="360" y="90" font-size="10" fill="#93C5FD" text-anchor="middle">3</text>
      <text x="620" y="90" font-size="10" font-weight="700" fill="#FDE68A" text-anchor="middle">2026-02-28 [Constant!]</text>
      <text x="820" y="90" font-size="10" font-weight="700" fill="#6EE7B7" text-anchor="middle">Island A (3-day streak)</text>

      <!-- GAP CALLOUT -->
      <line x1="0" y1="98" x2="920" y2="98" stroke="#EF4444" stroke-width="2" stroke-dasharray="4,4"/>

      <!-- Island 2: Row 4 -->
      <rect y="100" width="920" height="24" fill="#451A03" stroke="#F59E0B" opacity="0.4"/>
      <text x="120" y="116" font-size="10" fill="#FFFFFF" text-anchor="middle">2026-03-06 (Gap! 3 days later)</text>
      <text x="360" y="116" font-size="10" fill="#93C5FD" text-anchor="middle">4</text>
      <text x="620" y="116" font-size="10" font-weight="700" fill="#FDE68A" text-anchor="middle">2026-03-02 [Jumped!]</text>
      <text x="820" y="116" font-size="10" font-weight="700" fill="#F59E0B" text-anchor="middle">Island B (New Island)</text>
    </g>

    <!-- Bottom Explanation -->
    <text x="50" y="210" font-size="11" fill="#93C5FD" text-anchor="start">• Within any continuous island, both the date and the row_number increment by exactly 1 at every row.</text>
    <text x="50" y="228" font-size="11" fill="#A7F3D0" text-anchor="start">• Therefore, their arithmetic difference (date - rn) REMAINS COMPLETELY STATIC throughout the island.</text>
    <text x="50" y="246" font-size="11" fill="#FDE68A" font-weight="600" text-anchor="start">✓ Final Query: GROUP BY (date - INTERVAL 'rn' DAY) to compute MIN(date), MAX(date), and COUNT(*)!</text>
  </g>
</svg>