<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="380" viewBox="0 0 1040 380">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6" />
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981" />
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B" />
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6" />
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444" />
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B" />
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1040" height="380" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5" />
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Shuffle Sort-Merge Join (SMJ) Execution Timeline</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Distributed join execution for massive datasets: Network hash partitioning, local sort, and linear merge</text>

  <!-- 3 Consecutive Pipeline Stages (w=315 each) -->

  <!-- Stage 1: Network Shuffle -->
  <g transform="translate(30, 80)">
    <rect width="315" height="260" rx="8" fill="#0B132B" stroke="#3B82F6" stroke-width="2" />
    <text x="157" y="28" font-size="13" font-weight="700" fill="#93C5FD" text-anchor="middle">Stage 1: Network Shuffle</text>

    <rect x="15" y="45" width="285" height="195" rx="6" fill="#1C2541" stroke="#3B82F6" stroke-width="1.2" />
    <text x="157" y="68" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Hash Partitioning on Join Key</text>
    <text x="25" y="92" font-size="11" fill="#94A3B8" text-anchor="start">• Both Table A and Table B</text>
    <text x="25" y="108" font-size="11" fill="#94A3B8" text-anchor="start">  are evaluated by join key</text>
    <text x="25" y="128" font-size="11" fill="#60A5FA" font-weight="600" text-anchor="start">• Hash(Key) % num_partitions</text>
    <text x="25" y="148" font-size="11" fill="#94A3B8" text-anchor="start">• Network All-to-All transfer</text>
    <text x="25" y="168" font-size="11" fill="#94A3B8" text-anchor="start">• Co-locates identical keys</text>
    <text x="25" y="184" font-size="11" fill="#94A3B8" text-anchor="start">  onto the same executor node</text>
    <text x="25" y="215" font-size="11" fill="#FCA5A5" text-anchor="start">⚠️ Bottleneck: Network I/O</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <!-- Stage 2: Parallel Local Sort -->
  <g transform="translate(390, 80)">
    <rect width="315" height="260" rx="8" fill="#2E1C05" stroke="#F59E0B" stroke-width="2" />
    <text x="157" y="28" font-size="13" font-weight="700" fill="#FDE68A" text-anchor="middle">Stage 2: Parallel Local Sort</text>

    <rect x="15" y="45" width="285" height="195" rx="6" fill="#451A03" stroke="#F59E0B" stroke-width="1.2" />
    <text x="157" y="68" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">External Merge Sort</text>
    <text x="25" y="92" font-size="11" fill="#FDE68A" text-anchor="start">• Worker sorts partition A</text>
    <text x="25" y="108" font-size="11" fill="#FDE68A" text-anchor="start">  by join key [O(N log N)]</text>
    <text x="25" y="128" font-size="11" fill="#FDE68A" text-anchor="start">• Worker sorts partition B</text>
    <text x="25" y="144" font-size="11" fill="#FDE68A" text-anchor="start">  by join key [O(M log M)]</text>
    <text x="25" y="168" font-size="11" fill="#FDE68A" text-anchor="start">• Spills temporary runs to disk</text>
    <text x="25" y="184" font-size="11" fill="#FDE68A" text-anchor="start">  if partitions exceed RAM</text>
    <text x="25" y="215" font-size="11" fill="#A7F3D0" text-anchor="start">✓ Zero sort if pre-clustered</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <!-- Stage 3: Linear Merge Phase -->
  <g transform="translate(750, 80)">
    <rect width="260" height="260" rx="8" fill="#062828" stroke="#10B981" stroke-width="2" />
    <text x="130" y="28" font-size="13" font-weight="700" fill="#6EE7B7" text-anchor="middle">Stage 3: Linear Merge</text>

    <rect x="15" y="45" width="230" height="195" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.2" />
    <text x="130" y="68" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Two-Pointer Scan</text>
    <text x="20" y="92" font-size="11" fill="#A7F3D0" text-anchor="start">• Pointer ptrA and ptrB</text>
    <text x="20" y="108" font-size="11" fill="#A7F3D0" text-anchor="start">  traverse sorted streams</text>
    <text x="20" y="128" font-size="11" fill="#A7F3D0" text-anchor="start">• If ptrA == ptrB: emit row!</text>
    <text x="20" y="148" font-size="11" fill="#A7F3D0" text-anchor="start">• If ptrA &lt; ptrB: adv ptrA</text>
    <text x="20" y="168" font-size="11" fill="#A7F3D0" text-anchor="start">• Single linear pass O(N+M)</text>
    <text x="20" y="190" font-size="11" fill="#6EE7B7" font-weight="700" text-anchor="start">✓ Constant RAM footprint</text>
    <text x="20" y="210" font-size="10" fill="#A7F3D0" text-anchor="start">Zero out-of-memory spill</text>
  </g>
<g id="connectors"><path d="M 345 210 L 388 210" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr-a)" />

  <path d="M 705 210 L 748 210" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)" />

  </g></svg>