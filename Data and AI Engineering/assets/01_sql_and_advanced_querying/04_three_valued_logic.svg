<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="380" viewBox="0 0 1160 380">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1160" height="380" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Three-Valued Logic (3VL): NULL in NOT IN Predicates</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">De Morgan's Law expansion under ANSI SQL: UNKNOWN truth-value propagation in WHERE clauses</text>

  <!-- 3 Equal Width Columns (w=310, w=310, w=300 with 85px runway gaps) -->

  <!-- Card 1: Expression Expansion (x=35..345) -->
  <g transform="translate(35, 85)">
    <rect width="310" height="255" rx="8" fill="#0B132B" stroke="#3B82F6" stroke-width="2"/>
    <text x="155" y="26" font-size="13" font-weight="700" fill="#93C5FD" text-anchor="middle">1. De Morgan Expansion</text>

    <rect x="15" y="42" width="280" height="195" rx="6" fill="#1C2541" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="155" y="66" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">WHERE id NOT IN (1, 2, NULL)</text>
    <text x="25" y="90" font-size="11" fill="#94A3B8" text-anchor="start">• Evaluates as:</text>
    <text x="25" y="108" font-size="10.5" fill="#60A5FA" font-weight="600" class="code" text-anchor="start">  id &lt;&gt; 1 AND id &lt;&gt; 2 AND id &lt;&gt; NULL</text>
    <text x="25" y="132" font-size="11" fill="#94A3B8" text-anchor="start">• For candidate id = 5:</text>
    <text x="25" y="152" font-size="11" fill="#94A3B8" text-anchor="start">  5 &lt;&gt; 1 → TRUE</text>
    <text x="25" y="172" font-size="11" fill="#94A3B8" text-anchor="start">  5 &lt;&gt; 2 → TRUE</text>
    <text x="25" y="196" font-size="11" fill="#EF4444" font-weight="600" text-anchor="start">  5 &lt;&gt; NULL yields UNKNOWN</text>
  </g>

  <!-- Card 2: 3VL Truth Reduction (x=430..740) -->
  <g transform="translate(430, 85)">
    <rect width="310" height="255" rx="8" fill="#2E1C05" stroke="#F59E0B" stroke-width="2"/>
    <text x="155" y="26" font-size="13" font-weight="700" fill="#FDE68A" text-anchor="middle">2. 3VL Truth Reduction</text>

    <rect x="15" y="42" width="280" height="195" rx="6" fill="#451A03" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="155" y="66" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">ANSI Boolean Reduction</text>
    <text x="25" y="90" font-size="11" fill="#FDE68A" text-anchor="start">• Combining conjunction:</text>
    <text x="25" y="110" font-size="10.5" fill="#FDE68A" font-weight="600" class="code" text-anchor="start">  TRUE AND TRUE AND UNKNOWN</text>
    <text x="25" y="135" font-size="11" fill="#FDE68A" text-anchor="start">• In 3VL Truth Reduction:</text>
    <text x="25" y="155" font-size="11" fill="#EF4444" font-weight="600" text-anchor="start">  TRUE AND UNKNOWN = UNKNOWN</text>
    <text x="25" y="180" font-size="11" fill="#FDE68A" text-anchor="start">• Conjunction reduction:</text>
    <text x="25" y="202" font-size="11" fill="#EF4444" font-weight="700" text-anchor="start">  Propagates to UNKNOWN</text>
  </g>

  <!-- Card 3: Execution Outcome (x=825..1125) -->
  <g transform="translate(825, 85)">
    <rect width="300" height="255" rx="8" fill="#2A0B0B" stroke="#EF4444" stroke-width="2"/>
    <text x="150" y="26" font-size="13" font-weight="700" fill="#FCA5A5" text-anchor="middle">3. Database Engine Outcome</text>

    <rect x="15" y="42" width="270" height="195" rx="6" fill="#4C0505" stroke="#EF4444" stroke-width="1.2"/>
    <text x="150" y="66" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">WHERE Clause Filter</text>
    <text x="25" y="90" font-size="11" fill="#FCA5A5" text-anchor="start">• WHERE requires strictly TRUE</text>
    <text x="25" y="108" font-size="11" fill="#FCA5A5" text-anchor="start">• UNKNOWN is treated as FALSE</text>
    <text x="25" y="126" font-size="11" fill="#FCA5A5" text-anchor="start">  and discarded</text>
    <text x="25" y="150" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start">• 0 rows returned! Data dropped</text>
    <text x="25" y="175" font-size="11" fill="#6EE7B7" font-weight="600" text-anchor="start">✓ Production Fix:</text>
    <text x="25" y="195" font-size="11" fill="#6EE7B7" text-anchor="start">  Use NOT EXISTS or IS NOT NULL</text>
  </g>

  <!-- Connectors Layer: Painted AFTER all cards for 100% visibility -->
  <g id="connectors">
    <!-- Arrow 1 to 2 with clean pill label in 85px runway gap -->
    <path d="M 345 190 L 429 190" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr-a)"/>
    <rect x="353" y="173" width="68" height="34" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
    <text x="387" y="186" font-size="8.5" font-weight="600" fill="#FDE68A" text-anchor="middle">Boolean</text>
    <text x="387" y="199" font-size="8.5" font-weight="600" fill="#FDE68A" text-anchor="middle">Expansion</text>

    <!-- Arrow 2 to 3 with clean pill label in 85px runway gap -->
    <path d="M 740 190 L 824 190" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#arr-r)"/>
    <rect x="746" y="173" width="72" height="34" rx="4" fill="#1E293B" stroke="#EF4444" stroke-width="1"/>
    <text x="782" y="186" font-size="8" font-weight="600" fill="#FCA5A5" text-anchor="middle">Reduction to</text>
    <text x="782" y="199" font-size="8" font-weight="700" fill="#EF4444" text-anchor="middle">UNKNOWN</text>
  </g>
</svg>