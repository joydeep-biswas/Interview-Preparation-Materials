<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="380" viewBox="0 0 1080 380">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1080" height="380" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">DELETE vs. TRUNCATE vs. DROP: Disk, WAL, MVCC Bloat &amp; Locks</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Physical storage internals: Transaction logging overhead, table locks, and disk space reclamation</text>

  <!-- 3 Side-by-Side Strategy Cards (w=325 each) -->

  <!-- Card 1: DELETE -->
  <g transform="translate(30, 80)">
    <rect width="325" height="260" rx="8" fill="#2A0B0B" stroke="#EF4444" stroke-width="2"/>
    <text x="162" y="28" font-size="13" font-weight="700" fill="#FCA5A5" text-anchor="middle">DELETE (DML)</text>

    <rect x="15" y="45" width="295" height="195" rx="6" fill="#4C0505" stroke="#EF4444" stroke-width="1.2"/>
    <text x="162" y="68" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Row-by-Row Tuple Elimination</text>
    <text x="25" y="92" font-size="11" fill="#FCA5A5" text-anchor="start">• Type: Data Manipulation (DML)</text>
    <text x="25" y="112" font-size="11" fill="#FCA5A5" text-anchor="start">• WAL: Logs EVERY deleted tuple row-by-row</text>
    <text x="25" y="132" font-size="11" fill="#FCA5A5" text-anchor="start">• MVCC: Marks tuples as dead (Leaves bloat!)</text>
    <text x="25" y="152" font-size="11" fill="#FCA5A5" text-anchor="start">• Disk: Does NOT release physical disk space</text>
    <text x="25" y="172" font-size="11" fill="#FCA5A5" text-anchor="start">• Triggers: Fires ON DELETE triggers</text>
    <text x="25" y="192" font-size="11" fill="#FCA5A5" text-anchor="start">• Locking: RowExclusiveLock; can rollback</text>
    <text x="25" y="222" font-size="11" font-weight="700" fill="#EF4444" text-anchor="start">Speed: Very Slow for millions of rows</text>
  </g>

  <!-- Card 2: TRUNCATE -->
  <g transform="translate(380, 80)">
    <rect width="325" height="260" rx="8" fill="#0B132B" stroke="#3B82F6" stroke-width="2"/>
    <text x="162" y="28" font-size="13" font-weight="700" fill="#93C5FD" text-anchor="middle">TRUNCATE (DDL)</text>

    <rect x="15" y="45" width="295" height="195" rx="6" fill="#1C2541" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="162" y="68" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Storage Extent Deallocation</text>
    <text x="25" y="92" font-size="11" fill="#93C5FD" text-anchor="start">• Type: Data Definition (DDL)</text>
    <text x="25" y="112" font-size="11" fill="#93C5FD" text-anchor="start">• WAL: Minimal metadata logging only</text>
    <text x="25" y="132" font-size="11" fill="#93C5FD" text-anchor="start">• MVCC: Deallocates entire pages/extents</text>
    <text x="25" y="152" font-size="11" fill="#93C5FD" text-anchor="start">• Disk: Resets High Water Mark (HWM)</text>
    <text x="25" y="172" font-size="11" fill="#93C5FD" text-anchor="start">• Triggers: Does NOT fire row-level triggers</text>
    <text x="25" y="192" font-size="11" fill="#93C5FD" text-anchor="start">• Locking: AccessExclusiveLock on table</text>
    <text x="25" y="222" font-size="11" font-weight="700" fill="#60A5FA" text-anchor="start">Speed: Instantaneous (Millisecond)</text>
  </g>

  <!-- Card 3: DROP -->
  <g transform="translate(730, 80)">
    <rect width="320" height="260" rx="8" fill="#1A102F" stroke="#8B5CF6" stroke-width="2"/>
    <text x="160" y="28" font-size="13" font-weight="700" fill="#DDD6FE" text-anchor="middle">DROP TABLE (DDL)</text>

    <rect x="15" y="45" width="290" height="195" rx="6" fill="#2E1065" stroke="#8B5CF6" stroke-width="1.2"/>
    <text x="160" y="68" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Schema &amp; File System Removal</text>
    <text x="25" y="92" font-size="11" fill="#DDD6FE" text-anchor="start">• Type: Data Definition (DDL)</text>
    <text x="25" y="112" font-size="11" fill="#DDD6FE" text-anchor="start">• WAL: Logs catalog dictionary changes</text>
    <text x="25" y="132" font-size="11" fill="#DDD6FE" text-anchor="start">• Catalogs: Deletes schema, indexes, constr.</text>
    <text x="25" y="152" font-size="11" fill="#DDD6FE" text-anchor="start">• Disk: Unlinks data files from OS filesystem</text>
    <text x="25" y="172" font-size="11" fill="#DDD6FE" text-anchor="start">• Triggers: All table triggers destroyed</text>
    <text x="25" y="192" font-size="11" fill="#DDD6FE" text-anchor="start">• Locking: AccessExclusiveLock; drops object</text>
    <text x="25" y="222" font-size="11" font-weight="700" fill="#C4B5FD" text-anchor="start">Speed: Instantaneous (Metadata unlinked)</text>
  </g>
</svg>