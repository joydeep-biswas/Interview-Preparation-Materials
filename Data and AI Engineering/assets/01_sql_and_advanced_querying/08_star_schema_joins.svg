<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="0 0 1080 540">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1080" height="540" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Multi-Table Joins &amp; Star Schema Dimensional Querying</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Central High-Volume Fact Table surrounded by Low-Cardinality Dimension Tables joined on Foreign Keys</text>

  <!-- Top: DIM_DATE (Safely starts at y=95, completely clear of canvas header!) -->
  <g transform="translate(390, 95)">
    <rect width="300" height="85" rx="6" fill="#451A03" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="150" y="24" font-size="12" font-weight="700" fill="#FDE68A" text-anchor="middle">DIM_DATE</text>
    <text x="25" y="46" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="start">date_id [PK]</text>
    <text x="25" y="62" font-size="10" fill="#FDE68A" text-anchor="start">calendar_date, year, quarter, month</text>
    <text x="25" y="76" font-size="10" fill="#FDE68A" text-anchor="start">day_of_week, is_holiday_flag</text>
  </g>

  <!-- Arrow Top: Date to Fact -->
  <path d="M 540 180 L 540 223" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr-a)"/>
  <rect x="495" y="192" width="90" height="20" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
  <text x="540" y="206" font-size="9" fill="#FDE68A" font-weight="700" text-anchor="middle">date_id [FK]</text>

  <!-- Left: DIM_CUSTOMER -->
  <g transform="translate(40, 260)">
    <rect width="290" height="110" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
    <text x="145" y="24" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">DIM_CUSTOMER</text>
    <text x="20" y="48" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="start">customer_id [PK]</text>
    <text x="20" y="66" font-size="10" fill="#A7F3D0" text-anchor="start">first_name, last_name, email</text>
    <text x="20" y="82" font-size="10" fill="#A7F3D0" text-anchor="start">tier_code, country, signup_date</text>
    <text x="20" y="98" font-size="9" fill="#6EE7B7" text-anchor="start">Card: ~100k - 10M rows</text>
  </g>

  <!-- Arrow Left: Customer to Fact -->
  <path d="M 330 315 L 378 315" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- Center: FACT_SALES -->
  <g transform="translate(380, 225)">
    <rect width="320" height="180" rx="8" fill="#1C2541" stroke="#3B82F6" stroke-width="2"/>
    <text x="160" y="26" font-size="13" font-weight="700" fill="#93C5FD" text-anchor="middle">FACT_SALES (High Volume)</text>
    <line x1="15" y1="36" x2="305" y2="36" stroke="#3B82F6" stroke-width="1"/>
    <text x="25" y="56" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="start">sales_id [PK]</text>
    <text x="25" y="74" font-size="11" fill="#FDE68A" text-anchor="start">date_id [FK] → dim_date</text>
    <text x="25" y="92" font-size="11" fill="#6EE7B7" text-anchor="start">customer_id [FK] → dim_customer</text>
    <text x="25" y="110" font-size="11" fill="#C4B5FD" text-anchor="start">product_id [FK] → dim_product</text>
    <text x="25" y="128" font-size="11" fill="#FCA5A5" text-anchor="start">store_id [FK] → dim_store</text>
    <text x="25" y="152" font-size="11" fill="#94A3B8" text-anchor="start">Measures: quantity, unit_price, total_amt</text>
  </g>

  <!-- Right: DIM_PRODUCT -->
  <g transform="translate(750, 260)">
    <rect width="290" height="110" rx="6" fill="#2E1065" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="145" y="24" font-size="12" font-weight="700" fill="#DDD6FE" text-anchor="middle">DIM_PRODUCT</text>
    <text x="20" y="48" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="start">product_id [PK]</text>
    <text x="20" y="66" font-size="10" fill="#C4B5FD" text-anchor="start">sku, product_name, brand</text>
    <text x="20" y="82" font-size="10" fill="#C4B5FD" text-anchor="start">category, subcategory, cost_price</text>
    <text x="20" y="98" font-size="9" fill="#DDD6FE" text-anchor="start">Card: ~10k - 500k rows</text>
  </g>

  <!-- Arrow Right: Product to Fact -->
  <path d="M 750 315 L 702 315" fill="none" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arr-p)"/>

  <!-- Bottom: DIM_STORE -->
  <g transform="translate(390, 435)">
    <rect width="300" height="80" rx="6" fill="#4C0505" stroke="#EF4444" stroke-width="1.5"/>
    <text x="150" y="24" font-size="12" font-weight="700" fill="#FCA5A5" text-anchor="middle">DIM_STORE</text>
    <text x="25" y="46" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="start">store_id [PK]</text>
    <text x="25" y="64" font-size="10" fill="#FCA5A5" text-anchor="start">store_name, region_code, city, country</text>
  </g>

  <!-- Arrow Bottom: Store to Fact -->
  <path d="M 540 435 L 540 407" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#arr-r)"/>
  <rect x="495" y="412" width="90" height="20" rx="4" fill="#1E293B" stroke="#EF4444" stroke-width="1"/>
  <text x="540" y="426" font-size="9" fill="#FCA5A5" font-weight="700" text-anchor="middle">store_id [FK]</text>
</svg>