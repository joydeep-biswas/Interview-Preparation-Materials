<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="600" viewBox="0 0 1160 600">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1160" height="600" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Multi-Table Joins &amp; Star Schema Querying</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Central Fact Table surrounded by De-normalized Dimension Tables with Foreign Key integrity</text>

  <!-- Top: DIM_DATE (x=420..740, y=85..170) -->
  <g transform="translate(420, 85)">
    <rect width="320" height="85" rx="6" fill="#2E1C05" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="160" y="22" font-size="12" font-weight="700" fill="#FDE68A" text-anchor="middle">DIM_DATE</text>
    <text x="25" y="44" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="start">date_id [PK]</text>
    <text x="25" y="60" font-size="10" fill="#FDE68A" text-anchor="start">calendar_date, day_of_week, month, quarter, year</text>
    <text x="25" y="74" font-size="10" fill="#FDE68A" text-anchor="start">Card: ~3,650 rows (10-year span)</text>
  </g>

  <!-- Center: FACT_SALES (x=420..740, y=240..415) -->
  <g transform="translate(420, 240)">
    <rect width="320" height="175" rx="8" fill="#1C2541" stroke="#3B82F6" stroke-width="2"/>
    <text x="160" y="24" font-size="13" font-weight="700" fill="#93C5FD" text-anchor="middle">FACT_SALES (Center Hub)</text>
    <line x1="15" y1="34" x2="305" y2="34" stroke="#3B82F6" stroke-width="1"/>
    <text x="25" y="52" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="start">sales_id [PK]</text>
    <text x="25" y="70" font-size="11" fill="#FDE68A" text-anchor="start">date_id [FK] → dim_date</text>
    <text x="25" y="88" font-size="11" fill="#6EE7B7" text-anchor="start">customer_id [FK] → dim_customer</text>
    <text x="25" y="106" font-size="11" fill="#C4B5FD" text-anchor="start">product_id [FK] → dim_product</text>
    <text x="25" y="124" font-size="11" fill="#FCA5A5" text-anchor="start">store_id [FK] → dim_store</text>
    <text x="25" y="148" font-size="11" fill="#94A3B8" text-anchor="start">Measures: units, revenue, cost, discount_amt</text>
    <text x="25" y="164" font-size="10" fill="#94A3B8" text-anchor="start">Card: ~10M - 10B rows</text>
  </g>

  <!-- Left: DIM_CUSTOMER (x=30..310, y=275..380) -->
  <g transform="translate(30, 275)">
    <rect width="280" height="105" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
    <text x="140" y="22" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">DIM_CUSTOMER</text>
    <text x="20" y="44" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="start">customer_id [PK]</text>
    <text x="20" y="60" font-size="10" fill="#A7F3D0" text-anchor="start">first_name, last_name, email, city</text>
    <text x="20" y="76" font-size="10" fill="#A7F3D0" text-anchor="start">tier_code, country, signup_date</text>
    <text x="20" y="92" font-size="9" fill="#6EE7B7" text-anchor="start">Card: ~100k - 10M rows</text>
  </g>

  <!-- Right: DIM_PRODUCT (x=850..1130, y=275..380) -->
  <g transform="translate(850, 275)">
    <rect width="280" height="105" rx="6" fill="#2E1065" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="140" y="22" font-size="12" font-weight="700" fill="#DDD6FE" text-anchor="middle">DIM_PRODUCT</text>
    <text x="20" y="44" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="start">product_id [PK]</text>
    <text x="20" y="60" font-size="10" fill="#C4B5FD" text-anchor="start">sku, product_name, brand, category</text>
    <text x="20" y="76" font-size="10" fill="#C4B5FD" text-anchor="start">subcategory, unit_cost, list_price</text>
    <text x="20" y="92" font-size="9" fill="#DDD6FE" text-anchor="start">Card: ~10k - 1M rows</text>
  </g>

  <!-- Bottom: DIM_STORE (x=420..740, y=485..570) -->
  <g transform="translate(420, 485)">
    <rect width="320" height="85" rx="6" fill="#4C0505" stroke="#EF4444" stroke-width="1.5"/>
    <text x="160" y="22" font-size="12" font-weight="700" fill="#FCA5A5" text-anchor="middle">DIM_STORE</text>
    <text x="25" y="44" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="start">store_id [PK]</text>
    <text x="25" y="60" font-size="10" fill="#FCA5A5" text-anchor="start">store_name, city, country, format</text>
    <text x="25" y="74" font-size="10" fill="#FCA5A5" text-anchor="start">Card: ~10 - 10k physical locations</text>
  </g>

  <!-- Connectors Layer: Painted AFTER all cards with perfect runway spacing and zero overlap -->
  <g id="connectors">
    <!-- Top Arrow: Date to Fact (y=170..240) -->
    <path d="M 580 170 L 580 239" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr-a)"/>
    <rect x="535" y="194" width="90" height="22" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
    <text x="580" y="209" font-size="9" fill="#FDE68A" font-weight="700" text-anchor="middle">date_id [FK]</text>

    <!-- Left Arrow: Customer to Fact (x=310..420) -->
    <path d="M 310 327 L 419 327" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>
    <rect x="317" y="316" width="96" height="22" rx="4" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
    <text x="365" y="331" font-size="9" fill="#6EE7B7" font-weight="700" text-anchor="middle">customer_id [FK]</text>

    <!-- Right Arrow: Product to Fact (x=850..740) -->
    <path d="M 850 327 L 741 327" fill="none" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arr-p)"/>
    <rect x="747" y="316" width="96" height="22" rx="4" fill="#1E293B" stroke="#8B5CF6" stroke-width="1"/>
    <text x="795" y="331" font-size="9" fill="#DDD6FE" font-weight="700" text-anchor="middle">product_id [FK]</text>

    <!-- Bottom Arrow: Store to Fact (y=485..415) -->
    <path d="M 580 485 L 580 416" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#arr-r)"/>
    <rect x="535" y="439" width="90" height="22" rx="4" fill="#1E293B" stroke="#EF4444" stroke-width="1"/>
    <text x="580" y="454" font-size="9" fill="#FCA5A5" font-weight="700" text-anchor="middle">store_id [FK]</text>
  </g>
</svg>