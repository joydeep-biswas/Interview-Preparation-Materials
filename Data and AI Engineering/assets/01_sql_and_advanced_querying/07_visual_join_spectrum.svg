<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1080" height="360" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">The Visual Join Spectrum: Relational Algebra Cardinality</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Inner, Left Outer, Right Outer, Full Outer, and Cross Joins: Matched tuples vs. NULL-padded rows</text>

  <!-- 5 Equal Width Cards across the Canvas (w=195 each) -->
  
  <!-- 1. Inner Join -->
  <g transform="translate(30, 80)">
    <rect width="195" height="240" rx="8" fill="#0B132B" stroke="#3B82F6" stroke-width="2"/>
    <text x="97" y="28" font-size="12" font-weight="700" fill="#93C5FD" text-anchor="middle">INNER JOIN</text>
    <rect x="12" y="45" width="171" height="60" rx="4" fill="#1C2541" stroke="#3B82F6" stroke-width="1"/>
    <!-- Venn Graphic -->
    <circle cx="70" cy="75" r="22" fill="#1E293B" stroke="#3B82F6" stroke-width="1.2" opacity="0.7"/>
    <circle cx="101" cy="75" r="22" fill="#1E293B" stroke="#3B82F6" stroke-width="1.2" opacity="0.7"/>
    <path d="M 85 58 A 22 22 0 0 1 85 92 A 22 22 0 0 1 85 58" fill="#3B82F6" opacity="0.9"/>
    <text x="85.5" y="78" font-size="9" fill="#FFFFFF" font-weight="700" text-anchor="middle">A ∩ B</text>

    <text x="16" y="125" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="start">Strict Intersection</text>
    <text x="16" y="145" font-size="10" fill="#94A3B8" text-anchor="start">• Returns ONLY rows where</text>
    <text x="16" y="160" font-size="10" fill="#94A3B8" text-anchor="start">  join predicate evaluates</text>
    <text x="16" y="175" font-size="10" fill="#94A3B8" text-anchor="start">  strictly to TRUE</text>
    <text x="16" y="195" font-size="10" fill="#FCA5A5" text-anchor="start">• Drops non-matching A</text>
    <text x="16" y="210" font-size="10" fill="#FCA5A5" text-anchor="start">• Drops non-matching B</text>
  </g>

  <!-- 2. Left Outer Join -->
  <g transform="translate(240, 80)">
    <rect width="195" height="240" rx="8" fill="#0B132B" stroke="#10B981" stroke-width="2"/>
    <text x="97" y="28" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">LEFT OUTER JOIN</text>
    <rect x="12" y="45" width="171" height="60" rx="4" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <!-- Venn Graphic -->
    <circle cx="70" cy="75" r="22" fill="#10B981" stroke="#10B981" stroke-width="1.2" opacity="0.8"/>
    <circle cx="101" cy="75" r="22" fill="#1E293B" stroke="#10B981" stroke-width="1.2" opacity="0.7"/>
    <text x="70" y="78" font-size="9" fill="#FFFFFF" font-weight="700" text-anchor="middle">All A</text>

    <text x="16" y="125" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="start">Preserves Left Table</text>
    <text x="16" y="145" font-size="10" fill="#A7F3D0" text-anchor="start">• All rows from Left table</text>
    <text x="16" y="160" font-size="10" fill="#A7F3D0" text-anchor="start">  are guaranteed preserved</text>
    <text x="16" y="180" font-size="10" fill="#94A3B8" text-anchor="start">• Matched rows get B vals</text>
    <text x="16" y="200" font-size="10" fill="#FDE68A" text-anchor="start">• Missing right matches are</text>
    <text x="16" y="215" font-size="10" fill="#FDE68A" text-anchor="start">  padded with NULLs</text>
  </g>

  <!-- 3. Right Outer Join -->
  <g transform="translate(450, 80)">
    <rect width="195" height="240" rx="8" fill="#0B132B" stroke="#F59E0B" stroke-width="2"/>
    <text x="97" y="28" font-size="12" font-weight="700" fill="#FDE68A" text-anchor="middle">RIGHT OUTER JOIN</text>
    <rect x="12" y="45" width="171" height="60" rx="4" fill="#451A03" stroke="#F59E0B" stroke-width="1"/>
    <!-- Venn Graphic -->
    <circle cx="70" cy="75" r="22" fill="#1E293B" stroke="#F59E0B" stroke-width="1.2" opacity="0.7"/>
    <circle cx="101" cy="75" r="22" fill="#F59E0B" stroke="#F59E0B" stroke-width="1.2" opacity="0.8"/>
    <text x="101" y="78" font-size="9" fill="#FFFFFF" font-weight="700" text-anchor="middle">All B</text>

    <text x="16" y="125" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="start">Preserves Right Table</text>
    <text x="16" y="145" font-size="10" fill="#FDE68A" text-anchor="start">• All rows from Right table</text>
    <text x="16" y="160" font-size="10" fill="#FDE68A" text-anchor="start">  are guaranteed preserved</text>
    <text x="16" y="180" font-size="10" fill="#94A3B8" text-anchor="start">• Matched rows get A vals</text>
    <text x="16" y="200" font-size="10" fill="#FDE68A" text-anchor="start">• Missing left matches are</text>
    <text x="16" y="215" font-size="10" fill="#FDE68A" text-anchor="start">  padded with NULLs</text>
  </g>

  <!-- 4. Full Outer Join -->
  <g transform="translate(660, 80)">
    <rect width="195" height="240" rx="8" fill="#1A102F" stroke="#8B5CF6" stroke-width="2"/>
    <text x="97" y="28" font-size="12" font-weight="700" fill="#DDD6FE" text-anchor="middle">FULL OUTER JOIN</text>
    <rect x="12" y="45" width="171" height="60" rx="4" fill="#2E1065" stroke="#8B5CF6" stroke-width="1"/>
    <!-- Venn Graphic -->
    <circle cx="70" cy="75" r="22" fill="#8B5CF6" stroke="#8B5CF6" stroke-width="1.2" opacity="0.8"/>
    <circle cx="101" cy="75" r="22" fill="#8B5CF6" stroke="#8B5CF6" stroke-width="1.2" opacity="0.8"/>
    <text x="85.5" y="78" font-size="9" fill="#FFFFFF" font-weight="700" text-anchor="middle">A ∪ B</text>

    <text x="16" y="125" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="start">Complete Union</text>
    <text x="16" y="145" font-size="10" fill="#C4B5FD" text-anchor="start">• Preserves ALL rows from</text>
    <text x="16" y="160" font-size="10" fill="#C4B5FD" text-anchor="start">  both Table A and Table B</text>
    <text x="16" y="180" font-size="10" fill="#94A3B8" text-anchor="start">• Joins matching pairs</text>
    <text x="16" y="200" font-size="10" fill="#FDE68A" text-anchor="start">• Unmatched rows on either</text>
    <text x="16" y="215" font-size="10" fill="#FDE68A" text-anchor="start">  side are NULL-padded</text>
  </g>

  <!-- 5. Cross Join -->
  <g transform="translate(870, 80)">
    <rect width="180" height="240" rx="8" fill="#2A0B0B" stroke="#EF4444" stroke-width="2"/>
    <text x="90" y="28" font-size="12" font-weight="700" fill="#FCA5A5" text-anchor="middle">CROSS JOIN</text>
    <rect x="12" y="45" width="156" height="60" rx="4" fill="#4C0505" stroke="#EF4444" stroke-width="1"/>
    <!-- Grid Graphic -->
    <text x="78" y="72" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">|A| × |B|</text>
    <text x="78" y="90" font-size="9" fill="#FCA5A5" text-anchor="middle">Cartesian Product</text>

    <text x="14" y="125" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="start">Cartesian Multiplier</text>
    <text x="14" y="145" font-size="10" fill="#FCA5A5" text-anchor="start">• No join predicate</text>
    <text x="14" y="160" font-size="10" fill="#FCA5A5" text-anchor="start">• Pairs every row of A</text>
    <text x="14" y="175" font-size="10" fill="#FCA5A5" text-anchor="start">  with every row of B</text>
    <text x="14" y="195" font-size="10" fill="#EF4444" font-weight="600" text-anchor="start">⚠️ High danger:</text>
    <text x="14" y="210" font-size="10" fill="#EF4444" text-anchor="start">  10k × 10k = 100M rows!</text>
  </g>
</svg>