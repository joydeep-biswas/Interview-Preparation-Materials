<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6" />
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981" />
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B" />
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6" />
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444" />
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B" />
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1080" height="360" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5" />
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">The Visual Join Spectrum: Relational Algebra Cardinality</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Inner, Left Outer, Right Outer, Full Outer, and Cross Joins: Matched tuples vs. NULL-padded rows</text>

  <!-- 5 Equal Width Cards across Canvas (w=194, h=250, spacing=16) -->
  
  <!-- 1. Inner Join -->
  <g transform="translate(25, 80)">
    <rect width="194" height="250" rx="8" fill="#0B132B" stroke="#3B82F6" stroke-width="2" />
    <text x="97" y="26" font-size="12" font-weight="700" fill="#93C5FD" text-anchor="middle">INNER JOIN</text>
    
    <!-- Graphic Box -->
    <rect x="12" y="38" width="170" height="66" rx="4" fill="#1C2541" stroke="#3B82F6" stroke-width="1" />
    <circle cx="70" cy="71" r="20" fill="#1E293B" stroke="#3B82F6" stroke-width="1.2" opacity="0.7" />
    <circle cx="100" cy="71" r="20" fill="#1E293B" stroke="#3B82F6" stroke-width="1.2" opacity="0.7" />
    <path d="M 85 55 A 20 20 0 0 1 85 87 A 20 20 0 0 1 85 55" fill="#3B82F6" opacity="0.9" />
    <text x="85" y="74" font-size="9" fill="#FFFFFF" font-weight="700" text-anchor="middle">A ∩ B</text>

    <!-- Content -->
    <text x="16" y="124" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start">Strict Intersection</text>
    <text x="16" y="144" font-size="10" fill="#94A3B8" text-anchor="start">• Only matching rows</text>
    <text x="16" y="159" font-size="10" fill="#94A3B8" text-anchor="start">• Predicate = TRUE</text>
    <text x="16" y="174" font-size="10" fill="#FCA5A5" text-anchor="start">• Drops unmatched A</text>
    <text x="16" y="189" font-size="10" fill="#FCA5A5" text-anchor="start">• Drops unmatched B</text>

    <!-- Cardinality Pill -->
    <rect x="12" y="208" width="170" height="24" rx="4" fill="#0F172A" stroke="#3B82F6" stroke-width="0.8" />
    <text x="97" y="224" font-size="9.5" font-weight="600" fill="#93C5FD" text-anchor="middle">|Out| ≤ min(|A|, |B|)</text>
  </g>

  <!-- 2. Left Outer Join -->
  <g transform="translate(235, 80)">
    <rect width="194" height="250" rx="8" fill="#062828" stroke="#10B981" stroke-width="2" />
    <text x="97" y="26" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">LEFT OUTER JOIN</text>
    
    <!-- Graphic Box -->
    <rect x="12" y="38" width="170" height="66" rx="4" fill="#064E3B" stroke="#10B981" stroke-width="1" />
    <circle cx="70" cy="71" r="20" fill="#10B981" stroke="#10B981" stroke-width="1.2" opacity="0.8" />
    <circle cx="100" cy="71" r="20" fill="#1E293B" stroke="#10B981" stroke-width="1.2" opacity="0.7" />
    <text x="70" y="74" font-size="9" fill="#FFFFFF" font-weight="700" text-anchor="middle">All A</text>

    <!-- Content -->
    <text x="16" y="124" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start">Preserves Left Table</text>
    <text x="16" y="144" font-size="10" fill="#A7F3D0" text-anchor="start">• Preserves ALL rows of A</text>
    <text x="16" y="159" font-size="10" fill="#94A3B8" text-anchor="start">• Matched rows get B attrs</text>
    <text x="16" y="174" font-size="10" fill="#FDE68A" text-anchor="start">• Unmatched right matches</text>
    <text x="16" y="189" font-size="10" fill="#FDE68A" text-anchor="start">  padded with NULLs</text>

    <!-- Cardinality Pill -->
    <rect x="12" y="208" width="170" height="24" rx="4" fill="#0F172A" stroke="#10B981" stroke-width="0.8" />
    <text x="97" y="224" font-size="9.5" font-weight="600" fill="#6EE7B7" text-anchor="middle">|Out| ≥ |A|</text>
  </g>

  <!-- 3. Right Outer Join -->
  <g transform="translate(445, 80)">
    <rect width="194" height="250" rx="8" fill="#291800" stroke="#F59E0B" stroke-width="2" />
    <text x="97" y="26" font-size="12" font-weight="700" fill="#FDE68A" text-anchor="middle">RIGHT OUTER JOIN</text>
    
    <!-- Graphic Box -->
    <rect x="12" y="38" width="170" height="66" rx="4" fill="#451A03" stroke="#F59E0B" stroke-width="1" />
    <circle cx="70" cy="71" r="20" fill="#1E293B" stroke="#F59E0B" stroke-width="1.2" opacity="0.7" />
    <circle cx="100" cy="71" r="20" fill="#F59E0B" stroke="#F59E0B" stroke-width="1.2" opacity="0.8" />
    <text x="100" y="74" font-size="9" fill="#FFFFFF" font-weight="700" text-anchor="middle">All B</text>

    <!-- Content -->
    <text x="16" y="124" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start">Preserves Right Table</text>
    <text x="16" y="144" font-size="10" fill="#FDE68A" text-anchor="start">• Preserves ALL rows of B</text>
    <text x="16" y="159" font-size="10" fill="#94A3B8" text-anchor="start">• Matched rows get A attrs</text>
    <text x="16" y="174" font-size="10" fill="#FDE68A" text-anchor="start">• Unmatched left matches</text>
    <text x="16" y="189" font-size="10" fill="#FDE68A" text-anchor="start">  padded with NULLs</text>

    <!-- Cardinality Pill -->
    <rect x="12" y="208" width="170" height="24" rx="4" fill="#0F172A" stroke="#F59E0B" stroke-width="0.8" />
    <text x="97" y="224" font-size="9.5" font-weight="600" fill="#FDE68A" text-anchor="middle">|Out| ≥ |B|</text>
  </g>

  <!-- 4. Full Outer Join -->
  <g transform="translate(655, 80)">
    <rect width="194" height="250" rx="8" fill="#1A102F" stroke="#8B5CF6" stroke-width="2" />
    <text x="97" y="26" font-size="12" font-weight="700" fill="#DDD6FE" text-anchor="middle">FULL OUTER JOIN</text>
    
    <!-- Graphic Box -->
    <rect x="12" y="38" width="170" height="66" rx="4" fill="#2E1065" stroke="#8B5CF6" stroke-width="1" />
    <circle cx="70" cy="71" r="20" fill="#8B5CF6" stroke="#8B5CF6" stroke-width="1.2" opacity="0.8" />
    <circle cx="100" cy="71" r="20" fill="#8B5CF6" stroke="#8B5CF6" stroke-width="1.2" opacity="0.8" />
    <text x="85" y="74" font-size="9" fill="#FFFFFF" font-weight="700" text-anchor="middle">A ∪ B</text>

    <!-- Content -->
    <text x="16" y="124" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start">Complete Union</text>
    <text x="16" y="144" font-size="10" fill="#C4B5FD" text-anchor="start">• Preserves ALL rows A &amp; B</text>
    <text x="16" y="159" font-size="10" fill="#94A3B8" text-anchor="start">• Matches pairs when TRUE</text>
    <text x="16" y="174" font-size="10" fill="#FDE68A" text-anchor="start">• Unmatched on either side</text>
    <text x="16" y="189" font-size="10" fill="#FDE68A" text-anchor="start">  padded with NULLs</text>

    <!-- Cardinality Pill -->
    <rect x="12" y="208" width="170" height="24" rx="4" fill="#0F172A" stroke="#8B5CF6" stroke-width="0.8" />
    <text x="97" y="224" font-size="9.5" font-weight="600" fill="#C4B5FD" text-anchor="middle">|Out| ≥ max(|A|, |B|)</text>
  </g>

  <!-- 5. Cross Join -->
  <g transform="translate(865, 80)">
    <rect width="194" height="250" rx="8" fill="#2A0B0B" stroke="#EF4444" stroke-width="2" />
    <text x="97" y="26" font-size="12" font-weight="700" fill="#FCA5A5" text-anchor="middle">CROSS JOIN</text>
    
    <!-- Graphic Box -->
    <rect x="12" y="38" width="170" height="66" rx="4" fill="#4C0505" stroke="#EF4444" stroke-width="1" />
    <text x="85" y="65" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">|A| × |B|</text>
    <text x="85" y="84" font-size="9.5" fill="#FCA5A5" text-anchor="middle">Cartesian Product</text>

    <!-- Content -->
    <text x="16" y="124" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start">Cartesian Multiplier</text>
    <text x="16" y="144" font-size="10" fill="#FCA5A5" text-anchor="start">• No join predicate</text>
    <text x="16" y="159" font-size="10" fill="#FCA5A5" text-anchor="start">• Pairs each row of A</text>
    <text x="16" y="174" font-size="10" fill="#FCA5A5" text-anchor="start">  with every row of B</text>
    <text x="16" y="189" font-size="10" fill="#EF4444" font-weight="600" text-anchor="start">⚠️ Danger: row explosion!</text>

    <!-- Cardinality Pill -->
    <rect x="12" y="208" width="170" height="24" rx="4" fill="#0F172A" stroke="#EF4444" stroke-width="0.8" />
    <text x="97" y="224" font-size="9.5" font-weight="600" fill="#FCA5A5" text-anchor="middle">|Out| = |A| × |B|</text>
  </g>
</svg>
