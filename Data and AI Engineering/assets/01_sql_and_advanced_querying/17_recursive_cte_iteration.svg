<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="480" viewBox="0 0 1180 480">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1180" height="480" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Recursive CTEs: Fixed-Point Relational Iteration &amp; Cycle Guard</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">ANSI SQL recursive execution semantics: Working Table iteration, loopback feedback, and graph cycle prevention</text>

  <!-- Step 0: Anchor Member -->
  <g transform="translate(30, 80)">
    <rect width="240" height="260" rx="8" fill="#0B132B" stroke="#3B82F6" stroke-width="2"/>
    <text x="120" y="28" font-size="13" font-weight="700" fill="#93C5FD" text-anchor="middle">Step 0: Anchor Member</text>

    <rect x="15" y="45" width="210" height="195" rx="6" fill="#1C2541" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="120" y="68" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Seeds Initial State</text>
    <text x="25" y="92" font-size="11" fill="#94A3B8" text-anchor="start">• Executes non-recursive query</text>
    <text x="25" y="110" font-size="11" fill="#94A3B8" text-anchor="start">• e.g. root manager, start date</text>
    <text x="25" y="132" font-size="11" font-weight="600" fill="#60A5FA" text-anchor="start">Initializes Working Table W0</text>
    <text x="25" y="152" font-size="11" fill="#94A3B8" text-anchor="start">• Copies W0 into Result Set R</text>
    <text x="25" y="172" font-size="11" fill="#94A3B8" text-anchor="start">• Initializes path array:</text>
    <text x="25" y="190" font-size="10" fill="#FDE68A" class="code" text-anchor="start">  ARRAY[id] AS visited_path</text>
    <text x="25" y="215" font-size="10" fill="#3B82F6" font-weight="700" text-anchor="start">Iteration: N = 0</text>
  </g>

  <!-- Arrow 0 to 1 -->
  <path d="M 270 210 L 308 210" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr-a)"/>

  <!-- Step 1: Recursive Member Join -->
  <g transform="translate(310, 80)">
    <rect width="250" height="260" rx="8" fill="#2E1C05" stroke="#F59E0B" stroke-width="2"/>
    <text x="125" y="28" font-size="13" font-weight="700" fill="#FDE68A" text-anchor="middle">Step N: Recursive Member</text>

    <rect x="15" y="45" width="220" height="195" rx="6" fill="#451A03" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="125" y="68" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Joins with W_N</text>
    <text x="25" y="92" font-size="11" fill="#FDE68A" text-anchor="start">• References working table W_N</text>
    <text x="25" y="110" font-size="11" fill="#FDE68A" text-anchor="start">• Evaluates join with base table</text>
    <text x="25" y="130" font-size="11" fill="#FDE68A" text-anchor="start">  (e.g. employee.mgr = W_N.id)</text>
    <text x="25" y="152" font-size="11" font-weight="600" fill="#FDE68A" text-anchor="start">Generates Candidate W_N+1</text>
    <text x="25" y="172" font-size="11" fill="#FDE68A" text-anchor="start">• Appends child to path:</text>
    <text x="25" y="190" font-size="10" fill="#FFFFFF" class="code" text-anchor="start">  visited_path || child_id</text>
    <text x="25" y="215" font-size="10" fill="#F59E0B" font-weight="700" text-anchor="start">Next Level Generated</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 560 210 L 598 210" fill="none" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arr-p)"/>

  <!-- Step 2: Cycle Guard -->
  <g transform="translate(600, 80)">
    <rect width="250" height="260" rx="8" fill="#1A102F" stroke="#8B5CF6" stroke-width="2"/>
    <text x="125" y="28" font-size="13" font-weight="700" fill="#DDD6FE" text-anchor="middle">Step 2: Cycle Guard</text>

    <rect x="15" y="45" width="220" height="195" rx="6" fill="#2E1065" stroke="#8B5CF6" stroke-width="1.2"/>
    <text x="125" y="68" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Graph Cycle Detection</text>
    <text x="25" y="92" font-size="11" fill="#DDD6FE" text-anchor="start">• Evaluates cycle predicate:</text>
    <text x="25" y="110" font-size="10" fill="#FCA5A5" class="code" text-anchor="start">  child_id = ANY(visited_path)</text>
    <text x="25" y="132" font-size="11" fill="#EF4444" font-weight="600" text-anchor="start">If Cycle Detected:</text>
    <text x="25" y="150" font-size="11" fill="#FCA5A5" text-anchor="start">  Abort / Halt immediately!</text>
    <text x="25" y="172" font-size="11" fill="#6EE7B7" font-weight="600" text-anchor="start">If Cycle Safe:</text>
    <text x="25" y="190" font-size="11" fill="#A7F3D0" text-anchor="start">  Proceed to Fixed-Point check</text>
    <text x="25" y="215" font-size="10" fill="#8B5CF6" font-weight="700" text-anchor="start">Guarantees Termination</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 850 210 L 888 210" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- Step 3: Fixed-Point Check &amp; Loopback -->
  <g transform="translate(890, 80)">
    <rect width="260" height="260" rx="8" fill="#062828" stroke="#10B981" stroke-width="2"/>
    <text x="130" y="28" font-size="13" font-weight="700" fill="#6EE7B7" text-anchor="middle">Step 3: Fixed-Point Check</text>

    <rect x="15" y="45" width="230" height="195" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
    <text x="130" y="68" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Is W_N+1 Empty (Ø)?</text>
    <text x="25" y="95" font-size="11" fill="#A7F3D0" text-anchor="start">• If Rows Exist (NOT Empty):</text>
    <text x="25" y="112" font-size="11" fill="#6EE7B7" text-anchor="start">  Union W_N+1 into Result R</text>
    <text x="25" y="128" font-size="11" fill="#6EE7B7" font-weight="600" text-anchor="start">  FEED BACK INTO STEP N!</text>

    <text x="25" y="156" font-size="11" fill="#A7F3D0" text-anchor="start">• If W_N+1 is Empty (Ø):</text>
    <text x="25" y="174" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="start">  FIXED POINT REACHED!</text>
    <text x="25" y="192" font-size="11" fill="#A7F3D0" text-anchor="start">  Halt loop; return final R</text>
    <text x="25" y="215" font-size="10" fill="#10B981" font-weight="700" text-anchor="start">Final Output Materialized</text>
  </g>

  <!-- CLOSED LOOPBACK ARROW: Curves from Step 3 back to Step 1 -->
  <path d="M 1020 340 L 1020 390 L 435 390 L 435 348" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arr-a)"/>
  <rect x="630" y="378" width="220" height="24" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="740" y="394" font-size="11" fill="#FDE68A" font-weight="700" text-anchor="middle">Loop Back: Feed W_N+1 into Step N</text>
</svg>