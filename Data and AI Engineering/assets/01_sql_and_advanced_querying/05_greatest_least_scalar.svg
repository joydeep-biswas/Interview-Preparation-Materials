<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="380" viewBox="0 0 1080 380">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1080" height="380" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Vertical Aggregates vs. Horizontal Scalar Comparisons</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">MAX()/MIN() across multiple rows vs. GREATEST()/LEAST() across multiple columns in a single row</text>

  <!-- Left: Vertical Aggregate MAX() (w=460, x=35..495) -->
  <g transform="translate(35, 85)">
    <rect width="460" height="255" rx="8" fill="#0B132B" stroke="#3B82F6" stroke-width="2"/>
    <text x="230" y="26" font-size="13" font-weight="700" fill="#93C5FD" text-anchor="middle">Vertical Aggregate: MAX(salary)</text>

    <rect x="15" y="42" width="430" height="195" rx="6" fill="#1C2541" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="215" y="66" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Collapses Multiple Rows into 1 Scalar Result</text>

    <!-- Column Graphic -->
    <rect x="25" y="85" width="135" height="26" rx="4" fill="#0F172A" stroke="#3B82F6"/>
    <text x="92.5" y="102" font-size="10" fill="#93C5FD" text-anchor="middle">Row 1: $100,000</text>

    <rect x="25" y="115" width="135" height="26" rx="4" fill="#0F172A" stroke="#3B82F6"/>
    <text x="92.5" y="132" font-size="10" fill="#93C5FD" text-anchor="middle">Row 2: $150,000</text>

    <rect x="25" y="145" width="135" height="26" rx="4" fill="#0F172A" stroke="#3B82F6"/>
    <text x="92.5" y="162" font-size="10" fill="#93C5FD" text-anchor="middle">Row 3: $120,000</text>

    <text x="92.5" y="196" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">MAX() = $150,000</text>

    <!-- Bullets -->
    <text x="175" y="96" font-size="11" fill="#A7F3D0" text-anchor="start">• Evaluates vertically down 1 column</text>
    <text x="175" y="116" font-size="11" fill="#A7F3D0" text-anchor="start">• Collapses N rows → 1 scalar output</text>
    <text x="175" y="136" font-size="11" fill="#A7F3D0" text-anchor="start">• Automatically skips NULL values</text>
    <text x="175" y="158" font-size="11" fill="#EF4444" font-weight="600" text-anchor="start">⚠️ Banned in WHERE clause</text>
    <text x="175" y="174" font-size="11" fill="#EF4444" font-weight="600" text-anchor="start">   (requires HAVING or subquery)</text>
    <text x="175" y="196" font-size="11" fill="#A7F3D0" text-anchor="start">• Needs GROUP BY with other cols</text>
  </g>

  <!-- Right: Horizontal Scalar GREATEST() (w=465, x=580..1045) -->
  <g transform="translate(580, 85)">
    <rect width="465" height="255" rx="8" fill="#062828" stroke="#10B981" stroke-width="2"/>
    <text x="232.5" y="26" font-size="13" font-weight="700" fill="#6EE7B7" text-anchor="middle">Horizontal Scalar: GREATEST(col_a, col_b, col_c)</text>

    <rect x="15" y="42" width="435" height="195" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
    <text x="217.5" y="66" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Preserves Row Count; Evaluates Columns Horizontally</text>

    <!-- Row Graphic -->
    <rect x="25" y="85" width="195" height="26" rx="4" fill="#1C2541" stroke="#3B82F6"/>
    <text x="35" y="102" font-size="10" fill="#93C5FD" text-anchor="start">A: 100</text>
    <text x="80" y="102" font-size="10" fill="#93C5FD" text-anchor="start">B: 150</text>
    <text x="125" y="102" font-size="10" fill="#93C5FD" text-anchor="start">C: 120</text>
    <text x="188" y="102" font-size="10" font-weight="700" fill="#FDE68A" text-anchor="start">150</text>

    <rect x="25" y="120" width="195" height="26" rx="4" fill="#1C2541" stroke="#3B82F6"/>
    <text x="35" y="137" font-size="10" fill="#93C5FD" text-anchor="start">A: 90</text>
    <text x="80" y="137" font-size="10" fill="#93C5FD" text-anchor="start">B: 12</text>
    <text x="125" y="137" font-size="10" fill="#93C5FD" text-anchor="start">C: 44</text>
    <text x="188" y="137" font-size="10" font-weight="700" fill="#FDE68A" text-anchor="start">90</text>

    <!-- Bullets -->
    <text x="235" y="98" font-size="11" fill="#A7F3D0" text-anchor="start">• Evaluates horizontally within</text>
    <text x="235" y="114" font-size="11" fill="#A7F3D0" text-anchor="start">  each tuple</text>
    <text x="235" y="136" font-size="11" fill="#A7F3D0" text-anchor="start">• GREATEST(100, 150, 120) → 150</text>
    <text x="235" y="156" font-size="11" fill="#EF4444" font-weight="600" text-anchor="start">⚠️ Returns NULL if any operand</text>
    <text x="235" y="172" font-size="11" fill="#EF4444" font-weight="600" text-anchor="start">   is NULL (ANSI SQL rule)</text>
    <text x="235" y="196" font-size="11" fill="#A7F3D0" text-anchor="start">• Valid in SELECT, WHERE, ORDER BY</text>
  </g>

  <!-- Central Bridge Connector: Placed AFTER both cards with 85px runway and perfectly aligned VS pill -->
  <g id="connectors">
    <path d="M 495 200 L 580 200" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr-a)"/>
    <rect x="517" y="188" width="41" height="24" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="537.5" y="204.5" font-size="10" font-weight="700" fill="#FDE68A" text-anchor="middle">VS</text>
  </g>
</svg>
