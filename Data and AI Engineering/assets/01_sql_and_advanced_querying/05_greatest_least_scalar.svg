<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1040" height="360" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Vertical Aggregates vs. Horizontal Scalar Comparisons</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">MAX()/MIN() across multiple rows vs. GREATEST()/LEAST() across multiple columns in a single row</text>

  <!-- Two Large Comparison Columns (w=475 each) -->

  <!-- Left: Vertical Aggregates MAX() -->
  <g transform="translate(30, 80)">
    <rect width="475" height="240" rx="8" fill="#0B132B" stroke="#3B82F6" stroke-width="2"/>
    <text x="237" y="28" font-size="13" font-weight="700" fill="#93C5FD" text-anchor="middle">Vertical Aggregate: MAX(salary)</text>

    <rect x="15" y="45" width="445" height="175" rx="6" fill="#1C2541" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="237" y="70" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Collapses Multiple Rows Down into 1 Scalar Result</text>

    <!-- Table Graphic -->
    <rect x="30" y="88" width="180" height="24" fill="#2E1065" stroke="#8B5CF6"/>
    <text x="120" y="104" font-size="11" fill="#DDD6FE" text-anchor="middle">Row 1: $100,000</text>
    <rect x="30" y="112" width="180" height="24" fill="#2E1065" stroke="#8B5CF6"/>
    <text x="120" y="128" font-size="11" fill="#DDD6FE" text-anchor="middle">Row 2: $150,000</text>
    <rect x="30" y="136" width="180" height="24" fill="#2E1065" stroke="#8B5CF6"/>
    <text x="120" y="152" font-size="11" fill="#DDD6FE" text-anchor="middle">Row 3: $120,000</text>

    <!-- Arrow down to result -->
    <path d="M 120 160 L 120 185" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>
    <rect x="30" y="188" width="180" height="24" rx="4" fill="#064E3B" stroke="#10B981"/>
    <text x="120" y="204" font-size="11" font-weight="700" fill="#A7F3D0" text-anchor="middle">MAX() = $150,000</text>

    <!-- Bullets -->
    <text x="230" y="104" font-size="11" fill="#94A3B8" text-anchor="start">• Operates vertically across 1 column</text>
    <text x="230" y="124" font-size="11" fill="#94A3B8" text-anchor="start">• Automatically ignores NULL values</text>
    <text x="230" y="144" font-size="11" fill="#94A3B8" text-anchor="start">• Reduces N input rows to 1 row</text>
    <text x="230" y="164" font-size="11" fill="#94A3B8" text-anchor="start">• Requires GROUP BY for partitions</text>
  </g>

  <!-- Right: Horizontal Scalar GREATEST() -->
  <g transform="translate(535, 80)">
    <rect width="475" height="240" rx="8" fill="#062828" stroke="#10B981" stroke-width="2"/>
    <text x="237" y="28" font-size="13" font-weight="700" fill="#6EE7B7" text-anchor="middle">Horizontal Scalar: GREATEST(col_a, col_b, col_c)</text>

    <rect x="15" y="45" width="445" height="175" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
    <text x="237" y="70" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Preserves Row Count; Evaluates Columns Horizontally</text>

    <!-- Row Graphic -->
    <rect x="30" y="92" width="220" height="26" fill="#1C2541" stroke="#3B82F6"/>
    <text x="40" y="109" font-size="10" fill="#93C5FD" text-anchor="start">A: 10</text>
    <text x="90" y="109" font-size="10" fill="#93C5FD" text-anchor="start">B: 50</text>
    <text x="140" y="109" font-size="10" fill="#93C5FD" text-anchor="start">C: 30</text>
    <path d="M 185 105 L 210 105" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr-a)"/>
    <text x="220" y="109" font-size="11" font-weight="700" fill="#FDE68A" text-anchor="start">→ 50</text>

    <rect x="30" y="128" width="220" height="26" fill="#1C2541" stroke="#3B82F6"/>
    <text x="40" y="145" font-size="10" fill="#93C5FD" text-anchor="start">A: 90</text>
    <text x="90" y="145" font-size="10" fill="#93C5FD" text-anchor="start">B: 12</text>
    <text x="140" y="145" font-size="10" fill="#93C5FD" text-anchor="start">C: 44</text>
    <path d="M 185 141 L 210 141" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr-a)"/>
    <text x="220" y="145" font-size="11" font-weight="700" fill="#FDE68A" text-anchor="start">→ 90</text>

    <!-- Bullets -->
    <text x="270" y="104" font-size="11" fill="#A7F3D0" text-anchor="start">• Evaluates row-by-row</text>
    <text x="270" y="124" font-size="11" fill="#A7F3D0" text-anchor="start">• Row count unchanged (N → N)</text>
    <text x="270" y="144" font-size="11" fill="#EF4444" font-weight="600" text-anchor="start">⚠️ If ANY col is NULL in ANSI,</text>
    <text x="270" y="160" font-size="11" fill="#EF4444" font-weight="600" text-anchor="start">   result is NULL (use COALESCE)</text>
    <text x="270" y="180" font-size="11" fill="#A7F3D0" text-anchor="start">• Valid anywhere scalar funcs run</text>
  </g>
</svg>