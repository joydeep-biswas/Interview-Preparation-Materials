<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1040" height="360" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Windowing Paradigm vs. Standard GROUP BY</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Many-to-One row collapse (GROUP BY) vs. Many-to-Many identity-preserving analytics (OVER)</text>

  <!-- Left: Standard GROUP BY -->
  <g transform="translate(30, 80)">
    <rect width="475" height="240" rx="8" fill="#2E1C05" stroke="#F59E0B" stroke-width="2"/>
    <text x="237" y="28" font-size="13" font-weight="700" fill="#FDE68A" text-anchor="middle">Standard GROUP BY (Row Collapse)</text>

    <rect x="15" y="45" width="445" height="175" rx="6" fill="#451A03" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="237" y="68" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Many-to-One: Collapses Rows into Summary Buckets</text>

    <!-- Visual Rows Collapse -->
    <rect x="35" y="85" width="160" height="20" fill="#1C2541" stroke="#3B82F6"/>
    <text x="115" y="99" font-size="10" fill="#93C5FD" text-anchor="middle">Alice | Dept: Sales | $100k</text>
    <rect x="35" y="107" width="160" height="20" fill="#1C2541" stroke="#3B82F6"/>
    <text x="115" y="121" font-size="10" fill="#93C5FD" text-anchor="middle">Bob   | Dept: Sales | $120k</text>
    <rect x="35" y="129" width="160" height="20" fill="#1C2541" stroke="#3B82F6"/>
    <text x="115" y="143" font-size="10" fill="#93C5FD" text-anchor="middle">Carol | Dept: Eng   | $150k</text>

    <path d="M 205 118 L 245 118" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr-a)"/>

    <rect x="255" y="95" width="180" height="24" fill="#0F172A" stroke="#F59E0B"/>
    <text x="345" y="111" font-size="10" fill="#FDE68A" text-anchor="middle">Sales: Total = $220k</text>
    <rect x="255" y="123" width="180" height="24" fill="#0F172A" stroke="#F59E0B"/>
    <text x="345" y="139" font-size="10" fill="#FDE68A" text-anchor="middle">Eng:   Total = $150k</text>

    <text x="35" y="172" font-size="11" fill="#FDE68A" text-anchor="start">• Destroys individual row identity</text>
    <text x="35" y="190" font-size="11" fill="#FDE68A" text-anchor="start">• Cannot project unaggregated columns (e.g. employee name)</text>
    <text x="35" y="208" font-size="10" fill="#FCA5A5" text-anchor="start">Output row count = number of unique grouping keys</text>
  </g>

  <!-- Right: Window Functions -->
  <g transform="translate(535, 80)">
    <rect width="475" height="240" rx="8" fill="#062828" stroke="#10B981" stroke-width="2"/>
    <text x="237" y="28" font-size="13" font-weight="700" fill="#6EE7B7" text-anchor="middle">Window Functions: OVER(...) (Identity Preservation)</text>

    <rect x="15" y="45" width="445" height="175" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
    <text x="237" y="68" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Many-to-Many: Preserves Every Row; Appends Analytic Column</text>

    <!-- Visual Rows Preserved -->
    <rect x="35" y="85" width="375" height="20" fill="#0F172A" stroke="#10B981"/>
    <text x="45" y="99" font-size="10" fill="#A7F3D0" text-anchor="start">Alice | Dept: Sales | $100k</text>
    <text x="280" y="99" font-size="10" font-weight="700" fill="#6EE7B7" text-anchor="start">| Dept_Sum: $220k</text>

    <rect x="35" y="107" width="375" height="20" fill="#0F172A" stroke="#10B981"/>
    <text x="45" y="121" font-size="10" fill="#A7F3D0" text-anchor="start">Bob   | Dept: Sales | $120k</text>
    <text x="280" y="121" font-size="10" font-weight="700" fill="#6EE7B7" text-anchor="start">| Dept_Sum: $220k</text>

    <rect x="35" y="129" width="375" height="20" fill="#0F172A" stroke="#10B981"/>
    <text x="45" y="143" font-size="10" fill="#A7F3D0" text-anchor="start">Carol | Dept: Eng   | $150k</text>
    <text x="280" y="143" font-size="10" font-weight="700" fill="#6EE7B7" text-anchor="start">| Dept_Sum: $150k</text>

    <text x="35" y="172" font-size="11" fill="#A7F3D0" text-anchor="start">• Preserves exact input row count (3 rows in → 3 rows out)</text>
    <text x="35" y="190" font-size="11" fill="#A7F3D0" text-anchor="start">• Every row retains access to its individual column attributes</text>
    <text x="35" y="208" font-size="10" fill="#6EE7B7" font-weight="600" text-anchor="start">✓ Enables running totals, moving averages, and ranks</text>
  </g>
</svg>