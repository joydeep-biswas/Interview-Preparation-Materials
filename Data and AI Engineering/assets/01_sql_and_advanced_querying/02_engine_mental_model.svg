<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="380" viewBox="0 0 1160 380">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6" />
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981" />
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B" />
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6" />
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444" />
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B" />
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1160" height="380" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5" />
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">The Intuitive Mental Model: Declarative Client to Imperative Storage</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">The Restaurant Patron &amp; Master Chef Analogy: Translating abstract desire into physical execution</text>

  <!-- 3 Horizontal Columns with spacious 95px runway gaps -->
  <!-- Col 1: Patron -->
  <g transform="translate(35, 85)">
    <rect width="300" height="260" rx="8" fill="#0B132B" stroke="#3B82F6" stroke-width="2" />
    <text x="150" y="28" font-size="13" font-weight="700" fill="#93C5FD" text-anchor="middle">1. Client (The Patron)</text>

    <rect x="15" y="45" width="270" height="195" rx="6" fill="#1C2541" stroke="#3B82F6" stroke-width="1.2" />
    <text x="150" y="70" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Declarative Request (WHAT)</text>
    <text x="25" y="94" font-size="11" fill="#94A3B8" text-anchor="start">• "Medium-rare ribeye with asparagus"</text>
    <text x="25" y="114" font-size="11" fill="#94A3B8" text-anchor="start">• Client specifies ONLY desired output</text>
    <text x="25" y="134" font-size="11" fill="#94A3B8" text-anchor="start">• No instruction on pan selection or heat</text>
    <text x="25" y="154" font-size="11" fill="#94A3B8" text-anchor="start">• SQL Query sent over network socket</text>
    <text x="25" y="180" font-size="11" fill="#60A5FA" font-weight="600" text-anchor="start">Output: Abstract SQL Query String</text>
    <text x="25" y="200" font-size="10" fill="#94A3B8" text-anchor="start">Format: Relational Algebra Statement</text>
  </g>

  <!-- Spacious Runway Arrow 1 to 2 (Gap: x=335 to 430, width=95px) -->
  <!-- Col 2: Master Chef -->
  <g transform="translate(430, 85)">
    <rect width="300" height="260" rx="8" fill="#2E1C05" stroke="#F59E0B" stroke-width="2" />
    <text x="150" y="28" font-size="13" font-weight="700" fill="#FDE68A" text-anchor="middle">2. Optimizer (Master Chef)</text>

    <rect x="15" y="45" width="270" height="195" rx="6" fill="#451A03" stroke="#F59E0B" stroke-width="1.2" />
    <text x="150" y="70" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Plan Compilation (HOW)</text>
    <text x="25" y="94" font-size="11" fill="#FDE68A" text-anchor="start">• Evaluates kitchen inventory (Catalog)</text>
    <text x="25" y="114" font-size="11" fill="#FDE68A" text-anchor="start">• Checks burner/core capacity (Cost Model)</text>
    <text x="25" y="134" font-size="11" fill="#FDE68A" text-anchor="start">• Chooses index scan vs parallel sequential</text>
    <text x="25" y="154" font-size="11" fill="#FDE68A" text-anchor="start">• Generates optimized operator DAG</text>
    <text x="25" y="180" font-size="11" fill="#F59E0B" font-weight="600" text-anchor="start">Output: Physical Execution Plan</text>
    <text x="25" y="200" font-size="10" fill="#FDE68A" text-anchor="start">Format: Directed Acyclic Graph (DAG)</text>
  </g>

  <!-- Spacious Runway Arrow 2 to 3 (Gap: x=730 to 825, width=95px) -->
  <!-- Col 3: Kitchen Staff -->
  <g transform="translate(825, 85)">
    <rect width="300" height="260" rx="8" fill="#062828" stroke="#10B981" stroke-width="2" />
    <text x="150" y="28" font-size="13" font-weight="700" fill="#6EE7B7" text-anchor="middle">3. Storage &amp; Engine (Kitchen)</text>

    <rect x="15" y="45" width="270" height="195" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.2" />
    <text x="150" y="70" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Physical Execution (WORK)</text>
    <text x="25" y="94" font-size="11" fill="#A7F3D0" text-anchor="start">• Reads disk pages into Buffer Pool</text>
    <text x="25" y="114" font-size="11" fill="#A7F3D0" text-anchor="start">• Allocates working memory hash tables</text>
    <text x="25" y="134" font-size="11" fill="#A7F3D0" text-anchor="start">• Pipelined tuple streaming (Volcano)</text>
    <text x="25" y="154" font-size="11" fill="#A7F3D0" text-anchor="start">• Writes write-ahead log (WAL) for ACID</text>
    <text x="25" y="180" font-size="11" fill="#34D399" font-weight="600" text-anchor="start">Output: Result Row Packets</text>
    <text x="25" y="200" font-size="10" fill="#A7F3D0" text-anchor="start">Format: Serialized Network Tuples</text>
  </g>
<g id="connectors"><path d="M 335 210 L 428 210" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr-a)" />
  <rect x="345" y="175" width="75" height="24" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1.2" />
  <text x="382" y="191" font-size="10" fill="#FDE68A" font-weight="700" text-anchor="middle">SQL Query</text>

  <path d="M 730 210 L 823 210" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)" />
  <rect x="738" y="175" width="80" height="24" rx="4" fill="#1E293B" stroke="#10B981" stroke-width="1.2" />
  <text x="778" y="191" font-size="10" fill="#A7F3D0" font-weight="700" text-anchor="middle">Physical Plan</text>

  </g></svg>