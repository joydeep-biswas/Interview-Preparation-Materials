<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1040" height="360" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Window Framing Deep-Dive: ROWS vs. RANGE Behavior on Duplicate Values</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Physical offset framing (ROWS) vs. Logical peer-group framing (RANGE) on identical ORDER BY keys</text>

  <!-- Left: ROWS Framing -->
  <g transform="translate(30, 80)">
    <rect width="475" height="240" rx="8" fill="#062828" stroke="#10B981" stroke-width="2"/>
    <text x="237" y="28" font-size="13" font-weight="700" fill="#6EE7B7" text-anchor="middle">ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW</text>

    <rect x="15" y="45" width="445" height="175" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
    <text x="237" y="68" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Physical Offset Framing (Row-by-Row)</text>

    <!-- Table Rows -->
    <rect x="35" y="85" width="375" height="22" fill="#0F172A" stroke="#10B981"/>
    <text x="45" y="100" font-size="10" fill="#A7F3D0" text-anchor="start">Row 1: Date: 2026-01-01 | Amount: $100</text>
    <text x="320" y="100" font-size="10" font-weight="700" fill="#6EE7B7" text-anchor="start">Running: $100</text>

    <rect x="35" y="109" width="375" height="22" fill="#0F172A" stroke="#10B981"/>
    <text x="45" y="124" font-size="10" fill="#A7F3D0" text-anchor="start">Row 2: Date: 2026-01-02 | Amount: $100 [TIED]</text>
    <text x="320" y="124" font-size="10" font-weight="700" fill="#6EE7B7" text-anchor="start">Running: $200</text>

    <rect x="35" y="133" width="375" height="22" fill="#0F172A" stroke="#10B981"/>
    <text x="45" y="148" font-size="10" fill="#A7F3D0" text-anchor="start">Row 3: Date: 2026-01-02 | Amount: $100 [TIED]</text>
    <text x="320" y="148" font-size="10" font-weight="700" fill="#6EE7B7" text-anchor="start">Running: $300</text>

    <text x="35" y="175" font-size="11" fill="#A7F3D0" text-anchor="start">• Advances strictly by physical row index (1, 2, 3)</text>
    <text x="35" y="193" font-size="11" fill="#6EE7B7" font-weight="600" text-anchor="start">✓ Monotonically strictly increasing running cumulative sum</text>
    <text x="35" y="210" font-size="10" fill="#A7F3D0" text-anchor="start">Best for: Running totals, physical moving averages</text>
  </g>

  <!-- Right: RANGE Framing (ANSI Default with ORDER BY) -->
  <g transform="translate(535, 80)">
    <rect width="475" height="240" rx="8" fill="#2E1C05" stroke="#F59E0B" stroke-width="2"/>
    <text x="237" y="28" font-size="13" font-weight="700" fill="#FDE68A" text-anchor="middle">RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW</text>

    <rect x="15" y="45" width="445" height="175" rx="6" fill="#451A03" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="237" y="68" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Logical Peer-Group Framing (ANSI SQL Default)</text>

    <!-- Table Rows -->
    <rect x="35" y="85" width="375" height="22" fill="#0F172A" stroke="#F59E0B"/>
    <text x="45" y="100" font-size="10" fill="#FDE68A" text-anchor="start">Row 1: Date: 2026-01-01 | Amount: $100</text>
    <text x="320" y="100" font-size="10" font-weight="700" fill="#FDE68A" text-anchor="start">Running: $100</text>

    <rect x="35" y="109" width="375" height="22" fill="#0F172A" stroke="#EF4444"/>
    <text x="45" y="124" font-size="10" fill="#FCA5A5" text-anchor="start">Row 2: Date: 2026-01-02 | Amount: $100 [TIED]</text>
    <text x="320" y="124" font-size="10" font-weight="700" fill="#EF4444" text-anchor="start">Running: $300 ⚠️</text>

    <rect x="35" y="133" width="375" height="22" fill="#0F172A" stroke="#EF4444"/>
    <text x="45" y="148" font-size="10" fill="#FCA5A5" text-anchor="start">Row 3: Date: 2026-01-02 | Amount: $100 [TIED]</text>
    <text x="320" y="148" font-size="10" font-weight="700" fill="#EF4444" text-anchor="start">Running: $300 ⚠️</text>

    <text x="35" y="175" font-size="11" fill="#FDE68A" text-anchor="start">• Identical ORDER BY values are grouped into ONE peer group</text>
    <text x="35" y="193" font-size="11" fill="#EF4444" font-weight="600" text-anchor="start">⚠️ Frame expands to peer group boundary; jumps to $300!</text>
    <text x="35" y="210" font-size="10" fill="#FDE68A" text-anchor="start">ANSI Default bug: Omit frame → defaults to RANGE!</text>
  </g>
</svg>