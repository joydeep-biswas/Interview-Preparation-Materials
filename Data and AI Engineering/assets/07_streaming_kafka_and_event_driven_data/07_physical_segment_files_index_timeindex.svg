<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1040" height="540" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="520" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Kafka Physical Storage Architecture: Partition Directory &amp; Segment Files</text>
  <text x="520" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Disk layout: Binary record batches (.log), sparse memory-mapped index (.index), timeindex, and leader epoch checkpoint</text>
<rect x="30" y="85" width="980" height="75" rx="8" fill="#0b1329" stroke="#3b82f6" stroke-width="1.5"/>
<text x="520" y="112" fill="#60A5FA" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Partition Directory: /var/lib/kafka/data/commerce.orders-0/</text>
<rect x="410" y="122" width="220" height="18" rx="9" fill="#1d4ed8"/><text x="520" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Physical Disk Hierarchy</text>
<text x="520" y="150" fill="#CBD5E1" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Contains segment file triads named by base starting offset + metadata checkpoint files</text>
<rect x="30" y="180" width="650" height="240" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
<text x="355" y="205" fill="#FBBF24" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Segment File Triad (Base Offset: 00000000000000000000)</text>
<rect x="275" y="215" width="160" height="16" rx="8" fill="#b45309"/><text x="355" y="226" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">segment.bytes = 1 GB</text>
<rect x="50" y="240" width="610" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="65" y="260" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">00000000000000000000.log</text>
<text x="65" y="278" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Raw Binary Record Batches: Magic byte, CRC32, timestamps, key &amp; value byte arrays</text>
<rect x="50" y="300" width="610" height="50" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
<text x="65" y="320" fill="#34D399" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">00000000000000000000.index</text>
<text x="65" y="338" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Sparse Offset-to-Byte-Position Index: Memory-mapped (mmap) 8-byte entries (Logical Offset -&gt; Physical Byte Offset)</text>
<rect x="50" y="360" width="610" height="50" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
<text x="65" y="380" fill="#C084FC" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">00000000000000000000.timeindex</text>
<text x="65" y="398" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Sparse Timestamp-to-Offset Index: 12-byte entries (Unix Timestamp -&gt; Logical Offset) for time-travel queries</text>
<rect x="700" y="180" width="310" height="240" rx="8" fill="#16122b" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="855" y="205" fill="#C084FC" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Partition Metadata &amp; Active Seg</text>
<rect x="770" y="215" width="170" height="16" rx="8" fill="#6d28d9"/><text x="855" y="226" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Epochs &amp; State Checkpoints</text>
<rect x="715" y="240" width="280" height="75" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
<text x="725" y="260" fill="#34D399" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">leader-epoch-checkpoint</text>
<text x="725" y="280" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Tracks (LeaderEpoch, StartOffset)</text>
<text x="725" y="296" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Prevents log truncation data loss</text>
<text x="725" y="308" fill="#64748B" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">during broker failover recovery</text>
<rect x="715" y="325" width="280" height="85" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="725" y="345" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Active Segment (Writable)</text>
<text x="725" y="365" fill="#F8FAFC" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">00000000000104857600.log</text>
<text x="725" y="381" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Current open segment receiving writes</text>
<text x="725" y="397" fill="#6EE7B7" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Only 1 segment is active per partition</text>
<rect x="30" y="435" width="980" height="85" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
<text x="520" y="458" fill="#6EE7B7" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">How Kafka Performs an O(log N) Offset Lookup Without Scanning Disk Files</text>
<text x="50" y="480" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">1. Binary search active segment list to find segment containing target offset (e.g., Target Offset 42,500 lands in Segment 0)</text>
<text x="50" y="498" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">2. Binary search the sparse memory-mapped .index file to find closest lower byte position (e.g., Offset 42,000 -&gt; Byte 1,048,576)</text>
<text x="50" y="514" fill="#A7F3D0" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">3. Seek directly to disk byte position and scan sequential records over wire at wire speed via OS Zero-Copy sendfile()</text>
</svg>