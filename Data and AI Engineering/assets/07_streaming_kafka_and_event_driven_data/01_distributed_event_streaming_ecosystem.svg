  <rect width="1040" height="560" rx="10" fill="url(#bg)"/>
  <text x="520" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Distributed Event Streaming Platform Architecture</text>
  <text x="520" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">End-to-end event fabric: Ingress publishers, KRaft-coordinated Kafka cluster, streaming compute, and storage sinks</text>
<rect x="30" y="85" width="200" height="445" rx="8" fill="#0b1329" stroke="#3b82f6" stroke-width="1.5"/>
<text x="130" y="112" fill="#60A5FA" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">1. Ingress Publishers</text>
<rect x="60" y="122" width="140" height="18" rx="9" fill="#1d4ed8"/><text x="130" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Producers &amp; Gateways</text>
<rect x="45" y="155" width="170" height="75" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="55" y="178" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">IoT Telemetry Gateways</text>
<text x="55" y="198" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• 100k+ events/sec</text>
<text x="55" y="214" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Sensor readings &amp; metrics</text>
<rect x="45" y="245" width="170" height="75" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="55" y="268" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Clickstream Collectors</text>
<text x="55" y="288" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Frontend HTTP webhooks</text>
<text x="55" y="304" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Page views &amp; user actions</text>
<rect x="45" y="335" width="170" height="85" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="55" y="358" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">CDC / Debezium</text>
<text x="55" y="378" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Postgres / MySQL WAL</text>
<text x="55" y="394" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Row mutations to events</text>
<text x="55" y="408" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Low-latency DB replication</text>
<rect x="45" y="435" width="170" height="80" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="130" y="458" fill="#CBD5E1" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Producer Routing</text>
<text x="130" y="478" fill="#FBBF24" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Murmur2(key) % partitions</text>
<text x="130" y="495" fill="#94A3B8" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Guarantees per-key ordering</text>
<rect x="260" y="85" width="260" height="445" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
<text x="390" y="112" fill="#FBBF24" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">2. Kafka Cluster Core</text>
<rect x="310" y="122" width="160" height="18" rx="9" fill="#b45309"/><text x="390" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Distributed Commit Log</text>
