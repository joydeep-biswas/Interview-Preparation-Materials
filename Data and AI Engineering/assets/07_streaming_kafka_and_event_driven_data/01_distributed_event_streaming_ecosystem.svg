<text x="575" y="378" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Processes P1 stream</text>
<text x="575" y="394" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Stateful tumbling windows</text>
<rect x="565" y="420" width="190" height="75" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
<text x="575" y="440" fill="#DDD6FE" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Executor 3 (Task P2)</text>
<text x="575" y="458" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Processes P2 stream</text>
<text x="575" y="474" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Anomaly detection scoring</text>
<rect x="800" y="85" width="210" height="445" rx="8" fill="#062e22" stroke="#10b981" stroke-width="1.5"/>
<text x="905" y="112" fill="#34D399" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">4. Real-Time Sinks</text>
<rect x="830" y="122" width="150" height="18" rx="9" fill="#059669"/><text x="905" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Persistent Serving Layer</text>
<rect x="815" y="155" width="180" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
<text x="825" y="178" fill="#34D399" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Delta Lake Silver</text>
<text x="825" y="198" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">ACID Upsert &amp; De-dup</text>
<text x="825" y="214" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Incremental lakehouse sync</text>
<text x="825" y="226" fill="#64748B" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">via structured streaming sink</text>
<rect x="815" y="255" width="180" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
<text x="825" y="278" fill="#34D399" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">ClickHouse OLAP</text>
<text x="825" y="298" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Sub-50ms query response</text>
<text x="825" y="314" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Real-time user dashboards</text>
<text x="825" y="326" fill="#64748B" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Columnar real-time ingress</text>
