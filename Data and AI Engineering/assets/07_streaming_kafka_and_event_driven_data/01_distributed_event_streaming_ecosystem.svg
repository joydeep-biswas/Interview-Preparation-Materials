<text x="390" y="235" fill="#FDE68A" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Topic: commerce.orders</text>
<text x="390" y="250" fill="#94A3B8" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">3 Partitions with RF=3 (In-Sync Replicas)</text>
<rect x="285" y="260" width="210" height="70" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
<text x="295" y="280" fill="#FBBF24" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Partition 0</text>
<text x="295" y="298" fill="#6EE7B7" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Leader: Broker 1</text>
<text x="295" y="314" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Replicas: Broker 2, Broker 3</text>
