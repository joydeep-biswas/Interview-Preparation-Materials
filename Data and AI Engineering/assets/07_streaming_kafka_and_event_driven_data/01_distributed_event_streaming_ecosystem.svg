<text x="825" y="378" fill="#FCA5A5" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Fraud Alerts / PagerDuty</text>
<text x="825" y="398" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Critical anomaly triggers</text>
<text x="825" y="414" fill="#F87171" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Immediate webhook egress</text>
<text x="825" y="426" fill="#64748B" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Sub-second incident routing</text>
<rect x="815" y="450" width="180" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
<text x="905" y="472" fill="#F8FAFC" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">End-to-End Latency</text>
<text x="905" y="492" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">&amp;lt; 200 Milliseconds</text>
