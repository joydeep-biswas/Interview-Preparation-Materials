<text x="295" y="458" fill="#6EE7B7" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Leader: Broker 3</text>
<text x="295" y="474" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Replicas: Broker 1, Broker 2</text>
<rect x="550" y="85" width="220" height="445" rx="8" fill="#16122b" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="660" y="112" fill="#C084FC" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">3. Stream Processing</text>
<rect x="580" y="122" width="160" height="18" rx="9" fill="#6d28d9"/><text x="660" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Spark Streaming / Flink</text>
<rect x="565" y="155" width="190" height="65" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
<text x="575" y="178" fill="#C084FC" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Stream Coordinator</text>
<text x="575" y="198" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Driver / JobManager</text>
<text x="575" y="212" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Manages checkpoint state store</text>
