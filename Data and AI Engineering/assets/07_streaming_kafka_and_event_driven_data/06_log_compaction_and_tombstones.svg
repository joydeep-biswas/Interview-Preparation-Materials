<text x="520" y="285" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Log Cleaner Thread: Scans keys, builds SkimpyOffsetMap in RAM</text>
