<text x="135" y="458" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Offset numbering does NOT re-index</text>
<rect x="410" y="385" width="220" height="80" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
<text x="425" y="408" fill="#6EE7B7" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Offset 3 (RETAINED)</text>
<text x="425" y="428" fill="#F8FAFC" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Key: 'user_3' | Value: 'David'</text>
<text x="425" y="444" fill="#A7F3D0" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Active state untouched</text>
<text x="425" y="458" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Preserved in sequential order</text>
<rect x="700" y="385" width="220" height="80" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
<text x="715" y="408" fill="#FCA5A5" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Offset 4 (Tombstone Retained)</text>
<text x="715" y="428" fill="#F8FAFC" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Key: 'user_2' | Value: NULL</text>
<text x="715" y="444" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Retained for delete.retention.ms (24h)</text>
<text x="715" y="458" fill="#F87171" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Allows downstream consumers to observe delete</text>
<rect x="60" y="475" width="920" height="20" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<text x="520" y="489" fill="#CBD5E1" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Foundation for: Kafka Streams KTable changelogs, database CDC replication, and infinite state retention without disk exhaustion</text>
