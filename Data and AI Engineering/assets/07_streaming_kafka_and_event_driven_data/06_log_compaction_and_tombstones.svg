  <text x="520" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Kafka Log Compaction &amp; Tombstone Deletion Mechanics</text>
  <text x="520" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Key-value state maintenance: Retaining the latest value per key, cleaning redundant updates, and tombstone purging</text>
