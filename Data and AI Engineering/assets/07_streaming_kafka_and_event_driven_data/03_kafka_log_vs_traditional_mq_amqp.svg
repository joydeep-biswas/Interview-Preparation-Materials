<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1040" height="520" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="520" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Traditional Message Queue vs Distributed Commit Log</text>
  <text x="520" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Destructive dequeue (RabbitMQ/AMQP) vs immutable sequential log with independent consumer offsets (Kafka)</text>
<rect x="30" y="85" width="470" height="410" rx="8" fill="#1a1116" stroke="#ef4444" stroke-width="1.5"/>
<text x="265" y="112" fill="#FCA5A5" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">1. Traditional Message Queue (RabbitMQ / SQS)</text>
<rect x="170" y="122" width="190" height="18" rx="9" fill="#991b1b"/><text x="265" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Destructive Dequeue &amp; Ephemeral</text>
<rect x="50" y="155" width="430" height="120" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
<text x="65" y="178" fill="#F8FAFC" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Shared In-Memory Message Queue</text>
<rect x="65" y="195" width="75" height="30" rx="8" fill="#334155" stroke="#64748b" stroke-width="1"/>
<text x="102" y="214" fill="#94A3B8" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Msg 1 (Popped)</text>
<rect x="150" y="195" width="75" height="30" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
<text x="187" y="214" fill="#FDE68A" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Msg 2 (In-Flight)</text>
<rect x="235" y="195" width="75" height="30" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="272" y="214" fill="#38BDF8" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Msg 3 (Queued)</text>
<rect x="320" y="195" width="75" height="30" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="357" y="214" fill="#38BDF8" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Msg 4 (Queued)</text>
<text x="65" y="255" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Competing consumers pull from same queue head</text>
<text x="65" y="269" fill="#F87171" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Destructive ACK: Message deleted immediately upon processing!</text>
<rect x="50" y="290" width="200" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="60" y="312" fill="#CBD5E1" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Consumer Worker A</text>
<text x="60" y="332" fill="#F87171" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Pops Msg 1 -&gt; ACKs -&gt; Deleted</text>
<text x="60" y="348" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Cannot replay past messages</text>
<rect x="280" y="290" width="200" height="75" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="290" y="312" fill="#CBD5E1" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Consumer Worker B</text>
<text x="290" y="332" fill="#F87171" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Pops Msg 2 -&gt; ACKs -&gt; Deleted</text>
<text x="290" y="348" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Zero multi-subscriber replay</text>
<rect x="50" y="380" width="430" height="95" rx="8" fill="#2d1215" stroke="#dc2626" stroke-width="1"/>
<text x="265" y="403" fill="#F87171" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Architectural Bottlenecks</text>
<text x="65" y="425" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">✗ No historical replay or time-travel</text>
<text x="65" y="443" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">✗ State held in broker memory: degrades when queues grow</text>
<text x="65" y="461" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">✗ Multi-tenant fanout requires duplicating messages into N queues</text>
<rect x="540" y="85" width="470" height="410" rx="8" fill="#0c1d1a" stroke="#10b981" stroke-width="1.5"/>
<text x="775" y="112" fill="#6EE7B7" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">2. Distributed Commit Log (Apache Kafka)</text>
<rect x="680" y="122" width="190" height="18" rx="9" fill="#047857" stroke="#10B981" stroke-width="1"/><text x="775" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Immutable Append &amp; Client Offsets</text>
<rect x="560" y="155" width="430" height="120" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
<text x="575" y="178" fill="#F8FAFC" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Partition Physical Disk Log (Immutable Append-Only)</text>
<rect x="575" y="195" width="65" height="30" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
<text x="607" y="214" fill="#6EE7B7" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Off 0</text>
<rect x="645" y="195" width="65" height="30" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
<text x="677" y="214" fill="#6EE7B7" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Off 1</text>
<rect x="715" y="195" width="65" height="30" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
<text x="747" y="214" fill="#6EE7B7" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Off 2</text>
<rect x="785" y="195" width="65" height="30" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
<text x="817" y="214" fill="#6EE7B7" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Off 3</text>
<rect x="855" y="195" width="65" height="30" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="887" y="214" fill="#38BDF8" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Off 4</text>
<rect x="925" y="195" width="50" height="30" rx="8" fill="#111827" stroke="#475569" stroke-width="1"/>
<text x="950" y="214" fill="#64748B" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">...</text>
<text x="575" y="255" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Messages NEVER deleted on read; retained by retention.ms</text>
<text x="575" y="269" fill="#34D399" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Sequential disk I/O at hardware saturation speeds (Zero-Copy)</text>
<rect x="560" y="290" width="135" height="75" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="568" y="312" fill="#38BDF8" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Real-time Flink</text>
<text x="568" y="330" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Offset: 4 (Live)</text>
<text x="568" y="346" fill="#6EE7B7" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Sub-second lag</text>
<rect x="705" y="290" width="135" height="75" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
<text x="713" y="312" fill="#C084FC" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Batch Spark Job</text>
<text x="713" y="330" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Offset: 1 (Catching)</text>
<text x="713" y="346" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Reads at own pace</text>
<rect x="850" y="290" width="140" height="75" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
<text x="858" y="312" fill="#FBBF24" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">ML Replay Model</text>
<text x="858" y="330" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Offset: 0 (Rewind)</text>
<text x="858" y="346" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Historical training</text>
<rect x="560" y="380" width="430" height="95" rx="8" fill="#0f2e28" stroke="#059669" stroke-width="1"/>
<text x="775" y="403" fill="#34D399" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">The Distributed Commit Log Advantage</text>
<text x="575" y="425" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">✓ 100% Replayable: Consumers can seek to any offset or timestamp</text>
<text x="575" y="443" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">✓ Decoupled Speeds: Slow consumers don't block fast consumers</text>
<text x="575" y="461" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">✓ Single write serves infinite independent downstream consumers</text>
</svg>