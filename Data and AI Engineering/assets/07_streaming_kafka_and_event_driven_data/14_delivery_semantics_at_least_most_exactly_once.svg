<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1040" height="540" rx="10" fill="url(#bg)"/>
  <text x="520" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">End-to-End Delivery Semantics: At-Most-Once, At-Least-Once, Exactly-Once</text>
  <text x="520" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Mathematical fault-tolerance trade-offs: Offset commit order, failure recovery replay, and transactional 2PC deduplication</text>
<rect x="30" y="85" width="300" height="425" rx="8" fill="#1a1116" stroke="#ef4444" stroke-width="1.5"/>
<text x="180" y="112" fill="#FCA5A5" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">At-Most-Once Semantics</text>
<rect x="90" y="122" width="180" height="18" rx="9" fill="#991b1b"/><text x="180" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Data Loss Possible / Zero Dups</text>
<rect x="45" y="155" width="270" height="70" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
<text x="55" y="178" fill="#FCA5A5" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Step 1: Commit Offset FIRST</text>
<text x="55" y="198" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Consumer commits offset to Kafka</text>
<text x="55" y="212" fill="#F87171" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">BEFORE processing records!</text>
<rect x="45" y="235" width="270" height="75" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
<text x="55" y="258" fill="#F87171" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Step 2: Crash During Processing!</text>
<text x="55" y="278" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Worker JVM crashes or OOMs while</text>
<text x="55" y="294" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">writing records to database sink</text>
<rect x="45" y="320" width="270" height="85" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
<text x="55" y="342" fill="#CBD5E1" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Step 3: Recovery Re-fetch</text>
<text x="55" y="362" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">New worker resumes at committed offset</text>
<text x="55" y="378" fill="#F87171" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Unprocessed messages are SKIPPED!</text>
<text x="55" y="392" fill="#FCA5A5" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Result: Silent permanent data loss</text>
<rect x="45" y="415" width="270" height="80" rx="8" fill="#2d1215" stroke="#dc2626" stroke-width="1"/>
<text x="180" y="437" fill="#F87171" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Verdict: Unacceptable for Business</text>
<text x="55" y="458" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Fast, zero coordination overhead</text>
<text x="55" y="474" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Only for loss-tolerant telemetry</text>
<rect x="370" y="85" width="300" height="425" rx="8" fill="#1a1c12" stroke="#f59e0b" stroke-width="1.5"/>
<text x="520" y="112" fill="#FDE68A" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">At-Least-Once Semantics</text>
<rect x="430" y="122" width="180" height="18" rx="9" fill="#b45309"/><text x="520" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Zero Data Loss / Duplicates Possible</text>
<rect x="385" y="155" width="270" height="70" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
<text x="395" y="178" fill="#FDE68A" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Step 1: Process &amp; Write to Sink</text>
<text x="395" y="198" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Consumer writes records to sink</text>
<text x="395" y="212" fill="#6EE7B7" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Database records inserted successfully</text>
<rect x="385" y="235" width="270" height="75" rx="8" fill="#3d2a08" stroke="#f59e0b" stroke-width="1.5"/>
<text x="395" y="258" fill="#FBBF24" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Step 2: Crash Before Offset Commit!</text>
<text x="395" y="278" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Network glitch or crash occurs right</text>
<text x="395" y="294" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">before consumer commits offset to Kafka</text>
<rect x="385" y="320" width="270" height="85" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
<text x="395" y="342" fill="#CBD5E1" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Step 3: Recovery Re-fetch</text>
<text x="395" y="362" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">New worker resumes from previous offset</text>
<text x="395" y="378" fill="#FBBF24" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Re-processes same messages again!</text>
<text x="395" y="392" fill="#FDE68A" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Result: Duplicate entries in sink database</text>
<rect x="385" y="415" width="270" height="80" rx="8" fill="#261b07" stroke="#d97706" stroke-width="1"/>
<text x="520" y="437" fill="#FBBF24" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Verdict: Industry Standard Baseline</text>
<text x="395" y="458" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Default for most streaming engines</text>
<text x="395" y="474" fill="#34D399" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Requires idempotent sink to become EOS</text>
<rect x="710" y="85" width="300" height="425" rx="8" fill="#0c1d1a" stroke="#10b981" stroke-width="1.5"/>
<text x="860" y="112" fill="#6EE7B7" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Exactly-Once Processing (EOS)</text>
<rect x="770" y="122" width="180" height="18" rx="9" fill="#047857"/><text x="860" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Gold Standard / Zero Dups &amp; Loss</text>
<rect x="725" y="155" width="270" height="70" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
<text x="735" y="178" fill="#6EE7B7" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Pillar 1: Idempotent Producer</text>
<text x="735" y="198" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">enable.idempotence=true</text>
<text x="735" y="212" fill="#A7F3D0" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Broker deduplicates retries via PID + Seq</text>
<rect x="725" y="235" width="270" height="75" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
<text x="735" y="258" fill="#6EE7B7" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Pillar 2: Transactional 2PC</text>
<text x="735" y="278" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Atomic commit: Offset commit + write</text>
<text x="735" y="294" fill="#D1FAE5" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">committed together in 1 atomic tx</text>
<rect x="725" y="320" width="270" height="85" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
<text x="735" y="342" fill="#6EE7B7" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Pillar 3: Idempotent Storage Sink</text>
<text x="735" y="362" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Delta Lake ACID MERGE INTO or</text>
<text x="735" y="378" fill="#38BDF8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Postgres ON CONFLICT DO UPDATE</text>
<text x="735" y="392" fill="#A7F3D0" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Deterministic key-based state resolution</text>
<rect x="725" y="415" width="270" height="80" rx="8" fill="#0f2e28" stroke="#059669" stroke-width="1"/>
<text x="860" y="437" fill="#34D399" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Verdict: Production Enterprise Standard</text>
<text x="735" y="458" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">✓ Guaranteed mathematical correctness</text>
<text x="735" y="474" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">✓ Flawless financial &amp; accounting pipelines</text>
</svg>