<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1040" height="540" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="520" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Zero-Copy Network I/O: Traditional Read/Write vs. OS sendfile()</text>
  <text x="520" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">How Kafka bypasses JVM user memory: Eliminating CPU data copies and reducing context switches from 4 to 2</text>
<rect x="30" y="85" width="470" height="430" rx="8" fill="#1a1116" stroke="#ef4444" stroke-width="1.5"/>
<text x="265" y="112" fill="#FCA5A5" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">1. Traditional Read / Socket Write</text>
<rect x="160" y="122" width="210" height="18" rx="9" fill="#991b1b"/><text x="265" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">4 Context Switches / 4 Data Copies</text>
<rect x="50" y="155" width="430" height="50" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
<text x="65" y="175" fill="#F8FAFC" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Physical Storage Disk (HDD / NVMe SSD)</text>
<text x="65" y="193" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Data on disk -&gt; 1. DMA Copy to OS Kernel PageCache</text>
<rect x="50" y="220" width="430" height="55" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
<text x="65" y="240" fill="#FBBF24" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">OS Kernel Space (PageCache Buffer)</text>
<text x="65" y="258" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Kernel buffer -&gt; 2. CPU Copy to JVM User Space (Context Switch 1 -&gt; 2)</text>
<rect x="50" y="290" width="430" height="60" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
<text x="65" y="310" fill="#FCA5A5" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Application JVM User Memory (byte[] buffer)</text>
<text x="65" y="328" fill="#F87171" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Data copied into Java heap/direct memory!</text>
<text x="65" y="342" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Buffer -&gt; 3. CPU Copy back to OS Socket Buffer (Context Switch 3)</text>
<rect x="50" y="365" width="430" height="50" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
<text x="65" y="385" fill="#FBBF24" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">OS Kernel Space (Socket Buffer)</text>
<text x="65" y="401" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Socket buffer -&gt; 4. DMA Copy to NIC (Context Switch 4 -&gt; Return)</text>
<rect x="50" y="430" width="430" height="50" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
<text x="65" y="450" fill="#F8FAFC" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Network Interface Card (NIC)</text>
<text x="65" y="468" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Transmits Ethernet frames over 10/40 Gbps network wire</text>
<line x1="265" y1="205" x2="265" y2="220" stroke="#F87171" stroke-width="1.5" marker-end="url(#arr-r)"/>
<line x1="265" y1="275" x2="265" y2="290" stroke="#F87171" stroke-width="1.5" marker-end="url(#arr-r)"/>
<line x1="265" y1="350" x2="265" y2="365" stroke="#F87171" stroke-width="1.5" marker-end="url(#arr-r)"/>
<line x1="265" y1="415" x2="265" y2="430" stroke="#F87171" stroke-width="1.5" marker-end="url(#arr-r)"/>
<rect x="540" y="85" width="470" height="430" rx="8" fill="#0c1d1a" stroke="#10b981" stroke-width="1.5"/>
<text x="775" y="112" fill="#6EE7B7" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">2. Kafka Zero-Copy via OS sendfile()</text>
<rect x="670" y="122" width="210" height="18" rx="9" fill="#047857" stroke="#10B981" stroke-width="1"/><text x="775" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">2 Context Switches / 0 CPU Copies!</text>
<rect x="560" y="155" width="430" height="55" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
<text x="575" y="175" fill="#F8FAFC" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Physical Storage Disk (Segment File)</text>
<text x="575" y="195" fill="#34D399" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Data on disk -&gt; 1. DMA Copy directly to Kernel PageCache</text>
<rect x="560" y="230" width="430" height="95" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
<text x="575" y="253" fill="#6EE7B7" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">OS Kernel Space (PageCache Buffer)</text>
<text x="575" y="273" fill="#D1FAE5" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Linux sendfile() / FileChannel.transferTo() system call</text>
<text x="575" y="291" fill="#A7F3D0" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• ZERO bytes copied into JVM user space! CPU stays near 0%</text>
<text x="575" y="307" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Only small buffer descriptors (pointers &amp; length) passed to socket</text>
<rect x="560" y="345" width="430" height="55" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="575" y="365" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">DMA Gather Copy directly from PageCache to NIC</text>
<text x="575" y="385" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">NIC reads payload directly from OS PageCache memory buffers!</text>
<rect x="560" y="420" width="430" height="75" rx="8" fill="#0f2e28" stroke="#059669" stroke-width="1"/>
<text x="775" y="442" fill="#34D399" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">The Zero-Copy Throughput Multiplier</text>
<text x="575" y="462" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">✓ Saturates multi-gigabit NICs with negligible CPU overhead</text>
<text x="575" y="478" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">✓ No JVM GC pauses or heap memory pressure for message forwarding</text>
<line x1="775" y1="210" x2="775" y2="230" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
<line x1="775" y1="325" x2="775" y2="345" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>
<line x1="775" y1="400" x2="775" y2="420" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
</svg>