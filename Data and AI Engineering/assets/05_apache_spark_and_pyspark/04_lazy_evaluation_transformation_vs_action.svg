<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1120" height="500" rx="10" fill="url(#bg)"/>
  <rect width="1120" height="500" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="560" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">Spark Lazy Evaluation: Transformations vs Actions Pipeline</text>
  <text x="560" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">Transformations construct a Directed Acyclic Graph (DAG); Actions submit and trigger physical cluster execution</text>

  <!-- Top Panel: Transformation DAG Construction (Lazy) -->
  <rect x="40" y="85" width="1040" height="185" rx="8" fill="#1E293B" fill-opacity="0.6" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="40" y="85" width="1040" height="32" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="560" y="106" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle">DRIVER DAG GRAPH CONSTRUCTION (LAZY EVALUATION — ZERO CLUSTER COMPUTE)</text>

  <!-- Step 1: read -->
  <rect x="60" y="130" width="180" height="70" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="150" y="152" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">spark.read.parquet()</text>
  <text x="150" y="172" font-size="9.5" fill="#94A3B8" text-anchor="middle">LogicalRelation node</text>
  <text x="150" y="187" font-size="8.5" fill="#34D399" text-anchor="middle">Lazy: No disk read!</text>

  <!-- Step 2: filter -->
  <rect x="280" y="130" width="180" height="70" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="370" y="152" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">.filter(amount &gt; 100)</text>
  <text x="370" y="172" font-size="9.5" fill="#94A3B8" text-anchor="middle">Filter operator node</text>
  <text x="370" y="187" font-size="8.5" fill="#34D399" text-anchor="middle">Lazy: No data filtered!</text>

  <!-- Step 3: groupBy -->
  <rect x="500" y="130" width="180" height="70" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="590" y="152" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">.groupBy("region")</text>
  <text x="590" y="172" font-size="9.5" fill="#94A3B8" text-anchor="middle">RelationalGroupedDataset</text>
  <text x="590" y="187" font-size="8.5" fill="#34D399" text-anchor="middle">Lazy: No shuffle!</text>

  <!-- Step 4: agg -->
  <rect x="720" y="130" width="180" height="70" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="810" y="152" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">.agg(sum("amount"))</text>
  <text x="810" y="172" font-size="9.5" fill="#94A3B8" text-anchor="middle">Aggregate operator node</text>
  <text x="810" y="187" font-size="8.5" fill="#34D399" text-anchor="middle">Lazy: No aggregation!</text>

  <!-- Arrow DAG connections -->
  <line x1="240" y1="165" x2="280" y2="165" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>
  <line x1="460" y1="165" x2="500" y2="165" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>
  <line x1="680" y1="165" x2="720" y2="165" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>

  <!-- Legend / Driver Context -->
  <rect x="920" y="130" width="145" height="70" rx="6" fill="#0F172A" stroke="#64748B" stroke-dasharray="3 3" stroke-width="1"/>
  <text x="992" y="152" font-size="10" font-weight="700" fill="#94A3B8" text-anchor="middle">Driver Memory</text>
  <text x="992" y="170" font-size="9" fill="#CBD5E1" text-anchor="middle">Pure AST Graph</text>
  <text x="992" y="185" font-size="9" fill="#34D399" text-anchor="middle">Duration: ~5 ms</text>

  <text x="560" y="240" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Why Lazy? Catalyst analyzes the entire chain together: pushes filter down to Parquet scan (pushdown) and prunes unused columns!</text>

  <!-- Bottom Panel: Action Triggers Job Execution -->
  <rect x="40" y="285" width="1040" height="175" rx="8" fill="#064E3B" fill-opacity="0.2" stroke="#34D399" stroke-width="1.5"/>
  <rect x="40" y="285" width="1040" height="32" rx="8" fill="#064E3B" fill-opacity="0.8" stroke="#34D399" stroke-width="1.5"/>
  <text x="560" y="306" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle">ACTION INVOKED: TRIGGERING PHYSICAL CLUSTER COMPUTATION</text>

  <!-- Action Box -->
  <rect x="60" y="330" width="230" height="95" rx="6" fill="#0F172A" stroke="#FBBF24" stroke-width="2"/>
  <text x="175" y="352" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="middle">ACTION TRIGGER</text>
  <text x="175" y="372" font-size="10" font-family="monospace" fill="#FDE68A" text-anchor="middle">.write.parquet("out/")</text>
  <text x="175" y="390" font-size="9.5" fill="#CBD5E1" text-anchor="middle">or .count(), .collect(), .show()</text>
  <text x="175" y="408" font-size="9.5" font-weight="600" fill="#FBBF24" text-anchor="middle">Submits Job to DAGScheduler!</text>

  <!-- Catalyst Optimization Box -->
  <rect x="330" y="330" width="230" height="95" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="445" y="352" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">Catalyst Physical Planning</text>
  <text x="445" y="372" font-size="9.5" fill="#94A3B8" text-anchor="middle">• Rule-based logical optimization</text>
  <text x="445" y="388" font-size="9.5" fill="#94A3B8" text-anchor="middle">• Cost-based join strategy selection</text>
  <text x="445" y="404" font-size="9.5" fill="#38BDF8" text-anchor="middle">• Whole-Stage Java bytecode gen</text>

  <!-- Cluster Worker Execution Box -->
  <rect x="600" y="330" width="465" height="95" rx="6" fill="#0F172A" stroke="#34D399" stroke-width="2"/>
  <text x="832" y="352" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">Distributed Cluster Execution Across Worker Fleet</text>
  <text x="832" y="372" font-size="9.5" fill="#CBD5E1" text-anchor="middle">• Stage 1: Parallel Parquet partition scan with predicate pushdown</text>
  <text x="832" y="388" font-size="9.5" fill="#CBD5E1" text-anchor="middle">• Shuffle Exchange: Hash partition region keys across network</text>
  <text x="832" y="404" font-size="9.5" font-weight="600" fill="#34D399" text-anchor="middle">• Stage 2: Parallel partial sum reduction and direct storage write</text>

  <!-- Connectors Bottom Panel -->
  <line x1="290" y1="377" x2="330" y2="377" stroke="#FBBF24" stroke-width="2" marker-end="url(#arr-a)"/>
  <line x1="560" y1="377" x2="600" y2="377" stroke="#34D399" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- Top to Bottom Trigger Arrow -->
  <path d="M 810.0 200.0 L 810.0 210.0 C 810.0 263.0, 175.0 263.0, 175.0 316.0 L 175.0 330.0" fill="none" stroke="#FBBF24" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arr-a)"/>

  <!-- Bottom Invariant -->
  <rect x="40" y="468" width="1040" height="24" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="560" y="484" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Execution Invariant: Without actions, Spark programs do zero work. Lazy evaluation allows Catalyst to inspect the entire query pipeline and optimize disk I/O and network shuffles.</text>
</svg>