<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1120" height="540" rx="10" fill="url(#bg)"/>
  <rect width="1120" height="540" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="560" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">PySpark Runtime Architecture: Py4J Gateway &amp; Worker Interop</text>
  <text x="560" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">Python Driver to JVM Gateway coordination vs Worker-level Python Daemon execution for custom UDFs</text>

  <!-- Left Panel: Driver Architecture -->
  <rect x="40" y="85" width="490" height="400" rx="8" fill="#1E293B" fill-opacity="0.6" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="40" y="85" width="490" height="32" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="285" y="106" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle">PYSPARK DRIVER LAYER: PY4J JVM GATEWAY</text>

  <!-- Python Driver Process -->
  <rect x="60" y="130" width="200" height="120" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="160" y="152" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">Python Driver Process</text>
  <text x="160" y="172" font-size="10" font-family="monospace" fill="#93C5FD" text-anchor="middle">df = spark.read.parquet()</text>
  <text x="160" y="188" font-size="10" font-family="monospace" fill="#93C5FD" text-anchor="middle">df.filter().groupBy()</text>
  <text x="160" y="210" font-size="9" fill="#94A3B8" text-anchor="middle">Uses Python PySpark API</text>
  <text x="160" y="225" font-size="9" fill="#94A3B8" text-anchor="middle">Zero local data processing!</text>

  <!-- Py4J Gateway -->
  <rect x="300" y="130" width="210" height="120" rx="6" fill="#0F172A" stroke="#C084FC" stroke-width="1.5"/>
  <text x="405" y="152" font-size="11" font-weight="700" fill="#C084FC" text-anchor="middle">Py4J Gateway (Socket 25333)</text>
  <text x="405" y="174" font-size="9.5" fill="#CBD5E1" text-anchor="middle">• Exposes JVM SparkSession to Python</text>
  <text x="405" y="191" font-size="9.5" fill="#CBD5E1" text-anchor="middle">• Marshals method invocations</text>
  <text x="405" y="208" font-size="9.5" fill="#CBD5E1" text-anchor="middle">• Only metadata &amp; plan AST cross wire</text>
  <text x="405" y="228" font-size="9" font-weight="600" fill="#34D399" text-anchor="middle">Lightweight Localhost Loopback</text>

  <!-- Bidirectional Driver Arrow -->
  <line x1="260" y1="190" x2="300" y2="190" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>
  <line x1="300" y1="205" x2="260" y2="205" stroke="#C084FC" stroke-width="2" marker-end="url(#arr-p)"/>

  <!-- JVM Spark Driver -->
  <rect x="60" y="270" width="450" height="195" rx="6" fill="#0F172A" stroke="#34D399" stroke-width="1.5"/>
  <text x="285" y="292" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">JVM Spark Driver (Full Execution Master)</text>

  <rect x="80" y="305" width="410" height="42" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="95" y="323" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="start">Catalyst Optimizer (Scala / JVM)</text>
  <text x="95" y="337" font-size="9" fill="#94A3B8" text-anchor="start">Builds Resolved &amp; Optimized Physical Plan from Py4J instructions</text>

  <rect x="80" y="355" width="410" height="42" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="95" y="373" font-size="10" font-weight="700" fill="#FBBF24" text-anchor="start">DAGScheduler &amp; TaskScheduler</text>
  <text x="95" y="387" font-size="9" fill="#94A3B8" text-anchor="start">Divides physical plan into Stages and dispatches tasks to worker fleet</text>

  <text x="285" y="425" font-size="9.5" font-weight="600" fill="#34D399" text-anchor="middle">Key Insight: PySpark DataFrames do NOT execute in Python on the Driver.</text>
  <text x="285" y="442" font-size="9.5" fill="#CBD5E1" text-anchor="middle">The Python script is purely a client compiler sending commands to the JVM!</text>

  <!-- Arrow Py4J to JVM Driver -->
  <line x1="405" y1="250" x2="405" y2="270" stroke="#34D399" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- Right Panel: Worker Execution -->
  <rect x="560" y="85" width="520" height="400" rx="8" fill="#1E293B" fill-opacity="0.6" stroke="#34D399" stroke-width="1.5"/>
  <rect x="560" y="85" width="520" height="32" rx="8" fill="#064E3B" fill-opacity="0.8" stroke="#34D399" stroke-width="1.5"/>
  <text x="820" y="106" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle">WORKER EXECUTOR INTEROP: NATIVE VS PYTHON UDF</text>

  <!-- Path A: Native DataFrame Operations -->
  <rect x="580" y="130" width="480" height="120" rx="6" fill="#064E3B" fill-opacity="0.2" stroke="#34D399" stroke-width="1.5"/>
  <text x="820" y="152" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">PATH A: NATIVE DATAFRAME OPERATIONS (100% JVM / TUNGSTEN)</text>
  <text x="820" y="172" font-size="9.5" fill="#CBD5E1" text-anchor="middle">df.select(), df.filter(), df.groupBy(), df.join(), spark built-in functions</text>
  <text x="820" y="195" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">Zero Python worker process spawned! Runs 100% in Java/C++ native memory.</text>
  <text x="820" y="212" font-size="9.5" fill="#A7F3D0" text-anchor="middle">Janino compiles physical plan to flattened bytecode loops via Project Tungsten.</text>
  <text x="820" y="230" font-size="9.5" font-weight="600" fill="#38BDF8" text-anchor="middle">Identical performance in Python, Scala, Java, and SQL!</text>

  <!-- Path B: Custom Python UDF Bottleneck -->
  <rect x="580" y="265" width="480" height="200" rx="6" fill="#450A0A" fill-opacity="0.2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="820" y="287" font-size="11" font-weight="700" fill="#F87171" text-anchor="middle">PATH B: CUSTOM PYTHON UDF (@udf) EXECUTION PENALTY</text>

  <!-- JVM Worker side -->
  <rect x="595" y="305" width="165" height="100" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="677" y="325" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">JVM Executor</text>
  <text x="677" y="345" font-size="9" fill="#94A3B8" text-anchor="middle">Holds Tungsten Rows</text>
  <text x="677" y="362" font-size="8.5" fill="#EF4444" text-anchor="middle">1. Serializes rows</text>
  <text x="677" y="377" font-size="8.5" fill="#EF4444" text-anchor="middle">(Pickle row-by-row)</text>
  <text x="677" y="392" font-size="8.5" fill="#34D399" text-anchor="middle">4. Reads result back</text>

  <!-- IPC Socket -->
  <rect x="775" y="325" width="90" height="60" rx="4" fill="#1E293B" stroke="#FBBF24" stroke-width="1"/>
  <text x="820" y="347" font-size="9" font-weight="700" fill="#FBBF24" text-anchor="middle">IPC Pipe /</text>
  <text x="820" y="362" font-size="8.5" fill="#FDE68A" text-anchor="middle">Unix Socket</text>

  <!-- Python Daemon Worker -->
  <rect x="880" y="305" width="165" height="100" rx="4" fill="#0F172A" stroke="#EF4444" stroke-width="1.5"/>
  <text x="962" y="325" font-size="10" font-weight="700" fill="#F87171" text-anchor="middle">Python Daemon Worker</text>
  <text x="962" y="345" font-size="9" fill="#FCA5A5" text-anchor="middle">pyspark.daemon child</text>
  <text x="962" y="362" font-size="8.5" fill="#94A3B8" text-anchor="middle">2. Deserializes Python obj</text>
  <text x="962" y="377" font-size="8.5" fill="#FBBF24" text-anchor="middle">3. Runs Python lambda</text>
  <text x="962" y="392" font-size="8.5" fill="#94A3B8" text-anchor="middle">Subject to Python GIL!</text>

  <line x1="760" y1="345" x2="775" y2="345" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <line x1="865" y1="345" x2="880" y2="345" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <line x1="880" y1="365" x2="865" y2="365" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <line x1="775" y1="365" x2="760" y2="365" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <text x="820" y="430" font-size="9.5" font-weight="700" fill="#EF4444" text-anchor="middle">Standard Python UDF: 10x-50x SLOWER due to row serialization &amp; context switching.</text>
  <text x="820" y="447" font-size="9" fill="#CBD5E1" text-anchor="middle">Solution: Use Vectorized Pandas UDFs (@pandas_udf) via Apache Arrow zero-copy memory!</text>

  <!-- Bottom Invariant -->
  <rect x="40" y="500" width="1040" height="26" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="560" y="517" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">PySpark Interop Invariant: Standard DataFrame operations execute 100% inside the JVM/Tungsten engine; Python worker processes are only spawned when custom Python UDFs are executed.</text>
</svg>