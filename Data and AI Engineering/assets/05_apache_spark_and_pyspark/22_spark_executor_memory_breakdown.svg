<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1120" height="540" rx="10" fill="url(#bg)"/>
  <rect width="1120" height="540" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="560" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">Spark Executor Memory Breakdown &amp; Dynamic Borrowing</text>
  <text x="560" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">Detailed JVM heap layout (Reserved, User, Storage, Execution) and dynamic boundary lending mechanics</text>

  <!-- Main JVM Container -->
  <rect x="40" y="85" width="1040" height="400" rx="8" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="1.5"/>
  <rect x="40" y="85" width="1040" height="36" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="560" y="108" font-size="13" font-weight="700" fill="#F8FAFC" text-anchor="middle">TOTAL EXECUTOR MEMORY: spark.executor.memory = 16 GB (JVM HEAP)</text>

  <!-- Left: Reserved Memory (Fixed 300MB) -->
  <rect x="60" y="135" width="140" height="330" rx="6" fill="#0F172A" stroke="#64748B" stroke-width="1.5"/>
  <rect x="60" y="135" width="140" height="30" rx="6" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
  <text x="130" y="155" font-size="10" font-weight="700" fill="#94A3B8" text-anchor="middle">RESERVED</text>
  
  <text x="130" y="185" font-size="11" font-weight="700" fill="#F8FAFC" text-anchor="middle">300 MB</text>
  <text x="130" y="202" font-size="9" fill="#94A3B8" text-anchor="middle">(Hardcoded)</text>

  <text x="70" y="240" font-size="9" fill="#CBD5E1" text-anchor="start">• Spark internal</text>
  <text x="70" y="257" font-size="9" fill="#CBD5E1" text-anchor="start">  system overhead</text>
  <text x="70" y="274" font-size="9" fill="#CBD5E1" text-anchor="start">• Heartbeat actors</text>
  <text x="70" y="291" font-size="9" fill="#CBD5E1" text-anchor="start">• Task serialization</text>
  <text x="70" y="308" font-size="9" fill="#CBD5E1" text-anchor="start">  buffers</text>
  <text x="70" y="340" font-size="8.5" fill="#EF4444" text-anchor="start">Cannot be changed</text>
  <text x="70" y="355" font-size="8.5" fill="#EF4444" text-anchor="start">by user flags!</text>

  <!-- Middle: User Memory (25% = ~3.9 GB) -->
  <rect x="220" y="135" width="220" height="330" rx="6" fill="#0F172A" stroke="#FBBF24" stroke-width="1.5"/>
  <rect x="220" y="135" width="220" height="30" rx="6" fill="#78350F" fill-opacity="0.8" stroke="#FBBF24" stroke-width="1"/>
  <text x="330" y="155" font-size="10" font-weight="700" fill="#FDE68A" text-anchor="middle">USER MEMORY (25% = ~3.9 GB)</text>
  
  <text x="330" y="185" font-size="11" font-weight="700" fill="#FDE68A" text-anchor="middle">(1 - spark.memory.fraction)</text>
  <text x="330" y="202" font-size="9" fill="#CBD5E1" text-anchor="middle">Default: 25% of (Heap - 300MB)</text>

  <text x="235" y="235" font-size="9.5" fill="#CBD5E1" text-anchor="start">• Custom user data structures</text>
  <text x="235" y="252" font-size="9.5" fill="#CBD5E1" text-anchor="start">• Non-Tungsten Java objects / maps</text>
  <text x="235" y="269" font-size="9.5" fill="#CBD5E1" text-anchor="start">• Python UDF serialization buffers</text>
  <text x="235" y="286" font-size="9.5" fill="#CBD5E1" text-anchor="start">• Driver/Worker metadata</text>
  <text x="235" y="303" font-size="9.5" fill="#CBD5E1" text-anchor="start">• Third-party library allocations</text>

  <rect x="235" y="335" width="190" height="70" rx="4" fill="#1E293B" stroke="#FBBF24" stroke-dasharray="3 3" stroke-width="1"/>
  <text x="330" y="355" font-size="9.5" font-weight="700" fill="#FBBF24" text-anchor="middle">OOM Hazard Zone</text>
  <text x="330" y="372" font-size="8.5" fill="#CBD5E1" text-anchor="middle">If custom arrays exceed 3.9GB,</text>
  <text x="330" y="387" font-size="8.5" fill="#F87171" text-anchor="middle">JVM crashes with java.lang.OutOfMemoryError!</text>

  <!-- Right: Spark Memory Pool (75% = ~11.8 GB) -->
  <rect x="460" y="135" width="600" height="330" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
  <rect x="460" y="135" width="600" height="30" rx="6" fill="#1E3A8A" fill-opacity="0.8" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="760" y="155" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">SPARK UNIFIED MEMORY POOL (spark.memory.fraction = 0.75, ~11.8 GB)</text>

  <!-- Storage Memory Sub-pool -->
  <rect x="480" y="180" width="270" height="265" rx="6" fill="#064E3B" fill-opacity="0.3" stroke="#34D399" stroke-width="1.5"/>
  <text x="615" y="202" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">STORAGE MEMORY (50% = ~5.9 GB)</text>
  <text x="615" y="220" font-size="9.5" fill="#A7F3D0" text-anchor="middle">spark.memory.storageFraction = 0.5</text>

  <text x="495" y="247" font-size="9.5" fill="#CBD5E1" text-anchor="start">• Cached DataFrames (.cache(), .persist())</text>
  <text x="495" y="264" font-size="9.5" fill="#CBD5E1" text-anchor="start">• Broadcast variables (TorrentBroadcast)</text>
  <text x="495" y="281" font-size="9.5" fill="#CBD5E1" text-anchor="start">• Unroll memory for deserialized blocks</text>

  <rect x="495" y="305" width="240" height="120" rx="4" fill="#0F172A" stroke="#34D399" stroke-width="1"/>
  <text x="615" y="325" font-size="9.5" font-weight="700" fill="#34D399" text-anchor="middle">Dynamic Eviction Rule</text>
  <text x="615" y="345" font-size="9" fill="#CBD5E1" text-anchor="middle">Can borrow free Execution space.</text>
  <text x="615" y="362" font-size="9" fill="#FBBF24" text-anchor="middle">BUT if Execution needs space,</text>
  <text x="615" y="379" font-size="9" font-weight="700" fill="#EF4444" text-anchor="middle">Storage is EVICTED to disk!</text>
  <text x="615" y="399" font-size="8.5" fill="#CBD5E1" text-anchor="middle">Execution always takes priority.</text>

  <!-- Execution Memory Sub-pool -->
  <rect x="770" y="180" width="270" height="265" rx="6" fill="#1E3A8A" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="905" y="202" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">EXECUTION MEMORY (50% = ~5.9 GB)</text>
  <text x="905" y="220" font-size="9.5" fill="#BAE6FD" text-anchor="middle">1 - spark.memory.storageFraction = 0.5</text>

  <text x="785" y="247" font-size="9.5" fill="#CBD5E1" text-anchor="start">• Shuffle Sort &amp; Aggregation buffers</text>
  <text x="785" y="264" font-size="9.5" fill="#CBD5E1" text-anchor="start">• SortMergeJoin two-pointer buffers</text>
  <text x="785" y="281" font-size="9.5" fill="#CBD5E1" text-anchor="start">• Tungsten Hash Tables &amp; Bitmasks</text>

  <rect x="785" y="305" width="240" height="120" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
  <text x="905" y="325" font-size="9.5" font-weight="700" fill="#38BDF8" text-anchor="middle">Borrowing &amp; Spilling Rule</text>
  <text x="905" y="345" font-size="9" fill="#CBD5E1" text-anchor="middle">Can borrow free Storage space.</text>
  <text x="905" y="362" font-size="9" font-weight="700" fill="#34D399" text-anchor="middle">CANNOT be evicted by Storage!</text>
  <text x="905" y="379" font-size="9" fill="#CBD5E1" text-anchor="middle">If Execution exceeds pool:</text>
  <text x="905" y="399" font-size="8.5" font-weight="600" fill="#FBBF24" text-anchor="middle">Spills gracefully to local NVMe disk.</text>

  <!-- Dynamic Borrowing Bi-directional Arrow -->
  <line x1="745" y1="215" x2="770" y2="215" stroke="#FBBF24" stroke-width="2" marker-end="url(#arr-a)"/>
  <line x1="770" y1="225" x2="745" y2="225" stroke="#34D399" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- Bottom Invariant -->
  <rect x="40" y="500" width="1040" height="26" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="560" y="517" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Memory Invariant: Spark unified memory dynamically borrows between Execution and Storage; Execution has eviction priority and will evict cached blocks to disk to prevent shuffle sort OOMs.</text>
</svg>