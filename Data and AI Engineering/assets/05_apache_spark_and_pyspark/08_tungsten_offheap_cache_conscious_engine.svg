<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1120" height="520" rx="10" fill="url(#bg)"/>
  <rect width="1120" height="520" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="560" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">Project Tungsten Architecture: Off-Heap, Cache-Conscious &amp; CodeGen</text>
  <text x="560" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">How Apache Spark eliminates JVM memory bloat, cache misses, and virtual function dispatch overhead</text>

  <!-- Pillar 1: Off-Heap Memory Management -->
  <rect x="40" y="85" width="330" height="385" rx="8" fill="#1E293B" fill-opacity="0.6" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="40" y="85" width="330" height="40" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="205" y="105" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle">1. OFF-HEAP MEMORY MANAGEMENT</text>
  <text x="205" y="119" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">sun.misc.Unsafe Direct Memory Addressing</text>

  <!-- Problem Box -->
  <rect x="55" y="140" width="300" height="85" rx="6" fill="#450A0A" fill-opacity="0.2" stroke="#EF4444" stroke-width="1"/>
  <text x="70" y="160" font-size="11" font-weight="700" fill="#F87171" text-anchor="start">JVM Object Overhead (The Problem)</text>
  <text x="70" y="177" font-size="10" fill="#94A3B8" text-anchor="start">• 16-byte object header for a 4-byte integer!</text>
  <text x="70" y="192" font-size="10" fill="#94A3B8" text-anchor="start">• 48-byte overhead for a 4-char string</text>
  <text x="70" y="207" font-size="10" fill="#F87171" text-anchor="start">• Catastrophic Java GC pauses on 100GB+ heaps</text>

  <!-- Solution Box -->
  <rect x="55" y="235" width="300" height="110" rx="6" fill="#064E3B" fill-opacity="0.2" stroke="#34D399" stroke-width="1.5"/>
  <text x="70" y="255" font-size="11" font-weight="700" fill="#34D399" text-anchor="start">Tungsten Binary Format (The Solution)</text>
  <text x="70" y="272" font-size="10" fill="#CBD5E1" text-anchor="start">• Packed byte arrays managed off-heap</text>
  <text x="70" y="287" font-size="10" fill="#CBD5E1" text-anchor="start">• 64-bit word encoded pointers (Page + Offset)</text>
  <text x="70" y="302" font-size="10" fill="#34D399" text-anchor="start">• Zero Java object instantiation</text>
  <text x="70" y="317" font-size="10" font-weight="600" fill="#34D399" text-anchor="start">• Zero JVM Garbage Collection pauses!</text>

  <!-- Benefits Box -->
  <rect x="55" y="355" width="300" height="100" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
  <text x="70" y="375" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="start">Key Technical Takeaway</text>
  <text x="70" y="393" font-size="9.5" fill="#CBD5E1" text-anchor="start">Data is serialized directly in binary format.</text>
  <text x="70" y="408" font-size="9.5" fill="#CBD5E1" text-anchor="start">Operations (sort, hash) operate directly on</text>
  <text x="70" y="423" font-size="9.5" font-weight="600" fill="#93C5FD" text-anchor="start">raw binary bytes without deserialization.</text>

  <!-- Pillar 2: Cache-Conscious Computation -->
  <rect x="395" y="85" width="330" height="385" rx="8" fill="#1E293B" fill-opacity="0.6" stroke="#FBBF24" stroke-width="1.5"/>
  <rect x="395" y="85" width="330" height="40" rx="8" fill="#0F172A" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="560" y="105" font-size="12" font-weight="700" fill="#FBBF24" text-anchor="middle">2. CACHE-CONSCIOUS COMPUTATION</text>
  <text x="560" y="119" font-size="10" font-weight="600" fill="#FDE68A" text-anchor="middle">Hardware CPU L1/L2/L3 Cache Line Optimization</text>

  <!-- Problem Box -->
  <rect x="410" y="140" width="300" height="85" rx="6" fill="#450A0A" fill-opacity="0.2" stroke="#EF4444" stroke-width="1"/>
  <text x="425" y="160" font-size="11" font-weight="700" fill="#F87171" text-anchor="start">Memory Stalls &amp; Cache Misses</text>
  <text x="425" y="177" font-size="10" fill="#94A3B8" text-anchor="start">• RAM fetch cost: ~100ns (200 CPU cycles!)</text>
  <text x="425" y="192" font-size="10" fill="#94A3B8" text-anchor="start">• Pointer chasing across heap causes cache miss</text>
  <text x="425" y="207" font-size="10" fill="#F87171" text-anchor="start">• CPU idles waiting for memory bus</text>

  <!-- Solution Box -->
  <rect x="410" y="235" width="300" height="110" rx="6" fill="#064E3B" fill-opacity="0.2" stroke="#34D399" stroke-width="1.5"/>
  <text x="425" y="255" font-size="11" font-weight="700" fill="#34D399" text-anchor="start">64-Byte Cache-Line Packing</text>
  <text x="425" y="272" font-size="10" fill="#CBD5E1" text-anchor="start">• Aligns arrays to 64-byte hardware cache lines</text>
  <text x="425" y="287" font-size="10" fill="#CBD5E1" text-anchor="start">• Stores 8-byte key prefix + 8-byte pointer</text>
  <text x="425" y="302" font-size="10" fill="#34D399" text-anchor="start">• Sort compares keys entirely in L1/L2 cache</text>
  <text x="425" y="317" font-size="10" font-weight="600" fill="#34D399" text-anchor="start">• Only dereferences pointer for full row output!</text>

  <!-- Benefits Box -->
  <rect x="410" y="355" width="300" height="100" rx="6" fill="#0F172A" stroke="#FBBF24" stroke-width="1"/>
  <text x="425" y="375" font-size="10" font-weight="700" fill="#FBBF24" text-anchor="start">Key Technical Takeaway</text>
  <text x="425" y="393" font-size="9.5" fill="#CBD5E1" text-anchor="start">Radix and Quicksort sort 8-byte prefixes</text>
  <text x="425" y="408" font-size="9.5" fill="#CBD5E1" text-anchor="start">consecutively in CPU cache. Memory stalls</text>
  <text x="425" y="423" font-size="9.5" font-weight="600" fill="#FDE68A" text-anchor="start">are reduced by up to 90%!</text>

  <!-- Pillar 3: Whole-Stage CodeGen -->
  <rect x="750" y="85" width="330" height="385" rx="8" fill="#1E293B" fill-opacity="0.6" stroke="#C084FC" stroke-width="1.5"/>
  <rect x="750" y="85" width="330" height="40" rx="8" fill="#0F172A" stroke="#C084FC" stroke-width="1.5"/>
  <text x="915" y="105" font-size="12" font-weight="700" fill="#C084FC" text-anchor="middle">3. WHOLE-STAGE CODEGEN</text>
  <text x="915" y="119" font-size="10" font-weight="600" fill="#E9D5FF" text-anchor="middle">Janino In-Memory Compilation to Native Bytecode</text>

  <!-- Problem Box -->
  <rect x="765" y="140" width="300" height="85" rx="6" fill="#450A0A" fill-opacity="0.2" stroke="#EF4444" stroke-width="1"/>
  <text x="780" y="160" font-size="11" font-weight="700" fill="#F87171" text-anchor="start">Volcano Iterator Overhead</text>
  <text x="780" y="177" font-size="10" fill="#94A3B8" text-anchor="start">• Traditional DBs call operator.next() per row</text>
  <text x="780" y="192" font-size="10" fill="#94A3B8" text-anchor="start">• Millions of polymorphic virtual method calls</text>
  <text x="780" y="207" font-size="10" fill="#F87171" text-anchor="start">• Prevents CPU compiler branch prediction</text>

  <!-- Solution Box -->
  <rect x="765" y="235" width="300" height="110" rx="6" fill="#064E3B" fill-opacity="0.2" stroke="#34D399" stroke-width="1.5"/>
  <text x="780" y="255" font-size="11" font-weight="700" fill="#34D399" text-anchor="start">Single Flattened Native Loop</text>
  <text x="780" y="272" font-size="10" fill="#CBD5E1" text-anchor="start">• Fuses scan, filter, project &amp; aggregate</text>
  <text x="780" y="287" font-size="10" fill="#CBD5E1" text-anchor="start">• Generates clean Java source code on the fly</text>
  <text x="780" y="302" font-size="10" fill="#34D399" text-anchor="start">• Compiles via Janino into JVM bytecode</text>
  <text x="780" y="317" font-size="10" font-weight="600" fill="#34D399" text-anchor="start">• Record fields stay in CPU registers!</text>

  <!-- Benefits Box -->
  <rect x="765" y="355" width="300" height="100" rx="6" fill="#0F172A" stroke="#C084FC" stroke-width="1"/>
  <text x="780" y="375" font-size="10" font-weight="700" fill="#C084FC" text-anchor="start">Key Technical Takeaway</text>
  <text x="780" y="393" font-size="9.5" fill="#CBD5E1" text-anchor="start">Code runs at the speed of hand-written C++.</text>
  <text x="780" y="408" font-size="9.5" fill="#CBD5E1" text-anchor="start">Zero virtual dispatch overhead, enabling</text>
  <text x="780" y="423" font-size="9.5" font-weight="600" fill="#E9D5FF" text-anchor="start">SIMD vectorization by modern x86 CPUs.</text>

  <!-- Bottom Invariant -->
  <rect x="40" y="480" width="1040" height="26" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="560" y="497" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Tungsten Invariant: Tungsten shifts Spark's bottleneck from CPU/Memory bandwidth limits to bare hardware wire speeds by combining Off-Heap Binary encoding, Cache-Line alignment, and Whole-Stage CodeGen.</text>
</svg>