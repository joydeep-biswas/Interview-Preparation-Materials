<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1120" height="520" rx="10" fill="url(#bg)"/>
  <rect width="1120" height="520" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="560" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">Broadcast Hash Join (BHJ): Distribution &amp; Map-Side Execution</text>
  <text x="560" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">Eliminating network shuffle of multi-terabyte fact tables by broadcasting dimension tables via BitTorrent</text>

  <!-- Column 1: Driver Broadcast Layer -->
  <rect x="40" y="85" width="310" height="385" rx="8" fill="#1E293B" fill-opacity="0.6" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="40" y="85" width="310" height="36" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="195" y="108" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle">1. DRIVER BROADCAST PREPARATION</text>

  <!-- Small Dim Table -->
  <rect x="55" y="135" width="280" height="85" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="70" y="157" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="start">Scan Small Dimension Table</text>
  <text x="70" y="174" font-size="10" font-family="monospace" fill="#93C5FD" text-anchor="start">dim_products (15 MB, 100k rows)</text>
  <text x="70" y="192" font-size="9.5" fill="#CBD5E1" text-anchor="start">• Size &lt;= autoBroadcastJoinThreshold</text>
  <text x="70" y="207" font-size="9.5" fill="#34D399" text-anchor="start">• Fully collected into Driver JVM memory</text>

  <!-- Torrent Broadcast -->
  <rect x="55" y="240" width="280" height="110" rx="6" fill="#0F172A" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="70" y="262" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="start">TorrentBroadcast Distribution</text>
  <text x="70" y="282" font-size="9.5" fill="#CBD5E1" text-anchor="start">• Serializes small table into 4MB chunks</text>
  <text x="70" y="299" font-size="9.5" fill="#CBD5E1" text-anchor="start">• Uses BitTorrent peer-to-peer protocol</text>
  <text x="70" y="316" font-size="9.5" fill="#CBD5E1" text-anchor="start">• Executors share chunks between each other</text>
  <text x="70" y="335" font-size="9" font-weight="600" fill="#34D399" text-anchor="start">Prevents Driver network bottleneck!</text>

  <!-- Driver Rule Box -->
  <rect x="55" y="365" width="280" height="90" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="70" y="385" font-size="10" font-weight="700" fill="#94A3B8" text-anchor="start">Join Selection Rule:</text>
  <text x="70" y="403" font-size="9" fill="#CBD5E1" text-anchor="start">Triggered automatically if table &lt; 10MB,</text>
  <text x="70" y="418" font-size="9" fill="#CBD5E1" text-anchor="start">or manually via hint: <tspan font-family="monospace" fill="#38BDF8">/*+ BROADCAST(dim) */</tspan></text>
  <text x="70" y="435" font-size="9" font-weight="600" fill="#FBBF24" text-anchor="start">Avoid broadcasting tables &gt; 2GB (Driver OOM)</text>

  <line x1="195" y1="220" x2="195" y2="240" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#arr-a)"/>

  <!-- Right Container: Distributed Workers -->
  <rect x="390" y="85" width="690" height="385" rx="8" fill="#064E3B" fill-opacity="0.2" stroke="#34D399" stroke-width="1.5"/>
  <rect x="390" y="85" width="690" height="36" rx="8" fill="#064E3B" fill-opacity="0.8" stroke="#34D399" stroke-width="1.5"/>
  <text x="735" y="108" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle">2. LOCAL MAP-SIDE JOIN EXECUTION (ZERO NETWORK SHUFFLE OF 500GB FACT!)</text>

  <!-- Worker 1 Box -->
  <rect x="410" y="135" width="650" height="150" rx="6" fill="#0F172A" stroke="#34D399" stroke-width="1.5"/>
  <text x="425" y="157" font-size="11" font-weight="700" fill="#34D399" text-anchor="start">Executor 1 (Worker Node 1)</text>

  <!-- Broadcast Hash Table in RAM -->
  <rect x="425" y="170" width="220" height="100" rx="4" fill="#1E293B" stroke="#FBBF24" stroke-width="1"/>
  <text x="535" y="190" font-size="10" font-weight="700" fill="#FBBF24" text-anchor="middle">Broadcast Hash Table</text>
  <text x="535" y="208" font-size="9" fill="#CBD5E1" text-anchor="middle">Loaded once in JVM RAM (15MB)</text>
  <text x="535" y="225" font-size="9" fill="#A7F3D0" text-anchor="middle">Shared by all CPU cores</text>
  <text x="535" y="245" font-size="9.5" font-weight="600" fill="#38BDF8" text-anchor="middle">Read-only in Memory</text>

  <!-- Fact Partition 1 Scan -->
  <rect x="670" y="170" width="190" height="100" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
  <text x="765" y="190" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">Scan fact_sales Part 1</text>
  <text x="765" y="208" font-size="9" fill="#CBD5E1" text-anchor="middle">500 GB Partition Block</text>
  <text x="765" y="225" font-size="9" fill="#CBD5E1" text-anchor="middle">Streams rows directly from disk</text>
  <text x="765" y="245" font-size="9.5" font-weight="600" fill="#34D399" text-anchor="middle">Zero Network Shuffle!</text>

  <!-- Output 1 -->
  <rect x="880" y="170" width="165" height="100" rx="4" fill="#064E3B" fill-opacity="0.3" stroke="#34D399" stroke-width="1.5"/>
  <text x="962" y="190" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">Local Join Output</text>
  <text x="962" y="210" font-size="9" fill="#CBD5E1" text-anchor="middle">Probes hash table</text>
  <text x="962" y="228" font-size="9" fill="#CBD5E1" text-anchor="middle">O(1) hash lookup per row</text>
  <text x="962" y="250" font-size="9" font-weight="700" fill="#34D399" text-anchor="middle">Emits joined stream</text>

  <line x1="645" y1="220" x2="670" y2="220" stroke="#FBBF24" stroke-width="2" marker-end="url(#arr-a)"/>
  <line x1="860" y1="220" x2="880" y2="220" stroke="#34D399" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- Worker 2 Box -->
  <rect x="410" y="300" width="650" height="150" rx="6" fill="#0F172A" stroke="#34D399" stroke-width="1.5"/>
  <text x="425" y="322" font-size="11" font-weight="700" fill="#34D399" text-anchor="start">Executor 2 (Worker Node 2)</text>

  <!-- Broadcast Hash Table in RAM -->
  <rect x="425" y="335" width="220" height="100" rx="4" fill="#1E293B" stroke="#FBBF24" stroke-width="1"/>
  <text x="535" y="355" font-size="10" font-weight="700" fill="#FBBF24" text-anchor="middle">Broadcast Hash Table</text>
  <text x="535" y="373" font-size="9" fill="#CBD5E1" text-anchor="middle">Loaded once in JVM RAM (15MB)</text>
  <text x="535" y="390" font-size="9" fill="#A7F3D0" text-anchor="middle">Shared by all CPU cores</text>
  <text x="535" y="410" font-size="9.5" font-weight="600" fill="#38BDF8" text-anchor="middle">Read-only in Memory</text>

  <!-- Fact Partition 2 Scan -->
  <rect x="670" y="335" width="190" height="100" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
  <text x="765" y="355" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">Scan fact_sales Part 2</text>
  <text x="765" y="373" font-size="9" fill="#CBD5E1" text-anchor="middle">500 GB Partition Block</text>
  <text x="765" y="390" font-size="9" fill="#CBD5E1" text-anchor="middle">Streams rows directly from disk</text>
  <text x="765" y="410" font-size="9.5" font-weight="600" fill="#34D399" text-anchor="middle">Zero Network Shuffle!</text>

  <!-- Output 2 -->
  <rect x="880" y="335" width="165" height="100" rx="4" fill="#064E3B" fill-opacity="0.3" stroke="#34D399" stroke-width="1.5"/>
  <text x="962" y="355" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">Local Join Output</text>
  <text x="962" y="375" font-size="9" fill="#CBD5E1" text-anchor="middle">Probes hash table</text>
  <text x="962" y="393" font-size="9" fill="#CBD5E1" text-anchor="middle">O(1) hash lookup per row</text>
  <text x="962" y="415" font-size="9" font-weight="700" fill="#34D399" text-anchor="middle">Emits joined stream</text>

  <line x1="645" y1="385" x2="670" y2="385" stroke="#FBBF24" stroke-width="2" marker-end="url(#arr-a)"/>
  <line x1="860" y1="385" x2="880" y2="385" stroke="#34D399" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- Torrent Broadcast Arrows from Driver -->
  <path d="M 335.0 285.0 L 345.0 285.0 C 378.0 285.0, 378.0 220.0, 411.0 220.0 L 425.0 220.0" fill="none" stroke="#FBBF24" stroke-width="2" marker-end="url(#arr-a)"/>
  <path d="M 335.0 305.0 L 345.0 305.0 C 378.0 305.0, 378.0 385.0, 411.0 385.0 L 425.0 385.0" fill="none" stroke="#FBBF24" stroke-width="2" marker-end="url(#arr-a)"/>

  <!-- Bottom Invariant -->
  <rect x="40" y="480" width="1040" height="26" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="560" y="497" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">BHJ Invariant: BroadcastHashJoin completely avoids network shuffle for the large fact table by replicating the small dimension table across all worker nodes, transforming the join into a fast local narrow operation.</text>
</svg>