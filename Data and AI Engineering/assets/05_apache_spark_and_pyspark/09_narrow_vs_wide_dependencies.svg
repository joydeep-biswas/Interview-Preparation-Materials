<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1120" height="500" rx="10" fill="url(#bg)"/>
  <rect width="1120" height="500" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="560" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">Spark RDD Dependencies: Narrow vs Wide Dependency Mechanics</text>
  <text x="560" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">Narrow pipelining without shuffle vs Wide network shuffle exchanges across executor boundaries</text>

  <!-- Left Panel: Narrow Dependency -->
  <rect x="40" y="85" width="490" height="375" rx="8" fill="#064E3B" fill-opacity="0.2" stroke="#34D399" stroke-width="1.5"/>
  <rect x="40" y="85" width="490" height="36" rx="8" fill="#064E3B" fill-opacity="0.8" stroke="#34D399" stroke-width="1.5"/>
  <text x="285" y="108" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle">NARROW DEPENDENCY (ZERO NETWORK SHUFFLE)</text>

  <!-- Parent RDD A -->
  <rect x="65" y="140" width="180" height="210" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="155" y="162" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">Parent RDD A</text>

  <rect x="80" y="180" width="150" height="45" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="155" y="207" font-size="10" font-weight="600" fill="#CBD5E1" text-anchor="middle">Partition A-0</text>

  <rect x="80" y="235" width="150" height="45" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="155" y="262" font-size="10" font-weight="600" fill="#CBD5E1" text-anchor="middle">Partition A-1</text>

  <rect x="80" y="290" width="150" height="45" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="155" y="317" font-size="10" font-weight="600" fill="#CBD5E1" text-anchor="middle">Partition A-2</text>

  <!-- Child RDD B -->
  <rect x="325" y="140" width="180" height="210" rx="6" fill="#0F172A" stroke="#34D399" stroke-width="1.5"/>
  <text x="415" y="162" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">Child RDD B (map / filter)</text>

  <rect x="340" y="180" width="150" height="45" rx="4" fill="#1E293B" stroke="#34D399" stroke-width="1"/>
  <text x="415" y="207" font-size="10" font-weight="600" fill="#34D399" text-anchor="middle">Partition B-0</text>

  <rect x="340" y="235" width="150" height="45" rx="4" fill="#1E293B" stroke="#34D399" stroke-width="1"/>
  <text x="415" y="262" font-size="10" font-weight="600" fill="#34D399" text-anchor="middle">Partition B-1</text>

  <rect x="340" y="290" width="150" height="45" rx="4" fill="#1E293B" stroke="#34D399" stroke-width="1"/>
  <text x="415" y="317" font-size="10" font-weight="600" fill="#34D399" text-anchor="middle">Partition B-2</text>

  <!-- 1:1 Parallel Connectors -->
  <line x1="230" y1="202" x2="340" y2="202" stroke="#34D399" stroke-width="2" marker-end="url(#arr-g)"/>
  <line x1="230" y1="257" x2="340" y2="257" stroke="#34D399" stroke-width="2" marker-end="url(#arr-g)"/>
  <line x1="230" y1="312" x2="340" y2="312" stroke="#34D399" stroke-width="2" marker-end="url(#arr-g)"/>

  <text x="285" y="380" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">1 Parent Partition maps to at most 1 Child Partition</text>
  <text x="285" y="398" font-size="9" fill="#CBD5E1" text-anchor="middle">• Operations: <tspan font-family="monospace">map, filter, flatMap, union, mapPartitions</tspan></text>
  <text x="285" y="413" font-size="9" fill="#CBD5E1" text-anchor="middle">• Pipelined in CPU memory; zero disk or network transfer</text>
  <text x="285" y="428" font-size="9" font-weight="600" fill="#34D399" text-anchor="middle">Fault Tolerance: Lost child partition recomputed locally!</text>

  <!-- Right Panel: Wide Dependency -->
  <rect x="560" y="85" width="520" height="375" rx="8" fill="#450A0A" fill-opacity="0.2" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="560" y="85" width="520" height="36" rx="8" fill="#450A0A" fill-opacity="0.8" stroke="#EF4444" stroke-width="1.5"/>
  <text x="820" y="108" font-size="12" font-weight="700" fill="#F87171" text-anchor="middle">WIDE DEPENDENCY (FULL NETWORK CLUSTER SHUFFLE)</text>

  <!-- Parent RDD X -->
  <rect x="585" y="140" width="180" height="210" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="675" y="162" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">Parent RDD X</text>

  <rect x="600" y="180" width="150" height="45" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="675" y="207" font-size="10" font-weight="600" fill="#CBD5E1" text-anchor="middle">Partition X-0</text>

  <rect x="600" y="235" width="150" height="45" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="675" y="262" font-size="10" font-weight="600" fill="#CBD5E1" text-anchor="middle">Partition X-1</text>

  <rect x="600" y="290" width="150" height="45" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="675" y="317" font-size="10" font-weight="600" fill="#CBD5E1" text-anchor="middle">Partition X-2</text>

  <!-- Child RDD Y -->
  <rect x="880" y="140" width="180" height="210" rx="6" fill="#0F172A" stroke="#EF4444" stroke-width="1.5"/>
  <text x="970" y="162" font-size="11" font-weight="700" fill="#F87171" text-anchor="middle">Child RDD Y (groupBy)</text>

  <rect x="895" y="180" width="150" height="45" rx="4" fill="#1E293B" stroke="#EF4444" stroke-width="1"/>
  <text x="970" y="207" font-size="10" font-weight="600" fill="#FCA5A5" text-anchor="middle">Reducer Y-0</text>

  <rect x="895" y="235" width="150" height="45" rx="4" fill="#1E293B" stroke="#EF4444" stroke-width="1"/>
  <text x="970" y="262" font-size="10" font-weight="600" fill="#FCA5A5" text-anchor="middle">Reducer Y-1</text>

  <rect x="895" y="290" width="150" height="45" rx="4" fill="#1E293B" stroke="#EF4444" stroke-width="1"/>
  <text x="970" y="317" font-size="10" font-weight="600" fill="#FCA5A5" text-anchor="middle">Reducer Y-2</text>

  <!-- All-to-All Cross Network Connectors -->
  <path d="M 750 202 L 895 202" fill="none" stroke="#F87171" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <path d="M 750 202 L 895 257" fill="none" stroke="#F87171" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <path d="M 750 202 L 895 312" fill="none" stroke="#F87171" stroke-width="1.5" marker-end="url(#arr-r)"/>

  <path d="M 750 257 L 895 202" fill="none" stroke="#F87171" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <path d="M 750 257 L 895 257" fill="none" stroke="#F87171" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <path d="M 750 257 L 895 312" fill="none" stroke="#F87171" stroke-width="1.5" marker-end="url(#arr-r)"/>

  <text x="820" y="380" font-size="10" font-weight="700" fill="#F87171" text-anchor="middle">Multiple Child Partitions depend on data from each Parent Partition</text>
  <text x="820" y="398" font-size="9" fill="#CBD5E1" text-anchor="middle">• Operations: <tspan font-family="monospace">groupByKey, reduceByKey, join, distinct, repartition</tspan></text>
  <text x="820" y="413" font-size="9" fill="#CBD5E1" text-anchor="middle">• Forces Shuffle Write (disk spill) &amp; all-to-all network exchange</text>
  <text x="820" y="428" font-size="9" font-weight="600" fill="#EF4444" text-anchor="middle">Fault Tolerance: Failure requires re-running entire parent stage!</text>

  <!-- Bottom Invariant -->
  <rect x="40" y="468" width="1040" height="24" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="560" y="484" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Dependency Invariant: Narrow dependencies allow full execution pipelining within a single stage; Wide dependencies create execution barriers that require cluster-wide network shuffles.</text>
</svg>