<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1120" height="520" rx="10" fill="url(#bg)"/>
  <rect width="1120" height="520" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="560" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">Adaptive Query Execution: Dynamic Skew Join Splitting</text>
  <text x="560" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">How AQE automatically detects 80/20 partition skew and splits skewed partitions into parallel sub-tasks</text>

  <!-- Left Panel: Without AQE -->
  <rect x="40" y="85" width="460" height="385" rx="8" fill="#450A0A" fill-opacity="0.2" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="40" y="85" width="460" height="36" rx="8" fill="#450A0A" fill-opacity="0.8" stroke="#EF4444" stroke-width="1.5"/>
  <text x="270" y="108" font-size="12" font-weight="700" fill="#F87171" text-anchor="middle">WITHOUT AQE: SINGLE REDUCER OVERLOADED (STRAGGLER)</text>

  <!-- Skewed Key Input -->
  <rect x="60" y="135" width="420" height="85" rx="6" fill="#0F172A" stroke="#EF4444" stroke-width="1.5"/>
  <text x="75" y="157" font-size="11" font-weight="700" fill="#F87171" text-anchor="start">Skewed Input: Key = NULL / Hot Customer</text>
  <text x="75" y="177" font-size="10" font-family="monospace" fill="#FCA5A5" text-anchor="start">Partition 42: 50,000,000 Rows (12 GB)</text>
  <text x="75" y="194" font-size="9.5" fill="#CBD5E1" text-anchor="start">All other 199 partitions have only 10,000 rows each!</text>
  <text x="75" y="209" font-size="9.5" fill="#EF4444" text-anchor="start">Severe 80/20 data skew distribution.</text>

  <!-- Straggler Execution -->
  <rect x="60" y="240" width="420" height="215" rx="6" fill="#0F172A" stroke="#EF4444" stroke-width="1.5"/>
  <text x="75" y="262" font-size="11" font-weight="700" fill="#F87171" text-anchor="start">Worker Execution Bottleneck</text>

  <!-- Worker 1 Normal -->
  <rect x="75" y="280" width="390" height="42" rx="4" fill="#064E3B" fill-opacity="0.3" stroke="#34D399" stroke-width="1"/>
  <text x="90" y="298" font-size="10" font-weight="700" fill="#34D399" text-anchor="start">Workers 1..199 (Normal Partitions)</text>
  <text x="90" y="312" font-size="9" fill="#A7F3D0" text-anchor="start">Duration: 1.5 seconds -&gt; ALL COMPLETED AND IDLE!</text>

  <!-- Worker 200 Straggler -->
  <rect x="75" y="335" width="390" height="80" rx="4" fill="#450A0A" fill-opacity="0.4" stroke="#EF4444" stroke-width="2"/>
  <text x="90" y="355" font-size="10" font-weight="700" fill="#EF4444" text-anchor="start">Worker 200 (The Straggler on Partition 42)</text>
  <text x="90" y="372" font-size="9.5" fill="#FCA5A5" text-anchor="start">• Memory exhausted -&gt; Spills 8GB to NVMe disk</text>
  <text x="90" y="388" font-size="9.5" fill="#FCA5A5" text-anchor="start">• Continuous GC thrashing (Stop-the-World pauses)</text>
  <text x="90" y="405" font-size="9.5" font-weight="700" fill="#F87171" text-anchor="start">Duration: 3 HOURS 45 MINUTES (Blocks entire pipeline!)</text>

  <line x1="270" y1="220" x2="270" y2="240" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arr-r)"/>

  <!-- Right Panel: With AQE -->
  <rect x="530" y="85" width="550" height="385" rx="8" fill="#064E3B" fill-opacity="0.2" stroke="#34D399" stroke-width="1.5"/>
  <rect x="530" y="85" width="550" height="36" rx="8" fill="#064E3B" fill-opacity="0.8" stroke="#34D399" stroke-width="1.5"/>
  <text x="805" y="108" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle">WITH AQE: DYNAMIC SKEW PARTITION SPLITTING</text>

  <!-- Runtime Inspection -->
  <rect x="550" y="135" width="510" height="75" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="565" y="157" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="start">AQE Runtime Detection (spark.sql.adaptive.skewJoin.enabled)</text>
  <text x="565" y="175" font-size="9.5" fill="#CBD5E1" text-anchor="start">• Threshold: Partition 42 &gt; 5x median AND &gt; 256MB</text>
  <text x="565" y="190" font-size="9.5" font-weight="600" fill="#34D399" text-anchor="start">AQE dynamically splits Partition 42 into five 10M chunks!</text>

  <!-- Dynamic Split Containers -->
  <rect x="550" y="225" width="510" height="230" rx="6" fill="#0F172A" stroke="#34D399" stroke-width="1.5"/>
  <text x="565" y="247" font-size="11" font-weight="700" fill="#34D399" text-anchor="start">Parallel Sub-Task Execution across 5 Workers</text>

  <!-- Split 1 -->
  <rect x="565" y="260" width="235" height="42" rx="4" fill="#1E293B" stroke="#34D399" stroke-width="1"/>
  <text x="575" y="278" font-size="9.5" font-weight="700" fill="#34D399" text-anchor="start">Chunk 42-0 (10M Rows)</text>
  <text x="575" y="293" font-size="8.5" fill="#CBD5E1" text-anchor="start">Runs on Worker A: 12 seconds</text>

  <!-- Split 2 -->
  <rect x="815" y="260" width="230" height="42" rx="4" fill="#1E293B" stroke="#34D399" stroke-width="1"/>
  <text x="825" y="278" font-size="9.5" font-weight="700" fill="#34D399" text-anchor="start">Chunk 42-1 (10M Rows)</text>
  <text x="825" y="293" font-size="8.5" fill="#CBD5E1" text-anchor="start">Runs on Worker B: 12 seconds</text>

  <!-- Split 3 -->
  <rect x="565" y="310" width="235" height="42" rx="4" fill="#1E293B" stroke="#34D399" stroke-width="1"/>
  <text x="575" y="328" font-size="9.5" font-weight="700" fill="#34D399" text-anchor="start">Chunk 42-2 (10M Rows)</text>
  <text x="575" y="343" font-size="8.5" fill="#CBD5E1" text-anchor="start">Runs on Worker C: 12 seconds</text>

  <!-- Split 4 -->
  <rect x="815" y="310" width="230" height="42" rx="4" fill="#1E293B" stroke="#34D399" stroke-width="1"/>
  <text x="825" y="328" font-size="9.5" font-weight="700" fill="#34D399" text-anchor="start">Chunk 42-3 (10M Rows)</text>
  <text x="825" y="343" font-size="8.5" fill="#CBD5E1" text-anchor="start">Runs on Worker D: 12 seconds</text>

  <!-- Split 5 -->
  <rect x="690" y="360" width="230" height="42" rx="4" fill="#1E293B" stroke="#34D399" stroke-width="1"/>
  <text x="700" y="378" font-size="9.5" font-weight="700" fill="#34D399" text-anchor="start">Chunk 42-4 (10M Rows)</text>
  <text x="700" y="393" font-size="8.5" fill="#CBD5E1" text-anchor="start">Runs on Worker E: 12 seconds</text>

  <text x="805" y="425" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">Result: Straggler runtime collapsed from 3h 45m down to 14 SECONDS!</text>
  <text x="805" y="442" font-size="9" fill="#CBD5E1" text-anchor="middle">Corresponding other side partition is read by all 5 workers without extra shuffle.</text>

  <line x1="805" y1="210" x2="805" y2="225" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- Bottom Invariant -->
  <rect x="40" y="480" width="1040" height="26" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="560" y="497" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">AQE Skew Invariant: AQE inspects shuffle stage statistics at runtime and splits partitions exceeding skew thresholds into smaller parallel tasks, eliminating the single-straggler bottleneck.</text>
</svg>