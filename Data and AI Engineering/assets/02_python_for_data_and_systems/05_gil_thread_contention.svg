<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1080" height="420" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">The Global Interpreter Lock (GIL): CPU-Bound Contention vs. I/O Release</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Why multi-threaded CPU code runs slower on multi-core hardware, and how I/O operations achieve true concurrency</text>

  <!-- Left: CPU-Bound Contention (w=480, x=35, y=95) -->
  <g transform="translate(35, 95)">
    <rect width="480" height="295" rx="8" fill="#2A0B0B" stroke="#EF4444" stroke-width="2"/>
    <text x="240" y="26" font-size="13" font-weight="700" fill="#FCA5A5" text-anchor="middle">CPU-Bound Contention: Serialized across 4 Cores</text>

    <!-- Central GIL Lock Graphic -->
    <rect x="140" y="45" width="200" height="35" rx="5" fill="#4C0505" stroke="#EF4444" stroke-width="1.5"/>
    <text x="240" y="67" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">🔒 CPython GIL (1 Mutex Lock)</text>

    <!-- 4 Hardware Cores -->
    <g transform="translate(25, 95)">
      <!-- Core 1 (Active) -->
      <rect x="0" y="0" width="95" height="55" rx="4" fill="#064E3B" stroke="#10B981"/>
      <text x="47" y="22" font-size="10" font-weight="700" fill="#6EE7B7" text-anchor="middle">Core 1: RUNNING</text>
      <text x="47" y="38" font-size="9" fill="#A7F3D0" text-anchor="middle">Holds GIL</text>
      <path d="M 47 0 L 150 -15" fill="none" stroke="#10B981" stroke-width="1.5"/>

      <!-- Core 2 (Blocked) -->
      <rect x="110" y="0" width="95" height="55" rx="4" fill="#1C2541" stroke="#64748B"/>
      <text x="157" y="22" font-size="10" font-weight="700" fill="#CBD5E1" text-anchor="middle">Core 2: IDLE</text>
      <text x="157" y="38" font-size="9" fill="#94A3B8" text-anchor="middle">Spinning on GIL</text>

      <!-- Core 3 (Blocked) -->
      <rect x="220" y="0" width="95" height="55" rx="4" fill="#1C2541" stroke="#64748B"/>
      <text x="267" y="22" font-size="10" font-weight="700" fill="#CBD5E1" text-anchor="middle">Core 3: IDLE</text>
      <text x="267" y="38" font-size="9" fill="#94A3B8" text-anchor="middle">Spinning on GIL</text>

      <!-- Core 4 (Blocked) -->
      <rect x="330" y="0" width="95" height="55" rx="4" fill="#1C2541" stroke="#64748B"/>
      <text x="377" y="22" font-size="10" font-weight="700" fill="#CBD5E1" text-anchor="middle">Core 4: IDLE</text>
      <text x="377" y="38" font-size="9" fill="#94A3B8" text-anchor="middle">Spinning on GIL</text>
    </g>

    <text x="25" y="180" font-size="11" fill="#FCA5A5" text-anchor="start">• Only ONE thread holds the GIL to execute bytecode opcodes.</text>
    <text x="25" y="200" font-size="11" fill="#FCA5A5" text-anchor="start">• OS preempts thread every 5ms (sys.getswitchinterval()).</text>
    <text x="25" y="220" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start">⚠️ Convoy Effect: Context switching overhead makes multi-threaded</text>
    <text x="25" y="238" font-size="11" font-weight="700" fill="#EF4444" text-anchor="start">   CPU code SLOWER than a single thread on multi-core servers!</text>
    <text x="25" y="265" font-size="11" fill="#6EE7B7" font-weight="600" text-anchor="start">✓ Fix: Use multiprocessing / ProcessPoolExecutor</text>
  </g>

  <!-- Right: I/O-Bound Concurrency (w=510, x=535, y=95) -->
  <g transform="translate(535, 95)">
    <rect width="510" height="295" rx="8" fill="#062828" stroke="#10B981" stroke-width="2"/>
    <text x="255" y="26" font-size="13" font-weight="700" fill="#6EE7B7" text-anchor="middle">✓ I/O-Bound Concurrency: GIL Released During Syscalls</text>

    <!-- Visual Concurrent Execution -->
    <rect x="25" y="45" width="460" height="110" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
    <text x="35" y="68" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start">Thread 1: socket.recv() (Database Query)</text>
    <rect x="300" y="55" width="170" height="18" rx="3" fill="#1E293B" stroke="#10B981"/>
    <text x="385" y="68" font-size="9" fill="#A7F3D0" font-weight="700" text-anchor="middle">✓ GIL Released to OS</text>

    <text x="35" y="100" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start">Thread 2: open().read() (Disk File Read)</text>
    <rect x="300" y="87" width="170" height="18" rx="3" fill="#1E293B" stroke="#10B981"/>
    <text x="385" y="100" font-size="9" fill="#A7F3D0" font-weight="700" text-anchor="middle">✓ GIL Released to OS</text>

    <text x="35" y="132" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start">Thread 3: requests.get() (Web API Fetch)</text>
    <rect x="300" y="119" width="170" height="18" rx="3" fill="#1E293B" stroke="#10B981"/>
    <text x="385" y="132" font-size="9" fill="#A7F3D0" font-weight="700" text-anchor="middle">✓ GIL Released to OS</text>

    <text x="25" y="180" font-size="11" fill="#A7F3D0" text-anchor="start">• When threads make blocking OS syscalls (socket, file, sleep),</text>
    <text x="25" y="198" font-size="11" fill="#A7F3D0" text-anchor="start">  CPython explicitly DROPS the GIL before calling C library.</text>
    <text x="25" y="218" font-size="11" fill="#6EE7B7" font-weight="600" text-anchor="start">✓ True Concurrent Execution: All threads wait on hardware in parallel!</text>
    <text x="25" y="238" font-size="11" fill="#A7F3D0" text-anchor="start">• Thread re-acquires GIL only when data arrives to parse response.</text>
    <text x="25" y="265" font-size="11" fill="#FDE68A" font-weight="600" text-anchor="start">Ideal for: ThreadPoolExecutor &amp; Asyncio networking</text>
  </g>
</svg>