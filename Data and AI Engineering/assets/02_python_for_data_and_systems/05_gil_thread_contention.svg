<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="420" viewBox="0 0 1180 420">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1180" height="420" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">The Global Interpreter Lock (GIL): CPU vs I/O Bound Concurrency</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">CPython execution thread contention: Preemptive bytecode serialization vs Cooperative kernel syscall releases</text>

  <!-- Left: CPU-Bound Contention (w=475, x=35..510, y=95) -->
  <g transform="translate(35, 95)">
    <rect width="475" height="300" rx="8" fill="#2E1C05" stroke="#EF4444" stroke-width="2"/>
    <text x="237.5" y="26" font-size="13" font-weight="700" fill="#FCA5A5" text-anchor="middle">⚠️ CPU-Bound Workload: Severe GIL Contention</text>

    <!-- Visual CPU Pipeline -->
    <rect x="25" y="45" width="425" height="110" rx="6" fill="#451A03" stroke="#EF4444" stroke-width="1.2"/>
    <text x="35" y="68" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start">Single Core Serialization (Bytecode Execution)</text>

    <g transform="translate(35, 80)">
      <!-- Thread 1 holding GIL -->
      <rect x="0" y="0" width="115" height="45" rx="4" fill="#0B132B" stroke="#3B82F6"/>
      <text x="57" y="18" font-size="10" font-weight="700" fill="#93C5FD" text-anchor="middle">Thread 1</text>
      <text x="57" y="33" font-size="9" fill="#10B981" font-weight="700" text-anchor="middle">● Holds GIL (5ms)</text>

      <!-- Thread 2 blocked -->
      <rect x="135" y="0" width="115" height="45" rx="4" fill="#1C1917" stroke="#EF4444"/>
      <text x="192" y="18" font-size="10" font-weight="700" fill="#FCA5A5" text-anchor="middle">Thread 2</text>
      <text x="192" y="33" font-size="9" fill="#EF4444" font-weight="700" text-anchor="middle">✕ Blocked on Mutex</text>

      <!-- Thread 3 blocked -->
      <rect x="270" y="0" width="115" height="45" rx="4" fill="#1C1917" stroke="#EF4444"/>
      <text x="327" y="18" font-size="10" font-weight="700" fill="#FCA5A5" text-anchor="middle">Thread 3</text>
      <text x="327" y="33" font-size="9" fill="#EF4444" font-weight="700" text-anchor="middle">✕ Blocked on Mutex</text>
    </g>

    <text x="25" y="180" font-size="11" fill="#FCA5A5" text-anchor="start">• Only ONE thread holds the GIL to execute bytecode opcodes.</text>
    <text x="25" y="200" font-size="11" fill="#FCA5A5" text-anchor="start">• OS preempts thread every 5ms (sys.getswitchinterval()).</text>
    <text x="25" y="220" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start">⚠️ Convoy Effect: Context switching overhead makes multi-threaded</text>
    <text x="25" y="238" font-size="11" font-weight="700" fill="#EF4444" text-anchor="start">   CPU code SLOWER than a single thread on multi-core servers!</text>
    <text x="25" y="265" font-size="11" fill="#6EE7B7" font-weight="600" text-anchor="start">✓ Fix: Use multiprocessing / ProcessPoolExecutor</text>
  </g>

  <!-- Right: I/O-Bound Concurrency (w=520, x=600..1120, y=95) -->
  <g transform="translate(600, 95)">
    <rect width="520" height="300" rx="8" fill="#062828" stroke="#10B981" stroke-width="2"/>
    <text x="260" y="26" font-size="13" font-weight="700" fill="#6EE7B7" text-anchor="middle">✓ I/O-Bound Concurrency: GIL Released During Syscalls</text>

    <!-- Visual Concurrent Execution -->
    <rect x="25" y="45" width="470" height="110" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
    <text x="35" y="68" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start">Thread 1: socket.recv() (Database Query)</text>
    <rect x="310" y="55" width="170" height="18" rx="3" fill="#1E293B" stroke="#10B981"/>
    <text x="395" y="68" font-size="9" fill="#A7F3D0" font-weight="700" text-anchor="middle">✓ GIL Released to OS</text>

    <text x="35" y="100" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start">Thread 2: open().read() (Disk File Read)</text>
    <rect x="310" y="87" width="170" height="18" rx="3" fill="#1E293B" stroke="#10B981"/>
    <text x="395" y="100" font-size="9" fill="#A7F3D0" font-weight="700" text-anchor="middle">✓ GIL Released to OS</text>

    <text x="35" y="132" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start">Thread 3: requests.get() (Web API Fetch)</text>
    <rect x="310" y="119" width="170" height="18" rx="3" fill="#1E293B" stroke="#10B981"/>
    <text x="395" y="132" font-size="9" fill="#A7F3D0" font-weight="700" text-anchor="middle">✓ GIL Released to OS</text>

    <text x="25" y="180" font-size="11" fill="#A7F3D0" text-anchor="start">• When threads make blocking OS syscalls (socket, file, sleep),</text>
    <text x="25" y="198" font-size="11" fill="#A7F3D0" text-anchor="start">  CPython explicitly DROPS the GIL before calling C library.</text>
    <text x="25" y="218" font-size="11" fill="#6EE7B7" font-weight="600" text-anchor="start">✓ True Concurrent Execution: All threads wait on hardware in parallel!</text>
    <text x="25" y="238" font-size="11" fill="#A7F3D0" text-anchor="start">• Thread re-acquires GIL only when data arrives to parse response.</text>
    <text x="25" y="265" font-size="11" fill="#FDE68A" font-weight="600" text-anchor="start">Ideal for: ThreadPoolExecutor &amp; Asyncio networking</text>
  </g>

  <!-- Connectors Layer -->
  <g id="connectors">
    <!-- Centered VS pill in 90px runway gap -->
    <path d="M 510 245 L 599 245" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr-a)"/>
    <rect x="534" y="233" width="41" height="24" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="554.5" y="249.5" font-size="10" font-weight="700" fill="#FDE68A" text-anchor="middle">VS</text>
  </g>
</svg>