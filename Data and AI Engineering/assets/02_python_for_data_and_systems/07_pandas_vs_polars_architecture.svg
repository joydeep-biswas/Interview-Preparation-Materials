<svg xmlns="http://www.w3.org/2000/svg" width="1245" height="440" viewBox="0 0 1245 440">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1245" height="440" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Architectural Comparison: Pandas (NumPy Core) vs Polars (Rust Arrow Core)</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">In-memory data representation, execution semantics, parallelism, and memory efficiency</text>

  <!-- Left: Pandas (w=520, x=35..555, y=95) -->
  <g transform="translate(35, 95)">
    <rect width="520" height="315" rx="8" fill="#2A0B0B" stroke="#EF4444" stroke-width="2"/>
    <text x="260" y="26" font-size="13" font-weight="700" fill="#FCA5A5" text-anchor="middle">Pandas (Legacy Python / NumPy Engine)</text>

    <!-- Memory Layout -->
    <rect x="20" y="42" width="480" height="85" rx="6" fill="#4C0505" stroke="#EF4444" stroke-width="1.2"/>
    <text x="260" y="64" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Memory Layout: Array of PyObject Pointers</text>
    <rect x="35" y="74" width="450" height="24" rx="4" fill="#0F172A" stroke="#EF4444"/>
    <text x="260" y="90" font-size="10" fill="#FCA5A5" class="code" text-anchor="middle">[ ptr* ] → PyLongObject (28B), [ ptr* ] → PyUnicode (50B)</text>
    <text x="260" y="112" font-size="9" fill="#94A3B8" text-anchor="middle">High heap overhead; pointer indirection wrecks CPU cache locality</text>

    <!-- Architectural Traits -->
    <text x="25" y="152" font-size="11" fill="#FCA5A5" text-anchor="start">• Execution Model: Strictly EAGER evaluation</text>
    <text x="35" y="168" font-size="10" fill="#94A3B8" text-anchor="start">  Every operation materializes full intermediate DataFrame in RAM</text>

    <text x="25" y="190" font-size="11" fill="#FCA5A5" text-anchor="start">• Threading &amp; Scaling: SINGLE-THREADED (GIL Constrained)</text>
    <text x="35" y="206" font-size="10" fill="#94A3B8" text-anchor="start">  Locked to 1 CPU core; cannot utilize multi-core server processors</text>

    <text x="25" y="228" font-size="11" fill="#FCA5A5" text-anchor="start">• NULL Representation: IEEE 754 NaN (Float cast)</text>
    <text x="35" y="244" font-size="10" fill="#94A3B8" text-anchor="start">  Integer columns with nulls silently coerced to float64</text>

    <rect x="20" y="265" width="480" height="35" rx="4" fill="#0F172A" stroke="#EF4444"/>
    <text x="260" y="287" font-size="11" font-weight="700" fill="#FCA5A5" text-anchor="middle">Memory Footprint: 5x - 10x raw file size on disk</text>
  </g>

  <!-- Right: Polars (w=520, x=640..1160, y=95) -->
  <g transform="translate(640, 95)">
    <rect width="520" height="315" rx="8" fill="#062828" stroke="#10B981" stroke-width="2"/>
    <text x="260" y="26" font-size="13" font-weight="700" fill="#6EE7B7" text-anchor="middle">Polars (Modern Rust / Apache Arrow Engine)</text>

    <!-- Memory Layout -->
    <rect x="20" y="42" width="480" height="85" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
    <text x="260" y="64" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Memory Layout: Contiguous Apache Arrow Column Arrays</text>
    <rect x="35" y="74" width="450" height="24" rx="4" fill="#0F172A" stroke="#10B981"/>
    <text x="260" y="90" font-size="10" fill="#6EE7B7" class="code" text-anchor="middle">[ "AliceBobCharlie..." ] + Offsets [0, 5, 8, 15] + Bitmask</text>
    <text x="260" y="112" font-size="9" fill="#A7F3D0" text-anchor="middle">Zero pointer overhead; contiguous cache-line SIMD vectorization</text>

    <!-- Architectural Traits -->
    <text x="25" y="152" font-size="11" fill="#6EE7B7" text-anchor="start">• Execution Model: LAZY evaluation with Query Optimizer</text>
    <text x="35" y="168" font-size="10" fill="#A7F3D0" text-anchor="start">  Predicate pushdown, projection pushdown, common subplan pruning</text>

    <text x="25" y="190" font-size="11" fill="#6EE7B7" text-anchor="start">• Threading &amp; Scaling: MULTI-THREADED (Rayon work-stealing)</text>
    <text x="35" y="206" font-size="10" fill="#A7F3D0" text-anchor="start">  Executes in native Rust off-heap; 100% bypasses Python GIL</text>

    <text x="25" y="228" font-size="11" fill="#6EE7B7" text-anchor="start">• NULL Representation: Native validity bitmask</text>
    <text x="35" y="244" font-size="10" fill="#A7F3D0" text-anchor="start">  Separate bit array tracks nulls; preserves exact integer data types</text>

    <rect x="20" y="265" width="480" height="35" rx="4" fill="#0F172A" stroke="#10B981"/>
    <text x="260" y="287" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">Speed &amp; Memory: 10x - 30x faster; 1x file size footprint</text>
  </g>

  <!-- Central Bridge Connector -->
  <g id="connectors">
    <path d="M 555 252 L 639 252" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>
    <rect x="577" y="240" width="41" height="24" rx="4" fill="#1E293B" stroke="#10B981" stroke-width="1.2"/>
    <text x="597.5" y="256.5" font-size="10" font-weight="700" fill="#6EE7B7" text-anchor="middle">VS</text>
  </g>
</svg>