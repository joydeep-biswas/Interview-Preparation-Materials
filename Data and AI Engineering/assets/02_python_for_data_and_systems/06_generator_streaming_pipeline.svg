<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="380" viewBox="0 0 1140 380">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6" />
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981" />
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B" />
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6" />
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444" />
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06B6D4" />
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B" />
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1140" height="380" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5" />
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Generators &amp; Streaming Iterators: Processing 50GB Files in 15MB RAM</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Eager full-file allocation (OOM crash) vs. Lazy generator pipeline (O(1) memory bound)</text>

  <!-- Top: The Eager Anti-Pattern (w=1070, x=35, y=95) -->
  <g transform="translate(35, 95)">
    <rect width="1070" height="80" rx="8" fill="#2A0B0B" stroke="#EF4444" stroke-width="2" />
    <text x="535" y="24" font-size="12" font-weight="700" fill="#FCA5A5" text-anchor="middle">❌ Eager Loading Anti-Pattern: lines = file.readlines()</text>

    <text x="30" y="48" font-size="11" fill="#FFFFFF" text-anchor="start">50 GB Raw File on Disk  ---[ Reads entire file into Python list ]---&gt;</text>
    <rect x="470" y="34" width="220" height="24" rx="4" fill="#4C0505" stroke="#EF4444" />
    <text x="580" y="50" font-size="11" font-weight="700" fill="#FCA5A5" text-anchor="middle">Memory: 50+ GB Heap Allocation!</text>
    <text x="710" y="50" font-size="12" font-weight="700" fill="#EF4444" text-anchor="start">💥 Fatal Out-Of-Memory (OOM) Crash!</text>
  </g>

  <!-- Bottom: The Production Generator Pipeline (w=1070, x=35, y=190) -->
  <g transform="translate(35, 190)">
    <rect width="1070" height="165" rx="8" fill="#062828" stroke="#10B981" stroke-width="2" />
    <text x="535" y="24" font-size="13" font-weight="700" fill="#6EE7B7" text-anchor="middle">✓ Production Pattern: Chained Lazy Generators via yield (Peak Memory = 15 MB)</text>

    <!-- Stage 1 -->
    <rect x="25" y="42" width="220" height="118" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.2" />
    <text x="135" y="64" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1. stream_lines(path)</text>
    <text x="35" y="84" font-size="10" fill="#A7F3D0" text-anchor="start">• Reads file line by line</text>
    <text x="35" y="100" font-size="10" fill="#6EE7B7" font-weight="600" text-anchor="start">Buffer: 4 KB OS page</text>

    <!-- Arrow 1 to 2 -->
    <path d="M 245 80 L 283 80" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)" />

    <!-- Stage 2 -->
    <rect x="290" y="42" width="230" height="75" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.2" />
    <text x="405" y="64" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2. parse_json(lines)</text>
    <text x="300" y="84" font-size="10" fill="#A7F3D0" text-anchor="start">• Deserializes 1 line at a time</text>
    <text x="300" y="100" font-size="10" fill="#6EE7B7" font-weight="600" text-anchor="start">RAM: 8 KB Dict in memory</text>

    <!-- Arrow 2 to 3 -->
    <path d="M 520 80 L 558 80" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)" />

    <!-- Stage 3 -->
    <rect x="565" y="42" width="230" height="75" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.2" />
    <text x="680" y="64" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3. filter_anomalies(records)</text>
    <text x="575" y="84" font-size="10" fill="#A7F3D0" text-anchor="start">• Drops malformed records</text>
    <text x="575" y="100" font-size="10" fill="#6EE7B7" font-weight="600" text-anchor="start">RAM: 0 KB additional overhead</text>

    <!-- Arrow 3 to 4 -->
    <path d="M 795 80 L 833 80" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)" />

    <!-- Stage 4: Sink -->
    <rect x="840" y="42" width="205" height="75" rx="6" fill="#064E3B" stroke="#3B82F6" stroke-width="1.2" />
    <text x="942" y="64" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4. Micro-Batch Sink</text>
    <text x="850" y="84" font-size="10" fill="#93C5FD" text-anchor="start">• Batches 5,000 tuples</text>
    <text x="850" y="100" font-size="10" fill="#60A5FA" font-weight="600" text-anchor="start">Flushes to PostgreSQL/Parquet</text>

    <text x="35" y="142" font-size="11" fill="#6EE7B7" font-weight="600" text-anchor="start">✓ Constant O(1) Memory Footprint: Each tuple flows completely through pipeline before next line is read from disk!</text>
  </g>
</svg>