<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="420" viewBox="0 0 1140 420">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6" />
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981" />
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B" />
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6" />
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444" />
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06B6D4" />
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B" />
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1140" height="420" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5" />
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">PyMalloc Memory Allocator: Arenas, Pools, and Blocks Hierarchy</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Small-object allocation (&lt;= 512B) vs. OS System Heap: Minimizing heap fragmentation and malloc() syscall overhead</text>

  <!-- Step 1: Arena (w=320, x=35, y=95) -->
  <g transform="translate(35, 95)">
    <rect width="320" height="295" rx="8" fill="#0B132B" stroke="#3B82F6" stroke-width="2" />
    <text x="160" y="26" font-size="13" font-weight="700" fill="#93C5FD" text-anchor="middle">Level 1: Arena (256 KB)</text>

    <rect x="15" y="45" width="290" height="121" rx="6" fill="#1C2541" stroke="#3B82F6" stroke-width="1.2" />
    <text x="160" y="70" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Allocated via mmap() / malloc()</text>
    <text x="25" y="92" font-size="10" fill="#94A3B8" text-anchor="start">• Large contiguous virtual memory chunk</text>
    <text x="25" y="106" font-size="10" fill="#94A3B8" text-anchor="start">• Aligned on 256KB memory boundary</text>

    <text x="25" y="148" font-size="11" fill="#93C5FD" font-weight="600" text-anchor="start">Structure &amp; Mechanics:</text>
    <text x="25" y="168" font-size="11" fill="#94A3B8" text-anchor="start">• Subdivided into 64 Pools (4KB each)</text>
    <text x="25" y="188" font-size="11" fill="#94A3B8" text-anchor="start">• Tracked via doubly-linked list</text>
    <text x="25" y="208" font-size="11" fill="#94A3B8" text-anchor="start">• Only released back to OS when ALL</text>
    <text x="25" y="224" font-size="11" fill="#94A3B8" text-anchor="start">  64 child pools become completely empty</text>
    <text x="25" y="250" font-size="10" fill="#FCA5A5" text-anchor="start">⚠️ Cause of memory bloat / RSS retention</text>
  </g>

  <!-- Arrow 1 to 2 (Runway gap: 355 to 415 = 60px) -->
  <!-- Step 2: Pool (w=320, x=415, y=95) -->
  <g transform="translate(415, 95)">
    <rect width="320" height="295" rx="8" fill="#2E1C05" stroke="#F59E0B" stroke-width="2" />
    <text x="160" y="26" font-size="13" font-weight="700" fill="#FDE68A" text-anchor="middle">Level 2: Pool (4 KB = 1 Page)</text>

    <rect x="15" y="45" width="290" height="121" rx="6" fill="#451A03" stroke="#F59E0B" stroke-width="1.2" />
    <text x="160" y="70" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Dedicated to 1 Specific Size-Class</text>
    <text x="25" y="92" font-size="10" fill="#FDE68A" text-anchor="start">• Matches OS Virtual Memory page size</text>
    <text x="25" y="106" font-size="10" fill="#FDE68A" text-anchor="start">• e.g. Pool A = 16B, Pool B = 32B, Pool C = 64B</text>

    <text x="25" y="148" font-size="11" fill="#FDE68A" font-weight="600" text-anchor="start">Structure &amp; Mechanics:</text>
    <text x="25" y="168" font-size="11" fill="#FDE68A" text-anchor="start">• Pool Header tracks free block pointers</text>
    <text x="25" y="188" font-size="11" fill="#FDE68A" text-anchor="start">• Free list enables instant O(1) allocation</text>
    <text x="25" y="208" font-size="11" fill="#FDE68A" text-anchor="start">• Pools are classified as: empty, used, full</text>
    <text x="25" y="232" font-size="10" fill="#A7F3D0" font-weight="600" text-anchor="start">✓ Eliminates external fragmentation</text>
  </g>

  <!-- Arrow 2 to 3 (Runway gap: 735 to 795 = 60px) -->
  <!-- Step 3: Blocks (w=310, x=795, y=95) -->
  <g transform="translate(795, 95)">
    <rect width="310" height="295" rx="8" fill="#062828" stroke="#10B981" stroke-width="2" />
    <text x="155" y="26" font-size="13" font-weight="700" fill="#6EE7B7" text-anchor="middle">Level 3: Blocks (8B to 512B)</text>

    <rect x="15" y="45" width="280" height="121" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.2" />
    <text x="155" y="70" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Actual PyObject Storage</text>
    <text x="25" y="92" font-size="10" fill="#A7F3D0" text-anchor="start">• Carved in exact multiples of 8 bytes</text>
    <text x="25" y="106" font-size="10" fill="#A7F3D0" text-anchor="start">• 64 Size classes: 8, 16, 24, 32... 512 bytes</text>

    <text x="25" y="148" font-size="11" fill="#6EE7B7" font-weight="600" text-anchor="start">Routing Decision Policy:</text>
    <text x="25" y="168" font-size="11" fill="#A7F3D0" text-anchor="start">• Size &lt;= 512B: PyMalloc block allocation</text>
    <text x="25" y="190" font-size="11" fill="#FCA5A5" font-weight="600" text-anchor="start">• Size &gt; 512B: Bypasses PyMalloc!</text>
    <text x="25" y="206" font-size="10" fill="#FCA5A5" text-anchor="start">  Routes directly to standard system malloc()</text>
    <text x="25" y="235" font-size="10" fill="#38BDF8" text-anchor="start">Examples: int (28B), float (24B), small str</text>
  </g>
<g id="connectors"><path d="M 355 210 L 408 210" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr-a)" />

  <path d="M 735 210 L 788 210" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)" />

  </g></svg>