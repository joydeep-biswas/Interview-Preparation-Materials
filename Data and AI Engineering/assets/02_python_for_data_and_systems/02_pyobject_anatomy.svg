<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="420" viewBox="0 0 1160 420">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1160" height="420" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">PyObject Anatomy: C Primitive vs CPython Integer</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Comparison of an 8-byte C int64_t in registers against a 28-byte CPython PyLongObject on heap</text>

  <!-- Left: C Primitive int64_t (w=445, x=35..480, y=95) -->
  <g transform="translate(35, 95)">
    <rect width="445" height="300" rx="8" fill="#0B132B" stroke="#3B82F6" stroke-width="2"/>
    <text x="222.5" y="26" font-size="13" font-weight="700" fill="#93C5FD" text-anchor="middle">C Primitive: int64_t x = 42 (8 Bytes Total)</text>

    <rect x="20" y="45" width="405" height="75" rx="6" fill="#1C2541" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="222.5" y="70" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Contiguous 64-Bit Register / Stack Value</text>
    <rect x="35" y="82" width="375" height="28" rx="4" fill="#0F172A" stroke="#3B82F6"/>
    <text x="222.5" y="100" font-size="11" fill="#93C5FD" class="code" text-anchor="middle">00000000 00000000 00000000 00101010  (8 Bytes)</text>

    <text x="25" y="145" font-size="11" fill="#A7F3D0" text-anchor="start">✓ Zero Header Overhead: Value sits directly in CPU register</text>
    <text x="25" y="165" font-size="11" fill="#A7F3D0" text-anchor="start">✓ Direct Hardware ALU computation: addq instruction in 1 cycle</text>
    <text x="25" y="185" font-size="11" fill="#A7F3D0" text-anchor="start">✓ Cache-line friendly: 8 integers fit in one 64-byte L1 CPU cache</text>
    <text x="25" y="205" font-size="11" fill="#94A3B8" text-anchor="start">• Fixed-width: Overflow wraps around at 2^63 - 1</text>
    <rect x="20" y="240" width="405" height="40" rx="4" fill="#0F172A" stroke="#10B981"/>
    <text x="222.5" y="264" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">Total Memory: Exactly 8 Bytes (Stack / Register)</text>
  </g>

  <!-- Right: CPython PyLongObject (w=540, x=565..1105, y=95) -->
  <g transform="translate(565, 95)">
    <rect width="540" height="300" rx="8" fill="#2E1C05" stroke="#F59E0B" stroke-width="2"/>
    <text x="270" y="26" font-size="13" font-weight="700" fill="#FDE68A" text-anchor="middle">CPython: x = 42 (PyLongObject, 28 Bytes Total)</text>

    <!-- 4 Sub-blocks with generous padding -->
    <g transform="translate(20, 42)">
      <!-- ob_refcnt -->
      <rect x="0" y="0" width="120" height="58" rx="4" fill="#1C2541" stroke="#3B82F6"/>
      <text x="60" y="18" font-size="10" font-weight="700" fill="#93C5FD" text-anchor="middle">ob_refcnt</text>
      <text x="60" y="33" font-size="9" fill="#94A3B8" text-anchor="middle">8 Bytes (int64)</text>
      <text x="60" y="47" font-size="8.5" fill="#60A5FA" text-anchor="middle">Ref Counter</text>

      <!-- ob_type -->
      <rect x="126" y="0" width="120" height="58" rx="4" fill="#1C2541" stroke="#8B5CF6"/>
      <text x="186" y="18" font-size="10" font-weight="700" fill="#DDD6FE" text-anchor="middle">ob_type</text>
      <text x="186" y="33" font-size="9" fill="#94A3B8" text-anchor="middle">8 Bytes (ptr*)</text>
      <text x="186" y="47" font-size="8.5" fill="#C4B5FD" text-anchor="middle">&amp;PyLong_Type</text>

      <!-- ob_size -->
      <rect x="252" y="0" width="120" height="58" rx="4" fill="#1C2541" stroke="#F59E0B"/>
      <text x="312" y="18" font-size="10" font-weight="700" fill="#FDE68A" text-anchor="middle">ob_size</text>
      <text x="312" y="33" font-size="9" fill="#94A3B8" text-anchor="middle">8 Bytes (ssize_t)</text>
      <text x="312" y="47" font-size="8.5" fill="#FDE68A" text-anchor="middle">Digit count: 1</text>

      <!-- ob_digit -->
      <rect x="378" y="0" width="120" height="58" rx="4" fill="#064E3B" stroke="#10B981"/>
      <text x="438" y="18" font-size="10" font-weight="700" fill="#A7F3D0" text-anchor="middle">ob_digit[0]</text>
      <text x="438" y="33" font-size="9" fill="#94A3B8" text-anchor="middle">4 Bytes (uint32)</text>
      <text x="438" y="47" font-size="8.5" fill="#6EE7B7" text-anchor="middle">Payload: 42</text>
    </g>

    <text x="25" y="130" font-size="11" font-weight="600" fill="#EF4444" text-anchor="start">⚠️ Header Overhead: 24 Bytes (85.7% of total memory footprint!)</text>
    <text x="25" y="150" font-size="11" fill="#FDE68A" text-anchor="start">• Requires pointer chasing: Reading value dereferences pointer</text>
    <text x="25" y="170" font-size="11" fill="#FDE68A" text-anchor="start">• Heap allocated in PyMalloc pool; poor CPU cache spatial locality</text>
    <text x="25" y="190" font-size="11" fill="#A7F3D0" text-anchor="start">✓ Arbitrary precision: Automatically scales to unlimited digits!</text>
    <text x="25" y="210" font-size="10" fill="#94A3B8" text-anchor="start">Padding: 4 bytes added for 8-byte C ABI alignment</text>

    <rect x="20" y="240" width="500" height="40" rx="4" fill="#0F172A" stroke="#EF4444"/>
    <text x="270" y="264" font-size="12" font-weight="700" fill="#FCA5A5" text-anchor="middle">Total Memory: 24B Header + 4B Digit = 28 Bytes</text>
  </g>

  <!-- Central Bridge Connector: Placed AFTER both cards with 85px runway and centered pill -->
  <g id="connectors">
    <path d="M 480 245 L 564 245" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr-a)"/>
    <rect x="502" y="233" width="41" height="24" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="522.5" y="249.5" font-size="10" font-weight="700" fill="#FDE68A" text-anchor="middle">VS</text>
  </g>
</svg>