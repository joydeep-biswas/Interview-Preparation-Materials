<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1080" height="420" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">The Cyclic Garbage Collector: Reference Cycles &amp; Generational Collection</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Why reference counting alone causes memory leaks on circular references, and how generational GC resolves them</text>

  <!-- Left: The Reference Cycle Trap (w=480, x=35, y=95) -->
  <g transform="translate(35, 95)">
    <rect width="480" height="295" rx="8" fill="#2A0B0B" stroke="#EF4444" stroke-width="2"/>
    <text x="240" y="26" font-size="13" font-weight="700" fill="#FCA5A5" text-anchor="middle">❌ The Reference Cycle Trap (Circular Dependency)</text>

    <!-- Visual Cycle Diagram -->
    <g transform="translate(40, 48)">
      <!-- Node A -->
      <rect x="0" y="0" width="160" height="60" rx="6" fill="#4C0505" stroke="#EF4444" stroke-width="1.5"/>
      <text x="80" y="24" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Object A</text>
      <text x="80" y="44" font-size="10" fill="#FCA5A5" text-anchor="middle">refcnt = 1 (from B)</text>

      <!-- Bi-directional arrows -->
      <path d="M 160 20 L 235 20" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#arr-r)"/>
      <path d="M 235 40 L 165 40" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#arr-r)"/>

      <!-- Node B -->
      <rect x="240" y="0" width="160" height="60" rx="6" fill="#4C0505" stroke="#EF4444" stroke-width="1.5"/>
      <text x="320" y="24" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Object B</text>
      <text x="320" y="44" font-size="10" fill="#FCA5A5" text-anchor="middle">refcnt = 1 (from A)</text>
    </g>

    <!-- Severed link -->
    <rect x="140" y="125" width="200" height="30" rx="4" fill="#0F172A" stroke="#EF4444"/>
    <text x="240" y="145" font-size="11" font-weight="700" fill="#FCA5A5" text-anchor="middle">del a, b (Variables dropped!)</text>

    <text x="25" y="180" font-size="11" fill="#FCA5A5" text-anchor="start">• Application stack pointers to A and B are removed.</text>
    <text x="25" y="198" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="start">⚠️ Yet both objects retain refcnt = 1 because they point to each other!</text>
    <text x="25" y="218" font-size="11" fill="#FCA5A5" text-anchor="start">• Neither object can ever reach refcnt == 0 through normal execution.</text>
    <text x="25" y="238" font-size="11" fill="#EF4444" font-weight="700" text-anchor="start">FATAL LEAK: Reference counting alone NEVER frees this memory!</text>
  </g>

  <!-- Right: Generational GC Solution (w=510, x=535, y=95) -->
  <g transform="translate(535, 95)">
    <rect width="510" height="295" rx="8" fill="#062828" stroke="#10B981" stroke-width="2"/>
    <text x="255" y="26" font-size="13" font-weight="700" fill="#6EE7B7" text-anchor="middle">✓ The Cyclic GC Solution: Generational Tri-Color Collection</text>

    <!-- 3 Generation Cards -->
    <!-- Gen 0 -->
    <rect x="20" y="45" width="470" height="65" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
    <text x="35" y="68" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="start">Generation 0: Young Objects</text>
    <text x="35" y="86" font-size="10" fill="#A7F3D0" text-anchor="start">• All newly instantiated objects allocated here</text>
    <text x="35" y="100" font-size="10" fill="#6EE7B7" text-anchor="start">• Trigger: Net allocations exceed 700. Runs frequently (milliseconds).</text>

    <!-- Gen 1 -->
    <rect x="20" y="120" width="470" height="65" rx="6" fill="#064E3B" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="35" y="143" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="start">Generation 1: Middle-Aged Objects</text>
    <text x="35" y="161" font-size="10" fill="#FDE68A" text-anchor="start">• Survivors of Gen 0 collection promoted to Gen 1</text>
    <text x="35" y="175" font-size="10" fill="#FDE68A" text-anchor="start">• Trigger: Every 10 Gen 0 collections.</text>

    <!-- Gen 2 -->
    <rect x="20" y="195" width="470" height="85" rx="6" fill="#064E3B" stroke="#8B5CF6" stroke-width="1.2"/>
    <text x="35" y="218" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="start">Generation 2: Long-Lived / Permanent Objects</text>
    <text x="35" y="236" font-size="10" fill="#DDD6FE" text-anchor="start">• Survivors of Gen 1 promoted here (modules, singletons, caches)</text>
    <text x="35" y="250" font-size="10" fill="#DDD6FE" text-anchor="start">• Trigger: Every 10 Gen 1 collections. Full stop-the-world scan.</text>
    <text x="35" y="266" font-size="10" fill="#6EE7B7" font-weight="600" text-anchor="start">✓ Trial deletion subtracts internal refs: isolates and frees cycles!</text>
  </g>
</svg>