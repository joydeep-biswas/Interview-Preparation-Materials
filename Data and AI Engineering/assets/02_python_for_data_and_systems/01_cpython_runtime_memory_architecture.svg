<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="500" viewBox="0 0 1180 500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1180" height="500" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">CPython Runtime, Memory Architecture &amp; Execution Model</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">CPython PyMalloc, Reference Counting, Cyclic GC, and High-Performance Off-Heap Engine Interoperability</text>

  <!-- 3 Equal Width Columns (w=360 each with 25px runway gaps) -->

  <!-- Column 1: CPython Memory (x=35..395, w=360) -->
  <g transform="translate(35, 95)">
    <rect width="360" height="355" rx="8" fill="#0B132B" stroke="#3B82F6" stroke-width="2"/>
    <text x="180" y="26" font-size="13" font-weight="700" fill="#93C5FD" text-anchor="middle">1. CPython Memory Management</text>

    <!-- Card 1.1 -->
    <rect x="15" y="42" width="330" height="85" rx="6" fill="#1C2541" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="180" y="66" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">PyMalloc Allocator (&lt;= 512 Bytes)</text>
    <text x="25" y="88" font-size="11" fill="#94A3B8" text-anchor="start">• Arenas (256KB) → Pools (4KB) → Blocks</text>
    <text x="25" y="104" font-size="11" fill="#94A3B8" text-anchor="start">• O(1) allocation via thread-local free lists</text>
    <text x="25" y="118" font-size="10" fill="#60A5FA" text-anchor="start">Bypasses glibc malloc to eliminate system call overhead</text>

    <!-- Card 1.2 -->
    <rect x="15" y="142" width="330" height="85" rx="6" fill="#1C2541" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="180" y="166" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Reference Counting (Primary GC)</text>
    <text x="25" y="188" font-size="11" fill="#FDE68A" text-anchor="start">• ob_refcnt incremented on assignment/call</text>
    <text x="25" y="204" font-size="11" fill="#FDE68A" text-anchor="start">• Deallocates immediately when refcnt == 0</text>
    <text x="25" y="218" font-size="10" fill="#FDE68A" text-anchor="start">Deterministic, zero pause time for non-cyclic data</text>

    <!-- Card 1.3 -->
    <rect x="15" y="242" width="330" height="95" rx="6" fill="#1C2541" stroke="#EF4444" stroke-width="1.2"/>
    <text x="180" y="266" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Cyclic GC (Generations 0, 1, 2)</text>
    <text x="25" y="288" font-size="11" fill="#FCA5A5" text-anchor="start">• Detects circular references (A -&gt; B -&gt; A)</text>
    <text x="25" y="304" font-size="11" fill="#FCA5A5" text-anchor="start">• Tri-color trial deletion on double-linked list</text>
    <text x="25" y="322" font-size="10" fill="#EF4444" font-weight="600" text-anchor="start">Thresholds: 700 / 10 / 10 collection triggers</text>

    <!-- Connectors -->
    <path d="M 180 127 L 180 140" fill="none" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arr-a)"/>
    <path d="M 180 227 L 180 240" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arr-r)"/>
  </g>

  <!-- Column 2: Data Engines (x=410..770, w=360) -->
  <g transform="translate(410, 95)">
    <rect width="360" height="355" rx="8" fill="#062828" stroke="#10B981" stroke-width="2"/>
    <text x="180" y="26" font-size="13" font-weight="700" fill="#6EE7B7" text-anchor="middle">2. High-Performance Data Engines</text>

    <!-- Card 2.1 -->
    <rect x="15" y="42" width="330" height="95" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
    <text x="180" y="66" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Polars (Rust Apache Arrow Core)</text>
    <text x="25" y="88" font-size="11" fill="#A7F3D0" text-anchor="start">• Contiguous columnar buffers in off-heap RAM</text>
    <text x="25" y="104" font-size="11" fill="#A7F3D0" text-anchor="start">• Multi-threaded work-stealing execution (Rayon)</text>
    <text x="25" y="122" font-size="10" fill="#6EE7B7" font-weight="600" text-anchor="start">Lazy query optimizer + SIMD vectorized speed</text>

    <!-- Card 2.2 -->
    <rect x="15" y="152" width="330" height="85" rx="6" fill="#064E3B" stroke="#06B6D4" stroke-width="1.2"/>
    <text x="180" y="176" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">DuckDB (Embedded In-Process OLAP)</text>
    <text x="25" y="198" font-size="11" fill="#BAE6FD" text-anchor="start">• Vectorized Volcano pipelined execution</text>
    <text x="25" y="214" font-size="11" fill="#BAE6FD" text-anchor="start">• Direct zero-copy scanning of Parquet &amp; Arrow</text>
    <text x="25" y="228" font-size="10" fill="#38BDF8" text-anchor="start">Fast SQL joins &amp; window functions in Python</text>

    <!-- Card 2.3 -->
    <rect x="15" y="252" width="330" height="85" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
    <text x="180" y="276" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Generators &amp; Streaming Iterators</text>
    <text x="25" y="298" font-size="11" fill="#A7F3D0" text-anchor="start">• Bounded O(1) memory pipelines via yield</text>
    <text x="25" y="314" font-size="11" fill="#A7F3D0" text-anchor="start">• Stream 50GB files using only 15MB buffer</text>
    <text x="25" y="328" font-size="10" fill="#6EE7B7" text-anchor="start">Zero full-file memory allocations</text>
  </g>

  <!-- Column 3: Concurrency &amp; Runtimes (x=785..1145, w=360) -->
  <g transform="translate(785, 95)">
    <rect width="360" height="355" rx="8" fill="#1A102F" stroke="#8B5CF6" stroke-width="2"/>
    <text x="180" y="26" font-size="13" font-weight="700" fill="#DDD6FE" text-anchor="middle">3. Concurrency &amp; GIL Boundaries</text>

    <!-- Card 3.1 -->
    <rect x="15" y="42" width="330" height="85" rx="6" fill="#2E1065" stroke="#8B5CF6" stroke-width="1.2"/>
    <text x="180" y="66" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">The Global Interpreter Lock (GIL)</text>
    <text x="25" y="88" font-size="11" fill="#DDD6FE" text-anchor="start">• Mutex protecting CPython bytecode execution</text>
    <text x="25" y="104" font-size="11" fill="#DDD6FE" text-anchor="start">• Serializes CPU-bound threads to 1 core</text>
    <text x="25" y="118" font-size="10" fill="#C4B5FD" text-anchor="start">Released during OS blocking I/O &amp; C extensions</text>

    <!-- Card 3.2 -->
    <rect x="15" y="142" width="330" height="85" rx="6" fill="#2E1065" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="180" y="166" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Multiprocessing (CPU-Bound Parallelism)</text>
    <text x="25" y="188" font-size="11" fill="#FDE68A" text-anchor="start">• Spawns isolated OS processes (Fork/Spawn)</text>
    <text x="25" y="204" font-size="11" fill="#FDE68A" text-anchor="start">• Each process gets independent memory &amp; GIL</text>
    <text x="25" y="218" font-size="10" fill="#FDE68A" text-anchor="start">Bypasses GIL; scales across all hardware cores</text>

    <!-- Card 3.3 -->
    <rect x="15" y="242" width="330" height="95" rx="6" fill="#2E1065" stroke="#06B6D4" stroke-width="1.2"/>
    <text x="180" y="266" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Asyncio &amp; Threading (I/O Concurrency)</text>
    <text x="25" y="288" font-size="11" fill="#BAE6FD" text-anchor="start">• Asyncio: Single-thread non-blocking event loop</text>
    <text x="25" y="304" font-size="11" fill="#BAE6FD" text-anchor="start">• Threading: Preemptive OS threads for disk/db I/O</text>
    <text x="25" y="322" font-size="10" fill="#38BDF8" font-weight="600" text-anchor="start">10k+ concurrent network sockets with low RAM</text>
  </g>

  <!-- Connectors Layer: Painted AFTER all columns and cards for 100% visibility -->
  <g id="connectors">
    <!-- Blue Arrow: PyMalloc to Generators (x=380 to 410) -->
    <path d="M 380 180 C 400 180, 400 390, 424 390" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arr-b)"/>
    <rect x="365" y="275" width="80" height="22" rx="4" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>
    <text x="405" y="290" font-size="9" fill="#93C5FD" font-weight="700" text-anchor="middle">Allocation</text>

    <!-- Green Arrow: Polars to Multiprocessing (x=755 to 785) -->
    <path d="M 755 185 C 775 185, 775 280, 799 280" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>
    <rect x="740" y="222" width="80" height="22" rx="4" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
    <text x="780" y="237" font-size="9" fill="#6EE7B7" font-weight="700" text-anchor="middle">Parallel Run</text>
  </g>
</svg>