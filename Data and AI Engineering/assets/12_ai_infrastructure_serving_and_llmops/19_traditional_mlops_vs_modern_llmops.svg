<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%" style="background-color: #0b1120; max-width: 100%; height: auto;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="card-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="card-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#451a03" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="card-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="card-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="card-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#155e75" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.2" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171" />
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22d3ee" />
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Base Canvas -->
  <rect width="1000" height="420" rx="10" fill="url(#bg)"  stroke="#1F2937" stroke-width="1.5"/>

  <!-- Diagram Header -->
  <g transform="translate(0, 0)">
    <text x="500.0" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#f8fafc">Paradigm Shift: Traditional MLOps vs Modern LLMOps Architecture</text>
    <text x="500.0" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">From feature stores and model retraining to context engineering, prompt registries, and AI gateways</text>
  </g>

  <!-- Diagram Body -->
  <g transform="translate(40, 95)">
  <rect width="430" height="300" rx="10" fill="#0f172a" fill-opacity="0.08" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4" />
  <rect x="14" y="-12" width="282" height="22" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <text x="155.0" y="3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Traditional MLOps (Model-Centric)</text>
</g>
<g transform="translate(60, 130)">
  <rect width="390" height="70" rx="8" fill="url(#card-blue)" stroke="#38bdf8" stroke-width="1.5" />
  <text x="195.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">1. Raw Data &amp; Feature Store</text>
  <line x1="12" y1="34" x2="378" y2="34" stroke="#334155" stroke-width="1" />
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">Feast feature engineering, parquet tables</text>
</g>
<g transform="translate(60, 200)">
  <rect width="390" height="70" rx="8" fill="url(#card-blue)" stroke="#38bdf8" stroke-width="1.5" />
  <text x="195.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">2. Full Model Retraining</text>
  <line x1="12" y1="34" x2="378" y2="34" stroke="#334155" stroke-width="1" />
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">Spark / PyTorch re-trains model weekly</text>
</g>
<g transform="translate(60, 270)">
  <rect width="390" height="70" rx="8" fill="url(#card-blue)" stroke="#38bdf8" stroke-width="1.5" />
  <text x="195.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">3. Export Weights &amp; Containerize</text>
  <line x1="12" y1="34" x2="378" y2="34" stroke="#334155" stroke-width="1" />
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">Exports .onnx / .pt artifact to container registry</text>
</g>
<g transform="translate(510, 95)">
  <rect width="450" height="300" rx="10" fill="#0f172a" fill-opacity="0.08" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6,4" />
  <rect x="14" y="-12" width="338" height="22" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="1" />
  <text x="183.0" y="3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#34d399">Modern LLMOps (Prompt &amp; Context-Centric)</text>
</g>
<g transform="translate(530, 130)">
  <rect width="410" height="70" rx="8" fill="url(#card-green)" stroke="#34d399" stroke-width="1.5" />
  <text x="205.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#a7f3d0">1. Pre-Trained Foundation Model</text>
  <line x1="12" y1="34" x2="398" y2="34" stroke="#334155" stroke-width="1" />
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">GPT-4o, Claude 3.5, LLaMA 3.1 (Frozen weights)</text>
</g>
<g transform="translate(530, 200)">
  <rect width="410" height="70" rx="8" fill="url(#card-cyan)" stroke="#22d3ee" stroke-width="1.5" />
  <text x="205.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">2. Context Engineering &amp; RAG</text>
  <line x1="12" y1="34" x2="398" y2="34" stroke="#334155" stroke-width="1" />
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">Vector DB, BM25, Prompt templates, tool registry</text>
</g>
<g transform="translate(530, 270)">
  <rect width="410" height="70" rx="8" fill="url(#card-purple)" stroke="#c084fc" stroke-width="1.5" />
  <text x="205.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">3. AI Gateway &amp; Online Evals</text>
  <line x1="12" y1="34" x2="398" y2="34" stroke="#334155" stroke-width="1" />
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">Semantic caching, rate limits, NLI verification</text>
</g>
<g id="connectors"><line x1="255" y1="190" x2="255" y2="200" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr-b)" />
<line x1="255" y1="260" x2="255" y2="270" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr-b)" />
<line x1="735" y1="190" x2="735" y2="200" stroke="#34d399" stroke-width="1.8" marker-end="url(#arr-g)" />
<line x1="735" y1="260" x2="735" y2="270" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arr-c)" />
</g></svg>