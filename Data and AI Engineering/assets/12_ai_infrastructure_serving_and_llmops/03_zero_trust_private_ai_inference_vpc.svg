  <text x="130.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">AWS PrivateLink VPC Endpoint</text>
  <line x1="12" y1="34" x2="248" y2="34" stroke="#334155" stroke-width="1"/>
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Elastic Network Interface (ENI)</text>
  <text x="14" y="70" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• IP: 10.0.4.15</text>
  <text x="14" y="88" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Internal DNS: bedrock.us-east-1.amazonaws.com</text>
  <text x="14" y="106" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Traffic stays 100% on AWS backbone!</text>
</g>
<line x1="190" y1="230" x2="190" y2="260" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arr-c)"/>
<text x="190.0" y="239.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#22d3ee">Internal TLS 1.3</text>
<g transform="translate(370, 95)">
  <rect width="300" height="310" rx="10" fill="#0f172a" fill-opacity="0.08" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="14" y="-12" width="218" height="22" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="123.0" y="3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#34d399">AWS Managed Bedrock Plane</text>
</g>
<g transform="translate(390, 130)">
