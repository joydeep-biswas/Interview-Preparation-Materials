  <line x1="12" y1="34" x2="248" y2="34" stroke="#334155" stroke-width="1"/>
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Hyperplane distributed bus</text>
  <text x="14" y="70" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Multi-AZ automatic failover</text>
  <text x="14" y="88" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Microsecond traffic steering</text>
</g>
<g transform="translate(390, 260)">
  <rect width="260" height="120" rx="8" fill="url(#card-green)" stroke="#34d399" stroke-width="1.5"/>
  <text x="130.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#a7f3d0">Foundation Model Workers</text>
  <line x1="12" y1="34" x2="248" y2="34" stroke="#334155" stroke-width="1"/>
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Dedicated H100 GPU clusters</text>
  <text x="14" y="70" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Zero persistent request logging</text>
  <text x="14" y="88" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Memory isolated per tenant session</text>
</g>
<path d="M 320.0 320.0 L 330.0 320.0 C 353.0 320.0, 353.0 180.0, 376.0 180.0 L 390.0 180.0" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arr-g)"/>
<text x="355.0" y="244.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#34d399">Hyperplane Bus</text>
<line x1="520" y1="230" x2="520" y2="260" stroke="#34d399" stroke-width="1.8" marker-end="url(#arr-g)"/>
<g transform="translate(700, 95)">
  <rect width="260" height="310" rx="10" fill="#0f172a" fill-opacity="0.08" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="14" y="-12" width="218" height="22" rx="4" fill="#0f172a" stroke="#c084fc" stroke-width="1"/>
  <text x="123.0" y="3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#c084fc">Enterprise Security Vault</text>
</g>
<g transform="translate(720, 140)">
  <rect width="220" height="120" rx="8" fill="url(#card-purple)" stroke="#c084fc" stroke-width="1.5"/>
  <text x="110.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Customer-Managed Key (CMEK)</text>
  <line x1="12" y1="34" x2="208" y2="34" stroke="#334155" stroke-width="1"/>
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Hardware HSM (FIPS 140-2 L3)</text>
  <text x="14" y="70" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Customer controls key lifecycle</text>
  <text x="14" y="88" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Revoke key = Instant shutdown</text>
  <text x="14" y="106" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Full CloudTrail audit logging</text>
</g>
<g transform="translate(720, 280)">
  <rect width="220" height="100" rx="8" fill="url(#card-purple)" stroke="#c084fc" stroke-width="1.5"/>
  <text x="110.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Compliance Standard</text>
  <line x1="12" y1="34" x2="208" y2="34" stroke="#334155" stroke-width="1"/>
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• HIPAA, SOC2 Type II, ISO 27001</text>
  <text x="14" y="70" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Zero training on customer data</text>
</g>
<path d="M 720.0 200.0 L 710.0 200.0 C 687.0 200.0, 687.0 310.0, 664.0 310.0 L 650.0 310.0" fill="none" stroke="#c084fc" stroke-width="1.8" marker-end="url(#arr-p)" stroke-dasharray="4,4"/>
<text x="685.0" y="249.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#c084fc">Encrypts Payload</text>
