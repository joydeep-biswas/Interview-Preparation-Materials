  <rect width="300" height="310" rx="10" fill="#0f172a" fill-opacity="0.08" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="14" y="-12" width="290" height="22" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
