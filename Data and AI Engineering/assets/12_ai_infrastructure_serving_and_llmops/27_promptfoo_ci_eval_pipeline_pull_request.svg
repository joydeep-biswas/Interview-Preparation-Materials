<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%" style="background-color: #0b1120; max-width: 100%; height: auto;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="card-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="card-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#451a03" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="card-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="card-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="card-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#155e75" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.2" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171" />
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22d3ee" />
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Base Canvas -->
  <rect width="1000" height="420" rx="10" fill="url(#bg)"  stroke="#1F2937" stroke-width="1.5"/>

  <!-- Diagram Header -->
  <g transform="translate(0, 0)">
    <text x="500.0" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#f8fafc">Promptfoo Automated CI/CD Quality Gate Pipeline</text>
    <text x="500.0" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Automated prompt regression testing: Schema validation, semantic similarity, NLI faithfulness, and PII leakage guards</text>
  </g>

  <!-- Diagram Body -->
  <g transform="translate(40, 160)">
  <rect width="200" height="106" rx="8" fill="url(#card-blue)" stroke="#38bdf8" stroke-width="1.5" />
  <text x="100.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Pull Request Trigger</text>
  <line x1="12" y1="34" x2="188" y2="34" stroke="#334155" stroke-width="1" />
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Developer edits system prompt</text>
  <text x="14" y="70" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Or tweaks RAG chunking params</text>
  <text x="14" y="88" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• GitHub Actions triggers CI</text>
</g>
<g transform="translate(270, 95)">
  <rect width="410" height="300" rx="10" fill="#0f172a" fill-opacity="0.08" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="6,4" />
  <rect x="14" y="-12" width="362" height="22" rx="4" fill="#0f172a" stroke="#c084fc" stroke-width="1" />
  <text x="195.0" y="3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#c084fc">CI Evaluation Matrix (Promptfoo / DeepEval)</text>
</g>
<g transform="translate(290, 130)">
  <rect width="370" height="70" rx="8" fill="url(#card-purple)" stroke="#c084fc" stroke-width="1.5" />
  <text x="185.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">1. Strict JSON Schema Validation</text>
  <line x1="12" y1="34" x2="358" y2="34" stroke="#334155" stroke-width="1" />
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">Passes jsonschema compile &amp; required fields</text>
</g>
<g transform="translate(290, 190)">
  <rect width="370" height="70" rx="8" fill="url(#card-purple)" stroke="#c084fc" stroke-width="1.5" />
  <text x="185.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">2. Semantic Similarity Assertion (&gt;= 0.85)</text>
  <line x1="12" y1="34" x2="358" y2="34" stroke="#334155" stroke-width="1" />
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">Cosine similarity to golden regression answers</text>
</g>
<g transform="translate(290, 250)">
  <rect width="370" height="70" rx="8" fill="url(#card-purple)" stroke="#c084fc" stroke-width="1.5" />
  <text x="185.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">3. NLI Faithfulness &amp; Groundedness (&gt;= 0.90)</text>
  <line x1="12" y1="34" x2="358" y2="34" stroke="#334155" stroke-width="1" />
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">DeBERTa cross-encoder evaluates context entailment</text>
</g>
<g transform="translate(290, 310)">
  <rect width="370" height="70" rx="8" fill="url(#card-green)" stroke="#34d399" stroke-width="1.5" />
  <text x="185.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#a7f3d0">4. PII &amp; Jailbreak Redaction Guard</text>
  <line x1="12" y1="34" x2="358" y2="34" stroke="#334155" stroke-width="1" />
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">Zero credit card numbers or prompt leakage</text>
</g>
<g transform="translate(720, 130)">
  <rect width="240" height="100" rx="8" fill="url(#card-green)" stroke="#34d399" stroke-width="1.5" />
  <text x="120.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#a7f3d0">Merge Approved!</text>
  <line x1="12" y1="34" x2="228" y2="34" stroke="#334155" stroke-width="1" />
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• All 500 test assertions pass</text>
  <text x="14" y="70" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Green check on PR</text>
  <text x="14" y="88" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Auto-deploy to Staging</text>
</g>
<g transform="translate(720, 270)">
  <rect width="240" height="100" rx="8" fill="url(#card-red)" stroke="#f87171" stroke-width="1.5" />
  <text x="120.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#fca5a5">PR Blocked!</text>
  <line x1="12" y1="34" x2="228" y2="34" stroke="#334155" stroke-width="1" />
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Assertion failure detected!</text>
  <text x="14" y="70" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Hallucination rate &gt; 10%</text>
  <text x="14" y="88" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Detailed diff report on PR</text>
</g>
<g id="connectors"><line x1="240" y1="207" x2="270" y2="207" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr-b)" />
<polyline points="680,215 700,215 700,180 720,180" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arr-g)" />
<polyline points="680,275 700,275 700,320 720,320" fill="none" stroke="#f87171" stroke-width="1.8" marker-end="url(#arr-r)" />
</g></svg>