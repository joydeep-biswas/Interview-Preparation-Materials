<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%" style="background-color: #0b1120; max-width: 100%; height: auto;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="card-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="card-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#451a03" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="card-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="card-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="card-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#155e75" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.2" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171" />
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22d3ee" />
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Base Canvas -->
  <rect width="1000" height="420" rx="10" fill="url(#bg)"  stroke="#1F2937" stroke-width="1.5"/>

  <!-- Diagram Header -->
  <g transform="translate(0, 0)">
    <text x="500.0" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#f8fafc">Pipeline Parallelism: 1F1B Schedule (PP=4 Stages)</text>
    <text x="500.0" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Steady-state One-Forward-One-Backward schedule minimizing pipeline bubble overhead and peak activation memory</text>
  </g>

  <!-- Diagram Body -->
  <g transform="translate(40, 95)">
  <rect width="920" height="240" rx="10" fill="#0f172a" fill-opacity="0.08" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4" />
  <rect x="14" y="-12" width="362" height="22" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <text x="195.0" y="3" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">1F1B Execution Timeline across 4 GPU Stages</text>
</g>
<g transform="translate(60, 125)">
  <rect width="880" height="44" rx="8" fill="url(#card-blue)" stroke="#38bdf8" stroke-width="1.5" />
  <text x="440.0" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">GPU 0 (Stage 1)</text>
  <line x1="12" y1="25" x2="868" y2="25" stroke="#334155" stroke-width="1" />
  <text x="14" y="37" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10" fill="#cbd5e1">[Warmup: F1 F2 F3 F4] [1F1B Steady: B1 F5 B2 F6 B3 F7 B4 F8] [Cooldown: B5 B6 B7 B8]</text>
</g>
<g transform="translate(60, 175)">
  <rect width="880" height="44" rx="8" fill="url(#card-cyan)" stroke="#22d3ee" stroke-width="1.5" />
  <text x="440.0" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">GPU 1 (Stage 2)</text>
  <line x1="12" y1="25" x2="868" y2="25" stroke="#334155" stroke-width="1" />
  <text x="14" y="37" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10" fill="#cbd5e1">[Bubble] [Warmup: F1 F2 F3] [1F1B Steady: B1 F4 B2 F5 B3 F6 B4 F7] [Cooldown: B5 B6 B7 B8]</text>
</g>
<g transform="translate(60, 225)">
  <rect width="880" height="44" rx="8" fill="url(#card-amber)" stroke="#fbbf24" stroke-width="1.5" />
  <text x="440.0" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">GPU 2 (Stage 3)</text>
  <line x1="12" y1="25" x2="868" y2="25" stroke="#334155" stroke-width="1" />
  <text x="14" y="37" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10" fill="#cbd5e1">[Bubble ....] [Warmup: F1 F2] [1F1B Steady: B1 F3 B2 F4 B3 F5 B4 F6] [Cooldown: B5 B6 B7 B8]</text>
</g>
<g transform="translate(60, 275)">
  <rect width="880" height="44" rx="8" fill="url(#card-purple)" stroke="#c084fc" stroke-width="1.5" />
  <text x="440.0" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">GPU 3 (Stage 4)</text>
  <line x1="12" y1="25" x2="868" y2="25" stroke="#334155" stroke-width="1" />
  <text x="14" y="37" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10" fill="#cbd5e1">[Bubble ........] [F1 B1] [F2 B2] [F3 B3] [F4 B4] [F5 B5] [F6 B6] [F7 B7] [F8 B8]</text>
</g>
<g transform="translate(40, 350)">
  <rect width="920" height="70" rx="8" fill="url(#card-green)" stroke="#34d399" stroke-width="1.5" />
  <text x="460.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#a7f3d0">1F1B Memory Benefit</text>
  <line x1="12" y1="34" x2="908" y2="34" stroke="#334155" stroke-width="1" />
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">Peak activation memory is capped at PP micro-batches (4) rather than all micro-batches (8), preventing OOM!</text>
</g>
</svg>