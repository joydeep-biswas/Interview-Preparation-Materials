<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%" style="background-color: #0b1120; max-width: 100%; height: auto;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="card-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="card-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#451a03" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="card-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#450a0a" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="card-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="card-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#155e75" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.2" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171" />
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22d3ee" />
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Base Canvas -->
  <rect width="1000" height="480" rx="10" fill="url(#bg)"  stroke="#1F2937" stroke-width="1.5"/>

  <!-- Diagram Header -->
  <g transform="translate(0, 0)">
    <text x="500.0" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#f8fafc">Systematic RAG Hallucination Root-Cause Triage Decision Tree</text>
    <text x="500.0" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Isolating retrieval failures (data ingestion &amp; search) from generation failures (lost-in-middle &amp; temperature)</text>
  </g>

  <!-- Diagram Body -->
  <g transform="translate(40, 190)">
  <rect width="220" height="106" rx="8" fill="url(#card-red)" stroke="#f87171" stroke-width="1.5" />
  <text x="110.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#fca5a5">RAG Emits Bad Answer</text>
  <line x1="12" y1="34" x2="208" y2="34" stroke="#334155" stroke-width="1" />
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Hallucination caught by user</text>
  <text x="14" y="70" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Factual error or citation miss</text>
  <text x="14" y="88" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Incident ticket opened</text>
</g>
<g transform="translate(300, 180)">
  <rect width="230" height="124" rx="8" fill="url(#card-purple)" stroke="#c084fc" stroke-width="1.5" />
  <text x="115.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">1. Inspect Retrieved Chunks</text>
  <line x1="12" y1="34" x2="218" y2="34" stroke="#334155" stroke-width="1" />
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Ground-Truth Verification Check:</text>
  <text x="14" y="70" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">  'Do the retrieved chunks</text>
  <text x="14" y="88" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">   actually contain the factual</text>
  <text x="14" y="106" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">   ground-truth answer?'</text>
</g>
<g transform="translate(580, 100)">
  <rect width="380" height="160" rx="8" fill="url(#card-red)" stroke="#f87171" stroke-width="1.5" />
  <text x="190.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#fca5a5">RETRIEVAL SUBSYSTEM FAILURE (Ground Truth Missing)</text>
  <line x1="12" y1="34" x2="368" y2="34" stroke="#334155" stroke-width="1" />
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">Root Cause Isolation Actions:</text>
  <text x="14" y="70" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Did document layout break? (Table flattened / multi-column garbled)</text>
  <text x="14" y="88" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Did chunk splitting cut the answer sentence across boundaries?</text>
  <text x="14" y="106" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Did Bi-Encoder miss exact keywords? -&gt; Deploy BM25 hybrid search</text>
  <text x="14" y="124" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Did short query suffer vocabulary mismatch? -&gt; Deploy HyDE</text>
  <text x="14" y="142" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Lower Cross-Encoder re-rank threshold to admit more chunks</text>
</g>
<g transform="translate(580, 275)">
  <rect width="380" height="155" rx="8" fill="url(#card-green)" stroke="#34d399" stroke-width="1.5" />
  <text x="190.0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#a7f3d0">GENERATION SUBSYSTEM FAILURE (Ground Truth Present!)</text>
  <line x1="12" y1="34" x2="368" y2="34" stroke="#334155" stroke-width="1" />
  <text x="14" y="52" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">Root Cause Isolation Actions:</text>
  <text x="14" y="70" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Did answer suffer from 'Lost-in-the-Middle'? -&gt; Re-order chunks</text>
  <text x="14" y="88" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Is temperature &gt; 0.0? -&gt; Enforce deterministic sampling (0.0)</text>
  <text x="14" y="106" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Strengthen system prompt XML boundaries and negative constraints</text>
  <text x="14" y="124" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Deploy automated NLI Natural Language Inference verifier</text>
  <text x="14" y="142" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#cbd5e1">• Context window overflow? -&gt; Prune low-relevance chunks</text>
</g>
<g id="connectors"><line x1="260" y1="237" x2="300" y2="237" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr-b)" />
<polyline points="530,215 555,215 555,172 580,172" fill="none" stroke="#f87171" stroke-width="1.8" marker-end="url(#arr-r)" />
<polyline points="530,260 555,260 555,352 580,352" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arr-g)" />
</g></svg>