<line x1="310" y1="162" x2="380" y2="162" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-s)"/>
<text x="345.0" y="156.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#64748b">High Distance (0.85)</text>
