    <text x="500.0" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">High-dimensional vector embeddings project semantic affinity into compact geometric manifolds</text>
  </g>

