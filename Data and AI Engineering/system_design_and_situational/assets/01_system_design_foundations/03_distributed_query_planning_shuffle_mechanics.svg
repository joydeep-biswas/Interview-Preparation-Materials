<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" width="100%" height="100%">
    <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <text x="550" y="32" class="title" font-size="19" text-anchor="middle">Distributed Query Planning: Sort Shuffle Mechanics &amp; Disk Spills</text>
  <text x="550" y="52" class="subtitle" text-anchor="middle">Map partition hash routing, shuffle index/data files on NVMe, and asynchronous Netty reducer fetch</text>

  <!-- Stage 1 Map Stage -->
  <g transform="translate(30, 75)">
    <rect width="280" height="280" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="280" height="34" rx="10" ry="10" fill="#1E3A8A"/>
    <text x="140" y="22" class="card-title" fill="#93C5FD" text-anchor="middle">Stage 1: Map &amp; Partitioning</text>
    
    <rect x="20" y="48" width="240" height="85" rx="6" ry="6" fill="#1E293B" stroke="#60A5FA"/>
    <text x="140" y="68" class="badge" fill="#93C5FD" text-anchor="middle">Map Worker 1 (Table Scan)</text>
    <text x="30" y="90" class="card-body">• In-memory AppendOnlyMap</text>
    <text x="30" y="108" class="card-body">• Key Hash Partitioner: Key % R</text>
    <text x="30" y="126" class="card-body">• Sort by (PartitionID, Key)</text>

    <rect x="20" y="145" width="240" height="85" rx="6" ry="6" fill="#1E293B" stroke="#60A5FA"/>
    <text x="140" y="165" class="badge" fill="#93C5FD" text-anchor="middle">Map Worker 2 (Table Scan)</text>
    <text x="30" y="187" class="card-body">• Parallel partition buffer</text>
    <text x="30" y="205" class="card-body">• Spills when memory threshold met</text>
    <text x="30" y="223" class="card-body">• Spill sorter merges partitions</text>

    <rect x="20" y="242" width="240" height="24" rx="4" ry="4" fill="#1E293B"/>
    <text x="140" y="258" class="badge" fill="#93C5FD" text-anchor="middle">Mapper Memory Execution</text>
  </g>

  <!-- Shuffle Disk Spill Boundary -->
  <g transform="translate(390, 75)">
    <rect width="320" height="280" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="320" height="34" rx="10" ry="10" fill="#78350F"/>
    <text x="160" y="22" class="card-title" fill="#FDE68A" text-anchor="middle">Local NVMe Shuffle Boundary</text>
    
    <rect x="20" y="48" width="280" height="95" rx="6" ry="6" fill="#1E293B" stroke="#FBBF24"/>
    <text x="160" y="68" class="badge" fill="#FDE68A" text-anchor="middle">shuffle_X_Y_0.data</text>
    <text x="30" y="90" class="card-body">• Single consolidated binary file</text>
    <text x="30" y="108" class="card-body">• Partition 0 | Partition 1 | Partition 2</text>
    <text x="30" y="126" class="card-body">• Avoids creating millions of small files</text>
    <text x="30" y="144" class="card-body">• Fast sequential NVMe disk writes</text>

    <rect x="20" y="155" width="280" height="75" rx="6" ry="6" fill="#1E293B" stroke="#FBBF24"/>
    <text x="160" y="175" class="badge" fill="#FDE68A" text-anchor="middle">shuffle_X_Y_0.index</text>
    <text x="30" y="197" class="card-body">• 8-byte byte-offset pointers</text>
    <text x="30" y="215" class="card-body">• Enables O(1) partition range seeks</text>

    <rect x="20" y="242" width="280" height="24" rx="4" ry="4" fill="#1E293B"/>
    <text x="160" y="258" class="badge" fill="#FDE68A" text-anchor="middle">External Shuffle Service (ESS)</text>
  </g>

  <!-- Stage 2 Reduce Stage -->
  <g transform="translate(790, 75)">
    <rect width="280" height="280" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="280" height="34" rx="10" ry="10" fill="#064E3B"/>
    <text x="140" y="22" class="card-title" fill="#A7F3D0" text-anchor="middle">Stage 2: Reduce &amp; Aggregate</text>
    
    <rect x="20" y="48" width="240" height="85" rx="6" ry="6" fill="#1E293B" stroke="#34D399"/>
    <text x="140" y="68" class="badge" fill="#A7F3D0" text-anchor="middle">Reducer 1 (Partition 0)</text>
    <text x="30" y="90" class="card-body">• Netty asynchronous RPC fetch</text>
    <text x="30" y="108" class="card-body">• Max 48MB in-flight chunks</text>
    <text x="30" y="126" class="card-body">• ExternalAppendOnlyMap merge</text>

    <rect x="20" y="145" width="240" height="85" rx="6" ry="6" fill="#1E293B" stroke="#34D399"/>
    <text x="140" y="165" class="badge" fill="#A7F3D0" text-anchor="middle">Reducer 2 (Partition 1)</text>
    <text x="30" y="187" class="card-body">• Hash aggregation / join</text>
    <text x="30" y="205" class="card-body">• Spills to local disk if OOM risk</text>
    <text x="30" y="223" class="card-body">• Final emission to output format</text>

    <rect x="20" y="242" width="240" height="24" rx="4" ry="4" fill="#1E293B"/>
    <text x="140" y="258" class="badge" fill="#A7F3D0" text-anchor="middle">Downstream Task Completion</text>
  </g>

  <!-- Connective Runways -->
  <path d="M 310 135 L 350 135 L 350 180 L 378 180 L 390 180" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  <path d="M 310 230 L 350 230 L 350 240 L 378 240 L 390 240" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  
  <path d="M 710 160 L 750 160 L 750 135 L 778 135 L 790 135" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M 710 220 L 750 220 L 750 230 L 778 230 L 790 230" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
</svg>