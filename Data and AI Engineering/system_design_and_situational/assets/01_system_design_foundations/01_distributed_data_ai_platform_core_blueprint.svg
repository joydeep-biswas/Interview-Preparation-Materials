<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 370" width="100%" height="100%">
    <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <text x="550" y="32" class="title" font-size="19" text-anchor="middle">Distributed Data &amp; AI Platform: Core Blueprint</text>
  <text x="550" y="52" class="subtitle" text-anchor="middle">Disaggregated storage, stream ingestion backplane, distributed compute, and unified governance</text>

  <!-- Ingestion Tier -->
  <g transform="translate(30, 75)">
    <rect width="240" height="260" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="240" height="34" rx="10" ry="10" fill="#1E3A8A"/>
    <text x="120" y="22" class="card-title" fill="#93C5FD" text-anchor="middle">1. Ingestion Backplane</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#60A5FA">• Upstream Sources:</text>
    <text x="24" y="78" class="card-body">  - CDC (Debezium / Fivetran)</text>
    <text x="24" y="98" class="card-body">  - Telemetry (Kafka / Event Hub)</text>
    <text x="24" y="118" class="card-body">  - Microservice REST Webhooks</text>
    <text x="16" y="146" class="card-body" font-weight="600" fill="#60A5FA">• Ingress Commit Log:</text>
    <text x="24" y="166" class="card-body">  - Distributed append-only log</text>
    <text x="24" y="186" class="card-body">  - Partitioned by primary key</text>
    <text x="24" y="206" class="card-body">  - Zero data loss guarantees</text>
    <rect x="16" y="226" width="208" height="22" rx="4" ry="4" fill="#1E293B"/>
    <text x="120" y="241" class="badge" fill="#93C5FD" text-anchor="middle">High-Throughput Ingestion</text>
  </g>

  <!-- Storage Tier -->
  <g transform="translate(300, 75)">
    <rect width="240" height="260" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="240" height="34" rx="10" ry="10" fill="#064E3B"/>
    <text x="120" y="22" class="card-title" fill="#A7F3D0" text-anchor="middle">2. Disaggregated Lakehouse</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#34D399">• Bronze Layer:</text>
    <text x="24" y="78" class="card-body">  - Raw immutable Parquet</text>
    <text x="16" y="106" class="card-body" font-weight="600" fill="#34D399">• Silver Layer:</text>
    <text x="24" y="126" class="card-body">  - Curated Delta / Iceberg log</text>
    <text x="24" y="146" class="card-body">  - Schema enforcement &amp; dedup</text>
    <text x="16" y="174" class="card-body" font-weight="600" fill="#34D399">• Gold Layer:</text>
    <text x="24" y="194" class="card-body">  - Z-Order / Liquid clustered marts</text>
    <rect x="16" y="226" width="208" height="22" rx="4" ry="4" fill="#1E293B"/>
    <text x="120" y="241" class="badge" fill="#A7F3D0" text-anchor="middle">Object Store (S3 / ADLS)</text>
  </g>

  <!-- Compute Tier -->
  <g transform="translate(570, 75)">
    <rect width="240" height="260" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="240" height="34" rx="10" ry="10" fill="#78350F"/>
    <text x="120" y="22" class="card-title" fill="#FDE68A" text-anchor="middle">3. Distributed Compute</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#FBBF24">• Batch &amp; Micro-Batch:</text>
    <text x="24" y="78" class="card-body">  - Spark / Databricks Catalyst</text>
    <text x="24" y="98" class="card-body">  - Tungsten columnar execution</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#FBBF24">• Real-Time OLAP:</text>
    <text x="24" y="146" class="card-body">  - ClickHouse / StarRocks</text>
    <text x="24" y="166" class="card-body">  - Sub-second analytical queries</text>
    <text x="16" y="194" class="card-body" font-weight="600" fill="#FBBF24">• Interactive Querying:</text>
    <text x="24" y="214" class="card-body">  - Trino / Presto federated SQL</text>
    <rect x="16" y="226" width="208" height="22" rx="4" ry="4" fill="#1E293B"/>
    <text x="120" y="241" class="badge" fill="#FDE68A" text-anchor="middle">Ephemeral Query Engines</text>
  </g>

  <!-- Governance & AI -->
  <g transform="translate(840, 75)">
    <rect width="240" height="260" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="240" height="34" rx="10" ry="10" fill="#4C1D95"/>
    <text x="120" y="22" class="card-title" fill="#DDD6FE" text-anchor="middle">4. Catalog &amp; AI Serving</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#A78BFA">• Open Metastore Catalog:</text>
    <text x="24" y="78" class="card-body">  - Unity Catalog / Polaris</text>
    <text x="24" y="98" class="card-body">  - Column &amp; row-level RBAC</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#A78BFA">• Real-Time Feature Store:</text>
    <text x="24" y="146" class="card-body">  - Redis online / Lakehouse offline</text>
    <text x="16" y="174" class="card-body" font-weight="600" fill="#A78BFA">• Vector &amp; RAG Mesh:</text>
    <text x="24" y="194" class="card-body">  - Milvus / Qdrant HNSW</text>
    <text x="24" y="214" class="card-body">  - Enterprise LLM tool gating</text>
    <rect x="16" y="226" width="208" height="22" rx="4" ry="4" fill="#1E293B"/>
    <text x="120" y="241" class="badge" fill="#DDD6FE" text-anchor="middle">Unified Governance &amp; AI</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 270 205 L 288 205 L 300 205" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M 540 205 L 558 205 L 570 205" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  <path d="M 810 205 L 828 205 L 840 205" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
</svg>