<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 370" width="100%" height="100%">
    <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <text x="550" y="32" class="title" font-size="19" text-anchor="middle">Decoupled Data Contracts &amp; Semantic Metric Virtualization</text>
  <text x="550" y="52" class="subtitle" text-anchor="middle">Protecting production pipelines: Immutable Audit (Bronze), Standardized Entities (Silver), and Virtualized Semantics (Gold)</text>

  <!-- Layer 1: Bronze Invariants -->
  <g transform="translate(30, 75)">
    <rect width="320" height="260" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="320" height="34" rx="10" ry="10" fill="#1E3A8A"/>
    <text x="160" y="22" class="card-title" fill="#93C5FD" text-anchor="middle">Layer 1: Immutable Audit (Bronze)</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#60A5FA">• Raw Append-Only Ingestion:</text>
    <text x="24" y="78" class="card-body">  - Kafka / Azure ADLS / Amazon S3</text>
    <text x="24" y="98" class="card-body">  - Zero business logic filters applied</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#60A5FA">• Strict Data Contract Schema:</text>
    <text x="24" y="146" class="card-body">  - Upstream teams sign JSON Schema</text>
    <text x="24" y="166" class="card-body">  - Validates types, required fields, enums</text>
    <text x="16" y="194" class="card-body" font-weight="600" fill="#60A5FA">• Non-Breaking Evolution:</text>
    <text x="24" y="214" class="card-body">  - Additions allowed, deletions forbidden</text>
    <rect x="16" y="226" width="288" height="22" rx="4" ry="4" fill="#1E293B"/>
    <text x="160" y="241" class="badge" fill="#93C5FD" text-anchor="middle">Tamper-Proof Audit Trail</text>
  </g>

  <!-- Layer 2: Silver Standardization -->
  <g transform="translate(390, 75)">
    <rect width="320" height="260" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="320" height="34" rx="10" ry="10" fill="#4C1D95"/>
    <text x="160" y="22" class="card-title" fill="#DDD6FE" text-anchor="middle">Layer 2: Standard Entities (Silver)</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#A78BFA">• Curated Entity Tables:</text>
    <text x="24" y="78" class="card-body">  - Deduplicated by entity primary key</text>
    <text x="24" y="98" class="card-body">  - SCD Type 2 tracking for mutations</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#A78BFA">• Standardized Geospatial &amp; Time:</text>
    <text x="24" y="146" class="card-body">  - Uber H3 hexagonal spatial indexes</text>
    <text x="24" y="166" class="card-body">  - UTC canonical timestamp formatting</text>
    <text x="16" y="194" class="card-body" font-weight="600" fill="#A78BFA">• Data Quality Assertions:</text>
    <text x="24" y="214" class="card-body">  - Automated null &amp; range assertions</text>
    <rect x="16" y="226" width="288" height="22" rx="4" ry="4" fill="#1E293B"/>
    <text x="160" y="241" class="badge" fill="#DDD6FE" text-anchor="middle">Conformed Enterprise Core</text>
  </g>

  <!-- Layer 3: Gold Metric Virtualization -->
  <g transform="translate(750, 75)">
    <rect width="320" height="260" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="320" height="34" rx="10" ry="10" fill="#064E3B"/>
    <text x="160" y="22" class="card-title" fill="#A7F3D0" text-anchor="middle">Layer 3: Virtualized Semantics (Gold)</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#34D399">• dbt Semantic Models:</text>
    <text x="24" y="78" class="card-body">  - Dynamic SQL view definitions</text>
    <text x="24" y="98" class="card-body">  - Centralized KPI calculation logic</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#34D399">• Decoupled Business Agility:</text>
    <text x="24" y="146" class="card-body">  - Business logic changes repoint views</text>
    <text x="24" y="166" class="card-body">  - Zero underlying ETL pipeline rewrites</text>
    <text x="16" y="194" class="card-body" font-weight="600" fill="#34D399">• Universal Consumption:</text>
    <text x="24" y="214" class="card-body">  - BI Dashboards, Executive ML &amp; APIs</text>
    <rect x="16" y="226" width="288" height="22" rx="4" ry="4" fill="#1E293B"/>
    <text x="160" y="241" class="badge" fill="#A7F3D0" text-anchor="middle">Agile Semantic Layer</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 350 205 L 378 205 L 390 205" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <path d="M 710 205 L 738 205 L 750 205" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
</svg>