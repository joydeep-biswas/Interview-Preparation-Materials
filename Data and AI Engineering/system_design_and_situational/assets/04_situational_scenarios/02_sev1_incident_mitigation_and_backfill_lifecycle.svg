<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 370" width="100%" height="100%">
    <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>
  <rect width="100%" height="100%" fill="url(#bg-grad)"  rx="10" stroke="#1F2937" stroke-width="1.5"/>
  <text x="550" y="32" class="title" font-size="19" text-anchor="middle">Sev-1 Incident Mitigation &amp; Idempotent Backfill Lifecycle</text>
  <text x="550" y="52" class="subtitle" text-anchor="middle">Three-step execution protocol: Declare &amp; Contain, Patch &amp; Backfill, and Verify &amp; Reconcile</text>

  <!-- Step 1 -->
  <g transform="translate(30, 75)">
    <rect width="320" height="260" rx="10" ry="10" fill="#111827" stroke="#EF4444" stroke-width="2"/>
    <rect width="320" height="34" rx="10" ry="10" fill="#7F1D1D" stroke="#EF4444" stroke-width="1"/>
    <text x="160" y="22" class="card-title" fill="#FCA5A5" text-anchor="middle">Step 1: Declare &amp; Contain</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#F87171">• Alert Triggered:</text>
    <text x="24" y="78" class="card-body">  - PagerDuty threshold violation</text>
    <text x="16" y="106" class="card-body" font-weight="600" fill="#F87171">• Incident Command:</text>
    <text x="24" y="126" class="card-body">  - Declare Sev-1 incident</text>
    <text x="24" y="146" class="card-body">  - Spin up war room &amp; comms lead</text>
    <text x="16" y="174" class="card-body" font-weight="600" fill="#F87171">• Containment Measures:</text>
    <text x="24" y="194" class="card-body">  - Halt downstream pipeline writes</text>
    <text x="24" y="214" class="card-body">  - Enable Dead-Letter Queue (DLQ)</text>
    <rect x="16" y="226" width="288" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="160" y="241" class="badge" fill="#FCA5A5" text-anchor="middle">Containment Complete</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(390, 75)">
    <rect width="320" height="260" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="320" height="34" rx="10" ry="10" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
    <text x="160" y="22" class="card-title" fill="#FDE68A" text-anchor="middle">Step 2: Mitigate, Patch &amp; Backfill</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#FBBF24">• Root-Cause Isolation:</text>
    <text x="24" y="78" class="card-body">  - Pinpoint corrupt partition / schema</text>
    <text x="16" y="106" class="card-body" font-weight="600" fill="#FBBF24">• Pipeline Code Patch:</text>
    <text x="24" y="126" class="card-body">  - Deploy fix through emergency CI/CD</text>
    <text x="24" y="146" class="card-body">  - Verify with local SparkSession tests</text>
    <text x="16" y="174" class="card-body" font-weight="600" fill="#FBBF24">• Backfill Execution:</text>
    <text x="24" y="194" class="card-body">  - Rewind Kafka consumer offset or</text>
    <text x="24" y="214" class="card-body">  - Delta Lake RESTORE &amp; re-MERGE</text>
    <rect x="16" y="226" width="288" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="160" y="241" class="badge" fill="#FDE68A" text-anchor="middle">Idempotent Execution</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(750, 75)">
    <rect width="320" height="260" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="320" height="34" rx="10" ry="10" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="160" y="22" class="card-title" fill="#A7F3D0" text-anchor="middle">Step 3: Verify &amp; Reconcile</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#34D399">• Automated Reconciliation:</text>
    <text x="24" y="78" class="card-body">  - Row count &amp; hash checksum tests</text>
    <text x="24" y="98" class="card-body">  - Verify Debits == Credits balance</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#34D399">• Unfreeze Downstream:</text>
    <text x="24" y="146" class="card-body">  - Resume dependent DAGs &amp; marts</text>
    <text x="24" y="166" class="card-body">  - Notify business consumers</text>
    <text x="16" y="194" class="card-body" font-weight="600" fill="#34D399">• Incident Closure:</text>
    <text x="24" y="214" class="card-body">  - Resolve PagerDuty &amp; schedule post-mortem</text>
    <rect x="16" y="226" width="288" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="160" y="241" class="badge" fill="#A7F3D0" text-anchor="middle">Service Normalization</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 350 205 L 378 205 L 390 205" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  <path d="M 710 205 L 738 205 L 750 205" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
</svg>