<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 370" width="100%" height="100%">
    <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <text x="550" y="32" class="title" font-size="19" text-anchor="middle">Data Platform CI/CD: Automated Quality Gates &amp; Safe Deployment</text>
  <text x="550" y="52" class="subtitle" text-anchor="middle">Git feature branch, pytest suites, SQLFluff linters, ARM/Terraform staging tests, and zero-downtime production release</text>

  <!-- Step 1: Feature Branch & PR -->
  <g transform="translate(30, 75)">
    <rect width="230" height="260" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="230" height="34" rx="10" ry="10" fill="#1E3A8A"/>
    <text x="115" y="22" class="card-title" fill="#93C5FD" text-anchor="middle">1. Git Feature Branch</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#60A5FA">• Developer Workflow:</text>
    <text x="24" y="78" class="card-body">  - Feature branch from main</text>
    <text x="24" y="98" class="card-body">  - Local dev on sample data</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#60A5FA">• Pull Request Created:</text>
    <text x="24" y="146" class="card-body">  - GitHub Actions / Azure DevOps</text>
    <text x="24" y="166" class="card-body">  - Automated pipeline webhook</text>
    <text x="24" y="186" class="card-body">  - Blocks merge until green</text>
    <rect x="16" y="226" width="198" height="22" rx="4" ry="4" fill="#1E293B"/>
    <text x="115" y="241" class="badge" fill="#93C5FD" text-anchor="middle">Version Controlled Code</text>
  </g>

  <!-- Step 2: Quality Gates -->
  <g transform="translate(290, 75)">
    <rect width="250" height="260" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="250" height="34" rx="10" ry="10" fill="#4C1D95"/>
    <text x="125" y="22" class="card-title" fill="#DDD6FE" text-anchor="middle">2. Automated Quality Gates</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#A78BFA">• PySpark Unit Tests:</text>
    <text x="24" y="78" class="card-body">  - pytest suite with mock session</text>
    <text x="24" y="98" class="card-body">  - Chispa DataFrame assertions</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#A78BFA">• Linters &amp; Static Analysis:</text>
    <text x="24" y="146" class="card-body">  - SQLFluff dialect enforcement</text>
    <text x="24" y="166" class="card-body">  - Black &amp; Flake8 Python linting</text>
    <text x="16" y="194" class="card-body" font-weight="600" fill="#A78BFA">• IaC Template Validator:</text>
    <text x="24" y="214" class="card-body">  - ADF ArmTemplateValidator CLI</text>
    <rect x="16" y="226" width="218" height="22" rx="4" ry="4" fill="#1E293B"/>
    <text x="125" y="241" class="badge" fill="#DDD6FE" text-anchor="middle">Pre-Merge Validation</text>
  </g>

  <!-- Step 3: Staging Deploy & Smoke Test -->
  <g transform="translate(570, 75)">
    <rect width="250" height="260" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="250" height="34" rx="10" ry="10" fill="#78350F"/>
    <text x="125" y="22" class="card-title" fill="#FDE68A" text-anchor="middle">3. Staging Deployment</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#FBBF24">• Infrastructure-as-Code:</text>
    <text x="24" y="78" class="card-body">  - Terraform / ARM deployment</text>
    <text x="24" y="98" class="card-body">  - Ephemeral staging resources</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#FBBF24">• End-to-End Smoke Tests:</text>
    <text x="24" y="146" class="card-body">  - Runs sample batch through DAG</text>
    <text x="24" y="166" class="card-body">  - Great Expectations schema check</text>
    <text x="24" y="186" class="card-body">  - Verifies data contract fidelity</text>
    <text x="16" y="214" class="card-body" font-weight="600" fill="#FBBF24">• Peer Review Approval</text>
    <rect x="16" y="226" width="218" height="22" rx="4" ry="4" fill="#1E293B"/>
    <text x="125" y="241" class="badge" fill="#FDE68A" text-anchor="middle">Integration Verification</text>
  </g>

  <!-- Step 4: Automated Prod Deploy -->
  <g transform="translate(850, 75)">
    <rect width="220" height="260" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="220" height="34" rx="10" ry="10" fill="#064E3B"/>
    <text x="110" y="22" class="card-title" fill="#A7F3D0" text-anchor="middle">4. Production Release</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#34D399">• Canary Cutover:</text>
    <text x="24" y="78" class="card-body">  - Blue/Green cluster swap</text>
    <text x="24" y="98" class="card-body">  - 5% shadow execution</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#34D399">• Automated Rollback:</text>
    <text x="24" y="146" class="card-body">  - Delta Lake RESTORE hook</text>
    <text x="24" y="166" class="card-body">  - Triggers on error rate &gt; 0%</text>
    <text x="16" y="194" class="card-body" font-weight="600" fill="#34D399">• Telemetry &amp; Lineage:</text>
    <text x="24" y="214" class="card-body">  - OpenLineage catalog sync</text>
    <rect x="16" y="226" width="188" height="22" rx="4" ry="4" fill="#1E293B"/>
    <text x="110" y="241" class="badge" fill="#A7F3D0" text-anchor="middle">Zero-Downtime Rollout</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 260 205 L 278 205 L 290 205" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <path d="M 540 205 L 558 205 L 570 205" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  <path d="M 820 205 L 838 205 L 850 205" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
</svg>