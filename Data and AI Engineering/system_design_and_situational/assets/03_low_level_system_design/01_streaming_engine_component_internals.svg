<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" width="100%" height="100%">
    <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>
  <rect width="100%" height="100%" fill="url(#bg-grad)"  rx="10" stroke="#1F2937" stroke-width="1.5"/>
  <text x="550" y="32" class="title" font-size="19" text-anchor="middle">Component Internals of a Real-Time Streaming Data Engine</text>
  <text x="550" y="52" class="subtitle" text-anchor="middle">Disruptor ring buffer, partition sorting &amp; spill, embedded RocksDB state store, and Chandy-Lamport checkpointing</text>

  <!-- Tier 1: Ingestion Buffer -->
  <g transform="translate(30, 75)">
    <rect width="240" height="280" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="240" height="34" rx="10" ry="10" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
    <text x="120" y="22" class="card-title" fill="#93C5FD" text-anchor="middle">1. Memory Ingestion Tier</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#60A5FA">• Lock-Free Ring Buffer:</text>
    <text x="24" y="78" class="card-body">  - Disruptor circular array</text>
    <text x="24" y="98" class="card-body">  - Atomic CAS sequence barrier</text>
    <text x="24" y="118" class="card-body">  - Cache-line padding (64 bytes)</text>
    <text x="16" y="146" class="card-body" font-weight="600" fill="#60A5FA">• Backpressure Control:</text>
    <text x="24" y="166" class="card-body">  - Producer rate throttling</text>
    <text x="24" y="186" class="card-body">  - High-watermark drop / pause</text>
    <text x="24" y="206" class="card-body">  - Zero garbage collection load</text>
    <rect x="16" y="244" width="208" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="120" y="259" class="badge" fill="#93C5FD" text-anchor="middle">Disruptor / LMAX Ring</text>
  </g>

  <!-- Tier 2: Partition & Spill -->
  <g transform="translate(300, 75)">
    <rect width="240" height="280" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="240" height="34" rx="10" ry="10" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="120" y="22" class="card-title" fill="#A7F3D0" text-anchor="middle">2. Partition &amp; Spill Manager</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#34D399">• Hash Partitioner:</text>
    <text x="24" y="78" class="card-body">  - MurmurHash3 routing</text>
    <text x="24" y="98" class="card-body">  - Key-based stream fanout</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#34D399">• Sort Buffer &amp; Spiller:</text>
    <text x="24" y="146" class="card-body">  - Radix sort on timestamp</text>
    <text x="24" y="166" class="card-body">  - NVMe spill when buffer &gt; 80%</text>
    <text x="24" y="186" class="card-body">  - External k-way merge sort</text>
    <text x="24" y="206" class="card-body">  - Asynchronous chunk flush</text>
    <rect x="16" y="244" width="208" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="120" y="259" class="badge" fill="#A7F3D0" text-anchor="middle">Local Spill Controller</text>
  </g>

  <!-- Tier 3: State Store Manager -->
  <g transform="translate(570, 75)">
    <rect width="240" height="280" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="240" height="34" rx="10" ry="10" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
    <text x="120" y="22" class="card-title" fill="#FDE68A" text-anchor="middle">3. RocksDB State Store</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#FBBF24">• LSM-Tree Architecture:</text>
    <text x="24" y="78" class="card-body">  - Write-Ahead Log (WAL)</text>
    <text x="24" y="98" class="card-body">  - Active MemTable in memory</text>
    <text x="24" y="118" class="card-body">  - Immutable MemTable flush</text>
    <text x="16" y="146" class="card-body" font-weight="600" fill="#FBBF24">• Compaction &amp; Bloom:</text>
    <text x="24" y="166" class="card-body">  - Leveled SSTable compaction</text>
    <text x="24" y="186" class="card-body">  - Bloom filters prune disk seeks</text>
    <text x="24" y="206" class="card-body">  - LRU block cache optimization</text>
    <rect x="16" y="244" width="208" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="120" y="259" class="badge" fill="#FDE68A" text-anchor="middle">Embedded Key-Value State</text>
  </g>

  <!-- Tier 4: Checkpointing & Sink -->
  <g transform="translate(840, 75)">
    <rect width="230" height="280" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="230" height="34" rx="10" ry="10" fill="#4C1D95" stroke="#8B5CF6" stroke-width="1"/>
    <text x="115" y="22" class="card-title" fill="#DDD6FE" text-anchor="middle">4. Checkpoint &amp; Sink</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#A78BFA">• Chandy-Lamport Barrier:</text>
    <text x="24" y="78" class="card-body">  - Checkpoint barriers in stream</text>
    <text x="24" y="98" class="card-body">  - Non-blocking state snapshot</text>
    <text x="24" y="118" class="card-body">  - Persists offsets to S3/ADLS</text>
    <text x="16" y="146" class="card-body" font-weight="600" fill="#A78BFA">• Idempotent Sink Writer:</text>
    <text x="24" y="166" class="card-body">  - Two-phase commit protocol</text>
    <text x="24" y="186" class="card-body">  - Transactional commit marker</text>
    <text x="24" y="206" class="card-body">  - Exactly-once delivery</text>
    <rect x="16" y="244" width="198" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="115" y="259" class="badge" fill="#DDD6FE" text-anchor="middle">Fault-Tolerant Delivery</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 270 215 L 288 215 L 300 215" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M 540 215 L 558 215 L 570 215" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  <path d="M 810 215 L 828 215 L 840 215" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
</svg>