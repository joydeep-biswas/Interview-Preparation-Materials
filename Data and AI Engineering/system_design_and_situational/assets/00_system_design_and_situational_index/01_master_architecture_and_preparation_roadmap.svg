  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>
  <rect width="100%" height="100%" fill="url(#bg-grad)"  rx="10" stroke="#1F2937" stroke-width="1.5"/>
  <text x="550" y="32" class="title" font-size="19" text-anchor="middle">Data &amp; AI System Design: Master Architecture &amp; Preparation Roadmap</text>
  <text x="550" y="52" class="subtitle" text-anchor="middle">Four-phase curriculum progression from distributed foundations to executive situational governance</text>

  <!-- Pillar 1 -->
  <g transform="translate(30, 75)">
    <rect width="240" height="260" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="240" height="34" rx="10" ry="10" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
    <text x="120" y="22" class="card-title" fill="#93C5FD" text-anchor="middle">Phase 1: Foundations (01)</text>
    <text x="16" y="56" class="card-body" font-weight="600" fill="#60A5FA">• Storage-Compute Disaggregation</text>
    <text x="16" y="78" class="card-body">• Parquet Columnar File Layout</text>
    <text x="16" y="100" class="card-body">• Delta &amp; Iceberg ACID Logs</text>
    <text x="16" y="122" class="card-body">• Spark Catalyst &amp; Shuffle I/O</text>
    <text x="16" y="144" class="card-body">• RocksDB Stream Watermarking</text>
    <text x="16" y="166" class="card-body">• HNSW &amp; IVF-PQ Vector Math</text>
    <text x="16" y="188" class="card-body">• Unity Catalog Governance</text>
    <text x="16" y="210" class="card-body">• Distributed CAP &amp; Consensus</text>
    <rect x="16" y="226" width="208" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="120" y="241" class="badge" fill="#93C5FD" text-anchor="middle">Storage &amp; Engine Mechanics</text>
  </g>

  <!-- Pillar 2 -->
  <g transform="translate(300, 75)">
    <rect width="240" height="260" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="240" height="34" rx="10" ry="10" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="120" y="22" class="card-title" fill="#A7F3D0" text-anchor="middle">Phase 2: High-Level HLD (02)</text>
    <text x="16" y="56" class="card-body" font-weight="600" fill="#34D399">• Enterprise Lakehouse Medallion</text>
    <text x="16" y="78" class="card-body">• Petabyte-Scale Debezium CDC</text>
    <text x="16" y="100" class="card-body">• Sub-Second ClickHouse OLAP</text>
    <text x="16" y="122" class="card-body">• Financial Market Surveillance</text>
    <text x="16" y="144" class="card-body">• Mission-Critical Ledger Lakehouse</text>
    <text x="16" y="166" class="card-body">• Payment Star Schema Model</text>
    <text x="16" y="188" class="card-body">• Enterprise RAG &amp; Vector Index</text>
    <text x="16" y="210" class="card-body">• Real-Time ML Fraud Mesh</text>
    <rect x="16" y="226" width="208" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="120" y="241" class="badge" fill="#A7F3D0" text-anchor="middle">End-to-End System Blueprints</text>
  </g>

  <!-- Pillar 3 -->
  <g transform="translate(570, 75)">
    <rect width="240" height="260" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="240" height="34" rx="10" ry="10" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
    <text x="120" y="22" class="card-title" fill="#FDE68A" text-anchor="middle">Phase 3: Low-Level LLD (03)</text>
    <text x="16" y="56" class="card-body" font-weight="600" fill="#FBBF24">• Lock-Free CAS Ring Buffers</text>
    <text x="16" y="78" class="card-body">• Sliding Window Deduplication</text>
    <text x="16" y="100" class="card-body">• Custom Shuffle Partitioner</text>
    <text x="16" y="122" class="card-body">• Columnar Row-Group Reader</text>
    <text x="16" y="144" class="card-body">• Schema Validator &amp; Dead-Letter</text>
    <text x="16" y="166" class="card-body">• Embedded RocksDB State Store</text>
    <text x="16" y="188" class="card-body">• Chandy-Lamport Checkpointing</text>
    <text x="16" y="210" class="card-body">• Tool Gatekeeper &amp; AI Safety</text>
    <rect x="16" y="226" width="208" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="120" y="241" class="badge" fill="#FDE68A" text-anchor="middle">Component &amp; Memory Internals</text>
  </g>

  <!-- Pillar 4 -->
  <g transform="translate(840, 75)">
    <rect width="240" height="260" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="240" height="34" rx="10" ry="10" fill="#4C1D95" stroke="#8B5CF6" stroke-width="1"/>
    <text x="120" y="22" class="card-title" fill="#DDD6FE" text-anchor="middle">Phase 4: Situational (04)</text>
    <text x="16" y="56" class="card-body" font-weight="600" fill="#A78BFA">• Sev-1 Incident Command</text>
    <text x="16" y="78" class="card-body">• Data Skew OOM Triage</text>
    <text x="16" y="100" class="card-body">• Late-Arriving Event Backfill</text>
    <text x="16" y="122" class="card-body">• Multi-Million Cloud FinOps</text>
    <text x="16" y="144" class="card-body">• Cross-Team Data Contracts</text>
    <text x="16" y="166" class="card-body">• Speed vs Accuracy Tradeoffs</text>
    <text x="16" y="188" class="card-body">• RAG Stale Chunk Mitigation</text>
    <text x="16" y="210" class="card-body">• Azure Modern Data Platform</text>
    <rect x="16" y="226" width="208" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="120" y="241" class="badge" fill="#DDD6FE" text-anchor="middle">Leadership &amp; Incident Triage</text>
  </g>

  <!-- Runway Connectors -->
  <path d="M 270 205 L 288 205 L 300 205" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M 540 205 L 558 205 L 570 205" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  <path d="M 810 205 L 828 205 L 840 205" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
</svg>