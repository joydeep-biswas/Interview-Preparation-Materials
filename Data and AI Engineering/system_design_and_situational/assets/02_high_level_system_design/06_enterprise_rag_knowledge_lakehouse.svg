<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="100%" height="100%">
    <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>
  <rect width="100%" height="100%" fill="url(#bg-grad)"  rx="10" stroke="#1F2937" stroke-width="1.5"/>
  <text x="550" y="32" class="title" font-size="19" text-anchor="middle">Enterprise RAG Knowledge Lakehouse: Hybrid Search &amp; Vector Pipeline</text>
  <text x="550" y="52" class="subtitle" text-anchor="middle">Document chunking, dense HNSW + sparse BM25 retrieval, reciprocal rank fusion, and cross-encoder reranking</text>

  <!-- Document Ingestion -->
  <g transform="translate(30, 75)">
    <rect width="230" height="290" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="230" height="34" rx="10" ry="10" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
    <text x="115" y="22" class="card-title" fill="#93C5FD" text-anchor="middle">1. Document Ingestion</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#60A5FA">• Raw Storage Ingress:</text>
    <text x="24" y="78" class="card-body">  - S3 / Azure ADLS Gen2</text>
    <text x="24" y="98" class="card-body">  - PDFs, DOCX, Markdown, HTML</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#60A5FA">• Layout-Aware Chunking:</text>
    <text x="24" y="146" class="card-body">  - PyMuPDF / Unstructured parser</text>
    <text x="24" y="166" class="card-body">  - Semantic markdown headers</text>
    <text x="24" y="186" class="card-body">  - 512-token chunks, 64 overlap</text>
    <text x="16" y="214" class="card-body" font-weight="600" fill="#60A5FA">• MinHash Deduplication:</text>
    <text x="24" y="234" class="card-body">  - Eliminates verbatim duplicates</text>
    <rect x="16" y="254" width="198" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="115" y="269" class="badge" fill="#93C5FD" text-anchor="middle">Airflow ETL Pipelines</text>
  </g>

  <!-- Embedding & Graph -->
  <g transform="translate(290, 75)">
    <rect width="235" height="290" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="235" height="34" rx="10" ry="10" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="117" y="22" class="card-title" fill="#A7F3D0" text-anchor="middle">2. Embedding &amp; Index</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#34D399">• Dense Embedding Model:</text>
    <text x="24" y="78" class="card-body">  - text-embedding-3-large (1536d)</text>
    <text x="24" y="98" class="card-body">  - Vectorized GPU batch inference</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#34D399">• Vector Database (Milvus):</text>
    <text x="24" y="146" class="card-body">  - HNSW Graph Index (M=16)</text>
    <text x="24" y="166" class="card-body">  - IVF-PQ memory quantization</text>
    <text x="16" y="194" class="card-body" font-weight="600" fill="#34D399">• Knowledge Graph Link:</text>
    <text x="24" y="214" class="card-body">  - Neo4j entity graph mapping</text>
    <text x="24" y="234" class="card-body">  - Disambiguates domain concepts</text>
    <rect x="16" y="254" width="203" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="117" y="269" class="badge" fill="#A7F3D0" text-anchor="middle">Vector &amp; Graph Storage</text>
  </g>

  <!-- Hybrid Retrieval -->
  <g transform="translate(555, 75)">
    <rect width="240" height="290" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="240" height="34" rx="10" ry="10" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
    <text x="120" y="22" class="card-title" fill="#FDE68A" text-anchor="middle">3. Hybrid Retrieval</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#FBBF24">• Two-Way Search:</text>
    <text x="24" y="78" class="card-body">  - Dense: Top-50 vector cosine</text>
    <text x="24" y="98" class="card-body">  - Sparse: Top-50 BM25 keywords</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#FBBF24">• Fusion &amp; Reranking:</text>
    <text x="24" y="146" class="card-body">  - Reciprocal Rank Fusion (RRF)</text>
    <text x="24" y="166" class="card-body">  - Cohere / BGE Cross-Encoder</text>
    <text x="24" y="186" class="card-body">  - Prunes to Top-5 high relevance</text>
    <text x="16" y="214" class="card-body" font-weight="600" fill="#FBBF24">• ACL Metadata Filter:</text>
    <text x="24" y="234" class="card-body">  - User tenant security check</text>
    <rect x="16" y="254" width="208" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="120" y="269" class="badge" fill="#FDE68A" text-anchor="middle">Sub-50ms Reranking</text>
  </g>

  <!-- LLM & Guardrails -->
  <g transform="translate(825, 75)">
    <rect width="245" height="290" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="245" height="34" rx="10" ry="10" fill="#4C1D95" stroke="#8B5CF6" stroke-width="1"/>
    <text x="122" y="22" class="card-title" fill="#DDD6FE" text-anchor="middle">4. LLM &amp; Guardrails</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#A78BFA">• Prompt Assembly:</text>
    <text x="24" y="78" class="card-body">  - Injects top-5 verified chunks</text>
    <text x="24" y="98" class="card-body">  - Citation anchor references</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#A78BFA">• Enterprise Guardrails:</text>
    <text x="24" y="146" class="card-body">  - PII redaction (Presidio)</text>
    <text x="24" y="166" class="card-body">  - Hallucination detector (SelfCheck)</text>
    <text x="24" y="186" class="card-body">  - Prompt injection shield</text>
    <text x="16" y="214" class="card-body" font-weight="600" fill="#A78BFA">• Streaming Response:</text>
    <text x="24" y="234" class="card-body">  - SSE token streaming to client</text>
    <rect x="16" y="254" width="213" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="122" y="269" class="badge" fill="#DDD6FE" text-anchor="middle">Safe Generation</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 260 220 L 278 220 L 290 220" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M 525 220 L 543 220 L 555 220" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  <path d="M 795 220 L 813 220 L 825 220" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
</svg>