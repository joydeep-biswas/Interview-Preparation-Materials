<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="100%" height="100%">
    <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <text x="550" y="32" class="title" font-size="19" text-anchor="middle">Petabyte-Scale Change Data Capture (CDC): Debezium + Kafka + Delta Lake</text>
  <text x="550" y="52" class="subtitle" text-anchor="middle">Zero-loss WAL replication, key-based partitioning, micro-batch streaming, and idempotent MERGE INTO</text>

  <!-- Step 1: Postgres Source -->
  <g transform="translate(30, 75)">
    <rect width="190" height="265" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="190" height="34" rx="10" ry="10" fill="#1E3A8A"/>
    <text x="95" y="22" class="card-title" fill="#93C5FD" text-anchor="middle">1. PostgreSQL Primary</text>
    <text x="14" y="60" class="card-body" font-weight="600" fill="#60A5FA">• WAL Replication Log:</text>
    <text x="18" y="80" class="card-body">  - pgoutput logical decode</text>
    <text x="18" y="100" class="card-body">  - Zero query overhead</text>
    <text x="14" y="130" class="card-body" font-weight="600" fill="#60A5FA">• Debezium Connector:</text>
    <text x="18" y="150" class="card-body">  - Kafka Connect cluster</text>
    <text x="18" y="170" class="card-body">  - Captures INSERT, UPDATE,</text>
    <text x="18" y="190" class="card-body">    DELETE with before/after</text>
    <text x="18" y="210" class="card-body">  - Tracks transaction LSN</text>
    <rect x="14" y="230" width="162" height="22" rx="4" ry="4" fill="#1E293B"/>
    <text x="95" y="245" class="badge" fill="#93C5FD" text-anchor="middle">Source OLTP Engine</text>
  </g>

  <!-- Step 2: Kafka CDC Topic -->
  <g transform="translate(250, 75)">
    <rect width="190" height="265" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="190" height="34" rx="10" ry="10" fill="#064E3B"/>
    <text x="95" y="22" class="card-title" fill="#A7F3D0" text-anchor="middle">2. Kafka CDC Spine</text>
    <text x="14" y="60" class="card-body" font-weight="600" fill="#34D399">• Topic: orders.cdc</text>
    <text x="18" y="80" class="card-body">  - Key: order_id (hash)</text>
    <text x="18" y="100" class="card-body">  - Guarantees per-key order</text>
    <text x="14" y="130" class="card-body" font-weight="600" fill="#34D399">• Buffer &amp; Compact:</text>
    <text x="18" y="150" class="card-body">  - 256 partitions</text>
    <text x="18" y="170" class="card-body">  - Log compaction enabled</text>
    <text x="18" y="190" class="card-body">  - Absorbs traffic spikes</text>
    <text x="18" y="210" class="card-body">  - Prevents backpressure</text>
    <rect x="14" y="230" width="162" height="22" rx="4" ry="4" fill="#1E293B"/>
    <text x="95" y="245" class="badge" fill="#A7F3D0" text-anchor="middle">Partitioned Event Stream</text>
  </g>

  <!-- Step 3: Spark Streaming -->
  <g transform="translate(470, 75)">
    <rect width="195" height="265" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="195" height="34" rx="10" ry="10" fill="#78350F"/>
    <text x="97" y="22" class="card-title" fill="#FDE68A" text-anchor="middle">3. Spark Streaming</text>
    <text x="14" y="60" class="card-body" font-weight="600" fill="#FBBF24">• Structured Streaming:</text>
    <text x="18" y="80" class="card-body">  - Micro-batch trigger: 30s</text>
    <text x="18" y="100" class="card-body">  - RocksDB state provider</text>
    <text x="14" y="130" class="card-body" font-weight="600" fill="#FBBF24">• Deduplication:</text>
    <text x="18" y="150" class="card-body">  - Watermark: 10 mins</text>
    <text x="18" y="170" class="card-body">  - Deduplicate by (id, LSN)</text>
    <text x="18" y="190" class="card-body">  - Eliminates out-of-order</text>
    <text x="18" y="210" class="card-body">  - Micro-batch compaction</text>
    <rect x="14" y="230" width="167" height="22" rx="4" ry="4" fill="#1E293B"/>
    <text x="97" y="245" class="badge" fill="#FDE68A" text-anchor="middle">Distributed Engine</text>
  </g>

  <!-- Step 4: Delta Lake Silver -->
  <g transform="translate(695, 75)">
    <rect width="185" height="265" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="185" height="34" rx="10" ry="10" fill="#4C1D95"/>
    <text x="92" y="22" class="card-title" fill="#DDD6FE" text-anchor="middle">4. Delta Silver</text>
    <text x="14" y="60" class="card-body" font-weight="600" fill="#A78BFA">• MERGE INTO Table:</text>
    <text x="18" y="80" class="card-body">  - Matches on order_id</text>
    <text x="18" y="100" class="card-body">  - WHEN MATCHED UPDATE</text>
    <text x="18" y="120" class="card-body">  - WHEN NOT MATCHED INSERT</text>
    <text x="14" y="150" class="card-body" font-weight="600" fill="#A78BFA">• ACID Invariants:</text>
    <text x="18" y="170" class="card-body">  - Serializable isolation</text>
    <text x="18" y="190" class="card-body">  - Exact replica of OLTP</text>
    <text x="18" y="210" class="card-body">  - Time travel audit enabled</text>
    <rect x="14" y="230" width="157" height="22" rx="4" ry="4" fill="#1E293B"/>
    <text x="92" y="245" class="badge" fill="#DDD6FE" text-anchor="middle">ACID Lakehouse Table</text>
  </g>

  <!-- Step 5: Gold & Serving -->
  <g transform="translate(910, 75)">
    <rect width="160" height="265" rx="10" ry="10" fill="#111827" stroke="#EC4899" stroke-width="2"/>
    <rect width="160" height="34" rx="10" ry="10" fill="#831843"/>
    <text x="80" y="22" class="card-title" fill="#FBCFE8" text-anchor="middle">5. Gold &amp; BI</text>
    <text x="12" y="60" class="card-body" font-weight="600" fill="#F472B6">• Aggregated Marts:</text>
    <text x="16" y="80" class="card-body">  - Z-Order clustering</text>
    <text x="16" y="100" class="card-body">  - Hourly revenue</text>
    <text x="16" y="120" class="card-body">  - User cohorts</text>
    <text x="12" y="150" class="card-body" font-weight="600" fill="#F472B6">• Downstream:</text>
    <text x="16" y="170" class="card-body">  - Real-time dashboards</text>
    <text x="16" y="190" class="card-body">  - Machine learning</text>
    <text x="16" y="210" class="card-body">  - Reverse ETL sinks</text>
    <rect x="12" y="230" width="136" height="22" rx="4" ry="4" fill="#1E293B"/>
    <text x="80" y="245" class="badge" fill="#FBCFE8" text-anchor="middle">Business Layer</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 220 205 L 238 205 L 250 205" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M 440 205 L 458 205 L 470 205" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  <path d="M 665 205 L 683 205 L 695 205" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <path d="M 880 205 L 898 205 L 910 205" fill="none" stroke="#EF4444" stroke-width="2.5" marker-end="url(#arrow-red)"/>
</svg>