<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="100%" height="100%">
    <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>
  <rect width="100%" height="100%" fill="url(#bg-grad)"  rx="10" stroke="#1F2937" stroke-width="1.5"/>
  <text x="550" y="32" class="title" font-size="19" text-anchor="middle">Mission-Critical Financial Ledger &amp; Regulatory Snapshot Lakehouse</text>
  <text x="550" y="52" class="subtitle" text-anchor="middle">Zero-loss ingestion, double-entry balancing validation, immutable Delta Lake time-travel, and regulatory audit</text>

  <!-- Ledger Sources -->
  <g transform="translate(30, 75)">
    <rect width="230" height="290" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="230" height="34" rx="10" ry="10" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
    <text x="115" y="22" class="card-title" fill="#93C5FD" text-anchor="middle">1. Core Banking Ledgers</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#60A5FA">• Transaction Sources:</text>
    <text x="24" y="78" class="card-body">  - Core Banking (IBM DB2 CDC)</text>
    <text x="24" y="98" class="card-body">  - Payment Processing (Kafka)</text>
    <text x="24" y="118" class="card-body">  - Foreign Exchange (Postgres CDC)</text>
    <text x="16" y="146" class="card-body" font-weight="600" fill="#60A5FA">• Zero-Loss Ingress Tier:</text>
    <text x="24" y="166" class="card-body">  - Transactional spooler buffer</text>
    <text x="24" y="186" class="card-body">  - Exactly-once producer semantics</text>
    <text x="24" y="206" class="card-body">  - Hash-chain tamper sealing</text>
    <rect x="16" y="254" width="198" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="115" y="269" class="badge" fill="#93C5FD" text-anchor="middle">Mission-Critical Ledgers</text>
  </g>

  <!-- Double-Entry Engine -->
  <g transform="translate(290, 75)">
    <rect width="235" height="290" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="235" height="34" rx="10" ry="10" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="117" y="22" class="card-title" fill="#A7F3D0" text-anchor="middle">2. Double-Entry Validation</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#34D399">• Accounting Invariants:</text>
    <text x="24" y="78" class="card-body">  - Sum(Debits) == Sum(Credits)</text>
    <text x="24" y="98" class="card-body">  - Verified per transaction UUID</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#34D399">• Streaming Reconciler:</text>
    <text x="24" y="146" class="card-body">  - Flink streaming rule engine</text>
    <text x="24" y="166" class="card-body">  - Detects unposted adjustments</text>
    <text x="24" y="186" class="card-body">  - Instant isolation of imbalances</text>
    <text x="16" y="214" class="card-body" font-weight="600" fill="#34D399">• Dead-Letter Quarantine:</text>
    <text x="24" y="234" class="card-body">  - Route skewed records to DLQ</text>
    <rect x="16" y="254" width="203" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="117" y="269" class="badge" fill="#A7F3D0" text-anchor="middle">Integrity Verification</text>
  </g>

  <!-- Medallion Storage -->
  <g transform="translate(555, 75)">
    <rect width="240" height="290" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="240" height="34" rx="10" ry="10" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
    <text x="120" y="22" class="card-title" fill="#FDE68A" text-anchor="middle">3. Delta Lake Storage</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#FBBF24">• Immutable Append Log:</text>
    <text x="24" y="78" class="card-body">  - Object-level WORM storage</text>
    <text x="24" y="98" class="card-body">  - No updates or in-place edits</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#FBBF24">• Time-Travel Snapshots:</text>
    <text x="24" y="146" class="card-body">  - Delta Lake ACID commit log</text>
    <text x="24" y="166" class="card-body">  - Query exact state as of</text>
    <text x="24" y="186" class="card-body">    any past millisecond</text>
    <text x="16" y="214" class="card-body" font-weight="600" fill="#FBBF24">• Z-Order Indexing:</text>
    <text x="24" y="234" class="card-body">  - Clustered by (AccountID, Date)</text>
    <rect x="16" y="254" width="208" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="120" y="269" class="badge" fill="#FDE68A" text-anchor="middle">Immutable Historical Log</text>
  </g>

  <!-- Regulatory & Audit -->
  <g transform="translate(825, 75)">
    <rect width="245" height="290" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="245" height="34" rx="10" ry="10" fill="#4C1D95" stroke="#8B5CF6" stroke-width="1"/>
    <text x="122" y="22" class="card-title" fill="#DDD6FE" text-anchor="middle">4. Regulatory &amp; Audit</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#A78BFA">• Compliance Reporting:</text>
    <text x="24" y="78" class="card-body">  - Basel III liquidity assertions</text>
    <text x="24" y="98" class="card-body">  - FINRA / SEC ledger audits</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#A78BFA">• End-of-Day Attestation:</text>
    <text x="24" y="146" class="card-body">  - Cryptographic state snapshot</text>
    <text x="24" y="166" class="card-body">  - CFO balance sheet sign-off</text>
    <text x="16" y="194" class="card-body" font-weight="600" fill="#A78BFA">• Trino / StarRocks Serving:</text>
    <text x="24" y="214" class="card-body">  - Sub-second balance inquiries</text>
    <rect x="16" y="254" width="213" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="122" y="269" class="badge" fill="#DDD6FE" text-anchor="middle">Audit &amp; Reporting</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 260 220 L 278 220 L 290 220" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M 525 220 L 543 220 L 555 220" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  <path d="M 795 220 L 813 220 L 825 220" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
</svg>