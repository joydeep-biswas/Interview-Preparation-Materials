<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="100%" height="100%">
    <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>
  <rect width="100%" height="100%" fill="url(#bg-grad)"  rx="10" stroke="#1F2937" stroke-width="1.5"/>
  <text x="550" y="32" class="title" font-size="19" text-anchor="middle">Real-Time Fraud Detection ML Mesh: Online &amp; Offline Feature Store</text>
  <text x="550" y="52" class="subtitle" text-anchor="middle">Dual-tier feature store architecture, low-latency scoring, streaming telemetry logging, and automated drift retraining</text>

  <!-- Live Scoring -->
  <g transform="translate(30, 75)">
    <rect width="230" height="290" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="230" height="34" rx="10" ry="10" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
    <text x="115" y="22" class="card-title" fill="#93C5FD" text-anchor="middle">1. Live Scoring Service</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#60A5FA">• Ingress Transaction:</text>
    <text x="24" y="78" class="card-body">  - Card swipe / Payment webhook</text>
    <text x="24" y="98" class="card-body">  - SLA: &lt; 25ms total response</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#60A5FA">• Model Inference:</text>
    <text x="24" y="146" class="card-body">  - XGBoost / LightGBM ONNX</text>
    <text x="24" y="166" class="card-body">  - Fetches online features</text>
    <text x="24" y="186" class="card-body">  - Emits Approve / Decline score</text>
    <text x="16" y="214" class="card-body" font-weight="600" fill="#60A5FA">• Telemetry Logger:</text>
    <text x="24" y="234" class="card-body">  - Emits inference log to Kafka</text>
    <rect x="16" y="254" width="198" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="115" y="269" class="badge" fill="#93C5FD" text-anchor="middle">Ultra-Low Latency Edge</text>
  </g>

  <!-- Online Feature Store -->
  <g transform="translate(290, 75)">
    <rect width="235" height="290" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="235" height="34" rx="10" ry="10" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="117" y="22" class="card-title" fill="#A7F3D0" text-anchor="middle">2. Online Feature Store</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#34D399">• In-Memory Redis Cluster:</text>
    <text x="24" y="78" class="card-body">  - P99 read latency &lt; 2ms</text>
    <text x="24" y="98" class="card-body">  - Hash map feature entities</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#34D399">• Streaming Aggregations:</text>
    <text x="24" y="146" class="card-body">  - Flink continuous windows:</text>
    <text x="24" y="166" class="card-body">    * tx_count_10m</text>
    <text x="24" y="186" class="card-body">    * distinct_devices_24h</text>
    <text x="24" y="206" class="card-body">    * avg_amount_vs_historical</text>
    <rect x="16" y="254" width="203" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="117" y="269" class="badge" fill="#A7F3D0" text-anchor="middle">Redis / Dragonfly</text>
  </g>

  <!-- Offline Feature Store -->
  <g transform="translate(555, 75)">
    <rect width="240" height="290" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="240" height="34" rx="10" ry="10" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
    <text x="120" y="22" class="card-title" fill="#FDE68A" text-anchor="middle">3. Offline Lakehouse Store</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#FBBF24">• Delta Lake / Feast Store:</text>
    <text x="24" y="78" class="card-body">  - Petabyte historical table</text>
    <text x="24" y="98" class="card-body">  - Point-in-time correct joins</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#FBBF24">• Time-Travel Training:</text>
    <text x="24" y="146" class="card-body">  - As-of joins eliminate</text>
    <text x="24" y="166" class="card-body">    future-data leakage</text>
    <text x="24" y="186" class="card-body">  - Ground truth fraud labels</text>
    <text x="16" y="214" class="card-body" font-weight="600" fill="#FBBF24">• Automated Sync:</text>
    <text x="24" y="234" class="card-body">  - Spark offline-to-online sync</text>
    <rect x="16" y="254" width="208" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="120" y="269" class="badge" fill="#FDE68A" text-anchor="middle">ACID Parquet Storage</text>
  </g>

  <!-- Drift & Retraining -->
  <g transform="translate(825, 75)">
    <rect width="245" height="290" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="245" height="34" rx="10" ry="10" fill="#4C1D95" stroke="#8B5CF6" stroke-width="1"/>
    <text x="122" y="22" class="card-title" fill="#DDD6FE" text-anchor="middle">4. Drift &amp; Retraining</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#A78BFA">• Drift Monitoring (Evidently):</text>
    <text x="24" y="78" class="card-body">  - Kolmogorov-Smirnov (KS) test</text>
    <text x="24" y="98" class="card-body">  - Population Stability Index (PSI)</text>
    <text x="24" y="118" class="card-body">  - Feature distribution shift</text>
    <text x="16" y="146" class="card-body" font-weight="600" fill="#A78BFA">• Automated Retraining:</text>
    <text x="24" y="166" class="card-body">  - Airflow triggers MLflow run</text>
    <text x="24" y="186" class="card-body">  - Canary champion/challenger</text>
    <text x="24" y="206" class="card-body">  - Zero-downtime model swap</text>
    <rect x="16" y="254" width="213" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="122" y="269" class="badge" fill="#DDD6FE" text-anchor="middle">MLOps Continuous Loop</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <!-- Live to Online Feature (Two way or fetch) -->
  <path d="M 260 140 L 278 140 L 290 140" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M 525 220 L 543 220 L 555 220" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  <path d="M 795 220 L 813 220 L 825 220" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
</svg>