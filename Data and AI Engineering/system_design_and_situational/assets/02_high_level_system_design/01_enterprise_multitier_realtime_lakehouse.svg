<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 400" width="100%" height="100%">
    <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>
  <rect width="100%" height="100%" fill="url(#bg-grad)"  rx="10" stroke="#1F2937" stroke-width="1.5"/>
  <text x="570" y="32" class="title" font-size="19" text-anchor="middle">Enterprise Multi-Tier Real-Time Data &amp; AI Lakehouse Architecture</text>
  <text x="570" y="52" class="subtitle" text-anchor="middle">End-to-end flow from heterogeneous ingestion to Medallion ACID Lakehouse and sub-second serving</text>

  <!-- Ingestion Gateways -->
  <g transform="translate(30, 75)">
    <rect width="245" height="290" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="245" height="34" rx="10" ry="10" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
    <text x="122" y="22" class="card-title" fill="#93C5FD" text-anchor="middle">1. Ingestion Gateways</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#60A5FA">• Operational OLTP DBs:</text>
    <text x="24" y="78" class="card-body">  - PostgreSQL / MySQL CDC</text>
    <text x="24" y="98" class="card-body">  - Debezium WAL streaming</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#60A5FA">• Event Telemetry:</text>
    <text x="24" y="146" class="card-body">  - 10M+ events/sec clickstream</text>
    <text x="24" y="166" class="card-body">  - IoT / Mobile telemetry beacons</text>
    <text x="16" y="194" class="card-body" font-weight="600" fill="#60A5FA">• Financial Market Feeds:</text>
    <text x="24" y="214" class="card-body">  - NASDAQ ITCH / FIX 4.4 feeds</text>
    <text x="24" y="234" class="card-body">  - Hardware timestamp ingress</text>
    <rect x="16" y="254" width="213" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="122" y="269" class="badge" fill="#93C5FD" text-anchor="middle">Heterogeneous Data Sources</text>
  </g>

  <!-- Ingress Commit Log -->
  <g transform="translate(310, 75)">
    <rect width="245" height="290" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="245" height="34" rx="10" ry="10" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="122" y="22" class="card-title" fill="#A7F3D0" text-anchor="middle">2. Real-Time Event Log</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#34D399">• Apache Kafka / Redpanda:</text>
    <text x="24" y="78" class="card-body">  - Distributed append-only log</text>
    <text x="24" y="98" class="card-body">  - Partitioned by Entity ID</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#34D399">• Strict Guarantees:</text>
    <text x="24" y="146" class="card-body">  - ack=all replication</text>
    <text x="24" y="166" class="card-body">  - Zero data loss invariant</text>
    <text x="24" y="186" class="card-body">  - 7-day retention backpressure</text>
    <text x="16" y="214" class="card-body" font-weight="600" fill="#34D399">• Schema Registry:</text>
    <text x="24" y="234" class="card-body">  - Confluent / Apicurio Avro</text>
    <rect x="16" y="254" width="213" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="122" y="269" class="badge" fill="#A7F3D0" text-anchor="middle">Persistent Message Spine</text>
  </g>

  <!-- Processing & Medallion -->
  <g transform="translate(590, 75)">
    <rect width="245" height="290" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="245" height="34" rx="10" ry="10" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
    <text x="122" y="22" class="card-title" fill="#FDE68A" text-anchor="middle">3. Medallion Lakehouse</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#FBBF24">• Bronze Storage:</text>
    <text x="24" y="78" class="card-body">  - Raw immutable append log</text>
    <text x="16" y="106" class="card-body" font-weight="600" fill="#FBBF24">• Silver (Spark / Flink):</text>
    <text x="24" y="126" class="card-body">  - Delta Lake / Iceberg ACID</text>
    <text x="24" y="146" class="card-body">  - Exactly-once MERGE &amp; dedup</text>
    <text x="16" y="174" class="card-body" font-weight="600" fill="#FBBF24">• Gold Aggregations:</text>
    <text x="24" y="194" class="card-body">  - Business-level star schemas</text>
    <text x="24" y="214" class="card-body">  - Z-Order / Liquid clustering</text>
    <rect x="16" y="254" width="213" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="122" y="269" class="badge" fill="#FDE68A" text-anchor="middle">Delta / Iceberg Storage</text>
  </g>

  <!-- Serving & Governance -->
  <g transform="translate(870, 75)">
    <rect width="240" height="290" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="240" height="34" rx="10" ry="10" fill="#4C1D95" stroke="#8B5CF6" stroke-width="1"/>
    <text x="120" y="22" class="card-title" fill="#DDD6FE" text-anchor="middle">4. Serving &amp; AI Tier</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#A78BFA">• Real-Time OLAP:</text>
    <text x="24" y="78" class="card-body">  - ClickHouse / StarRocks</text>
    <text x="24" y="98" class="card-body">  - Sub-second analytical queries</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#A78BFA">• Interactive SQL:</text>
    <text x="24" y="146" class="card-body">  - Trino federated engine</text>
    <text x="16" y="174" class="card-body" font-weight="600" fill="#A78BFA">• AI &amp; Feature Serving:</text>
    <text x="24" y="194" class="card-body">  - Feast / Hopsworks Store</text>
    <text x="24" y="214" class="card-body">  - Vector DB &amp; GenAI agents</text>
    <rect x="16" y="254" width="208" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="120" y="269" class="badge" fill="#DDD6FE" text-anchor="middle">Enterprise Consumption</text>
  </g>

  <!-- Runway Connectors -->
  <path d="M 275 220 L 298 220 L 310 220" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M 555 220 L 578 220 L 590 220" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  <path d="M 835 220 L 858 220 L 870 220" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
</svg>