<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Step 1: Unity Catalog -->
  <rect x="30" y="55" width="200" height="110" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="130" y="82" class="title-txt" text-anchor="middle" fill="#C084FC">Unity Catalog Governance</text>
  <text x="42" y="108" class="body-txt" text-anchor="start">• Central RBAC engine</text>
  <text x="42" y="126" class="body-txt" text-anchor="start">• Grants storage access</text>
  <text x="42" y="144" class="mono-txt" text-anchor="start">CREATE STORAGE CREDENTIAL</text>

  <path d="M 230 110 L 270 110" fill="none" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- Step 2: Storage Credential -->
  <rect x="270" y="55" width="200" height="110" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="370" y="82" class="title-txt" text-anchor="middle">Storage Credential</text>
  <text x="282" y="108" class="body-txt" text-anchor="start">• Azure Managed Identity</text>
  <text x="282" y="126" class="body-txt" text-anchor="start">• AWS IAM Instance Role</text>
  <text x="282" y="144" class="badge-txt" fill="#38BDF8">✓ Zero Hardcoded Keys</text>

  <path d="M 470 110 L 510 110" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Step 3: External Location -->
  <rect x="510" y="55" width="210" height="110" rx="10" ry="10" fill="#111827" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="615" y="82" class="title-txt" text-anchor="middle">External Location</text>
  <text x="522" y="108" class="mono-txt" text-anchor="start">abfss://container@account</text>
  <text x="522" y="126" class="mono-txt" text-anchor="start">.dfs.core.windows.net/path</text>
  <text x="522" y="144" class="body-txt" text-anchor="start">• Associates URI with creds</text>

  <path d="M 720 110 L 760 110" fill="none" stroke="#06B6D4" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Step 4: Managed / External Table -->
  <rect x="760" y="55" width="170" height="110" rx="10" ry="10" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="845" y="82" class="title-txt" text-anchor="middle" fill="#A7F3D0">Delta Lake Table</text>
  <text x="772" y="108" class="body-txt" text-anchor="start">• Managed or External</text>
  <text x="772" y="126" class="mono-txt" text-anchor="start">sales_orders_delta</text>
  <text x="772" y="144" class="badge-txt" fill="#10B981">✓ Fully Governed</text>
</svg>