<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1120" height="520" rx="10" fill="url(#bg)"/>
  <rect width="1120" height="520" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="560" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">Unity Catalog 3-Level Namespace &amp; Governance Architecture</text>
  <text x="560" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">Centralized cross-workspace governance: Metastore -&gt; Catalog -&gt; Schema -&gt; Managed Tables, Volumes &amp; Views</text>

  <!-- Tier 1: Unity Catalog Metastore Root -->
  <rect x="40" y="85" width="1040" height="65" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <text x="560" y="112" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="middle">UNITY CATALOG METASTORE (ROOT ACCOUNT GOVERNANCE LAYER)</text>
  <text x="560" y="132" font-size="10" fill="#CBD5E1" text-anchor="middle">One central metastore per cloud region. Shared across all workspaces in your cloud tenant.</text>

  <!-- Tier 2: Catalogs -->
  <rect x="40" y="165" width="510" height="75" rx="6" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="55" y="187" font-size="11" font-weight="700" fill="#C084FC" text-anchor="start">Catalog 1: dev_catalog (Sandbox / Lower Env)</text>
  <text x="55" y="205" font-size="9.5" fill="#CBD5E1" text-anchor="start">• Isolated environment for developers &amp; data scientists</text>
  <text x="55" y="222" font-size="9" fill="#94A3B8" text-anchor="start">• Bound to Dev Storage Container</text>

  <rect x="570" y="165" width="510" height="75" rx="6" fill="#064E3B" fill-opacity="0.2" stroke="#34D399" stroke-width="1.5"/>
  <text x="585" y="187" font-size="11" font-weight="700" fill="#34D399" text-anchor="start">Catalog 2: prod_catalog (Governed Enterprise Production)</text>
  <text x="585" y="205" font-size="9.5" fill="#CBD5E1" text-anchor="start">• Certified production assets, strict RBAC, automated lineage</text>
  <text x="585" y="222" font-size="9" fill="#A7F3D0" text-anchor="start">• Bound to Secure Production Storage Container</text>

  <line x1="295" y1="150" x2="295" y2="165" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arr-p)"/>
  <line x1="825" y1="150" x2="825" y2="165" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- Tier 3: Schemas inside prod_catalog -->
  <rect x="570" y="255" width="245" height="70" rx="6" fill="#0F172A" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="585" y="277" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="start">Schema 1: sales_schema</text>
  <text x="585" y="295" font-size="9.5" fill="#CBD5E1" text-anchor="start">• Sales &amp; e-commerce domain</text>
  <text x="585" y="310" font-size="9" fill="#94A3B8" text-anchor="start">Managed by Data Engineering</text>

  <rect x="835" y="255" width="245" height="70" rx="6" fill="#0F172A" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="850" y="277" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="start">Schema 2: hr_schema</text>
  <text x="850" y="295" font-size="9.5" fill="#CBD5E1" text-anchor="start">• People &amp; payroll domain</text>
  <text x="850" y="310" font-size="9" fill="#94A3B8" text-anchor="start">Restricted PII access policies</text>

  <line x1="692" y1="240" x2="692" y2="255" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#arr-a)"/>
  <line x1="957" y1="240" x2="957" y2="255" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#arr-a)"/>

  <!-- Tier 4: Securable Data Assets inside sales_schema -->
  <rect x="40" y="340" width="1040" height="125" rx="8" fill="#1E293B" fill-opacity="0.6" stroke="#34D399" stroke-width="1.5"/>
  <text x="560" y="360" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">SECURABLE ASSETS (3RD LEVEL: catalog.schema.asset)</text>

  <!-- Asset 1: Managed Table -->
  <rect x="55" y="375" width="310" height="75" rx="6" fill="#0F172A" stroke="#34D399" stroke-width="1.5"/>
  <text x="70" y="397" font-size="10.5" font-weight="700" fill="#34D399" text-anchor="start">Managed Table: fact_orders</text>
  <text x="70" y="415" font-size="9" font-family="monospace" fill="#A7F3D0" text-anchor="start">SELECT * FROM prod_catalog.sales_schema.fact_orders</text>
  <text x="70" y="432" font-size="9" fill="#CBD5E1" text-anchor="start">Databricks manages lifecycle: DROP TABLE deletes data files.</text>

  <!-- Asset 2: Unity Catalog Volumes -->
  <rect x="390" y="375" width="330" height="75" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="405" y="397" font-size="10.5" font-weight="700" fill="#38BDF8" text-anchor="start">Volume: /Volumes/.../raw_landing</text>
  <text x="405" y="415" font-size="9" font-family="monospace" fill="#93C5FD" text-anchor="start">/Volumes/prod_catalog/sales_schema/raw_landing/invoice.pdf</text>
  <text x="405" y="432" font-size="9" fill="#CBD5E1" text-anchor="start">Governed storage for non-tabular files (PDFs, images, audio, ZIPs).</text>

  <!-- Asset 3: Dynamic Views -->
  <rect x="745" y="375" width="320" height="75" rx="6" fill="#0F172A" stroke="#C084FC" stroke-width="1.5"/>
  <text x="760" y="397" font-size="10.5" font-weight="700" fill="#C084FC" text-anchor="start">Dynamic View: vw_vip_customers</text>
  <text x="760" y="415" font-size="9" font-family="monospace" fill="#E9D5FF" text-anchor="start">CASE WHEN is_member('sales_mgr') THEN ssn ELSE '***' END</text>
  <text x="760" y="432" font-size="9" fill="#CBD5E1" text-anchor="start">Column-level masking &amp; row-level security filtering on-the-fly!</text>

  <path d="M 692.0 325.0 L 692.0 328.8 Q 692.0 332.5 688.2 332.5 L 563.8 332.5 Q 560.0 332.5 560.0 336.2 L 560.0 340.0" fill="none" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- Bottom Invariant -->
  <rect x="40" y="480" width="1040" height="26" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="560" y="497" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Unity Catalog Invariant: Every securable object is addressed via the standardized 3-level namespace (catalog.schema.table_or_volume) with cross-workspace identity and fine-grained column masking.</text>
</svg>