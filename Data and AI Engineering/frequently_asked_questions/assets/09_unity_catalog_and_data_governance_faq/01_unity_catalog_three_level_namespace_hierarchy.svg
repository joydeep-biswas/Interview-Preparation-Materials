<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19"/>

  <!-- Account Metastore -->
  <rect x="330" y="20" width="300" height="60" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="480" y="45" class="title-txt" text-anchor="middle">Databricks Account Metastore</text>
  <text x="480" y="65" class="sub-txt" text-anchor="middle">Central cross-workspace governance root</text>

  <!-- Connect to Catalogs -->
  <path d="M 480 80 L 480 115" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M 480 95 L 180 95 Q 165 95 165 105 L 165 115" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M 480 95 L 780 95 Q 795 95 795 105 L 795 115" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Catalogs Tier -->
  <rect x="70" y="115" width="190" height="65" rx="8" ry="8" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="165" y="140" class="title-txt" text-anchor="middle">dev_catalog</text>
  <text x="165" y="160" class="sub-txt" text-anchor="middle">Sandbox Workspace</text>

  <rect x="385" y="115" width="190" height="65" rx="8" ry="8" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="480" y="140" class="title-txt" text-anchor="middle">test_catalog</text>
  <text x="480" y="160" class="sub-txt" text-anchor="middle">Integration Testing</text>

  <rect x="700" y="115" width="190" height="65" rx="8" ry="8" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="795" y="140" class="title-txt" text-anchor="middle" fill="#93C5FD">prod_catalog</text>
  <text x="795" y="160" class="sub-txt" text-anchor="middle">Production Analytics</text>

  <!-- Connect ProdCat down to Schemas -->
  <path d="M 795 180 L 795 200 Q 795 210 780 210 L 480 210 Q 465 210 465 220 L 465 230" fill="none" stroke="#06B6D4" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M 780 210 L 165 210 Q 150 210 150 220 L 150 230" fill="none" stroke="#06B6D4" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M 780 210 L 795 210 L 795 230" fill="none" stroke="#06B6D4" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Schemas Tier -->
  <rect x="60" y="230" width="180" height="55" rx="8" ry="8" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="150" y="253" class="title-txt" text-anchor="middle">bronze</text>
  <text x="150" y="271" class="sub-txt" text-anchor="middle">Raw Ingestion Delta</text>

  <rect x="375" y="230" width="180" height="55" rx="8" ry="8" fill="#111827" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="465" y="253" class="title-txt" text-anchor="middle">silver</text>
  <text x="465" y="271" class="sub-txt" text-anchor="middle">Curated &amp; Cleansed</text>

  <rect x="705" y="230" width="180" height="55" rx="8" ry="8" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="795" y="253" class="title-txt" text-anchor="middle" fill="#10B981">gold</text>
  <text x="795" y="271" class="sub-txt" text-anchor="middle">Business Data Marts</text>

  <!-- Connect Gold down to Objects -->
  <path d="M 750 285 L 750 305 Q 750 315 735 315 L 680 315 L 680 325" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M 840 285 L 840 305 Q 840 315 855 315 L 900 315 L 900 325" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Objects Tier -->
  <rect x="560" y="325" width="220" height="45" rx="6" ry="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="670" y="352" class="title-txt" text-anchor="middle" fill="#A7F3D0">fact_daily_revenue (Table)</text>

  <rect x="800" y="325" width="200" height="45" rx="6" ry="6" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="900" y="352" class="title-txt" text-anchor="middle">v_masked_customer (View)</text>
</svg>