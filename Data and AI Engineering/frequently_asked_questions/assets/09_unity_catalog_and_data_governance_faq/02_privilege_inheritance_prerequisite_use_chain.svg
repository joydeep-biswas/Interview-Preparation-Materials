<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19"/>

  <!-- Step 1: USE CATALOG -->
  <rect x="30" y="60" width="200" height="95" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="130" y="86" class="title-txt" text-anchor="middle">1. GRANT USE CATALOG</text>
  <text x="42" y="112" class="mono-txt" text-anchor="start">ON CATALOG prod</text>
  <text x="42" y="132" class="body-txt" text-anchor="start">• Enables traversal into</text>
  <text x="42" y="148" class="body-txt" text-anchor="start">  catalog namespace</text>

  <path d="M 230 107 L 270 107" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Step 2: USE SCHEMA -->
  <rect x="270" y="60" width="200" height="95" rx="10" ry="10" fill="#111827" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="370" y="86" class="title-txt" text-anchor="middle">2. GRANT USE SCHEMA</text>
  <text x="282" y="112" class="mono-txt" text-anchor="start">ON SCHEMA prod.gold</text>
  <text x="282" y="132" class="body-txt" text-anchor="start">• Enables traversal into</text>
  <text x="282" y="148" class="body-txt" text-anchor="start">  schema namespace</text>

  <path d="M 470 107 L 510 107" fill="none" stroke="#06B6D4" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Step 3: SELECT ON TABLE -->
  <rect x="510" y="60" width="200" height="95" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="610" y="86" class="title-txt" text-anchor="middle">3. GRANT SELECT</text>
  <text x="522" y="112" class="mono-txt" text-anchor="start">ON TABLE prod.gold.sales</text>
  <text x="522" y="132" class="body-txt" text-anchor="start">• Explicit read privilege</text>
  <text x="522" y="148" class="body-txt" text-anchor="start">  on underlying table</text>

  <path d="M 710 107 L 750 107" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Success Outcome -->
  <rect x="750" y="60" width="180" height="95" rx="10" ry="10" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="840" y="86" class="title-txt" text-anchor="middle" fill="#A7F3D0">Query Authorized!</text>
  <text x="762" y="112" class="badge-txt" fill="#10B981">✓ All 3 Grants Satisfied</text>
  <text x="762" y="132" class="body-txt" text-anchor="start">• User reads partitions</text>
  <text x="762" y="148" class="body-txt" text-anchor="start">• Zero permission denial</text>
</svg>