<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 220" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .card { fill: #111827; stroke-width: 1.5; rx: 10; ry: 10; }
      .card-blue { stroke: #3B82F6; }
      .card-amber { stroke: #F59E0B; }
      .card-green { stroke: #10B981; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #F3F4F6; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #9CA3AF; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
      .edge-amber { stroke: #F59E0B; }
      .edge-green { stroke: #10B981; }
    </style>
    <marker id="arr-a13" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-g13" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <text x="530" y="32" class="title-text">Aggregation Pipeline: GROUP BY, HAVING Gate &amp; Window Ranking</text>

  <!-- Step 1 -->
  <rect x="25" y="65" width="180" height="120" class="card card-blue"/>
  <text x="115" y="92" class="card-title" fill="#93C5FD">1. Raw Trips Table</text>
  <text x="35" y="117" class="card-body">• Millions of rides</text>
  <text x="35" y="137" class="card-body">• driver_id, rating</text>
  <text x="35" y="157" class="card-body">• trip_timestamp</text>

  <!-- Step 2 -->
  <rect x="235" y="65" width="185" height="120" class="card card-amber"/>
  <text x="327" y="92" class="card-title" fill="#FDE68A">2. GROUP BY driver</text>
  <text x="245" y="117" class="card-body">• Bucket by driver_id</text>
  <text x="245" y="137" class="card-body">• COUNT(*) as total_trips</text>
  <text x="245" y="157" class="card-body">• AVG(rating) as score</text>

  <!-- Step 3 -->
  <rect x="450" y="65" width="180" height="120" class="card card-amber"/>
  <text x="540" y="92" class="card-title" fill="#FDE68A">3. HAVING Gate</text>
  <text x="460" y="117" class="card-body">• Filter: trips &gt; 100</text>
  <text x="460" y="137" class="card-body">• Eliminates noisy samples</text>
  <text x="460" y="157" class="card-body">• High statistical power</text>

  <!-- Step 4 -->
  <rect x="660" y="65" width="185" height="120" class="card card-green"/>
  <text x="752" y="92" class="card-title" fill="#6EE7B7">4. DENSE_RANK()</text>
  <text x="670" y="117" class="card-body">• Rank by AVG(rating)</text>
  <text x="670" y="137" class="card-body">• Handles ties cleanly</text>
  <text x="670" y="157" class="card-body">• Evaluated over groups</text>

  <!-- Step 5 -->
  <rect x="875" y="65" width="160" height="120" class="card card-green"/>
  <text x="955" y="92" class="card-title" fill="#6EE7B7">5. Top 3 Output</text>
  <text x="885" y="117" class="card-body" fill="#34D399">• WHERE rank &lt;= 3</text>
  <text x="885" y="137" class="card-body">• Top 3 Drivers</text>
  <text x="885" y="157" class="card-body">• Emitted to client</text>

  <!-- Straight Horizontal Connectors -->
  <path fill="none" d="M 205 125 L 235 125" class="edge edge-amber" marker-end="url(#arr-a13)"/>
  <path fill="none" d="M 420 125 L 450 125" class="edge edge-amber" marker-end="url(#arr-a13)"/>
  <path fill="none" d="M 630 125 L 660 125" class="edge edge-green" marker-end="url(#arr-g13)"/>
  <path fill="none" d="M 845 125 L 875 125" class="edge edge-green" marker-end="url(#arr-g13)"/>
</svg>
