<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .card { fill: #111827; stroke-width: 1.5; rx: 10; ry: 10; }
      .card-blue { stroke: #3B82F6; }
      .card-red { stroke: #EF4444; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #F3F4F6; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #9CA3AF; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
      .edge-blue { stroke: #3B82F6; }
      .edge-red { stroke: #EF4444; }
      .edge-dashed { stroke-dasharray: 5 4; }
      .edge-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; text-anchor: middle; }
    </style>
    <marker id="arr-b4" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-r4" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <text x="440" y="32" class="title-text">Cyclic Graph Loop Hazard: Runaway Recursive CTE Prevention</text>

  <!-- Node A -->
  <rect x="40" y="70" width="200" height="110" class="card card-blue"/>
  <text x="140" y="98" class="card-title" fill="#93C5FD">Employee A</text>
  <text x="55" y="123" class="card-body">• ID: 101</text>
  <text x="55" y="143" class="card-body">• Title: Software Engineer</text>
  <text x="55" y="163" class="card-body">• manager_id: 102</text>

  <!-- Node B -->
  <rect x="340" y="70" width="200" height="110" class="card card-blue"/>
  <text x="440" y="98" class="card-title" fill="#93C5FD">Manager B</text>
  <text x="355" y="123" class="card-body">• ID: 102</text>
  <text x="355" y="143" class="card-body">• Title: Engineering Manager</text>
  <text x="355" y="163" class="card-body">• manager_id: 103</text>

  <!-- Node C -->
  <rect x="640" y="70" width="200" height="110" class="card card-red"/>
  <text x="740" y="98" class="card-title" fill="#FCA5A5">Director C (Data Bug)</text>
  <text x="655" y="123" class="card-body">• ID: 103</text>
  <text x="655" y="143" class="card-body">• Title: VP Engineering</text>
  <text x="655" y="163" class="card-body" fill="#EF4444">• manager_id: 101 (CYCLE!)</text>

  <!-- Forward edges (straight horizontal with generous 100px runways & padded badges) -->
  <path fill="none" d="M 240 125 L 340 125" class="edge edge-blue" marker-end="url(#arr-b4)"/>
  <rect x="250" y="113" width="80" height="24" rx="4" fill="#0B132B" stroke="#3B82F6" stroke-width="1" />
  <text x="290" y="129" class="edge-label" font-size="10" font-weight="600" fill="#93C5FD">reports_to</text>

  <path fill="none" d="M 540 125 L 640 125" class="edge edge-blue" marker-end="url(#arr-b4)"/>
  <rect x="550" y="113" width="80" height="24" rx="4" fill="#0B132B" stroke="#3B82F6" stroke-width="1" />
  <text x="590" y="129" class="edge-label" font-size="10" font-weight="600" fill="#93C5FD">reports_to</text>

  <!-- Return Cycle Edge: curved bottom loop with straight arrival runway and flush connection -->
  <path fill="none" d="M 740 180 L 740 200 C 740 290, 140 290, 140 200 L 140 180" class="edge edge-red edge-dashed" marker-end="url(#arr-r4)"/>

  <!-- High-visibility cycle hazard pill badge (masks underlying dashed line with dark fill) -->
  <rect x="150" y="250" width="580" height="30" rx="6" fill="#0B0F19" stroke="#EF4444" stroke-width="1.5" />
  <text x="440" y="269" class="edge-label" font-size="11" font-weight="700" fill="#FCA5A5">⚠️ CYCLE DETECTED: Runaway Recursion without CYCLE clause / path tracking</text>
</svg>
