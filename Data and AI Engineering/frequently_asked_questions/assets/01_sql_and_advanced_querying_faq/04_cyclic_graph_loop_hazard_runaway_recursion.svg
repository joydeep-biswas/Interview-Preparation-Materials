<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .card { fill: #111827; stroke-width: 1.5; rx: 10; ry: 10; }
      .card-blue { stroke: #3B82F6; }
      .card-red { stroke: #EF4444; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #F3F4F6; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #9CA3AF; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
      .edge-blue { stroke: #3B82F6; }
      .edge-red { stroke: #EF4444; }
      .edge-dashed { stroke-dasharray: 4 4; }
      .edge-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; text-anchor: middle; }
    </style>
    <marker id="arr-b4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-r4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <text x="430" y="32" class="title-text">Cyclic Graph Loop Hazard: Runaway Recursive CTE Prevention</text>

  <!-- Node A -->
  <rect x="40" y="70" width="220" height="110" class="card card-blue"/>
  <text x="150" y="98" class="card-title" fill="#93C5FD">Employee A</text>
  <text x="55" y="123" class="card-body">• ID: 101</text>
  <text x="55" y="143" class="card-body">• Title: Software Engineer</text>
  <text x="55" y="163" class="card-body">• manager_id: 102</text>

  <!-- Node B -->
  <rect x="320" y="70" width="220" height="110" class="card card-blue"/>
  <text x="430" y="98" class="card-title" fill="#93C5FD">Manager B</text>
  <text x="335" y="123" class="card-body">• ID: 102</text>
  <text x="335" y="143" class="card-body">• Title: Engineering Manager</text>
  <text x="335" y="163" class="card-body">• manager_id: 103</text>

  <!-- Node C -->
  <rect x="600" y="70" width="220" height="110" class="card card-red"/>
  <text x="710" y="98" class="card-title" fill="#FCA5A5">Director C (Data Bug)</text>
  <text x="615" y="123" class="card-body">• ID: 103</text>
  <text x="615" y="143" class="card-body">• Title: VP Engineering</text>
  <text x="615" y="163" class="card-body" fill="#EF4444">• manager_id: 101 (CYCLE!)</text>

  <!-- Forward edges (straight horizontal) -->
  <path fill="none" d="M 260 125 L 320 125" class="edge edge-blue" marker-end="url(#arr-b4)"/>
  <path fill="none" d="M 540 125 L 600 125" class="edge edge-blue" marker-end="url(#arr-b4)"/>

  <!-- Return Cycle Edge: curved bottom loop with straight runways -->
  <!-- Exit C bottom at 710,180 -> curve down -> enter A bottom at 150,180 with straight runway dy>=14 -->
  <path fill="none" d="M 710 180 C 710 260, 150 260, 150 196 L 150 180" class="edge edge-red edge-dashed" marker-end="url(#arr-r4)"/>
  <text x="430" y="245" class="edge-label" fill="#EF4444">CYCLE DETECTED: Stack Overflow without CYCLE clause / array path tracking</text>
</svg>
