<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .card { fill: #111827; stroke-width: 1.5; rx: 10; ry: 10; }
      .card-blue { stroke: #3B82F6; }
      .card-amber { stroke: #F59E0B; }
      .card-red { stroke: #EF4444; }
      .card-green { stroke: #10B981; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #F3F4F6; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #9CA3AF; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
      .edge-blue { stroke: #3B82F6; }
      .edge-red { stroke: #EF4444; }
      .edge-green { stroke: #10B981; }
      .edge-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
    </style>
    <marker id="arr-b10" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-r10" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-g10" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <text x="460" y="32" class="title-text">Duplicate Email Detection: Hash Aggregate &amp; HAVING Filter</text>

  <!-- Person Records -->
  <rect x="40" y="90" width="220" height="120" class="card card-blue"/>
  <text x="150" y="118" class="card-title" fill="#93C5FD">Person Records</text>
  <text x="55" y="143" class="card-body">• (1, 'a@b.com')</text>
  <text x="55" y="163" class="card-body">• (2, 'c@d.com')</text>
  <text x="55" y="183" class="card-body">• (3, 'a@b.com') [Dupe]</text>

  <!-- Hash Group -->
  <rect x="330" y="90" width="230" height="120" class="card card-amber"/>
  <text x="445" y="118" class="card-title" fill="#FDE68A">Hash Aggregate</text>
  <text x="345" y="143" class="card-body">• Hash Table on Email</text>
  <text x="345" y="163" class="card-body">• 'a@b.com' -> count = 2</text>
  <text x="345" y="183" class="card-body">• 'c@d.com' -> count = 1</text>

  <!-- Output 1: Duplicates -->
  <rect x="630" y="60" width="250" height="85" class="card card-red"/>
  <text x="755" y="85" class="card-title" fill="#FCA5A5">Duplicate Emails (Flagged)</text>
  <text x="645" y="110" class="card-body">• 'a@b.com' (count = 2)</text>
  <text x="645" y="128" class="card-body">• Emitted to result set</text>

  <!-- Output 2: Unique Discarded -->
  <rect x="630" y="175" width="250" height="85" class="card card-green"/>
  <text x="755" y="200" class="card-title" fill="#6EE7B7">Unique Emails (Discarded)</text>
  <text x="645" y="225" class="card-body">• 'c@d.com' (count = 1)</text>
  <text x="645" y="243" class="card-body">• Pruned by HAVING filter</text>

  <!-- Connectors with straight runways -->
  <path fill="none" d="M 260 150 L 330 150" class="edge edge-blue" marker-end="url(#arr-b10)"/>

  <!-- Hash to Duplicates: exit 560,150 -> curve -> enter 630,102 with runway dx>=14 -->
  <path fill="none" d="M 560 150 C 585 150, 595 102, 616 102 L 630 102" class="edge edge-red" marker-end="url(#arr-r10)"/>
  <text x="590" y="115" class="edge-label" fill="#EF4444">&gt; 1</text>

  <!-- Hash to Unique: exit 560,150 -> curve -> enter 630,217 with runway dx>=14 -->
  <path fill="none" d="M 560 150 C 585 150, 595 217, 616 217 L 630 217" class="edge edge-green" marker-end="url(#arr-g10)"/>
  <text x="590" y="200" class="edge-label" fill="#6EE7B7">= 1</text>
</svg>
