<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 440" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .group-box { fill: #111827; stroke-width: 2; rx: 10; ry: 10; }
      .card { fill: #1E293B; stroke-width: 1.5; rx: 8; ry: 8; }
      .card-blue { stroke: #3B82F6; }
      .card-gray { stroke: #64748B; }
      .card-amber { stroke: #F59E0B; }
      .card-green { stroke: #10B981; }
      .card-red { stroke: #EF4444; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #F3F4F6; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #9CA3AF; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
      .edge-blue { stroke: #3B82F6; }
      .edge-gray { stroke: #64748B; }
      .edge-green { stroke: #10B981; }
      .edge-red { stroke: #EF4444; }
    </style>
    <marker id="arr-b6" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-s6" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
    <marker id="arr-g6" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-r6" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <!-- Left: Step 1 FULL OUTER JOIN Evaluation -->
  <rect x="25" y="25" width="310" height="390" class="group-box" stroke="#3B82F6"/>
  <text x="180" y="55" class="title-text" fill="#60A5FA">Step 1: FULL OUTER Evaluation</text>

  <rect x="45" y="80" width="270" height="85" class="card card-blue"/>
  <text x="180" y="105" class="card-title" fill="#93C5FD">Unmatched Left (A - B)</text>
  <text x="60" y="130" class="card-body">• Left row present</text>
  <text x="60" y="148" class="card-body">• Right columns NULL</text>

  <rect x="45" y="180" width="270" height="85" class="card card-gray"/>
  <text x="180" y="205" class="card-title" fill="#CBD5E1">Matched Center (A ∩ B)</text>
  <text x="60" y="230" class="card-body">• Keys equal on both sides</text>
  <text x="60" y="248" class="card-body">• Inner join match</text>

  <rect x="45" y="280" width="270" height="85" class="card card-blue"/>
  <text x="180" y="305" class="card-title" fill="#93C5FD">Unmatched Right (B - A)</text>
  <text x="60" y="330" class="card-body">• Left columns NULL</text>
  <text x="60" y="348" class="card-body">• Right row present</text>

  <!-- Center: Filter Gate -->
  <rect x="390" y="145" width="260" height="140" class="card card-amber"/>
  <text x="520" y="175" class="card-title" fill="#FDE68A">Exclusion Filter Gate</text>
  <text x="410" y="205" class="card-body" font-family="monospace">WHERE a.id IS NULL</text>
  <text x="410" y="225" class="card-body" font-family="monospace">   OR b.id IS NULL</text>
  <text x="410" y="255" class="card-body">• Enforces Anti-Join logic</text>

  <!-- Right Top: Emitted Symmetric Diff -->
  <rect x="710" y="65" width="280" height="130" class="card card-green"/>
  <text x="850" y="95" class="card-title" fill="#6EE7B7">Step 2: Symmetric Diff (A △ B)</text>
  <text x="725" y="125" class="card-body">• Left Anti-Join Partition (A - B)</text>
  <text x="725" y="145" class="card-body">• Right Anti-Join Partition (B - A)</text>
  <text x="725" y="165" class="card-body" fill="#34D399">• Returns exactly isolated differences</text>

  <!-- Right Bottom: Discard Sink -->
  <rect x="710" y="240" width="280" height="130" class="card card-red"/>
  <text x="850" y="270" class="card-title" fill="#FCA5A5">Pruned Intersection Stream</text>
  <text x="725" y="300" class="card-body">• Matched rows (A ∩ B) dropped</text>
  <text x="725" y="320" class="card-body">• Both keys non-null -> Fails predicate</text>
  <text x="725" y="340" class="card-body">• Pruned from final result</text>

  <!-- Connectors with straight runways & matching color markers -->
  <!-- Left top to Gate: exit 315,122 -> curve -> enter 390,180 with runway dx>=14 -->
  <path fill="none" d="M 315 122 L 329 122 C 349 122, 356 180, 374 180 L 390 180" class="edge edge-blue" marker-end="url(#arr-b6)"/>

  <!-- Left center to Gate: exit 315,222 -> horizontal straight to 390,222 with matching gray marker arr-s6 -->
  <path fill="none" d="M 315 222 L 390 222" class="edge edge-gray" marker-end="url(#arr-s6)"/>

  <!-- Left bottom to Gate: exit 315,322 -> curve -> enter 390,250 with runway dx>=14 -->
  <path fill="none" d="M 315 322 L 329 322 C 349 322, 356 250, 374 250 L 390 250" class="edge edge-blue" marker-end="url(#arr-b6)"/>

  <!-- Gate to Emitted Diff: exit 650,180 -> curve -> enter 710,130 with runway dx>=14 -->
  <path fill="none" d="M 650 180 L 664 180 C 679 180, 686 130, 696 130 L 710 130" class="edge edge-green" marker-end="url(#arr-g6)"/>

  <!-- Gate to Discard Sink: exit 650,240 -> curve -> enter 710,305 with runway dx>=14 -->
  <path fill="none" d="M 650 240 L 664 240 C 679 240, 686 305, 696 305 L 710 305" class="edge edge-red" marker-end="url(#arr-r6)"/>
</svg>
