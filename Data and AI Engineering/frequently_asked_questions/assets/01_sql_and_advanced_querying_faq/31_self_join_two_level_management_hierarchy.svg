<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 380" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .pillar-box { fill: #111827; stroke-width: 2; rx: 10; ry: 10; }
      .card { fill: #1E293B; stroke-width: 1.5; rx: 8; ry: 8; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94A3B8; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
      .edge-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; text-anchor: middle; fill: #CBD5E1; }
    </style>
    <marker id="arr-b31" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g31" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <rect x="25" y="25" width="1010" height="330" class="pillar-box" stroke="#3B82F6"/>
  <text x="530" y="55" class="title-text" fill="#60A5FA">Two-Hop Self-Join Organizational Hierarchy (e $\to$ m $\to$ mm)</text>

  <!-- Step 1: Base Employee e -->
  <rect x="50" y="90" width="240" height="230" class="card" stroke="#3B82F6"/>
  <text x="170" y="120" class="card-title" fill="#93C5FD">1. Base Employee (e)</text>
  <text x="70" y="155" class="card-body" fill="#F8FAFC">emp_id: 101</text>
  <text x="70" y="180" class="card-body" fill="#F8FAFC">emp_name: 'Alice'</text>
  <text x="70" y="205" class="card-body" fill="#60A5FA">mgr_id: 102</text>
  <text x="70" y="245" class="card-body" fill="#94A3B8">• Leaf node in hierarchy</text>
  <text x="70" y="270" class="card-body" fill="#94A3B8">• Initiates self-join</text>

  <!-- Edge 1: e -> m -->
  <path d="M 290 190 L 370 190" class="edge" stroke="#3B82F6" marker-end="url(#arr-b31)"/>
  <text x="330" y="175" class="edge-label">LEFT JOIN</text>
  <text x="330" y="210" class="edge-label" fill="#60A5FA">e.mgr_id = m.emp_id</text>

  <!-- Step 2: Direct Manager m -->
  <rect x="380" y="90" width="260" height="230" class="card" stroke="#F59E0B"/>
  <text x="510" y="120" class="card-title" fill="#FCD34D">2. Direct Manager (m)</text>
  <text x="400" y="155" class="card-body" fill="#F8FAFC">emp_id: 102 (Matches Alice's mgr_id)</text>
  <text x="400" y="180" class="card-body" fill="#F8FAFC">emp_name: 'Bob'</text>
  <text x="400" y="205" class="card-body" fill="#F59E0B">mgr_id: 103</text>
  <text x="400" y="245" class="card-body" fill="#94A3B8">• Direct supervisor</text>
  <text x="400" y="270" class="card-body" fill="#94A3B8">• Bridges to executive layer</text>

  <!-- Edge 2: m -> mm -->
  <path d="M 640 190 L 720 190" class="edge" stroke="#10B981" marker-end="url(#arr-g31)"/>
  <text x="680" y="175" class="edge-label">LEFT JOIN</text>
  <text x="680" y="210" class="edge-label" fill="#34D399">m.mgr_id = mm.emp_id</text>

  <!-- Step 3: Manager's Manager mm -->
  <rect x="730" y="90" width="275" height="230" class="card" stroke="#10B981"/>
  <text x="867" y="120" class="card-title" fill="#34D399">3. Manager's Manager (mm)</text>
  <text x="750" y="155" class="card-body" fill="#F8FAFC">emp_id: 103 (Matches Bob's mgr_id)</text>
  <text x="750" y="180" class="card-body" fill="#F8FAFC">emp_name: 'Carol' (VP / Director)</text>
  <text x="750" y="205" class="card-body" fill="#EF4444">mgr_id: NULL (CEO / Root Node)</text>
  <text x="750" y="245" class="card-body" fill="#34D399">• Two levels above Alice</text>
  <text x="750" y="270" class="card-body" fill="#94A3B8">• NULL if direct mgr is CEO</text>
</svg>

