<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 400" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .pillar-box { fill: #111827; stroke-width: 2; rx: 10; ry: 10; }
      .card { fill: #1E293B; stroke-width: 1.5; rx: 8; ry: 8; }
      .card-blue { stroke: #3B82F6; }
      .card-amber { stroke: #F59E0B; }
      .card-green { stroke: #10B981; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #F3F4F6; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #9CA3AF; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
      .edge-blue { stroke: #3B82F6; }
      .edge-amber { stroke: #F59E0B; }
      .edge-green { stroke: #10B981; }
      .edge-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-weight: 700; text-anchor: middle; }
    </style>
    <marker id="arr-b22" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-a22" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-g22" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <!-- Col 1: Analysis Pipeline -->
  <rect x="25" y="25" width="310" height="350" class="pillar-box" stroke="#3B82F6"/>
  <text x="180" y="52" class="title-text" fill="#60A5FA">1. Analysis Pipeline</text>

  <!-- Step 1: EXPLAIN ANALYZE -->
  <rect x="45" y="75" width="270" height="110" class="card card-blue"/>
  <text x="180" y="100" class="card-title" fill="#93C5FD">EXPLAIN (ANALYZE, BUFFERS)</text>
  <text x="60" y="123" class="card-body">• Execution time vs planner estimates</text>
  <text x="60" y="141" class="card-body">• Buffer reads: shared hit vs read blocks</text>
  <text x="60" y="159" class="card-body">• Pinpoints slow nested loops &amp; scans</text>

  <!-- Step 2: Buffer Hit & I/O -->
  <rect x="45" y="220" width="270" height="110" class="card card-blue"/>
  <text x="180" y="245" class="card-title" fill="#93C5FD">Buffer &amp; I/O Profiling</text>
  <text x="60" y="268" class="card-body">• Cache hit ratio = hit / (hit + read)</text>
  <text x="60" y="286" class="card-body">• &lt; 99% hit ratio: table exceeds RAM</text>
  <text x="60" y="304" class="card-body">• Confirms cold cache or memory pressure</text>

  <!-- Pipeline internal connector -->
  <path fill="none" d="M 180 185 L 180 220" class="edge edge-blue" marker-end="url(#arr-b22)"/>

  <!-- Col 2: Diagnostic Decision Tree -->
  <rect x="375" y="25" width="310" height="350" class="pillar-box" stroke="#F59E0B"/>
  <text x="530" y="52" class="title-text" fill="#FDE68A">2. Diagnostic Decision Tree</text>

  <!-- Gate 1: Seq Scan Check -->
  <rect x="395" y="75" width="270" height="95" class="card card-amber"/>
  <text x="530" y="100" class="card-title" fill="#FDE68A">Decision 1: Seq Scan on Large Table?</text>
  <text x="410" y="123" class="card-body">• Inspect node: "Seq Scan on table_name"</text>
  <text x="410" y="141" class="card-body">• Rows filtered: thousands to millions</text>
  <text x="410" y="159" class="card-body" fill="#FCA5A5">• Cause: Missing index on WHERE filter</text>

  <!-- Gate 2: Stale Stats Check -->
  <rect x="395" y="220" width="270" height="95" class="card card-amber"/>
  <text x="530" y="245" class="card-title" fill="#FDE68A">Decision 2: Stale Statistics Discrepancy?</text>
  <text x="410" y="268" class="card-body">• Check: Actual rows vs Estimated rows</text>
  <text x="410" y="286" class="card-body">• Ratio discrepancy &gt; 10x - 1000x</text>
  <text x="410" y="304" class="card-body" fill="#FCA5A5">• Cause: Outdated MCV / optimizer blindness</text>

  <!-- Pipeline to Decision Tree connector -->
  <path fill="none" d="M 315 125 L 395 125" class="edge edge-blue" marker-end="url(#arr-b22)"/>

  <!-- Gate 1 to Gate 2 connector with centered 'No' badge -->
  <path fill="none" d="M 530 170 L 530 220" class="edge edge-amber" marker-end="url(#arr-a22)"/>
  <rect x="508" y="184" width="44" height="20" rx="4" fill="#0B0F19" stroke="#F59E0B" stroke-width="1.2" />
  <text x="530" y="198" class="edge-label" font-size="10" fill="#FDE68A">No</text>

  <!-- Col 3: Remediation Strategies -->
  <rect x="760" y="25" width="375" height="350" class="pillar-box" stroke="#10B981"/>
  <text x="947.5" y="52" class="title-text" fill="#6EE7B7">3. Remediation Strategies</text>

  <!-- Fix 1: Missing Index -->
  <rect x="780" y="65" width="335" height="80" class="card card-green"/>
  <text x="947.5" y="89" class="card-title" fill="#6EE7B7">Fix 1: CREATE INDEX CONCURRENTLY</text>
  <text x="795" y="111" class="card-body">• Add B-tree / BRIN index on filter predicate columns</text>
  <text x="795" y="129" class="card-body">• Eliminates full sequential scans; O(log N) point lookups</text>

  <!-- Fix 2: Stale Stats -->
  <rect x="780" y="160" width="335" height="80" class="card card-green"/>
  <text x="947.5" y="184" class="card-title" fill="#6EE7B7">Fix 2: Run ANALYZE (Refresh Stats)</text>
  <text x="795" y="206" class="card-body">• Recalculate histograms &amp; MCV (Most Common Values)</text>
  <text x="795" y="224" class="card-body">• Corrects optimizer join algorithms &amp; row estimates</text>

  <!-- Fix 3: Query Rewrite & Memory -->
  <rect x="780" y="255" width="335" height="85" class="card card-amber"/>
  <text x="947.5" y="279" class="card-title" fill="#FDE68A">Fix 3: Query Rewrite &amp; work_mem</text>
  <text x="795" y="301" class="card-body">• Increase work_mem to eliminate Hash/Sort disk spill</text>
  <text x="795" y="319" class="card-body">• Rewrite correlated subqueries &amp; force CTE materialization</text>

  <!-- Remediation Connectors with PERFECTLY ALIGNED Edge Labels at x=722.5 -->
  <!-- Branch 1: Gate 1 -> Fix 1 -->
  <path fill="none" d="M 665 105 L 780 105" class="edge edge-green" marker-end="url(#arr-g22)"/>
  <rect x="670" y="93" width="95" height="24" rx="4" fill="#0B0F19" stroke="#10B981" stroke-width="1.2" />
  <text x="717.5" y="109" class="edge-label" fill="#6EE7B7">Yes (Index)</text>

  <!-- Branch 2: Gate 2 -> Fix 2 -->
  <path fill="none" d="M 665 200 L 780 200" class="edge edge-green" marker-end="url(#arr-g22)"/>
  <rect x="670" y="188" width="95" height="24" rx="4" fill="#0B0F19" stroke="#10B981" stroke-width="1.2" />
  <text x="717.5" y="204" class="edge-label" fill="#6EE7B7">Yes (Stats)</text>

  <!-- Branch 3: Gate 2 -> Fix 3 -->
  <path fill="none" d="M 665 285 L 685 285 C 715 285, 735 297.5, 755 297.5 L 780 297.5" class="edge edge-amber" marker-end="url(#arr-a22)"/>
  <rect x="670" y="285.5" width="95" height="24" rx="4" fill="#0B0F19" stroke="#F59E0B" stroke-width="1.2" />
  <text x="717.5" y="301.5" class="edge-label" fill="#FDE68A">No (Spill)</text>
</svg>
