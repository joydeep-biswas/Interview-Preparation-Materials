<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 380" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .card { fill: #111827; stroke-width: 1.5; rx: 10; ry: 10; }
      .card-blue { stroke: #3B82F6; }
      .card-purple { stroke: #8B5CF6; }
      .card-amber { stroke: #F59E0B; }
      .card-green { stroke: #10B981; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #F3F4F6; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #9CA3AF; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
      .edge-purple { stroke: #8B5CF6; }
      .edge-amber { stroke: #F59E0B; }
      .edge-green { stroke: #10B981; }
    </style>
    <marker id="arr-p24" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-a24" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-g24" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <text x="510" y="32" class="title-text">Ranking Functions Comparison: ROW_NUMBER vs RANK vs DENSE_RANK</text>

  <!-- Left: Source Salaries -->
  <rect x="40" y="90" width="260" height="200" class="card card-blue"/>
  <text x="170" y="120" class="card-title" fill="#93C5FD">Engineering Salaries</text>
  <text x="55" y="150" class="card-body">• Alice: $150,000</text>
  <text x="55" y="175" class="card-body">• Bob: $120,000</text>
  <text x="55" y="200" class="card-body" fill="#FDE68A">• Charlie: $120,000 (Tie with Bob)</text>
  <text x="55" y="225" class="card-body">• David: $100,000</text>
  <text x="55" y="250" class="card-body">• Eve: $90,000</text>

  <!-- Right Top: ROW_NUMBER -->
  <rect x="400" y="60" width="580" height="85" class="card card-purple"/>
  <text x="690" y="85" class="card-title" fill="#D8B4FE">ROW_NUMBER() : Strict Ordinal (1, 2, 3, 4, 5)</text>
  <text x="415" y="110" class="card-body">• Alice: 1 | Bob: 2 | Charlie: 3 | David: 4 | Eve: 5</text>
  <text x="415" y="128" class="card-body">• Arbitrary tie-breaking (non-deterministic without tie-breaker column)</text>

  <!-- Right Middle: RANK -->
  <rect x="400" y="160" width="580" height="85" class="card card-amber"/>
  <text x="690" y="185" class="card-title" fill="#FDE68A">RANK() : Ties Share Rank + GAPS (1, 2, 2, 4, 5)</text>
  <text x="415" y="210" class="card-body">• Alice: 1 | Bob: 2 | Charlie: 2 | David: 4 (Skips 3!) | Eve: 5</text>
  <text x="415" y="228" class="card-body" fill="#FCA5A5">• Rank 3 is skipped due to 2-way tie at rank 2</text>

  <!-- Right Bottom: DENSE_RANK -->
  <rect x="400" y="260" width="580" height="85" class="card card-green"/>
  <text x="690" y="285" class="card-title" fill="#6EE7B7">DENSE_RANK() : Ties Share Rank + NO GAPS (1, 2, 2, 3, 4)</text>
  <text x="415" y="310" class="card-body">• Alice: 1 | Bob: 2 | Charlie: 2 | David: 3 (Next consecutive!) | Eve: 4</text>
  <text x="415" y="328" class="card-body" fill="#34D399">• Always recommended for "Nth Highest" salary problems</text>

  <!-- Connectors with straight runways -->
  <!-- Source to ROW_NUMBER: exit 300,190 -> curve -> enter 400,102 with runway dx>=14 -->
  <path fill="none" d="M 300 190 C 340 190, 360 102, 386 102 L 400 102" class="edge edge-purple" marker-end="url(#arr-p24)"/>

  <!-- Source to RANK: exit 300,190 -> curve -> enter 400,202 with runway dx>=14 -->
  <path fill="none" d="M 300 190 C 340 190, 360 202, 386 202 L 400 202" class="edge edge-amber" marker-end="url(#arr-a24)"/>

  <!-- Source to DENSE_RANK: exit 300,190 -> curve -> enter 400,302 with runway dx>=14 -->
  <path fill="none" d="M 300 190 C 340 190, 360 302, 386 302 L 400 302" class="edge edge-green" marker-end="url(#arr-g24)"/>
</svg>
