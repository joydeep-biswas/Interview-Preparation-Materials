<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 400" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .pillar-box { fill: #111827; stroke-width: 2; rx: 10; ry: 10; }
      .card { fill: #1E293B; stroke-width: 1.5; rx: 8; ry: 8; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94A3B8; text-anchor: start; }
      .code-line { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #60A5FA; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
    </style>
    <marker id="arr-b32" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g32" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <rect x="25" y="25" width="1010" height="350" class="pillar-box" stroke="#3B82F6"/>
  <text x="530" y="55" class="title-text" fill="#60A5FA">Join Row Count Cardinality Mechanics (Duplicate Keys &amp; NULL Invariants)</text>

  <!-- Table A -->
  <rect x="50" y="80" width="220" height="270" class="card" stroke="#3B82F6"/>
  <text x="160" y="108" class="card-title" fill="#93C5FD">Table A (6 Rows)</text>
  <text x="65" y="140" class="card-body" fill="#F8FAFC">ID = 1  (Row 1)</text>
  <text x="65" y="165" class="card-body" fill="#F8FAFC">ID = 1  (Row 2)</text>
  <text x="65" y="190" class="card-body" fill="#F8FAFC">ID = 1  (Row 3)</text>
  <text x="65" y="215" class="card-body" fill="#FCD34D">ID = 2  (Row 4)</text>
  <text x="65" y="240" class="card-body" fill="#FCD34D">ID = 2  (Row 5)</text>
  <text x="65" y="265" class="card-body" fill="#EF4444">ID = NULL (Row 6)</text>
  <text x="65" y="305" class="card-body" fill="#94A3B8">• Total Rows = 6</text>
  <text x="65" y="325" class="card-body" fill="#94A3B8">• Counts: 1:x3, 2:x2, NULL:x1</text>

  <!-- Table B -->
  <rect x="310" y="80" width="220" height="270" class="card" stroke="#F59E0B"/>
  <text x="420" y="108" class="card-title" fill="#FCD34D">Table B (4 Rows)</text>
  <text x="325" y="140" class="card-body" fill="#F8FAFC">ID = 1  (Row 1)</text>
  <text x="325" y="165" class="card-body" fill="#F8FAFC">ID = 1  (Row 2)</text>
  <text x="325" y="190" class="card-body" fill="#FCD34D">ID = 2  (Row 3)</text>
  <text x="325" y="215" class="card-body" fill="#EF4444">ID = NULL (Row 4)</text>
  <text x="325" y="280" class="card-body" fill="#94A3B8">• Total Rows = 4</text>
  <text x="325" y="305" class="card-body" fill="#94A3B8">• Counts: 1:x2, 2:x1, NULL:x1</text>

  <!-- Connectors -->
  <path d="M 270 215 L 300 215" class="edge" stroke="#3B82F6"/>
  <path d="M 530 215 L 560 215" class="edge" stroke="#10B981" marker-end="url(#arr-g32)"/>

  <!-- Output Cardinality Evaluation -->
  <rect x="570" y="80" width="440" height="270" class="card" stroke="#10B981"/>
  <text x="790" y="108" class="card-title" fill="#34D399">Evaluated Output Row Counts (A.id = B.id)</text>

  <text x="590" y="138" class="card-body" fill="#93C5FD">1. Match on key = 1: 3 rows (A) * 2 rows (B) = 6 rows</text>
  <text x="590" y="160" class="card-body" fill="#FCD34D">2. Match on key = 2: 2 rows (A) * 1 row (B)  = 2 rows</text>
  <text x="590" y="182" class="card-body" fill="#EF4444">3. Match on key = NULL: NULL = NULL is UNKNOWN = 0 rows!</text>

  <line x1="590" y1="197" x2="990" y2="197" stroke="#334155" stroke-width="1"/>

  <text x="590" y="222" class="card-body" fill="#34D399" font-weight="700">• INNER JOIN Count:  6 + 2 = 8 Rows</text>
  <text x="590" y="247" class="card-body" fill="#60A5FA" font-weight="700">• LEFT JOIN Count:   8 + 1 (unmatched A.NULL) = 9 Rows</text>
  <text x="590" y="272" class="card-body" fill="#F59E0B" font-weight="700">• RIGHT JOIN Count:  8 + 1 (unmatched B.NULL) = 9 Rows</text>
  <text x="590" y="297" class="card-body" fill="#C084FC" font-weight="700">• FULL OUTER JOIN:   8 + 1 (A) + 1 (B) = 10 Rows</text>

  <text x="590" y="330" class="card-body" fill="#94A3B8" font-style="italic">Key Rule: In SQL equi-joins, NULL never equals NULL (Three-Valued Logic).</text>
</svg>

