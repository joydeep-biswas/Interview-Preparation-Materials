<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .card { fill: #111827; stroke-width: 1.5; rx: 10; ry: 10; }
      .card-blue { stroke: #3B82F6; }
      .card-amber { stroke: #F59E0B; }
      .card-green { stroke: #10B981; }
      .card-gray { stroke: #64748B; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #F3F4F6; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #9CA3AF; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
      .edge-blue { stroke: #3B82F6; }
      .edge-green { stroke: #10B981; }
      .edge-gray { stroke: #64748B; }
      .edge-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
    </style>
    <marker id="arr-b16" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g16" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
    <marker id="arr-s16" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <text x="460" y="32" class="title-text">Anti-Join Mechanics: NOT EXISTS vs LEFT JOIN / IS NULL</text>

  <!-- Left: Customers -->
  <rect x="40" y="90" width="220" height="120" class="card card-blue"/>
  <text x="150" y="118" class="card-title" fill="#93C5FD">Customers Table</text>
  <text x="55" y="143" class="card-body">• 10,000,000 Customers</text>
  <text x="55" y="163" class="card-body">• Sequential Scan / Index</text>
  <text x="55" y="183" class="card-body">• Target outer table</text>

  <!-- Center: Anti Join Gate -->
  <rect x="330" y="90" width="240" height="120" class="card card-amber"/>
  <text x="450" y="118" class="card-title" fill="#FDE68A">Anti-Join Predicate</text>
  <text x="345" y="143" class="card-body" font-family="monospace">WHERE NOT EXISTS (</text>
  <text x="345" y="163" class="card-body" font-family="monospace">  SELECT 1 FROM orders ...</text>
  <text x="345" y="183" class="card-body" font-family="monospace">)</text>

  <!-- Right Top: Dormant -->
  <rect x="640" y="60" width="240" height="90" class="card card-green"/>
  <text x="760" y="85" class="card-title" fill="#6EE7B7">Dormant Customers (Keep)</text>
  <text x="655" y="110" class="card-body">• No transaction in 90 days</text>
  <text x="655" y="128" class="card-body" fill="#34D399">• Early exit on first non-match</text>

  <!-- Right Bottom: Active -->
  <rect x="640" y="170" width="240" height="90" class="card card-gray"/>
  <text x="760" y="195" class="card-title" fill="#CBD5E1">Active Customers (Pruned)</text>
  <text x="655" y="220" class="card-body">• Match found in orders index</text>
  <text x="655" y="238" class="card-body">• Discarded from result set</text>

  <!-- Connectors with straight runways -->
  <path fill="none" d="M 260 150 L 330 150" class="edge edge-blue" marker-end="url(#arr-b16)"/>

  <!-- Gate to Dormant: exit 570,150 -> curve -> enter 640,105 with runway dx>=14 -->
  <path fill="none" d="M 570 150 C 595 150, 605 105, 626 105 L 640 105" class="edge edge-green" marker-end="url(#arr-g16)"/>
  <text x="600" y="120" class="edge-label" fill="#6EE7B7">No</text>

  <!-- Gate to Active: exit 570,150 -> curve -> enter 640,215 with runway dx>=14 -->
  <path fill="none" d="M 570 150 C 595 150, 605 215, 626 215 L 640 215" class="edge edge-gray" marker-end="url(#arr-s16)"/>
  <text x="600" y="195" class="edge-label" fill="#9CA3AF">Yes</text>
</svg>
