<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .group-box { fill: #111827; stroke-width: 2; rx: 10; ry: 10; }
      .card { fill: #1E293B; stroke-width: 1.5; rx: 8; ry: 8; }
      .card-blue { stroke: #3B82F6; }
      .card-amber { stroke: #F59E0B; }
      .card-green { stroke: #10B981; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #F3F4F6; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #9CA3AF; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
      .edge-amber { stroke: #F59E0B; }
      .edge-green { stroke: #10B981; }
    </style>
    <marker id="arr-a5" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-g5" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <!-- Physical Data in Center -->
  <rect x="360" y="130" width="240" height="130" class="card card-blue"/>
  <text x="480" y="158" class="card-title" fill="#93C5FD">Physical Storage Extents</text>
  <text x="375" y="185" class="card-body">• 100 GB Parquet / Data Pages</text>
  <text x="375" y="205" class="card-body">• Immutable block addresses</text>
  <text x="375" y="225" class="card-body">• Zero bytes moved on disk</text>

  <!-- Left: Before Switch -->
  <rect x="30" y="30" width="280" height="320" class="group-box" stroke="#F59E0B"/>
  <text x="170" y="58" class="title-text" fill="#FDE68A">Before Switch: Pointers</text>

  <rect x="50" y="80" width="240" height="100" class="card card-amber"/>
  <text x="170" y="105" class="card-title" fill="#FDE68A">Staging Table Meta</text>
  <text x="65" y="130" class="card-body">• Partition 2024-05</text>
  <text x="65" y="150" class="card-body" fill="#FDE68A">• Points to 100 GB physical data</text>

  <rect x="50" y="210" width="240" height="100" class="card card-amber"/>
  <text x="170" y="235" class="card-title" fill="#FDE68A">Production Fact Table</text>
  <text x="65" y="260" class="card-body">• Partition 2024-05</text>
  <text x="65" y="280" class="card-body">• Currently empty / missing</text>

  <!-- Right: After Switch -->
  <rect x="650" y="30" width="280" height="320" class="group-box" stroke="#10B981"/>
  <text x="790" y="58" class="title-text" fill="#6EE7B7">After Switch: 0.01 sec</text>

  <rect x="670" y="80" width="240" height="100" class="card card-green"/>
  <text x="790" y="105" class="card-title" fill="#6EE7B7">Staging Table Meta</text>
  <text x="685" y="130" class="card-body">• Partition 2024-05</text>
  <text x="685" y="150" class="card-body">• Pointer removed (empty)</text>

  <rect x="670" y="210" width="240" height="100" class="card card-green"/>
  <text x="790" y="235" class="card-title" fill="#6EE7B7">Production Fact Table</text>
  <text x="685" y="260" class="card-body">• Partition 2024-05</text>
  <text x="685" y="280" class="card-body" fill="#34D399">• Instant atomic switch completed</text>

  <!-- Connectors with straight runways -->
  <!-- Before: Staging Meta -> Physical Extents (Horizontal straight) -->
  <path fill="none" d="M 290 130 C 320 130, 335 170, 346 170 L 360 170" class="edge edge-amber" marker-end="url(#arr-a5)"/>

  <!-- After: Fact Meta -> Physical Extents (Curved with straight runway) -->
  <path fill="none" d="M 670 260 C 640 260, 625 220, 614 220 L 600 220" class="edge edge-green" marker-end="url(#arr-g5)"/>
</svg>
