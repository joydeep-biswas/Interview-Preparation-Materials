<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .card { fill: #111827; stroke-width: 1.5; rx: 10; ry: 10; }
      .card-blue { stroke: #3B82F6; }
      .card-amber { stroke: #F59E0B; }
      .card-purple { stroke: #8B5CF6; }
      .card-green { stroke: #10B981; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #F3F4F6; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #9CA3AF; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
      .edge-amber { stroke: #F59E0B; }
      .edge-purple { stroke: #8B5CF6; }
      .edge-green { stroke: #10B981; }
    </style>
    <marker id="arr-a11" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p11s" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-g11s" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <text x="480" y="32" class="title-text">Nth Highest Salary: Deduplication &amp; Offset Retrieval</text>

  <!-- Step 1 -->
  <rect x="30" y="65" width="200" height="120" class="card card-blue"/>
  <text x="130" y="92" class="card-title" fill="#93C5FD">1. Raw Salaries</text>
  <text x="45" y="117" class="card-body">• [100k, 100k, 90k, 80k]</text>
  <text x="45" y="137" class="card-body">• Contains duplicate ties</text>
  <text x="45" y="157" class="card-body">• Naive limit offset fails</text>

  <!-- Step 2 -->
  <rect x="260" y="65" width="200" height="120" class="card card-amber"/>
  <text x="360" y="92" class="card-title" fill="#FDE68A">2. DISTINCT Set</text>
  <text x="275" y="117" class="card-body">• [100k, 90k, 80k]</text>
  <text x="275" y="137" class="card-body">• Collapses ties to 1 entry</text>
  <text x="275" y="157" class="card-body">• Guarantees dense ranks</text>

  <!-- Step 3 -->
  <rect x="490" y="65" width="200" height="120" class="card card-purple"/>
  <text x="590" y="92" class="card-title" fill="#D8B4FE">3. Offset Filter</text>
  <text x="505" y="117" class="card-body">• ORDER BY sal DESC</text>
  <text x="505" y="137" class="card-body">• LIMIT 1 OFFSET N-1</text>
  <text x="505" y="157" class="card-body">• Or DENSE_RANK() = N</text>

  <!-- Step 4 -->
  <rect x="720" y="65" width="210" height="120" class="card card-green"/>
  <text x="825" y="92" class="card-title" fill="#6EE7B7">4. Winner: 90k</text>
  <text x="735" y="117" class="card-body" fill="#34D399">• 2nd Highest = $90,000</text>
  <text x="735" y="137" class="card-body">• If &lt; N salaries exist:</text>
  <text x="735" y="157" class="card-body">• Returns SQL NULL safely</text>

  <!-- Straight Horizontal Connectors -->
  <path fill="none" d="M 230 125 L 260 125" class="edge edge-amber" marker-end="url(#arr-a11)"/>
  <path fill="none" d="M 460 125 L 490 125" class="edge edge-purple" marker-end="url(#arr-p11s)"/>
  <path fill="none" d="M 690 125 L 720 125" class="edge edge-green" marker-end="url(#arr-g11s)"/>
</svg>
