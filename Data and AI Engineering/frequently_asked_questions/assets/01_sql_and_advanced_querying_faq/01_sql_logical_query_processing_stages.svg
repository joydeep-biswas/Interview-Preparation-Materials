<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .pillar-box { fill: #111827; stroke-width: 2; rx: 10; ry: 10; }
      .card { fill: #1E293B; stroke-width: 1.5; rx: 8; ry: 8; }
      .card-blue { stroke: #3B82F6; }
      .card-amber { stroke: #F59E0B; }
      .card-green { stroke: #10B981; }
      .card-purple { stroke: #8B5CF6; }
      .card-red { stroke: #EF4444; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #F3F4F6; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #9CA3AF; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
      .edge-blue { stroke: #3B82F6; }
      .edge-amber { stroke: #F59E0B; }
      .edge-green { stroke: #10B981; }
      .edge-purple { stroke: #8B5CF6; }
      .edge-red { stroke: #EF4444; }
    </style>
    <marker id="arr-b1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-a1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-g1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
    <marker id="arr-p1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <!-- Col 1: Stage 1 -->
  <rect x="20" y="20" width="250" height="460" class="pillar-box" stroke="#3B82F6"/>
  <text x="145" y="48" class="title-text" fill="#60A5FA">1. Source &amp; Ingestion</text>

  <rect x="35" y="80" width="220" height="110" class="card card-blue"/>
  <text x="145" y="105" class="card-title" fill="#93C5FD">1. FROM &amp; JOINs</text>
  <text x="45" y="130" class="card-body">• Identify source tables</text>
  <text x="45" y="150" class="card-body">• Evaluate ON predicates</text>
  <text x="45" y="170" class="card-body">• Build Cartesian rowsets</text>

  <rect x="35" y="240" width="220" height="110" class="card card-blue"/>
  <text x="145" y="265" class="card-title" fill="#93C5FD">2. WHERE Filter</text>
  <text x="45" y="290" class="card-body">• Prune non-matching rows</text>
  <text x="45" y="310" class="card-body">• Executes before grouping</text>
  <text x="45" y="330" class="card-body">• Aggregate functions banned</text>

  <path fill="none" d="M 145 190 L 145 240" class="edge edge-blue" marker-end="url(#arr-b1)"/>

  <!-- Col 2: Stage 2 -->
  <rect x="300" y="20" width="250" height="460" class="pillar-box" stroke="#F59E0B"/>
  <text x="425" y="48" class="title-text" fill="#FDE68A">2. Grouping &amp; Aggregation</text>

  <rect x="315" y="80" width="220" height="110" class="card card-amber"/>
  <text x="425" y="105" class="card-title" fill="#FDE68A">3. GROUP BY</text>
  <text x="325" y="130" class="card-body">• Partition into discrete keys</text>
  <text x="325" y="150" class="card-body">• Collapse rowsets to buckets</text>
  <text x="325" y="170" class="card-body">• Prepare aggregate accumulators</text>

  <rect x="315" y="240" width="220" height="110" class="card card-amber"/>
  <text x="425" y="265" class="card-title" fill="#FDE68A">4. HAVING Filter</text>
  <text x="325" y="290" class="card-body">• Filter on aggregated sums</text>
  <text x="325" y="310" class="card-body">• Prunes collapsed groups</text>
  <text x="325" y="330" class="card-body">• Eliminates small partitions</text>

  <path fill="none" d="M 425 190 L 425 240" class="edge edge-amber" marker-end="url(#arr-a1)"/>

  <!-- Col 3: Stage 3 -->
  <rect x="580" y="20" width="260" height="460" class="pillar-box" stroke="#10B981"/>
  <text x="710" y="48" class="title-text" fill="#6EE7B7">3. Projection &amp; Sets</text>

  <rect x="595" y="70" width="230" height="90" class="card card-green"/>
  <text x="710" y="95" class="card-title" fill="#6EE7B7">5. SELECT Expressions</text>
  <text x="605" y="120" class="card-body">• Compute scalar expressions</text>
  <text x="605" y="140" class="card-body">• Evaluate column aliases</text>

  <rect x="595" y="185" width="230" height="85" class="card card-green"/>
  <text x="710" y="210" class="card-title" fill="#6EE7B7">6. DISTINCT</text>
  <text x="605" y="235" class="card-body">• Hash/sort deduplication</text>
  <text x="605" y="255" class="card-body">• Eliminates duplicate tuples</text>

  <rect x="595" y="295" width="230" height="95" class="card card-green"/>
  <text x="710" y="320" class="card-title" fill="#6EE7B7">7. UNION / EXCEPT</text>
  <text x="605" y="345" class="card-body">• Set-based row operations</text>
  <text x="605" y="365" class="card-body">• Combine subquery pipelines</text>

  <path fill="none" d="M 710 160 L 710 185" class="edge edge-green" marker-end="url(#arr-g1)"/>
  <path fill="none" d="M 710 270 L 710 295" class="edge edge-green" marker-end="url(#arr-g1)"/>

  <!-- Col 4: Stage 4 -->
  <rect x="870" y="20" width="250" height="460" class="pillar-box" stroke="#8B5CF6"/>
  <text x="995" y="48" class="title-text" fill="#C4B5FD">4. Ordering &amp; Limiting</text>

  <rect x="885" y="80" width="220" height="110" class="card card-purple"/>
  <text x="995" y="105" class="card-title" fill="#D8B4FE">8. ORDER BY</text>
  <text x="895" y="130" class="card-body">• Sort final unified result set</text>
  <text x="895" y="150" class="card-body">• SELECT aliases accessible</text>
  <text x="895" y="170" class="card-body">• Memory sort / spill buffer</text>

  <rect x="885" y="240" width="220" height="110" class="card card-red"/>
  <text x="995" y="265" class="card-title" fill="#FCA5A5">9. LIMIT / OFFSET</text>
  <text x="895" y="290" class="card-body">• Restrict returned rows</text>
  <text x="895" y="310" class="card-body">• Top-N heap optimization</text>
  <text x="895" y="330" class="card-body">• Client response pagination</text>

  <path fill="none" d="M 995 190 L 995 240" class="edge edge-purple" marker-end="url(#arr-p1)"/>

  <!-- Cross-pillar connectors with straight runways -->
  <!-- Col 1 (WHERE) to Col 2 (GROUP BY): exit 255,295 -> curve -> enter 315,135 with runway dx>=14 -->
  <path fill="none" d="M 255 295 C 285 295, 285 135, 301 135 L 315 135" class="edge edge-amber" marker-end="url(#arr-a1)"/>

  <!-- Col 2 (HAVING) to Col 3 (SELECT): exit 535,295 -> curve -> enter 595,115 with runway dx>=14 -->
  <path fill="none" d="M 535 295 C 565 295, 565 115, 581 115 L 595 115" class="edge edge-green" marker-end="url(#arr-g1)"/>

  <!-- Col 3 (UNION) to Col 4 (ORDER BY): exit 825,342 -> curve -> enter 885,135 with runway dx>=14 -->
  <path fill="none" d="M 825 342 C 855 342, 855 135, 871 135 L 885 135" class="edge edge-purple" marker-end="url(#arr-p1)"/>
</svg>
