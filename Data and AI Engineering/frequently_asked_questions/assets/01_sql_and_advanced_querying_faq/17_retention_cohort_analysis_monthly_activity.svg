<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 300" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .card { fill: #111827; stroke-width: 1.5; rx: 10; ry: 10; }
      .card-blue { stroke: #3B82F6; }
      .card-amber { stroke: #F59E0B; }
      .card-purple { stroke: #8B5CF6; }
      .card-green { stroke: #10B981; }
      .card-red { stroke: #EF4444; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #F3F4F6; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #9CA3AF; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
      .edge-amber { stroke: #F59E0B; }
      .edge-purple { stroke: #8B5CF6; }
      .edge-green { stroke: #10B981; }
      .edge-red { stroke: #EF4444; }
      .edge-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
    </style>
    <marker id="arr-a17" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p17" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-g17" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
    <marker id="arr-r17" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <text x="510" y="32" class="title-text">Retention Cohort Analysis: Monthly LAG &amp; Gap Detection</text>

  <!-- Step 1 -->
  <rect x="25" y="90" width="165" height="120" class="card card-blue"/>
  <text x="107" y="118" class="card-title" fill="#93C5FD">1. Raw Orders</text>
  <text x="35" y="143" class="card-body">• order_id</text>
  <text x="35" y="163" class="card-body">• customer_id</text>
  <text x="35" y="183" class="card-body">• order_date</text>

  <!-- Step 2 -->
  <rect x="220" y="90" width="175" height="120" class="card card-amber"/>
  <text x="307" y="118" class="card-title" fill="#FDE68A">2. Truncate Month</text>
  <text x="230" y="143" class="card-body">• YYYY-MM buckets</text>
  <text x="230" y="163" class="card-body">• Deduplicate per cust</text>
  <text x="230" y="183" class="card-body">• Unique activity months</text>

  <!-- Step 3 -->
  <rect x="425" y="90" width="180" height="120" class="card card-purple"/>
  <text x="515" y="118" class="card-title" fill="#D8B4FE">3. LAG Month</text>
  <text x="435" y="143" class="card-body">• PARTITION BY cust</text>
  <text x="435" y="163" class="card-body">• ORDER BY month</text>
  <text x="435" y="183" class="card-body">• Computes delta months</text>

  <!-- Step 4: Decision Gate -->
  <rect x="635" y="90" width="150" height="120" class="card card-amber"/>
  <text x="710" y="118" class="card-title" fill="#FDE68A">Delta == 1?</text>
  <text x="645" y="143" class="card-body">• Compare to prev</text>
  <text x="645" y="163" class="card-body">• 1 = consecutive</text>
  <text x="645" y="183" class="card-body">• &gt;1 = lapse</text>

  <!-- Step 5: Outputs -->
  <rect x="815" y="60" width="180" height="85" class="card card-green"/>
  <text x="905" y="85" class="card-title" fill="#6EE7B7">Active Streak</text>
  <text x="825" y="110" class="card-body" fill="#34D399">• Consecutive buyer</text>
  <text x="825" y="128" class="card-body">• Increments loyalty score</text>

  <rect x="815" y="175" width="180" height="85" class="card card-red"/>
  <text x="905" y="200" class="card-title" fill="#FCA5A5">Streak Broken</text>
  <text x="825" y="225" class="card-body" fill="#EF4444">• Lapsed customer</text>
  <text x="825" y="243" class="card-body">• Reset streak counter</text>

  <!-- Connectors -->
  <path fill="none" d="M 190 150 L 220 150" class="edge edge-amber" marker-end="url(#arr-a17)"/>
  <path fill="none" d="M 395 150 L 425 150" class="edge edge-purple" marker-end="url(#arr-p17)"/>
  <path fill="none" d="M 605 150 L 635 150" class="edge edge-amber" marker-end="url(#arr-a17)"/>

  <!-- Gate to Active: exit 785,150 -> curve -> enter 815,102 with runway dx>=14 -->
  <path fill="none" d="M 785 150 C 795 150, 800 102, 805 102 L 815 102" class="edge edge-green" marker-end="url(#arr-g17)"/>

  <!-- Gate to Broken: exit 785,150 -> curve -> enter 815,217 with runway dx>=14 -->
  <path fill="none" d="M 785 150 C 795 150, 800 217, 805 217 L 815 217" class="edge edge-red" marker-end="url(#arr-r17)"/>
</svg>
