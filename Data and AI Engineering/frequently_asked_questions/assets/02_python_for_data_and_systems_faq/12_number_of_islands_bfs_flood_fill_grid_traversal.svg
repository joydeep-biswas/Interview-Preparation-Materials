<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .card { fill: #111827; stroke-width: 1.5; rx: 10; ry: 10; }
      .card-blue { stroke: #3B82F6; }
      .card-amber { stroke: #F59E0B; }
      .card-green { stroke: #10B981; }
      .card-gray { stroke: #64748B; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #F3F4F6; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #9CA3AF; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
      .edge-blue { stroke: #3B82F6; }
      .edge-amber { stroke: #F59E0B; }
      .edge-green { stroke: #10B981; }
      .edge-gray { stroke: #64748B; }
      .edge-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
    </style>
    <marker id="arr-b12py" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-a12py" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-g12py" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
    <marker id="arr-s12py" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <text x="480" y="32" class="title-text">Number of Islands: 2D Grid BFS Flood Fill Traversal</text>

  <!-- Step 1 -->
  <rect x="30" y="90" width="180" height="120" class="card card-blue"/>
  <text x="120" y="118" class="card-title" fill="#93C5FD">1. Sequential Scan</text>
  <text x="45" y="143" class="card-body">• Nested loops: r, c</text>
  <text x="45" y="163" class="card-body">• Inspects grid[r][c]</text>
  <text x="45" y="183" class="card-body">• Linear O(M x N)</text>

  <!-- Step 2: Gate -->
  <rect x="250" y="90" width="170" height="120" class="card card-amber"/>
  <text x="335" y="118" class="card-title" fill="#FDE68A">Cell == '1'?</text>
  <text x="260" y="143" class="card-body">• '1' = Unvisited Land</text>
  <text x="260" y="163" class="card-body">• '0' = Water / Sunk</text>
  <text x="260" y="183" class="card-body">• In-place mutation</text>

  <!-- Step 3: Island Count Increment -->
  <rect x="460" y="55" width="220" height="85" class="card card-green"/>
  <text x="570" y="80" class="card-title" fill="#6EE7B7">Increment Island Count</text>
  <text x="475" y="105" class="card-body" fill="#34D399">• island_count += 1</text>
  <text x="475" y="125" class="card-body">• Discovered new landmass</text>

  <!-- Step 4: BFS Flood Fill -->
  <rect x="460" y="160" width="220" height="110" class="card card-green"/>
  <text x="570" y="185" class="card-title" fill="#6EE7B7">BFS Sink Landmass</text>
  <text x="475" y="210" class="card-body">• Queue 4 cardinal neighbors</text>
  <text x="475" y="228" class="card-body">• Mutate grid[r][c] = '0'</text>
  <text x="475" y="248" class="card-body">• Prevents revisits</text>

  <!-- Step 5: Advance -->
  <rect x="730" y="100" width="200" height="100" class="card card-gray"/>
  <text x="830" y="128" class="card-title" fill="#CBD5E1">Next Coordinate</text>
  <text x="745" y="153" class="card-body">• Advance (r, c + 1)</text>
  <text x="745" y="173" class="card-body">• Continue full scan</text>

  <!-- Connectors with straight runways -->
  <path fill="none" d="M 210 150 L 250 150" class="edge edge-blue" marker-end="url(#arr-b12py)"/>

  <!-- Gate to Found: exit 420,150 -> curve -> enter 460,97 with runway dx>=14 -->
  <path fill="none" d="M 420 150 C 435 150, 440 97, 446 97 L 460 97" class="edge edge-green" marker-end="url(#arr-g12py)"/>
  <text x="435" y="115" class="edge-label" fill="#6EE7B7">Yes</text>

  <!-- Found to BFS -->
  <path fill="none" d="M 570 140 L 570 160" class="edge edge-green" marker-end="url(#arr-g12py)"/>

  <!-- BFS to Advance: exit 680,215 -> curve -> enter 730,150 with runway dx>=14 -->
  <path fill="none" d="M 680 215 C 700 215, 710 150, 716 150 L 730 150" class="edge edge-gray" marker-end="url(#arr-s12py)"/>

  <!-- Gate to Advance (Direct No): exit 420,150 -> curve under to enter 730,150 -->
  <path fill="none" d="M 420 180 C 430 290, 710 290, 730 170" class="edge edge-gray" marker-end="url(#arr-s12py)"/>
  <text x="440" y="200" class="edge-label" fill="#9CA3AF">No</text>
</svg>
