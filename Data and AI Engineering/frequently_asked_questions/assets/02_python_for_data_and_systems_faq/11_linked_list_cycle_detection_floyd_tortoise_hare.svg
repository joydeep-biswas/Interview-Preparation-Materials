<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .card { fill: #111827; stroke-width: 1.5; rx: 10; ry: 10; }
      .card-blue { stroke: #3B82F6; }
      .card-gray { stroke: #64748B; }
      .card-green { stroke: #10B981; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #F3F4F6; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #9CA3AF; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
      .edge-blue { stroke: #3B82F6; }
      .edge-gray { stroke: #64748B; }
      .edge-green { stroke: #10B981; }
    </style>
    <marker id="arr-b11py" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-s11py" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-g11py" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <text x="480" y="32" class="title-text">Floyd's Tortoise &amp; Hare: Cycle Detection via Pointer Collision</text>

  <!-- Step 1: Topology -->
  <rect x="25" y="65" width="200" height="150" class="card card-blue"/>
  <text x="125" y="92" class="card-title" fill="#93C5FD">List Topology</text>
  <text x="35" y="117" class="card-body">• Node (3) -&gt; Head</text>
  <text x="35" y="137" class="card-body">• Node (2)</text>
  <text x="35" y="157" class="card-body">• Node (0)</text>
  <text x="35" y="177" class="card-body" fill="#EF4444">• Node (-4) -&gt; Loops to (2)</text>
  <text x="35" y="197" class="card-body">• Cycle Length = 3 nodes</text>

  <!-- Pointer Steps -->
  <rect x="255" y="65" width="150" height="150" class="card card-gray"/>
  <text x="330" y="92" class="card-title" fill="#CBD5E1">Step 0</text>
  <text x="265" y="125" class="card-body">• slow = Node (3)</text>
  <text x="265" y="150" class="card-body">• fast = Node (3)</text>
  <text x="265" y="175" class="card-body">• Delta = 0</text>

  <rect x="435" y="65" width="150" height="150" class="card card-gray"/>
  <text x="510" y="92" class="card-title" fill="#CBD5E1">Step 1</text>
  <text x="445" y="125" class="card-body">• slow = Node (2)</text>
  <text x="445" y="150" class="card-body">• fast = Node (0)</text>
  <text x="445" y="175" class="card-body">• Gap opens</text>

  <rect x="615" y="65" width="150" height="150" class="card card-gray"/>
  <text x="690" y="92" class="card-title" fill="#CBD5E1">Step 2</text>
  <text x="625" y="125" class="card-body">• slow = Node (0)</text>
  <text x="625" y="150" class="card-body">• fast = Node (2)</text>
  <text x="625" y="175" class="card-body">• Fast loops back</text>

  <rect x="795" y="65" width="140" height="150" class="card card-green"/>
  <text x="865" y="92" class="card-title" fill="#6EE7B7">Step 3 (Collision!)</text>
  <text x="805" y="120" class="card-body" fill="#34D399">• slow = Node (-4)</text>
  <text x="805" y="145" class="card-body" fill="#34D399">• fast = Node (-4)</text>
  <text x="805" y="170" class="card-body" fill="#34D399">• COLLISION!</text>
  <text x="805" y="195" class="card-body">• O(1) Space Proof</text>

  <!-- Straight Horizontal Connectors -->
  <path fill="none" d="M 225 140 L 255 140" class="edge edge-blue" marker-end="url(#arr-b11py)"/>
  <path fill="none" d="M 405 140 L 435 140" class="edge edge-gray" marker-end="url(#arr-s11py)"/>
  <path fill="none" d="M 585 140 L 615 140" class="edge edge-gray" marker-end="url(#arr-s11py)"/>
  <path fill="none" d="M 765 140 L 795 140" class="edge edge-green" marker-end="url(#arr-g11py)"/>
</svg>
