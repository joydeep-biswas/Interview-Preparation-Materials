<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 380" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .pillar-box { fill: #111827; stroke-width: 2; rx: 10; ry: 10; }
      .card { fill: #1E293B; stroke-width: 1.5; rx: 8; ry: 8; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94A3B8; text-anchor: start; }
      .code-line { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; fill: #60A5FA; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
    </style>
    <marker id="arr-g22" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a22" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <rect x="25" y="25" width="1010" height="330" class="pillar-box" stroke="#3B82F6"/>
  <text x="530" y="55" class="title-text" fill="#60A5FA">Dictionary List Aggregation: Hash Aggregation vs itertools.groupby</text>

  <!-- Input Card -->
  <rect x="50" y="85" width="280" height="240" class="card" stroke="#3B82F6"/>
  <text x="190" y="115" class="card-title" fill="#93C5FD">Input: List of Dicts</text>
  <text x="65" y="145" class="code-line">[</text>
  <text x="75" y="165" class="code-line"> {'dept': 'Eng',   'sal': 100},</text>
  <text x="75" y="185" class="code-line"> {'dept': 'Sales', 'sal': 80},</text>
  <text x="75" y="205" class="code-line"> {'dept': 'Eng',   'sal': 120},</text>
  <text x="75" y="225" class="code-line"> {'dept': 'HR',    'sal': 70}</text>
  <text x="65" y="245" class="code-line">]</text>
  <text x="65" y="280" class="card-body" fill="#94A3B8">• Heterogeneous list</text>
  <text x="65" y="300" class="card-body" fill="#94A3B8">• Unsorted input order</text>

  <!-- Upper Branch: defaultdict -->
  <path d="M 330 160 L 390 140" class="edge" stroke="#10B981" marker-end="url(#arr-g22)"/>

  <rect x="400" y="85" width="290" height="110" class="card" stroke="#10B981"/>
  <text x="545" y="110" class="card-title" fill="#34D399">Method 1: defaultdict(float) (Optimal)</text>
  <text x="415" y="135" class="card-body">• Single-pass hash table: O(N) time</text>
  <text x="415" y="155" class="card-body">• O(D) auxiliary space</text>
  <text x="415" y="175" class="card-body" fill="#34D399">• totals[d] += sal (No sorting required)</text>

  <!-- Lower Branch: itertools.groupby -->
  <path d="M 330 250 L 390 270" class="edge" stroke="#F59E0B" marker-end="url(#arr-a22)"/>

  <rect x="400" y="215" width="290" height="110" class="card" stroke="#F59E0B"/>
  <text x="545" y="240" class="card-title" fill="#FCD34D">Method 2: itertools.groupby (Trap)</text>
  <text x="415" y="265" class="card-body">• REQUIRES SORTING: O(N log N) time</text>
  <text x="415" y="285" class="card-body">• Only groups CONSECUTIVE keys</text>
  <text x="415" y="305" class="card-body" fill="#EF4444">• Fails silently if data is unsorted!</text>

  <!-- Output Result Card -->
  <rect x="730" y="85" width="280" height="240" class="card" stroke="#8B5CF6"/>
  <text x="870" y="115" class="card-title" fill="#C084FC">Final Aggregated Result</text>
  <text x="750" y="150" class="code-line">{</text>
  <text x="765" y="175" class="code-line" fill="#34D399">  'Eng': 220.0,</text>
  <text x="765" y="200" class="code-line" fill="#34D399">  'Sales': 80.0,</text>
  <text x="765" y="225" class="code-line" fill="#34D399">  'HR': 70.0</text>
  <text x="750" y="250" class="code-line">}</text>
  <text x="750" y="285" class="card-body" fill="#94A3B8">• Clean dictionary of sums</text>
  <text x="750" y="305" class="card-body" fill="#10B981">• Deterministic &amp; type-safe</text>
</svg>

