<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 220" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .card { fill: #111827; stroke-width: 1.5; rx: 10; ry: 10; }
      .card-gray { stroke: #64748B; }
      .card-amber { stroke: #F59E0B; }
      .card-green { stroke: #10B981; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #F3F4F6; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; fill: #9CA3AF; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
      .edge-gray { stroke: #64748B; }
      .edge-amber { stroke: #F59E0B; }
      .edge-green { stroke: #10B981; }
    </style>
    <marker id="arr-s9py" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-a9py" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-g9py" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <text x="530" y="32" class="title-text">Sliding Window: Longest Substring Without Repeating Characters (s = 'pwwkew')</text>

  <!-- Step 1 -->
  <rect x="20" y="65" width="150" height="125" class="card card-gray"/>
  <text x="95" y="90" class="card-title" fill="#CBD5E1">1. Char 'p'</text>
  <text x="30" y="115" class="card-body">• [0..0]: 'p'</text>
  <text x="30" y="135" class="card-body">• Map: {'p': 0}</text>
  <text x="30" y="155" class="card-body">• Max Len = 1</text>

  <!-- Step 2 -->
  <rect x="190" y="65" width="150" height="125" class="card card-gray"/>
  <text x="265" y="90" class="card-title" fill="#CBD5E1">2. Char 'w'</text>
  <text x="200" y="115" class="card-body">• [0..1]: 'p w'</text>
  <text x="200" y="135" class="card-body">• Map: {'w': 1}</text>
  <text x="200" y="155" class="card-body" fill="#34D399">• Max Len = 2</text>

  <!-- Step 3 -->
  <rect x="360" y="65" width="160" height="125" class="card card-amber"/>
  <text x="440" y="90" class="card-title" fill="#FDE68A">3. Duplicate 'w'</text>
  <text x="370" y="115" class="card-body">• idx 1 &gt;= left (0)</text>
  <text x="370" y="135" class="card-body">• Jump left = 2</text>
  <text x="370" y="155" class="card-body">• Window: 'w'</text>

  <!-- Step 4 -->
  <rect x="540" y="65" width="150" height="125" class="card card-gray"/>
  <text x="615" y="90" class="card-title" fill="#CBD5E1">4. Char 'k'</text>
  <text x="550" y="115" class="card-body">• [2..3]: 'w k'</text>
  <text x="550" y="135" class="card-body">• Map: {'k': 3}</text>
  <text x="550" y="155" class="card-body">• Max Len = 2</text>

  <!-- Step 5 -->
  <rect x="710" y="65" width="150" height="125" class="card card-green"/>
  <text x="785" y="90" class="card-title" fill="#6EE7B7">5. Char 'e' (Peak!)</text>
  <text x="720" y="115" class="card-body">• [2..4]: 'w k e'</text>
  <text x="720" y="135" class="card-body">• Map: {'e': 4}</text>
  <text x="720" y="155" class="card-body" fill="#34D399">• Max Len = 3</text>

  <!-- Step 6 -->
  <rect x="880" y="65" width="160" height="125" class="card card-green"/>
  <text x="960" y="90" class="card-title" fill="#6EE7B7">6. Duplicate 'w'</text>
  <text x="890" y="115" class="card-body">• Jump left = 3</text>
  <text x="890" y="135" class="card-body">• [3..5]: 'k e w'</text>
  <text x="890" y="155" class="card-body" fill="#34D399">• Result: 3 ('wke')</text>

  <!-- Connectors -->
  <path fill="none" d="M 170 125 L 190 125" class="edge edge-gray" marker-end="url(#arr-s9py)"/>
  <path fill="none" d="M 340 125 L 360 125" class="edge edge-amber" marker-end="url(#arr-a9py)"/>
  <path fill="none" d="M 520 125 L 540 125" class="edge edge-gray" marker-end="url(#arr-s9py)"/>
  <path fill="none" d="M 690 125 L 710 125" class="edge edge-green" marker-end="url(#arr-g9py)"/>
  <path fill="none" d="M 860 125 L 880 125" class="edge edge-green" marker-end="url(#arr-g9py)"/>
</svg>
