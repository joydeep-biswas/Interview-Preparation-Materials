<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 220" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .card { fill: #111827; stroke-width: 1.5; rx: 10; ry: 10; }
      .card-blue { stroke: #3B82F6; }
      .card-gray { stroke: #64748B; }
      .card-red { stroke: #EF4444; }
      .card-green { stroke: #10B981; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #F3F4F6; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #9CA3AF; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
      .edge-blue { stroke: #3B82F6; }
      .edge-gray { stroke: #64748B; }
      .edge-red { stroke: #EF4444; }
      .edge-green { stroke: #10B981; }
    </style>
    <marker id="arr-b10py" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-s10py" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-r10py" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-g10py" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <text x="530" y="32" class="title-text">First Unique Character: FIFO Queue State Transitions &amp; Stale Eviction</text>

  <!-- Step 1: Input -->
  <rect x="25" y="65" width="180" height="120" class="card card-blue"/>
  <text x="115" y="92" class="card-title" fill="#93C5FD">Stream Events</text>
  <text x="35" y="117" class="card-body">• 'a' -&gt; 'b' -&gt; 'a' -&gt; 'c'</text>
  <text x="35" y="137" class="card-body">• collections.deque</text>
  <text x="35" y="157" class="card-body">• HashMap counter</text>

  <!-- Step 2: Event a -->
  <rect x="235" y="65" width="180" height="120" class="card card-gray"/>
  <text x="325" y="92" class="card-title" fill="#CBD5E1">Event 'a' (count=1)</text>
  <text x="245" y="117" class="card-body">• Queue: ['a']</text>
  <text x="245" y="137" class="card-body">• Head: 'a'</text>
  <text x="245" y="157" class="card-body" fill="#34D399">• Unique = 'a'</text>

  <!-- Step 3: Event b -->
  <rect x="445" y="65" width="180" height="120" class="card card-gray"/>
  <text x="535" y="92" class="card-title" fill="#CBD5E1">Event 'b' (count=1)</text>
  <text x="455" y="117" class="card-body">• Queue: ['a', 'b']</text>
  <text x="455" y="137" class="card-body">• Head 'a' still unique</text>
  <text x="455" y="157" class="card-body" fill="#34D399">• Unique = 'a'</text>

  <!-- Step 4: Event a (Dupe Evict) -->
  <rect x="655" y="65" width="195" height="120" class="card card-red"/>
  <text x="752" y="92" class="card-title" fill="#FCA5A5">Event 'a' (count=2)</text>
  <text x="665" y="117" class="card-body" fill="#EF4444">• Head 'a' invalidated!</text>
  <text x="665" y="137" class="card-body">• q.popleft() evicts 'a'</text>
  <text x="665" y="157" class="card-body">• Queue now: ['b']</text>

  <!-- Step 5: Event c & Result -->
  <rect x="880" y="65" width="155" height="120" class="card card-green"/>
  <text x="957" y="92" class="card-title" fill="#6EE7B7">Event 'c' (Winner)</text>
  <text x="890" y="117" class="card-body">• Queue: ['b', 'c']</text>
  <text x="890" y="137" class="card-body" fill="#34D399">• Head = 'b' (Ans)</text>
  <text x="890" y="157" class="card-body">• O(1) query time</text>

  <!-- Straight Horizontal Connectors -->
  <path fill="none" d="M 205 125 L 235 125" class="edge edge-blue" marker-end="url(#arr-b10py)"/>
  <path fill="none" d="M 415 125 L 445 125" class="edge edge-gray" marker-end="url(#arr-s10py)"/>
  <path fill="none" d="M 625 125 L 655 125" class="edge edge-red" marker-end="url(#arr-r10py)"/>
  <path fill="none" d="M 850 125 L 880 125" class="edge edge-green" marker-end="url(#arr-g10py)"/>
</svg>
