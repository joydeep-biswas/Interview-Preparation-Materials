<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 420" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .pillar-box { fill: #111827; stroke-width: 2; rx: 10; ry: 10; }
      .card { fill: #1E293B; stroke-width: 1.5; rx: 8; ry: 8; }
      .card-red { stroke: #EF4444; }
      .card-amber { stroke: #F59E0B; }
      .card-green { stroke: #10B981; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #F3F4F6; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #9CA3AF; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
      .edge-red { stroke: #EF4444; }
      .edge-amber { stroke: #F59E0B; }
      .edge-green { stroke: #10B981; }
      .edge-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-weight: 600; text-anchor: middle; }
    </style>
    <marker id="arr-r6py" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-a6py" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-g6py" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <!-- Left: list_c = list_a + list_b -->
  <rect x="25" y="25" width="480" height="370" class="pillar-box" stroke="#EF4444"/>
  <text x="265" y="55" class="title-text" fill="#FCA5A5">1. Concatenation: list_a + list_b (Out-of-Place)</text>

  <rect x="45" y="80" width="440" height="80" class="card card-red"/>
  <text x="265" y="105" class="card-title" fill="#FCA5A5">Allocate Brand New PyListObject</text>
  <text x="60" y="130" class="card-body">• Capacity sized to exactly (N + K)</text>
  <text x="60" y="148" class="card-body">• Requires brand new memory allocation from OS</text>

  <rect x="45" y="180" width="440" height="80" class="card card-red"/>
  <text x="265" y="205" class="card-title" fill="#FCA5A5">Memcpy Pointers from list_a</text>
  <text x="60" y="230" class="card-body">• Copies N pointers into new buffer</text>

  <rect x="45" y="280" width="440" height="85" class="card card-red"/>
  <text x="265" y="305" class="card-title" fill="#FCA5A5">Memcpy Pointers from list_b</text>
  <text x="60" y="330" class="card-body">• Copies K pointers into new buffer</text>
  <text x="60" y="348" class="card-body" fill="#EF4444">• High overhead: Total O(N + K) allocation &amp; copies</text>

  <path fill="none" d="M 265 160 L 265 180" class="edge edge-red" marker-end="url(#arr-r6py)"/>
  <path fill="none" d="M 265 260 L 265 280" class="edge edge-red" marker-end="url(#arr-r6py)"/>

  <!-- Right: list_a.extend(list_b) -->
  <rect x="555" y="25" width="480" height="370" class="pillar-box" stroke="#10B981"/>
  <text x="795" y="55" class="title-text" fill="#6EE7B7">2. In-Place Extension: list_a.extend(list_b)</text>

  <rect x="575" y="80" width="440" height="75" class="card card-amber"/>
  <text x="795" y="105" class="card-title" fill="#FDE68A">Check Buffer Capacity</text>
  <text x="590" y="130" class="card-body">Is allocated capacity &gt;= (N + K)?</text>

  <rect x="575" y="180" width="440" height="80" class="card card-amber"/>
  <text x="795" y="205" class="card-title" fill="#FDE68A">Geometric Over-Allocation (If needed)</text>
  <text x="590" y="230" class="card-body">• list_resize() allocates: (N+K) + ((N+K) &gt;&gt; 3) + 6</text>
  <text x="590" y="248" class="card-body">• Amortized O(1) growth per appended item</text>

  <rect x="575" y="280" width="440" height="85" class="card card-green"/>
  <text x="795" y="305" class="card-title" fill="#6EE7B7">Memmove Pointers from list_b</text>
  <text x="590" y="330" class="card-body">• Appends directly into list_a contiguous array</text>
  <text x="590" y="348" class="card-body" fill="#34D399">• Zero object re-allocation | Highly efficient in loops</text>

  <path fill="none" d="M 795 155 L 795 180" class="edge edge-amber" marker-end="url(#arr-a6py)"/>
  <text x="835" y="170" class="edge-label" fill="#FDE68A">Full</text>

  <path fill="none" d="M 795 260 L 795 280" class="edge edge-green" marker-end="url(#arr-g6py)"/>

  <!-- Bypass direct if capacity available -->
  <path fill="none" d="M 575 117 C 540 117, 540 322, 561 322 L 575 322" class="edge edge-green" marker-end="url(#arr-g6py)"/>
  <text x="525" y="210" class="edge-label" fill="#6EE7B7">Spare</text>
</svg>
