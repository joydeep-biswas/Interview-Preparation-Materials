<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .card { fill: #111827; stroke-width: 1.5; rx: 10; ry: 10; }
      .card-gray { stroke: #64748B; }
      .card-blue { stroke: #3B82F6; }
      .card-amber { stroke: #F59E0B; }
      .card-green { stroke: #10B981; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #F3F4F6; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #9CA3AF; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
      .edge-blue { stroke: #3B82F6; }
      .edge-amber { stroke: #F59E0B; }
      .edge-green { stroke: #10B981; }
    </style>
    <marker id="arr-b8py" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-a8py" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-g8py" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <text x="480" y="32" class="title-text">Merge Overlapping Intervals: Timsort &amp; Single-Pass Scan</text>

  <!-- Step 1 -->
  <rect x="30" y="65" width="200" height="120" class="card card-gray"/>
  <text x="130" y="92" class="card-title" fill="#CBD5E1">1. Unsorted Input</text>
  <text x="45" y="117" class="card-body">• [1, 3]</text>
  <text x="45" y="137" class="card-body">• [8, 10]</text>
  <text x="45" y="157" class="card-body">• [2, 6], [15, 18]</text>

  <!-- Step 2 -->
  <rect x="260" y="65" width="200" height="120" class="card card-blue"/>
  <text x="360" y="92" class="card-title" fill="#93C5FD">2. Timsort by Start</text>
  <text x="275" y="117" class="card-body">• [1, 3]</text>
  <text x="275" y="137" class="card-body">• [2, 6]</text>
  <text x="275" y="157" class="card-body">• [8, 10], [15, 18]</text>

  <!-- Step 3 -->
  <rect x="490" y="65" width="220" height="120" class="card card-amber"/>
  <text x="600" y="92" class="card-title" fill="#FDE68A">3. Overlap Merge</text>
  <text x="505" y="117" class="card-body">• 2 &lt;= 3 -&gt; Merge [1, 6]</text>
  <text x="505" y="137" class="card-body">• 8 &gt; 6 -&gt; Disjoint: Emit</text>
  <text x="505" y="157" class="card-body">• 15 &gt; 10 -&gt; Disjoint: Emit</text>

  <!-- Step 4 -->
  <rect x="740" y="65" width="190" height="120" class="card card-green"/>
  <text x="835" y="92" class="card-title" fill="#6EE7B7">4. Consolidated</text>
  <text x="755" y="117" class="card-body" fill="#34D399">• [1, 6]</text>
  <text x="755" y="137" class="card-body" fill="#34D399">• [8, 10]</text>
  <text x="755" y="157" class="card-body" fill="#34D399">• [15, 18]</text>

  <!-- Straight Horizontal Connectors -->
  <path fill="none" d="M 230 125 L 260 125" class="edge edge-blue" marker-end="url(#arr-b8py)"/>
  <path fill="none" d="M 460 125 L 490 125" class="edge edge-amber" marker-end="url(#arr-a8py)"/>
  <path fill="none" d="M 710 125 L 740 125" class="edge edge-green" marker-end="url(#arr-g8py)"/>
</svg>
