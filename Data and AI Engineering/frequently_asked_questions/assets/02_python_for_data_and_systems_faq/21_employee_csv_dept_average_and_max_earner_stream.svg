<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 380" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .pillar-box { fill: #111827; stroke-width: 2; rx: 10; ry: 10; }
      .card { fill: #1E293B; stroke-width: 1.5; rx: 8; ry: 8; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94A3B8; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
    </style>
    <marker id="arr-b21" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g21" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <rect x="25" y="25" width="1010" height="330" class="pillar-box" stroke="#3B82F6"/>
  <text x="530" y="55" class="title-text" fill="#60A5FA">Two-Pass Streaming CSV Architecture: O(D) Department Memory</text>

  <!-- Pass 1 -->
  <rect x="50" y="85" width="280" height="240" class="card" stroke="#3B82F6"/>
  <text x="190" y="115" class="card-title" fill="#93C5FD">Pass 1: Department Averages</text>
  <text x="65" y="145" class="card-body" fill="#F8FAFC">• Stream CSV row-by-row via DictReader</text>
  <text x="65" y="170" class="card-body">• Accumulate: totals[dept] += salary</text>
  <text x="65" y="195" class="card-body">• Accumulate: counts[dept] += 1</text>
  <text x="65" y="220" class="card-body" fill="#93C5FD">• Compute: avg[d] = totals[d] / counts[d]</text>
  <text x="65" y="255" class="card-body" fill="#10B981">• Memory: O(D) where D = unique depts</text>
  <text x="65" y="280" class="card-body" fill="#94A3B8">• NEVER loads full CSV into RAM</text>

  <!-- Arrow Pass 1 -> Pass 2 -->
  <path d="M 330 205 L 380 205" class="edge" stroke="#3B82F6" marker-end="url(#arr-b21)"/>

  <!-- Pass 2 -->
  <rect x="390" y="85" width="310" height="240" class="card" stroke="#F59E0B"/>
  <text x="545" y="115" class="card-title" fill="#FCD34D">Pass 2: Filter &amp; Highest Earner</text>
  <text x="405" y="145" class="card-body" fill="#F8FAFC">• file.seek(0) (Rewind stream)</text>
  <text x="405" y="170" class="card-body" fill="#FCD34D">• Filter: if emp.salary &gt; avg[dept]:</text>
  <text x="405" y="195" class="card-body">• Compare against max_salary[dept]:</text>
  <text x="405" y="220" class="card-body">  - If salary &gt; current_max: new winner</text>
  <text x="405" y="245" class="card-body">  - If salary == current_max: append (TIE!)</text>
  <text x="405" y="280" class="card-body" fill="#10B981">• Space: O(D) storage for winners</text>

  <!-- Arrow Pass 2 -> Result -->
  <path d="M 700 205 L 750 205" class="edge" stroke="#10B981" marker-end="url(#arr-g21)"/>

  <!-- Output Result -->
  <rect x="760" y="85" width="250" height="240" class="card" stroke="#10B981"/>
  <text x="885" y="115" class="card-title" fill="#34D399">Output: Top Qualifying Earners</text>
  <text x="775" y="145" class="card-body" fill="#F8FAFC">• Engineering (Avg: $120k):</text>
  <text x="775" y="170" class="card-body" fill="#34D399">  Winner: Alice ($160k)</text>
  <text x="775" y="200" class="card-body" fill="#F8FAFC">• Sales (Avg: $95k):</text>
  <text x="775" y="225" class="card-body" fill="#34D399">  Winners: Bob ($130k), Dan ($130k)</text>
  <text x="775" y="260" class="card-body" fill="#C084FC">• Total Time: 2 * O(N) = O(N)</text>
  <text x="775" y="285" class="card-body" fill="#C084FC">• Peak RAM: &lt; 5 MB on 100M rows</text>
</svg>

