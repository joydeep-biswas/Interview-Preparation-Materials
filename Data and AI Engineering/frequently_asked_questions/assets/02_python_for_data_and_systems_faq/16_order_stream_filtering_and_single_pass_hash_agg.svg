<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .card { fill: #111827; stroke-width: 1.5; rx: 10; ry: 10; }
      .card-blue { stroke: #3B82F6; }
      .card-purple { stroke: #8B5CF6; }
      .card-green { stroke: #10B981; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #F3F4F6; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #9CA3AF; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
      .edge-purple { stroke: #8B5CF6; }
      .edge-green { stroke: #10B981; }
    </style>
    <marker id="arr-p16py" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-g16py" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <text x="480" y="32" class="title-text">Streaming Ingestion: Generator Filter &amp; Single-Pass Hash Aggregation</text>

  <!-- Step 1 -->
  <rect x="30" y="65" width="220" height="120" class="card card-blue"/>
  <text x="140" y="92" class="card-title" fill="#93C5FD">1. Ingress Order Stream</text>
  <text x="45" y="117" class="card-body">• (101, 'm1', DELIV, 100)</text>
  <text x="45" y="137" class="card-body" fill="#EF4444">• (102, 'm2', CANCEL, 150)</text>
  <text x="45" y="157" class="card-body">• (103, 'm1', DELIV, 050)</text>

  <!-- Step 2 -->
  <rect x="280" y="65" width="200" height="120" class="card card-purple"/>
  <text x="380" y="92" class="card-title" fill="#D8B4FE">2. Generator Filter</text>
  <text x="295" y="117" class="card-body">• status == 'DELIVERED'</text>
  <text x="295" y="137" class="card-body">• Prunes cancelled rows</text>
  <text x="295" y="157" class="card-body" fill="#34D399">• Zero memory retention</text>

  <!-- Step 3 -->
  <rect x="510" y="65" width="220" height="120" class="card card-green"/>
  <text x="620" y="92" class="card-title" fill="#6EE7B7">3. Single-Pass Hash</text>
  <text x="525" y="117" class="card-body">• Dict indexed by merchant</text>
  <text x="525" y="137" class="card-body">• 'm1': count=2</text>
  <text x="525" y="157" class="card-body">• 'm1': min_ts=050</text>

  <!-- Step 4 -->
  <rect x="760" y="65" width="170" height="120" class="card card-green"/>
  <text x="845" y="92" class="card-title" fill="#6EE7B7">4. Summary Output</text>
  <text x="775" y="117" class="card-body" fill="#34D399">• [('m1', 2, 050)]</text>
  <text x="775" y="137" class="card-body">• O(M) Unique Merchants</text>
  <text x="775" y="157" class="card-body">• Constant stream rate</text>

  <!-- Straight Horizontal Connectors -->
  <path fill="none" d="M 250 125 L 280 125" class="edge edge-purple" marker-end="url(#arr-p16py)"/>
  <path fill="none" d="M 480 125 L 510 125" class="edge edge-green" marker-end="url(#arr-g16py)"/>
  <path fill="none" d="M 730 125 L 760 125" class="edge edge-green" marker-end="url(#arr-g16py)"/>
</svg>
