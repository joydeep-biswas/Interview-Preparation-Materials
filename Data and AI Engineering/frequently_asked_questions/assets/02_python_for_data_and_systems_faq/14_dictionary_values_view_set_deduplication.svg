<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .card { fill: #111827; stroke-width: 1.5; rx: 10; ry: 10; }
      .card-blue { stroke: #3B82F6; }
      .card-gray { stroke: #64748B; }
      .card-amber { stroke: #F59E0B; }
      .card-green { stroke: #10B981; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #F3F4F6; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #9CA3AF; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
      .edge-gray { stroke: #64748B; }
      .edge-amber { stroke: #F59E0B; }
      .edge-green { stroke: #10B981; }
    </style>
    <marker id="arr-s14py" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-a14py" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-g14py" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <text x="480" y="32" class="title-text">Dictionary Values View: Zero-Copy Set Deduplication</text>

  <!-- Step 1 -->
  <rect x="30" y="65" width="210" height="120" class="card card-blue"/>
  <text x="135" y="92" class="card-title" fill="#93C5FD">Source Dictionary</text>
  <text x="45" y="117" class="card-body" font-family="monospace">{'u1': 'US',</text>
  <text x="45" y="137" class="card-body" font-family="monospace"> 'u2': 'IN',</text>
  <text x="45" y="157" class="card-body" font-family="monospace"> 'u3': 'US', 'u4': 'UK'}</text>

  <!-- Step 2 -->
  <rect x="270" y="65" width="200" height="120" class="card card-gray"/>
  <text x="370" y="92" class="card-title" fill="#CBD5E1">1. d.values() View</text>
  <text x="285" y="117" class="card-body">• dict_values view</text>
  <text x="285" y="137" class="card-body">• Zero list allocation</text>
  <text x="285" y="157" class="card-body" fill="#34D399">• Constant O(1) RAM</text>

  <!-- Step 3 -->
  <rect x="500" y="65" width="200" height="120" class="card card-amber"/>
  <text x="600" y="92" class="card-title" fill="#FDE68A">2. set() Construction</text>
  <text x="515" y="117" class="card-body">• Hash table insertion</text>
  <text x="515" y="137" class="card-body">• Deduplicates 'US'</text>
  <text x="515" y="157" class="card-body">• Linear O(N) pass</text>

  <!-- Step 4 -->
  <rect x="730" y="65" width="200" height="120" class="card card-green"/>
  <text x="830" y="92" class="card-title" fill="#6EE7B7">3. Unique Output</text>
  <text x="745" y="117" class="card-body" fill="#34D399">• {'US', 'IN', 'UK'}</text>
  <text x="745" y="137" class="card-body">• 3 Unique values</text>
  <text x="745" y="157" class="card-body">• Clean distinct array</text>

  <!-- Straight Horizontal Connectors -->
  <path fill="none" d="M 240 125 L 270 125" class="edge edge-gray" marker-end="url(#arr-s14py)"/>
  <path fill="none" d="M 470 125 L 500 125" class="edge edge-amber" marker-end="url(#arr-a14py)"/>
  <path fill="none" d="M 700 125 L 730 125" class="edge edge-green" marker-end="url(#arr-g14py)"/>
</svg>
