<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 360" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .card { fill: #111827; stroke-width: 1.5; rx: 10; ry: 10; }
      .card-blue { stroke: #3B82F6; }
      .card-amber { stroke: #F59E0B; }
      .card-green { stroke: #10B981; }
      .card-red { stroke: #EF4444; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #F3F4F6; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #9CA3AF; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
      .edge-blue { stroke: #3B82F6; }
      .edge-amber { stroke: #F59E0B; }
      .edge-green { stroke: #10B981; }
      .edge-red { stroke: #EF4444; }
      .edge-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
    </style>
    <marker id="arr-b15py" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-a15py" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-g15py" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
    <marker id="arr-r15py" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <text x="530" y="32" class="title-text">Enterprise ETL Pipeline: Streaming Pydantic v2 Validation &amp; DLQ Routing</text>

  <!-- Step 1 -->
  <rect x="25" y="115" width="165" height="130" class="card card-blue"/>
  <text x="107" y="142" class="card-title" fill="#93C5FD">1. Streaming Ingress</text>
  <text x="35" y="167" class="card-body">• Raw CSV / JSON</text>
  <text x="35" y="187" class="card-body">• csv.DictReader</text>
  <text x="35" y="207" class="card-body">• 10k chunk buffer</text>

  <!-- Step 2 -->
  <rect x="220" y="115" width="175" height="130" class="card card-amber"/>
  <text x="307" y="142" class="card-title" fill="#FDE68A">2. Cleanse &amp; Cast</text>
  <text x="230" y="167" class="card-body">• Strip whitespaces</text>
  <text x="230" y="187" class="card-body">• Format ISO timestamps</text>
  <text x="230" y="207" class="card-body">• Normalize empty to None</text>

  <!-- Step 3: Pydantic Gate -->
  <rect x="425" y="115" width="190" height="130" class="card card-amber"/>
  <text x="520" y="142" class="card-title" fill="#FDE68A">3. Pydantic v2 Gate</text>
  <text x="435" y="167" class="card-body">• Schema enforcement</text>
  <text x="435" y="187" class="card-body">• Strict type coercion</text>
  <text x="435" y="207" class="card-body">• Custom field validators</text>

  <!-- Step 4 Top: Batch Accumulator & Target DB -->
  <rect x="670" y="55" width="180" height="110" class="card card-green"/>
  <text x="760" y="80" class="card-title" fill="#6EE7B7">Batch Accumulator</text>
  <text x="680" y="105" class="card-body">• size = 1,000 rows</text>
  <text x="680" y="125" class="card-body">• Low memory buffer</text>
  <text x="680" y="145" class="card-body" fill="#34D399">• Prepares bulk INSERT</text>

  <rect x="880" y="55" width="155" height="110" class="card card-green"/>
  <text x="957" y="80" class="card-title" fill="#6EE7B7">Target Database</text>
  <text x="890" y="105" class="card-body">• PostgreSQL</text>
  <text x="890" y="125" class="card-body">• SQLAlchemy 2.0</text>
  <text x="890" y="145" class="card-body" fill="#34D399">• ON CONFLICT DO</text>

  <!-- Step 4 Bottom: DLQ -->
  <rect x="670" y="200" width="365" height="110" class="card card-red"/>
  <text x="852" y="225" class="card-title" fill="#FCA5A5">Dead-Letter Queue (DLQ): bad_records.jsonl</text>
  <text x="685" y="250" class="card-body" fill="#EF4444">• Captures ValidationError + unparsed raw payload string</text>
  <text x="685" y="270" class="card-body">• Shipped to S3 quarantine bucket for automated replay / alerting</text>

  <!-- Connectors with straight runways -->
  <path fill="none" d="M 190 180 L 220 180" class="edge edge-blue" marker-end="url(#arr-b15py)"/>
  <path fill="none" d="M 395 180 L 425 180" class="edge edge-amber" marker-end="url(#arr-a15py)"/>

  <!-- Gate to Batch: exit 615,180 -> curve -> enter 670,110 with runway dx>=14 -->
  <path fill="none" d="M 615 180 C 635 180, 645 110, 656 110 L 670 110" class="edge edge-green" marker-end="url(#arr-g15py)"/>
  <text x="645" y="135" class="edge-label" fill="#6EE7B7">Valid</text>

  <!-- Batch to DB -->
  <path fill="none" d="M 850 110 L 880 110" class="edge edge-green" marker-end="url(#arr-g15py)"/>

  <!-- Gate to DLQ: exit 615,180 -> curve -> enter 670,255 with runway dx>=14 -->
  <path fill="none" d="M 615 180 C 635 180, 645 255, 656 255 L 670 255" class="edge edge-red" marker-end="url(#arr-r15py)"/>
  <text x="645" y="235" class="edge-label" fill="#EF4444">Invalid</text>
</svg>
