<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 300" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .card { fill: #111827; stroke-width: 1.5; rx: 10; ry: 10; }
      .card-blue { stroke: #3B82F6; }
      .card-amber { stroke: #F59E0B; }
      .card-green { stroke: #10B981; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #F3F4F6; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #9CA3AF; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
      .edge-amber { stroke: #F59E0B; }
      .edge-green { stroke: #10B981; }
      .edge-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
    </style>
    <marker id="arr-a13py" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-g13py" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <text x="530" y="32" class="title-text">Top-K Frequent Elements: Min-Heap O(N log K) vs Bucket Sort O(N)</text>

  <!-- Left: Frequency Map -->
  <rect x="30" y="80" width="280" height="150" class="card card-blue"/>
  <text x="170" y="110" class="card-title" fill="#93C5FD">Input &amp; Frequency Map</text>
  <text x="45" y="135" class="card-body">• nums = [1, 1, 1, 2, 2, 3], k = 2</text>
  <text x="45" y="155" class="card-body">• collections.Counter:</text>
  <text x="45" y="175" class="card-body" font-family="monospace">  { 1: 3, 2: 2, 3: 1 }</text>
  <text x="45" y="195" class="card-body">• N = 6 elements, U = 3 unique</text>

  <!-- Right Top: Min Heap -->
  <rect x="390" y="60" width="640" height="95" class="card card-amber"/>
  <text x="710" y="85" class="card-title" fill="#FDE68A">Method A: Min-Heap of Size K = 2 (O(N log K))</text>
  <text x="405" y="110" class="card-body">• Maintain min-heap of size K=2 | heappop() drops smallest when size &gt; K</text>
  <text x="405" y="130" class="card-body">• Final heap holds: [(2, 2), (3, 1)] -&gt; Result: [2, 1] | Best when K &lt;&lt; N</text>

  <!-- Right Bottom: Bucket Sort -->
  <rect x="390" y="175" width="640" height="95" class="card card-green"/>
  <text x="710" y="200" class="card-title" fill="#6EE7B7">Method B: Bucket Sort by Frequency (O(N) Strict Linear)</text>
  <text x="405" y="225" class="card-body">• Buckets array: Bucket[3]=[1], Bucket[2]=[2], Bucket[1]=[3]</text>
  <text x="405" y="245" class="card-body" fill="#34D399">• Traverse in reverse from Bucket[N] down: collect K elements -&gt; [1, 2]</text>

  <!-- Connectors with straight runways -->
  <path fill="none" d="M 310 155 C 345 155, 360 107, 376 107 L 390 107" class="edge edge-amber" marker-end="url(#arr-a13py)"/>
  <path fill="none" d="M 310 155 C 345 155, 360 222, 376 222 L 390 222" class="edge edge-green" marker-end="url(#arr-g13py)"/>
</svg>
