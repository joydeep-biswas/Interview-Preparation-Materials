<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19"/>

  <!-- Left: GitOps & IaC -->
  <rect x="25" y="40" width="180" height="290" rx="10" ry="10" fill="#0D1526" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="40" y="65" class="title-txt" fill="#FDE68A">1. IaC &amp; GitOps</text>

  <rect x="35" y="85" width="160" height="75" rx="8" ry="8" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="115" y="108" class="title-txt" text-anchor="middle">Terraform State</text>
  <text x="45" y="130" class="body-txt" text-anchor="start">• Declarative cloud infra</text>
  <text x="45" y="146" class="mono-txt" text-anchor="start">S3 / DynamoDB Lock</text>

  <rect x="35" y="180" width="160" height="75" rx="8" ry="8" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="115" y="204" class="title-txt" text-anchor="middle">ArgoCD Sync</text>
  <text x="45" y="226" class="body-txt" text-anchor="start">• GitOps reconciliation</text>
  <text x="45" y="242" class="mono-txt" text-anchor="start">Automated deploy</text>

  <path d="M 205 185 L 255 185" fill="none" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <!-- Center: Kubernetes Platform Cluster -->
  <rect x="255" y="30" width="370" height="320" rx="12" ry="12" fill="#0D1526" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="275" y="55" class="title-txt" fill="#93C5FD">2. Kubernetes Platform Cluster</text>

  <rect x="275" y="75" width="330" height="50" rx="6" ry="6" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="290" y="98" class="title-txt" text-anchor="start">Cloud Ingress / Load Balancer</text>
  <text x="290" y="114" class="mono-txt" text-anchor="start">TLS termination, path routing</text>

  <rect x="275" y="140" width="330" height="190" rx="8" ry="8" fill="#111827" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="290" y="165" class="title-txt" text-anchor="start" fill="#C4B5FD">Compute Workload Fleet:</text>

  <rect x="290" y="180" width="300" height="40" rx="6" ry="6" fill="#0D1526" stroke="#3B82F6" stroke-width="1"/>
  <text x="305" y="204" class="body-txt" text-anchor="start">• FastAPI Pods (HPA auto-scaled on CPU/RPS)</text>

  <rect x="290" y="230" width="300" height="40" rx="6" ry="6" fill="#0D1526" stroke="#8B5CF6" stroke-width="1"/>
  <text x="305" y="254" class="body-txt" text-anchor="start">• vLLM GPU Pods (Startup &amp; Liveness probes)</text>

  <rect x="290" y="280" width="300" height="40" rx="6" ry="6" fill="#0D1526" stroke="#10B981" stroke-width="1"/>
  <text x="305" y="304" class="body-txt" text-anchor="start">• KubeRay Distributed Worker Fleet</text>

  <path d="M 625 185 L 675 185" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Right: Telemetry & Observability Mesh -->
  <rect x="675" y="30" width="260" height="320" rx="12" ry="12" fill="#0D1526" stroke="#10B981" stroke-width="1.5"/>
  <text x="695" y="55" class="title-txt" fill="#6EE7B7">3. Observability Mesh</text>

  <rect x="695" y="75" width="220" height="60" rx="6" ry="6" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="705" y="98" class="title-txt" text-anchor="start" fill="#A7F3D0">OTel Collector</text>
  <text x="705" y="118" class="body-txt" text-anchor="start">DaemonSet: Traces &amp; Spans</text>

  <rect x="695" y="145" width="220" height="60" rx="6" ry="6" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="705" y="168" class="title-txt" text-anchor="start" fill="#FDE68A">Prometheus TSDB</text>
  <text x="705" y="188" class="body-txt" text-anchor="start">GPU metrics exporter scrape</text>

  <rect x="695" y="215" width="220" height="60" rx="6" ry="6" fill="#111827" stroke="#EF4444" stroke-width="1.5"/>
  <text x="705" y="238" class="title-txt" text-anchor="start" fill="#FCA5A5">Alertmanager</text>
  <text x="705" y="258" class="body-txt" text-anchor="start">PagerDuty P1 Incident triggers</text>

  <rect x="695" y="285" width="220" height="50" rx="6" ry="6" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="705" y="308" class="title-txt" text-anchor="start" fill="#93C5FD">Grafana Dashboards (SLO/SLI)</text>
</svg>