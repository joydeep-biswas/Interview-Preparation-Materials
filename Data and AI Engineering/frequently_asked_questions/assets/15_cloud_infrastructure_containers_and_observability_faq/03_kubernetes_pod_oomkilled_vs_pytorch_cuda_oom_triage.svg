<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19"/>

  <!-- Alert -->
  <rect x="360" y="20" width="240" height="55" rx="8" ry="8" fill="#7F1D1D" stroke="#EF4444" stroke-width="1.5"/>
  <text x="480" y="44" class="title-txt" text-anchor="middle" fill="#FECACA">Memory Allocation Failure</text>
  <text x="480" y="60" class="sub-txt" text-anchor="middle">Triage: CUDA VRAM vs Host RAM</text>

  <!-- Connector Down to Diamond -->
  <path d="M 480 75 L 480 100" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- Decision Diamond -->
  <polygon points="480,100 580,135 480,170 380,135" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="480" y="130" class="title-txt" text-anchor="middle">Allocation</text>
  <text x="480" y="146" class="sub-txt" text-anchor="middle">Target Domain?</text>

  <!-- Left: GPU VRAM Allocation -->
  <path d="M 380 135 L 245 135 Q 230 135 230 150 L 230 180" fill="none" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <rect x="250" y="122" width="110" height="18" rx="4" ry="4" fill="#1E293B"/>
  <text x="305" y="135" class="edge-txt" text-anchor="middle" fill="#F59E0B">GPU VRAM</text>

  <rect x="30" y="180" width="410" height="130" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="235" y="206" class="title-txt" text-anchor="middle" fill="#FDE68A">PyTorch CUDA Out of Memory (CUDA OOM)</text>
  <text x="42" y="230" class="body-txt" text-anchor="start">• <tspan font-weight="700">Behavior:</tspan> Process remains <tspan fill="#10B981">ALIVE</tspan>; Python exception raised</text>
  <text x="42" y="248" class="mono-txt" text-anchor="start">torch.cuda.OutOfMemoryError</text>
  <text x="42" y="272" class="title-txt" fill="#10B981">Resolution Runbook:</text>
  <text x="42" y="292" class="body-txt" text-anchor="start">• Reduce batch_size, enable gradient_checkpointing, use FlashAttention</text>

  <!-- Right: Host RAM Allocation -->
  <path d="M 580 135 L 715 135 Q 730 135 730 150 L 730 180" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <rect x="600" y="122" width="110" height="18" rx="4" ry="4" fill="#1E293B"/>
  <text x="655" y="135" class="edge-txt" text-anchor="middle" fill="#EF4444">Host RAM (cgroup)</text>

  <rect x="520" y="180" width="410" height="130" rx="10" ry="10" fill="#7F1D1D" stroke="#EF4444" stroke-width="1.5"/>
  <text x="725" y="206" class="title-txt" text-anchor="middle" fill="#FECACA">Kubernetes Pod OOMKilled (Exit Code 137)</text>
  <text x="532" y="230" class="body-txt" text-anchor="start">• <tspan font-weight="700">Behavior:</tspan> Process instantly killed by kernel (<tspan fill="#EF4444">SIGKILL 9</tspan>)</text>
  <text x="532" y="248" class="mono-txt" text-anchor="start">Host RAM exceeded cgroup resources.limits.memory</text>
  <text x="532" y="272" class="title-txt" fill="#FCA5A5">Resolution Runbook:</text>
  <text x="532" y="292" class="body-txt" text-anchor="start">• Increase pod resources.limits.memory or fix DataLoader leak</text>
</svg>