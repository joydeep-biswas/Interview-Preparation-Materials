<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94A3B8" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Step 1 Header Box -->
  <rect x="220" y="20" width="480" height="65" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="460" y="45" class="title-txt" text-anchor="middle">Step 1: Orchestrator Gantt Chart (Airflow / ADF)</text>
  <text x="460" y="65" class="sub-txt" text-anchor="middle">Which exact task consumed the extra 2.5 hours?</text>

  <!-- Arrow down to decision -->
  <path d="M 460 85 L 460 115" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Step 2 Decision Diamond -->
  <polygon points="460,115 620,165 460,215 300,165" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="460" y="160" class="title-txt" text-anchor="middle">Task Category?</text>
  <text x="460" y="178" class="sub-txt" text-anchor="middle">Ingest vs Transform vs Load</text>

  <!-- Left Branch: Ingestion / Source -->
  <path d="M 300 165 L 180 165 Q 165 165 165 180 L 165 240" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <rect x="180" y="152" width="90" height="18" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="225" y="165" class="edge-txt" text-anchor="middle" fill="#EF4444">Ingestion / Source</text>

  <rect x="50" y="240" width="240" height="110" rx="10" ry="10" fill="#111827" stroke="#EF4444" stroke-width="1.5"/>
  <text x="170" y="266" class="title-txt" text-anchor="middle" fill="#EF4444">Source &amp; Network Bottleneck</text>
  <text x="62" y="290" class="body-txt" text-anchor="start">• Source DB connection throttle</text>
  <text x="62" y="310" class="body-txt" text-anchor="start">• Table lock / blocking SPIDs</text>
  <text x="62" y="330" class="body-txt" text-anchor="start">• WAN/VPN bandwidth saturating</text>

  <!-- Center Branch: Transformation -->
  <path d="M 460 215 L 460 240" fill="none" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <rect x="470" y="215" width="90" height="18" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="515" y="228" class="edge-txt" text-anchor="middle" fill="#8B5CF6">Transformation</text>

  <rect x="340" y="240" width="240" height="110" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="460" y="266" class="title-txt" text-anchor="middle" fill="#C084FC">Compute Engine Health</text>
  <text x="352" y="290" class="body-txt" text-anchor="start">• Spark data skew (straggler task)</text>
  <text x="352" y="310" class="body-txt" text-anchor="start">• OOM spills to disk (shuffle spill)</text>
  <text x="352" y="330" class="body-txt" text-anchor="start">• Executor node preemption / GC</text>

  <!-- Right Branch: Target Load -->
  <path d="M 620 165 L 740 165 Q 755 165 755 180 L 755 240" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="650" y="152" width="80" height="18" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="690" y="165" class="edge-txt" text-anchor="middle" fill="#10B981">Target Load</text>

  <rect x="630" y="240" width="250" height="110" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="755" y="266" class="title-txt" text-anchor="middle" fill="#10B981">Target Sink Contention</text>
  <text x="642" y="290" class="body-txt" text-anchor="start">• Delta Lake transaction conflict</text>
  <text x="642" y="310" class="body-txt" text-anchor="start">• Small file compaction backlog</text>
  <text x="642" y="330" class="body-txt" text-anchor="start">• Synapse PolyBase / COPY throttled</text>
</svg>