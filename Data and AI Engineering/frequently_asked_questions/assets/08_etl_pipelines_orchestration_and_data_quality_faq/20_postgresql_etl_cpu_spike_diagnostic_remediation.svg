<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94A3B8" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Left: CPU Spike Alert -->
  <rect x="25" y="70" width="180" height="120" rx="10" ry="10" fill="#7F1D1D" stroke="#EF4444" stroke-width="1.5"/>
  <text x="115" y="96" class="title-txt" text-anchor="middle" fill="#FECACA">🚨 PostgreSQL CPU Spike</text>
  <text x="37" y="122" class="body-txt" text-anchor="start">• CPU at 95% during ETL</text>
  <text x="37" y="142" class="body-txt" text-anchor="start">• Query latency degrading</text>
  <text x="37" y="162" class="mono-txt" text-anchor="start">50 concurrent workers</text>

  <path d="M 205 130 L 255 130" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- Step 1: Identify Query -->
  <rect x="255" y="70" width="200" height="120" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="355" y="96" class="title-txt" text-anchor="middle">1. Identify Query</text>
  <text x="267" y="122" class="mono-txt" text-anchor="start">SELECT * FROM pg_stat_activity</text>
  <text x="267" y="142" class="body-txt" text-anchor="start">• Identify active long queries</text>
  <text x="267" y="162" class="mono-txt" text-anchor="start">WHERE state = 'active'</text>

  <path d="M 455 130 L 505 130" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Step 2: EXPLAIN ANALYZE -->
  <rect x="505" y="70" width="200" height="120" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="605" y="96" class="title-txt" text-anchor="middle">2. Run EXPLAIN ANALYZE</text>
  <text x="517" y="122" class="mono-txt" text-anchor="start">EXPLAIN (ANALYZE, BUFFERS)</text>
  <text x="517" y="142" class="body-txt" text-anchor="start">• Detects <tspan fill="#EF4444">Seq Scan</tspan> on 50M rows</text>
  <text x="517" y="162" class="body-txt" text-anchor="start">• Missing index on updated_at</text>

  <path d="M 705 130 L 755 130" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Step 3: Remediation -->
  <rect x="755" y="55" width="180" height="150" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="845" y="80" class="title-txt" text-anchor="middle" fill="#10B981">3. Remediation</text>
  <text x="767" y="104" class="mono-txt" text-anchor="start">CREATE INDEX CONCURRENTLY</text>
  <text x="767" y="122" class="mono-txt" text-anchor="start">ON orders (updated_at);</text>
  <text x="767" y="146" class="body-txt" text-anchor="start">• Switch to Read Replica</text>
  <text x="767" y="166" class="body-txt" text-anchor="start">• Throttle batch chunk size</text>
  <text x="767" y="186" class="badge-txt" fill="#10B981">✓ CPU Drops to 15%</text>
</svg>