<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94A3B8" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19"/>

  <!-- Stage 1 Container -->
  <rect x="30" y="25" width="900" height="150" rx="12" ry="12" fill="#0D1526" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="50" y="50" class="title-txt" fill="#67E8F9">Stage 1: Landing &amp; Document Intelligence</text>

  <rect x="50" y="70" width="220" height="85" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="160" y="96" class="title-txt" text-anchor="middle">Raw Documents</text>
  <text x="62" y="120" class="body-txt" text-anchor="start">• PDFs, Invoices, Scans</text>
  <text x="62" y="138" class="body-txt" text-anchor="start">• Multi-page TIFFs</text>

  <path d="M 270 112 L 340 112" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <rect x="340" y="70" width="240" height="85" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="460" y="96" class="title-txt" text-anchor="middle">ADLS Gen2 Landing</text>
  <text x="352" y="120" class="body-txt" text-anchor="start">• Raw binary storage</text>
  <text x="352" y="138" class="mono-txt" text-anchor="start">abfss://landing/raw_docs/</text>

  <path d="M 580 112 L 650 112" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <rect x="650" y="70" width="260" height="85" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="780" y="96" class="title-txt" text-anchor="middle">Document Intelligence</text>
  <text x="662" y="120" class="body-txt" text-anchor="start">• Azure AI Doc Intelligence</text>
  <text x="662" y="138" class="body-txt" text-anchor="start">• OCR, Layout &amp; Table Parser</text>

  <!-- Connecting Line Stage 1 -> Stage 2 -->
  <path d="M 780 155 L 780 180 Q 780 195 765 195 L 200 195 Q 185 195 185 210 L 185 240" fill="none" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- Stage 2 Container -->
  <rect x="30" y="210" width="900" height="150" rx="12" ry="12" fill="#0D1526" stroke="#10B981" stroke-width="1.5"/>
  <text x="50" y="235" class="title-txt" fill="#6EE7B7">Stage 2: Extraction &amp; Multimodal Storage</text>

  <rect x="70" y="250" width="230" height="90" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="185" y="276" class="title-txt" text-anchor="middle">Parsed Output</text>
  <text x="82" y="300" class="body-txt" text-anchor="start">• Clean JSON key-values</text>
  <text x="82" y="318" class="body-txt" text-anchor="start">• Markdown text chunks</text>

  <!-- Fork 1: Embeddings & Vector -->
  <path d="M 300 280 L 370 280" fill="none" stroke="#06B6D4" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="370" y="250" width="240" height="90" rx="10" ry="10" fill="#111827" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="490" y="276" class="title-txt" text-anchor="middle">Embedding Model</text>
  <text x="382" y="300" class="mono-txt" text-anchor="start">text-embedding-3-large</text>
  <text x="382" y="318" class="body-txt" text-anchor="start">• Generates 3072-d vectors</text>

  <path d="M 610 280 L 670 280" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="670" y="250" width="240" height="90" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="790" y="276" class="title-txt" text-anchor="middle">Vector Search &amp; Delta</text>
  <text x="682" y="300" class="body-txt" text-anchor="start">• Azure AI Search index</text>
  <text x="682" y="318" class="mono-txt" text-anchor="start">gold.fact_invoices (Delta)</text>
</svg>