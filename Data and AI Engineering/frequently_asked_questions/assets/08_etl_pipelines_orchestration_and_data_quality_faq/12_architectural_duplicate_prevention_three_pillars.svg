<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94A3B8" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Left: Root Causes Container -->
  <rect x="30" y="25" width="410" height="250" rx="12" ry="12" fill="#0D1526" stroke="#EF4444" stroke-width="1.5"/>
  <text x="50" y="52" class="title-txt" fill="#FCA5A5">Why Duplicates Occurred (Root Causes)</text>

  <rect x="50" y="70" width="370" height="50" rx="8" ry="8" fill="#111827" stroke="#EF4444" stroke-width="1.5"/>
  <text x="65" y="93" class="title-txt" text-anchor="start" fill="#EF4444">1. Pipeline Concurrency Uncapped</text>
  <text x="65" y="108" class="sub-txt" text-anchor="start">Default allows unlimited concurrent scheduled runs</text>

  <rect x="50" y="130" width="370" height="50" rx="8" ry="8" fill="#111827" stroke="#EF4444" stroke-width="1.5"/>
  <text x="65" y="153" class="title-txt" text-anchor="start" fill="#EF4444">2. Naive Sink Append Mode</text>
  <text x="65" y="168" class="sub-txt" text-anchor="start">Retries blindly APPEND duplicate rows</text>

  <rect x="50" y="190" width="370" height="50" rx="8" ry="8" fill="#111827" stroke="#EF4444" stroke-width="1.5"/>
  <text x="65" y="213" class="title-txt" text-anchor="start" fill="#EF4444">3. Watermark Race Condition</text>
  <text x="65" y="228" class="sub-txt" text-anchor="start">Watermark updated before write commitment completes</text>

  <!-- Connectors -->
  <path d="M 420 95 L 485 95" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M 420 155 L 485 155" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M 420 215 L 485 215" fill="none" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- Right: 3-Pillar Invariants Container -->
  <rect x="490" y="25" width="440" height="250" rx="12" ry="12" fill="#0D1526" stroke="#10B981" stroke-width="1.5"/>
  <text x="510" y="52" class="title-txt" fill="#6EE7B7">The 3-Pillar Architectural Invariants</text>

  <rect x="510" y="70" width="400" height="50" rx="8" ry="8" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="525" y="93" class="title-txt" text-anchor="start" fill="#93C5FD">Pillar 1: Explicit Concurrency = 1</text>
  <text x="525" y="108" class="sub-txt" text-anchor="start">Lock ADF pipeline JSON: "concurrency": 1</text>

  <rect x="510" y="130" width="400" height="50" rx="8" ry="8" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="525" y="153" class="title-txt" text-anchor="start" fill="#10B981">Pillar 2: Idempotent Sink Merge</text>
  <text x="525" y="168" class="sub-txt" text-anchor="start">Delta MERGE INTO or partition overwrite at sink</text>

  <rect x="510" y="190" width="400" height="50" rx="8" ry="8" fill="#111827" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="525" y="213" class="title-txt" text-anchor="start" fill="#C084FC">Pillar 3: Atomic Watermark Advancement</text>
  <text x="525" y="228" class="sub-txt" text-anchor="start">Advance watermark inside the target transaction</text>
</svg>