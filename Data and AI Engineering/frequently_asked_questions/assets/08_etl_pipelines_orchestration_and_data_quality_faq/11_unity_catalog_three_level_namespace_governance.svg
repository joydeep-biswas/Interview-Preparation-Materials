<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94A3B8" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Left: Namespace Container -->
  <rect x="30" y="25" width="410" height="270" rx="12" ry="12" fill="#0D1526" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="50" y="52" class="title-txt" fill="#93C5FD">Unity Catalog 3-Level Namespace</text>

  <!-- Level 1: Catalog -->
  <rect x="50" y="70" width="370" height="55" rx="8" ry="8" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="65" y="94" class="title-txt" text-anchor="start">1. Catalog: prod_analytics</text>
  <text x="65" y="112" class="body-txt" text-anchor="start">• Root storage container / ADLS Gen2 account</text>

  <path d="M 235 125 L 235 145" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Level 2: Schema -->
  <rect x="50" y="145" width="370" height="55" rx="8" ry="8" fill="#111827" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="65" y="169" class="title-txt" text-anchor="start">2. Schema: finance / customer_360</text>
  <text x="65" y="187" class="body-txt" text-anchor="start">• Logical business domain boundaries</text>

  <path d="M 235 200 L 235 220" fill="none" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- Level 3: Table -->
  <rect x="50" y="220" width="370" height="55" rx="8" ry="8" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="65" y="244" class="title-txt" text-anchor="start">3. Table: fact_transactions</text>
  <text x="65" y="262" class="mono-txt" text-anchor="start">prod_analytics.finance.fact_transactions</text>

  <!-- Horizontal connector to Enforcement Policies -->
  <path d="M 420 247 L 490 247" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Right: Enforcement Policies Container -->
  <rect x="490" y="25" width="440" height="270" rx="12" ry="12" fill="#0D1526" stroke="#10B981" stroke-width="1.5"/>
  <text x="510" y="52" class="title-txt" fill="#6EE7B7">Governance Enforcement Policies</text>

  <!-- Row Filter -->
  <rect x="510" y="70" width="400" height="60" rx="8" ry="8" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="525" y="94" class="title-txt" text-anchor="start" fill="#F59E0B">Row-Level Security (Row Filter)</text>
  <text x="525" y="114" class="mono-txt" text-anchor="start">region_code = CURRENT_USER_REGION()</text>

  <!-- Column Mask -->
  <rect x="510" y="145" width="400" height="60" rx="8" ry="8" fill="#111827" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="525" y="169" class="title-txt" text-anchor="start" fill="#C084FC">Column-Level Security (Masking)</text>
  <text x="525" y="189" class="mono-txt" text-anchor="start">CASE WHEN IS_MEMBER('hr') THEN ssn ELSE 'XXX' END</text>

  <!-- Lineage -->
  <rect x="510" y="220" width="400" height="60" rx="8" ry="8" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="525" y="244" class="title-txt" text-anchor="start" fill="#10B981">Automated Column-Level Lineage</text>
  <text x="525" y="264" class="body-txt" text-anchor="start">Audit graph: Source SQL → Transformation → PowerBI</text>
</svg>