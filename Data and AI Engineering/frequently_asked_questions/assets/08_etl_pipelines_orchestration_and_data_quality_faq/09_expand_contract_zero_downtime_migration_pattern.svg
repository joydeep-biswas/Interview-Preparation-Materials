<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94A3B8" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Phase 1: Expand -->
  <rect x="25" y="50" width="210" height="150" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="130" y="76" class="title-txt" text-anchor="middle">Phase 1: Expand</text>
  <text x="37" y="102" class="body-txt" text-anchor="start">• Add new column <tspan class="mono-txt">client_uuid</tspan></text>
  <text x="37" y="122" class="body-txt" text-anchor="start">• Must be NULLable</text>
  <text x="37" y="142" class="body-txt" text-anchor="start">• Update ETL to dual-write</text>
  <text x="37" y="162" class="body-txt" text-anchor="start">• Write to old &amp; new cols</text>
  <text x="37" y="182" class="mono-txt" text-anchor="start">Zero consumer impact</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M 235 125 L 265 125" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Phase 2: Backfill -->
  <rect x="265" y="50" width="210" height="150" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="370" y="76" class="title-txt" text-anchor="middle">Phase 2: Backfill</text>
  <text x="277" y="102" class="body-txt" text-anchor="start">• Background async job</text>
  <text x="277" y="122" class="mono-txt" text-anchor="start">UPDATE orders</text>
  <text x="277" y="142" class="mono-txt" text-anchor="start">SET client_uuid = id</text>
  <text x="277" y="162" class="mono-txt" text-anchor="start">WHERE client_uuid IS NULL</text>
  <text x="277" y="182" class="body-txt" text-anchor="start">• Batched to avoid locks</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M 475 125 L 505 125" fill="none" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <!-- Phase 3: Abstraction -->
  <rect x="505" y="50" width="210" height="150" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="610" y="76" class="title-txt" text-anchor="middle">Phase 3: Abstraction</text>
  <text x="517" y="102" class="body-txt" text-anchor="start">• Expose compatibility view</text>
  <text x="517" y="122" class="mono-txt" text-anchor="start">CREATE VIEW v_orders AS</text>
  <text x="517" y="142" class="mono-txt" text-anchor="start">SELECT client_uuid AS id</text>
  <text x="517" y="162" class="body-txt" text-anchor="start">• Notify downstream BI</text>
  <text x="517" y="182" class="body-txt" text-anchor="start">• 30-day deprecation grace</text>

  <!-- Arrow 3 -> 4 -->
  <path d="M 715 125 L 745 125" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Phase 4: Contract -->
  <rect x="745" y="50" width="190" height="150" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="840" y="76" class="title-txt" text-anchor="middle" fill="#10B981">Phase 4: Contract</text>
  <text x="757" y="102" class="body-txt" text-anchor="start">• Remove old dual-write</text>
  <text x="757" y="122" class="mono-txt" text-anchor="start">ALTER TABLE orders</text>
  <text x="757" y="142" class="mono-txt" text-anchor="start">DROP COLUMN cust_id</text>
  <text x="757" y="162" class="body-txt" text-anchor="start">• Make UUID NOT NULL</text>
  <text x="757" y="182" class="badge-txt" fill="#10B981">✓ Zero Downtime!</text>
</svg>