<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94A3B8" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- On-Premises Subgraph -->
  <rect x="25" y="25" width="340" height="250" rx="12" ry="12" fill="#0D1526" stroke="#64748B" stroke-width="1.5"/>
  <text x="45" y="52" class="title-txt" fill="#CBD5E1">On-Premises Datacenter</text>

  <!-- 3 Source DBs -->
  <rect x="45" y="70" width="120" height="50" rx="6" ry="6" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="105" y="92" class="title-txt" text-anchor="middle">SQL: ERP</text>
  <text x="105" y="108" class="mono-txt" text-anchor="middle">Orders</text>

  <rect x="45" y="130" width="120" height="50" rx="6" ry="6" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="105" y="152" class="title-txt" text-anchor="middle">SQL: CRM</text>
  <text x="105" y="168" class="mono-txt" text-anchor="middle">Contacts</text>

  <rect x="45" y="190" width="120" height="50" rx="6" ry="6" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="105" y="212" class="title-txt" text-anchor="middle">SQL: WMS</text>
  <text x="105" y="228" class="mono-txt" text-anchor="middle">Inventory</text>

  <!-- SHIR Cluster -->
  <path d="M 165 95 L 205 130" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
  <path d="M 165 155 L 205 155" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
  <path d="M 165 215 L 205 180" fill="none" stroke="#F59E0B" stroke-width="1.5"/>

  <rect x="205" y="90" width="140" height="130" rx="8" ry="8" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="275" y="115" class="title-txt" text-anchor="middle" fill="#F59E0B">Self-Hosted IR</text>
  <text x="215" y="138" class="body-txt" text-anchor="start">• HA 4-Node Cluster</text>
  <text x="215" y="156" class="body-txt" text-anchor="start">• Outbound 443 only</text>
  <text x="215" y="174" class="body-txt" text-anchor="start">• No inbound ports</text>
  <text x="215" y="192" class="mono-txt" text-anchor="start">Auto-load balancing</text>

  <!-- ExpressRoute Connector -->
  <path d="M 345 155 L 420 155" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="350" y="142" width="60" height="18" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="380" y="155" class="edge-txt" text-anchor="middle" fill="#38BDF8">TLS 1.3</text>

  <!-- Azure Cloud Subgraph -->
  <rect x="420" y="25" width="515" height="250" rx="12" ry="12" fill="#0D1526" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="440" y="52" class="title-txt" fill="#93C5FD">Microsoft Azure Cloud</text>

  <!-- ADF Pipeline -->
  <rect x="440" y="90" width="150" height="130" rx="8" ry="8" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="515" y="115" class="title-txt" text-anchor="middle">Azure Data Factory</text>
  <text x="450" y="138" class="body-txt" text-anchor="start">• Managed Pipeline</text>
  <text x="450" y="156" class="body-txt" text-anchor="start">• Parameterized Copy</text>
  <text x="450" y="174" class="mono-txt" text-anchor="start">@item().Database</text>
  <text x="450" y="192" class="body-txt" text-anchor="start">• High-speed pull</text>

  <path d="M 590 155 L 630 155" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- ADLS Gen2 -->
  <rect x="630" y="90" width="130" height="130" rx="8" ry="8" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="695" y="115" class="title-txt" text-anchor="middle" fill="#10B981">ADLS Gen2</text>
  <text x="640" y="138" class="body-txt" text-anchor="start">• Bronze Lake</text>
  <text x="640" y="156" class="body-txt" text-anchor="start">• Parquet staging</text>
  <text x="640" y="174" class="mono-txt" text-anchor="start">abfss://bronze/</text>
  <text x="640" y="192" class="body-txt" text-anchor="start">• Fast throughput</text>

  <path d="M 760 155 L 800 155" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Synapse / Fabric -->
  <rect x="800" y="90" width="120" height="130" rx="8" ry="8" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="860" y="115" class="title-txt" text-anchor="middle" fill="#10B981">Synapse / SQL</text>
  <text x="810" y="138" class="body-txt" text-anchor="start">• Dedicated Pool</text>
  <text x="810" y="156" class="mono-txt" text-anchor="start">COPY INTO</text>
  <text x="810" y="174" class="body-txt" text-anchor="start">• PolyBase load</text>
  <text x="810" y="192" class="badge-txt" fill="#10B981">✓ Analytics Ready</text>
</svg>