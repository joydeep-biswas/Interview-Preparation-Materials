<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94A3B8" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Left: YAML Metadata Config -->
  <rect x="25" y="40" width="260" height="220" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="155" y="66" class="title-txt" text-anchor="middle">Metadata Configuration</text>
  <text x="37" y="92" class="mono-txt" text-anchor="start">pipeline_config.yaml</text>
  <text x="37" y="115" class="mono-txt" text-anchor="start">source: postgres_orders</text>
  <text x="37" y="135" class="mono-txt" text-anchor="start">target: delta_silver_orders</text>
  <text x="37" y="155" class="mono-txt" text-anchor="start">watermark: updated_at</text>
  <text x="37" y="175" class="mono-txt" text-anchor="start">rules:</text>
  <text x="47" y="195" class="mono-txt" text-anchor="start">- not_null(order_id)</text>
  <text x="47" y="215" class="mono-txt" text-anchor="start">- min_value(amount, 0)</text>
  <text x="37" y="240" class="badge-txt" fill="#38BDF8">✓ Declarative / Zero Code</text>

  <!-- Arrow Left -> Center -->
  <path d="M 285 150 L 340 150" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Engine Processing Lifecycle Container -->
  <rect x="340" y="25" width="595" height="250" rx="12" ry="12" fill="#0D1526" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="360" y="52" class="title-txt" fill="#C084FC">Engine Processing Lifecycle (Spark / Polars / DuckDB)</text>

  <!-- Step 1: Factory -->
  <rect x="360" y="80" width="160" height="150" rx="8" ry="8" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="440" y="105" class="title-txt" text-anchor="middle">1. Connector Factory</text>
  <text x="372" y="130" class="body-txt" text-anchor="start">• Instantiates source</text>
  <text x="372" y="150" class="body-txt" text-anchor="start">• JDBC / Cloud Object</text>
  <text x="372" y="170" class="body-txt" text-anchor="start">• Streams incremental</text>
  <text x="372" y="190" class="mono-txt" text-anchor="start">df = read(source)</text>

  <path d="M 520 155 L 560 155" fill="none" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- Step 2: Quality Engine -->
  <rect x="560" y="80" width="170" height="150" rx="8" ry="8" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="645" y="105" class="title-txt" text-anchor="middle">2. Quality Validator</text>
  <text x="572" y="130" class="body-txt" text-anchor="start">• Great Expectations</text>
  <text x="572" y="150" class="body-txt" text-anchor="start">• Soda / Pandera rules</text>
  <text x="572" y="170" class="body-txt" text-anchor="start">• Evaluates YAML rules</text>
  <text x="572" y="190" class="mono-txt" text-anchor="start">quarantine_bad_records()</text>

  <path d="M 730 155 L 770 155" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Step 3: Sink Writer -->
  <rect x="770" y="80" width="145" height="150" rx="8" ry="8" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="842" y="105" class="title-txt" text-anchor="middle" fill="#10B981">3. Sink Committer</text>
  <text x="782" y="130" class="body-txt" text-anchor="start">• Delta Lake MERGE</text>
  <text x="782" y="150" class="body-txt" text-anchor="start">• Advance watermark</text>
  <text x="782" y="170" class="body-txt" text-anchor="start">• Emit lineage event</text>
  <text x="782" y="190" class="mono-txt" text-anchor="start">OpenLineage / UC</text>
</svg>