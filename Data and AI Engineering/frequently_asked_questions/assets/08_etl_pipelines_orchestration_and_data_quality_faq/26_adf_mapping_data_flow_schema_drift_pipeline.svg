<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 350" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; text-anchor: start; }
      .edge-label { fill: #E2E8F0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; text-anchor: middle; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Node 1: Dynamic Payloads -->
  <g transform="translate(25, 115)">
    <rect width="210" height="120" rx="8" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <text x="105" y="24" class="title" fill="#93C5FD">Dynamic JSON Payloads</text>
    <text x="14" y="48" class="body-txt">• Semi-structured nested streams</text>
    <text x="14" y="68" class="body-txt">• New key: loyalty_tier</text>
    <text x="14" y="88" class="body-txt">• Variable typing across clients</text>
  </g>

  <!-- Connect 1 to 2 -->
  <path d="M 235 175 L 265 175" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Node 2: Source Transformation -->
  <g transform="translate(265, 115)">
    <rect width="215" height="120" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <text x="107" y="24" class="title" fill="#FDE68A">Data Flow Source</text>
    <text x="14" y="48" class="body-txt">• Allow Schema Drift: CHECKED</text>
    <text x="14" y="68" class="body-txt">• Validate Schema: DISABLED</text>
    <text x="14" y="88" class="body-txt">• Captures unmodeled columns</text>
  </g>

  <!-- Connect 2 to 3 -->
  <path d="M 480 175 L 510 175" fill="none" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <!-- Node 3: Derived Column Transformation -->
  <g transform="translate(510, 115)">
    <rect width="225" height="120" rx="8" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="2"/>
    <text x="112" y="24" class="title" fill="#C4B5FD">Derived Column Standardizer</text>
    <text x="14" y="48" class="body-txt">• Normalizes timestamps &amp; keys</text>
    <text x="14" y="68" class="body-txt">• toString(unparsed_payload)</text>
    <text x="14" y="88" class="body-txt">• Rule-based mapping expressions</text>
  </g>

  <!-- Connect 3 to 4 -->
  <path d="M 735 175 L 765 175" fill="none" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arr-purple)"/>

  <!-- Node 4: Target Delta Lakehouse -->
  <g transform="translate(765, 115)">
    <rect width="230" height="120" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
    <text x="115" y="24" class="title" fill="#A7F3D0">Target Delta Lakehouse</text>
    <text x="14" y="48" class="body-txt">• Sink: Allow Schema Drift = ON</text>
    <text x="14" y="68" class="body-txt">• Rule-Based Mapping: true()</text>
    <text x="14" y="88" class="body-txt">• Automatic schema evolution commit</text>
  </g>
</svg>
