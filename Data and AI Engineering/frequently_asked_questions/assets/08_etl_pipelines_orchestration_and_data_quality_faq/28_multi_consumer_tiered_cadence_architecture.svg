<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 380" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; text-anchor: start; }
      .edge-label { fill: #E2E8F0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; text-anchor: middle; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6" />
    </marker>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Left: Event Stream -->
  <g transform="translate(25, 130)">
    <rect width="210" height="115" rx="8" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <text x="105" y="24" class="title" fill="#93C5FD">Transaction Event Stream</text>
    <text x="14" y="48" class="body-txt">• Kafka / Azure Event Hubs</text>
    <text x="14" y="68" class="body-txt">• 10,000 msgs/sec ingest</text>
    <text x="14" y="88" class="body-txt">• Unordered event arrival</text>
  </g>

  <!-- Connect Stream to Bronze Table -->
  <path d="M 235 187 L 275 187" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Center: Bronze Delta Lakehouse -->
  <g transform="translate(275, 125)">
    <rect width="240" height="125" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <text x="120" y="24" class="title" fill="#FDE68A">Bronze Delta Lakehouse</text>
    <text x="14" y="48" class="body-txt">• Structured Streaming Ingestion</text>
    <text x="14" y="68" class="body-txt">• Append-only immutable log</text>
    <text x="14" y="88" class="body-txt">• Delta Change Data Feed (CDF)</text>
    <text x="14" y="108" class="body-txt">• Sub-minute commit intervals</text>
  </g>

  <!-- Connect Bronze to Tier 1 (Top) -->
  <path d="M 515 150 L 550 150 Q 570 150 570 70 L 610 70 L 620 70" fill="none" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arr-purple)"/>

  <!-- Connect Bronze to Tier 2 (Middle) -->
  <path d="M 515 187 L 620 187" fill="none" stroke="#06B6D4" stroke-width="1.5" marker-end="url(#arr-cyan)"/>

  <!-- Connect Bronze to Tier 3 (Bottom) -->
  <path d="M 515 220 L 550 220 Q 570 220 570 305 L 610 305 L 620 305" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Tier 1: Real-Time Fraud -->
  <g transform="translate(620, 20)">
    <rect width="375" height="100" rx="8" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="187" y="24" class="title" fill="#C4B5FD">Tier 1: Real-Time Fraud &amp; Anomaly Engine</text>
    <text x="14" y="48" class="body-txt">• Direct Delta readStream with micro-batching</text>
    <text x="14" y="68" class="body-txt">• Latency SLA: &lt; 30 seconds</text>
    <text x="14" y="88" class="body-txt">• Immediate transaction scoring and account freezing</text>
  </g>

  <!-- Tier 2: Operations BI -->
  <g transform="translate(620, 137)">
    <rect width="375" height="100" rx="8" fill="#0C4A6E" stroke="#06B6D4" stroke-width="1.5"/>
    <text x="187" y="24" class="title" fill="#67E8F9">Tier 2: Operations BI &amp; Monitoring Mart</text>
    <text x="14" y="48" class="body-txt">• Hourly micro-batch reading Delta CDF (Change Data Feed)</text>
    <text x="14" y="68" class="body-txt">• Latency SLA: 1 hour cadence</text>
    <text x="14" y="88" class="body-txt">• Intraday business dashboards &amp; operational metrics</text>
  </g>

  <!-- Tier 3: Audited Financial Mart -->
  <g transform="translate(620, 255)">
    <rect width="375" height="100" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
    <text x="187" y="24" class="title" fill="#A7F3D0">Tier 3: Audited Financial &amp; Compliance Mart</text>
    <text x="14" y="48" class="body-txt">• Nightly snapshot (VERSION AS OF midnight)</text>
    <text x="14" y="68" class="body-txt">• Strict accounting reconciliation gates &amp; idempotency</text>
    <text x="14" y="88" class="body-txt">• Certified balance sheet reporting &amp; audit trails</text>
  </g>
</svg>
