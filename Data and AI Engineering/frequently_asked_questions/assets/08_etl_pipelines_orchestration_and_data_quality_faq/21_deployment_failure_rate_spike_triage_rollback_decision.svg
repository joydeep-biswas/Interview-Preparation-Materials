<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94A3B8" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Alert: Failure Rate Spike -->
  <rect x="40" y="40" width="220" height="80" rx="10" ry="10" fill="#7F1D1D" stroke="#EF4444" stroke-width="1.5"/>
  <text x="150" y="66" class="title-txt" text-anchor="middle" fill="#FECACA">🚨 Failure Rate Spike</text>
  <text x="52" y="90" class="body-txt" text-anchor="start">• Rate jumped 0.1% → 4.0%</text>
  <text x="52" y="108" class="body-txt" text-anchor="start">• Occurred post-deployment</text>

  <path d="M 260 80 L 320 80" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- Decision 1: Corrupted Data? -->
  <polygon points="400,40 480,80 400,120 320,80" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="400" y="75" class="title-txt" text-anchor="middle">Corrupted /</text>
  <text x="400" y="93" class="title-txt" text-anchor="middle">Duplicate Data?</text>

  <!-- Branch YES: Critical Rollback -->
  <path d="M 400 120 L 400 150 Q 400 160 385 160 L 260 160 Q 245 160 245 175 L 245 220" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <rect x="290" y="148" width="70" height="18" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="325" y="161" class="edge-txt" text-anchor="middle" fill="#EF4444">YES: Data Toxic</text>

  <rect x="140" y="220" width="240" height="110" rx="10" ry="10" fill="#7F1D1D" stroke="#EF4444" stroke-width="1.5"/>
  <text x="260" y="246" class="title-txt" text-anchor="middle" fill="#FECACA">Emergency Rollback &amp; Restore</text>
  <text x="152" y="270" class="body-txt" text-anchor="start">• Restore Delta: <tspan class="mono-txt">RESTORE TO VERSION_AS_OF</tspan></text>
  <text x="152" y="290" class="body-txt" text-anchor="start">• Revert git commit &amp; redeploy</text>
  <text x="152" y="310" class="body-txt" text-anchor="start">• Quarantine compromised partitions</text>

  <!-- Branch NO: Check MTTR -->
  <path d="M 480 80 L 550 80" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="485" y="68" width="60" height="18" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="515" y="81" class="edge-txt" text-anchor="middle" fill="#10B981">NO</text>

  <!-- Decision 2: Minor Known Fix? -->
  <polygon points="630,40 710,80 630,120 550,80" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="630" y="75" class="title-txt" text-anchor="middle">Can Fix in &lt; 30m?</text>
  <text x="630" y="93" class="sub-txt" text-anchor="middle">(Known config/patch)</text>

  <!-- Branch NO: Rollback -->
  <path d="M 630 120 L 630 150 Q 630 160 615 160 L 450 160 Q 435 160 435 175 L 435 220" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <rect x="480" y="148" width="110" height="18" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="535" y="161" class="edge-txt" text-anchor="middle" fill="#EF4444">NO: Unclear Root Cause</text>

  <rect x="390" y="220" width="220" height="110" rx="10" ry="10" fill="#111827" stroke="#EF4444" stroke-width="1.5"/>
  <text x="500" y="246" class="title-txt" text-anchor="middle" fill="#EF4444">Safe Code Rollback</text>
  <text x="402" y="270" class="body-txt" text-anchor="start">• Roll back to previous image tag</text>
  <text x="402" y="290" class="body-txt" text-anchor="start">• Replay from last safe watermark</text>
  <text x="402" y="310" class="body-txt" text-anchor="start">• Investigate in staging branch</text>

  <!-- Branch YES: Fix-Forward -->
  <path d="M 710 80 L 780 80 Q 795 80 795 95 L 795 220" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="720" y="68" width="60" height="18" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="750" y="81" class="edge-txt" text-anchor="middle" fill="#10B981">YES</text>

  <rect x="680" y="220" width="240" height="110" rx="10" ry="10" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="800" y="246" class="title-txt" text-anchor="middle" fill="#A7F3D0">Hotfix Forward</text>
  <text x="692" y="270" class="body-txt" text-anchor="start">• Patch missing config parameter</text>
  <text x="692" y="290" class="body-txt" text-anchor="start">• Fast-track hotfix CI/CD PR</text>
  <text x="692" y="310" class="body-txt" text-anchor="start">• Clear transient connection pool</text>
</svg>