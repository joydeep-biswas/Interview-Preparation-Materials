<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94A3B8" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Ingestion Tasks -->
  <rect x="30" y="80" width="170" height="90" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="115" y="108" class="title-txt" text-anchor="middle">ETL Ingestion Tasks</text>
  <text x="42" y="132" class="body-txt" text-anchor="start">• High-throughput batch</text>
  <text x="42" y="152" class="mono-txt" text-anchor="start">10,000 req / sec</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M 200 125 L 260 125" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Token Bucket -->
  <rect x="260" y="70" width="190" height="110" rx="10" ry="10" fill="#111827" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="355" y="96" class="title-txt" text-anchor="middle">1. Token-Bucket Limiter</text>
  <text x="272" y="120" class="body-txt" text-anchor="start">• Caps rate to 50 req/sec</text>
  <text x="272" y="140" class="body-txt" text-anchor="start">• Smooths burst spikes</text>
  <text x="272" y="160" class="mono-txt" text-anchor="start">Prevents HTTP 429 errors</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M 450 125 L 510 125" fill="none" stroke="#06B6D4" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Circuit Breaker -->
  <rect x="510" y="65" width="200" height="120" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="610" y="92" class="title-txt" text-anchor="middle">2. Circuit Breaker</text>
  <text x="522" y="116" class="body-txt" text-anchor="start">• CLOSED: Normal flow</text>
  <text x="522" y="136" class="body-txt" text-anchor="start">• OPEN: Trips if error &gt; 20%</text>
  <text x="522" y="156" class="body-txt" text-anchor="start">• HALF-OPEN: Canary probe</text>

  <!-- Straight path to API (Normal) -->
  <path d="M 710 125 L 770 125" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="770" y="80" width="160" height="90" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="850" y="108" class="title-txt" text-anchor="middle" fill="#10B981">External REST API</text>
  <text x="782" y="132" class="body-txt" text-anchor="start">• Target 3rd party API</text>
  <text x="782" y="152" class="body-txt" text-anchor="start">• Status 200 OK responses</text>

  <!-- Breaker Open Curved Path to DLQ -->
  <path d="M 610 185 L 610 215 Q 610 225 625 225 L 755 225 Q 770 225 770 235 L 770 240" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <rect x="625" y="215" width="100" height="18" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="675" y="228" class="edge-txt" text-anchor="middle" fill="#EF4444">OPEN State / Exceeded</text>

  <!-- DLQ -->
  <rect x="670" y="240" width="260" height="50" rx="8" ry="8" fill="#111827" stroke="#EF4444" stroke-width="1.5"/>
  <text x="800" y="262" class="title-txt" text-anchor="middle" fill="#FCA5A5">3. Dead-Letter Queue &amp; Exp. Backoff</text>
  <text x="682" y="278" class="mono-txt" text-anchor="start">Replay queue with jittered backoff</text>
</svg>