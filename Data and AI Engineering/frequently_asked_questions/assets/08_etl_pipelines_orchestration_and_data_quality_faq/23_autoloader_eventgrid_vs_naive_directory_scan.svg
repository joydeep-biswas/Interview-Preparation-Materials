<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94A3B8" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19"/>

  <!-- Storage Ingress -->
  <rect x="25" y="110" width="190" height="90" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="120" y="136" class="title-txt" text-anchor="middle">ADLS Gen2 Storage</text>
  <text x="37" y="160" class="mono-txt" text-anchor="start">12,000 subfolders</text>
  <text x="37" y="178" class="body-txt" text-anchor="start">New file arrives</text>

  <!-- Fork Top (Naive) vs Bottom (Auto Loader) -->
  <path d="M 215 135 L 255 135 Q 270 135 270 115 L 270 85 Q 270 65 285 65 L 320 65" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <rect x="230" y="85" width="50" height="18" rx="4" ry="4" fill="#1E293B"/>
  <text x="255" y="98" class="edge-txt" text-anchor="middle" fill="#EF4444">Naive</text>

  <path d="M 215 175 L 255 175 Q 270 175 270 195 L 270 235 Q 270 255 285 255 L 320 255" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="225" y="215" width="60" height="18" rx="4" ry="4" fill="#1E293B"/>
  <text x="255" y="228" class="edge-txt" text-anchor="middle" fill="#10B981">Optimized</text>

  <!-- Top: Naive Directory Scan -->
  <rect x="320" y="30" width="600" height="75" rx="10" ry="10" fill="#7F1D1D" stroke="#EF4444" stroke-width="1.5"/>
  <text x="335" y="55" class="title-txt" fill="#FECACA">❌ Naive Directory Scan (ADF GetMetadata / Spark File Listing)</text>
  <text x="335" y="74" class="body-txt">• Recursively lists all 12,000 folders &amp; 500,000 files to find new additions</text>
  <text x="335" y="90" class="mono-txt">Latency: 45 to 90 minutes just to identify new files! Exhausts API quotas</text>

  <!-- Bottom: Auto Loader Event Grid Pipeline -->
  <rect x="320" y="160" width="600" height="135" rx="10" ry="10" fill="#0D1526" stroke="#10B981" stroke-width="1.5"/>
  <text x="340" y="185" class="title-txt" fill="#6EE7B7">✓ Databricks Auto Loader + Azure Event Grid (&lt; 30 Seconds)</text>

  <!-- Internal pipeline steps -->
  <rect x="340" y="200" width="160" height="80" rx="8" ry="8" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="420" y="225" class="title-txt" text-anchor="middle">Azure Event Grid</text>
  <text x="350" y="248" class="mono-txt" text-anchor="start">BlobCreated event</text>
  <text x="350" y="266" class="body-txt" text-anchor="start">Pushed instantly</text>

  <path d="M 500 240 L 535 240" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <rect x="535" y="200" width="170" height="80" rx="8" ry="8" fill="#111827" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="620" y="225" class="title-txt" text-anchor="middle">Azure Storage Queue</text>
  <text x="545" y="248" class="mono-txt" text-anchor="start">ASQ FIFO queue</text>
  <text x="545" y="266" class="body-txt" text-anchor="start">O(1) message retrieval</text>

  <path d="M 705 240 L 740 240" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <rect x="740" y="200" width="165" height="80" rx="8" ry="8" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="822" y="225" class="title-txt" text-anchor="middle" fill="#A7F3D0">Auto Loader Stream</text>
  <text x="750" y="248" class="body-txt" text-anchor="start">• Ingests in seconds</text>
  <text x="750" y="266" class="badge-txt" fill="#10B981">✓ Zero folder scanning</text>
</svg>