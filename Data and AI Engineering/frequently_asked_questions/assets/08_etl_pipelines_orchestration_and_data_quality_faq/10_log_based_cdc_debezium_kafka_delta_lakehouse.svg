<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94A3B8" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19"/>

  <!-- Subgraph 1: Source WAL -->
  <rect x="25" y="30" width="280" height="240" rx="12" ry="12" fill="#0D1526" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="45" y="55" class="title-txt" fill="#93C5FD">Source Transaction Log</text>

  <rect x="45" y="75" width="240" height="70" rx="8" ry="8" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="165" y="100" class="title-txt" text-anchor="middle">OLTP Database</text>
  <text x="57" y="124" class="mono-txt" text-anchor="start">PostgreSQL / MySQL / Oracle</text>

  <path d="M 165 145 L 165 175" fill="none" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <rect x="45" y="175" width="240" height="75" rx="8" ry="8" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="165" y="200" class="title-txt" text-anchor="middle">Transaction Log</text>
  <text x="57" y="222" class="body-txt" text-anchor="start">• WAL / Binlog stream</text>
  <text x="57" y="238" class="body-txt" text-anchor="start">• Zero impact on OLTP tables</text>

  <!-- Connect Subgraph 1 -> 2 -->
  <path d="M 305 212 L 345 212" fill="none" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- Subgraph 2: CDC Streaming -->
  <rect x="345" y="30" width="280" height="240" rx="12" ry="12" fill="#0D1526" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="365" y="55" class="title-txt" fill="#C084FC">Log-Based CDC &amp; Streaming</text>

  <rect x="365" y="75" width="240" height="70" rx="8" ry="8" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="485" y="100" class="title-txt" text-anchor="middle" fill="#10B981">Debezium Connector</text>
  <text x="377" y="124" class="body-txt" text-anchor="start">• Real-time log scraping</text>

  <path d="M 485 145 L 485 175" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <rect x="365" y="175" width="240" height="75" rx="8" ry="8" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="485" y="200" class="title-txt" text-anchor="middle">Kafka Topic: orders_cdc</text>
  <text x="377" y="222" class="body-txt" text-anchor="start">• Key: order_id (in-order)</text>
  <text x="377" y="238" class="mono-txt" text-anchor="start">op: c, u, d payload metadata</text>

  <!-- Connect Subgraph 2 -> 3 -->
  <path d="M 625 212 L 665 212" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Subgraph 3: ACID Lakehouse -->
  <rect x="665" y="30" width="270" height="240" rx="12" ry="12" fill="#0D1526" stroke="#10B981" stroke-width="1.5"/>
  <text x="685" y="55" class="title-txt" fill="#6EE7B7">Stream Engine &amp; Lakehouse</text>

  <rect x="680" y="75" width="240" height="70" rx="8" ry="8" fill="#111827" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="800" y="100" class="title-txt" text-anchor="middle">Spark / Flink Engine</text>
  <text x="692" y="124" class="body-txt" text-anchor="start">• Exactly-once micro-batch</text>

  <path d="M 800 145 L 800 175" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <rect x="680" y="175" width="240" height="75" rx="8" ry="8" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="800" y="200" class="title-txt" text-anchor="middle" fill="#10B981">Delta Lake Silver</text>
  <text x="692" y="222" class="mono-txt" text-anchor="start">MERGE INTO silver.orders</text>
  <text x="692" y="238" class="body-txt" text-anchor="start">• Deletion vectors enabled</text>
</svg>