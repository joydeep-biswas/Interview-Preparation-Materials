<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94A3B8" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Left: Dependency Delay Propagation -->
  <rect x="25" y="25" width="440" height="250" rx="12" ry="12" fill="#0D1526" stroke="#EF4444" stroke-width="1.5"/>
  <text x="45" y="52" class="title-txt" fill="#FCA5A5">Dependency Delay Propagation</text>

  <rect x="45" y="70" width="400" height="50" rx="8" ry="8" fill="#111827" stroke="#EF4444" stroke-width="1.5"/>
  <text x="60" y="93" class="title-txt" text-anchor="start" fill="#F87171">Pipeline C (Raw Ingestion): 20m → 240m (4 Hours!)</text>
  <text x="60" y="108" class="sub-txt" text-anchor="start">Slow source extract or network backlog</text>

  <path d="M 245 120 L 245 140" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <rect x="45" y="140" width="400" height="50" rx="8" ry="8" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="60" y="163" class="title-txt" text-anchor="start" fill="#F59E0B">Pipeline B (Silver Cleansing): Starts 3.5 Hours Late!</text>
  <text x="60" y="178" class="sub-txt" text-anchor="start">Blocked on ExternalTaskSensor awaiting C</text>

  <path d="M 245 190 L 245 210" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <rect x="45" y="210" width="400" height="50" rx="8" ry="8" fill="#7F1D1D" stroke="#EF4444" stroke-width="1.5"/>
  <text x="60" y="233" class="title-txt" text-anchor="start" fill="#FECACA">Pipeline A (Gold Mart): Misses SLA by 3 Hours!</text>
  <text x="60" y="248" class="sub-txt" text-anchor="start">Transformations only took 5 min, but starved by upstream</text>

  <!-- Connectors to Mitigation -->
  <path d="M 465 150 L 505 150" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Right: Decoupling Mitigation -->
  <rect x="505" y="25" width="430" height="250" rx="12" ry="12" fill="#0D1526" stroke="#10B981" stroke-width="1.5"/>
  <text x="525" y="52" class="title-txt" fill="#6EE7B7">Architectural Decoupling &amp; SLA Insulation</text>

  <rect x="525" y="70" width="390" height="50" rx="8" ry="8" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="540" y="93" class="title-txt" text-anchor="start" fill="#93C5FD">1. Asynchronous Event Sensors (deferrable)</text>
  <text x="540" y="108" class="sub-txt" text-anchor="start">Frees Airflow worker slots while waiting on upstream</text>

  <rect x="525" y="130" width="390" height="50" rx="8" ry="8" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="540" y="153" class="title-txt" text-anchor="start" fill="#10B981">2. Partial-Load Fallback &amp; Stale Caching</text>
  <text x="540" y="168" class="sub-txt" text-anchor="start">Publish dashboard with T-1 snapshot + stale banner</text>

  <rect x="525" y="190" width="390" height="50" rx="8" ry="8" fill="#111827" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="540" y="213" class="title-txt" text-anchor="start" fill="#C084FC">3. Dynamic Autoscaling Ingestion Tier</text>
  <text x="540" y="228" class="sub-txt" text-anchor="start">Parallelize upstream partition downloads</text>
</svg>