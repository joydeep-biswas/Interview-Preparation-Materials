<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94A3B8" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Source -->
  <rect x="260" y="25" width="400" height="60" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="460" y="50" class="title-txt" text-anchor="middle">Source Database</text>
  <text x="460" y="68" class="sub-txt" text-anchor="middle">(No Last-Modified Timestamps Available)</text>

  <path d="M 460 85 L 460 115" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Strategy Selector -->
  <polygon points="460,115 620,165 460,215 300,165" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="460" y="160" class="title-txt" text-anchor="middle">Select Strategy</text>
  <text x="460" y="178" class="sub-txt" text-anchor="middle">by Database Engine Type</text>

  <!-- Left: SQL Server Change Tracking -->
  <path d="M 300 165 L 170 165 Q 155 165 155 180 L 155 240" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="175" y="152" width="110" height="18" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="230" y="165" class="edge-txt" text-anchor="middle" fill="#10B981">SQL Server / Azure SQL</text>

  <rect x="40" y="240" width="240" height="110" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="160" y="266" class="title-txt" text-anchor="middle" fill="#10B981">Strategy 1: Change Tracking</text>
  <text x="52" y="290" class="body-txt" text-anchor="start">• Built-in SQL Server CT engine</text>
  <text x="52" y="310" class="body-txt" text-anchor="start">• Zero table schema changes</text>
  <text x="52" y="330" class="mono-txt" text-anchor="start">CHANGETABLE(CHANGES...)</text>

  <!-- Center: Log-based CDC -->
  <path d="M 460 215 L 460 240" fill="none" stroke="#06B6D4" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="470" y="215" width="100" height="18" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="520" y="228" class="edge-txt" text-anchor="middle" fill="#06B6D4">Oracle / Postgres</text>

  <rect x="340" y="240" width="240" height="110" rx="10" ry="10" fill="#111827" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="460" y="266" class="title-txt" text-anchor="middle" fill="#67E8F9">Strategy 2: Log-Based CDC</text>
  <text x="352" y="290" class="body-txt" text-anchor="start">• Debezium / GoldenGate</text>
  <text x="352" y="310" class="body-txt" text-anchor="start">• Scrapes WAL / Redo logs</text>
  <text x="352" y="330" class="mono-txt" text-anchor="start">Low overhead stream</text>

  <!-- Right: Hash Diff -->
  <path d="M 620 165 L 750 165 Q 765 165 765 180 L 765 240" fill="none" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <rect x="640" y="152" width="110" height="18" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="695" y="165" class="edge-txt" text-anchor="middle" fill="#8B5CF6">Generic / Legacy Files</text>

  <rect x="640" y="240" width="240" height="110" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="760" y="266" class="title-txt" text-anchor="middle" fill="#C084FC">Strategy 3: Hash Diff</text>
  <text x="652" y="290" class="body-txt" text-anchor="start">• Staging full extract snapshot</text>
  <text x="652" y="310" class="body-txt" text-anchor="start">• Compare SHA-256 against master</text>
  <text x="652" y="330" class="mono-txt" text-anchor="start">Identify inserts &amp; updates</text>
</svg>