<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94A3B8" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Left: Non-Idempotent Failure Mode -->
  <rect x="25" y="25" width="435" height="270" rx="12" ry="12" fill="#0D1526" stroke="#EF4444" stroke-width="1.5"/>
  <text x="45" y="52" class="title-txt" fill="#FCA5A5">❌ Non-Idempotent Append (Duplicate Hazard)</text>

  <rect x="45" y="70" width="395" height="55" rx="8" ry="8" fill="#111827" stroke="#EF4444" stroke-width="1.5"/>
  <text x="60" y="93" class="title-txt" text-anchor="start" fill="#F87171">Attempt 1: Writes 60% (600k rows) → Network Timeout!</text>
  <text x="60" y="110" class="sub-txt" text-anchor="start">Partial commit left in target without transactional rollback</text>

  <path d="M 242 125 L 242 145" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <rect x="45" y="145" width="395" height="55" rx="8" ry="8" fill="#111827" stroke="#EF4444" stroke-width="1.5"/>
  <text x="60" y="168" class="title-txt" text-anchor="start" fill="#F87171">Airflow Retry: Re-executes task, appends 100% (1,000k rows)</text>
  <text x="60" y="185" class="sub-txt" text-anchor="start">Blind append has no awareness of prior partial batch</text>

  <path d="M 242 200 L 242 220" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <rect x="45" y="220" width="395" height="55" rx="8" ry="8" fill="#7F1D1D" stroke="#EF4444" stroke-width="1.5"/>
  <text x="60" y="243" class="title-txt" text-anchor="start" fill="#FECACA">Result: 1,600k rows (600,000 SILENT DUPLICATES!)</text>
  <text x="60" y="260" class="sub-txt" text-anchor="start">Downstream revenue metrics inflated and corrupted</text>

  <!-- Right: Idempotent Partition Overwrite -->
  <rect x="485" y="25" width="450" height="270" rx="12" ry="12" fill="#0D1526" stroke="#10B981" stroke-width="1.5"/>
  <text x="505" y="52" class="title-txt" fill="#6EE7B7">✓ Idempotent Staging Table &amp; Atomic Overwrite</text>

  <rect x="505" y="70" width="410" height="55" rx="8" ry="8" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="520" y="93" class="title-txt" text-anchor="start">1. Write to Ephemeral Staging Table</text>
  <text x="520" y="110" class="mono-txt" text-anchor="start">orders_stg_run_{execution_date}</text>

  <path d="M 710 125 L 710 145" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <rect x="505" y="145" width="410" height="55" rx="8" ry="8" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="520" y="168" class="title-txt" text-anchor="start">2. Run Quality Checks &amp; Validate Row Counts</text>
  <text x="520" y="185" class="body-txt" text-anchor="start">Verify schema, null constraints, and expected volume</text>

  <path d="M 710 200 L 710 220" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <rect x="505" y="220" width="410" height="55" rx="8" ry="8" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="520" y="243" class="title-txt" text-anchor="start" fill="#A7F3D0">3. Atomic Partition Overwrite / MERGE</text>
  <text x="520" y="260" class="mono-txt" text-anchor="start">INSERT OVERWRITE / MERGE INTO (Zero Duplicates!)</text>
</svg>