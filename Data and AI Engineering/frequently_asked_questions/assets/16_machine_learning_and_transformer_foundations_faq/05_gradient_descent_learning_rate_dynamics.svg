<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19"/>

  <!-- LR Too Small -->
  <rect x="30" y="30" width="270" height="200" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="165" y="56" class="title-txt" text-anchor="middle" fill="#93C5FD">Learning Rate Too Small (eta = 1e-6)</text>
  <text x="45" y="85" class="body-txt">• Glacial progress down gradient</text>
  <text x="45" y="105" class="body-txt">• Thousands of epochs to converge</text>
  <text x="45" y="125" class="body-txt">• Trapped permanently in shallow local minima</text>
  <text x="45" y="150" class="mono-txt">theta = theta - 0.000001 * grad</text>
  <text x="45" y="195" class="badge-txt" fill="#38BDF8">Risk: Extreme compute waste</text>

  <!-- Optimal LR -->
  <rect x="345" y="30" width="270" height="200" rx="10" ry="10" fill="#0D1F1C" stroke="#10B981" stroke-width="1.5"/>
  <text x="480" y="56" class="title-txt" text-anchor="middle" fill="#6EE7B7">Optimal Learning Rate (eta = 1e-3)</text>
  <text x="360" y="85" class="body-txt">• Swift, smooth descent into minimum</text>
  <text x="360" y="105" class="body-txt">• Fast initial drop with cosine schedule decay</text>
  <text x="360" y="125" class="body-txt">• Robust generalizable test loss</text>
  <text x="360" y="150" class="mono-txt">Warmup + Cosine Annealing</text>
  <text x="360" y="195" class="badge-txt" fill="#10B981">✓ Fast Stable Convergence</text>

  <!-- LR Too Large -->
  <rect x="660" y="30" width="270" height="200" rx="10" ry="10" fill="#7F1D1D" stroke="#EF4444" stroke-width="1.5"/>
  <text x="795" y="56" class="title-txt" text-anchor="middle" fill="#FECACA">Learning Rate Too Large (eta = 1.0)</text>
  <text x="675" y="85" class="body-txt">• Wild overshooting across ravines</text>
  <text x="675" y="105" class="body-txt">• Oscillates and diverges towards infinity</text>
  <text x="675" y="125" class="body-txt">• Exploding activations &amp; weights</text>
  <text x="675" y="150" class="mono-txt">Loss = NaN / Inf</text>
  <text x="675" y="195" class="badge-txt" fill="#EF4444">Risk: Catastrophic divergence</text>
</svg>