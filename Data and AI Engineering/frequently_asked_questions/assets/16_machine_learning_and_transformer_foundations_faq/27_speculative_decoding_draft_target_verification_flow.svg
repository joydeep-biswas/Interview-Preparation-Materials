<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19"/>

  <!-- Actors -->
  <rect x="80" y="20" width="180" height="40" rx="6" ry="6" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="170" y="45" class="title-txt" text-anchor="middle">Draft Model (8B SLM)</text>
  <line x1="170" y1="60" x2="170" y2="340" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

  <rect x="390" y="20" width="180" height="40" rx="6" ry="6" fill="#111827" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="480" y="45" class="title-txt" text-anchor="middle">Target Model (70B LLM)</text>
  <line x1="480" y1="60" x2="480" y2="340" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

  <rect x="700" y="20" width="180" height="40" rx="6" ry="6" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="790" y="45" class="title-txt" text-anchor="middle" fill="#A7F3D0">Emitted Tokens Stream</text>
  <line x1="790" y1="60" x2="790" y2="340" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

  <!-- Note: Draft generates K=4 -->
  <rect x="60" y="80" width="220" height="45" rx="6" ry="6" fill="#0D1526" stroke="#3B82F6" stroke-width="1"/>
  <text x="170" y="100" class="sub-txt" text-anchor="middle">Fast autoregressive generation</text>
  <text x="170" y="115" class="mono-txt" text-anchor="middle">Generates K=4 candidates</text>

  <!-- Step 1: Draft sends 4 tokens to Target -->
  <path d="M 170 140 L 470 140" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="320" y="132" class="edge-txt" text-anchor="middle">[" artificial", " intelligence", " will", " change"]</text>

  <!-- Note: Target verification -->
  <rect x="350" y="165" width="260" height="65" rx="6" ry="6" fill="#0D1526" stroke="#8B5CF6" stroke-width="1"/>
  <text x="480" y="185" class="title-txt" text-anchor="middle" fill="#C4B5FD">Single Parallel Forward Pass</text>
  <text x="480" y="202" class="body-txt" text-anchor="middle">Evaluates all 4 token probabilities at once!</text>
  <text x="480" y="218" class="mono-txt" text-anchor="middle">min(1, P_target / P_draft)</text>

  <!-- Step 2: Verification Result -->
  <rect x="370" y="245" width="220" height="40" rx="6" ry="6" fill="#111827" stroke="#10B981" stroke-width="1"/>
  <text x="480" y="265" class="badge-txt" text-anchor="middle" fill="#10B981">Tokens 1, 2, 3 Accepted! Token 4 Resampled</text>

  <!-- Step 3: Stream Emitted -->
  <path d="M 480 300 L 780 300" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="630" y="292" class="edge-txt" text-anchor="middle" fill="#10B981">Emits: 3 Verified Tokens + 1 Resampled Token</text>

  <!-- Performance Banner -->
  <rect x="250" y="330" width="460" height="35" rx="6" ry="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="480" y="352" class="badge-txt" text-anchor="middle" fill="#A7F3D0">✓ 4 Tokens emitted in 1 Target Forward Pass time! (2.8x Speedup)</text>
</svg>