<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19"/>

  <!-- Actors Header -->
  <rect x="30" y="20" width="110" height="40" rx="6" ry="6" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="85" y="45" class="title-txt" text-anchor="middle">User / Prompt</text>
  <line x1="85" y1="60" x2="85" y2="380" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

  <rect x="175" y="20" width="110" height="40" rx="6" ry="6" fill="#111827" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="230" y="45" class="title-txt" text-anchor="middle">Tokenizer (BPE)</text>
  <line x1="230" y1="60" x2="230" y2="380" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

  <rect x="325" y="20" width="120" height="40" rx="6" ry="6" fill="#111827" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="385" y="45" class="title-txt" text-anchor="middle">Embedding (W_e)</text>
  <line x1="385" y1="60" x2="385" y2="380" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

  <rect x="480" y="20" width="150" height="40" rx="6" ry="6" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="555" y="45" class="title-txt" text-anchor="middle">L Transformer Blocks</text>
  <line x1="555" y1="60" x2="555" y2="380" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

  <rect x="665" y="20" width="120" height="40" rx="6" ry="6" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="725" y="45" class="title-txt" text-anchor="middle">LM Head (W_head)</text>
  <line x1="725" y1="60" x2="725" y2="380" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

  <rect x="815" y="20" width="115" height="40" rx="6" ry="6" fill="#111827" stroke="#EC4899" stroke-width="1.5"/>
  <text x="872" y="45" class="title-txt" text-anchor="middle">Sampler (Top-p)</text>
  <line x1="872" y1="60" x2="872" y2="380" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

  <!-- Step 1 -->
  <path d="M 85 90 L 220 90" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="152" y="82" class="edge-txt" text-anchor="middle">"The capital of France is"</text>

  <!-- Step 2 -->
  <path d="M 230 130 L 375 130" fill="none" stroke="#06B6D4" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="302" y="122" class="edge-txt" text-anchor="middle">Token IDs: [791, 6864, 315, 9552, 374]</text>

  <!-- Step 3 -->
  <path d="M 385 170 L 545 170" fill="none" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="465" y="162" class="edge-txt" text-anchor="middle">Hidden: Tensor [B=1, T=5, D=4096]</text>

  <!-- Loop: Transformer Blocks -->
  <rect x="500" y="195" width="110" height="70" rx="4" ry="4" fill="#0D1526" stroke="#10B981" stroke-width="1"/>
  <text x="555" y="215" class="sub-txt" text-anchor="middle">Loop l = 1..32</text>
  <text x="555" y="232" class="mono-txt" text-anchor="middle">RMSNorm + GQA</text>
  <text x="555" y="248" class="mono-txt" text-anchor="middle">SwiGLU FFN + Residual</text>

  <!-- Step 4 -->
  <path d="M 555 285 L 715 285" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="635" y="278" class="edge-txt" text-anchor="middle">Normalized Last Token Vector</text>

  <!-- Step 5 -->
  <path d="M 725 325 L 860 325" fill="none" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="792" y="318" class="edge-txt" text-anchor="middle">Logits [1, 128256]</text>

  <!-- Step 6 -->
  <path d="M 872 365 L 95 365" fill="none" stroke="#EC4899" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-red)"/>
  <text x="480" y="358" class="edge-txt" text-anchor="middle" fill="#EC4899">Emits Token: " Paris" (ID: 4031)</text>
</svg>