<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19"/>

  <!-- Left: RNN Sequential Bottleneck -->
  <rect x="30" y="40" width="420" height="200" rx="10" ry="10" fill="#7F1D1D" stroke="#EF4444" stroke-width="1.5"/>
  <text x="50" y="66" class="title-txt" fill="#FECACA">RNN / LSTM: Sequential Bottleneck (O(N) Steps)</text>
  <rect x="50" y="85" width="380" height="40" rx="6" ry="6" fill="#111827" stroke="#EF4444" stroke-width="1"/>
  <text x="60" y="108" class="mono-txt" text-anchor="start">h_t = tanh(W_hh * h_{t-1} + W_xh * x_t)</text>
  <text x="50" y="145" class="body-txt">• Computation is strictly serial: Cannot compute h_t until h_{t-1} finishes</text>
  <text x="50" y="165" class="body-txt">• Information squashed through a fixed hidden state vector</text>
  <text x="50" y="185" class="mono-txt">GPU cores sit idle waiting for next time step</text>
  <text x="50" y="215" class="badge-txt" fill="#EF4444">Cannot scale to modern dataset sizes</text>

  <!-- Right: Self-Attention -->
  <rect x="510" y="40" width="420" height="200" rx="10" ry="10" fill="#0D1F1C" stroke="#10B981" stroke-width="1.5"/>
  <text x="530" y="66" class="title-txt" fill="#6EE7B7">Transformer: Parallelized Self-Attention (O(1) Steps)</text>
  <rect x="530" y="85" width="380" height="40" rx="6" ry="6" fill="#111827" stroke="#10B981" stroke-width="1"/>
  <text x="540" y="108" class="mono-txt" text-anchor="start">Attention(Q, K, V) = softmax(Q*K^T / sqrt(d_k)) * V</text>
  <text x="530" y="145" class="body-txt">• All N tokens processed simultaneously in parallel matrix operations</text>
  <text x="530" y="165" class="body-txt">• Every token attends directly to every other token across O(1) distance</text>
  <text x="530" y="185" class="mono-txt">Tensor Cores fully saturated across entire sequence</text>
  <text x="530" y="215" class="badge-txt" fill="#10B981">✓ Enables 100B+ parameter scaling</text>
</svg>