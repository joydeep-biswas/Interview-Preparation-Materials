<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Step 1: Temporal Slice Profiling -->
  <rect x="30" y="30" width="420" height="200" rx="10" ry="10" fill="#0D1526" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="50" y="56" class="title-txt" fill="#93C5FD">Step 1: Temporal Slice Profiling</text>
  <rect x="50" y="75" width="380" height="40" rx="6" ry="6" fill="#111827" stroke="#3B82F6" stroke-width="1"/>
  <text x="60" y="98" class="body-txt" text-anchor="start">Segment Telemetry: Mon-Fri vs Sat-Sun splits</text>
  <rect x="50" y="125" width="380" height="40" rx="6" ry="6" fill="#111827" stroke="#3B82F6" stroke-width="1"/>
  <text x="60" y="148" class="body-txt" text-anchor="start">Compare daily Error Rates: F1, Log-Loss per day</text>
  <rect x="50" y="175" width="380" height="40" rx="6" ry="6" fill="#111827" stroke="#3B82F6" stroke-width="1"/>
  <text x="60" y="198" class="mono-txt" text-anchor="start">Detects cyclical demand shifts &amp; behavior lag</text>

  <path d="M 450 130 L 510 130" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Step 2: Cyclical Feature Engineering -->
  <rect x="510" y="30" width="420" height="200" rx="10" ry="10" fill="#0D1526" stroke="#10B981" stroke-width="1.5"/>
  <text x="530" y="56" class="title-txt" fill="#6EE7B7">Step 2: Cyclical Feature Engineering &amp; CV</text>
  <rect x="530" y="75" width="380" height="40" rx="6" ry="6" fill="#111827" stroke="#10B981" stroke-width="1"/>
  <text x="540" y="98" class="mono-txt" text-anchor="start">Encode: sin(2*pi*d / 7), cos(2*pi*d / 7)</text>
  <rect x="530" y="125" width="380" height="40" rx="6" ry="6" fill="#111827" stroke="#10B981" stroke-width="1"/>
  <text x="540" y="148" class="body-txt" text-anchor="start">Add binary indicator: is_weekend = (day &gt;= 5)</text>
  <rect x="530" y="175" width="380" height="40" rx="6" ry="6" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="540" y="198" class="badge-txt" fill="#A7F3D0">✓ Switch to TimeSeriesSplit (Prevents Lookahead Leak)</text>
</svg>