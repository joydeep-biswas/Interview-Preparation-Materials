<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19"/>

  <!-- 1. Fast + Cheap -->
  <rect x="30" y="40" width="280" height="200" rx="10" ry="10" fill="#0D1526" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="170" y="66" class="title-txt" text-anchor="middle" fill="#93C5FD">1. Fast + Cheap</text>
  <text x="45" y="95" class="sub-txt">Edge SLMs, Decision Trees, Heuristics</text>
  <rect x="45" y="110" width="250" height="45" rx="6" ry="6" fill="#111827" stroke="#3B82F6" stroke-width="1"/>
  <text x="55" y="130" class="mono-txt" text-anchor="start">Latency: 5ms | Cost: $0.00005</text>
  <text x="55" y="145" class="mono-txt" text-anchor="start">Accuracy: 82%</text>
  <text x="45" y="180" class="title-txt">Use Cases:</text>
  <text x="45" y="200" class="body-txt">• High-throughput ad click prediction</text>
  <text x="45" y="218" class="body-txt">• Real-time search query auto-complete</text>

  <!-- 2. Fast + Accurate -->
  <rect x="340" y="40" width="280" height="200" rx="10" ry="10" fill="#0D1526" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="480" y="66" class="title-txt" text-anchor="middle" fill="#FDE68A">2. Fast + Accurate</text>
  <text x="355" y="95" class="sub-txt">Over-Provisioned H100 GPU Clusters</text>
  <rect x="355" y="110" width="250" height="45" rx="6" ry="6" fill="#111827" stroke="#F59E0B" stroke-width="1"/>
  <text x="365" y="130" class="mono-txt" text-anchor="start">Latency: 45ms | Cost: $0.04</text>
  <text x="365" y="145" class="mono-txt" text-anchor="start">Accuracy: 96%</text>
  <text x="355" y="180" class="title-txt">Use Cases:</text>
  <text x="355" y="200" class="body-txt">• Autonomous driving obstacle avoidance</text>
  <text x="355" y="218" class="body-txt">• Real-time voice concierge VIP synthesis</text>

  <!-- 3. Cheap + Accurate -->
  <rect x="650" y="40" width="280" height="200" rx="10" ry="10" fill="#0D1F1C" stroke="#10B981" stroke-width="1.5"/>
  <text x="790" y="66" class="title-txt" text-anchor="middle" fill="#6EE7B7">3. Cheap + Accurate</text>
  <text x="665" y="95" class="sub-txt">Agentic Loops &amp; Test-Time Compute</text>
  <rect x="665" y="110" width="250" height="45" rx="6" ry="6" fill="#111827" stroke="#10B981" stroke-width="1"/>
  <text x="675" y="130" class="mono-txt" text-anchor="start">Latency: 15,000ms | Cost: $0.002</text>
  <text x="675" y="145" class="mono-txt" text-anchor="start">Accuracy: 98.5%</text>
  <text x="665" y="180" class="title-txt">Use Cases:</text>
  <text x="665" y="200" class="body-txt">• Offline legal contract auditing</text>
  <text x="665" y="218" class="body-txt">• Deep research report synthesis</text>
</svg>