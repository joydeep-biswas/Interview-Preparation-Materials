<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19"/>

  <!-- CNN -->
  <rect x="30" y="40" width="280" height="200" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="170" y="66" class="title-txt" text-anchor="middle">CNNs: Rigid Spatial Prior</text>
  <text x="45" y="95" class="body-txt">• <tspan font-weight="700">Inductive Bias:</tspan> High</text>
  <text x="45" y="115" class="body-txt">• Locality &amp; Translation Equivariance</text>
  <text x="45" y="135" class="body-txt">• Filters scan localized receptive fields</text>
  <text x="45" y="160" class="sub-txt">Data efficient on small vision data</text>
  <text x="45" y="180" class="sub-txt">Fixed kernel window</text>
  <text x="45" y="215" class="badge-txt" fill="#38BDF8">Strong Structural Prior</text>

  <!-- RNN -->
  <rect x="340" y="40" width="280" height="200" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="480" y="66" class="title-txt" text-anchor="middle" fill="#FDE68A">RNNs: Sequential Temporal Prior</text>
  <text x="355" y="95" class="body-txt">• <tspan font-weight="700">Inductive Bias:</tspan> Moderate</text>
  <text x="355" y="115" class="body-txt">• Strict step-by-step Markovian flow</text>
  <text x="355" y="135" class="body-txt">• Sequential bottleneck: No parallel GPU compute</text>
  <text x="355" y="160" class="sub-txt">Vanishing gradient on long sequences</text>
  <text x="355" y="180" class="sub-txt">O(N) recurrence depth</text>
  <text x="355" y="215" class="badge-txt" fill="#FDE68A">Sequential Prior</text>

  <!-- Transformer -->
  <rect x="650" y="40" width="280" height="200" rx="10" ry="10" fill="#0D1F1C" stroke="#10B981" stroke-width="1.5"/>
  <text x="790" y="66" class="title-txt" text-anchor="middle" fill="#6EE7B7">Transformers: Minimal Bias</text>
  <text x="665" y="95" class="body-txt">• <tspan font-weight="700">Inductive Bias:</tspan> Near Zero</text>
  <text x="665" y="115" class="body-txt">• Permutation invariant all-to-all attention</text>
  <text x="665" y="135" class="body-txt">• Must learn structure entirely from data</text>
  <text x="665" y="160" class="sub-txt">Data hungry, but scales arbitrarily!</text>
  <text x="665" y="180" class="sub-txt">Full O(1) parallel path length</text>
  <text x="665" y="215" class="badge-txt" fill="#10B981">Infinite Scaling Ceiling</text>
</svg>