<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Left: Multi-Head Splitting -->
  <rect x="30" y="40" width="280" height="200" rx="10" ry="10" fill="#0D1526" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="50" y="66" class="title-txt" fill="#93C5FD">1. Subspace Projections</text>
  <text x="45" y="95" class="body-txt">h = 32 distinct heads</text>
  <rect x="45" y="110" width="250" height="40" rx="6" ry="6" fill="#111827" stroke="#3B82F6" stroke-width="1"/>
  <text x="55" y="132" class="mono-txt" text-anchor="start">d_k = d_model / h = 4096 / 32 = 128</text>
  <text x="45" y="170" class="body-txt">• Each head learns unique linguistic features:</text>
  <text x="45" y="190" class="sub-txt">Head 1: syntax | Head 2: coreference | Head 3: entity</text>

  <path d="M 310 140 L 360 140" fill="none" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <!-- Center: Independent Attention Computations -->
  <rect x="360" y="40" width="280" height="200" rx="10" ry="10" fill="#0D1526" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="380" y="66" class="title-txt" fill="#FDE68A">2. Parallel Head Computations</text>
  <rect x="375" y="85" width="250" height="30" rx="4" ry="4" fill="#111827" stroke="#F59E0B" stroke-width="1"/>
  <text x="385" y="105" class="mono-txt" text-anchor="start">head_1 = Attn(Q1, K1, V1)</text>
  <rect x="375" y="125" width="250" height="30" rx="4" ry="4" fill="#111827" stroke="#F59E0B" stroke-width="1"/>
  <text x="385" y="145" class="mono-txt" text-anchor="start">head_2 = Attn(Q2, K2, V2)</text>
  <rect x="375" y="165" width="250" height="30" rx="4" ry="4" fill="#111827" stroke="#F59E0B" stroke-width="1"/>
  <text x="385" y="185" class="mono-txt" text-anchor="start">head_32 = Attn(Q32, K32, V32)</text>
  <text x="375" y="220" class="badge-txt" fill="#FDE68A">Computed concurrently on GPU</text>

  <path d="M 640 140 L 690 140" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Right: Concatenation & Out Projection -->
  <rect x="690" y="40" width="240" height="200" rx="10" ry="10" fill="#0D1F1C" stroke="#10B981" stroke-width="1.5"/>
  <text x="710" y="66" class="title-txt" fill="#6EE7B7">3. Concat &amp; Output W_o</text>
  <rect x="705" y="85" width="210" height="40" rx="6" ry="6" fill="#111827" stroke="#10B981" stroke-width="1"/>
  <text x="715" y="108" class="mono-txt" text-anchor="start">Concat(head_1, ..., head_32)</text>
  <text x="705" y="145" class="body-txt">• Concatenated shape: [N, 4096]</text>
  <rect x="705" y="160" width="210" height="40" rx="6" ry="6" fill="#111827" stroke="#10B981" stroke-width="1"/>
  <text x="715" y="182" class="mono-txt" text-anchor="start">Final: Tensor * W_o</text>
  <text x="705" y="220" class="badge-txt" fill="#10B981">✓ Blended Representation</text>
</svg>