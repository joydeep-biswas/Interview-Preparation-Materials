<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19"/>

  <!-- Encoder-Only -->
  <rect x="30" y="40" width="280" height="200" rx="10" ry="10" fill="#0D1526" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="170" y="66" class="title-txt" text-anchor="middle" fill="#93C5FD">1. Encoder-Only (BERT)</text>
  <rect x="45" y="85" width="250" height="40" rx="6" ry="6" fill="#111827" stroke="#3B82F6" stroke-width="1"/>
  <text x="55" y="108" class="mono-txt" text-anchor="start">Bidirectional Mask: Full 1s</text>
  <text x="45" y="145" class="body-txt">• Every token attends to all tokens</text>
  <text x="45" y="165" class="body-txt">• Captures full left &amp; right context</text>
  <text x="45" y="185" class="mono-txt">Target: Dense embeddings, NER</text>
  <text x="45" y="215" class="badge-txt" fill="#38BDF8">Classification &amp; Retrieval</text>

  <!-- Decoder-Only -->
  <rect x="340" y="40" width="280" height="200" rx="10" ry="10" fill="#0D1526" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="480" y="66" class="title-txt" text-anchor="middle" fill="#FDE68A">2. Decoder-Only (LLaMA/GPT)</text>
  <rect x="355" y="85" width="250" height="40" rx="6" ry="6" fill="#111827" stroke="#F59E0B" stroke-width="1"/>
  <text x="365" y="108" class="mono-txt" text-anchor="start">Causal Mask: Lower Triangular</text>
  <text x="355" y="145" class="body-txt">• Tokens only attend to past tokens</text>
  <text x="355" y="165" class="body-txt">• Strict autoregressive next-token gen</text>
  <text x="355" y="185" class="mono-txt">Target: Text synthesis &amp; reasoning</text>
  <text x="355" y="215" class="badge-txt" fill="#FDE68A">Modern Generative Standard</text>

  <!-- Encoder-Decoder -->
  <rect x="650" y="40" width="280" height="200" rx="10" ry="10" fill="#0D1F1C" stroke="#10B981" stroke-width="1.5"/>
  <text x="790" y="66" class="title-txt" text-anchor="middle" fill="#6EE7B7">3. Encoder-Decoder (T5)</text>
  <rect x="665" y="85" width="250" height="40" rx="6" ry="6" fill="#111827" stroke="#10B981" stroke-width="1"/>
  <text x="675" y="108" class="mono-txt" text-anchor="start">Cross-Attention Coupling</text>
  <text x="665" y="145" class="body-txt">• Encoder builds bidirectional representation</text>
  <text x="665" y="165" class="body-txt">• Decoder attends causally to encoder</text>
  <text x="665" y="185" class="mono-txt">Target: Translation, Summarization</text>
  <text x="665" y="215" class="badge-txt" fill="#10B981">Sequence-to-Sequence</text>
</svg>