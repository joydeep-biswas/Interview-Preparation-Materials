<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- MHA -->
  <rect x="30" y="40" width="280" height="200" rx="10" ry="10" fill="#7F1D1D" stroke="#EF4444" stroke-width="1.5"/>
  <text x="170" y="66" class="title-txt" text-anchor="middle" fill="#FECACA">Multi-Head Attention (MHA)</text>
  <text x="45" y="95" class="body-txt">• Queries: 32 heads | Keys/Values: 32 heads</text>
  <rect x="45" y="110" width="250" height="35" rx="6" ry="6" fill="#111827" stroke="#EF4444" stroke-width="1"/>
  <text x="55" y="132" class="mono-txt" text-anchor="start">KV Ratio: 1 : 1 (Max VRAM)</text>
  <text x="45" y="165" class="body-txt">• 70B model at 8k context consumes</text>
  <text x="45" y="185" class="body-txt">  <tspan fill="#EF4444" font-weight="700">16 GB VRAM PER USER!</tspan></text>
  <text x="45" y="215" class="badge-txt" fill="#EF4444">Heavy Memory Bandwidth Bound</text>

  <!-- GQA -->
  <rect x="340" y="40" width="280" height="200" rx="10" ry="10" fill="#0D1F1C" stroke="#10B981" stroke-width="1.5"/>
  <text x="480" y="66" class="title-txt" text-anchor="middle" fill="#6EE7B7">Grouped-Query Attention (GQA)</text>
  <text x="355" y="95" class="body-txt">• Queries: 32 heads | Keys/Values: 8 heads</text>
  <rect x="355" y="110" width="250" height="35" rx="6" ry="6" fill="#111827" stroke="#10B981" stroke-width="1"/>
  <text x="365" y="132" class="mono-txt" text-anchor="start">KV Ratio: 4 : 1 (LLaMA 3 Standard)</text>
  <text x="355" y="165" class="body-txt">• <tspan fill="#10B981" font-weight="700">4x to 8x VRAM reduction</tspan></text>
  <text x="355" y="185" class="body-txt">• Retains 99.8% of full MHA accuracy</text>
  <text x="355" y="215" class="badge-txt" fill="#10B981">✓ Industry Gold Standard</text>

  <!-- MQA -->
  <rect x="650" y="40" width="280" height="200" rx="10" ry="10" fill="#0D1526" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="790" y="66" class="title-txt" text-anchor="middle" fill="#93C5FD">Multi-Query Attention (MQA)</text>
  <text x="665" y="95" class="body-txt">• Queries: 32 heads | Keys/Values: 1 head</text>
  <rect x="665" y="110" width="250" height="35" rx="6" ry="6" fill="#111827" stroke="#3B82F6" stroke-width="1"/>
  <text x="675" y="132" class="mono-txt" text-anchor="start">KV Ratio: 32 : 1 (Ultra Compact)</text>
  <text x="665" y="165" class="body-txt">• Minimal possible KV cache footprint</text>
  <text x="665" y="185" class="sub-txt">Slight degradation on complex reasoning</text>
  <text x="665" y="215" class="badge-txt" fill="#38BDF8">Highest Concurrency Throughput</text>
</svg>