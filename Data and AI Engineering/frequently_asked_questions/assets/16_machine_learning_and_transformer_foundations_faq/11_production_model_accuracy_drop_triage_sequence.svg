<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19"/>

  <!-- Actors Header -->
  <rect x="50" y="20" width="140" height="40" rx="6" ry="6" fill="#111827" stroke="#EF4444" stroke-width="1.5"/>
  <text x="120" y="45" class="title-txt" text-anchor="middle" fill="#FECACA">APM / DataDog</text>
  <line x1="120" y1="60" x2="120" y2="360" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

  <rect x="290" y="20" width="140" height="40" rx="6" ry="6" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="360" y="45" class="title-txt" text-anchor="middle">On-Call Engineer</text>
  <line x1="360" y1="60" x2="360" y2="360" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

  <rect x="530" y="20" width="140" height="40" rx="6" ry="6" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="600" y="45" class="title-txt" text-anchor="middle" fill="#A7F3D0">Model Registry</text>
  <line x1="600" y1="60" x2="600" y2="360" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

  <rect x="770" y="20" width="140" height="40" rx="6" ry="6" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="840" y="45" class="title-txt" text-anchor="middle" fill="#FDE68A">Feast Feature Store</text>
  <line x1="840" y1="60" x2="840" y2="360" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

  <!-- Step 1: Alert -->
  <path d="M 120 90 L 350 90" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="235" y="82" class="edge-txt" text-anchor="middle" fill="#EF4444">1. P0 Alert: Accuracy drops to 60%!</text>

  <!-- Step 2: Check Deployments -->
  <path d="M 360 130 L 590 130" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="475" y="122" class="edge-txt" text-anchor="middle">2. Check deployments in last 24h</text>

  <!-- Note: Canary Rollback -->
  <rect x="490" y="145" width="220" height="30" rx="4" ry="4" fill="#0D1526" stroke="#10B981" stroke-width="1"/>
  <text x="600" y="165" class="badge-txt" text-anchor="middle" fill="#10B981">If deployed: Instant canary rollback</text>

  <!-- Step 3: Check Features -->
  <path d="M 360 210 L 830 210" fill="none" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="595" y="202" class="edge-txt" text-anchor="middle" fill="#FDE68A">3. No deploy? Audit feature distributions &amp; nulls</text>

  <!-- Step 4: Schema drift Alert -->
  <path d="M 840 250 L 370 250" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-red)"/>
  <text x="600" y="242" class="edge-txt" text-anchor="middle" fill="#EF4444">4. Alert: feature_income null-rate jumped 0.01% → 84%!</text>

  <!-- Note: Schema migration root cause -->
  <rect x="420" y="270" width="360" height="35" rx="4" ry="4" fill="#0D1526" stroke="#8B5CF6" stroke-width="1"/>
  <text x="600" y="285" class="sub-txt" text-anchor="middle">Root Cause: Upstream migration renamed column</text>
  <text x="600" y="298" class="mono-txt" text-anchor="middle">'annual_income' → 'income_usd'</text>

  <!-- Step 5: Hotfix -->
  <path d="M 360 330 L 830 330" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="595" y="322" class="edge-txt" text-anchor="middle" fill="#10B981">5. Deploy hotfix alias mapping in ingestion pipeline</text>
</svg>