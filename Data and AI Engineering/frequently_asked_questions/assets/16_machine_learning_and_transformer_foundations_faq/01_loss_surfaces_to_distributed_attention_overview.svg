<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19"/>

  <!-- Tier 1: Classical ML -->
  <rect x="25" y="30" width="200" height="240" rx="10" ry="10" fill="#0D1526" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="40" y="55" class="title-txt" fill="#93C5FD">1. Loss Surfaces &amp; ML</text>
  <rect x="35" y="75" width="180" height="50" rx="6" ry="6" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="45" y="96" class="title-txt" text-anchor="start">Loss Formulations</text>
  <text x="45" y="112" class="sub-txt" text-anchor="start">MSE, Cross-Entropy, Focal</text>
  <rect x="35" y="135" width="180" height="50" rx="6" ry="6" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="45" y="156" class="title-txt" text-anchor="start">Optimization Engine</text>
  <text x="45" y="172" class="mono-txt" text-anchor="start">SGD, AdamW, Momentum</text>
  <rect x="35" y="195" width="180" height="60" rx="6" ry="6" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="45" y="216" class="title-txt" text-anchor="start">Calibration</text>
  <text x="45" y="234" class="sub-txt" text-anchor="start">Bias-Variance &amp; Thresholds</text>

  <path d="M 225 150 L 265 150" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Tier 2: Deep Learning -->
  <rect x="265" y="30" width="200" height="240" rx="10" ry="10" fill="#0D1526" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="280" y="55" class="title-txt" fill="#C4B5FD">2. Gradients &amp; Norms</text>
  <rect x="275" y="75" width="180" height="50" rx="6" ry="6" fill="#111827" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="285" y="96" class="title-txt" text-anchor="start">Autograd Backprop</text>
  <text x="285" y="112" class="sub-txt" text-anchor="start">Computational DAG chain rule</text>
  <rect x="275" y="135" width="180" height="50" rx="6" ry="6" fill="#111827" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="285" y="156" class="title-txt" text-anchor="start">Normalization</text>
  <text x="285" y="172" class="mono-txt" text-anchor="start">BatchNorm vs LayerNorm</text>
  <rect x="275" y="195" width="180" height="60" rx="6" ry="6" fill="#111827" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="285" y="216" class="title-txt" text-anchor="start">Residual Flow</text>
  <text x="285" y="234" class="sub-txt" text-anchor="start">Skip connections &amp; clipping</text>

  <path d="M 465 150 L 505 150" fill="none" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- Tier 3: Attention Foundations -->
  <rect x="505" y="30" width="200" height="240" rx="10" ry="10" fill="#0D1526" stroke="#10B981" stroke-width="1.5"/>
  <text x="520" y="55" class="title-txt" fill="#6EE7B7">3. Attention Architectures</text>
  <rect x="515" y="75" width="180" height="50" rx="6" ry="6" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="525" y="96" class="title-txt" text-anchor="start" fill="#A7F3D0">Q, K, V Projections</text>
  <text x="525" y="112" class="mono-txt" text-anchor="start">softmax(QK^T / sqrt(d))</text>
  <rect x="515" y="135" width="180" height="50" rx="6" ry="6" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="525" y="156" class="title-txt" text-anchor="start" fill="#A7F3D0">Multi-Head Variants</text>
  <text x="525" y="172" class="sub-txt" text-anchor="start">MHA, MQA, GQA topologies</text>
  <rect x="515" y="195" width="180" height="60" rx="6" ry="6" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="525" y="216" class="title-txt" text-anchor="start" fill="#A7F3D0">Positional Encodings</text>
  <text x="525" y="234" class="mono-txt" text-anchor="start">Sinusoidal, RoPE, ALiBi</text>

  <path d="M 705 150 L 745 150" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Tier 4: Inference Scaling -->
  <rect x="745" y="30" width="190" height="240" rx="10" ry="10" fill="#0D1526" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="760" y="55" class="title-txt" fill="#FDE68A">4. Inference Scaling</text>
  <rect x="755" y="75" width="170" height="50" rx="6" ry="6" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="765" y="96" class="title-txt" text-anchor="start" fill="#FDE68A">KV Cache Footprint</text>
  <text x="765" y="112" class="mono-txt" text-anchor="start">PagedAttention paging</text>
  <rect x="755" y="135" width="170" height="50" rx="6" ry="6" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="765" y="156" class="title-txt" text-anchor="start" fill="#FDE68A">FlashAttention-2</text>
  <text x="765" y="172" class="sub-txt" text-anchor="start">SRAM tiling &amp; recompute</text>
  <rect x="755" y="195" width="170" height="60" rx="6" ry="6" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="765" y="216" class="title-txt" text-anchor="start" fill="#FDE68A">Distributed Mesh</text>
  <text x="765" y="234" class="mono-txt" text-anchor="start">Tensor, Pipeline, ZeRO-3</text>
</svg>