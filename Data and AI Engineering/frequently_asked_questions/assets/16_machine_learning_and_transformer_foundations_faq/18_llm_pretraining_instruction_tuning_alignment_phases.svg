<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Phase 1: Pre-Training -->
  <rect x="25" y="40" width="280" height="200" rx="10" ry="10" fill="#0D1526" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="45" y="66" class="title-txt" fill="#93C5FD">Phase 1: Foundation Pre-Training</text>
  <rect x="40" y="85" width="250" height="40" rx="6" ry="6" fill="#111827" stroke="#3B82F6" stroke-width="1"/>
  <text x="50" y="108" class="mono-txt" text-anchor="start">15T Tokens (Web, Code, Books)</text>
  <text x="45" y="145" class="body-txt">• Self-supervised next-token prediction</text>
  <text x="45" y="165" class="body-txt">• Massive cluster (16,000 H100 GPUs)</text>
  <text x="45" y="185" class="mono-txt">Produces: Base Foundation LLM</text>
  <text x="45" y="215" class="badge-txt" fill="#38BDF8">World Knowledge Representation</text>

  <path d="M 305 140 L 345 140" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Phase 2: SFT -->
  <rect x="345" y="40" width="280" height="200" rx="10" ry="10" fill="#0D1526" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="365" y="66" class="title-txt" fill="#C4B5FD">Phase 2: Instruction Tuning (SFT)</text>
  <rect x="360" y="85" width="250" height="40" rx="6" ry="6" fill="#111827" stroke="#8B5CF6" stroke-width="1"/>
  <text x="370" y="108" class="mono-txt" text-anchor="start">100k High-Quality QA Dialogues</text>
  <text x="365" y="145" class="body-txt">• Teaches model how to behave as assistant</text>
  <text x="365" y="165" class="body-txt">• Multi-turn dialogue formatting</text>
  <text x="365" y="185" class="mono-txt">Produces: Instruct-Tuned Model</text>
  <text x="365" y="215" class="badge-txt" fill="#C4B5FD">Conversational Syntax</text>

  <path d="M 625 140 L 665 140" fill="none" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- Phase 3: Alignment -->
  <rect x="665" y="40" width="270" height="200" rx="10" ry="10" fill="#0D1F1C" stroke="#10B981" stroke-width="1.5"/>
  <text x="685" y="66" class="title-txt" fill="#6EE7B7">Phase 3: Preference Alignment</text>
  <rect x="680" y="85" width="240" height="40" rx="6" ry="6" fill="#111827" stroke="#10B981" stroke-width="1"/>
  <text x="690" y="108" class="mono-txt" text-anchor="start">RLHF / DPO Preference Pairs</text>
  <text x="685" y="145" class="body-txt">• Steers model towards helpfulness &amp; safety</text>
  <text x="685" y="165" class="body-txt">• Eliminates toxic/sycophantic completions</text>
  <text x="685" y="185" class="mono-txt">Produces: Production Chat Model</text>
  <text x="685" y="215" class="badge-txt" fill="#10B981">Safety &amp; Value Alignment</text>
</svg>