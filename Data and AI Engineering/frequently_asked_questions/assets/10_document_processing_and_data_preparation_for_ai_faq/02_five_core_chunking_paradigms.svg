<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- 1. Fixed-Size Token -->
  <rect x="30" y="25" width="430" height="80" rx="10" ry="10" fill="#111827" stroke="#EF4444" stroke-width="1.5"/>
  <text x="45" y="50" class="title-txt" fill="#FCA5A5">1. Fixed-Size Token Chunking (Naive)</text>
  <text x="45" y="72" class="body-txt">• Fixed window (e.g. 512 tokens + 50 overlap)</text>
  <text x="45" y="90" class="mono-txt">Risk: Arbitrarily fractures sentences, equations &amp; tables</text>

  <!-- 2. Recursive Character -->
  <rect x="490" y="25" width="440" height="80" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="505" y="50" class="title-txt" fill="#FDE68A">2. Recursive Character Splitting</text>
  <text x="505" y="72" class="body-txt">• Hierarchical separator fallback: ['

', '
', ' ', '']</text>
  <text x="505" y="90" class="body-txt">• Preserves paragraph boundaries when possible</text>

  <!-- 3. Document-Structure-Aware -->
  <rect x="30" y="125" width="430" height="80" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="45" y="150" class="title-txt" fill="#93C5FD">3. Document-Structure-Aware Chunking</text>
  <text x="45" y="172" class="body-txt">• Respects Markdown headings (H1/H2/H3), HTML tags, JSON</text>
  <text x="45" y="190" class="mono-txt">Injects document breadcrumbs into chunk metadata</text>

  <!-- 4. Semantic Embedding -->
  <rect x="490" y="125" width="440" height="80" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="505" y="150" class="title-txt" fill="#C4B5FD">4. Semantic Embedding Chunking</text>
  <text x="505" y="172" class="body-txt">• Computes moving cosine distance between consecutive sentences</text>
  <text x="505" y="190" class="body-txt">• Splits at statistical inflection points (topic shifts)</text>

  <!-- 5. Hierarchical Parent-Child (Gold Standard) -->
  <rect x="30" y="225" width="900" height="85" rx="10" ry="10" fill="#0D1F1C" stroke="#10B981" stroke-width="1.5"/>
  <text x="45" y="252" class="title-txt" fill="#6EE7B7">5. Hierarchical Parent-Child / Multi-Vector (Gold Standard)</text>
  <text x="45" y="274" class="body-txt">• Small 150-token child vectors optimized for precise embedding search &amp; retrieval</text>
  <text x="45" y="294" class="body-txt">• Automatically expands to full 1500-token parent section context before feeding the LLM</text>
</svg>