<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Raw Documents -->
  <rect x="25" y="80" width="180" height="90" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="115" y="106" class="title-txt" text-anchor="middle">Raw Documents</text>
  <text x="37" y="130" class="body-txt" text-anchor="start">• Scanned PDFs &amp; 10-Ks</text>
  <text x="37" y="148" class="body-txt" text-anchor="start">• Technical Manuals</text>

  <path d="M 205 125 L 245 125" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Classifier Diamond -->
  <polygon points="310,80 375,125 310,170 245,125" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="310" y="120" class="title-txt" text-anchor="middle">Document</text>
  <text x="310" y="136" class="sub-txt" text-anchor="middle">Classifier</text>

  <!-- Branch Top: Native Digital -->
  <path d="M 310 80 L 310 50 Q 310 40 325 40 L 400 40" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="320" y="28" width="70" height="18" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="355" y="41" class="edge-txt" text-anchor="middle" fill="#10B981">Digital</text>

  <rect x="400" y="15" width="190" height="60" rx="8" ry="8" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="495" y="38" class="title-txt" text-anchor="middle" fill="#10B981">PyMuPDF / pdfplumber</text>
  <text x="410" y="58" class="body-txt" text-anchor="start">• Extracts native spans &amp; tables</text>

  <!-- Branch Bottom: Scanned Raster -->
  <path d="M 310 170 L 310 200 Q 310 210 325 210 L 400 210" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <rect x="320" y="198" width="70" height="18" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="355" y="211" class="edge-txt" text-anchor="middle" fill="#EF4444">Scanned</text>

  <rect x="400" y="180" width="190" height="60" rx="8" ry="8" fill="#111827" stroke="#EF4444" stroke-width="1.5"/>
  <text x="495" y="203" class="title-txt" text-anchor="middle" fill="#FCA5A5">LayoutLMv3 / PaddleOCR</text>
  <text x="410" y="223" class="body-txt" text-anchor="start">• OCR + Table Transformer</text>

  <!-- Merge into Normalizer -->
  <path d="M 590 45 L 630 45 Q 645 45 645 70 L 645 100 L 660 100" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M 590 210 L 630 210 Q 645 210 645 180 L 645 140 L 660 140" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Normalizer -->
  <rect x="660" y="80" width="260" height="85" rx="8" ry="8" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="790" y="105" class="title-txt" text-anchor="middle" fill="#6EE7B7">Reading Order &amp; Markdown Normalizer</text>
  <text x="672" y="128" class="body-txt" text-anchor="start">• Converts tables to Markdown / HTML</text>
  <text x="672" y="146" class="body-txt" text-anchor="start">• Stitches multi-column reading flow</text>

  <!-- Connector Normalizer to Lower Row (Chunking Router) -->
  <path d="M 790 165 L 790 260 Q 790 275 775 275 L 730 275" fill="none" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- Chunking Router & Dedup Pipeline -->
  <rect x="470" y="240" width="260" height="80" rx="8" ry="8" fill="#111827" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="600" y="265" class="title-txt" text-anchor="middle" fill="#C084FC">Chunking Router</text>
  <text x="482" y="288" class="body-txt" text-anchor="start">• Semantic, Markdown-aware, or</text>
  <text x="482" y="306" class="body-txt" text-anchor="start">• Hierarchical Parent-Child split</text>

  <path d="M 470 280 L 410 280" fill="none" stroke="#06B6D4" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- MinHash Dedup -->
  <rect x="230" y="240" width="180" height="80" rx="8" ry="8" fill="#111827" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="320" y="265" class="title-txt" text-anchor="middle">MinHash LSH Dedup</text>
  <text x="242" y="288" class="body-txt" text-anchor="start">• Jaccard near-duplicate</text>
  <text x="242" y="306" class="body-txt" text-anchor="start">• Prunes redundant text</text>

  <path d="M 230 280 L 170 280" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Vector Database Sink -->
  <rect x="25" y="240" width="145" height="80" rx="8" ry="8" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="97" y="265" class="title-txt" text-anchor="middle" fill="#A7F3D0">Vector Store</text>
  <text x="35" y="288" class="mono-txt" text-anchor="start">pgvector / Qdrant</text>
  <text x="35" y="306" class="badge-txt" fill="#10B981">✓ Indexed &amp; Ready</text>
</svg>