<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 700; text-anchor: middle; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .code-txt { fill: #FCD34D; font-family: "SFMono-Regular", Consolas, monospace; font-size: 10px; }
      .edge { stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="1000" height="360" fill="#0B0F19"/>

  <!-- Left: Method A (Amber) -->
  <g transform="translate(30, 25)">
    <rect width="450" height="310" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <text x="225" y="28" class="title" fill="#FCD34D">Method A: dbutils.notebook.run() (Legacy)</text>
    <line x1="20" y1="38" x2="430" y2="38" stroke="#1F2937" stroke-width="1.5"/>

    <rect x="25" y="55" width="400" height="42" rx="6" ry="6" fill="#1F2937" stroke="#F59E0B" stroke-width="1"/>
    <text x="35" y="80" class="code-txt">Parent Orchestrator Notebook</text>

    <path fill="none" d="M 225 97 L 225 115" class="edge" stroke="#F59E0B" marker-end="url(#arr-amber)"/>

    <rect x="25" y="115" width="400" height="42" rx="6" ry="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="35" y="140" class="code-txt">dbutils.notebook.run('bronze_etl', 600)</text>

    <path fill="none" d="M 225 157 L 225 175" class="edge" stroke="#F59E0B" marker-end="url(#arr-amber)"/>

    <rect x="25" y="175" width="400" height="42" rx="6" ry="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="35" y="200" class="code-txt">dbutils.notebook.run('silver_etl', 1200)</text>

    <!-- Disadvantages Note -->
    <rect x="25" y="235" width="400" height="60" rx="6" ry="6" fill="#1F2937" stroke="#EF4444" stroke-width="1"/>
    <text x="225" y="258" class="body-txt" text-anchor="middle" fill="#FCA5A5">• Runs sequentially on single shared cluster (No right-sizing)</text>
    <text x="225" y="278" class="body-txt" text-anchor="middle" fill="#FCA5A5">• Failures require restarting entire pipeline from scratch</text>
  </g>

  <!-- Right: Method B (Green) -->
  <g transform="translate(520, 25)">
    <rect width="450" height="310" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <text x="225" y="28" class="title" fill="#6EE7B7">Method B: Databricks Workflows (Modern DAG)</text>
    <line x1="20" y1="38" x2="430" y2="38" stroke="#1F2937" stroke-width="1.5"/>

    <!-- Task 1 Ingestion -->
    <rect x="25" y="90" width="130" height="65" rx="6" ry="6" fill="#1F2937" stroke="#10B981" stroke-width="1.5"/>
    <text x="90" y="112" class="title" font-size="11" fill="#6EE7B7">Task 1: Ingest</text>
    <text x="90" y="130" class="body-txt" text-anchor="middle">2 Workers</text>

    <!-- Task 2 Transformation -->
    <rect x="190" y="55" width="130" height="60" rx="6" ry="6" fill="#1F2937" stroke="#10B981" stroke-width="1.5"/>
    <text x="255" y="78" class="title" font-size="11" fill="#6EE7B7">Task 2: Transform</text>
    <text x="255" y="96" class="body-txt" text-anchor="middle">8 Workers</text>

    <!-- Task 3 Validation -->
    <rect x="190" y="135" width="130" height="60" rx="6" ry="6" fill="#1F2937" stroke="#10B981" stroke-width="1.5"/>
    <text x="255" y="158" class="title" font-size="11" fill="#6EE7B7">Task 3: Validate</text>
    <text x="255" y="176" class="body-txt" text-anchor="middle">Serverless</text>

    <!-- Task 4 Gold Aggregate -->
    <rect x="355" y="90" width="80" height="65" rx="6" ry="6" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
    <text x="395" y="118" class="title" font-size="11" fill="#A7F3D0">Task 4</text>
    <text x="395" y="136" class="body-txt" text-anchor="middle" fill="#A7F3D0">Gold</text>

    <!-- DAG Edges with straight runways -->
    <path fill="none" d="M 155 110 L 175 110 C 185 110, 185 85, 190 85" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>
    <path fill="none" d="M 155 130 L 175 130 C 185 130, 185 165, 190 165" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>
    <path fill="none" d="M 320 85 L 340 85 C 345 85, 350 110, 355 110" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>
    <path fill="none" d="M 320 165 L 340 165 C 345 165, 350 135, 355 135" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>

    <!-- Advantages Note -->
    <rect x="25" y="235" width="400" height="60" rx="6" ry="6" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="225" y="258" class="body-txt" text-anchor="middle" fill="#A7F3D0">• Visual DAG with independent cluster sizing per task</text>
    <text x="225" y="278" class="body-txt" text-anchor="middle" fill="#A7F3D0">• Repair-and-run without re-running completed tasks!</text>
  </g>
</svg>
