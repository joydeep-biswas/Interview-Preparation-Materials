<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 380" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 700; text-anchor: middle; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .edge { stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444" />
    </marker>
  </defs>

  <rect width="1020" height="380" fill="#0B0F19"  rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Col 1: Initial State -->
  <g transform="translate(30, 130)">
    <rect width="210" height="110" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2" />
    <text x="105" y="32" class="title" fill="#93C5FD">Table Version V0</text>
    <line x1="15" y1="44" x2="195" y2="44" stroke="#1F2937" stroke-width="1.5" />
    <text x="105" y="68" class="body-txt" text-anchor="middle">part-00005.parquet</text>
    <text x="105" y="88" class="body-txt" text-anchor="middle">Contains M100 AND M200</text>
  </g>

  <!-- Connectors to Job A and Job B with straight runways -->
  <!-- Col 2: Job A & Job B -->
  <g transform="translate(305, 40)">
    <rect width="210" height="80" rx="8" ry="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
    <text x="105" y="28" class="title" font-size="12" fill="#6EE7B7">Job A (Update M100)</text>
    <line x1="15" y1="38" x2="195" y2="38" stroke="#1F2937" stroke-width="1" />
    <text x="105" y="60" class="body-txt" text-anchor="middle">WHERE merchant_id = 'M100'</text>
  </g>

  <g transform="translate(305, 240)">
    <rect width="210" height="80" rx="8" ry="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" />
    <text x="105" y="28" class="title" font-size="12" fill="#FCD34D">Job B (Update M200)</text>
    <line x1="15" y1="38" x2="195" y2="38" stroke="#1F2937" stroke-width="1" />
    <text x="105" y="60" class="body-txt" text-anchor="middle">WHERE merchant_id = 'M200'</text>
  </g>

  <!-- Job A Commits V1 -->
  <g transform="translate(570, 35)">
    <rect width="420" height="85" rx="8" ry="8" fill="#064E3B" stroke="#10B981" stroke-width="2" />
    <text x="210" y="26" class="title" fill="#A7F3D0">✅ Commit V1 Succeeded! (Job A)</text>
    <line x1="15" y1="36" x2="405" y2="36" stroke="#047857" stroke-width="1" />
    <text x="20" y="56" class="body-txt" fill="#A7F3D0">• Tombstones part-00005 &amp; writes part-00005-A</text>
    <text x="20" y="72" class="body-txt" fill="#A7F3D0">• Transaction V1 committed to _delta_log/</text>
  </g>

  <!-- OCC Conflict Check -->
  <g transform="translate(570, 160)">
    <rect width="420" height="92" rx="8" ry="8" fill="#111827" stroke="#F59E0B" stroke-width="2" />
    <text x="210" y="26" class="title" fill="#FCD34D">Optimistic Concurrency Control (OCC) Check</text>
    <line x1="15" y1="36" x2="405" y2="36" stroke="#1F2937" stroke-width="1" />
    <text x="20" y="56" class="body-txt">• Job B attempts Commit V2 on read version V0</text>
    <text x="20" y="74" class="body-txt" fill="#FCD34D">• Conflict detected: Target file part-00005 was modified by V1!</text>
  </g>

  <path fill="none" d="M 515 280 L 545 280 C 560 280, 560 215, 570 215" class="edge" stroke="#F59E0B" />
  <path fill="none" d="M 780 120 L 780 160" class="edge" stroke="#10B981" />

  <!-- Crash B Box -->
  <g transform="translate(570, 270)">
    <rect width="420" height="85" rx="8" ry="8" fill="#7F1D1D" stroke="#EF4444" stroke-width="2" />
    <text x="210" y="26" class="title" fill="#FECACA">⛔ DeltaConcurrentModificationException</text>
    <line x1="15" y1="36" x2="405" y2="36" stroke="#991B1B" stroke-width="1" />
    <text x="20" y="56" class="body-txt" fill="#FECACA">• Job B aborts to prevent overwriting Job A's updates to M100</text>
    <text x="20" y="72" class="body-txt" fill="#FCA5A5">Solution: Partition/Liquid cluster on merchant_id or retry</text>
  </g>

  <g id="connectors"><path fill="none" d="M 240 160 L 260 160 C 275 160, 275 80, 290 80 L 305 80" class="edge" stroke="#8B5CF6" marker-end="url(#arr-blue)" />
  <path fill="none" d="M 240 210 L 260 210 C 275 210, 275 280, 290 280 L 305 280" class="edge" stroke="#8B5CF6" marker-end="url(#arr-blue)" />

  <path fill="none" d="M 515 80 L 570 80" class="edge" stroke="#10B981" marker-end="url(#arr-green)" />

  <path fill="none" d="M 780 245 L 780 270" class="edge" stroke="#EF4444" marker-end="url(#arr-red)" />
</g></svg>