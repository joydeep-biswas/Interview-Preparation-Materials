<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 380" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .pillar-box { fill: #111827; stroke-width: 2; rx: 10; ry: 10; }
      .card { fill: #1E293B; stroke-width: 1.5; rx: 8; ry: 8; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #94A3B8; text-anchor: start; }
      .code-line { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #60A5FA; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
    </style>
    <marker id="arr-b25db" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g25db" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <rect x="25" y="25" width="1010" height="330" class="pillar-box" stroke="#3B82F6"/>
  <text x="530" y="55" class="title-text" fill="#60A5FA">Databricks Git Merge Conflict Resolution &amp; Dev $\to$ UAT $\to$ Prod Promotion</text>

  <!-- Step 1: Conflict Resolution -->
  <rect x="45" y="80" width="220" height="250" class="card" stroke="#EF4444"/>
  <text x="155" y="108" class="card-title" fill="#FCA5A5">1. Conflict Resolution</text>
  <text x="55" y="135" class="card-body" fill="#F8FAFC">• Concurrent edits in Repos</text>
  <text x="55" y="155" class="card-body">• Best Practice: Modular .py files</text>
  <text x="55" y="175" class="card-body">  (avoid raw .ipynb JSON diffs)</text>
  <text x="55" y="200" class="code-line">git checkout feature-x</text>
  <text x="55" y="218" class="code-line">git pull --rebase origin main</text>
  <text x="55" y="240" class="card-body">• Resolve diffs in IDE/terminal</text>
  <text x="55" y="260" class="code-line">bundle validate -t dev</text>
  <text x="55" y="300" class="card-body" fill="#FCA5A5">Output: Clean feature commit</text>

  <!-- Edge 1 -> 2 -->
  <path d="M 265 205 L 295 205" class="edge" stroke="#3B82F6" marker-end="url(#arr-b25db)"/>

  <!-- Step 2: PR & CI -->
  <rect x="300" y="80" width="220" height="250" class="card" stroke="#F59E0B"/>
  <text x="410" y="108" class="card-title" fill="#FCD34D">2. PR &amp; Automated CI</text>
  <text x="310" y="135" class="card-body" fill="#F8FAFC">• Open PR to main</text>
  <text x="310" y="155" class="card-body">• CI Pipeline Triggers:</text>
  <text x="320" y="175" class="card-body">  - Flake8 / Black / Ruff linting</text>
  <text x="320" y="195" class="card-body">  - Pytest unit tests</text>
  <text x="320" y="215" class="card-body">  - databricks bundle validate</text>
  <text x="310" y="245" class="card-body">• Peer review: 1 approval required</text>
  <text x="310" y="265" class="card-body">• Linear Git history enforced</text>
  <text x="310" y="300" class="card-body" fill="#FCD34D">Status: PR Merged to Main</text>

  <!-- Edge 2 -> 3 -->
  <path d="M 520 205 L 550 205" class="edge" stroke="#3B82F6" marker-end="url(#arr-b25db)"/>

  <!-- Step 3: UAT CD -->
  <rect x="555" y="80" width="220" height="250" class="card" stroke="#3B82F6"/>
  <text x="665" y="108" class="card-title" fill="#93C5FD">3. Automated UAT Staging</text>
  <text x="565" y="135" class="card-body" fill="#F8FAFC">• CD Pipeline automated deploy:</text>
  <text x="565" y="160" class="code-line">databricks bundle deploy</text>
  <text x="565" y="178" class="code-line">  --target uat</text>
  <text x="565" y="205" class="card-body">• Isolated UAT workspace</text>
  <text x="565" y="225" class="card-body">• Triggers test workflow runs</text>
  <text x="565" y="245" class="card-body">• Validates Delta table schemas</text>
  <text x="565" y="265" class="card-body">• End-to-end integration tests</text>
  <text x="565" y="300" class="card-body" fill="#93C5FD">Status: UAT Verified</text>

  <!-- Edge 3 -> 4 -->
  <path d="M 775 205 L 805 205" class="edge" stroke="#10B981" marker-end="url(#arr-g25db)"/>

  <!-- Step 4: Production Gate -->
  <rect x="810" y="80" width="210" height="250" class="card" stroke="#10B981"/>
  <text x="915" y="108" class="card-title" fill="#34D399">4. Production Gate</text>
  <text x="820" y="135" class="card-body" fill="#F8FAFC">• Formal Approval Gate</text>
  <text x="820" y="155" class="card-body">• Service Principal deployment</text>
  <text x="820" y="175" class="card-body">  (No user token access)</text>
  <text x="820" y="200" class="code-line">bundle deploy -t prod</text>
  <text x="820" y="225" class="card-body">• Blue/Green workflow swap</text>
  <text x="820" y="245" class="card-body">• Rollback checkpoint saved</text>
  <text x="820" y="265" class="card-body">• Alerting: PagerDuty / Slack</text>
  <text x="820" y="300" class="card-body" fill="#10B981">Status: Production Live</text>
</svg>

