<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 320" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; text-anchor: start; }
      .edge-label { fill: #E2E8F0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; text-anchor: middle; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Col 1: Git -->
  <g transform="translate(30, 95)">
    <rect width="210" height="130" rx="8" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <text x="105" y="28" class="title" fill="#93C5FD">1. Git Source Repository</text>
    <line x1="15" y1="38" x2="195" y2="38" stroke="#1F2937" stroke-width="1"/>
    <text x="20" y="60" class="body-txt">• Shared PySpark transforms</text>
    <text x="20" y="80" class="body-txt">• Strict type annotations</text>
    <text x="20" y="100" class="body-txt">• Chispa &amp; PyTest unit suites</text>
    <text x="20" y="118" class="body-txt">• pyproject.toml / build config</text>
  </g>

  <path d="M 240 160 L 285 160" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Col 2: CI/CD -->
  <g transform="translate(285, 95)">
    <rect width="210" height="130" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <text x="105" y="28" class="title" fill="#FDE68A">2. CI/CD Build Engine</text>
    <line x1="15" y1="38" x2="195" y2="38" stroke="#334155" stroke-width="1"/>
    <text x="20" y="60" class="body-txt">• GitHub Actions / Azure DevOps</text>
    <text x="20" y="80" class="body-txt">• Runs automated tests</text>
    <text x="20" y="100" class="body-txt">• Builds binary wheel (.whl)</text>
    <text x="20" y="118" class="body-txt">• Enforces semver (v1.4.2)</text>
  </g>

  <path d="M 495 160 L 540 160" fill="none" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <!-- Col 3: UC Volume -->
  <g transform="translate(540, 95)">
    <rect width="210" height="130" rx="8" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="2"/>
    <text x="105" y="28" class="title" fill="#C4B5FD">3. Unity Catalog Volume</text>
    <line x1="15" y1="38" x2="195" y2="38" stroke="#312E81" stroke-width="1"/>
    <text x="20" y="60" class="body-txt">• /Volumes/corp/tools/wheels/</text>
    <text x="20" y="80" class="body-txt">• Central artifact registry</text>
    <text x="20" y="100" class="body-txt">• Immutable artifact storage</text>
    <text x="20" y="118" class="body-txt">• Workspace-wide access control</text>
  </g>

  <path d="M 750 160 L 795 160" fill="none" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arr-purple)"/>

  <!-- Col 4: DAB -->
  <g transform="translate(795, 95)">
    <rect width="200" height="130" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
    <text x="100" y="28" class="title" fill="#A7F3D0">4. Asset Bundle (DAB)</text>
    <line x1="15" y1="38" x2="185" y2="38" stroke="#047857" stroke-width="1"/>
    <text x="20" y="60" class="body-txt" fill="#A7F3D0">• databricks.yml spec</text>
    <text x="20" y="80" class="body-txt" fill="#A7F3D0">• Pins exact wheel file</text>
    <text x="20" y="100" class="body-txt" fill="#A7F3D0">• Installs on job startup</text>
    <text x="20" y="118" class="body-txt" fill="#A7F3D0">• 0 dependency drift</text>
  </g>
</svg>
