<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 700; text-anchor: middle; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .edge { stroke-width: 1.5; fill: none; }
      .lbl { fill: #93C5FD; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; text-anchor: middle; }
    </style>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981" />
    </marker>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4" />
    </marker>
  </defs>

  <rect width="1000" height="380" fill="#0B0F19"  rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Left Container: _delta_log/ -->
  <g transform="translate(30, 25)">
    <rect width="440" height="330" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2" />
    <text x="220" y="28" class="title" fill="#6EE7B7">_delta_log/ Directory (Ordered Monotonic Commits)</text>
    <line x1="20" y1="40" x2="420" y2="40" stroke="#1F2937" stroke-width="1.5" />

    <rect x="25" y="60" width="390" height="60" rx="8" ry="8" fill="#1F2937" stroke="#10B981" stroke-width="1.5" />
    <text x="220" y="84" class="title" font-size="12" fill="#F9FAFB">000000.json (Commit 0)</text>
    <text x="220" y="102" class="body-txt" text-anchor="middle">metaData, add: part-0000.parquet</text>

    <path fill="none" d="M 220 120 L 220 150" class="edge" stroke="#10B981" marker-end="url(#arr-green)" />

    <rect x="25" y="150" width="390" height="65" rx="8" ry="8" fill="#1F2937" stroke="#10B981" stroke-width="1.5" />
    <text x="220" y="174" class="title" font-size="12" fill="#F9FAFB">000001.json (Commit 1)</text>
    <text x="220" y="192" class="body-txt" text-anchor="middle">remove: part-0000.parquet, add: part-0001.parquet</text>

    <path fill="none" d="M 220 215 L 220 245" class="edge" stroke="#10B981" marker-end="url(#arr-green)" />

    <rect x="25" y="245" width="390" height="65" rx="8" ry="8" fill="#064E3B" stroke="#10B981" stroke-width="2" />
    <text x="220" y="270" class="title" font-size="12" fill="#A7F3D0">000010.checkpoint.parquet</text>
    <text x="220" y="290" class="body-txt" text-anchor="middle" fill="#A7F3D0">Consolidated Snapshot State (Every 10 Commits)</text>
  </g>

  <!-- Right Container: Parquet Files -->
  <g transform="translate(530, 25)">
    <rect width="440" height="330" rx="10" ry="10" fill="#111827" stroke="#06B6D4" stroke-width="2" />
    <text x="220" y="28" class="title" fill="#67E8F9">Physical Columnar Storage (Parquet Data Files)</text>
    <line x1="20" y1="40" x2="420" y2="40" stroke="#1F2937" stroke-width="1.5" />

    <rect x="25" y="60" width="390" height="60" rx="8" ry="8" fill="#7F1D1D" stroke="#EF4444" stroke-width="1.5" />
    <text x="220" y="84" class="title" font-size="12" fill="#FECACA">part-0000.parquet</text>
    <text x="220" y="102" class="body-txt" text-anchor="middle" fill="#FCA5A5">Logical Tombstone (Removed in Commit 1; Awaiting VACUUM)</text>

    <rect x="25" y="150" width="390" height="65" rx="8" ry="8" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5" />
    <text x="220" y="174" class="title" font-size="12" fill="#67E8F9">part-0001.parquet</text>
    <text x="220" y="192" class="body-txt" text-anchor="middle">Active Valid Snapshot File (Referenced in State)</text>

    <rect x="25" y="245" width="390" height="65" rx="8" ry="8" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5" />
    <text x="220" y="270" class="title" font-size="12" fill="#67E8F9">part-0002.parquet</text>
    <text x="220" y="290" class="body-txt" text-anchor="middle">Active Valid Snapshot File (Referenced in State)</text>
  </g>

  <!-- Cross-box pointer arrows with straight runways -->
  <path fill="none" d="M 415 115 L 450 115 C 480 115, 500 90, 520 90 L 530 90" class="edge" stroke="#EF4444" stroke-dasharray="3 3" />
  <g id="connectors"><path fill="none" d="M 415 180 L 530 180" class="edge" stroke="#06B6D4" marker-end="url(#arr-cyan)" />
  <path fill="none" d="M 415 275 L 530 275" class="edge" stroke="#06B6D4" marker-end="url(#arr-cyan)" />
</g></svg>