<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 360" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; text-anchor: start; }
      .edge-label { fill: #E2E8F0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; text-anchor: middle; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Left: Incoming Batch -->
  <g transform="translate(30, 120)">
    <rect width="210" height="110" rx="8" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <text x="105" y="28" class="title" fill="#93C5FD">Incoming Upsert Batch</text>
    <line x1="15" y1="38" x2="195" y2="38" stroke="#1F2937" stroke-width="1"/>
    <text x="20" y="60" class="body-txt">• New column: 'tax_exempt'</text>
    <text x="20" y="80" class="body-txt">• Delta MERGE statement</text>
    <text x="20" y="98" class="body-txt">• .option("mergeSchema") ignored!</text>
  </g>

  <!-- Connect 1 -> 2 -->
  <path d="M 240 175 L 295 175" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Middle: autoMerge Check -->
  <g transform="translate(295, 120)">
    <rect width="230" height="110" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <text x="115" y="28" class="title" fill="#FDE68A">Session Config Check</text>
    <line x1="15" y1="38" x2="215" y2="38" stroke="#334155" stroke-width="1"/>
    <text x="20" y="60" class="body-txt">• spark.databricks.delta</text>
    <text x="20" y="80" class="body-txt">  .schema.autoMerge.enabled</text>
    <text x="20" y="98" class="body-txt">Evaluates True vs False</text>
  </g>

  <!-- Branch False -> Upwards to Rejection -->
  <path d="M 410 120 L 410 85 Q 410 75 425 75 L 610 75" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <rect x="440" y="63" width="140" height="20" rx="4" fill="#1E293B" stroke="#7F1D1D" stroke-width="1"/>
  <text x="510" y="77" class="edge-label" fill="#FCA5A5">autoMerge = FALSE</text>

  <!-- Top Right: Schema Enforced Rejection -->
  <g transform="translate(610, 30)">
    <rect width="370" height="90" rx="8" fill="#7F1D1D" stroke="#EF4444" stroke-width="2"/>
    <text x="185" y="26" class="title" fill="#FECACA">AnalysisException: Cannot Resolve Column</text>
    <line x1="15" y1="36" x2="355" y2="36" stroke="#991B1B" stroke-width="1"/>
    <text x="20" y="56" class="body-txt" fill="#FCA5A5">• Target table schema enforced; write rejected</text>
    <text x="20" y="74" class="body-txt" fill="#FCA5A5">• Protects against accidental column spelling typos</text>
  </g>

  <!-- Branch True -> Downwards to Type Check -->
  <path d="M 410 230 L 410 260 Q 410 270 425 270 L 610 270" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="440" y="258" width="140" height="20" rx="4" fill="#1E293B" stroke="#065F46" stroke-width="1"/>
  <text x="510" y="272" class="edge-label" fill="#A7F3D0">autoMerge = TRUE</text>

  <!-- Bottom Right: Schema Evolved in Log -->
  <g transform="translate(610, 220)">
    <rect width="370" height="105" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
    <text x="185" y="26" class="title" fill="#A7F3D0">Atomic Schema Evolution in _delta_log</text>
    <line x1="15" y1="36" x2="355" y2="36" stroke="#047857" stroke-width="1"/>
    <text x="20" y="56" class="body-txt" fill="#A7F3D0">• Appends 'tax_exempt' as nullable column in metadata</text>
    <text x="20" y="74" class="body-txt" fill="#A7F3D0">• Matches updated rows; inserts new rows</text>
    <text x="20" y="92" class="body-txt" fill="#A7F3D0">• Historical target rows automatically receive NULL</text>
  </g>
</svg>
