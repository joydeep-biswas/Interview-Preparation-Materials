<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 320" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 700; text-anchor: middle; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .edge { stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="1020" height="320" fill="#0B0F19"/>

  <!-- Left: Stage 1 -->
  <g transform="translate(30, 30)">
    <rect width="450" height="260" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <text x="225" y="30" class="title" fill="#93C5FD">Stage 1: Incremental Extraction &amp; Staging</text>
    <line x1="20" y1="42" x2="430" y2="42" stroke="#1F2937" stroke-width="1.5"/>

    <rect x="25" y="60" width="190" height="70" rx="8" ry="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="120" y="88" class="title" font-size="12" fill="#F9FAFB">Source DB / CDC Feed</text>
    <text x="120" y="108" class="body-txt" text-anchor="middle">Debezium / Kafka / Delta</text>

    <path fill="none" d="M 215 95 L 255 95" class="edge" stroke="#3B82F6" marker-end="url(#arr-blue)"/>

    <rect x="255" y="60" width="170" height="70" rx="8" ry="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="340" y="88" class="title" font-size="12" fill="#F9FAFB">Watermark Filter</text>
    <text x="340" y="108" class="body-txt" text-anchor="middle">modified_time &gt; watermark</text>

    <!-- Staging DataFrame -->
    <rect x="110" y="165" width="230" height="60" rx="8" ry="8" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <text x="225" y="190" class="title" font-size="12" fill="#FCD34D">Staging DataFrame</text>
    <text x="225" y="210" class="body-txt" text-anchor="middle">Micro-batch Delta Ingress</text>

    <path fill="none" d="M 340 130 L 340 150 C 340 165, 290 165, 275 165" class="edge" stroke="#3B82F6"/>
  </g>

  <!-- Inter-stage arrow -->
  <path fill="none" d="M 340 195 L 520 195" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>

  <!-- Right: Stage 2 -->
  <g transform="translate(520, 30)">
    <rect width="470" height="260" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <text x="235" y="30" class="title" fill="#6EE7B7">Stage 2: Deduplication &amp; Idempotent Upsert</text>
    <line x1="20" y1="42" x2="450" y2="42" stroke="#1F2937" stroke-width="1.5"/>

    <rect x="25" y="60" width="200" height="60" rx="8" ry="8" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="125" y="85" class="title" font-size="12" fill="#C4B5FD">Deduplicate Natural Key</text>
    <text x="125" y="105" class="body-txt" text-anchor="middle">ROW_NUMBER() = 1</text>

    <path fill="none" d="M 225 90 L 260 90" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>

    <rect x="260" y="55" width="185" height="70" rx="8" ry="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <text x="352.5" y="80" class="title" font-size="11" fill="#6EE7B7">Delta MERGE INTO</text>
    <text x="352.5" y="98" class="body-txt" text-anchor="middle">MATCHED: UPDATE</text>
    <text x="352.5" y="114" class="body-txt" text-anchor="middle">NOT MATCHED: INSERT</text>

    <!-- Target Tables -->
    <rect x="60" y="165" width="165" height="65" rx="8" ry="8" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
    <text x="142.5" y="190" class="title" font-size="11" fill="#A7F3D0">Target Delta Table</text>
    <text x="142.5" y="210" class="body-txt" text-anchor="middle" fill="#A7F3D0">Silver / Gold Mart</text>

    <rect x="245" y="165" width="200" height="65" rx="8" ry="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="345" y="190" class="title" font-size="11" fill="#FCD34D">Watermark Table</text>
    <text x="345" y="210" class="body-txt" text-anchor="middle">Advance High-Watermark</text>

    <!-- Connectors from merge to targets -->
    <path fill="none" d="M 310 125 L 310 145 C 310 165, 200 155, 175 165" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>
    <path fill="none" d="M 390 125 L 390 165" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>
  </g>
</svg>
