<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 360" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 700; text-anchor: middle; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .edge { stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444" />
    </marker>
  </defs>

  <rect width="1020" height="360" fill="#0B0F19"  rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Col 1: Developer Query -->
  <g transform="translate(30, 130)">
    <rect width="210" height="120" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2" />
    <text x="105" y="32" class="title" fill="#FCD34D">Developer Time Travel</text>
    <line x1="15" y1="44" x2="195" y2="44" stroke="#1F2937" stroke-width="1.5" />
    <text x="105" y="68" class="body-txt" text-anchor="middle">RESTORE TABLE</text>
    <text x="105" y="86" class="body-txt" text-anchor="middle">VERSION AS OF 120</text>
    <text x="105" y="102" class="body-txt" text-anchor="middle">(Day 60 Snapshot)</text>
  </g>

  <!-- Col 2: Metadata Log (90 Days) -->
  <g transform="translate(290, 40)">
    <rect width="320" height="280" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2" />
    <text x="160" y="30" class="title" fill="#93C5FD">Transaction Log (delta.logRetention = 90d)</text>
    <line x1="15" y1="42" x2="305" y2="42" stroke="#1F2937" stroke-width="1.5" />

    <rect x="20" y="60" width="280" height="55" rx="6" ry="6" fill="#1E293B"  stroke="#334155" stroke-width="1"/>
    <text x="35" y="84" class="title" font-size="11" fill="#93C5FD" text-anchor="start">Day 90: Version 10 JSON</text>
    <text x="35" y="100" class="body-txt">Metadata commit file preserved</text>

    <rect x="20" y="130" width="280" height="65" rx="6" ry="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" />
    <text x="35" y="154" class="title" font-size="11" fill="#FCD34D" text-anchor="start">Day 60: Version 120 JSON</text>
    <text x="35" y="172" class="body-txt">Metadata valid! References part-00042</text>

    <rect x="20" y="210" width="280" height="55" rx="6" ry="6" fill="#1E293B"  stroke="#334155" stroke-width="1"/>
    <text x="35" y="234" class="title" font-size="11" fill="#93C5FD" text-anchor="start">Day 0: Version 350 (Current)</text>
    <text x="35" y="250" class="body-txt">Active production commit</text>
  </g>

  <!-- Col 3: Storage & Crash -->
  <g transform="translate(670, 40)">
    <rect width="320" height="145" rx="10" ry="10" fill="#111827" stroke="#EF4444" stroke-width="2" />
    <text x="160" y="28" class="title" fill="#FCA5A5">Storage (VACUUM RETAIN = 7 Days)</text>
    <line x1="15" y1="38" x2="305" y2="38" stroke="#1F2937" stroke-width="1" />
    <text x="20" y="62" class="body-txt">📄 Active Parquet: Retained</text>
    <text x="20" y="88" class="title" font-size="11" fill="#EF4444">❌ Day 60 Parquet: PURGED BY VACUUM!</text>
    <text x="20" y="108" class="body-txt" fill="#FCA5A5">Physical files older than 7d deleted</text>
    <text x="20" y="126" class="body-txt" fill="#FCA5A5">to reduce cloud storage costs</text>
  </g>

  <!-- Crash Notification -->
  <g transform="translate(670, 205)">
    <rect width="320" height="115" rx="10" ry="10" fill="#7F1D1D" stroke="#EF4444" stroke-width="2" />
    <text x="160" y="32" class="title" fill="#FECACA">💥 java.io.FileNotFoundException</text>
    <line x1="15" y1="44" x2="305" y2="44" stroke="#991B1B" stroke-width="1" />
    <text x="160" y="70" class="body-txt" text-anchor="middle" fill="#FECACA">Metadata points to deleted Parquet!</text>
    <text x="160" y="92" class="body-txt" text-anchor="middle" fill="#FCA5A5">Keep VACUUM retention &gt;= time travel target</text>
  </g>

  <g id="connectors"><path fill="none" d="M 240 185 L 290 185" class="edge" stroke="#F59E0B" marker-end="url(#arr-amber)" />

  <path fill="none" d="M 610 165 L 670 165" class="edge" stroke="#EF4444" marker-end="url(#arr-red)" />

  <path fill="none" d="M 830 185 L 830 205" class="edge" stroke="#EF4444" marker-end="url(#arr-red)" />
</g></svg>