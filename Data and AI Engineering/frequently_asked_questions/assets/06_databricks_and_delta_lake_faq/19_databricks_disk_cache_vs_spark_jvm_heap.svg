<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 370" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; text-anchor: start; }
      .edge-label { fill: #E2E8F0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; text-anchor: middle; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Left: Cloud Storage -->
  <g transform="translate(30, 125)">
    <rect width="220" height="115" rx="8" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <text x="110" y="28" class="title" fill="#93C5FD">Cloud Object Storage</text>
    <line x1="15" y1="38" x2="205" y2="38" stroke="#1F2937" stroke-width="1"/>
    <text x="20" y="60" class="body-txt">• ADLS Gen2 / AWS S3</text>
    <text x="20" y="80" class="body-txt">• Parquet &amp; Delta log</text>
    <text x="20" y="98" class="body-txt">• Remote read latency: ~25ms</text>
  </g>

  <!-- Connect to Top: Disk Cache -->
  <path d="M 250 150 L 290 150 Q 300 150 300 135 L 300 80 Q 300 65 315 65 L 330 65" fill="none" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arr-purple)"/>

  <!-- Top Middle: Databricks Disk Cache -->
  <g transform="translate(330, 20)">
    <rect width="320" height="115" rx="8" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="2"/>
    <text x="160" y="28" class="title" fill="#C4B5FD">Databricks Disk Cache (Delta Cache)</text>
    <line x1="15" y1="38" x2="305" y2="38" stroke="#312E81" stroke-width="1"/>
    <text x="20" y="58" class="body-txt" fill="#C4B5FD">• Stored on Worker Local NVMe SSD</text>
    <text x="20" y="76" class="body-txt" fill="#C4B5FD">• Decoded CPU-friendly binary format</text>
    <text x="20" y="94" class="body-txt" fill="#A7F3D0">✔ ZERO JVM Garbage Collection (GC) Overhead</text>
  </g>

  <!-- Connect to Bottom: Spark Heap -->
  <path d="M 250 210 L 290 210 Q 300 210 300 225 L 300 280 Q 300 295 315 295 L 330 295" fill="none" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <!-- Bottom Middle: Spark JVM Heap -->
  <g transform="translate(330, 235)">
    <rect width="320" height="115" rx="8" fill="#1F2937" stroke="#F59E0B" stroke-width="2"/>
    <text x="160" y="28" class="title" fill="#FDE68A">Spark JVM Heap (cache / persist)</text>
    <line x1="15" y1="38" x2="305" y2="38" stroke="#374151" stroke-width="1"/>
    <text x="20" y="58" class="body-txt">• Deserialized Java objects in memory pool</text>
    <text x="20" y="76" class="body-txt">• Competes with execution memory for joins</text>
    <text x="20" y="94" class="body-txt" fill="#FCA5A5">⚠ Severe GC pauses &amp; OOM risk at scale</text>
  </g>

  <!-- Connect Disk Cache to Engine -->
  <path d="M 650 75 L 700 75 Q 710 75 710 135 L 710 160 Q 710 175 725 175 L 740 175" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Connect JVM Heap to Engine -->
  <path d="M 650 295 L 700 295 Q 710 295 710 235 L 710 190 Q 710 175 725 175 L 740 175" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Right: Execution Engine -->
  <g transform="translate(740, 125)">
    <rect width="250" height="115" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
    <text x="125" y="28" class="title" fill="#A7F3D0">Query Execution Engine</text>
    <line x1="15" y1="38" x2="235" y2="38" stroke="#047857" stroke-width="1"/>
    <text x="20" y="60" class="body-txt" fill="#A7F3D0">• Photon SIMD Vectorized engine</text>
    <text x="20" y="80" class="body-txt" fill="#A7F3D0">• Sub-second local NVMe scan</text>
    <text x="20" y="98" class="body-txt" fill="#A7F3D0">• 3x to 10x throughput speedup</text>
  </g>
</svg>
