<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 370" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; text-anchor: start; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Left: VM Container -->
  <g transform="translate(30, 95)">
    <rect width="260" height="175" rx="8" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <text x="130" y="30" class="title" fill="#93C5FD">Host VM Node Specification</text>
    <line x1="15" y1="42" x2="245" y2="42" stroke="#1F2937" stroke-width="1"/>
    <text x="20" y="68" class="body-txt">• Standard_E16ds_v5 (Azure)</text>
    <text x="20" y="90" class="body-txt">• 16 vCPUs | 64 GB RAM</text>
    <text x="20" y="112" class="body-txt">• Local NVMe SSD included</text>
    <text x="20" y="134" class="body-txt">• Spot node pool with on-demand fallback</text>
    <text x="20" y="156" class="body-txt">• Autoscaling: 2 to 16 workers</text>
  </g>

  <!-- Connect to OS -->
  <path d="M 290 120 L 370 120 Q 385 120 385 80 L 385 55 Q 385 45 400 45 L 430 45" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <!-- Connect to Exec 1 -->
  <path d="M 290 145 L 390 145 Q 410 145 410 140 L 430 140" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <!-- Connect to Exec 2 -->
  <path d="M 290 185 L 390 185 Q 410 185 410 220 L 430 220" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <!-- Connect to Exec 3 -->
  <path d="M 290 230 L 370 230 Q 385 230 385 280 L 385 300 Q 385 310 400 310 L 430 310" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Top Right: OS Overhead -->
  <g transform="translate(430, 20)">
    <rect width="550" height="60" rx="6" fill="#1F2937" stroke="#64748B" stroke-width="1.5"/>
    <text x="275" y="24" class="title" fill="#CBD5E1">OS &amp; Host Node Daemons (1 vCPU, 4 GB RAM reserved)</text>
    <text x="20" y="46" class="body-txt" fill="#94A3B8">• System kernel, network buffer queues, and Databricks container agent monitoring</text>
  </g>

  <!-- Exec 1 -->
  <g transform="translate(430, 100)">
    <rect width="550" height="70" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
    <text x="275" y="24" class="title" fill="#A7F3D0">Executor JVM 1 (5 Cores | 28 GB RAM + 2 GB Overhead)</text>
    <text x="20" y="46" class="body-txt" fill="#A7F3D0">• Sized ≤ 32 GB: Preserves Compressed Ordinary Object Pointers (CompressedOops - 30% RAM savings)</text>
    <text x="20" y="62" class="body-txt" fill="#A7F3D0">• 5 Cores: Optimal HDFS/object-store I/O multi-threading without GC pause amplification</text>
  </g>

  <!-- Exec 2 -->
  <g transform="translate(430, 190)">
    <rect width="550" height="70" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
    <text x="275" y="24" class="title" fill="#A7F3D0">Executor JVM 2 (5 Cores | 28 GB RAM + 2 GB Overhead)</text>
    <text x="20" y="46" class="body-txt" fill="#A7F3D0">• Memory fraction: 60% execution/storage (16.8 GB), 40% user memory + buffer cache</text>
    <text x="20" y="62" class="body-txt" fill="#A7F3D0">• Dedicated NVMe local SSD scratch mount for shuffle disk spill paging</text>
  </g>

  <!-- Exec 3 -->
  <g transform="translate(430, 280)">
    <rect width="550" height="70" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
    <text x="275" y="24" class="title" fill="#A7F3D0">Executor JVM 3 (5 Cores | 28 GB RAM + 2 GB Overhead)</text>
    <text x="20" y="46" class="body-txt" fill="#A7F3D0">• Total: 3 Executors × 5 Cores = 15 Worker Cores actively processing Spark tasks</text>
    <text x="20" y="62" class="body-txt" fill="#A7F3D0">• Autoscaling daemon scales worker VMs dynamically based on stage backlog depth</text>
  </g>
</svg>
