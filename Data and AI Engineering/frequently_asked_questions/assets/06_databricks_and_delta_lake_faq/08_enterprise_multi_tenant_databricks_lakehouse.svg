<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 220" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .edge { stroke-width: 2; fill: none; }
    </style>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6" />
    </marker>
  </defs>

  <rect width="1020" height="220" fill="#0B0F19"  rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Col 1 -->
  <g transform="translate(25, 40)">
    <rect width="220" height="152" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2" />
    <text x="110" y="32" class="title" fill="#6EE7B7">1. Governance Isolation</text>
    <line x1="15" y1="44" x2="205" y2="44" stroke="#1F2937" stroke-width="1.5" />
    <text x="18" y="70" class="body-txt">• Unity Catalog Catalogs</text>
    <text x="18" y="92" class="body-txt">• Dedicated Storage Accs</text>
    <text x="18" y="114" class="body-txt">• tenant_a_catalog RBAC</text>
    <text x="18" y="134" class="body-txt">• Column &amp; Row Masking</text>
  </g>

  <!-- Col 2 -->
  <g transform="translate(275, 40)">
    <rect width="220" height="152" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2" />
    <text x="110" y="32" class="title" fill="#FCD34D">2. Compute Isolation</text>
    <line x1="15" y1="44" x2="205" y2="44" stroke="#1F2937" stroke-width="1.5" />
    <text x="18" y="70" class="body-txt">• Cluster Policies enforcement</text>
    <text x="18" y="92" class="body-txt">• Auto-shutdown (15 mins)</text>
    <text x="18" y="114" class="body-txt">• Max worker limits per team</text>
    <text x="18" y="134" class="body-txt">• Dedicated / Shared pools</text>
  </g>

  <!-- Col 3 -->
  <g transform="translate(525, 40)">
    <rect width="220" height="152" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2" />
    <text x="110" y="32" class="title" fill="#C4B5FD">3. Network &amp; Identity</text>
    <line x1="15" y1="44" x2="205" y2="44" stroke="#1F2937" stroke-width="1.5" />
    <text x="18" y="70" class="body-txt">• SCIM Azure AD / Okta</text>
    <text x="18" y="92" class="body-txt">• VNet injection clusters</text>
    <text x="18" y="114" class="body-txt">• Private Link endpoints</text>
    <text x="18" y="134" class="body-txt">• Zero public IP exposure</text>
  </g>

  <!-- Col 4 -->
  <g transform="translate(775, 40)">
    <rect width="220" height="152" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2" />
    <text x="110" y="32" class="title" fill="#93C5FD">4. FinOps &amp; Billing</text>
    <line x1="15" y1="44" x2="205" y2="44" stroke="#1F2937" stroke-width="1.5" />
    <text x="18" y="70" class="body-txt">• Mandatory Cluster Tags</text>
    <text x="18" y="92" class="body-txt">• system.billing.usage</text>
    <text x="18" y="114" class="body-txt">• Chargeback per cost center</text>
    <text x="18" y="134" class="body-txt">• Real-time spend alarms</text>
  </g>
<g id="connectors"><path fill="none" d="M 245 110 L 275 110" class="edge" stroke="#10B981" marker-end="url(#arr-green)" />

  <path fill="none" d="M 495 110 L 525 110" class="edge" stroke="#F59E0B" marker-end="url(#arr-amber)" />

  <path fill="none" d="M 745 110 L 775 110" class="edge" stroke="#8B5CF6" marker-end="url(#arr-purple)" />

  </g></svg>