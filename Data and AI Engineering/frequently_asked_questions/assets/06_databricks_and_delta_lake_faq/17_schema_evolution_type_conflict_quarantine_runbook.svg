<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 380" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .edge { stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
  </defs>

  <rect width="1020" height="380" fill="#0B0F19"/>

  <!-- Left: Ingestion Batch -->
  <g transform="translate(30, 130)">
    <rect width="210" height="110" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <text x="105" y="30" class="title" fill="#93C5FD">Upstream Ingestion</text>
    <line x1="15" y1="42" x2="195" y2="42" stroke="#1F2937" stroke-width="1.5"/>
    <text x="15" y="65" class="body-txt">• customer_zip: STRING '07030'</text>
    <text x="15" y="85" class="body-txt">• +2 new columns added</text>
    <text x="15" y="103" class="body-txt">Table has zip as INT</text>
  </g>

  <path fill="none" d="M 240 185 L 290 185" class="edge" stroke="#3B82F6" marker-end="url(#arr-blue)"/>

  <!-- Step 1: Schema Gatekeeper -->
  <g transform="translate(290, 130)">
    <rect width="200" height="110" rx="8" ry="8" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <text x="100" y="30" class="title" fill="#C4B5FD">Schema Gatekeeper</text>
    <line x1="15" y1="42" x2="185" y2="42" stroke="#1F2937" stroke-width="1.5"/>
    <text x="15" y="65" class="body-txt">• Compares incoming</text>
    <text x="15" y="85" class="body-txt">  schema vs Delta target</text>
    <text x="15" y="103" class="body-txt">Branch by compatibility</text>
  </g>

  <!-- Branch 1: Compatible Columns (Upwards) -->
  <g transform="translate(540, 25)">
    <rect width="280" height="95" rx="8" ry="8" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
    <text x="140" y="28" class="title" fill="#A7F3D0">mergeSchema (.option('mergeSchema'))</text>
    <line x1="15" y1="38" x2="265" y2="38" stroke="#047857" stroke-width="1"/>
    <text x="20" y="60" class="body-txt" fill="#A7F3D0">• Safely appends new compatible columns</text>
    <text x="20" y="78" class="body-txt" fill="#A7F3D0">• is_verified, loyalty_tier added seamlessly</text>
  </g>
  <path fill="none" d="M 390 130 L 390 72 C 390 72, 450 72, 525 72 L 540 72" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>

  <!-- Branch 2: Incompatible Type (Downwards) -->
  <g transform="translate(540, 140)">
    <rect width="280" height="100" rx="8" ry="8" fill="#7F1D1D" stroke="#EF4444" stroke-width="2"/>
    <text x="140" y="28" class="title" fill="#FECACA">Quarantine Corrupt Batch</text>
    <line x1="15" y1="38" x2="265" y2="38" stroke="#991B1B" stroke-width="1"/>
    <text x="20" y="58" class="body-txt" fill="#FECACA">• silver.raw_schema_quarantine</text>
    <text x="20" y="76" class="body-txt" fill="#FCA5A5">• Stores raw payload + schema diff</text>
    <text x="20" y="92" class="body-txt" fill="#FCA5A5">• Alerts oncall via Slack/PagerDuty</text>
  </g>
  <path fill="none" d="M 490 190 L 540 190" class="edge" stroke="#EF4444" marker-end="url(#arr-red)"/>

  <!-- Migration Protocol -->
  <g transform="translate(540, 260)">
    <rect width="280" height="105" rx="8" ry="8" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
    <text x="140" y="26" class="title" fill="#6EE7B7">Migration Protocol Runbook</text>
    <line x1="15" y1="36" x2="265" y2="36" stroke="#1F2937" stroke-width="1"/>
    <text x="15" y="56" class="body-txt">• Rename zip → zip_legacy_int</text>
    <text x="15" y="74" class="body-txt">• Add customer_zip STRING</text>
    <text x="15" y="92" class="body-txt">• Backfill CAST(zip_legacy AS STRING)</text>
  </g>
  <path fill="none" d="M 390 240 L 390 310 C 390 310, 450 310, 525 310 L 540 310" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>

  <!-- Target Delta Table -->
  <g transform="translate(865, 120)">
    <rect width="130" height="140" rx="10" ry="10" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
    <text x="65" y="32" class="title" fill="#A7F3D0">Target Delta</text>
    <line x1="15" y1="44" x2="115" y2="44" stroke="#047857" stroke-width="1.5"/>
    <text x="15" y="70" class="body-txt" fill="#A7F3D0">• Zero Crash</text>
    <text x="15" y="90" class="body-txt" fill="#A7F3D0">• Clean Mart</text>
    <text x="15" y="110" class="body-txt" fill="#A7F3D0">• Preserved</text>
    <text x="15" y="128" class="body-txt" fill="#A7F3D0">  Lineage</text>
  </g>

  <path fill="none" d="M 820 72 L 845 72 C 855 72, 855 160, 865 160" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>
  <path fill="none" d="M 820 310 L 845 310 C 855 310, 855 220, 865 220" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>
</svg>
