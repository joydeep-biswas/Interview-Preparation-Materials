<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 700; text-anchor: middle; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .edge { stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="1000" height="360" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Left: Problem (Red) -->
  <g transform="translate(30, 25)">
    <rect width="450" height="310" rx="10" ry="10" fill="#111827" stroke="#EF4444" stroke-width="2"/>
    <text x="225" y="28" class="title" fill="#FCA5A5">The ADLS Small File Bottleneck</text>
    <line x1="20" y1="38" x2="430" y2="38" stroke="#1F2937" stroke-width="1.5"/>

    <rect x="25" y="55" width="400" height="60" rx="6" ry="6" fill="#1F2937" stroke="#EF4444" stroke-width="1.5"/>
    <text x="225" y="80" class="title" font-size="11" fill="#FCA5A5">ADLS Gen2 Raw Folder</text>
    <text x="225" y="98" class="body-txt" text-anchor="middle">Millions of 500 KB JSON/Parquet Files</text>

    <path fill="none" d="M 225 115 L 225 145" class="edge" stroke="#EF4444" marker-end="url(#arr-red)"/>

    <rect x="25" y="145" width="400" height="65" rx="6" ry="6" fill="#7F1D1D" stroke="#EF4444" stroke-width="2"/>
    <text x="225" y="170" class="title" font-size="11" fill="#FECACA">Driver Globbing: ListBlobs API Calls</text>
    <text x="225" y="190" class="body-txt" text-anchor="middle" fill="#FCA5A5">HTTP 429 Throttling + Driver OOM Crash</text>

    <path fill="none" d="M 225 210 L 225 235" class="edge" stroke="#EF4444" marker-end="url(#arr-red)"/>

    <rect x="25" y="235" width="400" height="60" rx="6" ry="6" fill="#1F2937" stroke="#EF4444" stroke-width="1.5"/>
    <text x="225" y="260" class="title" font-size="11" fill="#FECACA">Millions of Micro-Tasks</text>
    <text x="225" y="278" class="body-txt" text-anchor="middle" fill="#FCA5A5">Spark Scheduler RPC Congestion &amp; Pipeline Stalls</text>
  </g>

  <!-- Right: Solution (Green) -->
  <g transform="translate(520, 25)">
    <rect width="450" height="310" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <text x="225" y="28" class="title" fill="#6EE7B7">Databricks Remediation Pipeline</text>
    <line x1="20" y1="38" x2="430" y2="38" stroke="#1F2937" stroke-width="1.5"/>

    <rect x="25" y="55" width="400" height="50" rx="6" ry="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="225" y="76" class="title" font-size="11" fill="#93C5FD">1. Ingest via Auto Loader (cloudFiles)</text>
    <text x="225" y="93" class="body-txt" text-anchor="middle">Event Grid + Queue notification mode (Zero File Listing!)</text>

    <path fill="none" d="M 225 105 L 225 120" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>

    <rect x="25" y="120" width="400" height="50" rx="6" ry="6" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <text x="225" y="141" class="title" font-size="11" fill="#6EE7B7">2. In-Place Conversion</text>
    <text x="225" y="158" class="body-txt" text-anchor="middle">CONVERT TO DELTA parquet.`abfss://...`</text>

    <path fill="none" d="M 225 170 L 225 185" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>

    <rect x="25" y="185" width="400" height="50" rx="6" ry="6" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
    <text x="225" y="206" class="title" font-size="11" fill="#A7F3D0">3. Scheduled Compaction (OPTIMIZE)</text>
    <text x="225" y="223" class="body-txt" text-anchor="middle" fill="#A7F3D0">Bin-packs into 1 GB Parquet files</text>

    <path fill="none" d="M 225 235 L 225 250" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>

    <rect x="25" y="250" width="400" height="50" rx="6" ry="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="225" y="271" class="title" font-size="11" fill="#FCD34D">4. Prevent Recurrence</text>
    <text x="225" y="288" class="body-txt" text-anchor="middle">autoCompact &amp; optimizeWrite = true</text>
  </g>
</svg>
