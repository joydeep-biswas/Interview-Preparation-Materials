<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 700; text-anchor: middle; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .edge { stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="1000" height="360" fill="#0B0F19"/>

  <!-- Left: Standard Join Skew (Red) -->
  <g transform="translate(30, 25)">
    <rect width="450" height="310" rx="10" ry="10" fill="#111827" stroke="#EF4444" stroke-width="2"/>
    <text x="225" y="28" class="title" fill="#FCA5A5">Standard Join: All Skewed Rows Hit Core 4</text>
    <line x1="20" y1="38" x2="430" y2="38" stroke="#1F2937" stroke-width="1.5"/>

    <rect x="25" y="55" width="200" height="50" rx="6" ry="6" fill="#1F2937" stroke="#EF4444" stroke-width="1.5"/>
    <text x="125" y="78" class="title" font-size="11" fill="#FCA5A5">Merchant M1 (10M Rows)</text>
    <text x="125" y="95" class="body-txt" text-anchor="middle">Hash(M1) % 4 = Part 3</text>

    <rect x="25" y="115" width="200" height="50" rx="6" ry="6" fill="#1F2937" stroke="#64748B" stroke-width="1"/>
    <text x="125" y="138" class="title" font-size="11" fill="#CBD5E1">Tail Merchants (1M Rows)</text>
    <text x="125" y="155" class="body-txt" text-anchor="middle">Split across Parts 0, 1, 2</text>

    <!-- Straggler Executor -->
    <rect x="250" y="55" width="180" height="110" rx="8" ry="8" fill="#7F1D1D" stroke="#EF4444" stroke-width="2"/>
    <text x="340" y="82" class="title" font-size="11" fill="#FECACA">⛔ Executor Core 4</text>
    <text x="340" y="102" class="body-txt" text-anchor="middle" fill="#FCA5A5">Processes 10M Rows</text>
    <text x="340" y="122" class="body-txt" text-anchor="middle" fill="#FCA5A5">Spills 120 GB to Disk</text>
    <text x="340" y="142" class="body-txt" text-anchor="middle" fill="#FECACA">45 Min Straggler / OOM</text>

    <!-- Idle Executors -->
    <rect x="135" y="195" width="200" height="45" rx="6" ry="6" fill="#1F2937" stroke="#64748B" stroke-width="1"/>
    <text x="235" y="222" class="body-txt" text-anchor="middle" fill="#CBD5E1">Executors 1-3: Idle after 2 minutes!</text>

    <path fill="none" d="M 225 80 L 250 80" class="edge" stroke="#EF4444" marker-end="url(#arr-red)"/>
    <path fill="none" d="M 225 140 L 250 140 C 270 140, 270 180, 235 195" class="edge" stroke="#64748B"/>

    <text x="225" y="280" class="body-txt" text-anchor="middle" fill="#FCA5A5">Single worker handles 91% of data; massive cloud waste</text>
  </g>

  <!-- Right: Salting Pipeline (Green) -->
  <g transform="translate(520, 25)">
    <rect width="450" height="310" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <text x="225" y="28" class="title" fill="#6EE7B7">Salting Solution: Uniform Spread Across K=4 Cores</text>
    <line x1="20" y1="38" x2="430" y2="38" stroke="#1F2937" stroke-width="1.5"/>

    <rect x="25" y="105" width="165" height="75" rx="8" ry="8" fill="#1F2937" stroke="#10B981" stroke-width="1.5"/>
    <text x="107.5" y="132" class="title" font-size="11" fill="#6EE7B7">Orders M1 + Salt</text>
    <text x="107.5" y="152" class="body-txt" text-anchor="middle">M1_0, M1_1, M1_2, M1_3</text>
    <text x="107.5" y="168" class="body-txt" text-anchor="middle">(2.5M rows per salt)</text>

    <!-- 4 Balanced Cores -->
    <rect x="245" y="55" width="180" height="42" rx="6" ry="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
    <text x="335" y="80" class="body-txt" text-anchor="middle" fill="#A7F3D0">Core 0: 2.5M (Done in 3 Min)</text>

    <rect x="245" y="105" width="180" height="42" rx="6" ry="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
    <text x="335" y="130" class="body-txt" text-anchor="middle" fill="#A7F3D0">Core 1: 2.5M (Done in 3 Min)</text>

    <rect x="245" y="155" width="180" height="42" rx="6" ry="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
    <text x="335" y="180" class="body-txt" text-anchor="middle" fill="#A7F3D0">Core 2: 2.5M (Done in 3 Min)</text>

    <rect x="245" y="205" width="180" height="42" rx="6" ry="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
    <text x="335" y="230" class="body-txt" text-anchor="middle" fill="#A7F3D0">Core 3: 2.5M (Done in 3 Min)</text>

    <!-- Connectors with straight runways -->
    <path fill="none" d="M 190 120 L 215 120 C 230 120, 230 76, 245 76" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>
    <path fill="none" d="M 190 135 L 245 126" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>
    <path fill="none" d="M 190 150 L 245 176" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>
    <path fill="none" d="M 190 165 L 215 165 C 230 165, 230 226, 245 226" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>

    <text x="225" y="280" class="body-txt" text-anchor="middle" fill="#6EE7B7">Total runtime slashed from 45 minutes down to 3 minutes!</text>
  </g>
</svg>
