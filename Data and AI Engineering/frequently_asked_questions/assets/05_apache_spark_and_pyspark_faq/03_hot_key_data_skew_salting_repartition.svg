<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 700; text-anchor: middle; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .edge { stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="1000" height="340" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Left: Before Salting (Red) -->
  <g transform="translate(30, 30)">
    <rect width="450" height="280" rx="10" ry="10" fill="#111827" stroke="#EF4444" stroke-width="2"/>
    <text x="225" y="30" class="title" fill="#FCA5A5">Before Salting: Hot Key Single Partition Collapse</text>
    <line x1="20" y1="42" x2="430" y2="42" stroke="#1F2937" stroke-width="1.5"/>

    <rect x="25" y="60" width="160" height="42" rx="6" ry="6" fill="#1F2937" stroke="#EF4444" stroke-width="1"/>
    <text x="105" y="86" class="body-txt" fill="#FCA5A5" text-anchor="middle">Row 1: Key = 'NULL'</text>

    <rect x="25" y="115" width="160" height="42" rx="6" ry="6" fill="#1F2937" stroke="#EF4444" stroke-width="1"/>
    <text x="105" y="141" class="body-txt" fill="#FCA5A5" text-anchor="middle">Row 2: Key = 'NULL'</text>

    <rect x="25" y="170" width="160" height="42" rx="6" ry="6" fill="#1F2937" stroke="#EF4444" stroke-width="1"/>
    <text x="105" y="196" class="body-txt" fill="#FCA5A5" text-anchor="middle">Row 3: Key = 'NULL'</text>

    <rect x="260" y="85" width="165" height="110" rx="8" ry="8" fill="#7F1D1D" stroke="#EF4444" stroke-width="2"/>
    <text x="342.5" y="115" class="title" font-size="12" fill="#FECACA">Partition 3</text>
    <text x="342.5" y="135" class="body-txt" text-anchor="middle" fill="#FCA5A5">All 10M Hot Keys</text>
    <text x="342.5" y="155" class="body-txt" text-anchor="middle" fill="#FCA5A5">Single Core Overload</text>
    <text x="342.5" y="175" class="body-txt" text-anchor="middle" fill="#FECACA">OOM / 2-Hr Straggler!</text>

    <!-- Connectors with straight runways -->
    <path fill="none" d="M 185 81 L 220 81 C 240 81, 240 120, 260 120" class="edge" stroke="#EF4444" marker-end="url(#arr-red)"/>
    <path fill="none" d="M 185 136 L 260 136" class="edge" stroke="#EF4444" marker-end="url(#arr-red)"/>
    <path fill="none" d="M 185 191 L 220 191 C 240 191, 240 150, 260 150" class="edge" stroke="#EF4444" marker-end="url(#arr-red)"/>

    <text x="225" y="245" class="body-txt" text-anchor="middle" fill="#FCA5A5">Hash(NULL) % 200 sends 100% of rows to 1 executor</text>
  </g>

  <!-- Right: After Salting (Green) -->
  <g transform="translate(520, 30)">
    <rect width="450" height="280" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <text x="225" y="30" class="title" fill="#6EE7B7">After Salting: Uniform K-Way Spread</text>
    <line x1="20" y1="42" x2="430" y2="42" stroke="#1F2937" stroke-width="1.5"/>

    <rect x="25" y="60" width="165" height="42" rx="6" ry="6" fill="#1F2937" stroke="#10B981" stroke-width="1"/>
    <text x="107.5" y="86" class="body-txt" fill="#6EE7B7" text-anchor="middle">Row 1: Key = 'NULL_0'</text>

    <rect x="25" y="115" width="165" height="42" rx="6" ry="6" fill="#1F2937" stroke="#10B981" stroke-width="1"/>
    <text x="107.5" y="141" class="body-txt" fill="#6EE7B7" text-anchor="middle">Row 2: Key = 'NULL_1'</text>

    <rect x="25" y="170" width="165" height="42" rx="6" ry="6" fill="#1F2937" stroke="#10B981" stroke-width="1"/>
    <text x="107.5" y="196" class="body-txt" fill="#6EE7B7" text-anchor="middle">Row 3: Key = 'NULL_2'</text>

    <!-- 3 Target Partitions -->
    <rect x="260" y="60" width="165" height="42" rx="6" ry="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
    <text x="342.5" y="86" class="body-txt" text-anchor="middle" fill="#A7F3D0">Partition 1 (3.3M Rows)</text>

    <rect x="260" y="115" width="165" height="42" rx="6" ry="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
    <text x="342.5" y="141" class="body-txt" text-anchor="middle" fill="#A7F3D0">Partition 2 (3.3M Rows)</text>

    <rect x="260" y="170" width="165" height="42" rx="6" ry="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
    <text x="342.5" y="196" class="body-txt" text-anchor="middle" fill="#A7F3D0">Partition 3 (3.3M Rows)</text>

    <!-- Straight 1:1 connections -->
    <path fill="none" d="M 190 81 L 260 81" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>
    <path fill="none" d="M 190 136 L 260 136" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>
    <path fill="none" d="M 190 191 L 260 191" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>

    <text x="225" y="245" class="body-txt" text-anchor="middle" fill="#6EE7B7">Key concatenated with rand(0, K-1) balances workload</text>
  </g>
</svg>
