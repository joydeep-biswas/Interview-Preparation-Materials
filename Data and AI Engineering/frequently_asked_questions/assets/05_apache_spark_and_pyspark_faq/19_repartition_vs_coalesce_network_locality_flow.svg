<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 700; text-anchor: middle; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .edge { stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="1000" height="340" fill="#0B0F19"/>

  <!-- Top: repartition -->
  <g transform="translate(30, 25)">
    <rect width="940" height="135" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <text x="470" y="28" class="title" fill="#93C5FD">repartition(N): Full Network Shuffle (All-to-All Hash Exchange)</text>
    <line x1="20" y1="38" x2="920" y2="38" stroke="#1F2937" stroke-width="1.5"/>

    <rect x="35" y="55" width="220" height="60" rx="6" ry="6" fill="#1F2937" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="145" y="80" class="title" font-size="11" fill="#93C5FD">4 Input Partitions</text>
    <text x="145" y="98" class="body-txt" text-anchor="middle">Data on Nodes 1 &amp; 2</text>

    <path fill="none" d="M 255 85 L 345 85" class="edge" stroke="#3B82F6" marker-end="url(#arr-blue)"/>

    <rect x="345" y="55" width="260" height="60" rx="6" ry="6" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="475" y="78" class="title" font-size="11" fill="#C4B5FD">ShuffleExchange Exec</text>
    <text x="475" y="98" class="body-txt" text-anchor="middle">All-to-all cross-network distribution</text>

    <path fill="none" d="M 605 85 L 695 85" class="edge" stroke="#8B5CF6" marker-end="url(#arr-blue)"/>

    <rect x="695" y="55" width="210" height="60" rx="6" ry="6" fill="#1F2937" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="800" y="80" class="title" font-size="11" fill="#93C5FD">8 Balanced Partitions</text>
    <text x="800" y="98" class="body-txt" text-anchor="middle">Can increase or decrease N</text>
  </g>

  <!-- Bottom: coalesce -->
  <g transform="translate(30, 180)">
    <rect width="940" height="135" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <text x="470" y="28" class="title" fill="#6EE7B7">coalesce(N): Zero Network Shuffle (Node Locality Merge)</text>
    <line x1="20" y1="38" x2="920" y2="38" stroke="#1F2937" stroke-width="1.5"/>

    <rect x="35" y="55" width="220" height="60" rx="6" ry="6" fill="#1F2937" stroke="#10B981" stroke-width="1.5"/>
    <text x="145" y="80" class="title" font-size="11" fill="#6EE7B7">Node 1: Part 1 + Part 2</text>
    <text x="145" y="98" class="body-txt" text-anchor="middle">Node 2: Part 3 + Part 4</text>

    <path fill="none" d="M 255 85 L 345 85" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>

    <rect x="345" y="55" width="260" height="60" rx="6" ry="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
    <text x="475" y="78" class="title" font-size="11" fill="#A7F3D0">In-Memory Local Concat</text>
    <text x="475" y="98" class="body-txt" text-anchor="middle" fill="#A7F3D0">Zero network bytes transferred!</text>

    <path fill="none" d="M 605 85 L 695 85" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>

    <rect x="695" y="55" width="210" height="60" rx="6" ry="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
    <text x="800" y="80" class="title" font-size="11" fill="#A7F3D0">2 Merged Partitions</text>
    <text x="800" y="98" class="body-txt" text-anchor="middle" fill="#A7F3D0">Only for decreasing partition count</text>
  </g>
</svg>
