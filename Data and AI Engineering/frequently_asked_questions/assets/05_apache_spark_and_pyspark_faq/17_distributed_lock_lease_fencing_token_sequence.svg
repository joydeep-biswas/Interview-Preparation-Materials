<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="100%" height="100%">
  <defs>
    <style>
      .actor-title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .seq-msg { fill: #E2E8F0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .note-title { fill: #FCD34D; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; }
      .note-desc { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .seq-line { stroke: #334155; stroke-dasharray: 4 4; stroke-width: 1.5; }
      .edge { stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
  </defs>

  <rect width="980" height="430" fill="#0B0F19"/>

  <!-- Actors -->
  <g transform="translate(40, 20)">
    <rect width="180" height="40" rx="8" ry="8" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="90" y="25" class="actor-title" fill="#FCD34D">🔒 Lock Service (TTL: 30s)</text>
    <line x1="90" y1="40" x2="90" y2="400" class="seq-line"/>
  </g>

  <g transform="translate(270, 20)">
    <rect width="180" height="40" rx="8" ry="8" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="90" y="25" class="actor-title" fill="#93C5FD">🐢 Worker A (Spark)</text>
    <line x1="90" y1="40" x2="90" y2="400" class="seq-line"/>
  </g>

  <g transform="translate(510, 20)">
    <rect width="180" height="40" rx="8" ry="8" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
    <text x="90" y="25" class="actor-title" fill="#6EE7B7">🚀 Worker B (Spark)</text>
    <line x1="90" y1="40" x2="90" y2="400" class="seq-line"/>
  </g>

  <g transform="translate(750, 20)">
    <rect width="190" height="40" rx="8" ry="8" fill="#111827" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="95" y="25" class="actor-title" fill="#C4B5FD">🗄️ Storage Engine (Token Check)</text>
    <line x1="95" y1="40" x2="95" y2="400" class="seq-line"/>
  </g>

  <!-- 1. Worker A acquires lock -->
  <path fill="none" d="M 360 85 L 135 85" class="edge" stroke="#3B82F6" marker-end="url(#arr-blue)"/>
  <text x="145" y="78" class="seq-msg">1. Acquire Lock -&gt; Granted (TTL: 30s, Token: 42)</text>

  <!-- GC Pause Note -->
  <rect x="260" y="105" width="200" height="45" rx="6" ry="6" fill="#7F1D1D" stroke="#EF4444" stroke-width="1.5"/>
  <text x="270" y="125" class="note-title" fill="#FECACA">💥 Full GC STW Pause!</text>
  <text x="270" y="141" class="note-desc" fill="#FCA5A5">Frozen for 40 Seconds...</text>

  <!-- Lease expires note -->
  <rect x="50" y="165" width="160" height="40" rx="6" ry="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
  <text x="60" y="185" class="note-title" fill="#FCD34D">⏳ 30s Elapses</text>
  <text x="60" y="198" class="note-desc">Lock Lease Expires!</text>

  <!-- Worker B acquires lock -->
  <path fill="none" d="M 600 220 L 135 220" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>
  <text x="145" y="213" class="seq-msg">2. Worker B Acquires Lock -&gt; Granted (Token: 43)</text>

  <!-- Worker B commits -->
  <path fill="none" d="M 600 255 L 840 255" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>
  <text x="610" y="247" class="seq-msg">3. Commit Data (Token: 43) -&gt; SUCCESS (Highest Token: 43)</text>

  <!-- Worker A wakes -->
  <rect x="260" y="280" width="200" height="35" rx="6" ry="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>
  <text x="270" y="302" class="note-title" fill="#93C5FD">⏰ Second 40: Awakes from GC</text>

  <!-- Worker A stale commit fails -->
  <path fill="none" d="M 360 335 L 840 335" class="edge" stroke="#EF4444" marker-end="url(#arr-red)"/>
  <text x="380" y="327" class="seq-msg" fill="#FCA5A5">4. Attempts Commit with Stale Token 42</text>

  <path fill="none" d="M 845 370 L 365 370" class="edge" stroke="#EF4444" stroke-dasharray="3 3" marker-end="url(#arr-red)"/>
  <text x="390" y="362" class="seq-msg" fill="#EF4444" font-weight="700">❌ REJECTED! (Token 42 &lt; Current Highest Token 43)</text>
</svg>
