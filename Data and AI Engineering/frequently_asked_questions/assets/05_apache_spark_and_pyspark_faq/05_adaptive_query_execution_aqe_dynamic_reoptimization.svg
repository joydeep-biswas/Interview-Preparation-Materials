<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 347" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 700; text-anchor: middle; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .edge { stroke-width: 2; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6" />
    </marker>
  </defs>

  <rect width="1020" height="340" fill="#0B0F19"  rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Left: Stage 1 -->
  <g transform="translate(30, 100)">
    <rect width="220" height="130" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2" />
    <text x="110" y="32" class="title" fill="#93C5FD">Stage 1 Finishes</text>
    <line x1="15" y1="44" x2="205" y2="44" stroke="#1F2937" stroke-width="1.5" />
    <text x="20" y="70" class="body-txt">• Materializes shuffle files</text>
    <text x="20" y="92" class="body-txt">• Exact partition bytes</text>
    <text x="20" y="112" class="body-txt">  registered to Driver</text>
  </g>

  <!-- Middle: AQE Framework -->
  <g transform="translate(295, 90)">
    <rect width="240" height="150" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2" />
    <text x="120" y="32" class="title" fill="#C4B5FD">AQE Runtime Evaluator</text>
    <line x1="15" y1="44" x2="225" y2="44" stroke="#1F2937" stroke-width="1.5" />
    <text x="20" y="70" class="body-txt">• spark.sql.adaptive.enabled</text>
    <text x="20" y="92" class="body-txt">• Re-optimizes physical plan</text>
    <text x="20" y="114" class="body-txt">• Uses actual data metrics</text>
    <text x="20" y="134" class="body-txt">  instead of stale CBO stats</text>
  </g>

  <!-- Connectors to 3 optimizations with straight runways -->
  <!-- Optimization 1: Coalesce -->
  <g transform="translate(630, 25)">
    <rect width="360" height="92" rx="8" ry="8" fill="#111827" stroke="#10B981" stroke-width="2" />
    <text x="180" y="26" class="title" fill="#6EE7B7">1. Dynamically Coalesce Shuffle Partitions</text>
    <line x1="15" y1="36" x2="345" y2="36" stroke="#1F2937" stroke-width="1" />
    <text x="20" y="56" class="body-txt">• Merges tiny post-shuffle partitions to target 64 MB - 128 MB</text>
    <text x="20" y="74" class="body-txt">• Eliminates millions of 100-byte small task scheduling overheads</text>
  </g>

  <!-- Optimization 2: Switch Join -->
  <g transform="translate(630, 125)">
    <rect width="360" height="92" rx="8" ry="8" fill="#111827" stroke="#06B6D4" stroke-width="2" />
    <text x="180" y="26" class="title" fill="#67E8F9">2. Dynamic Join Strategy Switch</text>
    <line x1="15" y1="36" x2="345" y2="36" stroke="#1F2937" stroke-width="1" />
    <text x="20" y="56" class="body-txt">• Converts Sort-Merge Join to Broadcast Join at runtime</text>
    <text x="20" y="74" class="body-txt">• Triggered if filtered dimension table &lt; autoBroadcast threshold</text>
  </g>

  <!-- Optimization 3: Skew Join -->
  <g transform="translate(630, 225)">
    <rect width="360" height="92" rx="8" ry="8" fill="#111827" stroke="#F59E0B" stroke-width="2" />
    <text x="180" y="26" class="title" fill="#FCD34D">3. Dynamic Skew Join Optimization</text>
    <line x1="15" y1="36" x2="345" y2="36" stroke="#1F2937" stroke-width="1" />
    <text x="20" y="56" class="body-txt">• Detects outlier partitions exceeding median size by 5x</text>
    <text x="20" y="74" class="body-txt">• Automatically splits skewed partition into parallel sub-tasks</text>
  </g>
<g id="connectors"><path fill="none" d="M 250 165 L 295 165" class="edge" stroke="#3B82F6" marker-end="url(#arr-blue)" />

  <path fill="none" d="M 535 125 L 565 125 C 585 125, 590 65, 610 65 L 630 65" class="edge" stroke="#8B5CF6" marker-end="url(#arr-purple)" />
  <path fill="none" d="M 535 165 L 630 165" class="edge" stroke="#8B5CF6" marker-end="url(#arr-purple)" />
  <path fill="none" d="M 535 205 L 565 205 C 585 205, 590 265, 610 265 L 630 265" class="edge" stroke="#8B5CF6" marker-end="url(#arr-purple)" />

  </g></svg>