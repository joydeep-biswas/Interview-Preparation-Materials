<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 380" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 700; text-anchor: middle; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .edge { stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="1020" height="380" fill="#0B0F19"/>

  <!-- Left: Issue Alert -->
  <g transform="translate(30, 130)">
    <rect width="210" height="100" rx="10" ry="10" fill="#1F2937" stroke="#EF4444" stroke-width="2"/>
    <text x="105" y="32" class="title" fill="#FCA5A5">Performance Alert</text>
    <line x1="15" y1="44" x2="195" y2="44" stroke="#374151" stroke-width="1"/>
    <text x="105" y="68" class="body-txt" text-anchor="middle">High Memory Usage</text>
    <text x="105" y="86" class="body-txt" text-anchor="middle" fill="#FCA5A5">Slow Job Processing</text>
  </g>

  <path fill="none" d="M 240 180 L 290 180" class="edge" stroke="#EF4444" marker-end="url(#arr-blue)"/>

  <!-- Step 1: Executors Tab -->
  <g transform="translate(290, 130)">
    <rect width="210" height="100" rx="8" ry="8" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <text x="105" y="30" class="title" fill="#93C5FD">1. Executors Tab</text>
    <line x1="15" y1="42" x2="195" y2="42" stroke="#1F2937" stroke-width="1.5"/>
    <text x="15" y="65" class="body-txt">• Task Time vs GC Time</text>
    <text x="15" y="85" class="body-txt">• Is GC Ratio &gt; 15%?</text>
  </g>

  <!-- Fix 1: GC Tuning (Up) -->
  <g transform="translate(290, 20)">
    <rect width="210" height="75" rx="8" ry="8" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
    <text x="105" y="26" class="title" fill="#6EE7B7">Fix: GC Tuning</text>
    <line x1="15" y1="36" x2="195" y2="36" stroke="#1F2937" stroke-width="1"/>
    <text x="15" y="55" class="body-txt">• Reduce cores to 4-5</text>
    <text x="15" y="68" class="body-txt">• Use G1GC with 32k regions</text>
  </g>
  <path fill="none" d="M 395 130 L 395 95" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>

  <!-- Step 1 to Step 2 -->
  <path fill="none" d="M 500 180 L 550 180" class="edge" stroke="#3B82F6" marker-end="url(#arr-amber)"/>

  <!-- Step 2: Stages Tab -->
  <g transform="translate(550, 130)">
    <rect width="210" height="100" rx="8" ry="8" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <text x="105" y="30" class="title" fill="#FCD34D">2. Stages Tab</text>
    <line x1="15" y1="42" x2="195" y2="42" stroke="#1F2937" stroke-width="1.5"/>
    <text x="15" y="65" class="body-txt">• Spill (Memory) &amp; Spill (Disk)</text>
    <text x="15" y="85" class="body-txt">• Task duration skew (99th %)</text>
  </g>

  <!-- Fix 2: Spill Tuning (Up) -->
  <g transform="translate(550, 20)">
    <rect width="210" height="75" rx="8" ry="8" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
    <text x="105" y="26" class="title" fill="#6EE7B7">Fix: Shuffle Spill</text>
    <line x1="15" y1="36" x2="195" y2="36" stroke="#1F2937" stroke-width="1"/>
    <text x="15" y="55" class="body-txt">• Bump shuffle.partitions</text>
    <text x="15" y="68" class="body-txt">• Bump spark.memory.fraction</text>
  </g>
  <path fill="none" d="M 655 130 L 655 95" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>

  <!-- Step 2 to Step 3 -->
  <path fill="none" d="M 760 180 L 800 180" class="edge" stroke="#F59E0B" marker-end="url(#arr-green)"/>

  <!-- Step 3: Off-Heap -->
  <g transform="translate(800, 130)">
    <rect width="190" height="100" rx="8" ry="8" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <text x="95" y="30" class="title" fill="#C4B5FD">3. Off-Heap / Native</text>
    <line x1="15" y1="42" x2="175" y2="42" stroke="#1F2937" stroke-width="1.5"/>
    <text x="15" y="65" class="body-txt">• Python workers / UDFs</text>
    <text x="15" y="85" class="body-txt">• Netty shuffle buffers</text>
  </g>

  <!-- Fix 3: Overhead (Down) -->
  <g transform="translate(800, 260)">
    <rect width="190" height="90" rx="8" ry="8" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
    <text x="95" y="26" class="title" fill="#6EE7B7">Fix: Overhead Sizing</text>
    <line x1="15" y1="36" x2="175" y2="36" stroke="#1F2937" stroke-width="1"/>
    <text x="15" y="55" class="body-txt">• memoryOverhead: 25%</text>
    <text x="15" y="72" class="body-txt">• Prevents K8s Exit 137</text>
  </g>
  <path fill="none" d="M 895 230 L 895 260" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>
</svg>
