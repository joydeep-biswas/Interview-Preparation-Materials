<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 380" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 700; text-anchor: middle; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .edge { stroke-width: 2; fill: none; }
    </style>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
  </defs>

  <rect width="1020" height="380" fill="#0B0F19"/>

  <!-- Pod Container Box -->
  <g transform="translate(30, 25)">
    <rect width="660" height="330" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <text x="330" y="28" class="title" fill="#93C5FD">Kubernetes Executor Pod (cgroup Limit = 10 GB)</text>
    <line x1="20" y1="40" x2="640" y2="40" stroke="#1F2937" stroke-width="1.5"/>

    <!-- Left Box: JVM Heap (Healthy) -->
    <rect x="25" y="60" width="280" height="200" rx="8" ry="8" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
    <text x="165" y="85" class="title" font-size="12" fill="#A7F3D0">JVM Heap: 6 GB</text>
    <line x1="40" y1="95" x2="290" y2="95" stroke="#047857" stroke-width="1"/>
    <text x="40" y="125" class="body-txt" fill="#A7F3D0">• Configured: 7 GB</text>
    <text x="40" y="145" class="body-txt" fill="#A7F3D0">• Active Heap: 4.2 GB (60% Used)</text>
    <text x="40" y="165" class="body-txt" fill="#A7F3D0">• Zero Heap OOM warnings</text>
    <text x="40" y="195" class="title" font-size="11" fill="#6EE7B7">Spark UI Status: HEALTHY ✅</text>

    <!-- Right Box: Off-Heap (Violated) -->
    <rect x="335" y="60" width="300" height="200" rx="8" ry="8" fill="#7F1D1D" stroke="#EF4444" stroke-width="2"/>
    <text x="485" y="85" class="title" font-size="12" fill="#FECACA">Off-Heap Memory Overrun</text>
    <line x1="350" y1="95" x2="620" y2="95" stroke="#991B1B" stroke-width="1"/>
    <text x="350" y="120" class="body-txt" fill="#FECACA">• Configured Overhead: 1 GB</text>
    <text x="350" y="140" class="body-txt" fill="#FCA5A5">• Python Worker (PySpark): 2.5 GB!</text>
    <text x="350" y="160" class="body-txt" fill="#FCA5A5">• Netty Shuffle Buffers: 1.2 GB</text>
    <text x="350" y="180" class="body-txt" fill="#FCA5A5">• Metaspace &amp; Stacks: 0.8 GB</text>
    <text x="350" y="205" class="title" font-size="11" fill="#FECACA">Total Off-Heap: 4.5 GB (EXCEEDED!)</text>

    <!-- Actual Footprint Summary -->
    <rect x="25" y="275" width="610" height="40" rx="6" ry="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="330" y="300" class="body-txt" text-anchor="middle" fill="#F1F5F9">Actual Physical RSS Footprint: 4.2 GB (Heap) + 4.5 GB (Off-Heap) = 8.7 GB -&gt; Spikes to 10.2 GB!</text>
  </g>

  <path fill="none" d="M 690 190 L 730 190" class="edge" stroke="#EF4444" marker-end="url(#arr-red)"/>

  <!-- Right: OOM Killer -->
  <g transform="translate(730, 95)">
    <rect width="260" height="190" rx="10" ry="10" fill="#1F2937" stroke="#EF4444" stroke-width="2"/>
    <text x="130" y="32" class="title" fill="#FCA5A5">Linux Kernel OOM Killer</text>
    <line x1="15" y1="44" x2="245" y2="44" stroke="#374151" stroke-width="1.5"/>
    <text x="20" y="70" class="body-txt">• Container exceeds cgroup limit</text>
    <text x="20" y="92" class="body-txt">• Kernel sends SIGKILL (Signal 9)</text>
    <text x="20" y="114" class="body-txt">• Pod terminated immediately</text>
    <text x="20" y="136" class="body-txt" fill="#FCA5A5">• Exit Code 137 (128 + 9)</text>
    <text x="20" y="162" class="body-txt" fill="#6EE7B7">Fix: Increase memoryOverhead</text>
  </g>
</svg>
