<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; text-anchor: middle; }
      .bar-lbl { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .axis-txt { fill: #64748B; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; }
    </style>
  </defs>

  <rect width="1000" height="320" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <g transform="translate(40, 25)">
    <text x="460" y="25" class="title" fill="#93C5FD">Spark Stage Execution with 40% Skew Straggler Task</text>
    <line x1="20" y1="40" x2="900" y2="40" stroke="#1F2937" stroke-width="1.5"/>

    <!-- Track 1: Normal Tasks (1 to 199) -->
    <text x="20" y="80" class="title" font-size="12" fill="#E2E8F0" text-anchor="start">Tasks 1 to 199 (199 Cores - 3 GB each):</text>
    
    <!-- Active 0 to 120s (approx 80px) -->
    <rect x="20" y="95" width="80" height="40" rx="4" ry="4" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
    <text x="60" y="119" class="bar-lbl" text-anchor="middle" fill="#A7F3D0">120s Done</text>

    <!-- Cluster Waiting 120s to 7200s (80px to 840px = 760px wide) -->
    <rect x="105" y="95" width="755" height="40" rx="4" ry="4" fill="#7F1D1D" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="480" y="119" class="bar-lbl" text-anchor="middle" fill="#FECACA">⛔ 199 Cores Idling &amp; Waiting for Straggler (1 Hour 58 Minutes Wasted!)</text>

    <!-- Track 2: Skewed Task 200 -->
    <text x="20" y="175" class="title" font-size="12" fill="#E2E8F0" text-anchor="start">Skewed Task 200 (1 Core - 400 GB Data + Disk Spills):</text>

    <!-- Task 200 active whole time (840px) -->
    <rect x="20" y="190" width="840" height="45" rx="4" ry="4" fill="#1F2937" stroke="#F59E0B" stroke-width="2"/>
    <text x="440" y="217" class="bar-lbl" text-anchor="middle" fill="#FCD34D">⚠️ Active Processing &amp; Thrashing Disk Spills: 0s to 7,200s (2 Hours)</text>

    <!-- Timeline Axis -->
    <line x1="20" y1="260" x2="860" y2="260" stroke="#334155" stroke-width="1.5"/>
    <line x1="20" y1="255" x2="20" y2="265" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="280" class="axis-txt" text-anchor="middle">0 sec</text>

    <line x1="100" y1="255" x2="100" y2="265" stroke="#334155" stroke-width="1.5"/>
    <text x="100" y="280" class="axis-txt" text-anchor="middle">120 sec (2 min)</text>

    <line x1="480" y1="255" x2="480" y2="265" stroke="#334155" stroke-width="1.5"/>
    <text x="480" y="280" class="axis-txt" text-anchor="middle">3,600 sec (1 hour)</text>

    <line x1="860" y1="255" x2="860" y2="265" stroke="#334155" stroke-width="1.5"/>
    <text x="860" y="280" class="axis-txt" text-anchor="middle">7,200 sec (2 hours)</text>
  </g>
</svg>
