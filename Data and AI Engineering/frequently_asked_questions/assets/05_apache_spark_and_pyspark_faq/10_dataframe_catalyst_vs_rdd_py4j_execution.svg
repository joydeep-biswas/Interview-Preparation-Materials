<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 700; text-anchor: middle; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .code-txt { fill: #FCD34D; font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; }
      .edge { stroke-width: 2; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
  </defs>

  <rect width="1000" height="340" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Top Pipeline: PySpark DataFrame (Green/Optimal) -->
  <g transform="translate(30, 25)">
    <rect width="940" height="135" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <text x="470" y="28" class="title" fill="#6EE7B7">PySpark DataFrame: Catalyst Optimizer &amp; Tungsten Engine (Ultra-Fast)</text>
    <line x1="20" y1="38" x2="920" y2="38" stroke="#1F2937" stroke-width="1.5"/>

    <rect x="25" y="55" width="260" height="60" rx="6" ry="6" fill="#1F2937" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="155" y="80" class="title" font-size="11" fill="#93C5FD">PySpark DataFrame</text>
    <text x="155" y="100" class="code-txt" text-anchor="middle">df.filter(col('age') &gt; 25)</text>

    <path fill="none" d="M 285 85 L 340 85" class="edge" stroke="#3B82F6" marker-end="url(#arr-blue)"/>

    <rect x="340" y="55" width="270" height="60" rx="6" ry="6" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5"/>
    <text x="475" y="78" class="title" font-size="11" fill="#67E8F9">Catalyst Optimizer</text>
    <text x="475" y="98" class="body-txt" text-anchor="middle">Predicate Pushdown &amp; Projection Pruning</text>

    <path fill="none" d="M 610 85 L 665 85" class="edge" stroke="#06B6D4" marker-end="url(#arr-green)"/>

    <rect x="665" y="55" width="250" height="60" rx="6" ry="6" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
    <text x="790" y="78" class="title" font-size="11" fill="#A7F3D0">Tungsten Binary Engine</text>
    <text x="790" y="98" class="body-txt" text-anchor="middle" fill="#A7F3D0">Off-heap unsafe vectors &amp; CodeGen</text>
  </g>

  <!-- Bottom Pipeline: PySpark RDD (Red/Anti-pattern) -->
  <g transform="translate(30, 180)">
    <rect width="940" height="135" rx="10" ry="10" fill="#111827" stroke="#EF4444" stroke-width="2"/>
    <text x="470" y="28" class="title" fill="#FCA5A5">PySpark RDD with Python Lambda: JVM / Python Interop Overhead (10x-100x Slower)</text>
    <line x1="20" y1="38" x2="920" y2="38" stroke="#1F2937" stroke-width="1.5"/>

    <rect x="25" y="55" width="380" height="60" rx="6" ry="6" fill="#1F2937" stroke="#EF4444" stroke-width="1.5"/>
    <text x="215" y="78" class="title" font-size="11" fill="#FCA5A5">PySpark RDD (Python Lambda)</text>
    <text x="215" y="98" class="code-txt" text-anchor="middle">rdd.filter(lambda x: x['age'] &gt; 25)</text>

    <path fill="none" d="M 405 85 L 485 85" class="edge" stroke="#EF4444" marker-end="url(#arr-red)"/>

    <rect x="485" y="55" width="430" height="60" rx="6" ry="6" fill="#7F1D1D" stroke="#EF4444" stroke-width="2"/>
    <text x="700" y="78" class="title" font-size="11" fill="#FECACA">Py4J IPC Subprocess Serialization</text>
    <text x="700" y="98" class="body-txt" text-anchor="middle" fill="#FCA5A5">Pickles every single row across JVM &lt;-&gt; Python socket</text>
  </g>
</svg>
