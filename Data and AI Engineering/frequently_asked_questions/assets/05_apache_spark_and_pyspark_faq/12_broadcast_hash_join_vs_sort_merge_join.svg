<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 368" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 700; text-anchor: middle; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .edge { stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981" />
    </marker>
  </defs>

  <rect width="1000" height="360" fill="#0B0F19"  rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Left: Sort-Merge Join (Red) -->
  <g transform="translate(30, 25)">
    <rect width="450" height="310" rx="10" ry="10" fill="#111827" stroke="#EF4444" stroke-width="2" />
    <text x="225" y="28" class="title" fill="#FCA5A5">Sort-Merge Join (Without Broadcast - High Latency)</text>
    <line x1="20" y1="38" x2="430" y2="38" stroke="#1F2937" stroke-width="1.5" />

    <rect x="25" y="55" width="160" height="59" rx="6" ry="6" fill="#1F2937" stroke="#EF4444" stroke-width="1.5" />
    <text x="105" y="80" class="title" font-size="11" fill="#FCA5A5">2 TB Fact Table</text>
    <text x="105" y="96" class="body-txt" text-anchor="middle">Large Volume</text>

    <rect x="25" y="125" width="160" height="59" rx="6" ry="6" fill="#1F2937" stroke="#EF4444" stroke-width="1.5" />
    <text x="105" y="150" class="title" font-size="11" fill="#FCA5A5">200 MB Dimension</text>
    <text x="105" y="166" class="body-txt" text-anchor="middle">Small Table</text>

    <!-- Shuffle Box -->
    <rect x="245" y="65" width="180" height="95" rx="8" ry="8" fill="#7F1D1D" stroke="#EF4444" stroke-width="2" />
    <text x="335" y="95" class="title" font-size="11" fill="#FECACA">Network Shuffle</text>
    <text x="335" y="115" class="body-txt" text-anchor="middle" fill="#FCA5A5">Shuffles 2.2 TB Data!</text>
    <text x="335" y="135" class="body-txt" text-anchor="middle" fill="#FCA5A5">Massive Disk Spilling</text>

    <!-- Merge Node -->
    <rect x="135" y="200" width="200" height="103" rx="8" ry="8" fill="#1F2937" stroke="#EF4444" stroke-width="1.5" />
    <text x="235" y="225" class="title" font-size="11" fill="#FECACA">Executors Sort &amp; Merge</text>
    <text x="235" y="242" class="body-txt" text-anchor="middle">CPU Intensive Key Sorting</text>

    <path fill="none" d="M 185 80 L 245 95" class="edge" stroke="#EF4444" marker-end="url(#arr-red)" />
    <path fill="none" d="M 185 150 L 245 135" class="edge" stroke="#EF4444" marker-end="url(#arr-red)" />
    <path fill="none" d="M 335 160 L 335 180 C 335 195, 275 195, 275 200" class="edge" stroke="#EF4444" marker-end="url(#arr-red)" />

    <text x="225" y="285" class="body-txt" text-anchor="middle" fill="#FCA5A5">Shuffles the entire 2 TB fact table across the network!</text>
  </g>

  <!-- Right: Broadcast Hash Join (Green) -->
  <g transform="translate(520, 25)">
    <rect width="450" height="310" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2" />
    <text x="225" y="28" class="title" fill="#6EE7B7">Broadcast Hash Join (Optimal: ZERO Fact Shuffle)</text>
    <line x1="20" y1="38" x2="430" y2="38" stroke="#1F2937" stroke-width="1.5" />

    <rect x="25" y="55" width="180" height="58" rx="6" ry="6" fill="#1F2937" stroke="#3B82F6" stroke-width="1.5" />
    <text x="115" y="78" class="title" font-size="11" fill="#93C5FD">200 MB Dimension</text>
    <text x="115" y="95" class="body-txt" text-anchor="middle">Broadcasted by Driver</text>

    <path fill="none" d="M 205 80 L 255 80" class="edge" stroke="#3B82F6" marker-end="url(#arr-green)" />

    <rect x="255" y="55" width="170" height="58" rx="6" ry="6" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
    <text x="340" y="78" class="title" font-size="11" fill="#6EE7B7">In-Memory Hash</text>
    <text x="340" y="95" class="body-txt" text-anchor="middle">Replicated on each Worker</text>

    <rect x="25" y="140" width="180" height="58" rx="6" ry="6" fill="#1F2937" stroke="#10B981" stroke-width="1.5" />
    <text x="115" y="163" class="title" font-size="11" fill="#6EE7B7">2 TB Fact Table</text>
    <text x="115" y="180" class="body-txt" text-anchor="middle">Local Stream (No Shuffle!)</text>

    <!-- Fast Join Output -->
    <rect x="135" y="215" width="220" height="98" rx="8" ry="8" fill="#064E3B" stroke="#10B981" stroke-width="2" />
    <text x="245" y="240" class="title" font-size="11" fill="#A7F3D0">Local Map-Side Hash Join</text>
    <text x="245" y="258" class="body-txt" text-anchor="middle" fill="#A7F3D0">O(1) In-Memory Lookup Speed!</text>

    <path fill="none" d="M 340 105 L 340 160 C 340 190, 290 190, 275 215" class="edge" stroke="#10B981" marker-end="url(#arr-green)" />
    <path fill="none" d="M 115 190 L 115 235 C 115 240, 125 240, 135 240" class="edge" stroke="#10B981" marker-end="url(#arr-green)" />

    <text x="225" y="295" class="body-txt" text-anchor="middle" fill="#6EE7B7">Fact table stays strictly on local nodes; 10x-50x faster!</text>
  </g>
</svg>