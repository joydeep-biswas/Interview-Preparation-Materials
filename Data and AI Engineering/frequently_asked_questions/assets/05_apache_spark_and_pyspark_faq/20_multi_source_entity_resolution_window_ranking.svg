<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 280" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .code-txt { fill: #FCD34D; font-family: "SFMono-Regular", Consolas, monospace; font-size: 10px; }
      .edge { stroke-width: 2; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981" />
    </marker>
  </defs>

  <rect width="1020" height="280" fill="#0B0F19"  rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Col 1: Upstream Sources -->
  <g transform="translate(30, 40)">
    <rect width="210" height="190" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2" />
    <text x="105" y="30" class="title" fill="#93C5FD">Disparate Upstream Feeds</text>
    <line x1="15" y1="42" x2="195" y2="42" stroke="#1F2937" stroke-width="1.5" />

    <rect x="15" y="55" width="180" height="52" rx="6" ry="6" fill="#1E293B"  stroke="#334155" stroke-width="1"/>
    <text x="25" y="75" class="title" font-size="11" fill="#F9FAFB" text-anchor="start">ERP Record</text>
    <text x="25" y="95" class="body-txt">ID 101 | NY | Priority 1</text>

    <rect x="15" y="120" width="180" height="55" rx="6" ry="6" fill="#1E293B"  stroke="#334155" stroke-width="1"/>
    <text x="25" y="140" class="title" font-size="11" fill="#F9FAFB" text-anchor="start">CRM Record</text>
    <text x="25" y="160" class="body-txt">ID 101 | Boston | Priority 2</text>
  </g>

  <!-- Col 2: Union Staging -->
  <g transform="translate(285, 60)">
    <rect width="210" height="150" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2" />
    <text x="105" y="32" class="title" fill="#FCD34D">Union Staging</text>
    <line x1="15" y1="44" x2="195" y2="44" stroke="#1F2937" stroke-width="1.5" />
    <text x="15" y="70" class="code-txt">unionByName(</text>
    <text x="15" y="90" class="code-txt">  allowMissing=True)</text>
    <text x="15" y="115" class="body-txt">• Merges schema variants</text>
    <text x="15" y="132" class="body-txt">• Standardizes columns</text>
  </g>

  <!-- Col 3: Window Ranking -->
  <g transform="translate(540, 45)">
    <rect width="230" height="180" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2" />
    <text x="115" y="30" class="title" fill="#6EE7B7">Window Ranking</text>
    <line x1="15" y1="42" x2="215" y2="42" stroke="#1F2937" stroke-width="1.5" />
    <text x="15" y="65" class="code-txt">ROW_NUMBER().over(</text>
    <text x="15" y="83" class="code-txt">  W.partitionBy('cust_id')</text>
    <text x="15" y="101" class="code-txt">   .orderBy(</text>
    <text x="15" y="119" class="code-txt">     'priority'.asc(),</text>
    <text x="15" y="137" class="code-txt">     'updated_at'.desc()))</text>
  </g>

  <!-- Col 4: Golden Record -->
  <g transform="translate(815, 60)">
    <rect width="175" height="150" rx="10" ry="10" fill="#064E3B" stroke="#10B981" stroke-width="2" />
    <text x="87.5" y="32" class="title" fill="#A7F3D0">Golden Master</text>
    <line x1="15" y1="44" x2="160" y2="44" stroke="#047857" stroke-width="1.5" />
    <text x="15" y="70" class="title" font-size="11" fill="#A7F3D0" text-anchor="start">Winner: ERP 101</text>
    <text x="15" y="92" class="body-txt" fill="#A7F3D0">• Priority 1 wins</text>
    <text x="15" y="110" class="body-txt" fill="#A7F3D0">• Supersedes CRM</text>
    <text x="15" y="130" class="body-txt" fill="#A7F3D0">• Filter rank == 1</text>
  </g>
<g id="connectors"><path fill="none" d="M 240 135 L 285 135" class="edge" stroke="#3B82F6" marker-end="url(#arr-blue)" />

  <path fill="none" d="M 495 135 L 540 135" class="edge" stroke="#F59E0B" marker-end="url(#arr-amber)" />

  <path fill="none" d="M 770 135 L 815 135" class="edge" stroke="#10B981" marker-end="url(#arr-green)" />

  </g></svg>