<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 230" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .edge { stroke-width: 2; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981" />
    </marker>
  </defs>

  <rect width="1020" height="230" fill="#0B0F19"  rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Step 1 -->
  <g transform="translate(25, 40)">
    <rect width="175" height="150" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2" />
    <text x="87.5" y="32" class="title" fill="#93C5FD">1. Dimension Table</text>
    <line x1="15" y1="44" x2="160" y2="44" stroke="#1F2937" stroke-width="1.5" />
    <text x="18" y="70" class="body-txt">• Small lookup table</text>
    <text x="18" y="92" class="body-txt">• &lt; 10 MB (or hint)</text>
    <text x="18" y="114" class="body-txt">• Filtered dimension</text>
    <text x="18" y="136" class="body-txt">• Scanned in parallel</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(230, 40)">
    <rect width="180" height="150" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2" />
    <text x="90" y="32" class="title" fill="#C4B5FD">2. Driver Collect</text>
    <line x1="15" y1="44" x2="165" y2="44" stroke="#1F2937" stroke-width="1.5" />
    <text x="18" y="70" class="body-txt">• Driver pulls rows</text>
    <text x="18" y="92" class="body-txt">• Serializes to byte array</text>
    <text x="18" y="114" class="body-txt">• Checks heap space</text>
    <text x="18" y="136" class="body-txt">• Must fit in driver RAM</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(440, 40)">
    <rect width="180" height="150" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2" />
    <text x="90" y="32" class="title" fill="#6EE7B7">3. Torrent Protocol</text>
    <line x1="15" y1="44" x2="165" y2="44" stroke="#1F2937" stroke-width="1.5" />
    <text x="18" y="70" class="body-txt">• Peer-to-peer torrent</text>
    <text x="18" y="92" class="body-txt">• Avoids driver network bottleneck</text>
    <text x="18" y="114" class="body-txt">• Executors share chunks</text>
    <text x="18" y="136" class="body-txt">• High-speed broadcast</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(650, 40)">
    <rect width="175" height="150" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2" />
    <text x="87.5" y="32" class="title" fill="#6EE7B7">4. In-Memory Hash</text>
    <line x1="15" y1="44" x2="160" y2="44" stroke="#1F2937" stroke-width="1.5" />
    <text x="18" y="70" class="body-txt">• Worker builds hash map</text>
    <text x="18" y="92" class="body-txt">• In Execution Memory</text>
    <text x="18" y="114" class="body-txt">• Keyed by join column</text>
    <text x="18" y="136" class="body-txt">• Stored in RAM</text>
  </g>

  <!-- Step 5 -->
  <g transform="translate(855, 40)">
    <rect width="140" height="150" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2" />
    <text x="70" y="32" class="title" fill="#6EE7B7">5. Local Probe</text>
    <line x1="15" y1="44" x2="125" y2="44" stroke="#1F2937" stroke-width="1.5" />
    <text x="15" y="70" class="body-txt">• Stream fact</text>
    <text x="15" y="92" class="body-txt">• O(1) probe</text>
    <text x="15" y="114" class="body-txt">• Zero shuffle</text>
    <text x="15" y="136" class="body-txt">• Blazing fast</text>
  </g>
<g id="connectors"><path fill="none" d="M 200 115 L 230 115" class="edge" stroke="#3B82F6" marker-end="url(#arr-blue)" />

  <path fill="none" d="M 410 115 L 440 115" class="edge" stroke="#8B5CF6" marker-end="url(#arr-purple)" />

  <path fill="none" d="M 620 115 L 650 115" class="edge" stroke="#10B981" marker-end="url(#arr-green)" />

  <path fill="none" d="M 825 115 L 855 115" class="edge" stroke="#10B981" marker-end="url(#arr-green)" />

  </g></svg>