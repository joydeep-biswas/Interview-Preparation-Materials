<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 480" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; text-anchor: start; }
      .edge-label { fill: #E2E8F0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; text-anchor: middle; }
      .container-title { fill: #CBD5E1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; text-anchor: start; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Top Container: Cache / Persist -->
  <g transform="translate(25, 20)">
    <rect width="970" height="205" rx="8" fill="#0D1526" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="20" y="24" class="container-title" fill="#C4B5FD">Pattern A: df.cache() / df.persist() — Ephemeral Storage with Full Lineage Preservation</text>

    <!-- Source -->
    <g transform="translate(20, 45)">
      <rect width="150" height="65" rx="6" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
      <text x="75" y="22" class="title" fill="#93C5FD">Raw Source</text>
      <text x="10" y="44" class="body-txt">Delta / Parquet Files</text>
    </g>

    <!-- Stage 1 -->
    <g transform="translate(210, 45)">
      <rect width="150" height="65" rx="6" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
      <text x="75" y="22" class="title" fill="#F8FAFC">Stage 1: Transform</text>
      <text x="10" y="44" class="body-txt">Filter, Project, Map</text>
    </g>

    <!-- Stage 2 -->
    <g transform="translate(400, 45)">
      <rect width="150" height="65" rx="6" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
      <text x="75" y="22" class="title" fill="#F8FAFC">Stage 2: Shuffle</text>
      <text x="10" y="44" class="body-txt">Exchange &amp; Hash Join</text>
    </g>

    <!-- Cached In RAM -->
    <g transform="translate(590, 40)">
      <rect width="180" height="75" rx="6" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="2"/>
      <text x="90" y="22" class="title" fill="#C4B5FD">RAM Partition Cache</text>
      <text x="10" y="44" class="body-txt">• Fast in-memory reuse</text>
      <text x="10" y="62" class="body-txt">• Lineage DAG RETAINED</text>
    </g>

    <!-- Recompute Warning -->
    <g transform="translate(590, 125)">
      <rect width="360" height="65" rx="6" fill="#7F1D1D" stroke="#EF4444" stroke-width="1.5"/>
      <text x="180" y="22" class="title" fill="#FECACA">Node Failure / LRU Eviction Penalty</text>
      <text x="12" y="44" class="body-txt">Lineage triggers full recomputation from Raw Source across all stages!</text>
    </g>

    <!-- Connectors -->
    <path d="M 170 77 L 210 77" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <path d="M 360 77 L 400 77" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <path d="M 550 77 L 590 77" fill="none" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arr-purple)"/>

    <!-- Recompute feedback loop -->
    <path d="M 680 115 L 680 125" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arr-red)"/>
    <path d="M 590 157 L 285 157 Q 285 157 285 110" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr-red)"/>
  </g>

  <!-- Bottom Container: Checkpoint -->
  <g transform="translate(25, 245)">
    <rect width="970" height="215" rx="8" fill="#0D1526" stroke="#10B981" stroke-width="1.5"/>
    <text x="20" y="24" class="container-title" fill="#A7F3D0">Pattern B: df.checkpoint() — Reliable Disk Persistence with Complete Lineage Truncation</text>

    <!-- Source -->
    <g transform="translate(20, 50)">
      <rect width="150" height="65" rx="6" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
      <text x="75" y="22" class="title" fill="#93C5FD">Raw Source</text>
      <text x="10" y="44" class="body-txt">Iterative ML / Graph</text>
    </g>

    <!-- 100 Iterations -->
    <g transform="translate(210, 45)">
      <rect width="180" height="75" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="90" y="22" class="title" fill="#FDE68A">Stages 1..100 Iterations</text>
      <text x="10" y="44" class="body-txt">• Thousands of Catalyst ops</text>
      <text x="10" y="62" class="body-txt">• Risk: StackOverflowError</text>
    </g>

    <!-- df.checkpoint() -->
    <g transform="translate(430, 45)">
      <rect width="160" height="75" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
      <text x="80" y="22" class="title" fill="#FDE68A">df.checkpoint()</text>
      <text x="10" y="44" class="body-txt">• Action triggered</text>
      <text x="10" y="62" class="body-txt">• Writes to reliable sink</text>
    </g>

    <!-- ADLS / HDFS Storage -->
    <g transform="translate(630, 45)">
      <rect width="180" height="75" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
      <text x="90" y="22" class="title" fill="#A7F3D0">ADLS / S3 Storage</text>
      <text x="10" y="44" class="body-txt">• /checkpoints/iter_50/</text>
      <text x="10" y="62" class="body-txt">• Parquet immutable files</text>
    </g>

    <!-- Lineage Cut Result -->
    <g transform="translate(850, 40)">
      <rect width="105" height="150" rx="6" fill="#022C22" stroke="#34D399" stroke-width="2"/>
      <text x="52" y="22" class="title" fill="#34D399">Lineage CUT</text>
      <text x="10" y="44" class="body-txt">DAG = None</text>
      <text x="10" y="68" class="body-txt">Driver heap</text>
      <text x="10" y="88" class="body-txt">reclaimed!</text>
      <text x="10" y="112" class="body-txt">Safe ML</text>
      <text x="10" y="132" class="body-txt">iterations</text>
    </g>

    <!-- Connectors -->
    <path d="M 170 82 L 210 82" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <path d="M 390 82 L 430 82" fill="none" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arr-amber)"/>
    <path d="M 590 82 L 630 82" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arr-green)"/>
    <path d="M 810 82 L 850 82" fill="none" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-green)"/>

    <text x="20" y="170" class="body-txt" fill="#94A3B8">Checkpointing decouples the execution DAG: Subsequent operations read from checkpoint Parquet without ever looking back at prior 100 stages.</text>
  </g>
</svg>
