<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 700; text-anchor: middle; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .edge { stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="1000" height="340" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Top: groupByKey (Red) -->
  <g transform="translate(30, 25)">
    <rect width="940" height="130" rx="10" ry="10" fill="#111827" stroke="#EF4444" stroke-width="2"/>
    <text x="470" y="28" class="title" fill="#FCA5A5">groupByKey: Massive Raw Network Transfer (Anti-Pattern / OOM Risk)</text>
    <line x1="20" y1="38" x2="920" y2="38" stroke="#1F2937" stroke-width="1.5"/>

    <rect x="35" y="55" width="250" height="55" rx="6" ry="6" fill="#1F2937" stroke="#EF4444" stroke-width="1.5"/>
    <text x="160" y="78" class="title" font-size="11" fill="#F9FAFB">Mapper Partitions</text>
    <text x="160" y="96" class="body-txt" text-anchor="middle">('a', 1), ('a', 1), ('a', 1)</text>

    <path fill="none" d="M 285 82.5 L 345 82.5" class="edge" stroke="#EF4444" marker-end="url(#arr-red)"/>

    <rect x="345" y="55" width="280" height="55" rx="6" ry="6" fill="#7F1D1D" stroke="#EF4444" stroke-width="2"/>
    <text x="485" y="78" class="title" font-size="11" fill="#FECACA">Shuffle 100% of Records</text>
    <text x="485" y="96" class="body-txt" text-anchor="middle" fill="#FCA5A5">High Network Load &amp; Disk Spills</text>

    <path fill="none" d="M 625 82.5 L 685 82.5" class="edge" stroke="#EF4444" marker-end="url(#arr-red)"/>

    <rect x="685" y="55" width="220" height="55" rx="6" ry="6" fill="#1F2937" stroke="#EF4444" stroke-width="1.5"/>
    <text x="795" y="78" class="title" font-size="11" fill="#F9FAFB">Reducer Aggregation</text>
    <text x="795" y="96" class="body-txt" text-anchor="middle">('a', [1, 1, 1]) in RAM Heap</text>
  </g>

  <!-- Bottom: reduceByKey (Green) -->
  <g transform="translate(30, 180)">
    <rect width="940" height="130" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <text x="470" y="28" class="title" fill="#6EE7B7">reduceByKey: Map-Side Combiner Pre-Aggregation (Optimal / Scalable)</text>
    <line x1="20" y1="38" x2="920" y2="38" stroke="#1F2937" stroke-width="1.5"/>

    <rect x="35" y="55" width="200" height="55" rx="6" ry="6" fill="#1F2937" stroke="#10B981" stroke-width="1.5"/>
    <text x="135" y="78" class="title" font-size="11" fill="#F9FAFB">Mapper Partitions</text>
    <text x="135" y="96" class="body-txt" text-anchor="middle">('a', 1), ('a', 1), ('a', 1)</text>

    <path fill="none" d="M 235 82.5 L 285 82.5" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>

    <rect x="285" y="55" width="210" height="55" rx="6" ry="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="390" y="78" class="title" font-size="11" fill="#93C5FD">Map-Side Combiner</text>
    <text x="390" y="96" class="body-txt" text-anchor="middle">Pre-aggregated to: ('a', 3)</text>

    <path fill="none" d="M 495 82.5 L 545 82.5" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>

    <rect x="545" y="55" width="200" height="55" rx="6" ry="6" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <text x="645" y="78" class="title" font-size="11" fill="#6EE7B7">Shuffle 1 Record Only</text>
    <text x="645" y="96" class="body-txt" text-anchor="middle">Zero Network Saturation</text>

    <path fill="none" d="M 745 82.5 L 795 82.5" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>

    <rect x="795" y="55" width="120" height="55" rx="6" ry="6" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
    <text x="855" y="78" class="title" font-size="11" fill="#A7F3D0">Reducer</text>
    <text x="855" y="96" class="body-txt" text-anchor="middle" fill="#A7F3D0">('a', 3)</text>
  </g>
</svg>
