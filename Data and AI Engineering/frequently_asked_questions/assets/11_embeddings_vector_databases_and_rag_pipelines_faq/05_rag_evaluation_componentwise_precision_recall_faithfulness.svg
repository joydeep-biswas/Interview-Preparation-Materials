<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Left: Retrieval Evaluation Container -->
  <rect x="25" y="25" width="440" height="250" rx="12" ry="12" fill="#0D1526" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="45" y="52" class="title-txt" fill="#93C5FD">1. Retrieval Evaluation (Independent of LLM)</text>

  <rect x="45" y="70" width="400" height="85" rx="8" ry="8" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="60" y="94" class="title-txt" text-anchor="start">Context Precision</text>
  <text x="60" y="114" class="body-txt" text-anchor="start">• Are the top-K retrieved chunks signal-dense and relevant?</text>
  <text x="60" y="132" class="mono-txt" text-anchor="start">Precision = (Relevant Chunks in Top-K) / K</text>

  <rect x="45" y="170" width="400" height="85" rx="8" ry="8" fill="#111827" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="60" y="194" class="title-txt" text-anchor="start">Context Recall</text>
  <text x="60" y="214" class="body-txt" text-anchor="start">• Did we capture all necessary ground-truth facts from the corpus?</text>
  <text x="60" y="232" class="mono-txt" text-anchor="start">Recall = (Retrieved Ground Truth Facts) / (Total GT Facts)</text>

  <!-- Connect Left to Right -->
  <path d="M 465 150 L 495 150" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Right: Generation Evaluation Container -->
  <rect x="495" y="25" width="440" height="250" rx="12" ry="12" fill="#0D1526" stroke="#10B981" stroke-width="1.5"/>
  <text x="515" y="52" class="title-txt" fill="#6EE7B7">2. Generation Evaluation (Grounding &amp; Faithfulness)</text>

  <rect x="515" y="70" width="400" height="85" rx="8" ry="8" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="530" y="94" class="title-txt" text-anchor="start" fill="#A7F3D0">Faithfulness / Groundedness</text>
  <text x="530" y="114" class="body-txt" text-anchor="start">• Can every claim in the answer be directly inferred from context?</text>
  <text x="530" y="132" class="badge-txt" fill="#10B981">Zero Hallucination Standard</text>

  <rect x="515" y="170" width="400" height="85" rx="8" ry="8" fill="#111827" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="530" y="194" class="title-txt" text-anchor="start" fill="#C4B5FD">Answer Relevance</text>
  <text x="530" y="214" class="body-txt" text-anchor="start">• Does the generated response directly answer the user prompt?</text>
  <text x="530" y="232" class="mono-txt" text-anchor="start">Penalizes evasive or redundant answers</text>
</svg>