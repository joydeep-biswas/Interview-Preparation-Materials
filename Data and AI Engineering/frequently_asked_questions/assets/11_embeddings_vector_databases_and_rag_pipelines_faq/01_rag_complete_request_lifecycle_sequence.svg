<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19"/>

  <!-- Actors Header -->
  <!-- User -->
  <rect x="40" y="20" width="110" height="40" rx="8" ry="8" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="95" y="45" class="title-txt" text-anchor="middle">User / Client</text>
  <line x1="95" y1="60" x2="95" y2="440" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

  <!-- Gateway -->
  <rect x="180" y="20" width="120" height="40" rx="8" ry="8" fill="#111827" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="240" y="45" class="title-txt" text-anchor="middle">API Gateway</text>
  <line x1="240" y1="60" x2="240" y2="440" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

  <!-- QueryEngine -->
  <rect x="330" y="20" width="130" height="40" rx="8" ry="8" fill="#111827" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="395" y="45" class="title-txt" text-anchor="middle">Query Engine</text>
  <line x1="395" y1="60" x2="395" y2="440" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

  <!-- Retrieval & VectorDB -->
  <rect x="490" y="20" width="140" height="40" rx="8" ry="8" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="560" y="45" class="title-txt" text-anchor="middle">Hybrid Search</text>
  <line x1="560" y1="60" x2="560" y2="440" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

  <!-- Reranker -->
  <rect x="660" y="20" width="120" height="40" rx="8" ry="8" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="720" y="45" class="title-txt" text-anchor="middle">Reranker</text>
  <line x1="720" y1="60" x2="720" y2="440" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

  <!-- LLM & Safety -->
  <rect x="810" y="20" width="120" height="40" rx="8" ry="8" fill="#111827" stroke="#EC4899" stroke-width="1.5"/>
  <text x="870" y="45" class="title-txt" text-anchor="middle">LLM &amp; Safety</text>
  <line x1="870" y1="60" x2="870" y2="440" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/>

  <!-- Message 1: Query to Gateway -->
  <path d="M 95 90 L 230 90" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="160" y="82" class="edge-txt" text-anchor="middle">1. POST /v1/chat</text>

  <!-- Note: Gateway Check -->
  <rect x="180" y="105" width="120" height="35" rx="4" ry="4" fill="#0D1526" stroke="#06B6D4" stroke-width="1"/>
  <text x="240" y="120" class="sub-txt" text-anchor="middle">Auth, ACL, Guardrail</text>
  <text x="240" y="132" class="mono-txt" text-anchor="middle">Prompt Injection Filter</text>

  <!-- Message 2: Gateway to QueryEngine -->
  <path d="M 240 155 L 385 155" fill="none" stroke="#06B6D4" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="312" y="148" class="edge-txt" text-anchor="middle">2. Sanitized Query</text>

  <!-- Note: Query Transformation -->
  <rect x="335" y="170" width="120" height="35" rx="4" ry="4" fill="#0D1526" stroke="#8B5CF6" stroke-width="1"/>
  <text x="395" y="185" class="sub-txt" text-anchor="middle">HyDE Passage / Sub-Q</text>
  <text x="395" y="197" class="mono-txt" text-anchor="middle">Rewrite with History</text>

  <!-- Message 3: QueryEngine to Hybrid Retrieval -->
  <path d="M 395 220 L 550 220" fill="none" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="475" y="212" class="edge-txt" text-anchor="middle">3. Fan-out Dense + BM25</text>

  <!-- Note: RRF Merge -->
  <rect x="500" y="235" width="120" height="35" rx="4" ry="4" fill="#0D1526" stroke="#10B981" stroke-width="1"/>
  <text x="560" y="250" class="sub-txt" text-anchor="middle">HNSW + Lexical BM25</text>
  <text x="560" y="262" class="mono-txt" text-anchor="middle">RRF k=60 (Top-50)</text>

  <!-- Message 4: Retrieval to Reranker -->
  <path d="M 560 285 L 710 285" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="635" y="278" class="edge-txt" text-anchor="middle">4. Top-50 Pairs</text>

  <!-- Note: Cross Attention -->
  <rect x="660" y="300" width="120" height="35" rx="4" ry="4" fill="#0D1526" stroke="#F59E0B" stroke-width="1"/>
  <text x="720" y="315" class="sub-txt" text-anchor="middle">Cross-Attention Scoring</text>
  <text x="720" y="327" class="mono-txt" text-anchor="middle">Prune to Top-5 Chunks</text>

  <!-- Message 5: Top-5 into LLM -->
  <path d="M 720 350 L 860 350" fill="none" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="790" y="342" class="edge-txt" text-anchor="middle">5. Top-5 Chunks + Prompt</text>

  <!-- Note: LLM Generation & Safety -->
  <rect x="810" y="365" width="120" height="35" rx="4" ry="4" fill="#0D1526" stroke="#EC4899" stroke-width="1"/>
  <text x="870" y="380" class="sub-txt" text-anchor="middle">Streaming Synthesis</text>
  <text x="870" y="392" class="mono-txt" text-anchor="middle">Groundedness &amp; PII Check</text>

  <!-- Message 6: Return Stream to User -->
  <path d="M 870 415 L 105 415" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-green)"/>
  <text x="480" y="408" class="edge-txt" text-anchor="middle" fill="#10B981">6. Streamed Verified Tokens + Citations</text>
</svg>