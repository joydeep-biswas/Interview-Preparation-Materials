<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; text-anchor: middle; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .node-txt { fill: #E2E8F0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .edge { stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="1000" height="360" fill="#0B0F19"/>

  <!-- Left: Without Bucketing (Red) -->
  <g transform="translate(30, 30)">
    <rect width="450" height="300" rx="10" ry="10" fill="#111827" stroke="#EF4444" stroke-width="2"/>
    <text x="225" y="30" class="title" fill="#FCA5A5">Standard Join: Network Shuffle Required</text>
    <line x1="20" y1="42" x2="430" y2="42" stroke="#1F2937" stroke-width="1.5"/>

    <!-- Table A & B -->
    <rect x="25" y="60" width="170" height="60" rx="8" ry="8" fill="#1F2937" stroke="#EF4444" stroke-width="1.5"/>
    <text x="110" y="85" class="title" font-size="12" fill="#FCA5A5">Table A</text>
    <text x="110" y="103" class="body-txt" text-anchor="middle">Workers 1..4 (Unaligned)</text>

    <rect x="25" y="140" width="170" height="60" rx="8" ry="8" fill="#1F2937" stroke="#EF4444" stroke-width="1.5"/>
    <text x="110" y="165" class="title" font-size="12" fill="#FCA5A5">Table B</text>
    <text x="110" y="183" class="body-txt" text-anchor="middle">Workers 1..4 (Unaligned)</text>

    <!-- Network Shuffle -->
    <rect x="250" y="80" width="175" height="100" rx="8" ry="8" fill="#7F1D1D" stroke="#EF4444" stroke-width="2"/>
    <text x="337.5" y="112" class="title" font-size="12" fill="#FECACA">Network Shuffle</text>
    <text x="337.5" y="132" class="body-txt" text-anchor="middle" fill="#FCA5A5">Cross-Rack Transmission</text>
    <text x="337.5" y="150" class="body-txt" text-anchor="middle" fill="#FCA5A5">High Disk Spill &amp; Latency</text>

    <!-- Output -->
    <rect x="135" y="235" width="200" height="45" rx="8" ry="8" fill="#1F2937" stroke="#EF4444" stroke-width="1.5"/>
    <text x="235" y="262" class="title" font-size="12" fill="#FECACA">Distributed Join Output</text>

    <!-- Edges Left -->
    <path fill="none" d="M 195 90 L 250 110" class="edge" stroke="#EF4444" marker-end="url(#arr-red)"/>
    <path fill="none" d="M 195 170 L 250 150" class="edge" stroke="#EF4444" marker-end="url(#arr-red)"/>
    <path fill="none" d="M 337.5 180 L 337.5 210 C 337.5 225, 275 220, 275 235" class="edge" stroke="#EF4444" marker-end="url(#arr-red)"/>
  </g>

  <!-- Right: With Bucketing (Green) -->
  <g transform="translate(520, 30)">
    <rect width="450" height="300" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <text x="225" y="30" class="title" fill="#6EE7B7">Pre-Bucketed Join: ZERO Shuffle</text>
    <line x1="20" y1="42" x2="430" y2="42" stroke="#1F2937" stroke-width="1.5"/>

    <!-- Workers 1..3 with collocated buckets -->
    <rect x="25" y="60" width="220" height="52" rx="8" ry="8" fill="#1F2937" stroke="#10B981" stroke-width="1.5"/>
    <text x="135" y="82" class="title" font-size="11" fill="#6EE7B7">Worker 1: Bucket 1 (A + B)</text>
    <text x="135" y="99" class="body-txt" text-anchor="middle">Local In-Memory Hash Join</text>

    <rect x="25" y="125" width="220" height="52" rx="8" ry="8" fill="#1F2937" stroke="#10B981" stroke-width="1.5"/>
    <text x="135" y="147" class="title" font-size="11" fill="#6EE7B7">Worker 2: Bucket 2 (A + B)</text>
    <text x="135" y="164" class="body-txt" text-anchor="middle">Local In-Memory Hash Join</text>

    <rect x="25" y="190" width="220" height="52" rx="8" ry="8" fill="#1F2937" stroke="#10B981" stroke-width="1.5"/>
    <text x="135" y="212" class="title" font-size="11" fill="#6EE7B7">Worker 3: Bucket 3 (A + B)</text>
    <text x="135" y="229" class="body-txt" text-anchor="middle">Local In-Memory Hash Join</text>

    <!-- Consolidated Output -->
    <rect x="290" y="105" width="140" height="90" rx="8" ry="8" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
    <text x="360" y="135" class="title" font-size="12" fill="#A7F3D0">Fast Output</text>
    <text x="360" y="155" class="body-txt" text-anchor="middle" fill="#A7F3D0">Zero Network</text>
    <text x="360" y="172" class="body-txt" text-anchor="middle" fill="#A7F3D0">Transfer!</text>

    <!-- Edges Right with straight runways -->
    <path fill="none" d="M 245 86 L 270 86 C 280 86, 280 130, 290 130" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>
    <path fill="none" d="M 245 151 L 290 151" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>
    <path fill="none" d="M 245 216 L 270 216 C 280 216, 280 170, 290 170" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>

    <text x="225" y="275" class="body-txt" text-anchor="middle" fill="#6EE7B7">Both tables partitioned by same key &amp; bucket count</text>
  </g>
</svg>
