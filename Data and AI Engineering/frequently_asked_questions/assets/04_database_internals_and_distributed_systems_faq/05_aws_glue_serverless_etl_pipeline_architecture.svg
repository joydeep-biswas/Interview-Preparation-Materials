<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 280" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 700; text-anchor: middle; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .edge { stroke-width: 2; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <rect width="980" height="280" fill="#0B0F19"/>

  <!-- S3 Raw Landing -->
  <g transform="translate(30, 70)">
    <rect width="200" height="140" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <text x="100" y="32" class="title" fill="#93C5FD">S3 Raw Landing Zone</text>
    <line x1="15" y1="44" x2="185" y2="44" stroke="#1F2937" stroke-width="1.5"/>
    <text x="20" y="72" class="body-txt">• Unstructured JSON / CSV</text>
    <text x="20" y="94" class="body-txt">• External API feeds</text>
    <text x="20" y="116" class="body-txt">• Event-driven S3 triggers</text>
  </g>

  <path fill="none" d="M 230 140 L 290 140" class="edge" stroke="#3B82F6" marker-end="url(#arr-blue)"/>

  <!-- AWS Glue Job -->
  <g transform="translate(290, 50)">
    <rect width="280" height="180" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <text x="140" y="32" class="title" fill="#FCD34D">AWS Glue PySpark Job</text>
    <line x1="15" y1="44" x2="265" y2="44" stroke="#1F2937" stroke-width="1.5"/>
    <text x="20" y="70" class="body-txt">• Worker Type: G.1X / G.2X DPU autoscaling</text>
    <text x="20" y="92" class="body-txt">• Job Bookmarks: State tracking &amp; deduplication</text>
    <text x="20" y="114" class="body-txt">• Schema validation &amp; quarantine routing</text>
    <text x="20" y="136" class="body-txt">• Spark SQL transformations &amp; enrichment</text>
    <text x="20" y="158" class="body-txt">• Dynamic frame conversion pushdown</text>
  </g>

  <!-- Connectors to S3 Curated & Glue Catalog with straight runways -->
  <path fill="none" d="M 570 110 L 610 110 C 625 110, 630 85, 645 85 L 660 85" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>
  <path fill="none" d="M 570 170 L 610 170 C 625 170, 630 195, 645 195 L 660 195" class="edge" stroke="#8B5CF6" marker-end="url(#arr-purple)"/>

  <!-- S3 Curated -->
  <g transform="translate(660, 30)">
    <rect width="280" height="105" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <text x="140" y="28" class="title" fill="#6EE7B7">S3 Curated Parquet</text>
    <line x1="15" y1="38" x2="265" y2="38" stroke="#1F2937" stroke-width="1.5"/>
    <text x="20" y="62" class="body-txt">• Partitioned by year/month/date</text>
    <text x="20" y="82" class="body-txt">• Snappy compression &amp; dictionary encoding</text>
  </g>

  <!-- AWS Glue Catalog -->
  <g transform="translate(660, 150)">
    <rect width="280" height="100" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <text x="140" y="28" class="title" fill="#C4B5FD">AWS Glue Data Catalog</text>
    <line x1="15" y1="38" x2="265" y2="38" stroke="#1F2937" stroke-width="1.5"/>
    <text x="20" y="62" class="body-txt">• Centralized metastore for Athena / EMR</text>
    <text x="20" y="82" class="body-txt">• Crawler / automatic partition schema sync</text>
  </g>
</svg>
