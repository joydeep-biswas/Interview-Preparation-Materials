<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 230" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 700; text-anchor: middle; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .edge { stroke-width: 2; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B" />
    </marker>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4" />
    </marker>
  </defs>

  <rect width="1020" height="230" fill="#0B0F19"  rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Source -->
  <g transform="translate(25, 40)">
    <rect width="180" height="150" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2" />
    <text x="90" y="32" class="title" fill="#93C5FD">Daily Sales Feed</text>
    <line x1="15" y1="44" x2="165" y2="44" stroke="#1F2937" stroke-width="1.5" />
    <text x="18" y="70" class="body-txt">• POS store terminals</text>
    <text x="18" y="92" class="body-txt">• Web &amp; Mobile apps</text>
    <text x="18" y="114" class="body-txt">• ERP inventory batch</text>
    <text x="18" y="136" class="body-txt">• Real-time Kafka feeds</text>
  </g>

  <!-- Bronze -->
  <g transform="translate(245, 40)">
    <rect width="220" height="150" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2" />
    <text x="110" y="32" class="title" fill="#FCD34D">Bronze: Raw Ingestion</text>
    <line x1="15" y1="44" x2="205" y2="44" stroke="#1F2937" stroke-width="1.5" />
    <text x="18" y="70" class="body-txt">• Append-only Delta Lake table</text>
    <text x="18" y="92" class="body-txt">• Raw JSON payloads preserved</text>
    <text x="18" y="114" class="body-txt">• Ingestion timestamp added</text>
    <text x="18" y="136" class="body-txt">• Zero validation loss</text>
  </g>

  <!-- Silver -->
  <g transform="translate(505, 40)">
    <rect width="230" height="150" rx="10" ry="10" fill="#111827" stroke="#06B6D4" stroke-width="2" />
    <text x="115" y="32" class="title" fill="#67E8F9">Silver: Cleansed &amp; Curated</text>
    <line x1="15" y1="44" x2="215" y2="44" stroke="#1F2937" stroke-width="1.5" />
    <text x="18" y="70" class="body-txt">• Deduplicated by txn_id</text>
    <text x="18" y="92" class="body-txt">• Strict schema enforcement</text>
    <text x="18" y="114" class="body-txt">• Foreign key lookups applied</text>
    <text x="18" y="136" class="body-txt">• Null imputation &amp; validation</text>
  </g>

  <!-- Gold -->
  <g transform="translate(775, 40)">
    <rect width="220" height="150" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2" />
    <text x="110" y="32" class="title" fill="#6EE7B7">Gold: Business Serving</text>
    <line x1="15" y1="44" x2="205" y2="44" stroke="#1F2937" stroke-width="1.5" />
    <text x="18" y="70" class="body-txt">• Star Schema fact tables</text>
    <text x="18" y="92" class="body-txt">• Daily store &amp; product rollups</text>
    <text x="18" y="114" class="body-txt">• Optimized for BI &amp; ML marts</text>
    <text x="18" y="136" class="body-txt">• Liquid Clustered / Z-Order</text>
  </g>
<g id="connectors"><path fill="none" d="M 205 115 L 245 115" class="edge" stroke="#3B82F6" marker-end="url(#arr-blue)" />

  <path fill="none" d="M 465 115 L 505 115" class="edge" stroke="#F59E0B" marker-end="url(#arr-amber)" />

  <path fill="none" d="M 735 115 L 775 115" class="edge" stroke="#06B6D4" marker-end="url(#arr-cyan)" />

  </g></svg>