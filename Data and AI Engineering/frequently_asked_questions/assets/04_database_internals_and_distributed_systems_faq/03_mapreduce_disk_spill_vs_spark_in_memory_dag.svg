<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; text-anchor: middle; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; text-anchor: middle; }
      .edge { stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="1000" height="380" fill="#0B0F19"/>

  <!-- Top: MapReduce (Red) -->
  <g transform="translate(30, 25)">
    <rect width="940" height="150" rx="10" ry="10" fill="#111827" stroke="#EF4444" stroke-width="2"/>
    <text x="470" y="28" class="title" fill="#FCA5A5">MapReduce: Disk-Bound Multi-Job Pipeline (High Serialization Latency)</text>
    <line x1="20" y1="40" x2="920" y2="40" stroke="#1F2937" stroke-width="1.5"/>

    <!-- Chain of 7 items -->
    <rect x="25" y="65" width="105" height="55" rx="6" ry="6" fill="#1F2937" stroke="#EF4444" stroke-width="1.5"/>
    <text x="77.5" y="93" class="title" font-size="11" fill="#F9FAFB">Job 1 Map</text>
    <text x="77.5" y="108" class="body-txt">Read HDFS</text>

    <path fill="none" d="M 130 92.5 L 155 92.5" class="edge" stroke="#EF4444" marker-end="url(#arr-red)"/>

    <rect x="155" y="65" width="105" height="55" rx="6" ry="6" fill="#7F1D1D" stroke="#EF4444" stroke-width="1.5"/>
    <text x="207.5" y="93" class="title" font-size="11" fill="#FECACA">Disk Spill</text>
    <text x="207.5" y="108" class="body-txt" fill="#FCA5A5">Local Disk I/O</text>

    <path fill="none" d="M 260 92.5 L 285 92.5" class="edge" stroke="#EF4444" marker-end="url(#arr-red)"/>

    <rect x="285" y="65" width="105" height="55" rx="6" ry="6" fill="#1F2937" stroke="#EF4444" stroke-width="1.5"/>
    <text x="337.5" y="93" class="title" font-size="11" fill="#F9FAFB">Job 1 Reduce</text>
    <text x="337.5" y="108" class="body-txt">Aggregations</text>

    <path fill="none" d="M 390 92.5 L 415 92.5" class="edge" stroke="#EF4444" marker-end="url(#arr-red)"/>

    <rect x="415" y="65" width="115" height="55" rx="6" ry="6" fill="#7F1D1D" stroke="#EF4444" stroke-width="2"/>
    <text x="472.5" y="93" class="title" font-size="11" fill="#FECACA">HDFS Barrier</text>
    <text x="472.5" y="108" class="body-txt" fill="#FCA5A5">3x Replication</text>

    <path fill="none" d="M 530 92.5 L 555 92.5" class="edge" stroke="#EF4444" marker-end="url(#arr-red)"/>

    <rect x="555" y="65" width="105" height="55" rx="6" ry="6" fill="#1F2937" stroke="#EF4444" stroke-width="1.5"/>
    <text x="607.5" y="93" class="title" font-size="11" fill="#F9FAFB">Job 2 Map</text>
    <text x="607.5" y="108" class="body-txt">Re-read HDFS</text>

    <path fill="none" d="M 660 92.5 L 685 92.5" class="edge" stroke="#EF4444" marker-end="url(#arr-red)"/>

    <rect x="685" y="65" width="105" height="55" rx="6" ry="6" fill="#7F1D1D" stroke="#EF4444" stroke-width="1.5"/>
    <text x="737.5" y="93" class="title" font-size="11" fill="#FECACA">Disk Spill</text>
    <text x="737.5" y="108" class="body-txt" fill="#FCA5A5">Local Disk I/O</text>

    <path fill="none" d="M 790 92.5 L 815 92.5" class="edge" stroke="#EF4444" marker-end="url(#arr-red)"/>

    <rect x="815" y="65" width="105" height="55" rx="6" ry="6" fill="#1F2937" stroke="#EF4444" stroke-width="1.5"/>
    <text x="867.5" y="93" class="title" font-size="11" fill="#F9FAFB">Job 2 Reduce</text>
    <text x="867.5" y="108" class="body-txt">Final Result</text>
  </g>

  <!-- Bottom: Apache Spark (Green) -->
  <g transform="translate(30, 200)">
    <rect width="940" height="150" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <text x="470" y="28" class="title" fill="#6EE7B7">Apache Spark: In-Memory DAG Pipeline (10x-100x Faster Execution)</text>
    <line x1="20" y1="40" x2="920" y2="40" stroke="#1F2937" stroke-width="1.5"/>

    <rect x="40" y="65" width="260" height="60" rx="8" ry="8" fill="#1F2937" stroke="#10B981" stroke-width="1.5"/>
    <text x="170" y="92" class="title" font-size="12" fill="#6EE7B7">Stage 1 (Pipeline in RAM)</text>
    <text x="170" y="110" class="body-txt">Narrow Transformations (Map/Filter)</text>

    <path fill="none" d="M 300 95 L 350 95" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>

    <rect x="350" y="65" width="240" height="60" rx="8" ry="8" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
    <text x="470" y="92" class="title" font-size="12" fill="#93C5FD">In-Memory Shuffle Buffer</text>
    <text x="470" y="110" class="body-txt">Netty Zero-Copy Transfer (Zero HDFS Barrier)</text>

    <path fill="none" d="M 590 95 L 640 95" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>

    <rect x="640" y="65" width="260" height="60" rx="8" ry="8" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
    <text x="770" y="92" class="title" font-size="12" fill="#A7F3D0">Stage 2 (Pipeline in RAM)</text>
    <text x="770" y="110" class="body-txt" fill="#A7F3D0">Wide Transformations &amp; Cache in Memory</text>
  </g>
</svg>
