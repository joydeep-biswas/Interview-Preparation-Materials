<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; text-anchor: middle; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; }
      .node-lbl { fill: #93C5FD; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; text-anchor: middle; }
      .key-lbl { fill: #6EE7B7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
    </style>
  </defs>

  <rect width="960" height="440" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Left: 360 Ring Graphic (Center at 260, 220, R=140) -->
  <g transform="translate(40, 20)">
    <!-- Main Ring Circle -->
    <circle cx="240" cy="200" r="140" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="6 6"/>

    <!-- Clockwise directional arcs/markers -->
    <!-- 0 deg (Top: 240, 60) -> Node A -->
    <circle cx="240" cy="60" r="16" fill="#1E293B" stroke="#3B82F6" stroke-width="2.5"/>
    <text x="240" y="64" class="node-lbl">A</text>
    <text x="240" y="32" class="node-lbl">Node A (0°)</text>

    <!-- 45 deg (Key 1: 240 + 140*0.707 = 339, 200 - 140*0.707 = 101) -->
    <circle cx="339" cy="101" r="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <text x="385" y="98" class="key-lbl">Key 1 (45°)</text>
    <path d="M 345 107 C 360 120, 375 160, 380 185" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>

    <!-- 90 deg (Right: 380, 200) -> Node B -->
    <circle cx="380" cy="200" r="16" fill="#1E293B" stroke="#3B82F6" stroke-width="2.5"/>
    <text x="380" y="204" class="node-lbl">B</text>
    <text x="445" y="204" class="node-lbl">Node B (90°)</text>

    <!-- 150 deg (Key 2: 240 + 140*0.5 = 310, 200 + 140*0.866 = 321) -->
    <circle cx="310" cy="321" r="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <text x="350" y="345" class="key-lbl">Key 2 (150°)</text>

    <!-- 210 deg (Node C: 240 - 140*0.866 = 118, 200 + 140*0.5 = 270) -->
    <circle cx="118" cy="270" r="16" fill="#1E293B" stroke="#3B82F6" stroke-width="2.5"/>
    <text x="118" y="274" class="node-lbl">C</text>
    <text x="50" y="275" class="node-lbl">Node C (210°)</text>

    <!-- 320 deg (Key 3: 240 - 140*0.64 = 150, 200 - 140*0.76 = 93) -->
    <circle cx="150" cy="93" r="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <text x="95" y="90" class="key-lbl">Key 3 (320°)</text>

    <!-- Center Label -->
    <text x="240" y="195" class="title" fill="#93C5FD">360° Ring</text>
    <text x="240" y="215" class="body-txt" text-anchor="middle" fill="#64748B">Clockwise Walk</text>
  </g>

  <!-- Right: Properties Card -->
  <g transform="translate(540, 50)">
    <rect width="390" height="340" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <text x="195" y="32" class="title" fill="#93C5FD">Consistent Hashing Mechanics</text>
    <line x1="20" y1="46" x2="370" y2="46" stroke="#1F2937" stroke-width="1.5"/>

    <text x="25" y="80" class="title" font-size="12" fill="#FCD34D" text-anchor="start">1. Clockwise Assignment</text>
    <text x="35" y="102" class="body-txt">• Key hashes to an integer position on ring (0..2³²-1)</text>
    <text x="35" y="122" class="body-txt">• Traverses clockwise until it hits the first active Node</text>

    <text x="25" y="160" class="title" font-size="12" fill="#6EE7B7" text-anchor="start">2. Minimal Rebalancing on Node Failure / Add</text>
    <text x="35" y="182" class="body-txt">• If Node B fails: ONLY Keys in (0°..90°] remap to Node C</text>
    <text x="35" y="202" class="body-txt">• Standard modulo hash rebalances 100% of keys (K/N)</text>
    <text x="35" y="222" class="body-txt">• Consistent hashing moves only K/N keys (1/3 of total)</text>

    <text x="25" y="260" class="title" font-size="12" fill="#C4B5FD" text-anchor="start">3. Virtual Nodes (V-Nodes)</text>
    <text x="35" y="282" class="body-txt">• Each physical machine hosts 100-256 virtual tokens</text>
    <text x="35" y="302" class="body-txt">• Eliminates data skew and hotspots across partitions</text>
  </g>
</svg>
