<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 220" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .card { fill: #111827; stroke-width: 1.5; rx: 10; ry: 10; }
      .card-blue { stroke: #3B82F6; }
      .card-amber { stroke: #F59E0B; }
      .card-green { stroke: #10B981; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #F3F4F6; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #9CA3AF; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
      .edge-amber { stroke: #F59E0B; }
      .edge-blue { stroke: #3B82F6; }
      .edge-green { stroke: #10B981; }
    </style>
    <marker id="arr-a2lk" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-b2lk" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g2lk" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <text x="530" y="32" class="title-text">Medallion Lakehouse Architecture: Bronze, Silver &amp; Gold Multi-Hop Pipeline</text>

  <!-- Step 1: Sources -->
  <rect x="25" y="65" width="200" height="120" class="card card-blue"/>
  <text x="125" y="92" class="card-title" fill="#93C5FD">Data Sources</text>
  <text x="35" y="117" class="card-body">• Kafka event brokers</text>
  <text x="35" y="137" class="card-body">• REST API webhooks</text>
  <text x="35" y="157" class="card-body">• RDBMS CDC streams</text>

  <!-- Step 2: Bronze -->
  <rect x="270" y="65" width="225" height="120" class="card card-amber"/>
  <text x="382" y="92" class="card-title" fill="#FDE68A">1. Bronze Tier (Raw)</text>
  <text x="280" y="117" class="card-body">• Append-only raw data</text>
  <text x="280" y="137" class="card-body">• Unaltered source payload</text>
  <text x="280" y="157" class="card-body">• Schema rescue &amp; audit history</text>

  <!-- Step 3: Silver -->
  <rect x="540" y="65" width="235" height="120" class="card card-blue"/>
  <text x="657" y="92" class="card-title" fill="#93C5FD">2. Silver Tier (Enriched)</text>
  <text x="550" y="117" class="card-body">• Cleaned &amp; deduplicated</text>
  <text x="550" y="137" class="card-body">• MERGE INTO / UPSERT</text>
  <text x="550" y="157" class="card-body">• Conformed SCD 1 &amp; 2 entities</text>

  <!-- Step 4: Gold -->
  <rect x="820" y="65" width="215" height="120" class="card card-green"/>
  <text x="927" y="92" class="card-title" fill="#6EE7B7">3. Gold Tier (Curated)</text>
  <text x="830" y="117" class="card-body" fill="#34D399">• Star schema fact tables</text>
  <text x="830" y="137" class="card-body">• Aggregated KPI datamarts</text>
  <text x="830" y="157" class="card-body" fill="#34D399">• Sub-second BI query serving</text>

  <!-- Straight Horizontal Connectors -->
  <path fill="none" d="M 225 125 L 270 125" class="edge edge-amber" marker-end="url(#arr-a2lk)"/>
  <path fill="none" d="M 495 125 L 540 125" class="edge edge-blue" marker-end="url(#arr-b2lk)"/>
  <path fill="none" d="M 775 125 L 820 125" class="edge edge-green" marker-end="url(#arr-g2lk)"/>
</svg>
