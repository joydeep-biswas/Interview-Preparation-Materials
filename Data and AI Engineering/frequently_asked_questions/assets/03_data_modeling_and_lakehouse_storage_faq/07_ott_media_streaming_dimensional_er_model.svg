<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .card { fill: #111827; stroke-width: 1.5; rx: 10; ry: 10; }
      .card-green { stroke: #10B981; }
      .card-blue { stroke: #3B82F6; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #F3F4F6; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #9CA3AF; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
      .edge-green { stroke: #10B981; }
    </style>
    <marker id="arr-g7lk" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <text x="480" y="32" class="title-text">OTT Media Streaming: Star Schema Dimensional Model</text>

  <!-- Left: 3 Conformed Dimensions -->
  <rect x="30" y="55" width="260" height="90" class="card card-green"/>
  <text x="160" y="80" class="card-title" fill="#6EE7B7">DIM_USER</text>
  <text x="45" y="105" class="card-body">• user_sk (PK), uuid user_id</text>
  <text x="45" y="125" class="card-body">• country_code, subscription_tier</text>

  <rect x="30" y="155" width="260" height="90" class="card card-green"/>
  <text x="160" y="180" class="card-title" fill="#6EE7B7">DIM_CONTENT</text>
  <text x="45" y="205" class="card-body">• content_sk (PK), title, genre</text>
  <text x="45" y="225" class="card-body">• duration_seconds, release_year</text>

  <rect x="30" y="255" width="260" height="90" class="card card-green"/>
  <text x="160" y="280" class="card-title" fill="#6EE7B7">DIM_DEVICE</text>
  <text x="45" y="305" class="card-body">• device_sk (PK), device_type</text>
  <text x="45" y="325" class="card-body">• os_family, app_version</text>

  <!-- Right: Central Fact Table -->
  <rect x="420" y="90" width="500" height="200" class="card card-blue"/>
  <text x="670" y="120" class="card-title" fill="#93C5FD">FACT_WATCH_EVENT</text>
  <text x="440" y="150" class="card-body">• watch_event_id (PK)</text>
  <text x="440" y="170" class="card-body">• user_sk (FK), content_sk (FK), device_sk (FK)</text>
  <text x="440" y="190" class="card-body">• watch_duration_seconds (Measure)</text>
  <text x="440" y="210" class="card-body">• average_bitrate_kbps (Quality Metric)</text>
  <text x="440" y="230" class="card-body">• buffer_stall_count (Reliability Metric)</text>
  <text x="440" y="250" class="card-body" fill="#34D399">• Grain: 1 Stream Session per User per Device</text>

  <!-- Connectors with straight runways -->
  <path fill="none" d="M 290 100 C 350 100, 380 150, 406 150 L 420 150" class="edge edge-green" marker-end="url(#arr-g7lk)"/>
  <path fill="none" d="M 290 200 C 350 200, 380 190, 406 190 L 420 190" class="edge edge-green" marker-end="url(#arr-g7lk)"/>
  <path fill="none" d="M 290 300 C 350 300, 380 230, 406 230 L 420 230" class="edge edge-green" marker-end="url(#arr-g7lk)"/>
</svg>
