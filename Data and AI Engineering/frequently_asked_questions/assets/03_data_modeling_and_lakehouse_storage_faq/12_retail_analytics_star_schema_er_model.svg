<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .card { fill: #111827; stroke-width: 1.5; rx: 10; ry: 10; }
      .card-green { stroke: #10B981; }
      .card-blue { stroke: #3B82F6; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #F3F4F6; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #9CA3AF; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
      .edge-green { stroke: #10B981; }
    </style>
    <marker id="arr-g12lk" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <text x="480" y="32" class="title-text">Retail Analytics Star Schema: Fact Monthly Sales &amp; Dimensions</text>

  <!-- Left: 4 Dimensions -->
  <rect x="30" y="55" width="250" height="75" class="card card-green"/>
  <text x="155" y="80" class="card-title" fill="#6EE7B7">DIM_DATE</text>
  <text x="45" y="105" class="card-body">date_sk (PK), month, quarter, year</text>

  <rect x="30" y="140" width="250" height="75" class="card card-green"/>
  <text x="155" y="165" class="card-title" fill="#6EE7B7">DIM_PRODUCT</text>
  <text x="45" y="190" class="card-body">product_sk (PK), sku, category, dept</text>

  <rect x="30" y="225" width="250" height="75" class="card card-green"/>
  <text x="155" y="250" class="card-title" fill="#6EE7B7">DIM_VENDOR</text>
  <text x="45" y="275" class="card-body">vendor_sk (PK), vendor_name, tier</text>

  <rect x="30" y="310" width="250" height="75" class="card card-green"/>
  <text x="155" y="335" class="card-title" fill="#6EE7B7">DIM_LOCATION</text>
  <text x="45" y="360" class="card-body">location_sk (PK), store_id, state</text>

  <!-- Right: FACT_MONTHLY_SALES -->
  <rect x="420" y="90" width="510" height="230" class="card card-blue"/>
  <text x="675" y="120" class="card-title" fill="#93C5FD">FACT_MONTHLY_SALES</text>
  <text x="440" y="150" class="card-body">• sales_id (PK)</text>
  <text x="440" y="170" class="card-body">• date_sk (FK), product_sk (FK), vendor_sk (FK), location_sk (FK)</text>
  <text x="440" y="195" class="card-body" fill="#34D399">• total_units_sold (Additive)</text>
  <text x="440" y="215" class="card-body" fill="#34D399">• total_revenue_usd (Additive)</text>
  <text x="440" y="235" class="card-body" fill="#34D399">• gross_margin_usd (Additive)</text>
  <text x="440" y="260" class="card-body">• Grain: 1 Row per Month per Product per Vendor per Store</text>
  <text x="440" y="280" class="card-body">• Pre-aggregated for instant executive dashboard KPI latency</text>

  <!-- Connectors with straight runways -->
  <path fill="none" d="M 280 92 C 340 92, 380 145, 406 145 L 420 145" class="edge edge-green" marker-end="url(#arr-g12lk)"/>
  <path fill="none" d="M 280 177 C 340 177, 380 185, 406 185 L 420 185" class="edge edge-green" marker-end="url(#arr-g12lk)"/>
  <path fill="none" d="M 280 262 C 340 262, 380 225, 406 225 L 420 225" class="edge edge-green" marker-end="url(#arr-g12lk)"/>
  <path fill="none" d="M 280 347 C 340 347, 380 265, 406 265 L 420 265" class="edge edge-green" marker-end="url(#arr-g12lk)"/>
</svg>
