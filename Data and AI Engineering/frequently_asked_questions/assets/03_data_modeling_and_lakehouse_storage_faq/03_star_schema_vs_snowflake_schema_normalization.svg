<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 380" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .group-box { fill: #111827; stroke-width: 2; rx: 10; ry: 10; }
      .card { fill: #1E293B; stroke-width: 1.5; rx: 8; ry: 8; }
      .card-blue { stroke: #3B82F6; }
      .card-green { stroke: #10B981; }
      .card-amber { stroke: #F59E0B; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #F3F4F6; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #9CA3AF; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
      .edge-green { stroke: #10B981; }
      .edge-amber { stroke: #F59E0B; }
    </style>
    <marker id="arr-g3lk" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a3lk" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <!-- Left: Star Schema -->
  <rect x="25" y="25" width="460" height="325" class="group-box" stroke="#10B981"/>
  <text x="255" y="55" class="title-text" fill="#6EE7B7">Star Schema (Denormalized - Fast Joins)</text>

  <rect x="45" y="130" width="160" height="110" class="card card-blue"/>
  <text x="125" y="158" class="card-title" fill="#93C5FD">fact_sales</text>
  <text x="55" y="185" class="card-body">• customer_sk</text>
  <text x="55" y="205" class="card-body">• product_sk</text>
  <text x="55" y="225" class="card-body">• amount, tax</text>

  <rect x="255" y="75" width="210" height="100" class="card card-green"/>
  <text x="360" y="102" class="card-title" fill="#6EE7B7">dim_customer</text>
  <text x="265" y="127" class="card-body">• Flat city, state, country</text>
  <text x="265" y="147" class="card-body">• Single join to fact</text>
  <text x="265" y="167" class="card-body" fill="#34D399">• Fastest OLAP read perf</text>

  <rect x="255" y="200" width="210" height="100" class="card card-green"/>
  <text x="360" y="227" class="card-title" fill="#6EE7B7">dim_product</text>
  <text x="265" y="252" class="card-body">• Flat category, brand</text>
  <text x="265" y="272" class="card-body">• Zero intermediate joins</text>

  <!-- Connectors Left -->
  <path fill="none" d="M 205 160 C 225 160, 235 125, 241 125 L 255 125" class="edge edge-green" marker-end="url(#arr-g3lk)"/>
  <path fill="none" d="M 205 210 C 225 210, 235 250, 241 250 L 255 250" class="edge edge-green" marker-end="url(#arr-g3lk)"/>

  <!-- Right: Snowflake Schema -->
  <rect x="535" y="25" width="460" height="325" class="group-box" stroke="#F59E0B"/>
  <text x="765" y="55" class="title-text" fill="#FDE68A">Snowflake Schema (Normalized - Storage Savings)</text>

  <rect x="555" y="130" width="140" height="110" class="card card-blue"/>
  <text x="625" y="158" class="card-title" fill="#93C5FD">fact_sales</text>
  <text x="565" y="185" class="card-body">• customer_sk</text>
  <text x="565" y="205" class="card-body">• product_sk</text>
  <text x="565" y="225" class="card-body">• amount</text>

  <rect x="735" y="75" width="130" height="100" class="card card-amber"/>
  <text x="800" y="102" class="card-title" fill="#FDE68A">dim_customer</text>
  <text x="745" y="127" class="card-body">• name, email</text>
  <text x="745" y="147" class="card-body">• geo_id (FK)</text>

  <rect x="900" y="75" width="80" height="100" class="card card-amber"/>
  <text x="940" y="102" class="card-title" fill="#FDE68A">dim_geo</text>
  <text x="908" y="127" class="card-body">• city</text>
  <text x="908" y="147" class="card-body">• state</text>
  <text x="908" y="167" class="card-body">• country</text>

  <rect x="735" y="200" width="130" height="100" class="card card-amber"/>
  <text x="800" y="227" class="card-title" fill="#FDE68A">dim_product</text>
  <text x="745" y="252" class="card-body">• sku, name</text>
  <text x="745" y="272" class="card-body">• cat_id (FK)</text>

  <rect x="900" y="200" width="80" height="100" class="card card-amber"/>
  <text x="940" y="227" class="card-title" fill="#FDE68A">dim_cat</text>
  <text x="908" y="252" class="card-body">• name</text>
  <text x="908" y="272" class="card-body">• brand</text>

  <!-- Connectors Right -->
  <path fill="none" d="M 695 160 C 710 160, 715 125, 721 125 L 735 125" class="edge edge-amber" marker-end="url(#arr-a3lk)"/>
  <path fill="none" d="M 865 125 L 900 125" class="edge edge-amber" marker-end="url(#arr-a3lk)"/>
  <path fill="none" d="M 695 210 C 710 210, 715 250, 721 250 L 735 250" class="edge edge-amber" marker-end="url(#arr-a3lk)"/>
  <path fill="none" d="M 865 250 L 900 250" class="edge edge-amber" marker-end="url(#arr-a3lk)"/>
</svg>
