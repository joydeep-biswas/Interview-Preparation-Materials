<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; text-anchor: middle; }
      .row-txt { fill: #E2E8F0; font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .edge { stroke-width: 1.5; fill: none; }
      .edge-lbl { fill: #6EE7B7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; text-anchor: middle; }
    </style>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="960" height="300" fill="#0B0F19"/>

  <!-- Left: Atomic Transaction Grain -->
  <g transform="translate(30, 45)">
    <rect width="420" height="210" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <text x="210" y="32" class="title" fill="#93C5FD">1. Atomic Transaction Grain</text>
    <text x="210" y="50" class="body-txt" text-anchor="middle">fact_sales_line_item (Individual Scan / Basket Line)</text>
    <line x1="20" y1="62" x2="400" y2="62" stroke="#1F2937" stroke-width="1.5"/>

    <rect x="25" y="75" width="370" height="34" rx="6" ry="6" fill="#1E293B"/>
    <text x="35" y="97" class="row-txt">Row 1: Receipt #101 | Item: Milk  | Qty: 2 | $6.00</text>

    <rect x="25" y="117" width="370" height="34" rx="6" ry="6" fill="#1E293B"/>
    <text x="35" y="139" class="row-txt">Row 2: Receipt #101 | Item: Bread | Qty: 1 | $3.50</text>

    <rect x="25" y="159" width="370" height="34" rx="6" ry="6" fill="#1E293B"/>
    <text x="35" y="181" class="row-txt">Row 3: Receipt #102 | Item: Milk  | Qty: 1 | $3.00</text>
  </g>

  <!-- Right: Aggregations -->
  <!-- Store Rollup -->
  <g transform="translate(560, 40)">
    <rect width="360" height="95" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
    <text x="180" y="28" class="title" fill="#6EE7B7">Store-Level Rollup</text>
    <line x1="15" y1="38" x2="345" y2="38" stroke="#1F2937" stroke-width="1"/>
    <text x="25" y="60" class="row-txt">Store #1 Total Revenue: $12.50</text>
    <text x="25" y="80" class="body-txt">(Aggregated from Receipts #101 and #102)</text>
  </g>

  <!-- Product Rollup -->
  <g transform="translate(560, 160)">
    <rect width="360" height="105" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
    <text x="180" y="28" class="title" fill="#6EE7B7">Product-Level Rollup</text>
    <line x1="15" y1="38" x2="345" y2="38" stroke="#1F2937" stroke-width="1"/>
    <text x="25" y="60" class="row-txt">• Milk Total:  3 units | $9.00</text>
    <text x="25" y="82" class="row-txt">• Bread Total: 1 unit  | $3.50</text>
  </g>

  <!-- Curved Connectors with Straight Runways -->
  <!-- Atomic -> Store -->
  <path fill="none" d="M 450 115 L 485 115 C 510 115, 525 87.5, 545 87.5 L 560 87.5" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>
  <text x="500" y="75" class="edge-lbl">GROUP BY store</text>

  <!-- Atomic -> Product -->
  <path fill="none" d="M 450 185 L 485 185 C 510 185, 525 212.5, 545 212.5 L 560 212.5" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>
  <text x="500" y="230" class="edge-lbl">GROUP BY product</text>
</svg>
