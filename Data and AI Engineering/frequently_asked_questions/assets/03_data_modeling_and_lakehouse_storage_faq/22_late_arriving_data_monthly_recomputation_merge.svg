<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 220" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .code-txt { fill: #FCD34D; font-family: "SFMono-Regular", Consolas, monospace; font-size: 10.5px; }
      .edge { stroke-width: 2; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="1020" height="220" fill="#0B0F19"/>

  <!-- Ingress -->
  <g transform="translate(25, 40)">
    <rect width="170" height="140" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <text x="85" y="32" class="title" fill="#93C5FD">Ingress</text>
    <line x1="15" y1="44" x2="155" y2="44" stroke="#1F2937" stroke-width="1.5"/>
    <text x="18" y="70" class="body-txt">• Late-arriving events</text>
    <text x="18" y="92" class="body-txt">• Retro-dated edits</text>
    <text x="18" y="114" class="body-txt">• Settlement adjust</text>
  </g>

  <path fill="none" d="M 195 110 L 225 110" class="edge" stroke="#3B82F6" marker-end="url(#arr-blue)"/>

  <!-- Step 1 -->
  <g transform="translate(225, 40)">
    <rect width="180" height="140" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <text x="90" y="32" class="title" fill="#FCD34D">1. Detect Months</text>
    <line x1="15" y1="44" x2="165" y2="44" stroke="#1F2937" stroke-width="1.5"/>
    <text x="15" y="70" class="code-txt">SELECT DISTINCT</text>
    <text x="15" y="90" class="code-txt">DATE_TRUNC('month',</text>
    <text x="15" y="110" class="code-txt">  txn_date)</text>
    <text x="15" y="130" class="body-txt">Isolate affected slices</text>
  </g>

  <path fill="none" d="M 405 110 L 435 110" class="edge" stroke="#F59E0B" marker-end="url(#arr-amber)"/>

  <!-- Step 2 -->
  <g transform="translate(435, 40)">
    <rect width="180" height="140" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <text x="90" y="32" class="title" fill="#C4B5FD">2. Scoped Extract</text>
    <line x1="15" y1="44" x2="165" y2="44" stroke="#1F2937" stroke-width="1.5"/>
    <text x="18" y="70" class="body-txt">• Pull ALL Silver rows</text>
    <text x="18" y="92" class="body-txt">• STRICTLY for affected</text>
    <text x="18" y="112" class="body-txt">  partition months</text>
    <text x="18" y="132" class="body-txt">• Avoid table scan</text>
  </g>

  <path fill="none" d="M 615 110 L 645 110" class="edge" stroke="#8B5CF6" marker-end="url(#arr-purple)"/>

  <!-- Step 3 -->
  <g transform="translate(645, 40)">
    <rect width="170" height="140" rx="10" ry="10" fill="#111827" stroke="#06B6D4" stroke-width="2"/>
    <text x="85" y="32" class="title" fill="#67E8F9">3. Recompute</text>
    <line x1="15" y1="44" x2="155" y2="44" stroke="#1F2937" stroke-width="1.5"/>
    <text x="18" y="70" class="body-txt">• Re-aggregate metrics</text>
    <text x="18" y="92" class="body-txt">• In-memory Spark</text>
    <text x="18" y="112" class="body-txt">• Produce deterministic</text>
    <text x="18" y="132" class="body-txt">  clean monthly slice</text>
  </g>

  <path fill="none" d="M 815 110 L 845 110" class="edge" stroke="#06B6D4" marker-end="url(#arr-green)"/>

  <!-- Step 4 -->
  <g transform="translate(845, 40)">
    <rect width="150" height="140" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <text x="75" y="32" class="title" fill="#6EE7B7">4. Delta Merge</text>
    <line x1="15" y1="44" x2="135" y2="44" stroke="#1F2937" stroke-width="1.5"/>
    <text x="15" y="70" class="body-txt">• MERGE INTO or</text>
    <text x="15" y="92" class="body-txt">• Dynamic Partition</text>
    <text x="15" y="112" class="body-txt">  Overwrite</text>
    <text x="15" y="132" class="body-txt">• Atomic commit</text>
  </g>
</svg>
