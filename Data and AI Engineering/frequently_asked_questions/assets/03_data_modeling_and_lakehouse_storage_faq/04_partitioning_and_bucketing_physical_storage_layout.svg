<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 300" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .card { fill: #111827; stroke-width: 1.5; rx: 10; ry: 10; }
      .card-blue { stroke: #3B82F6; }
      .card-amber { stroke: #F59E0B; }
      .card-green { stroke: #10B981; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #F3F4F6; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #9CA3AF; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
      .edge-blue { stroke: #3B82F6; }
      .edge-amber { stroke: #F59E0B; }
      .edge-green { stroke: #10B981; }
    </style>
    <marker id="arr-b4lk" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-a4lk" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-g4lk" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <text x="510" y="32" class="title-text">Physical Storage Organization: Partitioning &amp; Hash Bucketing</text>

  <!-- Step 1 -->
  <rect x="30" y="90" width="180" height="120" class="card card-blue"/>
  <text x="120" y="118" class="card-title" fill="#93C5FD">Event Stream</text>
  <text x="45" y="143" class="card-body">• 100M daily events</text>
  <text x="45" y="163" class="card-body">• user_id (High card)</text>
  <text x="45" y="183" class="card-body">• timestamp (Continuous)</text>

  <!-- Step 2 -->
  <rect x="250" y="90" width="220" height="120" class="card card-blue"/>
  <text x="360" y="118" class="card-title" fill="#93C5FD">1. Date Partition</text>
  <text x="265" y="143" class="card-body">• /event_date=2024-06-01/</text>
  <text x="265" y="163" class="card-body">• Low cardinality key</text>
  <text x="265" y="183" class="card-body" fill="#34D399">• Partition Pruning</text>

  <!-- Step 3 -->
  <rect x="510" y="90" width="220" height="120" class="card card-amber"/>
  <text x="620" y="118" class="card-title" fill="#FDE68A">2. Hash Bucketing</text>
  <text x="525" y="143" class="card-body">• murmur3(user_id) % 32</text>
  <text x="525" y="163" class="card-body">• 32 Buckets per partition</text>
  <text x="525" y="183" class="card-body" fill="#34D399">• Eliminates join shuffle</text>

  <!-- Step 4: Bucketed Files -->
  <rect x="770" y="55" width="220" height="55" class="card card-green"/>
  <text x="880" y="88" class="card-title" fill="#6EE7B7">bucket_0000.parquet</text>

  <rect x="770" y="125" width="220" height="55" class="card card-green"/>
  <text x="880" y="158" class="card-title" fill="#6EE7B7">bucket_0001.parquet</text>

  <rect x="770" y="195" width="220" height="55" class="card card-green"/>
  <text x="880" y="228" class="card-title" fill="#6EE7B7">bucket_0031.parquet</text>

  <!-- Connectors with straight runways -->
  <path fill="none" d="M 210 150 L 250 150" class="edge edge-blue" marker-end="url(#arr-b4lk)"/>
  <path fill="none" d="M 470 150 L 510 150" class="edge edge-amber" marker-end="url(#arr-a4lk)"/>

  <path fill="none" d="M 730 150 C 745 150, 755 82, 756 82 L 770 82" class="edge edge-green" marker-end="url(#arr-g4lk)"/>
  <path fill="none" d="M 730 150 L 770 150" class="edge edge-green" marker-end="url(#arr-g4lk)"/>
  <path fill="none" d="M 730 150 C 745 150, 755 222, 756 222 L 770 222" class="edge edge-green" marker-end="url(#arr-g4lk)"/>
</svg>
