<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Client -->
  <rect x="25" y="100" width="160" height="85" rx="8" ry="8" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="105" y="126" class="title-txt" text-anchor="middle">Client App / User</text>
  <text x="37" y="148" class="mono-txt" text-anchor="start">Bearer JWT: User A</text>
  <text x="37" y="166" class="body-txt" text-anchor="start">Sends prompt query</text>

  <path d="M 185 142 L 235 142" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- APIM Policy Execution Pipeline Container -->
  <rect x="235" y="25" width="460" height="280" rx="12" ry="12" fill="#0D1526" stroke="#10B981" stroke-width="1.5"/>
  <text x="255" y="52" class="title-txt" fill="#6EE7B7">Azure APIM Gateway Execution Pipeline</text>

  <!-- 1. Validate JWT -->
  <rect x="255" y="70" width="420" height="45" rx="6" ry="6" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="270" y="92" class="title-txt" text-anchor="start">1. Validate Microsoft Entra JWT</text>
  <text x="270" y="106" class="mono-txt" text-anchor="start">Extracts tenant_id, user_id, tier = 'enterprise'</text>

  <path d="M 465 115 L 465 135" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- 2. RPM Check -->
  <rect x="255" y="135" width="200" height="70" rx="6" ry="6" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="355" y="158" class="title-txt" text-anchor="middle">2. RPM Check</text>
  <text x="265" y="178" class="body-txt" text-anchor="start">• Redis Rate Limiter</text>
  <text x="265" y="194" class="mono-txt" text-anchor="start">Max: 60 req / min</text>

  <!-- 3. TPM Check -->
  <rect x="475" y="135" width="200" height="70" rx="6" ry="6" fill="#111827" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="575" y="158" class="title-txt" text-anchor="middle">3. TPM Check</text>
  <text x="485" y="178" class="body-txt" text-anchor="start">• Token-Bucket Algorithm</text>
  <text x="485" y="194" class="mono-txt" text-anchor="start">Estimate Prompt + TPM</text>

  <!-- 4. Forward to Azure OpenAI -->
  <rect x="255" y="225" width="420" height="60" rx="6" ry="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="465" y="248" class="title-txt" text-anchor="middle" fill="#A7F3D0">4. Forward to Azure OpenAI Endpoint</text>
  <text x="465" y="268" class="mono-txt" text-anchor="middle">Managed Identity Authentication (Zero Key Leakage)</text>

  <!-- Arrows out of APIM: 429 vs Target -->
  <!-- 429 Overload -->
  <path d="M 675 170 L 730 170 Q 745 170 745 125 L 760 125" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <rect x="685" y="145" width="55" height="18" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="712" y="158" class="edge-txt" text-anchor="middle" fill="#EF4444">Limit</text>

  <rect x="760" y="90" width="175" height="70" rx="8" ry="8" fill="#7F1D1D" stroke="#EF4444" stroke-width="1.5"/>
  <text x="847" y="115" class="title-txt" text-anchor="middle" fill="#FECACA">Return HTTP 429</text>
  <text x="772" y="135" class="mono-txt" text-anchor="start">Retry-After: N sec</text>
  <text x="772" y="150" class="badge-txt" fill="#FECACA">Tenant Throttled</text>

  <!-- Success Stream to OpenAI -->
  <path d="M 675 255 L 760 255" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="685" y="242" width="60" height="18" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="715" y="255" class="edge-txt" text-anchor="middle" fill="#10B981">Allowed</text>

  <rect x="760" y="225" width="175" height="65" rx="8" ry="8" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="847" y="248" class="title-txt" text-anchor="middle" fill="#10B981">Azure OpenAI</text>
  <text x="772" y="268" class="body-txt" text-anchor="start">• Streams response</text>
  <text x="772" y="282" class="mono-txt" text-anchor="start">Reconciles token count</text>
</svg>