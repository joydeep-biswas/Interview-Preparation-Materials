<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Left: vLLM Continuous Batching Engine -->
  <rect x="25" y="25" width="450" height="290" rx="12" ry="12" fill="#0D1526" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="45" y="52" class="title-txt" fill="#93C5FD">vLLM Continuous Batching Engine (Iteration Step t)</text>

  <rect x="45" y="70" width="410" height="50" rx="6" ry="6" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="60" y="93" class="title-txt" text-anchor="start">Dynamic Iteration Scheduler</text>
  <text x="60" y="108" class="mono-txt" text-anchor="start">Token Budget: max_num_batched_tokens = 4096</text>

  <path d="M 250 120 L 250 145" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Batched Tokens Breakdown -->
  <rect x="45" y="145" width="410" height="150" rx="8" ry="8" fill="#111827" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="60" y="170" class="title-txt" text-anchor="start" fill="#C4B5FD">Batched Tokens Allocation:</text>

  <rect x="60" y="185" width="380" height="45" rx="6" ry="6" fill="#0D1526" stroke="#F59E0B" stroke-width="1"/>
  <text x="75" y="204" class="title-txt" fill="#FDE68A">Prefill Sequence A: 2048 prompt tokens</text>
  <text x="75" y="220" class="sub-txt">Compute-Bound: Saturates Tensor Cores (GEMM)</text>

  <rect x="60" y="240" width="380" height="45" rx="6" ry="6" fill="#0D1526" stroke="#06B6D4" stroke-width="1"/>
  <text x="75" y="259" class="title-txt" fill="#67E8F9">Decode Batch: 64 concurrent streams (64 tokens)</text>
  <text x="75" y="275" class="sub-txt">Memory-Bandwidth-Bound: Reads KV Cache (GEMV)</text>

  <!-- Connect Left to Decision -->
  <path d="M 475 170 L 535 170" fill="none" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- Decision / Branches on Right -->
  <!-- Branch 1: Chunked Prefill Enabled -->
  <path d="M 535 170 L 565 170 Q 580 170 580 125 L 600 125" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="525" y="125" width="60" height="18" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="555" y="138" class="edge-txt" text-anchor="middle" fill="#10B981">Enabled</text>

  <rect x="600" y="70" width="335" height="105" rx="10" ry="10" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="615" y="96" class="title-txt" fill="#A7F3D0">✓ Chunked Prefill Enabled (--enable-chunked-prefill)</text>
  <text x="615" y="118" class="body-txt">• Slices long 2048-token prompt into 512 chunks</text>
  <text x="615" y="136" class="body-txt">• Co-schedules prefill chunks alongside active decodes</text>
  <text x="615" y="154" class="badge-txt" fill="#10B981">Stable Inter-Token Latency (ITL) &amp; High Throughput!</text>

  <!-- Branch 2: Chunked Prefill Disabled -->
  <path d="M 535 170 L 565 170 Q 580 170 580 235 L 600 235" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <rect x="525" y="195" width="60" height="18" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="555" y="208" class="edge-txt" text-anchor="middle" fill="#EF4444">Disabled</text>

  <rect x="600" y="195" width="335" height="105" rx="10" ry="10" fill="#7F1D1D" stroke="#EF4444" stroke-width="1.5"/>
  <text x="615" y="221" class="title-txt" fill="#FECACA">❌ Naive Non-Chunked Prefill (Head-of-Line Blocking)</text>
  <text x="615" y="243" class="body-txt">• Long prompt monopolizes iteration compute for 400ms</text>
  <text x="615" y="261" class="body-txt">• Active streaming users experience severe stutter / stall</text>
  <text x="615" y="279" class="mono-txt">Catastrophic ITL spikes (p99 latency blows up!)</text>
</svg>