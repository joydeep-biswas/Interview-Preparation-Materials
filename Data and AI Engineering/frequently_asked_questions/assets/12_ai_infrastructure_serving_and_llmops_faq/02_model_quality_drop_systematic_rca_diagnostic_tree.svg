<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Alert Header -->
  <rect x="250" y="20" width="460" height="50" rx="8" ry="8" fill="#7F1D1D" stroke="#EF4444" stroke-width="1.5"/>
  <text x="480" y="44" class="title-txt" text-anchor="middle" fill="#FECACA">🚨 Quality Drop Reported (Zero Code Changes)</text>
  <text x="480" y="58" class="sub-txt" text-anchor="middle">Systematic 4-Step Root Cause Diagnostic Tree</text>

  <!-- Connect down to 4 diagnostic pillars -->
  <path d="M 480 70 L 480 90" fill="none" stroke="#EF4444" stroke-width="1.5"/>
  <path d="M 480 90 L 130 90 Q 115 90 115 105 L 115 120" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M 480 90 L 360 90 Q 345 90 345 105 L 345 120" fill="none" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <path d="M 480 90 L 600 90 Q 615 90 615 105 L 615 120" fill="none" stroke="#EC4899" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <path d="M 480 90 L 830 90 Q 845 90 845 105 L 845 120" fill="none" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- Step 1: Model Versioning -->
  <rect x="25" y="120" width="210" height="210" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="130" y="146" class="title-txt" text-anchor="middle">Step 1: Model Version</text>
  <text x="37" y="172" class="body-txt" text-anchor="start">• Was an unpinned alias</text>
  <text x="37" y="190" class="mono-txt" text-anchor="start">  used (e.g. 'gpt-4o')?</text>
  <text x="37" y="215" class="title-txt" fill="#38BDF8">Root Cause:</text>
  <text x="37" y="235" class="body-txt" text-anchor="start">• Provider rolled alias to</text>
  <text x="37" y="253" class="body-txt" text-anchor="start">  a new snapshot checkpoint</text>
  <text x="37" y="280" class="title-txt" fill="#10B981">Fix:</text>
  <text x="37" y="298" class="mono-txt" text-anchor="start">Pin date: 'gpt-4o-2024-08-06'</text>

  <!-- Step 2: Prompt Payload -->
  <rect x="255" y="120" width="210" height="210" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="360" y="146" class="title-txt" text-anchor="middle">Step 2: Prompt Template</text>
  <text x="267" y="172" class="body-txt" text-anchor="start">• Did prompt variable</text>
  <text x="267" y="190" class="mono-txt" text-anchor="start">  templates fail or change?</text>
  <text x="267" y="215" class="title-txt" fill="#FDE68A">Root Cause:</text>
  <text x="267" y="235" class="body-txt" text-anchor="start">• Upstream microservice</text>
  <text x="267" y="253" class="body-txt" text-anchor="start">  passed NULL variables</text>
  <text x="267" y="280" class="title-txt" fill="#10B981">Fix:</text>
  <text x="267" y="298" class="body-txt" text-anchor="start">Schema validation on input</text>

  <!-- Step 3: Vector DB & Retrieval -->
  <rect x="485" y="120" width="225" height="210" rx="10" ry="10" fill="#111827" stroke="#EC4899" stroke-width="1.5"/>
  <text x="597" y="146" class="title-txt" text-anchor="middle">Step 3: Vector Layer</text>
  <text x="497" y="172" class="body-txt" text-anchor="start">• Did retrieval recall or</text>
  <text x="497" y="190" class="mono-txt" text-anchor="start">  vector score collapse?</text>
  <text x="497" y="215" class="title-txt" fill="#FBCFE8">Root Cause:</text>
  <text x="497" y="235" class="body-txt" text-anchor="start">• Embedding API updated</text>
  <text x="497" y="253" class="body-txt" text-anchor="start">• Failed nightly ETL sync</text>
  <text x="497" y="280" class="title-txt" fill="#10B981">Fix:</text>
  <text x="497" y="298" class="body-txt" text-anchor="start">Rebuild HNSW index</text>

  <!-- Step 4: Sampling Drift -->
  <rect x="730" y="120" width="205" height="210" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="832" y="146" class="title-txt" text-anchor="middle">Step 4: Config Drift</text>
  <text x="742" y="172" class="body-txt" text-anchor="start">• Gateway sampling change?</text>
  <text x="742" y="190" class="mono-txt" text-anchor="start">  temp / max_tokens drift</text>
  <text x="742" y="215" class="title-txt" fill="#C4B5FD">Root Cause:</text>
  <text x="742" y="235" class="body-txt" text-anchor="start">• Gateway reset temp to 1.0</text>
  <text x="742" y="253" class="body-txt" text-anchor="start">• Response truncated</text>
  <text x="742" y="280" class="title-txt" fill="#10B981">Fix:</text>
  <text x="742" y="298" class="body-txt" text-anchor="start">Config as code in Git</text>
</svg>