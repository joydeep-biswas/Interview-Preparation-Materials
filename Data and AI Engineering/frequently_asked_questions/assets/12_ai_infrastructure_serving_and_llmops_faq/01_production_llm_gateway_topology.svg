<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19"/>

  <!-- Tier 1: Ingress & Security -->
  <rect x="25" y="25" width="170" height="310" rx="10" ry="10" fill="#0D1526" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="40" y="50" class="title-txt" fill="#93C5FD">1. Ingress &amp; Security</text>

  <rect x="35" y="70" width="150" height="70" rx="8" ry="8" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="110" y="94" class="title-txt" text-anchor="middle">API Gateway</text>
  <text x="45" y="116" class="body-txt" text-anchor="start">• Envoy / APIM</text>
  <text x="45" y="130" class="mono-txt" text-anchor="start">WAF &amp; TLS 1.3</text>

  <rect x="35" y="155" width="150" height="70" rx="8" ry="8" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="110" y="178" class="title-txt" text-anchor="middle">Rate Limiter</text>
  <text x="45" y="200" class="body-txt" text-anchor="start">• Token bucket RPM</text>
  <text x="45" y="214" class="body-txt" text-anchor="start">• TPM reservation</text>

  <rect x="35" y="240" width="150" height="75" rx="8" ry="8" fill="#111827" stroke="#EF4444" stroke-width="1.5"/>
  <text x="110" y="262" class="title-txt" text-anchor="middle" fill="#FCA5A5">Input Guardrail</text>
  <text x="45" y="284" class="body-txt" text-anchor="start">• Prompt injection</text>
  <text x="45" y="300" class="body-txt" text-anchor="start">• PII redaction</text>

  <path d="M 195 180 L 225 180" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Tier 2: LLM Gateway -->
  <rect x="225" y="25" width="190" height="310" rx="10" ry="10" fill="#0D1526" stroke="#10B981" stroke-width="1.5"/>
  <text x="240" y="50" class="title-txt" fill="#6EE7B7">2. Core LLM Gateway</text>

  <rect x="235" y="70" width="170" height="95" rx="8" ry="8" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="320" y="94" class="title-txt" text-anchor="middle" fill="#10B981">Semantic Cache</text>
  <text x="245" y="116" class="mono-txt" text-anchor="start">Redis / Qdrant</text>
  <text x="245" y="134" class="body-txt" text-anchor="start">• Sim &gt; 0.96: Hit &lt; 15ms</text>
  <text x="245" y="150" class="badge-txt" fill="#10B981">✓ Bypasses LLM Call</text>

  <rect x="235" y="180" width="170" height="135" rx="8" ry="8" fill="#111827" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="320" y="204" class="title-txt" text-anchor="middle" fill="#C4B5FD">Dynamic Router</text>
  <text x="245" y="226" class="body-txt" text-anchor="start">• LiteLLM / Portkey</text>
  <text x="245" y="244" class="body-txt" text-anchor="start">• Circuit breaker logic</text>
  <text x="245" y="262" class="body-txt" text-anchor="start">• Model fallback ladder</text>
  <text x="245" y="280" class="mono-txt" text-anchor="start">Prompt template engine</text>

  <path d="M 415 240 L 445 240" fill="none" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- Tier 3: Model Serving -->
  <rect x="445" y="25" width="220" height="310" rx="10" ry="10" fill="#0D1526" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="460" y="50" class="title-txt" fill="#C4B5FD">3. Model Execution</text>

  <rect x="455" y="70" width="200" height="65" rx="8" ry="8" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="555" y="92" class="title-txt" text-anchor="middle">Primary Provider</text>
  <text x="465" y="112" class="mono-txt" text-anchor="start">GPT-4o / Claude 3.5</text>

  <rect x="455" y="150" width="200" height="65" rx="8" ry="8" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="555" y="172" class="title-txt" text-anchor="middle" fill="#FDE68A">Fallback Provider</text>
  <text x="465" y="192" class="mono-txt" text-anchor="start">Azure OpenAI / Bedrock</text>

  <rect x="455" y="230" width="200" height="85" rx="8" ry="8" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="555" y="252" class="title-txt" text-anchor="middle" fill="#A7F3D0">Self-Hosted vLLM</text>
  <text x="465" y="272" class="mono-txt" text-anchor="start">H100 GPU Cluster</text>
  <text x="465" y="290" class="body-txt" text-anchor="start">• Low-latency private VPC</text>

  <path d="M 665 180 L 695 180" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Tier 4: Egress & Observability -->
  <rect x="695" y="25" width="240" height="310" rx="10" ry="10" fill="#0D1526" stroke="#EC4899" stroke-width="1.5"/>
  <text x="710" y="50" class="title-txt" fill="#FBCFE8">4. Egress &amp; Flywheel</text>

  <rect x="705" y="70" width="220" height="70" rx="8" ry="8" fill="#111827" stroke="#EC4899" stroke-width="1.5"/>
  <text x="815" y="94" class="title-txt" text-anchor="middle">Output Guardrail</text>
  <text x="715" y="116" class="body-txt" text-anchor="start">• Hallucination &amp; toxicity check</text>
  <text x="715" y="130" class="mono-txt" text-anchor="start">SSE token streaming</text>

  <rect x="705" y="155" width="220" height="70" rx="8" ry="8" fill="#111827" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="815" y="178" class="title-txt" text-anchor="middle">OpenTelemetry Tracing</text>
  <text x="715" y="200" class="body-txt" text-anchor="start">• OpenInference spans</text>
  <text x="715" y="214" class="mono-txt" text-anchor="start">Langfuse / Phoenix spans</text>

  <rect x="705" y="240" width="220" height="75" rx="8" ry="8" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="815" y="262" class="title-txt" text-anchor="middle" fill="#A7F3D0">FinOps &amp; Online Eval</text>
  <text x="715" y="284" class="body-txt" text-anchor="start">• Token cost attribution</text>
  <text x="715" y="300" class="body-txt" text-anchor="start">• Real-time TruLens sampling</text>
</svg>