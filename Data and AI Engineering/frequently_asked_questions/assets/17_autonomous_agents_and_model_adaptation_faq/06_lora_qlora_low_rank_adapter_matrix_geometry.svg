<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19"/>

  <!-- Left: Frozen Base Weights W_0 -->
  <rect x="30" y="40" width="360" height="200" rx="10" ry="10" fill="#0D1526" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="50" y="66" class="title-txt" fill="#93C5FD">Frozen Pre-trained Weights: W_0</text>
  <rect x="50" y="85" width="320" height="50" rx="6" ry="6" fill="#111827" stroke="#3B82F6" stroke-width="1"/>
  <text x="60" y="108" class="mono-txt">Tensor W_0 [d x k] (e.g. 4096 x 4096)</text>
  <text x="60" y="124" class="sub-txt">16M parameters (FP16 or NF4 in QLoRA)</text>
  <text x="50" y="160" class="body-txt">• Frozen during adaptation: Zero gradients calculated</text>
  <text x="50" y="180" class="body-txt">• Base model stays pristine &amp; unmodified</text>
  <text x="50" y="215" class="badge-txt" fill="#38BDF8">Static Base Knowledge</text>

  <!-- Plus Sign -->
  <text x="440" y="145" class="title-txt" font-size="28" text-anchor="middle" fill="#8B5CF6">+</text>

  <!-- Right: Low-Rank Adapter Matrices -->
  <rect x="490" y="40" width="440" height="200" rx="10" ry="10" fill="#0D1F1C" stroke="#10B981" stroke-width="1.5"/>
  <text x="510" y="66" class="title-txt" fill="#6EE7B7">Trainable Low-Rank Matrices: B * A</text>
  <rect x="510" y="85" width="195" height="50" rx="6" ry="6" fill="#111827" stroke="#10B981" stroke-width="1"/>
  <text x="520" y="108" class="mono-txt">Matrix B [d x r]</text>
  <text x="520" y="124" class="sub-txt">Initialized to 0</text>

  <rect x="715" y="85" width="195" height="50" rx="6" ry="6" fill="#111827" stroke="#10B981" stroke-width="1"/>
  <text x="725" y="108" class="mono-txt">Matrix A [r x k]</text>
  <text x="725" y="124" class="sub-txt">Gaussian random</text>

  <text x="510" y="160" class="mono-txt">Rank r = 16 &lt;&lt; d (4096)</text>
  <text x="510" y="180" class="body-txt">• Parameters: 2 * 4096 * 16 = 131k (0.8% of full W_0!)</text>
  <text x="510" y="200" class="body-txt">• Output: h = W_0*x + (alpha/r)*B*A*x</text>
  <text x="510" y="225" class="badge-txt" fill="#10B981">✓ 100x Less Trainable Memory</text>
</svg>