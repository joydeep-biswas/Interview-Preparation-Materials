<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19"/>

  <!-- Left: Traditional RAG -->
  <rect x="25" y="30" width="380" height="240" rx="10" ry="10" fill="#0D1526" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="45" y="55" class="title-txt" fill="#93C5FD">Traditional RAG / LLM (Linear DAG)</text>
  <rect x="45" y="75" width="340" height="35" rx="6" ry="6" fill="#111827" stroke="#3B82F6" stroke-width="1"/>
  <text x="55" y="97" class="body-txt">1. User Query Received</text>
  <rect x="45" y="120" width="340" height="35" rx="6" ry="6" fill="#111827" stroke="#3B82F6" stroke-width="1"/>
  <text x="55" y="142" class="body-txt">2. Vector DB Retrieval (Top-K Chunks)</text>
  <rect x="45" y="165" width="340" height="35" rx="6" ry="6" fill="#111827" stroke="#3B82F6" stroke-width="1"/>
  <text x="55" y="187" class="body-txt">3. Prompt Grounding &amp; LLM Call</text>
  <rect x="45" y="210" width="340" height="40" rx="6" ry="6" fill="#111827" stroke="#3B82F6" stroke-width="1"/>
  <text x="55" y="232" class="badge-txt" fill="#38BDF8">Static Linear Execution (Zero Self-Correction)</text>

  <path d="M 405 150 L 465 150" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Right: Autonomous Agent -->
  <rect x="465" y="30" width="470" height="240" rx="10" ry="10" fill="#0D1F1C" stroke="#10B981" stroke-width="1.5"/>
  <text x="485" y="55" class="title-txt" fill="#6EE7B7">Autonomous AI Agent (Cyclical MAPE-K Loop)</text>
  <rect x="485" y="75" width="430" height="35" rx="6" ry="6" fill="#111827" stroke="#10B981" stroke-width="1"/>
  <text x="495" y="97" class="body-txt">1. Reasoning &amp; Decomposition (Formulates sub-tasks)</text>
  <rect x="485" y="115" width="430" height="35" rx="6" ry="6" fill="#111827" stroke="#10B981" stroke-width="1"/>
  <text x="495" y="137" class="body-txt">2. Action Execution (Calls external APIs, DBs, shell)</text>
  <rect x="485" y="155" width="430" height="35" rx="6" ry="6" fill="#111827" stroke="#10B981" stroke-width="1"/>
  <text x="495" y="177" class="body-txt">3. Environment Observation (Parses stdout, JSON output)</text>
  <rect x="485" y="195" width="430" height="55" rx="6" ry="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="495" y="218" class="title-txt" fill="#A7F3D0">4. Reflection &amp; Self-Correction</text>
  <text x="495" y="235" class="mono-txt">If error: replans and re-executes automatically!</text>
</svg>