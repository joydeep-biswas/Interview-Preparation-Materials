<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Task Ingress -->
  <rect x="25" y="100" width="140" height="70" rx="8" ry="8" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="95" y="128" class="title-txt" text-anchor="middle">Incoming Task</text>
  <text x="95" y="148" class="sub-txt" text-anchor="middle">User goal / prompt</text>

  <path d="M 165 135 L 210 135" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Generator -->
  <rect x="210" y="90" width="160" height="90" rx="8" ry="8" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="290" y="118" class="title-txt" text-anchor="middle">Generator Agent</text>
  <text x="220" y="140" class="body-txt">• Synthesizes plan</text>
  <text x="220" y="158" class="mono-txt">Produces Tool Call</text>

  <path d="M 370 135 L 420 135" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Evaluator Diamond -->
  <polygon points="490,90 560,135 490,180 420,135" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="490" y="130" class="title-txt" text-anchor="middle">Evaluator</text>
  <text x="490" y="146" class="sub-txt" text-anchor="middle">Assertions?</text>

  <!-- Pass Branch -->
  <path d="M 560 135 L 630 135" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="565" y="122" width="50" height="18" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="590" y="135" class="edge-txt" text-anchor="middle" fill="#10B981">PASS</text>

  <rect x="630" y="105" width="180" height="60" rx="8" ry="8" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="720" y="130" class="title-txt" text-anchor="middle" fill="#A7F3D0">Success Payload</text>
  <text x="720" y="148" class="badge-txt" text-anchor="middle" fill="#10B981">✓ Task Verified</text>

  <!-- Fail Branch Down to Cycle Detector -->
  <path d="M 490 180 L 490 220" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <rect x="495" y="190" width="45" height="18" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="517" y="203" class="edge-txt" text-anchor="middle" fill="#EF4444">FAIL</text>

  <rect x="390" y="220" width="200" height="70" rx="8" ry="8" fill="#111827" stroke="#EC4899" stroke-width="1.5"/>
  <text x="490" y="244" class="title-txt" text-anchor="middle" fill="#FBCFE8">Cycle Detector</text>
  <text x="400" y="264" class="body-txt">• Duplicate tool call?</text>
  <text x="400" y="278" class="mono-txt">Step count &gt; 5 max limit?</text>

  <!-- Reflexion Loop back to Generator -->
  <path d="M 390 255 L 290 255 Q 275 255 275 240 L 275 190" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="300" y="242" width="75" height="18" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="337" y="255" class="edge-txt" text-anchor="middle" fill="#38BDF8">NO: Reflexion</text>

  <!-- Escalate / Exit -->
  <path d="M 590 255 L 670 255" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <rect x="600" y="242" width="60" height="18" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="630" y="255" class="edge-txt" text-anchor="middle" fill="#EF4444">CYCLE</text>

  <rect x="670" y="225" width="220" height="60" rx="8" ry="8" fill="#7F1D1D" stroke="#EF4444" stroke-width="1.5"/>
  <text x="780" y="248" class="title-txt" text-anchor="middle" fill="#FECACA">Human Escalate / Exit</text>
  <text x="780" y="266" class="sub-txt" text-anchor="middle">Graceful circuit breaker</text>
</svg>