<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Agent Layer -->
  <rect x="25" y="40" width="340" height="220" rx="10" ry="10" fill="#0D1526" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="45" y="66" class="title-txt" fill="#93C5FD">1. Client-Side Idempotency Generation</text>
  <rect x="45" y="85" width="300" height="40" rx="6" ry="6" fill="#111827" stroke="#3B82F6" stroke-width="1"/>
  <text x="55" y="108" class="body-txt">Root Agent starts financial deduction task</text>
  <rect x="45" y="135" width="300" height="50" rx="6" ry="6" fill="#111827" stroke="#3B82F6" stroke-width="1"/>
  <text x="55" y="156" class="mono-txt">idempotency_key = UUIDv5(task_id, step_idx)</text>
  <text x="55" y="172" class="sub-txt">Deterministic cryptographic seed</text>
  <rect x="45" y="195" width="300" height="40" rx="6" ry="6" fill="#111827" stroke="#3B82F6" stroke-width="1"/>
  <text x="55" y="218" class="body-txt">Attaches key to MCP tool call request payload</text>

  <path d="M 365 150 L 425 150" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- MCP Server Layer -->
  <rect x="425" y="40" width="510" height="220" rx="10" ry="10" fill="#0D1F1C" stroke="#10B981" stroke-width="1.5"/>
  <text x="445" y="66" class="title-txt" fill="#6EE7B7">2. MCP Server 2-Phase Check &amp; Unique DB Constraint</text>
  <rect x="445" y="85" width="470" height="45" rx="6" ry="6" fill="#111827" stroke="#F59E0B" stroke-width="1"/>
  <text x="455" y="106" class="title-txt" fill="#FDE68A">Phase 1: SELECT * FROM ledger WHERE idempotency_key = ?</text>
  <text x="455" y="122" class="body-txt">If found: Immediately return cached HTTP 200 without charging!</text>

  <rect x="445" y="140" width="470" height="55" rx="6" ry="6" fill="#111827" stroke="#10B981" stroke-width="1"/>
  <text x="455" y="162" class="title-txt" fill="#A7F3D0">Phase 2: Atomic Database Insert</text>
  <text x="455" y="180" class="mono-txt">INSERT INTO ledger ... UNIQUE CONSTRAINT (idempotency_key)</text>

  <rect x="445" y="205" width="470" height="40" rx="6" ry="6" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="455" y="228" class="badge-txt" fill="#A7F3D0">✓ Impossible to double-charge even on network timeout / retries!</text>
</svg>