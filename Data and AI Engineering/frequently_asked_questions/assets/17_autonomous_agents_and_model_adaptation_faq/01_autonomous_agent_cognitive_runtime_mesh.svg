<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Tier 1: Cognitive Loop -->
  <rect x="25" y="25" width="360" height="330" rx="12" ry="12" fill="#0D1526" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="45" y="52" class="title-txt" fill="#93C5FD">1. Cognitive Agent Runtime (ReAct)</text>
  <rect x="45" y="70" width="320" height="45" rx="6" ry="6" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="55" y="94" class="title-txt">Plan &amp; Reasoning Synthesis (LLM)</text>

  <path d="M 205 115 L 205 135" fill="none" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <polygon points="205,135 295,165 205,195 115,165" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="205" y="160" class="title-txt" text-anchor="middle">Tool Decision?</text>

  <path d="M 115 165 L 75 165 Q 60 165 60 180 L 60 215" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M 205 195 L 205 215" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M 295 165 L 335 165 Q 350 165 350 180 L 350 215" fill="none" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <rect x="45" y="215" width="90" height="50" rx="6" ry="6" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="90" y="238" class="title-txt" text-anchor="middle">MCP Gateway</text>
  <text x="90" y="254" class="mono-txt" text-anchor="middle">Tools / APIs</text>

  <rect x="150" y="215" width="110" height="50" rx="6" ry="6" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="205" y="238" class="title-txt" text-anchor="middle" fill="#A7F3D0">Code Sandbox</text>
  <text x="205" y="254" class="mono-txt" text-anchor="middle">gVisor / Docker</text>

  <rect x="275" y="215" width="95" height="50" rx="6" ry="6" fill="#111827" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="322" y="238" class="title-txt" text-anchor="middle" fill="#C4B5FD">Response</text>
  <text x="322" y="254" class="mono-txt" text-anchor="middle">Direct Output</text>

  <rect x="45" y="285" width="320" height="50" rx="6" ry="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="205" y="308" class="title-txt" text-anchor="middle" fill="#A7F3D0">Evaluator-Optimizer &amp; Reflexion Check</text>
  <text x="205" y="324" class="badge-txt" text-anchor="middle" fill="#10B981">✓ Breaks infinite loops | Self-corrects</text>

  <!-- Connect Cognitive to State & Adaptation -->
  <path d="M 385 110 L 425 110" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M 385 270 L 425 270" fill="none" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- Tier 2: State & Memory -->
  <rect x="425" y="25" width="240" height="330" rx="12" ry="12" fill="#0D1526" stroke="#10B981" stroke-width="1.5"/>
  <text x="445" y="52" class="title-txt" fill="#6EE7B7">2. Memory Persistence</text>
  <rect x="445" y="70" width="200" height="70" rx="6" ry="6" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="455" y="94" class="title-txt">Working Scratchpad</text>
  <text x="455" y="112" class="sub-txt">Context window messages</text>
  <text x="455" y="126" class="mono-txt">Active state checkpoint</text>

  <rect x="445" y="155" width="200" height="80" rx="6" ry="6" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="455" y="178" class="title-txt" fill="#A7F3D0">Episodic Checkpointer</text>
  <text x="455" y="196" class="body-txt">• PostgreSQL / SQLite</text>
  <text x="455" y="212" class="mono-txt">LangGraph persistent threads</text>

  <rect x="445" y="250" width="200" height="80" rx="6" ry="6" fill="#111827" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="455" y="274" class="title-txt" fill="#C4B5FD">Semantic Vector Store</text>
  <text x="455" y="292" class="body-txt">• Qdrant / Chroma</text>
  <text x="455" y="308" class="mono-txt">Long-term episodic memories</text>

  <!-- Connect Memory to Adaptation -->
  <path d="M 665 190 L 705 190" fill="none" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- Tier 3: Model Adaptation -->
  <rect x="705" y="25" width="230" height="330" rx="12" ry="12" fill="#0D1526" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="725" y="52" class="title-txt" fill="#C4B5FD">3. Model Adaptation</text>
  <rect x="720" y="70" width="200" height="70" rx="6" ry="6" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="730" y="94" class="title-txt">Foundation LLM</text>
  <text x="730" y="112" class="sub-txt">Base model weights (W_0)</text>

  <rect x="720" y="155" width="200" height="80" rx="6" ry="6" fill="#111827" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="730" y="178" class="title-txt" fill="#C4B5FD">LoRA / QLoRA PEFT</text>
  <text x="730" y="196" class="mono-txt">W = W_0 + (alpha/r)*B*A</text>
  <text x="730" y="212" class="body-txt">• Task-specific adapters</text>

  <rect x="720" y="250" width="200" height="80" rx="6" ry="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="730" y="274" class="title-txt" fill="#A7F3D0">DPO Alignment</text>
  <text x="730" y="292" class="body-txt">• Direct preference loss</text>
  <text x="730" y="308" class="badge-txt" fill="#10B981">✓ Aligned on Tool Accuracy</text>
</svg>