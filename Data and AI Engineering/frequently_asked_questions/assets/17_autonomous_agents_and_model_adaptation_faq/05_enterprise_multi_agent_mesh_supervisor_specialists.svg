<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
  </defs>
  <style>
    .title-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; }
    .sub-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #94A3B8; }
    .body-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #CBD5E1; }
    .mono-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #93C5FD; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    .edge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #E2E8F0; }
  </style>
  <rect width="100%" height="100%" fill="#0B0F19" rx="10" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Supervisor Agent -->
  <rect x="360" y="20" width="240" height="70" rx="10" ry="10" fill="#0D1526" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="480" y="46" class="title-txt" text-anchor="middle" fill="#C4B5FD">Supervisor Agent</text>
  <text x="480" y="66" class="sub-txt" text-anchor="middle">Task Router &amp; State Aggregator</text>

  <!-- Fan-out Connectors -->
  <path d="M 360 55 L 145 55 Q 130 55 130 75 L 130 115" fill="none" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M 440 90 L 440 100 Q 440 115 410 115 L 380 115" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M 520 90 L 520 100 Q 520 115 550 115 L 580 115" fill="none" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <path d="M 600 55 L 815 55 Q 830 55 830 75 L 830 115" fill="none" stroke="#EC4899" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- 4 Specialist Agents -->
  <rect x="25" y="115" width="210" height="175" rx="8" ry="8" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="130" y="140" class="title-txt" text-anchor="middle">Data Engineer</text>
  <text x="37" y="165" class="body-txt">• BigQuery / Snowflake</text>
  <text x="37" y="185" class="body-txt">• SQL partition scans</text>
  <text x="37" y="205" class="mono-txt">MCP Tool: run_query</text>
  <text x="37" y="260" class="badge-txt" fill="#38BDF8">Data Extraction</text>

  <rect x="255" y="115" width="210" height="175" rx="8" ry="8" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="360" y="140" class="title-txt" text-anchor="middle" fill="#A7F3D0">Code Interpreter</text>
  <text x="267" y="165" class="body-txt">• Python sandbox runner</text>
  <text x="267" y="185" class="body-txt">• Pandas / Scipy / Stats</text>
  <text x="267" y="205" class="mono-txt">MCP Tool: exec_py</text>
  <text x="267" y="260" class="badge-txt" fill="#10B981">Heavy Math / Charting</text>

  <rect x="495" y="115" width="210" height="175" rx="8" ry="8" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="600" y="140" class="title-txt" text-anchor="middle" fill="#FDE68A">Research Specialist</text>
  <text x="507" y="165" class="body-txt">• Web scrape / arXiv</text>
  <text x="507" y="185" class="body-txt">• Hybrid vector search</text>
  <text x="507" y="205" class="mono-txt">MCP Tool: web_search</text>
  <text x="507" y="260" class="badge-txt" fill="#FDE68A">Domain Knowledge</text>

  <rect x="725" y="115" width="210" height="175" rx="8" ry="8" fill="#111827" stroke="#EC4899" stroke-width="1.5"/>
  <text x="830" y="140" class="title-txt" text-anchor="middle" fill="#FBCFE8">Critic / Reviewer</text>
  <text x="737" y="165" class="body-txt">• Fact-checking audit</text>
  <text x="737" y="185" class="body-txt">• Schema validation</text>
  <text x="737" y="205" class="mono-txt">MCP Tool: run_eval</text>
  <text x="737" y="260" class="badge-txt" fill="#FBCFE8">Quality Gatekeeper</text>
</svg>