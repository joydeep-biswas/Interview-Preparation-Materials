<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 700; text-anchor: middle; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .edge { stroke-width: 2; fill: none; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="1000" height="240" fill="#0B0F19"/>

  <!-- Col 1: Replayable Source -->
  <g transform="translate(30, 45)">
    <rect width="280" height="150" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <text x="140" y="32" class="title" fill="#93C5FD">1. Replayable Source (Kafka)</text>
    <line x1="15" y1="44" x2="265" y2="44" stroke="#1F2937" stroke-width="1.5"/>
    <text x="20" y="70" class="body-txt">• Deterministic offset indexing</text>
    <text x="20" y="92" class="body-txt">• Configurable retention (7d)</text>
    <text x="20" y="114" class="body-txt">• Partition consumer cursors</text>
    <text x="20" y="136" class="body-txt">• Allows identical replay on failure</text>
  </g>

  <path fill="none" d="M 310 120 L 360 120" class="edge" stroke="#3B82F6" marker-end="url(#arr-blue)"/>

  <!-- Col 2: Deterministic Engine -->
  <g transform="translate(360, 45)">
    <rect width="280" height="150" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <text x="140" y="32" class="title" fill="#FCD34D">2. Deterministic Engine (Spark)</text>
    <line x1="15" y1="44" x2="265" y2="44" stroke="#1F2937" stroke-width="1.5"/>
    <text x="20" y="70" class="body-txt">• WAL Checkpointing (/offsets)</text>
    <text x="20" y="92" class="body-txt">• Monotonic batch IDs</text>
    <text x="20" y="114" class="body-txt">• RocksDB state persistence</text>
    <text x="20" y="136" class="body-txt">• Two-phase commit protocol</text>
  </g>

  <path fill="none" d="M 640 120 L 690 120" class="edge" stroke="#F59E0B" marker-end="url(#arr-green)"/>

  <!-- Col 3: Idempotent Sink -->
  <g transform="translate(690, 45)">
    <rect width="280" height="150" rx="10" ry="10" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
    <text x="140" y="32" class="title" fill="#A7F3D0">3. Idempotent Sink (Delta Lake)</text>
    <line x1="15" y1="44" x2="265" y2="44" stroke="#047857" stroke-width="1.5"/>
    <text x="20" y="70" class="body-txt" fill="#A7F3D0">• ACID Transaction Log (_delta_log)</text>
    <text x="20" y="92" class="body-txt" fill="#A7F3D0">• Atomic batch file commit</text>
    <text x="20" y="114" class="body-txt" fill="#A7F3D0">• Idempotent MERGE ON unique PK</text>
    <text x="20" y="136" class="body-txt" fill="#A7F3D0">• End-to-end exactly-once outcome!</text>
  </g>
</svg>
