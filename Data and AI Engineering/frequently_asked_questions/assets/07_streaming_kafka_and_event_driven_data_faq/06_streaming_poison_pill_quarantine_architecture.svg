<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 700; text-anchor: middle; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .edge { stroke-width: 1.5; fill: none; }
      .lbl { fill: #CBD5E1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; text-anchor: middle; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
  </defs>

  <rect width="1000" height="320" fill="#0B0F19"/>

  <!-- Left: Ingress Batch -->
  <g transform="translate(30, 105)">
    <rect width="210" height="110" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <text x="105" y="32" class="title" fill="#93C5FD">Incoming Micro-Batch</text>
    <line x1="15" y1="44" x2="195" y2="44" stroke="#1F2937" stroke-width="1.5"/>
    <text x="105" y="68" class="body-txt" text-anchor="middle">Mixed Payloads</text>
    <text x="105" y="88" class="body-txt" text-anchor="middle">Valid + Corrupt Poison Pills</text>
  </g>

  <path fill="none" d="M 240 160 L 290 160" class="edge" stroke="#3B82F6" marker-end="url(#arr-blue)"/>

  <!-- Middle: Schema Validation -->
  <g transform="translate(290, 105)">
    <rect width="250" height="110" rx="8" ry="8" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <text x="125" y="32" class="title" fill="#C4B5FD">Validate &amp; Parse</text>
    <line x1="15" y1="44" x2="235" y2="44" stroke="#1F2937" stroke-width="1.5"/>
    <text x="125" y="68" class="body-txt" text-anchor="middle">from_json(column, schema)</text>
    <text x="125" y="88" class="body-txt" text-anchor="middle">Permissive mode captures errors</text>
  </g>

  <!-- Connectors with straight runways -->
  <path fill="none" d="M 540 145 L 580 145 C 600 145, 610 75, 630 75 L 650 75" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>
  <text x="590" y="65" class="lbl" fill="#6EE7B7">Valid</text>

  <path fill="none" d="M 540 175 L 580 175 C 600 175, 610 245, 630 245 L 650 245" class="edge" stroke="#EF4444" marker-end="url(#arr-red)"/>
  <text x="590" y="260" class="lbl" fill="#FCA5A5">Corrupt</text>

  <!-- Branch 1: Silver (Green) -->
  <g transform="translate(650, 30)">
    <rect width="320" height="90" rx="8" ry="8" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
    <text x="160" y="28" class="title" fill="#A7F3D0">Silver Production Table</text>
    <line x1="15" y1="38" x2="305" y2="38" stroke="#047857" stroke-width="1"/>
    <text x="15" y="58" class="body-txt" fill="#A7F3D0">• Clean validated business entities</text>
    <text x="15" y="74" class="body-txt" fill="#A7F3D0">• Continuous stream processing never blocked</text>
  </g>

  <!-- Branch 2: Quarantine (Red) -->
  <g transform="translate(650, 200)">
    <rect width="320" height="90" rx="8" ry="8" fill="#7F1D1D" stroke="#EF4444" stroke-width="2"/>
    <text x="160" y="28" class="title" fill="#FECACA">bronze_quarantine (DLQ)</text>
    <line x1="15" y1="38" x2="305" y2="38" stroke="#991B1B" stroke-width="1"/>
    <text x="15" y="58" class="body-txt" fill="#FECACA">• Raw payload + parse exception stack trace</text>
    <text x="15" y="74" class="body-txt" fill="#FCA5A5">• Isolated for engineer inspection &amp; replay</text>
  </g>
</svg>
