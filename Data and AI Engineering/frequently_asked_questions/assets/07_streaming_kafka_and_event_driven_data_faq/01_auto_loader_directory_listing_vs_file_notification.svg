<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 700; text-anchor: middle; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .edge { stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="1000" height="360" fill="#0B0F19"/>

  <!-- Left: Mode A (Amber) -->
  <g transform="translate(30, 25)">
    <rect width="450" height="310" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <text x="225" y="28" class="title" fill="#FCD34D">Mode A: Directory Listing (Synchronous Crawl)</text>
    <line x1="20" y1="38" x2="430" y2="38" stroke="#1F2937" stroke-width="1.5"/>

    <rect x="25" y="55" width="180" height="60" rx="8" ry="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="115" y="80" class="title" font-size="11" fill="#FCD34D">Spark Driver</text>
    <text x="115" y="98" class="body-txt" text-anchor="middle">Issues ListBlobs</text>

    <path fill="none" d="M 205 85 L 255 85" class="edge" stroke="#F59E0B" marker-end="url(#arr-amber)"/>

    <rect x="255" y="55" width="170" height="60" rx="8" ry="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="340" y="80" class="title" font-size="11" fill="#FCD34D">Cloud Storage API</text>
    <text x="340" y="98" class="body-txt" text-anchor="middle">ADLS / S3 List API</text>

    <path fill="none" d="M 340 115 L 340 140 C 340 160, 245 160, 245 180" class="edge" stroke="#F59E0B" marker-end="url(#arr-amber)"/>

    <rect x="135" y="180" width="220" height="60" rx="8" ry="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="245" y="205" class="title" font-size="11" fill="#FCD34D">RocksDB State Filtering</text>
    <text x="245" y="223" class="body-txt" text-anchor="middle">O(N) metadata scan in RAM</text>

    <!-- Disadvantage note -->
    <rect x="25" y="260" width="400" height="40" rx="6" ry="6" fill="#1F2937" stroke="#EF4444" stroke-width="1"/>
    <text x="225" y="285" class="body-txt" text-anchor="middle" fill="#FCA5A5">⛔ O(N) Listing Latency: Slows down as bucket grows</text>
  </g>

  <!-- Right: Mode B (Green) -->
  <g transform="translate(520, 25)">
    <rect width="450" height="310" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <text x="225" y="28" class="title" fill="#6EE7B7">Mode B: File Notification (Event Queue)</text>
    <line x1="20" y1="38" x2="430" y2="38" stroke="#1F2937" stroke-width="1.5"/>

    <rect x="25" y="55" width="180" height="50" rx="6" ry="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="115" y="78" class="title" font-size="11" fill="#93C5FD">File Lands in Bucket</text>
    <text x="115" y="94" class="body-txt" text-anchor="middle">Blob Created Trigger</text>

    <path fill="none" d="M 205 80 L 255 80" class="edge" stroke="#3B82F6" marker-end="url(#arr-green)"/>

    <rect x="255" y="55" width="170" height="50" rx="6" ry="6" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <text x="340" y="78" class="title" font-size="11" fill="#6EE7B7">Event Grid / SNS</text>
    <text x="340" y="94" class="body-txt" text-anchor="middle">Forwards Payload</text>

    <path fill="none" d="M 340 105 L 340 135" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>

    <rect x="225" y="135" width="200" height="50" rx="6" ry="6" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <text x="325" y="158" class="title" font-size="11" fill="#6EE7B7">Storage Queue (SQS)</text>
    <text x="325" y="174" class="body-txt" text-anchor="middle">FIFO Message Queue</text>

    <path fill="none" d="M 225 160 L 165 160" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>

    <rect x="25" y="135" width="140" height="50" rx="6" ry="6" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
    <text x="95" y="158" class="title" font-size="11" fill="#A7F3D0">Auto Loader</text>
    <text x="95" y="174" class="body-txt" text-anchor="middle" fill="#A7F3D0">O(1) Queue Pull</text>

    <!-- Advantage note -->
    <rect x="25" y="260" width="400" height="40" rx="6" ry="6" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="225" y="285" class="body-txt" text-anchor="middle" fill="#A7F3D0">✅ O(1) Instant Detection: Zero LIST API cost or throttling</text>
  </g>
</svg>
