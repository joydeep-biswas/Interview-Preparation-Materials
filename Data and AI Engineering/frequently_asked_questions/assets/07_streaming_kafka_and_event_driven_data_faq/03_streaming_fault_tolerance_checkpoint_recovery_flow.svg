<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 320" width="100%" height="100%">
  <defs>
    <style>
      .title { fill: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 700; text-anchor: middle; }
      .body-txt { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .edge { stroke-width: 1.5; fill: none; }
      .lbl { fill: #CBD5E1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; text-anchor: middle; }
    </style>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="1020" height="320" fill="#0B0F19"/>

  <!-- Step 1: Crash -->
  <g transform="translate(30, 105)">
    <rect width="180" height="110" rx="10" ry="10" fill="#7F1D1D" stroke="#EF4444" stroke-width="2"/>
    <text x="90" y="32" class="title" fill="#FECACA">Stream Crash!</text>
    <line x1="15" y1="44" x2="165" y2="44" stroke="#991B1B" stroke-width="1"/>
    <text x="90" y="68" class="body-txt" text-anchor="middle">Fails during Batch 15</text>
    <text x="90" y="88" class="body-txt" text-anchor="middle" fill="#FCA5A5">Node Spot Eviction</text>
  </g>

  <path fill="none" d="M 210 160 L 255 160" class="edge" stroke="#EF4444" marker-end="url(#arr-blue)"/>

  <!-- Step 2: Restart -->
  <g transform="translate(255, 105)">
    <rect width="170" height="110" rx="8" ry="8" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <text x="85" y="32" class="title" fill="#93C5FD">Stream Restarts</text>
    <line x1="15" y1="44" x2="155" y2="44" stroke="#1F2937" stroke-width="1.5"/>
    <text x="85" y="68" class="body-txt" text-anchor="middle">Mounts checkpoint</text>
    <text x="85" y="88" class="body-txt" text-anchor="middle">Re-opens StateStore</text>
  </g>

  <path fill="none" d="M 425 160 L 470 160" class="edge" stroke="#3B82F6" marker-end="url(#arr-purple)"/>

  <!-- Step 3: Inspect Logs -->
  <g transform="translate(470, 105)">
    <rect width="200" height="110" rx="8" ry="8" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <text x="100" y="32" class="title" fill="#C4B5FD">Inspect Manifests</text>
    <line x1="15" y1="44" x2="185" y2="44" stroke="#1F2937" stroke-width="1.5"/>
    <text x="100" y="68" class="body-txt" text-anchor="middle">Check offsets/15</text>
    <text x="100" y="88" class="body-txt" text-anchor="middle">Check commits/15</text>
  </g>

  <!-- Connectors to Decisions -->
  <path fill="none" d="M 670 145 L 705 145 C 725 145, 735 75, 750 75 L 765 75" class="edge" stroke="#EF4444" marker-end="url(#arr-red)"/>
  <text x="715" y="65" class="lbl" fill="#FCA5A5">No Commit</text>

  <path fill="none" d="M 670 175 L 705 175 C 725 175, 735 245, 750 245 L 765 245" class="edge" stroke="#10B981" marker-end="url(#arr-green)"/>
  <text x="715" y="260" class="lbl" fill="#6EE7B7">Committed</text>

  <!-- Branch 1: Replay (Red) -->
  <g transform="translate(765, 30)">
    <rect width="225" height="90" rx="8" ry="8" fill="#1F2937" stroke="#EF4444" stroke-width="2"/>
    <text x="112.5" y="28" class="title" fill="#FCA5A5">Re-execute Batch 15</text>
    <line x1="15" y1="38" x2="210" y2="38" stroke="#1F2937" stroke-width="1"/>
    <text x="15" y="58" class="body-txt">• Replay exact offsets from WAL</text>
    <text x="15" y="74" class="body-txt">• Idempotent sink overwrites</text>
  </g>

  <!-- Branch 2: Next (Green) -->
  <g transform="translate(765, 200)">
    <rect width="225" height="90" rx="8" ry="8" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
    <text x="112.5" y="28" class="title" fill="#A7F3D0">Proceed to Batch 16</text>
    <line x1="15" y1="38" x2="210" y2="38" stroke="#047857" stroke-width="1"/>
    <text x="15" y="58" class="body-txt" fill="#A7F3D0">• Batch 15 already committed</text>
    <text x="15" y="74" class="body-txt" fill="#A7F3D0">• Zero duplicate processing</text>
  </g>
</svg>
