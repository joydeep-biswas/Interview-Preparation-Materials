<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" ry="12"/>

  <text x="530" y="32" class="title" font-size="20" text-anchor="middle">Cloud Native Microservices &amp; Edge API Gateway Architecture</text>
  <text x="530" y="52" class="subtitle" text-anchor="middle">Edge ingress security, service discovery, isolated polyglot storage, and asynchronous event bus</text>

  <!-- Step 1: Clients & Edge Gateway -->
  <g transform="translate(40, 75)">
    <rect width="220" height="370" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="220" height="30" rx="10" ry="10" fill="#1E3A8A"/>
    <text x="110" y="20" class="card-title" fill="#BFDBFE" text-anchor="middle">1. Edge API Gateway</text>

    <rect x="15" y="45" width="190" height="70" rx="6" ry="6" fill="#1E293B"/>
    <text x="95" y="66" class="badge" fill="#93C5FD" text-anchor="middle">Inbound Client Traffic</text>
    <text x="15" y="86" class="card-body">Mobile, Web, 3rd Parties</text>
    <text x="15" y="102" class="card-body" font-size="11">HTTPS TLS Termination</text>

    <rect x="15" y="125" width="190" height="115" rx="6" ry="6" fill="#1E293B" stroke="#3B82F6"/>
    <text x="95" y="146" class="badge" fill="#60A5FA" text-anchor="middle">Gateway Cross-Cutting</text>
    <text x="15" y="168" class="card-body">• Edge JWT Authentication</text>
    <text x="15" y="184" class="card-body">• Rate Limiting (Token Bucket)</text>
    <text x="15" y="200" class="card-body">• Request Routing &amp; CORS</text>
    <text x="15" y="218" class="badge" fill="#34D399">• WAF &amp; DDoS Defense</text>

    <rect x="15" y="250" width="190" height="85" rx="6" ry="6" fill="#0F172A"/>
    <text x="95" y="272" class="badge" fill="#93C5FD" text-anchor="middle">Dynamic Routing</text>
    <text x="15" y="292" class="card-body" font-size="11">Routes to internal service</text>
    <text x="15" y="308" class="card-body" font-size="11">instances via Service Mesh</text>
  </g>

  <!-- Step 2: Service Mesh & Discovery -->
  <g transform="translate(290, 75)">
    <rect width="230" height="370" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="230" height="30" rx="10" ry="10" fill="#92400E"/>
    <text x="115" y="20" class="card-title" fill="#FDE68A" text-anchor="middle">2. Service Mesh &amp; Registry</text>

    <rect x="15" y="45" width="200" height="90" rx="6" ry="6" fill="#1E293B"/>
    <text x="100" y="66" class="badge" fill="#FDE68A" text-anchor="middle">Service Discovery</text>
    <text x="15" y="88" class="card-body">• Kubernetes CoreDNS</text>
    <text x="15" y="104" class="card-body">• Consul / Netflix Eureka</text>
    <text x="15" y="120" class="badge" fill="#FCD34D">• Client-side load balancing</text>

    <rect x="15" y="145" width="200" height="105" rx="6" ry="6" fill="#451A03" stroke="#F59E0B"/>
    <text x="100" y="168" class="badge" fill="#FDE68A" text-anchor="middle">Envoy Sidecar Mesh</text>
    <text x="15" y="190" class="card-body">• Automatic mTLS encryption</text>
    <text x="15" y="206" class="card-body">• Distributed Tracing (OTel)</text>
    <text x="15" y="222" class="card-body" font-size="11" fill="#FDE68A">• Circuit Breaking (Resilience4j)</text>
    <text x="15" y="238" class="card-body" font-size="11" fill="#FDE68A">• Retries &amp; Timeout Budgets</text>

    <rect x="15" y="260" width="200" height="80" rx="6" ry="6" fill="#0F172A"/>
    <text x="100" y="282" class="badge" fill="#FCD34D" text-anchor="middle">Zero Trust Security</text>
    <text x="15" y="302" class="card-body" font-size="11">Every inter-service call</text>
    <text x="15" y="318" class="card-body" font-size="11">is verified with SPIFFE mTLS</text>
  </g>

  <!-- Step 3: Domain Microservices -->
  <g transform="translate(545, 75)">
    <rect width="230" height="370" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="230" height="30" rx="10" ry="10" fill="#065F46"/>
    <text x="115" y="20" class="card-title" fill="#A7F3D0" text-anchor="middle">3. Domain Services</text>

    <!-- Services stack -->
    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="200" height="55" rx="4" ry="4" fill="#1E293B" stroke="#10B981"/>
      <text x="15" y="20" class="badge" fill="#A7F3D0">Order Service</text>
      <text x="15" y="36" class="card-body" font-size="11">Spring Boot | Java 21</text>
      <text x="15" y="48" class="badge" fill="#34D399">DB: PostgreSQL (Orders)</text>

      <rect x="0" y="65" width="200" height="55" rx="4" ry="4" fill="#1E293B" stroke="#10B981"/>
      <text x="15" y="85" class="badge" fill="#A7F3D0">Payment Service</text>
      <text x="15" y="101" class="card-body" font-size="11">Spring Boot | Java 21</text>
      <text x="15" y="113" class="badge" fill="#34D399">DB: PostgreSQL (Ledger)</text>

      <rect x="0" y="130" width="200" height="55" rx="4" ry="4" fill="#1E293B" stroke="#10B981"/>
      <text x="15" y="150" class="badge" fill="#A7F3D0">Catalog Service</text>
      <text x="15" y="166" class="card-body" font-size="11">Go / Java</text>
      <text x="15" y="178" class="badge" fill="#34D399">DB: MongoDB / Redis</text>
    </g>

    <rect x="15" y="250" width="200" height="90" rx="6" ry="6" fill="#064E3B"/>
    <text x="100" y="272" class="badge" fill="#A7F3D0" text-anchor="middle">Database-per-Service Rule</text>
    <text x="15" y="294" class="card-body" font-size="11">• Strict schema autonomy</text>
    <text x="15" y="310" class="card-body" font-size="11">• NO shared DB tables!</text>
    <text x="15" y="326" class="badge" fill="#34D399">• Prevents distributed monolith</text>
  </g>

  <!-- Step 4: Asynchronous Event Bus (Kafka) -->
  <g transform="translate(800, 75)">
    <rect width="220" height="370" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="220" height="30" rx="10" ry="10" fill="#5B21B6"/>
    <text x="110" y="20" class="card-title" fill="#DDD6FE" text-anchor="middle">4. Event-Driven Backbone</text>

    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="190" height="85" rx="6" ry="6" fill="#1E293B"/>
      <text x="15" y="20" class="badge" fill="#DDD6FE">Apache Kafka Cluster</text>
      <text x="15" y="40" class="card-body">• Event Topics</text>
      <text x="15" y="56" class="card-body" font-family="monospace">order.created</text>
      <text x="15" y="70" class="card-body" font-family="monospace">payment.settled</text>

      <rect x="0" y="95" width="190" height="100" rx="6" ry="6" fill="#4C1D95" stroke="#8B5CF6"/>
      <text x="15" y="117" class="badge" fill="#DDD6FE">Choreography Sagas</text>
      <text x="15" y="137" class="card-body">• Asynchronous decoupled</text>
      <text x="15" y="153" class="card-body">  event publishing</text>
      <text x="15" y="169" class="card-body">• Compensating tx on fail</text>
      <text x="15" y="183" class="badge" fill="#34D399">Eventual Consistency</text>
    </g>

    <rect x="15" y="255" width="190" height="85" rx="6" ry="6" fill="#0F172A"/>
    <text x="95" y="278" class="badge" fill="#DDD6FE" text-anchor="middle">Outbox CDC Stream</text>
    <text x="15" y="298" class="card-body" font-size="11">Debezium tails Postgres WAL</text>
    <text x="15" y="314" class="card-body" font-size="11">to publish events with</text>
    <text x="15" y="328" class="badge" fill="#A7F3D0">zero loss guarantee</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 260 260 L 278 260 L 290 260" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  <path d="M 520 260 L 533 260 L 545 260" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M 775 260 L 788 260 L 800 260" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
</svg>