<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" ry="12"/>

  <text x="530" y="32" class="title" font-size="20" text-anchor="middle">Distributed Rate Limiting: Token Bucket vs Leaky Bucket</text>
  <text x="530" y="52" class="subtitle" text-anchor="middle">Burst tolerance vs Constant-rate smoothing algorithm mechanics in distributed systems</text>

  <!-- Left: Token Bucket -->
  <g transform="translate(40, 75)">
    <rect width="460" height="370" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="460" height="30" rx="10" ry="10" fill="#1E3A8A"/>
    <text x="230" y="20" class="card-title" fill="#BFDBFE" text-anchor="middle">Token Bucket (Allows Controlled Bursts)</text>

    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="420" height="70" rx="6" ry="6" fill="#1E293B"/>
      <text x="15" y="20" class="badge" fill="#93C5FD">1. Refill Mechanics</text>
      <text x="15" y="38" class="card-body">• Refill rate: r tokens per second</text>
      <text x="15" y="54" class="card-body">• Bucket capacity: Maximum B tokens</text>
      <text x="15" y="68" class="badge" fill="#34D399">Excess refilled tokens overflow and discard</text>

      <rect x="0" y="80" width="420" height="85" rx="6" ry="6" fill="#064E3B" stroke="#10B981"/>
      <text x="15" y="100" class="badge" fill="#A7F3D0">2. Request Processing</text>
      <text x="15" y="118" class="card-body">• Each incoming request consumes 1 token</text>
      <text x="15" y="134" class="card-body">• If tokens &gt;= 1: Request admitted immediately!</text>
      <text x="15" y="150" class="card-body">• If bucket empty: Returns HTTP 429 Too Many Requests</text>
      <text x="15" y="162" class="badge" fill="#34D399">Burst capacity = up to B instantaneous requests!</text>

      <rect x="0" y="175" width="420" height="65" rx="6" ry="6" fill="#0F172A" stroke="#3B82F6"/>
      <text x="15" y="195" class="badge" fill="#93C5FD">Redis Lua Script Implementation</text>
      <text x="15" y="215" class="card-body" font-family="monospace">current_tokens = min(B, last_tokens + (now - last_time)*r)</text>
      <text x="15" y="231" class="card-body" font-size="11">Atomic Redis eval in 1 round-trip without background timer!</text>
    </g>

    <rect x="20" y="305" width="420" height="45" rx="4" ry="4" fill="#064E3B"/>
    <text x="210" y="328" class="badge" fill="#A7F3D0" text-anchor="middle">Standard for Web APIs &amp; Gateways (Allows bursty user traffic)</text>
  </g>

  <!-- Right: Leaky Bucket -->
  <g transform="translate(560, 75)">
    <rect width="460" height="370" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="460" height="30" rx="10" ry="10" fill="#92400E"/>
    <text x="230" y="20" class="card-title" fill="#FDE68A" text-anchor="middle">Leaky Bucket (Strict Constant Egress Rate)</text>

    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="420" height="70" rx="6" ry="6" fill="#1E293B"/>
      <text x="15" y="20" class="badge" fill="#FDE68A">1. Ingress Buffer Queue</text>
      <text x="15" y="38" class="card-body">• Requests enter a FIFO queue buffer</text>
      <text x="15" y="54" class="card-body">• Queue capacity: Maximum B slots</text>
      <text x="15" y="68" class="badge" fill="#FCA5A5">If queue full: New requests overflow &amp; drop (429)</text>

      <rect x="0" y="80" width="420" height="85" rx="6" ry="6" fill="#451A03" stroke="#F59E0B"/>
      <text x="15" y="100" class="badge" fill="#FDE68A">2. Fixed Leak Egress</text>
      <text x="15" y="118" class="card-body">• Requests leak out at a strictly FIXED rate r</text>
      <text x="15" y="134" class="card-body">• Completely eliminates bursts and spikes</text>
      <text x="15" y="150" class="card-body" font-size="11">• Downstream servers receive 100% smoothed, stable load</text>
      <text x="15" y="162" class="badge" fill="#FCD34D">ZERO burst tolerance permitted!</text>

      <rect x="0" y="175" width="420" height="65" rx="6" ry="6" fill="#0F172A" stroke="#F59E0B"/>
      <text x="15" y="195" class="badge" fill="#FDE68A">Drawback: Increased Request Latency</text>
      <text x="15" y="215" class="card-body">Valid burst requests are forced to wait in queue, increasing</text>
      <text x="15" y="231" class="card-body" font-size="11">end-to-end response times.</text>
    </g>

    <rect x="20" y="305" width="420" height="45" rx="4" ry="4" fill="#451A03"/>
    <text x="210" y="328" class="badge" fill="#FDE68A" text-anchor="middle">Standard for Network Traffic Shaping &amp; Fragile Downstream DBs</text>
  </g>
</svg>