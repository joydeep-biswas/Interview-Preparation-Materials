<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" ry="12"/>

  <text x="530" y="32" class="title" font-size="20" text-anchor="middle">Distributed Idempotent Payment Processing Pipeline</text>
  <text x="530" y="52" class="subtitle" text-anchor="middle">Multi-layered idempotency defense across Redis locks, 3rd party acquirers, and DB transactional outbox</text>

  <!-- Step 1: Idempotency Key Ingress -->
  <g transform="translate(40, 75)">
    <rect width="220" height="370" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="220" height="30" rx="10" ry="10" fill="#1E3A8A"/>
    <text x="110" y="20" class="card-title" fill="#BFDBFE" text-anchor="middle">1. Request Ingress</text>

    <rect x="15" y="45" width="190" height="70" rx="6" ry="6" fill="#1E293B"/>
    <text x="95" y="66" class="badge" fill="#93C5FD" text-anchor="middle">Client Payment POST</text>
    <text x="15" y="86" class="card-body" font-size="11">Idempotency-Key: UUIDv4</text>
    <text x="15" y="102" class="card-body" font-size="11">amount: $1,250.00</text>

    <rect x="15" y="125" width="190" height="110" rx="6" ry="6" fill="#1E293B" stroke="#3B82F6"/>
    <text x="95" y="146" class="badge" fill="#60A5FA" text-anchor="middle">Client-Side UUID</text>
    <text x="15" y="168" class="card-body">• Generated on button click</text>
    <text x="15" y="184" class="card-body">• Stored in local storage</text>
    <text x="15" y="200" class="card-body">• Re-used on network retry</text>
    <text x="15" y="218" class="badge" fill="#34D399">• Guarantees intent identity</text>

    <rect x="15" y="250" width="190" height="85" rx="6" ry="6" fill="#0F172A"/>
    <text x="95" y="272" class="badge" fill="#93C5FD" text-anchor="middle">Gateway Verification</text>
    <text x="15" y="292" class="card-body" font-size="11">Rejects missing header</text>
    <text x="15" y="308" class="card-body" font-size="11">before touching backend</text>
  </g>

  <!-- Step 2: Distributed Lock & Result Cache -->
  <g transform="translate(290, 75)">
    <rect width="230" height="370" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="230" height="30" rx="10" ry="10" fill="#92400E"/>
    <text x="115" y="20" class="card-title" fill="#FDE68A" text-anchor="middle">2. Redis Guard Layer</text>

    <rect x="15" y="45" width="200" height="85" rx="6" ry="6" fill="#1E293B"/>
    <text x="100" y="66" class="badge" fill="#FDE68A" text-anchor="middle">1. Cached Result Lookup</text>
    <text x="15" y="88" class="card-body" font-family="monospace">GET idem:{uuid}</text>
    <text x="15" y="106" class="card-body">If found -&gt; Return 200 OK</text>
    <text x="15" y="120" class="badge" fill="#34D399">Instant reply without processing</text>

    <rect x="15" y="140" width="200" height="95" rx="6" ry="6" fill="#451A03" stroke="#F59E0B"/>
    <text x="100" y="162" class="badge" fill="#FDE68A" text-anchor="middle">2. Mutual Exclusion Lock</text>
    <text x="15" y="184" class="card-body" font-family="monospace">SET lock:{uuid} 1 NX</text>
    <text x="15" y="200" class="card-body" font-family="monospace">    PX 15000</text>
    <text x="15" y="218" class="card-body" font-size="11" fill="#FDE68A">Blocks parallel duplicate taps</text>

    <rect x="15" y="245" width="200" height="90" rx="6" ry="6" fill="#0F172A"/>
    <text x="100" y="268" class="badge" fill="#FCD34D" text-anchor="middle">TTL Expiration</text>
    <text x="15" y="290" class="card-body" font-size="11">Prevents deadlocks if</text>
    <text x="15" y="306" class="card-body" font-size="11">server dies mid-flight</text>
  </g>

  <!-- Step 3: Payment Gateway & DB -->
  <g transform="translate(545, 75)">
    <rect width="230" height="370" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="230" height="30" rx="10" ry="10" fill="#065F46"/>
    <text x="115" y="20" class="card-title" fill="#A7F3D0" text-anchor="middle">3. Acquirer &amp; DB</text>

    <rect x="15" y="45" width="200" height="85" rx="6" ry="6" fill="#1E293B"/>
    <text x="100" y="66" class="badge" fill="#A7F3D0" text-anchor="middle">Stripe / Adyen Acquirer</text>
    <text x="15" y="88" class="card-body">• Forwards Idempotency-Key</text>
    <text x="15" y="104" class="card-body">• Acquirer deduplicates</text>
    <text x="15" y="120" class="badge" fill="#34D399">• Charge success: $1,250</text>

    <rect x="15" y="140" width="200" height="95" rx="6" ry="6" fill="#064E3B" stroke="#10B981"/>
    <text x="100" y="162" class="badge" fill="#34D399" text-anchor="middle">PostgreSQL ACID Commit</text>
    <text x="15" y="184" class="card-body">• UNIQUE(idempotency_key)</text>
    <text x="15" y="200" class="card-body">• Payment table inserted</text>
    <text x="15" y="216" class="card-body" font-size="11" fill="#D1FAE5">• Outbox table inserted</text>
    <text x="15" y="230" class="badge" fill="#6EE7B7">Atomic local commit</text>

    <rect x="15" y="245" width="200" height="90" rx="6" ry="6" fill="#0F172A"/>
    <text x="100" y="268" class="badge" fill="#A7F3D0" text-anchor="middle">Hard Safety Net</text>
    <text x="15" y="290" class="card-body" font-size="11">DB unique constraint prevents</text>
    <text x="15" y="306" class="card-body" font-size="11">any twin row creation</text>
  </g>

  <!-- Step 4: Cache Update & Outbox Publish -->
  <g transform="translate(800, 75)">
    <rect width="220" height="370" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="220" height="30" rx="10" ry="10" fill="#5B21B6"/>
    <text x="110" y="20" class="card-title" fill="#DDD6FE" text-anchor="middle">4. Cache &amp; Events</text>

    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="190" height="85" rx="6" ry="6" fill="#1E293B"/>
      <text x="15" y="20" class="badge" fill="#DDD6FE">Save Result in Redis</text>
      <text x="15" y="40" class="card-body" font-family="monospace">SETEX idem:{uuid}</text>
      <text x="15" y="56" class="card-body" font-family="monospace">86400 (24h) {response}</text>
      <text x="15" y="74" class="badge" fill="#34D399">Deletes lock:{uuid}</text>

      <rect x="0" y="95" width="190" height="95" rx="6" ry="6" fill="#4C1D95" stroke="#8B5CF6"/>
      <text x="15" y="117" class="badge" fill="#DDD6FE">Debezium CDC Publishes</text>
      <text x="15" y="137" class="card-body">• Reads outbox row</text>
      <text x="15" y="153" class="card-body">• Emits PaymentSuccess</text>
      <text x="15" y="169" class="card-body" font-size="11">  to Kafka topic</text>
      <text x="15" y="183" class="badge" fill="#34D399">Downstream notified</text>
    </g>

    <rect x="15" y="250" width="190" height="85" rx="6" ry="6" fill="#0F172A"/>
    <text x="95" y="272" class="badge" fill="#DDD6FE" text-anchor="middle">HTTP 201 Created</text>
    <text x="15" y="292" class="card-body" font-size="11">Returns receipt to client.</text>
    <text x="15" y="308" class="card-body" font-size="11">Subsequent duplicate clicks</text>
    <text x="15" y="324" class="badge" fill="#A7F3D0">return identical 201 receipt!</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 260 260 L 278 260 L 290 260" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  <path d="M 520 260 L 533 260 L 545 260" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M 775 260 L 788 260 L 800 260" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
</svg>