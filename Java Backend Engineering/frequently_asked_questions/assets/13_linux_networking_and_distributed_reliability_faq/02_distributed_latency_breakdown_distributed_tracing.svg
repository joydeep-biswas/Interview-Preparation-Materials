<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .card { fill: #111827; stroke-width: 1.5; rx: 10; ry: 10; }
      .card-blue { stroke: #3B82F6; }
      .card-purple { stroke: #8B5CF6; }
      .card-green { stroke: #10B981; }
      .card-red { stroke: #EF4444; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #F3F4F6; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #9CA3AF; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
      .edge-blue { stroke: #3B82F6; }
      .edge-purple { stroke: #8B5CF6; }
      .edge-green { stroke: #10B981; }
      .edge-red { stroke: #EF4444; }
      .edge-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-weight: 600; text-anchor: middle; }
      .badge-latency { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; text-anchor: middle; }
    </style>
    <marker id="arr-b132" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-p132" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-g132" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
    <marker id="arr-r132" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <text x="530" y="35" class="title-text">Distributed Latency Breakdown: 5,439ms End-to-End Trace Triage</text>

  <!-- Step 1: Client -->
  <rect x="30" y="80" width="200" height="120" class="card card-blue"/>
  <text x="130" y="110" class="card-title" fill="#93C5FD">Mobile / Web Client</text>
  <text x="45" y="135" class="card-body">• Initiates POST /orders</text>
  <text x="45" y="155" class="card-body">• Injects W3C traceparent</text>
  <text x="45" y="175" class="card-body" fill="#60A5FA">• Total E2E: 5,439ms</text>

  <!-- Step 2: Gateway -->
  <rect x="290" y="80" width="210" height="120" class="card card-purple"/>
  <text x="395" y="110" class="card-title" fill="#C4B5FD">API Gateway (Envoy)</text>
  <text x="305" y="135" class="card-body">• Ingress TLS termination</text>
  <text x="305" y="155" class="card-body">• Rate limiting &amp; auth</text>
  <text x="305" y="175" class="card-body" fill="#34D399">• Network Latency: 12ms</text>

  <!-- Step 3: Tomcat Queue (BOTTLENECK 1) -->
  <rect x="560" y="80" width="230" height="120" class="card card-red"/>
  <text x="675" y="110" class="card-title" fill="#FCA5A5">Tomcat Accept Queue</text>
  <text x="575" y="135" class="card-body">• Thread pool starvation</text>
  <text x="575" y="155" class="card-body">• Sits idle waiting for worker</text>
  <text x="575" y="175" class="badge-latency" fill="#EF4444">STALLED: 2,100ms</text>

  <!-- Step 4: Service Logic -->
  <rect x="830" y="80" width="200" height="120" class="card card-green"/>
  <text x="930" y="110" class="card-title" fill="#6EE7B7">OrderService CPU</text>
  <text x="845" y="135" class="card-body">• Request validation</text>
  <text x="845" y="155" class="card-body">• Domain business logic</text>
  <text x="845" y="175" class="card-body" fill="#34D399">• Execution: 4ms</text>

  <!-- Step 5: HikariCP Starvation (BOTTLENECK 2) -->
  <rect x="830" y="270" width="200" height="130" class="card card-red"/>
  <text x="930" y="300" class="card-title" fill="#FCA5A5">HikariCP Pool Block</text>
  <text x="845" y="325" class="card-body">• getConnection() called</text>
  <text x="845" y="345" class="card-body">• Pool completely depleted</text>
  <text x="845" y="365" class="badge-latency" fill="#EF4444">BLOCKED: 1,800ms</text>

  <!-- Step 6: Downstream API (BOTTLENECK 3) -->
  <rect x="560" y="270" width="230" height="130" class="card card-red"/>
  <text x="675" y="300" class="card-title" fill="#FCA5A5">Downstream Payment</text>
  <text x="575" y="325" class="card-body">• External HTTP REST call</text>
  <text x="575" y="345" class="card-body">• Unbounded read timeout</text>
  <text x="575" y="365" class="badge-latency" fill="#EF4444">LATENCY: 1,500ms</text>

  <!-- Step 7: Database Operation -->
  <rect x="290" y="270" width="210" height="130" class="card card-green"/>
  <text x="395" y="300" class="card-title" fill="#6EE7B7">PostgreSQL Database</text>
  <text x="305" y="325" class="card-body">• SELECT inventory (15ms)</text>
  <text x="305" y="345" class="card-body">• INSERT &amp; Commit (8ms)</text>
  <text x="305" y="365" class="card-body" fill="#34D399">• Total DB Time: 23ms</text>

  <!-- Connectors with straight runways -->
  <!-- 1. Client -> Gateway (Horizontal straight) -->
  <path fill="none" d="M 230 140 L 290 140" class="edge edge-purple" marker-end="url(#arr-p132)"/>
  <text x="260" y="130" class="edge-label" fill="#C4B5FD">12ms</text>

  <!-- 2. Gateway -> Tomcat (Horizontal straight) -->
  <path fill="none" d="M 500 140 L 560 140" class="edge edge-red" marker-end="url(#arr-r132)"/>
  <text x="530" y="130" class="edge-label" fill="#FCA5A5">Proxy</text>

  <!-- 3. Tomcat -> Service (Horizontal straight) -->
  <path fill="none" d="M 790 140 L 830 140" class="edge edge-green" marker-end="url(#arr-g132)"/>
  <text x="810" y="130" class="edge-label" fill="#6EE7B7">Dispatch</text>

  <!-- 4. Service -> HikariCP (Vertical straight downward) -->
  <path fill="none" d="M 930 200 L 930 270" class="edge edge-red" marker-end="url(#arr-r132)"/>
  <text x="965" y="240" class="edge-label" fill="#EF4444">Lease</text>

  <!-- 5. HikariCP -> Downstream Payment (Horizontal straight leftward) -->
  <path fill="none" d="M 830 335 L 790 335" class="edge edge-red" marker-end="url(#arr-r132)"/>
  <text x="810" y="325" class="edge-label" fill="#EF4444">Acquire</text>

  <!-- 6. Downstream Payment -> Database (Horizontal straight leftward) -->
  <path fill="none" d="M 560 335 L 500 335" class="edge edge-green" marker-end="url(#arr-g132)"/>
  <text x="530" y="325" class="edge-label" fill="#6EE7B7">Commit</text>

  <!-- 7. Database -> Client Response (Curved arch with straight runway) -->
  <!-- Exit DB at 290,335 -> curve to enter Client bottom at 130,200 with straight vertical runway dy>=14 -->
  <path fill="none" d="M 290 335 C 200 335, 130 280, 130 216 L 130 200" class="edge edge-blue" marker-end="url(#arr-b132)"/>
  <text x="175" y="270" class="edge-label" fill="#93C5FD">201 OK</text>
</svg>
