<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 360" width="100%" height="100%">
    <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>
  <rect width="100%" height="100%" fill="url(#bg-grad)"  rx="10" stroke="#1F2937" stroke-width="1.5"/>
  <text x="525" y="32" class="title" font-size="19" text-anchor="middle">Valid Parentheses: LIFO Stack Invariant &amp; Bracket Matching</text>
  <text x="525" y="52" class="subtitle" text-anchor="middle">Pushing opening brackets onto Deque stack; popping and validating closing bracket match in O(N) time</text>

  <!-- Input Stream -->
  <g transform="translate(40, 75)">
    <rect width="280" height="250" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="280" height="34" rx="10" ry="10" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
    <text x="140" y="22" class="card-title" fill="#93C5FD" text-anchor="middle">Input Stream: '{ [ ] ( ) }'</text>
    
    <text x="16" y="60" class="card-body" font-weight="600" fill="#60A5FA">• Character-by-Character Scan:</text>
    <text x="24" y="80" class="card-body">  1. '{' : Open -&gt; Push to stack</text>
    <text x="24" y="100" class="card-body">  2. '[' : Open -&gt; Push to stack</text>
    <text x="24" y="120" class="card-body">  3. ']' : Close -&gt; Pop &amp; Match '['</text>
    <text x="24" y="140" class="card-body">  4. '(' : Open -&gt; Push to stack</text>
    <text x="24" y="160" class="card-body">  5. ')' : Close -&gt; Pop &amp; Match '('</text>
    <text x="24" y="180" class="card-body">  6. '}' : Close -&gt; Pop &amp; Match '{'</text>
    
    <rect x="16" y="215" width="248" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="140" y="230" class="badge" fill="#93C5FD" text-anchor="middle">Single Pass Stream O(N)</text>
  </g>

  <!-- LIFO Stack Memory -->
  <g transform="translate(370, 75)">
    <rect width="310" height="250" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="310" height="34" rx="10" ry="10" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="155" y="22" class="card-title" fill="#A7F3D0" text-anchor="middle">Deque Stack Invariants (ArrayDeque)</text>
    
    <text x="16" y="60" class="card-body" font-weight="600" fill="#34D399">• Validation Rules:</text>
    <text x="24" y="80" class="card-body">  - IF open bracket: stack.push(char)</text>
    <text x="24" y="100" class="card-body">  - IF close bracket: </text>
    <text x="32" y="120" class="card-body">    * IF stack.isEmpty(): Return FALSE</text>
    <text x="32" y="140" class="card-body">    * top = stack.pop()</text>
    <text x="32" y="160" class="card-body">    * IF top does not match: Return FALSE</text>
    <text x="16" y="190" class="card-body" font-weight="600" fill="#34D399">• Final Condition:</text>
    <text x="24" y="210" class="card-body">  - Return stack.isEmpty() (Ensures no unclosed)</text>
    
    <rect x="16" y="215" width="278" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="155" y="230" class="badge" fill="#A7F3D0" text-anchor="middle">O(N) Time | O(N) Auxiliary Space</text>
  </g>

  <!-- Verification Result -->
  <g transform="translate(730, 75)">
    <rect width="280" height="250" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="280" height="34" rx="10" ry="10" fill="#4C1D95" stroke="#8B5CF6" stroke-width="1"/>
    <text x="140" y="22" class="card-title" fill="#DDD6FE" text-anchor="middle">Validation Verdict</text>

    <rect x="15" y="48" width="250" height="65" rx="6" ry="6" fill="#1E293B" stroke="#10B981"/>
    <text x="140" y="68" class="badge" fill="#A7F3D0" text-anchor="middle">Match Confirmed: TRUE</text>
    <text x="140" y="86" class="card-body" text-anchor="middle">All brackets matched in LIFO order</text>
    <text x="140" y="102" class="badge" fill="#34D399" text-anchor="middle">Stack is empty at EOF</text>

    <rect x="15" y="130" width="250" height="95" rx="6" ry="6" fill="#1E293B" stroke="#EF4444"/>
    <text x="140" y="150" class="badge" fill="#FCA5A5" text-anchor="middle">Common Failure Edge Cases</text>
    <text x="25" y="172" class="card-body">• Starts with close: "]" -&gt; Empty pop</text>
    <text x="25" y="192" class="card-body">• Unclosed: "([{}])(" -&gt; Stack not empty</text>
    <text x="25" y="212" class="card-body">• Cross-nested: "([)]" -&gt; Mismatched pop</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 320 200 L 358 200 L 370 200" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M 680 200 L 718 200 L 730 200" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
</svg>