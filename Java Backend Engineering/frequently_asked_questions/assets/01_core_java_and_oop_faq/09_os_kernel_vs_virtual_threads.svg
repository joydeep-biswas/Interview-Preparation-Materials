<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 390" width="100%" height="100%">
    <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>
  <rect width="100%" height="100%" fill="url(#bg-grad)"  rx="10" stroke="#1F2937" stroke-width="1.5"/>
  <text x="540" y="32" class="title" font-size="19" text-anchor="middle">Threading Architecture: Platform Threads (1:1) vs Java 21 Virtual Threads (M:N)</text>
  <text x="540" y="52" class="subtitle" text-anchor="middle">Heavyweight OS kernel threads with 1MB stacks vs lightweight JVM user-mode continuations mounted on Carrier ForkJoinPool</text>

  <!-- Left: Platform Threads -->
  <g transform="translate(40, 75)">
    <rect width="470" height="280" rx="10" ry="10" fill="#111827" stroke="#EF4444" stroke-width="2"/>
    <rect width="470" height="34" rx="10" ry="10" fill="#7F1D1D" stroke="#EF4444" stroke-width="1"/>
    <text x="235" y="22" class="card-title" fill="#FCA5A5" text-anchor="middle">Platform Threads (1:1 OS Thread Model)</text>
    
    <text x="16" y="58" class="card-body" font-weight="600" fill="#F87171">• OS Kernel Thread Binding:</text>
    <text x="24" y="78" class="card-body">  - 1 Java Thread = 1 OS Kernel Thread</text>
    <text x="24" y="98" class="card-body">  - Fixed stack size: ~1MB reserved per thread</text>
    <text x="24" y="118" class="card-body">  - Max ~3,000 threads before OS OOM limit</text>
    
    <text x="16" y="146" class="card-body" font-weight="600" fill="#F87171">• Blocking Socket I/O Penalty:</text>
    <text x="24" y="166" class="card-body">  - When thread blocks on DB / HTTP read:</text>
    <text x="24" y="186" class="card-body">  - Entire OS thread goes to SLEEP (Context Switch)</text>
    <text x="24" y="206" class="card-body">  - CPU cores sit idle while thread pools starve</text>
    
    <rect x="16" y="235" width="438" height="24" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="235" y="251" class="badge" fill="#FCA5A5" text-anchor="middle">High Memory &amp; Kernel Context Switch Overhead</text>
  </g>

  <!-- Right: Virtual Threads -->
  <g transform="translate(570, 75)">
    <rect width="470" height="280" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="470" height="34" rx="10" ry="10" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="235" y="22" class="card-title" fill="#A7F3D0" text-anchor="middle">Virtual Threads: Project Loom (M:N User Model)</text>
    
    <text x="16" y="58" class="card-body" font-weight="600" fill="#34D399">• User-Mode Continuations:</text>
    <text x="24" y="78" class="card-body">  - Managed directly by JVM (Millions per JVM)</text>
    <text x="24" y="98" class="card-body">  - Dynamic stack: ~1KB initial memory on heap</text>
    <text x="24" y="118" class="card-body">  - Mounted on Carrier Threads (ForkJoinPool)</text>
    
    <text x="16" y="146" class="card-body" font-weight="600" fill="#34D399">• Non-Blocking I/O Unmounting:</text>
    <text x="24" y="166" class="card-body">  - When blocking I/O occurs, virtual thread UNMOUNTS</text>
    <text x="24" y="186" class="card-body">  - Carrier thread immediately executes next task!</text>
    <text x="24" y="206" class="card-body">  - Restored to carrier when I/O completes (epoll)</text>
    
    <rect x="16" y="235" width="438" height="24" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="235" y="251" class="badge" fill="#A7F3D0" text-anchor="middle">High Concurrency: 1,000,000+ Concurrent Requests</text>
  </g>
</svg>