<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 380" width="100%" height="100%">
    <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <text x="540" y="32" class="title" font-size="19" text-anchor="middle">JVM Method Execution &amp; Virtual Method Dispatch (vtable)</text>
  <text x="540" y="52" class="subtitle" text-anchor="middle">Stack frame reference variable, Heap object instance with Klass Word, and Metaspace vtable pointer</text>

  <!-- Stack Frame -->
  <g transform="translate(40, 75)">
    <rect width="280" height="260" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="280" height="34" rx="10" ry="10" fill="#1E3A8A"/>
    <text x="140" y="22" class="card-title" fill="#93C5FD" text-anchor="middle">Thread Stack Frame</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#60A5FA">• Local Reference Variable:</text>
    <text x="24" y="78" class="card-body">  - Parent p = new Child()</text>
    <text x="24" y="98" class="card-body">  - Compressed OOP: 4 bytes</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#60A5FA">• Method Invocation Bytecode:</text>
    <text x="24" y="146" class="card-body">  - invokevirtual #4</text>
    <text x="24" y="166" class="card-body">  - Operand stack pop reference</text>
    <text x="24" y="186" class="card-body">  - Pushes return address</text>
    <rect x="16" y="226" width="248" height="22" rx="4" ry="4" fill="#1E293B"/>
    <text x="140" y="241" class="badge" fill="#93C5FD" text-anchor="middle">Stack Local Storage</text>
  </g>

  <!-- Heap Object Instance -->
  <g transform="translate(390, 75)">
    <rect width="300" height="260" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="300" height="34" rx="10" ry="10" fill="#064E3B"/>
    <text x="150" y="22" class="card-title" fill="#A7F3D0" text-anchor="middle">Heap Object: Child Instance</text>
    
    <rect x="15" y="48" width="270" height="45" rx="6" ry="6" fill="#1E293B" stroke="#34D399"/>
    <text x="150" y="68" class="badge" fill="#A7F3D0" text-anchor="middle">Mark Word (8 Bytes)</text>
    <text x="150" y="84" class="card-body" text-anchor="middle">Hash code, GC age, lock state bits</text>

    <rect x="15" y="105" width="270" height="50" rx="6" ry="6" fill="#1E293B" stroke="#F59E0B"/>
    <text x="150" y="125" class="badge" fill="#FDE68A" text-anchor="middle">Klass Word (4 Bytes)</text>
    <text x="150" y="142" class="card-body" text-anchor="middle">Pointer to Metaspace InstanceKlass</text>

    <rect x="15" y="168" width="270" height="45" rx="6" ry="6" fill="#1E293B" stroke="#3B82F6"/>
    <text x="150" y="188" class="badge" fill="#93C5FD" text-anchor="middle">Instance Fields</text>
    <text x="150" y="204" class="card-body" text-anchor="middle">Inherited parent fields + child fields</text>
    
    <rect x="15" y="226" width="270" height="22" rx="4" ry="4" fill="#1E293B"/>
    <text x="150" y="241" class="badge" fill="#A7F3D0" text-anchor="middle">Total Object Size: 24 Bytes (Padded)</text>
  </g>

  <!-- Metaspace & vtable -->
  <g transform="translate(760, 75)">
    <rect width="280" height="260" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="280" height="34" rx="10" ry="10" fill="#4C1D95"/>
    <text x="140" y="22" class="card-title" fill="#DDD6FE" text-anchor="middle">Metaspace: InstanceKlass</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#A78BFA">• Virtual Method Table (vtable):</text>
    <text x="24" y="78" class="card-body">  - Array of function pointers</text>
    <text x="24" y="98" class="card-body">  - Index 0: toString()</text>
    <text x="24" y="118" class="card-body">  - Index 1: hashCode()</text>
    <text x="24" y="138" class="card-body">  - Index 2: print() -&gt; Child.print()</text>
    <text x="16" y="166" class="card-body" font-weight="600" fill="#A78BFA">• Constant Pool Resolution:</text>
    <text x="24" y="186" class="card-body">  - JIT compiles indirect jump</text>
    <text x="24" y="206" class="card-body">  - Monomorphic call inlining</text>
    <rect x="16" y="226" width="248" height="22" rx="4" ry="4" fill="#1E293B"/>
    <text x="140" y="241" class="badge" fill="#DDD6FE" text-anchor="middle">vtable Dynamic Dispatch</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 320 180 L 378 180 L 390 180" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M 690 130 L 748 130 L 760 130" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
</svg>