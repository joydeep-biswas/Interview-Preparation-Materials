<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 370" width="100%" height="100%">
  {COMMON_DEFS}
  <style>
{COMMON_STYLES}
  </style>
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <text x="525" y="32" class="title" font-size="19" text-anchor="middle">Method Binding: Compile-Time Static Binding vs Runtime Dynamic Dispatch</text>
  <text x="525" y="52" class="subtitle" text-anchor="middle">Comparison of Parent p = new Child(): static method hiding (invokestatic) vs virtual polymorphism (invokevirtual)</text>

  <!-- Root Declaration -->
  <g transform="translate(375, 75)">
    <rect width="300" height="55" rx="8" ry="8" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <text x="150" y="25" class="card-title" fill="#93C5FD" text-anchor="middle">Parent p = new Child();</text>
    <text x="150" y="44" class="card-body" text-anchor="middle">Reference: Parent | Runtime Object: Child</text>
  </g>

  <!-- Left: Compile Time Binding -->
  <g transform="translate(40, 165)">
    <rect width="460" height="175" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="460" height="30" rx="10" ry="10" fill="#78350F"/>
    <text x="230" y="20" class="card-title" fill="#FDE68A" text-anchor="middle">Static Binding: p.staticPrint()</text>
    
    <text x="16" y="52" class="card-body" font-weight="600" fill="#FBBF24">• Bytecode: invokestatic Parent.staticPrint()</text>
    <text x="16" y="74" class="card-body">• Resolved by COMPILER using reference type (Parent)</text>
    <text x="16" y="96" class="card-body">• Ignores the actual runtime instance completely!</text>
    <text x="16" y="118" class="card-body">• Method Hiding: Static methods cannot be overridden</text>
    
    <rect x="16" y="132" width="428" height="24" rx="4" ry="4" fill="#1E293B"/>
    <text x="230" y="148" class="badge" fill="#FDE68A" text-anchor="middle">Prints: "Parent staticPrint" (Early Binding)</text>
  </g>

  <!-- Right: Runtime Dynamic Binding -->
  <g transform="translate(550, 165)">
    <rect width="460" height="175" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="460" height="30" rx="10" ry="10" fill="#064E3B"/>
    <text x="230" y="20" class="card-title" fill="#A7F3D0" text-anchor="middle">Dynamic Dispatch: p.instancePrint()</text>
    
    <text x="16" y="52" class="card-body" font-weight="600" fill="#34D399">• Bytecode: invokevirtual Parent.instancePrint()</text>
    <text x="16" y="74" class="card-body">• Resolved at RUNTIME via Child instance's vtable</text>
    <text x="16" y="96" class="card-body">• Looks up actual object memory in Heap</text>
    <text x="16" y="118" class="card-body">• True Polymorphism: Child implementation executed</text>
    
    <rect x="16" y="132" width="428" height="24" rx="4" ry="4" fill="#1E293B"/>
    <text x="230" y="148" class="badge" fill="#A7F3D0" text-anchor="middle">Prints: "Child instancePrint" (Late Binding)</text>
  </g>

  <!-- Connective Runways from Root -->
  <path d="M 430 130 L 430 145 Q 430 155 410 155 L 285 155 Q 270 155 270 160 L 270 165" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow-yellow)"/>
  <path d="M 620 130 L 620 145 Q 620 155 640 155 L 765 155 Q 780 155 780 160 L 780 165" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)"/>
</svg>