<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 380" width="100%" height="100%">
    <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>
  <rect width="100%" height="100%" fill="url(#bg-grad)"  rx="10" stroke="#1F2937" stroke-width="1.5"/>
  <text x="525" y="32" class="title" font-size="19" text-anchor="middle">String Equality (== vs equals()) &amp; String Intern Pool Mechanics</text>
  <text x="525" y="52" class="subtitle" text-anchor="middle">Reference identity vs value equality: Literals reuse String Pool entries while new String() allocates fresh Heap instances</text>

  <!-- Stack Variables -->
  <g transform="translate(40, 75)">
    <rect width="250" height="270" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="250" height="34" rx="10" ry="10" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
    <text x="125" y="22" class="card-title" fill="#93C5FD" text-anchor="middle">Stack Frame Variables</text>
    
    <rect x="15" y="48" width="220" height="40" rx="6" ry="6" fill="#1E293B" stroke="#60A5FA"/>
    <text x="125" y="73" class="badge" fill="#93C5FD" text-anchor="middle">s1 = "Java" (Literal)</text>

    <rect x="15" y="105" width="220" height="40" rx="6" ry="6" fill="#1E293B" stroke="#60A5FA"/>
    <text x="125" y="130" class="badge" fill="#93C5FD" text-anchor="middle">s2 = "Java" (Literal)</text>

    <rect x="15" y="165" width="220" height="45" rx="6" ry="6" fill="#1E293B" stroke="#F59E0B"/>
    <text x="125" y="187" class="badge" fill="#FDE68A" text-anchor="middle">s3 = new String("Java")</text>
    <text x="125" y="202" class="card-body" text-anchor="middle">Explicit heap allocation</text>

    <rect x="15" y="235" width="220" height="20" rx="3" ry="3" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="125" y="249" class="badge" fill="#93C5FD" text-anchor="middle">Stack References</text>
  </g>

  <!-- Heap & String Pool -->
  <g transform="translate(340, 75)">
    <rect width="360" height="270" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="340" height="34" rx="10" ry="10" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="180" y="22" class="card-title" fill="#A7F3D0" text-anchor="middle">JVM Heap Memory</text>

    <!-- String Intern Pool Box -->
    <g transform="translate(20, 50)">
      <rect width="320" height="95" rx="8" ry="8" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
      <text x="160" y="24" class="card-title" fill="#A7F3D0" text-anchor="middle">String Intern Pool (Inside Heap)</text>
      <rect x="40" y="38" width="240" height="42" rx="6" ry="6" fill="#1E293B" stroke="#34D399"/>
      <text x="160" y="64" class="card-body" font-weight="700" fill="#A7F3D0" text-anchor="middle">Canonical Instance: "Java"</text>
    </g>

    <!-- Distinct Heap Instance -->
    <g transform="translate(20, 160)">
      <rect width="320" height="95" rx="8" ry="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="160" y="24" class="card-title" fill="#FDE68A" text-anchor="middle">Regular Heap Object</text>
      <rect x="40" y="38" width="240" height="42" rx="6" ry="6" fill="#1E293B" stroke="#FBBF24"/>
      <text x="160" y="64" class="card-body" font-weight="700" fill="#FDE68A" text-anchor="middle">Separate String Object: "Java"</text>
    </g>
  </g>

  <!-- Comparison Results -->
  <g transform="translate(740, 75)">
    <rect width="270" height="270" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="270" height="34" rx="10" ry="10" fill="#4C1D95" stroke="#8B5CF6" stroke-width="1"/>
    <text x="135" y="22" class="card-title" fill="#DDD6FE" text-anchor="middle">Comparison Assertions</text>

    <rect x="15" y="48" width="240" height="60" rx="6" ry="6" fill="#1E293B" stroke="#10B981"/>
    <text x="135" y="68" class="badge" fill="#A7F3D0" text-anchor="middle">s1 == s2 : TRUE</text>
    <text x="135" y="86" class="card-body" text-anchor="middle">Identical memory address in pool</text>
    <text x="135" y="100" class="badge" fill="#34D399" text-anchor="middle">Reference Equality</text>

    <rect x="15" y="118" width="240" height="60" rx="6" ry="6" fill="#1E293B" stroke="#EF4444"/>
    <text x="135" y="138" class="badge" fill="#FCA5A5" text-anchor="middle">s1 == s3 : FALSE</text>
    <text x="135" y="156" class="card-body" text-anchor="middle">Pool instance vs fresh heap object</text>
    <text x="135" y="170" class="badge" fill="#EF4444" text-anchor="middle">Different Addresses</text>

    <rect x="15" y="188" width="240" height="65" rx="6" ry="6" fill="#1E293B" stroke="#10B981"/>
    <text x="135" y="208" class="badge" fill="#A7F3D0" text-anchor="middle">s1.equals(s3) : TRUE</text>
    <text x="135" y="226" class="card-body" text-anchor="middle">Character-by-character value equality</text>
    <text x="135" y="242" class="badge" fill="#34D399" text-anchor="middle">s3.intern() == s1 is TRUE</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <!-- s1 and s2 point to pool -->
  <path d="M 265 68 L 368 68 L 380 95" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M 265 125 L 368 125 L 380 115" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- s3 points to heap object -->
  <path d="M 265 187 L 368 187 L 380 205" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow-yellow)"/>

  <!-- Pool to Comparisons -->
  <path d="M 700 110 L 728 110 L 740 110" fill="none" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <path d="M 700 220 L 728 220 L 740 220" fill="none" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrow-purple)"/>
</svg>