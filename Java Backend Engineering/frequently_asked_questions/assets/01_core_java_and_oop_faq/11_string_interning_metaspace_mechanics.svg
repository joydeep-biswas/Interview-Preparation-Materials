<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 370" width="100%" height="100%">
    <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>
  <rect width="100%" height="100%" fill="url(#bg-grad)"  rx="10" stroke="#1F2937" stroke-width="1.5"/>
  <text x="525" y="32" class="title" font-size="19" text-anchor="middle">Class Constant Pool, Bytecode LDC &amp; String.intern() Mechanics</text>
  <text x="525" y="52" class="subtitle" text-anchor="middle">How symbolic constant pool entries are resolved at runtime via the JVM StringTable native hashtable in heap</text>

  <!-- Constant Pool -->
  <g transform="translate(40, 75)">
    <rect width="280" height="260" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="280" height="34" rx="10" ry="10" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
    <text x="140" y="22" class="card-title" fill="#93C5FD" text-anchor="middle">1. Class Constant Pool</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#60A5FA">• Compiled .class Bytecode:</text>
    <text x="24" y="78" class="card-body">  - #7 = String #8 // "hello"</text>
    <text x="24" y="98" class="card-body">  - #8 = Utf8 "hello"</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#60A5FA">• Execution Bytecode:</text>
    <text x="24" y="146" class="card-body">  - ldc #7 (Load Constant)</text>
    <text x="24" y="166" class="card-body">  - Resolves symbolic reference</text>
    <text x="24" y="186" class="card-body">  - Invokes JVM StringTable lookup</text>
    <rect x="16" y="226" width="248" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="140" y="241" class="badge" fill="#93C5FD" text-anchor="middle">Metaspace Symbolic Pool</text>
  </g>

  <!-- StringTable (String Pool) -->
  <g transform="translate(370, 75)">
    <rect width="310" height="260" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="310" height="34" rx="10" ry="10" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="155" y="22" class="card-title" fill="#A7F3D0" text-anchor="middle">2. StringTable (Native Hash)</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#34D399">• Native C++ HashTable:</text>
    <text x="24" y="78" class="card-body">  - Fixed bucket size (-XX:StringTableSize)</text>
    <text x="24" y="98" class="card-body">  - O(1) hash collision chaining</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#34D399">• intern() Method Logic:</text>
    <text x="24" y="146" class="card-body">  - IF string in table: Return pooled ref</text>
    <text x="24" y="166" class="card-body">  - IF NOT in table: Add ref to table</text>
    <text x="24" y="186" class="card-body">    and return it!</text>
    <rect x="16" y="226" width="278" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="155" y="241" class="badge" fill="#A7F3D0" text-anchor="middle">Resides in Heap (Since Java 7)</text>
  </g>

  <!-- Runtime References -->
  <g transform="translate(730, 75)">
    <rect width="280" height="260" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="280" height="34" rx="10" ry="10" fill="#4C1D95" stroke="#8B5CF6" stroke-width="1"/>
    <text x="140" y="22" class="card-title" fill="#DDD6FE" text-anchor="middle">3. Runtime Equality</text>
    
    <rect x="15" y="48" width="250" height="65" rx="6" ry="6" fill="#1E293B" stroke="#10B981"/>
    <text x="140" y="68" class="badge" fill="#A7F3D0" text-anchor="middle">str.intern() == "hello"</text>
    <text x="140" y="86" class="card-body" text-anchor="middle">Returns TRUE for any matching string</text>
    <text x="140" y="102" class="badge" fill="#34D399" text-anchor="middle">Canonical Reference Identity</text>

    <rect x="15" y="130" width="250" height="95" rx="6" ry="6" fill="#1E293B" stroke="#F59E0B"/>
    <text x="140" y="150" class="badge" fill="#FDE68A" text-anchor="middle">Caution on High Cardinality</text>
    <text x="25" y="172" class="card-body">• Interning random UUIDs pollutes pool</text>
    <text x="25" y="192" class="card-body">• Causes bucket hash collisions</text>
    <text x="25" y="212" class="card-body">• May lead to GC pauses &amp; memory bloat</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 320 205 L 358 205 L 370 205" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M 680 205 L 718 205 L 730 205" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
</svg>