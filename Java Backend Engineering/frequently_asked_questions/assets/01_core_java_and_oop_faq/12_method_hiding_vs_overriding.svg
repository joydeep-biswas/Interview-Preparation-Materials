<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 370" width="100%" height="100%">
    <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>
  <rect width="100%" height="100%" fill="url(#bg-grad)"  rx="10" stroke="#1F2937" stroke-width="1.5"/>
  <text x="525" y="32" class="title" font-size="19" text-anchor="middle">Method Hiding vs Method Overriding: Deep Bytecode Comparison</text>
  <text x="525" y="52" class="subtitle" text-anchor="middle">Static methods are hidden and bound at compile time; instance methods are overridden and dispatched via vtable</text>

  <!-- Left: Method Hiding -->
  <g transform="translate(40, 75)">
    <rect width="460" height="260" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="460" height="34" rx="10" ry="10" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
    <text x="230" y="22" class="card-title" fill="#FDE68A" text-anchor="middle">Method Hiding (static methods)</text>
    
    <text x="16" y="60" class="card-body" font-weight="600" fill="#FBBF24">• Bytecode Instruction: invokestatic</text>
    <text x="24" y="80" class="card-body">  - Bound at COMPILE-TIME to reference type</text>
    <text x="24" y="100" class="card-body">  - Parent p = new Child(); p.show(); -&gt; Parent.show()</text>
    
    <text x="16" y="130" class="card-body" font-weight="600" fill="#FBBF24">• Memory Mechanics:</text>
    <text x="24" y="150" class="card-body">  - Resolved directly from Class Constant Pool</text>
    <text x="24" y="170" class="card-body">  - Does NOT participate in runtime vtable</text>
    <text x="24" y="190" class="card-body">  - Zero polymorphism; completely static binding</text>
    
    <rect x="16" y="215" width="428" height="24" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="230" y="231" class="badge" fill="#FDE68A" text-anchor="middle">Static Call: Resolved by Reference Type</text>
  </g>

  <!-- Right: Method Overriding -->
  <g transform="translate(550, 75)">
    <rect width="460" height="260" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="460" height="34" rx="10" ry="10" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="230" y="22" class="card-title" fill="#A7F3D0" text-anchor="middle">Method Overriding (instance methods)</text>
    
    <text x="16" y="60" class="card-body" font-weight="600" fill="#34D399">• Bytecode Instruction: invokevirtual</text>
    <text x="24" y="80" class="card-body">  - Dispatched at RUNTIME via receiver object</text>
    <text x="24" y="100" class="card-body">  - Parent p = new Child(); p.display(); -&gt; Child.display()</text>
    
    <text x="16" y="130" class="card-body" font-weight="600" fill="#34D399">• Memory Mechanics:</text>
    <text x="24" y="150" class="card-body">  - Looks up Klass Word in Heap object header</text>
    <text x="24" y="170" class="card-body">  - Indexes into Metaspace vtable for slot</text>
    <text x="24" y="190" class="card-body">  - True dynamic polymorphism</text>
    
    <rect x="16" y="215" width="428" height="24" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="230" y="231" class="badge" fill="#A7F3D0" text-anchor="middle">Dynamic Call: Dispatched by Heap Object Type</text>
  </g>
</svg>