<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 380" width="100%" height="100%">
    <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>
  <rect width="100%" height="100%" fill="url(#bg-grad)"  rx="10" stroke="#1F2937" stroke-width="1.5"/>
  <text x="540" y="32" class="title" font-size="19" text-anchor="middle">Why String is Immutable: The 4 Core Architectural Invariants</text>
  <text x="540" y="52" class="subtitle" text-anchor="middle">Security &amp; classloading, thread safety, hash code caching, and String Pool deduplication</text>

  <!-- Pillar 1: Security -->
  <g transform="translate(30, 75)">
    <rect width="235" height="270" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="235" height="34" rx="10" ry="10" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
    <text x="117" y="22" class="card-title" fill="#93C5FD" text-anchor="middle">1. Security &amp; Classloading</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#60A5FA">• Critical System Parameters:</text>
    <text x="24" y="78" class="card-body">  - File paths, database URLs</text>
    <text x="24" y="98" class="card-body">  - Network ports, credentials</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#60A5FA">• ClassLoader Integrity:</text>
    <text x="24" y="146" class="card-body">  - Loading java.lang.String</text>
    <text x="24" y="166" class="card-body">  - If mutable, a malicious thread</text>
    <text x="24" y="186" class="card-body">    could hijack class names</text>
    <text x="24" y="206" class="card-body">    post-validation!</text>
    <rect x="16" y="234" width="203" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="117" y="249" class="badge" fill="#93C5FD" text-anchor="middle">Tamper-Proof Invariant</text>
  </g>

  <!-- Pillar 2: Thread Safety -->
  <g transform="translate(290, 75)">
    <rect width="235" height="270" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="235" height="34" rx="10" ry="10" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="117" y="22" class="card-title" fill="#A7F3D0" text-anchor="middle">2. Thread Safety</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#34D399">• Zero Synchronization:</text>
    <text x="24" y="78" class="card-body">  - Strings are inherently thread-safe</text>
    <text x="24" y="98" class="card-body">  - Freely shared across threads</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#34D399">• No Race Conditions:</text>
    <text x="24" y="146" class="card-body">  - State cannot mutate after init</text>
    <text x="24" y="166" class="card-body">  - Eliminates lock contention</text>
    <text x="24" y="186" class="card-body">  - Safe publication without volatile</text>
    <rect x="16" y="234" width="203" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="117" y="249" class="badge" fill="#A7F3D0" text-anchor="middle">Lock-Free Concurrency</text>
  </g>

  <!-- Pillar 3: HashCode Caching -->
  <g transform="translate(550, 75)">
    <rect width="235" height="270" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="235" height="34" rx="10" ry="10" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
    <text x="117" y="22" class="card-title" fill="#FDE68A" text-anchor="middle">3. HashCode Caching</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#FBBF24">• Cached in 32-bit Field:</text>
    <text x="24" y="78" class="card-body">  - private int hash; // Default 0</text>
    <text x="24" y="98" class="card-body">  - Computed once lazily</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#FBBF24">• Blazing Fast HashMaps:</text>
    <text x="24" y="146" class="card-body">  - O(1) instant return on get()</text>
    <text x="24" y="166" class="card-body">  - Never re-computes character loop</text>
    <text x="24" y="186" class="card-body">  - Ideal HashMap &amp; HashSet key</text>
    <rect x="16" y="234" width="203" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="117" y="249" class="badge" fill="#FDE68A" text-anchor="middle">Instant O(1) Key Lookups</text>
  </g>

  <!-- Pillar 4: String Pool -->
  <g transform="translate(810, 75)">
    <rect width="240" height="270" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="240" height="34" rx="10" ry="10" fill="#4C1D95" stroke="#8B5CF6" stroke-width="1"/>
    <text x="120" y="22" class="card-title" fill="#DDD6FE" text-anchor="middle">4. String Pool Sharing</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#A78BFA">• Memory Deduplication:</text>
    <text x="24" y="78" class="card-body">  - Thousands of identical literals</text>
    <text x="24" y="98" class="card-body">    point to 1 single heap instance</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#A78BFA">• Safe Sharing:</text>
    <text x="24" y="146" class="card-body">  - Only safe because characters</text>
    <text x="24" y="166" class="card-body">    can NEVER be modified!</text>
    <text x="24" y="186" class="card-body">  - Huge RAM savings across JVM</text>
    <rect x="16" y="234" width="208" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="120" y="249" class="badge" fill="#DDD6FE" text-anchor="middle">Heap Memory Efficiency</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 265 210 L 278 210 L 290 210" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M 525 210 L 538 210 L 550 210" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow-yellow)"/>
  <path d="M 785 210 L 798 210 L 810 210" fill="none" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrow-purple)"/>
</svg>