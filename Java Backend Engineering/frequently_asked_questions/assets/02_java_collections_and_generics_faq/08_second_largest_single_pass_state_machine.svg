<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" ry="12"/>

  <text x="530" y="32" class="title" font-size="20" text-anchor="middle">Second Largest Element: Single-Pass State Machine</text>
  <text x="530" y="52" class="subtitle" text-anchor="middle">Tracking distinct first and second maximums in O(N) time and O(1) auxiliary space</text>

  <!-- Left: State Registers & Input -->
  <g transform="translate(40, 75)">
    <rect width="250" height="370" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="250" height="30" rx="10" ry="10" fill="#1E3A8A"/>
    <text x="125" y="20" class="card-title" fill="#BFDBFE" text-anchor="middle">1. State Registers</text>

    <rect x="15" y="45" width="220" height="75" rx="6" ry="6" fill="#1E293B"/>
    <text x="110" y="66" class="badge" fill="#93C5FD" text-anchor="middle">Initial Values</text>
    <text x="25" y="88" class="card-body" font-family="monospace">int first = Integer.MIN_VALUE;</text>
    <text x="25" y="106" class="card-body" font-family="monospace">int second = Integer.MIN_VALUE;</text>

    <rect x="15" y="135" width="220" height="75" rx="6" ry="6" fill="#1E293B"/>
    <text x="110" y="156" class="badge" fill="#FDE68A" text-anchor="middle">Array Element Stream</text>
    <text x="25" y="176" class="card-body" font-family="monospace">for (int x : nums)</text>
    <text x="25" y="194" class="card-body">Stream evaluation: O(N) single pass</text>

    <rect x="15" y="225" width="220" height="110" rx="6" ry="6" fill="#064E3B" stroke="#10B981"/>
    <text x="110" y="248" class="badge" fill="#A7F3D0" text-anchor="middle">Optimal Space Invariant</text>
    <text x="25" y="270" class="card-body">• No sorting required</text>
    <text x="25" y="288" class="card-body">• No heap allocation</text>
    <text x="25" y="306" class="badge" fill="#34D399">• Auxiliary Space: O(1)</text>
    <text x="25" y="322" class="badge" fill="#34D399">• Time: Exactly N iterations</text>
  </g>

  <!-- Middle: Transition Decision Tree -->
  <g transform="translate(330, 75)">
    <rect width="400" height="370" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="400" height="30" rx="10" ry="10" fill="#065F46"/>
    <text x="200" y="20" class="card-title" fill="#A7F3D0" text-anchor="middle">2. Decision &amp; State Mutation Logic</text>

    <!-- Branch 1: x > first -->
    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="360" height="85" rx="6" ry="6" fill="#1E293B" stroke="#10B981"/>
      <text x="15" y="22" class="badge" fill="#34D399">Condition 1: if (x &gt; first)</text>
      <text x="15" y="42" class="card-body" font-family="monospace">second = first;   // Demote previous max</text>
      <text x="15" y="60" class="card-body" font-family="monospace">first = x;        // Crown new maximum</text>
      <text x="15" y="76" class="card-body" font-size="11" fill="#A7F3D0">Guarantees second strictly trails first</text>
    </g>

    <!-- Branch 2: x > second && x != first -->
    <g transform="translate(20, 145)">
      <rect x="0" y="0" width="360" height="90" rx="6" ry="6" fill="#1E293B" stroke="#F59E0B"/>
      <text x="15" y="22" class="badge" fill="#FCD34D">Condition 2: else if (x &gt; second &amp;&amp; x != first)</text>
      <text x="15" y="44" class="card-body" font-family="monospace">second = x;       // Update second maximum</text>
      <text x="15" y="64" class="card-body" font-size="11">Crucial: 'x != first' check filters out duplicates</text>
      <text x="15" y="80" class="card-body" font-size="11" fill="#FDE68A">Prevents second from equaling first if array has duplicate maxes</text>
    </g>

    <!-- Branch 3: Else (Skip) -->
    <g transform="translate(20, 248)">
      <rect x="0" y="0" width="360" height="65" rx="6" ry="6" fill="#1E293B" stroke="#6B7280"/>
      <text x="15" y="22" class="badge" fill="#9CA3AF">Condition 3: else (x &lt;= second || x == first)</text>
      <text x="15" y="44" class="card-body">// No-op / Skip element</text>
      <text x="15" y="58" class="card-body" font-size="11">Element is strictly smaller or duplicate of current max</text>
    </g>
  </g>

  <!-- Right: Edge Cases & Return -->
  <g transform="translate(770, 75)">
    <rect width="250" height="370" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="250" height="30" rx="10" ry="10" fill="#5B21B6"/>
    <text x="125" y="20" class="card-title" fill="#DDD6FE" text-anchor="middle">3. Edge Cases &amp; Return</text>

    <rect x="15" y="45" width="220" height="120" rx="6" ry="6" fill="#1E293B"/>
    <text x="110" y="68" class="badge" fill="#DDD6FE" text-anchor="middle">Edge Case Handling</text>
    <text x="15" y="90" class="card-body">• All elements identical:</text>
    <text x="15" y="106" class="card-body">  e.g., [5, 5, 5, 5]</text>
    <text x="15" y="124" class="card-body">  second remains MIN_VALUE</text>
    <text x="15" y="142" class="card-body">• Array length &lt; 2: return -1</text>
    <text x="15" y="158" class="badge" fill="#F87171">No second largest exists</text>

    <rect x="15" y="180" width="220" height="100" rx="6" ry="6" fill="#0F172A" stroke="#8B5CF6"/>
    <text x="110" y="202" class="badge" fill="#C4B5FD" text-anchor="middle">Final Return Contract</text>
    <text x="15" y="224" class="card-body" font-family="monospace">return (second == MIN_VAL)</text>
    <text x="15" y="242" class="card-body" font-family="monospace">       ? -1 : second;</text>
    <text x="15" y="266" class="badge" fill="#34D399">100% Robust across all inputs</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 290 260 L 318 260 L 330 260" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M 730 260 L 758 260 L 770 260" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
</svg>