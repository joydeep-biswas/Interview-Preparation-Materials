<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" ry="12"/>

  <!-- Header -->
  <text x="530" y="32" class="title" font-size="20" text-anchor="middle">Java Collections Framework Core Hierarchy</text>
  <text x="530" y="52" class="subtitle" text-anchor="middle">Root Iterable contract down to List, Set, Queue, Deque, and independent Map paradigms</text>

  <!-- Iterable Root Card -->
  <g transform="translate(380, 75)">
    <rect width="300" height="70" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="300" height="26" rx="10" ry="10" fill="#1E3A8A"/>
    <text x="150" y="18" class="card-title" fill="#BFDBFE" text-anchor="middle">Iterable&lt;E&gt; (Root Cursor Contract)</text>
    <text x="15" y="44" class="card-body">• iterator(): Iterator&lt;E&gt; (LIFO/FIFO iteration)</text>
    <text x="15" y="60" class="card-body">• forEach(Consumer), spliterator() for streams</text>
  </g>

  <!-- Collection Interface Card -->
  <g transform="translate(380, 180)">
    <rect width="300" height="75" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="300" height="26" rx="10" ry="10" fill="#065F46"/>
    <text x="150" y="18" class="card-title" fill="#A7F3D0" text-anchor="middle">Collection&lt;E&gt; (Core Container Contract)</text>
    <text x="15" y="44" class="card-body">• Basic mutators: add(), remove(), contains(), size()</text>
    <text x="15" y="62" class="card-body">• Aggregate ops: stream(), parallelStream(), toArray()</text>
  </g>

  <!-- List Interface Card -->
  <g transform="translate(40, 300)">
    <rect width="220" height="150" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="220" height="28" rx="10" ry="10" fill="#1E3A8A"/>
    <text x="110" y="19" class="card-title" fill="#BFDBFE" text-anchor="middle">List&lt;E&gt; (Ordered)</text>
    <text x="12" y="48" class="card-body">• Zero-based positional index</text>
    <text x="12" y="66" class="card-body">• Allows duplicates &amp; nulls</text>
    <rect x="12" y="80" width="196" height="24" rx="4" ry="4" fill="#1F2937"/>
    <text x="110" y="96" class="badge" fill="#93C5FD" text-anchor="middle">ArrayList: O(1) Read Array</text>
    <rect x="12" y="112" width="196" height="24" rx="4" ry="4" fill="#1F2937"/>
    <text x="110" y="128" class="badge" fill="#93C5FD" text-anchor="middle">LinkedList: Doubly-Linked Nodes</text>
  </g>

  <!-- Set Interface Card -->
  <g transform="translate(290, 300)">
    <rect width="220" height="150" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="220" height="28" rx="10" ry="10" fill="#065F46"/>
    <text x="110" y="19" class="card-title" fill="#A7F3D0" text-anchor="middle">Set&lt;E&gt; (Distinct Keys)</text>
    <text x="12" y="48" class="card-body">• Strict uniqueness constraint</text>
    <text x="12" y="66" class="card-body">• Enforces equals/hashCode</text>
    <rect x="12" y="80" width="196" height="24" rx="4" ry="4" fill="#1F2937"/>
    <text x="110" y="96" class="badge" fill="#6EE7B7" text-anchor="middle">HashSet: O(1) Hash Table</text>
    <rect x="12" y="112" width="196" height="24" rx="4" ry="4" fill="#1F2937"/>
    <text x="110" y="128" class="badge" fill="#6EE7B7" text-anchor="middle">TreeSet: O(log N) Red-Black Tree</text>
  </g>

  <!-- Queue / Deque Interface Card -->
  <g transform="translate(540, 300)">
    <rect width="230" height="150" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="230" height="28" rx="10" ry="10" fill="#92400E"/>
    <text x="115" y="19" class="card-title" fill="#FDE68A" text-anchor="middle">Queue&lt;E&gt; &amp; Deque&lt;E&gt;</text>
    <text x="12" y="48" class="card-body">• FIFO &amp; LIFO double-ended queues</text>
    <text x="12" y="66" class="card-body">• offer(), poll(), peek() contracts</text>
    <rect x="12" y="80" width="206" height="24" rx="4" ry="4" fill="#1F2937"/>
    <text x="115" y="96" class="badge" fill="#FCD34D" text-anchor="middle">ArrayDeque: Ring Buffer (LIFO/FIFO)</text>
    <rect x="12" y="112" width="206" height="24" rx="4" ry="4" fill="#1F2937"/>
    <text x="115" y="128" class="badge" fill="#FCD34D" text-anchor="middle">PriorityQueue: Binary Min-Heap</text>
  </g>

  <!-- Map Paradigm (Separate branch) Card -->
  <g transform="translate(800, 180)">
    <rect width="220" height="270" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="220" height="28" rx="10" ry="10" fill="#5B21B6"/>
    <text x="110" y="19" class="card-title" fill="#DDD6FE" text-anchor="middle">Map&lt;K, V&gt; (Associative)</text>
    <text x="12" y="48" class="card-body">• NOT a Collection (No Iterable)</text>
    <text x="12" y="66" class="card-body">• Key/Value mapping paradigm</text>
    <text x="12" y="84" class="card-body">• Views: keySet(), values(), entrySet()</text>
    
    <rect x="12" y="105" width="196" height="34" rx="4" ry="4" fill="#1F2937"/>
    <text x="110" y="121" class="badge" fill="#C4B5FD" text-anchor="middle">HashMap: O(1) Hash Table</text>
    <text x="110" y="133" class="subtitle" font-size="10" text-anchor="middle">Buckets + Treeify on collision</text>

    <rect x="12" y="147" width="196" height="34" rx="4" ry="4" fill="#1F2937"/>
    <text x="110" y="163" class="badge" fill="#C4B5FD" text-anchor="middle">LinkedHashMap: Insertion / LRU</text>
    <text x="110" y="175" class="subtitle" font-size="10" text-anchor="middle">Doubly-linked entry pointers</text>

    <rect x="12" y="189" width="196" height="34" rx="4" ry="4" fill="#1F2937"/>
    <text x="110" y="205" class="badge" fill="#C4B5FD" text-anchor="middle">TreeMap: Sorted Red-Black Tree</text>
    <text x="110" y="217" class="subtitle" font-size="10" text-anchor="middle">NavigableMap O(log N) key ops</text>

    <rect x="12" y="231" width="196" height="24" rx="4" ry="4" fill="#1E293B"/>
    <text x="110" y="247" class="badge" fill="#38BDF8" text-anchor="middle">ConcurrentHashMap: CAS + Locks</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <!-- Iterable -> Collection -->
  <path d="M 530 145 L 530 168 L 530 180" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <!-- Collection -> List (curved with straight runway) -->
  <path d="M 430 255 L 430 270 Q 430 285 300 285 L 150 285 L 150 288 L 150 300" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- Collection -> Set (straight) -->
  <path d="M 480 255 L 480 275 Q 480 285 410 285 L 400 285 L 400 288 L 400 300" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <!-- Collection -> Queue (curved with straight runway) -->
  <path d="M 580 255 L 580 270 Q 580 285 620 285 L 655 285 L 655 288 L 655 300" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>

  <!-- Annotation: Map is independent -->
  <path d="M 680 110 L 788 110 L 800 180" fill="none" stroke="#8B5CF6" stroke-dasharray="4,4" stroke-width="1.5"/>
  <rect x="700" y="98" width="80" height="20" rx="4" ry="4" fill="#1E293B"/>
  <text x="740" y="112" class="conn-label" text-anchor="middle">No Inheritance</text>
</svg>