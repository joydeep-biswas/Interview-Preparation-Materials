<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" ry="12"/>

  <text x="530" y="32" class="title" font-size="20" text-anchor="middle">Meeting Rooms II: Min-Heap Resource Allocation Topology</text>
  <text x="530" y="52" class="subtitle" text-anchor="middle">Greedy interval scheduling tracking earliest end times via PriorityQueue</text>

  <!-- Step 1: Input Intervals -->
  <g transform="translate(40, 75)">
    <rect width="280" height="370" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="280" height="30" rx="10" ry="10" fill="#1E3A8A"/>
    <text x="140" y="20" class="card-title" fill="#BFDBFE" text-anchor="middle">1. Sorted Intervals by Start Time</text>

    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="240" height="45" rx="6" ry="6" fill="#1E293B" stroke="#3B82F6"/>
      <text x="20" y="22" class="badge" fill="#93C5FD">M1: [09:00, 10:00]</text>
      <text x="20" y="38" class="card-body" font-size="11">Duration: 60m</text>

      <rect x="0" y="60" width="240" height="45" rx="6" ry="6" fill="#1E293B" stroke="#3B82F6"/>
      <text x="20" y="82" class="badge" fill="#93C5FD">M2: [09:30, 11:00]</text>
      <text x="20" y="98" class="card-body" font-size="11">Duration: 90m (Overlaps M1)</text>

      <rect x="0" y="120" width="240" height="45" rx="6" ry="6" fill="#1E293B" stroke="#3B82F6"/>
      <text x="20" y="142" class="badge" fill="#93C5FD">M3: [10:00, 12:00]</text>
      <text x="20" y="158" class="card-body" font-size="11">Duration: 120m (Starts when M1 ends)</text>

      <rect x="0" y="180" width="240" height="45" rx="6" ry="6" fill="#1E293B" stroke="#3B82F6"/>
      <text x="20" y="202" class="badge" fill="#93C5FD">M4: [11:00, 13:00]</text>
      <text x="20" y="218" class="card-body" font-size="11">Duration: 120m</text>
    </g>

    <rect x="20" y="300" width="240" height="50" rx="6" ry="6" fill="#0F172A"/>
    <text x="140" y="320" class="badge" fill="#60A5FA" text-anchor="middle">Arrays.sort(intervals, (a,b) -&gt;</text>
    <text x="140" y="338" class="badge" fill="#60A5FA" text-anchor="middle">Integer.compare(a[0], b[0]))</text>
  </g>

  <!-- Step 2: Min-Heap State Transitions -->
  <g transform="translate(360, 75)">
    <rect width="360" height="370" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="360" height="30" rx="10" ry="10" fill="#92400E"/>
    <text x="180" y="20" class="card-title" fill="#FDE68A" text-anchor="middle">2. PriorityQueue State Transitions</text>

    <!-- Transition steps -->
    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="320" height="60" rx="6" ry="6" fill="#1E293B"/>
      <text x="10" y="20" class="badge" fill="#FDE68A">T = 09:00: Process M1 [9:00, 10:00]</text>
      <text x="10" y="38" class="card-body">• Heap empty -&gt; Alloc Room 1</text>
      <text x="10" y="52" class="card-body">• Heap = [End: 10:00] (Size: 1)</text>

      <rect x="0" y="70" width="320" height="60" rx="6" ry="6" fill="#1E293B"/>
      <text x="10" y="90" class="badge" fill="#FDE68A">T = 09:30: Process M2 [9:30, 11:00]</text>
      <text x="10" y="108" class="card-body">• 9:30 &lt; heap.peek() (10:00) -&gt; Conflict!</text>
      <text x="10" y="122" class="card-body">• Alloc Room 2 -&gt; Heap = [10:00, 11:00] (Size: 2)</text>

      <rect x="0" y="140" width="320" height="70" rx="6" ry="6" fill="#1E293B"/>
      <text x="10" y="160" class="badge" fill="#10B981">T = 10:00: Process M3 [10:00, 12:00]</text>
      <text x="10" y="178" class="card-body">• 10:00 &gt;= heap.peek() (10:00) -&gt; Room 1 FREE!</text>
      <text x="10" y="192" class="card-body">• heap.poll() (removes 10:00), offer(12:00)</text>
      <text x="10" y="204" class="card-body">• Heap = [11:00, 12:00] (Size remains: 2)</text>

      <rect x="0" y="220" width="320" height="65" rx="6" ry="6" fill="#1E293B"/>
      <text x="10" y="240" class="badge" fill="#10B981">T = 11:00: Process M4 [11:00, 13:00]</text>
      <text x="10" y="258" class="card-body">• 11:00 &gt;= heap.peek() (11:00) -&gt; Room 2 FREE!</text>
      <text x="10" y="272" class="card-body">• heap.poll(), offer(13:00) -&gt; Heap = [12:00, 13:00]</text>
    </g>

    <rect x="20" y="320" width="320" height="35" rx="4" ry="4" fill="#064E3B"/>
    <text x="180" y="342" class="badge" fill="#A7F3D0" text-anchor="middle">Max Concurrent Heap Size = 2 Rooms Required</text>
  </g>

  <!-- Step 3: Optimal Invariants & Complexity -->
  <g transform="translate(760, 75)">
    <rect width="260" height="370" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="260" height="30" rx="10" ry="10" fill="#065F46"/>
    <text x="130" y="20" class="card-title" fill="#A7F3D0" text-anchor="middle">3. Complexity &amp; Invariants</text>

    <rect x="15" y="45" width="230" height="85" rx="6" ry="6" fill="#1E293B"/>
    <text x="115" y="68" class="badge" fill="#93C5FD" text-anchor="middle">Time Complexity</text>
    <text x="25" y="90" class="card-body">• Sorting: O(N log N)</text>
    <text x="25" y="108" class="card-body">• Heap inserts/pops: O(N log K)</text>
    <text x="25" y="124" class="badge" fill="#6EE7B7">Total: O(N log N)</text>

    <rect x="15" y="145" width="230" height="85" rx="6" ry="6" fill="#1E293B"/>
    <text x="115" y="168" class="badge" fill="#FDE68A" text-anchor="middle">Space Complexity</text>
    <text x="25" y="190" class="card-body">• Min-heap stores active rooms</text>
    <text x="25" y="208" class="card-body">• Max capacity = K (rooms)</text>
    <text x="25" y="224" class="badge" fill="#FCD34D">Total: O(K) Space</text>

    <rect x="15" y="245" width="230" height="105" rx="6" ry="6" fill="#1E293B" stroke="#8B5CF6"/>
    <text x="115" y="268" class="badge" fill="#DDD6FE" text-anchor="middle">Greedy Correctness</text>
    <text x="25" y="290" class="card-body">• Earliest ending meeting always</text>
    <text x="25" y="306" class="card-body">  frees its room first</text>
    <text x="25" y="324" class="card-body">• If start &lt; min(ends), no room</text>
    <text x="25" y="340" class="card-body">  is available -&gt; must allocate new</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 320 260 L 348 260 L 360 260" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  <path d="M 720 260 L 748 260 L 760 260" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
</svg>