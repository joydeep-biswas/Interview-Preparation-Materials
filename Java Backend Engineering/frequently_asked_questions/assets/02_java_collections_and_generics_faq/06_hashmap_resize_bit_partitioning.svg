<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" ry="12" stroke="#1F2937" stroke-width="1.5"/>

  <text x="530" y="32" class="title" font-size="20" text-anchor="middle">HashMap Doubling &amp; Bit Partitioning During resize()</text>
  <text x="530" y="52" class="subtitle" text-anchor="middle">Power-of-two capacity expansion without full rehashing via single bit test (hash &amp; oldCap)</text>

  <!-- Old Table State -->
  <g transform="translate(40, 75)">
    <rect width="280" height="370" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="280" height="30" rx="10" ry="10" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
    <text x="140" y="20" class="card-title" fill="#BFDBFE" text-anchor="middle">1. Old Table (Capacity = 16)</text>

    <rect x="15" y="45" width="250" height="85" rx="6" ry="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="140" y="66" class="badge" fill="#93C5FD" text-anchor="middle">Mask = (16 - 1) = 15</text>
    <text x="25" y="88" class="card-body" font-family="monospace">Binary Mask: 0000 1111</text>
    <text x="25" y="106" class="card-body">Index uses lowest 4 bits</text>
    <text x="25" y="122" class="card-body">Both nodes share index 5:</text>

    <!-- Bucket 5 Collision -->
    <g transform="translate(15, 145)">
      <rect x="0" y="0" width="250" height="85" rx="6" ry="6" fill="#0F172A" stroke="#3B82F6"/>
      <text x="15" y="22" class="badge" fill="#60A5FA">Node 1 (Key A):</text>
      <text x="15" y="38" class="card-body" font-family="monospace">Hash: ...0 0101 (Index 5)</text>

      <text x="15" y="60" class="badge" fill="#C4B5FD">Node 2 (Key B):</text>
      <text x="15" y="76" class="card-body" font-family="monospace">Hash: ...1 0101 (Index 5)</text>
    </g>

    <rect x="15" y="250" width="250" height="90" rx="6" ry="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="140" y="272" class="badge" fill="#FDE68A" text-anchor="middle">Threshold Reached</text>
    <text x="25" y="294" class="card-body">• Size exceeds 16 * 0.75 = 12</text>
    <text x="25" y="312" class="card-body">• Triggers resize(): double table</text>
    <text x="25" y="330" class="badge" fill="#FCD34D">• New Capacity = 32</text>
  </g>

  <!-- Resizing Bit Test -->
  <g transform="translate(360, 75)">
    <rect width="320" height="370" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="320" height="30" rx="10" ry="10" fill="#92400E" stroke="#F59E0B" stroke-width="1"/>
    <text x="160" y="20" class="card-title" fill="#FDE68A" text-anchor="middle">2. Fast Bit Test: (hash &amp; oldCap)</text>

    <rect x="15" y="45" width="290" height="110" rx="6" ry="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="145" y="68" class="badge" fill="#FDE68A" text-anchor="middle">New Mask = (32 - 1) = 31</text>
    <text x="25" y="90" class="card-body" font-family="monospace">Binary Mask: 0001 1111</text>
    <text x="25" y="110" class="card-body">• Exactly ONE additional bit matters:</text>
    <text x="25" y="130" class="badge" fill="#FCD34D">  Bit position 4 (value 16 = oldCap)</text>
    <text x="25" y="146" class="card-body" font-family="monospace">  checkBit = (e.hash &amp; 16)</text>

    <!-- Partition Branching -->
    <g transform="translate(15, 175)">
      <rect x="0" y="0" width="290" height="75" rx="6" ry="6" fill="#064E3B" stroke="#10B981"/>
      <text x="145" y="22" class="badge" fill="#A7F3D0" text-anchor="middle">Case 1: (hash &amp; 16) == 0</text>
      <text x="15" y="44" class="card-body">Node 1: bit is 0</text>
      <text x="15" y="62" class="badge" fill="#34D399">Remains at original index: 5 (loHead)</text>

      <rect x="0" y="85" width="290" height="75" rx="6" ry="6" fill="#4C1D95" stroke="#8B5CF6"/>
      <text x="145" y="107" class="badge" fill="#DDD6FE" text-anchor="middle">Case 2: (hash &amp; 16) != 0</text>
      <text x="15" y="129" class="card-body">Node 2: bit is 1</text>
      <text x="15" y="147" class="badge" fill="#C4B5FD">Moves to: index + 16 = 21 (hiHead)</text>
    </g>
  </g>

  <!-- New Table State -->
  <g transform="translate(720, 75)">
    <rect width="300" height="370" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="300" height="30" rx="10" ry="10" fill="#065F46" stroke="#10B981" stroke-width="1"/>
    <text x="150" y="20" class="card-title" fill="#A7F3D0" text-anchor="middle">3. New Table (Capacity = 32)</text>

    <!-- Visual Splitting into Bucket 5 and Bucket 21 -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="260" height="70" rx="6" ry="6" fill="#1E293B" stroke="#10B981"/>
      <text x="15" y="22" class="badge" fill="#A7F3D0">newTable[5]: loHead</text>
      <text x="15" y="42" class="card-body">• Contains Node 1 (Key A)</text>
      <text x="15" y="58" class="card-body" font-size="11" fill="#9CA3AF">Preserved in low partition</text>

      <rect x="0" y="85" width="260" height="70" rx="6" ry="6" fill="#1E293B" stroke="#8B5CF6"/>
      <text x="15" y="107" class="badge" fill="#DDD6FE">newTable[21]: hiHead</text>
      <text x="15" y="127" class="card-body">• Contains Node 2 (Key B)</text>
      <text x="15" y="143" class="card-body" font-size="11" fill="#9CA3AF">Relocated to high partition</text>
    </g>

    <rect x="20" y="215" width="260" height="135" rx="6" ry="6" fill="#0F172A" stroke="#374151"/>
    <text x="130" y="238" class="badge" fill="#93C5FD" text-anchor="middle">Key Architectural Invariants</text>
    <text x="15" y="260" class="card-body">• ZERO re-computation of hashCode()</text>
    <text x="15" y="278" class="card-body">• Preserves relative FIFO order</text>
    <text x="15" y="296" class="card-body">• Eliminates infinite loop hazard</text>
    <text x="15" y="312" class="card-body">  (Java 7 circular reference bug fixed!)</text>
    <text x="15" y="332" class="badge" fill="#34D399">• Perfect 50/50 uniform dispersal</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 320 260 L 348 260 L 360 260" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  <path d="M 680 260 L 708 260 L 720 260" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
</svg>