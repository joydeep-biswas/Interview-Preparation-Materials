<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" ry="12" stroke="#1F2937" stroke-width="1.5"/>

  <text x="530" y="32" class="title" font-size="20" text-anchor="middle">Generics Variance &amp; PECS: Producer Extends, Consumer Super</text>
  <text x="530" y="52" class="subtitle" text-anchor="middle">Invariance, Covariance (? extends T), and Contravariance (? super T) subtyping boundaries</text>

  <!-- Left: Type Hierarchy -->
  <g transform="translate(40, 75)">
    <rect width="240" height="370" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="240" height="30" rx="10" ry="10" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
    <text x="120" y="20" class="card-title" fill="#BFDBFE" text-anchor="middle">Base Type Hierarchy</text>

    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="200" height="50" rx="6" ry="6" fill="#1E293B" stroke="#3B82F6"/>
      <text x="100" y="20" class="badge" fill="#93C5FD" text-anchor="middle">Object (Supertype)</text>
      <text x="100" y="38" class="card-body" font-size="11" text-anchor="middle">Universal Root</text>

      <path fill="none" d="M 100 50 L 100 70" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)"/>

      <rect x="0" y="75" width="200" height="50" rx="6" ry="6" fill="#1E293B" stroke="#10B981"/>
      <text x="100" y="95" class="badge" fill="#A7F3D0" text-anchor="middle">Animal (Base Type T)</text>
      <text x="100" y="113" class="card-body" font-size="11" text-anchor="middle">Target Domain Model</text>

      <path fill="none" d="M 100 125 L 100 145" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)"/>

      <rect x="0" y="150" width="200" height="50" rx="6" ry="6" fill="#1E293B" stroke="#F59E0B"/>
      <text x="100" y="170" class="badge" fill="#FDE68A" text-anchor="middle">Dog (Subtype of Animal)</text>
      <text x="100" y="188" class="card-body" font-size="11" text-anchor="middle">Specialized Type</text>
    </g>

    <rect x="15" y="280" width="210" height="70" rx="6" ry="6" fill="#0F172A" stroke="#EF4444"/>
    <text x="105" y="302" class="badge" fill="#FCA5A5" text-anchor="middle">Default: Invariant!</text>
    <text x="25" y="322" class="card-body">List&lt;Dog&gt; is NOT a</text>
    <text x="25" y="338" class="card-body">subtype of List&lt;Animal&gt;</text>
  </g>

  <!-- Middle: Producer Extends (Covariance) -->
  <g transform="translate(320, 75)">
    <rect width="340" height="370" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="340" height="30" rx="10" ry="10" fill="#065F46" stroke="#10B981" stroke-width="1"/>
    <text x="170" y="20" class="card-title" fill="#A7F3D0" text-anchor="middle">Producer Extends: ? extends T</text>

    <rect x="15" y="45" width="310" height="85" rx="6" ry="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="155" y="66" class="badge" fill="#A7F3D0" text-anchor="middle">Covariant Read Boundary</text>
    <text x="25" y="88" class="card-body" font-family="monospace">List&lt;? extends Animal&gt; src;</text>
    <text x="25" y="106" class="card-body">Can assign: List&lt;Dog&gt; or List&lt;Animal&gt;</text>
    <text x="25" y="122" class="badge" fill="#6EE7B7">Upper Bound: Animal</text>

    <rect x="15" y="145" width="310" height="100" rx="6" ry="6" fill="#064E3B" stroke="#10B981"/>
    <text x="155" y="168" class="badge" fill="#34D399" text-anchor="middle">PRODUCE (READ): ALLOWED</text>
    <text x="25" y="190" class="card-body" font-family="monospace">Animal a = src.get(0); // OK!</text>
    <text x="25" y="208" class="card-body">Compiler knows every item in src is AT LEAST</text>
    <text x="25" y="226" class="card-body">an Animal (or subclass). Polymorphic read safe!</text>

    <rect x="15" y="260" width="310" height="95" rx="6" ry="6" fill="#450A0A" stroke="#EF4444"/>
    <text x="155" y="282" class="badge" fill="#FCA5A5" text-anchor="middle">CONSUME (WRITE): FORBIDDEN</text>
    <text x="25" y="304" class="card-body" font-family="monospace">src.add(new Dog()); // COMPILE ERROR!</text>
    <text x="25" y="322" class="card-body">Compiler cannot know if src is actually a</text>
    <text x="25" y="340" class="card-body">List&lt;Cat&gt;. Only null can be added.</text>
  </g>

  <!-- Right: Consumer Super (Contravariance) -->
  <g transform="translate(680, 75)">
    <rect width="340" height="370" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="340" height="30" rx="10" ry="10" fill="#5B21B6" stroke="#8B5CF6" stroke-width="1"/>
    <text x="170" y="20" class="card-title" fill="#DDD6FE" text-anchor="middle">Consumer Super: ? super T</text>

    <rect x="15" y="45" width="310" height="85" rx="6" ry="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="155" y="66" class="badge" fill="#DDD6FE" text-anchor="middle">Contravariant Write Boundary</text>
    <text x="25" y="88" class="card-body" font-family="monospace">List&lt;? super Dog&gt; dest;</text>
    <text x="25" y="106" class="card-body">Can assign: List&lt;Dog&gt;, List&lt;Animal&gt;, List&lt;Object&gt;</text>
    <text x="25" y="122" class="badge" fill="#C4B5FD">Lower Bound: Dog</text>

    <rect x="15" y="145" width="310" height="100" rx="6" ry="6" fill="#4C1D95" stroke="#8B5CF6"/>
    <text x="155" y="168" class="badge" fill="#C4B5FD" text-anchor="middle">CONSUME (WRITE): ALLOWED</text>
    <text x="25" y="190" class="card-body" font-family="monospace">dest.add(new Dog()); // OK!</text>
    <text x="25" y="208" class="card-body">Compiler guarantees dest holds at least Dog or</text>
    <text x="25" y="226" class="card-body">a supertype (Animal/Object). Always type-safe!</text>

    <rect x="15" y="260" width="310" height="95" rx="6" ry="6" fill="#1E293B" stroke="#F59E0B"/>
    <text x="155" y="282" class="badge" fill="#FDE68A" text-anchor="middle">PRODUCE (READ): DEGRADED</text>
    <text x="25" y="304" class="card-body" font-family="monospace">Object obj = dest.get(0); // Only Object</text>
    <text x="25" y="322" class="card-body">Cannot read as Dog or Animal without unsafe</text>
    <text x="25" y="340" class="card-body">casting because list might actually be List&lt;Object&gt;.</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 280 260 L 308 260 L 320 260" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M 660 260 L 668 260 L 680 260" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
</svg>