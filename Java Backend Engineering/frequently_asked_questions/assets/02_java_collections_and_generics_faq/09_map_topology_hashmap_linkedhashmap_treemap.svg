<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" ry="12"/>

  <text x="530" y="32" class="title" font-size="20" text-anchor="middle">Comparative Topologies: HashMap vs LinkedHashMap vs TreeMap</text>
  <text x="530" y="52" class="subtitle" text-anchor="middle">Bucket hash table, doubly-linked insertion order, and balanced Red-Black tree topologies</text>

  <!-- 1. HashMap Card -->
  <g transform="translate(40, 75)">
    <rect width="300" height="370" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="300" height="30" rx="10" ry="10" fill="#1E3A8A"/>
    <text x="150" y="20" class="card-title" fill="#BFDBFE" text-anchor="middle">1. HashMap (Unordered)</text>

    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="260" height="90" rx="6" ry="6" fill="#1E293B"/>
      <text x="130" y="20" class="badge" fill="#93C5FD" text-anchor="middle">Hash Table + Chaining</text>
      <text x="15" y="42" class="card-body">• Bucket array: Node&lt;K,V&gt;[]</text>
      <text x="15" y="60" class="card-body">• Singly-linked list per bucket</text>
      <text x="15" y="78" class="card-body">• Treeify to Red-Black Tree if &gt; 8</text>

      <rect x="0" y="105" width="260" height="90" rx="6" ry="6" fill="#0F172A" stroke="#3B82F6"/>
      <text x="130" y="125" class="badge" fill="#60A5FA" text-anchor="middle">Ordering Contract</text>
      <text x="15" y="148" class="card-body">• NO ORDER GUARANTEED</text>
      <text x="15" y="166" class="card-body">• Iteration order changes on resize()!</text>
      <text x="15" y="184" class="card-body">• Fastest throughput for pure lookups</text>

      <rect x="0" y="210" width="260" height="70" rx="6" ry="6" fill="#064E3B"/>
      <text x="130" y="232" class="badge" fill="#A7F3D0" text-anchor="middle">Complexity: O(1) Average</text>
      <text x="15" y="252" class="card-body">get / put: O(1) [Worst case O(log N)]</text>
      <text x="15" y="268" class="card-body">Memory overhead: Lowest (~32B/entry)</text>
    </g>
  </g>

  <!-- 2. LinkedHashMap Card -->
  <g transform="translate(380, 75)">
    <rect width="300" height="370" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="300" height="30" rx="10" ry="10" fill="#065F46"/>
    <text x="150" y="20" class="card-title" fill="#A7F3D0" text-anchor="middle">2. LinkedHashMap (Predictable Order)</text>

    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="260" height="90" rx="6" ry="6" fill="#1E293B"/>
      <text x="130" y="20" class="badge" fill="#A7F3D0" text-anchor="middle">Hash Table + Doubly-Linked List</text>
      <text x="15" y="42" class="card-body">• Inherits HashMap bucket array</text>
      <text x="15" y="60" class="card-body">• PLUS Entry.before &amp; Entry.after</text>
      <text x="15" y="78" class="card-body">• Global doubly-linked chain</text>

      <rect x="0" y="105" width="260" height="90" rx="6" ry="6" fill="#0F172A" stroke="#10B981"/>
      <text x="130" y="125" class="badge" fill="#34D399" text-anchor="middle">Ordering Contract</text>
      <text x="15" y="148" class="card-body">• Insertion Order (Default)</text>
      <text x="15" y="166" class="card-body">• Access Order (LRU Cache mode!)</text>
      <text x="15" y="184" class="card-body">• removeEldestEntry() hook for caches</text>

      <rect x="0" y="210" width="260" height="70" rx="6" ry="6" fill="#064E3B"/>
      <text x="130" y="232" class="badge" fill="#A7F3D0" text-anchor="middle">Complexity: O(1) Average</text>
      <text x="15" y="252" class="card-body">get / put: O(1)</text>
      <text x="15" y="268" class="card-body">Memory overhead: +16B (before/after pointers)</text>
    </g>
  </g>

  <!-- 3. TreeMap Card -->
  <g transform="translate(720, 75)">
    <rect width="300" height="370" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="300" height="30" rx="10" ry="10" fill="#5B21B6"/>
    <text x="150" y="20" class="card-title" fill="#DDD6FE" text-anchor="middle">3. TreeMap (Sorted NavigableMap)</text>

    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="260" height="90" rx="6" ry="6" fill="#1E293B"/>
      <text x="130" y="20" class="badge" fill="#DDD6FE" text-anchor="middle">Red-Black Self-Balancing Tree</text>
      <text x="15" y="42" class="card-body">• Entry&lt;K,V&gt; left, right, parent</text>
      <text x="15" y="60" class="card-body">• Rooted binary search tree</text>
      <text x="15" y="78" class="card-body">• No hash table, no buckets!</text>

      <rect x="0" y="105" width="260" height="90" rx="6" ry="6" fill="#0F172A" stroke="#8B5CF6"/>
      <text x="130" y="125" class="badge" fill="#C4B5FD" text-anchor="middle">Ordering Contract</text>
      <text x="15" y="148" class="card-body">• Natural Order (Comparable)</text>
      <text x="15" y="166" class="card-body">• Custom Comparator supplied</text>
      <text x="15" y="184" class="card-body">• Range queries: subMap, headMap</text>

      <rect x="0" y="210" width="260" height="70" rx="6" ry="6" fill="#4C1D95"/>
      <text x="130" y="232" class="badge" fill="#DDD6FE" text-anchor="middle">Complexity: O(log N) Guaranteed</text>
      <text x="15" y="252" class="card-body">get / put / remove: O(log N)</text>
      <text x="15" y="268" class="card-body">Provides firstKey(), lastKey(), ceilingKey()</text>
    </g>
  </g>
</svg>