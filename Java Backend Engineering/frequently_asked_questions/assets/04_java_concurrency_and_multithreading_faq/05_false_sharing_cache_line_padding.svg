<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" ry="12" stroke="#1F2937" stroke-width="1.5"/>

  <text x="530" y="32" class="title" font-size="20" text-anchor="middle">CPU False Sharing &amp; Cache Line Padding (@Contended)</text>
  <text x="530" y="52" class="subtitle" text-anchor="middle">Cache line ping-ponging across CPU cores vs 128-byte hardware isolation</text>

  <!-- Problem: False Sharing -->
  <g transform="translate(40, 75)">
    <rect width="460" height="230" rx="10" ry="10" fill="#111827" stroke="#EF4444" stroke-width="2"/>
    <rect width="460" height="30" rx="10" ry="10" fill="#7F1D1D" stroke="#EF4444" stroke-width="1"/>
    <text x="230" y="20" class="card-title" fill="#FCA5A5" text-anchor="middle">False Sharing: Co-located in Same 64-Byte Cache Line</text>

    <!-- Visual 64-Byte Cache Line -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="420" height="55" rx="6" ry="6" fill="#1E293B" stroke="#EF4444"/>
      <rect x="10" y="8" width="190" height="38" rx="4" ry="4" fill="#450A0A" stroke="#EF4444"/>
      <text x="105" y="26" class="badge" fill="#FCA5A5" text-anchor="middle">volatile long x (8 Bytes)</text>
      <text x="105" y="39" class="card-body" font-size="10" text-anchor="middle">Updated by Thread 1 (Core 1)</text>

      <rect x="220" y="8" width="190" height="38" rx="4" ry="4" fill="#450A0A" stroke="#EF4444"/>
      <text x="315" y="26" class="badge" fill="#FCA5A5" text-anchor="middle">volatile long y (8 Bytes)</text>
      <text x="315" y="39" class="card-body" font-size="10" text-anchor="middle">Updated by Thread 2 (Core 2)</text>
    </g>

    <rect x="20" y="120" width="420" height="90" rx="6" ry="6" fill="#450A0A" stroke="#EF4444"/>
    <text x="230" y="140" class="badge" fill="#F87171" text-anchor="middle">The Cache Line Bounce (Ping-Pong Effect)</text>
    <text x="30" y="160" class="card-body">• Writing to 'x' invalidates the ENTIRE 64-byte line on Core 2!</text>
    <text x="30" y="178" class="card-body">• Core 2 writing to 'y' invalidates the ENTIRE 64-byte line on Core 1!</text>
    <text x="30" y="194" class="badge" fill="#FCA5A5">• Cores waste 95% of clock cycles re-fetching cache lines from L3!</text>
  </g>

  <!-- Solution: Cache Line Padding / @Contended -->
  <g transform="translate(560, 75)">
    <rect width="460" height="230" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="460" height="30" rx="10" ry="10" fill="#065F46" stroke="#10B981" stroke-width="1"/>
    <text x="230" y="20" class="card-title" fill="#A7F3D0" text-anchor="middle">Isolation: Cache Line Padding (@Contended)</text>

    <!-- Visual Separate Cache Lines -->
    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="420" height="30" rx="4" ry="4" fill="#064E3B" stroke="#10B981"/>
      <text x="210" y="20" class="badge" fill="#A7F3D0" text-anchor="middle">Cache Line 1: volatile long x (Padded with 128 bytes)</text>

      <rect x="0" y="36" width="420" height="30" rx="4" ry="4" fill="#064E3B" stroke="#10B981"/>
      <text x="210" y="56" class="badge" fill="#A7F3D0" text-anchor="middle">Cache Line 2: volatile long y (Padded with 128 bytes)</text>
    </g>

    <rect x="20" y="120" width="420" height="90" rx="6" ry="6" fill="#064E3B" stroke="#10B981"/>
    <text x="230" y="140" class="badge" fill="#34D399" text-anchor="middle">Complete Independence &amp; Peak Throughput</text>
    <text x="30" y="160" class="card-body">• Each variable resides on its own private hardware cache line</text>
    <text x="30" y="178" class="card-body">• Writes to 'x' do NOT invalidate 'y' on Core 2!</text>
    <text x="30" y="194" class="badge" fill="#A7F3D0">• Core 1 and Core 2 execute at 100% full hardware L1/L2 speed</text>
  </g>

  <!-- Bottom: Industry Applications (LongAdder, Disruptor) -->
  <g transform="translate(40, 325)">
    <rect width="980" height="135" rx="10" ry="10" fill="#111827" stroke="#1F2937" stroke-width="1.5"/>
    <rect width="980" height="26" rx="10" ry="10" fill="#1F2937" stroke="#334155" stroke-width="1"/>
    <text x="490" y="18" class="card-title" fill="#E5E7EB" text-anchor="middle">Production Architecture Applications</text>

    <g transform="translate(30, 40)">
      <text x="10" y="20" class="badge" fill="#60A5FA">1. java.util.concurrent.atomic.LongAdder:</text>
      <text x="270" y="20" class="card-body">Uses an internal Cell[] array annotated with @jdk.internal.vm.annotation.Contended.</text>
      <text x="270" y="36" class="card-body">Different threads update different cells without false sharing, scaling counters linearly across cores!</text>

      <text x="10" y="60" class="badge" fill="#A7F3D0">2. LMAX Disruptor High-Frequency RingBuffer:</text>
      <text x="270" y="60" class="card-body">Explicitly pads sequence numbers with 7 dummy longs: p1, p2, p3, p4, p5, p6, p7 = 56 bytes.</text>
      <text x="270" y="76" class="card-body">Ensures ring buffer head and tail pointers never share a cache line, yielding 20M+ msgs/sec.</text>
    </g>
  </g>
</svg>