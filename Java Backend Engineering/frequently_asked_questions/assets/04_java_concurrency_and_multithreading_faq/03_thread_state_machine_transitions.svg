<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" ry="12"/>

  <text x="530" y="32" class="title" font-size="20" text-anchor="middle">JVM Thread State Machine &amp; Lifecycle Transitions</text>
  <text x="530" y="52" class="subtitle" text-anchor="middle">Thread.State enum transitions between NEW, RUNNABLE, BLOCKED, WAITING, TIMED_WAITING, and TERMINATED</text>

  <!-- NEW State -->
  <g transform="translate(40, 190)">
    <rect width="160" height="90" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="160" height="26" rx="10" ry="10" fill="#1E3A8A"/>
    <text x="80" y="18" class="card-title" fill="#BFDBFE" text-anchor="middle">NEW</text>
    <text x="15" y="48" class="card-body">new Thread(r)</text>
    <text x="15" y="66" class="card-body" font-size="11" fill="#9CA3AF">Thread object created</text>
    <text x="15" y="80" class="badge" fill="#60A5FA">start() not called</text>
  </g>

  <!-- RUNNABLE State (Central hub) -->
  <g transform="translate(270, 160)">
    <rect width="250" height="150" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="250" height="30" rx="10" ry="10" fill="#065F46"/>
    <text x="125" y="20" class="card-title" fill="#A7F3D0" text-anchor="middle">RUNNABLE</text>
    <rect x="15" y="42" width="220" height="42" rx="4" ry="4" fill="#1E293B"/>
    <text x="125" y="58" class="badge" fill="#34D399" text-anchor="middle">Ready &amp; Running</text>
    <text x="125" y="74" class="card-body" font-size="10" text-anchor="middle">Dispatched by OS scheduler on CPU core</text>
    <text x="15" y="104" class="card-body">• Executing bytecode or in OS I/O</text>
    <text x="15" y="122" class="card-body">• In JVM, I/O wait is still RUNNABLE!</text>
    <text x="15" y="138" class="badge" fill="#A7F3D0">Yielding: Thread.yield()</text>
  </g>

  <!-- BLOCKED State (Monitor lock) -->
  <g transform="translate(590, 75)">
    <rect width="230" height="100" rx="10" ry="10" fill="#111827" stroke="#EF4444" stroke-width="2"/>
    <rect width="230" height="26" rx="10" ry="10" fill="#7F1D1D"/>
    <text x="115" y="18" class="card-title" fill="#FCA5A5" text-anchor="middle">BLOCKED (Monitor Lock)</text>
    <text x="15" y="44" class="card-body">• Waiting for synchronized block/method</text>
    <text x="15" y="60" class="card-body">• Another thread holds the object monitor</text>
    <text x="15" y="76" class="badge" fill="#F87171">Re-enters RUNNABLE when lock acquired</text>
    <text x="15" y="90" class="card-body" font-size="10" fill="#9CA3AF">Only synchronized causes BLOCKED!</text>
  </g>

  <!-- WAITING State (Indefinite) -->
  <g transform="translate(590, 195)">
    <rect width="230" height="100" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="230" height="26" rx="10" ry="10" fill="#92400E"/>
    <text x="115" y="18" class="card-title" fill="#FDE68A" text-anchor="middle">WAITING (Indefinite)</text>
    <text x="15" y="44" class="card-body">• Object.wait(), Thread.join()</text>
    <text x="15" y="60" class="card-body">• LockSupport.park() [ReentrantLock]</text>
    <text x="15" y="76" class="badge" fill="#FCD34D">Requires explicit notify() / unpark()</text>
    <text x="15" y="90" class="card-body" font-size="10" fill="#9CA3AF">Does not consume CPU cycles</text>
  </g>

  <!-- TIMED_WAITING State (With Timeout) -->
  <g transform="translate(590, 315)">
    <rect width="230" height="100" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="230" height="26" rx="10" ry="10" fill="#5B21B6"/>
    <text x="115" y="18" class="card-title" fill="#DDD6FE" text-anchor="middle">TIMED_WAITING</text>
    <text x="15" y="44" class="card-body">• Thread.sleep(millis)</text>
    <text x="15" y="60" class="card-body">• Object.wait(timeout), join(timeout)</text>
    <text x="15" y="76" class="card-body">• LockSupport.parkNanos()</text>
    <text x="15" y="92" class="badge" fill="#C4B5FD">Returns to RUNNABLE when timer expires</text>
  </g>

  <!-- TERMINATED State -->
  <g transform="translate(880, 190)">
    <rect width="140" height="90" rx="10" ry="10" fill="#111827" stroke="#6B7280" stroke-width="2"/>
    <rect width="140" height="26" rx="10" ry="10" fill="#374151"/>
    <text x="70" y="18" class="card-title" fill="#E5E7EB" text-anchor="middle">TERMINATED</text>
    <text x="15" y="48" class="card-body">• run() completed</text>
    <text x="15" y="66" class="card-body" font-size="11" fill="#9CA3AF">Or uncaught exception</text>
    <text x="15" y="80" class="badge" fill="#9CA3AF">Dead: cannot restart</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <!-- NEW -> RUNNABLE -->
  <path d="M 200 235 L 258 235 L 270 235" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <!-- RUNNABLE -> BLOCKED -->
  <path d="M 520 200 L 545 200 Q 555 200 555 125 L 578 125 L 590 125" fill="none" stroke="#EF4444" stroke-width="2.5" marker-end="url(#arrow-red)"/>

  <!-- RUNNABLE -> WAITING -->
  <path d="M 520 235 L 578 235 L 590 235" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>

  <!-- RUNNABLE -> TIMED_WAITING -->
  <path d="M 520 270 L 545 270 Q 555 270 555 365 L 578 365 L 590 365" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>

  <!-- RUNNABLE -> TERMINATED -->
  <path d="M 520 235 L 820 440 L 950 440 L 950 292 L 950 280" fill="none" stroke="#6B7280" stroke-dasharray="4,4" stroke-width="1.5"/>
</svg>