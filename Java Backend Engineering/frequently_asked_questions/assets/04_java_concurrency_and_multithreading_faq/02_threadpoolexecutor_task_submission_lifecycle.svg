<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" ry="12" stroke="#1F2937" stroke-width="1.5"/>

  <text x="530" y="32" class="title" font-size="20" text-anchor="middle">ThreadPoolExecutor Task Submission Lifecycle</text>
  <text x="530" y="52" class="subtitle" text-anchor="middle">Execution progression: corePoolSize -> workQueue capacity -> maximumPoolSize -> RejectedExecutionHandler</text>

  <!-- Step 1: Core Pool Allocation -->
  <g transform="translate(40, 75)">
    <rect width="220" height="370" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="220" height="30" rx="10" ry="10" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
    <text x="110" y="20" class="card-title" fill="#BFDBFE" text-anchor="middle">1. Core Pool Allocation</text>

    <rect x="15" y="45" width="190" height="60" rx="6" ry="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="95" y="66" class="badge" fill="#93C5FD" text-anchor="middle">Task Submitted</text>
    <text x="25" y="86" class="card-body" font-family="monospace">executor.execute(task)</text>

    <rect x="15" y="115" width="190" height="95" rx="6" ry="6" fill="#1E293B" stroke="#3B82F6"/>
    <text x="95" y="136" class="badge" fill="#60A5FA" text-anchor="middle">Check: count &lt; corePoolSize?</text>
    <text x="25" y="158" class="card-body">YES: Spawn new Worker</text>
    <text x="25" y="174" class="card-body">thread immediately</text>
    <text x="25" y="192" class="badge" fill="#34D399">• Executes task now</text>

    <rect x="15" y="225" width="190" height="110" rx="6" ry="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="95" y="246" class="badge" fill="#FDE68A" text-anchor="middle">NO: Core Pool is Full</text>
    <text x="25" y="268" class="card-body">Does NOT spawn max</text>
    <text x="25" y="284" class="card-body">threads yet! Defers to</text>
    <text x="25" y="300" class="card-body">workQueue first.</text>
    <text x="25" y="318" class="badge" fill="#FCD34D">-&gt; Routes to Queue</text>
  </g>

  <!-- Step 2: WorkQueue Buffer -->
  <g transform="translate(290, 75)">
    <rect width="230" height="370" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="230" height="30" rx="10" ry="10" fill="#92400E" stroke="#F59E0B" stroke-width="1"/>
    <text x="115" y="20" class="card-title" fill="#FDE68A" text-anchor="middle">2. BlockingQueue Buffer</text>

    <rect x="15" y="45" width="200" height="75" rx="6" ry="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="100" y="66" class="badge" fill="#FDE68A" text-anchor="middle">workQueue.offer(task)</text>
    <text x="25" y="88" class="card-body">ArrayBlockingQueue or</text>
    <text x="25" y="104" class="card-body">LinkedBlockingQueue</text>

    <rect x="15" y="130" width="200" height="90" rx="6" ry="6" fill="#064E3B" stroke="#10B981"/>
    <text x="100" y="152" class="badge" fill="#A7F3D0" text-anchor="middle">Queue Has Capacity?</text>
    <text x="20" y="174" class="card-body">YES: task queued in FIFO</text>
    <text x="20" y="190" class="card-body">Core workers poll() when free</text>
    <text x="20" y="206" class="badge" fill="#34D399">• Handled asynchronously</text>

    <rect x="15" y="230" width="200" height="105" rx="6" ry="6" fill="#451A03" stroke="#F59E0B"/>
    <text x="100" y="252" class="badge" fill="#FDE68A" text-anchor="middle">NO: Queue is 100% Full</text>
    <text x="20" y="274" class="card-body">offer() returns false!</text>
    <text x="20" y="290" class="card-body">Now executor must try</text>
    <text x="20" y="306" class="card-body">to burst beyond core</text>
    <text x="20" y="322" class="badge" fill="#F59E0B">-&gt; Try Max Pool</text>
  </g>

  <!-- Step 3: Burst to MaximumPoolSize -->
  <g transform="translate(545, 75)">
    <rect width="230" height="370" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="230" height="30" rx="10" ry="10" fill="#5B21B6" stroke="#8B5CF6" stroke-width="1"/>
    <text x="115" y="20" class="card-title" fill="#DDD6FE" text-anchor="middle">3. Max Pool Burst</text>

    <rect x="15" y="45" width="200" height="75" rx="6" ry="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="100" y="66" class="badge" fill="#DDD6FE" text-anchor="middle">Check: count &lt; maxPool?</text>
    <text x="25" y="88" class="card-body">Evaluates if extra</text>
    <text x="25" y="104" class="card-body">workers are allowed</text>

    <rect x="15" y="130" width="200" height="90" rx="6" ry="6" fill="#4C1D95" stroke="#8B5CF6"/>
    <text x="100" y="152" class="badge" fill="#C4B5FD" text-anchor="middle">YES: Spawn Extra Worker</text>
    <text x="20" y="174" class="card-body">Temporary burst thread</text>
    <text x="20" y="190" class="card-body">Dies after keepAliveTime</text>
    <text x="20" y="206" class="badge" fill="#A7F3D0">• Executes task directly</text>

    <rect x="15" y="230" width="200" height="105" rx="6" ry="6" fill="#450A0A" stroke="#EF4444"/>
    <text x="100" y="252" class="badge" fill="#FCA5A5" text-anchor="middle">NO: Max Pool Exhausted</text>
    <text x="20" y="274" class="card-body">Both Queue AND Max</text>
    <text x="20" y="290" class="card-body">Threads are saturated!</text>
    <text x="20" y="306" class="card-body">System is overwhelmed</text>
    <text x="20" y="322" class="badge" fill="#F87171">-&gt; Reject Task</text>
  </g>

  <!-- Step 4: RejectedExecutionHandler -->
  <g transform="translate(800, 75)">
    <rect width="220" height="370" rx="10" ry="10" fill="#111827" stroke="#EF4444" stroke-width="2"/>
    <rect width="220" height="30" rx="10" ry="10" fill="#7F1D1D" stroke="#EF4444" stroke-width="1"/>
    <text x="110" y="20" class="card-title" fill="#FCA5A5" text-anchor="middle">4. Rejection Policy</text>

    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="190" height="65" rx="6" ry="6" fill="#1E293B" stroke="#3B82F6"/>
      <text x="15" y="20" class="badge" fill="#93C5FD">CallerRunsPolicy</text>
      <text x="15" y="38" class="card-body">Calling thread runs it!</text>
      <text x="15" y="52" class="card-body" font-size="11" fill="#93C5FD">Provides natural backpressure</text>

      <rect x="0" y="75" width="190" height="65" rx="6" ry="6" fill="#1E293B" stroke="#EF4444"/>
      <text x="15" y="95" class="badge" fill="#FCA5A5">AbortPolicy (Default)</text>
      <text x="15" y="113" class="card-body" font-family="monospace">RejectedExecutionException</text>
      <text x="15" y="127" class="card-body" font-size="11" fill="#FCA5A5">Fails fast immediately</text>

      <rect x="0" y="150" width="190" height="65" rx="6" ry="6" fill="#1E293B" stroke="#F59E0B"/>
      <text x="15" y="170" class="badge" fill="#FDE68A">DiscardOldestPolicy</text>
      <text x="15" y="188" class="card-body">Drops head of workQueue</text>
      <text x="15" y="202" class="card-body" font-size="11" fill="#FDE68A">Retries task submission</text>

      <rect x="0" y="225" width="190" height="55" rx="6" ry="6" fill="#1E293B" stroke="#6B7280"/>
      <text x="15" y="245" class="badge" fill="#9CA3AF">DiscardPolicy</text>
      <text x="15" y="263" class="card-body">Silently drops task</text>
    </g>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 260 260 L 278 260 L 290 260" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  <path d="M 520 260 L 533 260 L 545 260" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <path d="M 775 260 L 788 260 L 800 260" fill="none" stroke="#EF4444" stroke-width="2.5" marker-end="url(#arrow-red)"/>
</svg>