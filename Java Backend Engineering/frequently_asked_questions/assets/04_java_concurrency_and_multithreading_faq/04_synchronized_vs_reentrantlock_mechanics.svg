<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" ry="12"/>

  <text x="530" y="32" class="title" font-size="20" text-anchor="middle">Lock Mechanisms: synchronized vs ReentrantLock (AQS)</text>
  <text x="530" y="52" class="subtitle" text-anchor="middle">JVM Mark Word lock inflation vs AbstractQueuedSynchronizer state machine</text>

  <!-- synchronized Card -->
  <g transform="translate(40, 75)">
    <rect width="460" height="370" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="460" height="30" rx="10" ry="10" fill="#1E3A8A"/>
    <text x="230" y="20" class="card-title" fill="#BFDBFE" text-anchor="middle">synchronized: JVM Object Monitor (Implicit)</text>

    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="420" height="65" rx="6" ry="6" fill="#1E293B"/>
      <text x="15" y="20" class="badge" fill="#93C5FD">1. Biased Locking (Legacy / Deprecated)</text>
      <text x="15" y="38" class="card-body">Biased toward thread ID in object Mark Word without atomic ops.</text>
      <text x="15" y="54" class="card-body" font-size="11" fill="#9CA3AF">Revocation triggers global safepoint pause.</text>

      <rect x="0" y="75" width="420" height="65" rx="6" ry="6" fill="#1E293B" stroke="#3B82F6"/>
      <text x="15" y="95" class="badge" fill="#60A5FA">2. Lightweight Lock (Thin CAS)</text>
      <text x="15" y="113" class="card-body">CAS sets Mark Word to point to thread stack frame BasicObjectLock.</text>
      <text x="15" y="129" class="card-body" font-size="11" fill="#93C5FD">If uncontended: Zero OS context switch overhead (~5-10ns).</text>

      <rect x="0" y="150" width="420" height="65" rx="6" ry="6" fill="#1E293B" stroke="#EF4444"/>
      <text x="15" y="170" class="badge" fill="#FCA5A5">3. Heavyweight Lock (Fat OS Mutex Inflation)</text>
      <text x="15" y="188" class="card-body">When collision occurs: Inflates to OS ObjectMonitor mutex.</text>
      <text x="15" y="204" class="card-body" font-size="11" fill="#FCA5A5">Threads park() and enter kernel context switch (1,000 - 2,000ns!).</text>
    </g>

    <rect x="20" y="275" width="420" height="80" rx="6" ry="6" fill="#0F172A" stroke="#3B82F6"/>
    <text x="210" y="296" class="badge" fill="#93C5FD" text-anchor="middle">Architectural Characteristics</text>
    <text x="25" y="318" class="card-body">• Block-scoped: Auto-unlocks on exit or exception (cannot leak!)</text>
    <text x="25" y="336" class="card-body">• Cannot timeout: Thread waits forever if deadlock occurs</text>
    <text x="25" y="352" class="card-body">• Unfair by default: Cannot guarantee FIFO fairness</text>
  </g>

  <!-- ReentrantLock Card -->
  <g transform="translate(560, 75)">
    <rect width="460" height="370" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="460" height="30" rx="10" ry="10" fill="#065F46"/>
    <text x="230" y="20" class="card-title" fill="#A7F3D0" text-anchor="middle">ReentrantLock: AQS Java State Machine (Explicit)</text>

    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="420" height="65" rx="6" ry="6" fill="#1E293B"/>
      <text x="15" y="20" class="badge" fill="#A7F3D0">1. AQS Volatile State</text>
      <text x="15" y="38" class="card-body" font-family="monospace">volatile int state = 0; // 0=Unlocked, &gt;0=Reentrant count</text>
      <text x="15" y="54" class="card-body" font-size="11" fill="#A7F3D0">CAS state 0 -&gt; 1 acquires lock without kernel call.</text>

      <rect x="0" y="75" width="420" height="65" rx="6" ry="6" fill="#1E293B" stroke="#10B981"/>
      <text x="15" y="95" class="badge" fill="#34D399">2. CLH Lock Wait Queue</text>
      <text x="15" y="113" class="card-body">Contending threads enqueued in Doubly-Linked Node queue.</text>
      <text x="15" y="129" class="card-body" font-size="11" fill="#6EE7B7">Supports strictly fair (FIFO) or unfair acquisition modes.</text>

      <rect x="0" y="150" width="420" height="65" rx="6" ry="6" fill="#1E293B" stroke="#8B5CF6"/>
      <text x="15" y="170" class="badge" fill="#DDD6FE">3. Advanced Capabilities</text>
      <text x="15" y="188" class="card-body">• tryLock(timeout, unit): Prevents deadlocks with timeout</text>
      <text x="15" y="204" class="card-body">• lockInterruptibly(): Can cancel blocked thread</text>
    </g>

    <rect x="20" y="275" width="420" height="80" rx="6" ry="6" fill="#064E3B" stroke="#10B981"/>
    <text x="210" y="296" class="badge" fill="#A7F3D0" text-anchor="middle">Architectural Characteristics &amp; Risk</text>
    <text x="25" y="318" class="card-body">• Explicit try / finally MUST be used: lock.unlock() in finally</text>
    <text x="25" y="336" class="card-body">• Multiple Condition variables: cond.await() / cond.signal()</text>
    <text x="25" y="352" class="badge" fill="#FDE68A">• If unlock() is forgotten in finally -&gt; Permanent deadlock leak!</text>
  </g>
</svg>