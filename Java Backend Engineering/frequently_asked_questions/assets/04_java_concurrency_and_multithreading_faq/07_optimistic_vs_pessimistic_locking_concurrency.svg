<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" ry="12" stroke="#1F2937" stroke-width="1.5"/>

  <text x="530" y="32" class="title" font-size="20" text-anchor="middle">Concurrency Control: Optimistic vs Pessimistic Locking</text>
  <text x="530" y="52" class="subtitle" text-anchor="middle">Application-level @Version CAS vs Database row-level SELECT FOR UPDATE mutex</text>

  <!-- Strategy 1: Optimistic Locking -->
  <g transform="translate(40, 75)">
    <rect width="460" height="370" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="460" height="30" rx="10" ry="10" fill="#065F46" stroke="#10B981" stroke-width="1"/>
    <text x="230" y="20" class="card-title" fill="#A7F3D0" text-anchor="middle">1. Optimistic Locking (@Version CAS)</text>

    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="420" height="60" rx="6" ry="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="15" y="20" class="badge" fill="#A7F3D0">Step 1: Read Without Locks</text>
      <text x="15" y="38" class="card-body" font-family="monospace">Account a = repo.findById(1); // balance=$100, version=1</text>
      <text x="15" y="52" class="card-body" font-size="11" fill="#6EE7B7">Zero database lock held; non-blocking read</text>

      <rect x="0" y="70" width="420" height="65" rx="6" ry="6" fill="#1E293B" stroke="#10B981"/>
      <text x="15" y="90" class="badge" fill="#34D399">Step 2: Commit with Version Check (CAS)</text>
      <text x="15" y="108" class="card-body" font-family="monospace">UPDATE account SET balance=$120, version=2</text>
      <text x="15" y="124" class="card-body" font-family="monospace">WHERE id=1 AND version=1;</text>

      <rect x="0" y="145" width="420" height="75" rx="6" ry="6" fill="#064E3B" stroke="#10B981"/>
      <text x="15" y="165" class="badge" fill="#A7F3D0">Step 3: Outcome Handling</text>
      <text x="15" y="185" class="card-body">• If row count == 1: Success! Update committed.</text>
      <text x="15" y="202" class="card-body">• If row count == 0: Collision! Throws OptimisticLockException.</text>
      <text x="15" y="214" class="badge" fill="#FDE68A">  Application catches exception and retries.</text>
    </g>

    <rect x="20" y="280" width="420" height="75" rx="6" ry="6" fill="#0F172A" stroke="#10B981"/>
    <text x="210" y="300" class="badge" fill="#A7F3D0" text-anchor="middle">Optimal Workload Profile</text>
    <text x="25" y="322" class="card-body">• High Read to Write ratio (&gt; 90% reads)</text>
    <text x="25" y="338" class="card-body">• Low contention frequency; high scalability across replicas</text>
  </g>

  <!-- Strategy 2: Pessimistic Locking -->
  <g transform="translate(560, 75)">
    <rect width="460" height="370" rx="10" ry="10" fill="#111827" stroke="#EF4444" stroke-width="2"/>
    <rect width="460" height="30" rx="10" ry="10" fill="#7F1D1D" stroke="#EF4444" stroke-width="1"/>
    <text x="230" y="20" class="card-title" fill="#FCA5A5" text-anchor="middle">2. Pessimistic Locking (SELECT FOR UPDATE)</text>

    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="420" height="60" rx="6" ry="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="15" y="20" class="badge" fill="#FCA5A5">Step 1: Exclusive DB Row Lock</text>
      <text x="15" y="38" class="card-body" font-family="monospace">SELECT * FROM account WHERE id=1 FOR UPDATE;</text>
      <text x="15" y="52" class="card-body" font-size="11" fill="#FCA5A5">DB engine acquires exclusive write lock on row</text>

      <rect x="0" y="70" width="420" height="65" rx="6" ry="6" fill="#450A0A" stroke="#EF4444"/>
      <text x="15" y="90" class="badge" fill="#F87171">Step 2: Concurrent Transactions BLOCKED</text>
      <text x="15" y="108" class="card-body">All other transactions attempting to read/update account 1</text>
      <text x="15" y="124" class="card-body">are queued and blocked at DB engine until COMMIT!</text>

      <rect x="0" y="145" width="420" height="75" rx="6" ry="6" fill="#1E293B" stroke="#3B82F6"/>
      <text x="15" y="165" class="badge" fill="#93C5FD">Step 3: Update &amp; Commit</text>
      <text x="15" y="185" class="card-body" font-family="monospace">UPDATE account SET balance=$120 WHERE id=1;</text>
      <text x="15" y="202" class="card-body" font-family="monospace">COMMIT; // Releases DB row lock</text>
      <text x="15" y="214" class="badge" fill="#34D399">Guaranteed zero collision retries!</text>
    </g>

    <rect x="20" y="280" width="420" height="75" rx="6" ry="6" fill="#450A0A" stroke="#EF4444"/>
    <text x="210" y="300" class="badge" fill="#FCA5A5" text-anchor="middle">Optimal Workload Profile &amp; Hazards</text>
    <text x="25" y="322" class="card-body">• High write contention (e.g. Flash sales, inventory countdown)</text>
    <text x="25" y="338" class="card-body">• Danger: Severely degrades DB concurrency &amp; causes deadlocks!</text>
  </g>
</svg>