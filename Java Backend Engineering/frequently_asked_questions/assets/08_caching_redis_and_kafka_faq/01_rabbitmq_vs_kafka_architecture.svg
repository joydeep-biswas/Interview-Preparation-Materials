<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" ry="12" stroke="#1F2937" stroke-width="1.5"/>

  <text x="530" y="32" class="title" font-size="20" text-anchor="middle">Event Streaming vs Message Queuing: RabbitMQ vs Apache Kafka</text>
  <text x="530" y="52" class="subtitle" text-anchor="middle">Smart Broker / Ephemeral Queue vs Dumb Broker / Distributed Append-Only Commit Log</text>

  <!-- Left: RabbitMQ -->
  <g transform="translate(40, 75)">
    <rect width="460" height="370" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="460" height="30" rx="10" ry="10" fill="#92400E" stroke="#F59E0B" stroke-width="1"/>
    <text x="230" y="20" class="card-title" fill="#FDE68A" text-anchor="middle">RabbitMQ: Smart Broker &amp; Ephemeral Queue</text>

    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="420" height="70" rx="6" ry="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="15" y="20" class="badge" fill="#FDE68A">1. Complex Routing Topology</text>
      <text x="15" y="38" class="card-body">Producers publish to Exchange (Direct, Fanout, Topic, Headers).</text>
      <text x="15" y="54" class="card-body" font-size="11" fill="#FDE68A">Exchange inspects routing keys and routes messages to Queues.</text>

      <rect x="0" y="80" width="420" height="75" rx="6" ry="6" fill="#451A03" stroke="#F59E0B"/>
      <text x="15" y="100" class="badge" fill="#FDE68A">2. Ephemeral Message Lifecycle</text>
      <text x="15" y="118" class="card-body">• Broker tracks consumer acknowledgement (ACK)</text>
      <text x="15" y="134" class="card-body">• Once ACKed: Message is DELETED from broker RAM/disk!</text>
      <text x="15" y="148" class="badge" fill="#FCA5A5">Cannot replay past messages once consumed</text>

      <rect x="0" y="165" width="420" height="70" rx="6" ry="6" fill="#0F172A" stroke="#F59E0B"/>
      <text x="15" y="185" class="badge" fill="#FDE68A">Throughput &amp; Scaling Boundary</text>
      <text x="15" y="205" class="card-body">Optimal for complex routing, task queues, and low latency.</text>
      <text x="15" y="221" class="card-body" font-size="11" fill="#9CA3AF">Large queues cause RAM thrashing &amp; GC stalls.</text>
    </g>

    <rect x="20" y="305" width="420" height="45" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="210" y="328" class="badge" fill="#FDE68A" text-anchor="middle">Mental Model: Smart Post Office (Discards letter upon delivery)</text>
  </g>

  <!-- Right: Apache Kafka -->
  <g transform="translate(560, 75)">
    <rect width="460" height="370" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="460" height="30" rx="10" ry="10" fill="#065F46" stroke="#10B981" stroke-width="1"/>
    <text x="230" y="20" class="card-title" fill="#A7F3D0" text-anchor="middle">Apache Kafka: Dumb Broker &amp; Distributed Commit Log</text>

    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="420" height="70" rx="6" ry="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="15" y="20" class="badge" fill="#A7F3D0">1. Append-Only Distributed Log</text>
      <text x="15" y="38" class="card-body">Topics partitioned into ordered, immutable segment files on NVMe.</text>
      <text x="15" y="54" class="card-body" font-size="11" fill="#A7F3D0">Producers append to partition end with sequential disk I/O.</text>

      <rect x="0" y="80" width="420" height="75" rx="6" ry="6" fill="#064E3B" stroke="#10B981"/>
      <text x="15" y="100" class="badge" fill="#34D399">2. Persistent Retention &amp; Offsets</text>
      <text x="15" y="118" class="card-body">• Consumers maintain their own cursor (Offset)</text>
      <text x="15" y="134" class="card-body">• Messages retained for days/weeks regardless of consumption</text>
      <text x="15" y="148" class="badge" fill="#A7F3D0">Full message replayability &amp; rewind to arbitrary offsets!</text>

      <rect x="0" y="165" width="420" height="70" rx="6" ry="6" fill="#0F172A" stroke="#10B981"/>
      <text x="15" y="185" class="badge" fill="#34D399">Throughput &amp; Zero-Copy Architecture</text>
      <text x="15" y="205" class="card-body">sendfile() Linux zero-copy bypasses JVM heap entirely!</text>
      <text x="15" y="221" class="card-body" font-size="11" fill="#9CA3AF">Easily handles 1,000,000+ msgs/sec with horizontal scaling.</text>
    </g>

    <rect x="20" y="305" width="420" height="45" rx="4" ry="4" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="210" y="328" class="badge" fill="#A7F3D0" text-anchor="middle">Mental Model: Immutable Financial Ledger (Forever replayable)</text>
  </g>
</svg>