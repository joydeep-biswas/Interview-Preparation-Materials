<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" ry="12"/>

  <text x="530" y="32" class="title" font-size="20" text-anchor="middle">Cache-Aside Mutation: Delete vs Update &amp; Stale Data Races</text>
  <text x="530" y="52" class="subtitle" text-anchor="middle">Why updating cache on DB write causes stale split-brain vs Cache Eviction with TTL defense</text>

  <!-- Left: The Flawed Pattern (Update Cache) -->
  <g transform="translate(40, 75)">
    <rect width="460" height="370" rx="10" ry="10" fill="#111827" stroke="#EF4444" stroke-width="2"/>
    <rect width="460" height="30" rx="10" ry="10" fill="#7F1D1D"/>
    <text x="230" y="20" class="card-title" fill="#FCA5A5" text-anchor="middle">Flawed Pattern: Update DB then Update Cache</text>

    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="420" height="70" rx="6" ry="6" fill="#1E293B"/>
      <text x="15" y="20" class="badge" fill="#93C5FD">Concurrent Writers Race Condition</text>
      <text x="15" y="38" class="card-body">Thread 1: UPDATE DB set val = 'A'</text>
      <text x="15" y="56" class="card-body">Thread 2: UPDATE DB set val = 'B'</text>

      <rect x="0" y="80" width="420" height="90" rx="6" ry="6" fill="#450A0A" stroke="#EF4444"/>
      <text x="15" y="100" class="badge" fill="#F87171">Out-of-Order Cache Write</text>
      <text x="15" y="118" class="card-body">• Thread 2 sets Redis: key = 'B'</text>
      <text x="15" y="136" class="card-body">• Thread 1 (delayed) sets Redis: key = 'A'</text>
      <text x="15" y="152" class="badge" fill="#FCA5A5">SPLIT BRAIN: DB has 'B', Redis has 'A' permanently!</text>

      <rect x="0" y="180" width="420" height="70" rx="6" ry="6" fill="#0F172A" stroke="#EF4444"/>
      <text x="15" y="200" class="badge" fill="#FCA5A5">Wasted Write Effort</text>
      <text x="15" y="220" class="card-body">If the key is updated 10 times but never read, 10 cache serializations</text>
      <text x="15" y="236" class="card-body" font-size="11">were computed for nothing.</text>
    </g>

    <rect x="20" y="305" width="420" height="45" rx="4" ry="4" fill="#450A0A"/>
    <text x="210" y="328" class="badge" fill="#FCA5A5" text-anchor="middle">Result: Cache is permanently desynchronized from source of truth</text>
  </g>

  <!-- Right: Standard Solution (Cache-Aside: Delete Cache) -->
  <g transform="translate(560, 75)">
    <rect width="460" height="370" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="460" height="30" rx="10" ry="10" fill="#065F46"/>
    <text x="230" y="20" class="card-title" fill="#A7F3D0" text-anchor="middle">Standard Solution: Update DB then DELETE Cache</text>

    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="420" height="70" rx="6" ry="6" fill="#1E293B"/>
      <text x="15" y="20" class="badge" fill="#A7F3D0">Step 1: Commit DB Write</text>
      <text x="15" y="38" class="card-body" font-family="monospace">orderRepo.save(order); // DB is source of truth</text>
      <text x="15" y="54" class="card-body" font-size="11" fill="#34D399">Transaction commits successfully first</text>

      <rect x="0" y="80" width="420" height="90" rx="6" ry="6" fill="#064E3B" stroke="#10B981"/>
      <text x="15" y="100" class="badge" fill="#34D399">Step 2: Evict Cache Entry (DEL)</text>
      <text x="15" y="118" class="card-body" font-family="monospace">redisTemplate.delete("order:101");</text>
      <text x="15" y="136" class="card-body">• Subsequent readers encounter cache miss</text>
      <text x="15" y="152" class="badge" fill="#A7F3D0">• Readers reload fresh committed value from DB</text>

      <rect x="0" y="180" width="420" height="70" rx="6" ry="6" fill="#0F172A" stroke="#10B981"/>
      <text x="15" y="200" class="badge" fill="#34D399">Defense-in-Depth: TTL Safety Net</text>
      <text x="15" y="220" class="card-body">Always set an explicit TTL (e.g., EXPIRE 3600).</text>
      <text x="15" y="236" class="card-body" font-size="11">Guarantees self-healing even if eviction network call fails.</text>
    </g>

    <rect x="20" y="305" width="420" height="45" rx="4" ry="4" fill="#064E3B"/>
    <text x="210" y="328" class="badge" fill="#A7F3D0" text-anchor="middle">Eventual Consistency Guaranteed: Lazy reload on next read</text>
  </g>
</svg>