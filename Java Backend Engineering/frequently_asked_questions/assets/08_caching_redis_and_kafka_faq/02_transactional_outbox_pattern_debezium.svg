<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" ry="12" stroke="#1F2937" stroke-width="1.5"/>

  <text x="530" y="32" class="title" font-size="20" text-anchor="middle">Transactional Outbox Pattern &amp; Debezium CDC Architecture</text>
  <text x="530" y="52" class="subtitle" text-anchor="middle">Achieving dual-write consistency without distributed 2PC transactions via database Write-Ahead Log (WAL)</text>

  <!-- Step 1: App Local ACID Transaction -->
  <g transform="translate(40, 75)">
    <rect width="230" height="370" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="230" height="30" rx="10" ry="10" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
    <text x="115" y="20" class="card-title" fill="#BFDBFE" text-anchor="middle">1. Single Local ACID Tx</text>

    <rect x="15" y="45" width="200" height="80" rx="6" ry="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="100" y="66" class="badge" fill="#93C5FD" text-anchor="middle">OrderService.create()</text>
    <text x="15" y="88" class="card-body" font-family="monospace">@Transactional</text>
    <text x="15" y="104" class="card-body">Single DB connection</text>

    <g transform="translate(15, 135)">
      <rect x="0" y="0" width="200" height="60" rx="4" ry="4" fill="#064E3B" stroke="#10B981"/>
      <text x="10" y="20" class="badge" fill="#A7F3D0">Write 1: Business State</text>
      <text x="10" y="38" class="card-body" font-family="monospace">INSERT INTO orders ...</text>
      <text x="10" y="50" class="card-body" font-size="10" fill="#D1FAE5">Status = 'CREATED'</text>

      <rect x="0" y="70" width="200" height="60" rx="4" ry="4" fill="#064E3B" stroke="#10B981"/>
      <text x="10" y="90" class="badge" fill="#A7F3D0">Write 2: Outbox Table</text>
      <text x="10" y="108" class="card-body" font-family="monospace">INSERT INTO outbox ...</text>
      <text x="10" y="120" class="card-body" font-size="10" fill="#D1FAE5">payload: OrderCreatedEvent</text>
    </g>

    <rect x="15" y="295" width="200" height="55" rx="6" ry="6" fill="#0F172A" stroke="#3B82F6"/>
    <text x="100" y="316" class="badge" fill="#34D399" text-anchor="middle">Atomic All-or-Nothing</text>
    <text x="100" y="334" class="card-body" font-size="11" text-anchor="middle">Both records commit together</text>
  </g>

  <!-- Step 2: Database Write-Ahead Log (WAL) -->
  <g transform="translate(295, 75)">
    <rect width="230" height="370" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="230" height="30" rx="10" ry="10" fill="#065F46" stroke="#10B981" stroke-width="1"/>
    <text x="115" y="20" class="card-title" fill="#A7F3D0" text-anchor="middle">2. PostgreSQL WAL Log</text>

    <rect x="15" y="45" width="200" height="90" rx="6" ry="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="100" y="66" class="badge" fill="#A7F3D0" text-anchor="middle">Write-Ahead Log</text>
    <text x="15" y="88" class="card-body">• Postgres WAL / MySQL binlog</text>
    <text x="15" y="104" class="card-body">• Appended on transaction commit</text>
    <text x="15" y="120" class="badge" fill="#34D399">• Zero app CPU overhead</text>

    <rect x="15" y="145" width="200" height="110" rx="6" ry="6" fill="#064E3B" stroke="#10B981"/>
    <text x="100" y="168" class="badge" fill="#34D399" text-anchor="middle">Logical Decoding Plugin</text>
    <text x="15" y="190" class="card-body">• pgoutput / test_decoding</text>
    <text x="15" y="206" class="card-body">• Streams committed row</text>
    <text x="15" y="222" class="card-body">  events to replication slot</text>
    <text x="15" y="238" class="card-body" font-size="11" fill="#D1FAE5">• Filtered to 'outbox' table only</text>

    <rect x="15" y="265" width="200" height="75" rx="6" ry="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="100" y="288" class="badge" fill="#A7F3D0" text-anchor="middle">Crash-Resilient</text>
    <text x="15" y="308" class="card-body" font-size="11">If app crashes, event is safely</text>
    <text x="15" y="324" class="card-body" font-size="11">preserved in DB storage</text>
  </g>

  <!-- Step 3: Debezium CDC Connector -->
  <g transform="translate(550, 75)">
    <rect width="230" height="370" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="230" height="30" rx="10" ry="10" fill="#92400E" stroke="#F59E0B" stroke-width="1"/>
    <text x="115" y="20" class="card-title" fill="#FDE68A" text-anchor="middle">3. Debezium CDC Engine</text>

    <rect x="15" y="45" width="200" height="90" rx="6" ry="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="100" y="66" class="badge" fill="#FDE68A" text-anchor="middle">Kafka Connect Worker</text>
    <text x="15" y="88" class="card-body">• Tails replication stream</text>
    <text x="15" y="104" class="card-body">• Converts WAL binary</text>
    <text x="15" y="120" class="card-body" font-size="11">  to JSON / Avro event</text>

    <rect x="15" y="145" width="200" height="110" rx="6" ry="6" fill="#451A03" stroke="#F59E0B"/>
    <text x="100" y="168" class="badge" fill="#FDE68A" text-anchor="middle">At-Least-Once Delivery</text>
    <text x="15" y="190" class="card-body">• Produces to Kafka topic</text>
    <text x="15" y="206" class="card-body">• Acknowledged by Kafka</text>
    <text x="15" y="222" class="card-body">• Updates LSN commit pointer</text>
    <text x="15" y="238" class="badge" fill="#34D399">• Zero polling DB queries!</text>

    <rect x="15" y="265" width="200" height="75" rx="6" ry="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="100" y="288" class="badge" fill="#FCD34D" text-anchor="middle">Debezium Router</text>
    <text x="15" y="308" class="card-body" font-size="11">Reroutes outbox row payload</text>
    <text x="15" y="324" class="card-body" font-size="11">directly to target Kafka topic</text>
  </g>

  <!-- Step 4: Kafka Topic & Downstream -->
  <g transform="translate(805, 75)">
    <rect width="215" height="370" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="215" height="30" rx="10" ry="10" fill="#5B21B6" stroke="#8B5CF6" stroke-width="1"/>
    <text x="107" y="20" class="card-title" fill="#DDD6FE" text-anchor="middle">4. Kafka &amp; Consumers</text>

    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="185" height="85" rx="6" ry="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="15" y="20" class="badge" fill="#DDD6FE">Topic: order.events</text>
      <text x="15" y="40" class="card-body" font-family="monospace">key: "order-101"</text>
      <text x="15" y="56" class="card-body" font-size="11">Partitioned by orderId</text>
      <text x="15" y="72" class="badge" fill="#34D399">Order preserved</text>

      <rect x="0" y="95" width="185" height="95" rx="6" ry="6" fill="#4C1D95" stroke="#8B5CF6"/>
      <text x="15" y="117" class="badge" fill="#DDD6FE">Downstream Consumers</text>
      <text x="15" y="137" class="card-body">• Payment Service</text>
      <text x="15" y="153" class="card-body">• Inventory Service</text>
      <text x="15" y="169" class="card-body">• Email Service</text>
      <text x="15" y="183" class="badge" fill="#34D399">Eventual Consistency</text>
    </g>

    <rect x="15" y="265" width="185" height="75" rx="6" ry="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="92" y="288" class="badge" fill="#A7F3D0" text-anchor="middle">Guarantee</text>
    <text x="92" y="308" class="card-body" font-size="11" text-anchor="middle">Guarantees event is</text>
    <text x="92" y="324" class="card-body" font-size="11" text-anchor="middle">published iff DB commits!</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 270 260 L 283 260 L 295 260" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M 525 260 L 538 260 L 550 260" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  <path d="M 780 260 L 793 260 L 805 260" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
</svg>