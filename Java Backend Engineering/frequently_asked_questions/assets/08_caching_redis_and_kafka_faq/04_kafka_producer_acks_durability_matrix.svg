<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" ry="12"/>

  <text x="530" y="32" class="title" font-size="20" text-anchor="middle">Kafka Producer acks Configuration &amp; Durability Matrix</text>
  <text x="530" y="52" class="subtitle" text-anchor="middle">Comparing acks=0, acks=1, and acks=all (-1) across latency, durability guarantees, and failure modes</text>

  <!-- Three Cards Side by Side -->
  <!-- 1. acks = 0 -->
  <g transform="translate(40, 75)">
    <rect width="300" height="370" rx="10" ry="10" fill="#111827" stroke="#EF4444" stroke-width="2"/>
    <rect width="300" height="30" rx="10" ry="10" fill="#7F1D1D"/>
    <text x="150" y="20" class="card-title" fill="#FCA5A5" text-anchor="middle">acks = 0 (Fire &amp; Forget)</text>

    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="260" height="85" rx="6" ry="6" fill="#1E293B"/>
      <text x="130" y="20" class="badge" fill="#FCA5A5" text-anchor="middle">Producer Behavior</text>
      <text x="15" y="42" class="card-body">• Producer sends bytes over socket</text>
      <text x="15" y="60" class="card-body">• Does NOT wait for any broker ACK</text>
      <text x="15" y="78" class="badge" fill="#34D399">• Latency: Sub-millisecond (Fastest)</text>

      <rect x="0" y="100" width="260" height="95" rx="6" ry="6" fill="#450A0A" stroke="#EF4444"/>
      <text x="130" y="122" class="badge" fill="#F87171" text-anchor="middle">Failure / Data Loss Mode</text>
      <text x="15" y="144" class="card-body">• If broker crashes before disk write:</text>
      <text x="15" y="162" class="badge" fill="#FCA5A5">  DATA SILENTLY LOST FOREVER!</text>
      <text x="15" y="180" class="card-body" font-size="11">Producer has no idea data was lost.</text>

      <rect x="0" y="210" width="260" height="70" rx="6" ry="6" fill="#0F172A"/>
      <text x="130" y="232" class="badge" fill="#9CA3AF" text-anchor="middle">Use Cases</text>
      <text x="15" y="252" class="card-body" font-size="11">Metrics telemetry, IoT sensor pings,</text>
      <text x="15" y="268" class="card-body" font-size="11">where losing 1% of data is acceptable.</text>
    </g>
  </g>

  <!-- 2. acks = 1 -->
  <g transform="translate(380, 75)">
    <rect width="300" height="370" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="300" height="30" rx="10" ry="10" fill="#92400E"/>
    <text x="150" y="20" class="card-title" fill="#FDE68A" text-anchor="middle">acks = 1 (Leader Ack Default)</text>

    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="260" height="85" rx="6" ry="6" fill="#1E293B"/>
      <text x="130" y="20" class="badge" fill="#FDE68A" text-anchor="middle">Producer Behavior</text>
      <text x="15" y="42" class="card-body">• Partition Leader writes to local log</text>
      <text x="15" y="60" class="card-body">• Leader immediately replies with ACK</text>
      <text x="15" y="78" class="card-body" font-size="11" fill="#FDE68A">Does NOT wait for followers to replicate</text>

      <rect x="0" y="100" width="260" height="95" rx="6" ry="6" fill="#451A03" stroke="#F59E0B"/>
      <text x="130" y="122" class="badge" fill="#FDE68A" text-anchor="middle">Failure / Data Loss Mode</text>
      <text x="15" y="144" class="card-body">• If Leader crashes BEFORE followers sync:</text>
      <text x="15" y="162" class="card-body">• Unsynced follower elected new Leader</text>
      <text x="15" y="180" class="badge" fill="#FCA5A5">Unreplicated message is LOST!</text>

      <rect x="0" y="210" width="260" height="70" rx="6" ry="6" fill="#0F172A"/>
      <text x="130" y="232" class="badge" fill="#FCD34D" text-anchor="middle">Use Cases</text>
      <text x="15" y="252" class="card-body" font-size="11">Clickstream events, log aggregation,</text>
      <text x="15" y="268" class="card-body" font-size="11">general non-financial messaging.</text>
    </g>
  </g>

  <!-- 3. acks = all (-1) -->
  <g transform="translate(720, 75)">
    <rect width="300" height="370" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="300" height="30" rx="10" ry="10" fill="#065F46"/>
    <text x="150" y="20" class="card-title" fill="#A7F3D0" text-anchor="middle">acks = all / -1 (Zero Loss)</text>

    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="260" height="85" rx="6" ry="6" fill="#1E293B"/>
      <text x="130" y="20" class="badge" fill="#A7F3D0" text-anchor="middle">Producer Behavior</text>
      <text x="15" y="42" class="card-body">• Leader writes to local log</text>
      <text x="15" y="60" class="card-body">• Leader WAITS for In-Sync Replicas</text>
      <text x="15" y="78" class="badge" fill="#34D399">Requires min.insync.replicas = 2</text>

      <rect x="0" y="100" width="260" height="95" rx="6" ry="6" fill="#064E3B" stroke="#10B981"/>
      <text x="130" y="122" class="badge" fill="#34D399" text-anchor="middle">Durability Guarantee</text>
      <text x="15" y="144" class="card-body">• Survives Leader node crash!</text>
      <text x="15" y="162" class="card-body">• Follower that has message takes over</text>
      <text x="15" y="180" class="badge" fill="#A7F3D0">ZERO DATA LOSS GUARANTEED</text>

      <rect x="0" y="210" width="260" height="70" rx="6" ry="6" fill="#0F172A"/>
      <text x="130" y="232" class="badge" fill="#A7F3D0" text-anchor="middle">Use Cases</text>
      <text x="15" y="252" class="card-body" font-size="11">Payments, orders, banking ledgers,</text>
      <text x="15" y="268" class="card-body" font-size="11">enable.idempotence = true!</text>
    </g>
  </g>
</svg>