<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" ry="12" stroke="#1F2937" stroke-width="1.5"/>

  <text x="530" y="32" class="title" font-size="20" text-anchor="middle">Kafka Consumer Lag Troubleshooting &amp; Triage Hierarchy</text>
  <text x="530" y="52" class="subtitle" text-anchor="middle">Root cause diagnostics: Poison pills, rebalance storms, max.poll.interval timeouts, and autoscaling remedies</text>

  <!-- Step 1: Incident Symptom -->
  <g transform="translate(40, 75)">
    <rect width="280" height="370" rx="10" ry="10" fill="#111827" stroke="#EF4444" stroke-width="2"/>
    <rect width="280" height="30" rx="10" ry="10" fill="#7F1D1D" stroke="#EF4444" stroke-width="1"/>
    <text x="140" y="20" class="card-title" fill="#FCA5A5" text-anchor="middle">1. Symptom: Lag Monotonic Surge</text>

    <rect x="15" y="45" width="250" height="70" rx="6" ry="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="125" y="66" class="badge" fill="#FCA5A5" text-anchor="middle">Lag Metric Definition</text>
    <text x="25" y="86" class="card-body" font-family="monospace">Lag = LogEndOffset - CurrentOffset</text>
    <text x="25" y="104" class="card-body">Producers outpace consumers</text>

    <rect x="15" y="125" width="250" height="110" rx="6" ry="6" fill="#450A0A" stroke="#EF4444"/>
    <text x="125" y="146" class="badge" fill="#F87171" text-anchor="middle">Critical Production Alerts</text>
    <text x="25" y="168" class="card-body">• Consumer Lag &gt; 50,000 records</text>
    <text x="25" y="186" class="card-body">• End-to-end latency spikes &gt; 15m</text>
    <text x="25" y="204" class="card-body">• Downstream SLAs in jeopardy</text>
    <text x="25" y="222" class="badge" fill="#FCA5A5">Emergency triage initiated</text>

    <rect x="15" y="250" width="250" height="85" rx="6" ry="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="125" y="272" class="badge" fill="#FCA5A5" text-anchor="middle">First Check: CLI Tool</text>
    <text x="20" y="294" class="card-body" font-family="monospace">kafka-consumer-groups.sh</text>
    <text x="20" y="312" class="card-body" font-family="monospace">--describe --group order-group</text>
  </g>

  <!-- Step 2: Root Cause Diagnostics -->
  <g transform="translate(360, 75)">
    <rect width="340" height="370" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="340" height="30" rx="10" ry="10" fill="#92400E" stroke="#F59E0B" stroke-width="1"/>
    <text x="170" y="20" class="card-title" fill="#FDE68A" text-anchor="middle">2. Diagnostic Decision Tree</text>

    <g transform="translate(15, 48)">
      <rect x="0" y="0" width="310" height="80" rx="6" ry="6" fill="#1E293B" stroke="#F59E0B"/>
      <text x="15" y="20" class="badge" fill="#FDE68A">Cause A: Single Partition Lag (Skew)</text>
      <text x="15" y="38" class="card-body">• Uneven partition keys (Hot Key!)</text>
      <text x="15" y="54" class="card-body">• Or "Poison Pill" record causing retry loop</text>
      <text x="15" y="68" class="badge" fill="#FCD34D">-&gt; Solution: Fix hash key or route to DLT</text>

      <rect x="0" y="90" width="310" height="85" rx="6" ry="6" fill="#1E293B" stroke="#EF4444"/>
      <text x="15" y="110" class="badge" fill="#F87171">Cause B: max.poll.interval.ms Exceeded</text>
      <text x="15" y="128" class="card-body">• Processing 1 batch took &gt; 5 minutes</text>
      <text x="15" y="144" class="card-body">• Coordinator evicts consumer: Rebalance Storm!</text>
      <text x="15" y="160" class="badge" fill="#FCA5A5">-&gt; Solution: Reduce max.poll.records (e.g. 50)</text>

      <rect x="0" y="185" width="310" height="80" rx="6" ry="6" fill="#1E293B" stroke="#3B82F6"/>
      <text x="15" y="205" class="badge" fill="#93C5FD">Cause C: Downstream DB Bottleneck</text>
      <text x="15" y="223" class="card-body">• Slow SQL queries or locked rows</text>
      <text x="15" y="239" class="card-body">• Consumer blocked waiting on DB connection pool</text>
      <text x="15" y="253" class="badge" fill="#60A5FA">-&gt; Solution: Batch JDBC inserts &amp; optimize DB</text>
    </g>

    <rect x="15" y="325" width="310" height="30" rx="4" ry="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="155" y="345" class="card-body" font-size="11" text-anchor="middle">Isolate whether problem is Producer, Broker, or Consumer</text>
  </g>

  <!-- Step 3: Production Remedies -->
  <g transform="translate(740, 75)">
    <rect width="280" height="370" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="280" height="30" rx="10" ry="10" fill="#065F46" stroke="#10B981" stroke-width="1"/>
    <text x="140" y="20" class="card-title" fill="#A7F3D0" text-anchor="middle">3. Architectural Remedies</text>

    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="250" height="80" rx="6" ry="6" fill="#064E3B" stroke="#10B981"/>
      <text x="15" y="20" class="badge" fill="#A7F3D0">1. Scale Consumer Instances</text>
      <text x="15" y="40" class="card-body">• Scale pods up to partition count</text>
      <text x="15" y="56" class="card-body">• Rule: Consumers &lt;= Partitions!</text>
      <text x="15" y="72" class="badge" fill="#34D399">Extra consumers sit idle</text>

      <rect x="0" y="90" width="250" height="80" rx="6" ry="6" fill="#1E293B" stroke="#10B981"/>
      <text x="15" y="110" class="badge" fill="#A7F3D0">2. Increase Topic Partitions</text>
      <text x="15" y="130" class="card-body">• e.g. from 12 to 32 partitions</text>
      <text x="15" y="146" class="card-body">• Allows 32 parallel consumers</text>
      <text x="15" y="160" class="badge" fill="#6EE7B7">Increases concurrency</text>

      <rect x="0" y="180" width="250" height="80" rx="6" ry="6" fill="#1E293B" stroke="#8B5CF6"/>
      <text x="15" y="200" class="badge" fill="#DDD6FE">3. Cooperative Sticky Assignor</text>
      <text x="15" y="220" class="card-body">• Incremental rebalancing</text>
      <text x="15" y="236" class="card-body">• Only reassigns moved partition</text>
      <text x="15" y="250" class="badge" fill="#C4B5FD">Eliminates stop-the-world pauses</text>
    </g>

    <rect x="15" y="315" width="250" height="40" rx="4" ry="4" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="125" y="338" class="badge" fill="#A7F3D0" text-anchor="middle">Lag Drops Back to 0: Healthy State</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 320 260 L 348 260 L 360 260" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  <path d="M 700 260 L 728 260 L 740 260" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
</svg>