<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 370" width="100%" height="100%">
    <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <text x="550" y="32" class="title" font-size="19" text-anchor="middle">Java Backend Engineering FAQ: Curriculum Roadmap</text>
  <text x="550" y="52" class="subtitle" text-anchor="middle">Four-tier progression covering core language, enterprise frameworks, distributed systems, and cloud infrastructure</text>

  <!-- Tier 1 -->
  <g transform="translate(30, 75)">
    <rect width="240" height="260" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="240" height="34" rx="10" ry="10" fill="#1E3A8A"/>
    <text x="120" y="22" class="card-title" fill="#93C5FD" text-anchor="middle">Tier 1: Language &amp; Memory</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#60A5FA">• 01. Core Java &amp; Algorithms</text>
    <text x="24" y="78" class="card-body">  - Memory, OOP, Virtual Threads</text>
    <text x="16" y="106" class="card-body" font-weight="600" fill="#60A5FA">• 02. Collections &amp; Generics</text>
    <text x="24" y="126" class="card-body">  - HashMap, ConcurrentHashMap CAS</text>
    <text x="16" y="154" class="card-body" font-weight="600" fill="#60A5FA">• 03. Modern Java &amp; Streams</text>
    <text x="24" y="174" class="card-body">  - Lambdas, Streams, Records</text>
    <text x="16" y="202" class="card-body" font-weight="600" fill="#60A5FA">• 04. Concurrency &amp; Async</text>
    <text x="24" y="222" class="card-body">  - JMM, volatile, ThreadPools</text>
    <rect x="16" y="234" width="208" height="18" rx="3" ry="3" fill="#1E293B"/>
  </g>

  <!-- Tier 2 -->
  <g transform="translate(300, 75)">
    <rect width="240" height="260" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="240" height="34" rx="10" ry="10" fill="#064E3B"/>
    <text x="120" y="22" class="card-title" fill="#A7F3D0" text-anchor="middle">Tier 2: Frameworks &amp; Sec</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#34D399">• 05. Spring Boot &amp; REST</text>
    <text x="24" y="78" class="card-body">  - Bean lifecycle, AOP, Actuator</text>
    <text x="24" y="98" class="card-body">  - Spring MVC dispatch architecture</text>
    <text x="16" y="136" class="card-body" font-weight="600" fill="#34D399">• 06. Security &amp; Crypto</text>
    <text x="24" y="156" class="card-body">  - JWT, OAuth2, BCrypt hashing</text>
    <text x="24" y="176" class="card-body">  - Mutual TLS &amp; OWASP defense</text>
    <rect x="16" y="234" width="208" height="18" rx="3" ry="3" fill="#1E293B"/>
  </g>

  <!-- Tier 3 -->
  <g transform="translate(570, 75)">
    <rect width="240" height="260" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="240" height="34" rx="10" ry="10" fill="#78350F"/>
    <text x="120" y="22" class="card-title" fill="#FDE68A" text-anchor="middle">Tier 3: Distributed Data</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#FBBF24">• 07. Databases &amp; Hibernate</text>
    <text x="24" y="78" class="card-body">  - JPA dirty checking, N+1 fix</text>
    <text x="16" y="106" class="card-body" font-weight="600" fill="#FBBF24">• 08. Caching &amp; Messaging</text>
    <text x="24" y="126" class="card-body">  - Redis eviction, Kafka acks</text>
    <text x="16" y="154" class="card-body" font-weight="600" fill="#FBBF24">• 09. Microservices &amp; Design</text>
    <text x="24" y="174" class="card-body">  - Saga pattern, API gateways</text>
    <text x="24" y="194" class="card-body">  - Resilience4j circuit breakers</text>
    <rect x="16" y="234" width="208" height="18" rx="3" ry="3" fill="#1E293B"/>
  </g>

  <!-- Tier 4 -->
  <g transform="translate(840, 75)">
    <rect width="240" height="260" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="240" height="34" rx="10" ry="10" fill="#4C1D95"/>
    <text x="120" y="22" class="card-title" fill="#DDD6FE" text-anchor="middle">Tier 4: Production &amp; Ops</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#A78BFA">• 10. Testing &amp; Quality</text>
    <text x="24" y="78" class="card-body">  - JUnit 5, Mockito, Testcontainers</text>
    <text x="16" y="106" class="card-body" font-weight="600" fill="#A78BFA">• 11. Cloud &amp; Containers</text>
    <text x="24" y="126" class="card-body">  - Docker, Kubernetes, CI/CD</text>
    <text x="16" y="154" class="card-body" font-weight="600" fill="#A78BFA">• 12. JVM Performance</text>
    <text x="24" y="174" class="card-body">  - G1GC/ZGC, Heap dumps, JIT</text>
    <text x="16" y="202" class="card-body" font-weight="600" fill="#A78BFA">• 13. Linux &amp; Networking</text>
    <text x="24" y="222" class="card-body">  - TCP epoll, socket tuning</text>
    <rect x="16" y="234" width="208" height="18" rx="3" ry="3" fill="#1E293B"/>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 270 205 L 288 205 L 300 205" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M 540 205 L 558 205 L 570 205" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  <path d="M 810 205 L 828 205 L 840 205" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
</svg>