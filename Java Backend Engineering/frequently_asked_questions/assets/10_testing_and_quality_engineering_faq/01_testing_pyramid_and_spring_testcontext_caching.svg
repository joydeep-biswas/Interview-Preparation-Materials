<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .pillar-box { fill: #111827; stroke: #1F2937; stroke-width: 2; rx: 10; ry: 10; }
      .card { fill: #1E293B; stroke-width: 1.5; rx: 8; ry: 8; }
      .card-blue { stroke: #3B82F6; }
      .card-purple { stroke: #8B5CF6; }
      .card-green { stroke: #10B981; }
      .card-amber { stroke: #F59E0B; }
      .card-red { stroke: #EF4444; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #F3F4F6; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #9CA3AF; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
      .edge-blue { stroke: #3B82F6; }
      .edge-purple { stroke: #8B5CF6; }
      .edge-green { stroke: #10B981; }
      .edge-red { stroke: #EF4444; }
      .edge-dashed { stroke-dasharray: 4 4; }
      .edge-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #D1D5DB; text-anchor: middle; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <!-- Column 1: Testing Pyramid -->
  <rect x="20" y="20" width="340" height="500" class="pillar-box" stroke="#3B82F6"/>
  <text x="190" y="48" class="title-text" fill="#60A5FA">1. Enterprise Testing Pyramid</text>

  <!-- E2E -->
  <rect x="40" y="70" width="300" height="80" class="card card-red"/>
  <text x="190" y="93" class="card-title" fill="#FCA5A5">End-to-End &amp; Chaos Tests (5%)</text>
  <text x="55" y="115" class="card-body">Slow, Expensive, Staging Env Dependent</text>
  <text x="55" y="133" class="card-body">High blast radius, flakiness risk</text>

  <!-- Contract -->
  <rect x="40" y="180" width="300" height="75" class="card card-purple"/>
  <text x="190" y="203" class="card-title" fill="#D8B4FE">Contract Tests (Pact) (10%)</text>
  <text x="55" y="225" class="card-body">Consumer-driven schema verification</text>
  <text x="55" y="243" class="card-body">Decoupled independently deployable APIs</text>

  <!-- Integration -->
  <rect x="40" y="285" width="300" height="85" class="card card-green"/>
  <text x="190" y="308" class="card-title" fill="#6EE7B7">Integration Tests (25%)</text>
  <text x="55" y="330" class="card-body">Testcontainers + Spring Context Caching</text>
  <text x="55" y="348" class="card-body">Real PostgreSQL, Kafka, and Redis containers</text>

  <!-- Unit -->
  <rect x="40" y="400" width="300" height="85" class="card card-blue"/>
  <text x="190" y="423" class="card-title" fill="#93C5FD">Isolated Unit Tests (60%)</text>
  <text x="55" y="445" class="card-body">JUnit 5 + Mockito in-memory execution</text>
  <text x="55" y="463" class="card-body">Sub-second feedback cycle for pure logic</text>

  <!-- Internal Pyramid Flow -->
  <path fill="none" d="M 190 150 L 190 180" class="edge edge-purple" marker-end="url(#arrow-purple)"/>
  <path fill="none" d="M 190 255 L 190 285" class="edge edge-green" marker-end="url(#arrow-green)"/>
  <path fill="none" d="M 190 370 L 190 400" class="edge edge-blue" marker-end="url(#arrow-blue)"/>

  <!-- Column 2: Spring TestContext Framework & Caching -->
  <rect x="390" y="20" width="340" height="500" class="pillar-box" stroke="#8B5CF6"/>
  <text x="560" y="48" class="title-text" fill="#C4B5FD">2. Spring TestContext Framework</text>

  <!-- TestContextManager -->
  <rect x="410" y="80" width="300" height="95" class="card card-purple"/>
  <text x="560" y="105" class="card-title" fill="#D8B4FE">TestContextManager (TCM)</text>
  <text x="425" y="130" class="card-body">• Manages test lifecycle hooks</text>
  <text x="425" y="148" class="card-body">• Injects dependencies before test methods</text>
  <text x="425" y="166" class="card-body">• Intercepts failures and rollback</text>

  <!-- ContextCache -->
  <rect x="410" y="225" width="300" height="110" class="card card-blue"/>
  <text x="560" y="250" class="card-title" fill="#93C5FD">ContextCache (Config Hash Key)</text>
  <text x="425" y="275" class="card-body">• Keys: Configuration classes + ActiveProfiles</text>
  <text x="425" y="293" class="card-body">• Reuses existing ApplicationContext</text>
  <text x="425" y="311" class="card-body">• @DirtiesContext evicts &amp; forces rebuild</text>

  <!-- DynamicPropertySource -->
  <rect x="410" y="380" width="300" height="105" class="card card-green"/>
  <text x="560" y="405" class="card-title" fill="#6EE7B7">@DynamicPropertySource</text>
  <text x="425" y="430" class="card-body">• Overrides environment properties at runtime</text>
  <text x="425" y="448" class="card-body">• Injects dynamic container host &amp; mapped ports</text>
  <text x="425" y="466" class="card-body">• Eliminates port conflict race conditions</text>

  <!-- TCM connections -->
  <path fill="none" d="M 560 175 L 560 225" class="edge edge-purple" marker-end="url(#arrow-purple)"/>
  <path fill="none" d="M 560 335 L 560 380" class="edge edge-green" marker-end="url(#arrow-green)"/>

  <!-- Column 3: Ephemeral Infrastructure (Testcontainers) -->
  <rect x="760" y="20" width="340" height="500" class="pillar-box" stroke="#10B981"/>
  <text x="930" y="48" class="title-text" fill="#6EE7B7">3. Ephemeral Infrastructure</text>

  <!-- Docker Daemon -->
  <rect x="780" y="80" width="300" height="80" class="card card-blue"/>
  <text x="930" y="105" class="card-title" fill="#93C5FD">Docker Daemon Host</text>
  <text x="795" y="130" class="card-body">• Unix Socket: /var/run/docker.sock</text>
  <text x="795" y="148" class="card-body">• Docker-in-Docker / Testcontainers Cloud</text>

  <!-- Ryuk Moby Cleaner -->
  <rect x="780" y="195" width="300" height="90" class="card card-red"/>
  <text x="930" y="220" class="card-title" fill="#FCA5A5">Ryuk Moby Cleaner Container</text>
  <text x="795" y="245" class="card-body">• Listens on TCP heartbeat from JVM</text>
  <text x="795" y="263" class="card-body">• Guarantees container cleanup upon JVM kill</text>

  <!-- PostgreSQL Container -->
  <rect x="780" y="315" width="300" height="80" class="card card-green"/>
  <text x="930" y="340" class="card-title" fill="#6EE7B7">PostgreSQL 16 Container</text>
  <text x="795" y="365" class="card-body">• Bound to random ephemeral port: 32778</text>
  <text x="795" y="383" class="card-body">• Isolated schema per test suite execution</text>

  <!-- Kafka KRaft Container -->
  <rect x="780" y="415" width="300" height="75" class="card card-amber"/>
  <text x="930" y="440" class="card-title" fill="#FDE68A">Kafka KRaft Testcontainer</text>
  <text x="795" y="465" class="card-body">• Zero-Zookeeper lightweight broker</text>
  <text x="795" y="483" class="card-body">• Embedded test topic autoprovisioning</text>

  <!-- Ryuk Connections -->
  <path fill="none" d="M 930 160 L 930 195" class="edge edge-red" marker-end="url(#arrow-red)"/>
  <path fill="none" d="M 930 285 L 930 315" class="edge edge-green edge-dashed" marker-end="url(#arrow-green)"/>

  <!-- Cross-pillar connections with straight runways -->
  <!-- Integration to TCM: exit 340,327 -> curve -> enter 410,127 with runway dx>=14 -->
  <path fill="none" d="M 340 327 C 370 327, 375 127, 396 127 L 410 127" class="edge edge-purple" marker-end="url(#arrow-purple)"/>

  <!-- Integration to Docker Daemon: exit 340,340 -> curve to daemon 780,120 -->
  <path fill="none" d="M 340 340 C 450 340, 700 120, 766 120 L 780 120" class="edge edge-blue edge-dashed" marker-end="url(#arrow-blue)"/>

  <!-- Postgres to @DynamicPropertySource: exit 780,355 -> curve to 710,432 -->
  <path fill="none" d="M 780 355 C 750 355, 740 432, 724 432 L 710 432" class="edge edge-green" marker-end="url(#arrow-green)"/>
</svg>
