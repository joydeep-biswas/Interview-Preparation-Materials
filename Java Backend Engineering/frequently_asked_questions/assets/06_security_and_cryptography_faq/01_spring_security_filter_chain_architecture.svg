<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" ry="12"/>

  <text x="530" y="32" class="title" font-size="20" text-anchor="middle">Spring Security Filter Chain Architecture</text>
  <text x="530" y="52" class="subtitle" text-anchor="middle">Bridging Servlet Container filters to Spring SecurityFilterChain (DelegatingFilterProxy -> FilterChainProxy)</text>

  <!-- Step 1: Servlet Bridge -->
  <g transform="translate(40, 75)">
    <rect width="230" height="370" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="230" height="30" rx="10" ry="10" fill="#1E3A8A"/>
    <text x="115" y="20" class="card-title" fill="#BFDBFE" text-anchor="middle">1. Servlet Ingress &amp; Bridge</text>

    <rect x="15" y="45" width="200" height="80" rx="6" ry="6" fill="#1E293B"/>
    <text x="100" y="66" class="badge" fill="#93C5FD" text-anchor="middle">Servlet Container (Tomcat)</text>
    <text x="15" y="88" class="card-body">• Standard javax.servlet.Filter</text>
    <text x="15" y="104" class="card-body" font-size="11">Not managed by Spring context</text>

    <rect x="15" y="135" width="200" height="110" rx="6" ry="6" fill="#1E293B" stroke="#3B82F6"/>
    <text x="100" y="156" class="badge" fill="#60A5FA" text-anchor="middle">DelegatingFilterProxy</text>
    <text x="15" y="178" class="card-body">• Standard Servlet Filter</text>
    <text x="15" y="194" class="card-body">• Acts as architectural bridge</text>
    <text x="15" y="210" class="card-body">• Delegates doFilter() to a</text>
    <text x="15" y="226" class="badge" fill="#34D399">  Spring-managed Bean!</text>

    <rect x="15" y="255" width="200" height="85" rx="6" ry="6" fill="#0F172A"/>
    <text x="100" y="278" class="badge" fill="#93C5FD" text-anchor="middle">Target Bean Lookup</text>
    <text x="15" y="298" class="card-body" font-family="monospace">"springSecurityFilterChain"</text>
    <text x="15" y="316" class="card-body" font-size="11">Lazy lookup on first request</text>
  </g>

  <!-- Step 2: FilterChainProxy Hub -->
  <g transform="translate(295, 75)">
    <rect width="230" height="370" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="230" height="30" rx="10" ry="10" fill="#92400E"/>
    <text x="115" y="20" class="card-title" fill="#FDE68A" text-anchor="middle">2. FilterChainProxy Hub</text>

    <rect x="15" y="45" width="200" height="90" rx="6" ry="6" fill="#1E293B"/>
    <text x="100" y="66" class="badge" fill="#FDE68A" text-anchor="middle">FilterChainProxy (Bean)</text>
    <text x="15" y="88" class="card-body">• Central Spring Security hub</text>
    <text x="15" y="104" class="card-body">• Contains List of</text>
    <text x="15" y="120" class="badge" fill="#FCD34D">  SecurityFilterChain beans</text>

    <rect x="15" y="145" width="200" height="110" rx="6" ry="6" fill="#451A03" stroke="#F59E0B"/>
    <text x="100" y="168" class="badge" fill="#FDE68A" text-anchor="middle">URL Pattern Matching</text>
    <text x="15" y="190" class="card-body">• Chain 1: /api/** (JWT)</text>
    <text x="15" y="206" class="card-body">• Chain 2: /actuator/** (mTLS)</text>
    <text x="15" y="222" class="card-body">• Chain 3: /public/** (Permit)</text>
    <text x="15" y="238" class="badge" fill="#FDE68A">First matching chain wins!</text>

    <rect x="15" y="265" width="200" height="75" rx="6" ry="6" fill="#0F172A"/>
    <text x="100" y="288" class="badge" fill="#FCD34D" text-anchor="middle">Security Context Reset</text>
    <text x="15" y="308" class="card-body" font-size="11">Clears SecurityContextHolder on</text>
    <text x="15" y="324" class="card-body" font-size="11">request exit to avoid leaks</text>
  </g>

  <!-- Step 3: Security Filter Pipeline -->
  <g transform="translate(550, 75)">
    <rect width="250" height="370" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="250" height="30" rx="10" ry="10" fill="#065F46"/>
    <text x="125" y="20" class="card-title" fill="#A7F3D0" text-anchor="middle">3. SecurityFilterChain</text>

    <!-- Visual Filter Stack -->
    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="220" height="42" rx="4" ry="4" fill="#1E293B" stroke="#10B981"/>
      <text x="110" y="18" class="badge" fill="#A7F3D0" text-anchor="middle">1. SecurityContextHolderFilter</text>
      <text x="110" y="32" class="card-body" font-size="10" text-anchor="middle">Restores context from Session/Repo</text>

      <rect x="0" y="48" width="220" height="42" rx="4" ry="4" fill="#1E293B" stroke="#10B981"/>
      <text x="110" y="66" class="badge" fill="#A7F3D0" text-anchor="middle">2. BearerTokenAuthFilter</text>
      <text x="110" y="80" class="card-body" font-size="10" text-anchor="middle">Extracts JWT -> AuthenticationManager</text>

      <rect x="0" y="96" width="220" height="42" rx="4" ry="4" fill="#1E293B" stroke="#10B981"/>
      <text x="110" y="114" class="badge" fill="#A7F3D0" text-anchor="middle">3. UsernamePasswordAuthFilter</text>
      <text x="110" y="128" class="card-body" font-size="10" text-anchor="middle">Processes login credentials</text>

      <rect x="0" y="144" width="220" height="42" rx="4" ry="4" fill="#1E293B" stroke="#EF4444"/>
      <text x="110" y="162" class="badge" fill="#FCA5A5" text-anchor="middle">4. ExceptionTranslationFilter</text>
      <text x="110" y="176" class="card-body" font-size="10" text-anchor="middle">Catches AccessDenied -> 401/403</text>

      <rect x="0" y="192" width="220" height="42" rx="4" ry="4" fill="#064E3B" stroke="#10B981"/>
      <text x="110" y="210" class="badge" fill="#34D399" text-anchor="middle">5. AuthorizationFilter</text>
      <text x="110" y="224" class="card-body" font-size="10" text-anchor="middle">Checks ROLE_ADMIN, authorities</text>
    </g>

    <rect x="15" y="295" width="220" height="45" rx="4" ry="4" fill="#0F172A"/>
    <text x="125" y="314" class="badge" fill="#A7F3D0" text-anchor="middle">Strict Execution Order</text>
    <text x="125" y="328" class="card-body" font-size="10" text-anchor="middle">Filters chained via FilterChain.doFilter()</text>
  </g>

  <!-- Step 4: DispatcherServlet / Controller -->
  <g transform="translate(825, 75)">
    <rect width="195" height="370" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="195" height="30" rx="10" ry="10" fill="#5B21B6"/>
    <text x="97" y="20" class="card-title" fill="#DDD6FE" text-anchor="middle">4. Target Controller</text>

    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="165" height="85" rx="6" ry="6" fill="#1E293B"/>
      <text x="15" y="20" class="badge" fill="#DDD6FE">SecurityContext</text>
      <text x="15" y="40" class="card-body">Authentication</text>
      <text x="15" y="56" class="card-body">Principal populated</text>
      <text x="15" y="72" class="badge" fill="#34D399">User authorized!</text>

      <rect x="0" y="100" width="165" height="95" rx="6" ry="6" fill="#4C1D95" stroke="#8B5CF6"/>
      <text x="15" y="122" class="badge" fill="#DDD6FE">Controller Code</text>
      <text x="15" y="142" class="card-body" font-family="monospace">@PreAuthorize(</text>
      <text x="15" y="158" class="card-body" font-family="monospace"> 'hasRole(ADMIN)')</text>
      <text x="15" y="174" class="card-body" font-size="10">Method security AOP</text>
    </g>

    <rect x="15" y="255" width="165" height="85" rx="6" ry="6" fill="#0F172A"/>
    <text x="82" y="278" class="badge" fill="#DDD6FE" text-anchor="middle">Dispatch</text>
    <text x="82" y="298" class="card-body" font-size="11" text-anchor="middle">Safe execution inside</text>
    <text x="82" y="314" class="card-body" font-size="11" text-anchor="middle">Spring MVC controller</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 270 260 L 283 260 L 295 260" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  <path d="M 525 260 L 538 260 L 550 260" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M 800 260 L 813 260 L 825 260" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
</svg>