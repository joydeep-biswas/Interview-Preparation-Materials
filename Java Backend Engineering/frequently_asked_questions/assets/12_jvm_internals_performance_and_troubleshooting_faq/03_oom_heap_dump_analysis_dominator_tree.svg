<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .pillar-box { fill: #111827; stroke-width: 2; rx: 10; ry: 10; }
      .card { fill: #1E293B; stroke-width: 1.5; rx: 8; ry: 8; }
      .card-red { stroke: #EF4444; }
      .card-blue { stroke: #3B82F6; }
      .card-green { stroke: #10B981; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #F3F4F6; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #9CA3AF; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
      .edge-red { stroke: #EF4444; }
      .edge-blue { stroke: #3B82F6; }
      .edge-green { stroke: #10B981; }
    </style>
    <marker id="arr-r123" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-b123" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g123" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <!-- Column 1: Crash Event -->
  <rect x="20" y="20" width="300" height="480" class="pillar-box" stroke="#EF4444"/>
  <text x="170" y="48" class="title-text" fill="#FCA5A5">Crash Event (OOM)</text>

  <!-- OOM -->
  <rect x="40" y="80" width="260" height="120" class="card card-red"/>
  <text x="170" y="105" class="card-title" fill="#FCA5A5">OutOfMemoryError</text>
  <text x="55" y="130" class="card-body">• Java heap space exhausted</text>
  <text x="55" y="150" class="card-body">• GC overhead limit exceeded</text>
  <text x="55" y="170" class="card-body">• Stop-The-World pause freezes pod</text>

  <!-- Heap Dump -->
  <rect x="40" y="260" width="260" height="130" class="card card-red"/>
  <text x="170" y="285" class="card-title" fill="#FCA5A5">HPROF Snapshot Dump</text>
  <text x="55" y="310" class="card-body">• -XX:+HeapDumpOnOutOfMemoryError</text>
  <text x="55" y="330" class="card-body">• -XX:HeapDumpPath=/dumps/oom.hprof</text>
  <text x="55" y="350" class="card-body">• Complete object heap graph</text>
  <text x="55" y="370" class="card-body">• Preserved for post-mortem triage</text>

  <path fill="none" d="M 170 200 L 170 260" class="edge edge-red" marker-end="url(#arr-r123)"/>

  <!-- Column 2: Eclipse MAT Triage -->
  <rect x="350" y="20" width="370" height="480" class="pillar-box" stroke="#3B82F6"/>
  <text x="535" y="48" class="title-text" fill="#60A5FA">Offline Triage in Eclipse MAT</text>

  <!-- MAT Indexing -->
  <rect x="375" y="70" width="320" height="85" class="card card-blue"/>
  <text x="535" y="95" class="card-title" fill="#93C5FD">Load .hprof in MAT</text>
  <text x="390" y="120" class="card-body">• Parses object addresses &amp; classloader trees</text>
  <text x="390" y="138" class="card-body">• Computes shallow vs retained heap sizes</text>

  <!-- Dominator Tree -->
  <rect x="375" y="175" width="320" height="95" class="card card-blue"/>
  <text x="535" y="200" class="card-title" fill="#93C5FD">Dominator Tree Inspection</text>
  <text x="390" y="225" class="card-body">• Sorts tree by Retained Heap Size</text>
  <text x="390" y="243" class="card-body">• An object dominates another if all paths pass through it</text>
  <text x="390" y="261" class="card-body">• Instantly surfaces top 3 memory-retaining nodes</text>

  <!-- Path to GC Roots -->
  <rect x="375" y="295" width="320" height="95" class="card card-blue"/>
  <text x="535" y="320" class="card-title" fill="#93C5FD">Path to GC Roots</text>
  <text x="390" y="345" class="card-body">• Filter: Exclude weak, soft &amp; phantom references</text>
  <text x="390" y="363" class="card-body">• Reveals exact chain preventing GC reclaim</text>
  <text x="390" y="381" class="card-body">• Points directly to leaking field / collection</text>

  <path fill="none" d="M 535 155 L 535 175" class="edge edge-blue" marker-end="url(#arr-b123)"/>
  <path fill="none" d="M 535 270 L 535 295" class="edge edge-blue" marker-end="url(#arr-b123)"/>

  <!-- Column 3: Root Cause & Remediation -->
  <rect x="750" y="20" width="350" height="480" class="pillar-box" stroke="#10B981"/>
  <text x="925" y="48" class="title-text" fill="#6EE7B7">Root Cause &amp; Remediation</text>

  <!-- Cause 1: Static Cache -->
  <rect x="770" y="70" width="310" height="110" class="card card-green"/>
  <text x="925" y="95" class="card-title" fill="#6EE7B7">Static Collection / Unbounded Cache</text>
  <text x="785" y="120" class="card-body">• Map grows forever with missing TTL/eviction</text>
  <text x="785" y="140" class="card-body">• Fix: Caffeine.newBuilder().maximumSize(10_000)</text>
  <text x="785" y="160" class="card-body">• Add .expireAfterWrite(10, TimeUnit.MINUTES)</text>

  <!-- Cause 2: ThreadLocal Leak -->
  <rect x="770" y="200" width="310" height="110" class="card card-green"/>
  <text x="925" y="225" class="card-title" fill="#6EE7B7">ThreadLocal Leak in Pooled Thread</text>
  <text x="785" y="250" class="card-body">• Tomcat threads reused across requests</text>
  <text x="785" y="270" class="card-body">• ThreadLocal keeps large DTO alive indefinitely</text>
  <text x="785" y="290" class="card-body">• Fix: Mandatory try-finally with threadLocal.remove()</text>

  <!-- Cause 3: Metaspace / CGLIB -->
  <rect x="770" y="330" width="310" height="110" class="card card-green"/>
  <text x="925" y="355" class="card-title" fill="#6EE7B7">Metaspace / CGLIB Proxy Explosion</text>
  <text x="785" y="380" class="card-body">• Repeated dynamic proxy generation per request</text>
  <text x="785" y="400" class="card-body">• Classloaders retained in memory leak Metaspace</text>
  <text x="785" y="420" class="card-body">• Fix: Cache Enhancer / Proxy instances permanently</text>

  <!-- Connectors with straight runways -->
  <!-- Dump to MAT: exit 300,325 -> curve -> enter 375,112 with runway dx>=14 -->
  <path fill="none" d="M 300 325 C 330 325, 345 112, 361 112 L 375 112" class="edge edge-blue" marker-end="url(#arr-b123)"/>

  <!-- GC Roots to Cause 1: exit 695,342 -> curve -> enter 770,125 with runway dx>=14 -->
  <path fill="none" d="M 695 342 C 730 342, 735 125, 756 125 L 770 125" class="edge edge-green" marker-end="url(#arr-g123)"/>

  <!-- GC Roots to Cause 2: exit 695,342 -> curve -> enter 770,255 with runway dx>=14 -->
  <path fill="none" d="M 695 342 C 730 342, 735 255, 756 255 L 770 255" class="edge edge-green" marker-end="url(#arr-g123)"/>

  <!-- GC Roots to Cause 3: exit 695,342 -> curve -> enter 770,385 with runway dx>=14 -->
  <path fill="none" d="M 695 342 C 730 342, 735 385, 756 385 L 770 385" class="edge edge-green" marker-end="url(#arr-g123)"/>
</svg>
