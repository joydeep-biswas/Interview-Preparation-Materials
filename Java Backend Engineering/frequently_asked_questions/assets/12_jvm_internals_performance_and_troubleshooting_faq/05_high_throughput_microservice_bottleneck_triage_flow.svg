<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .pillar-box { fill: #111827; stroke-width: 2; rx: 10; ry: 10; }
      .card { fill: #1E293B; stroke-width: 1.5; rx: 8; ry: 8; }
      .card-blue { stroke: #3B82F6; }
      .card-amber { stroke: #F59E0B; }
      .card-red { stroke: #EF4444; }
      .card-green { stroke: #10B981; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #F3F4F6; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #9CA3AF; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
      .edge-blue { stroke: #3B82F6; }
      .edge-amber { stroke: #F59E0B; }
      .edge-red { stroke: #EF4444; }
      .edge-green { stroke: #10B981; }
    </style>
    <marker id="arr-b125" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-a125" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-r125" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-g125" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <!-- Step 1: Ingress Diagnostics -->
  <rect x="20" y="20" width="340" height="480" class="pillar-box" stroke="#3B82F6"/>
  <text x="190" y="48" class="title-text" fill="#60A5FA">Step 1: Ingress &amp; Edge Diagnostics</text>

  <!-- Load test -->
  <rect x="40" y="70" width="300" height="75" class="card card-blue"/>
  <text x="190" y="95" class="card-title" fill="#93C5FD">k6 / JMeter Load Ramp</text>
  <text x="55" y="120" class="card-body">• Ramp traffic: 10 -> 1,000 concurrency</text>
  <text x="55" y="138" class="card-body">• Observe latency curve inflection point</text>

  <!-- Ingress Check -->
  <rect x="40" y="170" width="300" height="75" class="card card-blue"/>
  <text x="190" y="195" class="card-title" fill="#93C5FD">Ingress Proxy Status</text>
  <text x="55" y="220" class="card-body">• Check NGINX / Envoy status metrics</text>
  <text x="55" y="238" class="card-body">• Differentiate HTTP 502 vs 504 timeouts</text>

  <!-- HTTP 502 -->
  <rect x="40" y="270" width="300" height="95" class="card card-red"/>
  <text x="190" y="295" class="card-title" fill="#FCA5A5">HTTP 502 Connection Refused</text>
  <text x="55" y="320" class="card-body">• TCP SYN backlog queue full</text>
  <text x="55" y="338" class="card-body">• Check OS ulimit -n (file descriptors)</text>
  <text x="55" y="356" class="card-body">• Tune net.core.somaxconn &gt; 1024</text>

  <!-- HTTP 504 -->
  <rect x="40" y="390" width="300" height="90" class="card card-amber"/>
  <text x="190" y="415" class="card-title" fill="#FDE68A">HTTP 504 Gateway Timeout</text>
  <text x="55" y="440" class="card-body">• Upstream accepted TCP but stalled</text>
  <text x="55" y="458" class="card-body">• Forward triage to Tomcat container</text>

  <path fill="none" d="M 190 145 L 190 170" class="edge edge-blue" marker-end="url(#arr-b125)"/>
  <path fill="none" d="M 190 245 L 190 270" class="edge edge-red" marker-end="url(#arr-r125)"/>
  <path fill="none" d="M 190 245 L 190 390" class="edge edge-amber" marker-end="url(#arr-a125)"/>

  <!-- Step 2: JVM & Container Inspection -->
  <rect x="390" y="20" width="340" height="480" class="pillar-box" stroke="#F59E0B"/>
  <text x="560" y="48" class="title-text" fill="#FDE68A">Step 2: JVM &amp; Container Inspection</text>

  <!-- Tomcat Exhausted -->
  <rect x="410" y="100" width="300" height="130" class="card card-red"/>
  <text x="560" y="125" class="card-title" fill="#FCA5A5">Tomcat Executor Exhausted</text>
  <text x="425" y="150" class="card-body">• Active threads == server.tomcat.max-threads (200)</text>
  <text x="425" y="170" class="card-body">• Incoming requests queued in accept-count</text>
  <text x="425" y="190" class="card-body">• All threads blocked downstream</text>
  <text x="425" y="210" class="card-body">• Latency exceeds gateway read timeout</text>

  <!-- HikariCP Check -->
  <rect x="410" y="280" width="300" height="130" class="card card-green"/>
  <text x="560" y="305" class="card-title" fill="#6EE7B7">Tomcat Threads Available</text>
  <text x="425" y="330" class="card-body">• Active threads &lt; max-threads</text>
  <text x="425" y="350" class="card-body">• Check HikariCP connection pool metrics</text>
  <text x="425" y="370" class="card-body">• Inspect Active vs Idle JDBC connections</text>
  <text x="425" y="390" class="card-body">• Observe connection acquisition wait time</text>

  <!-- Step 3: Database & Lock Triage -->
  <rect x="760" y="20" width="340" height="480" class="pillar-box" stroke="#10B981"/>
  <text x="930" y="48" class="title-text" fill="#6EE7B7">Step 3: Database &amp; Lock Triage</text>

  <!-- HikariCP Starvation -->
  <rect x="780" y="100" width="300" height="130" class="card card-red"/>
  <text x="930" y="125" class="card-title" fill="#FCA5A5">HikariCP Pool Starvation</text>
  <text x="795" y="150" class="card-body">• Active connections == maximumPoolSize</text>
  <text x="795" y="170" class="card-body">• Threads blocked waiting for DB lease</text>
  <text x="795" y="190" class="card-body">• Fix: Increase pool size if DB CPU &lt; 60%</text>
  <text x="795" y="210" class="card-body">• Or add index to shrink query duration</text>

  <!-- DB Locks -->
  <rect x="780" y="280" width="300" height="130" class="card card-red"/>
  <text x="930" y="305" class="card-title" fill="#FCA5A5">Database Lock Contention</text>
  <text x="795" y="330" class="card-body">• Active &lt; maximumPoolSize</text>
  <text x="795" y="350" class="card-body">• Inspect pg_stat_activity / sys.dm_exec_requests</text>
  <text x="795" y="370" class="card-body">• Row-level exclusive locks (FOR UPDATE)</text>
  <text x="795" y="390" class="card-body">• Sequential full table scans blocking transactions</text>

  <!-- Connectors with straight runways -->
  <!-- 504 to Tomcat Exhausted: exit 340,435 -> curve -> enter 410,165 with runway dx>=14 -->
  <path fill="none" d="M 340 435 C 370 435, 375 165, 396 165 L 410 165" class="edge edge-red" marker-end="url(#arr-r125)"/>

  <!-- 504 to Hikari Check: exit 340,435 -> curve -> enter 410,345 with runway dx>=14 -->
  <path fill="none" d="M 340 435 C 370 435, 375 345, 396 345 L 410 345" class="edge edge-green" marker-end="url(#arr-g125)"/>

  <!-- Hikari Check to Pool Starvation: exit 710,345 -> curve -> enter 780,165 with runway dx>=14 -->
  <path fill="none" d="M 710 345 C 740 345, 745 165, 766 165 L 780 165" class="edge edge-red" marker-end="url(#arr-r125)"/>

  <!-- Hikari Check to DB Locks: exit 710,345 -> straight horizontal to 780,345 -->
  <path fill="none" d="M 710 345 L 780 345" class="edge edge-red" marker-end="url(#arr-r125)"/>
</svg>
