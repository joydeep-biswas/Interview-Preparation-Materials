<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" ry="12"/>

  <text x="530" y="32" class="title" font-size="20" text-anchor="middle">Java Stream Pipeline Lifecycle &amp; Lazy Evaluation</text>
  <text x="530" y="52" class="subtitle" text-anchor="middle">Pipeline construction (No Execution) vs Terminal Trigger (Single-Pass Fused Pull Loop)</text>

  <!-- Stage 1: Data Source -->
  <g transform="translate(40, 75)">
    <rect width="250" height="370" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="250" height="30" rx="10" ry="10" fill="#1E3A8A"/>
    <text x="125" y="20" class="card-title" fill="#BFDBFE" text-anchor="middle">1. Stream Source</text>

    <rect x="15" y="45" width="220" height="85" rx="6" ry="6" fill="#1E293B"/>
    <text x="110" y="66" class="badge" fill="#93C5FD" text-anchor="middle">Source Containers</text>
    <text x="25" y="88" class="card-body">• Collection.stream()</text>
    <text x="25" y="106" class="card-body">• Arrays.stream(array)</text>
    <text x="25" y="122" class="card-body">• Files.lines(), Stream.iterate()</text>

    <rect x="15" y="145" width="220" height="95" rx="6" ry="6" fill="#1E293B"/>
    <text x="110" y="166" class="badge" fill="#6EE7B7" text-anchor="middle">Spliterator Contract</text>
    <text x="25" y="188" class="card-body">• tryAdvance(Consumer)</text>
    <text x="25" y="206" class="card-body">• trySplit() for parallel splits</text>
    <text x="25" y="224" class="card-body">• Characteristics: SIZED, ORDERED</text>

    <rect x="15" y="255" width="220" height="95" rx="6" ry="6" fill="#0F172A" stroke="#3B82F6"/>
    <text x="110" y="278" class="badge" fill="#60A5FA" text-anchor="middle">Source Invariant</text>
    <text x="25" y="300" class="card-body">• Does NOT store elements</text>
    <text x="25" y="318" class="card-body">• Does NOT modify origin source</text>
    <text x="25" y="334" class="card-body">• Traversable only ONCE</text>
  </g>

  <!-- Stage 2: Intermediate Operations -->
  <g transform="translate(330, 75)">
    <rect width="400" height="370" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="400" height="30" rx="10" ry="10" fill="#92400E"/>
    <text x="200" y="20" class="card-title" fill="#FDE68A" text-anchor="middle">2. Intermediate Ops (Lazy Pipeline Construction)</text>

    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="360" height="70" rx="6" ry="6" fill="#1E293B" stroke="#F59E0B"/>
      <text x="15" y="22" class="badge" fill="#FDE68A">.filter(Predicate&lt;T&gt;)</text>
      <text x="15" y="42" class="card-body">Stateless operation: Filters elements conditionally</text>
      <text x="15" y="58" class="card-body" font-size="11" fill="#9CA3AF">Wrapped into chained Sink.accept() stage</text>

      <rect x="0" y="80" width="360" height="70" rx="6" ry="6" fill="#1E293B" stroke="#F59E0B"/>
      <text x="15" y="102" class="badge" fill="#FDE68A">.map(Function&lt;T, R&gt;)</text>
      <text x="15" y="122" class="card-body">Stateless operation: 1-to-1 element transformation</text>
      <text x="15" y="138" class="card-body" font-size="11" fill="#9CA3AF">Fused into the same traversal pass</text>

      <rect x="0" y="160" width="360" height="85" rx="6" ry="6" fill="#1E293B" stroke="#8B5CF6"/>
      <text x="15" y="182" class="badge" fill="#DDD6FE">.sorted() / .distinct() [Stateful Ops]</text>
      <text x="15" y="202" class="card-body">Stateful barrier: Must consume ALL prior elements</text>
      <text x="15" y="220" class="card-body">Cannot short-circuit; requires internal buffer</text>
      <text x="15" y="236" class="badge" fill="#C4B5FD">Pipeline barrier before continuing downstream</text>
    </g>

    <rect x="20" y="305" width="360" height="48" rx="6" ry="6" fill="#451A03" stroke="#F59E0B"/>
    <text x="180" y="325" class="badge" fill="#FDE68A" text-anchor="middle">CRITICAL: ZERO EVALUATION OCCURS HERE</text>
    <text x="180" y="342" class="card-body" text-anchor="middle">Intermediate operations only assemble linked Sink stages</text>
  </g>

  <!-- Stage 3: Terminal Operation -->
  <g transform="translate(770, 75)">
    <rect width="250" height="370" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="250" height="30" rx="10" ry="10" fill="#065F46"/>
    <text x="125" y="20" class="card-title" fill="#A7F3D0" text-anchor="middle">3. Terminal Op (The Pull Trigger)</text>

    <rect x="15" y="45" width="220" height="90" rx="6" ry="6" fill="#1E293B"/>
    <text x="110" y="68" class="badge" fill="#A7F3D0" text-anchor="middle">Terminal Triggers</text>
    <text x="25" y="90" class="card-body">• collect(Collectors.toList())</text>
    <text x="25" y="108" class="card-body">• forEach(), reduce(), count()</text>
    <text x="25" y="124" class="card-body">• findFirst(), anyMatch()</text>

    <rect x="15" y="150" width="220" height="100" rx="6" ry="6" fill="#064E3B" stroke="#10B981"/>
    <text x="110" y="172" class="badge" fill="#34D399" text-anchor="middle">Fused Single-Pass Loop</text>
    <text x="25" y="194" class="card-body">• Pulls 1 element through all</text>
    <text x="25" y="212" class="card-body">  fused filters/maps before</text>
    <text x="25" y="230" class="card-body">  fetching the next!</text>
    <text x="25" y="244" class="badge" fill="#6EE7B7">Eliminates intermediate arrays</text>

    <rect x="15" y="265" width="220" height="85" rx="6" ry="6" fill="#1E293B" stroke="#38BDF8"/>
    <text x="110" y="288" class="badge" fill="#38BDF8" text-anchor="middle">Short-Circuiting</text>
    <text x="25" y="310" class="card-body">limit(k) or findFirst() halts</text>
    <text x="25" y="328" class="card-body">iteration immediately at match</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 290 260 L 318 260 L 330 260" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  <path d="M 730 260 L 758 260 L 770 260" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
</svg>