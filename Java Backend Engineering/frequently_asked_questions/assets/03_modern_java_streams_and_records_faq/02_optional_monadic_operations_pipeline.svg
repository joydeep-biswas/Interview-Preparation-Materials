<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" ry="12" stroke="#1F2937" stroke-width="1.5"/>

  <text x="530" y="32" class="title" font-size="20" text-anchor="middle">Java Optional Monadic Operations Pipeline</text>
  <text x="530" y="52" class="subtitle" text-anchor="middle">Replacing defensive null checks with fluent functional composition (map, filter, flatMap, orElse)</text>

  <!-- Step 1: Optional Origin -->
  <g transform="translate(40, 75)">
    <rect width="250" height="370" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="250" height="30" rx="10" ry="10" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
    <text x="125" y="20" class="card-title" fill="#BFDBFE" text-anchor="middle">1. Return Optional&lt;User&gt;</text>

    <rect x="15" y="45" width="220" height="70" rx="6" ry="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="110" y="66" class="badge" fill="#93C5FD" text-anchor="middle">Repository Contract</text>
    <text x="25" y="86" class="card-body" font-family="monospace">findUserById(10)</text>
    <text x="25" y="104" class="card-body">Explicit return type for absence</text>

    <!-- Branch: Present vs Empty -->
    <g transform="translate(15, 130)">
      <rect x="0" y="0" width="220" height="65" rx="6" ry="6" fill="#064E3B" stroke="#10B981"/>
      <text x="15" y="22" class="badge" fill="#A7F3D0">State: Present</text>
      <text x="15" y="42" class="card-body" font-family="monospace">Optional.of(user)</text>
      <text x="15" y="56" class="card-body" font-size="11" fill="#D1FAE5">Contains non-null User object</text>

      <rect x="0" y="80" width="220" height="65" rx="6" ry="6" fill="#450A0A" stroke="#EF4444"/>
      <text x="15" y="102" class="badge" fill="#FCA5A5">State: Empty</text>
      <text x="15" y="122" class="card-body" font-family="monospace">Optional.empty()</text>
      <text x="15" y="136" class="card-body" font-size="11" fill="#FEE2E2">Zero memory reference</text>
    </g>

    <rect x="15" y="295" width="220" height="55" rx="6" ry="6" fill="#0F172A" stroke="#3B82F6"/>
    <text x="110" y="316" class="badge" fill="#60A5FA" text-anchor="middle">Architectural Rule</text>
    <text x="110" y="334" class="card-body" font-size="11" text-anchor="middle">Never return null for Optional!</text>
  </g>

  <!-- Step 2: Monadic Transformations -->
  <g transform="translate(330, 75)">
    <rect width="400" height="370" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="400" height="30" rx="10" ry="10" fill="#5B21B6" stroke="#8B5CF6" stroke-width="1"/>
    <text x="200" y="20" class="card-title" fill="#DDD6FE" text-anchor="middle">2. Monadic Transformation Chain</text>

    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="360" height="70" rx="6" ry="6" fill="#1E293B" stroke="#8B5CF6"/>
      <text x="15" y="22" class="badge" fill="#DDD6FE">.filter(User::isActive)</text>
      <text x="15" y="42" class="card-body">If active -&gt; keeps Optional&lt;User&gt;</text>
      <text x="15" y="58" class="card-body" font-size="11" fill="#C4B5FD">If inactive -&gt; short-circuits to Optional.empty()</text>

      <rect x="0" y="80" width="360" height="70" rx="6" ry="6" fill="#1E293B" stroke="#8B5CF6"/>
      <text x="15" y="102" class="badge" fill="#DDD6FE">.map(User::getEmail)</text>
      <text x="15" y="122" class="card-body">Transforms User to String email -&gt; Optional&lt;String&gt;</text>
      <text x="15" y="138" class="card-body" font-size="11" fill="#C4B5FD">If empty -&gt; bypasses function automatically (No NPE!)</text>

      <rect x="0" y="160" width="360" height="70" rx="6" ry="6" fill="#1E293B" stroke="#8B5CF6"/>
      <text x="15" y="182" class="badge" fill="#DDD6FE">.flatMap(User::findSecondaryEmail)</text>
      <text x="15" y="202" class="card-body">Flattens nested Optional&lt;Optional&lt;String&gt;&gt; to Optional&lt;String&gt;</text>
      <text x="15" y="218" class="card-body" font-size="11" fill="#C4B5FD">Prevents awkward 2-level Optional nesting</text>
    </g>

    <rect x="20" y="295" width="360" height="55" rx="6" ry="6" fill="#1E293B" stroke="#EF4444"/>
    <text x="180" y="316" class="badge" fill="#FCA5A5" text-anchor="middle">ANTI-PATTERN: DO NOT USE get()</text>
    <text x="180" y="334" class="card-body" font-size="11" text-anchor="middle">Calling opt.get() without isPresent() causes NoSuchElementException</text>
  </g>

  <!-- Step 3: Terminal Unwrap -->
  <g transform="translate(770, 75)">
    <rect width="250" height="370" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="250" height="30" rx="10" ry="10" fill="#065F46" stroke="#10B981" stroke-width="1"/>
    <text x="125" y="20" class="card-title" fill="#A7F3D0" text-anchor="middle">3. Safe Terminal Unwrapping</text>

    <rect x="15" y="45" width="220" height="85" rx="6" ry="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="110" y="68" class="badge" fill="#A7F3D0" text-anchor="middle">.orElseThrow()</text>
    <text x="25" y="90" class="card-body" font-family="monospace">.orElseThrow(() -&gt; new</text>
    <text x="25" y="106" class="card-body" font-family="monospace">  UserNotFoundException(id))</text>
    <text x="25" y="122" class="badge" fill="#34D399">Standard REST 404 mapping</text>

    <rect x="15" y="145" width="220" height="85" rx="6" ry="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="110" y="168" class="badge" fill="#FDE68A" text-anchor="middle">.orElseGet(Supplier)</text>
    <text x="25" y="190" class="card-body">• Lazy default evaluation</text>
    <text x="25" y="208" class="card-body">• Supplier only called if empty</text>
    <text x="25" y="222" class="card-body" font-size="11">Avoids eager default cost of orElse()</text>

    <rect x="15" y="245" width="220" height="105" rx="6" ry="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="110" y="268" class="badge" fill="#93C5FD" text-anchor="middle">.ifPresentOrElse()</text>
    <text x="25" y="290" class="card-body">• Java 9+ side-effect handler</text>
    <text x="25" y="308" class="card-body">• Consumer for present value</text>
    <text x="25" y="326" class="card-body">• Runnable for empty fallback</text>
    <text x="25" y="342" class="badge" fill="#60A5FA">Clean functional branching</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 290 260 L 318 260 L 330 260" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <path d="M 730 260 L 758 260 L 770 260" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
</svg>