<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" ry="12" stroke="#1F2937" stroke-width="1.5"/>

  <text x="530" y="32" class="title" font-size="20" text-anchor="middle">Java Stream Collectors &amp; Multi-Level Downstream Aggregation</text>
  <text x="530" y="52" class="subtitle" text-anchor="middle">Composing groupingBy, mapping, and averagingDouble into a single-pass O(N) aggregation pipeline</text>

  <!-- Stage 1: Stream Input -->
  <g transform="translate(40, 75)">
    <rect width="220" height="370" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="220" height="30" rx="10" ry="10" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
    <text x="110" y="20" class="card-title" fill="#BFDBFE" text-anchor="middle">1. Stream&lt;Employee&gt;</text>

    <g transform="translate(15, 48)">
      <rect x="0" y="0" width="190" height="55" rx="6" ry="6" fill="#1E293B" stroke="#3B82F6"/>
      <text x="15" y="20" class="badge" fill="#93C5FD">Emp 1: "Alice"</text>
      <text x="15" y="36" class="card-body">Dept: "Engineering"</text>
      <text x="15" y="50" class="card-body">Salary: $140,000</text>

      <rect x="0" y="65" width="190" height="55" rx="6" ry="6" fill="#1E293B" stroke="#3B82F6"/>
      <text x="15" y="85" class="badge" fill="#93C5FD">Emp 2: "Bob"</text>
      <text x="15" y="101" class="card-body">Dept: "Engineering"</text>
      <text x="15" y="115" class="card-body">Salary: $160,000</text>

      <rect x="0" y="130" width="190" height="55" rx="6" ry="6" fill="#1E293B" stroke="#F59E0B"/>
      <text x="15" y="150" class="badge" fill="#FDE68A">Emp 3: "Charlie"</text>
      <text x="15" y="166" class="card-body">Dept: "Finance"</text>
      <text x="15" y="180" class="card-body">Salary: $120,000</text>
    </g>

    <rect x="15" y="280" width="190" height="70" rx="6" ry="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="95" y="302" class="badge" fill="#60A5FA" text-anchor="middle">Single Stream Flow</text>
    <text x="95" y="322" class="card-body" font-size="11" text-anchor="middle">Stream feeds employees</text>
    <text x="95" y="338" class="card-body" font-size="11" text-anchor="middle">one-by-one into collector</text>
  </g>

  <!-- Stage 2: groupingBy Classifier -->
  <g transform="translate(290, 75)">
    <rect width="230" height="370" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="230" height="30" rx="10" ry="10" fill="#92400E" stroke="#F59E0B" stroke-width="1"/>
    <text x="115" y="20" class="card-title" fill="#FDE68A" text-anchor="middle">2. groupingBy(Classifier)</text>

    <rect x="15" y="45" width="200" height="75" rx="6" ry="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="100" y="66" class="badge" fill="#FDE68A" text-anchor="middle">Classifier Function</text>
    <text x="15" y="88" class="card-body" font-family="monospace">Employee::department</text>
    <text x="15" y="106" class="card-body">Extracts Map keys</text>

    <!-- Buckets formed -->
    <g transform="translate(15, 135)">
      <rect x="0" y="0" width="200" height="70" rx="6" ry="6" fill="#1E293B" stroke="#3B82F6"/>
      <text x="15" y="22" class="badge" fill="#93C5FD">Key: "Engineering"</text>
      <text x="15" y="42" class="card-body">• Routes Emp 1 (Alice)</text>
      <text x="15" y="58" class="card-body">• Routes Emp 2 (Bob)</text>

      <rect x="0" y="80" width="200" height="70" rx="6" ry="6" fill="#1E293B" stroke="#F59E0B"/>
      <text x="15" y="102" class="badge" fill="#FDE68A">Key: "Finance"</text>
      <text x="15" y="122" class="card-body">• Routes Emp 3 (Charlie)</text>
    </g>

    <rect x="15" y="300" width="200" height="50" rx="6" ry="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="100" y="322" class="badge" fill="#FCD34D" text-anchor="middle">Map&lt;Department, ...&gt;</text>
    <text x="100" y="338" class="card-body" font-size="11" text-anchor="middle">Creates partition branches</text>
  </g>

  <!-- Stage 3: Downstream Mapping -->
  <g transform="translate(545, 75)">
    <rect width="230" height="370" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="230" height="30" rx="10" ry="10" fill="#5B21B6" stroke="#8B5CF6" stroke-width="1"/>
    <text x="115" y="20" class="card-title" fill="#DDD6FE" text-anchor="middle">3. Downstream mapping()</text>

    <rect x="15" y="45" width="200" height="75" rx="6" ry="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="100" y="66" class="badge" fill="#DDD6FE" text-anchor="middle">Field Extraction</text>
    <text x="15" y="88" class="card-body" font-family="monospace">mapping(Employee::salary,</text>
    <text x="15" y="106" class="card-body" font-family="monospace">        downstream...)</text>

    <g transform="translate(15, 135)">
      <rect x="0" y="0" width="200" height="70" rx="6" ry="6" fill="#1E293B" stroke="#3B82F6"/>
      <text x="15" y="22" class="badge" fill="#93C5FD">Engineering Stream</text>
      <text x="15" y="42" class="card-body" font-family="monospace">140000.0, 160000.0</text>
      <text x="15" y="58" class="card-body" font-size="11" fill="#9CA3AF">Discards full Emp objects</text>

      <rect x="0" y="80" width="200" height="70" rx="6" ry="6" fill="#1E293B" stroke="#F59E0B"/>
      <text x="15" y="102" class="badge" fill="#FDE68A">Finance Stream</text>
      <text x="15" y="122" class="card-body" font-family="monospace">120000.0</text>
    </g>

    <rect x="15" y="300" width="200" height="50" rx="6" ry="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="100" y="322" class="badge" fill="#C4B5FD" text-anchor="middle">Reduces Memory</text>
    <text x="100" y="338" class="card-body" font-size="11" text-anchor="middle">Prevents storing lists</text>
  </g>

  <!-- Stage 4: Downstream Aggregator -->
  <g transform="translate(800, 75)">
    <rect width="220" height="370" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="220" height="30" rx="10" ry="10" fill="#065F46" stroke="#10B981" stroke-width="1"/>
    <text x="110" y="20" class="card-title" fill="#A7F3D0" text-anchor="middle">4. averagingDouble()</text>

    <rect x="15" y="45" width="190" height="75" rx="6" ry="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="95" y="66" class="badge" fill="#A7F3D0" text-anchor="middle">Accumulator</text>
    <text x="15" y="88" class="card-body">Maintains running [sum,</text>
    <text x="15" y="106" class="card-body">count] in O(1) space</text>

    <g transform="translate(15, 135)">
      <rect x="0" y="0" width="190" height="70" rx="6" ry="6" fill="#064E3B" stroke="#10B981"/>
      <text x="15" y="22" class="badge" fill="#A7F3D0">"Engineering":</text>
      <text x="15" y="42" class="card-body" font-family="monospace">Avg: $150,000.0</text>
      <text x="15" y="58" class="badge" fill="#34D399">(140k + 160k) / 2</text>

      <rect x="0" y="80" width="190" height="70" rx="6" ry="6" fill="#064E3B" stroke="#10B981"/>
      <text x="15" y="102" class="badge" fill="#A7F3D0">"Finance":</text>
      <text x="15" y="122" class="card-body" font-family="monospace">Avg: $120,000.0</text>
      <text x="15" y="138" class="badge" fill="#34D399">120k / 1</text>
    </g>

    <rect x="15" y="295" width="190" height="55" rx="6" ry="6" fill="#1E293B" stroke="#10B981"/>
    <text x="95" y="316" class="badge" fill="#A7F3D0" text-anchor="middle">Final Result Map</text>
    <text x="95" y="334" class="card-body" font-size="11" text-anchor="middle">Map&lt;String, Double&gt;</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 260 260 L 278 260 L 290 260" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  <path d="M 520 260 L 533 260 L 545 260" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <path d="M 775 260 L 788 260 L 800 260" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
</svg>