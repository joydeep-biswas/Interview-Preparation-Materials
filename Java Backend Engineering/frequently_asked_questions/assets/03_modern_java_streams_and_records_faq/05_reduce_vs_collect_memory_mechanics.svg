<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" ry="12" stroke="#1F2937" stroke-width="1.5"/>

  <text x="530" y="32" class="title" font-size="20" text-anchor="middle">Reduction Mechanics: reduce() vs collect() Memory Allocation</text>
  <text x="530" y="52" class="subtitle" text-anchor="middle">Immutable object folding (O(N^2) copying) vs Mutable container accumulation (In-Place O(N))</text>

  <!-- Left: reduce() Model -->
  <g transform="translate(40, 75)">
    <rect width="460" height="235" rx="10" ry="10" fill="#111827" stroke="#EF4444" stroke-width="2"/>
    <rect width="460" height="30" rx="10" ry="10" fill="#7F1D1D" stroke="#EF4444" stroke-width="1"/>
    <text x="230" y="20" class="card-title" fill="#FCA5A5" text-anchor="middle">reduce(): Immutable Functional Folding</text>

    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="420" height="40" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="210" y="24" class="card-body" font-family="monospace" text-anchor="middle">stream.reduce("", (acc, str) -&gt; acc + str)</text>

      <!-- Allocation sequence -->
      <g transform="translate(0, 50)">
        <rect x="0" y="0" width="95" height="45" rx="4" ry="4" fill="#450A0A" stroke="#EF4444"/>
        <text x="47" y="18" class="badge" fill="#FCA5A5" text-anchor="middle">Step 1: "A"</text>
        <text x="47" y="34" class="card-body" font-size="10" text-anchor="middle">New String (24B)</text>

        <path fill="none" d="M 95 22 L 115 22" stroke="#EF4444" stroke-width="2" marker-end="url(#arrow-red)"/>

        <rect x="120" y="0" width="115" height="45" rx="4" ry="4" fill="#450A0A" stroke="#EF4444"/>
        <text x="177" y="18" class="badge" fill="#FCA5A5" text-anchor="middle">Step 2: "AB"</text>
        <text x="177" y="34" class="card-body" font-size="10" text-anchor="middle">Copies A + B (26B)</text>

        <path fill="none" d="M 235 22 L 255 22" stroke="#EF4444" stroke-width="2" marker-end="url(#arrow-red)"/>

        <rect x="260" y="0" width="160" height="45" rx="4" ry="4" fill="#450A0A" stroke="#EF4444"/>
        <text x="340" y="18" class="badge" fill="#FCA5A5" text-anchor="middle">Step 3: "ABC..."</text>
        <text x="340" y="34" class="card-body" font-size="10" text-anchor="middle">Copies AB + C (28B)</text>
      </g>
    </g>

    <rect x="20" y="160" width="420" height="60" rx="6" ry="6" fill="#1E293B" stroke="#EF4444"/>
    <text x="230" y="180" class="badge" fill="#F87171" text-anchor="middle">Severe Allocation &amp; GC Penalty: O(N^2) Work</text>
    <text x="230" y="196" class="card-body" text-anchor="middle">For N items, allocates N separate strings and copies N*(N+1)/2 characters!</text>
    <text x="230" y="210" class="badge" fill="#FCA5A5" text-anchor="middle">Creates massive transient heap garbage</text>
  </g>

  <!-- Right: collect() Model -->
  <g transform="translate(560, 75)">
    <rect width="460" height="235" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="460" height="30" rx="10" ry="10" fill="#065F46" stroke="#10B981" stroke-width="1"/>
    <text x="230" y="20" class="card-title" fill="#A7F3D0" text-anchor="middle">collect(): Mutable Container Reduction</text>

    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="420" height="40" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="210" y="24" class="card-body" font-family="monospace" text-anchor="middle">stream.collect(StringBuilder::new, sb::append, sb::append)</text>

      <!-- In-place expansion -->
      <g transform="translate(0, 50)">
        <rect x="0" y="0" width="420" height="45" rx="4" ry="4" fill="#064E3B" stroke="#10B981"/>
        <text x="210" y="18" class="badge" fill="#A7F3D0" text-anchor="middle">Single Reusable StringBuilder Buffer</text>
        <text x="210" y="34" class="card-body" font-family="monospace" text-anchor="middle">[ 'A' | 'B' | 'C' | 'D' | 'E' | ... buffer array ]</text>
      </g>
    </g>

    <rect x="20" y="160" width="420" height="60" rx="6" ry="6" fill="#1E293B" stroke="#10B981"/>
    <text x="230" y="180" class="badge" fill="#34D399" text-anchor="middle">Zero Intermediate Garbage: O(N) Work</text>
    <text x="230" y="196" class="card-body" text-anchor="middle">Accumulator mutates single backing char[] array in place.</text>
    <text x="230" y="210" class="badge" fill="#A7F3D0" text-anchor="middle">Amortized O(1) appends, zero intermediate object churn!</text>
  </g>

  <!-- Bottom: Synthesis & Rules -->
  <g transform="translate(40, 330)">
    <rect width="980" height="130" rx="10" ry="10" fill="#111827" stroke="#1F2937" stroke-width="1.5"/>
    <rect width="980" height="26" rx="10" ry="10" fill="#1F2937" stroke="#334155" stroke-width="1"/>
    <text x="490" y="18" class="card-title" fill="#E5E7EB" text-anchor="middle">Design Rule &amp; Parallel Aggregation Invariants</text>

    <text x="40" y="55" class="badge" fill="#FCA5A5">reduce() Contract:</text>
    <text x="220" y="55" class="card-body">Use ONLY when returning an immutable value type (e.g., Integer sum, min, max, BigInteger multiplication).</text>
    <text x="220" y="70" class="card-body">Accumulator MUST be associative: (a + b) + c == a + (b + c) to allow safe ForkJoin thread folding.</text>

    <line x1="40" y1="80" x2="1000" y2="80" stroke="#374151" stroke-width="1"/>

    <text x="40" y="105" class="badge" fill="#A7F3D0">collect() Contract:</text>
    <text x="220" y="105" class="card-body">Use whenever accumulating into collections (List, Set, Map) or compound text (StringBuilder).</text>
    <text x="220" y="120" class="card-body">Provides Supplier (supplier), Accumulator (bi-consumer), and Combiner (bi-consumer for parallel merges).</text>
  </g>
</svg>