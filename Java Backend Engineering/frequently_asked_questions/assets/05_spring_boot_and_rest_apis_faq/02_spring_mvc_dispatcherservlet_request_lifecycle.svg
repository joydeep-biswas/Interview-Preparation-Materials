<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" ry="12"/>

  <text x="530" y="32" class="title" font-size="20" text-anchor="middle">Spring MVC DispatcherServlet Request Lifecycle</text>
  <text x="530" y="52" class="subtitle" text-anchor="middle">Front controller routing through HandlerMapping, HandlerAdapter, Interceptors, and MessageConverters</text>

  <!-- Step 1: Client & DispatcherServlet -->
  <g transform="translate(40, 75)">
    <rect width="220" height="370" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="220" height="30" rx="10" ry="10" fill="#1E3A8A"/>
    <text x="110" y="20" class="card-title" fill="#BFDBFE" text-anchor="middle">1. Front Controller</text>

    <rect x="15" y="45" width="190" height="65" rx="6" ry="6" fill="#1E293B"/>
    <text x="95" y="66" class="badge" fill="#93C5FD" text-anchor="middle">Client HTTP Request</text>
    <text x="25" y="86" class="card-body" font-family="monospace">GET /api/v1/orders/10</text>
    <text x="25" y="100" class="card-body">Headers, Cookies, Payload</text>

    <rect x="15" y="125" width="190" height="110" rx="6" ry="6" fill="#1E293B" stroke="#3B82F6"/>
    <text x="95" y="146" class="badge" fill="#60A5FA" text-anchor="middle">DispatcherServlet</text>
    <text x="20" y="168" class="card-body">• doDispatch(request)</text>
    <text x="20" y="184" class="card-body">• Central architectural hub</text>
    <text x="20" y="200" class="card-body">• Coordinates routing,</text>
    <text x="20" y="216" class="card-body">  execution, and responses</text>

    <rect x="15" y="250" width="190" height="85" rx="6" ry="6" fill="#0F172A"/>
    <text x="95" y="272" class="badge" fill="#93C5FD" text-anchor="middle">Filter Chain First</text>
    <text x="20" y="292" class="card-body">Security &amp; Cors filters</text>
    <text x="20" y="308" class="card-body">execute before reaching</text>
    <text x="20" y="322" class="badge" fill="#34D399">DispatcherServlet</text>
  </g>

  <!-- Step 2: Mapping & Adapter -->
  <g transform="translate(290, 75)">
    <rect width="230" height="370" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="230" height="30" rx="10" ry="10" fill="#92400E"/>
    <text x="115" y="20" class="card-title" fill="#FDE68A" text-anchor="middle">2. Mapping &amp; Interceptor</text>

    <rect x="15" y="45" width="200" height="85" rx="6" ry="6" fill="#1E293B"/>
    <text x="100" y="66" class="badge" fill="#FDE68A" text-anchor="middle">HandlerMapping</text>
    <text x="15" y="88" class="card-body" font-family="monospace">RequestMappingHandler-</text>
    <text x="15" y="104" class="card-body" font-family="monospace">Mapping finds match:</text>
    <text x="15" y="120" class="badge" fill="#FCD34D">OrderController.getOrder()</text>

    <rect x="15" y="140" width="200" height="95" rx="6" ry="6" fill="#451A03" stroke="#F59E0B"/>
    <text x="100" y="162" class="badge" fill="#FDE68A" text-anchor="middle">preHandle() Interceptors</text>
    <text x="15" y="184" class="card-body">• HandlerInterceptor</text>
    <text x="15" y="200" class="card-body">• Auth, telemetry, tracing</text>
    <text x="15" y="218" class="card-body" font-size="11" fill="#FDE68A">If false -&gt; halts request</text>

    <rect x="15" y="245" width="200" height="90" rx="6" ry="6" fill="#0F172A"/>
    <text x="100" y="268" class="badge" fill="#FCD34D" text-anchor="middle">HandlerExecutionChain</text>
    <text x="15" y="290" class="card-body">Packages handler bean +</text>
    <text x="15" y="306" class="card-body">interceptor array</text>
  </g>

  <!-- Step 3: Controller Invocation -->
  <g transform="translate(545, 75)">
    <rect width="230" height="370" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="230" height="30" rx="10" ry="10" fill="#065F46"/>
    <text x="115" y="20" class="card-title" fill="#A7F3D0" text-anchor="middle">3. Controller &amp; Service</text>

    <rect x="15" y="45" width="200" height="90" rx="6" ry="6" fill="#1E293B"/>
    <text x="100" y="66" class="badge" fill="#A7F3D0" text-anchor="middle">HandlerAdapter</text>
    <text x="15" y="88" class="card-body" font-family="monospace">RequestMappingHandler-</text>
    <text x="15" y="104" class="card-body" font-family="monospace">Adapter handles params</text>
    <text x="15" y="120" class="card-body" font-size="11" fill="#6EE7B7">@PathVariable, @RequestBody</text>

    <rect x="15" y="145" width="200" height="105" rx="6" ry="6" fill="#064E3B" stroke="#10B981"/>
    <text x="100" y="168" class="badge" fill="#34D399" text-anchor="middle">@RestController Execution</text>
    <text x="15" y="190" class="card-body">• Calls OrderService</text>
    <text x="15" y="206" class="card-body">• Queries Database via JPA</text>
    <text x="15" y="222" class="card-body">• Returns OrderDTO</text>
    <text x="15" y="238" class="badge" fill="#A7F3D0">• Business logic executed</text>

    <rect x="15" y="260" width="200" height="75" rx="6" ry="6" fill="#0F172A"/>
    <text x="100" y="282" class="badge" fill="#A7F3D0" text-anchor="middle">postHandle() Runs</text>
    <text x="15" y="302" class="card-body">Interceptor post-processing</text>
    <text x="15" y="318" class="card-body">runs after controller return</text>
  </g>

  <!-- Step 4: Serialization & Response -->
  <g transform="translate(800, 75)">
    <rect width="220" height="370" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="220" height="30" rx="10" ry="10" fill="#5B21B6"/>
    <text x="110" y="20" class="card-title" fill="#DDD6FE" text-anchor="middle">4. Serialization &amp; Out</text>

    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="190" height="90" rx="6" ry="6" fill="#1E293B"/>
      <text x="15" y="20" class="badge" fill="#DDD6FE">HttpMessageConverter</text>
      <text x="15" y="40" class="card-body" font-family="monospace">MappingJackson2-</text>
      <text x="15" y="56" class="card-body" font-family="monospace">HttpMessageConverter</text>
      <text x="15" y="74" class="card-body" font-size="11" fill="#C4B5FD">Serializes DTO to JSON</text>

      <rect x="0" y="100" width="190" height="85" rx="6" ry="6" fill="#4C1D95" stroke="#8B5CF6"/>
      <text x="15" y="122" class="badge" fill="#DDD6FE">afterCompletion()</text>
      <text x="15" y="142" class="card-body">• Cleans ThreadLocals</text>
      <text x="15" y="158" class="card-body">• Logs final latency</text>
      <text x="15" y="174" class="badge" fill="#34D399">• MDC context flushed</text>
    </g>

    <rect x="15" y="250" width="190" height="85" rx="6" ry="6" fill="#0F172A"/>
    <text x="95" y="272" class="badge" fill="#DDD6FE" text-anchor="middle">200 OK Response</text>
    <text x="95" y="292" class="card-body" font-family="monospace" text-anchor="middle">Content-Type: JSON</text>
    <text x="95" y="310" class="card-body" font-size="11" text-anchor="middle">Streamed back to client</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 260 260 L 278 260 L 290 260" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  <path d="M 520 260 L 533 260 L 545 260" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M 775 260 L 788 260 L 800 260" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
</svg>