<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" ry="12"/>

  <text x="530" y="32" class="title" font-size="20" text-anchor="middle">Idempotent API Design &amp; Distributed Locking Architecture</text>
  <text x="530" y="52" class="subtitle" text-anchor="middle">Preventing duplicate payment processing across retries using Idempotency-Key and Redis SETNX</text>

  <!-- Step 1: Client Request with Idempotency-Key -->
  <g transform="translate(40, 75)">
    <rect width="220" height="370" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="220" height="30" rx="10" ry="10" fill="#1E3A8A"/>
    <text x="110" y="20" class="card-title" fill="#BFDBFE" text-anchor="middle">1. Client Request</text>

    <rect x="15" y="45" width="190" height="75" rx="6" ry="6" fill="#1E293B"/>
    <text x="95" y="66" class="badge" fill="#93C5FD" text-anchor="middle">POST /v1/payments</text>
    <text x="15" y="86" class="card-body" font-size="11">Idempotency-Key: uuid-123</text>
    <text x="15" y="104" class="card-body" font-size="11">Amount: $500.00</text>

    <rect x="15" y="130" width="190" height="100" rx="6" ry="6" fill="#1E293B" stroke="#3B82F6"/>
    <text x="95" y="152" class="badge" fill="#60A5FA" text-anchor="middle">Retry Scenario</text>
    <text x="15" y="174" class="card-body">• Network drops response</text>
    <text x="15" y="190" class="card-body">• Client HTTP SDK retries</text>
    <text x="15" y="206" class="card-body">• Re-sends IDENTICAL key</text>
    <text x="15" y="222" class="badge" fill="#34D399">• Safe from double charge</text>

    <rect x="15" y="245" width="190" height="90" rx="6" ry="6" fill="#0F172A"/>
    <text x="95" y="268" class="badge" fill="#93C5FD" text-anchor="middle">Gateway Header Check</text>
    <text x="15" y="290" class="card-body">Rejects request 400 Bad</text>
    <text x="15" y="306" class="card-body">Request if Idempotency-Key</text>
    <text x="15" y="322" class="card-body">header is missing</text>
  </g>

  <!-- Step 2: Redis Distributed Lock & Cache -->
  <g transform="translate(290, 75)">
    <rect width="230" height="370" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="230" height="30" rx="10" ry="10" fill="#92400E"/>
    <text x="115" y="20" class="card-title" fill="#FDE68A" text-anchor="middle">2. Redis SETNX Lock</text>

    <rect x="15" y="45" width="200" height="85" rx="6" ry="6" fill="#1E293B"/>
    <text x="100" y="66" class="badge" fill="#FDE68A" text-anchor="middle">1. Check Existing Result</text>
    <text x="15" y="88" class="card-body" font-family="monospace">GET idempotency:uuid-123</text>
    <text x="15" y="106" class="card-body">If present -&gt; Return cached</text>
    <text x="15" y="120" class="badge" fill="#34D399">HTTP 200 response directly!</text>

    <rect x="15" y="140" width="200" height="95" rx="6" ry="6" fill="#451A03" stroke="#F59E0B"/>
    <text x="100" y="162" class="badge" fill="#FDE68A" text-anchor="middle">2. Acquire Lock (SETNX)</text>
    <text x="15" y="184" class="card-body" font-family="monospace">SET lock:uuid-123 1 NX</text>
    <text x="15" y="200" class="card-body" font-family="monospace">    PX 10000</text>
    <text x="15" y="218" class="card-body" font-size="11" fill="#FDE68A">If fails -&gt; In-flight conflict!</text>

    <rect x="15" y="245" width="200" height="90" rx="6" ry="6" fill="#0F172A"/>
    <text x="100" y="268" class="badge" fill="#FCD34D" text-anchor="middle">Concurrency Guard</text>
    <text x="15" y="290" class="card-body">Blocks concurrent twin</text>
    <text x="15" y="306" class="card-body">requests from executing</text>
    <text x="15" y="322" class="card-body">simultaneously</text>
  </g>

  <!-- Step 3: Business Logic & DB Constraint -->
  <g transform="translate(545, 75)">
    <rect width="230" height="370" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="230" height="30" rx="10" ry="10" fill="#065F46"/>
    <text x="115" y="20" class="card-title" fill="#A7F3D0" text-anchor="middle">3. Payment Execution</text>

    <rect x="15" y="45" width="200" height="85" rx="6" ry="6" fill="#1E293B"/>
    <text x="100" y="66" class="badge" fill="#A7F3D0" text-anchor="middle">External Payment Gateway</text>
    <text x="15" y="88" class="card-body">• Calls Stripe / Bank API</text>
    <text x="15" y="104" class="card-body">• Passes idempotency token</text>
    <text x="15" y="120" class="badge" fill="#34D399">• Charge authorized: $500</text>

    <rect x="15" y="140" width="200" height="95" rx="6" ry="6" fill="#064E3B" stroke="#10B981"/>
    <text x="100" y="162" class="badge" fill="#34D399" text-anchor="middle">DB Unique Constraint</text>
    <text x="15" y="184" class="card-body" font-family="monospace">INSERT INTO payments</text>
    <text x="15" y="200" class="card-body" font-family="monospace">(idempotency_key, ...)</text>
    <text x="15" y="218" class="card-body" font-size="11" fill="#A7F3D0">Hard DB-level safety net</text>

    <rect x="15" y="245" width="200" height="90" rx="6" ry="6" fill="#0F172A"/>
    <text x="100" y="268" class="badge" fill="#A7F3D0" text-anchor="middle">ACID Transaction</text>
    <text x="15" y="290" class="card-body">Saves payment record &amp;</text>
    <text x="15" y="306" class="card-body">updates account balance in</text>
    <text x="15" y="322" class="card-body">single atomic transaction</text>
  </g>

  <!-- Step 4: Cache Response & Release Lock -->
  <g transform="translate(800, 75)">
    <rect width="220" height="370" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="220" height="30" rx="10" ry="10" fill="#5B21B6"/>
    <text x="110" y="20" class="card-title" fill="#DDD6FE" text-anchor="middle">4. Cache &amp; Respond</text>

    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="190" height="85" rx="6" ry="6" fill="#1E293B"/>
      <text x="15" y="20" class="badge" fill="#DDD6FE">Cache Payload</text>
      <text x="15" y="40" class="card-body" font-family="monospace">SETEX idempotency:key</text>
      <text x="15" y="56" class="card-body" font-family="monospace">86400 (24h) json_resp</text>
      <text x="15" y="74" class="card-body" font-size="11" fill="#C4B5FD">Stores exact HTTP response</text>

      <rect x="0" y="95" width="190" height="85" rx="6" ry="6" fill="#4C1D95" stroke="#8B5CF6"/>
      <text x="15" y="117" class="badge" fill="#DDD6FE">Release Lock</text>
      <text x="15" y="137" class="card-body" font-family="monospace">DEL lock:uuid-123</text>
      <text x="15" y="153" class="card-body">Frees lock for subsequent</text>
      <text x="15" y="169" class="badge" fill="#34D399">safe lookups</text>
    </g>

    <rect x="15" y="245" width="190" height="90" rx="6" ry="6" fill="#0F172A"/>
    <text x="95" y="268" class="badge" fill="#DDD6FE" text-anchor="middle">HTTP 201 Created</text>
    <text x="15" y="290" class="card-body" font-size="11">Returns payment receipt.</text>
    <text x="15" y="306" class="card-body" font-size="11">Subsequent retries return</text>
    <text x="15" y="322" class="badge" fill="#A7F3D0">Identical 201 receipt!</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 260 260 L 278 260 L 290 260" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  <path d="M 520 260 L 533 260 L 545 260" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M 775 260 L 788 260 L 800 260" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
</svg>