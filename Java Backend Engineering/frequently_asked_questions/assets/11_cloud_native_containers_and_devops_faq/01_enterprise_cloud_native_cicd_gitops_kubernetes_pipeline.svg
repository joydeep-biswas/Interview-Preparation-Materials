<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .pillar-box { fill: #111827; stroke-width: 2; rx: 10; ry: 10; }
      .card { fill: #1E293B; stroke-width: 1.5; rx: 8; ry: 8; }
      .card-blue { stroke: #3B82F6; }
      .card-purple { stroke: #8B5CF6; }
      .card-green { stroke: #10B981; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #F3F4F6; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 600; text-anchor: middle; }
      .card-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #9CA3AF; text-anchor: start; }
      .edge { stroke-width: 2; fill: none; }
      .edge-blue { stroke: #3B82F6; }
      .edge-purple { stroke: #8B5CF6; }
      .edge-green { stroke: #10B981; }
      .edge-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-weight: 600; fill: #E5E7EB; text-anchor: middle; }
    </style>
    <marker id="arr-b11" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-p11" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-g11" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <!-- Column 1: CI/CD -->
  <rect x="20" y="20" width="340" height="500" class="pillar-box" stroke="#3B82F6"/>
  <text x="190" y="48" class="title-text" fill="#60A5FA">1. CI/CD Artifact Supply Chain</text>

  <!-- Git Commit -->
  <rect x="40" y="70" width="300" height="75" class="card card-blue"/>
  <text x="190" y="93" class="card-title" fill="#93C5FD">Developer Git Push</text>
  <text x="55" y="115" class="card-body">• Commit triggers GitHub Actions workflow</text>
  <text x="55" y="133" class="card-body">• Enforces branch protection &amp; PR approvals</text>

  <!-- CI Build -->
  <rect x="40" y="165" width="300" height="85" class="card card-blue"/>
  <text x="190" y="188" class="card-title" fill="#93C5FD">GitHub Actions CI Pipeline</text>
  <text x="55" y="210" class="card-body">• Maven verify + Testcontainers integration</text>
  <text x="55" y="228" class="card-body">• SonarQube quality gate &amp; JaCoCo coverage</text>

  <!-- Docker Build -->
  <rect x="40" y="270" width="300" height="90" class="card card-blue"/>
  <text x="190" y="293" class="card-title" fill="#93C5FD">Multi-Stage Distroless Build</text>
  <text x="55" y="315" class="card-body">• Stage 1: Build JAR via OpenJDK 21</text>
  <text x="55" y="333" class="card-body">• Stage 2: Distroless minimal runtime</text>
  <text x="55" y="351" class="card-body">• Trivy CVE vulnerability vulnerability scan</text>

  <!-- ECR -->
  <rect x="40" y="380" width="300" height="85" class="card card-blue"/>
  <text x="190" y="403" class="card-title" fill="#93C5FD">Container Registry (ECR / ACR)</text>
  <text x="55" y="425" class="card-body">• Signed immutable image digest</text>
  <text x="55" y="443" class="card-body">• Cosign / Notary cryptographic attestations</text>

  <!-- Column 1 Flow -->
  <path fill="none" d="M 190 145 L 190 165" class="edge edge-blue" marker-end="url(#arr-b11)"/>
  <path fill="none" d="M 190 250 L 190 270" class="edge edge-blue" marker-end="url(#arr-b11)"/>
  <path fill="none" d="M 190 360 L 190 380" class="edge edge-blue" marker-end="url(#arr-b11)"/>

  <!-- Column 2: GitOps Sync -->
  <rect x="390" y="20" width="340" height="500" class="pillar-box" stroke="#8B5CF6"/>
  <text x="560" y="48" class="title-text" fill="#C4B5FD">2. GitOps Deployment Plane</text>

  <!-- GitOps Repo -->
  <rect x="410" y="90" width="300" height="95" class="card card-purple"/>
  <text x="560" y="115" class="card-title" fill="#D8B4FE">GitOps Config Repository</text>
  <text x="425" y="140" class="card-body">• Declarative Helm / Kustomize charts</text>
  <text x="425" y="158" class="card-body">• Sealed Secrets &amp; ExternalSecrets operator</text>
  <text x="425" y="176" class="card-body">• Git as single source of truth</text>

  <!-- ArgoCD Controller -->
  <rect x="410" y="225" width="300" height="110" class="card card-purple"/>
  <text x="560" y="250" class="card-title" fill="#D8B4FE">ArgoCD Controller</text>
  <text x="425" y="275" class="card-body">• Continuous cluster state reconciliation</text>
  <text x="425" y="293" class="card-body">• Automated drift detection &amp; remediation</text>
  <text x="425" y="311" class="card-body">• Progressive rollout via Argo Rollouts</text>

  <!-- Sync Engine -->
  <rect x="410" y="375" width="300" height="95" class="card card-purple"/>
  <text x="560" y="400" class="card-title" fill="#D8B4FE">Automated Sync &amp; Canary Analysis</text>
  <text x="425" y="425" class="card-body">• Automated canary traffic stepping (10% -> 50%)</text>
  <text x="425" y="443" class="card-body">• Prometheus latency metric gate</text>
  <text x="425" y="461" class="card-body">• Instant automated rollback on error spikes</text>

  <!-- Column 2 Flow -->
  <path fill="none" d="M 560 185 L 560 225" class="edge edge-purple" marker-end="url(#arr-p11)"/>
  <path fill="none" d="M 560 335 L 560 375" class="edge edge-purple" marker-end="url(#arr-p11)"/>

  <!-- Column 3: Kubernetes Runtime -->
  <rect x="760" y="20" width="340" height="500" class="pillar-box" stroke="#10B981"/>
  <text x="930" y="48" class="title-text" fill="#6EE7B7">3. Kubernetes Production Runtime</text>

  <!-- Ingress -->
  <rect x="780" y="90" width="300" height="95" class="card card-green"/>
  <text x="930" y="115" class="card-title" fill="#6EE7B7">Ingress / AWS Load Balancer</text>
  <text x="795" y="140" class="card-body">• TLS termination &amp; HTTP/2 connection reuse</text>
  <text x="795" y="158" class="card-body">• AWS WAF DDoS protection &amp; rate limiting</text>
  <text x="795" y="176" class="card-body">• Ingress path routing to ClusterIP services</text>

  <!-- Pods -->
  <rect x="780" y="225" width="300" height="110" class="card card-green"/>
  <text x="930" y="250" class="card-title" fill="#6EE7B7">Spring Boot Pods (HPA &amp; PDB)</text>
  <text x="795" y="275" class="card-body">• Horizontal Pod Autoscaler (CPU/Custom)</text>
  <text x="795" y="293" class="card-body">• PodDisruptionBudget ensures min replicas</text>
  <text x="795" y="311" class="card-body">• TopologySpreadConstraints across AZs</text>

  <!-- Probes -->
  <rect x="780" y="375" width="300" height="95" class="card card-green"/>
  <text x="930" y="400" class="card-title" fill="#6EE7B7">Kubernetes Health Probes</text>
  <text x="795" y="425" class="card-body">• Startup Probe: /actuator/health/liveness</text>
  <text x="795" y="443" class="card-body">• Readiness: Database &amp; broker connectivity</text>
  <text x="795" y="461" class="card-body">• Liveness: Deadlock &amp; thread pool check</text>

  <!-- Column 3 Flow -->
  <path fill="none" d="M 930 185 L 930 225" class="edge edge-green" marker-end="url(#arr-g11)"/>
  <path fill="none" d="M 930 335 L 930 375" class="edge edge-green" marker-end="url(#arr-g11)"/>

  <!-- Cross-pillar connections with straight runways -->
  <!-- ECR to ArgoCD: exit 340,422 -> curve -> enter 410,280 with runway dx>=14 -->
  <path fill="none" d="M 340 422 C 370 422, 375 280, 396 280 L 410 280" class="edge edge-purple" marker-end="url(#arr-p11)"/>

  <!-- Sync to Ingress: exit 710,422 -> curve -> enter 780,137 with runway dx>=14 -->
  <path fill="none" d="M 710 422 C 740 422, 745 137, 766 137 L 780 137" class="edge edge-green" marker-end="url(#arr-g11)"/>
</svg>
