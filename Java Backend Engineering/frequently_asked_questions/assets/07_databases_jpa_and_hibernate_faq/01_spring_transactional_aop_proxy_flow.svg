<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" ry="12"/>

  <text x="530" y="32" class="title" font-size="20" text-anchor="middle">Spring @Transactional AOP Proxy Interception Flow</text>
  <text x="530" y="52" class="subtitle" text-anchor="middle">TransactionInterceptor, PlatformTransactionManager, ThreadLocal Connection binding, and commit/rollback</text>

  <!-- Step 1: Caller & AOP Proxy -->
  <g transform="translate(40, 75)">
    <rect width="220" height="370" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="220" height="30" rx="10" ry="10" fill="#1E3A8A"/>
    <text x="110" y="20" class="card-title" fill="#BFDBFE" text-anchor="middle">1. AOP Proxy Interception</text>

    <rect x="15" y="45" width="190" height="65" rx="6" ry="6" fill="#1E293B"/>
    <text x="95" y="66" class="badge" fill="#93C5FD" text-anchor="middle">Caller Invocation</text>
    <text x="15" y="86" class="card-body" font-family="monospace">orderService.create()</text>
    <text x="15" y="100" class="card-body" font-size="11">Invokes generated proxy</text>

    <rect x="15" y="125" width="190" height="110" rx="6" ry="6" fill="#1E293B" stroke="#3B82F6"/>
    <text x="95" y="146" class="badge" fill="#60A5FA" text-anchor="middle">TransactionInterceptor</text>
    <text x="15" y="168" class="card-body">• invokeWithinTransaction()</text>
    <text x="15" y="184" class="card-body">• Inspects @Transactional</text>
    <text x="15" y="200" class="card-body">• Propagation: REQUIRED</text>
    <text x="15" y="218" class="badge" fill="#34D399">• Isolation: READ_COMMITTED</text>

    <rect x="15" y="250" width="190" height="85" rx="6" ry="6" fill="#0F172A"/>
    <text x="95" y="272" class="badge" fill="#93C5FD" text-anchor="middle">CGLIB / JDK Proxy</text>
    <text x="15" y="292" class="card-body" font-size="11">Wraps target bean to add</text>
    <text x="15" y="308" class="card-body" font-size="11">declarative boundaries</text>
  </g>

  <!-- Step 2: Transaction Manager & ThreadLocal Binding -->
  <g transform="translate(290, 75)">
    <rect width="230" height="370" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="230" height="30" rx="10" ry="10" fill="#92400E"/>
    <text x="115" y="20" class="card-title" fill="#FDE68A" text-anchor="middle">2. PlatformTxManager</text>

    <rect x="15" y="45" width="200" height="90" rx="6" ry="6" fill="#1E293B"/>
    <text x="100" y="66" class="badge" fill="#FDE68A" text-anchor="middle">getTransaction()</text>
    <text x="15" y="88" class="card-body" font-family="monospace">JpaTransactionManager</text>
    <text x="15" y="104" class="card-body">Obtains DB Connection</text>
    <text x="15" y="120" class="badge" fill="#34D399">con.setAutoCommit(false)</text>

    <rect x="15" y="145" width="200" height="110" rx="6" ry="6" fill="#451A03" stroke="#F59E0B"/>
    <text x="100" y="168" class="badge" fill="#FDE68A" text-anchor="middle">TransactionSynchronization-</text>
    <text x="100" y="182" class="badge" fill="#FDE68A" text-anchor="middle">Manager (ThreadLocal)</text>
    <text x="15" y="202" class="card-body">• Binds Connection to current</text>
    <text x="15" y="218" class="card-body">  calling thread</text>
    <text x="15" y="234" class="badge" fill="#FCD34D">• Ensures JPA &amp; JDBC share it</text>

    <rect x="15" y="265" width="200" height="75" rx="6" ry="6" fill="#0F172A"/>
    <text x="100" y="288" class="badge" fill="#FCD34D" text-anchor="middle">Active Tx Context</text>
    <text x="15" y="308" class="card-body" font-size="11">Connection ready for queries</text>
  </g>

  <!-- Step 3: Target Method Execution -->
  <g transform="translate(545, 75)">
    <rect width="230" height="370" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="230" height="30" rx="10" ry="10" fill="#065F46"/>
    <text x="115" y="20" class="card-title" fill="#A7F3D0" text-anchor="middle">3. Target Execution</text>

    <rect x="15" y="45" width="200" height="90" rx="6" ry="6" fill="#1E293B"/>
    <text x="100" y="66" class="badge" fill="#A7F3D0" text-anchor="middle">Real Service Bean</text>
    <text x="15" y="88" class="card-body" font-family="monospace">OrderServiceImpl.create()</text>
    <text x="15" y="104" class="card-body" font-size="11">Executes domain business</text>
    <text x="15" y="120" class="card-body" font-size="11">logic and validations</text>

    <rect x="15" y="145" width="200" height="105" rx="6" ry="6" fill="#064E3B" stroke="#10B981"/>
    <text x="100" y="168" class="badge" fill="#34D399" text-anchor="middle">EntityManager / Repos</text>
    <text x="15" y="190" class="card-body">• repo.save(order)</text>
    <text x="15" y="206" class="card-body">• Emits SQL INSERT</text>
    <text x="15" y="222" class="card-body" font-size="11" fill="#A7F3D0">Uses ThreadLocal Connection</text>
    <text x="15" y="236" class="badge" fill="#6EE7B7">First-level Cache (Persistence)</text>

    <rect x="15" y="260" width="200" height="75" rx="6" ry="6" fill="#0F172A"/>
    <text x="100" y="282" class="badge" fill="#A7F3D0" text-anchor="middle">Execution Verdict</text>
    <text x="15" y="302" class="card-body" font-size="11">Normal Return vs Exception</text>
  </g>

  <!-- Step 4: Commit or Rollback -->
  <g transform="translate(800, 75)">
    <rect width="220" height="370" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="220" height="30" rx="10" ry="10" fill="#5B21B6"/>
    <text x="110" y="20" class="card-title" fill="#DDD6FE" text-anchor="middle">4. Commit / Rollback</text>

    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="190" height="90" rx="6" ry="6" fill="#064E3B" stroke="#10B981"/>
      <text x="15" y="20" class="badge" fill="#A7F3D0">Success: Commit</text>
      <text x="15" y="38" class="card-body" font-family="monospace">em.flush();</text>
      <text x="15" y="54" class="card-body" font-family="monospace">con.commit();</text>
      <text x="15" y="70" class="card-body" font-size="11" fill="#D1FAE5">Unbinds ThreadLocal connection</text>
      <text x="15" y="82" class="badge" fill="#34D399">Changes permanently saved</text>

      <rect x="0" y="100" width="190" height="95" rx="6" ry="6" fill="#450A0A" stroke="#EF4444"/>
      <text x="15" y="122" class="badge" fill="#FCA5A5">Error: Rollback</text>
      <text x="15" y="142" class="card-body" font-family="monospace">con.rollback();</text>
      <text x="15" y="158" class="card-body" font-size="11">Triggers on RuntimeException</text>
      <text x="15" y="174" class="card-body" font-size="11">or Error automatically!</text>
      <text x="15" y="188" class="badge" fill="#F87171">Aborts all uncommitted SQL</text>
    </g>

    <rect x="15" y="255" width="190" height="80" rx="6" ry="6" fill="#0F172A"/>
    <text x="95" y="278" class="badge" fill="#DDD6FE" text-anchor="middle">Connection Return</text>
    <text x="15" y="300" class="card-body" font-size="11">HikariCP pool reclaims</text>
    <text x="15" y="316" class="card-body" font-size="11">connection safely</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 260 260 L 278 260 L 290 260" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  <path d="M 520 260 L 533 260 L 545 260" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M 775 260 L 788 260 L 800 260" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
</svg>