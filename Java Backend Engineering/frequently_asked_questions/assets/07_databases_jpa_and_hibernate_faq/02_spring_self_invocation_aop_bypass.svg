<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" ry="12"/>

  <text x="530" y="32" class="title" font-size="20" text-anchor="middle">Spring @Transactional Self-Invocation AOP Bypass</text>
  <text x="530" y="52" class="subtitle" text-anchor="middle">Why internal this.method() calls bypass Spring AOP proxies and fail to start transactions</text>

  <!-- Left: The Fatal Bypass Anti-Pattern -->
  <g transform="translate(40, 75)">
    <rect width="460" height="370" rx="10" ry="10" fill="#111827" stroke="#EF4444" stroke-width="2"/>
    <rect width="460" height="30" rx="10" ry="10" fill="#7F1D1D"/>
    <text x="230" y="20" class="card-title" fill="#FCA5A5" text-anchor="middle">The Bug: Internal this.methodB() Call</text>

    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="420" height="55" rx="6" ry="6" fill="#1E293B"/>
      <text x="15" y="20" class="badge" fill="#93C5FD">Caller Invokes Non-Transactional Method</text>
      <text x="15" y="38" class="card-body" font-family="monospace">orderService.methodA(); // methodA has NO @Transactional</text>

      <rect x="0" y="65" width="420" height="110" rx="6" ry="6" fill="#450A0A" stroke="#EF4444"/>
      <text x="15" y="85" class="badge" fill="#F87171">Internal Call Inside methodA():</text>
      <text x="15" y="105" class="card-body" font-family="monospace">public void methodA() {</text>
      <text x="15" y="123" class="card-body" font-family="monospace">    this.methodB(); // Direct JVM local call!</text>
      <text x="15" y="141" class="card-body" font-family="monospace">}</text>
      <text x="15" y="161" class="badge" fill="#FCA5A5">@Transactional public void methodB() { ... }</text>

      <rect x="0" y="185" width="420" height="75" rx="6" ry="6" fill="#1E293B" stroke="#EF4444"/>
      <text x="15" y="205" class="badge" fill="#F87171">WHY IT FAILS TO START A TRANSACTION</text>
      <text x="15" y="223" class="card-body">• 'this' refers to the raw target object, NOT the proxy!</text>
      <text x="15" y="241" class="card-body">• Completely bypasses Spring TransactionInterceptor!</text>
    </g>

    <rect x="20" y="315" width="420" height="40" rx="6" ry="6" fill="#450A0A"/>
    <text x="210" y="338" class="badge" fill="#FCA5A5" text-anchor="middle">Silent Failure: Runs without transaction; no rollback on error!</text>
  </g>

  <!-- Right: The Production Solutions -->
  <g transform="translate(560, 75)">
    <rect width="460" height="370" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="460" height="30" rx="10" ry="10" fill="#065F46"/>
    <text x="230" y="20" class="card-title" fill="#A7F3D0" text-anchor="middle">Production Solutions</text>

    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="420" height="85" rx="6" ry="6" fill="#1E293B" stroke="#10B981"/>
      <text x="15" y="20" class="badge" fill="#A7F3D0">Solution 1: Refactor into Separate Bean (Recommended)</text>
      <text x="15" y="38" class="card-body">• Extract methodB() into OrderTransactionService</text>
      <text x="15" y="54" class="card-body">• Inject OrderTransactionService into OrderService</text>
      <text x="15" y="70" class="card-body">• Call goes through injected Proxy: 100% clean architecture!</text>

      <rect x="0" y="95" width="420" height="85" rx="6" ry="6" fill="#1E293B" stroke="#3B82F6"/>
      <text x="15" y="115" class="badge" fill="#93C5FD">Solution 2: Self-Injection with @Lazy</text>
      <text x="15" y="133" class="card-body" font-family="monospace">@Autowired @Lazy private OrderService self;</text>
      <text x="15" y="151" class="card-body" font-family="monospace">self.methodB(); // Calls through proxy!</text>
      <text x="15" y="169" class="card-body" font-size="11" fill="#93C5FD">Prevents circular dependency via lazy proxy</text>

      <rect x="0" y="190" width="420" height="70" rx="6" ry="6" fill="#1E293B" stroke="#8B5CF6"/>
      <text x="15" y="210" class="badge" fill="#DDD6FE">Solution 3: AspectJ Compile-Time / Load-Time Weaving</text>
      <text x="15" y="228" class="card-body">• Replaces Spring AOP dynamic proxies with AspectJ bytecode weaving</text>
      <text x="15" y="244" class="card-body" font-size="11" fill="#C4B5FD">Weaves interceptors directly into bytecode; works on 'this' calls!</text>
    </g>

    <rect x="20" y="315" width="420" height="40" rx="6" ry="6" fill="#064E3B"/>
    <text x="210" y="338" class="badge" fill="#A7F3D0" text-anchor="middle">Separation of Concerns: Separate Service Beans yield highest maintainability</text>
  </g>
</svg>