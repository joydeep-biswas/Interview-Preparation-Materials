<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" ry="12"/>

  <text x="530" y="32" class="title" font-size="20" text-anchor="middle">B-Tree Composite Index (A, B, C) &amp; Leftmost Prefix Rule</text>
  <text x="530" y="52" class="subtitle" text-anchor="middle">How database query optimizers choose between logarithmic Index Seeks and expensive Full Table Scans</text>

  <!-- Left: Composite Index Structure -->
  <g transform="translate(40, 75)">
    <rect width="440" height="370" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="440" height="30" rx="10" ry="10" fill="#1E3A8A"/>
    <text x="220" y="20" class="card-title" fill="#BFDBFE" text-anchor="middle">Composite Index: idx_dept_status_date (dept, status, date)</text>

    <!-- Visual Lexicographical Sorting -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="400" height="40" rx="4" ry="4" fill="#1E293B" stroke="#3B82F6"/>
      <text x="200" y="24" class="badge" fill="#93C5FD" text-anchor="middle">Level 1 Primary Sort: dept ('ENG' vs 'HR' vs 'SALES')</text>

      <rect x="0" y="50" width="400" height="40" rx="4" ry="4" fill="#1E293B" stroke="#10B981"/>
      <text x="200" y="74" class="badge" fill="#A7F3D0" text-anchor="middle">Level 2 Secondary Sort: status ('ACTIVE' vs 'INACTIVE') within same dept</text>

      <rect x="0" y="100" width="400" height="40" rx="4" ry="4" fill="#1E293B" stroke="#F59E0B"/>
      <text x="200" y="124" class="badge" fill="#FDE68A" text-anchor="middle">Level 3 Tertiary Sort: hire_date within same (dept, status)</text>
    </g>

    <rect x="20" y="210" width="400" height="135" rx="6" ry="6" fill="#0F172A" stroke="#374151"/>
    <text x="200" y="232" class="badge" fill="#93C5FD" text-anchor="middle">The Telephone Directory Mental Model</text>
    <text x="15" y="254" class="card-body">• Sorted by: (Last Name, First Name, Middle Name)</text>
    <text x="15" y="272" class="card-body">• Can you find "Smith, John"? YES! Direct binary seek.</text>
    <text x="15" y="290" class="card-body">• Can you find anyone named "John" without last name?</text>
    <text x="15" y="306" class="badge" fill="#FCA5A5">  NO! You must read the ENTIRE book page by page!</text>
    <text x="15" y="326" class="card-body" font-size="11" fill="#9CA3AF">Leftmost column is the required entry key to traverse the B-Tree.</text>
  </g>

  <!-- Right: Query Optimization Matrix -->
  <g transform="translate(510, 75)">
    <rect width="510" height="370" rx="10" ry="10" fill="#111827" stroke="#1F2937" stroke-width="2"/>
    <rect width="510" height="30" rx="10" ry="10" fill="#1F2937"/>
    <text x="255" y="20" class="card-title" fill="#F3F4F6" text-anchor="middle">Leftmost Prefix Evaluation Rules</text>

    <!-- Query Cases -->
    <g transform="translate(20, 45)">
      <!-- Case 1: Seek -->
      <rect x="0" y="0" width="470" height="65" rx="6" ry="6" fill="#064E3B" stroke="#10B981"/>
      <text x="15" y="20" class="badge" fill="#34D399">WHERE dept = 'ENG' AND status = 'ACTIVE'</text>
      <text x="15" y="38" class="card-body">Uses (A, B) prefix. Fast B-Tree Index Range Seek (O(log N)).</text>
      <text x="15" y="52" class="badge" fill="#A7F3D0">Verdict: INDEX SEEK (Optimal)</text>

      <!-- Case 2: Seek on A only -->
      <rect x="0" y="75" width="470" height="65" rx="6" ry="6" fill="#064E3B" stroke="#10B981"/>
      <text x="15" y="95" class="badge" fill="#34D399">WHERE dept = 'ENG'</text>
      <text x="15" y="113" class="card-body">Uses (A) prefix. Binary seeks straight to 'ENG' branch.</text>
      <text x="15" y="127" class="badge" fill="#A7F3D0">Verdict: INDEX SEEK (Optimal)</text>

      <!-- Case 3: Scan (Skipped A!) -->
      <rect x="0" y="150" width="470" height="65" rx="6" ry="6" fill="#450A0A" stroke="#EF4444"/>
      <text x="15" y="170" class="badge" fill="#F87171">WHERE status = 'ACTIVE' (Missing 'dept'!)</text>
      <text x="15" y="188" class="card-body">B-Tree cannot navigate to 'ACTIVE' because it is scattered across every dept!</text>
      <text x="15" y="202" class="badge" fill="#FCA5A5">Verdict: FULL TABLE SCAN (Catastrophic on 10M rows!)</text>

      <!-- Case 4: Partial Seek -->
      <rect x="0" y="225" width="470" height="85" rx="6" ry="6" fill="#451A03" stroke="#F59E0B"/>
      <text x="15" y="245" class="badge" fill="#FDE68A">WHERE dept = 'ENG' AND hire_date &gt; '2023-01-01'</text>
      <text x="15" y="263" class="card-body">Uses 'dept' for Index Seek, but must scan all dates within 'ENG' because</text>
      <text x="15" y="279" class="card-body" font-size="11">column 'status' was skipped in the middle!</text>
      <text x="15" y="295" class="badge" fill="#FCD34D">Verdict: Partial Index Range Scan + Filter</text>
    </g>
  </g>
</svg>