<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" ry="12" stroke="#1F2937" stroke-width="1.5"/>

  <text x="530" y="32" class="title" font-size="20" text-anchor="middle">Spring Data Repository Interface Hierarchy</text>
  <text x="530" y="52" class="subtitle" text-anchor="middle">Marker contract progression: Repository -> CrudRepository -> PagingAndSorting -> JpaRepository</text>

  <!-- Level 1: Repository Marker -->
  <g transform="translate(380, 75)">
    <rect width="300" height="65" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="300" height="24" rx="10" ry="10" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
    <text x="150" y="17" class="card-title" fill="#BFDBFE" text-anchor="middle">Repository&lt;T, ID&gt; (Root Marker)</text>
    <text x="15" y="44" class="card-body">• Pure marker interface (0 methods)</text>
    <text x="15" y="58" class="card-body" font-size="11" fill="#9CA3AF">• Signals Spring Data to generate dynamic proxy</text>
  </g>

  <!-- Level 2: CrudRepository -->
  <g transform="translate(380, 165)">
    <rect width="300" height="75" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="300" height="24" rx="10" ry="10" fill="#92400E" stroke="#F59E0B" stroke-width="1"/>
    <text x="150" y="17" class="card-title" fill="#FDE68A" text-anchor="middle">CrudRepository&lt;T, ID&gt; (Basic CRUD)</text>
    <text x="15" y="44" class="card-body">• save(entity), findById(id), existsById(id)</text>
    <text x="15" y="60" class="card-body">• findAll(): Iterable&lt;T&gt;, count(), delete(entity)</text>
  </g>

  <!-- Level 3: Two branches: ListCrudRepository & PagingAndSortingRepository -->
  <g transform="translate(180, 265)">
    <rect width="320" height="80" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="320" height="24" rx="10" ry="10" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
    <text x="160" y="17" class="card-title" fill="#BFDBFE" text-anchor="middle">ListCrudRepository&lt;T, ID&gt; (Spring 3+)</text>
    <text x="15" y="44" class="card-body">• Overrides findAll(): List&lt;T&gt; (No cast from Iterable!)</text>
    <text x="15" y="60" class="card-body">• saveAll(): List&lt;T&gt;</text>
  </g>

  <g transform="translate(560, 265)">
    <rect width="320" height="80" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="320" height="24" rx="10" ry="10" fill="#065F46" stroke="#10B981" stroke-width="1"/>
    <text x="160" y="17" class="card-title" fill="#A7F3D0" text-anchor="middle">PagingAndSortingRepository&lt;T, ID&gt;</text>
    <text x="15" y="44" class="card-body">• findAll(Sort sort): Iterable&lt;T&gt;</text>
    <text x="15" y="60" class="card-body">• findAll(Pageable pageable): Page&lt;T&gt;</text>
  </g>

  <!-- Level 4: JpaRepository (Unified Leaf) -->
  <g transform="translate(260, 375)">
    <rect width="540" height="85" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="540" height="26" rx="10" ry="10" fill="#5B21B6" stroke="#8B5CF6" stroke-width="1"/>
    <text x="270" y="18" class="card-title" fill="#DDD6FE" text-anchor="middle">JpaRepository&lt;T, ID&gt; (JPA-Specific Specialized Contract)</text>
    <text x="20" y="48" class="card-body">• flush(): Flushes pending SQL to DB immediately</text>
    <text x="20" y="64" class="card-body">• saveAndFlush(entity), deleteInBatch(), getReferenceById(id) [Lazy Proxy]</text>
    <text x="20" y="78" class="badge" fill="#C4B5FD">Inherits all CRUD + Pagination + JPA Persistence Context commands</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 530 140 L 530 153 L 530 165" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>

  <!-- Crud -> ListCrud -->
  <path d="M 450 240 L 450 252 Q 450 265 400 265 L 340 265" fill="none" stroke="#3B82F6" stroke-width="2"/>

  <!-- Crud -> Paging -->
  <path d="M 610 240 L 610 252 Q 610 265 660 265 L 720 265" fill="none" stroke="#10B981" stroke-width="2"/>

  <!-- Branches -> JpaRepository -->
  <path d="M 340 345 L 340 363 L 340 375" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M 720 345 L 720 363 L 720 375" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
</svg>