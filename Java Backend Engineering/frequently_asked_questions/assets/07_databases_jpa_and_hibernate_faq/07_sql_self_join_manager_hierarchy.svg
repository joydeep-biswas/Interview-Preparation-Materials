<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" ry="12" stroke="#1F2937" stroke-width="1.5"/>

  <text x="530" y="32" class="title" font-size="20" text-anchor="middle">SQL Self-Join Mechanics: Hierarchical Manager Relationships</text>
  <text x="530" y="52" class="subtitle" text-anchor="middle">Aliasing the same table twice to resolve parent-child tree relationships within a single query</text>

  <!-- Left: Employee Table Instance A (emp e) -->
  <g transform="translate(40, 75)">
    <rect width="300" height="370" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="300" height="30" rx="10" ry="10" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
    <text x="150" y="20" class="card-title" fill="#BFDBFE" text-anchor="middle">employees AS e (Worker Role)</text>

    <!-- Table Rows -->
    <g transform="translate(15, 48)">
      <rect x="0" y="0" width="270" height="75" rx="6" ry="6" fill="#1E293B" stroke="#3B82F6"/>
      <text x="15" y="20" class="badge" fill="#93C5FD">id: 101 | name: "Alice"</text>
      <text x="15" y="38" class="card-body">role: "Senior Engineer"</text>
      <text x="15" y="56" class="badge" fill="#FCD34D">manager_id: 103 (Bob)</text>

      <rect x="0" y="85" width="270" height="75" rx="6" ry="6" fill="#1E293B" stroke="#3B82F6"/>
      <text x="15" y="105" class="badge" fill="#93C5FD">id: 102 | name: "Charlie"</text>
      <text x="15" y="123" class="card-body">role: "QA Engineer"</text>
      <text x="15" y="141" class="badge" fill="#FCD34D">manager_id: 103 (Bob)</text>

      <rect x="0" y="170" width="270" height="75" rx="6" ry="6" fill="#1E293B" stroke="#10B981"/>
      <text x="15" y="190" class="badge" fill="#A7F3D0">id: 103 | name: "Bob"</text>
      <text x="15" y="208" class="card-body">role: "Engineering VP"</text>
      <text x="15" y="226" class="badge" fill="#9CA3AF">manager_id: NULL (Top CEO)</text>
    </g>

    <rect x="15" y="305" width="270" height="40" rx="4" ry="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="135" y="328" class="badge" fill="#93C5FD" text-anchor="middle">Worker Perspective: e.manager_id</text>
  </g>

  <!-- Middle: SQL Join Invariant -->
  <g transform="translate(370, 75)">
    <rect width="320" height="370" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="320" height="30" rx="10" ry="10" fill="#065F46" stroke="#10B981" stroke-width="1"/>
    <text x="160" y="20" class="card-title" fill="#A7F3D0" text-anchor="middle">The Self-Join Predicate</text>

    <rect x="15" y="45" width="290" height="120" rx="6" ry="6" fill="#1E293B" stroke="#10B981"/>
    <text x="145" y="66" class="badge" fill="#A7F3D0" text-anchor="middle">SQL Query Syntax</text>
    <text x="15" y="88" class="card-body" font-family="monospace">SELECT</text>
    <text x="25" y="104" class="card-body" font-family="monospace">e.name AS employee,</text>
    <text x="25" y="120" class="card-body" font-family="monospace">COALESCE(m.name, 'TOP')</text>
    <text x="15" y="136" class="card-body" font-family="monospace">FROM employees e</text>
    <text x="15" y="152" class="badge" fill="#34D399">LEFT JOIN employees m</text>

    <rect x="15" y="180" width="290" height="70" rx="6" ry="6" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="145" y="202" class="badge" fill="#A7F3D0" text-anchor="middle">Join Condition (Foreign Key)</text>
    <text x="145" y="222" class="card-body" font-family="monospace" text-anchor="middle">ON e.manager_id = m.id</text>
    <text x="145" y="238" class="card-body" font-size="11" text-anchor="middle">Resolves pointer within same table</text>

    <rect x="15" y="265" width="290" height="85" rx="6" ry="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="145" y="288" class="badge" fill="#FDE68A" text-anchor="middle">Why LEFT JOIN is Crucial</text>
    <text x="20" y="308" class="card-body">• An INNER JOIN drops Bob (CEO has NULL manager!)</text>
    <text x="20" y="324" class="badge" fill="#A7F3D0">• LEFT JOIN retains all employees including root</text>
  </g>

  <!-- Right: Employee Table Instance B (emp m) -->
  <g transform="translate(720, 75)">
    <rect width="300" height="370" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="300" height="30" rx="10" ry="10" fill="#5B21B6" stroke="#8B5CF6" stroke-width="1"/>
    <text x="150" y="20" class="card-title" fill="#DDD6FE" text-anchor="middle">employees AS m (Manager Role)</text>

    <!-- Table Rows -->
    <g transform="translate(15, 48)">
      <rect x="0" y="0" width="270" height="75" rx="6" ry="6" fill="#1E293B" stroke="#8B5CF6"/>
      <text x="15" y="20" class="badge" fill="#DDD6FE">id: 103 | name: "Bob"</text>
      <text x="15" y="38" class="card-body">role: "Engineering VP"</text>
      <text x="15" y="56" class="badge" fill="#34D399">Matched as Manager for 101, 102</text>

      <rect x="0" y="85" width="270" height="75" rx="6" ry="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="15" y="105" class="badge" fill="#9CA3AF">id: 101 | Alice (No direct reports)</text>
      <text x="15" y="123" class="card-body" font-size="11">Not referenced in m.id</text>

      <rect x="0" y="170" width="270" height="75" rx="6" ry="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="15" y="190" class="badge" fill="#9CA3AF">id: 102 | Charlie (No reports)</text>
    </g>

    <rect x="15" y="305" width="270" height="40" rx="4" ry="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="135" y="328" class="badge" fill="#DDD6FE" text-anchor="middle">Manager Perspective: m.id</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 340 160 L 358 160 L 370 160" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M 690 160 L 708 160 L 720 160" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
</svg>