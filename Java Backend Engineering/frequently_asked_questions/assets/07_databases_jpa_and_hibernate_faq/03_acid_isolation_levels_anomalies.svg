<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
  </style>

  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" ry="12" stroke="#1F2937" stroke-width="1.5"/>

  <text x="530" y="32" class="title" font-size="20" text-anchor="middle">SQL Isolation Levels vs Concurrency Anomalies Matrix</text>
  <text x="530" y="52" class="subtitle" text-anchor="middle">Mapping ANSI SQL isolation levels against Dirty Reads, Non-Repeatable Reads, Phantom Reads, and Lost Updates</text>

  <!-- Table Matrix Card -->
  <g transform="translate(40, 75)">
    <rect width="980" height="370" rx="10" ry="10" fill="#111827" stroke="#1F2937" stroke-width="2"/>
    <rect width="980" height="34" rx="10" ry="10" fill="#1F2937" stroke="#334155" stroke-width="1"/>
    <text x="490" y="22" class="card-title" fill="#F3F4F6" text-anchor="middle">Isolation Level Protection Comparison</text>

    <!-- Table Columns Header -->
    <text x="60" y="60" class="badge" fill="#9CA3AF">Isolation Level</text>
    <text x="260" y="60" class="badge" fill="#9CA3AF">Dirty Read (P1)</text>
    <text x="440" y="60" class="badge" fill="#9CA3AF">Non-Repeatable Read (P2)</text>
    <text x="660" y="60" class="badge" fill="#9CA3AF">Phantom Read (P3)</text>
    <text x="860" y="60" class="badge" fill="#9CA3AF">Lost Update</text>

    <line x1="40" y1="72" x2="1000" y2="72" stroke="#374151" stroke-width="1"/>

    <!-- Row 1: READ_UNCOMMITTED -->
    <text x="60" y="105" class="badge" fill="#EF4444">READ UNCOMMITTED</text>
    <text x="260" y="105" class="badge" fill="#EF4444">POSSIBLE</text>
    <text x="440" y="105" class="badge" fill="#EF4444">POSSIBLE</text>
    <text x="660" y="105" class="badge" fill="#EF4444">POSSIBLE</text>
    <text x="860" y="105" class="badge" fill="#EF4444">POSSIBLE</text>
    <text x="60" y="122" class="card-body" font-size="11" fill="#9CA3AF">Reads uncommitted dirty memory changes from other in-flight transactions (Never use in prod!).</text>

    <line x1="40" y1="135" x2="1000" y2="135" stroke="#374151" stroke-width="0.5"/>

    <!-- Row 2: READ_COMMITTED -->
    <text x="60" y="165" class="badge" fill="#F59E0B">READ COMMITTED (Default)</text>
    <text x="260" y="165" class="badge" fill="#10B981">PREVENTED</text>
    <text x="440" y="165" class="badge" fill="#EF4444">POSSIBLE</text>
    <text x="660" y="165" class="badge" fill="#EF4444">POSSIBLE</text>
    <text x="860" y="165" class="badge" fill="#EF4444">POSSIBLE</text>
    <text x="60" y="182" class="card-body" font-size="11" fill="#9CA3AF">Postgres / Oracle default. Uses MVCC statement snapshot. Prevents dirty reads, but row values can change mid-transaction.</text>

    <line x1="40" y1="195" x2="1000" y2="195" stroke="#374151" stroke-width="0.5"/>

    <!-- Row 3: REPEATABLE_READ -->
    <text x="60" y="225" class="badge" fill="#60A5FA">REPEATABLE READ (MySQL)</text>
    <text x="260" y="225" class="badge" fill="#10B981">PREVENTED</text>
    <text x="440" y="225" class="badge" fill="#10B981">PREVENTED</text>
    <text x="660" y="225" class="badge" fill="#F59E0B">PREVENTED in InnoDB*</text>
    <text x="860" y="225" class="badge" fill="#F59E0B">Check Lock Required</text>
    <text x="60" y="242" class="card-body" font-size="11" fill="#9CA3AF">MySQL default. MVCC snapshot frozen at transaction start. InnoDB Next-Key Locks also eliminate phantom reads!</text>

    <line x1="40" y1="255" x2="1000" y2="255" stroke="#374151" stroke-width="0.5"/>

    <!-- Row 4: SERIALIZABLE -->
    <text x="60" y="285" class="badge" fill="#10B981">SERIALIZABLE</text>
    <text x="260" y="285" class="badge" fill="#10B981">PREVENTED</text>
    <text x="440" y="285" class="badge" fill="#10B981">PREVENTED</text>
    <text x="660" y="285" class="badge" fill="#10B981">PREVENTED</text>
    <text x="860" y="285" class="badge" fill="#10B981">PREVENTED</text>
    <text x="60" y="302" class="card-body" font-size="11" fill="#9CA3AF">Strict mathematical serial execution. Range locks / SSI (Serializable Snapshot Isolation). Highest safety, highest abort rate.</text>

    <!-- Bottom summary note -->
    <rect x="20" y="320" width="940" height="35" rx="4" ry="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="490" y="342" class="badge" fill="#A7F3D0" text-anchor="middle">Lost Updates can occur even in READ_COMMITTED! Always use @Version (Optimistic) or SELECT FOR UPDATE.</text>
  </g>
</svg>