<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1180" height="520" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">SynchronousQueue Direct Handoff Sequence Diagram</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Zero Internal Storage Capacity: Producer Blocks Until Consumer Rendezvous Point Arrives</text>

  <!-- Swimlane Headers -->
  <rect x="80" y="95" width="220" height="45" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="190" y="122" font-size="12" font-weight="700" fill="#60A5FA" text-anchor="middle">Producer Thread</text>

  <rect x="470" y="95" width="240" height="45" rx="6" fill="#1C1917" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="590" y="122" font-size="12" font-weight="700" fill="#FBBF24" text-anchor="middle">SynchronousQueue (Cap: 0)</text>

  <rect x="870" y="95" width="220" height="45" rx="6" fill="#06201B" stroke="#10B981" stroke-width="1.5"/>
  <text x="980" y="122" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle">Consumer Thread</text>

  <!-- Lifeline dashed lines -->
  <path fill="none" d="M 190 140 L 190 440" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path fill="none" d="M 590 140 L 590 440" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path fill="none" d="M 980 140 L 980 440" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Event 1: Producer calls put("TASK-1") -->
  <path fill="none" d="M 190 180 L 585 180" stroke="#3B82F6" stroke-width="2" marker-end="url(#arr-b)"/>
  <rect x="260" y="162" width="180" height="24" rx="4" fill="#0B132B" stroke="#3B82F6" stroke-width="1"/>
  <text x="350" y="178" font-size="10" font-weight="700" fill="#93C5FD" text-anchor="middle">1. put("TASK-101")</text>

  <!-- Producer Parks -->
  <rect x="180" y="195" width="20" height="135" rx="3" fill="#1C1917" stroke="#EF4444" stroke-width="1"/>
  <rect x="60" y="240" width="110" height="45" rx="4" fill="#1E293B" stroke="#EF4444" stroke-width="1"/>
  <text x="115" y="258" font-size="10" font-weight="700" fill="#FCA5A5" text-anchor="middle">Producer Parks</text>
  <text x="115" y="274" font-size="9" fill="#94A3B8" text-anchor="middle">Thread WAITING</text>

  <!-- Note on Queue -->
  <rect x="520" y="210" width="140" height="50" rx="4" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
  <text x="590" y="230" font-size="9" fill="#CBD5E1" text-anchor="middle">No waiting consumer</text>
  <text x="590" y="248" font-size="9" fill="#FDE68A" text-anchor="middle">Enqueues Data Node</text>

  <!-- Event 2: Consumer calls take() -->
  <path fill="none" d="M 980 300 L 595 300" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>
  <rect x="740" y="282" width="140" height="24" rx="4" fill="#06201B" stroke="#10B981" stroke-width="1"/>
  <text x="810" y="298" font-size="10" font-weight="700" fill="#6EE7B7" text-anchor="middle">2. take() Invoked</text>

  <!-- Rendezvous Match Box -->
  <rect x="500" y="325" width="180" height="45" rx="4" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="590" y="344" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">Rendezvous Match!</text>
  <text x="590" y="359" font-size="9" fill="#CBD5E1" text-anchor="middle">Direct Handoff (Zero Storage)</text>

  <!-- Event 3: Handoff to Consumer &amp; Unpark Producer -->
  <path fill="none" d="M 590 380 L 975 380" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>
  <rect x="730" y="365" width="170" height="24" rx="4" fill="#06201B" stroke="#10B981" stroke-width="1"/>
  <text x="815" y="381" font-size="10" font-weight="700" fill="#6EE7B7" text-anchor="middle">3. returns "TASK-101"</text>

  <path fill="none" d="M 590 395 L 195 395" stroke="#3B82F6" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arr-b)"/>
  <rect x="270" y="385" width="160" height="22" rx="4" fill="#0B132B" stroke="#3B82F6" stroke-width="1"/>
  <text x="350" y="400" font-size="9" font-weight="700" fill="#93C5FD" text-anchor="middle">Unparks Producer Thread</text>

  <!-- Bottom Principle Box -->
  <rect x="50" y="450" width="1080" height="55" rx="6" fill="#0B132B" stroke="#3B82F6" stroke-width="1"/>
  <text x="590" y="475" font-size="11" font-weight="700" fill="#60A5FA" text-anchor="middle">Design Rule: SynchronousQueue holds exactly 0 elements</text>
  <text x="590" y="492" font-size="10" fill="#CBD5E1" text-anchor="middle">Each put() must wait for a take(), and each take() must wait for a put(). Default handoff mechanism for CachedThreadPool.</text>
</svg>