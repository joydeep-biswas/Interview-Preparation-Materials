<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="500" viewBox="0 0 1180 500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1180" height="500" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">ArrayList Backing Array &amp; Geometric Resizing Architecture</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Contiguous Object[] elementData Buffer with Size vs. Capacity &amp; 1.5x Amortized Growth</text>

  <!-- Top: Array Memory Strip -->
  <rect x="50" y="95" width="1080" height="205" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="50" y="95" width="1080" height="32" rx="8" fill="#0C4A6E"/>
  <text x="590" y="117" font-size="12" font-weight="700" fill="#7DD3FC" text-anchor="middle">Contiguous Heap Array: Object[] elementData (Capacity = 8, Size = 5)</text>

  <!-- Cells 0 to 4 (Populated) -->
  <rect x="75" y="145" width="120" height="75" rx="4" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="135" y="170" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle">Index 0</text>
  <text x="135" y="195" font-size="14" font-family="'JetBrains Mono', monospace" fill="#F8FAFC" text-anchor="middle">"Alpha"</text>

  <rect x="205" y="145" width="120" height="75" rx="4" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="265" y="170" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle">Index 1</text>
  <text x="265" y="195" font-size="14" font-family="'JetBrains Mono', monospace" fill="#F8FAFC" text-anchor="middle">"Bravo"</text>

  <rect x="335" y="145" width="120" height="75" rx="4" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="395" y="170" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle">Index 2</text>
  <text x="395" y="195" font-size="14" font-family="'JetBrains Mono', monospace" fill="#F8FAFC" text-anchor="middle">"Charlie"</text>

  <rect x="465" y="145" width="120" height="75" rx="4" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="525" y="170" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle">Index 3</text>
  <text x="525" y="195" font-size="14" font-family="'JetBrains Mono', monospace" fill="#F8FAFC" text-anchor="middle">"Delta"</text>

  <rect x="595" y="145" width="120" height="75" rx="4" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="655" y="170" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle">Index 4</text>
  <text x="655" y="195" font-size="14" font-family="'JetBrains Mono', monospace" fill="#F8FAFC" text-anchor="middle">"Echo"</text>

  <!-- Cells 5 to 7 (Unallocated / Null) -->
  <rect x="725" y="145" width="120" height="75" rx="4" fill="#0F172A" stroke="#475569" stroke-dasharray="3 3"/>
  <text x="785" y="170" font-size="12" font-weight="700" fill="#94A3B8" text-anchor="middle">Index 5</text>
  <text x="785" y="195" font-size="12" font-family="'JetBrains Mono', monospace" fill="#64748B" text-anchor="middle">null</text>

  <rect x="855" y="145" width="120" height="75" rx="4" fill="#0F172A" stroke="#475569" stroke-dasharray="3 3"/>
  <text x="915" y="170" font-size="12" font-weight="700" fill="#94A3B8" text-anchor="middle">Index 6</text>
  <text x="915" y="195" font-size="12" font-family="'JetBrains Mono', monospace" fill="#64748B" text-anchor="middle">null</text>

  <rect x="985" y="145" width="120" height="75" rx="4" fill="#0F172A" stroke="#475569" stroke-dasharray="3 3"/>
  <text x="1045" y="170" font-size="12" font-weight="700" fill="#94A3B8" text-anchor="middle">Index 7</text>
  <text x="1045" y="195" font-size="12" font-family="'JetBrains Mono', monospace" fill="#64748B" text-anchor="middle">null</text>

  <!-- Size vs Capacity Indicators -->
  <path fill="none" d="M 75 235 L 715 235" stroke="#10B981" stroke-width="2"/>
  <text x="395" y="252" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">Active Elements: size = 5</text>

  <path fill="none" d="M 725 235 L 1105 235" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="915" y="252" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="middle">Free Slots = 3 (capacity - size)</text>

  <text x="590" y="280" font-size="11" font-weight="600" fill="#7DD3FC" text-anchor="middle">Total Buffer: capacity = 8 (elementData.length)</text>

  <!-- Bottom Left: Resizing Mechanics -->
  <rect x="50" y="320" width="530" height="155" rx="8" fill="#06201B" stroke="#047857" stroke-width="1.5"/>
  <rect x="50" y="320" width="530" height="30" rx="8" fill="#064E3B"/>
  <text x="315" y="340" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">1.5x Geometric Capacity Expansion Formula</text>

  <rect x="70" y="360" width="490" height="100" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="85" y="385" font-size="11" font-family="'JetBrains Mono', monospace" fill="#38BDF8">int newCapacity = oldCapacity + (oldCapacity &gt;&gt; 1);</text>
  <text x="85" y="408" font-size="10" fill="#CBD5E1">&#x2022; Bitwise right-shift (<tspan font-family="'JetBrains Mono', monospace">&gt;&gt; 1</tspan>) divides by 2: exactly 50% expansion</text>
  <text x="85" y="426" font-size="10" fill="#CBD5E1">&#x2022; Example progression: 10 -&gt; 15 -&gt; 22 -&gt; 33 -&gt; 49 -&gt; 73 ...</text>
  <text x="85" y="444" font-size="10" fill="#A7F3D0">&#x2022; Copies elements via native <tspan font-family="'JetBrains Mono', monospace">System.arraycopy</tspan> (SIMD memmove)</text>

  <!-- Bottom Right: Amortized O(1) Proof -->
  <rect x="600" y="320" width="530" height="155" rx="8" fill="#0B132B" stroke="#1D4ED8" stroke-width="1.5"/>
  <rect x="600" y="320" width="530" height="30" rx="8" fill="#1E3A8A"/>
  <text x="865" y="340" font-size="12" font-weight="700" fill="#93C5FD" text-anchor="middle">Mathematical Proof: Amortized O(1) Append Cost</text>

  <rect x="620" y="360" width="490" height="100" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="635" y="385" font-size="11" fill="#CBD5E1">&#x2022; An expensive copy of size N only occurs every O(N) operations</text>
  <text x="635" y="405" font-size="10" font-family="'JetBrains Mono', monospace" fill="#7DD3FC">Total Work for N Appends: N + N/2 + N/4 + N/8 ... &lt; 2N</text>
  <text x="635" y="428" font-size="11" font-weight="700" fill="#34D399">&#x2714; Cost per operation = (2N work) / N appends = 2 = O(1) Amortized!</text>
  <text x="635" y="446" font-size="10" fill="#94A3B8">&#x2022; Tip: Pre-size with new ArrayList&lt;&gt;(expectedSize) to eliminate all copies!</text>
</svg>