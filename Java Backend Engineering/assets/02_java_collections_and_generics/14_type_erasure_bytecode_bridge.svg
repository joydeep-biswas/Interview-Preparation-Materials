<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="540" viewBox="0 0 1220 540">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1220" height="540" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Java Generics Type Erasure &amp; Synthetic Bridge Methods</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Source Generics Erased to Raw Types with Javac Injecting Casts and Synthetic Bridge Methods</text>

  <!-- Column 1: Source Code -->
  <rect x="50" y="95" width="340" height="370" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="50" y="95" width="340" height="30" rx="8" fill="#0C4A6E" stroke="#0284C7" stroke-width="1"/>
  <text x="220" y="116" font-size="12" font-weight="700" fill="#7DD3FC" text-anchor="middle">1. Source Code (Compile Time)</text>

  <rect x="70" y="140" width="300" height="135" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="85" y="165" font-size="11" font-weight="700" fill="#38BDF8">Parameterized Generic Types:</text>
  <text x="85" y="190" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">List&lt;String&gt; list = new ArrayList&lt;&gt;();</text>
  <text x="85" y="210" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">list.add("Hello");</text>
  <text x="85" y="230" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">String s = list.get(0);</text>
  <text x="85" y="258" font-size="9" fill="#94A3B8">Strict compile-time type safety enforced</text>

  <rect x="70" y="290" width="300" height="155" rx="6" fill="#1E293B" stroke="#0284C7" stroke-width="1"/>
  <text x="85" y="315" font-size="11" font-weight="700" fill="#7DD3FC">Polymorphic Generic Class:</text>
  <text x="85" y="340" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">class Node&lt;T&gt; {</text>
  <text x="95" y="358" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">  void setData(T data) { ... }</text>
  <text x="85" y="376" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">}</text>
  <text x="85" y="398" font-size="10" font-family="'JetBrains Mono', monospace" fill="#34D399">class MyNode extends Node&lt;Integer&gt; {</text>
  <text x="95" y="416" font-size="10" font-family="'JetBrains Mono', monospace" fill="#34D399">  void setData(Integer d) { ... }</text>
  <text x="85" y="434" font-size="10" font-family="'JetBrains Mono', monospace" fill="#34D399">}</text>

  <!-- Column 2: javac Type Erasure Engine -->
  <rect x="430" y="95" width="360" height="370" rx="8" fill="#1C1917" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="430" y="95" width="360" height="30" rx="8" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
  <text x="610" y="116" font-size="12" font-weight="700" fill="#FDE68A" text-anchor="middle">2. Javac Type Erasure Engine</text>

  <rect x="450" y="140" width="320" height="135" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="465" y="165" font-size="11" font-weight="700" fill="#FBBF24">Type Erasure Transformation:</text>
  <text x="465" y="190" font-size="10" fill="#CBD5E1">&#x2022; <tspan font-family="'JetBrains Mono', monospace">List&lt;String&gt;</tspan> erased to raw <tspan font-family="'JetBrains Mono', monospace">List</tspan></text>
  <text x="465" y="210" font-size="10" fill="#CBD5E1">&#x2022; Type parameter <tspan font-family="'JetBrains Mono', monospace">T</tspan> replaced with <tspan font-family="'JetBrains Mono', monospace">Object</tspan></text>
  <text x="465" y="235" font-size="10" font-weight="700" fill="#34D399">Synthetic Cast Injection:</text>
  <text x="465" y="255" font-size="10" fill="#A7F3D0">Compiler inserts: <tspan font-family="'JetBrains Mono', monospace">(String) list.get(0)</tspan></text>

  <rect x="450" y="290" width="320" height="155" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
  <text x="465" y="315" font-size="11" font-weight="700" fill="#FBBF24">Synthetic Bridge Method Generation:</text>
  <text x="465" y="338" font-size="10" fill="#CBD5E1">After erasure, Node has <tspan font-family="'JetBrains Mono', monospace">setData(Object)</tspan>.</text>
  <text x="465" y="356" font-size="10" fill="#CBD5E1">MyNode has <tspan font-family="'JetBrains Mono', monospace">setData(Integer)</tspan>.</text>
  <text x="465" y="376" font-size="10" fill="#F87171">Signatures no longer match for vtable override!</text>
  <text x="465" y="400" font-size="10" font-family="'JetBrains Mono', monospace" fill="#34D399">// Javac injects synthetic bridge method:</text>
  <text x="465" y="418" font-size="9" font-family="'JetBrains Mono', monospace" fill="#34D399">void setData(Object d) { setData((Integer) d); }</text>
  <text x="465" y="434" font-size="9" fill="#94A3B8">Preserves polymorphic dispatch at runtime</text>

  <!-- Column 3: Compiled Bytecode -->
  <rect x="830" y="95" width="340" height="370" rx="8" fill="#06201B" stroke="#047857" stroke-width="1.5"/>
  <rect x="830" y="95" width="340" height="30" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="1000" y="116" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">3. Compiled Bytecode (Runtime)</text>

  <rect x="850" y="140" width="300" height="135" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="865" y="165" font-size="11" font-weight="700" fill="#34D399">Raw Bytecode Instructions:</text>
  <text x="865" y="190" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">0: new java/util/ArrayList</text>
  <text x="865" y="208" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">4: invokevirtual List.add:(LObject;)Z</text>
  <text x="865" y="226" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">7: invokevirtual List.get:(I)LObject;</text>
  <text x="865" y="246" font-size="10" font-family="'JetBrains Mono', monospace" fill="#34D399">10: checkcast java/lang/String</text>
  <text x="865" y="264" font-size="9" fill="#94A3B8">Runtime JVM operates entirely on raw types</text>

  <rect x="850" y="290" width="300" height="155" rx="6" fill="#1E293B" stroke="#047857" stroke-width="1"/>
  <text x="865" y="315" font-size="11" font-weight="700" fill="#6EE7B7">Binary Compatibility Invariant:</text>
  <text x="865" y="340" font-size="10" fill="#CBD5E1">&#x2022; Java 5 generics did NOT alter the JVM</text>
  <text x="865" y="360" font-size="10" fill="#CBD5E1">&#x2022; Pre-Java 5 and modern bytecode interoperate</text>
  <text x="865" y="380" font-size="10" fill="#CBD5E1">&#x2022; Generic type metadata stored in class file</text>
  <text x="865" y="400" font-size="10" fill="#CBD5E1">  <tspan font-family="'JetBrains Mono', monospace">Signature</tspan> attribute (accessible via reflection)</text>
  <text x="865" y="426" font-size="10" font-weight="700" fill="#34D399">&#x2714; Zero runtime memory footprint inflation</text>

  <!-- Bottom Invariant -->
  <rect x="50" y="480" width="1120" height="45" rx="6" fill="#0B132B" stroke="#3B82F6" stroke-width="1"/>
  <text x="610" y="508" font-size="11" font-weight="600" fill="#93C5FD" text-anchor="middle">Design Compromise: Erasure maintains backward binary compatibility at the cost of reification (cannot do new T[] or instanceof T).</text>

  <!-- Connectors -->
  <path fill="none" d="M 390 200 L 450 200" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr-a)"/>
  <path fill="none" d="M 790 200 L 850 200" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>
</svg>