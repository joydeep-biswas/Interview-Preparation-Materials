<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1180" height="520" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">LinkedList Internal Memory Anatomy: Doubly-Linked Heap Nodes</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Dispersed Heap Allocations, Node Overhead (24B) &amp; Cache Miss Penalty vs. ArrayList</text>

  <!-- Top: Node Chain Container -->
  <rect x="50" y="95" width="1080" height="225" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="50" y="95" width="1080" height="32" rx="8" fill="#0C4A6E" stroke="#0284C7" stroke-width="1"/>
  <text x="590" y="117" font-size="12" font-weight="700" fill="#7DD3FC" text-anchor="middle">Doubly-Linked Node Structure: Head and Tail Pointers</text>

  <!-- Head Pointer Box -->
  <rect x="75" y="160" width="90" height="65" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="120" y="185" font-size="12" font-weight="700" fill="#60A5FA" text-anchor="middle">first</text>
  <text x="120" y="205" font-size="10" fill="#94A3B8" text-anchor="middle">Head Ptr</text>

  <!-- Node 1 -->
  <rect x="220" y="150" width="230" height="85" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="335" y="172" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle">Node 1 (at 0x10a0)</text>
  <rect x="230" y="182" width="65" height="42" rx="3" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="262" y="200" font-size="9" fill="#94A3B8" text-anchor="middle">prev</text>
  <text x="262" y="215" font-size="10" font-family="'JetBrains Mono', monospace" fill="#F87171" text-anchor="middle">null</text>
  <rect x="302" y="182" width="65" height="42" rx="3" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
  <text x="334" y="200" font-size="9" fill="#94A3B8" text-anchor="middle">item</text>
  <text x="334" y="215" font-size="10" font-family="'JetBrains Mono', monospace" fill="#F8FAFC" text-anchor="middle">"A"</text>
  <rect x="374" y="182" width="65" height="42" rx="3" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="406" y="200" font-size="9" fill="#94A3B8" text-anchor="middle">next</text>
  <text x="406" y="215" font-size="10" font-family="'JetBrains Mono', monospace" fill="#38BDF8" text-anchor="middle">0x20b0</text>

  <!-- Node 2 -->
  <rect x="510" y="150" width="230" height="85" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="625" y="172" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle">Node 2 (at 0x20b0)</text>
  <rect x="520" y="182" width="65" height="42" rx="3" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="552" y="200" font-size="9" fill="#94A3B8" text-anchor="middle">prev</text>
  <text x="552" y="215" font-size="10" font-family="'JetBrains Mono', monospace" fill="#38BDF8" text-anchor="middle">0x10a0</text>
  <rect x="592" y="182" width="65" height="42" rx="3" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
  <text x="624" y="200" font-size="9" fill="#94A3B8" text-anchor="middle">item</text>
  <text x="624" y="215" font-size="10" font-family="'JetBrains Mono', monospace" fill="#F8FAFC" text-anchor="middle">"B"</text>
  <rect x="664" y="182" width="65" height="42" rx="3" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="696" y="200" font-size="9" fill="#94A3B8" text-anchor="middle">next</text>
  <text x="696" y="215" font-size="10" font-family="'JetBrains Mono', monospace" fill="#38BDF8" text-anchor="middle">0x30c0</text>

  <!-- Node 3 -->
  <rect x="800" y="150" width="230" height="85" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="915" y="172" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle">Node 3 (at 0x30c0)</text>
  <rect x="810" y="182" width="65" height="42" rx="3" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="842" y="200" font-size="9" fill="#94A3B8" text-anchor="middle">prev</text>
  <text x="842" y="215" font-size="10" font-family="'JetBrains Mono', monospace" fill="#38BDF8" text-anchor="middle">0x20b0</text>
  <rect x="882" y="182" width="65" height="42" rx="3" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
  <text x="914" y="200" font-size="9" fill="#94A3B8" text-anchor="middle">item</text>
  <text x="914" y="215" font-size="10" font-family="'JetBrains Mono', monospace" fill="#F8FAFC" text-anchor="middle">"C"</text>
  <rect x="954" y="182" width="65" height="42" rx="3" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="986" y="200" font-size="9" fill="#94A3B8" text-anchor="middle">next</text>
  <text x="986" y="215" font-size="10" font-family="'JetBrains Mono', monospace" fill="#F87171" text-anchor="middle">null</text>

  <!-- Tail Pointer Box -->
  <rect x="1055" y="160" width="60" height="65" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="1085" y="185" font-size="12" font-weight="700" fill="#60A5FA" text-anchor="middle">last</text>
  <text x="1085" y="205" font-size="10" fill="#94A3B8" text-anchor="middle">Tail</text>

  <!-- Arrows between nodes -->
  <path fill="none" d="M 165 192 L 220 192" stroke="#3B82F6" stroke-width="2" marker-end="url(#arr-b)"/>
  <path fill="none" d="M 450 185 L 510 185" stroke="#10B981" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <path fill="none" d="M 510 205 L 450 205" stroke="#06B6D4" stroke-width="1.5" marker-end="url(#arr-c)"/>
  <path fill="none" d="M 740 185 L 800 185" stroke="#10B981" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <path fill="none" d="M 800 205 L 740 205" stroke="#06B6D4" stroke-width="1.5" marker-end="url(#arr-c)"/>
  <path fill="none" d="M 1030 192 L 1055 192" stroke="#3B82F6" stroke-width="2" marker-end="url(#arr-b)"/>

  <!-- Bottom Left: 24-Byte Memory Penalty Breakdown -->
  <rect x="50" y="340" width="530" height="155" rx="8" fill="#1C1917" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="50" y="340" width="530" height="30" rx="8" fill="#7F1D1D" stroke="#EF4444" stroke-width="1"/>
  <text x="315" y="360" font-size="12" font-weight="700" fill="#FCA5A5" text-anchor="middle">24-Byte Memory Overhead Per Element</text>

  <rect x="70" y="380" width="490" height="100" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="85" y="405" font-size="11" fill="#CBD5E1">&#x2022; <tspan fill="#F87171" font-weight="700">64-bit Object Header:</tspan> 12 Bytes (with +UseCompressedClassPointers)</text>
  <text x="85" y="425" font-size="11" fill="#CBD5E1">&#x2022; <tspan fill="#F87171" font-weight="700">3 Reference Pointers:</tspan> 12 Bytes (prev=4B, next=4B, item=4B)</text>
  <text x="85" y="445" font-size="11" fill="#CBD5E1">&#x2022; <tspan fill="#F87171" font-weight="700">Total per Node:</tspan> 24 Bytes (vs. 4 Bytes in ArrayList elementData!)</text>
  <text x="85" y="465" font-size="10" fill="#94A3B8">1,000,000 integers = ~4MB in ArrayList vs ~24MB in LinkedList!</text>

  <!-- Bottom Right: CPU Cache Locality Penalty -->
  <rect x="600" y="340" width="530" height="155" rx="8" fill="#0B132B" stroke="#1D4ED8" stroke-width="1.5"/>
  <rect x="600" y="340" width="530" height="30" rx="8" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
  <text x="865" y="360" font-size="12" font-weight="700" fill="#93C5FD" text-anchor="middle">CPU Cache Miss Penalty During Traversal</text>

  <rect x="620" y="380" width="490" height="100" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="635" y="405" font-size="11" fill="#CBD5E1">&#x2022; Nodes are scattered across disparate heap addresses</text>
  <text x="635" y="425" font-size="11" fill="#CBD5E1">&#x2022; CPU hardware prefetcher CANNOT predict non-contiguous memory</text>
  <text x="635" y="445" font-size="11" fill="#F87171">&#x2022; Sequential scan triggers repeated L1/L2 cache misses</text>
  <text x="635" y="465" font-size="10" fill="#6EE7B7">&#x2714; Conclusion: Use ArrayDeque for FIFO/LIFO; avoid LinkedList</text>
</svg>