<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="560" viewBox="0 0 1220 560">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1220" height="560" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Java 21 Sequenced Collections Architecture</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Unified First/Last Element Access &amp; Reverse-Order Views across Lists, Deques, and Linked Sets/Maps</text>

  <!-- Left Side: SequencedCollection Hierarchy -->
  <rect x="50" y="95" width="600" height="425" rx="8" fill="#0B132B" stroke="#1D4ED8" stroke-width="1.5"/>
  <rect x="50" y="95" width="600" height="30" rx="8" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
  <text x="350" y="116" font-size="12" font-weight="700" fill="#93C5FD" text-anchor="middle">SequencedCollection&lt;E&gt; Hierarchy (Extends Collection&lt;E&gt;)</text>

  <!-- SequencedCollection Root -->
  <rect x="70" y="140" width="560" height="110" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="350" y="165" font-size="13" font-weight="700" fill="#60A5FA" text-anchor="middle">&lt;&lt;interface&gt;&gt; SequencedCollection&lt;E&gt;</text>
  <text x="85" y="190" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">void addFirst(E), void addLast(E)</text>
  <text x="85" y="210" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">E getFirst(), E getLast(), E removeFirst(), E removeLast()</text>
  <text x="85" y="232" font-size="11" font-weight="700" fill="#34D399">SequencedCollection&lt;E&gt; reversed(); // Live O(1) reversed view!</text>

  <!-- Sub-implementations -->
  <rect x="70" y="265" width="170" height="150" rx="6" fill="#0F172A" stroke="#0284C7" stroke-width="1"/>
  <text x="155" y="290" font-size="11" font-weight="700" fill="#7DD3FC" text-anchor="middle">List&lt;E&gt;</text>
  <text x="85" y="315" font-size="10" fill="#CBD5E1">&#x2022; ArrayList</text>
  <text x="85" y="335" font-size="10" fill="#CBD5E1">&#x2022; LinkedList</text>
  <text x="85" y="355" font-size="9" fill="#94A3B8">get(0) -&gt; getFirst()</text>
  <text x="85" y="375" font-size="9" fill="#94A3B8">get(size-1) -&gt; getLast()</text>
  <text x="85" y="398" font-size="9" fill="#34D399">&#x2714; Now unified API!</text>

  <rect x="260" y="265" width="170" height="150" rx="6" fill="#0F172A" stroke="#8B5CF6" stroke-width="1"/>
  <text x="345" y="290" font-size="11" font-weight="700" fill="#C4B5FD" text-anchor="middle">Deque&lt;E&gt;</text>
  <text x="275" y="315" font-size="10" fill="#CBD5E1">&#x2022; ArrayDeque</text>
  <text x="275" y="335" font-size="10" fill="#CBD5E1">&#x2022; ConcurrentLinkedDeque</text>
  <text x="275" y="355" font-size="9" fill="#94A3B8">Double-ended queue</text>
  <text x="275" y="375" font-size="9" fill="#94A3B8">Seamless adapter</text>
  <text x="275" y="398" font-size="9" fill="#A78BFA">&#x2714; Implements directly</text>

  <rect x="450" y="265" width="180" height="150" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="540" y="290" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">SequencedSet&lt;E&gt;</text>
  <text x="465" y="315" font-size="10" fill="#CBD5E1">&#x2022; LinkedHashSet</text>
  <text x="465" y="335" font-size="10" fill="#CBD5E1">&#x2022; TreeSet (NavigableSet)</text>
  <text x="465" y="355" font-size="9" fill="#94A3B8">First time in Java history:</text>
  <text x="465" y="375" font-size="9" fill="#CBD5E1">set.getFirst(), getLast()</text>
  <text x="465" y="398" font-size="9" fill="#34D399">&#x2714; Unique + Sequenced!</text>

  <!-- Connectors Left -->
  <path fill="none" d="M 230 250 L 155 265" stroke="#0284C7" stroke-width="1.5"/>
  <path fill="none" d="M 350 250 L 345 265" stroke="#8B5CF6" stroke-width="1.5"/>
  <path fill="none" d="M 470 250 L 540 265" stroke="#10B981" stroke-width="1.5"/>

  <!-- Right Side: SequencedMap Hierarchy -->
  <rect x="680" y="95" width="490" height="425" rx="8" fill="#1C1917" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="680" y="95" width="490" height="30" rx="8" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
  <text x="925" y="116" font-size="12" font-weight="700" fill="#FDE68A" text-anchor="middle">SequencedMap&lt;K, V&gt; Hierarchy (Extends Map&lt;K, V&gt;)</text>

  <!-- SequencedMap Root -->
  <rect x="700" y="140" width="450" height="110" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="925" y="165" font-size="13" font-weight="700" fill="#FBBF24" text-anchor="middle">&lt;&lt;interface&gt;&gt; SequencedMap&lt;K, V&gt;</text>
  <text x="715" y="190" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">Entry&lt;K,V&gt; firstEntry(), lastEntry()</text>
  <text x="715" y="210" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">Entry&lt;K,V&gt; pollFirstEntry(), pollLastEntry()</text>
  <text x="715" y="232" font-size="11" font-weight="700" fill="#FBBF24">SequencedMap&lt;K, V&gt; reversed();</text>

  <!-- Implementations -->
  <rect x="700" y="265" width="215" height="150" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
  <text x="807" y="290" font-size="11" font-weight="700" fill="#FDE68A" text-anchor="middle">LinkedHashMap&lt;K,V&gt;</text>
  <text x="715" y="315" font-size="10" fill="#CBD5E1">&#x2022; Insertion order</text>
  <text x="715" y="335" font-size="10" fill="#CBD5E1">&#x2022; Access order (LRU)</text>
  <text x="715" y="360" font-size="9" font-family="'JetBrains Mono', monospace" fill="#FBBF24">map.putFirst(k, v);</text>
  <text x="715" y="380" font-size="9" font-family="'JetBrains Mono', monospace" fill="#FBBF24">map.putLast(k, v);</text>
  <text x="715" y="400" font-size="9" fill="#34D399">&#x2714; High-efficiency LRU!</text>

  <rect x="935" y="265" width="215" height="150" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="1042" y="290" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">TreeMap&lt;K,V&gt;</text>
  <text x="950" y="315" font-size="10" fill="#CBD5E1">&#x2022; NavigableMap</text>
  <text x="950" y="335" font-size="10" fill="#CBD5E1">&#x2022; Red-Black tree sorted</text>
  <text x="950" y="360" font-size="9" font-family="'JetBrains Mono', monospace" fill="#6EE7B7">map.sequencedKeySet()</text>
  <text x="950" y="380" font-size="9" font-family="'JetBrains Mono', monospace" fill="#6EE7B7">map.sequencedValues()</text>
  <text x="950" y="400" font-size="9" fill="#34D399">&#x2714; Bidirectional sorting</text>

  <!-- Connectors Right -->
  <path fill="none" d="M 860 250 L 807 265" stroke="#F59E0B" stroke-width="1.5"/>
  <path fill="none" d="M 990 250 L 1042 265" stroke="#10B981" stroke-width="1.5"/>

  <!-- Bottom Invariant -->
  <rect x="50" y="490" width="1120" height="45" rx="6" fill="#0B132B" stroke="#3B82F6" stroke-width="1"/>
  <text x="610" y="518" font-size="11" font-weight="600" fill="#93C5FD" text-anchor="middle">Java 21 JEP 431: Solves 25 years of collection fragmentation with unified well-defined encounter order and O(1) reversed views.</text>
</svg>