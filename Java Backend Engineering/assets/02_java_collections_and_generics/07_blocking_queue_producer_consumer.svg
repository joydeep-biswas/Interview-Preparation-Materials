<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1180" height="520" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">BlockingQueue Producer-Consumer Concurrency Architecture</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Dual ReentrantLock Conditions: notEmpty (Consumers wait) &amp; notFull (Producers wait)</text>

  <!-- Left: Producer Threads -->
  <rect x="50" y="95" width="310" height="400" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="50" y="95" width="310" height="32" rx="8" fill="#0C4A6E"/>
  <text x="205" y="117" font-size="12" font-weight="700" fill="#7DD3FC" text-anchor="middle">Producer Threads: put(item)</text>

  <rect x="70" y="145" width="270" height="80" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="85" y="170" font-size="12" font-weight="700" fill="#60A5FA">Producer Thread 1 &amp; 2</text>
  <text x="85" y="192" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">queue.put(task);</text>
  <text x="85" y="210" font-size="9" fill="#94A3B8">Blocks if buffer reaches capacity</text>

  <rect x="70" y="240" width="270" height="235" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="85" y="265" font-size="11" font-weight="700" fill="#F8FAFC">put() Internal Execution:</text>
  <text x="85" y="290" font-size="10" font-family="'JetBrains Mono', monospace" fill="#7DD3FC">lock.lockInterruptibly();</text>
  <text x="85" y="308" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">try {</text>
  <text x="95" y="326" font-size="10" font-family="'JetBrains Mono', monospace" fill="#FBBF24">  while (count == items.length)</text>
  <text x="105" y="344" font-size="10" font-family="'JetBrains Mono', monospace" fill="#F87171">    notFull.await(); // BLOCKS</text>
  <text x="95" y="365" font-size="10" font-family="'JetBrains Mono', monospace" fill="#34D399">  enqueue(item);</text>
  <text x="95" y="385" font-size="10" font-family="'JetBrains Mono', monospace" fill="#38BDF8">  notEmpty.signal(); // WAKES</text>
  <text x="85" y="405" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">} finally {</text>
  <text x="95" y="423" font-size="10" font-family="'JetBrains Mono', monospace" fill="#7DD3FC">  lock.unlock();</text>
  <text x="85" y="441" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">}</text>
  <text x="85" y="462" font-size="9" fill="#94A3B8">Guards against spurious wakeups with while loop</text>

  <!-- Center: ArrayBlockingQueue Bounded Buffer -->
  <rect x="390" y="95" width="400" height="400" rx="8" fill="#1C1917" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="390" y="95" width="400" height="32" rx="8" fill="#78350F"/>
  <text x="590" y="117" font-size="12" font-weight="700" fill="#FDE68A" text-anchor="middle">ArrayBlockingQueue (Capacity: N)</text>

  <!-- Circular Buffer Cells -->
  <rect x="410" y="145" width="360" height="80" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
  <text x="425" y="168" font-size="11" font-weight="700" fill="#FBBF24">Circular Array Buffer: Object[] items</text>
  
  <rect x="425" y="180" width="55" height="35" rx="3" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
  <text x="452" y="202" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">T1</text>
  <rect x="485" y="180" width="55" height="35" rx="3" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
  <text x="512" y="202" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">T2</text>
  <rect x="545" y="180" width="55" height="35" rx="3" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
  <text x="572" y="202" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">T3</text>
  <rect x="605" y="180" width="55" height="35" rx="3" fill="#0F172A" stroke="#475569" stroke-dasharray="2 2"/>
  <text x="632" y="202" font-size="10" fill="#64748B" text-anchor="middle">null</text>
  <rect x="665" y="180" width="55" height="35" rx="3" fill="#0F172A" stroke="#475569" stroke-dasharray="2 2"/>
  <text x="692" y="202" font-size="10" fill="#64748B" text-anchor="middle">null</text>

  <!-- Synchronization Core -->
  <rect x="410" y="240" width="360" height="235" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="425" y="265" font-size="11" font-weight="700" fill="#F8FAFC">Concurrency Controls:</text>
  <text x="425" y="290" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">final ReentrantLock lock;</text>
  <text x="425" y="315" font-size="10" font-family="'JetBrains Mono', monospace" fill="#F87171">Condition notFull;</text>
  <text x="425" y="333" font-size="9" fill="#94A3B8">Signaled by consumers when item taken</text>
  <text x="425" y="360" font-size="10" font-family="'JetBrains Mono', monospace" fill="#34D399">Condition notEmpty;</text>
  <text x="425" y="378" font-size="9" fill="#94A3B8">Signaled by producers when item added</text>

  <rect x="425" y="400" width="330" height="60" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
  <text x="435" y="420" font-size="10" font-weight="700" fill="#FBBF24">Backpressure Invariant:</text>
  <text x="435" y="438" font-size="9" fill="#CBD5E1">Bounded queue prevents fast producers from causing OOM.</text>
  <text x="435" y="452" font-size="9" fill="#CBD5E1">Producers naturally throttle to consumer throughput.</text>

  <!-- Right: Consumer Threads -->
  <rect x="820" y="95" width="310" height="400" rx="8" fill="#06201B" stroke="#047857" stroke-width="1.5"/>
  <rect x="820" y="95" width="310" height="32" rx="8" fill="#064E3B"/>
  <text x="975" y="117" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">Consumer Threads: take()</text>

  <rect x="840" y="145" width="270" height="80" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="855" y="170" font-size="12" font-weight="700" fill="#34D399">Consumer Thread 1 &amp; 2</text>
  <text x="855" y="192" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">Task task = queue.take();</text>
  <text x="855" y="210" font-size="9" fill="#94A3B8">Blocks if buffer is currently empty</text>

  <rect x="840" y="240" width="270" height="235" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="855" y="265" font-size="11" font-weight="700" fill="#F8FAFC">take() Internal Execution:</text>
  <text x="855" y="290" font-size="10" font-family="'JetBrains Mono', monospace" fill="#7DD3FC">lock.lockInterruptibly();</text>
  <text x="855" y="308" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">try {</text>
  <text x="865" y="326" font-size="10" font-family="'JetBrains Mono', monospace" fill="#FBBF24">  while (count == 0)</text>
  <text x="875" y="344" font-size="10" font-family="'JetBrains Mono', monospace" fill="#F87171">    notEmpty.await(); // BLOCKS</text>
  <text x="865" y="365" font-size="10" font-family="'JetBrains Mono', monospace" fill="#34D399">  item = dequeue();</text>
  <text x="865" y="385" font-size="10" font-family="'JetBrains Mono', monospace" fill="#38BDF8">  notFull.signal(); // WAKES</text>
  <text x="855" y="405" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">} finally {</text>
  <text x="865" y="423" font-size="10" font-family="'JetBrains Mono', monospace" fill="#7DD3FC">  lock.unlock();</text>
  <text x="855" y="441" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">}</text>
  <text x="855" y="462" font-size="9" fill="#94A3B8">Thread wakes up and returns dequeued item</text>

  <!-- Producer to Queue -->
  <path fill="none" d="M 360 185 L 410 185" stroke="#3B82F6" stroke-width="2" marker-end="url(#arr-b)"/>

  <!-- Queue to Consumer -->
  <path fill="none" d="M 770 185 L 840 185" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>
</svg>