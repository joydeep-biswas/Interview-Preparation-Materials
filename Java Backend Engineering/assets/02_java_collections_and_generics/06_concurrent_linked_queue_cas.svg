<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1200" height="540" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">ConcurrentLinkedQueue Lock-Free CAS Enqueue Algorithm</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Michael-Scott Non-Blocking Queue Protocol: Atomic CAS on Tail and Next Pointers</text>

  <!-- Top: Queue Boundary State -->
  <rect x="50" y="95" width="1100" height="120" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="50" y="95" width="1100" height="30" rx="8" fill="#0C4A6E"/>
  <text x="600" y="116" font-size="12" font-weight="700" fill="#7DD3FC" text-anchor="middle">Queue Memory State: Sentinel Node Chain with Head &amp; Tail Pointers</text>

  <!-- Head Pointer -->
  <rect x="80" y="140" width="80" height="55" rx="4" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="120" y="165" font-size="12" font-weight="700" fill="#60A5FA" text-anchor="middle">head</text>
  <text x="120" y="182" font-size="10" fill="#94A3B8" text-anchor="middle">0x1000</text>

  <!-- Sentinel Node -->
  <rect x="200" y="140" width="160" height="55" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="280" y="162" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="middle">Dummy Sentinel</text>
  <text x="280" y="180" font-size="10" fill="#64748B" text-anchor="middle">item: null | next: 0x2000</text>

  <!-- Node 1 -->
  <rect x="420" y="140" width="160" height="55" rx="4" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="500" y="162" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">Node 1 (0x2000)</text>
  <text x="500" y="180" font-size="10" fill="#CBD5E1" text-anchor="middle">item: "A" | next: 0x3000</text>

  <!-- Tail Node -->
  <rect x="640" y="140" width="180" height="55" rx="4" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="730" y="162" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="middle">Current Tail (0x3000)</text>
  <text x="730" y="180" font-size="10" fill="#CBD5E1" text-anchor="middle">item: "B" | next: null</text>

  <!-- Tail Pointer -->
  <rect x="880" y="140" width="80" height="55" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="920" y="165" font-size="12" font-weight="700" fill="#FBBF24" text-anchor="middle">tail</text>
  <text x="920" y="182" font-size="10" fill="#CBD5E1" text-anchor="middle">0x3000</text>

  <!-- New Node to Enqueue -->
  <rect x="1000" y="140" width="130" height="55" rx="4" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="1065" y="162" font-size="11" font-weight="700" fill="#C4B5FD" text-anchor="middle">New Node (0x4000)</text>
  <text x="1065" y="180" font-size="10" fill="#A78BFA" text-anchor="middle">item: "C" | next: null</text>

  <!-- Top Arrows -->
  <path fill="none" d="M 160 167 L 200 167" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arr-b)"/>
  <path fill="none" d="M 360 167 L 420 167" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-s)"/>
  <path fill="none" d="M 580 167 L 640 167" stroke="#10B981" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <path fill="none" d="M 880 167 L 820 167" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arr-a)"/>

  <!-- Step 1: Read Tail &amp; Verify Next -->
  <rect x="50" y="235" width="340" height="225" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="50" y="235" width="340" height="30" rx="8" fill="#0C4A6E"/>
  <text x="220" y="255" font-size="12" font-weight="700" fill="#7DD3FC" text-anchor="middle">1. Read Tail &amp; Verify next == null</text>

  <rect x="70" y="275" width="300" height="170" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="85" y="300" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">Node&lt;E&gt; t = tail;</text>
  <text x="85" y="318" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">Node&lt;E&gt; next = t.next;</text>
  <text x="85" y="342" font-size="11" font-weight="700" fill="#FBBF24">Lagging Tail Check:</text>
  <text x="85" y="362" font-size="10" fill="#94A3B8">If <tspan font-family="'JetBrains Mono', monospace" fill="#CBD5E1">next != null</tspan>:</text>
  <text x="85" y="380" font-size="10" fill="#CBD5E1">Another thread appended but hasn't updated tail yet.</text>
  <text x="85" y="405" font-size="10" fill="#38BDF8">Cooperative Concurrency:</text>
  <text x="85" y="423" font-size="9" fill="#94A3B8">This thread helps advance tail: CAS(tail, t, next)</text>

  <!-- Step 2: CAS Link New Node -->
  <rect x="420" y="235" width="350" height="225" rx="8" fill="#06201B" stroke="#047857" stroke-width="1.5"/>
  <rect x="420" y="235" width="350" height="30" rx="8" fill="#064E3B"/>
  <text x="595" y="255" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">2. CAS Link: t.casNext(null, newNode)</text>

  <rect x="440" y="275" width="310" height="170" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="455" y="300" font-size="10" font-family="'JetBrains Mono', monospace" fill="#34D399">if (t.casNext(null, newNode)) {</text>
  <text x="455" y="318" font-size="10" font-family="'JetBrains Mono', monospace" fill="#34D399">  // Enqueue Succeeded!</text>
  <text x="455" y="336" font-size="10" font-family="'JetBrains Mono', monospace" fill="#34D399">  casTail(t, newNode);</text>
  <text x="455" y="354" font-size="10" font-family="'JetBrains Mono', monospace" fill="#34D399">  return true;</text>
  <text x="455" y="372" font-size="10" font-family="'JetBrains Mono', monospace" fill="#34D399">}</text>
  <text x="455" y="398" font-size="10" fill="#F87171">If CAS fails:</text>
  <text x="455" y="416" font-size="10" fill="#CBD5E1">Another thread linked a node first.</text>
  <text x="455" y="432" font-size="9" fill="#94A3B8">Retry loop continues without blocking.</text>

  <!-- Step 3: CAS Advance Tail -->
  <rect x="800" y="235" width="350" height="225" rx="8" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.5"/>
  <rect x="800" y="235" width="350" height="30" rx="8" fill="#4C1D95"/>
  <text x="975" y="255" font-size="12" font-weight="700" fill="#C4B5FD" text-anchor="middle">3. CAS Advance Tail: casTail(t, newNode)</text>

  <rect x="820" y="275" width="310" height="170" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="835" y="300" font-size="10" font-family="'JetBrains Mono', monospace" fill="#C4B5FD">casTail(t, newNode);</text>
  <text x="835" y="325" font-size="11" font-weight="700" fill="#A78BFA">Benign Failure Tolerant:</text>
  <text x="835" y="348" font-size="10" fill="#CBD5E1">&#x2022; If this CAS fails, it is completely OK!</text>
  <text x="835" y="364" font-size="9.5" fill="#CBD5E1">&#x2022; Next thread notices <tspan font-family="'JetBrains Mono', monospace">tail.next != null</tspan></text>
  <text x="835" y="378" font-size="9.5" fill="#CBD5E1">  and advances tail via CAS.</text>
  <text x="835" y="398" font-size="10" fill="#6EE7B7">&#x2714; Guaranteed Lock-Free (Non-Blocking)</text>
  <text x="835" y="416" font-size="9" fill="#94A3B8">At least one thread succeeds in finite steps</text>

  <!-- Bottom Invariant Banner -->
  <rect x="50" y="475" width="1100" height="50" rx="6" fill="#0B132B" stroke="#3B82F6" stroke-width="1"/>
  <text x="600" y="505" font-size="11" font-weight="600" fill="#93C5FD" text-anchor="middle">Michael &amp; Scott Non-Blocking Queue: Lock-free atomic hardware CAS replaces mutual exclusion locks entirely.</text>
</svg>