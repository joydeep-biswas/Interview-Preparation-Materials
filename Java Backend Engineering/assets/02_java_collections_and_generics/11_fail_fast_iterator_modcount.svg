<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="500" viewBox="0 0 1180 500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1180" height="500" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Java Fail-Fast Iteration &amp; modCount Detection Mechanics</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">ConcurrentModificationException Triggered When expectedModCount != modCount</text>

  <!-- Stage 1: Iterator Initialization -->
  <rect x="50" y="95" width="340" height="325" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="50" y="95" width="340" height="30" rx="8" fill="#0C4A6E"/>
  <text x="220" y="116" font-size="12" font-weight="700" fill="#7DD3FC" text-anchor="middle">1. Iterator Initialization</text>

  <rect x="70" y="140" width="300" height="110" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="85" y="165" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">Iterator&lt;E&gt; it = list.iterator();</text>
  <text x="85" y="195" font-size="11" font-weight="700" fill="#38BDF8">Captured Iterator State:</text>
  <text x="85" y="215" font-size="10" font-family="'JetBrains Mono', monospace" fill="#34D399">expectedModCount = list.modCount;</text>
  <text x="85" y="235" font-size="10" fill="#94A3B8">(Initial value: e.g. expectedModCount = 5)</text>

  <rect x="70" y="265" width="300" height="135" rx="6" fill="#1E293B" stroke="#0284C7" stroke-width="1"/>
  <text x="85" y="290" font-size="11" font-weight="700" fill="#7DD3FC">Snapshot Integrity Contract:</text>
  <text x="85" y="312" font-size="10" fill="#CBD5E1">The iterator assumes the collection will not</text>
  <text x="85" y="330" font-size="10" fill="#CBD5E1">undergo structural modification (add/remove)</text>
  <text x="85" y="348" font-size="10" fill="#CBD5E1">during iteration traversal.</text>
  <text x="85" y="375" font-size="9" fill="#94A3B8">Guarantees deterministic pointer movement</text>

  <!-- Stage 2: Structural Modification Violation -->
  <rect x="420" y="95" width="340" height="325" rx="8" fill="#1C1917" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="420" y="95" width="340" height="30" rx="8" fill="#78350F"/>
  <text x="590" y="116" font-size="12" font-weight="700" fill="#FDE68A" text-anchor="middle">2. Direct Collection Modification</text>

  <rect x="440" y="140" width="300" height="110" rx="6" fill="#0F172A" stroke="#EF4444" stroke-width="1.5"/>
  <text x="455" y="165" font-size="11" font-weight="700" fill="#F87171">Direct Structural Mutation:</text>
  <text x="455" y="188" font-size="10" font-family="'JetBrains Mono', monospace" fill="#FCA5A5">list.add("Concurrent Element");</text>
  <text x="455" y="210" font-size="11" font-weight="700" fill="#FBBF24">modCount Incremented:</text>
  <text x="455" y="230" font-size="10" font-family="'JetBrains Mono', monospace" fill="#FBBF24">list.modCount++; // now equals 6!</text>

  <rect x="440" y="265" width="300" height="135" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="455" y="290" font-size="11" font-weight="700" fill="#F8FAFC">The Desynchronization:</text>
  <text x="455" y="315" font-size="10" fill="#F87171">&#x2022; list.modCount = 6</text>
  <text x="455" y="335" font-size="10" fill="#38BDF8">&#x2022; it.expectedModCount = 5</text>
  <text x="455" y="360" font-size="10" fill="#CBD5E1">The iterator's expected count is now STALE!</text>
  <text x="455" y="380" font-size="9" fill="#94A3B8">Internal array has shifted; pointers invalid</text>

  <!-- Stage 3: Fail-Fast Exception -->
  <rect x="790" y="95" width="340" height="325" rx="8" fill="#1C1917" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="790" y="95" width="340" height="30" rx="8" fill="#7F1D1D"/>
  <text x="960" y="116" font-size="12" font-weight="700" fill="#FCA5A5" text-anchor="middle">3. Fail-Fast Check &amp; Exception</text>

  <rect x="810" y="140" width="300" height="110" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="825" y="165" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">it.next(); // or it.hasNext()</text>
  <text x="825" y="195" font-size="11" font-weight="700" fill="#F87171">Internal Validation:</text>
  <text x="825" y="215" font-size="10" font-family="'JetBrains Mono', monospace" fill="#FCA5A5">if (modCount != expectedModCount)</text>
  <text x="825" y="235" font-size="10" font-family="'JetBrains Mono', monospace" fill="#EF4444">  throw new ConcurrentModException();</text>

  <rect x="810" y="265" width="300" height="135" rx="6" fill="#1E293B" stroke="#EF4444" stroke-width="1"/>
  <text x="825" y="290" font-size="11" font-weight="700" fill="#F87171">Fail-Fast Architecture Goal:</text>
  <text x="825" y="315" font-size="10" fill="#CBD5E1">Fails immediately and cleanly upon</text>
  <text x="825" y="333" font-size="10" fill="#CBD5E1">detecting mutation, rather than risking</text>
  <text x="825" y="351" font-size="10" fill="#CBD5E1">silent, non-deterministic corruption</text>
  <text x="825" y="369" font-size="10" fill="#CBD5E1">at an unpredictable future time.</text>

  <!-- Bottom Invariant &amp; Safe Alternatives -->
  <rect x="50" y="435" width="1080" height="50" rx="6" fill="#06201B" stroke="#10B981" stroke-width="1"/>
  <text x="590" y="458" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">Safe Mutation Pattern: Use it.remove() instead of list.remove()</text>
  <text x="590" y="474" font-size="10" fill="#CBD5E1" text-anchor="middle">Iterator.remove() updates expectedModCount = modCount atomically, avoiding exceptions.</text>

  <!-- Connectors -->
  <path fill="none" d="M 390 195 L 440 195" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr-a)"/>
  <path fill="none" d="M 760 195 L 810 195" stroke="#EF4444" stroke-width="2" marker-end="url(#arr-r)"/>
</svg>