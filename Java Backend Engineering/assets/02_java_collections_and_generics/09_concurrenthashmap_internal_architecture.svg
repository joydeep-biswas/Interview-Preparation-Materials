<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="560" viewBox="0 0 1220 560">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1220" height="560" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">ConcurrentHashMap Internal Architecture (Java 8+)</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Lock-Free CAS Bucket Insertion + Fine-Grained synchronized Head Node Locking</text>

  <!-- Top: volatile Node<K,V>[] table -->
  <rect x="50" y="95" width="1120" height="65" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <text x="610" y="125" font-size="13" font-weight="700" fill="#7DD3FC" text-anchor="middle">transient volatile Node&lt;K,V&gt;[] table (Power-of-Two Capacity: 16)</text>
  <text x="610" y="145" font-size="10" fill="#94A3B8" text-anchor="middle">Hash Spreading: (h ^ (h &gt;&gt;&gt; 16)) &amp; (table.length - 1)</text>

  <!-- Column 1: Bucket 0 (Lock-Free CAS) -->
  <rect x="50" y="180" width="265" height="300" rx="8" fill="#06201B" stroke="#047857" stroke-width="1.5"/>
  <rect x="50" y="180" width="265" height="30" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="182" y="200" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">Bucket 0: Empty Slot (Lock-Free)</text>

  <rect x="65" y="225" width="235" height="70" rx="4" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="182" y="248" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">CAS Node Insertion</text>
  <text x="80" y="270" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">casTabAt(tab, i, null, node)</text>
  <text x="80" y="285" font-size="9" fill="#94A3B8">Evaluates atomically in hardware</text>

  <rect x="65" y="305" width="235" height="160" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="80" y="330" font-size="11" font-weight="700" fill="#F8FAFC">Characteristics:</text>
  <text x="80" y="352" font-size="10" fill="#CBD5E1">&#x2022; 100% Lock-Free execution</text>
  <text x="80" y="372" font-size="10" fill="#CBD5E1">&#x2022; Zero mutex or monitor lock</text>
  <text x="80" y="392" font-size="10" fill="#CBD5E1">&#x2022; Fast path for new keys</text>
  <text x="80" y="415" font-size="9" fill="#34D399">If CAS fails (collision race):</text>
  <text x="80" y="432" font-size="9" fill="#94A3B8">Retries loop and enters Column 2!</text>

  <!-- Column 2: Bucket 1 (Collision Head Lock) -->
  <rect x="335" y="180" width="265" height="300" rx="8" fill="#1C1917" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="335" y="180" width="265" height="30" rx="8" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
  <text x="467" y="200" font-size="11" font-weight="700" fill="#FDE68A" text-anchor="middle">Bucket 1: Collision Bin Lock</text>

  <rect x="350" y="225" width="235" height="70" rx="4" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="467" y="248" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="middle">synchronized(headNode)</text>
  <text x="365" y="270" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">synchronized(first) { ... }</text>
  <text x="365" y="285" font-size="9" fill="#94A3B8">Locks ONLY this individual bin!</text>

  <rect x="350" y="305" width="235" height="160" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="365" y="330" font-size="11" font-weight="700" fill="#F8FAFC">Fine-Grained Locking:</text>
  <text x="365" y="352" font-size="10" fill="#CBD5E1">&#x2022; Other buckets remain unlocked</text>
  <text x="365" y="372" font-size="10" fill="#CBD5E1">&#x2022; Appends to linked list chain</text>
  <text x="365" y="392" font-size="10" fill="#CBD5E1">&#x2022; Checks bin count for treeify</text>
  <text x="365" y="418" font-size="9" fill="#FDE68A">&#x2714; High write concurrency:</text>
  <text x="365" y="435" font-size="9" fill="#94A3B8">16 threads can write simultaneously</text>

  <!-- Column 3: Bucket 2 (TreeBin Root) -->
  <rect x="620" y="180" width="265" height="300" rx="8" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.5"/>
  <rect x="620" y="180" width="265" height="30" rx="8" fill="#4C1D95" stroke="#8B5CF6" stroke-width="1"/>
  <text x="752" y="200" font-size="11" font-weight="700" fill="#C4B5FD" text-anchor="middle">Bucket 2: TreeBin (Red-Black)</text>

  <rect x="635" y="225" width="235" height="70" rx="4" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="752" y="248" font-size="11" font-weight="700" fill="#A78BFA" text-anchor="middle">TreeBin (hash = -2)</text>
  <text x="650" y="270" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">TreeNode&lt;K,V&gt; root</text>
  <text x="650" y="285" font-size="9" fill="#94A3B8">Balanced Red-Black Tree</text>

  <rect x="635" y="305" width="235" height="160" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="650" y="330" font-size="11" font-weight="700" fill="#F8FAFC">Worst-Case Bounds:</text>
  <text x="650" y="352" font-size="10" fill="#CBD5E1">&#x2022; Search: <tspan fill="#A78BFA" font-weight="700">O(log N)</tspan> guaranteed</text>
  <text x="650" y="372" font-size="10" fill="#CBD5E1">&#x2022; Readers read lock-free via root</text>
  <text x="650" y="392" font-size="10" fill="#CBD5E1">&#x2022; Writers take TreeBin lock</text>
  <text x="650" y="418" font-size="9" fill="#C4B5FD">&#x2714; Hash-DoS Protection:</text>
  <text x="650" y="435" font-size="9" fill="#94A3B8">Prevents O(N) degradation attacks</text>

  <!-- Column 4: Bucket 3 (ForwardingNode) -->
  <rect x="905" y="180" width="265" height="300" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="905" y="180" width="265" height="30" rx="8" fill="#0C4A6E" stroke="#0284C7" stroke-width="1"/>
  <text x="1037" y="200" font-size="11" font-weight="700" fill="#7DD3FC" text-anchor="middle">Bucket 3: Resizing (MOVED)</text>

  <rect x="920" y="225" width="235" height="70" rx="4" fill="#0F172A" stroke="#0284C7" stroke-width="1.5"/>
  <text x="1037" y="248" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">ForwardingNode (hash = -1)</text>
  <text x="935" y="270" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">nextTable points to new array</text>
  <text x="935" y="285" font-size="9" fill="#94A3B8">Indicates active table resize</text>

  <rect x="920" y="305" width="235" height="160" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="935" y="330" font-size="11" font-weight="700" fill="#F8FAFC">Multi-Threaded Transfer:</text>
  <text x="935" y="352" font-size="10" fill="#CBD5E1">&#x2022; Calling threads help transfer</text>
  <text x="935" y="372" font-size="10" fill="#CBD5E1">&#x2022; <tspan font-family="'JetBrains Mono', monospace">helpTransfer()</tspan> accelerates copy</text>
  <text x="935" y="392" font-size="10" fill="#CBD5E1">&#x2022; Readers forwarded to nextTable</text>
  <text x="935" y="418" font-size="9" fill="#38BDF8">&#x2714; Zero Stop-The-World:</text>
  <text x="935" y="435" font-size="9" fill="#94A3B8">Reads and writes continue during resize</text>

  <!-- Bottom Invariant -->
  <rect x="50" y="495" width="1120" height="50" rx="6" fill="#0B132B" stroke="#3B82F6" stroke-width="1"/>
  <text x="610" y="525" font-size="11" font-weight="600" fill="#93C5FD" text-anchor="middle">Key Architectural Rule: get() operations are 100% lock-free via volatile field reads. No global locks ever exist.</text>
</svg>