<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1200" height="580" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Java Collections Framework &amp; Map Architecture</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Iterable Root -&gt; Collection Hierarchy (List, Set, Queue, Deque) &amp; Independent Map Hierarchy</text>

  <!-- Left Side: Collection Hierarchy (Iterable Root) -->
  <rect x="40" y="95" width="760" height="460" rx="8" fill="#0B132B" stroke="#1D4ED8" stroke-width="1.5"/>
  <rect x="40" y="95" width="760" height="32" rx="8" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
  <text x="420" y="117" font-size="12" font-weight="700" fill="#93C5FD" text-anchor="middle">Collection Hierarchy (java.util) - Extends java.lang.Iterable</text>

  <!-- Root: Iterable<T> -->
  <rect x="290" y="140" width="260" height="50" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="420" y="162" font-size="12" font-weight="700" fill="#60A5FA" text-anchor="middle">&lt;&lt;interface&gt;&gt; Iterable&lt;T&gt;</text>
  <text x="420" y="180" font-size="10" fill="#94A3B8" text-anchor="middle">iterator(), forEach(), spliterator()</text>

  <!-- Collection<E> -->
  <rect x="290" y="220" width="260" height="50" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="420" y="242" font-size="12" font-weight="700" fill="#60A5FA" text-anchor="middle">&lt;&lt;interface&gt;&gt; Collection&lt;E&gt;</text>
  <text x="420" y="260" font-size="10" fill="#94A3B8" text-anchor="middle">add(), remove(), size(), contains(), stream()</text>

  <!-- Sub-Branch 1: List<E> -->
  <rect x="60" y="300" width="210" height="235" rx="6" fill="#0F172A" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="60" y="300" width="210" height="28" rx="6" fill="#0C4A6E" stroke="#0284C7" stroke-width="1"/>
  <text x="165" y="319" font-size="11" font-weight="700" fill="#7DD3FC" text-anchor="middle">&lt;&lt;interface&gt;&gt; List&lt;E&gt;</text>
  <text x="75" y="348" font-size="10" fill="#94A3B8">Indexed &amp; Ordered sequence</text>
  <text x="75" y="365" font-size="10" fill="#94A3B8">Allows duplicates</text>
  <rect x="70" y="380" width="190" height="140" rx="4" fill="#1E293B" stroke="#0284C7" stroke-width="1"/>
  <text x="80" y="402" font-size="11" font-weight="700" fill="#38BDF8">ArrayList</text>
  <text x="80" y="418" font-size="9" fill="#94A3B8">Contiguous array, O(1) index</text>
  <text x="80" y="442" font-size="11" font-weight="700" fill="#38BDF8">LinkedList</text>
  <text x="80" y="458" font-size="9" fill="#94A3B8">Doubly-linked nodes</text>
  <text x="80" y="482" font-size="11" font-weight="700" fill="#38BDF8">CopyOnWriteArrayList</text>
  <text x="80" y="498" font-size="9" fill="#94A3B8">Thread-safe snapshot reads</text>

  <!-- Sub-Branch 2: Set<E> -->
  <rect x="290" y="300" width="220" height="235" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <rect x="290" y="300" width="220" height="28" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="400" y="319" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">&lt;&lt;interface&gt;&gt; Set&lt;E&gt;</text>
  <text x="305" y="348" font-size="10" fill="#94A3B8">Unique elements (no dups)</text>
  <text x="305" y="365" font-size="10" fill="#94A3B8">Backed by Map keys</text>
  <rect x="300" y="380" width="200" height="140" rx="4" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
  <text x="310" y="402" font-size="11" font-weight="700" fill="#34D399">HashSet</text>
  <text x="310" y="418" font-size="9" fill="#94A3B8">O(1) hash table lookup</text>
  <text x="310" y="442" font-size="11" font-weight="700" fill="#34D399">LinkedHashSet</text>
  <text x="310" y="458" font-size="9" fill="#94A3B8">Preserves insertion order</text>
  <text x="310" y="482" font-size="11" font-weight="700" fill="#34D399">TreeSet (NavigableSet)</text>
  <text x="310" y="498" font-size="9" fill="#94A3B8">Sorted Red-Black tree O(log N)</text>

  <!-- Sub-Branch 3: Queue &amp; Deque -->
  <rect x="530" y="300" width="250" height="235" rx="6" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.5"/>
  <rect x="530" y="300" width="250" height="28" rx="6" fill="#4C1D95" stroke="#8B5CF6" stroke-width="1"/>
  <text x="655" y="319" font-size="11" font-weight="700" fill="#C4B5FD" text-anchor="middle">&lt;&lt;interface&gt;&gt; Queue&lt;E&gt; &amp; Deque&lt;E&gt;</text>
  <text x="545" y="348" font-size="10" fill="#94A3B8">FIFO queues &amp; double-ended stacks</text>
  <text x="545" y="365" font-size="10" fill="#94A3B8">offer(), poll(), peek()</text>
  <rect x="540" y="380" width="230" height="140" rx="4" fill="#1E293B" stroke="#8B5CF6" stroke-width="1"/>
  <text x="550" y="402" font-size="11" font-weight="700" fill="#A78BFA">ArrayDeque</text>
  <text x="550" y="418" font-size="9" fill="#94A3B8">Circular buffer; beats Stack/Queue</text>
  <text x="550" y="442" font-size="11" font-weight="700" fill="#A78BFA">PriorityQueue</text>
  <text x="550" y="458" font-size="9" fill="#94A3B8">Binary min-heap ordered</text>
  <text x="550" y="482" font-size="11" font-weight="700" fill="#A78BFA">ArrayBlockingQueue</text>
  <text x="550" y="498" font-size="9" fill="#94A3B8">Bounded thread-safe producer/consumer</text>

  <!-- Right Side: Independent Map Hierarchy -->
  <rect x="830" y="95" width="330" height="460" rx="8" fill="#1C1917" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="830" y="95" width="330" height="32" rx="8" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
  <text x="995" y="117" font-size="12" font-weight="700" fill="#FDE68A" text-anchor="middle">Independent Map Hierarchy (NOT a Collection)</text>

  <!-- Root: Map<K,V> -->
  <rect x="860" y="140" width="270" height="70" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="995" y="165" font-size="12" font-weight="700" fill="#FBBF24" text-anchor="middle">&lt;&lt;interface&gt;&gt; Map&lt;K, V&gt;</text>
  <text x="875" y="186" font-size="10" fill="#CBD5E1">Key-Value Association</text>
  <text x="875" y="200" font-size="9" fill="#94A3B8">keySet(), values(), entrySet() views</text>

  <!-- Map Implementations -->
  <rect x="850" y="230" width="290" height="305" rx="6" fill="#0F172A" stroke="#D97706" stroke-width="1"/>
  
  <rect x="865" y="245" width="260" height="60" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
  <text x="875" y="267" font-size="11" font-weight="700" fill="#FBBF24">HashMap&lt;K,V&gt;</text>
  <text x="875" y="284" font-size="10" fill="#CBD5E1">Hash table buckets + red-black treeify</text>
  <text x="875" y="298" font-size="9" fill="#94A3B8">O(1) average lookup, permits null key</text>

  <rect x="865" y="315" width="260" height="60" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
  <text x="875" y="337" font-size="11" font-weight="700" fill="#FBBF24">LinkedHashMap&lt;K,V&gt;</text>
  <text x="875" y="354" font-size="10" fill="#CBD5E1">Doubly-linked bucket order</text>
  <text x="875" y="368" font-size="9" fill="#94A3B8">Insertion or access-order (ideal for LRU)</text>

  <rect x="865" y="385" width="260" height="60" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
  <text x="875" y="407" font-size="11" font-weight="700" fill="#FBBF24">TreeMap&lt;K,V&gt; (NavigableMap)</text>
  <text x="875" y="424" font-size="10" fill="#CBD5E1">Red-Black Tree sorted keys</text>
  <text x="875" y="438" font-size="9" fill="#94A3B8">O(log N) operations, subMap() queries</text>

  <rect x="865" y="455" width="260" height="65" rx="4" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
  <text x="875" y="475" font-size="11" font-weight="700" fill="#34D399">ConcurrentHashMap&lt;K,V&gt;</text>
  <text x="875" y="492" font-size="10" fill="#CBD5E1">CAS + bucket-level synchronized locks</text>
  <text x="875" y="506" font-size="9" fill="#A7F3D0">Lock-free volatile reads, no global lock</text>

  <!-- Iterable to Collection -->
  <path fill="none" d="M 420 190 L 420 220" stroke="#3B82F6" stroke-width="2" marker-end="url(#arr-b)"/>

  <!-- Collection to Sub-Branches -->
  <path d="M 420 270 L 420 285 L 165 285 L 165 300" stroke="#0284C7" stroke-width="2" fill="none" marker-end="url(#arr-c)"/>
  <path fill="none" d="M 420 270 L 420 300" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>
  <path d="M 420 270 L 420 285 L 655 285 L 655 300" stroke="#8B5CF6" stroke-width="2" fill="none" marker-end="url(#arr-p)"/>
</svg>