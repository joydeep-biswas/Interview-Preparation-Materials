<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1200" height="540" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">HashMap Bucket Collision &amp; Treeification Threshold Mechanics</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Linked List Chaining -&gt; Treeification at 8 Nodes &amp; 64 Table Capacity -&gt; Untreeify at 6 Nodes</text>

  <!-- Stage 1: Linked List Chaining -->
  <rect x="50" y="95" width="340" height="425" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="50" y="95" width="340" height="30" rx="8" fill="#0C4A6E"/>
  <text x="220" y="116" font-size="12" font-weight="700" fill="#7DD3FC" text-anchor="middle">Stage 1: Chained Linked List (&lt; 8 Nodes)</text>

  <rect x="70" y="140" width="300" height="150" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="85" y="165" font-size="11" font-weight="700" fill="#F8FAFC">Bucket Chain (Low Collision):</text>
  <text x="85" y="190" font-size="10" font-family="'JetBrains Mono', monospace" fill="#38BDF8">table[i] -&gt; Node 1 (hash, K1, V1)</text>
  <text x="85" y="210" font-size="10" font-family="'JetBrains Mono', monospace" fill="#38BDF8">           -&gt; Node 2 (hash, K2, V2)</text>
  <text x="85" y="230" font-size="10" font-family="'JetBrains Mono', monospace" fill="#38BDF8">           -&gt; Node 3 (hash, K3, V3)</text>
  <text x="85" y="250" font-size="10" font-family="'JetBrains Mono', monospace" fill="#38BDF8">           -&gt; Node 4 ... (up to 7)</text>
  <text x="85" y="275" font-size="9" fill="#94A3B8">Linear O(n) scan using equals() comparison</text>

  <rect x="70" y="305" width="300" height="200" rx="6" fill="#1E293B" stroke="#0284C7" stroke-width="1"/>
  <text x="85" y="330" font-size="11" font-weight="700" fill="#7DD3FC">Poisson Distribution Proof:</text>
  <text x="85" y="346" font-size="9.5" fill="#CBD5E1">Under random hashCodes, probability of</text>
  <text x="85" y="360" font-size="9.5" fill="#CBD5E1">bucket collisions follows Poisson distribution:</text>
  <text x="85" y="375" font-size="9" font-family="'JetBrains Mono', monospace" fill="#94A3B8">P(k=0) = 0.6065</text>
  <text x="85" y="392" font-size="9" font-family="'JetBrains Mono', monospace" fill="#94A3B8">P(k=1) = 0.3032</text>
  <text x="85" y="409" font-size="9" font-family="'JetBrains Mono', monospace" fill="#94A3B8">P(k=2) = 0.0758</text>
  <text x="85" y="426" font-size="9" font-family="'JetBrains Mono', monospace" fill="#94A3B8">P(k=8) = 0.00000006 (One in 16 Million!)</text>
  <text x="85" y="452" font-size="10" fill="#FBBF24">8 nodes indicates pathological collision or hash collision attack!</text>

  <!-- Stage 2: Treeification Trigger -->
  <rect x="420" y="95" width="360" height="425" rx="8" fill="#1C1917" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="420" y="95" width="360" height="30" rx="8" fill="#78350F"/>
  <text x="600" y="116" font-size="12" font-weight="700" fill="#FDE68A" text-anchor="middle">Stage 2: Treeification Decision Rule</text>

  <rect x="440" y="140" width="320" height="110" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="455" y="165" font-size="11" font-weight="700" fill="#FBBF24">Condition 1: Bin Count &gt;= 8</text>
  <text x="455" y="185" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">static final int TREEIFY_THRESHOLD = 8;</text>
  <text x="455" y="205" font-size="10" fill="#94A3B8">Triggered when 8th element is added</text>
  <text x="455" y="225" font-size="10" fill="#CBD5E1">to a single collision bucket</text>

  <rect x="440" y="265" width="320" height="120" rx="6" fill="#0F172A" stroke="#EF4444" stroke-width="1.5"/>
  <text x="455" y="290" font-size="11" font-weight="700" fill="#F87171">Condition 2: Table Capacity &gt;= 64</text>
  <text x="455" y="310" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">static final int MIN_TREEIFY_CAPACITY = 64;</text>
  <text x="455" y="335" font-size="11" font-weight="700" fill="#FBBF24">The Capacity Trap:</text>
  <text x="455" y="355" font-size="10" fill="#CBD5E1">If bin count &gt;= 8 BUT table.length &lt; 64:</text>
  <text x="455" y="372" font-size="10" fill="#38BDF8">HashMap RESIZES (2x) instead of treeifying!</text>

  <rect x="440" y="400" width="320" height="105" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="455" y="425" font-size="11" font-weight="700" fill="#F8FAFC">Why Resize First?</text>
  <text x="455" y="445" font-size="10" fill="#CBD5E1">Expanding table length doubles bitmask width,</text>
  <text x="455" y="462" font-size="10" fill="#CBD5E1">naturally splitting collided keys across bins</text>
  <text x="455" y="480" font-size="10" fill="#94A3B8">without the heavier TreeNode memory cost.</text>

  <!-- Stage 3: Red-Black Tree &amp; Untreeify -->
  <rect x="810" y="95" width="360" height="425" rx="8" fill="#06201B" stroke="#047857" stroke-width="1.5"/>
  <rect x="810" y="95" width="360" height="30" rx="8" fill="#064E3B"/>
  <text x="990" y="116" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">Stage 3: Red-Black Tree (TreeBin)</text>

  <rect x="830" y="140" width="320" height="145" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="845" y="165" font-size="11" font-weight="700" fill="#34D399">Balanced Red-Black TreeNode:</text>
  <text x="845" y="188" font-size="10" font-family="'JetBrains Mono', monospace" fill="#A7F3D0">TreeNode&lt;K,V&gt; extends Node&lt;K,V&gt;</text>
  <text x="845" y="206" font-size="10" fill="#CBD5E1">&#x2022; Fields: parent, left, right, prev, red</text>
  <text x="845" y="226" font-size="10" fill="#CBD5E1">&#x2022; Memory: ~2x size of regular Node</text>
  <text x="845" y="246" font-size="11" font-weight="700" fill="#34D399">&#x2714; Search bound: O(log N) worst-case</text>
  <text x="845" y="265" font-size="9" fill="#94A3B8">Keys compared via Comparable or identity hash</text>

  <rect x="830" y="300" width="320" height="205" rx="6" fill="#1E293B" stroke="#34D399" stroke-width="1"/>
  <text x="845" y="325" font-size="11" font-weight="700" fill="#34D399">Untreeify Threshold Mechanics:</text>
  <text x="845" y="348" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">static final int UNTREEIFY_THRESHOLD = 6;</text>
  <text x="845" y="372" font-size="10" fill="#CBD5E1">When tree shrinks to &lt;= 6 nodes:</text>
  <text x="845" y="392" font-size="10" fill="#CBD5E1">&#x2022; During table resizing (split bins)</text>
  <text x="845" y="410" font-size="10" fill="#CBD5E1">&#x2022; During map.remove() deletions</text>
  <text x="845" y="432" font-size="10" fill="#38BDF8">&#x2714; Converts BACK to plain linked list</text>
  <text x="845" y="455" font-size="10" fill="#FBBF24">Why gap between 8 and 6?</text>
  <text x="845" y="472" font-size="9" fill="#94A3B8">Hysteresis buffer prevents thrashing between</text>
  <text x="845" y="488" font-size="9" fill="#94A3B8">treeify and untreeify on repeated insert/delete.</text>

  <!-- Stage 1 to Stage 2 -->
  <path fill="none" d="M 390 200 L 440 200" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr-a)"/>

  <!-- Stage 2 to Stage 3 -->
  <path fill="none" d="M 760 200 L 830 200" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>
</svg>