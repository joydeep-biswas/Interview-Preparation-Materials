<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="500" viewBox="0 0 1180 500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1180" height="500" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Java List Interface Hierarchy &amp; Implementation Characteristics</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">ArrayList (Contiguous Memory) vs. LinkedList (Doubly Linked) vs. CopyOnWriteArrayList (Thread-Safe Snapshot)</text>

  <!-- Top Root: List<E> Interface -->
  <rect x="420" y="95" width="340" height="65" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
  <text x="590" y="122" font-size="14" font-weight="700" fill="#60A5FA" text-anchor="middle">&lt;&lt;interface&gt;&gt; List&lt;E&gt;</text>
  <text x="590" y="145" font-size="11" fill="#94A3B8" text-anchor="middle">Indexed sequence: get(i), set(i, e), add(i, e), remove(i)</text>

  <!-- Column 1: ArrayList -->
  <rect x="50" y="195" width="340" height="275" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="50" y="195" width="340" height="32" rx="8" fill="#0C4A6E" stroke="#0284C7" stroke-width="1"/>
  <text x="220" y="216" font-size="12" font-weight="700" fill="#7DD3FC" text-anchor="middle">ArrayList&lt;E&gt; (Default Choice)</text>

  <rect x="65" y="240" width="310" height="215" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="80" y="265" font-size="11" fill="#CBD5E1"><tspan fill="#38BDF8" font-weight="700">Backing Store:</tspan> Contiguous <tspan font-family="'JetBrains Mono', monospace">Object[]</tspan></text>
  <text x="80" y="290" font-size="11" fill="#CBD5E1"><tspan fill="#38BDF8" font-weight="700">Random Access:</tspan> <tspan fill="#34D399" font-weight="700">O(1)</tspan> direct pointer arithmetic</text>
  <text x="80" y="315" font-size="11" fill="#CBD5E1"><tspan fill="#38BDF8" font-weight="700">Append Cost:</tspan> Amortized <tspan fill="#34D399" font-weight="700">O(1)</tspan> (1.5x geometric growth)</text>
  <text x="80" y="340" font-size="11" fill="#CBD5E1"><tspan fill="#38BDF8" font-weight="700">Middle Insert/Delete:</tspan> <tspan fill="#F87171" font-weight="700">O(n)</tspan> array copy shift</text>
  <text x="80" y="365" font-size="11" fill="#CBD5E1"><tspan fill="#38BDF8" font-weight="700">Memory Overhead:</tspan> Low (only pointer array)</text>
  <text x="80" y="390" font-size="11" fill="#CBD5E1"><tspan fill="#38BDF8" font-weight="700">CPU Cache:</tspan> <tspan fill="#34D399" font-weight="700">Excellent L1/L2 spatial locality</tspan></text>
  <text x="80" y="415" font-size="11" fill="#CBD5E1"><tspan fill="#38BDF8" font-weight="700">Thread Safety:</tspan> Not thread-safe (fail-fast)</text>
  <text x="80" y="440" font-size="10" fill="#94A3B8">Ideal for 95% of general list workloads</text>

  <!-- Column 2: LinkedList -->
  <rect x="420" y="195" width="340" height="275" rx="8" fill="#1C1917" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="420" y="195" width="340" height="32" rx="8" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
  <text x="590" y="216" font-size="12" font-weight="700" fill="#FDE68A" text-anchor="middle">LinkedList&lt;E&gt; (Doubly-Linked)</text>

  <rect x="435" y="240" width="310" height="215" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="450" y="265" font-size="11" fill="#CBD5E1"><tspan fill="#FBBF24" font-weight="700">Backing Store:</tspan> Dispersed Heap <tspan font-family="'JetBrains Mono', monospace">Node</tspan> objects</text>
  <text x="450" y="290" font-size="11" fill="#CBD5E1"><tspan fill="#FBBF24" font-weight="700">Random Access:</tspan> <tspan fill="#F87171" font-weight="700">O(n)</tspan> sequential traversal</text>
  <text x="450" y="315" font-size="11" fill="#CBD5E1"><tspan fill="#FBBF24" font-weight="700">Head/Tail Insert:</tspan> <tspan fill="#34D399" font-weight="700">O(1)</tspan> pointer updates</text>
  <text x="450" y="340" font-size="11" fill="#CBD5E1"><tspan fill="#FBBF24" font-weight="700">Middle Insert/Delete:</tspan> <tspan fill="#F87171" font-weight="700">O(n)</tspan> to find node</text>
  <text x="450" y="365" font-size="11" fill="#CBD5E1"><tspan fill="#FBBF24" font-weight="700">Memory Overhead:</tspan> <tspan fill="#F87171">Heavy (24B overhead per element)</tspan></text>
  <text x="450" y="390" font-size="11" fill="#CBD5E1"><tspan fill="#FBBF24" font-weight="700">CPU Cache:</tspan> <tspan fill="#F87171">Poor; frequent cache line misses</tspan></text>
  <text x="450" y="415" font-size="11" fill="#CBD5E1"><tspan fill="#FBBF24" font-weight="700">Thread Safety:</tspan> Not thread-safe (fail-fast)</text>
  <text x="450" y="440" font-size="10" fill="#94A3B8">Almost always outperformed by ArrayDeque</text>

  <!-- Column 3: CopyOnWriteArrayList -->
  <rect x="790" y="195" width="340" height="275" rx="8" fill="#06201B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="790" y="195" width="340" height="32" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="960" y="216" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">CopyOnWriteArrayList&lt;E&gt;</text>

  <rect x="805" y="240" width="310" height="215" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="820" y="265" font-size="11" fill="#CBD5E1"><tspan fill="#34D399" font-weight="700">Backing Store:</tspan> Immutable array reference</text>
  <text x="820" y="290" font-size="11" fill="#CBD5E1"><tspan fill="#34D399" font-weight="700">Random Access:</tspan> <tspan fill="#34D399" font-weight="700">O(1)</tspan> lock-free volatile read</text>
  <text x="820" y="315" font-size="11" fill="#CBD5E1"><tspan fill="#34D399" font-weight="700">Iteration:</tspan> <tspan fill="#34D399">Lock-free snapshot</tspan> (no CME)</text>
  <text x="820" y="340" font-size="11" fill="#CBD5E1"><tspan fill="#34D399" font-weight="700">Mutations (Write):</tspan> <tspan fill="#F87171" font-weight="700">O(n)</tspan> clones entire array!</text>
  <text x="820" y="365" font-size="11" fill="#CBD5E1"><tspan fill="#34D399" font-weight="700">Memory Overhead:</tspan> High during writes (dual copies)</text>
  <text x="820" y="390" font-size="11" fill="#CBD5E1"><tspan fill="#34D399" font-weight="700">CPU Cache:</tspan> Excellent read locality</text>
  <text x="820" y="415" font-size="11" fill="#CBD5E1"><tspan fill="#34D399" font-weight="700">Thread Safety:</tspan> 100% thread-safe (ReentrantLock on writes)</text>
  <text x="820" y="440" font-size="10" fill="#94A3B8">Ideal for read-heavy observer &amp; event buses</text>

  <!-- Connectors from Root to 3 Columns -->
  <path d="M 500 160 L 500 178 L 220 178 L 220 195" stroke="#0284C7" stroke-width="2" fill="none" marker-end="url(#arr-c)"/>
  <path fill="none" d="M 590 160 L 590 195" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr-a)"/>
  <path d="M 680 160 L 680 178 L 960 178 L 960 195" stroke="#10B981" stroke-width="2" fill="none" marker-end="url(#arr-g)"/>
</svg>