<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" width="1080" height="580">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1080" height="580" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="540" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">API Idempotency &amp; Distributed Deduplication via Redis Lease Locks</text>
  <text x="540" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Guaranteeing Exactly-Once Business Mutation Semantics on Unreliable Networks with Retry Spikes</text>
<rect x="50" y="100" width="190" height="50" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
<text x="145" y="121" fill="#3b82f6" font-size="10.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Client (Mobile/Web)</text>
<text x="145" y="138" fill="#94A3B8" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Sends Idempotency-Key</text>
<line x1="145" y1="150" x2="145" y2="475" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="320" y="100" width="190" height="50" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
<text x="415" y="121" fill="#06b6d4" font-size="10.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Idempotency Interceptor</text>
<text x="415" y="138" fill="#94A3B8" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Spring HandlerInterceptor</text>
<line x1="415" y1="150" x2="415" y2="475" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="600" y="100" width="190" height="50" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="695" y="121" fill="#f59e0b" font-size="10.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Redis Distributed Lock</text>
<text x="695" y="138" fill="#94A3B8" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Atomic SETNX &amp; Cache</text>
<line x1="695" y1="150" x2="695" y2="475" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="860" y="100" width="190" height="50" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
<text x="955" y="121" fill="#10b981" font-size="10.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Database / Core Engine</text>
<text x="955" y="138" fill="#94A3B8" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">ACID Order Processing</text>
<line x1="955" y1="150" x2="955" y2="475" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="145" y1="175" x2="415" y2="175" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>
<text x="280" y="167" fill="#93C5FD" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">1. POST /orders (Header: Idempotency-Key: uuid-101)</text>
<line x1="415" y1="210" x2="695" y2="210" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#arr-a)"/>
<text x="555" y="202" fill="#FDE68A" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">2. SET 'idemp:uuid-101' 'IN_PROGRESS' NX EX 120</text>
<line x1="695" y1="240" x2="415" y2="240" stroke="#34D399" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-g)"/>
<text x="555" y="232" fill="#6EE7B7" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Returns 1 (Lock Acquired -&gt; New Request)</text>
<line x1="415" y1="275" x2="955" y2="275" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
<text x="685" y="267" fill="#6EE7B7" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">3. INSERT INTO orders ... (Commits Order #9042)</text>
<line x1="415" y1="310" x2="695" y2="310" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#arr-a)"/>
<text x="555" y="302" fill="#FDE68A" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">4. SET 'idemp:uuid-101' '{"orderId": 9042}' EX 86400</text>
<line x1="415" y1="345" x2="145" y2="345" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-b)"/>
<text x="280" y="337" fill="#93C5FD" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">201 Created: { orderId: 9042 }</text>
<rect x="40" y="380" width="210" height="26" rx="4" fill="#78350f" stroke="#f59e0b" stroke-width="1"/>
<text x="145" y="397" fill="#FDE68A" font-size="8.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">NETWORK RETRY with same Key!</text>
<line x1="145" y1="420" x2="415" y2="420" stroke="#F87171" stroke-width="1.5" marker-end="url(#arr-r)"/>
<text x="280" y="412" fill="#FCA5A5" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">5. RETRY: POST /orders (Same Key: uuid-101)</text>
<line x1="415" y1="445" x2="695" y2="445" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>
<line x1="695" y1="463" x2="415" y2="463" stroke="#34D399" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-g)"/>
<text x="555" y="437" fill="#6EE7B7" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">GET 'idemp:uuid-101' -&gt; Returns cached payload</text>
<line x1="415" y1="475" x2="145" y2="475" stroke="#34D399" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-g)"/>
<text x="280" y="467" fill="#34D399" font-size="8.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">200 OK (From Cache): { orderId: 9042 } (ZERO DB DML!)</text>
<rect x="40" y="505" width="1000" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<text x="65" y="526" fill="#38BDF8" font-size="10.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">The Three States of an Idempotency Key in Redis:</text>
<text x="65" y="545" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">1. Key does not exist: Acquire lease with SETNX EX 120 -&gt; execute DB -&gt; store response. 2. Key == IN_PROGRESS: Concurrent request running -&gt; return 409 Conflict or wait. 3. Key == Cached: Return cached response directly.</text>
</svg>