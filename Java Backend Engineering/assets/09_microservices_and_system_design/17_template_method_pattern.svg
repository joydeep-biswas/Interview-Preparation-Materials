<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="1080" height="560">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1080" height="560" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="540" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Template Method Pattern: Invariant Workflow Skeleton with Concrete Hooks</text>
  <text x="540" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Defining the Standard Step Sequence in an Abstract Base Class while Subclasses Implement Step Details</text>
<rect x="140" y="95" width="800" height="150" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
<rect x="155" y="107" width="300" height="20" rx="10" fill="#1e3a8a" stroke="#3B82F6" stroke-width="1"/><text x="305" y="120" fill="#93C5FD" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">ABSTRACT TEMPLATE BASE CLASS</text>
<text x="540" y="140" fill="#60A5FA" font-size="13" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">public abstract class DataIngestionPipeline</text>
<rect x="160" y="160" width="760" height="70" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
<text x="175" y="180" fill="#FBBF24" font-size="9.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">public final void process(Path file) { // FINAL prevents step tampering!</text>
<text x="185" y="198" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">RawData raw = readData(file); -&gt; validate(raw); -&gt; TransformedData data = transform(raw);</text>
<text x="185" y="215" fill="#34D399" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">saveToDatabase(data); -&gt; if (postHookEnabled()) onCompleteNotification(); }</text>
<rect x="50" y="280" width="470" height="140" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="1.5"/>
<rect x="65" y="292" width="220" height="20" rx="10" fill="#78350f" stroke="#F59E0B" stroke-width="1"/><text x="175" y="305" fill="#FDE68A" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">SUBCLASS 1: CSV Pipeline</text>
<text x="285" y="325" fill="#FBBF24" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">CsvDataIngestionPipeline</text>
<text x="70" y="350" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• readData(file): Uses Apache Commons CSV parser</text>
<text x="70" y="368" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• validate(raw): Checks column count &amp; delimiter</text>
<text x="70" y="386" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• transform(raw): Maps CSV row arrays to Java POJOs</text>
<text x="70" y="404" fill="#94A3B8" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• postHookEnabled(): returns false (no alert)</text>
<rect x="560" y="280" width="470" height="140" rx="8" fill="#062e24" stroke="#10b981" stroke-width="1.5"/>
<rect x="575" y="292" width="220" height="20" rx="10" fill="#047857" stroke="#10B981" stroke-width="1"/><text x="685" y="305" fill="#D1FAE5" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">SUBCLASS 2: JSON Pipeline</text>
<text x="795" y="325" fill="#34D399" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">JsonDataIngestionPipeline</text>
<text x="580" y="350" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• readData(file): Uses Jackson Streaming parser</text>
<text x="580" y="368" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• validate(raw): Validates against JSON Schema draft-07</text>
<text x="580" y="386" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• transform(raw): Flattens nested JSON trees</text>
<text x="580" y="404" fill="#6EE7B7" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• postHookEnabled(): returns true (sends Slack alert)</text>
<path d="M 285.0 280.0 L 285.0 268.5 Q 285.0 262.5 291.0 262.5 L 374.0 262.5 Q 380.0 262.5 380.0 256.5 L 380.0 245.0" fill="none" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-s)"/>
<path d="M 795.0 280.0 L 795.0 268.5 Q 795.0 262.5 789.0 262.5 L 706.0 262.5 Q 700.0 262.5 700.0 256.5 L 700.0 245.0" fill="none" stroke="#34D399" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-s)"/>
<rect x="40" y="450" width="1000" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<text x="65" y="473" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">The Hollywood Principle: 'Don't call us, we'll call you'</text>
<text x="65" y="493" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• In Template Method, the superclass controls the execution lifecycle and calls subclass hooks when appropriate, inverting the normal procedural call tree.</text>
<text x="65" y="510" fill="#FDE68A" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Always mark the template method as 'final' so subclasses cannot override the execution order or omit mandatory security/audit steps.</text>
</svg>