<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="1080" height="560">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1080" height="560" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="540" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Composite Pattern: Recursive Tree Hierarchies with Uniform Contracts</text>
  <text x="540" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Treating Individual Objects and Compositions of Objects Identically in Enterprise Authorization</text>
<rect x="390" y="100" width="300" height="75" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
<text x="540" y="122" fill="#6EE7B7" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">&amp;lt;&amp;lt;interface&amp;gt;&amp;gt;</text>
<text x="540" y="140" fill="#34D399" font-size="13" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">PermissionComponent</text>
<text x="540" y="160" fill="#CBD5E1" font-size="9.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">+checkAccess(String action): boolean</text>
<rect x="60" y="220" width="380" height="190" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="75" y="235" width="140" height="20" rx="10" fill="#1e3a8a" stroke="#3B82F6" stroke-width="1"/><text x="145" y="248" fill="#93C5FD" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">LEAF NODE</text>
<text x="250" y="275" fill="#60A5FA" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">LeafPrivilege</text>
<text x="80" y="305" fill="#93C5FD" font-size="9.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Atomic Un-divisible Permission:</text>
<text x="80" y="325" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">private final String action; // e.g. 'READ_INVOICE'</text>
<rect x="75" y="340" width="350" height="50" rx="4" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
<text x="85" y="360" fill="#F8FAFC" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">public boolean checkAccess(targetAction) {</text>
<text x="95" y="378" fill="#34D399" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">return this.action.equals(targetAction);</text>
<text x="80" y="405" fill="#94A3B8" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Cannot add children (throws UnsupportedOp)</text>
<rect x="540" y="220" width="480" height="190" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
<rect x="555" y="235" width="160" height="20" rx="10" fill="#78350f" stroke="#F59E0B" stroke-width="1"/><text x="635" y="248" fill="#FDE68A" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">COMPOSITE NODE</text>
<text x="780" y="275" fill="#FBBF24" font-size="12" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">CompositeRole</text>
<text x="560" y="305" fill="#FDE68A" font-size="9.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Aggregates Children Recursively:</text>
<text x="560" y="325" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">private final List&amp;lt;PermissionComponent&amp;gt; children = new ArrayList&amp;lt;&amp;gt;();</text>
<rect x="555" y="340" width="450" height="50" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
<text x="565" y="360" fill="#F8FAFC" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">public boolean checkAccess(targetAction) {</text>
<text x="575" y="378" fill="#34D399" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">return children.stream().anyMatch(c -&gt; c.checkAccess(targetAction));</text>
<text x="560" y="405" fill="#6EE7B7" font-size="8.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Can nest roles inside roles arbitrarily deep!</text>
<path d="M 250.0 220.0 L 250.0 211.0 C 250.0 199.8, 460.0 199.8, 460.0 188.5 L 460.0 175.0" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-s)"/>
<path d="M 780.0 220.0 L 780.0 211.0 C 780.0 199.8, 620.0 199.8, 620.0 188.5 L 620.0 175.0" fill="none" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-s)"/>
<path d="M 990 300 L 1050 300 L 1050 140 L 690 140" stroke="#FBBF24" stroke-width="1.5" fill="none" marker-end="url(#arr-a)"/>
<rect x="970" y="125" width="70" height="18" rx="9" fill="#78350f" stroke="#F59E0B" stroke-width="1"/><text x="1005" y="137" fill="#FDE68A" font-size="8" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Contains N</text>
<rect x="40" y="440" width="1000" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<text x="65" y="465" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Composite Pattern Elegance in Enterprise RBAC:</text>
<text x="65" y="485" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Uniformity: The authorization engine calls userRole.checkAccess('EXPORT_CSV') without caring whether userRole is a simple privilege or a 5-tier composite role tree.</text>
<text x="65" y="502" fill="#34D399" font-size="9.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Zero 'instanceof' Checks: Eliminates ugly procedural branching code (if (role instanceof AdminRole) ... else if ...), ensuring clean OCP compliance.</text>
</svg>