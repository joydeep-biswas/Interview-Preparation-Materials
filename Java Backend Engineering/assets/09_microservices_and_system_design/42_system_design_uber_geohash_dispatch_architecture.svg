<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" width="1080" height="580">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1080" height="580" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="540" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">System Design: Real-Time Priority Notification &amp; Dispatch Mesh</text>
  <text x="540" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Redis Deduplication, Priority Kafka Queues, Worker Autoscaling, and Multi-Channel Vendor Failover</text>
<rect x="40" y="110" width="260" height="320" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="55" y="125" width="200" height="20" rx="10" fill="#1e3a8a" stroke="#3B82F6" stroke-width="1"/><text x="155" y="138" fill="#93C5FD" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">1. INGRESS &amp; DEDUP TIER</text>
<text x="170" y="165" fill="#60A5FA" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Notification Gateway</text>
<text x="55" y="195" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Rate Limiting: 100 req/sec per user</text>
<text x="55" y="215" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Template Resolution &amp; Localization</text>
<rect x="55" y="245" width="230" height="95" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
<text x="170" y="268" fill="#38BDF8" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Redis Deduplication Cache</text>
<text x="65" y="288" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Key: SHA256(userId + msg + 5m)</text>
<text x="65" y="305" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">TTL: 300 seconds</text>
<text x="65" y="322" fill="#34D399" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Discards identical spam alerts!</text>
<rect x="340" y="110" width="360" height="320" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
<rect x="355" y="125" width="240" height="20" rx="10" fill="#78350f" stroke="#F59E0B" stroke-width="1"/><text x="475" y="138" fill="#FDE68A" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">2. PRIORITY STREAMING MESH</text>
<text x="520" y="165" fill="#FBBF24" font-size="11" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Apache Kafka Partitioned Queues</text>
<rect x="360" y="185" width="320" height="65" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
<text x="375" y="208" fill="#FECACA" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">High Priority: 'notif-otp-urgent'</text>
<text x="375" y="226" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">16 Partitions | P99 SLA: &lt; 1.5 seconds | Dedicated Workers</text>
<rect x="360" y="260" width="320" height="65" rx="6" fill="#083344" stroke="#06b6d4" stroke-width="1.5"/>
<text x="375" y="282" fill="#22D3EE" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Medium Priority: 'notif-order-status'</text>
<text x="375" y="300" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">8 Partitions | P99 SLA: &lt; 30 seconds | Shared Workers</text>
<rect x="360" y="335" width="320" height="65" rx="6" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="375" y="358" fill="#C084FC" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Bulk / Marketing: 'notif-promotions'</text>
<text x="375" y="376" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">32 Partitions | Throttled background delivery | Lowest cost</text>
<rect x="740" y="110" width="300" height="320" rx="8" fill="#062e24" stroke="#10b981" stroke-width="2"/>
<rect x="755" y="125" width="240" height="20" rx="10" fill="#047857" stroke="#10B981" stroke-width="1"/><text x="875" y="138" fill="#D1FAE5" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">3. CHANNEL VENDOR DISPATCH</text>
<text x="890" y="165" fill="#34D399" font-size="11" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Multi-Vendor Dispatch Fleet</text>
<rect x="755" y="190" width="270" height="60" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
<text x="890" y="215" fill="#3b82f6" font-size="9.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Push: Apple APNs &amp; Google FCM</text>
<text x="890" y="235" fill="#CBD5E1" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">HTTP/2 multiplexed socket pools</text>
<rect x="755" y="265" width="270" height="60" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
<text x="890" y="290" fill="#10b981" font-size="9.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">SMS: Twilio &amp; AWS SNS</text>
<text x="890" y="310" fill="#CBD5E1" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Automatic circuit breaker fallback</text>
<rect x="755" y="340" width="270" height="60" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
<text x="890" y="365" fill="#f59e0b" font-size="9.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Email: SendGrid &amp; AWS SES</text>
<text x="890" y="385" fill="#CBD5E1" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">DKIM/SPF authenticated SMTP</text>
<line x1="300" y1="260" x2="340" y2="260" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>
<line x1="700" y1="260" x2="740" y2="260" stroke="#34D399" stroke-width="2" marker-end="url(#arr-g)"/>
<rect x="40" y="455" width="1000" height="80" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<text x="65" y="478" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Priority Inversion Prevention in High-Throughput Notification Meshes:</text>
<text x="65" y="498" fill="#F87171" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Never mix OTP authentication codes with marketing blasts in the same Kafka topic. A 5M email promotional campaign will choke partition lag.</text>
<text x="65" y="515" fill="#34D399" font-size="9.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Segregating topics with dedicated consumer threadpools guarantees OTP codes arrive in &lt; 2 seconds regardless of marketing load.</text>
</svg>