<text x="940" y="255" fill="#CBD5E1" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Replica Node</text>
<text x="940" y="275" fill="#94A3B8" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Port: 7005</text>
<rect x="40" y="75" width="570" height="45" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
<text x="325" y="95" fill="#D1FAE5" font-size="10.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Write Client (W = 3): Writes latest version (v2) to Nodes 1, 2, 3</text>
<text x="325" y="110" fill="#A7F3D0" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Awaits ACK from 3 nodes before returning success to caller</text>
<rect x="450" y="335" width="570" height="45" rx="6" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="735" y="355" fill="#EDE9FE" font-size="10.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Read Client (R = 3): Reads from Nodes 3, 4, 5 -&gt; Sees versions [v2, v1, v1]</text>
<text x="735" y="370" fill="#C4B5FD" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Client picks v2 (highest timestamp) and issues Read Repair to Nodes 4 &amp; 5!</text>
<rect x="40" y="400" width="1000" height="130" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<text x="65" y="425" fill="#38BDF8" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">The Pigeonhole Principle Behind Quorums:</text>
<text x="540" y="455" fill="#FDE68A" font-size="14" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">R + W &gt; N  ==&gt;  (3 + 3 = 6 &gt; 5)  ==&gt;  GUARANTEED OVERLAP!</text>
<text x="65" y="485" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• By the pigeonhole principle, any read set of R nodes and any write set of W nodes MUST intersect in at least one node (Node 3).</text>
<text x="65" y="502" fill="#34D399" font-size="9.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Because Node 3 witnessed the latest write, the reader is mathematically guaranteed to observe version 2.</text>
<text x="65" y="518" fill="#94A3B8" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Sloppy Quorum &amp; Hinted Handoff: Under severe partitions, DynamoDB writes to non-designated nodes temporarily, accepting stale reads for availability.</text>
</svg>