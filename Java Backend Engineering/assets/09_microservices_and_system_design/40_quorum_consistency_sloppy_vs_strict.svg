<rect x="50" y="152" width="140" height="20" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/><text x="120" y="165" fill="#10b981" font-size="9.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Node 1</text>
