<rect x="870" y="152" width="140" height="20" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/><text x="940" y="165" fill="#64748b" font-size="9.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Node 5</text>
<text x="940" y="200" fill="#F8FAFC" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Value: v1 (Stale)</text>
