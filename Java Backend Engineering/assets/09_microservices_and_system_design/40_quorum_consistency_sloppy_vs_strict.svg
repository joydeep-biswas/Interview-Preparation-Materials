<rect x="460" y="152" width="140" height="20" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/><text x="530" y="165" fill="#f59e0b" font-size="9.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Node 3 (OVERLAP!)</text>
<text x="530" y="200" fill="#F8FAFC" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Value: v2 (Latest)</text>
<text x="530" y="225" fill="#f59e0b" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">IN BOTH READ &amp; WRITE!</text>
<text x="530" y="255" fill="#CBD5E1" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Replica Node</text>
