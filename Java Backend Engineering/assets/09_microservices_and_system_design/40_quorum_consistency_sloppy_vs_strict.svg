<rect x="655" y="140" width="160" height="170" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
<rect x="665" y="152" width="140" height="20" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/><text x="735" y="165" fill="#64748b" font-size="9.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Node 4</text>
<text x="735" y="200" fill="#F8FAFC" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Value: v1 (Stale)</text>
