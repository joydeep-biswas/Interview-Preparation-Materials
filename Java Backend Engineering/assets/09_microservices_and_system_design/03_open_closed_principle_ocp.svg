<text x="65" y="478" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Open/Closed Principle Operational Benefits:</text>
<text x="65" y="498" fill="#34D399" font-size="9.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Adding Crypto payment requires creating ONE new class: CryptoPaymentStrategy implementing PaymentStrategy.</text>
<text x="65" y="515" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• PaymentExecutionService is never modified, recompiled, or re-tested. Risk of regression in existing payment flows is ZERO.</text>
