<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="1080" height="560">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1080" height="560" rx="10" fill="url(#bg)"/>
  <text x="540" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Adapter Pattern: Bridging Incompatible Interfaces</text>
  <text x="540" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Translating Modern Domain Contracts into Legacy SOAP / XML Banking Protocols</text>
<rect x="40" y="130" width="220" height="270" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="55" y="145" width="120" height="20" rx="10" fill="#1e3a8a"/><text x="115" y="158" fill="#93C5FD" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">1. Client</text>
<text x="150" y="190" fill="#60A5FA" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">CheckoutService</text>
<text x="55" y="225" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Calls Domain Interface:</text>
<text x="55" y="245" fill="#38BDF8" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">gateway.charge(</text>
<text x="65" y="262" fill="#38BDF8" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">customerId, cents);</text>
<text x="55" y="295" fill="#94A3B8" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Expects modern cents/ID</text>
<text x="55" y="315" fill="#34D399" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">100% isolated from legacy!</text>
<rect x="290" y="130" width="230" height="270" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
<rect x="305" y="145" width="160" height="20" rx="10" fill="#047857"/><text x="385" y="158" fill="#D1FAE5" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">2. Target Interface</text>
<text x="405" y="185" fill="#6EE7B7" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">&amp;lt;&amp;lt;interface&amp;gt;&amp;gt;</text>
<text x="405" y="205" fill="#34D399" font-size="12" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">PaymentGateway</text>
<rect x="302" y="235" width="206" height="60" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
<text x="405" y="258" fill="#F8FAFC" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">+charge(customerId,</text>
<text x="405" y="275" fill="#F8FAFC" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">long amountInCents): Receipt</text>
<text x="305" y="325" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Clean domain contract</text>
<text x="305" y="345" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Standard Java types</text>
<rect x="550" y="130" width="240" height="270" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
<rect x="565" y="145" width="140" height="20" rx="10" fill="#78350f"/><text x="635" y="158" fill="#FDE68A" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">3. Adapter Class</text>
<text x="670" y="190" fill="#FBBF24" font-size="12" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">LegacyBankingAdapter</text>
<text x="565" y="220" fill="#FDE68A" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">implements PaymentGateway</text>
<text x="565" y="245" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Translation Logic:</text>
<text x="565" y="265" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">1. Lookup bank accNum from ID</text>
<text x="565" y="282" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">2. Convert cents -&gt; dollars</text>
<text x="575" y="298" fill="#FBBF24" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">dollars = cents / 100.0;</text>
<text x="565" y="320" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">3. Format SOAP XML payload</text>
<text x="565" y="338" fill="#34D399" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">4. Parse XML response -&gt; Receipt</text>
<rect x="820" y="130" width="220" height="270" rx="8" fill="#1a1118" stroke="#ef4444" stroke-width="1.5"/>
<rect x="835" y="145" width="140" height="20" rx="10" fill="#7f1d1d"/><text x="905" y="158" fill="#FECACA" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">4. Adaptee (Legacy)</text>
<text x="930" y="190" fill="#FCA5A5" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">LegacySoapBankingClient</text>
<rect x="832" y="225" width="196" height="75" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
<text x="836" y="248" fill="#F8FAFC" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">+submitDebitTransaction(</text>
<text x="844" y="264" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">String accountNumber,</text>
<text x="844" y="280" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">double dollarAmount): XML</text>
<text x="835" y="325" fill="#F87171" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Incompatible SOAP protocol</text>
<text x="835" y="345" fill="#F87171" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Cannot modify third-party jar!</text>
<line x1="260" y1="260" x2="290" y2="260" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>
<line x1="550" y1="260" x2="520" y2="260" stroke="#34D399" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arr-g)"/>
<line x1="790" y1="260" x2="820" y2="260" stroke="#FBBF24" stroke-width="2" marker-end="url(#arr-a)"/>
<rect x="40" y="440" width="1000" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<text x="65" y="465" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Adapter Pattern Architectural Value:</text>
<text x="65" y="485" fill="#34D399" font-size="9.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Anti-Corruption Layer (ACL): In Domain-Driven Design, the Adapter acts as an ACL protecting your pure domain from ugly vendor APIs.</text>
<text x="65" y="502" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• When the legacy SOAP client is eventually replaced by a modern REST or gRPC service, only the Adapter changes. CheckoutService remains 100% untouched.</text>
</svg>