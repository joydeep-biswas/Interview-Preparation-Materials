<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" width="1080" height="580">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1080" height="580" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="540" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">The CAP &amp; PACELC Theorems: Distributed Consistency Trade-Off Matrix</text>
  <text x="540" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Partition Tolerance Realities: If Partition (P) -&gt; Availability (A) vs Consistency (C); Else (E) -&gt; Latency (L) vs Consistency (C)</text>
<rect x="50" y="110" width="470" height="160" rx="8" fill="#062e3d" stroke="#06b6d4" stroke-width="2"/>
<rect x="65" y="122" width="220" height="20" rx="10" fill="#0891b2"/><text x="175" y="135" fill="#ECFEFF" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">CP / PC/EC (Consistency First)</text>
<text x="285" y="155" fill="#22D3EE" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Google Cloud Spanner, Apache HBase, ZooKeeper, Raft</text>
<text x="70" y="182" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Under Network Partition (P): Chooses Consistency (C). Rejects writes if</text>
<text x="70" y="198" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  quorum cannot be formed -&gt; Prefers downtime over stale/corrupt data.</text>
<text x="70" y="220" fill="#67E8F9" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Else in Normal Operation (E): Chooses Consistency (C) over Latency (L).</text>
<text x="70" y="236" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  Synchronous 2PC / Paxos consensus increases write latency.</text>
<text x="70" y="255" fill="#A7F3D0" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Ideal For: Financial ledgers, stock exchanges, distributed locks</text>
<rect x="560" y="110" width="470" height="160" rx="8" fill="#1a140b" stroke="#f59e0b" stroke-width="2"/>
<rect x="575" y="122" width="230" height="20" rx="10" fill="#78350f" stroke="#F59E0B" stroke-width="1"/><text x="690" y="135" fill="#FDE68A" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">AP / PA/EL (Availability First)</text>
<text x="795" y="155" fill="#FBBF24" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Apache Cassandra, Amazon DynamoDB, Couchbase</text>
<text x="580" y="182" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Under Network Partition (P): Chooses Availability (A). All nodes accept</text>
<text x="580" y="198" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  writes locally; resolves conflicts later via Last-Write-Wins (LWW).</text>
<text x="580" y="220" fill="#FDE68A" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Else in Normal Operation (E): Chooses Latency (L) over Consistency (C).</text>
<text x="580" y="236" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  Replicates asynchronously; serves reads in &lt; 2ms without consensus.</text>
<text x="580" y="255" fill="#6EE7B7" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Ideal For: Social media feeds, IoT telemetry, shopping carts</text>
<rect x="50" y="290" width="470" height="160" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="65" y="302" width="200" height="20" rx="10" fill="#1e3a8a" stroke="#3B82F6" stroke-width="1"/><text x="165" y="315" fill="#93C5FD" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">CA (Single-Node Relational)</text>
<text x="285" y="335" fill="#60A5FA" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Standalone PostgreSQL, MySQL, Oracle (Single Node)</text>
<text x="70" y="362" fill="#F87171" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Assumes ZERO network partitions (Cannot tolerate network split).</text>
<text x="70" y="380" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Delivers strict ACID transactions and instant full consistency locally.</text>
<text x="70" y="402" fill="#94A3B8" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• PACELC: PC/EC locally; when clustered via async read replicas, shifts</text>
<text x="70" y="418" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  into PA/EL due to replication lag.</text>
<text x="70" y="435" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Ideal For: Single-instance monoliths, early-stage MVPs</text>
<rect x="560" y="290" width="470" height="160" rx="8" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2"/>
<rect x="575" y="302" width="220" height="20" rx="10" fill="#6d28d9"/><text x="685" y="315" fill="#EDE9FE" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">TUNABLE CONSISTENCY</text>
<text x="795" y="335" fill="#C084FC" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Apache Kafka, MongoDB, Cassandra Quorums</text>
<text x="580" y="362" fill="#C4B5FD" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Kafka Producer: acks=all (CP mode) vs acks=1 (AP mode).</text>
<text x="580" y="380" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Cassandra: LOCAL_QUORUM vs ONE (Tunes R and W dynamically).</text>
<text x="580" y="402" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• MongoDB: WriteConcern.MAJORITY vs UNACKNOWLEDGED.</text>
<text x="580" y="420" fill="#34D399" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Allows engineering teams to choose trade-offs per specific endpoint!</text>
<text x="580" y="435" fill="#A7F3D0" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Ideal For: Systems with mixed read/write consistency requirements</text>
<rect x="40" y="470" width="1000" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<text x="65" y="493" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Daniel Abadi's PACELC Theorem Insight:</text>
<text x="65" y="513" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• CAP only considers system behavior during rare network partitions (P). But 99.99% of the time, networks are healthy (Else - E)!</text>
<text x="65" y="530" fill="#34D399" font-size="9.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• PACELC asks the true engineering question: Even in normal operation, will you pay higher latency (L) to get immediate consistency (C)?</text>
</svg>