  <rect width="1080" height="560" rx="10" fill="url(#bg)"/>
  <text x="540" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Saga Pattern: Choreography vs Orchestration Architecture</text>
  <text x="540" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Decentralized Event-Driven Pub/Sub vs Centralized Orchestration State Machines in Distributed Sagas</text>
<rect x="50" y="95" width="980" height="175" rx="8" fill="#0b1329" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="65" y="107" width="260" height="20" rx="10" fill="#1e3a8a"/><text x="195" y="120" fill="#93C5FD" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">1. SAGA CHOREOGRAPHY (Decentralized)</text>
<text x="340" y="122" fill="#38BDF8" font-size="9.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Services publish events to Kafka; peer services listen and react autonomously</text>
<rect x="80" y="140" width="190" height="60" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
<text x="175" y="163" fill="#3b82f6" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Order Service</text>
<text x="175" y="183" fill="#CBD5E1" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Emits: OrderCreated</text>
<rect x="320" y="140" width="190" height="60" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
<text x="415" y="163" fill="#10b981" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Payment Service</text>
<text x="415" y="183" fill="#CBD5E1" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Emits: PaymentCharged</text>
<rect x="560" y="140" width="190" height="60" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="655" y="163" fill="#f59e0b" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Inventory Svc</text>
<text x="655" y="183" fill="#CBD5E1" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Emits: StockReserved</text>
<rect x="800" y="140" width="190" height="60" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
<text x="895" y="163" fill="#06b6d4" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Shipping Svc</text>
<text x="895" y="183" fill="#CBD5E1" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Emits: OrderDispatched</text>
<line x1="270" y1="170" x2="320" y2="170" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>
<line x1="510" y1="170" x2="560" y2="170" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
<line x1="750" y1="170" x2="800" y2="170" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#arr-a)"/>
<rect x="70" y="210" width="940" height="45" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<text x="85" y="228" fill="#34D399" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Pros: Simple for 2-3 services; zero single point of failure.</text>
<text x="85" y="243" fill="#F87171" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Cons: Complex for 4+ services! Risk of cyclic event storms; impossible to see overall workflow state in one place.</text>
<rect x="50" y="290" width="980" height="230" rx="8" fill="#062e24" stroke="#10b981" stroke-width="2"/>
<rect x="65" y="302" width="280" height="20" rx="10" fill="#047857"/><text x="205" y="315" fill="#D1FAE5" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">2. SAGA ORCHESTRATION (Centralized)</text>
<text x="360" y="317" fill="#34D399" font-size="9.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Dedicated Orchestrator coordinates commands &amp; tracks compensation state</text>
<rect x="400" y="340" width="280" height="80" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
<text x="540" y="368" fill="#FBBF24" font-size="12" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">OrderSagaOrchestrator</text>
<text x="540" y="388" fill="#FDE68A" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">State Machine: SAGA_LOG Table</text>
<text x="540" y="405" fill="#CBD5E1" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Dispatches commands -&gt; awaits replies</text>
<rect x="100" y="435" width="220" height="65" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
<text x="210" y="458" fill="#10b981" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Payment Service</text>
<text x="210" y="478" fill="#CBD5E1" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Cmd: AuthorizePayment</text>
<text x="210" y="490" fill="#F87171" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Comp: RefundPayment</text>
<path d="M 540.0 420.0 L 540.0 423.8 Q 540.0 427.5 536.2 427.5 L 213.8 427.5 Q 210.0 427.5 210.0 431.2 L 210.0 435.0" fill="none" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-s)"/>
<rect x="430" y="435" width="220" height="65" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
<text x="540" y="458" fill="#3b82f6" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Inventory Service</text>
<text x="540" y="478" fill="#CBD5E1" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Cmd: ReserveStock</text>
<text x="540" y="490" fill="#F87171" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Comp: ReleaseStock</text>
<line x1="540" y1="420" x2="540" y2="435" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr-s)"/>
<rect x="760" y="435" width="220" height="65" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
<text x="870" y="458" fill="#06b6d4" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Shipping Service</text>
<text x="870" y="478" fill="#CBD5E1" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Cmd: CreateShipment</text>
<text x="870" y="490" fill="#F87171" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Comp: CancelShipment</text>
<path d="M 540.0 420.0 L 540.0 423.8 Q 540.0 427.5 543.8 427.5 L 866.2 427.5 Q 870.0 427.5 870.0 431.2 L 870.0 435.0" fill="none" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arr-s)"/>
</svg>