  <text x="540" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Separation of Concerns (SoC) &amp; Clean Layered Architecture</text>
  <text x="540" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Strict Unidirectional Dependency Invariants Across Web, Application, and Persistence Layers</text>
