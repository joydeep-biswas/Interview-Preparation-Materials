<line x1="670" y1="420" x2="710" y2="420" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#arr-a)"/>
<rect x="40" y="480" width="1000" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<text x="540" y="502" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Strict Architecture Invariant: Dependencies must point exclusively DOWNWARD (Web -&gt; Service -&gt; Persistence).</text>
<text x="540" y="525" fill="#CBD5E1" font-size="9.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Controllers must NEVER talk directly to Repositories; Repositories must NEVER know HTTP or Web concepts exist.</text>
