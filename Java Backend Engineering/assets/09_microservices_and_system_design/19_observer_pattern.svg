<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="1080" height="560">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1080" height="560" rx="10" fill="url(#bg)"/>
  <text x="540" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Observer Pattern: Asynchronous Event-Driven Decoupling</text>
  <text x="540" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Publish-Subscribe Event Dissemination via Spring ApplicationEventPublisher and @Async Listeners</text>
<rect x="360" y="95" width="360" height="85" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
<text x="540" y="121" fill="#60A5FA" font-size="13" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Publisher: OrderService</text>
<text x="380" y="145" fill="#38BDF8" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">publisher.publishEvent(new OrderPlacedEvent(order));</text>
<text x="540" y="165" fill="#34D399" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Zero compile-time coupling to inventory, email, or analytics!</text>
<rect x="340" y="215" width="400" height="65" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
<text x="540" y="241" fill="#FBBF24" font-size="12" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Spring Event Bus (ApplicationEventPublisher)</text>
<text x="540" y="263" fill="#FDE68A" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Event: OrderPlacedEvent [orderId, userId, total, items]</text>
<line x1="540" y1="180" x2="540" y2="215" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>
<rect x="40" y="320" width="300" height="110" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
<rect x="40" y="320" width="300" height="32" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
<text x="190" y="340" fill="#10b981" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">InventoryListener</text>
<text x="190" y="366" fill="#FDE68A" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">@TransactionalEventListener(AFTER_COMMIT)</text>
<text x="52" y="384" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Deducts physical inventory from warehouse</text>
<text x="52" y="398" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Runs AFTER transaction commits successfully</text>
<text x="52" y="412" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Prevents inventory deduction if order rolls back!</text>
<path d="M 540.0 280.0 L 540.0 288.0 C 540.0 298.0, 190.0 298.0, 190.0 308.0 L 190.0 320.0" fill="none" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-s)"/>
<rect x="390" y="320" width="300" height="110" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
<rect x="390" y="320" width="300" height="32" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
<text x="540" y="340" fill="#06b6d4" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">NotificationListener</text>
<text x="540" y="366" fill="#FDE68A" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">@Async @EventListener</text>
<text x="402" y="384" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Fires in background worker threadpool</text>
<text x="402" y="398" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Sends customer confirmation email &amp; SMS</text>
<text x="402" y="412" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Zero impact on HTTP checkout latency (&lt;5ms)</text>
<line x1="540" y1="280" x2="540" y2="320" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arr-s)"/>
<rect x="740" y="320" width="300" height="110" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
<rect x="740" y="320" width="300" height="32" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="890" y="340" fill="#8b5cf6" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">AnalyticsKafkaListener</text>
<text x="890" y="366" fill="#FDE68A" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">@EventListener</text>
<text x="752" y="384" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Converts event to Avro / JSON format</text>
<text x="752" y="398" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Publishes to 'orders.v1' Kafka topic</text>
<text x="752" y="412" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Streams to real-time analytics &amp; ClickHouse</text>
<path d="M 540.0 280.0 L 540.0 288.0 C 540.0 298.0, 890.0 298.0, 890.0 308.0 L 890.0 320.0" fill="none" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arr-s)"/>
<rect x="40" y="455" width="1000" height="80" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<text x="65" y="478" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">@TransactionalEventListener vs Standard @EventListener:</text>
<text x="65" y="498" fill="#F87171" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Standard @EventListener runs synchronously within the publisher's transaction. If the listener throws an exception, the order transaction rolls back!</text>
<text x="65" y="515" fill="#34D399" font-size="9.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• @TransactionalEventListener(phase = AFTER_COMMIT) guarantees the listener runs ONLY after the database transaction has committed.</text>
</svg>