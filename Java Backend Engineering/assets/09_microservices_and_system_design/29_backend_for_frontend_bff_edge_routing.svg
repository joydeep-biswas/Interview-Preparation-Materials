<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="1080" height="560">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1080" height="560" rx="10" fill="url(#bg)"/>
  <text x="540" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Backend for Frontend (BFF) Pattern &amp; Edge Routing Architecture</text>
  <text x="540" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Tailoring API Payloads, Aggregations, and Protocols to Distinct Client Platforms (Web vs Mobile vs IoT)</text>
<rect x="60" y="100" width="260" height="60" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
<text x="190" y="124" fill="#3b82f6" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Desktop Web Browser</text>
<text x="190" y="144" fill="#CBD5E1" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">React / Next.js SPA</text>
<rect x="410" y="100" width="260" height="60" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
<text x="540" y="124" fill="#10b981" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Mobile Applications</text>
<text x="540" y="144" fill="#CBD5E1" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">iOS &amp; Android Apps</text>
<rect x="760" y="100" width="260" height="60" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
<text x="890" y="124" fill="#f59e0b" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">B2B Partner Integration</text>
<text x="890" y="144" fill="#CBD5E1" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Third-Party REST / EDI</text>
<rect x="60" y="220" width="260" height="110" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
<rect x="60" y="220" width="260" height="32" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
<text x="190" y="240" fill="#3b82f6" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Web BFF Service</text>
<text x="72" y="270" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Dense JSON payloads with full metadata</text>
<text x="72" y="286" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Server-Side Rendering (SSR) support</text>
<text x="72" y="302" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• High-bandwidth broadband connection</text>
<line x1="190" y1="160" x2="190" y2="220" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-s)"/>
<rect x="410" y="220" width="260" height="110" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
<rect x="410" y="220" width="260" height="32" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
<text x="540" y="240" fill="#10b981" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Mobile BFF Service</text>
<text x="422" y="270" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Compact payloads (omits 60% of fields)</text>
<text x="422" y="286" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Downsizes images for 4G/5G mobile data</text>
<text x="422" y="302" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Aggregates 4 backend calls into 1 screen payload</text>
<line x1="540" y1="160" x2="540" y2="220" stroke="#10b981" stroke-width="2" marker-end="url(#arr-s)"/>
<rect x="760" y="220" width="260" height="110" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
<rect x="760" y="220" width="260" height="32" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
<text x="890" y="240" fill="#f59e0b" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Partner BFF Service</text>
<text x="772" y="270" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Strict API key &amp; OAuth2 client credentials</text>
<text x="772" y="286" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Rate-limited to 50 requests/min</text>
<text x="772" y="302" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Translates XML / SOAP to internal models</text>
<line x1="890" y1="160" x2="890" y2="220" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr-s)"/>
<rect x="60" y="390" width="210" height="50" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
<text x="165" y="418" fill="#06b6d4" font-size="10.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Catalog Service</text>
<rect x="310" y="390" width="210" height="50" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
<text x="415" y="418" fill="#10b981" font-size="10.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Order Service</text>
<rect x="560" y="390" width="210" height="50" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
<text x="665" y="418" fill="#3b82f6" font-size="10.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">User Service</text>
<rect x="810" y="390" width="210" height="50" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
<text x="915" y="418" fill="#f59e0b" font-size="10.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Payment Service</text>
<path d="M 190.0 330.0 L 190.0 340.0 C 190.0 358.0, 165.0 358.0, 165.0 376.0 L 165.0 390.0" fill="none" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>
<path d="M 540.0 330.0 L 540.0 340.0 C 540.0 358.0, 415.0 358.0, 415.0 376.0 L 415.0 390.0" fill="none" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
<path d="M 540.0 330.0 L 540.0 340.0 C 540.0 358.0, 665.0 358.0, 665.0 376.0 L 665.0 390.0" fill="none" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
<path d="M 890.0 330.0 L 890.0 340.0 C 890.0 358.0, 915.0 358.0, 915.0 376.0 L 915.0 390.0" fill="none" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#arr-a)"/>
<rect x="40" y="465" width="1000" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<text x="65" y="488" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Why the General-Purpose API Gateway Fails for Diverse Clients:</text>
<text x="65" y="508" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• A single monolithic API Gateway forces mobile apps to download bloated desktop payloads or make 10 sequential round-trips over cellular connections.</text>
<text x="65" y="524" fill="#34D399" font-size="9.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• BFF allows frontend teams to own and evolve their specific backend gateway independently without breaking other client teams.</text>
</svg>