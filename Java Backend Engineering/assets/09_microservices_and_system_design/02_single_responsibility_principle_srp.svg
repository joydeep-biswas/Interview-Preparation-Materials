  <rect width="1080" height="560" rx="10" fill="url(#bg)"/>
  <text x="540" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Single Responsibility Principle (SRP): Cohesive Decomposition</text>
  <text x="540" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Refactoring the God-Class into Single-Purpose Collaborators with Independent Reasons to Change</text>
<rect x="390" y="105" width="300" height="100" rx="8" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2"/>
<text x="540" y="133" fill="#C084FC" font-size="13" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">OrderProcessor (Orchestrator)</text>
<text x="540" y="153" fill="#EDE9FE" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Single Responsibility: Orchestration only!</text>
<text x="540" y="175" fill="#CBD5E1" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">processOrder(OrderRequest) -&gt; OrderResponse</text>
<text x="540" y="191" fill="#34D399" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Only 1 reason to change: Workflow rules change</text>
<rect x="40" y="260" width="230" height="160" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="40" y="260" width="230" height="40" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
<text x="155" y="284" fill="#3b82f6" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">1. OrderValidator</text>
<text x="52" y="320" fill="#3b82f6" font-size="9.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Responsibility:</text>
<text x="56" y="334" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Syntactic &amp; business rules</text>
<text x="52" y="352" fill="#3b82f6" font-size="9.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Method:</text>
<text x="56" y="366" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">+validate(OrderRequest)</text>
<text x="52" y="384" fill="#3b82f6" font-size="9.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Reason to Change:</text>
<text x="56" y="398" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Validation policies change</text>
<text x="60" y="411" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start"> (e.g. min quantity, blocked users)</text>
<rect x="295" y="260" width="230" height="160" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
<rect x="295" y="260" width="230" height="40" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
<text x="410" y="284" fill="#10b981" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">2. OrderRepository</text>
<text x="307" y="320" fill="#10b981" font-size="9.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Responsibility:</text>
<text x="311" y="334" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Database persistence</text>
<text x="307" y="352" fill="#10b981" font-size="9.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Method:</text>
<text x="311" y="366" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">+save(OrderEntity)</text>
<text x="307" y="384" fill="#10b981" font-size="9.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Reason to Change:</text>
<text x="311" y="398" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Schema changes, ORM tuning</text>
<text x="315" y="411" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">, database migration</text>
<rect x="550" y="260" width="230" height="160" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<rect x="550" y="260" width="230" height="40" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
<text x="665" y="284" fill="#f59e0b" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">3. PaymentGatewayClient</text>
<text x="562" y="320" fill="#f59e0b" font-size="9.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Responsibility:</text>
<text x="566" y="334" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Payment gateway integration</text>
<text x="562" y="352" fill="#f59e0b" font-size="9.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Method:</text>
<text x="566" y="366" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">+charge(token, amount)</text>
<text x="562" y="384" fill="#f59e0b" font-size="9.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Reason to Change:</text>
<text x="566" y="398" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Payment API changes (Strip</text>
<text x="570" y="411" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">e v3, currency format)</text>
<rect x="805" y="260" width="230" height="160" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
<rect x="805" y="260" width="230" height="40" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
<text x="920" y="284" fill="#06b6d4" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">4. NotificationService</text>
<text x="817" y="320" fill="#06b6d4" font-size="9.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Responsibility:</text>
<text x="821" y="334" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Customer communications</text>
<text x="817" y="352" fill="#06b6d4" font-size="9.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Method:</text>
<text x="821" y="366" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">+sendReceipt(email, receipt)</text>
<text x="817" y="384" fill="#06b6d4" font-size="9.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Reason to Change:</text>
<text x="821" y="398" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Email template redesign, S</text>
<text x="825" y="411" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">MS channel addition</text>
<path d="M 430 205 L 430 230 L 155 230 L 155 260" stroke="#38BDF8" stroke-width="1.5" fill="none" marker-end="url(#arr-b)"/>
<path d="M 470.0 205.0 L 470.0 215.0 C 470.0 230.5, 410.0 230.5, 410.0 246.0 L 410.0 260.0" fill="none" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
<path d="M 610.0 205.0 L 610.0 215.0 C 610.0 230.5, 665.0 230.5, 665.0 246.0 L 665.0 260.0" fill="none" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#arr-a)"/>
<path d="M 650 205 L 650 230 L 920 230 L 920 260" stroke="#22D3EE" stroke-width="1.5" fill="none" marker-end="url(#arr-c)"/>
<rect x="40" y="450" width="1000" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<text x="65" y="475" fill="#C084FC" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Robert C. Martin's SRP Invariant:</text>
<text x="65" y="495" fill="#CBD5E1" font-size="9.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• 'A class should have one, and only one, reason to change.' - Meaning: A class should be responsible to only one actor.</text>
<text x="65" y="512" fill="#F87171" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• God Class Anti-Pattern: Combining validation, database SQL, network HTTP calls, and HTML formatting in a single 1500-line class.</text>
<text x="65" y="528" fill="#34D399" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Result of SRP: High cohesion, zero merge conflicts between frontend/backend engineers, and effortless unit testing via mocks.</text>
</svg>