<text x="280" y="238" fill="#F87171" font-size="11" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Unified Monolithic JVM Process (WAR / Fat JAR)</text>
<rect x="70" y="255" width="95" height="55" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
<text x="117" y="280" fill="#FCA5A5" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">User</text>
<text x="117" y="295" fill="#94A3B8" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Module</text>
<rect x="175" y="255" width="95" height="55" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
<text x="222" y="280" fill="#FCA5A5" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Order</text>
<text x="222" y="295" fill="#94A3B8" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Module</text>
<rect x="280" y="255" width="95" height="55" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
<text x="327" y="280" fill="#FCA5A5" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Payment</text>
<text x="327" y="295" fill="#94A3B8" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Module</text>
<rect x="385" y="255" width="95" height="55" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
<text x="432" y="280" fill="#FCA5A5" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Catalog</text>
<text x="432" y="295" fill="#94A3B8" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Module</text>
<rect x="60" y="345" width="440" height="55" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="280" y="370" fill="#FBBF24" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Single Shared Central Database (RDBMS)</text>
<text x="280" y="388" fill="#CBD5E1" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Shared tables, relational foreign keys &amp; ACID transactions</text>
<line x1="280" y1="195" x2="280" y2="215" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>
<line x1="280" y1="325" x2="280" y2="345" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#arr-a)"/>
<text x="65" y="420" fill="#34D399" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Pros: ACID transactions, easy local debugging, zero network RPC latency.</text>
<text x="65" y="440" fill="#F87171" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Cons: Single point of failure, team deployment contention, rigid tech stack.</text>
<rect x="560" y="100" width="500" height="360" rx="8" fill="#062e24" stroke="#10b981" stroke-width="2"/>
<rect x="575" y="115" width="240" height="22" rx="11" fill="#047857" stroke="#10B981" stroke-width="1"/><text x="695" y="129" fill="#D1FAE5" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">MICROSERVICES ARCHITECTURE</text>
<rect x="580" y="150" width="460" height="45" rx="6" fill="#083344" stroke="#06b6d4" stroke-width="1.5"/>
<text x="810" y="176" fill="#22D3EE" font-size="10.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">API Gateway (L7 Routing, TLS, Auth, Rate Limiting)</text>
<rect x="585" y="220" width="140" height="75" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
