<text x="655" y="280" fill="#94A3B8" font-size="7.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Independent deploy</text>
<rect x="585" y="325" width="140" height="50" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
<text x="655" y="348" fill="#3b82f6" font-size="9.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">User DB</text>
<text x="655" y="364" fill="#CBD5E1" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Isolated Schema</text>
<path d="M 810.0 195.0 L 810.0 201.5 Q 810.0 207.5 804.0 207.5 L 661.0 207.5 Q 655.0 207.5 655.0 213.5 L 655.0 220.0" fill="none" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arr-c)"/>
<line x1="655" y1="295" x2="655" y2="325" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr-s)"/>
<rect x="740" y="220" width="140" height="75" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
<text x="810" y="245" fill="#10b981" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Order Service</text>
<text x="810" y="265" fill="#CBD5E1" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Java 21 / PG</text>
<text x="810" y="280" fill="#94A3B8" font-size="7.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Independent deploy</text>
<rect x="740" y="325" width="140" height="50" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
<text x="810" y="348" fill="#10b981" font-size="9.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Order DB</text>
<text x="810" y="364" fill="#CBD5E1" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Isolated Schema</text>
<line x1="810" y1="195" x2="810" y2="220" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arr-c)"/>
<line x1="810" y1="295" x2="810" y2="325" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-s)"/>
<rect x="895" y="220" width="140" height="75" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
<text x="965" y="245" fill="#f59e0b" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Payment Svc</text>
<text x="965" y="265" fill="#CBD5E1" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Kotlin / Mongo</text>
<text x="965" y="280" fill="#94A3B8" font-size="7.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Independent deploy</text>
<rect x="895" y="325" width="140" height="50" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
<text x="965" y="348" fill="#f59e0b" font-size="9.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Payment DB</text>
<text x="965" y="364" fill="#CBD5E1" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Isolated Schema</text>
<path d="M 810.0 195.0 L 810.0 201.5 Q 810.0 207.5 816.0 207.5 L 959.0 207.5 Q 965.0 207.5 965.0 213.5 L 965.0 220.0" fill="none" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arr-c)"/>
<line x1="965" y1="295" x2="965" y2="325" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-s)"/>
<text x="585" y="400" fill="#C084FC" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Event Bus: Apache Kafka / Event-Driven Messaging</text>
<text x="585" y="420" fill="#34D399" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Pros: Independent CI/CD scaling, isolated fault blast radius, tech freedom.</text>
<text x="585" y="440" fill="#FDE68A" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Cons: Distributed data consistency (Sagas), partial failure, RPC overhead.</text>
<rect x="40" y="480" width="1020" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<text x="65" y="503" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Database-Per-Service Golden Rule:</text>
<text x="65" y="523" fill="#F87171" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• In microservices, services MUST NEVER access another service's database directly. Direct database access breaks encapsulation and couples schemas.</text>
<text x="65" y="540" fill="#34D399" font-size="9.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• All inter-service communication must occur exclusively via published REST/gRPC APIs or asynchronous Kafka events.</text>
</svg>