  <rect width="1100" height="580" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="550" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Monolithic vs Microservices Architecture Deep-Dive</text>
  <text x="550" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Comparing Deployment Topology, Data Ownership, Scalability, and Distributed Failure Boundaries</text>
<rect x="40" y="100" width="480" height="360" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
<rect x="55" y="115" width="220" height="22" rx="11" fill="#7f1d1d" stroke="#EF4444" stroke-width="1"/><text x="165" y="129" fill="#FECACA" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">MONOLITHIC ARCHITECTURE</text>
<rect x="60" y="150" width="440" height="45" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
<text x="280" y="176" fill="#93C5FD" font-size="10.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Client Browser / Mobile App (HTTP)</text>
