  <rect width="1080" height="560" rx="10" fill="url(#bg)"/>
  <text x="540" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Strategy Pattern: Encapsulated Swappable Tax Calculation Algorithms</text>
  <text x="540" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Eliminating Cyclomatic Complexity and Switch Statements via Dynamic Spring Strategy Maps</text>
<rect x="340" y="95" width="400" height="85" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
<text x="540" y="119" fill="#60A5FA" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">TaxCalculationService (Context)</text>
<text x="360" y="143" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">private final Map&amp;lt;String, TaxStrategy&amp;gt; strategyMap;</text>
<text x="360" y="163" fill="#38BDF8" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">calculate(country, amt) -&gt; strategyMap.get(country).calculateTax(amt)</text>
<rect x="390" y="215" width="300" height="70" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
<text x="540" y="237" fill="#6EE7B7" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">&amp;lt;&amp;lt;interface&amp;gt;&amp;gt;</text>
<text x="540" y="255" fill="#34D399" font-size="13" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">TaxStrategy</text>
<text x="540" y="273" fill="#CBD5E1" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">+getCountryCode(): String | +calculateTax(amt): BigDecimal</text>
<line x1="540" y1="180" x2="540" y2="215" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>
<rect x="40" y="325" width="300" height="95" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
