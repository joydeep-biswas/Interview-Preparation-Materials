<text x="190" y="345" fill="#f59e0b" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">UsSalesTaxStrategy</text>
<text x="190" y="373" fill="#FDE68A" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">@Component('US')</text>
<text x="190" y="391" fill="#CBD5E1" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">State + County destination nexus sourcing rules</text>
<text x="190" y="407" fill="#94A3B8" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">implements TaxStrategy</text>
<path d="M 190.0 325.0 L 190.0 317.0 C 190.0 307.0, 540.0 307.0, 540.0 297.0 L 540.0 285.0" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-s)"/>
<rect x="390" y="325" width="300" height="95" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
<rect x="390" y="325" width="300" height="32" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
<text x="540" y="345" fill="#06b6d4" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">EuVatTaxStrategy</text>
<text x="540" y="373" fill="#FDE68A" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">@Component('EU')</text>
<text x="540" y="391" fill="#CBD5E1" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">One-Stop Shop (OSS) reverse-charge VAT rules</text>
<text x="540" y="407" fill="#94A3B8" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">implements TaxStrategy</text>
<line x1="540" y1="325" x2="540" y2="285" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-s)"/>
<rect x="740" y="325" width="300" height="95" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
<rect x="740" y="325" width="300" height="32" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="890" y="345" fill="#8b5cf6" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">IndiaGstTaxStrategy</text>
<text x="890" y="373" fill="#FDE68A" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">@Component('IN')</text>
<text x="890" y="391" fill="#CBD5E1" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Dual GST (CGST + SGST) vs Inter-state IGST</text>
<text x="890" y="407" fill="#94A3B8" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">implements TaxStrategy</text>
<path d="M 890.0 325.0 L 890.0 317.0 C 890.0 307.0, 540.0 307.0, 540.0 297.0 L 540.0 285.0" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-s)"/>
<rect x="40" y="450" width="1000" height="80" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<text x="65" y="473" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Spring Boot Dependency Injection Trick for Strategy Map:</text>
<text x="65" y="493" fill="#34D399" font-size="9.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Spring automatically populates Map&amp;lt;String, TaxStrategy&amp;gt; with all registered Spring beans, keyed by bean name (or country code).</text>
<text x="65" y="510" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Replaces nasty 200-line switch(country) statements with an O(1) hash map lookup, achieving complete Open/Closed compliance.</text>
