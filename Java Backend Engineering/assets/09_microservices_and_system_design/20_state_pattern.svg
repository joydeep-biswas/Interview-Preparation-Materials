<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="1080" height="560">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1080" height="560" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="540" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">State Pattern: Finite State Machine &amp; Validated State Transitions</text>
  <text x="540" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Encapsulating State-Specific Transitions and Invariant Guard Rails in Dedicated State Objects</text>
<rect x="50" y="130" width="230" height="120" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="50" y="130" width="230" height="32" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
<text x="165" y="150" fill="#3b82f6" font-size="10.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">1. PENDING_PAYMENT</text>
<text x="62" y="182" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Order created, stock reserved</text>
<text x="62" y="198" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• pay() -&gt; transitions to PAID</text>
<text x="62" y="214" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• cancel() -&gt; transitions to CANCELLED</text>
<line x1="280" y1="190" x2="300" y2="190" stroke="#34D399" stroke-width="2" marker-end="url(#arr-g)"/>
<rect x="300" y="130" width="230" height="120" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
<rect x="300" y="130" width="230" height="32" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
<text x="415" y="150" fill="#10b981" font-size="10.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">2. PAID</text>
<text x="312" y="182" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Funds captured in gateway</text>
<text x="312" y="198" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• ship() -&gt; transitions to SHIPPED</text>
<text x="312" y="214" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• refund() -&gt; transitions to REFUNDED</text>
<line x1="530" y1="190" x2="550" y2="190" stroke="#34D399" stroke-width="2" marker-end="url(#arr-g)"/>
<rect x="550" y="130" width="230" height="120" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
<rect x="550" y="130" width="230" height="32" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
<text x="665" y="150" fill="#06b6d4" font-size="10.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">3. SHIPPED</text>
<text x="562" y="182" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Carrier tracking attached</text>
<text x="562" y="198" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• deliver() -&gt; transitions to DELIVERED</text>
<text x="562" y="214" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Cannot cancel once in transit!</text>
<line x1="780" y1="190" x2="800" y2="190" stroke="#34D399" stroke-width="2" marker-end="url(#arr-g)"/>
<rect x="800" y="130" width="230" height="120" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
<rect x="800" y="130" width="230" height="32" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="915" y="150" fill="#8b5cf6" font-size="10.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">4. DELIVERED</text>
<text x="812" y="182" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Customer received package</text>
<text x="812" y="198" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• TERMINAL STATE: Final completion</text>
<text x="812" y="214" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Return window opens (30 days)</text>
<rect x="170" y="300" width="300" height="100" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
<text x="320" y="324" fill="#FECACA" font-size="11" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">5. CANCELLED (Terminal)</text>
<text x="190" y="348" fill="#FCA5A5" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Reversible before shipment only</text>
<text x="190" y="364" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Releases reserved warehouse inventory</text>
<text x="190" y="380" fill="#EF4444" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Impossible to ship or deliver a cancelled order!</text>
<path d="M 165.0 250.0 L 165.0 260.0 C 165.0 273.0, 240.0 273.0, 240.0 286.0 L 240.0 300.0" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arr-r)"/>
<path d="M 415.0 250.0 L 415.0 260.0 C 415.0 273.0, 360.0 273.0, 360.0 286.0 L 360.0 300.0" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arr-r)"/>
<rect x="610" y="300" width="300" height="100" rx="8" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
<text x="760" y="324" fill="#FDE68A" font-size="11" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">6. REFUNDED (Terminal)</text>
<text x="630" y="348" fill="#FDE68A" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Reverses payment via gateway refund API</text>
<text x="630" y="364" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Generates credit note &amp; accounting ledger entry</text>
<text x="630" y="380" fill="#34D399" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Emits OrderRefundedEvent to Kafka</text>
<path d="M 450.0 250.0 L 450.0 260.0 C 450.0 273.0, 680.0 273.0, 680.0 286.0 L 680.0 300.0" fill="none" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#arr-a)"/>
<path d="M 665.0 250.0 L 665.0 260.0 C 665.0 273.0, 780.0 273.0, 780.0 286.0 L 780.0 300.0" fill="none" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#arr-a)"/>
<rect x="40" y="435" width="1000" height="95" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<text x="65" y="460" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">The State Pattern Anti-If-Else Guarantee:</text>
<text x="65" y="480" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Traditional code uses sprawling nested switch(order.getStatus()) statements with fragile boolean flags like isPaid, isShipped.</text>
<text x="65" y="498" fill="#34D399" font-size="9.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• With the State pattern, state.ship(order) on a PendingPaymentState throws IllegalStateTransitionException at compile/runtime instantly.</text>
<text x="65" y="514" fill="#FDE68A" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Invariants are mathematically guaranteed by the state graph.</text>
</svg>