<text x="65" y="503" fill="#38BDF8" font-size="10.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">W3C Traceparent Header Anatomy:</text>
<text x="65" y="523" fill="#FDE68A" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• traceparent = 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01</text>
<text x="65" y="540" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Version (00) | TraceID (16 bytes, constant across ALL hops) | ParentSpanID (8 bytes, updated per hop) | TraceFlags (01 = sampled).</text>
<text x="65" y="555" fill="#34D399" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Exported asynchronously via OTLP gRPC to Jaeger / Tempo collector, generating the complete distributed flamegraph.</text>
