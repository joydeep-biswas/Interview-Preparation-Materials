<text x="550" y="574" fill="#94A3B8" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Patterns enforce SOLID principles: high cohesion, loose coupling, testability, and isolated evolutionary boundaries.</text>
