<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 580" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1240" height="580" rx="10" fill="url(#bg)"/>
  <rect width="1240" height="580" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="620" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">Enterprise Microsoft Azure Cloud Architecture for Java Backends</text>
  <text x="620" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">Hub-Spoke VNet Topology, Azure Front Door WAF, AKS Private Cluster, Key Vault &amp; Private Endpoints</text>
  <line x1="40" y1="68" x2="1200" y2="68" stroke="#334155" stroke-width="1"/>

  <!-- Edge Layer -->
  <rect x="40" y="100" width="220" height="420" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="40" y="100" width="220" height="30" rx="8" fill="#0C4A6E" stroke="#0284C7" stroke-width="1"/>
  <text x="150" y="120" font-size="11" font-weight="700" fill="#7DD3FC" text-anchor="middle">Public Edge &amp; Ingress</text>

  <rect x="55" y="145" width="190" height="70" rx="6" fill="#1E293B" stroke="#38BDF8"/>
  <text x="150" y="170" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">End Users &amp; Mobile</text>
  <text x="65" y="195" font-size="8" fill="#CBD5E1">Public Internet Traffic</text>

  <rect x="55" y="235" width="190" height="120" rx="6" fill="#0F172A" stroke="#0284C7"/>
  <text x="150" y="260" font-size="10" font-weight="700" fill="#7DD3FC" text-anchor="middle">Azure Front Door</text>
  <text x="65" y="285" font-size="8" fill="#CBD5E1">&#x2022; Global Anycast Routing</text>
  <text x="65" y="302" font-size="8" fill="#CBD5E1">&#x2022; Layer 7 CDN Caching</text>
  <text x="65" y="320" font-size="8" fill="#CBD5E1">&#x2022; Managed WAF Rules</text>
  <text x="65" y="338" font-size="8" fill="#34D399">&#x2714; SSL 1.3 Termination</text>

  <path fill="none" d="M 150 215 L 150 235" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>

  <!-- Hub VNet -->
  <rect x="290" y="100" width="260" height="420" rx="8" fill="#1C1917" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="290" y="100" width="260" height="30" rx="8" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
  <text x="420" y="120" font-size="11" font-weight="700" fill="#FDE68A" text-anchor="middle">Hub VNet (10.0.0.0/16)</text>

  <rect x="305" y="145" width="230" height="110" rx="6" fill="#0F172A" stroke="#F59E0B"/>
  <text x="420" y="170" font-size="10" font-weight="700" fill="#FBBF24" text-anchor="middle">Azure Firewall Premium</text>
  <text x="315" y="193" font-size="8" fill="#CBD5E1">&#x2022; TLS Inspection &amp; IDS/IPS</text>
  <text x="315" y="211" font-size="8" fill="#CBD5E1">&#x2022; Outbound FQDN filtering</text>
  <text x="315" y="230" font-size="8" fill="#34D399">&#x2714; Central perimeter inspection</text>

  <rect x="305" y="270" width="230" height="75" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="420" y="295" font-size="10" font-weight="700" fill="#E2E8F0" text-anchor="middle">Azure Bastion</text>
  <text x="315" y="320" font-size="8" fill="#CBD5E1">Zero-public-IP browser SSH/RDP</text>

  <rect x="305" y="360" width="230" height="145" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="420" y="385" font-size="10" font-weight="700" fill="#E2E8F0" text-anchor="middle">Private DNS Zones</text>
  <text x="315" y="410" font-size="8" fill="#CBD5E1">&#x2022; privatelink.database.windows.net</text>
  <text x="315" y="428" font-size="8" fill="#CBD5E1">&#x2022; privatelink.redis.cache.windows.net</text>
  <text x="315" y="446" font-size="8" fill="#CBD5E1">&#x2022; privatelink.vaultcore.azure.net</text>
  <text x="315" y="470" font-size="8" fill="#34D399">&#x2714; Resolves PaaS to private IPs</text>

  <path fill="none" d="M 245.0 295.0 L 255.0 295.0 C 273.0 295.0, 273.0 200.0, 291.0 200.0 L 305.0 200.0" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr-a)"/>

  <!-- Spoke Compute VNet (AKS) -->
  <rect x="580" y="100" width="310" height="420" rx="8" fill="#06201B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="580" y="100" width="310" height="30" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="735" y="120" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">Spoke Compute VNet: AKS Cluster</text>

  <rect x="595" y="145" width="280" height="75" rx="6" fill="#1E293B" stroke="#10B981"/>
  <text x="735" y="170" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">Azure App Gateway v2 (WAF)</text>
  <text x="605" y="193" font-size="8" fill="#CBD5E1">&#x2022; Private internal ingress</text>
  <text x="605" y="210" font-size="8" fill="#CBD5E1">&#x2022; AGIC (App Gateway Ingress Controller)</text>

  <rect x="595" y="235" width="280" height="270" rx="6" fill="#0F172A" stroke="#10B981"/>
  <text x="735" y="260" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">AKS Cluster (Azure CNI)</text>

  <rect x="610" y="280" width="250" height="60" rx="4" fill="#06201B" stroke="#10B981"/>
  <text x="620" y="302" font-size="9" font-weight="700" fill="#34D399">Order Service Pods</text>
  <text x="620" y="322" font-size="8" fill="#A7F3D0">Java 21 + Spring Boot 3</text>

  <rect x="610" y="350" width="250" height="60" rx="4" fill="#06201B" stroke="#10B981"/>
  <text x="620" y="372" font-size="9" font-weight="700" fill="#34D399">Payment Service Pods</text>
  <text x="620" y="392" font-size="8" fill="#A7F3D0">Virtual Threads (Loom)</text>

  <rect x="610" y="420" width="250" height="70" rx="4" fill="#1E293B" stroke="#334155"/>
  <text x="620" y="442" font-size="8" font-weight="700" fill="#E2E8F0">Workload Identity Federation:</text>
  <text x="620" y="456" font-size="8" fill="#CBD5E1">Projected OIDC tokens authenticate to Key Vault</text>
  <text x="620" y="470" font-size="8" fill="#CBD5E1">&amp; Azure DB without stored passwords!</text>

  <!-- Connectors Hub to Compute -->
  <path fill="none" d="M 535.0 200.0 L 545.0 200.0 C 563.0 200.0, 563.0 180.0, 581.0 180.0 L 595.0 180.0" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- Spoke Data VNet (PaaS Private Endpoints) -->
  <rect x="920" y="100" width="280" height="420" rx="8" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.5"/>
  <rect x="920" y="100" width="280" height="30" rx="8" fill="#4C1D95" stroke="#8B5CF6" stroke-width="1"/>
  <text x="1060" y="120" font-size="11" font-weight="700" fill="#DDD6FE" text-anchor="middle">Spoke Data: Private Endpoints</text>

  <rect x="935" y="145" width="250" height="55" rx="4" fill="#0F172A" stroke="#8B5CF6"/>
  <text x="1060" y="167" font-size="9" font-weight="700" fill="#C084FC" text-anchor="middle">Azure Key Vault (Secrets &amp; Certs)</text>
  <text x="945" y="185" font-size="8" fill="#CBD5E1">Private Link IP: 10.2.0.4</text>

  <rect x="935" y="210" width="250" height="55" rx="4" fill="#0F172A" stroke="#8B5CF6"/>
  <text x="1060" y="232" font-size="9" font-weight="700" fill="#C084FC" text-anchor="middle">Azure Database for PostgreSQL</text>
  <text x="945" y="250" font-size="8" fill="#CBD5E1">Private Link IP: 10.2.0.5</text>

  <rect x="935" y="275" width="250" height="55" rx="4" fill="#0F172A" stroke="#8B5CF6"/>
  <text x="1060" y="297" font-size="9" font-weight="700" fill="#C084FC" text-anchor="middle">Azure Cache for Redis</text>
  <text x="945" y="315" font-size="8" fill="#CBD5E1">Private Link IP: 10.2.0.6</text>

  <rect x="935" y="340" width="250" height="55" rx="4" fill="#0F172A" stroke="#8B5CF6"/>
  <text x="1060" y="362" font-size="9" font-weight="700" fill="#C084FC" text-anchor="middle">Azure Service Bus</text>
  <text x="945" y="380" font-size="8" fill="#CBD5E1">Private Link IP: 10.2.0.7</text>

  <rect x="935" y="405" width="250" height="100" rx="4" fill="#1E293B" stroke="#334155"/>
  <text x="945" y="428" font-size="8" font-weight="700" fill="#34D399">&#x2714; Zero Public IPs on PaaS Data:</text>
  <text x="945" y="445" font-size="8" fill="#CBD5E1">All databases and queues reject public internet connections.</text>
  <text x="945" y="465" font-size="8" fill="#CBD5E1">Reachable ONLY via VNet Peering!</text>

  <!-- Connectors AKS to Data -->
  <path fill="none" d="M 860.0 310.0 L 870.0 310.0 C 895.5 310.0, 895.5 235.0, 921.0 235.0 L 935.0 235.0" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arr-p)"/>
  <path fill="none" d="M 860.0 380.0 L 870.0 380.0 C 895.5 380.0, 895.5 300.0, 921.0 300.0 L 935.0 300.0" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arr-p)"/>

  <!-- Bottom Invariant -->
  <rect x="40" y="535" width="1160" height="30" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="620" y="555" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Zero-Trust Azure Invariant: All PaaS resources (SQL, Redis, Key Vault) use Private Endpoints with public access disabled. Pods communicate across peered VNets with zero internet exposure.</text>
</svg>