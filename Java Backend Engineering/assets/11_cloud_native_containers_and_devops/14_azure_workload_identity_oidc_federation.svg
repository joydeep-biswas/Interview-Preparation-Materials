<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1140" height="560" rx="10" fill="url(#bg)"/>
  <rect width="1140" height="560" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="570" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">Azure Workload Identity: Passwordless OIDC Cloud Federation</text>
  <text x="570" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">Kubernetes Projected ServiceAccount Tokens -&gt; Microsoft Entra ID (Azure AD) Federation -&gt; Azure Key Vault Access</text>
  <line x1="40" y1="68" x2="1100" y2="68" stroke="#334155" stroke-width="1"/>

  <!-- Actor 1: Java Pod on AKS -->
  <rect x="60" y="95" width="220" height="45" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="170" y="122" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">Java Pod on AKS</text>
  <line x1="170" y1="140" x2="170" y2="490" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Actor 2: K8s API Server -->
  <rect x="360" y="95" width="220" height="45" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="470" y="122" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">K8s API Server (OIDC Issuer)</text>
  <line x1="470" y1="140" x2="470" y2="490" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Actor 3: Entra ID (Azure AD) -->
  <rect x="650" y="95" width="220" height="45" rx="6" fill="#1E293B" stroke="#C084FC" stroke-width="1.5"/>
  <text x="760" y="122" font-size="11" font-weight="700" fill="#C084FC" text-anchor="middle">Microsoft Entra ID (Azure AD)</text>
  <line x1="760" y1="140" x2="760" y2="490" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Actor 4: Azure Key Vault -->
  <rect x="940" y="95" width="160" height="45" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="1020" y="122" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="middle">Azure Key Vault</text>
  <line x1="1020" y1="140" x2="1020" y2="490" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Step 1: Injected Token Request -->
  <path fill="none" d="M 170 170 L 470 170" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>
  <text x="320" y="162" font-size="9" fill="#7DD3FC" text-anchor="middle">1. Request projected ServiceAccount token</text>

  <path fill="none" d="M 470 205 L 170 205" stroke="#34D399" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-g)"/>
  <text x="320" y="197" font-size="9" fill="#34D399" text-anchor="middle">2. Mounts signed K8s JWT token at /var/run/secrets/tokens</text>

  <!-- Step 2: Token Exchange with Entra ID -->
  <path fill="none" d="M 170 250 L 760 250" stroke="#C084FC" stroke-width="2" marker-end="url(#arr-p)"/>
  <text x="465" y="242" font-size="9" font-weight="700" fill="#C084FC" text-anchor="middle">3. Exchange K8s JWT for Azure AD Access Token (OIDC Federation)</text>

  <!-- Step 3: Entra ID validates with K8s -->
  <path fill="none" d="M 760 285 L 470 285" stroke="#C084FC" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-p)"/>
  <text x="615" y="277" font-size="8" fill="#DDD6FE" text-anchor="middle">4. Validates JWT signature against K8s JWKS OIDC endpoint</text>

  <!-- Step 4: Returns Entra ID Token -->
  <path fill="none" d="M 760 325 L 170 325" stroke="#34D399" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arr-g)"/>
  <text x="465" y="317" font-size="9" font-weight="700" fill="#34D399" text-anchor="middle">5. Returns Azure AD Bearer Access Token (Scoped to Key Vault)</text>

  <!-- Step 5: Read Secret -->
  <path fill="none" d="M 170 375 L 1020 375" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr-a)"/>
  <text x="595" y="367" font-size="9" font-weight="700" fill="#FBBF24" text-anchor="middle">6. GET /secrets/db-password (Authorization: Bearer &lt;AzureADToken&gt;)</text>

  <!-- Step 6: Return Secret Value -->
  <path fill="none" d="M 1020 415 L 170 415" stroke="#34D399" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arr-g)"/>
  <text x="595" y="407" font-size="9" font-weight="700" fill="#34D399" text-anchor="middle">7. Returns decrypted secret value (Plaintext DB Password)</text>

  <rect x="250" y="440" width="680" height="35" rx="4" fill="#06201B" stroke="#10B981" stroke-width="1"/>
  <text x="590" y="462" font-size="9" font-weight="700" fill="#6EE7B7" text-anchor="middle">&#x2714; Zero Hardcoded Secrets: No static client IDs or secrets stored in Git or K8s Secret manifests!</text>

  <!-- Bottom Invariant -->
  <rect x="50" y="515" width="1040" height="30" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="570" y="535" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Zero-Trust Credential Standard: Workload Identity eliminates static secrets. Tokens are cryptographically bound to pod lifecycles and expire automatically in 1 hour.</text>
</svg>