<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1180" height="520" rx="10" fill="url(#bg)"/>
  <rect width="1180" height="520" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="590" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">GitOps Declarative Delivery: Automated Reconciliation via ArgoCD</text>
  <text x="590" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">Git Repository (Single Source of Truth) &lt;-&gt; In-Cluster ArgoCD Agent -&gt; Continuous Drift Detection &amp; Self-Healing</text>
  <line x1="40" y1="68" x2="1140" y2="68" stroke="#334155" stroke-width="1"/>

  <!-- Developer &amp; Git Repository -->
  <rect x="40" y="105" width="340" height="340" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="40" y="105" width="340" height="30" rx="8" fill="#0C4A6E"/>
  <text x="210" y="125" font-size="11" font-weight="700" fill="#7DD3FC" text-anchor="middle">1. Git Source of Truth</text>

  <rect x="60" y="150" width="300" height="75" rx="6" fill="#1E293B" stroke="#38BDF8"/>
  <text x="210" y="172" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">Developer Workflow</text>
  <text x="75" y="195" font-size="8" fill="#CBD5E1">&#x2022; Feature branch &#x2192; PR &#x2192; Code Review</text>
  <text x="75" y="210" font-size="8" fill="#34D399">&#x2714; Merge commit to main branch</text>

  <rect x="60" y="240" width="300" height="185" rx="6" fill="#0F172A" stroke="#0284C7"/>
  <text x="210" y="265" font-size="10" font-weight="700" fill="#7DD3FC" text-anchor="middle">Git Repository (Declarative Manifests)</text>
  <text x="75" y="290" font-size="8" fill="#CBD5E1">&#x2022; Helm Charts / Kustomize Overlays</text>
  <text x="75" y="310" font-size="8" fill="#CBD5E1">&#x2022; Version-controlled environment configs:</text>
  <text x="85" y="328" font-size="8" font-family="'JetBrains Mono', monospace" fill="#FDE68A">env/dev/deployment.yaml</text>
  <text x="85" y="345" font-size="8" font-family="'JetBrains Mono', monospace" fill="#FDE68A">env/prod/deployment.yaml</text>
  <text x="75" y="375" font-size="8" font-weight="700" fill="#34D399">&#x2714; Complete audit trail of who changed what and when</text>
  <text x="75" y="400" font-size="8" fill="#CBD5E1">&#x2022; Rollback = standard <tspan font-family="'JetBrains Mono', monospace" fill="#7DD3FC">git revert</tspan></text>

  <!-- In-Cluster ArgoCD Controller -->
  <rect x="420" y="105" width="720" height="340" rx="8" fill="#06201B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="420" y="105" width="720" height="30" rx="8" fill="#064E3B"/>
  <text x="780" y="125" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">2. Target Kubernetes Cluster: ArgoCD Control Loop</text>

  <!-- ArgoCD Engine -->
  <rect x="440" y="150" width="320" height="275" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="600" y="175" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">ArgoCD Controller (In-Cluster)</text>
  
  <rect x="455" y="195" width="290" height="50" rx="4" fill="#1E293B" stroke="#10B981"/>
  <text x="465" y="215" font-size="8" font-weight="700" fill="#6EE7B7">1. Continuous Polling &amp; Webhook:</text>
  <text x="465" y="232" font-size="8" fill="#CBD5E1">Polls Git repo every 3m (or instant webhook push)</text>

  <rect x="455" y="255" width="290" height="50" rx="4" fill="#1E293B" stroke="#38BDF8"/>
  <text x="465" y="275" font-size="8" font-weight="700" fill="#7DD3FC">2. Live State Comparison:</text>
  <text x="465" y="292" font-size="8" fill="#CBD5E1">Inspects live pods, services &amp; ingress in etcd</text>

  <rect x="455" y="315" width="290" height="95" rx="4" fill="#1E293B" stroke="#F59E0B"/>
  <text x="465" y="335" font-size="8" font-weight="700" fill="#FBBF24">3. Drift Detection &amp; Self-Healing:</text>
  <text x="465" y="352" font-size="8" fill="#CBD5E1">&#x2022; Detects manual ad-hoc <tspan font-family="'JetBrains Mono', monospace" fill="#FCA5A5">kubectl edit</tspan></text>
  <text x="465" y="372" font-size="8" fill="#34D399">&#x2714; Auto-reverts unauthorized live changes!</text>
  <text x="465" y="392" font-size="8" fill="#A7F3D0">&#x2022; Overwrites cluster back to Git target state</text>

  <!-- Live Cluster Workloads -->
  <rect x="790" y="150" width="330" height="275" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="955" y="175" font-size="11" font-weight="700" fill="#E2E8F0" text-anchor="middle">Live Cluster Workloads</text>

  <rect x="805" y="195" width="300" height="60" rx="4" fill="#06201B" stroke="#10B981"/>
  <text x="815" y="218" font-size="9" font-weight="700" fill="#34D399">Deployments &amp; Pods:</text>
  <text x="815" y="238" font-size="8" fill="#CBD5E1">order-service:v2.1.0 (3 Replicas)</text>

  <rect x="805" y="265" width="300" height="60" rx="4" fill="#06201B" stroke="#10B981"/>
  <text x="815" y="288" font-size="9" font-weight="700" fill="#34D399">ClusterIP Services &amp; Ingress:</text>
  <text x="815" y="308" font-size="8" fill="#CBD5E1">order-service:80 &#x2192; /api/v1/orders</text>

  <rect x="805" y="335" width="300" height="75" rx="4" fill="#0F172A" stroke="#334155"/>
  <text x="815" y="358" font-size="8" font-weight="700" fill="#CBD5E1">Security Principle:</text>
  <text x="815" y="378" font-size="8" fill="#34D399">&#x2714; Zero human kubectl access to prod</text>
  <text x="815" y="395" font-size="8" fill="#94A3B8">Engineers only touch Git pull requests</text>

  <!-- Connectors -->
  <path fill="none" d="M 360.0 275.0 L 370.0 275.0 C 398.0 275.0, 398.0 220.0, 426.0 220.0 L 440.0 220.0" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>
  <path fill="none" d="M 760 280 L 790 280" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- Bottom Invariant -->
  <rect x="40" y="475" width="1100" height="30" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="590" y="495" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">GitOps Security Invariant: The cluster pulls changes from Git via an in-cluster agent (ArgoCD). No CI server needs admin cluster credentials, closing external attack vectors.</text>
</svg>