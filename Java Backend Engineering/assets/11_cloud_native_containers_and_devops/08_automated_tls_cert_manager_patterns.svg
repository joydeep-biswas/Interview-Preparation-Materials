<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1200" height="520" rx="10" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="600" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">Automated TLS Certificate Management in Kubernetes</text>
  <text x="600" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">Pattern A: ACME cert-manager (Let's Encrypt Ingress) vs. Pattern B: Azure Key Vault CSI Driver (Enterprise PKI)</text>
  <line x1="40" y1="68" x2="1160" y2="68" stroke="#334155" stroke-width="1"/>

  <!-- Left Side: Pattern A -->
  <rect x="40" y="105" width="530" height="360" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="40" y="105" width="530" height="30" rx="8" fill="#0C4A6E" stroke="#0284C7" stroke-width="1"/>
  <text x="305" y="125" font-size="11" font-weight="700" fill="#7DD3FC" text-anchor="middle">Pattern A: cert-manager (Let's Encrypt / ACME)</text>

  <rect x="60" y="150" width="490" height="65" rx="6" fill="#1E293B" stroke="#38BDF8"/>
  <text x="305" y="172" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">Ingress Resource Annotation</text>
  <text x="75" y="195" font-size="8" font-family="'JetBrains Mono', monospace" fill="#FDE68A">cert-manager.io/cluster-issuer: letsencrypt-prod</text>

  <rect x="60" y="230" width="230" height="95" rx="6" fill="#0F172A" stroke="#0284C7"/>
  <text x="175" y="255" font-size="10" font-weight="700" fill="#7DD3FC" text-anchor="middle">cert-manager Controller</text>
  <text x="75" y="278" font-size="8" fill="#CBD5E1">&#x2022; Watches Ingress resources</text>
  <text x="75" y="295" font-size="8" fill="#CBD5E1">&#x2022; Initiates ACME Challenge</text>
  <text x="75" y="312" font-size="8" fill="#34D399">&#x2714; Automatic 60-day renewal</text>

  <rect x="320" y="230" width="230" height="95" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="435" y="255" font-size="10" font-weight="700" fill="#E2E8F0" text-anchor="middle">Let's Encrypt ACME Server</text>
  <text x="335" y="278" font-size="8" fill="#CBD5E1">&#x2022; Solves HTTP-01 / DNS-01</text>
  <text x="335" y="295" font-size="8" fill="#CBD5E1">&#x2022; Validates domain control</text>
  <text x="335" y="312" font-size="8" fill="#34D399">&#x2714; Emits signed X.509 cert</text>

  <path fill="none" d="M 290 277 L 320 277" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <rect x="60" y="340" width="490" height="105" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="305" y="362" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">Kubernetes TLS Secret &amp; Ingress Termination</text>
  <text x="75" y="385" font-size="8" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">Secret Type: kubernetes.io/tls (tls.crt &amp; tls.key)</text>
  <text x="75" y="405" font-size="8" fill="#CBD5E1">&#x2022; Ingress controller hot-reloads certificates with ZERO downtime</text>
  <text x="75" y="425" font-size="8" fill="#34D399">&#x2714; Ideal for public internet web and mobile endpoints</text>

  <!-- Connectors A -->
  <path fill="none" d="M 175 215 L 175 230" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>
  <path fill="none" d="M 175 325 L 175 340" stroke="#10B981" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- Right Side: Pattern B -->
  <rect x="610" y="105" width="550" height="360" rx="8" fill="#06201B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="610" y="105" width="550" height="30" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="885" y="125" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">Pattern B: Azure Key Vault CSI Driver (Enterprise PKI)</text>

  <rect x="630" y="150" width="510" height="65" rx="6" fill="#1E293B" stroke="#10B981"/>
  <text x="885" y="172" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">Enterprise Azure Key Vault</text>
  <text x="645" y="195" font-size="8" fill="#CBD5E1">&#x2022; Corporate CA signed wildcard cert (*.corp.internal) auto-rotated by IT security</text>

  <rect x="630" y="230" width="240" height="95" rx="6" fill="#0F172A" stroke="#10B981"/>
  <text x="750" y="255" font-size="10" font-weight="700" fill="#6EE7B7" text-anchor="middle">Secrets Store CSI Driver</text>
  <text x="645" y="278" font-size="8" fill="#CBD5E1">&#x2022; Authenticates via Azure</text>
  <text x="645" y="295" font-size="8" fill="#CBD5E1">  Workload Identity (OIDC)</text>
  <text x="645" y="312" font-size="8" fill="#34D399">&#x2714; Zero credentials in K8s</text>

  <rect x="890" y="230" width="250" height="95" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="1015" y="255" font-size="10" font-weight="700" fill="#E2E8F0" text-anchor="middle">In-Memory tmpfs Volume</text>
  <text x="905" y="278" font-size="8" fill="#CBD5E1">&#x2022; Mounted inside Java Pod</text>
  <text x="905" y="295" font-size="8" fill="#CBD5E1">&#x2022; Stored in RAM, never on disk</text>
  <text x="905" y="312" font-size="8" fill="#34D399">&#x2714; Pure hardware isolation</text>

  <path fill="none" d="M 870 277 L 890 277" stroke="#10B981" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <rect x="630" y="340" width="510" height="105" rx="6" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="885" y="362" font-size="10" font-weight="700" fill="#C4B5FD" text-anchor="middle">Spring Boot KeyStore Integration (mTLS / Internal TLS)</text>
  <text x="645" y="385" font-size="8" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">server.ssl.key-store: /mnt/secrets-store/keystore.p12</text>
  <text x="645" y="405" font-size="8" fill="#CBD5E1">&#x2022; CSI driver automatically rotates mounted cert when updated in Azure Key Vault</text>
  <text x="645" y="425" font-size="8" fill="#34D399">&#x2714; Ideal for zero-trust pod-to-pod and partner mTLS traffic</text>

  <!-- Connectors B -->
  <path fill="none" d="M 750 215 L 750 230" stroke="#10B981" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <path fill="none" d="M 750 325 L 750 340" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arr-p)"/>

  <!-- Bottom Invariant -->
  <rect x="40" y="480" width="1120" height="25" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="600" y="497" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Security Standard: Never hardcode TLS certificates or private keys in Git repositories or container image layers. Automate renewals via cert-manager or Key Vault CSI.</text>
</svg>