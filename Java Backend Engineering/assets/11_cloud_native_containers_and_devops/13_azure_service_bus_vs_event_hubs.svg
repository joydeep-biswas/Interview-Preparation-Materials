<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1140" height="480" rx="10" fill="url(#bg)"/>
  <rect width="1140" height="480" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="570" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">Azure Service Bus vs. Azure Event Hubs: Architectural Comparison</text>
  <text x="570" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">Individual Message Broker (Smart Broker, Dumb Consumer) vs. Partitioned Append-Only Log (Dumb Broker, Smart Consumer)</text>
  <line x1="40" y1="68" x2="1100" y2="68" stroke="#334155" stroke-width="1"/>

  <!-- Left Side: Azure Service Bus -->
  <rect x="50" y="105" width="480" height="325" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="50" y="105" width="480" height="30" rx="8" fill="#0C4A6E" stroke="#0284C7" stroke-width="1"/>
  <text x="290" y="125" font-size="11" font-weight="700" fill="#7DD3FC" text-anchor="middle">Azure Service Bus: Enterprise Message Broker</text>

  <!-- Flow in Service Bus -->
  <rect x="70" y="150" width="130" height="50" rx="4" fill="#1E293B" stroke="#38BDF8"/>
  <text x="135" y="180" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">Producer App</text>

  <rect x="235" y="145" width="130" height="60" rx="4" fill="#0F172A" stroke="#0284C7" stroke-width="1.5"/>
  <text x="300" y="170" font-size="10" font-weight="700" fill="#CBD5E1" text-anchor="middle">Service Bus Queue</text>
  <text x="300" y="190" font-size="8" fill="#94A3B8" text-anchor="middle">[Msg 1] [Msg 2]</text>

  <rect x="400" y="150" width="110" height="50" rx="4" fill="#1E293B" stroke="#10B981"/>
  <text x="455" y="180" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">Consumer Pod</text>

  <path fill="none" d="M 200 175 L 235 175" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>
  <path fill="none" d="M 365 175 L 400 175" stroke="#10B981" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <rect x="70" y="225" width="440" height="190" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="85" y="250" font-size="10" font-weight="700" fill="#F8FAFC">Smart Broker / Dumb Consumer Model:</text>
  <text x="85" y="272" font-size="9" fill="#CBD5E1">&#x2022; <tspan font-weight="700" fill="#38BDF8">Destructive Read:</tspan> Broker deletes message upon Complete()</text>
  <text x="85" y="295" font-size="9" fill="#CBD5E1">&#x2022; <tspan font-weight="700" fill="#FDE68A">Rich Semantics:</tspan> Sessions (FIFO), Dead-Letter Queue (DLQ)</text>
  <text x="85" y="318" font-size="9" fill="#CBD5E1">&#x2022; Message Deferral, Scheduled Delivery &amp; Transactions</text>
  <text x="85" y="342" font-size="9" fill="#34D399">&#x2714; Best For: Financial transactions, order workflows, asynchronous commands</text>
  <text x="85" y="365" font-size="8" fill="#FCA5A5">&#x26A0; Throughput: Thousands of msgs/sec (High latency per message)</text>

  <!-- Right Side: Azure Event Hubs -->
  <rect x="610" y="105" width="480" height="325" rx="8" fill="#06201B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="610" y="105" width="480" height="30" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="850" y="125" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">Azure Event Hubs: Big Data Streaming Engine</text>

  <!-- Flow in Event Hubs -->
  <rect x="630" y="150" width="130" height="50" rx="4" fill="#1E293B" stroke="#38BDF8"/>
  <text x="695" y="180" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">IoT / Telemetry</text>

  <rect x="795" y="145" width="130" height="60" rx="4" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="860" y="170" font-size="10" font-weight="700" fill="#6EE7B7" text-anchor="middle">Partitions (0, 1, 2)</text>
  <text x="860" y="190" font-size="8" fill="#A7F3D0" text-anchor="middle">Append-Only Log</text>

  <rect x="960" y="150" width="110" height="50" rx="4" fill="#1E293B" stroke="#F59E0B"/>
  <text x="1015" y="180" font-size="10" font-weight="700" fill="#FBBF24" text-anchor="middle">Analytics Group</text>

  <path fill="none" d="M 760 175 L 795 175" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>
  <path fill="none" d="M 925 175 L 960 175" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arr-a)"/>

  <rect x="630" y="225" width="440" height="190" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="645" y="250" font-size="10" font-weight="700" fill="#F8FAFC">Dumb Broker / Smart Consumer Model:</text>
  <text x="645" y="272" font-size="9" fill="#CBD5E1">&#x2022; <tspan font-weight="700" fill="#6EE7B7">Non-Destructive Read:</tspan> Messages immutable based on retention period</text>
  <text x="645" y="295" font-size="9" fill="#CBD5E1">&#x2022; <tspan font-weight="700" fill="#A7F3D0">Kafka API Compatible:</tspan> Supports standard Kafka producers &amp; consumers</text>
  <text x="645" y="318" font-size="9" fill="#CBD5E1">&#x2022; Multiple independent consumer groups read at their own pace</text>
  <text x="645" y="342" font-size="9" fill="#34D399">&#x2714; Best For: Telemetry ingestion, IoT sensors, clickstreams, audit logs</text>
  <text x="645" y="365" font-size="8" fill="#34D399">&#x2714; Throughput: Millions of events/sec at sub-millisecond latency</text>

  <!-- Bottom Invariant Banner -->
  <rect x="50" y="445" width="1040" height="25" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="570" y="462" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Selection Metric: If you need individual message routing, peek-lock, sessions, or dead-letter queues, choose Service Bus. If you need raw streaming throughput &gt;100k events/sec, choose Event Hubs.</text>
</svg>