<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1140" height="500" rx="10" fill="url(#bg)"/>
  <rect width="1140" height="500" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="570" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">Virtual Machine vs. Container Architecture</text>
  <text x="570" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">Hardware Hypervisor Virtualization (GB Footprint, Full OS) vs. Linux OS-Level Virtualization (MB Footprint, Shared Kernel)</text>
  <line x1="40" y1="68" x2="1100" y2="68" stroke="#334155" stroke-width="1"/>

  <!-- Left: Virtual Machines -->
  <rect x="50" y="105" width="480" height="340" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="50" y="105" width="480" height="30" rx="8" fill="#0C4A6E"/>
  <text x="290" y="125" font-size="11" font-weight="700" fill="#7DD3FC" text-anchor="middle">Virtual Machines (Hardware Virtualization)</text>

  <!-- App Stack VM 1 &amp; 2 -->
  <rect x="75" y="150" width="200" height="150" rx="6" fill="#1E293B" stroke="#38BDF8"/>
  <text x="175" y="172" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">Guest VM 1 (Order Svc)</text>
  <rect x="85" y="185" width="180" height="25" rx="3" fill="#0F172A"/>
  <text x="175" y="201" font-size="8" fill="#CBD5E1" text-anchor="middle">Spring Boot App 1</text>
  <rect x="85" y="215" width="180" height="25" rx="3" fill="#0F172A"/>
  <text x="175" y="231" font-size="8" fill="#CBD5E1" text-anchor="middle">System Libs &amp; JRE</text>
  <rect x="85" y="245" width="180" height="40" rx="3" fill="#1C1917" stroke="#EF4444"/>
  <text x="175" y="262" font-size="8" font-weight="700" fill="#F87171" text-anchor="middle">Guest OS Kernel (Ubuntu)</text>
  <text x="175" y="277" font-size="7" fill="#FCA5A5" text-anchor="middle">2 GB - 10 GB overhead!</text>

  <rect x="305" y="150" width="200" height="150" rx="6" fill="#1E293B" stroke="#38BDF8"/>
  <text x="405" y="172" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">Guest VM 2 (Payment Svc)</text>
  <rect x="315" y="185" width="180" height="25" rx="3" fill="#0F172A"/>
  <text x="405" y="201" font-size="8" fill="#CBD5E1" text-anchor="middle">Spring Boot App 2</text>
  <rect x="315" y="215" width="180" height="25" rx="3" fill="#0F172A"/>
  <text x="405" y="231" font-size="8" fill="#CBD5E1" text-anchor="middle">System Libs &amp; JRE</text>
  <rect x="315" y="245" width="180" height="40" rx="3" fill="#1C1917" stroke="#EF4444"/>
  <text x="405" y="262" font-size="8" font-weight="700" fill="#F87171" text-anchor="middle">Guest OS Kernel (Ubuntu)</text>
  <text x="405" y="277" font-size="7" fill="#FCA5A5" text-anchor="middle">2 GB - 10 GB overhead!</text>

  <!-- Hypervisor &amp; Hardware -->
  <rect x="75" y="315" width="430" height="40" rx="4" fill="#0F172A" stroke="#0284C7"/>
  <text x="290" y="338" font-size="10" font-weight="700" fill="#7DD3FC" text-anchor="middle">Hypervisor (KVM / ESXi / Hyper-V)</text>

  <rect x="75" y="365" width="430" height="40" rx="4" fill="#1E293B" stroke="#334155"/>
  <text x="290" y="388" font-size="10" font-weight="700" fill="#CBD5E1" text-anchor="middle">Physical Server (Bare Metal Hardware)</text>

  <text x="290" y="425" font-size="8" fill="#FCA5A5" text-anchor="middle">&#x26A0; High RAM overhead, slow minutes-long boot time, heavy I/O virtualization</text>

  <!-- Right: Containers -->
  <rect x="610" y="105" width="480" height="340" rx="8" fill="#06201B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="610" y="105" width="480" height="30" rx="8" fill="#064E3B"/>
  <text x="850" y="125" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">Containers (OS-Level Virtualization)</text>

  <!-- Container 1 &amp; 2 -->
  <rect x="635" y="150" width="200" height="150" rx="6" fill="#1E293B" stroke="#10B981"/>
  <text x="735" y="172" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">Container 1 (Order Svc)</text>
  <rect x="645" y="185" width="180" height="30" rx="3" fill="#0F172A"/>
  <text x="735" y="204" font-size="8" fill="#CBD5E1" text-anchor="middle">Spring Boot App 1</text>
  <rect x="645" y="225" width="180" height="30" rx="3" fill="#0F172A"/>
  <text x="735" y="244" font-size="8" fill="#CBD5E1" text-anchor="middle">Minified JRE (100 MB)</text>
  <rect x="645" y="265" width="180" height="25" rx="3" fill="#06201B" stroke="#10B981"/>
  <text x="735" y="281" font-size="7" font-weight="700" fill="#34D399" text-anchor="middle">Distroless RootFS (20 MB)</text>

  <rect x="865" y="150" width="200" height="150" rx="6" fill="#1E293B" stroke="#10B981"/>
  <text x="965" y="172" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">Container 2 (Payment Svc)</text>
  <rect x="875" y="185" width="180" height="30" rx="3" fill="#0F172A"/>
  <text x="965" y="204" font-size="8" fill="#CBD5E1" text-anchor="middle">Spring Boot App 2</text>
  <rect x="875" y="225" width="180" height="30" rx="3" fill="#0F172A"/>
  <text x="965" y="244" font-size="8" fill="#CBD5E1" text-anchor="middle">Minified JRE (100 MB)</text>
  <rect x="875" y="265" width="180" height="25" rx="3" fill="#06201B" stroke="#10B981"/>
  <text x="965" y="281" font-size="7" font-weight="700" fill="#34D399" text-anchor="middle">Distroless RootFS (20 MB)</text>

  <!-- Container Runtime &amp; Shared Linux Kernel -->
  <rect x="635" y="315" width="430" height="40" rx="4" fill="#0F172A" stroke="#10B981"/>
  <text x="850" y="338" font-size="10" font-weight="700" fill="#6EE7B7" text-anchor="middle">Container Runtime Engine (containerd / runc)</text>

  <rect x="635" y="365" width="430" height="40" rx="4" fill="#1E293B" stroke="#10B981"/>
  <text x="850" y="388" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">Shared Host Linux Kernel (Namespaces &amp; cgroups)</text>

  <text x="850" y="425" font-size="8" fill="#34D399" text-anchor="middle">&#x2714; Sub-second startup, native bare-metal execution performance, 90% less RAM</text>

  <!-- Bottom Invariant Banner -->
  <rect x="50" y="460" width="1040" height="25" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="570" y="477" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Architectural Principle: Containers do NOT run guest operating systems. They are isolated host processes sharing the host Linux kernel directly.</text>
</svg>