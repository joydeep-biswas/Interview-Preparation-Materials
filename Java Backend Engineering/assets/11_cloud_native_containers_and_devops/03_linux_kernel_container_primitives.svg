<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1200" height="520" rx="10" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="600" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">Linux Kernel Container Primitives: Namespaces, Cgroups &amp; OverlayFS</text>
  <text x="600" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">The Three Pillars of Containerization: Namespaces (Isolation), Control Groups (Resource Quotas), and OverlayFS (Layered Storage)</text>
  <line x1="40" y1="68" x2="1160" y2="68" stroke="#334155" stroke-width="1"/>

  <!-- Pillar 1: Namespaces -->
  <rect x="40" y="105" width="350" height="360" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="40" y="105" width="350" height="30" rx="8" fill="#0C4A6E"/>
  <text x="215" y="125" font-size="11" font-weight="700" fill="#7DD3FC" text-anchor="middle">1. Namespaces (Visibility &amp; Boundary)</text>

  <rect x="55" y="150" width="320" height="295" rx="6" fill="#0F172A" stroke="#0284C7" stroke-width="1"/>
  <text x="70" y="175" font-size="10" font-weight="700" fill="#38BDF8">Six Primary Kernel Namespaces:</text>

  <text x="70" y="200" font-size="9" font-weight="700" fill="#E2E8F0">&#x2022; PID (Process IDs):</text>
  <text x="85" y="217" font-size="8" fill="#CBD5E1">Container process thinks it is PID 1; mapped to host PID 14920.</text>

  <text x="70" y="240" font-size="9" font-weight="700" fill="#E2E8F0">&#x2022; NET (Network):</text>
  <text x="85" y="257" font-size="8" fill="#CBD5E1">Dedicated veth pair, loopback interface, private port range (8080).</text>

  <text x="70" y="280" font-size="9" font-weight="700" fill="#E2E8F0">&#x2022; MNT (Mount):</text>
  <text x="85" y="297" font-size="8" fill="#CBD5E1">Isolated filesystem rootfs; cannot see host /etc, /root, /var.</text>

  <text x="70" y="320" font-size="9" font-weight="700" fill="#E2E8F0">&#x2022; IPC (Inter-Process Comm):</text>
  <text x="85" y="337" font-size="8" fill="#CBD5E1">Isolated shared memory segments (POSIX / SysV IPC) &amp; message queues.</text>

  <text x="70" y="360" font-size="9" font-weight="700" fill="#E2E8F0">&#x2022; UTS (Hostnames):</text>
  <text x="85" y="377" font-size="8" fill="#CBD5E1">Independent hostname (e.g. order-service-pod-1) and domain.</text>

  <text x="70" y="400" font-size="9" font-weight="700" fill="#E2E8F0">&#x2022; USER (User &amp; Group IDs):</text>
  <text x="85" y="417" font-size="8" fill="#34D399">&#x2714; Maps container root (UID 0) to unprivileged host user (UID 10001)!</text>

  <!-- Pillar 2: Cgroups -->
  <rect x="425" y="105" width="350" height="360" rx="8" fill="#1C1917" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="425" y="105" width="350" height="30" rx="8" fill="#78350F"/>
  <text x="600" y="125" font-size="11" font-weight="700" fill="#FDE68A" text-anchor="middle">2. Control Groups (cgroups v2 Quotas)</text>

  <rect x="440" y="150" width="320" height="295" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
  <text x="455" y="175" font-size="10" font-weight="700" fill="#FBBF24">Resource Allocation &amp; Limits:</text>

  <text x="455" y="200" font-size="9" font-weight="700" fill="#E2E8F0">&#x2022; CPU Quota (CFS Bandwidth):</text>
  <text x="470" y="217" font-size="8" font-family="'JetBrains Mono', monospace" fill="#FDE68A">cpu.max = "100000 100000" (1 Core)</text>
  <text x="470" y="234" font-size="8" fill="#CBD5E1">Linux Completely Fair Scheduler throttles CPU if exceeded (Throttling).</text>

  <text x="455" y="260" font-size="9" font-weight="700" fill="#E2E8F0">&#x2022; Memory Hard Ceiling:</text>
  <text x="470" y="277" font-size="8" font-family="'JetBrains Mono', monospace" fill="#F87171">memory.max = 1073741824 (1 GB)</text>
  <text x="470" y="294" font-size="8" fill="#FCA5A5">Exceeding this causes kernel to invoke OOM Killer!</text>
  <text x="470" y="310" font-size="8" font-weight="700" fill="#EF4444">&#x2718; Sends SIGKILL (Exit code 137)</text>

  <text x="455" y="335" font-size="9" font-weight="700" fill="#E2E8F0">&#x2022; BlkIO (Disk Read/Write Throughput):</text>
  <text x="470" y="352" font-size="8" fill="#CBD5E1">Caps IOPS and disk write bytes/sec so noisy neighbors cannot freeze disk.</text>

  <text x="455" y="380" font-size="9" font-weight="700" fill="#34D399">&#x2714; JVM Integration (Java 11+):</text>
  <text x="470" y="398" font-size="8" fill="#CBD5E1">JVM queries <tspan font-family="'JetBrains Mono', monospace" fill="#7DD3FC">/sys/fs/cgroup/memory.max</tspan> automatically</text>
  <text x="470" y="414" font-size="8" fill="#CBD5E1">Sets MaxHeap based on container ceiling, not host physical RAM!</text>

  <!-- Pillar 3: OverlayFS -->
  <rect x="810" y="105" width="350" height="360" rx="8" fill="#06201B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="810" y="105" width="350" height="30" rx="8" fill="#064E3B"/>
  <text x="985" y="125" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">3. OverlayFS (Copy-on-Write Storage)</text>

  <rect x="825" y="150" width="320" height="295" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="840" y="175" font-size="10" font-weight="700" fill="#34D399">Layered Union Filesystem:</text>

  <!-- Overlay Layers -->
  <rect x="840" y="195" width="290" height="40" rx="4" fill="#1C1917" stroke="#EF4444"/>
  <text x="985" y="213" font-size="8" font-weight="700" fill="#F87171" text-anchor="middle">Container Layer (UpperDir: Read / Write)</text>
  <text x="985" y="227" font-size="7" fill="#CBD5E1" text-anchor="middle">Ephemeral writes, logs, temp files; wiped when container deleted</text>

  <rect x="840" y="245" width="290" height="35" rx="4" fill="#1E293B" stroke="#334155"/>
  <text x="985" y="262" font-size="8" font-weight="700" fill="#CBD5E1" text-anchor="middle">Image Layer 3: Application JAR (Read-Only)</text>
  <text x="985" y="274" font-size="7" fill="#94A3B8" text-anchor="middle">app.jar (30 MB)</text>

  <rect x="840" y="290" width="290" height="35" rx="4" fill="#1E293B" stroke="#334155"/>
  <text x="985" y="307" font-size="8" font-weight="700" fill="#CBD5E1" text-anchor="middle">Image Layer 2: Custom JRE Binaries (Read-Only)</text>
  <text x="985" y="319" font-size="7" fill="#94A3B8" text-anchor="middle">java executable, modules (90 MB)</text>

  <rect x="840" y="335" width="290" height="35" rx="4" fill="#06201B" stroke="#10B981"/>
  <text x="985" y="352" font-size="8" font-weight="700" fill="#34D399" text-anchor="middle">Base Layer 1: Distroless Linux RootFS (Read-Only)</text>
  <text x="985" y="364" font-size="7" fill="#A7F3D0" text-anchor="middle">libc, ssl certs, tzdata (20 MB)</text>

  <text x="840" y="395" font-size="8" font-weight="700" fill="#6EE7B7">Copy-on-Write (CoW) Benefit:</text>
  <text x="840" y="412" font-size="8" fill="#CBD5E1">All containers on the same node share the read-only layers in memory.</text>
  <text x="840" y="428" font-size="8" fill="#CBD5E1">Zero storage duplication across 100 running instances!</text>

  <!-- Bottom Invariant -->
  <rect x="40" y="480" width="1120" height="25" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="600" y="497" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Container Definition: A container is simply a Linux process wrapped in Namespaces for privacy, restricted by Cgroups for fairness, and mounted via OverlayFS for storage efficiency.</text>
</svg>