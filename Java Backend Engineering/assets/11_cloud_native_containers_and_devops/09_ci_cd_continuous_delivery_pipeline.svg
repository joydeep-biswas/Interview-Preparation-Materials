<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1220" height="520" rx="10" fill="url(#bg)"/>
  <rect width="1220" height="520" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="610" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">Continuous Integration (CI) vs. Delivery vs. Deployment (CD)</text>
  <text x="610" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">Automated Quality Gates, OCI Packaging, Staging Verification, and Zero-Touch Automated Production Releases</text>
  <line x1="40" y1="68" x2="1180" y2="68" stroke="#334155" stroke-width="1"/>

  <!-- Phase 1: CI -->
  <rect x="40" y="105" width="350" height="360" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="40" y="105" width="350" height="30" rx="8" fill="#0C4A6E"/>
  <text x="215" y="125" font-size="11" font-weight="700" fill="#7DD3FC" text-anchor="middle">1. Continuous Integration (CI)</text>

  <rect x="55" y="150" width="320" height="60" rx="6" fill="#1E293B" stroke="#38BDF8"/>
  <text x="215" y="172" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">Developer Git Push / PR</text>
  <text x="70" y="195" font-size="8" fill="#CBD5E1">Fires GitHub Actions / Azure DevOps Pipeline</text>

  <rect x="55" y="225" width="320" height="135" rx="6" fill="#0F172A" stroke="#0284C7"/>
  <text x="215" y="247" font-size="10" font-weight="700" fill="#7DD3FC" text-anchor="middle">Automated Build &amp; Test Suite</text>
  <text x="70" y="270" font-size="8" fill="#CBD5E1">&#x2022; Maven compile &amp; dependency resolution</text>
  <text x="70" y="288" font-size="8" fill="#CBD5E1">&#x2022; Unit Tests (JUnit 5 + Mockito)</text>
  <text x="70" y="306" font-size="8" fill="#CBD5E1">&#x2022; Integration Tests via <tspan fill="#34D399" font-weight="700">Testcontainers</tspan> (Real PostgreSQL/Redis)</text>
  <text x="70" y="324" font-size="8" fill="#34D399">&#x2022; SonarQube Code Quality &amp; 80%+ Coverage Gate</text>
  <text x="70" y="342" font-size="8" fill="#FCA5A5">&#x2022; Trivy CVE Vulnerability Scan (Zero Criticals)</text>

  <rect x="55" y="375" width="320" height="70" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="215" y="398" font-size="10" font-weight="700" fill="#F8FAFC" text-anchor="middle">OCI Artifact Publish</text>
  <text x="70" y="420" font-size="8" fill="#CBD5E1">&#x2022; Docker build distroless image &amp; push to ACR with git SHA tag</text>

  <path fill="none" d="M 215 210 L 215 225" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>
  <path fill="none" d="M 215 360 L 215 375" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <!-- Phase 2: Continuous Delivery -->
  <rect x="435" y="105" width="350" height="360" rx="8" fill="#06201B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="435" y="105" width="350" height="30" rx="8" fill="#064E3B"/>
  <text x="610" y="125" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">2. Continuous Delivery (CD)</text>

  <rect x="450" y="150" width="320" height="70" rx="6" fill="#1E293B" stroke="#10B981"/>
  <text x="610" y="172" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">Automated Staging Deployment</text>
  <text x="465" y="195" font-size="8" fill="#CBD5E1">&#x2022; ArgoCD syncs manifest to Staging AKS</text>
  <text x="465" y="210" font-size="8" fill="#CBD5E1">&#x2022; Deploys identical container image</text>

  <rect x="450" y="235" width="320" height="95" rx="6" fill="#0F172A" stroke="#10B981"/>
  <text x="610" y="257" font-size="10" font-weight="700" fill="#6EE7B7" text-anchor="middle">E2E Verification Testing</text>
  <text x="465" y="280" font-size="8" fill="#CBD5E1">&#x2022; Automated Postman / Cypress regression suite</text>
  <text x="465" y="298" font-size="8" fill="#CBD5E1">&#x2022; Performance &amp; load tests (k6 / Gatling)</text>
  <text x="465" y="315" font-size="8" fill="#34D399">&#x2714; Passes all synthetic business checks</text>

  <rect x="450" y="345" width="320" height="100" rx="6" fill="#1C1917" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="610" y="370" font-size="10" font-weight="700" fill="#FBBF24" text-anchor="middle">Manual Approval Gate (Delivery)</text>
  <text x="465" y="395" font-size="8" fill="#CBD5E1">&#x2022; Product owner / QA sign-off required</text>
  <text x="465" y="415" font-size="8" fill="#FDE68A">&#x2022; Code is ALWAYS releasable to production,</text>
  <text x="465" y="430" font-size="8" fill="#FDE68A">  but deployment requires human trigger!</text>

  <path fill="none" d="M 610 220 L 610 235" stroke="#10B981" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <path fill="none" d="M 610 330 L 610 345" stroke="#10B981" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- Phase 3: Continuous Deployment -->
  <rect x="830" y="105" width="350" height="360" rx="8" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.5"/>
  <rect x="830" y="105" width="350" height="30" rx="8" fill="#4C1D95"/>
  <text x="1005" y="125" font-size="11" font-weight="700" fill="#DDD6FE" text-anchor="middle">3. Continuous Deployment (Full Auto)</text>

  <rect x="845" y="150" width="320" height="85" rx="6" fill="#0F172A" stroke="#8B5CF6"/>
  <text x="1005" y="172" font-size="10" font-weight="700" fill="#C084FC" text-anchor="middle">Zero-Touch Production Rollout</text>
  <text x="860" y="195" font-size="8" fill="#CBD5E1">&#x2022; Zero human gates; direct commit-to-prod</text>
  <text x="860" y="213" font-size="8" fill="#CBD5E1">&#x2022; Canary rollout via Argo Rollouts (10% &#x2192; 50% &#x2192; 100%)</text>
  <text x="860" y="228" font-size="8" fill="#34D399">&#x2714; Typically 20-50 deployments per day</text>

  <rect x="845" y="250" width="320" height="195" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="1005" y="275" font-size="10" font-weight="700" fill="#F8FAFC" text-anchor="middle">Telemetry &amp; Automated Rollback</text>
  <text x="860" y="300" font-size="8" fill="#CBD5E1">&#x2022; Prometheus metrics continuously evaluated:</text>
  <text x="870" y="318" font-size="8" fill="#CBD5E1">- HTTP 5xx error rate (&lt;0.05%)</text>
  <text x="870" y="335" font-size="8" fill="#CBD5E1">- p99 latency (&lt;200ms)</text>
  <text x="860" y="360" font-size="8" font-weight="700" fill="#EF4444">&#x26A0; Automatic Rollback:</text>
  <text x="860" y="376" font-size="8" fill="#FCA5A5">If metrics breach thresholds during canary analysis,</text>
  <text x="860" y="390" font-size="8" fill="#FCA5A5">Argo instantly rolls back traffic to stable replica set!</text>

  <!-- Connectors Between Major Pillars -->
  <path fill="none" d="M 390 285 L 435 285" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>
  <path fill="none" d="M 785.0 395.0 L 795.0 395.0 C 813.0 395.0, 813.0 200.0, 831.0 200.0 L 845.0 200.0" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- Bottom Invariant -->
  <rect x="40" y="480" width="1140" height="25" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="610" y="497" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Core Distinction: Continuous Delivery ensures every build is releasable to production. Continuous Deployment automatically ships every valid commit directly to production.</text>
</svg>