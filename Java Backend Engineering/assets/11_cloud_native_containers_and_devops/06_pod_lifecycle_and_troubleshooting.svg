<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1200" height="560" rx="10" fill="url(#bg)"/>
  <rect width="1200" height="560" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="600" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">Kubernetes Pod Lifecycle State Machine &amp; Diagnostic Troubleshooting</text>
  <text x="600" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">Pending -&gt; ContainerCreating -&gt; Running &amp; Ready vs. Failure Modes: CrashLoopBackOff, ImagePullBackOff &amp; OOMKilled</text>
  <line x1="40" y1="68" x2="1160" y2="68" stroke="#334155" stroke-width="1"/>

  <!-- Happy Path Sequence -->
  <rect x="50" y="105" width="220" height="120" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="50" y="105" width="220" height="26" rx="8" fill="#0C4A6E" stroke="#0284C7" stroke-width="1"/>
  <text x="160" y="123" font-size="10" font-weight="700" fill="#7DD3FC" text-anchor="middle">1. PENDING Phase</text>
  <text x="65" y="150" font-size="8" fill="#CBD5E1">&#x2022; Manifest accepted by apiserver</text>
  <text x="65" y="168" font-size="8" fill="#CBD5E1">&#x2022; Waiting for scheduler placement</text>
  <text x="65" y="188" font-size="8" font-weight="700" fill="#FBBF24">&#x26A0; Diagnostic Failure:</text>
  <text x="65" y="205" font-size="7" fill="#FDE68A">Insufficient CPU/Memory on nodes</text>

  <rect x="330" y="105" width="240" height="120" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="330" y="105" width="240" height="26" rx="8" fill="#0C4A6E" stroke="#0284C7" stroke-width="1"/>
  <text x="450" y="123" font-size="10" font-weight="700" fill="#7DD3FC" text-anchor="middle">2. CONTAINER_CREATING</text>
  <text x="345" y="150" font-size="8" fill="#CBD5E1">&#x2022; Kubelet pulls image from registry</text>
  <text x="345" y="168" font-size="8" fill="#CBD5E1">&#x2022; Attaches CNI virtual network</text>
  <text x="345" y="186" font-size="8" fill="#CBD5E1">&#x2022; Mounts CSI persistent storage</text>
  <text x="345" y="206" font-size="8" fill="#34D399">&#x2714; Executes init-containers</text>

  <rect x="630" y="105" width="240" height="120" rx="8" fill="#06201B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="630" y="105" width="240" height="26" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="750" y="123" font-size="10" font-weight="700" fill="#6EE7B7" text-anchor="middle">3. APP_STARTING</text>
  <text x="645" y="150" font-size="8" fill="#CBD5E1">&#x2022; JVM booting inside container</text>
  <text x="645" y="168" font-size="8" font-weight="700" fill="#38BDF8">&#x2022; Startup Probe running:</text>
  <text x="655" y="185" font-size="8" fill="#CBD5E1">Polls /actuator/health/liveness</text>
  <text x="645" y="205" font-size="8" fill="#34D399">&#x2714; Shields app from early liveness kill</text>

  <rect x="930" y="105" width="220" height="120" rx="8" fill="#06201B" stroke="#10B981" stroke-width="2"/>
  <rect x="930" y="105" width="220" height="26" rx="8" fill="#047857" stroke="#10B981" stroke-width="1"/>
  <text x="1040" y="123" font-size="10" font-weight="700" fill="#A7F3D0" text-anchor="middle">&#x2714; 4. RUNNING &amp; READY</text>
  <text x="945" y="150" font-size="8" fill="#34D399">&#x2714; Readiness probe passing</text>
  <text x="945" y="168" font-size="8" fill="#CBD5E1">&#x2022; Added to Service EndpointSlice</text>
  <text x="945" y="186" font-size="8" fill="#CBD5E1">&#x2022; Actively servicing live traffic</text>
  <text x="945" y="206" font-size="8" fill="#34D399">&#x2714; Liveness probe continuously polls</text>

  <!-- Connectors in Happy Path -->
  <path fill="none" d="M 270 165 L 330 165" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>
  <path fill="none" d="M 570 165 L 630 165" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>
  <path fill="none" d="M 870 165 L 930 165" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- Failure Modes Section -->
  <rect x="50" y="260" width="1100" height="215" rx="8" fill="#1C1917" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="50" y="260" width="1100" height="26" rx="8" fill="#7F1D1D" stroke="#EF4444" stroke-width="1"/>
  <text x="600" y="278" font-size="11" font-weight="700" fill="#FCA5A5" text-anchor="middle">Common Production Diagnostic Failure States &amp; Remedies</text>

  <!-- Failure 1: ImagePullBackOff -->
  <rect x="75" y="300" width="240" height="155" rx="6" fill="#0F172A" stroke="#EF4444" stroke-width="1"/>
  <text x="195" y="325" font-size="10" font-weight="700" fill="#F87171" text-anchor="middle">ImagePullBackOff / ErrImagePull</text>
  <text x="90" y="350" font-size="8" font-weight="700" fill="#CBD5E1">Root Causes:</text>
  <text x="90" y="368" font-size="8" fill="#FCA5A5">&#x2022; Image tag misspelled or absent</text>
  <text x="90" y="385" font-size="8" fill="#FCA5A5">&#x2022; Missing imagePullSecrets (Auth 401)</text>
  <text x="90" y="405" font-size="8" font-weight="700" fill="#34D399">Remedy Command:</text>
  <text x="90" y="423" font-size="8" font-family="'JetBrains Mono', monospace" fill="#7DD3FC">kubectl describe pod &lt;name&gt;</text>
  <text x="90" y="440" font-size="7" fill="#94A3B8">Check Events section at bottom</text>

  <!-- Failure 2: CrashLoopBackOff -->
  <rect x="345" y="300" width="240" height="155" rx="6" fill="#0F172A" stroke="#EF4444" stroke-width="1"/>
  <text x="465" y="325" font-size="10" font-weight="700" fill="#F87171" text-anchor="middle">CrashLoopBackOff</text>
  <text x="360" y="350" font-size="8" font-weight="700" fill="#CBD5E1">Root Causes:</text>
  <text x="360" y="368" font-size="8" fill="#FCA5A5">&#x2022; Spring Boot failed to initialize</text>
  <text x="360" y="385" font-size="8" fill="#FCA5A5">&#x2022; Missing environment variable / secret</text>
  <text x="360" y="402" font-size="8" fill="#FCA5A5">&#x2022; DB connection refused on startup</text>
  <text x="360" y="423" font-size="8" font-weight="700" fill="#34D399">Remedy Command:</text>
  <text x="360" y="440" font-size="8" font-family="'JetBrains Mono', monospace" fill="#7DD3FC">kubectl logs &lt;name&gt; --previous</text>

  <!-- Failure 3: OOMKilled -->
  <rect x="615" y="300" width="240" height="155" rx="6" fill="#0F172A" stroke="#EF4444" stroke-width="1"/>
  <text x="735" y="325" font-size="10" font-weight="700" fill="#F87171" text-anchor="middle">OOMKilled (Exit Code 137)</text>
  <text x="630" y="350" font-size="8" font-weight="700" fill="#CBD5E1">Root Causes:</text>
  <text x="630" y="368" font-size="8" fill="#FCA5A5">&#x2022; JVM MaxRAMPercentage set too high</text>
  <text x="630" y="385" font-size="8" fill="#FCA5A5">&#x2022; Off-heap / direct memory leak</text>
  <text x="630" y="402" font-size="8" fill="#FCA5A5">&#x2022; Container limits.memory too tight</text>
  <text x="630" y="423" font-size="8" font-weight="700" fill="#34D399">Remedy Configuration:</text>
  <text x="630" y="440" font-size="7" font-family="'JetBrains Mono', monospace" fill="#7DD3FC">-XX:MaxRAMPercentage=75.0</text>

  <!-- Failure 4: Readiness Failure -->
  <rect x="885" y="300" width="240" height="155" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
  <text x="1005" y="325" font-size="10" font-weight="700" fill="#FBBF24" text-anchor="middle">Readiness Probe Failure</text>
  <text x="900" y="350" font-size="8" font-weight="700" fill="#CBD5E1">Symptoms &amp; Behavior:</text>
  <text x="900" y="368" font-size="8" fill="#CBD5E1">&#x2022; Pod stays Running but 0/1 Ready</text>
  <text x="900" y="385" font-size="8" fill="#CBD5E1">&#x2022; Removed from Service Endpoints</text>
  <text x="900" y="402" font-size="8" fill="#34D399">&#x2714; Protects users from 503 errors</text>
  <text x="900" y="423" font-size="8" font-weight="700" fill="#34D399">Remedy Action:</text>
  <text x="900" y="440" font-size="7" fill="#CBD5E1">Tune initialDelaySeconds &amp; timeout</text>

  <!-- Bottom Invariant -->
  <rect x="50" y="500" width="1100" height="35" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="600" y="522" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Probe Guidance: Use Startup Probes for slow JVM initializations (e.g. 60s), Readiness Probes for routing traffic, and Liveness Probes strictly to restart deadlocked pods.</text>
</svg>