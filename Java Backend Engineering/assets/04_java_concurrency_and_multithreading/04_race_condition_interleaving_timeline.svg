<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1200" height="540" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Race Condition &amp; Lost Update Concurrency Anomaly</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Non-Atomic Read-Modify-Write (count++) Interleaving Leading to Silent Data Corruption</text>

  <!-- Swimlane Headers -->
  <rect x="80" y="95" width="240" height="45" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="200" y="122" font-size="12" font-weight="700" fill="#60A5FA" text-anchor="middle">Thread 1 (Core 1)</text>

  <rect x="480" y="95" width="240" height="45" rx="6" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <text x="600" y="122" font-size="12" font-weight="700" fill="#7DD3FC" text-anchor="middle">Shared Heap: int count = 0</text>

  <rect x="880" y="95" width="240" height="45" rx="6" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="1000" y="122" font-size="12" font-weight="700" fill="#C4B5FD" text-anchor="middle">Thread 2 (Core 2)</text>

  <!-- Lifelines -->
  <path fill="none" d="M 200 140 L 200 450" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path fill="none" d="M 600 140 L 600 450" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path fill="none" d="M 1000 140 L 1000 450" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Step 1: Thread 1 reads count = 0 -->
  <path fill="none" d="M 600 170 L 205 170" stroke="#3B82F6" stroke-width="2" marker-end="url(#arr-b)"/>
  <rect x="250" y="155" width="160" height="24" rx="4" fill="#0B132B" stroke="#3B82F6" stroke-width="1"/>
  <text x="330" y="171" font-size="10" font-weight="700" fill="#93C5FD" text-anchor="middle">1. Read count -&gt; r1 = 0</text>

  <!-- Step 2: Thread 2 reads count = 0 (STALE READ!) -->
  <path fill="none" d="M 600 220 L 995 220" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arr-p)"/>
  <rect x="740" y="205" width="160" height="24" rx="4" fill="#0B132B" stroke="#8B5CF6" stroke-width="1"/>
  <text x="820" y="221" font-size="10" font-weight="700" fill="#C4B5FD" text-anchor="middle">2. Read count -&gt; r2 = 0</text>

  <!-- Step 3: Thread 1 increments and writes back 1 -->
  <rect x="100" y="260" width="180" height="30" rx="4" fill="#0F172A" stroke="#3B82F6" stroke-width="1"/>
  <text x="190" y="280" font-size="10" fill="#CBD5E1" text-anchor="middle">Computes r1 = 0 + 1 = 1</text>
  
  <path fill="none" d="M 200 305 L 595 305" stroke="#3B82F6" stroke-width="2" marker-end="url(#arr-b)"/>
  <rect x="340" y="292" width="140" height="24" rx="4" fill="#0B132B" stroke="#3B82F6" stroke-width="1"/>
  <text x="410" y="308" font-size="10" font-weight="700" fill="#93C5FD" text-anchor="middle">3. Write count = 1</text>

  <!-- Step 4: Thread 2 increments and overwrites 1! -->
  <rect x="910" y="340" width="180" height="30" rx="4" fill="#0F172A" stroke="#8B5CF6" stroke-width="1"/>
  <text x="1000" y="360" font-size="10" fill="#CBD5E1" text-anchor="middle">Computes r2 = 0 + 1 = 1</text>

  <path fill="none" d="M 1000 385 L 605 385" stroke="#EF4444" stroke-width="2" marker-end="url(#arr-r)"/>
  <rect x="710" y="372" width="170" height="24" rx="4" fill="#1C1917" stroke="#EF4444" stroke-width="1"/>
  <text x="795" y="388" font-size="10" font-weight="700" fill="#F87171" text-anchor="middle">4. Overwrites count = 1!</text>

  <!-- Anomaly Callout -->
  <rect x="450" y="415" width="300" height="45" rx="6" fill="#1C1917" stroke="#EF4444" stroke-width="2"/>
  <text x="600" y="435" font-size="11" font-weight="700" fill="#F87171" text-anchor="middle">LOST UPDATE ANOMALY!</text>
  <text x="600" y="450" font-size="10" fill="#FCA5A5" text-anchor="middle">2 increments occurred, but count == 1 (Expected 2)</text>

  <!-- Bottom Resolution Card -->
  <rect x="50" y="475" width="1100" height="50" rx="6" fill="#06201B" stroke="#10B981" stroke-width="1.5"/>
  <text x="600" y="498" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">Architectural Remedy: count++ is 3 distinct bytecodes (getfield -> iadd -> putfield)</text>
  <text x="600" y="514" font-size="10" fill="#CBD5E1" text-anchor="middle">Fix with AtomicInteger.incrementAndGet() (hardware CAS), synchronized(lock), or ReentrantLock.</text>
</svg>