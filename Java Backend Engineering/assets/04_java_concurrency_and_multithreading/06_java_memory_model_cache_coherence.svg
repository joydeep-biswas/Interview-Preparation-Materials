<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="540" viewBox="0 0 1220 540">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1220" height="540" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Java Memory Model (JMM) Hardware Cache Coherence Architecture</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">CPU Core 1/2 Local L1/L2 Caches vs. Main RAM: Volatile Memory Barriers &amp; Visibility Failure</text>

  <!-- Top: Main RAM Container -->
  <rect x="360" y="95" width="500" height="90" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="360" y="95" width="500" height="28" rx="8" fill="#0C4A6E"/>
  <text x="610" y="115" font-size="12" font-weight="700" fill="#7DD3FC" text-anchor="middle">Main System Memory (RAM) - Physical DDR</text>
  <rect x="380" y="132" width="460" height="42" rx="4" fill="#0F172A" stroke="#0284C7" stroke-width="1"/>
  <text x="610" y="152" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">Shared Heap Variable: boolean flag = false;</text>
  <text x="610" y="166" font-size="9" fill="#94A3B8" text-anchor="middle">Coherence bus connecting all processor cores</text>

  <!-- Core 1: Writer Thread -->
  <rect x="50" y="220" width="530" height="235" rx="8" fill="#1C1917" stroke="#8B5CF6" stroke-width="1.5"/>
  <rect x="50" y="220" width="530" height="30" rx="8" fill="#4C1D95"/>
  <text x="315" y="240" font-size="12" font-weight="700" fill="#C4B5FD" text-anchor="middle">CPU Core 1 (Thread 1: Writer)</text>

  <rect x="70" y="265" width="490" height="75" rx="4" fill="#0F172A" stroke="#8B5CF6" stroke-width="1"/>
  <text x="85" y="290" font-size="11" font-weight="700" fill="#A78BFA">L1/L2 Cache &amp; Store Buffer:</text>
  <text x="85" y="310" font-size="10" font-family="'JetBrains Mono', monospace" fill="#FCA5A5">flag = true; (Dirty write buffered locally!)</text>
  <text x="85" y="326" font-size="9" fill="#94A3B8">Write is held in CPU store buffer and NOT flushed to RAM</text>

  <rect x="70" y="350" width="490" height="90" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="85" y="375" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">flag = true; // Normal non-volatile write</text>
  <text x="85" y="398" font-size="10" fill="#F87171">&#x2718; Visibility Failure: RAM still holds flag = false!</text>
  <text x="85" y="420" font-size="9" fill="#94A3B8">Without memory barrier, CPU reorders writes to optimize memory bus</text>

  <!-- Core 2: Reader Thread -->
  <rect x="640" y="220" width="530" height="235" rx="8" fill="#1C1917" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="640" y="220" width="530" height="30" rx="8" fill="#7F1D1D"/>
  <text x="905" y="240" font-size="12" font-weight="700" fill="#FCA5A5" text-anchor="middle">CPU Core 2 (Thread 2: Reader)</text>

  <rect x="660" y="265" width="490" height="75" rx="4" fill="#0F172A" stroke="#EF4444" stroke-width="1"/>
  <text x="675" y="290" font-size="11" font-weight="700" fill="#F87171">L1/L2 Cache (Stale Data):</text>
  <text x="675" y="310" font-size="10" font-family="'JetBrains Mono', monospace" fill="#F87171">flag == false (Stale cache line hit!)</text>
  <text x="675" y="326" font-size="9" fill="#94A3B8">Core 2 reads directly from fast local L1 cache instead of RAM</text>

  <rect x="660" y="350" width="490" height="90" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="675" y="375" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">while (!flag) { /* spins indefinitely! */ }</text>
  <text x="675" y="398" font-size="10" fill="#F87171">&#x2718; Liveness Failure: Reader thread loops forever!</text>
  <text x="675" y="420" font-size="9" fill="#94A3B8">Never sees Thread 1's update due to missing cache invalidation</text>

  <!-- Flawed write path dashed arrow -->
  <path fill="none" d="M 315 265 L 315 200 L 450 200 L 450 185" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="360" y="208" font-size="8" fill="#FCA5A5">Unflushed write</text>

  <path fill="none" d="M 770 185 L 770 200 L 905 200 L 905 265" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="860" y="208" font-size="8" fill="#FCA5A5">Stale cache hit</text>

  <!-- Bottom Invariant Card: The Volatile Fix -->
  <rect x="50" y="470" width="1120" height="55" rx="6" fill="#06201B" stroke="#10B981" stroke-width="1.5"/>
  <text x="610" y="492" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">The Volatile Remedy: 'volatile boolean flag = false;'</text>
  <text x="610" y="512" font-size="10" fill="#CBD5E1" text-anchor="middle">1. Store Barrier: Writer immediately flushes store buffer to RAM. 2. Load Barrier: Reader invalidates local L1 cache and fetches from RAM. Zero infinite spinning.</text>
</svg>