<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="540" viewBox="0 0 1220 540">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1220" height="540" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Deadlock Mechanics &amp; The Four Coffman Conditions</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Mutual Exclusion + Hold &amp; Wait + No Preemption + Circular Wait Graph &amp; Global Lock Ordering Fix</text>

  <!-- Left Side: Circular Wait Graph -->
  <rect x="50" y="95" width="540" height="380" rx="8" fill="#1C1917" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="50" y="95" width="540" height="30" rx="8" fill="#7F1D1D"/>
  <text x="320" y="116" font-size="12" font-weight="700" fill="#FCA5A5" text-anchor="middle">Deadlock Circular Dependency Graph</text>

  <!-- Thread 1 -->
  <rect x="80" y="160" width="180" height="80" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="170" y="190" font-size="13" font-weight="700" fill="#60A5FA" text-anchor="middle">Thread 1</text>
  <text x="170" y="210" font-size="10" fill="#34D399" text-anchor="middle">Holds Lock A</text>
  <text x="170" y="226" font-size="9" fill="#F87171" text-anchor="middle">Wants Lock B (BLOCKED)</text>

  <!-- Lock A -->
  <rect x="360" y="160" width="180" height="80" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="450" y="190" font-size="13" font-weight="700" fill="#34D399" text-anchor="middle">Lock A</text>
  <text x="450" y="210" font-size="10" fill="#CBD5E1" text-anchor="middle">Acquired by Thread 1</text>
  <text x="450" y="226" font-size="9" fill="#94A3B8" text-anchor="middle">Mutual Exclusion active</text>

  <!-- Lock B -->
  <rect x="80" y="320" width="180" height="80" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="170" y="350" font-size="13" font-weight="700" fill="#FBBF24" text-anchor="middle">Lock B</text>
  <text x="170" y="370" font-size="10" fill="#CBD5E1" text-anchor="middle">Acquired by Thread 2</text>
  <text x="170" y="386" font-size="9" fill="#94A3B8" text-anchor="middle">Mutual Exclusion active</text>

  <!-- Thread 2 -->
  <rect x="360" y="320" width="180" height="80" rx="6" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="450" y="350" font-size="13" font-weight="700" fill="#C4B5FD" text-anchor="middle">Thread 2</text>
  <text x="450" y="370" font-size="10" fill="#34D399" text-anchor="middle">Holds Lock B</text>
  <text x="450" y="386" font-size="9" fill="#F87171" text-anchor="middle">Wants Lock A (BLOCKED)</text>

  <!-- Graph Arrows -->
  <!-- T1 holds Lock A -->
  <path fill="none" d="M 260 190 L 360 190" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="310" y="182" font-size="8" font-weight="700" fill="#34D399" text-anchor="middle">Holds</text>

  <!-- T1 waits for Lock B -->
  <path fill="none" d="M 170 240 L 170 320" stroke="#EF4444" stroke-width="2" marker-end="url(#arr-r)"/>
  <text x="145" y="285" font-size="8" font-weight="700" fill="#F87171" text-anchor="middle">Waits</text>

  <!-- T2 holds Lock B -->
  <path fill="none" d="M 360 360 L 260 360" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="310" y="352" font-size="8" font-weight="700" fill="#34D399" text-anchor="middle">Holds</text>

  <!-- T2 waits for Lock A -->
  <path fill="none" d="M 450 320 L 450 240" stroke="#EF4444" stroke-width="2" marker-end="url(#arr-r)"/>
  <text x="475" y="285" font-size="8" font-weight="700" fill="#F87171" text-anchor="middle">Waits</text>

  <!-- Right Side: 4 Coffman Conditions &amp; Solution -->
  <rect x="620" y="95" width="550" height="380" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="620" y="95" width="550" height="30" rx="8" fill="#0C4A6E"/>
  <text x="895" y="116" font-size="12" font-weight="700" fill="#7DD3FC" text-anchor="middle">The 4 Necessary Coffman Conditions</text>

  <rect x="640" y="140" width="510" height="155" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="655" y="165" font-size="11" font-weight="700" fill="#F87171">All 4 Conditions Must Hold Simultaneously for Deadlock:</text>
  <text x="655" y="188" font-size="10" fill="#CBD5E1">1. <tspan font-weight="700" fill="#F8FAFC">Mutual Exclusion:</tspan> Resources are non-shareable (mutex/lock)</text>
  <text x="655" y="208" font-size="10" fill="#CBD5E1">2. <tspan font-weight="700" fill="#F8FAFC">Hold and Wait:</tspan> Threads hold 1 lock while waiting for another</text>
  <text x="655" y="228" font-size="10" fill="#CBD5E1">3. <tspan font-weight="700" fill="#F8FAFC">No Preemption:</tspan> Locks cannot be forcibly taken from thread</text>
  <text x="655" y="248" font-size="10" fill="#CBD5E1">4. <tspan font-weight="700" fill="#F8FAFC">Circular Wait:</tspan> Closed cycle: T1 -&gt; L2 -&gt; T2 -&gt; L1 -&gt; T1</text>
  <text x="655" y="275" font-size="9" fill="#94A3B8">Breaking even ONE condition completely prevents deadlocks!</text>

  <!-- Universal Solution: Global Lock Ordering -->
  <rect x="640" y="310" width="510" height="150" rx="6" fill="#06201B" stroke="#10B981" stroke-width="1.5"/>
  <text x="655" y="335" font-size="12" font-weight="700" fill="#34D399">The Universal Engineering Fix: Global Lock Ordering</text>
  <text x="655" y="360" font-size="10" fill="#CBD5E1">&#x2022; Always acquire multiple locks in identical global order</text>
  <text x="655" y="378" font-size="10" font-family="'JetBrains Mono', monospace" fill="#A7F3D0">if (from.id &lt; to.id) { lock(from); lock(to); }</text>
  <text x="655" y="396" font-size="10" font-family="'JetBrains Mono', monospace" fill="#A7F3D0">else { lock(to); lock(from); }</text>
  <text x="655" y="420" font-size="10" fill="#CBD5E1">&#x2022; Breaks Condition 4 (Circular Wait is mathematically impossible!)</text>
  <text x="655" y="440" font-size="9" fill="#34D399">&#x2714; Alternatively: Use tryLock() with timeout to break No Preemption.</text>

  <!-- Bottom Invariant -->
  <rect x="50" y="490" width="1120" height="35" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="610" y="512" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Production Rule: Thread dumps (jcmd &lt;pid&gt; Thread.dump_to_file) automatically detect circular wait deadlocks in HotSpot JVM.</text>
</svg>