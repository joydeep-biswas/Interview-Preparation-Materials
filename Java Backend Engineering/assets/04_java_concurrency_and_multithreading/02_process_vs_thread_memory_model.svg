<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="500" viewBox="0 0 1180 500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1180" height="500" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Operating System Process vs. Thread Memory Model</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Isolated OS Virtual Address Spaces vs. Shared Heap &amp; Private Thread Stack Frames</text>

  <!-- Left Side: Process Boundary Container -->
  <rect x="50" y="95" width="450" height="375" rx="8" fill="#0B132B" stroke="#1D4ED8" stroke-width="1.5"/>
  <rect x="50" y="95" width="450" height="30" rx="8" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
  <text x="275" y="116" font-size="12" font-weight="700" fill="#93C5FD" text-anchor="middle">OS Process: Heavyweight Isolation Boundary</text>

  <rect x="70" y="145" width="410" height="135" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="85" y="170" font-size="11" font-weight="700" fill="#60A5FA">Dedicated Virtual Memory Address Space:</text>
  <text x="85" y="195" font-size="10" fill="#CBD5E1">&#x2022; Strict MMU hardware page isolation</text>
  <text x="85" y="215" font-size="10" fill="#CBD5E1">&#x2022; Process cannot access memory of another process</text>
  <text x="85" y="235" font-size="10" fill="#F87171">&#x2022; Segment violation (SIGSEGV) if unauthorized access</text>
  <text x="85" y="255" font-size="9" fill="#94A3B8">Process creation requires OS fork/exec kernel calls</text>

  <rect x="70" y="295" width="410" height="155" rx="6" fill="#1E293B" stroke="#0284C7" stroke-width="1"/>
  <text x="85" y="320" font-size="11" font-weight="700" fill="#7DD3FC">Inter-Process Communication (IPC):</text>
  <text x="85" y="345" font-size="10" fill="#CBD5E1">&#x2022; TCP Sockets / Unix Domain Sockets</text>
  <text x="85" y="365" font-size="10" fill="#CBD5E1">&#x2022; OS Pipes and Named FIFO buffers</text>
  <text x="85" y="385" font-size="10" fill="#CBD5E1">&#x2022; Shared Memory segments with semaphores</text>
  <text x="85" y="415" font-size="10" font-weight="700" fill="#FBBF24">Heavy communication overhead; serialization required</text>

  <!-- Right Side: Intra-Process Thread Model -->
  <rect x="530" y="95" width="600" height="375" rx="8" fill="#06201B" stroke="#047857" stroke-width="1.5"/>
  <rect x="530" y="95" width="600" height="30" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="830" y="116" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">Intra-Process Thread Model: Shared Heap &amp; Private Stacks</text>

  <!-- Shared Heap in Center -->
  <rect x="550" y="145" width="560" height="85" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="830" y="170" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle">Shared Process Heap &amp; Metaspace</text>
  <text x="565" y="195" font-size="10" fill="#CBD5E1">&#x2022; All threads in JVM share exact same memory address space</text>
  <text x="565" y="212" font-size="10" fill="#A7F3D0">&#x2022; Direct memory sharing: zero serialization or IPC overhead</text>

  <!-- Thread 1 Private Stack -->
  <rect x="550" y="245" width="270" height="150" rx="6" fill="#0F172A" stroke="#0284C7" stroke-width="1"/>
  <text x="685" y="270" font-size="11" font-weight="700" fill="#7DD3FC" text-anchor="middle">Thread 1: Private Stack</text>
  <text x="565" y="295" font-size="10" fill="#CBD5E1">&#x2022; Local variable stack frames</text>
  <text x="565" y="315" font-size="10" fill="#CBD5E1">&#x2022; Program Counter (PC) register</text>
  <text x="565" y="335" font-size="10" fill="#38BDF8">&#x2022; Object ref points to Heap</text>
  <text x="565" y="365" font-size="9" fill="#94A3B8">Private; thread-safe execution</text>

  <!-- Thread 2 Private Stack -->
  <rect x="840" y="245" width="270" height="150" rx="6" fill="#0F172A" stroke="#8B5CF6" stroke-width="1"/>
  <text x="975" y="270" font-size="11" font-weight="700" fill="#C4B5FD" text-anchor="middle">Thread 2: Private Stack</text>
  <text x="855" y="295" font-size="10" fill="#CBD5E1">&#x2022; Local variable stack frames</text>
  <text x="855" y="315" font-size="10" fill="#CBD5E1">&#x2022; Program Counter (PC) register</text>
  <text x="855" y="335" font-size="10" fill="#A78BFA">&#x2022; Object ref points to Heap</text>
  <text x="855" y="365" font-size="9" fill="#94A3B8">Concurrent memory contention</text>

  <rect x="550" y="405" width="560" height="45" rx="4" fill="#1C1917" stroke="#EF4444" stroke-width="1"/>
  <text x="830" y="425" font-size="10" font-weight="700" fill="#F87171" text-anchor="middle">Concurrency Trap: Shared Mutable State</text>
  <text x="830" y="440" font-size="9" fill="#CBD5E1" text-anchor="middle">Multiple threads accessing shared heap objects without synchronization trigger race conditions!</text>

  <!-- Pointer arrows to Heap -->
  <path fill="none" d="M 685 245 L 685 230" stroke="#0284C7" stroke-width="2" marker-end="url(#arr-c)"/>
  <path fill="none" d="M 975 245 L 975 230" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arr-p)"/>
</svg>