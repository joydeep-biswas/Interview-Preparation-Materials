<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="560" viewBox="0 0 1220 560">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1220" height="560" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Java 21 Virtual Threads (Project Loom) Carrier Multiplexing</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Millions of User-Mode Virtual Threads M:N Multiplexed onto Small Pool of OS Carrier Threads</text>

  <!-- Top: Virtual Threads Container -->
  <rect x="50" y="95" width="1120" height="215" rx="8" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.5"/>
  <rect x="50" y="95" width="1120" height="30" rx="8" fill="#4C1D95"/>
  <text x="610" y="116" font-size="12" font-weight="700" fill="#C4B5FD" text-anchor="middle">Millions of Lightweight Virtual Threads (JVM User Mode: M:N)</text>

  <!-- VT 1 -->
  <rect x="75" y="145" width="190" height="85" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="170" y="170" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">Virtual Thread 1</text>
  <text x="85" y="192" font-size="10" fill="#CBD5E1">State: <tspan fill="#34D399" font-weight="700">RUNNING</tspan></text>
  <text x="85" y="212" font-size="9" fill="#A7F3D0">Mounted on Carrier 1</text>

  <!-- VT 2 -->
  <rect x="290" y="145" width="190" height="85" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="385" y="170" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">Virtual Thread 2</text>
  <text x="300" y="192" font-size="10" fill="#CBD5E1">State: <tspan fill="#34D399" font-weight="700">RUNNING</tspan></text>
  <text x="300" y="212" font-size="9" fill="#A7F3D0">Mounted on Carrier 2</text>

  <!-- VT 3: Unmounted on I/O -->
  <rect x="510" y="145" width="220" height="85" rx="6" fill="#1C1917" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="620" y="170" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="middle">Virtual Thread 3 (PARKED)</text>
  <text x="525" y="192" font-size="10" fill="#FCA5A5">Blocked on <tspan font-family="'JetBrains Mono', monospace">socket.read()</tspan></text>
  <text x="525" y="212" font-size="9" fill="#FDE68A">Unmounted continuation to Heap!</text>

  <!-- VT 4: Unmounted on I/O -->
  <rect x="755" y="145" width="220" height="85" rx="6" fill="#1C1917" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="865" y="170" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="middle">Virtual Thread 4 (PARKED)</text>
  <text x="770" y="192" font-size="10" fill="#FCA5A5">Blocked on JDBC query</text>
  <text x="770" y="212" font-size="9" fill="#FDE68A">Carrier thread freed immediately!</text>

  <!-- VT N -->
  <rect x="1000" y="145" width="150" height="85" rx="6" fill="#0F172A" stroke="#8B5CF6" stroke-width="1"/>
  <text x="1075" y="170" font-size="11" font-weight="700" fill="#A78BFA" text-anchor="middle">Virtual Thread N</text>
  <text x="1010" y="192" font-size="10" fill="#CBD5E1">1,000,000+ threads</text>
  <text x="1010" y="212" font-size="9" fill="#94A3B8">RAM: few KB / thread</text>

  <!-- Continuation Explanation -->
  <rect x="75" y="245" width="1075" height="50" rx="4" fill="#0F172A" stroke="#8B5CF6" stroke-width="1"/>
  <text x="90" y="267" font-size="10" font-weight="700" fill="#C4B5FD">Continuation Mechanics:</text>
  <text x="90" y="284" font-size="10" fill="#CBD5E1">Blocking calls do NOT block the OS thread. The JVM copies the virtual thread's stack frames to the Java Heap and unmounts it.</text>

  <!-- Bottom: Carrier Pool Container -->
  <rect x="50" y="340" width="1120" height="150" rx="8" fill="#06201B" stroke="#047857" stroke-width="1.5"/>
  <rect x="50" y="340" width="1120" height="30" rx="8" fill="#064E3B"/>
  <text x="610" y="360" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">Small Pool of OS Carrier Threads (1:1 with CPU Cores)</text>

  <!-- Carrier 1 -->
  <rect x="80" y="385" width="220" height="85" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="190" y="410" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">Carrier Thread 1</text>
  <text x="95" y="432" font-size="10" fill="#CBD5E1">Pinned to CPU Core 1</text>
  <text x="95" y="450" font-size="9" fill="#A7F3D0">Actively executing VT 1</text>

  <!-- Carrier 2 -->
  <rect x="360" y="385" width="220" height="85" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="470" y="410" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">Carrier Thread 2</text>
  <text x="375" y="432" font-size="10" fill="#CBD5E1">Pinned to CPU Core 2</text>
  <text x="375" y="450" font-size="9" fill="#A7F3D0">Actively executing VT 2</text>

  <!-- Carrier 3 -->
  <rect x="640" y="385" width="220" height="85" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="750" y="410" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">Carrier Thread 3</text>
  <text x="655" y="432" font-size="10" fill="#CBD5E1">Pinned to CPU Core 3</text>
  <text x="655" y="450" font-size="9" fill="#6EE7B7">Ready for next task</text>

  <!-- Carrier 4 -->
  <rect x="920" y="385" width="220" height="85" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="1030" y="410" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">Carrier Thread 4</text>
  <text x="935" y="432" font-size="10" fill="#CBD5E1">Pinned to CPU Core 4</text>
  <text x="935" y="450" font-size="9" fill="#6EE7B7">Ready for next task</text>

  <!-- Mounting Arrows -->
  <path fill="none" d="M 170 230 L 170 385" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="185" y="310" font-size="8" font-weight="700" fill="#34D399">Mounted</text>

  <path fill="none" d="M 385.0 230.0 L 385.0 240.0 C 385.0 305.5, 450.0 305.5, 450.0 371.0 L 450.0 385.0" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="430" y="310" font-size="8" font-weight="700" fill="#34D399">Mounted</text>

  <path fill="none" d="M 620.0 230.0 L 620.0 240.0 C 620.0 305.5, 730.0 305.5, 730.0 371.0 L 730.0 385.0" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arr-a)"/>
  <text x="700" y="310" font-size="8" font-weight="700" fill="#FBBF24">Unmounted</text>

  <!-- Bottom Invariant -->
  <rect x="50" y="505" width="1120" height="40" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="610" y="530" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Thread Pinning Caveat: synchronized blocks and native methods PIN the virtual thread to its carrier, preventing unmounting. Use ReentrantLock instead.</text>
</svg>