<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1200" height="540" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Java Concurrency &amp; Thread Memory Architecture Overview</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">OS Process Shared Memory (Heap/Metaspace) vs. Platform Threads (1:1 OS) vs. Virtual Threads (M:N Loom)</text>

  <!-- Column 1: Shared Process Memory -->
  <rect x="50" y="95" width="350" height="380" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="50" y="95" width="350" height="30" rx="8" fill="#0C4A6E"/>
  <text x="225" y="116" font-size="12" font-weight="700" fill="#7DD3FC" text-anchor="middle">Shared Process Memory (JVM Heap &amp; Metaspace)</text>

  <rect x="70" y="145" width="310" height="95" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="85" y="170" font-size="11" font-weight="700" fill="#38BDF8">JVM Heap Space:</text>
  <text x="85" y="192" font-size="10" fill="#CBD5E1">&#x2022; Object instances and array payloads</text>
  <text x="85" y="210" font-size="10" fill="#CBD5E1">&#x2022; Instance fields shared across all threads</text>
  <text x="85" y="228" font-size="10" fill="#94A3B8">&#x2022; Subject to garbage collection</text>

  <rect x="70" y="255" width="310" height="95" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="85" y="280" font-size="11" font-weight="700" fill="#38BDF8">Metaspace (Native C++):</text>
  <text x="85" y="302" font-size="10" fill="#CBD5E1">&#x2022; Class metadata and bytecodes</text>
  <text x="85" y="320" font-size="10" fill="#CBD5E1">&#x2022; Static fields and constant pool</text>
  <text x="85" y="338" font-size="10" fill="#94A3B8">&#x2022; Method vtables and itables</text>

  <rect x="70" y="365" width="310" height="95" rx="6" fill="#1E293B" stroke="#0284C7" stroke-width="1"/>
  <text x="85" y="390" font-size="11" font-weight="700" fill="#7DD3FC">Java Memory Model (JMM):</text>
  <text x="85" y="412" font-size="10" fill="#CBD5E1">&#x2022; Governs visibility &amp; reordering</text>
  <text x="85" y="430" font-size="10" fill="#CBD5E1">&#x2022; Enforces happens-before ordering</text>
  <text x="85" y="448" font-size="9" fill="#A7F3D0">&#x2714; Synchronized monitors &amp; volatile</text>

  <!-- Column 2: Platform Threads -->
  <rect x="430" y="95" width="350" height="380" rx="8" fill="#06201B" stroke="#047857" stroke-width="1.5"/>
  <rect x="430" y="95" width="350" height="30" rx="8" fill="#064E3B"/>
  <text x="605" y="116" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">Platform Threads (1:1 OS Kernel Mapping)</text>

  <rect x="450" y="145" width="310" height="135" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="465" y="170" font-size="11" font-weight="700" fill="#34D399">Thread 1 &amp; 2 Private Stacks:</text>
  <text x="465" y="195" font-size="10" fill="#CBD5E1">&#x2022; 1 MB dedicated stack per thread</text>
  <text x="465" y="215" font-size="10" fill="#CBD5E1">&#x2022; Private stack frames for local variables</text>
  <text x="465" y="235" font-size="10" fill="#CBD5E1">&#x2022; Program Counter (PC) register</text>
  <text x="465" y="255" font-size="10" fill="#94A3B8">&#x2022; References point directly to Heap objects</text>

  <rect x="450" y="295" width="310" height="165" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
  <text x="465" y="320" font-size="11" font-weight="700" fill="#6EE7B7">OS Kernel Scheduling Costs:</text>
  <text x="465" y="345" font-size="10" fill="#CBD5E1">&#x2022; Preemptive context switching in OS kernel</text>
  <text x="465" y="365" font-size="10" fill="#F87171">&#x2022; Context switch penalty: 1 - 2 microseconds</text>
  <text x="465" y="385" font-size="10" fill="#CBD5E1">&#x2022; Scalability limit: ~5,000 to 10,000 threads</text>
  <text x="465" y="405" font-size="10" fill="#CBD5E1">  before RAM exhaustion (10k * 1MB = 10GB!)</text>
  <text x="465" y="435" font-size="10" fill="#FBBF24">Ideal for CPU-intensive parallel computations</text>

  <!-- Column 3: Virtual Threads -->
  <rect x="810" y="95" width="340" height="380" rx="8" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.5"/>
  <rect x="810" y="95" width="340" height="30" rx="8" fill="#4C1D95"/>
  <text x="980" y="116" font-size="12" font-weight="700" fill="#C4B5FD" text-anchor="middle">Java 21 Virtual Threads (M:N Loom)</text>

  <rect x="830" y="145" width="300" height="135" rx="6" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="845" y="170" font-size="11" font-weight="700" fill="#A78BFA">User-Mode Lightweight Threads:</text>
  <text x="845" y="195" font-size="10" fill="#CBD5E1">&#x2022; Managed entirely by JVM runtime</text>
  <text x="845" y="215" font-size="10" fill="#CBD5E1">&#x2022; Stack starts at a few KB on Java Heap!</text>
  <text x="845" y="235" font-size="10" fill="#CBD5E1">&#x2022; Millions of virtual threads scale easily</text>
  <text x="845" y="255" font-size="10" fill="#34D399">&#x2022; Context switch cost: ~10 - 20 nanoseconds</text>

  <rect x="830" y="295" width="300" height="165" rx="6" fill="#1E293B" stroke="#8B5CF6" stroke-width="1"/>
  <text x="845" y="320" font-size="11" font-weight="700" fill="#C4B5FD">Carrier Multiplexing Mechanics:</text>
  <text x="845" y="345" font-size="10" fill="#CBD5E1">&#x2022; Mounted onto small pool of carrier threads</text>
  <text x="845" y="365" font-size="10" fill="#CBD5E1">&#x2022; When virtual thread executes blocking I/O,</text>
  <text x="845" y="385" font-size="10" fill="#A7F3D0">  it unmounts continuation to heap</text>
  <text x="845" y="405" font-size="10" fill="#CBD5E1">&#x2022; Carrier thread immediately runs another task!</text>
  <text x="845" y="435" font-size="10" font-weight="700" fill="#34D399">&#x2714; High-throughput I/O bound microservices</text>

  <!-- Bottom Invariant -->
  <rect x="50" y="490" width="1100" height="35" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="600" y="512" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Architectural Contrast: Platform threads bind 1:1 to OS kernel threads. Virtual threads multiplex M:N on carrier threads via continuation stacks.</text>

  <!-- Connectors -->
  <path fill="none" d="M 400 240 L 450 240" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>
  <path fill="none" d="M 780 240 L 830 240" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arr-p)"/>
</svg>