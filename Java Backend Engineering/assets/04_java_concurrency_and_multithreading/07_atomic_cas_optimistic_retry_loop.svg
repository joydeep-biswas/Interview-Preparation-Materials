<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1200" height="520" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Atomic CAS (Compare-And-Swap) Optimistic Retry Loop</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Hardware Lock-Free Atomic Instruction: AtomicInteger.incrementAndGet() Execution Path</text>

  <!-- Step 1: Read Current Value -->
  <rect x="70" y="130" width="300" height="90" rx="8" fill="#0B132B" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="70" y="130" width="300" height="28" rx="8" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
  <text x="220" y="149" font-size="11" font-weight="700" fill="#93C5FD" text-anchor="middle">1. Read Volatile Memory Value</text>
  <text x="85" y="180" font-size="11" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">int current = get();</text>
  <text x="85" y="202" font-size="10" fill="#94A3B8">Reads current state from RAM: e.g. V = 10</text>

  <!-- Step 2: Compute Candidate Value -->
  <rect x="450" y="130" width="300" height="90" rx="8" fill="#06201B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="450" y="130" width="300" height="28" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="600" y="149" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">2. Compute Candidate Value</text>
  <text x="465" y="180" font-size="11" font-family="'JetBrains Mono', monospace" fill="#A7F3D0">int next = current + 1;</text>
  <text x="465" y="202" font-size="10" fill="#94A3B8">Evaluates in local CPU register: next = 11</text>

  <!-- Step 3: Hardware CAS Instruction -->
  <rect x="830" y="130" width="320" height="90" rx="8" fill="#1C1917" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="830" y="130" width="320" height="28" rx="8" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
  <text x="990" y="149" font-size="11" font-weight="700" fill="#FDE68A" text-anchor="middle">3. Execute Hardware CAS Instruction</text>
  <text x="845" y="180" font-size="10" font-family="'JetBrains Mono', monospace" fill="#FBBF24">compareAndSet(current, next)</text>
  <text x="845" y="202" font-size="10" fill="#CBD5E1">Atomic CPU opcode: <tspan font-family="'JetBrains Mono', monospace" fill="#38BDF8">LOCK CMPXCHG</tspan></text>

  <!-- Step 4: Success Terminal -->
  <rect x="830" y="280" width="320" height="95" rx="8" fill="#06201B" stroke="#10B981" stroke-width="2"/>
  <text x="990" y="310" font-size="13" font-weight="700" fill="#34D399" text-anchor="middle">&#x2714; CAS Success (Memory Unchanged)</text>
  <text x="845" y="335" font-size="10" fill="#CBD5E1">Memory value matched expected <tspan font-family="'JetBrains Mono', monospace">current (10)</tspan>.</text>
  <text x="845" y="353" font-size="10" fill="#A7F3D0">Updated to 11 in single clock cycle! Returns 11.</text>

  <!-- Success Downward Arrow -->
  <path fill="none" d="M 990 220 L 990 280" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>
  <rect x="945" y="238" width="90" height="20" rx="3" fill="#0B132B" stroke="#10B981" stroke-width="1"/>
  <text x="990" y="252" font-size="9" font-weight="700" fill="#6EE7B7" text-anchor="middle">Equal == 10</text>

  <!-- Step 1 to Step 2 Arrow -->
  <path fill="none" d="M 370 175 L 450 175" stroke="#3B82F6" stroke-width="2" marker-end="url(#arr-b)"/>

  <!-- Step 2 to Step 3 Arrow -->
  <path fill="none" d="M 750 175 L 830 175" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- Loopback Failure Arrow -->
  <path d="M 990 130 L 990 90 L 220 90 L 220 130" stroke="#EF4444" stroke-width="2" fill="none" marker-end="url(#arr-r)"/>
  <rect x="520" y="80" width="160" height="22" rx="3" fill="#1C1917" stroke="#EF4444" stroke-width="1"/>
  <text x="600" y="95" font-size="9" font-weight="700" fill="#F87171" text-anchor="middle">CAS Failed: Retry Loop!</text>

  <!-- Bottom Performance Profile -->
  <rect x="50" y="405" width="1100" height="95" rx="6" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="70" y="430" font-size="11" font-weight="700" fill="#F8FAFC">Performance Profile &amp; The ABA Problem:</text>
  <text x="70" y="452" font-size="10" fill="#CBD5E1">&#x2022; <tspan font-weight="700" fill="#34D399">Zero Locking Overhead:</tspan> Threads never park or context-switch into the OS kernel.</text>
  <text x="70" y="470" font-size="10" fill="#CBD5E1">&#x2022; <tspan font-weight="700" fill="#FBBF24">Contention Penalty:</tspan> High contention causes CPU spinning. Solution: Use <tspan font-family="'JetBrains Mono', monospace" fill="#38BDF8">LongAdder</tspan> (cell striping).</text>
  <text x="70" y="488" font-size="10" fill="#CBD5E1">&#x2022; <tspan font-weight="700" fill="#F87171">ABA Trap:</tspan> Value changes A -&gt; B -&gt; A. Solution: Use <tspan font-family="'JetBrains Mono', monospace" fill="#A78BFA">AtomicStampedReference</tspan> (version stamp).</text>
</svg>