<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1200" height="520" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Java 21 Structured Concurrency: StructuredTaskScope Lifecycle</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Coordinated Subtask Forking, Short-Circuit Error Propagation &amp; Guaranteed Resource Cleanup</text>

  <!-- Parent Scope Container -->
  <rect x="50" y="95" width="1100" height="390" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="50" y="95" width="1100" height="30" rx="8" fill="#0C4A6E" stroke="#0284C7" stroke-width="1"/>
  <text x="600" y="116" font-size="12" font-weight="700" fill="#7DD3FC" text-anchor="middle">Parent Scope: handleUserRequest() - StructuredTaskScope.ShutdownOnFailure</text>

  <!-- Subtask 1 -->
  <rect x="80" y="150" width="300" height="150" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="230" y="175" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle">Subtask 1: fetchUserData()</text>
  <text x="95" y="200" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">scope.fork(() -&gt; fetchUser(id));</text>
  <text x="95" y="222" font-size="10" fill="#CBD5E1">&#x2022; Virtual Thread 1 spawned</text>
  <text x="95" y="242" font-size="10" fill="#A7F3D0">&#x2022; Running normally on remote DB</text>
  <text x="95" y="272" font-size="10" font-weight="700" fill="#FBBF24">Target of Cancellation Signal!</text>

  <!-- Subtask 2: FAILS -->
  <rect x="430" y="150" width="320" height="150" rx="6" fill="#1C1917" stroke="#EF4444" stroke-width="2"/>
  <text x="590" y="175" font-size="12" font-weight="700" fill="#F87171" text-anchor="middle">Subtask 2: fetchAccountBalance() [FAILS]</text>
  <text x="445" y="200" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">scope.fork(() -&gt; fetchBalance(id));</text>
  <text x="445" y="222" font-size="10" fill="#CBD5E1">&#x2022; Virtual Thread 2 spawned</text>
  <text x="445" y="245" font-size="11" font-weight="700" fill="#EF4444">&#x2718; Throws TimeoutException!</text>
  <text x="445" y="272" font-size="10" fill="#FCA5A5">Triggers immediate scope-wide shutdown</text>

  <!-- Cancellation Action Box -->
  <rect x="800" y="150" width="320" height="150" rx="6" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="960" y="175" font-size="12" font-weight="700" fill="#C4B5FD" text-anchor="middle">Short-Circuit Cancellation</text>
  <text x="815" y="200" font-size="10" fill="#CBD5E1">ShutdownOnFailure Policy Action:</text>
  <text x="815" y="222" font-size="10" fill="#FBBF24">&#x2022; Subtask 2 failure notifies Scope</text>
  <text x="815" y="242" font-size="10" fill="#FBBF24">&#x2022; Scope interrupts Subtask 1 thread</text>
  <text x="815" y="262" font-size="10" fill="#34D399">&#x2022; Subtask 1 unwinds resources immediately</text>
  <text x="815" y="285" font-size="9" fill="#94A3B8">Prevents orphaned zombie thread execution!</text>

  <!-- Bottom Code Block -->
  <rect x="80" y="325" width="1040" height="140" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="95" y="350" font-size="11" font-weight="700" fill="#7DD3FC">Structured Concurrency Syntax Guarantee:</text>
  <text x="95" y="375" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">try (var scope = new StructuredTaskScope.ShutdownOnFailure()) {</text>
  <text x="110" y="393" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">    Supplier&lt;User&gt; user = scope.fork(() -&gt; fetchUser(id));</text>
  <text x="110" y="411" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">    Supplier&lt;Balance&gt; bal = scope.fork(() -&gt; fetchBalance(id));</text>
  <text x="110" y="429" font-size="10" font-family="'JetBrains Mono', monospace" fill="#34D399">    scope.join().throwIfFailed(); // Joins both forks; throws if any failed!</text>
  <text x="110" y="447" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">    return new Response(user.get(), bal.get());</text>
  <text x="95" y="458" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">}</text>

  <!-- Connectors -->
  <path fill="none" d="M 590 300 L 590 315 L 800 240" stroke="#EF4444" stroke-width="2" marker-end="url(#arr-r)"/>
  <path fill="none" d="M 800 220 L 380 220" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arr-a)"/>
  <text x="410" y="210" font-size="9" font-weight="700" fill="#FBBF24" text-anchor="middle">Interrupts</text>

  <!-- Bottom Invariant -->
  <rect x="50" y="490" width="1100" height="25" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="600" y="507" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Structured Concurrency Invariant: Child threads are strictly bounded by the syntactic block of the parent thread. Zero thread leak.</text>
</svg>