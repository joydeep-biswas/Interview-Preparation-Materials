<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1040" height="540" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="520" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">DispatcherServlet Front Controller: 3-Phase Internal Architecture</text>
  <text x="520" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">How Spring MVC routes requests: Handler mapping resolution, interceptor execution adapter, and HttpMessageConverter serialization</text>
<rect x="30" y="85" width="190" height="435" rx="8" fill="#0b1329" stroke="#3b82f6" stroke-width="1.5"/>
<text x="125" y="112" fill="#60A5FA" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">DispatcherServlet</text>
<rect x="55" y="122" width="140" height="18" rx="9" fill="#1d4ed8"/><text x="125" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Central Front Controller</text>
<rect x="45" y="155" width="160" height="95" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="55" y="178" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Inbound HTTP Request</text>
<text x="55" y="198" fill="#F8FAFC" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">POST /api/orders</text>
<text x="55" y="214" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Headers, JWT Token,</text>
<text x="55" y="228" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">JSON payload body</text>
<rect x="45" y="265" width="160" height="115" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="55" y="288" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">doDispatch() Loop</text>
<text x="55" y="308" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Core routing engine</text>
<text x="55" y="324" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">coordinates all 3 phases</text>
<text x="55" y="340" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">with exception catch</text>
<text x="55" y="354" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">and cleanup blocks</text>
<rect x="45" y="395" width="160" height="110" rx="8" fill="#0b2a4a" stroke="#38bdf8" stroke-width="1"/>
<text x="125" y="417" fill="#93C5FD" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Servlet Pipeline</text>
<text x="125" y="437" fill="#CBD5E1" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Single servlet handles</text>
<text x="125" y="453" fill="#CBD5E1" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">all routes: delegates to</text>
<text x="125" y="469" fill="#6EE7B7" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">specialized strategy beans</text>
<rect x="240" y="85" width="240" height="435" rx="8" fill="#1a1c12" stroke="#f59e0b" stroke-width="1.5"/>
<text x="360" y="112" fill="#FDE68A" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Phase 1: Handler Mapping</text>
<rect x="280" y="122" width="160" height="18" rx="9" fill="#b45309"/><text x="360" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Route &amp; Interceptor Chain</text>
<rect x="255" y="155" width="210" height="85" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
<text x="265" y="178" fill="#FBBF24" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">HandlerMapping</text>
<text x="265" y="198" fill="#CBD5E1" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">RequestMappingHandlerMapping</text>
<text x="265" y="214" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Matches URI path &amp; HTTP method</text>
<text x="265" y="228" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">to target controller method</text>
<rect x="255" y="255" width="210" height="140" rx="8" fill="#332408" stroke="#f59e0b" stroke-width="1.5"/>
<text x="265" y="278" fill="#FDE68A" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">HandlerExecutionChain</text>
<text x="265" y="298" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Assembles target execution unit:</text>
<text x="265" y="316" fill="#34D399" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">1. HandlerMethod (Controller)</text>
<text x="265" y="334" fill="#38BDF8" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">2. List&amp;lt;HandlerInterceptor&amp;gt;</text>
<text x="265" y="350" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">   • SecurityInterceptor</text>
<text x="265" y="364" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">   • MdcLoggingInterceptor</text>
<text x="265" y="378" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">   • RateLimitInterceptor</text>
<rect x="255" y="410" width="210" height="95" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="360" y="432" fill="#CBD5E1" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Fast O(1) Lookup</text>
<text x="360" y="452" fill="#94A3B8" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Pre-indexed lookup map</text>
<text x="360" y="468" fill="#94A3B8" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">generated during startup</text>
<rect x="500" y="85" width="240" height="435" rx="8" fill="#0c1d1a" stroke="#10b981" stroke-width="1.5"/>
<text x="620" y="112" fill="#6EE7B7" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Phase 2: Interceptors &amp; Adapter</text>
<rect x="540" y="122" width="160" height="18" rx="9" fill="#047857" stroke="#10B981" stroke-width="1"/><text x="620" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Controller Execution</text>
<rect x="515" y="155" width="210" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
<text x="525" y="178" fill="#34D399" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">preHandle() Execution</text>
<text x="525" y="198" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Runs each interceptor in order.</text>
<text x="525" y="214" fill="#F87171" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">If any returns false -&gt; ABORTS!</text>
<rect x="515" y="245" width="210" height="110" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
<text x="525" y="268" fill="#6EE7B7" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">HandlerAdapter</text>
<text x="525" y="288" fill="#D1FAE5" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">RequestMappingHandlerAdapter</text>
<text x="525" y="304" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• HandlerMethodArgumentResolver</text>
<text x="525" y="318" fill="#A7F3D0" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  deserializes JSON -&gt; Java DTO</text>
<text x="525" y="334" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Invokes controller method</text>
<rect x="515" y="365" width="210" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
<text x="525" y="388" fill="#34D399" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">postHandle() Execution</text>
<text x="525" y="408" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Post-processes ModelAndView</text>
<text x="525" y="424" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">(Skipped for @ResponseBody/REST)</text>
<rect x="515" y="455" width="210" height="50" rx="8" fill="#0f2e28" stroke="#059669" stroke-width="1"/>
<text x="620" y="475" fill="#A7F3D0" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">afterCompletion() cleanup runs</text>
<text x="620" y="489" fill="#CBD5E1" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">even if exception occurs in controller!</text>
<rect x="760" y="85" width="250" height="435" rx="8" fill="#16122b" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="885" y="112" fill="#C084FC" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Phase 3: Serialization &amp; Egress</text>
<rect x="805" y="122" width="160" height="18" rx="9" fill="#6d28d9"/><text x="885" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">HttpMessageConverter</text>
<rect x="775" y="155" width="220" height="100" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
<text x="785" y="178" fill="#C084FC" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Jackson Serialization</text>
<text x="785" y="198" fill="#DDD6FE" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">MappingJackson2HttpMsgConverter</text>
<text x="785" y="214" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Serializes ResponseEntity&amp;lt;DTO&amp;gt;</text>
<text x="785" y="230" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">into raw JSON byte stream</text>
<rect x="775" y="265" width="220" height="95" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
<text x="785" y="288" fill="#C084FC" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Exception Resolver Fallback</text>
<text x="785" y="308" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">HandlerExceptionResolver</text>
<text x="785" y="324" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Catches uncaught exceptions,</text>
<text x="785" y="340" fill="#FBBF24" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">delegates to @ExceptionHandler</text>
<rect x="775" y="370" width="220" height="135" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
<text x="785" y="393" fill="#6EE7B7" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">HTTP Response Stream</text>
<text x="785" y="413" fill="#D1FAE5" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Status Code: 201 Created</text>
<text x="785" y="429" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Content-Type: application/json</text>
<text x="785" y="445" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Flushes bytes directly to</text>
<text x="785" y="459" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  HttpServletResponse output stream</text>
<text x="785" y="477" fill="#A7F3D0" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Response committed to client!</text>
<line x1="220" y1="202" x2="240" y2="202" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>
<line x1="480" y1="290" x2="500" y2="290" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#arr-a)"/>
<line x1="740" y1="290" x2="760" y2="290" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
</svg>