<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1040" height="520" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="520" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">BeanFactory vs. ApplicationContext Architecture</text>
  <text x="520" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Core IoC interface hierarchy: Lightweight lazy BeanFactory vs. full-featured enterprise ApplicationContext</text>
<rect x="30" y="85" width="390" height="410" rx="8" fill="#0b1329" stroke="#3b82f6" stroke-width="1.5"/>
<text x="225" y="112" fill="#60A5FA" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">BeanFactory (Root IoC Interface)</text>
<rect x="145" y="122" width="160" height="18" rx="9" fill="#1d4ed8"/><text x="225" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">org.springframework.beans</text>
<rect x="50" y="155" width="350" height="80" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="65" y="178" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Core Container Responsibilities</text>
<text x="65" y="198" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• getBean(String name) / getBean(Class&amp;lt;T&amp;gt;)</text>
<text x="65" y="214" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• containsBean(), isSingleton(), isPrototype()</text>
<text x="65" y="228" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Manages bean lifecycles &amp; basic DI</text>
<rect x="50" y="245" width="350" height="75" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
<text x="65" y="268" fill="#FBBF24" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Lazy Bean Instantiation</text>
<text x="65" y="288" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Beans instantiated ON DEMAND when requested</text>
<text x="65" y="304" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Ultra-low startup memory footprint</text>
<rect x="50" y="330" width="350" height="65" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="65" y="350" fill="#CBD5E1" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Typical Production Use Cases</text>
<text x="65" y="368" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Memory-constrained mobile/embedded edge JVMs</text>
<text x="65" y="382" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Lightweight batch test harness CLI tools</text>
<rect x="50" y="405" width="350" height="75" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
<text x="65" y="425" fill="#F87171" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Limitations</text>
<text x="65" y="443" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">✗ No automatic BeanPostProcessor registration</text>
<text x="65" y="459" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">✗ No event publishing, AOP integration, or i18n</text>
<rect x="460" y="85" width="550" height="410" rx="8" fill="#0c1d1a" stroke="#10b981" stroke-width="1.5"/>
<text x="735" y="112" fill="#6EE7B7" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">ApplicationContext (Enterprise Superset)</text>
<rect x="645" y="122" width="180" height="18" rx="9" fill="#047857" stroke="#10B981" stroke-width="1"/><text x="735" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">org.springframework.context</text>
<rect x="480" y="155" width="510" height="45" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
<text x="735" y="175" fill="#A7F3D0" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Extends BeanFactory + MessageSource + ApplicationEventPublisher</text>
<text x="735" y="190" fill="#D1FAE5" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Eager pre-instantiation of all singleton beans at startup</text>
<rect x="480" y="210" width="245" height="80" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="495" y="230" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">AOP &amp; Declarative Services</text>
<text x="495" y="250" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Auto-detects BeanPostProcessors</text>
<text x="495" y="266" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Transparent @Transactional</text>
<text x="495" y="280" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Transparent @Async &amp; @Secured</text>
<rect x="745" y="210" width="245" height="80" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
<text x="760" y="230" fill="#C084FC" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Event Publication System</text>
<text x="760" y="250" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• ApplicationEventPublisher</text>
<text x="760" y="266" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Decoupled publish/subscribe</text>
<text x="760" y="280" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Supports @EventListener</text>
<rect x="480" y="300" width="245" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
<text x="495" y="320" fill="#FBBF24" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Environment &amp; Profiles</text>
<text x="495" y="340" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Active profiles (dev, prod)</text>
<text x="495" y="356" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• PropertySource abstraction</text>
<text x="495" y="370" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• ConfigurablePropertyResolver</text>
<rect x="745" y="300" width="245" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
<text x="760" y="320" fill="#34D399" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">i18n &amp; Resource Loading</text>
<text x="760" y="340" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• MessageSource localization</text>
<text x="760" y="356" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• ResourcePatternResolver</text>
<text x="760" y="370" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Loads classpath:/ and file:/</text>
<rect x="480" y="390" width="510" height="85" rx="8" fill="#0f2e28" stroke="#059669" stroke-width="1"/>
<text x="735" y="412" fill="#34D399" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Enterprise Recommendation</text>
<text x="495" y="432" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Always use ApplicationContext in enterprise microservices. Eager singleton</text>
<text x="495" y="448" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">instantiation surfaces misconfiguration and missing dependencies at startup time</text>
<text x="495" y="464" fill="#6EE7B7" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">rather than crashing later during active production customer requests!</text>
<line x1="420" y1="290" x2="460" y2="290" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
</svg>