<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1040" height="520" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="520" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Spring Stereotype Annotations Hierarchy &amp; Responsibilities</text>
  <text x="520" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Component specialization: @Component meta-annotation, domain architectural layers, and automatic exception translation</text>
<rect x="370" y="85" width="300" height="80" rx="8" fill="#0b1329" stroke="#3b82f6" stroke-width="2"/>
<text x="520" y="110" fill="#60A5FA" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">@Component (Meta-Annotation Root)</text>
<rect x="430" y="120" width="180" height="18" rx="9" fill="#1d4ed8"/><text x="520" y="132" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">org.springframework.stereotype</text>
<text x="520" y="153" fill="#CBD5E1" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">General-purpose Spring-managed bean candidate for classpath scanning</text>
<rect x="30" y="210" width="220" height="280" rx="8" fill="#0c1d1a" stroke="#10b981" stroke-width="1.5"/>
<text x="140" y="235" fill="#6EE7B7" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">@Service</text>
<rect x="60" y="245" width="160" height="18" rx="9" fill="#047857" stroke="#10B981" stroke-width="1"/><text x="140" y="257" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Business Logic Layer</text>
<rect x="45" y="275" width="190" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
<text x="55" y="298" fill="#34D399" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Domain Semantics</text>
<text x="55" y="318" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Orchestrates business rules</text>
<text x="55" y="334" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Coordinates multiple DAOs</text>
<text x="55" y="348" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Holds domain logic</text>
<rect x="45" y="365" width="190" height="110" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
<text x="55" y="388" fill="#A7F3D0" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Key Characteristics</text>
<text x="55" y="408" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Primary boundary for</text>
<text x="55" y="422" fill="#34D399" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  declarative @Transactional</text>
<text x="55" y="438" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Clean stateless service</text>
<text x="55" y="454" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Zero UI/HTTP web code</text>
<rect x="280" y="210" width="220" height="280" rx="8" fill="#16122b" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="390" y="235" fill="#C084FC" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">@Repository</text>
<rect x="310" y="245" width="160" height="18" rx="9" fill="#6d28d9"/><text x="390" y="257" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Data Persistence Layer</text>
<rect x="295" y="275" width="190" height="80" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
<text x="305" y="298" fill="#C084FC" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Persistence Semantics</text>
<text x="305" y="318" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• DAO / CRUD operations</text>
<text x="305" y="334" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Database query methods</text>
<text x="305" y="348" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• JPA / Hibernate / JDBC</text>
<rect x="295" y="365" width="190" height="110" rx="8" fill="#2e1065" stroke="#8b5cf6" stroke-width="1"/>
<text x="305" y="388" fill="#DDD6FE" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Exception Translation!</text>
<text x="305" y="408" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Enables PersistenceException</text>
<text x="305" y="422" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  TranslationPostProcessor</text>
<text x="305" y="438" fill="#38BDF8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Converts vendor SQLException</text>
<text x="305" y="452" fill="#38BDF8" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  to Spring DataAccessException!</text>
<rect x="530" y="210" width="240" height="280" rx="8" fill="#1a1c12" stroke="#f59e0b" stroke-width="1.5"/>
<text x="650" y="235" fill="#FDE68A" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">@Controller / @RestController</text>
<rect x="570" y="245" width="160" height="18" rx="9" fill="#b45309"/><text x="650" y="257" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Presentation / Web Layer</text>
<rect x="545" y="275" width="210" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
<text x="555" y="298" fill="#FBBF24" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">@Controller (MVC)</text>
<text x="555" y="318" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Handles HTTP web requests</text>
<text x="555" y="334" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Returns View names (HTML/JSP)</text>
<text x="555" y="348" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Server-side rendering (SSR)</text>
<rect x="545" y="365" width="210" height="110" rx="8" fill="#332408" stroke="#f59e0b" stroke-width="1"/>
<text x="555" y="388" fill="#FDE68A" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">@RestController (REST API)</text>
<text x="555" y="408" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Combines @Controller +</text>
<text x="555" y="422" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  @ResponseBody on all methods</text>
<text x="555" y="438" fill="#6EE7B7" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Serializes Java objects directly</text>
<text x="555" y="452" fill="#6EE7B7" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  to JSON/XML via Jackson</text>
<rect x="800" y="210" width="210" height="280" rx="8" fill="#0b1329" stroke="#38bdf8" stroke-width="1.5"/>
<text x="905" y="235" fill="#38BDF8" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">@Configuration</text>
<rect x="825" y="245" width="160" height="18" rx="9" fill="#0284c7"/><text x="905" y="257" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Java Config Factory</text>
<rect x="815" y="275" width="180" height="80" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="825" y="298" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Factory Semantics</text>
<text x="825" y="318" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Declares @Bean methods</text>
<text x="825" y="334" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Third-party library setup</text>
<text x="825" y="348" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Programmatic IoC config</text>
<rect x="815" y="365" width="180" height="110" rx="8" fill="#0b2a4a" stroke="#38bdf8" stroke-width="1"/>
<text x="825" y="388" fill="#93C5FD" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">CGLIB Proxying!</text>
<text x="825" y="408" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• proxyBeanMethods=true</text>
<text x="825" y="422" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Intercepts calls to @Bean</text>
<text x="825" y="438" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  methods to guarantee</text>
<text x="825" y="452" fill="#34D399" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  singleton semantics!</text>
<path d="M 420 165 L 420 185 L 140 185 L 140 210" stroke="#10b981" stroke-width="1.5" fill="none" marker-end="url(#arr-g)"/>
<path d="M 480 165 L 480 185 L 390 185 L 390 210" stroke="#8b5cf6" stroke-width="1.5" fill="none" marker-end="url(#arr-p)"/>
<path d="M 560 165 L 560 185 L 650 185 L 650 210" stroke="#f59e0b" stroke-width="1.5" fill="none" marker-end="url(#arr-a)"/>
<path d="M 620 165 L 620 185 L 905 185 L 905 210" stroke="#38bdf8" stroke-width="1.5" fill="none" marker-end="url(#arr-b)"/>
</svg>