  <rect width="1040" height="580" rx="10" fill="url(#bg)"/>
  <text x="520" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">End-to-End Spring Boot HTTP Request Lifecycle Sequence</text>
  <text x="520" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Detailed step-by-step trace: FilterChain, DispatcherServlet, ArgumentResolver, Controller, and Jackson response flush</text>
