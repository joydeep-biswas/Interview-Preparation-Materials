<text x="335" y="174" fill="#CBD5E1" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">2. doFilter() (CORS, Trace ID)</text>
<line x1="420" y1="220" x2="600" y2="220" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr-b)"/>
<text x="510" y="214" fill="#60A5FA" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">3. handle(request, handlerMethod)</text>
