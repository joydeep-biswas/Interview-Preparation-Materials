<text x="775" y="289" fill="#34D399" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">5. Returns validated CreateOrderRequest DTO</text>
<line x1="600" y1="335" x2="780" y2="335" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/>
<text x="690" y="329" fill="#34D399" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">6. createOrder(requestDto)</text>
<rect x="720" y="360" width="120" height="24" rx="4" fill="#332408" stroke="#f59e0b" stroke-width="1"/>
<text x="780" y="376" fill="#FDE68A" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">@Transactional DB write</text>
<line x1="780" y1="410" x2="600" y2="410" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-a)"/>
<text x="690" y="404" fill="#FBBF24" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">7. return ResponseEntity.created(dto)</text>
<line x1="600" y1="445" x2="950" y2="445" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arr-p)"/>
<text x="775" y="439" fill="#C084FC" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">8. write(dto, application/json, responseStream)</text>
<line x1="600" y1="480" x2="420" y2="480" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr-s)"/>
<text x="510" y="474" fill="#CBD5E1" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">9. afterCompletion() interceptor cleanup</text>
<line x1="420" y1="515" x2="90" y2="515" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
<text x="255" y="509" fill="#34D399" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">10. HTTP 201 Created + JSON payload stream</text>
