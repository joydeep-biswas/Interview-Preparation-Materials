<line x1="950" y1="121" x2="950" y2="545" stroke="#334155" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arr-s)"/>
<line x1="90" y1="145" x2="250" y2="145" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>
<text x="170" y="139" fill="#38BDF8" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">1. POST /api/orders (JSON)</text>
