<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1040" height="540" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="520" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Transport Protocol Evolution: HTTP/1.1 vs. HTTP/2 vs. HTTP/3 (QUIC)</text>
  <text x="520" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">The journey to zero Head-of-Line blocking: Text framing, binary multiplexing, and UDP-based QUIC transport</text>
<rect x="30" y="85" width="300" height="435" rx="8" fill="#1a1116" stroke="#ef4444" stroke-width="1.5"/>
<text x="180" y="112" fill="#FCA5A5" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">HTTP/1.1 (1997)</text>
<rect x="90" y="122" width="180" height="18" rx="9" fill="#991b1b"/><text x="180" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Text-Based &amp; Sequential</text>
<rect x="45" y="155" width="270" height="75" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
<text x="55" y="178" fill="#F8FAFC" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Text Framing &amp; Headers</text>
<text x="55" y="198" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Human-readable ASCII framing</text>
<text x="55" y="214" fill="#F87171" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Redundant uncompressed headers</text>
<rect x="45" y="240" width="270" height="85" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
<text x="55" y="263" fill="#FCA5A5" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Head-of-Line (HoL) Blocking</text>
<text x="55" y="283" fill="#F87171" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Only 1 request active per TCP socket!</text>
<text x="55" y="299" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Slow request blocks all behind it</text>
<text x="55" y="313" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Workaround: 6 parallel TCP connections</text>
<rect x="45" y="335" width="270" height="75" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
<text x="55" y="358" fill="#CBD5E1" font-size="11" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Transport Layer</text>
<text x="55" y="378" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Standard TCP + TLS handshake</text>
<text x="55" y="394" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• 2-3 RTT roundtrips before data transfer</text>
<rect x="45" y="420" width="270" height="85" rx="8" fill="#2d1215" stroke="#dc2626" stroke-width="1"/>
<text x="180" y="442" fill="#F87171" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Legacy Web Bottleneck</text>
<text x="55" y="462" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">✗ Severe latency on mobile/high-latency links</text>
<text x="55" y="478" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">✗ Browser limits parallel socket count (6/domain)</text>
<rect x="370" y="85" width="300" height="435" rx="8" fill="#0b1329" stroke="#3b82f6" stroke-width="1.5"/>
<text x="520" y="112" fill="#60A5FA" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">HTTP/2 (2015)</text>
<rect x="430" y="122" width="180" height="18" rx="9" fill="#1d4ed8"/><text x="520" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Binary Multiplexing</text>
<rect x="385" y="155" width="270" height="75" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="395" y="178" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Binary Framing &amp; HPACK</text>
<text x="395" y="198" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Binary HEADERS &amp; DATA frames</text>
<text x="395" y="214" fill="#6EE7B7" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• HPACK compresses header tables</text>
<rect x="385" y="240" width="270" height="85" rx="8" fill="#0b2a4a" stroke="#38bdf8" stroke-width="1.5"/>
<text x="395" y="263" fill="#93C5FD" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Multiplexing over 1 TCP Socket</text>
<text x="395" y="283" fill="#D1FAE5" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Multiple concurrent streams on 1 socket</text>
<text x="395" y="299" fill="#34D399" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Solves HTTP-layer HoL blocking!</text>
<text x="395" y="313" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Stream prioritization &amp; server push</text>
<rect x="385" y="335" width="270" height="75" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
<text x="395" y="358" fill="#FBBF24" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">The Remaining TCP Bottleneck</text>
<text x="395" y="378" fill="#F87171" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Still runs on TCP! If 1 packet drops,</text>
<text x="395" y="394" fill="#F87171" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  TCP stalls ALL streams on that socket!</text>
<rect x="385" y="420" width="270" height="85" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
<text x="520" y="442" fill="#38BDF8" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">gRPC &amp; Microservice Standard</text>
<text x="395" y="462" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">✓ Foundation for high-performance gRPC</text>
<text x="395" y="478" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">✓ Supported natively by Tomcat 9+ &amp; Netty</text>
<rect x="710" y="85" width="300" height="435" rx="8" fill="#0c1d1a" stroke="#10b981" stroke-width="1.5"/>
<text x="860" y="112" fill="#6EE7B7" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">HTTP/3 (2022+)</text>
<rect x="780" y="122" width="160" height="18" rx="9" fill="#047857" stroke="#10B981" stroke-width="1"/><text x="860" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">QUIC Transport over UDP</text>
<rect x="725" y="155" width="270" height="75" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
<text x="735" y="178" fill="#34D399" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">QUIC Protocol (over UDP)</text>
<text x="735" y="198" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Replaces TCP with UDP + QUIC</text>
<text x="735" y="214" fill="#6EE7B7" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Native TLS 1.3 encryption built-in</text>
<rect x="725" y="240" width="270" height="85" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
<text x="735" y="263" fill="#6EE7B7" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">ZERO TCP-Layer HoL Blocking!</text>
<text x="735" y="283" fill="#D1FAE5" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Streams are 100% independent!</text>
<text x="735" y="299" fill="#A7F3D0" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Dropped packet in Stream A has ZERO</text>
<text x="735" y="313" fill="#A7F3D0" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  impact on Stream B (continues at full speed)</text>
<rect x="725" y="335" width="270" height="75" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
<text x="735" y="358" fill="#34D399" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">0-RTT Fast Reconnection</text>
<text x="735" y="378" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Instant connection resumption</text>
<text x="735" y="394" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Connection ID enables roaming without drops</text>
<rect x="725" y="420" width="270" height="85" rx="8" fill="#0f2e28" stroke="#059669" stroke-width="1"/>
<text x="860" y="442" fill="#34D399" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">The Modern Edge Frontier</text>
<text x="735" y="462" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">✓ Flawless mobile roaming (Wi-Fi &amp;lt;-&amp;gt; 5G)</text>
<text x="735" y="478" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">✓ Rapidly adopted by Cloudflare, Google &amp; CDNs</text>
<line x1="330" y1="280" x2="370" y2="280" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>
<line x1="670" y1="280" x2="710" y2="280" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
</svg>