<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1040" height="500" rx="10" fill="url(#bg)"/>
  <text x="520" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Direct Coupling vs. Inversion of Control (IoC)</text>
  <text x="520" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Architectural comparison: Tightly-coupled 'new' instantiation vs. centralized Spring IoC container dependency injection</text>
<rect x="30" y="85" width="460" height="395" rx="8" fill="#1a1116" stroke="#ef4444" stroke-width="1.5"/>
<text x="260" y="112" fill="#FCA5A5" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Traditional Direct Coupling (No IoC)</text>
<rect x="170" y="122" width="180" height="18" rx="9" fill="#991b1b"/><text x="260" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Tightly Coupled &amp; Hard to Test</text>
<rect x="50" y="155" width="420" height="60" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
<text x="65" y="178" fill="#F8FAFC" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">OrderService</text>
<text x="65" y="198" fill="#F87171" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">calls: new PostgresOrderRepository() directly in constructor!</text>
<rect x="50" y="230" width="420" height="60" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
<text x="65" y="253" fill="#F8FAFC" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">PostgresOrderRepository</text>
<text x="65" y="273" fill="#F87171" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">calls: new HikariDataSource('jdbc:postgresql://...') directly!</text>
<rect x="50" y="305" width="420" height="60" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
<text x="65" y="328" fill="#F8FAFC" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Database Driver &amp; Network</text>
<text x="65" y="348" fill="#F87171" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">calls: new Socket('db.prod.internal', 5432) hardcoded!</text>
<rect x="50" y="380" width="420" height="85" rx="8" fill="#2d1215" stroke="#dc2626" stroke-width="1"/>
<text x="260" y="403" fill="#F87171" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">The Direct Coupling Flaw</text>
<text x="65" y="425" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">✗ Cannot mock dependencies in unit tests without starting real DB</text>
<text x="65" y="443" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">✗ Swapping DB implementation requires modifying every caller</text>
<text x="65" y="458" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">✗ Object lifecycle is scattered across random class constructors</text>
<line x1="260" y1="215" x2="260" y2="230" stroke="#F87171" stroke-width="1.5" marker-end="url(#arr-r)"/>
<line x1="260" y1="290" x2="260" y2="305" stroke="#F87171" stroke-width="1.5" marker-end="url(#arr-r)"/>
<rect x="550" y="85" width="460" height="395" rx="8" fill="#0c1d1a" stroke="#10b981" stroke-width="1.5"/>
<text x="780" y="112" fill="#6EE7B7" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Inversion of Control (Spring IoC Container)</text>
<rect x="690" y="122" width="180" height="18" rx="9" fill="#047857"/><text x="780" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Decoupled &amp; Interface-Driven</text>
<rect x="570" y="155" width="420" height="80" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
<text x="585" y="178" fill="#6EE7B7" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Spring ApplicationContext (IoC Container)</text>
<text x="585" y="198" fill="#D1FAE5" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Centralized bean registry &amp; lifecycle orchestrator</text>
<text x="585" y="214" fill="#A7F3D0" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Reads @Configuration &amp; instantiates singletons in correct order</text>
<rect x="570" y="250" width="420" height="50" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
<text x="585" y="270" fill="#34D399" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">1. DataSource Bean (HikariDataSource)</text>
<text x="585" y="288" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Instantiated once with connection pooling configuration</text>
<rect x="570" y="310" width="420" height="50" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
<text x="585" y="330" fill="#34D399" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">2. OrderRepository Bean (implements interface)</text>
<text x="585" y="348" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Container injects DataSource into repository constructor</text>
<rect x="570" y="370" width="420" height="50" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
<text x="585" y="390" fill="#34D399" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">3. OrderService Bean (Consumer)</text>
<text x="585" y="408" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Container injects OrderRepository into service constructor</text>
<rect x="570" y="430" width="420" height="40" rx="8" fill="#0f2e28" stroke="#059669" stroke-width="1"/>
<text x="780" y="452" fill="#34D399" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">✓ Effortless unit testing via Mockito | Zero hardcoded class instantiations</text>
<line x1="780" y1="235" x2="780" y2="250" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
<line x1="780" y1="300" x2="780" y2="310" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
<line x1="780" y1="360" x2="780" y2="370" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
</svg>