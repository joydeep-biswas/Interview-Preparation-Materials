      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1040" height="520" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="520" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Multi-Bean Injection &amp; The Dynamic Strategy Pattern</text>
  <text x="520" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Eliminating complex switch statements: Auto-wiring Map&lt;PaymentMethod, PaymentProcessor&gt; for O(1) runtime dispatch</text>
<rect x="30" y="85" width="250" height="410" rx="8" fill="#0b1329" stroke="#3b82f6" stroke-width="1.5"/>
<text x="155" y="112" fill="#60A5FA" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">1. IoC Discovery</text>
<rect x="75" y="122" width="160" height="18" rx="9" fill="#1d4ed8"/><text x="155" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Spring ApplicationContext</text>
<rect x="45" y="155" width="220" height="110" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="55" y="178" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Classpath Scanning</text>
<text x="55" y="198" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Finds all Spring beans</text>
<text x="55" y="214" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">implementing interface:</text>
<text x="55" y="230" fill="#6EE7B7" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">PaymentProcessor</text>
<text x="55" y="246" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Auto-collects into collection</text>
<rect x="45" y="280" width="220" height="195" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="55" y="303" fill="#FBBF24" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Open-Closed Principle</text>
<text x="55" y="323" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Adding a new payment method</text>
<text x="55" y="339" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">(e.g., Klarna, Pix, UPI)</text>
<text x="55" y="355" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">requires creating ONE new class:</text>
<text x="55" y="375" fill="#38BDF8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">@Component</text>
<text x="55" y="389" fill="#38BDF8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">class KlarnaProcessor...</text>
<text x="55" y="415" fill="#34D399" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Zero lines modified in existing</text>
<text x="55" y="429" fill="#34D399" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">service or dispatcher code!</text>
<text x="55" y="450" fill="#94A3B8" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">100% Extensible without risk</text>
<rect x="310" y="85" width="290" height="410" rx="8" fill="#1a1c12" stroke="#f59e0b" stroke-width="1.5"/>
<text x="455" y="112" fill="#FDE68A" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">2. Strategy Registry Map</text>
<rect x="365" y="122" width="180" height="18" rx="9" fill="#b45309"/><text x="455" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Auto-Injected Keyed Map</text>
<rect x="325" y="155" width="260" height="110" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
<text x="335" y="178" fill="#FBBF24" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">PaymentService Constructor</text>
<text x="335" y="198" fill="#F8FAFC" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">private final Map&amp;lt;PaymentMethod,</text>
<text x="335" y="214" fill="#F8FAFC" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">                  PaymentProcessor&amp;gt; map;</text>
<text x="335" y="234" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">public PaymentService(List&amp;lt;PaymentProcessor&amp;gt; ps) {</text>
<text x="335" y="248" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">    this.map = ps.stream().collect(...); }</text>
<rect x="325" y="280" width="260" height="115" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
<text x="335" y="303" fill="#6EE7B7" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">O(1) Dynamic Dispatch</text>
<text x="335" y="323" fill="#D1FAE5" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">public void process(PaymentReq req) {</text>
<text x="335" y="339" fill="#A7F3D0" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">    PaymentProcessor p = map.get(req.method());</text>
<text x="335" y="355" fill="#D1FAE5" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">    if (p == null) throw new ...;</text>
<text x="335" y="371" fill="#A7F3D0" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">    p.execute(req); }</text>
<rect x="325" y="410" width="260" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
<text x="455" y="432" fill="#FBBF24" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">No if/else or switch statements!</text>
<text x="455" y="452" fill="#CBD5E1" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Eliminates cyclomatic complexity</text>
<rect x="630" y="85" width="380" height="410" rx="8" fill="#0c1d1a" stroke="#10b981" stroke-width="1.5"/>
<text x="820" y="112" fill="#6EE7B7" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">3. Concrete Strategy Implementations</text>
<rect x="730" y="122" width="180" height="18" rx="9" fill="#047857" stroke="#10B981" stroke-width="1"/><text x="820" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Polymorphic Strategy Beans</text>
<rect x="650" y="155" width="340" height="70" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
<text x="665" y="178" fill="#34D399" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">CreditCardProcessor</text>
<text x="665" y="198" fill="#FBBF24" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Key: PaymentMethod.CREDIT_CARD</text>
<text x="665" y="212" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Executes Visa / Mastercard payment gateway flow</text>
<rect x="650" y="235" width="340" height="70" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
<text x="665" y="258" fill="#34D399" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">ApplePayProcessor</text>
<text x="665" y="278" fill="#FBBF24" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Key: PaymentMethod.APPLE_PAY</text>
<text x="665" y="292" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Handles Apple Pay token decryption &amp; biometrics</text>
<rect x="650" y="315" width="340" height="70" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
<text x="665" y="338" fill="#34D399" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">PayPalProcessor</text>
<text x="665" y="358" fill="#FBBF24" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Key: PaymentMethod.PAYPAL</text>
<text x="665" y="372" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Executes PayPal REST API redirect handshake</text>
<rect x="650" y="395" width="340" height="75" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
<text x="665" y="418" fill="#34D399" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">CryptoProcessor</text>
<text x="665" y="438" fill="#FBBF24" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Key: PaymentMethod.CRYPTO</text>
<text x="665" y="452" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Verifies on-chain transaction &amp; gas confirmation</text>
