<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1040" height="520" rx="10" fill="url(#bg)"/>
  <text x="520" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">HandlerInterceptor Lifecycle &amp; ThreadLocal Context Cleanup</text>
  <text x="520" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Pre-handle gatekeeping, controller execution, post-processing, and guaranteed afterCompletion finally cleanup</text>
<rect x="30" y="85" width="220" height="410" rx="8" fill="#0b1329" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140" y="112" fill="#60A5FA" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">1. preHandle()</text>
<rect x="60" y="122" width="160" height="18" rx="9" fill="#1d4ed8"/><text x="140" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Returns boolean</text>
<rect x="45" y="155" width="190" height="85" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="55" y="178" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Gatekeeper Execution</text>
<text x="55" y="198" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Executes BEFORE controller</text>
<text x="55" y="214" fill="#6EE7B7" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• If returns true: proceeds</text>
<text x="55" y="228" fill="#F87171" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• If false: halts request immediately!</text>
<rect x="45" y="255" width="190" height="120" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
<text x="55" y="278" fill="#6EE7B7" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">ThreadLocal Setup</text>
<text x="55" y="298" fill="#D1FAE5" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Extracts X-Trace-Id header</text>
<text x="55" y="314" fill="#A7F3D0" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Pushes to MDC.put('traceId')</text>
<text x="55" y="330" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Injects UserContext into</text>
<text x="55" y="344" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  ThreadLocal context holder</text>
<text x="55" y="360" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Binds to Tomcat worker thread</text>
<rect x="45" y="390" width="190" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="140" y="412" fill="#CBD5E1" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Typical Interceptors</text>
<text x="140" y="432" fill="#94A3B8" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Auth / Token validation</text>
<text x="140" y="448" fill="#94A3B8" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">IP Rate limiting check</text>
<text x="140" y="464" fill="#94A3B8" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Request timing benchmark</text>
<rect x="280" y="85" width="220" height="410" rx="8" fill="#0c1d1a" stroke="#10b981" stroke-width="1.5"/>
<text x="390" y="112" fill="#6EE7B7" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">2. Controller Execution</text>
<rect x="310" y="122" width="160" height="18" rx="9" fill="#047857"/><text x="390" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">HandlerMethod</text>
<rect x="295" y="155" width="190" height="95" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
<text x="305" y="178" fill="#34D399" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Business Logic Layer</text>
<text x="305" y="198" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Invokes @Service methods</text>
<text x="305" y="214" fill="#6EE7B7" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Reads ThreadLocal context</text>
<text x="305" y="230" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  seamlessly in services</text>
<text x="305" y="244" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Executes DB transactions</text>
<rect x="295" y="265" width="190" height="110" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
<text x="305" y="288" fill="#34D399" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Return Value</text>
<text x="305" y="308" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Returns ResponseEntity&amp;lt;T&amp;gt;</text>
<text x="305" y="324" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Or throws business exception</text>
<text x="305" y="340" fill="#F87171" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  (e.g., OrderNotFoundException)</text>
<text x="305" y="356" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Handled by @ExceptionHandler</text>
<rect x="295" y="390" width="190" height="85" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
<text x="390" y="412" fill="#6EE7B7" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Worker Thread State</text>
<text x="390" y="432" fill="#CBD5E1" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Thread: http-nio-8080-exec-1</text>
<text x="390" y="448" fill="#A7F3D0" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Carries ThreadLocal map</text>
<text x="390" y="464" fill="#CBD5E1" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">through entire stack</text>
<rect x="530" y="85" width="220" height="410" rx="8" fill="#1a1c12" stroke="#f59e0b" stroke-width="1.5"/>
<text x="640" y="112" fill="#FDE68A" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">3. postHandle()</text>
<rect x="560" y="122" width="160" height="18" rx="9" fill="#b45309"/><text x="640" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Before View Render</text>
<rect x="545" y="155" width="190" height="95" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
<text x="555" y="178" fill="#FBBF24" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Execution Timing</text>
<text x="555" y="198" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Runs AFTER controller returns,</text>
<text x="555" y="214" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  BEFORE view rendering</text>
<text x="555" y="230" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Can inspect/modify ModelAndView</text>
<text x="555" y="244" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  in traditional MVC apps</text>
<rect x="545" y="265" width="190" height="110" rx="8" fill="#332408" stroke="#f59e0b" stroke-width="1.5"/>
<text x="555" y="288" fill="#FDE68A" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">REST API Caveat!</text>
<text x="555" y="308" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• SKIPPED if an unhandled</text>
<text x="555" y="324" fill="#F87171" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  exception is thrown in controller!</text>
<text x="555" y="340" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• For @RestController / JSON,</text>
<text x="555" y="356" fill="#FBBF24" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  response bytes already flushed!</text>
<rect x="545" y="390" width="190" height="85" rx="8" fill="#2d1215" stroke="#ef4444" stroke-width="1"/>
<text x="640" y="412" fill="#F87171" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">CRITICAL RULE:</text>
<text x="640" y="432" fill="#FCA5A5" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">NEVER clean up ThreadLocal</text>
<text x="640" y="448" fill="#F87171" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">or MDC in postHandle()!</text>
<text x="640" y="464" fill="#CBD5E1" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Exceptions cause memory leaks!</text>
<rect x="780" y="85" width="230" height="410" rx="8" fill="#1a1116" stroke="#ef4444" stroke-width="1.5"/>
<text x="895" y="112" fill="#FCA5A5" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">4. afterCompletion()</text>
<rect x="815" y="122" width="160" height="18" rx="9" fill="#991b1b"/><text x="895" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">GUARANTEED FINALLY</text>
<rect x="795" y="155" width="200" height="105" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
<text x="805" y="178" fill="#FCA5A5" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Guaranteed Execution</text>
<text x="805" y="198" fill="#F87171" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• ALWAYS runs in a finally block,</text>
<text x="805" y="214" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  even if controller or filter crashes!</text>
<text x="805" y="230" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Receives Exception ex parameter</text>
<text x="805" y="246" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  if any failure occurred</text>
<rect x="795" y="275" width="200" height="120" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
<text x="805" y="298" fill="#6EE7B7" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Mandatory Cleanup Site!</text>
<text x="805" y="318" fill="#D1FAE5" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• MDC.clear();</text>
<text x="805" y="334" fill="#D1FAE5" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• UserContext.clear();</text>
<text x="805" y="350" fill="#A7F3D0" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Releases ThreadLocal map entries</text>
<text x="805" y="366" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Prevents thread pool cross-tenant</text>
<text x="805" y="380" fill="#34D399" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  data pollution &amp; memory leaks!</text>
<rect x="795" y="410" width="200" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
<text x="895" y="432" fill="#CBD5E1" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Tomcat Thread Returned Clean</text>
<text x="895" y="452" fill="#38BDF8" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Thread returned to pool safely</text>
<line x1="250" y1="290" x2="280" y2="290" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>
<line x1="500" y1="290" x2="530" y2="290" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
<line x1="750" y1="290" x2="780" y2="290" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#arr-a)"/>
</svg>