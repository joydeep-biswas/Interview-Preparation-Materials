<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1040" height="540" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="520" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">The Auto-Configuration Engine: Conditional Evaluation Pipeline</text>
  <text x="520" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">How Spring Boot selectively configures beans: AutoConfiguration.imports, @Conditional annotations, and context registration</text>
<rect x="30" y="85" width="250" height="435" rx="8" fill="#0b1329" stroke="#3b82f6" stroke-width="1.5"/>
<text x="155" y="112" fill="#60A5FA" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">1. Discovery &amp; Import</text>
<rect x="75" y="122" width="160" height="18" rx="9" fill="#1d4ed8"/><text x="155" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">AutoConfiguration.imports</text>
<rect x="45" y="155" width="220" height="85" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="55" y="178" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Bootstrap Entry Point</text>
<text x="55" y="198" fill="#F8FAFC" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">SpringApplication.run()</text>
<text x="55" y="214" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Invokes AutoConfiguration</text>
<text x="55" y="228" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">ImportSelector.selectImports()</text>
<rect x="45" y="250" width="220" height="120" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="55" y="273" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Read Candidate List</text>
<text x="55" y="293" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Reads candidate class list from:</text>
<text x="55" y="309" fill="#FBBF24" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">META-INF/spring/</text>
<text x="55" y="323" fill="#FBBF24" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">org.springframework.boot.</text>
<text x="55" y="337" fill="#FBBF24" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">autoconfigure.AutoConfiguration</text>
<text x="55" y="351" fill="#FBBF24" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">.imports (Spring Boot 3 / 2.7+)</text>
<rect x="45" y="380" width="220" height="125" rx="8" fill="#0b2a4a" stroke="#38bdf8" stroke-width="1"/>
<text x="55" y="403" fill="#93C5FD" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Sorting &amp; Precedence</text>
<text x="55" y="423" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Orders configurations via:</text>
<text x="55" y="441" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• @AutoConfiguration(before=...)</text>
<text x="55" y="457" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• @AutoConfiguration(after=...)</text>
<text x="55" y="473" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• @AutoConfigureOrder</text>
<text x="55" y="489" fill="#6EE7B7" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Deterministic execution graph</text>
<rect x="310" y="85" width="360" height="435" rx="8" fill="#1a1c12" stroke="#f59e0b" stroke-width="1.5"/>
<text x="490" y="112" fill="#FDE68A" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">2. Conditional Filter Evaluation</text>
<rect x="410" y="122" width="160" height="18" rx="9" fill="#b45309"/><text x="490" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">OnCondition Evaluators</text>
<rect x="325" y="155" width="330" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
<text x="335" y="178" fill="#FBBF24" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">@ConditionalOnClass(DataSource.class)</text>
<text x="335" y="198" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Checks if target class exists on JVM classpath</text>
<text x="335" y="214" fill="#F87171" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">If JDBC driver jar is missing -&gt; Immediately skipped!</text>
<rect x="325" y="245" width="330" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
<text x="335" y="268" fill="#FBBF24" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">@ConditionalOnMissingBean(DataSource.class)</text>
<text x="335" y="288" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Checks if developer ALREADY provided custom @Bean</text>
<text x="335" y="304" fill="#34D399" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Developer bean takes 100% precedence; auto-config backs off!</text>
<rect x="325" y="335" width="330" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
<text x="335" y="358" fill="#FBBF24" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">@ConditionalOnProperty('spring.datasource.enabled')</text>
<text x="335" y="378" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Checks environment / application.yml properties</text>
<text x="335" y="394" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">havingValue = 'true', matchIfMissing = true</text>
<rect x="325" y="425" width="330" height="80" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="490" y="447" fill="#CBD5E1" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Evaluation Report (ConditionEvaluationReport)</text>
<text x="490" y="467" fill="#94A3B8" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">View full positive &amp; negative matches via:</text>
<text x="490" y="483" fill="#38BDF8" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">java -jar app.jar --debug OR /actuator/conditions</text>
<rect x="700" y="85" width="310" height="435" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
<text x="855" y="112" fill="#F8FAFC" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">3. Configuration Outcomes</text>
<rect x="775" y="122" width="160" height="18" rx="9" fill="#334155"/><text x="855" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Context Graph Results</text>
<rect x="715" y="155" width="280" height="150" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
<text x="855" y="178" fill="#6EE7B7" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Outcome A: All Conditions MATCH</text>
<rect x="775" y="188" width="160" height="16" rx="8" fill="#047857" stroke="#10B981" stroke-width="1"/><text x="855" y="199" fill="#ffffff" font-size="8" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">CONFIGURATION LOADED</text>
<text x="725" y="222" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Auto-configuration class is loaded</text>
<text x="725" y="240" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Evaluates internal @Bean methods</text>
<text x="725" y="258" fill="#D1FAE5" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Registers HikariDataSource bean into</text>
<text x="725" y="274" fill="#D1FAE5" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  Spring BeanFactory registry!</text>
<text x="725" y="290" fill="#A7F3D0" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Ready for downstream service injection</text>
<rect x="715" y="325" width="280" height="150" rx="8" fill="#2d1215" stroke="#ef4444" stroke-width="1.5"/>
<text x="855" y="348" fill="#FCA5A5" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Outcome B: Any Condition FAILS</text>
<rect x="775" y="358" width="160" height="16" rx="8" fill="#991b1b"/><text x="855" y="369" fill="#ffffff" font-size="8" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">CONFIGURATION SKIPPED</text>
<text x="725" y="392" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Configuration is completely pruned</text>
<text x="725" y="410" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Zero beans registered in IoC</text>
<text x="725" y="428" fill="#F87171" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Zero memory or performance overhead</text>
<text x="725" y="444" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Recorded in NegativeMatches log in</text>
<text x="725" y="458" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  ConditionEvaluationReport</text>
<line x1="280" y1="200" x2="310" y2="200" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>
<line x1="670" y1="200" x2="715" y2="200" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
<line x1="670" y1="380" x2="715" y2="380" stroke="#F87171" stroke-width="1.5" marker-end="url(#arr-r)"/>
</svg>