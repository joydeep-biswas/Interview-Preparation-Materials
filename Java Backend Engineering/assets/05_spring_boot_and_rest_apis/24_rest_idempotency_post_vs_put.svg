<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1040" height="500" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="520" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">REST Idempotency &amp; Safety: POST vs. PUT Mechanics</text>
  <text x="520" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Mathematical definitions: f(f(x)) != f(x) (Non-Idempotent POST) vs f(f(x)) == f(x) (Strictly Idempotent PUT)</text>
<rect x="30" y="85" width="460" height="395" rx="8" fill="#1a1116" stroke="#ef4444" stroke-width="1.5"/>
<text x="260" y="112" fill="#FCA5A5" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">POST Method: NON-IDEMPOTENT</text>
<rect x="170" y="122" width="180" height="18" rx="9" fill="#991b1b"/><text x="260" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">f(f(x)) != f(x) — Mutates State</text>
<rect x="50" y="155" width="420" height="65" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
<text x="65" y="178" fill="#F8FAFC" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Request 1: POST /api/orders (Book Order)</text>
<text x="65" y="198" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Database State: 1 Order Created | Order #101 persisted</text>
<rect x="160" y="230" width="200" height="26" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
<text x="260" y="247" fill="#FCA5A5" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Network Timeout on Client ACK!</text>
<line x1="260" y1="220" x2="260" y2="230" stroke="#F87171" stroke-width="1.5" marker-end="url(#arr-r)"/>
<line x1="260" y1="256" x2="260" y2="270" stroke="#F87171" stroke-width="1.5" marker-end="url(#arr-r)"/>
<rect x="50" y="270" width="420" height="75" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
<text x="65" y="293" fill="#FCA5A5" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Request 2 (Client Retry): POST /api/orders</text>
<text x="65" y="313" fill="#F87171" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Database State: 2 ORDERS CREATED! (Order #102 created)</text>
<text x="65" y="329" fill="#FCA5A5" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">DISASTER: DUPLICATE BILLING &amp; INVENTORY DEDUCTION!</text>
<rect x="50" y="360" width="420" height="105" rx="8" fill="#2d1215" stroke="#dc2626" stroke-width="1"/>
<text x="65" y="382" fill="#F87171" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">POST Behavioral Summary:</text>
<text x="65" y="402" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Subordinate resource creation under collection</text>
<text x="65" y="418" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Server generates ID; every invocation creates a new row</text>
<text x="65" y="434" fill="#FBBF24" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Requires application-level Idempotency-Key headers to be safe!</text>
<rect x="550" y="85" width="460" height="395" rx="8" fill="#0c1d1a" stroke="#10b981" stroke-width="1.5"/>
<text x="780" y="112" fill="#6EE7B7" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">PUT Method: STRICTLY IDEMPOTENT</text>
<rect x="690" y="122" width="180" height="18" rx="9" fill="#047857" stroke="#10B981" stroke-width="1"/><text x="780" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">f(f(x)) == f(x) — Safe to Retry</text>
<rect x="570" y="155" width="420" height="65" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
<text x="585" y="178" fill="#F8FAFC" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Request 1: PUT /users/42 {name: 'Alice'}</text>
<text x="585" y="198" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Database State: User 42 name updated to 'Alice'</text>
<rect x="680" y="230" width="200" height="26" rx="4" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
<text x="780" y="247" fill="#A7F3D0" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Network Timeout on Client ACK!</text>
<line x1="780" y1="220" x2="780" y2="230" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
<line x1="780" y1="256" x2="780" y2="270" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
<rect x="570" y="270" width="420" height="75" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
<text x="585" y="293" fill="#6EE7B7" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Request 2 (Client Retry): PUT /users/42 {name: 'Alice'}</text>
<text x="585" y="313" fill="#D1FAE5" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Database State: User 42 is STILL 'Alice' (Identical state!)</text>
<text x="585" y="329" fill="#34D399" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">PERFECT: Zero unintended side effects on server!</text>
<rect x="570" y="360" width="420" height="105" rx="8" fill="#0f2e28" stroke="#059669" stroke-width="1"/>
<text x="585" y="382" fill="#34D399" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">PUT Behavioral Summary:</text>
<text x="585" y="402" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Complete resource replacement at specified exact URI</text>
<text x="585" y="418" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Client dictates the exact identity (/users/42)</text>
<text x="585" y="434" fill="#A7F3D0" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Retrying 100 times produces identical final state as 1 time</text>
</svg>