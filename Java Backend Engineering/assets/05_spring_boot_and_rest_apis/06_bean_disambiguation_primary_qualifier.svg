<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1040" height="520" rx="10" fill="url(#bg)"/>
  <text x="520" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Bean Disambiguation: @Autowired, @Primary, and @Qualifier</text>
  <text x="520" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Resolving NoUniqueBeanDefinitionException when multiple candidate beans implement the same interface</text>
<rect x="30" y="85" width="270" height="410" rx="8" fill="#0b1329" stroke="#3b82f6" stroke-width="1.5"/>
<text x="165" y="112" fill="#60A5FA" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Injection Site (Consumer)</text>
<rect x="85" y="122" width="160" height="18" rx="9" fill="#1d4ed8"/><text x="165" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">CheckoutService Bean</text>
<rect x="45" y="155" width="240" height="95" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="55" y="178" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Dependency Requirement</text>
<text x="55" y="198" fill="#CBD5E1" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">private final PaymentGateway gateway;</text>
<text x="55" y="214" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Requires single candidate implementing</text>
<text x="55" y="228" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  com.app.PaymentGateway interface</text>
<rect x="45" y="265" width="240" height="110" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
<text x="55" y="288" fill="#FCA5A5" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Ambiguity Dilemma!</text>
<text x="55" y="308" fill="#F87171" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Container finds TWO matching beans:</text>
<text x="55" y="324" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">1. stripeGateway</text>
<text x="55" y="340" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">2. payPalGateway</text>
<text x="55" y="356" fill="#FCA5A5" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Throws: NoUniqueBeanDefinitionException!</text>
<rect x="45" y="390" width="240" height="90" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="165" y="412" fill="#CBD5E1" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Resolution Needed</text>
<text x="165" y="432" fill="#FBBF24" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Provide explicit preference via</text>
<text x="165" y="448" fill="#34D399" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">@Primary or @Qualifier</text>
<line x1="300" y1="290" x2="340" y2="290" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr-r)"/>
<rect x="340" y="85" width="320" height="410" rx="8" fill="#0c1d1a" stroke="#10b981" stroke-width="1.5"/>
<text x="500" y="112" fill="#6EE7B7" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Strategy 1: @Primary Annotation</text>
<rect x="410" y="122" width="180" height="18" rx="9" fill="#047857"/><text x="500" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Default System Candidate</text>
<rect x="355" y="155" width="290" height="95" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
<text x="370" y="178" fill="#6EE7B7" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">@Component @Primary</text>
<text x="370" y="198" fill="#F8FAFC" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">public class StripeGateway</text>
<text x="370" y="214" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">    implements PaymentGateway { ... }</text>
<text x="370" y="232" fill="#A7F3D0" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Designates Stripe as system-wide default!</text>
<rect x="355" y="265" width="290" height="85" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
<text x="370" y="288" fill="#34D399" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Injection Site Behavior</text>
<text x="370" y="308" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">@Autowired</text>
<text x="370" y="324" fill="#F8FAFC" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">public CheckoutService(PaymentGateway gw)</text>
<text x="370" y="338" fill="#6EE7B7" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Automatically injects StripeGateway without error!</text>
<rect x="355" y="365" width="290" height="115" rx="8" fill="#0f2e28" stroke="#059669" stroke-width="1"/>
<text x="370" y="388" fill="#34D399" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Pros &amp; Production Fit</text>
<text x="370" y="408" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">✓ Cleanest when 90% of services want default</text>
<text x="370" y="424" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">✓ Consumers don't need qualification annotations</text>
<text x="370" y="442" fill="#FBBF24" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">⚠ Only ONE @Primary allowed per interface type</text>
<text x="370" y="458" fill="#94A3B8" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  (Multiple @Primary will cause ambiguity failure)</text>
<rect x="690" y="85" width="320" height="410" rx="8" fill="#062e3d" stroke="#06b6d4" stroke-width="1.5"/>
<text x="850" y="112" fill="#22D3EE" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Strategy 2: @Qualifier Annotation</text>
<rect x="760" y="122" width="180" height="18" rx="9" fill="#0891b2"/><text x="850" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Explicit Target Override</text>
<rect x="705" y="155" width="290" height="95" rx="8" fill="#0e3a47" stroke="#06b6d4" stroke-width="1.5"/>
<text x="720" y="178" fill="#22D3EE" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">@Component('payPalGateway')</text>
<text x="720" y="198" fill="#F8FAFC" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">public class PayPalGateway</text>
<text x="720" y="214" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">    implements PaymentGateway { ... }</text>
<text x="720" y="232" fill="#A5F3FC" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Explicitly names candidate bean id</text>
<rect x="705" y="265" width="290" height="85" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
<text x="720" y="288" fill="#22D3EE" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Injection Site Behavior</text>
<text x="720" y="308" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">@Autowired</text>
<text x="720" y="324" fill="#F8FAFC" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">public CheckoutService(</text>
<text x="720" y="338" fill="#67E8F9" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">    @Qualifier('payPalGateway') PaymentGateway gw)</text>
<rect x="705" y="365" width="290" height="115" rx="8" fill="#0e3a47" stroke="#0891b2" stroke-width="1"/>
<text x="720" y="388" fill="#22D3EE" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Pros &amp; Production Fit</text>
<text x="720" y="408" fill="#A5F3FC" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">✓ Highest precedence (Overrides @Primary!)</text>
<text x="720" y="424" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">✓ Precise surgical control for specialized use cases</text>
<text x="720" y="442" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">✓ Supports custom meta-qualifier annotations</text>
<text x="720" y="458" fill="#94A3B8" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  (e.g., @OfflinePayment vs @OnlinePayment)</text>
</svg>