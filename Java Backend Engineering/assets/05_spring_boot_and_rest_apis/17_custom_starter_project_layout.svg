<text x="75" y="345" fill="#34D399" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">📄 AuditService.java</text>
<text x="75" y="365" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Core domain engine: formats audit logs, publishes events, manages async queues</text>
<rect x="65" y="390" width="470" height="65" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
<text x="75" y="410" fill="#34D399" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">📄 AuditFilter.java</text>
<text x="75" y="430" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">OncePerRequestFilter: intercepts HTTP headers, trace IDs, and request timings</text>
<text x="75" y="444" fill="#94A3B8" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Auto-registered via FilterRegistrationBean in AuditAutoConfiguration</text>
