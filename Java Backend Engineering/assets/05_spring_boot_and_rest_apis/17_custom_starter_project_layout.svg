<text x="75" y="280" fill="#34D399" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">📄 AuditProperties.java</text>
<text x="75" y="300" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">@ConfigurationProperties(prefix = 'enterprise.audit') strongly-typed binding</text>
