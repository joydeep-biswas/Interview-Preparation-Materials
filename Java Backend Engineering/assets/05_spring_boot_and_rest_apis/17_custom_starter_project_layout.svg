<text x="595" y="286" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Spring Boot 3 / 2.7+ standard (replaces spring.factories)</text>
<rect x="585" y="315" width="390" height="95" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
<text x="595" y="338" fill="#FBBF24" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">📄 additional-spring-configuration-metadata.json</text>
<text x="595" y="358" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">IDE Autocomplete &amp; Documentation Metadata</text>
<text x="595" y="374" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Provides IntelliJ &amp; VS Code autocompletion, hover tips,</text>
<text x="595" y="390" fill="#FDE68A" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">and validation for 'enterprise.audit.*' in application.yml</text>
<rect x="585" y="420" width="390" height="45" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="595" y="437" fill="#38BDF8" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">📄 pom.xml / build.gradle (spring-boot-autoconfigure)</text>
<text x="595" y="452" fill="#94A3B8" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Only depends on autoconfigure api; zero transitive bloat</text>
