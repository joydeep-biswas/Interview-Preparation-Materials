<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1040" height="520" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="520" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Core Extension Points: BeanFactoryPostProcessor vs. BeanPostProcessor vs. FactoryBean&lt;T&gt;</text>
  <text x="520" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Architectural comparison: Modifying definition metadata vs. intercepting bean instances vs. custom programmatic factory creation</text>
<rect x="30" y="85" width="300" height="410" rx="8" fill="#0b1329" stroke="#3b82f6" stroke-width="1.5"/>
<text x="180" y="112" fill="#60A5FA" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">BeanFactoryPostProcessor</text>
<rect x="90" y="122" width="180" height="18" rx="9" fill="#1d4ed8"/><text x="180" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Operates on Metadata</text>
<rect x="45" y="155" width="270" height="75" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="55" y="178" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">When It Runs:</text>
<text x="55" y="198" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">EARLIEST in IoC lifecycle,</text>
<text x="55" y="214" fill="#FBBF24" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">BEFORE any bean instance is created!</text>
<rect x="45" y="240" width="270" height="95" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="55" y="263" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Target of Modification:</text>
<text x="55" y="283" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Operates on BeanDefinition objects in</text>
<text x="55" y="299" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">the BeanDefinitionRegistry.</text>
<text x="55" y="315" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Can modify bean scope, lazy-init flag,</text>
<text x="55" y="327" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">or property values dynamically.</text>
<rect x="45" y="345" width="270" height="130" rx="8" fill="#0b2a4a" stroke="#38bdf8" stroke-width="1"/>
<text x="55" y="368" fill="#93C5FD" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Canonical Production Example:</text>
<text x="55" y="390" fill="#CBD5E1" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">PropertySourcesPlaceholderConfig</text>
<text x="55" y="406" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Resolves ${db.url} placeholders</text>
<text x="55" y="422" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">in bean definitions from</text>
<text x="55" y="438" fill="#34D399" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">application.yml before beans instantiate!</text>
<rect x="370" y="85" width="300" height="410" rx="8" fill="#0c1d1a" stroke="#10b981" stroke-width="1.5"/>
<text x="520" y="112" fill="#6EE7B7" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">BeanPostProcessor</text>
<rect x="430" y="122" width="180" height="18" rx="9" fill="#047857" stroke="#10B981" stroke-width="1"/><text x="520" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Operates on Real Instances</text>
<rect x="385" y="155" width="270" height="75" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
<text x="395" y="178" fill="#34D399" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">When It Runs:</text>
<text x="395" y="198" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">DURING bean initialization,</text>
<text x="395" y="214" fill="#A7F3D0" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">both BEFORE and AFTER init methods run</text>
<rect x="385" y="240" width="270" height="95" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
<text x="395" y="263" fill="#34D399" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Target of Modification:</text>
<text x="395" y="283" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Operates on REAL Java bean instances.</text>
<text x="395" y="299" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Can inspect annotations, wrap instances</text>
<text x="395" y="315" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">in dynamic proxies, or substitute the</text>
<text x="395" y="327" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">returned instance completely!</text>
<rect x="385" y="345" width="270" height="130" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
<text x="395" y="368" fill="#A7F3D0" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Canonical Production Example:</text>
<text x="395" y="390" fill="#D1FAE5" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">AnnotationAwareAspectJAutoProxyCreator</text>
<text x="395" y="406" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Scans beans for @Transactional or</text>
<text x="395" y="422" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">custom @Aspect, wraps targets in</text>
<text x="395" y="438" fill="#34D399" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">CGLIB / JDK dynamic proxies!</text>
<rect x="710" y="85" width="300" height="410" rx="8" fill="#16122b" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="860" y="112" fill="#C084FC" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">FactoryBean&amp;lt;T&amp;gt;</text>
<rect x="780" y="122" width="160" height="18" rx="9" fill="#6d28d9"/><text x="860" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Custom Programmatic Factory</text>
<rect x="725" y="155" width="270" height="75" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
<text x="735" y="178" fill="#C084FC" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">When It Runs:</text>
<text x="735" y="198" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Invoked when getBean('myBean') is</text>
<text x="735" y="214" fill="#DDD6FE" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">called to produce complex product T</text>
<rect x="725" y="240" width="270" height="95" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
<text x="735" y="263" fill="#C084FC" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Target of Modification:</text>
<text x="735" y="283" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Encapsulates complex factory creation</text>
<text x="735" y="299" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">where standard reflection constructor</text>
<text x="735" y="315" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">is insufficient (Builder APIs, C bindings).</text>
<text x="735" y="327" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Implements: getObject(), getObjectType()</text>
<rect x="725" y="345" width="270" height="130" rx="8" fill="#2e1065" stroke="#8b5cf6" stroke-width="1"/>
<text x="735" y="368" fill="#DDD6FE" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Canonical Production Example:</text>
<text x="735" y="390" fill="#CBD5E1" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">SqlSessionFactoryBean (MyBatis) or</text>
<text x="735" y="406" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">LocalContainerEntityManagerFactoryBean</text>
<text x="735" y="422" fill="#38BDF8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• getBean('foo') -&gt; Returns Product T</text>
<text x="735" y="438" fill="#FBBF24" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• getBean('&amp;foo') -&gt; Returns FactoryBean itself</text>
<line x1="330" y1="290" x2="370" y2="290" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>
<line x1="670" y1="290" x2="710" y2="290" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
</svg>