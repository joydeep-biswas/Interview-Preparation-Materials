<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1040" height="520" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="520" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Event Handling: @EventListener vs. @TransactionalEventListener</text>
  <text x="520" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Preventing ghost notifications: TransactionSynchronizationManager integration and phase = AFTER_COMMIT reliability</text>
<rect x="30" y="85" width="320" height="410" rx="8" fill="#0b1329" stroke="#3b82f6" stroke-width="1.5"/>
<text x="190" y="112" fill="#60A5FA" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Order Placement Service</text>
<rect x="110" y="122" width="160" height="18" rx="9" fill="#1d4ed8"/><text x="190" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">@Transactional Service</text>
<rect x="45" y="155" width="290" height="75" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="55" y="178" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">1. DB Transaction Begins</text>
<text x="55" y="198" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">INSERT INTO orders (id, amount...);</text>
<text x="55" y="214" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Row inserted into connection buffer</text>
<rect x="45" y="240" width="290" height="75" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="55" y="263" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">2. Publish Application Event</text>
<text x="55" y="283" fill="#CBD5E1" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">publisher.publishEvent(new OrderPlacedEvent())</text>
<text x="55" y="299" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Dispatched into Spring event infrastructure</text>
<rect x="45" y="325" width="290" height="85" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
<text x="55" y="348" fill="#FBBF24" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">3. Transaction Commit Evaluation</text>
<text x="55" y="368" fill="#F8FAFC" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Does DB COMMIT succeed?</text>
<text x="55" y="384" fill="#34D399" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Scenario A: 200 OK -&gt; COMMIT</text>
<text x="55" y="398" fill="#F87171" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Scenario B: DB Constraint Error -&gt; ROLLBACK</text>
<rect x="45" y="420" width="290" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="190" y="442" fill="#CBD5E1" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">TransactionSynchronizationManager</text>
<text x="190" y="460" fill="#94A3B8" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Binds callbacks to current thread's transaction status</text>
<rect x="380" y="85" width="630" height="190" rx="8" fill="#1a1116" stroke="#ef4444" stroke-width="1.5"/>
<text x="695" y="112" fill="#FCA5A5" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Standard @EventListener (SYNCHRONOUS &amp; UNCOORDINATED)</text>
<rect x="595" y="122" width="200" height="18" rx="9" fill="#991b1b"/><text x="695" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">High Risk: Ghost Email Trap</text>
<rect x="400" y="150" width="590" height="105" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
<text x="415" y="172" fill="#FCA5A5" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Flaw: Fires IMMEDIATELY during Step 2, before DB commits!</text>
<text x="415" y="192" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">1. Listener triggers EmailService -&gt; Customer receives 'Order Confirmed!' email</text>
<text x="415" y="210" fill="#F87171" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">2. Later in Step 3, DB throws DataIntegrityViolationException and ROLLS BACK!</text>
<text x="415" y="228" fill="#FCA5A5" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">3. Disaster: Customer gets email for an order that DOES NOT EXIST in the database!</text>
<rect x="380" y="295" width="630" height="200" rx="8" fill="#0c1d1a" stroke="#10b981" stroke-width="1.5"/>
<text x="695" y="322" fill="#6EE7B7" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">@TransactionalEventListener(phase = TransactionPhase.AFTER_COMMIT)</text>
<rect x="595" y="332" width="200" height="18" rx="9" fill="#047857" stroke="#10B981" stroke-width="1"/><text x="695" y="344" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Enterprise Safe &amp; Guaranteed</text>
<rect x="400" y="360" width="590" height="115" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
<text x="415" y="382" fill="#6EE7B7" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Transaction Synchronization Guarantee:</text>
<text x="415" y="402" fill="#D1FAE5" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">✓ Path A (Commit Success): Listener runs ONLY AFTER database commit completes!</text>
<text x="415" y="420" fill="#A7F3D0" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">   Customer receives confirmation email with guaranteed persisted order row.</text>
<text x="415" y="438" fill="#34D399" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">✓ Path B (Rollback Failure): Event is SILENTLY DROPPED by Spring!</text>
<text x="415" y="456" fill="#A7F3D0" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">   Customer is NEVER erroneously emailed about a failed purchase!</text>
<path d="M 335.0 277.0 L 345.0 277.0 C 365.5 277.0, 365.5 200.0, 386.0 200.0 L 400.0 200.0" fill="none" stroke="#F87171" stroke-width="1.5" marker-end="url(#arr-r)"/>
<path d="M 335.0 365.0 L 345.0 365.0 C 365.5 365.0, 365.5 410.0, 386.0 410.0 L 400.0 410.0" fill="none" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
</svg>