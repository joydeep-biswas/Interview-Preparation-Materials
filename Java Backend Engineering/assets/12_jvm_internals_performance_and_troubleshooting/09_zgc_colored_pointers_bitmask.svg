<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1120" height="540" rx="10" fill="url(#bg)"/>
  <rect width="1120" height="540" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="560" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">ZGC 64-bit Colored Pointer Architecture &amp; Load Barrier</text>
  <text x="560" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">Metadata embedded directly in unused 64-bit pointer bits enables concurrent relocation with self-healing references</text>

  <!-- Top Panel: 64-Bit Pointer Bitmask Layout -->
  <rect x="40" y="85" width="1040" height="175" rx="8" fill="#1E293B" fill-opacity="0.6" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="40" y="85" width="1040" height="32" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="560" y="106" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle">ZGC 64-BIT REFERENCE BITMASK STRUCTURE (VIRTUAL MEMORY POINTER)</text>

  <!-- Bit Strip Container -->
  <!-- Bits 48-63: Unused (16 bits) -->
  <rect x="60" y="130" width="200" height="55" rx="4" fill="#0F172A" stroke="#64748B" stroke-width="1.5"/>
  <text x="160" y="152" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="middle">Bits 48-63 (16 bits)</text>
  <text x="160" y="170" font-size="9.5" fill="#64748B" text-anchor="middle">Unused / OS Reserved</text>

  <!-- Bit 47: Finalizable (1 bit) -->
  <rect x="265" y="130" width="130" height="55" rx="4" fill="#78350F" fill-opacity="0.3" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="330" y="152" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="middle">Bit 47 (1 bit)</text>
  <text x="330" y="170" font-size="9.5" fill="#FDE68A" text-anchor="middle">Finalizable Mark</text>

  <!-- Bit 46: Remapped (1 bit) -->
  <rect x="400" y="130" width="130" height="55" rx="4" fill="#064E3B" fill-opacity="0.3" stroke="#34D399" stroke-width="1.5"/>
  <text x="465" y="152" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">Bit 46 (1 bit)</text>
  <text x="465" y="170" font-size="9.5" fill="#6EE7B7" text-anchor="middle">Remapped Pointer</text>

  <!-- Bit 45: Marked1 (1 bit) -->
  <rect x="535" y="130" width="125" height="55" rx="4" fill="#083344" fill-opacity="0.3" stroke="#22D3EE" stroke-width="1.5"/>
  <text x="597" y="152" font-size="11" font-weight="700" fill="#22D3EE" text-anchor="middle">Bit 45 (1 bit)</text>
  <text x="597" y="170" font-size="9.5" fill="#A5F3FC" text-anchor="middle">Marked1 (Alt Cycle)</text>

  <!-- Bit 44: Marked0 (1 bit) -->
  <rect x="665" y="130" width="125" height="55" rx="4" fill="#1E3A8A" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="727" y="152" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">Bit 44 (1 bit)</text>
  <text x="727" y="170" font-size="9.5" fill="#BAE6FD" text-anchor="middle">Marked0 (Live Bit)</text>

  <!-- Bits 0-43: Address Space (44 bits) -->
  <rect x="795" y="130" width="265" height="55" rx="4" fill="#3B0764" fill-opacity="0.3" stroke="#C084FC" stroke-width="1.5"/>
  <text x="927" y="152" font-size="11" font-weight="700" fill="#C084FC" text-anchor="middle">Bits 0-43 (44 bits = 16 Terabytes)</text>
  <text x="927" y="170" font-size="9.5" fill="#E9D5FF" text-anchor="middle">Direct Virtual Object Heap Address</text>

  <!-- Descriptions below strip -->
  <text x="60" y="205" font-size="10" fill="#94A3B8" text-anchor="start">• <tspan fill="#FBBF24" font-weight="600">Finalizable:</tspan> Set if object is only reachable via finalize()</text>
  <text x="60" y="222" font-size="10" fill="#94A3B8" text-anchor="start">• <tspan fill="#34D399" font-weight="600">Remapped:</tspan> Set when pointer is confirmed updated to current location</text>
  <text x="60" y="239" font-size="10" fill="#94A3B8" text-anchor="start">• <tspan fill="#22D3EE" font-weight="600">Marked0 / Marked1:</tspan> Toggled between GC cycles to identify live objects</text>
  <text x="560" y="205" font-size="10" fill="#CBD5E1" text-anchor="start">• <tspan fill="#C084FC" font-weight="700">Multi-Mapping Virtual Memory:</tspan> ZGC maps Marked0, Marked1, and Remapped</text>
  <text x="560" y="222" font-size="10" fill="#CBD5E1" text-anchor="start">  to the <tspan fill="#38BDF8">same physical page</tspan> using OS mmap(), avoiding pointer masking overhead!</text>

  <!-- Bottom Panel: ZGC Load Barrier &amp; Self-Healing Reference -->
  <rect x="40" y="275" width="1040" height="215" rx="8" fill="#1E293B" fill-opacity="0.6" stroke="#34D399" stroke-width="1.5"/>
  <rect x="40" y="275" width="1040" height="32" rx="8" fill="#064E3B" fill-opacity="0.8" stroke="#34D399" stroke-width="1.5"/>
  <text x="560" y="296" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle">CONCURRENT LOAD BARRIER &amp; SELF-HEALING POINTER WORKFLOW</text>

  <!-- Step 1: Thread Reference Load -->
  <rect x="55" y="325" width="210" height="100" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
  <text x="160" y="347" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">1. Field Load in Mutator</text>
  <text x="160" y="367" font-size="10" font-family="monospace" fill="#93C5FD" text-anchor="middle">Object o = p.target;</text>
  <text x="160" y="390" font-size="9.5" fill="#94A3B8" text-anchor="middle">JIT compiler injects</text>
  <text x="160" y="405" font-size="9.5" fill="#94A3B8" text-anchor="middle">lightweight load barrier</text>

  <!-- Step 2: Color Bit Test -->
  <rect x="300" y="325" width="190" height="100" rx="6" fill="#0F172A" stroke="#FBBF24" stroke-width="1"/>
  <text x="395" y="347" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="middle">2. Test Color Bit</text>
  <text x="395" y="367" font-size="10" font-family="monospace" fill="#FDE68A" text-anchor="middle">test bit &amp; BAD_MASK</text>
  <text x="395" y="390" font-size="9.5" fill="#CBD5E1" text-anchor="middle">Single CPU assembly test</text>
  <text x="395" y="405" font-size="9.5" fill="#CBD5E1" text-anchor="middle">(Fast path: 1 branch instruction)</text>

  <!-- Step 3A: Fast Path -->
  <rect x="530" y="325" width="230" height="42" rx="6" fill="#064E3B" fill-opacity="0.3" stroke="#34D399" stroke-width="1.5"/>
  <text x="645" y="343" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">Fast Path: Good Color Bit</text>
  <text x="645" y="357" font-size="9" fill="#A7F3D0" text-anchor="middle">Object untouched or remapped; direct return!</text>

  <!-- Step 3B: Slow Path -->
  <rect x="530" y="380" width="230" height="45" rx="6" fill="#7F1D1D" fill-opacity="0.3" stroke="#EF4444" stroke-width="1.5"/>
  <text x="645" y="398" font-size="10" font-weight="700" fill="#F87171" text-anchor="middle">Slow Path: Bad Color Bit</text>
  <text x="645" y="413" font-size="9" fill="#FCA5A5" text-anchor="middle">Object in relocation set; read forwarding table</text>

  <!-- Step 4: Self-Healing -->
  <rect x="800" y="325" width="260" height="100" rx="6" fill="#0F172A" stroke="#C084FC" stroke-width="1.5"/>
  <text x="930" y="347" font-size="11" font-weight="700" fill="#C084FC" text-anchor="middle">4. Self-Healing Pointer</text>
  <text x="930" y="367" font-size="10" font-family="monospace" fill="#E9D5FF" text-anchor="middle">p.target = updatedRef;</text>
  <text x="930" y="390" font-size="9.5" fill="#CBD5E1" text-anchor="middle">Updates in-place with Remapped bit.</text>
  <text x="930" y="406" font-size="9.5" font-weight="600" fill="#34D399" text-anchor="middle">Subsequent reads hit FAST PATH!</text>

  <!-- Connectors -->
  <line x1="265" y1="375" x2="300" y2="375" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>
  <path d="M 490.0 350.0 L 498.0 350.0 C 508.0 350.0, 508.0 346.0, 518.0 346.0 L 530.0 346.0" fill="none" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <path d="M 490.0 390.0 L 498.0 390.0 C 508.0 390.0, 508.0 400.0, 518.0 400.0 L 530.0 400.0" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <path d="M 760.0 402.0 L 768.0 402.0 C 778.0 402.0, 778.0 385.0, 788.0 385.0 L 800.0 385.0" fill="none" stroke="#C084FC" stroke-width="2" marker-end="url(#arr-p)"/>

  <!-- Legend bottom of panel -->
  <text x="560" y="455" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Result: Only the first thread that accesses a relocated object pays the microsecond forwarding cost; all others read at full native speed.</text>

  <!-- Bottom Invariant -->
  <rect x="40" y="500" width="1040" height="26" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="560" y="517" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Colored Pointer Invariant: By embedding GC state in 4 high reference bits, ZGC performs heap relocation completely concurrently with zero Stop-The-World pauses.</text>
</svg>