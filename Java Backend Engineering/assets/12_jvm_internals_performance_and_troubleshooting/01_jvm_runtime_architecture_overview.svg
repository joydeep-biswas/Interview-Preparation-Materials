<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1240" height="600" rx="10" fill="url(#bg)"/>
  <rect width="1240" height="600" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="620" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">Java Virtual Machine (JVM) Runtime Subsystems Architecture</text>
  <text x="620" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">ClassLoader Subsystem -&gt; Runtime Data Areas (Heap, Metaspace, Stacks) -&gt; Execution Engine (Interpreter, JIT, GC)</text>
  <line x1="40" y1="68" x2="1200" y2="68" stroke="#334155" stroke-width="1"/>

  <!-- Section 1: ClassLoader Subsystem -->
  <rect x="40" y="95" width="280" height="425" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="40" y="95" width="280" height="30" rx="8" fill="#0C4A6E"/>
  <text x="180" y="115" font-size="11" font-weight="700" fill="#7DD3FC" text-anchor="middle">1. ClassLoader Subsystem</text>

  <rect x="55" y="145" width="250" height="80" rx="6" fill="#1E293B" stroke="#38BDF8"/>
  <text x="180" y="170" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">Bootstrap ClassLoader</text>
  <text x="65" y="195" font-size="8" fill="#CBD5E1">&#x2022; Native C++ core loader</text>
  <text x="65" y="210" font-size="8" fill="#CBD5E1">&#x2022; Loads <tspan font-family="'JetBrains Mono', monospace" fill="#A78BFA">java.base</tspan> modules</text>

  <rect x="55" y="240" width="250" height="80" rx="6" fill="#1E293B" stroke="#38BDF8"/>
  <text x="180" y="265" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">Platform ClassLoader</text>
  <text x="65" y="290" font-size="8" fill="#CBD5E1">&#x2022; JDK platform extensions</text>
  <text x="65" y="305" font-size="8" fill="#CBD5E1">&#x2022; java.sql, java.xml modules</text>

  <rect x="55" y="335" width="250" height="80" rx="6" fill="#1E293B" stroke="#38BDF8"/>
  <text x="180" y="360" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">Application ClassLoader</text>
  <text x="65" y="385" font-size="8" fill="#CBD5E1">&#x2022; Application Classpath &amp; JARs</text>
  <text x="65" y="400" font-size="8" fill="#CBD5E1">&#x2022; User classes &amp; Spring Beans</text>

  <rect x="55" y="430" width="250" height="75" rx="6" fill="#0F172A" stroke="#334155"/>
  <text x="65" y="455" font-size="9" font-weight="700" fill="#E2E8F0">Loading Lifecycle:</text>
  <text x="65" y="475" font-size="8" fill="#34D399">Loading &#x2192; Linking (Verify, Prepare, Resolve) &#x2192; Initialization</text>

  <path fill="none" d="M 180 225 L 180 240" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>
  <path fill="none" d="M 180 320 L 180 335" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <!-- Section 2: Runtime Data Areas -->
  <rect x="360" y="95" width="480" height="425" rx="8" fill="#06201B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="360" y="95" width="480" height="30" rx="8" fill="#064E3B"/>
  <text x="600" y="115" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">2. Runtime Data Areas (JVM Memory)</text>

  <!-- Shared Memory -->
  <rect x="380" y="145" width="440" height="150" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="600" y="167" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">Shared Across All Threads (Garbage Collected)</text>

  <rect x="395" y="180" width="200" height="100" rx="4" fill="#1E293B" stroke="#10B981"/>
  <text x="495" y="202" font-size="9" font-weight="700" fill="#6EE7B7" text-anchor="middle">JVM Heap Memory</text>
  <text x="405" y="222" font-size="8" fill="#CBD5E1">&#x2022; Young Gen (Eden, S0, S1)</text>
  <text x="405" y="238" font-size="8" fill="#CBD5E1">&#x2022; Old Gen (Tenured Objects)</text>
  <text x="405" y="255" font-size="8" fill="#CBD5E1">&#x2022; Holds all Object instances &amp; arrays</text>
  <text x="405" y="270" font-size="7" fill="#FCA5A5">Subject to OOM: Java heap space</text>

  <rect x="610" y="180" width="195" height="100" rx="4" fill="#1E293B" stroke="#38BDF8"/>
  <text x="707" y="202" font-size="9" font-weight="700" fill="#7DD3FC" text-anchor="middle">Metaspace (Off-Heap Native)</text>
  <text x="620" y="222" font-size="8" fill="#CBD5E1">&#x2022; Class metadata &amp; bytecodes</text>
  <text x="620" y="238" font-size="8" fill="#CBD5E1">&#x2022; Runtime Constant Pool</text>
  <text x="620" y="255" font-size="8" fill="#CBD5E1">&#x2022; Static fields &amp; MethodTable</text>
  <text x="620" y="270" font-size="7" fill="#34D399">&#x2714; Auto-sizes with OS native RAM</text>

  <!-- Per-Thread Memory -->
  <rect x="380" y="310" width="440" height="195" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
  <text x="600" y="332" font-size="10" font-weight="700" fill="#7DD3FC" text-anchor="middle">Private Per-Thread Execution State (Zero GC)</text>

  <rect x="395" y="345" width="135" height="145" rx="4" fill="#1E293B" stroke="#334155"/>
  <text x="462" y="367" font-size="9" font-weight="700" fill="#F8FAFC" text-anchor="middle">Java Thread Stack</text>
  <text x="405" y="390" font-size="8" fill="#CBD5E1">&#x2022; Method StackFrames</text>
  <text x="405" y="407" font-size="8" fill="#CBD5E1">&#x2022; Local Variables Array</text>
  <text x="405" y="425" font-size="8" fill="#CBD5E1">&#x2022; Operand Stack (LIFO)</text>
  <text x="405" y="442" font-size="8" fill="#CBD5E1">&#x2022; Frame Data / PC</text>
  <text x="405" y="465" font-size="7" fill="#FCA5A5">StackOverflowError</text>

  <rect x="545" y="345" width="135" height="145" rx="4" fill="#1E293B" stroke="#334155"/>
  <text x="612" y="367" font-size="9" font-weight="700" fill="#F8FAFC" text-anchor="middle">Program Counter</text>
  <text x="555" y="390" font-size="8" fill="#CBD5E1">&#x2022; PC Register per thread</text>
  <text x="555" y="407" font-size="8" fill="#CBD5E1">&#x2022; Address of current</text>
  <text x="555" y="422" font-size="8" fill="#CBD5E1">  bytecode instruction</text>
  <text x="555" y="445" font-size="8" fill="#34D399">&#x2714; Undefined for native</text>
  <text x="555" y="460" font-size="8" fill="#34D399">  methods</text>

  <rect x="695" y="345" width="115" height="145" rx="4" fill="#1E293B" stroke="#334155"/>
  <text x="752" y="367" font-size="9" font-weight="700" fill="#F8FAFC" text-anchor="middle">Native Stacks</text>
  <text x="705" y="390" font-size="8" fill="#CBD5E1">&#x2022; C/C++ execution</text>
  <text x="705" y="407" font-size="8" fill="#CBD5E1">&#x2022; JNI call frames</text>
  <text x="705" y="430" font-size="8" fill="#94A3B8">&#x2022; Native library</text>
  <text x="705" y="445" font-size="8" fill="#94A3B8">  bindings</text>

  <!-- Section 3: Execution Engine -->
  <rect x="880" y="95" width="320" height="425" rx="8" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.5"/>
  <rect x="880" y="95" width="320" height="30" rx="8" fill="#4C1D95"/>
  <text x="1040" y="115" font-size="11" font-weight="700" fill="#DDD6FE" text-anchor="middle">3. Execution Engine &amp; JNI</text>

  <rect x="900" y="145" width="280" height="75" rx="6" fill="#0F172A" stroke="#8B5CF6"/>
  <text x="1040" y="170" font-size="10" font-weight="700" fill="#C084FC" text-anchor="middle">Bytecode Interpreter</text>
  <text x="915" y="193" font-size="8" fill="#CBD5E1">&#x2022; Reads bytecode opcodes line-by-line</text>
  <text x="915" y="210" font-size="8" fill="#CBD5E1">&#x2022; Fast startup; gathers profiling counters</text>

  <rect x="900" y="235" width="280" height="120" rx="6" fill="#1E293B" stroke="#10B981"/>
  <text x="1040" y="260" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">JIT Compiler (Tiered Compilation)</text>
  <text x="915" y="283" font-size="8" fill="#CBD5E1">&#x2022; C1 Compiler (Client): Fast native translation</text>
  <text x="915" y="301" font-size="8" fill="#CBD5E1">&#x2022; C2 Compiler (Server): Aggressive optimizations:</text>
  <text x="925" y="318" font-size="8" fill="#A7F3D0">- Escape Analysis &amp; Scalar Replacement</text>
  <text x="925" y="333" font-size="8" fill="#A7F3D0">- Method Inlining &amp; Loop Unrolling</text>
  <text x="915" y="348" font-size="7" font-family="'JetBrains Mono', monospace" fill="#7DD3FC">Writes to Code Cache (RAM)</text>

  <rect x="900" y="370" width="280" height="75" rx="6" fill="#0F172A" stroke="#F59E0B"/>
  <text x="1040" y="393" font-size="10" font-weight="700" fill="#FBBF24" text-anchor="middle">Garbage Collector (GC Engine)</text>
  <text x="915" y="415" font-size="8" fill="#CBD5E1">&#x2022; Tracing GC via GC Roots reachability</text>
  <text x="915" y="432" font-size="8" fill="#34D399">&#x2714; Modern Collectors: G1, ZGC, Shenandoah</text>

  <rect x="900" y="460" width="280" height="45" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="1040" y="482" font-size="9" font-weight="700" fill="#CBD5E1" text-anchor="middle">Java Native Interface (JNI &amp; FFM / Panama)</text>

  <!-- Connectors -->
  <path fill="none" d="M 320 280 L 360 280" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>
  <path fill="none" d="M 840 280 L 880 280" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- Bottom Invariant -->
  <rect x="40" y="540" width="1160" height="30" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="620" y="560" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Memory Isolation: The JVM Heap and Metaspace are shared across all threads and subject to Garbage Collection. Thread Stacks and PC Registers are strictly thread-private with zero GC.</text>
</svg>