<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1220" height="520" rx="10" fill="url(#bg)"/>
  <rect width="1220" height="520" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="610" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">HotSpot JVM Generational Heap Memory Layout</text>
  <text x="610" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">Weak Generational Hypothesis: Young Generation (Eden, S0, S1) -&gt; Aging -&gt; Promotion to Tenured Old Generation</text>
  <line x1="40" y1="68" x2="1180" y2="68" stroke="#334155" stroke-width="1"/>

  <!-- Young Generation -->
  <rect x="40" y="105" width="560" height="340" rx="8" fill="#06201B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="40" y="105" width="560" height="30" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="320" y="125" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">Young Generation (Frequent, Millisecond Minor GCs)</text>

  <!-- Eden Space -->
  <rect x="60" y="150" width="310" height="150" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="215" y="175" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">Eden Space (80% of Young Gen)</text>
  <text x="75" y="200" font-size="8" fill="#CBD5E1">&#x2022; New object allocations occur here</text>
  <text x="75" y="218" font-size="8" fill="#CBD5E1">&#x2022; Thread-Local Allocation Buffers (TLABs):</text>
  <text x="85" y="235" font-size="8" fill="#A7F3D0">Lock-free pointer bump allocation (bump-the-pointer)</text>
  <text x="75" y="258" font-size="8" font-weight="700" fill="#FBBF24">&#x2022; Weak Generational Hypothesis:</text>
  <text x="85" y="275" font-size="8" fill="#CBD5E1">&gt;95% of objects die within milliseconds in Eden!</text>

  <!-- Survivor Spaces -->
  <rect x="390" y="150" width="190" height="70" rx="6" fill="#1E293B" stroke="#38BDF8"/>
  <text x="485" y="175" font-size="10" font-weight="700" fill="#7DD3FC" text-anchor="middle">Survivor 0 (From)</text>
  <text x="405" y="195" font-size="8" fill="#CBD5E1">Active survivor buffer</text>
  <text x="405" y="210" font-size="8" fill="#34D399">&#x2714; Objects age: +1 GC cycle</text>

  <rect x="390" y="230" width="190" height="70" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="485" y="255" font-size="10" font-weight="700" fill="#94A3B8" text-anchor="middle">Survivor 1 (To)</text>
  <text x="405" y="275" font-size="8" fill="#CBD5E1">Empty standby target</text>
  <text x="405" y="290" font-size="8" fill="#CBD5E1">Roles swap on next Minor GC</text>

  <rect x="60" y="320" width="520" height="105" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="75" y="345" font-size="9" font-weight="700" fill="#F8FAFC">Minor GC Copying Collection Mechanics:</text>
  <text x="75" y="365" font-size="8" fill="#CBD5E1">&#x2022; Minor GC sweeps Eden + Active Survivor; copies surviving live objects to Standby Survivor.</text>
  <text x="75" y="382" font-size="8" fill="#CBD5E1">&#x2022; Eden is completely cleared in one fast sequential pass with ZERO fragmentation!</text>
  <text x="75" y="400" font-size="8" fill="#34D399">&#x2714; Max Tenuring Threshold: Object promoted to Old Gen after surviving 15 GC cycles (4 bits in Mark Word).</text>

  <!-- Promotion Arrow -->
  <path fill="none" d="M 600 220 L 640 220" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arr-a)"/>
  <text x="620" y="210" font-size="8" font-weight="700" fill="#FBBF24" text-anchor="middle">Promote</text>

  <!-- Old Generation -->
  <rect x="640" y="105" width="540" height="340" rx="8" fill="#1C1917" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="640" y="105" width="540" height="30" rx="8" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
  <text x="910" y="125" font-size="11" font-weight="700" fill="#FDE68A" text-anchor="middle">Old / Tenured Generation (Long-Lived Objects &amp; Major GCs)</text>

  <rect x="660" y="150" width="500" height="150" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="910" y="175" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="middle">Tenured Generation Pool (~65-75% of Total Heap)</text>
  <text x="675" y="200" font-size="8" fill="#CBD5E1">&#x2022; Holds long-lived enterprise application state:</text>
  <text x="685" y="218" font-size="8" fill="#CBD5E1">- Spring Singleton Beans (@Service, @Repository)</text>
  <text x="685" y="235" font-size="8" fill="#CBD5E1">- Database Connection Pools (HikariCP) &amp; ThreadPoolExecutor workers</text>
  <text x="685" y="252" font-size="8" fill="#CBD5E1">- In-Memory Caches (Caffeine L1 Cache)</text>
  <text x="675" y="275" font-size="8" font-weight="700" fill="#34D399">&#x2714; Major GC (Full GC): Sweeps Old Gen via Mark-Sweep-Compact</text>

  <rect x="660" y="320" width="500" height="105" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="675" y="345" font-size="9" font-weight="700" fill="#F8FAFC">Humongous Object Direct Allocation:</text>
  <text x="675" y="365" font-size="8" fill="#CBD5E1">&#x2022; In G1 GC, objects exceeding 50% of G1 Region Size bypass Eden entirely!</text>
  <text x="675" y="382" font-size="8" fill="#FCA5A5">&#x26A0; Allocated directly into contiguous Humongous Regions in Old Generation.</text>
  <text x="675" y="400" font-size="8" fill="#CBD5E1">&#x2022; Causes premature GC pauses if large byte arrays / documents are frequently created.</text>

  <!-- Bottom Invariant -->
  <rect x="40" y="465" width="1140" height="35" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="610" y="487" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Generational Invariant: Most objects die young. Segregating memory into Young and Old generations enables high-frequency, low-latency collection of garbage without inspecting long-lived objects.</text>
</svg>