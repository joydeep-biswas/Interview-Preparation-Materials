<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1100" height="520" rx="10" fill="url(#bg)"/>
  <rect width="1100" height="520" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="550" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">ClassLoader Subsystem: Parent Delegation Hierarchy &amp; Class Shielding</text>
  <text x="550" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">Delegation Flows UP to Bootstrap -&gt; Search &amp; Loading Flows DOWN -&gt; Prevents Malicious Core Class Overwrites</text>
  <line x1="40" y1="68" x2="1060" y2="68" stroke="#334155" stroke-width="1"/>

  <!-- Top: Bootstrap ClassLoader -->
  <rect x="350" y="105" width="400" height="100" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="2"/>
  <rect x="350" y="105" width="400" height="26" rx="8" fill="#0C4A6E"/>
  <text x="550" y="123" font-size="11" font-weight="700" fill="#7DD3FC" text-anchor="middle">1. Bootstrap ClassLoader (Native C++ Core)</text>
  <text x="365" y="150" font-size="9" fill="#CBD5E1">&#x2022; Root of the delegation tree (represented as <tspan font-family="'JetBrains Mono', monospace" fill="#A78BFA">null</tspan> in Java reflection)</text>
  <text x="365" y="170" font-size="9" fill="#CBD5E1">&#x2022; Loads core system modules: <tspan font-family="'JetBrains Mono', monospace" fill="#38BDF8">java.base (java.lang.Object, String, etc.)</tspan></text>
  <text x="365" y="190" font-size="8" fill="#34D399">&#x2714; Absolute security trust boundary: Impossible to shadow java.lang.String!</text>

  <!-- Middle: Platform ClassLoader -->
  <rect x="350" y="245" width="400" height="100" rx="8" fill="#06201B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="350" y="245" width="400" height="26" rx="8" fill="#064E3B"/>
  <text x="550" y="263" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">2. Platform ClassLoader (formerly Extension)</text>
  <text x="365" y="290" font-size="9" fill="#CBD5E1">&#x2022; Java-implemented subclass of <tspan font-family="'JetBrains Mono', monospace">BuiltinClassLoader</tspan></text>
  <text x="365" y="310" font-size="9" fill="#CBD5E1">&#x2022; Loads standard JDK non-core modules:</text>
  <text x="365" y="330" font-size="8" font-family="'JetBrains Mono', monospace" fill="#A7F3D0">java.sql, java.xml, java.desktop, jdk.compiler</text>

  <!-- Bottom: Application ClassLoader -->
  <rect x="350" y="385" width="400" height="100" rx="8" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.5"/>
  <rect x="350" y="385" width="400" height="26" rx="8" fill="#4C1D95"/>
  <text x="550" y="403" font-size="11" font-weight="700" fill="#DDD6FE" text-anchor="middle">3. Application / System ClassLoader</text>
  <text x="365" y="430" font-size="9" fill="#CBD5E1">&#x2022; Default loader for application code from <tspan font-family="'JetBrains Mono', monospace">CLASSPATH</tspan></text>
  <text x="365" y="450" font-size="9" fill="#CBD5E1">&#x2022; Loads application classes, third-party libraries &amp; Spring Boot JARs</text>
  <text x="365" y="470" font-size="8" fill="#34D399">&#x2714; Retrieved via ClassLoader.getSystemClassLoader()</text>

  <!-- Upward Delegation Path (Left Side) -->
  <path fill="none" d="M 330 435 L 330 155" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>
  <text x="210" y="295" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">1. DELEGATES UP</text>
  <text x="210" y="315" font-size="8" fill="#CBD5E1" text-anchor="middle">Always asks parent loader</text>
  <text x="210" y="330" font-size="8" fill="#CBD5E1" text-anchor="middle">before attempting to load</text>

  <!-- Downward Search Path (Right Side) -->
  <path fill="none" d="M 770 155 L 770 435" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arr-a)"/>
  <text x="890" y="295" font-size="10" font-weight="700" fill="#FBBF24" text-anchor="middle">2. SEARCHES DOWN</text>
  <text x="890" y="315" font-size="8" fill="#CBD5E1" text-anchor="middle">If parent cannot find class,</text>
  <text x="890" y="330" font-size="8" fill="#CBD5E1" text-anchor="middle">child attempts findClass()</text>
  <text x="890" y="350" font-size="7" fill="#F87171" text-anchor="middle">Throws ClassNotFoundException</text>
  <text x="890" y="365" font-size="7" fill="#F87171" text-anchor="middle">if bottom loader fails</text>

  <!-- Bottom Invariant -->
  <rect x="50" y="500" width="1000" height="25" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="550" y="517" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Security Guarantee: A malicious hacker cannot inject a rogue java.lang.String class, because Bootstrap ClassLoader always intercepts and serves the genuine JDK class first.</text>
</svg>