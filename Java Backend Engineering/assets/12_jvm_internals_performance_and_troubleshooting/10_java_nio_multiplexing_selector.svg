<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1120" height="520" rx="10" fill="url(#bg)"/>
  <rect width="1120" height="520" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="560" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">Java NIO Non-Blocking Multiplexing Architecture</text>
  <text x="560" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">Single event dispatcher managing thousands of concurrent SocketChannels via kernel epoll/kqueue</text>

  <!-- Column 1: Concurrent Sockets -->
  <rect x="40" y="85" width="280" height="385" rx="8" fill="#1E293B" fill-opacity="0.6" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="40" y="85" width="280" height="36" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="180" y="108" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle">CLIENT SOCKET CHANNELS</text>

  <!-- Channel 1 -->
  <rect x="55" y="135" width="250" height="70" rx="6" fill="#0F172A" stroke="#34D399" stroke-width="1.5"/>
  <text x="70" y="157" font-size="11" font-weight="700" fill="#34D399" text-anchor="start">SocketChannel #1</text>
  <text x="70" y="174" font-size="10" fill="#94A3B8" text-anchor="start">• State: Non-blocking mode</text>
  <text x="70" y="189" font-size="10" font-weight="600" fill="#34D399" text-anchor="start">• Interest: OP_READ (Data ready in buffer)</text>

  <!-- Channel 2 -->
  <rect x="55" y="220" width="250" height="70" rx="6" fill="#0F172A" stroke="#64748B" stroke-width="1"/>
  <text x="70" y="242" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="start">SocketChannel #2</text>
  <text x="70" y="259" font-size="10" fill="#64748B" text-anchor="start">• State: Non-blocking mode</text>
  <text x="70" y="274" font-size="10" fill="#64748B" text-anchor="start">• Interest: OP_READ (Idle, waiting packet)</text>

  <!-- Channel 3 -->
  <rect x="55" y="305" width="250" height="70" rx="6" fill="#0F172A" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="70" y="327" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="start">SocketChannel #3</text>
  <text x="70" y="344" font-size="10" fill="#94A3B8" text-anchor="start">• State: Non-blocking mode</text>
  <text x="70" y="359" font-size="10" font-weight="600" fill="#FBBF24" text-anchor="start">• Interest: OP_WRITE (TCP buffer writable)</text>

  <!-- Note below channels -->
  <text x="180" y="415" font-size="10" fill="#94A3B8" text-anchor="middle">100,000+ persistent sockets</text>
  <text x="180" y="432" font-size="10" font-weight="600" fill="#38BDF8" text-anchor="middle">Zero dedicated OS threads per socket!</text>

  <!-- Column 2: Java NIO Selector &amp; OS Kernel -->
  <rect x="360" y="85" width="380" height="385" rx="8" fill="#1E293B" fill-opacity="0.6" stroke="#34D399" stroke-width="1.5"/>
  <rect x="360" y="85" width="380" height="36" rx="8" fill="#064E3B" fill-opacity="0.8" stroke="#34D399" stroke-width="1.5"/>
  <text x="550" y="108" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle">JAVA NIO SELECTOR &amp; OS KERNEL</text>

  <!-- Java Selector Box -->
  <rect x="380" y="135" width="340" height="110" rx="6" fill="#0F172A" stroke="#34D399" stroke-width="1.5"/>
  <text x="395" y="157" font-size="11" font-weight="700" fill="#34D399" text-anchor="start">NIO Selector (java.nio.channels.Selector)</text>
  <text x="395" y="177" font-size="10" fill="#CBD5E1" text-anchor="start">• Holds Registered Keys: Set&lt;SelectionKey&gt;</text>
  <text x="395" y="194" font-size="10" fill="#CBD5E1" text-anchor="start">• Populates Selected Keys: Set&lt;SelectionKey&gt;</text>
  <text x="395" y="211" font-size="10" fill="#93C5FD" text-anchor="start">• Calls OS syscall: <tspan font-family="monospace">selector.select()</tspan></text>
  <text x="395" y="228" font-size="9.5" fill="#94A3B8" text-anchor="start">Thread blocks ONLY in kernel until ≥1 socket is ready!</text>

  <!-- OS Kernel Multiplexing Subsystem -->
  <rect x="380" y="270" width="340" height="110" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="395" y="292" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="start">OS Kernel Multiplexing Subsystem</text>
  <text x="395" y="312" font-size="10" fill="#CBD5E1" text-anchor="start">• <tspan fill="#34D399" font-weight="700">Linux:</tspan> epoll (epoll_create, epoll_ctl, epoll_wait)</text>
  <text x="395" y="329" font-size="10" fill="#CBD5E1" text-anchor="start">• <tspan fill="#38BDF8" font-weight="700">macOS / BSD:</tspan> kqueue / kevent</text>
  <text x="395" y="346" font-size="10" fill="#CBD5E1" text-anchor="start">• <tspan fill="#FBBF24" font-weight="700">Windows:</tspan> I/O Completion Ports (IOCP)</text>
  <text x="395" y="365" font-size="9.5" fill="#94A3B8" text-anchor="start">Hardware NIC DMA directly triggers interrupt readiness!</text>

  <!-- Bidirectional link Selector <-> Kernel -->
  <line x1="550" y1="245" x2="550" y2="270" stroke="#34D399" stroke-width="2" marker-end="url(#arr-g)"/>
  <line x1="570" y1="270" x2="570" y2="245" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>

  <!-- Column 3: Event Loop Dispatcher &amp; Workers -->
  <rect x="780" y="85" width="300" height="385" rx="8" fill="#1E293B" fill-opacity="0.6" stroke="#C084FC" stroke-width="1.5"/>
  <rect x="780" y="85" width="300" height="36" rx="8" fill="#3B0764" fill-opacity="0.8" stroke="#C084FC" stroke-width="1.5"/>
  <text x="930" y="108" font-size="12" font-weight="700" fill="#C084FC" text-anchor="middle">EVENT REACTOR &amp; WORKERS</text>

  <!-- Single Reactor Thread -->
  <rect x="800" y="135" width="260" height="110" rx="6" fill="#0F172A" stroke="#C084FC" stroke-width="1.5"/>
  <text x="815" y="157" font-size="11" font-weight="700" fill="#C084FC" text-anchor="start">Single Reactor Dispatcher Thread</text>
  <text x="815" y="177" font-size="10" font-family="monospace" fill="#E9D5FF" text-anchor="start">while (selector.select() &gt; 0) {</text>
  <text x="825" y="194" font-size="10" font-family="monospace" fill="#E9D5FF" text-anchor="start">  for (SelectionKey k : keys) {</text>
  <text x="835" y="211" font-size="10" font-family="monospace" fill="#34D399" text-anchor="start">    dispatchReadyChannel(k);</text>
  <text x="825" y="228" font-size="10" font-family="monospace" fill="#E9D5FF" text-anchor="start">  }</text>
  <text x="815" y="240" font-size="10" font-family="monospace" fill="#E9D5FF" text-anchor="start">}</text>

  <!-- Worker Thread Pool -->
  <rect x="800" y="270" width="260" height="110" rx="6" fill="#0F172A" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="815" y="292" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="start">Worker Thread Pool (Netty / App)</text>
  <text x="815" y="312" font-size="10" fill="#CBD5E1" text-anchor="start">• Decodes byte protocol from ByteBuffer</text>
  <text x="815" y="329" font-size="10" fill="#CBD5E1" text-anchor="start">• Executes business logic asynchronously</text>
  <text x="815" y="346" font-size="10" fill="#CBD5E1" text-anchor="start">• Writes response non-blockingly</text>
  <text x="815" y="365" font-size="9.5" fill="#34D399" text-anchor="start">Reactor thread never blocks on slow client I/O!</text>

  <!-- Connectors -->
  <line x1="305" y1="170" x2="380" y2="170" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <path d="M 305.0 340.0 L 315.0 340.0 C 340.5 340.0, 340.5 210.0, 366.0 210.0 L 380.0 210.0" fill="none" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#arr-a)"/>
  <line x1="720" y1="175" x2="800" y2="175" stroke="#C084FC" stroke-width="2" marker-end="url(#arr-p)"/>
  <line x1="930" y1="245" x2="930" y2="270" stroke="#FBBF24" stroke-width="2" marker-end="url(#arr-a)"/>

  <!-- Bottom Invariant -->
  <rect x="40" y="480" width="1040" height="26" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="560" y="497" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Multiplexing Invariant: NIO avoids the 1-thread-per-socket memory bottleneck (1MB stack per idle connection) by letting one Selector monitor 100k+ connections via OS kernel events.</text>
</svg>