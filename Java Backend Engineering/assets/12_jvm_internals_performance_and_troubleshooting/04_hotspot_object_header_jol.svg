<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1200" height="520" rx="10" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="600" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">HotSpot 64-bit Java Object Layout (JOL) in Heap Memory</text>
  <text x="600" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">Standard Object Footprint: 8-Byte Mark Word + 4-Byte Compressed Klass Word + Instance Data + 8-Byte Alignment Padding</text>
  <line x1="40" y1="68" x2="1160" y2="68" stroke="#334155" stroke-width="1"/>

  <!-- JOL Strip Container -->
  <rect x="50" y="105" width="1100" height="200" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="50" y="105" width="1100" height="30" rx="8" fill="#0369A1" stroke="#0284C7" stroke-width="1"/>
  <text x="600" y="125" font-size="11" font-weight="700" fill="#E0F2FE" text-anchor="middle">Memory Byte Layout: Standard Java Object (e.g. class User { int id; boolean active; Object ref; })</text>

  <!-- Header Part 1: Mark Word -->
  <rect x="70" y="150" width="280" height="135" rx="6" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <text x="210" y="175" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">1. Mark Word (64 bits / 8 Bytes)</text>
  <text x="85" y="200" font-size="8" fill="#CBD5E1">&#x2022; Identity HashCode (31 bits)</text>
  <text x="85" y="218" font-size="8" fill="#CBD5E1">&#x2022; Generational GC Age (4 bits: 0-15)</text>
  <text x="85" y="235" font-size="8" fill="#CBD5E1">&#x2022; Biased Locking flag (1 bit)</text>
  <text x="85" y="252" font-size="8" font-weight="700" fill="#FBBF24">&#x2022; Lock State Bits (2 bits):</text>
  <text x="95" y="268" font-size="7" fill="#FDE68A">01: Unlocked | 00: Thin/Lightweight | 10: Heavy Monitor</text>

  <!-- Header Part 2: Klass Word -->
  <rect x="370" y="150" width="230" height="135" rx="6" fill="#06201B" stroke="#10B981" stroke-width="1.5"/>
  <text x="485" y="175" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">2. Klass Word (4 Bytes)</text>
  <text x="385" y="200" font-size="8" fill="#CBD5E1">&#x2022; Pointer to class metadata</text>
  <text x="385" y="218" font-size="8" fill="#CBD5E1">  in Metaspace (InstanceKlass)</text>
  <text x="385" y="240" font-size="8" font-weight="700" fill="#34D399">&#x2714; +UseCompressedClassPointers:</text>
  <text x="385" y="258" font-size="8" fill="#A7F3D0">Compressed from 8B to 4B</text>
  <text x="385" y="272" font-size="7" fill="#94A3B8">Saves millions of bytes on heap</text>

  <!-- Instance Data Fields -->
  <rect x="620" y="150" width="310" height="135" rx="6" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="775" y="175" font-size="11" font-weight="700" fill="#C4B5FD" text-anchor="middle">3. Instance Data Fields (13 Bytes)</text>
  <text x="635" y="200" font-size="8" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">&#x2022; int id: 4 Bytes</text>
  <text x="635" y="218" font-size="8" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">&#x2022; boolean active: 1 Byte</text>
  <text x="635" y="238" font-size="8" font-family="'JetBrains Mono', monospace" fill="#7DD3FC">&#x2022; Object ref: 4 Bytes (+UseCompressedOops)</text>
  <text x="635" y="258" font-size="8" fill="#A78BFA">&#x2022; Field Packing: JVM reorders fields</text>
  <text x="635" y="272" font-size="7" fill="#94A3B8">to minimize internal gaps</text>

  <!-- Alignment Padding -->
  <rect x="950" y="150" width="180" height="135" rx="6" fill="#1C1917" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="1040" y="175" font-size="11" font-weight="700" fill="#FDE68A" text-anchor="middle">4. Padding (3 Bytes)</text>
  <text x="960" y="200" font-size="8" fill="#CBD5E1">&#x2022; Rounds total size to</text>
  <text x="960" y="218" font-size="8" fill="#FDE68A">  multiple of 8 Bytes</text>
  <text x="960" y="240" font-size="8" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">Total: 8 + 4 + 13 = 25B</text>
  <text x="960" y="258" font-size="8" font-family="'JetBrains Mono', monospace" fill="#34D399">+3B Padding &#x2192; 32 Bytes</text>
  <text x="960" y="272" font-size="7" fill="#94A3B8">CPU 64-bit alignment</text>

  <!-- Breakdown Table -->
  <rect x="50" y="325" width="1100" height="125" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="70" y="350" font-size="10" font-weight="700" fill="#F8FAFC">Array Overhead Note &amp; Compressed OOP Rules:</text>
  <text x="70" y="375" font-size="9" fill="#CBD5E1">&#x2022; Array Instances: Include an additional 4-byte <tspan font-family="'JetBrains Mono', monospace" fill="#38BDF8">array length</tspan> field in the object header (Total Header = 16 Bytes).</text>
  <text x="70" y="398" font-size="9" fill="#CBD5E1">&#x2022; Compressed OOPs (+XX:+UseCompressedOops): Operates when Heap &lt; 32GB. JVM shifts 32-bit pointers by 3 bits (8-byte alignment), addressing up to 32GB of RAM with 4-byte pointers.</text>
  <text x="70" y="420" font-size="9" font-weight="700" fill="#EF4444">&#x26A0; The 32GB Cliff: A 33GB heap disables Compressed OOPs, jumping pointer sizes to 8 bytes and losing ~1.5x effective heap capacity to pointer bloat!</text>

  <!-- Bottom Invariant -->
  <rect x="50" y="470" width="1100" height="30" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="600" y="490" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Production Heap Rule: Never size a production JVM heap between 32GB and 40GB. Keep heap at 31GB to retain Compressed OOPs and save 30% of memory.</text>
</svg>