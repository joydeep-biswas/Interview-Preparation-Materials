<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1200" height="520" rx="10" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="600" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">Distributed Token Bucket Rate Limiting Architecture via Redis</text>
  <text x="600" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">Spring OncePerRequestFilter -&gt; Redis Cluster Token Bucket -&gt; Atomic Lua Script Execution -&gt; Allow vs 429 ProblemDetail</text>
  <line x1="40" y1="68" x2="1160" y2="68" stroke="#334155" stroke-width="1"/>

  <!-- Client Ingress -->
  <rect x="40" y="105" width="220" height="150" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="40" y="105" width="220" height="30" rx="8" fill="#0C4A6E"/>
  <text x="150" y="125" font-size="11" font-weight="700" fill="#7DD3FC" text-anchor="middle">1. Client Request</text>
  <text x="55" y="155" font-size="9" font-weight="700" fill="#E2E8F0">HTTP Ingress:</text>
  <text x="55" y="175" font-size="9" font-family="'JetBrains Mono', monospace" fill="#38BDF8">POST /api/v1/auth/login</text>
  <text x="55" y="200" font-size="9" fill="#CBD5E1">&#x2022; Headers: X-Forwarded-For</text>
  <text x="55" y="220" font-size="9" fill="#94A3B8">&#x2022; Target: Sensitive auth endpoint</text>

  <!-- Rate Limiting Filter -->
  <rect x="300" y="105" width="260" height="150" rx="8" fill="#06201B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="300" y="105" width="260" height="30" rx="8" fill="#064E3B"/>
  <text x="430" y="125" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">2. RateLimitingFilter</text>
  <text x="315" y="155" font-size="9" font-weight="700" fill="#E2E8F0">OncePerRequestFilter:</text>
  <text x="315" y="175" font-size="9" fill="#CBD5E1">&#x2022; Extracts client IP / API key</text>
  <text x="315" y="195" font-size="9" font-family="'JetBrains Mono', monospace" fill="#A78BFA">rate:login:{client_ip}</text>
  <text x="315" y="218" font-size="9" fill="#CBD5E1">&#x2022; Evaluates atomic token bucket</text>

  <!-- Connector 1 -> 2 -->
  <path fill="none" d="M 260 180 L 300 180" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>

  <!-- Redis Cluster Store -->
  <rect x="600" y="105" width="280" height="150" rx="8" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.5"/>
  <rect x="600" y="105" width="280" height="30" rx="8" fill="#4C1D95"/>
  <text x="740" y="125" font-size="11" font-weight="700" fill="#DDD6FE" text-anchor="middle">3. Redis Cluster / Redisson</text>
  <text x="615" y="155" font-size="9" font-weight="700" fill="#C084FC">Atomic Token Bucket Lua Script:</text>
  <text x="615" y="175" font-size="9" fill="#CBD5E1">&#x2022; Capacity: 5 tokens (Burst limit)</text>
  <text x="615" y="195" font-size="9" fill="#CBD5E1">&#x2022; Refill Rate: 5 tokens / min</text>
  <text x="615" y="215" font-size="9" fill="#34D399">&#x2714; Redis EVALSHA executes atomically</text>
  <text x="615" y="233" font-size="8" fill="#94A3B8">Prevents distributed race conditions</text>

  <!-- Connector 2 -> 3 -->
  <path fill="none" d="M 560 180 L 600 180" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- Decision Point -->
  <polygon points="960,180 1010,140 1060,180 1010,220" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
  <text x="1010" y="177" font-size="9" font-weight="700" fill="#FDE68A" text-anchor="middle">Tokens</text>
  <text x="1010" y="192" font-size="9" font-weight="700" fill="#FDE68A" text-anchor="middle">Avail?</text>

  <path fill="none" d="M 880 180 L 960 180" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arr-p)"/>

  <!-- Outcome 1: Allow (YES) -->
  <rect x="680" y="295" width="480" height="135" rx="6" fill="#06201B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="680" y="295" width="480" height="26" rx="6" fill="#064E3B"/>
  <text x="920" y="313" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">&#x2714; YES: Consume 1 Token &amp; Forward Request</text>
  
  <text x="700" y="340" font-size="9" fill="#CBD5E1">&#x2022; Passes through to <tspan font-family="'JetBrains Mono', monospace" fill="#34D399">AuthenticationFilter</tspan> &#x2192; <tspan font-family="'JetBrains Mono', monospace" fill="#34D399">DispatcherServlet</tspan></text>
  <text x="700" y="360" font-size="9" fill="#CBD5E1">&#x2022; Appends standard RFC HTTP Response Headers:</text>
  <text x="715" y="380" font-size="9" font-family="'JetBrains Mono', monospace" fill="#7DD3FC">X-RateLimit-Limit: 5</text>
  <text x="715" y="398" font-size="9" font-family="'JetBrains Mono', monospace" fill="#7DD3FC">X-RateLimit-Remaining: 4</text>
  <text x="715" y="416" font-size="9" font-family="'JetBrains Mono', monospace" fill="#7DD3FC">X-RateLimit-Reset: 1714001290</text>

  <!-- Outcome 2: Deny (NO) -->
  <rect x="40" y="295" width="560" height="135" rx="6" fill="#1C1917" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="40" y="295" width="560" height="26" rx="6" fill="#7F1D1D"/>
  <text x="320" y="313" font-size="11" font-weight="700" fill="#FCA5A5" text-anchor="middle">&#x2718; NO: Bucket Exhausted &#x2192; Short-Circuit 429</text>

  <text x="60" y="340" font-size="9" fill="#CBD5E1">&#x2022; Short-circuits immediately; request NEVER touches database or CPU-heavy BCrypt!</text>
  <text x="60" y="360" font-size="9" fill="#CBD5E1">&#x2022; Returns HTTP 429 Too Many Requests with RFC 7807 ProblemDetail JSON:</text>
  <text x="75" y="380" font-size="9" font-family="'JetBrains Mono', monospace" fill="#FCA5A5">{"type": "urn:problem:rate-limit-exceeded", "status": 429, "title": "Too Many Requests"}</text>
  <text x="60" y="405" font-size="9" font-weight="700" fill="#F87171">&#x2022; Mandates client backoff: <tspan font-family="'JetBrains Mono', monospace" fill="#FBBF24">Retry-After: 12</tspan> seconds</text>

  <!-- Connectors from Decision -->
  <path fill="none" d="M 1010 220 L 1010 295" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="1030" y="255" font-size="9" font-weight="700" fill="#34D399">Yes</text>

  <path fill="none" d="M 960 180 L 890 180 L 890 270 L 320 270 L 320 295" stroke="#EF4444" stroke-width="2" marker-end="url(#arr-r)"/>
  <text x="915" y="172" font-size="9" font-weight="700" fill="#EF4444">No</text>

  <!-- Bottom Invariant -->
  <rect x="40" y="455" width="1120" height="35" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="600" y="477" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">DDoS Resilience Invariant: Atomic rate-limiting filters defend password hashing CPU pipelines (BCrypt/Argon2id) from resource-exhaustion denial-of-service attacks.</text>
</svg>