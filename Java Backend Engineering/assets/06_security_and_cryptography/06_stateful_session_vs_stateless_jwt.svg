<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1180" height="520" rx="10" fill="url(#bg)"/>
  <rect width="1180" height="520" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="590" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">Stateful Session vs. Stateless JWT Token Architecture</text>
  <text x="590" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">Legacy Heap-Bound Session Table Bottlenecks vs. Horizontally Scalable Asymmetric JWT Verification</text>
  <line x1="40" y1="68" x2="1140" y2="68" stroke="#334155" stroke-width="1"/>

  <!-- Left Side: Stateful Sessions -->
  <rect x="50" y="105" width="510" height="360" rx="8" fill="#1C1917" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="50" y="105" width="510" height="32" rx="8" fill="#7F1D1D" stroke="#EF4444" stroke-width="1"/>
  <text x="305" y="126" font-size="12" font-weight="700" fill="#FCA5A5" text-anchor="middle">Stateful Session Authentication (Legacy Monolith)</text>

  <!-- Browser -->
  <rect x="75" y="155" width="460" height="60" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="90" y="180" font-size="11" font-weight="700" fill="#F8FAFC">Client Browser:</text>
  <text x="90" y="200" font-size="9" fill="#CBD5E1">Attaches cookie: <tspan font-family="'JetBrains Mono', monospace" fill="#FCA5A5">Cookie: JSESSIONID=abc123xyz789</tspan></text>

  <!-- Server Instance -->
  <rect x="75" y="235" width="460" height="135" rx="6" fill="#0F172A" stroke="#EF4444" stroke-width="1"/>
  <text x="90" y="260" font-size="11" font-weight="700" fill="#F87171">Tomcat Instance 1 (Heap Memory Store):</text>
  <text x="90" y="285" font-size="9" fill="#CBD5E1">&#x2022; Maintains in-memory ConcurrentHashMap of active sessions</text>
  <text x="90" y="305" font-size="9" fill="#CBD5E1">&#x2022; Every request does a blocking heap / Redis lookup</text>
  <text x="90" y="328" font-size="10" font-weight="700" fill="#EF4444">&#x2718; Scalability Breaking Points:</text>
  <text x="90" y="348" font-size="9" fill="#FCA5A5">  Requires sticky sessions (IP hash) or Redis session clustering</text>
  <text x="90" y="363" font-size="9" fill="#FCA5A5">  Instance crash wipes all active user logins!</text>

  <rect x="75" y="385" width="460" height="65" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="90" y="408" font-size="10" font-weight="700" fill="#CBD5E1">Enterprise Limitation:</text>
  <text x="90" y="428" font-size="9" fill="#94A3B8">High RAM overhead per user; breaks horizontal auto-scaling in Kubernetes</text>

  <!-- Right Side: Stateless JWT -->
  <rect x="620" y="105" width="510" height="360" rx="8" fill="#06201B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="620" y="105" width="510" height="32" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="875" y="126" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">Stateless JWT Authentication (Cloud Microservices)</text>

  <!-- Client App -->
  <rect x="645" y="155" width="460" height="60" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="660" y="180" font-size="11" font-weight="700" fill="#F8FAFC">Client Application:</text>
  <text x="660" y="200" font-size="9" fill="#CBD5E1">Attaches header: <tspan font-family="'JetBrains Mono', monospace" fill="#6EE7B7">Authorization: Bearer eyJhbGciOiJSUzI1NiIsIn...</tspan></text>

  <!-- Any Microservice -->
  <rect x="645" y="235" width="460" height="135" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="660" y="260" font-size="11" font-weight="700" fill="#34D399">Any Microservice Instance (N Instances):</text>
  <text x="660" y="285" font-size="9" fill="#CBD5E1">&#x2022; Self-contained token stores user ID, roles, and claims</text>
  <text x="660" y="305" font-size="9" fill="#CBD5E1">&#x2022; Validates signature via cached IdP Public Key (JWKS)</text>
  <text x="660" y="328" font-size="10" font-weight="700" fill="#34D399">&#x2714; Architectural Advantages:</text>
  <text x="660" y="348" font-size="9" fill="#A7F3D0">  ZERO database, Redis, or session store lookups!</text>
  <text x="660" y="363" font-size="9" fill="#A7F3D0">  Any pod can service any request horizontally in K8s</text>

  <rect x="645" y="385" width="460" height="65" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="660" y="408" font-size="10" font-weight="700" fill="#CBD5E1">Revocation Trade-off:</text>
  <text x="660" y="428" font-size="9" fill="#FDE68A">Tokens cannot be revoked before expiry. Mitigated with short TTL (15m) + refresh token rotation.</text>

  <!-- Bottom Invariant Banner -->
  <rect x="50" y="480" width="1080" height="25" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="590" y="497" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Scalability Invariant: Moving state from the server heap to cryptographically signed client tokens unlocks linear microservice horizontal scaling.</text>
</svg>