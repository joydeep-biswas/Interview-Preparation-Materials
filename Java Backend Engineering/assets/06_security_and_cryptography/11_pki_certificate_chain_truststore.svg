<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1100" height="520" rx="10" fill="url(#bg)"/>
  <rect width="1100" height="520" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="550" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">Public Key Infrastructure (PKI) Certificate Chain &amp; TrustStore Architecture</text>
  <text x="550" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">Cryptographic Trust Delegation: Root CA (cacerts TrustStore) -&gt; Intermediate CA -&gt; Leaf Certificate (KeyStore.p12)</text>
  <line x1="40" y1="68" x2="1060" y2="68" stroke="#334155" stroke-width="1"/>

  <!-- Root CA -->
  <rect x="50" y="105" width="300" height="320" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="50" y="105" width="300" height="30" rx="8" fill="#0C4A6E"/>
  <text x="200" y="125" font-size="11" font-weight="700" fill="#7DD3FC" text-anchor="middle">1. Root Certificate Authority</text>

  <rect x="65" y="150" width="270" height="90" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
  <text x="80" y="175" font-size="10" font-weight="700" fill="#38BDF8">Trust Anchor (e.g. DigiCert / Let's Encrypt)</text>
  <text x="80" y="195" font-size="9" fill="#CBD5E1">&#x2022; Self-Signed Certificate</text>
  <text x="80" y="213" font-size="9" fill="#CBD5E1">&#x2022; Root Private Key strictly air-gapped</text>
  <text x="80" y="230" font-size="8" fill="#34D399">&#x2714; 20-30 year validity</text>

  <rect x="65" y="255" width="270" height="150" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="80" y="280" font-size="10" font-weight="700" fill="#F8FAFC">Java Runtime Storage:</text>
  <text x="80" y="302" font-size="9" font-family="'JetBrains Mono', monospace" fill="#7DD3FC">$JAVA_HOME/lib/security/cacerts</text>
  <text x="80" y="325" font-size="9" fill="#CBD5E1">The Java <tspan fill="#38BDF8" font-weight="700">TrustStore</tspan> contains ~100 pre-installed</text>
  <text x="80" y="340" font-size="9" fill="#CBD5E1">public Root CA certificates trusted globally</text>
  <text x="80" y="355" font-size="9" fill="#CBD5E1">by default.</text>
  <text x="80" y="375" font-size="8" fill="#94A3B8">Answer: "Whom do I trust?"</text>

  <!-- Intermediate CA -->
  <rect x="400" y="105" width="300" height="320" rx="8" fill="#06201B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="400" y="105" width="300" height="30" rx="8" fill="#064E3B"/>
  <text x="550" y="125" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">2. Intermediate Certificate Authority</text>

  <rect x="415" y="150" width="270" height="90" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
  <text x="430" y="175" font-size="10" font-weight="700" fill="#34D399">Subordinate CA (e.g. Let's Encrypt R3)</text>
  <text x="430" y="195" font-size="9" fill="#CBD5E1">&#x2022; Signed by Root CA Private Key</text>
  <text x="430" y="213" font-size="9" fill="#CBD5E1">&#x2022; Performs day-to-day signing</text>
  <text x="430" y="230" font-size="8" fill="#34D399">&#x2714; Isolates Root CA from exposure</text>

  <rect x="415" y="255" width="270" height="150" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="430" y="280" font-size="10" font-weight="700" fill="#F8FAFC">Security Isolation Role:</text>
  <text x="430" y="302" font-size="9" fill="#CBD5E1">&#x2022; If intermediate key is compromised,</text>
  <text x="430" y="317" font-size="9" fill="#CBD5E1">  it is revoked via CRL / OCSP without</text>
  <text x="430" y="332" font-size="9" fill="#CBD5E1">  burning the Root CA.</text>
  <text x="430" y="350" font-size="9" fill="#CBD5E1">&#x2022; Sent alongside leaf certificate in TLS handshake bundle.</text>

  <!-- Leaf Certificate -->
  <rect x="750" y="105" width="300" height="320" rx="8" fill="#1C1917" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="750" y="105" width="300" height="30" rx="8" fill="#78350F"/>
  <text x="900" y="125" font-size="11" font-weight="700" fill="#FDE68A" text-anchor="middle">3. Server Leaf Certificate</text>

  <rect x="765" y="150" width="270" height="90" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
  <text x="780" y="175" font-size="10" font-weight="700" fill="#FBBF24">End-Entity (*.company.com)</text>
  <text x="780" y="195" font-size="9" fill="#CBD5E1">&#x2022; Binds Domain to Public Key</text>
  <text x="780" y="213" font-size="9" fill="#CBD5E1">&#x2022; Signed by Intermediate Private Key</text>
  <text x="780" y="230" font-size="8" fill="#FDE68A">&#x2022; 90-day / 1-year validity</text>

  <rect x="765" y="255" width="270" height="150" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="780" y="280" font-size="10" font-weight="700" fill="#F8FAFC">Spring Boot KeyStore:</text>
  <text x="780" y="302" font-size="9" font-family="'JetBrains Mono', monospace" fill="#FBBF24">src/main/resources/keystore.p12</text>
  <text x="780" y="325" font-size="9" fill="#CBD5E1">The Java <tspan fill="#FBBF24" font-weight="700">KeyStore</tspan> contains the server's</text>
  <text x="780" y="340" font-size="9" fill="#CBD5E1">Private Key and issued Leaf Certificate.</text>
  <text x="780" y="375" font-size="8" fill="#94A3B8">Answer: "Who am I?"</text>

  <!-- Connectors showing Signature Path -->
  <path fill="none" d="M 350 195 L 415 195" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>
  <text x="382" y="185" font-size="8" font-weight="700" fill="#38BDF8" text-anchor="middle">Signs</text>

  <path fill="none" d="M 700 195 L 765 195" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="732" y="185" font-size="8" font-weight="700" fill="#10B981" text-anchor="middle">Signs</text>

  <!-- Reverse Validation Flow -->
  <path fill="none" d="M 900 435 L 200 435" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arr-a)"/>
  <text x="550" y="455" font-size="9" font-weight="700" fill="#FBBF24" text-anchor="middle">&#x2190; TLS Client Verification Path: Recursively unwinds signatures back to trusted Root CA in cacerts</text>

  <!-- Bottom Invariant -->
  <rect x="50" y="475" width="1000" height="30" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="550" y="495" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">TrustStore vs KeyStore Distinction: KeyStore holds YOUR private key and certificates (identity). TrustStore holds OTHER entities' CA public keys (trust).</text>
</svg>