<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1200" height="600" rx="10" fill="url(#bg)"/>
  <rect width="1200" height="600" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="600" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">Enterprise Security &amp; Cryptographic Trust Architecture</text>
  <text x="600" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">Zero-Trust Defense-in-Depth: Edge Security, Spring Security Filter Pipeline, IdP &amp; PKI Engine</text>
  <line x1="40" y1="68" x2="1160" y2="68" stroke="#334155" stroke-width="1"/>

  <!-- Layer 1: Edge &amp; Client Security -->
  <rect x="50" y="95" width="340" height="420" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="50" y="95" width="340" height="30" rx="8" fill="#0C4A6E" stroke="#0284C7" stroke-width="1"/>
  <text x="220" y="115" font-size="12" font-weight="700" fill="#7DD3FC" text-anchor="middle">1. Edge &amp; Ingress Security Layer</text>

  <!-- Client Box -->
  <rect x="70" y="145" width="300" height="70" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
  <text x="220" y="170" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">Clients (Browser / Mobile / Partner)</text>
  <text x="85" y="195" font-size="9" fill="#94A3B8">&#x2022; mTLS Client Certificates &amp; Bearer JWT</text>

  <!-- WAF &amp; CORS -->
  <rect x="70" y="245" width="300" height="95" rx="6" fill="#1E293B" stroke="#0284C7" stroke-width="1"/>
  <text x="220" y="270" font-size="11" font-weight="700" fill="#E2E8F0" text-anchor="middle">WAF &amp; Cloudflare / Envoy Ingress</text>
  <text x="85" y="292" font-size="9" fill="#CBD5E1">&#x2022; TLS 1.3 Termination &amp; DDoS Mitigation</text>
  <text x="85" y="310" font-size="9" fill="#CBD5E1">&#x2022; CORS Pre-flight (OPTIONS) Validation</text>
  <text x="85" y="328" font-size="9" fill="#FCA5A5">&#x2022; OWASP ModSecurity Rules (SQLi / XSS)</text>

  <!-- Connectors in Layer 1 -->
  <path fill="none" d="M 220 215 L 220 245" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>
  <text x="225" y="234" font-size="9" fill="#38BDF8">TLS 1.3 Tunnel</text>

  <rect x="70" y="370" width="300" height="125" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="220" y="395" font-size="11" font-weight="700" fill="#CBD5E1" text-anchor="middle">Edge Threat Protection</text>
  <text x="85" y="420" font-size="9" fill="#94A3B8">&#x2022; IP Reputation &amp; Geo-fencing</text>
  <text x="85" y="440" font-size="9" fill="#94A3B8">&#x2022; Distributed Rate Limiting (Redis Leaky Bucket)</text>
  <text x="85" y="460" font-size="9" fill="#94A3B8">&#x2022; HTTP/2 and HTTP/3 multiplexed framing</text>

  <!-- Layer 2: Spring Security Filter Chain Core -->
  <rect x="420" y="95" width="400" height="420" rx="8" fill="#06201B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="420" y="95" width="400" height="30" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="620" y="115" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">2. Spring Security 6 Filter Chain</text>

  <!-- Filter Chain Sequence -->
  <rect x="440" y="145" width="360" height="200" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="620" y="170" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">SecurityFilterChain Pipeline</text>
  
  <rect x="455" y="185" width="330" height="24" rx="4" fill="#1E293B" stroke="#334155"/>
  <text x="465" y="201" font-size="9" fill="#E2E8F0">1. SecurityContextHolderFilter (ThreadLocal binding)</text>

  <rect x="455" y="215" width="330" height="24" rx="4" fill="#1E293B" stroke="#334155"/>
  <text x="465" y="231" font-size="9" fill="#E2E8F0">2. CsrfFilter (Cookie / Header Token Double-Submit)</text>

  <rect x="455" y="245" width="330" height="24" rx="4" fill="#1E293B" stroke="#10B981"/>
  <text x="465" y="261" font-size="9" fill="#6EE7B7">3. BearerTokenAuthenticationFilter (JWT Extraction)</text>

  <rect x="455" y="275" width="330" height="24" rx="4" fill="#1E293B" stroke="#334155"/>
  <text x="465" y="291" font-size="9" fill="#E2E8F0">4. ExceptionTranslationFilter (401 AuthN / 403 AuthZ)</text>

  <rect x="455" y="305" width="330" height="24" rx="4" fill="#1E293B" stroke="#38BDF8"/>
  <text x="465" y="321" font-size="9" fill="#7DD3FC">5. AuthorizationFilter (Method / Path-level RBAC)</text>

  <!-- Identity Provider Block -->
  <rect x="440" y="365" width="360" height="130" rx="6" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1"/>
  <text x="620" y="390" font-size="11" font-weight="700" fill="#C4B5FD" text-anchor="middle">Identity Provider (IdP: Keycloak / EntraID / Auth0)</text>
  <text x="455" y="415" font-size="9" fill="#CBD5E1">&#x2022; OAuth 2.0 / OpenID Connect (OIDC) Issuer</text>
  <text x="455" y="435" font-size="9" fill="#CBD5E1">&#x2022; JWKS Endpoint: <tspan font-family="'JetBrains Mono', monospace" fill="#A78BFA">/.well-known/jwks.json</tspan></text>
  <text x="455" y="455" font-size="9" fill="#CBD5E1">&#x2022; Public RSA / EC keys cached for offline JWT signature verification</text>
  <text x="455" y="475" font-size="9" fill="#34D399">&#x2714; Zero round-trip signature check per request</text>

  <!-- Layer 3: Java Trust Engine &amp; App Core -->
  <rect x="850" y="95" width="300" height="420" rx="8" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.5"/>
  <rect x="850" y="95" width="300" height="30" rx="8" fill="#4C1D95" stroke="#8B5CF6" stroke-width="1"/>
  <text x="1000" y="115" font-size="12" font-weight="700" fill="#DDD6FE" text-anchor="middle">3. Cryptographic Core &amp; Application</text>

  <!-- PKI Engine -->
  <rect x="870" y="145" width="260" height="160" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
  <text x="1000" y="170" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="middle">Java Cryptographic Trust Engine</text>
  
  <rect x="880" y="185" width="240" height="50" rx="4" fill="#1E293B" stroke="#F59E0B"/>
  <text x="890" y="203" font-size="9" font-weight="700" fill="#FDE68A">KeyStore (keystore.p12):</text>
  <text x="890" y="222" font-size="8" fill="#CBD5E1">Private Key + Leaf Certificate ("Who I Am")</text>

  <rect x="880" y="245" width="240" height="50" rx="4" fill="#1E293B" stroke="#38BDF8"/>
  <text x="890" y="263" font-size="9" font-weight="700" fill="#7DD3FC">TrustStore (cacerts):</text>
  <text x="890" y="282" font-size="8" fill="#CBD5E1">Trusted Root &amp; Intermediate CAs ("Whom I Trust")</text>

  <!-- Application Controller &amp; Domain Service -->
  <rect x="870" y="325" width="260" height="170" rx="6" fill="#0F172A" stroke="#8B5CF6" stroke-width="1"/>
  <text x="1000" y="350" font-size="11" font-weight="700" fill="#C084FC" text-anchor="middle">Secure Application Tier</text>
  
  <text x="885" y="375" font-size="9" font-weight="700" fill="#F8FAFC">Spring Boot 3 REST Controller:</text>
  <text x="885" y="393" font-size="9" font-family="'JetBrains Mono', monospace" fill="#A78BFA">@PreAuthorize("hasRole('ADMIN')")</text>

  <text x="885" y="420" font-size="9" font-weight="700" fill="#F8FAFC">Domain Service &amp; Data Layer:</text>
  <text x="885" y="438" font-size="9" fill="#CBD5E1">&#x2022; Column-Level AES-256-GCM Envelope Encryption</text>
  <text x="885" y="456" font-size="9" fill="#CBD5E1">&#x2022; Auditing via @EntityListeners &amp; SecurityContext</text>
  <text x="885" y="476" font-size="9" fill="#34D399">&#x2714; Zero plaintext secrets in memory / logs</text>

  <!-- Inter-Layer Connectors -->
  <path fill="none" d="M 370.0 292.0 L 380.0 292.0 C 403.0 292.0, 403.0 257.0, 426.0 257.0 L 440.0 257.0" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>
  <path fill="none" d="M 620 345 L 620 365" stroke="#C084FC" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-p)"/>
  <path fill="none" d="M 800.0 245.0 L 810.0 245.0 C 833.0 245.0, 833.0 210.0, 856.0 210.0 L 870.0 210.0" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-a)"/>
  <path fill="none" d="M 800.0 321.0 L 810.0 321.0 C 833.0 321.0, 833.0 375.0, 856.0 375.0 L 870.0 375.0" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- Bottom Invariant Banner -->
  <rect x="50" y="535" width="1100" height="40" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="600" y="560" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Zero-Trust Security Invariant: Perimeter security alone is insufficient. Every request is authenticated at edge, authorized at controller, and audited at persistence.</text>
</svg>