<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1100" height="480" rx="10" fill="url(#bg)"/>
  <rect width="1100" height="480" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="550" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">Authentication vs Authorization: The Airport Terminal Security Model</text>
  <text x="550" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">AuthN: 'Who Are You?' (TSA Checkpoint) vs AuthZ: 'What Are You Permitted to Access?' (Gate &amp; Lounge)</text>
  <line x1="40" y1="68" x2="1060" y2="68" stroke="#334155" stroke-width="1"/>

  <!-- Left Side: Authentication (AuthN) -->
  <rect x="50" y="105" width="460" height="325" rx="8" fill="#06201B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="50" y="105" width="460" height="32" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="280" y="126" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">Authentication (AuthN): "Who Are You?"</text>

  <!-- TSA Card -->
  <rect x="75" y="155" width="410" height="110" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="95" y="180" font-size="12" font-weight="700" fill="#34D399">1. TSA Security Checkpoint (Identity Verification)</text>
  <text x="95" y="205" font-size="10" fill="#CBD5E1">&#x2022; Inspects Government Passport &amp; Biometrics</text>
  <text x="95" y="225" font-size="10" fill="#CBD5E1">&#x2022; Establishes authentic identity: <tspan fill="#34D399" font-weight="700">"You are John Doe"</tspan></text>
  <text x="95" y="245" font-size="9" fill="#94A3B8">&#x2022; Software Equivalent: Username/Password, MFA, OAuth2 / OIDC</text>

  <!-- AuthN Characteristics -->
  <rect x="75" y="280" width="410" height="130" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="95" y="305" font-size="11" font-weight="700" fill="#F8FAFC">Technical Mechanics &amp; Failure Mode:</text>
  <text x="95" y="330" font-size="10" fill="#CBD5E1">&#x2022; Component: <tspan font-family="'JetBrains Mono', monospace" fill="#7DD3FC">AuthenticationManager / JwtDecoder</tspan></text>
  <text x="95" y="352" font-size="10" fill="#CBD5E1">&#x2022; Storage: Populates <tspan font-family="'JetBrains Mono', monospace" fill="#A78BFA">SecurityContextHolder.getContext()</tspan></text>
  <text x="95" y="375" font-size="10" font-weight="700" fill="#F87171">&#x2718; Failure HTTP Status: 401 Unauthorized</text>
  <text x="95" y="395" font-size="9" fill="#FCA5A5">  (Meaning: Unauthenticated! You must provide valid credentials)</text>

  <!-- Right Side: Authorization (AuthZ) -->
  <rect x="590" y="105" width="460" height="325" rx="8" fill="#1C1917" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="590" y="105" width="460" height="32" rx="8" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
  <text x="820" y="126" font-size="12" font-weight="700" fill="#FDE68A" text-anchor="middle">Authorization (AuthZ): "What Can You Access?"</text>

  <!-- Gate Check -->
  <rect x="615" y="155" width="410" height="110" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
  <text x="635" y="180" font-size="12" font-weight="700" fill="#FBBF24">2. Flight Gate &amp; VIP Lounge (Permissions Check)</text>
  <text x="635" y="205" font-size="10" fill="#CBD5E1">&#x2022; Gate Agent inspects Boarding Pass Ticket:</text>
  <text x="635" y="225" font-size="10" fill="#34D399">&#x2714; Confirms ticket for Flight 402, Seat 12B: PASS</text>
  <text x="635" y="245" font-size="10" fill="#F87171">&#x2718; Attempts entry to VIP First-Class Lounge with Economy ticket: DENIED</text>

  <!-- AuthZ Characteristics -->
  <rect x="615" y="280" width="410" height="130" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="635" y="305" font-size="11" font-weight="700" fill="#F8FAFC">Technical Mechanics &amp; Failure Mode:</text>
  <text x="635" y="330" font-size="10" fill="#CBD5E1">&#x2022; Component: <tspan font-family="'JetBrains Mono', monospace" fill="#7DD3FC">AuthorizationManager / MethodSecurityInterceptor</tspan></text>
  <text x="635" y="352" font-size="10" fill="#CBD5E1">&#x2022; Rules: <tspan font-family="'JetBrains Mono', monospace" fill="#A78BFA">@PreAuthorize("hasAuthority('ROLE_ADMIN')")</tspan></text>
  <text x="635" y="375" font-size="10" font-weight="700" fill="#EF4444">&#x2718; Failure HTTP Status: 403 Forbidden</text>
  <text x="635" y="395" font-size="9" fill="#FCA5A5">  (Meaning: Authenticated identity verified, but access is DENIED!)</text>

  <!-- Directional Flow Connector between Boxes -->
  <path fill="none" d="M 510 267 L 590 267" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arr-b)"/>
  <text x="550" y="255" font-size="9" font-weight="700" fill="#38BDF8" text-anchor="middle">Passes ID</text>

  <!-- Bottom Invariant Banner -->
  <rect x="50" y="445" width="1000" height="25" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="550" y="462" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Core Rule: Authentication ALWAYS precedes Authorization. You cannot decide what a user can do until you know who they are.</text>
</svg>