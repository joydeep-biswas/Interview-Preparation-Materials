  <text x="540" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Distributed Tracing with OpenTelemetry &amp; W3C TraceContext</text>
  <text x="540" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">End-to-End Context Propagation across Microservices via traceparent &amp; tracestate Headers</text>
<rect x="60" y="100" width="180" height="50" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
<text x="150" y="121" fill="#3b82f6" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">User Browser</text>
