<line x1="930" y1="150" x2="930" y2="465" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="150" y1="175" x2="410" y2="175" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>
<text x="280" y="167" fill="#93C5FD" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">1. POST /api/v1/orders</text>
<rect x="290" y="200" width="240" height="48" rx="6" fill="#083344" stroke="#06b6d4" stroke-width="1.5"/>
<text x="300" y="216" fill="#22D3EE" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Generates W3C Traceparent:</text>
<text x="300" y="230" fill="#FDE68A" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">TraceID: 4bf92f3577b34da6</text>
<text x="300" y="242" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Gateway SpanID: 00f067aa0ba902b7</text>
<line x1="410" y1="270" x2="670" y2="270" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
<text x="540" y="262" fill="#A7F3D0" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">2. POST /orders (Header: traceparent: 00-4bf92f...-00f067...-01)</text>
<rect x="550" y="295" width="240" height="40" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
<text x="560" y="311" fill="#6EE7B7" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Child Span Created (Order Svc):</text>
<text x="560" y="327" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Same TraceID: 4bf92f... | New SpanID: e4a781...</text>
<line x1="670" y1="355" x2="930" y2="355" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#arr-a)"/>
<text x="800" y="347" fill="#FDE68A" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">3. POST /charges (Header: traceparent: 00-4bf92f...-e4a781...-01)</text>
<line x1="930" y1="390" x2="670" y2="390" stroke="#34D399" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-g)"/>
<text x="800" y="382" fill="#6EE7B7" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">200 OK (Payment Processed in 45ms)</text>
<line x1="670" y1="425" x2="410" y2="425" stroke="#34D399" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-g)"/>
<text x="540" y="417" fill="#6EE7B7" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">200 OK (Order Created in 120ms)</text>
<line x1="410" y1="455" x2="150" y2="455" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-b)"/>
<text x="280" y="447" fill="#93C5FD" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">200 OK (Total E2E Latency: 165ms)</text>
<rect x="40" y="480" width="1000" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<text x="65" y="503" fill="#38BDF8" font-size="10.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">W3C Traceparent Header Anatomy (00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01):</text>
<text x="65" y="523" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• '00': Specification Version | '4bf92f...': 16-byte global TraceID (constant across all downstream calls)</text>
<text x="65" y="540" fill="#34D399" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• '00f067...': 8-byte Parent SpanID (uniquely identifies the caller's specific execution segment) | '01': TraceFlags (sampled = true)</text>
<text x="65" y="555" fill="#FDE68A" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Automatic Instrumentation: OpenTelemetry Java Agent auto-injects and extracts these HTTP headers with zero manual code changes!</text>
</svg>