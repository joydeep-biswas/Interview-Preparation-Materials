<text x="385" y="457" fill="#34D399" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Netty EventLoop</text>
<text x="385" y="475" fill="#CBD5E1" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Single-threaded reactor (2</text>
<text x="385" y="489" fill="#94A3B8" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle"> * vCPU threads)</text>
<rect x="530" y="435" width="190" height="65" rx="6" fill="#0f172a" stroke="#34D399" stroke-width="1"/>
<text x="625" y="457" fill="#34D399" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">TCP Socket Rcv Buffer</text>
<text x="625" y="475" fill="#CBD5E1" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">SO_RCVBUF sliding window b</text>
<text x="625" y="489" fill="#94A3B8" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">uffer in RAM</text>
