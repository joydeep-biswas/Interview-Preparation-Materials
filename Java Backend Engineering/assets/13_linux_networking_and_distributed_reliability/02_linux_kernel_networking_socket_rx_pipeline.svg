  <text x="550" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Linux Kernel Networking &amp; High-Concurrency Socket Subsystem</text>
  <text x="550" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Physical NIC -&gt; DMA -&gt; Kernel RX Ring -&gt; Hard IRQ -&gt; NAPI SoftIRQ -&gt; TCP Stack -&gt; epoll -&gt; Netty</text>
