<text x="550" y="555" fill="#38BDF8" font-size="10.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Critical Linux Kernel TCP Tuning Invariants for High-QPS Microservices:</text>
<text x="550" y="572" fill="#CBD5E1" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">net.core.somaxconn = 4096 (prevents SYN drops) | net.ipv4.tcp_max_syn_backlog = 8192 | net.ipv4.tcp_tw_reuse = 1 (rapid socket recycling)</text>
