<text x="737" y="307" fill="#C084FC" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">3-Way Handshake</text>
<text x="737" y="325" fill="#CBD5E1" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">SYN -&gt; SYN-ACK -&gt; ACK co</text>
<text x="737" y="339" fill="#94A3B8" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">mpleted</text>
