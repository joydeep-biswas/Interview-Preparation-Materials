<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" width="1080" height="580">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1080" height="580" rx="10" fill="url(#bg)"/>
  <text x="540" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">The Automated Testing Pyramid: Speed, Cost, and Fidelity Trade-Offs</text>
  <text x="540" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Balancing Unit Tests (60-70%), Integration Tests (20-30%), and End-to-End Tests (5-10%)</text>
<rect x="290" y="100" width="500" height="85" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
<text x="540" y="124" fill="#FECACA" font-size="12" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">End-to-End (E2E) &amp; UI Tests (5 - 10%)</text>
<text x="310" y="146" fill="#FCA5A5" font-size="9.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Speed: Minutes | Cost: Very High | Brittleness: High (Flaky)</text>
<text x="310" y="164" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Scope: Tests full user journeys through UI, API Gateway, and auth</text>
<text x="310" y="178" fill="#FDE68A" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Keep minimal: Only test critical business checkout/happy paths</text>
<rect x="190" y="205" width="700" height="105" rx="8" fill="#083344" stroke="#06b6d4" stroke-width="2"/>
<text x="540" y="229" fill="#22D3EE" font-size="12" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Integration Tests (20 - 30%)</text>
<text x="215" y="253" fill="#67E8F9" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Speed: Seconds | Cost: Moderate | Fidelity: High (Real Infrastructure)</text>
<text x="215" y="273" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Scope: Spring @SpringBootTest, @DataJpaTest, Testcontainers (PostgreSQL, Kafka, Redis)</text>
<text x="215" y="291" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Verifies: Database migrations (Flyway/Liquibase), complex JPA queries, Kafka consumers</text>
<text x="215" y="305" fill="#34D399" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Avoid mocks for infrastructure: Use real containerized dependencies!</text>
<rect x="90" y="330" width="900" height="120" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
<text x="540" y="356" fill="#34D399" font-size="13" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Unit Tests: The Foundation of Fast Feedback (60 - 70%)</text>
<text x="115" y="382" fill="#A7F3D0" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Speed: Milliseconds | Cost: Near Zero | Determinism: 100% (Isolated)</text>
<text x="115" y="402" fill="#CBD5E1" font-size="9.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Scope: Tests isolated domain business logic, mathematical algorithms, state machine transitions</text>
<text x="115" y="420" fill="#CBD5E1" font-size="9.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Tools: JUnit 5, AssertJ, Mockito (Mocks external collaborators, never mocks domain objects!)</text>
<text x="115" y="438" fill="#6EE7B7" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Immediate feedback loop: Developers run hundreds of unit tests in 2-3 seconds locally during coding.</text>
<line x1="60" y1="430" x2="60" y2="120" stroke="#34D399" stroke-width="2" marker-end="url(#arr-g)"/>
<text x="60" y="445" fill="#34D399" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">FAST</text>
<text x="60" y="110" fill="#F87171" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">SLOW</text>
<line x1="1020" y1="430" x2="1020" y2="120" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>
<text x="1020" y="445" fill="#94A3B8" font-size="8.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">ISOLATED</text>
<text x="1020" y="110" fill="#38BDF8" font-size="8.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">FULL SYSTEM</text>
<rect x="40" y="470" width="1000" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<text x="65" y="495" fill="#F87171" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">The Testing Ice Cream Cone Anti-Pattern:</text>
<text x="65" y="515" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Symptoms: An inverted pyramid with 80% E2E tests and few unit tests. Results in CI builds taking 45+ minutes, rampant flaky test failures, and developers disabling tests.</text>
<text x="65" y="532" fill="#34D399" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Remediation: Push assertions down to the lowest feasible tier. Test all boundary conditions in unit tests; use integration tests only to verify that wiring and contracts match.</text>
</svg>