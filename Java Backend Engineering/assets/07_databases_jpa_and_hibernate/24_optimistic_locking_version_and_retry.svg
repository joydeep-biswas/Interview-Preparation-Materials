<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="1100" height="580">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1100" height="580" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="550" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Optimistic Locking (@Version) &amp; Automated Spring Retry Pattern</text>
  <text x="550" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Conflict Detection via WHERE id = ? AND version = ? and Spring @Retryable Recovery Mechanism</text>
<rect x="70" y="95" width="230" height="50" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
<text x="185" y="116" fill="#3b82f6" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Thread 1 (User A)</text>
<text x="185" y="134" fill="#94A3B8" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">First Updater</text>
<line x1="185" y1="145" x2="185" y2="485" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="450" y="95" width="230" height="50" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
<text x="565" y="116" fill="#10b981" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">PostgreSQL Database</text>
<text x="565" y="134" fill="#94A3B8" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Table: accounts (id=1, version)</text>
<line x1="565" y1="145" x2="565" y2="485" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="800" y="95" width="230" height="50" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="915" y="116" fill="#f59e0b" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Thread 2 (User B)</text>
<text x="915" y="134" fill="#94A3B8" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">@Retryable(OptimisticLockException)</text>
<line x1="915" y1="145" x2="915" y2="485" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="440" y="150" width="250" height="26" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
<text x="565" y="167" fill="#A7F3D0" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Initial: id=1, balance=100.00, version=1</text>
<line x1="185" y1="190" x2="565" y2="190" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>
<text x="375" y="182" fill="#93C5FD" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">1. Read Account (balance=100, version=1)</text>
<line x1="915" y1="220" x2="565" y2="220" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#arr-a)"/>
<text x="740" y="212" fill="#FDE68A" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">2. Read Account (balance=100, version=1)</text>
<line x1="185" y1="265" x2="565" y2="265" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>
<text x="375" y="257" fill="#38BDF8" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">3. UPDATE ... SET balance=150, version=2 WHERE id=1 AND version=1</text>
<rect x="440" y="295" width="250" height="34" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
<text x="565" y="311" fill="#6EE7B7" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Rows Updated: 1 (SUCCESS!)</text>
<text x="565" y="323" fill="#CBD5E1" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Database state: balance=150, version=2</text>
<line x1="915" y1="345" x2="565" y2="345" stroke="#F87171" stroke-width="1.5" marker-end="url(#arr-r)"/>
<text x="740" y="337" fill="#F87171" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">4. UPDATE ... SET balance=80, version=2 WHERE id=1 AND version=1</text>
<rect x="430" y="375" width="270" height="34" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
<text x="565" y="391" fill="#FECACA" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Rows Updated: 0 (VERSION MISMATCH!)</text>
<text x="565" y="403" fill="#FCA5A5" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">version=1 no longer exists in DB!</text>
<line x1="565" y1="425" x2="915" y2="425" stroke="#F87171" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-r)"/>
<text x="740" y="417" fill="#EF4444" font-size="8.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Throws OptimisticLockException!</text>
<rect x="790" y="445" width="250" height="40" rx="6" fill="#78350f" stroke="#f59e0b" stroke-width="1.5"/>
<text x="915" y="462" fill="#FDE68A" font-size="8.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">@Retryable: Re-reads latest version=2</text>
<text x="915" y="476" fill="#6EE7B7" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Recomputes &amp; successfully updates on retry!</text>
<rect x="40" y="500" width="1020" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<text x="65" y="522" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Optimistic Locking vs Pessimistic Locking Guideline:</text>
<text x="65" y="540" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Optimistic Locking (@Version): Assumes low collision frequency. Zero lock contention; high read throughput. Requires idempotent automated retry mechanism.</text>
<text x="65" y="556" fill="#34D399" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Pessimistic Locking (SELECT ... FOR UPDATE): Locks physical row immediately. Required for extreme write contention (flash-sale inventory, high-frequency ledgers).</text>
</svg>