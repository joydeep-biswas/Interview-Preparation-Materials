<rect x="40" y="440" width="1000" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<text x="65" y="465" fill="#60A5FA" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">B+Tree Key Architectural Properties:</text>
<text x="65" y="485" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• High Fanout (Branching Factor): 8KB page can store ~200-500 keys, requiring only 3-4 I/O hops to locate ANY row among 100M rows.</text>
<text x="65" y="505" fill="#34D399" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Doubly-Linked Leaves: Range scans (BETWEEN 30 AND 220) traverse root once to find key 30, then scan horizontally in O(1) page order.</text>
<text x="65" y="525" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Clustered vs Secondary: In MySQL InnoDB, leaf contains the full row data. In PostgreSQL, leaf contains physical (block_id, offset) TID.</text>
</svg>