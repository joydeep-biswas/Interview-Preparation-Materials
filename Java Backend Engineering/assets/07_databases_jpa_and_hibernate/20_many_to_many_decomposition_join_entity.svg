<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" width="1080" height="580">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1080" height="580" rx="10" fill="url(#bg)"/>
  <text x="540" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">ManyToMany Decomposition: Why Direct @ManyToMany is an Anti-Pattern</text>
  <text x="540" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Decomposing Hidden Join Tables into an Explicit Entity with EmbeddedId, Timestamps, and Audit Columns</text>
<rect x="40" y="95" width="1000" height="180" rx="8" fill="#1a1118" stroke="#ef4444" stroke-width="1.5"/>
<rect x="55" y="107" width="280" height="22" rx="11" fill="#7f1d1d"/><text x="195" y="121" fill="#FECACA" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">ANTI-PATTERN: Direct @ManyToMany</text>
<text x="355" y="123" fill="#F87171" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Hidden Junction Table &amp; Inability to Store Business Attributes</text>
<rect x="65" y="145" width="260" height="105" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
<text x="195" y="167" fill="#FCA5A5" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">StudentEntity</text>
<text x="80" y="187" fill="#F87171" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">@ManyToMany</text>
<text x="80" y="203" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">@JoinTable(name='student_courses')</text>
<text x="80" y="219" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Set&lt;CourseEntity&gt; courses;</text>
<text x="80" y="237" fill="#EF4444" font-size="8" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">No way to record when enrolled!</text>
<rect x="410" y="145" width="260" height="105" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,4"/>
<text x="540" y="167" fill="#EF4444" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Hidden Table: student_courses</text>
<text x="540" y="183" fill="#94A3B8" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">(Unmanaged by Java Classes)</text>
<text x="425" y="203" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">student_id BIGINT REFERENCES students</text>
<text x="425" y="219" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">course_id BIGINT REFERENCES courses</text>
<text x="425" y="237" fill="#F87171" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">FLAW: Modifying Set removes &amp; re-inserts ALL!</text>
<rect x="755" y="145" width="260" height="105" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
<text x="885" y="167" fill="#FCA5A5" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">CourseEntity</text>
<text x="770" y="187" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">@ManyToMany(mappedBy='courses')</text>
<text x="770" y="205" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Set&lt;StudentEntity&gt; students;</text>
<text x="770" y="227" fill="#EF4444" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">No grade, no status, no audit!</text>
<line x1="325" y1="197" x2="410" y2="197" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arr-r)"/>
<line x1="670" y1="197" x2="755" y2="197" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arr-r)"/>
<rect x="40" y="295" width="1000" height="260" rx="8" fill="#062e3b" stroke="#10b981" stroke-width="2"/>
<rect x="55" y="307" width="340" height="22" rx="11" fill="#047857"/><text x="225" y="321" fill="#D1FAE5" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">ENTERPRISE PATTERN: Explicit Intermediate Entity</text>
<text x="415" y="323" fill="#34D399" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Decomposed into Two 1:N Relationships with Rich Domain Attributes</text>
<rect x="65" y="345" width="260" height="185" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
<text x="195" y="367" fill="#60A5FA" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">StudentEntity (1)</text>
<text x="80" y="390" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">@Id Long id;</text>
<text x="80" y="408" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">String name;</text>
<text x="80" y="430" fill="#38BDF8" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">@OneToMany(mappedBy='student',</text>
<text x="95" y="446" fill="#38BDF8" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">cascade=ALL, orphanRemoval=true)</text>
<text x="80" y="464" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">List&lt;EnrollmentEntity&gt; enrollments;</text>
<text x="80" y="490" fill="#34D399" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Clean 1:N navigation</text>
<text x="80" y="510" fill="#94A3B8" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Granular collection control</text>
<rect x="375" y="345" width="330" height="185" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
<text x="540" y="367" fill="#34D399" font-size="11" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">EnrollmentEntity (Join Entity)</text>
<text x="390" y="390" fill="#FBBF24" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">@EmbeddedId EnrollmentId id;</text>
<text x="390" y="408" fill="#38BDF8" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">@ManyToOne @MapsId('studentId') Student student;</text>
<text x="390" y="426" fill="#38BDF8" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">@ManyToOne @MapsId('courseId') Course course;</text>
<text x="390" y="450" fill="#6EE7B7" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Rich Domain Business Attributes:</text>
<text x="405" y="468" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Instant enrolledAt = Instant.now();</text>
<text x="405" y="484" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• String grade;  // 'A+', 'B'</text>
<text x="405" y="500" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• EnrollmentStatus status; // ACTIVE, DROPPED</text>
<text x="390" y="520" fill="#34D399" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Zero bulk delete/re-insert thrashing!</text>
<rect x="755" y="345" width="260" height="185" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
<text x="885" y="367" fill="#FBBF24" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">CourseEntity (1)</text>
<text x="770" y="390" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">@Id Long id;</text>
<text x="770" y="408" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">String title; int credits;</text>
<text x="770" y="430" fill="#FDE68A" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">@OneToMany(mappedBy='course')</text>
<text x="770" y="446" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">List&lt;EnrollmentEntity&gt; enrollments;</text>
<text x="770" y="475" fill="#34D399" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Allows querying enrollments</text>
<text x="770" y="493" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">by semester, date, or grade</text>
<text x="770" y="513" fill="#94A3B8" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Optimized SQL execution</text>
<line x1="325" y1="435" x2="375" y2="435" stroke="#34D399" stroke-width="2" marker-end="url(#arr-g)"/>
<line x1="705" y1="435" x2="755" y2="435" stroke="#34D399" stroke-width="2" marker-end="url(#arr-g)"/>
</svg>