<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" width="1080" height="580">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1080" height="580" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="540" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">HikariCP Fast-Path Connection Pool Architecture</text>
  <text x="540" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Thread-Local Fast-Path, Lock-Free ConcurrentBag (CAS Array Scanning), and HandOff Handoff Mechanics</text>
<rect x="360" y="95" width="360" height="55" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
<text x="540" y="117" fill="#F8FAFC" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Application Thread calls dataSource.getConnection()</text>
<text x="540" y="135" fill="#94A3B8" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Thread-bound context looking for available connection</text>
<line x1="540" y1="150" x2="540" y2="180" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>
<rect x="360" y="180" width="360" height="65" rx="8" fill="#083344" stroke="#06b6d4" stroke-width="2"/>
<text x="540" y="204" fill="#22D3EE" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Tier 1: Fast-Path Thread-Local Check</text>
<text x="540" y="222" fill="#E2E8F0" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">threadLocal.get() -&gt; FastList&lt;BagEntry&gt;</text>
<text x="540" y="236" fill="#94A3B8" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Did this thread recently return an idle connection?</text>
<line x1="360" y1="212" x2="190" y2="212" stroke="#34D399" stroke-width="2"/>
<line x1="190" y1="212" x2="190" y2="270" stroke="#34D399" stroke-width="2" marker-end="url(#arr-g)"/>
<rect x="220" y="198" width="100" height="20" rx="10" fill="#064e3b" stroke="#10B981" stroke-width="1"/><text x="270" y="211" fill="#6EE7B7" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">HIT (&gt;95% in apps)</text>
<rect x="40" y="270" width="300" height="110" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
<text x="190" y="295" fill="#D1FAE5" font-size="12" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Fast-Path Borrow Success!</text>
<text x="55" y="318" fill="#A7F3D0" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Zero locks, zero CAS, zero contention!</text>
<text x="55" y="336" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• State transitioned: STATE_NOT_IN_USE -&gt; IN_USE</text>
<text x="55" y="354" fill="#34D399" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Latency: ~500 nanoseconds (~250ns on Java 17+)</text>
<text x="55" y="370" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Direct return to application thread</text>
<line x1="540" y1="245" x2="540" y2="270" stroke="#FBBF24" stroke-width="2" marker-end="url(#arr-a)"/>
<rect x="550" y="270" width="60" height="20" rx="10" fill="#78350f" stroke="#F59E0B" stroke-width="1"/><text x="580" y="283" fill="#FDE68A" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">MISS</text>
<rect x="360" y="270" width="360" height="110" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="540" y="295" fill="#FBBF24" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Tier 2: Lock-Free ConcurrentBag</text>
<text x="540" y="312" fill="#E2E8F0" font-size="9.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">CopyOnWriteArrayList Scan with atomic CAS</text>
<text x="375" y="332" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Scans shared sharedList array of pool entries</text>
<text x="375" y="348" fill="#FDE68A" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• entry.compareAndSet(STATE_NOT_IN_USE, STATE_IN_USE)</text>
<text x="375" y="364" fill="#34D399" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• If CAS succeeds -&gt; Returns borrowed connection (~2µs)</text>
<line x1="720" y1="325" x2="780" y2="325" stroke="#F87171" stroke-width="2" marker-end="url(#arr-r)"/>
<rect x="722" y="300" width="56" height="16" rx="8" fill="#7f1d1d" stroke="#EF4444" stroke-width="1"/><text x="750" y="311" fill="#FECACA" font-size="7.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">EXHAUSTED</text>
<rect x="780" y="270" width="260" height="110" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
<text x="910" y="295" fill="#FECACA" font-size="11" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Tier 3: HandOffQueue Wait</text>
<text x="795" y="318" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• SynchronousQueue / HandoffQueue</text>
<text x="795" y="334" fill="#FCA5A5" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Thread parks up to connectionTimeout</text>
<text x="795" y="350" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  (Default: 30,000ms / 30 seconds)</text>
<text x="795" y="368" fill="#EF4444" font-size="8.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• If timeout expired -&gt; SQLTransientConnEx!</text>
<rect x="40" y="400" width="1000" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<text x="65" y="422" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Connection Return Flow (connection.close()):</text>
<text x="65" y="442" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">1. Thread deposits connection into threadLocal cache for instant reuse. 2. If waiters exist on handoff queue, passes it directly via SynchronousQueue without returning to pool!</text>
<rect x="40" y="480" width="1000" height="85" rx="8" fill="#0b1329" stroke="#3b82f6" stroke-width="1.5"/>
<text x="65" y="502" fill="#60A5FA" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">The Famous PostgreSQL / HikariCP Pool Sizing Formula:</text>
<text x="540" y="528" fill="#FDE68A" font-size="13" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">connections = ( (core_count * 2) + effective_spindle_count )</text>
<text x="540" y="550" fill="#94A3B8" font-size="9.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">A pool of 10-20 connections handles thousands of concurrent HTTP requests with near-zero disk queue thrashing!</text>
</svg>