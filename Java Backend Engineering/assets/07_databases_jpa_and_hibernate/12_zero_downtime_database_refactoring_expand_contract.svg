<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="1080" height="560">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1080" height="560" rx="10" fill="url(#bg)"/>
  <text x="540" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Zero-Downtime Database Refactoring: The Expand-Contract Pattern</text>
  <text x="540" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Safe Non-Breaking Database Schema Evolution &amp; Column Alterations in High-Throughput Production</text>
<rect x="40" y="110" width="230" height="320" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="40" y="110" width="230" height="55" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
<text x="155" y="132" fill="#F8FAFC" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Phase 1: Expand</text>
<text x="155" y="152" fill="#3b82f6" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Add column &amp; Dual-Write</text>
<text x="52" y="185" fill="#3b82f6" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">•</text>
<text x="64" y="185" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">ALTER TABLE users ADD</text>
<text x="64" y="199" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">full_name VARCHAR(255) NULL;</text>
<text x="52" y="217" fill="#3b82f6" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">•</text>
<text x="64" y="217" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Add DB Trigger OR App</text>
<text x="64" y="231" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Dual-Write: Writes populate</text>
<text x="64" y="245" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">both 'name' AND 'full_name'</text>
<text x="52" y="263" fill="#3b82f6" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">•</text>
<text x="64" y="263" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Old app code continues</text>
<text x="64" y="277" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">reading from 'name' unharmed</text>
<text x="52" y="295" fill="#3b82f6" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">•</text>
<text x="64" y="295" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Zero locking! Column is</text>
<text x="64" y="309" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">nullable.</text>
<line x1="270" y1="270" x2="300" y2="270" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>
<rect x="300" y="110" width="230" height="320" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
<rect x="300" y="110" width="230" height="55" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
<text x="415" y="132" fill="#F8FAFC" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Phase 2: Backfill</text>
<text x="415" y="152" fill="#06b6d4" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Historical Data Migration</text>
<text x="312" y="185" fill="#06b6d4" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">•</text>
<text x="324" y="185" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Run async throttled</text>
<text x="324" y="199" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">background worker:</text>
<text x="312" y="217" fill="#06b6d4" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">•</text>
<text x="324" y="217" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">UPDATE users SET full_name =</text>
<text x="324" y="231" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">name WHERE full_name IS NULL</text>
<text x="324" y="245" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">LIMIT 1000;</text>
<text x="312" y="263" fill="#06b6d4" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">•</text>
<text x="324" y="263" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Throttled sleep between</text>
<text x="324" y="277" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">chunks avoids lock</text>
<text x="324" y="291" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">escalation and replication</text>
<text x="324" y="305" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">lag</text>
<text x="312" y="323" fill="#06b6d4" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">•</text>
<text x="324" y="323" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Verify: Zero rows have</text>
<text x="324" y="337" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">full_name IS NULL</text>
<line x1="530" y1="270" x2="560" y2="270" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>
<rect x="560" y="110" width="230" height="320" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
<rect x="560" y="110" width="230" height="55" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
<text x="675" y="132" fill="#F8FAFC" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Phase 3: Switch Reads</text>
<text x="675" y="152" fill="#10b981" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Deploy New Application Code</text>
<text x="572" y="185" fill="#10b981" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">•</text>
<text x="584" y="185" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Deploy App v2.0 reading</text>
<text x="584" y="199" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">exclusively from 'full_name'</text>
<text x="572" y="217" fill="#10b981" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">•</text>
<text x="584" y="217" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Writes still dual-write to</text>
<text x="584" y="231" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">both columns to allow</text>
<text x="584" y="245" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">instant rollback</text>
<text x="572" y="263" fill="#10b981" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">•</text>
<text x="584" y="263" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Canary / Blue-Green</text>
<text x="584" y="277" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">verification of data</text>
<text x="584" y="291" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">integrity in production</text>
<text x="572" y="309" fill="#10b981" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">•</text>
<text x="584" y="309" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Monitor error logs &amp; latency</text>
<text x="584" y="323" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">metrics</text>
<line x1="790" y1="270" x2="820" y2="270" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>
<rect x="820" y="110" width="230" height="320" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
<rect x="820" y="110" width="230" height="55" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="935" y="132" fill="#F8FAFC" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Phase 4: Contract</text>
<text x="935" y="152" fill="#8b5cf6" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Deprecate &amp; Clean Legacy</text>
<text x="832" y="185" fill="#8b5cf6" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">•</text>
<text x="844" y="185" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Deploy App v2.1: Stop</text>
<text x="844" y="199" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">writing to legacy 'name'</text>
<text x="832" y="217" fill="#8b5cf6" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">•</text>
<text x="844" y="217" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Drop database trigger /</text>
<text x="844" y="231" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">dual-write logic</text>
<text x="832" y="249" fill="#8b5cf6" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">•</text>
<text x="844" y="249" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Drop old column: ALTER TABLE</text>
<text x="844" y="263" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">users DROP COLUMN name;</text>
<text x="832" y="281" fill="#8b5cf6" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">•</text>
<text x="844" y="281" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Clean schema with ZERO</text>
<text x="844" y="295" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">downtime!</text>
<rect x="40" y="450" width="1000" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<text x="65" y="475" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Zero-Downtime Migration Invariants:</text>
<text x="65" y="495" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Never add NOT NULL without DEFAULT in a single DDL in older DB engines (locks table). In modern PG: ADD COLUMN ... DEFAULT is metadata-only.</text>
<text x="65" y="512" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Chunked Backfills: Always batch updates in transactions of 500-2,000 rows with 50ms pause to allow replication streams to keep pace.</text>
<text x="65" y="528" fill="#34D399" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Rollback Safe: Because writes dual-write during Phase 2 and 3, rolling back the application code requires zero database rollbacks!</text>
</svg>