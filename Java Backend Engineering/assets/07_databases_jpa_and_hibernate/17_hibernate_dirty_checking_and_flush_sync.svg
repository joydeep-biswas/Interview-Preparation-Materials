    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1060" height="580" rx="10" fill="url(#bg)"/>
  <text x="530" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Hibernate Automatic Dirty Checking &amp; Flush Synchronization Lifecycle</text>
  <text x="530" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Snapshot Comparison in Persistence Context (L1 Cache) and ActionQueue Batch Execution</text>
<rect x="70" y="95" width="180" height="50" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
<text x="160" y="116" fill="#3b82f6" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Application Service</text>
<text x="160" y="134" fill="#94A3B8" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Service Method Scope</text>
<line x1="160" y1="145" x2="160" y2="480" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="330" y="95" width="180" height="50" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
<text x="420" y="116" fill="#10b981" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Persistence Context</text>
<text x="420" y="134" fill="#94A3B8" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">L1 Cache &amp; Snapshots</text>
<line x1="420" y1="145" x2="420" y2="480" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="600" y="95" width="180" height="50" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="690" y="116" fill="#f59e0b" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Hibernate ActionQueue</text>
<text x="690" y="134" fill="#94A3B8" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Batched DML Scheduler</text>
<line x1="690" y1="145" x2="690" y2="480" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="840" y="95" width="180" height="50" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
<text x="930" y="116" fill="#06b6d4" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Relational Database</text>
<text x="930" y="134" fill="#94A3B8" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">PostgreSQL Storage</text>
<line x1="930" y1="145" x2="930" y2="480" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="160" y1="170" x2="420" y2="170" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>
<text x="290" y="162" fill="#93C5FD" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">1. em.find(Order, 101L)</text>
<line x1="420" y1="188" x2="930" y2="188" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>
<text x="675" y="180" fill="#94A3B8" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">2. SELECT * FROM orders WHERE id=101</text>
<line x1="930" y1="215" x2="420" y2="215" stroke="#34D399" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-g)"/>
<text x="675" y="207" fill="#6EE7B7" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">3. Returns row: [status='PENDING', total=100]</text>
<rect x="290" y="240" width="260" height="46" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
<text x="300" y="258" fill="#6EE7B7" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Persistence Context Initialization:</text>
<text x="300" y="274" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">1. Entity Instance created  2. Baseline Snapshot: ['PENDING', 100]</text>
<line x1="420" y1="300" x2="160" y2="300" stroke="#34D399" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-g)"/>
<text x="290" y="292" fill="#93C5FD" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">4. Returns Managed Order instance</text>
<rect x="60" y="325" width="200" height="38" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
<text x="160" y="341" fill="#93C5FD" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">order.setStatus(CONFIRMED);</text>
<text x="160" y="355" fill="#FDE68A" font-size="8" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">No repository.save() needed!</text>
<line x1="160" y1="380" x2="420" y2="380" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#arr-a)"/>
<text x="290" y="372" fill="#FDE68A" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">5. Transaction commit() / flush()</text>
<rect x="300" y="400" width="240" height="42" rx="6" fill="#111827" stroke="#f59e0b" stroke-width="1"/>
<text x="420" y="416" fill="#FBBF24" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Dirty Checking: Entity vs Snapshot</text>
<text x="420" y="432" fill="#F87171" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">'CONFIRMED' != 'PENDING' -&gt; DIRTY!</text>
<line x1="420" y1="421" x2="690" y2="421" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#arr-a)"/>
<line x1="690" y1="455" x2="930" y2="455" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>
<text x="810" y="447" fill="#38BDF8" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">6. UPDATE orders SET status='CONFIRMED' WHERE id=101</text>
<rect x="40" y="495" width="980" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<text x="65" y="517" fill="#38BDF8" font-size="10.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Why Calling repository.save() on Managed Entities is Redundant &amp; Harmful:</text>
<text x="65" y="534" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Spring Data JPA's save() calls em.merge() under the hood, creating an unnecessary copy of an entity that is already managed and dirty-checked.</text>
<text x="65" y="550" fill="#34D399" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Performance Note: Default dirty checking inspects EVERY field of EVERY managed entity on flush ($O(N \times M)$); bytecode enhancement optimizes this to dirty-bit masks.</text>
</svg>