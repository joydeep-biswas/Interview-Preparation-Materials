<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1040" height="520" rx="10" fill="url(#bg)"/>
  <text x="520" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Relational JOIN Taxonomy &amp; Relational Algebra Mechanics</text>
  <text x="520" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Visual Venn spectrum: Inner join intersection, outer join extensions, and cartesian product dangers</text>
<rect x="30" y="85" width="460" height="195" rx="8" fill="#0c1d1a" stroke="#10b981" stroke-width="1.5"/>
<text x="260" y="112" fill="#6EE7B7" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">1. INNER JOIN (Intersection: A ∩ B)</text>
<rect x="170" y="122" width="180" height="18" rx="9" fill="#047857"/><text x="260" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Matching Rows Only</text>
<rect x="50" y="150" width="420" height="115" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
<text x="65" y="172" fill="#CBD5E1" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">SELECT * FROM orders A INNER JOIN customers B ON A.cust_id = B.id;</text>
<text x="65" y="192" fill="#D1FAE5" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Returns ONLY rows where join condition matches in BOTH tables</text>
<text x="65" y="210" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Unmatched rows from Table A and Table B are COMPLETELY EXCLUDED</text>
<text x="65" y="228" fill="#34D399" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Execution: Implemented via Hash Join, Merge Join, or Index Nested Loops</text>
<text x="65" y="244" fill="#A7F3D0" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Symmetric: A INNER JOIN B is strictly identical to B INNER JOIN A</text>
<rect x="550" y="85" width="460" height="195" rx="8" fill="#0b1329" stroke="#3b82f6" stroke-width="1.5"/>
<text x="780" y="112" fill="#60A5FA" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">2. LEFT OUTER JOIN (All A + Matching B)</text>
<rect x="690" y="122" width="180" height="18" rx="9" fill="#1d4ed8"/><text x="780" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Preserves Left Domain</text>
<rect x="570" y="150" width="420" height="115" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="585" y="172" fill="#CBD5E1" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">SELECT * FROM customers A LEFT JOIN orders B ON A.id = B.cust_id;</text>
<text x="585" y="192" fill="#93C5FD" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Returns ALL rows from Table A (Left table preserved 100%)</text>
<text x="585" y="210" fill="#FBBF24" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• For rows with no match in B, all columns from Table B are NULL</text>
<text x="585" y="228" fill="#6EE7B7" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Anti-Join Pattern: WHERE B.id IS NULL finds customers with ZERO orders!</text>
<text x="585" y="244" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• NOT symmetric: A LEFT JOIN B != B LEFT JOIN A</text>
<rect x="30" y="300" width="460" height="195" rx="8" fill="#16122b" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="260" y="325" fill="#C084FC" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">3. FULL OUTER JOIN (Union: A ∪ B)</text>
<rect x="170" y="335" width="180" height="18" rx="9" fill="#6d28d9"/><text x="260" y="347" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Complete Bi-Directional Set</text>
<rect x="50" y="365" width="420" height="115" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
<text x="65" y="387" fill="#CBD5E1" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">SELECT * FROM legacy_users A FULL OUTER JOIN new_users B ...</text>
<text x="65" y="407" fill="#DDD6FE" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Returns all rows from Table A AND all rows from Table B</text>
<text x="65" y="425" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Matching rows are merged into single tuples</text>
<text x="65" y="441" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Missing rows on either side are filled with NULLs</text>
<text x="65" y="459" fill="#34D399" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Perfect for data reconciliation, system migration audits, and diffs</text>
<rect x="550" y="300" width="460" height="195" rx="8" fill="#1a1116" stroke="#ef4444" stroke-width="1.5"/>
<text x="780" y="325" fill="#FCA5A5" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">4. CROSS JOIN (Cartesian Product: A × B)</text>
<rect x="690" y="335" width="180" height="18" rx="9" fill="#991b1b"/><text x="780" y="347" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">DANGER: N × M Tuple Explosion</text>
<rect x="570" y="365" width="420" height="115" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
<text x="585" y="387" fill="#FCA5A5" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">SELECT * FROM colors A CROSS JOIN sizes B; (Zero ON clause!)</text>
<text x="585" y="407" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Combines EVERY row of Table A with EVERY row of Table B</text>
<text x="585" y="425" fill="#F87171" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Output size: Size(A) * Size(B) (e.g. 100k rows * 100k rows = 10 Billion!)</text>
<text x="585" y="443" fill="#FCA5A5" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Accidental omission of ON clause in comma join causes production OOM!</text>
<text x="585" y="461" fill="#6EE7B7" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Valid use: Matrix generation (e.g. dates x stores for dense reporting)</text>
</svg>