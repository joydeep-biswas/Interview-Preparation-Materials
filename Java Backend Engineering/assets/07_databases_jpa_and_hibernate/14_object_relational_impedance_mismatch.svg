<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="1100" height="580">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1100" height="580" rx="10" fill="url(#bg)"/>
  <text x="550" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">The Object-Relational Impedance Mismatch in Enterprise Systems</text>
  <text x="550" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Bridging Structural, Paradigmatic, and Type Frictions Between OOP Graphs and Relational SQL Tables</text>
<rect x="40" y="95" width="340" height="360" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="55" y="110" width="200" height="22" rx="11" fill="#1e3a8a"/><text x="155" y="124" fill="#93C5FD" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Java Object Domain Model</text>
<rect x="55" y="143" width="310" height="85" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
<text x="65" y="163" fill="#60A5FA" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">1. Granularity &amp; Embedded Objects</text>
<text x="65" y="181" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">class User {</text>
<text x="75" y="197" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">UUID id; String name;</text>
<text x="75" y="213" fill="#38BDF8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Address address; // Value Object</text>
<rect x="55" y="237" width="310" height="95" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
<text x="65" y="257" fill="#C084FC" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">2. Polymorphism &amp; Inheritance</text>
<text x="65" y="275" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">abstract class Account { ... }</text>
<text x="65" y="291" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">class SavingsAccount extends Account {</text>
<text x="75" y="307" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">BigDecimal interestRate;</text>
<text x="65" y="321" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">}</text>
<rect x="55" y="341" width="310" height="95" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
<text x="65" y="361" fill="#34D399" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">3. Identity &amp; Associations</text>
<text x="65" y="379" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Identity: == (memory) vs .equals()</text>
<text x="65" y="395" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Directional: user.getOrders()</text>
<text x="65" y="411" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Circular navigation allowed</text>
<text x="65" y="427" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Bidirectional List&lt;Order&gt; pointers</text>
<rect x="410" y="95" width="280" height="360" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
<rect x="425" y="110" width="250" height="22" rx="11" fill="#78350f"/><text x="550" y="124" fill="#FDE68A" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">JPA / Hibernate ORM Layer</text>
<text x="550" y="155" fill="#FBBF24" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">The Translation Bridge</text>
<rect x="422" y="180" width="256" height="48" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
<text x="430" y="196" fill="#FDE68A" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Granularity: @Embeddable &amp; @Embedded</text>
<text x="430" y="214" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Flattens object into parent table</text>
<rect x="422" y="234" width="256" height="48" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
<text x="430" y="250" fill="#FDE68A" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Inheritance: @Inheritance(SINGLE_TABLE)</text>
<text x="430" y="268" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Uses 'DTYPE' discriminator column</text>
<rect x="422" y="288" width="256" height="48" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
<text x="430" y="304" fill="#FDE68A" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Identity: @Id &amp; @GeneratedValue</text>
<text x="430" y="322" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Maps DB Primary Key to Entity ID</text>
<rect x="422" y="342" width="256" height="48" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
<text x="430" y="358" fill="#FDE68A" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Associations: @OneToMany / @JoinColumn</text>
<text x="430" y="376" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Translates references to Foreign Keys</text>
<rect x="422" y="396" width="256" height="48" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
<text x="430" y="412" fill="#FDE68A" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Dirty Checking: Persistence Context L1</text>
<text x="430" y="430" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Diffs object snapshots on flush</text>
<line x1="380" y1="275" x2="410" y2="275" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>
<line x1="410" y1="295" x2="380" y2="295" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>
<rect x="720" y="95" width="340" height="360" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
<rect x="735" y="110" width="200" height="22" rx="11" fill="#064e3b"/><text x="835" y="124" fill="#6EE7B7" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Relational Database (SQL)</text>
<rect x="735" y="143" width="310" height="85" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
<text x="745" y="163" fill="#34D399" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Table: users (Normalized Flat)</text>
<text x="745" y="181" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">id UUID PRIMARY KEY,</text>
<text x="745" y="197" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">name VARCHAR(100),</text>
<text x="745" y="213" fill="#22D3EE" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">street VARCHAR, city VARCHAR (Flattened)</text>
<rect x="735" y="237" width="310" height="95" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
<text x="745" y="257" fill="#C084FC" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Table: accounts (Inheritance Table)</text>
<text x="745" y="275" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">id BIGINT PRIMARY KEY,</text>
<text x="745" y="291" fill="#FDE68A" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">dtype VARCHAR(31), -- 'SAVINGS' / 'CHECKING'</text>
<text x="745" y="307" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">interest_rate NUMERIC(5,2),</text>
<text x="745" y="321" fill="#38BDF8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">user_id UUID REFERENCES users(id)</text>
<rect x="735" y="341" width="310" height="95" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
<text x="745" y="361" fill="#60A5FA" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Foreign Key Mechanics</text>
<text x="745" y="379" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Unidirectional: Child references Parent</text>
<text x="745" y="395" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• No concept of object pointers</text>
<text x="745" y="411" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Identity strictly via Primary Key values</text>
<text x="745" y="427" fill="#FBBF24" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Must perform JOIN to reconstruct graph</text>
<line x1="690" y1="275" x2="720" y2="275" stroke="#34D399" stroke-width="2" marker-end="url(#arr-g)"/>
<line x1="720" y1="295" x2="690" y2="295" stroke="#34D399" stroke-width="2" marker-end="url(#arr-g)"/>
<rect x="40" y="475" width="1020" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<text x="65" y="498" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Key Takeaways on ORM Impedance Mismatch:</text>
<text x="65" y="518" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• ORM is a Leaky Abstraction: Developers cannot treat entities as simple Java POJOs without understanding generated SQL, proxy hydration, and N+1 queries.</text>
<text x="65" y="535" fill="#F87171" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Transaction Boundary Coupling: Detached entities cause LazyInitializationException when accessed outside an active Hibernate Session.</text>
<text x="65" y="550" fill="#34D399" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Performance Rule: Use JPA entities for rich write-side transactional mutations (Unit of Work); use DTO projections (records) for read-heavy queries.</text>
</svg>