<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1040" height="560" rx="10" fill="url(#bg)"/>
  <text x="520" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Enterprise Database Engine &amp; Persistence Architecture</text>
  <text x="520" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">End-to-end relational data path: Connection pool, query optimizer, shared buffer pool, and Write-Ahead Log (WAL)</text>
<rect x="30" y="85" width="190" height="445" rx="8" fill="#0b1329" stroke="#3b82f6" stroke-width="1.5"/>
<text x="125" y="112" fill="#60A5FA" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">1. Client &amp; Pool</text>
<rect x="55" y="122" width="140" height="18" rx="9" fill="#1d4ed8"/><text x="125" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">HikariCP Fast-Path</text>
<rect x="45" y="155" width="160" height="80" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="55" y="178" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Spring Boot Apps</text>
<text x="55" y="198" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Tomcat worker threads</text>
<text x="55" y="214" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Executing @Transactional</text>
<rect x="45" y="250" width="160" height="110" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="55" y="273" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">HikariCP Pool</text>
<text x="55" y="293" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• ConcurrentBag queue</text>
<text x="55" y="309" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• FastList byte tracking</text>
<text x="55" y="325" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Pre-allocated TCP sockets</text>
<text x="55" y="341" fill="#6EE7B7" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Zero connection churn</text>
<rect x="45" y="375" width="160" height="140" rx="8" fill="#0b2a4a" stroke="#38bdf8" stroke-width="1"/>
<text x="125" y="397" fill="#93C5FD" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Connection Sizing</text>
<text x="125" y="417" fill="#CBD5E1" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Formula: pool_size =</text>
<text x="125" y="433" fill="#FBBF24" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">core_count * 2 + disk_spindle</text>
<text x="125" y="455" fill="#94A3B8" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Prevents thread thrashing</text>
<text x="125" y="471" fill="#94A3B8" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">and DB memory exhaustion</text>
<rect x="240" y="85" width="220" height="445" rx="8" fill="#062e3d" stroke="#06b6d4" stroke-width="1.5"/>
<text x="350" y="112" fill="#22D3EE" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">2. Query Engine</text>
<rect x="270" y="122" width="160" height="18" rx="9" fill="#0891b2"/><text x="350" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">PostgreSQL / MySQL</text>
<rect x="255" y="155" width="190" height="75" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
<text x="265" y="178" fill="#22D3EE" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">SQL Parser &amp; Lexer</text>
<text x="265" y="198" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Generates Abstract Syntax</text>
<text x="265" y="214" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Tree (AST) from raw text</text>
<rect x="255" y="240" width="190" height="75" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
<text x="265" y="263" fill="#22D3EE" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Query Rewriter</text>
<text x="265" y="283" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Expands views &amp; rule system</text>
<text x="265" y="299" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Simplifies constant logic</text>
<rect x="255" y="325" width="190" height="85" rx="8" fill="#0e3a47" stroke="#06b6d4" stroke-width="1.5"/>
<text x="265" y="348" fill="#67E8F9" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Cost-Based Optimizer</text>
<text x="265" y="368" fill="#D1FAE5" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Evaluates Index vs Seq scan</text>
<text x="265" y="382" fill="#D1FAE5" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Evaluates Hash vs Merge join</text>
<text x="265" y="396" fill="#A7F3D0" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Uses table statistics (pg_stats)</text>
<rect x="255" y="420" width="190" height="95" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
<text x="265" y="442" fill="#22D3EE" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Executor (Volcano Model)</text>
<text x="265" y="462" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Pulls tuples on demand via</text>
<text x="265" y="478" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">open(), next(), close() iterators</text>
<rect x="480" y="85" width="200" height="445" rx="8" fill="#1a1c12" stroke="#f59e0b" stroke-width="1.5"/>
<text x="580" y="112" fill="#FDE68A" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">3. Memory Buffers</text>
<rect x="500" y="122" width="160" height="18" rx="9" fill="#b45309"/><text x="580" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">SRAM / DRAM Caches</text>
<rect x="495" y="155" width="170" height="140" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
<text x="505" y="178" fill="#6EE7B7" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Shared Buffer Pool</text>
<text x="505" y="198" fill="#D1FAE5" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Holds 8KB table/index pages</text>
<text x="505" y="214" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Clock sweep / LRU eviction</text>
<text x="505" y="230" fill="#A7F3D0" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Dirty pages modified in RAM</text>
<text x="505" y="246" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Avoids repeated disk I/O</text>
<text x="505" y="266" fill="#34D399" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Hit ratio goal: &gt; 99%</text>
<rect x="495" y="310" width="170" height="120" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
<text x="505" y="333" fill="#FBBF24" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">WAL Buffer (RAM)</text>
<text x="505" y="353" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Holds redo log records</text>
<text x="505" y="369" fill="#FDE68A" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Flushed on COMMIT</text>
<text x="505" y="385" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Sequential write stream</text>
<text x="505" y="401" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• 16MB default in Postgres</text>
<rect x="700" y="85" width="180" height="445" rx="8" fill="#1e1e38" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="790" y="112" fill="#C084FC" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">4. NVMe Disk</text>
<rect x="720" y="122" width="140" height="18" rx="9" fill="#6d28d9"/><text x="790" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">ACID Durability</text>
<rect x="715" y="155" width="150" height="140" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
<text x="725" y="178" fill="#6EE7B7" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">WAL Log Disk</text>
<text x="725" y="198" fill="#D1FAE5" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Write-Ahead Log</text>
<text x="725" y="214" fill="#A7F3D0" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Synchronous fsync()</text>
<text x="725" y="230" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Guarantees Durability</text>
<text x="725" y="246" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Append-only speed</text>
<text x="725" y="266" fill="#34D399" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">ACID Compliant!</text>
<rect x="715" y="310" width="150" height="120" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
<text x="725" y="333" fill="#C084FC" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Table Heap Files</text>
<text x="725" y="353" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• 8KB data blocks</text>
<text x="725" y="369" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• B+Tree index pages</text>
<text x="725" y="385" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Asynchronous check-</text>
<text x="725" y="399" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  point flush to disk</text>
<rect x="900" y="85" width="110" height="445" rx="8" fill="#0b1329" stroke="#38bdf8" stroke-width="1.5"/>
<text x="955" y="112" fill="#38BDF8" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">5. Replicas</text>
<rect x="915" y="122" width="80" height="18" rx="9" fill="#0284c7"/><text x="955" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Streaming</text>
<rect x="910" y="155" width="90" height="140" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="955" y="185" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Replica 1</text>
<text x="955" y="210" fill="#CBD5E1" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Read-Only</text>
<text x="955" y="226" fill="#94A3B8" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Reporting</text>
<rect x="910" y="310" width="90" height="120" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="955" y="340" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Replica 2</text>
<text x="955" y="365" fill="#CBD5E1" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Read-Only</text>
<text x="955" y="381" fill="#94A3B8" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Analytics</text>
<line x1="220" y1="290" x2="240" y2="290" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>
<line x1="460" y1="290" x2="480" y2="290" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arr-c)"/>
<line x1="680" y1="220" x2="715" y2="220" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
<line x1="680" y1="370" x2="715" y2="370" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-p)"/>
<line x1="865" y1="220" x2="910" y2="220" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>
<line x1="865" y1="370" x2="910" y2="370" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>
</svg>