<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1040" height="520" rx="10" fill="url(#bg)"/>
  <text x="520" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Database Normalization Pipeline: 1NF to BCNF Theory</text>
  <text x="520" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Progressive anomaly elimination: Atomic scalars (1NF), partial dependency removal (2NF), transitive dependency removal (3NF), and BCNF</text>
<rect x="30" y="85" width="175" height="410" rx="8" fill="#1a1116" stroke="#ef4444" stroke-width="1.5"/>
<text x="117" y="112" fill="#FCA5A5" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">UNF (Unnormalized)</text>
<rect x="47" y="122" width="140" height="18" rx="9" fill="#991b1b"/><text x="117" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Severe Redundancy</text>
<rect x="45" y="155" width="145" height="110" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
<text x="55" y="178" fill="#F87171" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Flaws &amp; Violations</text>
<text x="55" y="198" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Repeating groups</text>
<text x="55" y="214" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Comma-separated lists</text>
<text x="55" y="230" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  (e.g., tags, items)</text>
<text x="55" y="246" fill="#F87171" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• No primary key defined</text>
<rect x="45" y="275" width="145" height="130" rx="8" fill="#2d1215" stroke="#dc2626" stroke-width="1"/>
<text x="55" y="298" fill="#FCA5A5" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Anomalies:</text>
<text x="55" y="318" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Insert anomaly</text>
<text x="55" y="334" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Update anomaly</text>
<text x="55" y="350" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Delete anomaly</text>
<text x="55" y="370" fill="#F87171" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Data corruption risk</text>
<rect x="225" y="85" width="175" height="410" rx="8" fill="#0b1329" stroke="#3b82f6" stroke-width="1.5"/>
<text x="312" y="112" fill="#60A5FA" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">1st Normal Form (1NF)</text>
<rect x="242" y="122" width="140" height="18" rx="9" fill="#1d4ed8"/><text x="312" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Atomic Scalar Values</text>
<rect x="240" y="155" width="145" height="110" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="250" y="178" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">1NF Requirements</text>
<text x="250" y="198" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Each column is atomic</text>
<text x="250" y="214" fill="#6EE7B7" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Single value per cell</text>
<text x="250" y="230" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Primary key identified</text>
<text x="250" y="246" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Order of rows irrelevant</text>
<rect x="240" y="275" width="145" height="130" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="250" y="298" fill="#FBBF24" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Remaining Flaw:</text>
<text x="250" y="318" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Partial functional</text>
<text x="250" y="334" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">dependencies on</text>
<text x="250" y="350" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">composite primary keys</text>
<text x="250" y="370" fill="#F87171" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Still has redundancy!</text>
<rect x="420" y="85" width="175" height="410" rx="8" fill="#062e3d" stroke="#06b6d4" stroke-width="1.5"/>
<text x="507" y="112" fill="#22D3EE" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">2nd Normal Form (2NF)</text>
<rect x="437" y="122" width="140" height="18" rx="9" fill="#0891b2"/><text x="507" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">No Partial Key Deps</text>
<rect x="435" y="155" width="145" height="125" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
<text x="445" y="178" fill="#22D3EE" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">2NF Requirements</text>
<text x="445" y="198" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Must satisfy 1NF</text>
<text x="445" y="214" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Every non-key column</text>
<text x="445" y="230" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  must depend on the</text>
<text x="445" y="246" fill="#6EE7B7" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  ENTIRE composite PK!</text>
<text x="445" y="262" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Splits partial tables</text>
<rect x="435" y="290" width="145" height="115" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
<text x="445" y="313" fill="#FBBF24" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Remaining Flaw:</text>
<text x="445" y="333" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Transitive dependencies:</text>
<text x="445" y="349" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Non-key column depends</text>
<text x="445" y="365" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">on another non-key column</text>
<rect x="615" y="85" width="175" height="410" rx="8" fill="#0c1d1a" stroke="#10b981" stroke-width="1.5"/>
<text x="702" y="112" fill="#6EE7B7" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">3rd Normal Form (3NF)</text>
<rect x="632" y="122" width="140" height="18" rx="9" fill="#047857"/><text x="702" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">No Transitive Deps</text>
<rect x="630" y="155" width="145" height="130" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
<text x="640" y="178" fill="#6EE7B7" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">3NF Requirements</text>
<text x="640" y="198" fill="#D1FAE5" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Must satisfy 2NF</text>
<text x="640" y="214" fill="#A7F3D0" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• 'The Key, the WHOLE</text>
<text x="640" y="230" fill="#A7F3D0" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  key, and NOTHING BUT</text>
<text x="640" y="246" fill="#A7F3D0" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  the key so help me Codd'</text>
<text x="640" y="266" fill="#CBD5E1" font-size="8" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Zero transitive dependencies</text>
<rect x="630" y="295" width="145" height="110" rx="8" fill="#0f2e28" stroke="#059669" stroke-width="1"/>
<text x="702" y="318" fill="#34D399" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Enterprise Standard</text>
<text x="702" y="338" fill="#CBD5E1" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Satisfies 99% of OLTP</text>
<text x="702" y="354" fill="#CBD5E1" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">production schema designs</text>
<text x="702" y="370" fill="#6EE7B7" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Zero update anomalies!</text>
<rect x="810" y="85" width="200" height="410" rx="8" fill="#16122b" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="910" y="112" fill="#C084FC" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Boyce-Codd (BCNF)</text>
<rect x="830" y="122" width="160" height="18" rx="9" fill="#6d28d9"/><text x="910" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Strict Candidate Keys</text>
<rect x="825" y="155" width="170" height="140" rx="8" fill="#2e1065" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="835" y="178" fill="#DDD6FE" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">BCNF Rule</text>
<text x="835" y="198" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Stricter variant of 3NF</text>
<text x="835" y="214" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• For EVERY functional</text>
<text x="835" y="230" fill="#38BDF8" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  dependency X -&gt; Y,</text>
<text x="835" y="246" fill="#38BDF8" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  X MUST BE A SUPERKEY!</text>
<text x="835" y="268" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Resolves overlapping</text>
<text x="835" y="282" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  candidate keys</text>
<rect x="825" y="305" width="170" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
<text x="910" y="328" fill="#CBD5E1" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Trade-off Consideration</text>
<text x="910" y="348" fill="#94A3B8" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">BCNF may lose functional</text>
<text x="910" y="364" fill="#94A3B8" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">dependencies that span tables,</text>
<text x="910" y="380" fill="#94A3B8" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">requiring joins to enforce.</text>
<line x1="205" y1="290" x2="225" y2="290" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>
<line x1="400" y1="290" x2="420" y2="290" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arr-c)"/>
<line x1="595" y1="290" x2="615" y2="290" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
<line x1="790" y1="290" x2="810" y2="290" stroke="#C084FC" stroke-width="1.5" marker-end="url(#arr-p)"/>
</svg>