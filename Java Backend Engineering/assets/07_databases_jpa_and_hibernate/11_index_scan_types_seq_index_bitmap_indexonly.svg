  <rect width="1100" height="580" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="550" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Database Access Paths: Cost-Based Optimizer Scan Decision Matrix</text>
  <text x="550" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Sequential Scan vs Index Scan vs Bitmap Index Scan vs Index-Only Scan</text>
<rect x="40" y="95" width="240" height="360" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
<rect x="40" y="95" width="240" height="55" rx="8" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
<text x="160" y="118" fill="#F8FAFC" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">1. Sequential Scan</text>
<text x="160" y="138" fill="#CBD5E1" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Selectivity: &gt; 15-20% of rows</text>
<text x="52" y="170" fill="#ef4444" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Execution Pattern:</text>
<text x="56" y="185" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Sequential read of every 8KB hea</text>
<text x="60" y="199" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">p page</text>
<text x="52" y="219" fill="#ef4444" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Disk I/O Type:</text>
<text x="56" y="234" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Sequential I/O (High throughput,</text>
<text x="60" y="248" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start"> kernel readahead)</text>
<text x="52" y="268" fill="#ef4444" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Index Required?:</text>
<text x="56" y="283" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• NO - Index lookup would add rand</text>
<text x="60" y="297" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">om I/O overhead</text>
<text x="52" y="317" fill="#ef4444" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Cost Metric:</text>
<text x="56" y="332" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• pages * seq_page_cost + rows * c</text>
<text x="60" y="346" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">pu_tuple_cost</text>
<text x="52" y="366" fill="#ef4444" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Best For:</text>
<text x="56" y="381" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Small tables OR batch queries to</text>
<text x="60" y="395" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">uching high % of table</text>
<rect x="300" y="95" width="240" height="360" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
<rect x="300" y="95" width="240" height="55" rx="8" fill="#083344" stroke="#06b6d4" stroke-width="1.5"/>
<text x="420" y="118" fill="#F8FAFC" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">2. Index Scan</text>
<text x="420" y="138" fill="#CBD5E1" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Selectivity: &lt; 1-5% of rows</text>
<text x="312" y="170" fill="#06b6d4" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Execution Pattern:</text>
<text x="316" y="185" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Traverse B+Tree to leaf -&gt; get T</text>
<text x="320" y="199" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">ID -&gt; read Heap</text>
<text x="312" y="219" fill="#06b6d4" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Disk I/O Type:</text>
<text x="316" y="234" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Random I/O (random_page_cost: ~4</text>
<text x="320" y="248" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">.0 on HDD, 1.1 on NVMe)</text>
<text x="312" y="268" fill="#06b6d4" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Index Required?:</text>
<text x="316" y="283" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• YES (B+Tree, Hash, GiST, GIN)</text>
<text x="312" y="303" fill="#06b6d4" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Cost Metric:</text>
<text x="316" y="318" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• b-tree depth + matched_keys * ra</text>
<text x="320" y="332" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">ndom_page_cost</text>
<text x="312" y="352" fill="#06b6d4" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Best For:</text>
<text x="316" y="367" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Point lookups (WHERE id = 42) &amp; </text>
<text x="320" y="381" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">small range filters</text>
<rect x="560" y="95" width="240" height="360" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<rect x="560" y="95" width="240" height="55" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
<text x="680" y="118" fill="#F8FAFC" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">3. Bitmap Index Scan</text>
<text x="680" y="138" fill="#FDE68A" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Selectivity: 5-15% of rows</text>
<text x="572" y="170" fill="#f59e0b" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Execution Pattern:</text>
<text x="576" y="185" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Two-phase: Bitmap creation -&gt; Bi</text>
<text x="580" y="199" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">tmap Heap Scan</text>
<text x="572" y="219" fill="#f59e0b" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Disk I/O Type:</text>
<text x="576" y="234" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• RAM Bitmap sorts physical page o</text>
<text x="580" y="248" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">ffsets -&gt; Seq disk read!</text>
<text x="572" y="268" fill="#f59e0b" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Index Required?:</text>
<text x="576" y="283" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• YES (Supports BitmapOr / BitmapA</text>
<text x="580" y="297" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">nd across multiple indexes)</text>
<text x="572" y="317" fill="#f59e0b" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Cost Metric:</text>
<text x="576" y="332" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• index_scan_cost + sorted_heap_pa</text>
<text x="580" y="346" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">ge_cost + recheck</text>
<text x="572" y="366" fill="#f59e0b" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Best For:</text>
<text x="576" y="381" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Multiple WHERE conditions on dif</text>
<text x="580" y="395" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">ferent indexes</text>
<rect x="820" y="95" width="240" height="360" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
<rect x="820" y="95" width="240" height="55" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
<text x="940" y="118" fill="#F8FAFC" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">4. Index-Only Scan</text>
<text x="940" y="138" fill="#CBD5E1" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Selectivity: Any (Covering Index)</text>
<text x="832" y="170" fill="#10b981" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Execution Pattern:</text>
<text x="836" y="185" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Reads ONLY index pages; ZERO hea</text>
<text x="840" y="199" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">p access!</text>
<text x="832" y="219" fill="#10b981" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Disk I/O Type:</text>
<text x="836" y="234" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Minimal sequential/random index </text>
<text x="840" y="248" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">page reads</text>
<text x="832" y="268" fill="#10b981" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Index Required?:</text>
<text x="836" y="283" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• YES (Index must contain ALL quer</text>
<text x="840" y="297" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">ied columns)</text>
<text x="832" y="317" fill="#10b981" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Cost Metric:</text>
<text x="836" y="332" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• index_pages * random_page_cost (</text>
<text x="840" y="346" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Zero heap I/O!)</text>
<text x="832" y="366" fill="#10b981" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Best For:</text>
<text x="836" y="381" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Analytical aggregations &amp; high-Q</text>
<text x="840" y="395" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">PS read hotpaths</text>
<rect x="40" y="470" width="1020" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<text x="65" y="495" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">How PostgreSQL CBO Decides Scan Paths:</text>
<text x="65" y="515" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">1. Visibility Map Check: If all queried columns are in the index AND page is marked All-Visible in Visibility Map -&gt; Index-Only Scan.</text>
<text x="65" y="532" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">2. Random vs Seq I/O Cost: If estimated rows &gt; 15-20%, random seek overhead exceeds sequential disk stream throughput -&gt; CBO chooses Seq Scan.</text>
<text x="65" y="548" fill="#34D399" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">3. Tip: Setting random_page_cost = 1.1 (instead of default 4.0) on NVMe SSDs prevents optimizer from unfairly abandoning indexes.</text>
</svg>