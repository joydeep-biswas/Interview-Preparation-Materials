<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" width="1080" height="580">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1080" height="580" rx="10" fill="url(#bg)"/>
  <text x="540" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Spring Transaction Propagation: REQUIRED vs NESTED (Savepoints)</text>
  <text x="540" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Fine-Grained Partial Rollback Isolation within a Single Physical JDBC Connection</text>
<rect x="50" y="95" width="200" height="50" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
<text x="150" y="116" fill="#3b82f6" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Batch Job Runner</text>
<text x="150" y="134" fill="#94A3B8" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Client Invoker</text>
<line x1="150" y1="145" x2="150" y2="480" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="320" y="95" width="200" height="50" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
<text x="420" y="116" fill="#10b981" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">BatchOrderService</text>
<text x="420" y="134" fill="#94A3B8" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Single Tx 1 Scope</text>
<line x1="420" y1="145" x2="420" y2="480" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="600" y="95" width="200" height="50" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
<text x="700" y="116" fill="#06b6d4" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">HikariCP Pool</text>
<text x="700" y="134" fill="#94A3B8" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Single Connection</text>
<line x1="700" y1="145" x2="700" y2="480" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="840" y="95" width="200" height="50" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
<text x="940" y="116" fill="#f59e0b" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Database Engine</text>
<text x="940" y="134" fill="#94A3B8" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">JDBC Savepoints</text>
<line x1="940" y1="145" x2="940" y2="480" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="150" y1="165" x2="420" y2="165" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>
<text x="285" y="157" fill="#93C5FD" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">1. processBatch(100 items)</text>
<line x1="420" y1="195" x2="700" y2="195" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
<text x="560" y="187" fill="#6EE7B7" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">2. Borrows Connection #1 (Tx 1 Started)</text>
<rect x="340" y="225" width="760" height="190" rx="8" fill="#0b1727" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="355" y="235" width="200" height="20" rx="10" fill="#78350f"/><text x="455" y="248" fill="#FDE68A" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">LOOP: For each Order in Batch</text>
<line x1="420" y1="270" x2="940" y2="270" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#arr-a)"/>
<text x="680" y="262" fill="#FDE68A" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">3. connection.setSavepoint('item_savepoint_N')</text>
<line x1="420" y1="305" x2="940" y2="305" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
<text x="680" y="297" fill="#A7F3D0" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">4. Item 1 Valid: INSERT INTO order_items ... (Succeeds)</text>
<rect x="370" y="337" width="240" height="28" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1"/>
<text x="490" y="353" fill="#FECACA" font-size="8.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Item 2 Invalid: Validation Exception!</text>
<line x1="420" y1="380" x2="940" y2="380" stroke="#F87171" stroke-width="1.5" marker-end="url(#arr-r)"/>
<text x="680" y="372" fill="#F87171" font-size="8.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">5. connection.rollback(item_savepoint_2) [ONLY Item 2 erased!]</text>
<line x1="420" y1="435" x2="940" y2="435" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
<text x="680" y="427" fill="#34D399" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">6. COMMIT Tx 1 (Persists Items 1, 3..100 atomically)</text>
<line x1="420" y1="465" x2="700" y2="465" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>
<text x="560" y="457" fill="#94A3B8" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">7. Returns Connection #1 to HikariCP pool</text>
<rect x="40" y="495" width="1000" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<text x="65" y="517" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Architectural Comparison: REQUIRES_NEW vs NESTED</text>
<text x="65" y="537" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• REQUIRES_NEW: Suspends Tx 1, borrows a 2nd physical JDBC connection. Independent commits. Carries severe pool-starvation deadlock risks.</text>
<text x="65" y="555" fill="#34D399" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• NESTED: Reuses the SAME physical connection via JDBC Savepoints. Outer failure rolls back inner savepoints; inner failure rolls back to savepoint without aborting outer Tx!</text>
</svg>