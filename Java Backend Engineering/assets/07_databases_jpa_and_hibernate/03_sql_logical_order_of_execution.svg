<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1040" height="540" rx="10" fill="url(#bg)"/>
  <text x="520" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">The Exact Logical SQL Order of Execution with Clause Dependencies</text>
  <text x="520" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">How relational engines process queries: Table resolution (FROM/WHERE), grouping (GROUP BY/HAVING), and projection (SELECT/ORDER BY)</text>
<rect x="30" y="85" width="300" height="440" rx="8" fill="#0b1329" stroke="#3b82f6" stroke-width="1.5"/>
<text x="180" y="112" fill="#60A5FA" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Stage 1: Tables &amp; Base Filter</text>
<rect x="100" y="122" width="160" height="18" rx="9" fill="#1d4ed8"/><text x="180" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Tuple Set Assembly</text>
<rect x="45" y="155" width="270" height="120" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
<text x="55" y="178" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">1. FROM &amp; JOIN Clauses</text>
<text x="55" y="198" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Identifies target tables</text>
<text x="55" y="214" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Computes Cartesian product (CROSS JOIN)</text>
<text x="55" y="230" fill="#6EE7B7" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Applies ON join condition filter</text>
<text x="55" y="246" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Adds outer row NULLs for LEFT/FULL JOIN</text>
<rect x="45" y="290" width="270" height="120" rx="8" fill="#0b2a4a" stroke="#38bdf8" stroke-width="1.5"/>
<text x="55" y="313" fill="#93C5FD" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">2. WHERE Clause</text>
<text x="55" y="333" fill="#D1FAE5" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Filters individual base tuples</text>
<text x="55" y="349" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Eliminates rows failing boolean predicate</text>
<text x="55" y="365" fill="#F87171" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Cannot use aggregate functions (e.g. SUM)!</text>
<text x="55" y="381" fill="#F87171" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Cannot use SELECT column aliases!</text>
<rect x="360" y="85" width="320" height="440" rx="8" fill="#0c1d1a" stroke="#10b981" stroke-width="1.5"/>
<text x="520" y="112" fill="#6EE7B7" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Stage 2: Bucketing &amp; Group Filter</text>
<rect x="440" y="122" width="160" height="18" rx="9" fill="#047857"/><text x="520" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Aggregation Pipeline</text>
<rect x="375" y="155" width="290" height="120" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
<text x="385" y="178" fill="#34D399" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">3. GROUP BY Clause</text>
<text x="385" y="198" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Collapses rows sharing same group keys</text>
<text x="385" y="214" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Every column in future SELECT must either</text>
<text x="385" y="228" fill="#FBBF24" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  be in GROUP BY or inside an aggregate</text>
<text x="385" y="244" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Generates 1 output tuple per distinct bucket</text>
<rect x="375" y="290" width="290" height="120" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
<text x="385" y="313" fill="#6EE7B7" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">4. HAVING Clause</text>
<text x="385" y="333" fill="#D1FAE5" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Filters aggregate group buckets</text>
<text x="385" y="349" fill="#A7F3D0" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Evaluates aggregate filters: HAVING COUNT(*) &gt; 5</text>
<text x="385" y="365" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Discards entire aggregated group buckets</text>
<text x="385" y="381" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Operates AFTER grouping is finalized</text>
<rect x="710" y="85" width="300" height="440" rx="8" fill="#16122b" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="860" y="112" fill="#C084FC" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Stage 3: Projection &amp; Egress</text>
<rect x="780" y="122" width="160" height="18" rx="9" fill="#6d28d9"/><text x="860" y="134" fill="#ffffff" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Output Formatting</text>
<rect x="725" y="155" width="270" height="75" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
<text x="735" y="175" fill="#C084FC" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">5. SELECT &amp; OVER() Windowing</text>
<text x="735" y="193" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Computes projection column expressions</text>
<text x="735" y="207" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Creates column aliases (e.g. as total_val)</text>
<text x="735" y="221" fill="#38BDF8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Computes window functions (RANK(), LAG())</text>
<rect x="725" y="240" width="270" height="65" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
<text x="735" y="260" fill="#C084FC" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">6. DISTINCT Clause</text>
<text x="735" y="278" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Deduplicates projected tuple rows</text>
<text x="735" y="292" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Hash / Sort deduplication pass</text>
<rect x="725" y="315" width="270" height="65" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
<text x="735" y="335" fill="#C084FC" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">7. ORDER BY Clause</text>
<text x="735" y="353" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Sorts final output tuples (ASC / DESC)</text>
<text x="735" y="367" fill="#6EE7B7" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• CAN use SELECT aliases (runs after SELECT!)</text>
<rect x="725" y="390" width="270" height="65" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
<text x="735" y="410" fill="#6EE7B7" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">8. LIMIT / OFFSET Clause</text>
<text x="735" y="428" fill="#D1FAE5" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Truncates output stream to N rows</text>
<text x="735" y="442" fill="#A7F3D0" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Paginates result stream to caller</text>
<line x1="300" y1="310" x2="360" y2="310" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>
<line x1="665" y1="310" x2="710" y2="310" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
</svg>