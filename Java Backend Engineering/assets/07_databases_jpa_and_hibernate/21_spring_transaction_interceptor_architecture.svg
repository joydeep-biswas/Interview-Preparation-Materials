<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="1100" height="580">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1100" height="580" rx="10" fill="url(#bg)"/>
  <text x="550" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Spring AOP Transaction Interceptor Architecture</text>
  <text x="550" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Caller -&gt; CGLIB Proxy -&gt; TransactionInterceptor -&gt; PlatformTransactionManager -&gt; Target Method</text>
<rect x="40" y="110" width="170" height="320" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="50" y="125" width="150" height="22" rx="11" fill="#1e3a8a"/><text x="125" y="139" fill="#93C5FD" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">1. External Caller</text>
<text x="125" y="180" fill="#F8FAFC" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">HTTP Controller</text>
<text x="125" y="200" fill="#CBD5E1" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">or Kafka Listener</text>
<rect x="50" y="230" width="150" height="80" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<text x="55" y="250" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">@Autowired</text>
<text x="55" y="268" fill="#CBD5E1" font-size="9.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">OrderService service;</text>
<text x="55" y="290" fill="#38BDF8" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">service.placeOrder(cmd);</text>
<text x="125" y="350" fill="#94A3B8" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Injected bean is</text>
<text x="125" y="368" fill="#FDE68A" font-size="9.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">actually a PROXY!</text>
<rect x="240" y="110" width="190" height="320" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
<rect x="250" y="125" width="170" height="22" rx="11" fill="#064e3b"/><text x="335" y="139" fill="#6EE7B7" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">2. CGLIB Proxy</text>
<text x="335" y="175" fill="#34D399" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">OrderService$$SpringCGLIB</text>
<text x="255" y="205" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Intercepts method call</text>
<text x="255" y="223" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Checks method metadata for</text>
<text x="265" y="239" fill="#FDE68A" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">@Transactional annotation</text>
<text x="255" y="260" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Evaluates propagation:</text>
<text x="265" y="276" fill="#38BDF8" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">REQUIRED (default)</text>
<text x="255" y="300" fill="#F87171" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Self-Invocation Trap:</text>
<text x="265" y="318" fill="#FCA5A5" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">this.methodB() bypasses</text>
<text x="265" y="334" fill="#EF4444" font-size="8.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">proxy entirely -&gt; NO TX!</text>
<text x="255" y="365" fill="#94A3B8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Delegates to Advice Chain</text>
<rect x="460" y="110" width="200" height="320" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="1.5"/>
<rect x="470" y="125" width="180" height="22" rx="11" fill="#78350f"/><text x="560" y="139" fill="#FDE68A" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">3. TransactionInterceptor</text>
<text x="560" y="175" fill="#FBBF24" font-size="10.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">MethodInterceptor (AOP)</text>
<text x="475" y="205" fill="#FDE68A" font-size="9.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">invokeWithinTransaction():</text>
<text x="475" y="225" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">1. Determine Tx Attribute</text>
<text x="475" y="243" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">2. Request Tx from Manager</text>
<text x="475" y="261" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">3. InvocationCallback: run</text>
<text x="485" y="277" fill="#38BDF8" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">targetMethod.invoke()</text>
<text x="475" y="299" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">4. Catch Exception:</text>
<text x="485" y="317" fill="#F87171" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">if (rollbackOn(ex))</text>
<text x="495" y="333" fill="#F87171" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">txManager.rollback()</text>
<text x="475" y="355" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">5. Otherwise:</text>
<text x="485" y="371" fill="#34D399" font-size="8.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">txManager.commit()</text>
<rect x="690" y="110" width="200" height="320" rx="8" fill="#083344" stroke="#06b6d4" stroke-width="1.5"/>
<rect x="700" y="125" width="180" height="22" rx="11" fill="#0e7490"/><text x="790" y="139" fill="#ECFEFF" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">4. PlatformTxManager</text>
<text x="790" y="175" fill="#22D3EE" font-size="10.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">JpaTransactionManager</text>
<text x="705" y="205" fill="#67E8F9" font-size="9.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Physical Resource Handling:</text>
<text x="705" y="225" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Borrows Connection from</text>
<text x="715" y="241" fill="#FDE68A" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">HikariCP pool</text>
<text x="705" y="261" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Sets autoCommit(false)</text>
<text x="705" y="281" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Binds to ThreadLocal:</text>
<text x="715" y="297" fill="#38BDF8" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">TxSynchronizationManager</text>
<text x="705" y="319" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Flushes L1 cache on commit</text>
<text x="705" y="339" fill="#34D399" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Executes COMMIT or ROLLBACK</text>
<text x="705" y="361" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Recycles connection to pool</text>
<rect x="920" y="110" width="140" height="320" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
<rect x="925" y="125" width="130" height="22" rx="11" fill="#6d28d9"/><text x="990" y="139" fill="#EDE9FE" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">5. Target Method</text>
<text x="990" y="175" fill="#C084FC" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">OrderService.java</text>
<text x="930" y="205" fill="#E2E8F0" font-size="9.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Business Logic:</text>
<text x="930" y="225" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">orderRepo.save(o);</text>
<text x="930" y="243" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">inventory.deduct();</text>
<text x="930" y="261" fill="#CBD5E1" font-size="8.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">payment.charge();</text>
<rect x="928" y="290" width="124" height="50" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
<text x="990" y="310" fill="#6EE7B7" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Success -&gt; Return</text>
<rect x="928" y="355" width="124" height="50" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1"/>
<text x="990" y="375" fill="#FECACA" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Throws Exception</text>
<line x1="210" y1="270" x2="240" y2="270" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>
<line x1="430" y1="270" x2="460" y2="270" stroke="#34D399" stroke-width="2" marker-end="url(#arr-g)"/>
<line x1="660" y1="270" x2="690" y2="270" stroke="#FBBF24" stroke-width="2" marker-end="url(#arr-a)"/>
<line x1="890" y1="270" x2="920" y2="270" stroke="#C084FC" stroke-width="2" marker-end="url(#arr-p)"/>
<rect x="40" y="455" width="1020" height="105" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<text x="65" y="480" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Critical Rollback Rules in Spring AOP Transactions:</text>
<text x="65" y="500" fill="#FDE68A" font-size="9.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Default Rollback Criteria: Spring ONLY rolls back on unchecked exceptions (RuntimeException and Error).</text>
<text x="65" y="518" fill="#F87171" font-size="9.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Checked Exception Trap: If your method throws a checked Exception (e.g. IOException, SQLException), Spring COMMITS the transaction!</text>
<text x="65" y="536" fill="#34D399" font-size="9.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Always configure: @Transactional(rollbackFor = Exception.class) to ensure all exceptions trigger a rollback.</text>
</svg>