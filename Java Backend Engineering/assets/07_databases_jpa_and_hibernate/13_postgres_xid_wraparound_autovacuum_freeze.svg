<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" width="1080" height="580">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="1080" height="580" rx="10" fill="url(#bg)"/>
  <text x="540" y="36" fill="#F8FAFC" font-size="18" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">PostgreSQL Transaction ID (XID) Wraparound &amp; VACUUM FREEZE</text>
  <text x="540" y="58" fill="#94A3B8" font-size="12" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Circular 32-bit Modulo 2^31 Transaction Horizon, Slotted Horizon Catastrophe, and Autovacuum Defense</text>
<rect x="40" y="95" width="1000" height="340" rx="10" fill="#0b101d" stroke="#3b82f6" stroke-width="1.5"/>
<text x="540" y="125" fill="#93C5FD" font-size="13" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Circular 32-Bit Transaction ID Space (Total: 4,294,967,296 XIDs)</text>
<text x="540" y="142" fill="#94A3B8" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Any given Active XID divides the circular universe into 2.14B Past (visible) and 2.14B Future (invisible)</text>
<rect x="65" y="160" width="340" height="170" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
<rect x="80" y="175" width="180" height="22" rx="11" fill="#047857"/><text x="170" y="189" fill="#D1FAE5" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">PAST HORIZON (Visible)</text>
<text x="80" y="215" fill="#A7F3D0" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Exactly 2.14 Billion (2^31 - 1) transactions</text>
<text x="80" y="235" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Tuples with xmin &lt; Current XID are visible</text>
<text x="80" y="255" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Checked via (Current_XID - tuple_xmin) &lt; 2^31</text>
<text x="80" y="275" fill="#34D399" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Safe committed state read by snapshots</text>
<text x="80" y="305" fill="#6EE7B7" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Capacity: 2^31 Past Transactions</text>
<rect x="440" y="160" width="200" height="170" rx="8" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
<text x="540" y="190" fill="#FECACA" font-size="13" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">CURRENT XID</text>
<text x="540" y="210" fill="#FCA5A5" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Active Transaction Epoch</text>
<text x="540" y="240" fill="#F8FAFC" font-size="14" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Epoch Pivot: 0</text>
<text x="540" y="265" fill="#CBD5E1" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Advances by +1 for</text>
<text x="540" y="282" fill="#CBD5E1" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">every writing transaction</text>
<text x="540" y="310" fill="#F87171" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Modulo 2^32 Cyclic Space</text>
<rect x="675" y="160" width="340" height="170" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
<rect x="690" y="175" width="190" height="22" rx="11" fill="#334155"/><text x="785" y="189" fill="#E2E8F0" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">FUTURE HORIZON (Invisible)</text>
<text x="690" y="215" fill="#E2E8F0" font-size="10" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Exactly 2.14 Billion transactions ahead</text>
<text x="690" y="235" fill="#CBD5E1" font-size="10" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Tuples with xmin in this range are FUTURE</text>
<text x="690" y="255" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Invisible to current snapshot (uncommitted)</text>
<text x="690" y="275" fill="#FCA5A5" font-size="9" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• The Danger: If XID wraps past 2^31 without freeze,</text>
<text x="690" y="295" fill="#F87171" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  ancient past data suddenly looks like FUTURE!</text>
<text x="690" y="315" fill="#EF4444" font-size="8.5" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">  Result: DATA BECOMES INVISIBLE (CATASTROPHE)</text>
<rect x="65" y="345" width="950" height="75" rx="8" fill="#18181b" stroke="#f59e0b" stroke-width="1.5"/>
<rect x="80" y="355" width="160" height="20" rx="10" fill="#78350f"/><text x="160" y="368" fill="#FDE68A" font-size="10" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">VACUUM FREEZE Solution</text>
<text x="255" y="368" fill="#FBBF24" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">How VACUUM FREEZE Prevents Wraparound Loss:</text>
<text x="80" y="395" fill="#CBD5E1" font-size="9.5" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Replaces ancient tuple xmin with FrozenTransactionId (Value = 2) or sets HEAP_XMIN_FROZEN bit in infomask.</text>
<text x="80" y="410" fill="#34D399" font-size="9.5" font-weight="600" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">• Frozen tuples are treated as permanently committed in the past by ALL snapshots across all time, regardless of XID cycle!</text>
<rect x="40" y="450" width="1000" height="105" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
<text x="65" y="473" fill="#38BDF8" font-size="11" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">PostgreSQL Autovacuum Freeze Emergency Safeguards:</text>
<text x="65" y="493" fill="#CBD5E1" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">1. autovacuum_freeze_max_age (Default: 200 Million): When age(datfrozenxid) hits 200M, PostgreSQL launches aggressive autovacuum even if disabled.</text>
<text x="65" y="510" fill="#FDE68A" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">2. 10 Million to Wraparound: PostgreSQL logs urgent warning alerts to system logs: 'WARNING: database must be vacuumed within 10000000 transactions'.</text>
<text x="65" y="527" fill="#F87171" font-size="9" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">3. 1 Million to Wraparound: PostgreSQL SHUTS DOWN and refuses all write transactions (goes into read-only recovery) to prevent catastrophic silent data loss!</text>
<text x="65" y="544" fill="#A7F3D0" font-size="9" font-weight="400" font-family="system-ui, -apple-system, sans-serif" text-anchor="start">Recovery command: Single-user mode: postgres --single -D /var/lib/postgresql/data dbname -&gt; VACUUM FREEZE;</text>
</svg>