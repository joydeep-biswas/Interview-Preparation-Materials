<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="500" viewBox="0 0 1140 500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1140" height="500" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Constructor Overloading &amp; Delegation Chaining (this())</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Centralizing Invariant Validation &amp; Final Field Assignment in Canonical Master Constructor</text>

  <!-- Top Left: 1-Arg Constructor -->
  <rect x="70" y="95" width="440" height="120" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="290" y="122" font-size="12" font-weight="700" fill="#60A5FA" text-anchor="middle">UserProfile(String username)</text>
  <text x="90" y="150" font-size="11" fill="#94A3B8">Single-argument convenience constructor</text>
  <text x="90" y="170" font-size="11" fill="#CBD5E1">Supplies defaults: <tspan fill="#F59E0B">tier = "STANDARD"</tspan>, <tspan fill="#F59E0B">zone = UTC</tspan></text>
  <text x="90" y="195" font-size="10" font-family="'JetBrains Mono', monospace" fill="#38BDF8">this(username, "STANDARD", ZoneOffset.UTC);</text>

  <!-- Top Right: 2-Arg Constructor -->
  <rect x="630" y="95" width="440" height="120" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="850" y="122" font-size="12" font-weight="700" fill="#60A5FA" text-anchor="middle">UserProfile(String username, String tier)</text>
  <text x="650" y="150" font-size="11" fill="#94A3B8">Two-argument convenience constructor</text>
  <text x="650" y="170" font-size="11" fill="#CBD5E1">Supplies default: <tspan fill="#F59E0B">zone = UTC</tspan></text>
  <text x="650" y="195" font-size="10" font-family="'JetBrains Mono', monospace" fill="#38BDF8">this(username, tier, ZoneOffset.UTC);</text>

  <!-- Center: Canonical Master Constructor -->
  <rect x="250" y="260" width="640" height="135" rx="8" fill="#0B132B" stroke="#10B981" stroke-width="2"/>
  <rect x="250" y="260" width="640" height="32" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="570" y="282" font-size="13" font-weight="700" fill="#6EE7B7" text-anchor="middle">Master Canonical Constructor: UserProfile(username, tier, timezone)</text>
  
  <text x="270" y="315" font-size="11" font-weight="600" fill="#F8FAFC">1. Fail-Fast Validation:</text>
  <text x="290" y="333" font-size="10" font-family="'JetBrains Mono', monospace" fill="#FCA5A5">Objects.requireNonNull(username); validateTier(tier);</text>
  
  <text x="270" y="358" font-size="11" font-weight="600" fill="#F8FAFC">2. Final Field Assignment:</text>
  <text x="290" y="376" font-size="10" font-family="'JetBrains Mono', monospace" fill="#A7F3D0">this.username = username; this.tier = tier; this.timezone = timezone;</text>

  <!-- Bottom: Guaranteed Initialized Object -->
  <rect x="330" y="435" width="480" height="45" rx="6" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="570" y="462" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle">Guaranteed Consistent Immutable Object in JVM Heap</text>

  <!-- Connector Left to Center -->
  <path d="M 290 215 L 290 235 L 430 235 L 430 260" stroke="#06B6D4" stroke-width="2" fill="none" marker-end="url(#arr-c)"/>
  <rect x="300" y="224" width="120" height="20" rx="4" fill="#0B132B" stroke="#06B6D4" stroke-width="1"/>
  <text x="360" y="238" font-size="9" font-weight="700" fill="#A5F3FC" text-anchor="middle">this(u, "STD", UTC)</text>

  <!-- Connector Right to Center -->
  <path d="M 850 215 L 850 235 L 710 235 L 710 260" stroke="#06B6D4" stroke-width="2" fill="none" marker-end="url(#arr-c)"/>
  <rect x="720" y="224" width="120" height="20" rx="4" fill="#0B132B" stroke="#06B6D4" stroke-width="1"/>
  <text x="780" y="238" font-size="9" font-weight="700" fill="#A5F3FC" text-anchor="middle">this(u, tier, UTC)</text>

  <!-- Connector Master to Initialized -->
  <path fill="none" d="M 570 395 L 570 435" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>
  <rect x="520" y="405" width="100" height="18" rx="4" fill="#0B132B" stroke="#10B981" stroke-width="1"/>
  <text x="570" y="418" font-size="8" font-weight="700" fill="#6EE7B7" text-anchor="middle">Completes &lt;init&gt;</text>
</svg>