<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="580" viewBox="0 0 1220 580">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1220" height="580" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Strictly Pass-by-Value Memory Mechanics in Java</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Caller Stack Frame vs. Callee Stack Frame: Object Pointer Copying vs. Primitive Copying</text>

  <!-- Column 1: Caller Stack Frame -->
  <rect x="40" y="95" width="340" height="380" rx="8" fill="#0B132B" stroke="#1D4ED8" stroke-width="1.5"/>
  <rect x="40" y="95" width="340" height="35" rx="8" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
  <text x="210" y="118" font-size="12" font-weight="700" fill="#93C5FD" text-anchor="middle">Caller Stack Frame: main()</text>

  <!-- Variable 1 -->
  <rect x="55" y="145" width="310" height="75" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="210" y="168" font-size="12" font-weight="700" fill="#60A5FA" text-anchor="middle">customerRef (Object Reference)</text>
  <text x="70" y="190" font-size="11" fill="#94A3B8">Holds pointer: <tspan fill="#34D399" font-family="'JetBrains Mono', monospace">0x9a4f</tspan></text>
  <text x="70" y="208" font-size="10" fill="#64748B">Points to Customer("Alice") on Heap</text>

  <!-- Variable 2 -->
  <rect x="55" y="235" width="310" height="65" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="210" y="258" font-size="12" font-weight="700" fill="#CBD5E1" text-anchor="middle">primitiveVal (Primitive int)</text>
  <text x="70" y="280" font-size="11" fill="#94A3B8">Holds direct value: <tspan fill="#F8FAFC" font-weight="600">42</tspan></text>

  <!-- Call &amp; Return Observations -->
  <rect x="55" y="315" width="310" height="145" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
  <text x="210" y="338" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">Call: modify(customerRef, primitiveVal)</text>
  <text x="70" y="362" font-size="10" fill="#94A3B8">&amp;#x2022; customerRef passed as a COPY of pointer</text>
  <text x="70" y="380" font-size="10" fill="#94A3B8">&amp;#x2022; primitiveVal passed as a COPY of 42</text>
  <text x="70" y="405" font-size="10" font-weight="700" fill="#34D399">Upon Return from modify():</text>
  <text x="70" y="425" font-size="10" fill="#CBD5E1">&amp;#x2714; customerRef STILL points to 0x9a4f!</text>
  <text x="70" y="443" font-size="10" fill="#CBD5E1">&amp;#x2714; Object name is mutated to "Bob"</text>

  <!-- Column 2: Callee Stack Frame -->
  <rect x="420" y="95" width="360" height="380" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="420" y="95" width="360" height="35" rx="8" fill="#0C4A6E" stroke="#0284C7" stroke-width="1"/>
  <text x="600" y="118" font-size="12" font-weight="700" fill="#7DD3FC" text-anchor="middle">Callee Stack Frame: modify(Customer c, int val)</text>

  <!-- Copied Params -->
  <rect x="435" y="145" width="330" height="75" rx="6" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="600" y="168" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle">c (COPIED Reference Variable)</text>
  <text x="450" y="190" font-size="11" fill="#94A3B8">Initial Value: <tspan fill="#34D399" font-family="'JetBrains Mono', monospace">0x9a4f</tspan> (Bitwise copy)</text>
  <text x="450" y="208" font-size="10" fill="#64748B">Distinct local stack slot; independent of caller</text>

  <!-- Step 1 Mutation -->
  <rect x="435" y="230" width="330" height="65" rx="6" fill="#06201B" stroke="#10B981" stroke-width="1.2"/>
  <text x="600" y="252" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">Step 1: c.setName("Bob")</text>
  <text x="450" y="272" font-size="10" fill="#A7F3D0">Dereferences 0x9a4f -&gt; Mutates Heap state!</text>
  <text x="450" y="286" font-size="9" fill="#94A3B8">(Both caller &amp; callee see mutated object)</text>

  <!-- Step 2 Reassignment -->
  <rect x="435" y="305" width="330" height="85" rx="6" fill="#1C1917" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="600" y="328" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="middle">Step 2: c = new Customer("Charlie")</text>
  <text x="450" y="348" font-size="10" fill="#FDE68A">Reassigns local variable 'c' to NEW pointer: <tspan font-family="'JetBrains Mono', monospace">0xbb12</tspan></text>
  <text x="450" y="366" font-size="10" fill="#F87171">ZERO effect on caller's customerRef!</text>
  <text x="450" y="380" font-size="9" fill="#94A3B8">Local pointer reassignment is isolated to this frame</text>

  <!-- Frame Exit -->
  <rect x="435" y="400" width="330" height="60" rx="6" fill="#0F172A" stroke="#475569" stroke-dasharray="3 3"/>
  <text x="600" y="425" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="middle">Frame Popped on Method Return</text>
  <text x="600" y="445" font-size="10" fill="#64748B" text-anchor="middle">Local variable 'c' (0xbb12) discarded</text>

  <!-- Column 3: JVM Heap Space -->
  <rect x="820" y="95" width="360" height="380" rx="8" fill="#06201B" stroke="#047857" stroke-width="1.5"/>
  <rect x="820" y="95" width="360" height="35" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="1000" y="118" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">JVM Heap Space</text>

  <!-- Heap Object 1 -->
  <rect x="840" y="145" width="320" height="120" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="1000" y="170" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle">Customer Object at 0x9a4f</text>
  <rect x="855" y="185" width="290" height="30" rx="4" fill="#1E293B" stroke="#047857" stroke-width="1"/>
  <text x="865" y="205" font-size="10" fill="#A7F3D0">Header: Mark Word + Klass Word</text>
  <rect x="855" y="222" width="290" height="32" rx="4" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
  <text x="865" y="242" font-size="11" fill="#F8FAFC">Field name: <tspan fill="#F87171" text-decoration="line-through">"Alice"</tspan> -&gt; <tspan fill="#34D399" font-weight="700">"Bob"</tspan></text>

  <!-- Heap Object 2 -->
  <rect x="840" y="295" width="320" height="120" rx="6" fill="#1C1917" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="1000" y="320" font-size="12" font-weight="700" fill="#FBBF24" text-anchor="middle">Customer Object at 0xbb12</text>
  <rect x="855" y="335" width="290" height="30" rx="4" fill="#1E293B" stroke="#78350F" stroke-width="1"/>
  <text x="865" y="355" font-size="10" fill="#FDE68A">Header: Mark Word + Klass Word</text>
  <rect x="855" y="372" width="290" height="32" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
  <text x="865" y="392" font-size="11" fill="#F8FAFC">Field name: <tspan fill="#FBBF24" font-weight="700">"Charlie"</tspan> <tspan fill="#F87171" font-size="9">(Orphaned!)</tspan></text>
  
  <text x="1000" y="445" font-size="10" fill="#EF4444" text-anchor="middle">0xbb12 unreferenced -&gt; eligible for GC</text>

  <!-- Bottom Invariant Card -->
  <rect x="40" y="495" width="1140" height="55" rx="6" fill="#0B132B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="610" y="520" font-size="12" font-weight="700" fill="#60A5FA" text-anchor="middle">Architectural Principle: Java is Strictly 100% Pass-By-Value</text>
  <text x="610" y="538" font-size="11" fill="#CBD5E1" text-anchor="middle">Object variables store references (memory addresses). Passing an object copies the reference address, NOT the underlying object.</text>

  <!-- Param Passing from Caller to Callee -->
  <path fill="none" d="M 380 182 L 435 182" stroke="#06B6D4" stroke-width="2" marker-end="url(#arr-c)"/>
  <rect x="388" y="171" width="40" height="20" rx="4" fill="#0B132B" stroke="#06B6D4" stroke-width="1"/>
  <text x="408" y="185" font-size="8" font-weight="700" fill="#38BDF8" text-anchor="middle">Copy</text>

  <!-- Callee Dereference to Heap 0x9a4f -->
  <path fill="none" d="M 765.0 260.0 L 775.0 260.0 C 800.5 260.0, 800.5 205.0, 826.0 205.0 L 840.0 205.0" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- Callee Reassignment to Heap 0xbb12 -->
  <path fill="none" d="M 765 350 L 840 350" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr-a)"/>
</svg>