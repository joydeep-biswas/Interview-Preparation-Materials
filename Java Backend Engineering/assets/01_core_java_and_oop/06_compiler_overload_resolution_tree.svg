<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="580" viewBox="0 0 1240 580">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1240" height="580" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Java Compiler Overload Resolution Precedence Decision Tree</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Phase 1: Primitive Exact/Widening -&gt; Phase 2: Autoboxing -&gt; Phase 3: Varargs Fallback -&gt; Error</text>

  <!-- Root Call Site Card -->
  <rect x="440" y="90" width="360" height="55" rx="6" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
  <text x="620" y="112" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle">Method Invocation Call Site: process(42)</text>
  <text x="620" y="132" font-size="11" fill="#94A3B8" text-anchor="middle">Literal argument static type: <tspan fill="#38BDF8" font-family="'JetBrains Mono', monospace">int</tspan> (primitive)</text>

  <!-- Diamond Step at y=200 -->
  <rect x="100" y="175" width="340" height="50" rx="6" fill="#0B132B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="270" y="196" font-size="11" font-weight="700" fill="#93C5FD" text-anchor="middle">1. Exact Match?</text>
  <text x="270" y="214" font-size="9" fill="#94A3B8" text-anchor="middle">Exact type match exists (process(int))?</text>

  <!-- Terminal Card at y=200 -->
  <rect x="580" y="175" width="580" height="50" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="600" y="196" font-size="11" font-weight="700" fill="#10B981" text-anchor="start">Invoke Exact Match: process(int)</text>
  <text x="600" y="214" font-size="10" fill="#94A3B8" text-anchor="start">Exact primitive match prioritized</text>

  <!-- Horizontal Straight YES connector -->
  <path fill="none" d="M 440 200 L 580 200" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>
  <rect x="490" y="190" width="40" height="20" rx="4" fill="#0B132B" stroke="#10B981" stroke-width="1"/>
  <text x="510" y="204" font-size="9" font-weight="700" fill="#10B981" text-anchor="middle">Yes</text>

  <!-- Diamond Step at y=290 -->
  <rect x="100" y="265" width="340" height="50" rx="6" fill="#0B132B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="270" y="286" font-size="11" font-weight="700" fill="#93C5FD" text-anchor="middle">2. Primitive Widening?</text>
  <text x="270" y="304" font-size="9" fill="#94A3B8" text-anchor="middle">Widening primitive match exists (long / double)?</text>

  <!-- Terminal Card at y=290 -->
  <rect x="580" y="265" width="580" height="50" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="600" y="286" font-size="11" font-weight="700" fill="#10B981" text-anchor="start">Invoke Widened Match: process(long) / process(double)</text>
  <text x="600" y="304" font-size="10" fill="#94A3B8" text-anchor="start">Widening preferred over boxing</text>

  <!-- Horizontal Straight YES connector -->
  <path fill="none" d="M 440 290 L 580 290" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>
  <rect x="490" y="280" width="40" height="20" rx="4" fill="#0B132B" stroke="#10B981" stroke-width="1"/>
  <text x="510" y="294" font-size="9" font-weight="700" fill="#10B981" text-anchor="middle">Yes</text>

  <!-- Diamond Step at y=380 -->
  <rect x="100" y="355" width="340" height="50" rx="6" fill="#0B132B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="270" y="376" font-size="11" font-weight="700" fill="#93C5FD" text-anchor="middle">3. Autoboxing Match?</text>
  <text x="270" y="394" font-size="9" fill="#94A3B8" text-anchor="middle">Autoboxing match exists (process(Integer))?</text>

  <!-- Terminal Card at y=380 -->
  <rect x="580" y="355" width="580" height="50" rx="6" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="600" y="376" font-size="11" font-weight="700" fill="#06B6D4" text-anchor="start">Invoke Boxed Match: process(Integer)</text>
  <text x="600" y="394" font-size="10" fill="#94A3B8" text-anchor="start">Boxing occurs only if widening fails</text>

  <!-- Horizontal Straight YES connector -->
  <path fill="none" d="M 440 380 L 580 380" stroke="#06B6D4" stroke-width="2" marker-end="url(#arr-c)"/>
  <rect x="490" y="370" width="40" height="20" rx="4" fill="#0B132B" stroke="#06B6D4" stroke-width="1"/>
  <text x="510" y="384" font-size="9" font-weight="700" fill="#06B6D4" text-anchor="middle">Yes</text>

  <!-- Diamond Step at y=470 -->
  <rect x="100" y="445" width="340" height="50" rx="6" fill="#0B132B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="270" y="466" font-size="11" font-weight="700" fill="#93C5FD" text-anchor="middle">4. Varargs Fallback?</text>
  <text x="270" y="484" font-size="9" fill="#94A3B8" text-anchor="middle">Variable arity match exists (process(int...))?</text>

  <!-- Terminal Card at y=470 -->
  <rect x="580" y="445" width="580" height="50" rx="6" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="600" y="466" font-size="11" font-weight="700" fill="#8B5CF6" text-anchor="start">Invoke Varargs Match: process(int...) / process(Object...)</text>
  <text x="600" y="484" font-size="10" fill="#94A3B8" text-anchor="start">Varargs is lowest invocation priority</text>

  <!-- Horizontal Straight YES connector -->
  <path fill="none" d="M 440 470 L 580 470" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arr-p)"/>
  <rect x="490" y="460" width="40" height="20" rx="4" fill="#0B132B" stroke="#8B5CF6" stroke-width="1"/>
  <text x="510" y="474" font-size="9" font-weight="700" fill="#8B5CF6" text-anchor="middle">Yes</text>

  <!-- Terminal 5: Compiler Error -->
  <rect x="580" y="525" width="580" height="42" rx="6" fill="#1C1917" stroke="#EF4444" stroke-width="1.5"/>
  <text x="600" y="545" font-size="11" font-weight="700" fill="#F87171" text-anchor="start">COMPILER ERROR: No matching method or ambiguous reference</text>
  <text x="600" y="559" font-size="9" fill="#94A3B8" text-anchor="start">Cannot resolve method call; compilation fails</text>

  <!-- Downward NO Connectors along Decision Spine -->
  <path d="M 620 145 L 620 165 L 270 165 L 270 175" stroke="#3B82F6" stroke-width="1.5" fill="none" marker-end="url(#arr-b)"/>
  
  <path fill="none" d="M 270 225 L 270 265" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr-s)"/>
  <rect x="255" y="236" width="30" height="18" rx="3" fill="#0B132B" stroke="#64748B" stroke-width="1"/>
  <text x="270" y="249" font-size="8" font-weight="700" fill="#94A3B8" text-anchor="middle">No</text>

  <path fill="none" d="M 270 315 L 270 355" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr-s)"/>
  <rect x="255" y="326" width="30" height="18" rx="3" fill="#0B132B" stroke="#64748B" stroke-width="1"/>
  <text x="270" y="339" font-size="8" font-weight="700" fill="#94A3B8" text-anchor="middle">No</text>

  <path fill="none" d="M 270 405 L 270 445" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr-s)"/>
  <rect x="255" y="416" width="30" height="18" rx="3" fill="#0B132B" stroke="#64748B" stroke-width="1"/>
  <text x="270" y="429" font-size="8" font-weight="700" fill="#94A3B8" text-anchor="middle">No</text>

  <path d="M 270 495 L 270 546 L 580 546" stroke="#EF4444" stroke-width="1.5" fill="none" marker-end="url(#arr-r)"/>
  <rect x="255" y="510" width="30" height="18" rx="3" fill="#0B132B" stroke="#EF4444" stroke-width="1"/>
  <text x="270" y="523" font-size="8" font-weight="700" fill="#F87171" text-anchor="middle">No</text>
</svg>