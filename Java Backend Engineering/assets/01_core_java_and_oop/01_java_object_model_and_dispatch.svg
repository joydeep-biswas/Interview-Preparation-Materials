<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1200" height="530" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">JVM Object Model &amp; Dynamic Method Dispatch Architecture</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Thread Stack Reference -&gt; JVM Heap Instance -&gt; Metaspace InstanceKlass &amp; vtable</text>

  <!-- Column 1: Thread Stack -->
  <rect x="40" y="95" width="250" height="390" rx="8" fill="#0B132B" stroke="#1E3A8A" stroke-width="1.5"/>
  <rect x="40" y="95" width="250" height="35" rx="8" fill="#172554" stroke="#3B82F6" stroke-width="1"/>
  <text x="165" y="118" font-size="12" font-weight="700" fill="#93C5FD" text-anchor="middle">Thread Stack (Stack Frame)</text>
  
  <!-- Stack Ref Variable -->
  <rect x="55" y="150" width="220" height="110" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="165" y="175" font-size="12" font-weight="700" fill="#60A5FA" text-anchor="middle">Object Reference Variable</text>
  <text x="70" y="200" font-size="11" fill="#94A3B8" text-anchor="start">Name: <tspan fill="#F8FAFC" font-weight="600">Order order</tspan></text>
  <text x="70" y="220" font-size="11" fill="#94A3B8" text-anchor="start">Size: <tspan fill="#38BDF8">4B Compressed / 8B Raw</tspan></text>
  <text x="70" y="240" font-size="11" fill="#94A3B8" text-anchor="start">Holds: <tspan fill="#34D399" font-family="'JetBrains Mono', monospace">0x7fa81000</tspan></text>

  <!-- Primitive local variable -->
  <rect x="55" y="280" width="220" height="85" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="165" y="305" font-size="11" font-weight="700" fill="#CBD5E1" text-anchor="middle">Primitive Local Variables</text>
  <text x="70" y="330" font-size="10" fill="#94A3B8" text-anchor="start">int orderId = 42 <tspan fill="#64748B">(direct value)</tspan></text>
  <text x="70" y="348" font-size="10" fill="#94A3B8" text-anchor="start">boolean active = true</text>
  
  <text x="165" y="440" font-size="10" fill="#64748B" text-anchor="middle">Stack Frame popped on exit</text>

  <!-- Column 2: JVM Heap Space -->
  <rect x="360" y="95" width="410" height="390" rx="8" fill="#0B132B" stroke="#0369A1" stroke-width="1.5"/>
  <rect x="360" y="95" width="410" height="35" rx="8" fill="#0C4A6E" stroke="#0284C7" stroke-width="1"/>
  <text x="565" y="118" font-size="12" font-weight="700" fill="#7DD3FC" text-anchor="middle">JVM Heap Space (Object Instance at 0x7fa81000)</text>

  <!-- Object Header Group -->
  <rect x="375" y="145" width="380" height="130" rx="6" fill="#0F172A" stroke="#0284C7" stroke-width="1.5"/>
  <text x="565" y="168" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle">64-bit Object Header (12 or 16 Bytes)</text>
  
  <!-- Mark Word -->
  <rect x="390" y="180" width="350" height="38" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
  <text x="400" y="198" font-size="11" font-weight="600" fill="#BAE6FD" text-anchor="start">Mark Word (8 Bytes / 64 bits):</text>
  <text x="400" y="212" font-size="10" fill="#94A3B8" text-anchor="start">Identity HashCode (31b) | GC Age (4b) | Biased (1b) | Lock Bits (2b)</text>

  <!-- Klass Word -->
  <rect x="390" y="225" width="350" height="38" rx="4" fill="#1E293B" stroke="#06B6D4" stroke-width="1"/>
  <text x="400" y="243" font-size="11" font-weight="600" fill="#A5F3FC" text-anchor="start">Klass Word (4 Bytes compressed / 8 Bytes uncompressed):</text>
  <text x="400" y="256" font-size="10" fill="#94A3B8" text-anchor="start">Points to InstanceKlass metadata structure in Metaspace</text>

  <!-- Instance Fields -->
  <rect x="375" y="290" width="380" height="110" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="565" y="312" font-size="12" font-weight="700" fill="#E2E8F0" text-anchor="middle">Instance Fields Data (Payload)</text>
  <text x="395" y="335" font-size="11" fill="#94A3B8" text-anchor="start">Primitives: <tspan fill="#F8FAFC">long timestamp (8B), double amount (8B)</tspan></text>
  <text x="395" y="355" font-size="11" fill="#94A3B8" text-anchor="start">References: <tspan fill="#38BDF8">String orderId (4B OOP), Item[] items (4B OOP)</tspan></text>
  <text x="395" y="375" font-size="10" fill="#64748B" text-anchor="start">JVM reorders fields to minimize padding between sizes</text>

  <!-- Padding -->
  <rect x="375" y="415" width="380" height="50" rx="6" fill="#0F172A" stroke="#475569" stroke-dasharray="3 3"/>
  <text x="565" y="438" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="middle">Alignment Padding (0 to 7 Bytes)</text>
  <text x="565" y="454" font-size="10" fill="#64748B" text-anchor="middle">Enforces 8-byte boundary alignment for CPU cache lines</text>

  <!-- Column 3: Metaspace -->
  <rect x="850" y="95" width="310" height="390" rx="8" fill="#06201B" stroke="#047857" stroke-width="1.5"/>
  <rect x="850" y="95" width="310" height="35" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="1005" y="118" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">Metaspace (Native C++ Heap)</text>

  <!-- InstanceKlass Struct -->
  <rect x="865" y="145" width="280" height="110" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="1005" y="170" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle">InstanceKlass: Order.class</text>
  <text x="880" y="195" font-size="11" fill="#94A3B8" text-anchor="start">Type: <tspan fill="#F8FAFC">com.enterprise.Order</tspan></text>
  <text x="880" y="215" font-size="11" fill="#94A3B8" text-anchor="start">Super: <tspan fill="#38BDF8">java.lang.Object</tspan></text>
  <text x="880" y="235" font-size="10" fill="#6EE7B7" text-anchor="start">Constant Pool Cache &amp; Field Offsets</text>

  <!-- vtable -->
  <rect x="865" y="275" width="280" height="190" rx="6" fill="#0F172A" stroke="#059669" stroke-width="1.5"/>
  <text x="1005" y="300" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle">Virtual Method Table (vtable)</text>
  <text x="880" y="325" font-size="10" font-family="'JetBrains Mono', monospace" fill="#94A3B8">[0] toString()  -&gt; Object</text>
  <text x="880" y="345" font-size="10" font-family="'JetBrains Mono', monospace" fill="#94A3B8">[1] hashCode()  -&gt; Object</text>
  <text x="880" y="365" font-size="10" font-family="'JetBrains Mono', monospace" fill="#6EE7B7">[2] checkout()  -&gt; Order.checkout</text>
  <text x="880" y="385" font-size="10" font-family="'JetBrains Mono', monospace" fill="#6EE7B7">[3] calculate() -&gt; Order.calculate</text>
  
  <rect x="875" y="410" width="260" height="40" rx="4" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="1005" y="428" font-size="10" font-weight="600" fill="#A7F3D0" text-anchor="middle">invokevirtual Dispatch:</text>
  <text x="1005" y="442" font-size="9" fill="#D1FAE5" text-anchor="middle">Deref Klass -&gt; Index into vtable -&gt; JIT Native Jump</text>

  <!-- Connector 1: Stack to Heap Base -->
  <path fill="none" d="M 275 205 L 375 205" stroke="#3B82F6" stroke-width="2" marker-end="url(#arr-b)"/>
  <rect x="290" y="193" width="70" height="20" rx="4" fill="#0B132B" stroke="#3B82F6" stroke-width="1"/>
  <text x="325" y="207" font-size="9" font-weight="700" fill="#93C5FD" text-anchor="middle">Heap Ptr</text>

  <!-- Connector 2: Klass Word to InstanceKlass -->
  <path d="M 740 244 L 805 244 L 805 200 L 865 200" stroke="#06B6D4" stroke-width="2" fill="none" marker-end="url(#arr-c)"/>
  <rect x="765" y="210" width="80" height="20" rx="4" fill="#0B132B" stroke="#06B6D4" stroke-width="1"/>
  <text x="805" y="224" font-size="9" font-weight="700" fill="#A5F3FC" text-anchor="middle">Klass Pointer</text>

  <!-- Connector 3: InstanceKlass to vtable -->
  <path fill="none" d="M 1005 255 L 1005 275" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>
</svg>