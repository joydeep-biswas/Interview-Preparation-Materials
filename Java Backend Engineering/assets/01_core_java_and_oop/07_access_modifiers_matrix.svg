<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1200" height="520" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Java Access Modifier Visibility &amp; Encapsulation Boundaries</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Strict Accessibility Enforcement Across Packages, Inheritance Hierarchies, and Clients</text>

  <!-- Left: Package com.enterprise.order -->
  <rect x="50" y="95" width="520" height="395" rx="8" fill="#0B132B" stroke="#1D4ED8" stroke-width="1.5"/>
  <rect x="50" y="95" width="520" height="35" rx="8" fill="#1E3A8A"/>
  <text x="310" y="118" font-size="12" font-weight="700" fill="#93C5FD" text-anchor="middle">Package: com.enterprise.order</text>

  <!-- Target Class: Order -->
  <rect x="70" y="145" width="480" height="165" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="310" y="170" font-size="13" font-weight="700" fill="#60A5FA" text-anchor="middle">public class Order (Target Resource)</text>
  
  <text x="90" y="198" font-size="11" font-family="'JetBrains Mono', monospace" fill="#34D399">+ public void checkout()</text>
  <text x="300" y="198" font-size="10" fill="#94A3B8">[Visible everywhere across all packages]</text>

  <text x="90" y="226" font-size="11" font-family="'JetBrains Mono', monospace" fill="#60A5FA"># protected void audit()</text>
  <text x="300" y="226" font-size="10" fill="#94A3B8">[Visible in package + subclasses anywhere]</text>

  <text x="90" y="254" font-size="11" font-family="'JetBrains Mono', monospace" fill="#FBBF24">~ void calculateTax()</text>
  <text x="300" y="254" font-size="10" fill="#94A3B8">[Package-private; strictly same package only]</text>

  <text x="90" y="282" font-size="11" font-family="'JetBrains Mono', monospace" fill="#F87171">- private UUID orderId</text>
  <text x="300" y="282" font-size="10" fill="#94A3B8">[Strictly within Order class body only]</text>

  <!-- Peer Class: OrderService -->
  <rect x="70" y="325" width="480" height="145" rx="6" fill="#0F172A" stroke="#0284C7" stroke-width="1"/>
  <text x="310" y="350" font-size="12" font-weight="700" fill="#7DD3FC" text-anchor="middle">class OrderService (Same Package Peer)</text>
  
  <text x="90" y="375" font-size="11" fill="#94A3B8">Access permissions to Order members:</text>
  <text x="90" y="398" font-size="11" fill="#34D399">&amp;#x2714; checkout() [Public OK]  &amp;#x2714; audit() [Protected OK]</text>
  <text x="90" y="420" font-size="11" fill="#34D399">&amp;#x2714; calculateTax() [Package-Private OK]</text>
  <text x="90" y="442" font-size="11" fill="#F87171">&amp;#x2718; orderId [BLOCKED - Private]</text>

  <!-- Right: Package com.enterprise.billing -->
  <rect x="630" y="95" width="520" height="395" rx="8" fill="#06201B" stroke="#047857" stroke-width="1.5"/>
  <rect x="630" y="95" width="520" height="35" rx="8" fill="#064E3B"/>
  <text x="890" y="118" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">Package: com.enterprise.billing</text>

  <!-- Subclass: BillingAudit -->
  <rect x="650" y="145" width="480" height="150" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="890" y="170" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle">public class BillingAudit extends Order (Subclass)</text>
  
  <text x="670" y="198" font-size="11" fill="#94A3B8">Cross-package inheritance access:</text>
  <text x="670" y="222" font-size="11" fill="#34D399">&amp;#x2714; checkout() [Public OK]  &amp;#x2714; audit() [Protected Inheritance OK]</text>
  <text x="670" y="246" font-size="11" fill="#F87171">&amp;#x2718; calculateTax() [BLOCKED - Package boundary]</text>
  <text x="670" y="270" font-size="11" fill="#F87171">&amp;#x2718; orderId [BLOCKED - Private]</text>

  <!-- External Client: ExternalClient -->
  <rect x="650" y="310" width="480" height="160" rx="6" fill="#1C1917" stroke="#EF4444" stroke-width="1.2"/>
  <text x="890" y="335" font-size="12" font-weight="700" fill="#F87171" text-anchor="middle">public class ExternalClient (Unrelated External Caller)</text>
  
  <text x="670" y="362" font-size="11" fill="#94A3B8">Non-subclass external access:</text>
  <text x="670" y="386" font-size="11" fill="#34D399">&amp;#x2714; checkout() [Public API Only]</text>
  <text x="670" y="410" font-size="11" fill="#F87171">&amp;#x2718; audit() [BLOCKED - Non-subclass]</text>
  <text x="670" y="432" font-size="11" fill="#F87171">&amp;#x2718; calculateTax() [BLOCKED - Different package]</text>
  <text x="670" y="454" font-size="11" fill="#F87171">&amp;#x2718; orderId [BLOCKED - Private]</text>

  <!-- Connector 1: BillingAudit to Order -->
  <path fill="none" d="M 650 200 L 550 200" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>
  <rect x="560" y="188" width="80" height="22" rx="4" fill="#0B132B" stroke="#10B981" stroke-width="1"/>
  <text x="600" y="203" font-size="8" font-weight="700" fill="#6EE7B7" text-anchor="middle">extends Order</text>

  <!-- Connector 2: ExternalClient to Order -->
  <path d="M 650 390 L 590 390 L 590 220 L 550 220" stroke="#EF4444" stroke-width="2" fill="none" marker-end="url(#arr-r)"/>
  <rect x="565" y="295" width="70" height="22" rx="4" fill="#0B132B" stroke="#EF4444" stroke-width="1"/>
  <text x="600" y="310" font-size="8" font-weight="700" fill="#F87171" text-anchor="middle">Calls Public</text>
</svg>