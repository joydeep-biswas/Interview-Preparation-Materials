<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="500" viewBox="0 0 1180 500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1180" height="500" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Non-Static Inner Class Memory Leak: Hidden Outer.this Reference</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">How Long-Lived Threads and Queues Unintentionally Retain Heavy Enclosing Service Instances</text>

  <!-- Stage 1: GC Root ThreadPool Queue -->
  <rect x="50" y="95" width="310" height="280" rx="8" fill="#1C1917" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="50" y="95" width="310" height="35" rx="8" fill="#7F1D1D" stroke="#EF4444" stroke-width="1"/>
  <text x="205" y="118" font-size="12" font-weight="700" fill="#FCA5A5" text-anchor="middle">GC Root: Long-Lived ThreadPool Queue</text>

  <rect x="70" y="145" width="270" height="85" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="205" y="170" font-size="12" font-weight="700" fill="#F87171" text-anchor="middle">ThreadPoolExecutor Queue</text>
  <text x="85" y="195" font-size="11" fill="#94A3B8">Lifecycle: <tspan fill="#F8FAFC">Application Lifetime</tspan></text>
  <text x="85" y="215" font-size="11" fill="#94A3B8">Status: <tspan fill="#F87171" font-weight="600">Active GC Root</tspan></text>

  <rect x="70" y="245" width="270" height="110" rx="6" fill="#1E293B" stroke="#EF4444" stroke-width="1"/>
  <text x="85" y="270" font-size="11" fill="#CBD5E1">Retains submitted tasks in queue</text>
  <text x="85" y="290" font-size="11" fill="#CBD5E1">Strong reference path:</text>
  <text x="85" y="315" font-size="10" font-family="'JetBrains Mono', monospace" fill="#FCA5A5">Queue -&gt; Task[0] -&gt; Task[1]</text>
  <text x="85" y="335" font-size="10" fill="#94A3B8">Tasks held until thread consumes</text>

  <!-- Stage 2: Anonymous Inner Class -->
  <rect x="420" y="95" width="340" height="280" rx="8" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.5"/>
  <rect x="420" y="95" width="340" height="35" rx="8" fill="#4C1D95" stroke="#8B5CF6" stroke-width="1"/>
  <text x="590" y="118" font-size="12" font-weight="700" fill="#C4B5FD" text-anchor="middle">Anonymous Runnable Instance (Heap)</text>

  <rect x="440" y="145" width="300" height="90" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="590" y="170" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="middle">new Runnable() { ... }</text>
  <text x="455" y="195" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">executor.submit(new Runnable() {</text>
  <text x="455" y="212" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">  public void run() { doWork(); }</text>
  <text x="455" y="228" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">});</text>

  <rect x="440" y="250" width="300" height="105" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="590" y="275" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="middle">Hidden Synthetic Field (Compiler Injected)</text>
  <text x="455" y="300" font-size="10" font-family="'JetBrains Mono', monospace" fill="#FDE68A">final HeavyService this$0;</text>
  <text x="455" y="322" font-size="10" fill="#CBD5E1">Invisible compiler-generated reference</text>
  <text x="455" y="340" font-size="10" fill="#94A3B8">Implicitly binds task to outer class</text>

  <!-- Stage 3: Heavy Enclosing Service -->
  <rect x="820" y="95" width="310" height="280" rx="8" fill="#1C1917" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="820" y="95" width="310" height="35" rx="8" fill="#7F1D1D" stroke="#EF4444" stroke-width="1"/>
  <text x="975" y="118" font-size="12" font-weight="700" fill="#FCA5A5" text-anchor="middle">HeavyProcessingService (LEAK VICTIM)</text>

  <rect x="840" y="145" width="270" height="110" rx="6" fill="#0F172A" stroke="#EF4444" stroke-width="1.5"/>
  <text x="975" y="170" font-size="12" font-weight="700" fill="#F87171" text-anchor="middle">100MB Retained Memory</text>
  <text x="855" y="195" font-size="10" font-family="'JetBrains Mono', monospace" fill="#FCA5A5">byte[] cache = new byte[100MB];</text>
  <text x="855" y="215" font-size="10" fill="#CBD5E1">GC Status: <tspan fill="#F87171" font-weight="700">UNCOLLECTIBLE</tspan></text>
  <text x="855" y="235" font-size="10" fill="#94A3B8">Reachable from ThreadPool GC Root</text>

  <rect x="840" y="270" width="270" height="85" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="975" y="295" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="middle">Memory Accumulation</text>
  <text x="855" y="318" font-size="10" fill="#94A3B8">10 tasks in queue = 1 GB retained</text>
  <text x="855" y="336" font-size="10" fill="#F87171" font-weight="600">java.lang.OutOfMemoryError</text>

  <!-- Bottom Architectural Fix Banner -->
  <rect x="50" y="400" width="1080" height="75" rx="8" fill="#06201B" stroke="#10B981" stroke-width="1.5"/>
  <text x="590" y="425" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle">Architectural Solution: Eliminate the Implicit Enclosing Reference</text>
  <text x="590" y="445" font-size="11" fill="#E2E8F0" text-anchor="middle">1. Use a <tspan fill="#34D399" font-weight="700">static nested class</tspan> (static classes never receive a synthetic this$0 pointer).</text>
  <text x="590" y="462" font-size="11" fill="#E2E8F0" text-anchor="middle">2. Use standalone lambdas that only capture primitive arguments or pass required parameters explicitly.</text>

  <!-- Connector 1: Queue to Task -->
  <path fill="none" d="M 360 200 L 420 200" stroke="#EF4444" stroke-width="2" marker-end="url(#arr-r)"/>
  <rect x="365" y="188" width="50" height="20" rx="3" fill="#0B132B" stroke="#EF4444" stroke-width="1"/>
  <text x="390" y="202" font-size="8" font-weight="700" fill="#FCA5A5" text-anchor="middle">Holds</text>

  <!-- Connector 2: Task to Enclosing Service -->
  <path fill="none" d="M 760 300 L 820 300" stroke="#EF4444" stroke-width="2" marker-end="url(#arr-r)"/>
  <rect x="765" y="288" width="50" height="20" rx="3" fill="#0B132B" stroke="#EF4444" stroke-width="1"/>
  <text x="790" y="302" font-size="8" font-weight="700" fill="#FCA5A5" text-anchor="middle">this$0</text>
</svg>