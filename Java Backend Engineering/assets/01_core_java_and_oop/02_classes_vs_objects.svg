<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="480" viewBox="0 0 1160 480">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1160" height="480" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Class Blueprint vs. Heap Instances</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Single Metaspace Class Metadata Reused Across Multiple Independent Heap Objects</text>

  <!-- Left: Metaspace Class Blueprint -->
  <rect x="50" y="95" width="370" height="350" rx="8" fill="#0B132B" stroke="#1D4ED8" stroke-width="1.5"/>
  <rect x="50" y="95" width="370" height="35" rx="8" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
  <text x="235" y="118" font-size="12" font-weight="700" fill="#93C5FD" text-anchor="middle">Class Blueprint (Metaspace Native Memory)</text>

  <rect x="65" y="145" width="340" height="130" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="235" y="170" font-size="13" font-weight="700" fill="#60A5FA" text-anchor="middle">class Account (Loaded ONCE)</text>
  <text x="80" y="195" font-size="11" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">String accountNumber;</text>
  <text x="80" y="215" font-size="11" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">double balance;</text>
  <text x="80" y="235" font-size="11" font-family="'JetBrains Mono', monospace" fill="#6EE7B7">void deposit(double amount) { ... }</text>
  <text x="80" y="255" font-size="11" font-family="'JetBrains Mono', monospace" fill="#6EE7B7">void withdraw(double amount) { ... }</text>

  <rect x="65" y="290" width="340" height="85" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="235" y="312" font-size="11" font-weight="700" fill="#94A3B8" text-anchor="middle">Shared Static &amp; Metadata State</text>
  <text x="80" y="335" font-size="10" fill="#CBD5E1">static double MIN_BALANCE = 50.00;</text>
  <text x="80" y="355" font-size="10" fill="#94A3B8">vtable: shared bytecode method address pointers</text>

  <text x="235" y="420" font-size="10" fill="#64748B" text-anchor="middle">Immutable schema defined once at class-load time</text>

  <!-- Right: Heap Instances -->
  <rect x="580" y="95" width="530" height="350" rx="8" fill="#06201B" stroke="#047857" stroke-width="1.5"/>
  <rect x="580" y="95" width="530" height="35" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="845" y="118" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">JVM Heap Space (Unique Object Instances)</text>

  <!-- Instance 1 -->
  <rect x="600" y="145" width="490" height="125" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="845" y="168" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle">Heap Instance 1 (Address: 0x7fa810)</text>
  
  <rect x="615" y="180" width="460" height="30" rx="4" fill="#1E293B" stroke="#059669" stroke-width="1"/>
  <text x="625" y="200" font-size="10" fill="#A7F3D0">Header: Mark Word [Hash: 0x4a12, Age: 0] | Klass Word: -&gt; Account.class</text>
  
  <rect x="615" y="218" width="460" height="42" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="625" y="235" font-size="11" font-family="'JetBrains Mono', monospace" fill="#F8FAFC">accountNumber: "ACC-001"</text>
  <text x="625" y="250" font-size="11" font-family="'JetBrains Mono', monospace" fill="#38BDF8">balance: $100.00</text>

  <!-- Instance 2 -->
  <rect x="600" y="295" width="490" height="125" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="845" y="318" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle">Heap Instance 2 (Address: 0x7fa838)</text>
  
  <rect x="615" y="330" width="460" height="30" rx="4" fill="#1E293B" stroke="#059669" stroke-width="1"/>
  <text x="625" y="350" font-size="10" fill="#A7F3D0">Header: Mark Word [Hash: 0x9b3f, Age: 0] | Klass Word: -&gt; Account.class</text>
  
  <rect x="615" y="368" width="460" height="42" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="625" y="385" font-size="11" font-family="'JetBrains Mono', monospace" fill="#F8FAFC">accountNumber: "ACC-002"</text>
  <text x="625" y="400" font-size="11" font-family="'JetBrains Mono', monospace" fill="#38BDF8">balance: $500.00</text>

  <!-- Connectors from Blueprint to Instances -->
  <path fill="none" d="M 420 180 L 600 180" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>
  <rect x="435" y="168" width="150" height="22" rx="4" fill="#0B132B" stroke="#10B981" stroke-width="1"/>
  <text x="510" y="183" font-size="9" font-weight="700" fill="#6EE7B7" text-anchor="middle">new Account("ACC-1", $100)</text>

  <path fill="none" d="M 420 330 L 600 330" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>
  <rect x="435" y="318" width="150" height="22" rx="4" fill="#0B132B" stroke="#10B981" stroke-width="1"/>
  <text x="510" y="333" font-size="9" font-weight="700" fill="#6EE7B7" text-anchor="middle">new Account("ACC-2", $500)</text>
</svg>