<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="580" viewBox="0 0 1220 580">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1220" height="580" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">HotSpot 64-bit Java Object Memory Layout &amp; Lock States</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Mark Word (64b) + Klass Word (32b/64b) + Field Reordering + 8-Byte Boundary Alignment Padding</text>

  <!-- Top: Object Header Container -->
  <rect x="50" y="95" width="1120" height="260" rx="8" fill="#0B132B" stroke="#1D4ED8" stroke-width="1.5"/>
  <rect x="50" y="95" width="1120" height="35" rx="8" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
  <text x="610" y="118" font-size="12" font-weight="700" fill="#93C5FD" text-anchor="middle">Object Header: Mark Word (8 Bytes) + Klass Word (4 or 8 Bytes)</text>

  <!-- Left: Mark Word States -->
  <rect x="70" y="145" width="700" height="195" rx="6" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="420" y="168" font-size="12" font-weight="700" fill="#60A5FA" text-anchor="middle">Mark Word (64 bits / 8 Bytes) State Transitions</text>

  <!-- State 1: Normal Unlocked -->
  <rect x="85" y="180" width="670" height="24" rx="3" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="95" y="196" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1"><tspan fill="#34D399">Unlocked (01):</tspan>  HashCode (31b) | Unused (25b) | Age (4b) | Biased:0 | Lock:01</text>

  <!-- State 2: Biased Lock -->
  <rect x="85" y="210" width="670" height="24" rx="3" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="95" y="226" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1"><tspan fill="#60A5FA">Biased (01):</tspan>    JavaThread* (54b) | Epoch (2b) | Age (4b) | Biased:1 | Lock:01</text>

  <!-- State 3: Lightweight Lock -->
  <rect x="85" y="240" width="670" height="24" rx="3" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="95" y="256" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1"><tspan fill="#FBBF24">Thin Lock (00):</tspan>  Pointer to BasicObjectLock on Thread Stack (62b)     | Lock:00</text>

  <!-- State 4: Heavyweight Lock -->
  <rect x="85" y="270" width="670" height="24" rx="3" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="95" y="286" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1"><tspan fill="#F87171">Fat Lock (10):</tspan>   Pointer to ObjectMonitor inflated OS mutex (62b)     | Lock:10</text>

  <!-- State 5: Marked for GC -->
  <rect x="85" y="300" width="670" height="24" rx="3" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="95" y="316" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1"><tspan fill="#94A3B8">GC Marked (11):</tspan>  Forwarding Pointer used during compaction (62b)      | Lock:11</text>

  <!-- Right: Klass Word -->
  <rect x="790" y="145" width="360" height="195" rx="6" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="970" y="168" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle">Klass Word (Pointer to Metaspace)</text>
  
  <rect x="805" y="185" width="330" height="65" rx="4" fill="#1E293B" stroke="#0284C7" stroke-width="1"/>
  <text x="820" y="205" font-size="11" font-weight="700" fill="#7DD3FC">+UseCompressedClassPointers (Default):</text>
  <text x="820" y="223" font-size="10" fill="#CBD5E1">&amp;#x2022; 32 bits (4 Bytes) narrow pointer</text>
  <text x="820" y="239" font-size="10" fill="#94A3B8">&amp;#x2022; 3-bit left shift addresses up to 32GB Heap</text>

  <rect x="805" y="260" width="330" height="65" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="820" y="280" font-size="11" font-weight="700" fill="#94A3B8">-UseCompressedClassPointers:</text>
  <text x="820" y="298" font-size="10" fill="#CBD5E1">&amp;#x2022; 64 bits (8 Bytes) uncompressed raw pointer</text>
  <text x="820" y="314" font-size="10" fill="#94A3B8">&amp;#x2022; Required for heaps &gt; 32GB without zero-base</text>

  <!-- Bottom Left: Instance Fields Packing -->
  <rect x="50" y="375" width="790" height="175" rx="8" fill="#06201B" stroke="#047857" stroke-width="1.5"/>
  <rect x="50" y="375" width="790" height="32" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="445" y="396" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">Instance Fields Data (Ordered by JVM to Minimize Internal Fragmentation)</text>

  <rect x="70" y="420" width="750" height="55" rx="4" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="85" y="442" font-size="11" font-weight="700" fill="#34D399">JVM Field Allocation Order (Widest Primitive to Narrowest):</text>
  <text x="85" y="462" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">long / double (8B) -&gt; int / float (4B) -&gt; short / char (2B) -&gt; byte / bool (1B) -&gt; OOPs (4B)</text>

  <rect x="70" y="485" width="750" height="50" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="85" y="505" font-size="10" fill="#94A3B8">&amp;#x2022; Superclass fields always precede Subclass fields (maintains hierarchical object layout)</text>
  <text x="85" y="522" font-size="10" fill="#94A3B8">&amp;#x2022; Reordering prevents wasteful padding between differently sized primitive attributes</text>

  <!-- Bottom Right: Alignment Padding -->
  <rect x="860" y="375" width="310" height="175" rx="8" fill="#0B132B" stroke="#475569" stroke-width="1.5"/>
  <rect x="860" y="375" width="310" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="1015" y="396" font-size="12" font-weight="700" fill="#CBD5E1" text-anchor="middle">Alignment Padding (0–7 Bytes)</text>

  <rect x="875" y="420" width="280" height="115" rx="4" fill="#0F172A" stroke="#334155" stroke-dasharray="3 3"/>
  <text x="890" y="442" font-size="11" font-weight="700" fill="#94A3B8">8-Byte Word Alignment:</text>
  <text x="890" y="462" font-size="10" fill="#CBD5E1">&amp;#x2022; Total object size must be a multiple of 8 bytes</text>
  <text x="890" y="482" font-size="10" fill="#CBD5E1">&amp;#x2022; Matches 64-bit CPU memory bus width</text>
  <text x="890" y="502" font-size="10" fill="#CBD5E1">&amp;#x2022; Enables Compressed OOPs 3-bit zero shift</text>
  <text x="890" y="522" font-size="10" fill="#64748B">&amp;#x2022; Unused trailing padding bytes are zero-filled</text>
</svg>