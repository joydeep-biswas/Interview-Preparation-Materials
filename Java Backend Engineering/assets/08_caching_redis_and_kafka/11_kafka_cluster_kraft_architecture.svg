<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1200" height="560" rx="10" fill="url(#bg)"/>
  <rect width="1200" height="560" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="600" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">Apache Kafka KRaft Architecture: Controller Quorum &amp; Partition Layout</text>
  <text x="600" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">Zero-ZooKeeper Event Log: Event-Driven Raft Metadata Quorum (@metadata) with Leader-Follower Partition Replication</text>
  <line x1="40" y1="68" x2="1160" y2="68" stroke="#334155" stroke-width="1"/>

  <!-- Top: KRaft Controller Quorum -->
  <rect x="50" y="100" width="1100" height="115" rx="8" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.5"/>
  <rect x="50" y="100" width="1100" height="26" rx="8" fill="#4C1D95" stroke="#8B5CF6" stroke-width="1"/>
  <text x="600" y="118" font-size="11" font-weight="700" fill="#DDD6FE" text-anchor="middle">KRaft Controller Quorum (Replaces Apache ZooKeeper)</text>

  <!-- Controller 1 -->
  <rect x="75" y="135" width="310" height="65" rx="6" fill="#0F172A" stroke="#8B5CF6" stroke-width="1"/>
  <text x="230" y="157" font-size="10" font-weight="700" fill="#C084FC" text-anchor="middle">Controller 1 (Raft Leader)</text>
  <text x="90" y="177" font-size="8" fill="#CBD5E1">&#x2022; Manages <tspan font-family="'JetBrains Mono', monospace" fill="#A78BFA">@metadata</tspan> partition log</text>
  <text x="90" y="192" font-size="8" fill="#34D399">&#x2714; Instant metadata propagation</text>

  <!-- Controller 2 -->
  <rect x="445" y="135" width="310" height="65" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="600" y="157" font-size="10" font-weight="700" fill="#CBD5E1" text-anchor="middle">Controller 2 (Raft Follower)</text>
  <text x="460" y="177" font-size="8" fill="#94A3B8">&#x2022; Active in-sync metadata replica</text>
  <text x="460" y="192" font-size="8" fill="#94A3B8">&#x2022; Ready for sub-second failover</text>

  <!-- Controller 3 -->
  <rect x="815" y="135" width="310" height="65" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="970" y="157" font-size="10" font-weight="700" fill="#CBD5E1" text-anchor="middle">Controller 3 (Raft Follower)</text>
  <text x="830" y="177" font-size="8" fill="#94A3B8">&#x2022; Active in-sync metadata replica</text>
  <text x="830" y="192" font-size="8" fill="#94A3B8">&#x2022; Quorum member (2 of 3)</text>

  <!-- Bottom: Kafka Broker Tier -->
  <rect x="50" y="240" width="1100" height="235" rx="8" fill="#06201B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="50" y="240" width="1100" height="26" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="600" y="258" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">Kafka Data Brokers (Topic: orders, 3 Partitions, Replication Factor 2)</text>

  <!-- Broker 101 -->
  <rect x="75" y="280" width="320" height="175" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="235" y="305" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">Broker 101</text>
  
  <rect x="90" y="320" width="290" height="40" rx="4" fill="#06201B" stroke="#10B981"/>
  <text x="100" y="338" font-size="9" font-weight="700" fill="#34D399">Partition 0 (LEADER)</text>
  <text x="100" y="352" font-size="8" fill="#A7F3D0">Services all read &amp; write requests</text>

  <rect x="90" y="370" width="290" height="40" rx="4" fill="#1E293B" stroke="#334155"/>
  <text x="100" y="388" font-size="9" font-weight="700" fill="#94A3B8">Partition 1 (FOLLOWER)</text>
  <text x="100" y="402" font-size="8" fill="#CBD5E1">In-Sync Replica (ISR) fetches from Broker 102</text>

  <text x="90" y="435" font-size="8" fill="#CBD5E1">Disk: Append-Only Commit Log (.log)</text>

  <!-- Broker 102 -->
  <rect x="440" y="280" width="320" height="175" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="600" y="305" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">Broker 102</text>

  <rect x="455" y="320" width="290" height="40" rx="4" fill="#06201B" stroke="#10B981"/>
  <text x="465" y="338" font-size="9" font-weight="700" fill="#34D399">Partition 1 (LEADER)</text>
  <text x="465" y="352" font-size="8" fill="#A7F3D0">Services all read &amp; write requests</text>

  <rect x="455" y="370" width="290" height="40" rx="4" fill="#1E293B" stroke="#334155"/>
  <text x="465" y="388" font-size="9" font-weight="700" fill="#94A3B8">Partition 2 (FOLLOWER)</text>
  <text x="465" y="402" font-size="8" fill="#CBD5E1">In-Sync Replica (ISR) fetches from Broker 103</text>

  <text x="455" y="435" font-size="8" fill="#CBD5E1">Zero-Copy (sendfile) Network Dispatch</text>

  <!-- Broker 103 -->
  <rect x="805" y="280" width="320" height="175" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="965" y="305" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">Broker 103</text>

  <rect x="820" y="320" width="290" height="40" rx="4" fill="#06201B" stroke="#10B981"/>
  <text x="830" y="338" font-size="9" font-weight="700" fill="#34D399">Partition 2 (LEADER)</text>
  <text x="830" y="352" font-size="8" fill="#A7F3D0">Services all read &amp; write requests</text>

  <rect x="820" y="370" width="290" height="40" rx="4" fill="#1E293B" stroke="#334155"/>
  <text x="830" y="388" font-size="9" font-weight="700" fill="#94A3B8">Partition 0 (FOLLOWER)</text>
  <text x="830" y="402" font-size="8" fill="#CBD5E1">In-Sync Replica (ISR) fetches from Broker 101</text>

  <text x="820" y="435" font-size="8" fill="#CBD5E1">Sequential I/O throughput: 1M+ msgs/sec</text>

  <!-- Connecting Arrows -->
  <path fill="none" d="M 230 200 L 230 240" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-p)"/>
  <path fill="none" d="M 600 200 L 600 240" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-p)"/>
  <path fill="none" d="M 970 200 L 970 240" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-p)"/>

  <!-- Bottom Invariant -->
  <rect x="50" y="500" width="1100" height="35" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="600" y="522" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">KRaft Consensus Advantage: Eliminates external ZooKeeper latency. Metadata changes commit directly to an internal Raft topic (@metadata), scaling cluster partition limits from 200k to millions.</text>
</svg>