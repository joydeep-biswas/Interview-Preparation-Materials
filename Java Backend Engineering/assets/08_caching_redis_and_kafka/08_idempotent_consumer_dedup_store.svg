<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 580" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1180" height="580" rx="10" fill="url(#bg)"/>
  <rect width="1180" height="580" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="590" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">The Idempotent Consumer Pattern: Distributed Deduplication Architecture</text>
  <text x="590" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">Kafka / RabbitMQ At-Least-Once Delivery -&gt; Redis SETNX Deduplication Store -&gt; Process vs Duplicate ACK</text>
  <line x1="40" y1="68" x2="1140" y2="68" stroke="#334155" stroke-width="1"/>

  <!-- Actor 1: Message Broker -->
  <rect x="50" y="95" width="200" height="45" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="150" y="122" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="middle">Broker (Kafka / RabbitMQ)</text>
  <line x1="150" y1="140" x2="150" y2="510" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Actor 2: Consumer Worker -->
  <rect x="360" y="95" width="200" height="45" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="460" y="122" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">Order Consumer Worker</text>
  <line x1="460" y1="140" x2="460" y2="510" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Actor 3: Redis Dedup Store -->
  <rect x="670" y="95" width="200" height="45" rx="6" fill="#1E293B" stroke="#C084FC" stroke-width="1.5"/>
  <text x="770" y="122" font-size="11" font-weight="700" fill="#C084FC" text-anchor="middle">Redis Deduplication Store</text>
  <line x1="770" y1="140" x2="770" y2="510" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Actor 4: PostgreSQL Database -->
  <rect x="940" y="95" width="200" height="45" rx="6" fill="#1E293B" stroke="#34D399" stroke-width="1.5"/>
  <text x="1040" y="122" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">PostgreSQL Database</text>
  <line x1="1040" y1="140" x2="1040" y2="510" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Step 1: Delivers Event -->
  <path fill="none" d="M 150 165 L 460 165" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arr-a)"/>
  <text x="305" y="157" font-size="9" fill="#FBBF24" text-anchor="middle">1. Deliver Event: OrderCreatedEvent(id="ORD-101")</text>

  <!-- Step 2: Atomic SETNX Check -->
  <path fill="none" d="M 460 200 L 770 200" stroke="#C084FC" stroke-width="2" marker-end="url(#arr-p)"/>
  <text x="615" y="192" font-size="9" font-weight="700" fill="#C084FC" text-anchor="middle">2. SET dedup:ORD-101 "IN_PROGRESS" NX EX 86400</text>

  <!-- Branch Split Frame -->
  <rect x="280" y="225" width="860" height="135" rx="6" fill="#06201B" stroke="#10B981" stroke-width="1"/>
  <text x="300" y="245" font-size="10" font-weight="700" fill="#34D399">Case A: Key was successfully set (First-time delivery: Return 1)</text>

  <path fill="none" d="M 770 265 L 460 265" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-g)"/>
  <text x="615" y="258" font-size="8" fill="#34D399" text-anchor="middle">Returns 1 (Lock Acquired)</text>

  <path fill="none" d="M 460 295 L 1040 295" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="750" y="287" font-size="8" fill="#34D399" text-anchor="middle">3. Process Order &amp; INSERT INTO orders / payments (ACID Transaction)</text>

  <path fill="none" d="M 460 325 L 770 325" stroke="#C084FC" stroke-width="1.5" marker-end="url(#arr-p)"/>
  <text x="615" y="318" font-size="8" fill="#C084FC" text-anchor="middle">4. SET dedup:ORD-101 "COMPLETED" EX 86400</text>

  <path fill="none" d="M 460 350 L 150 350" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>
  <text x="305" y="342" font-size="8" fill="#7DD3FC" text-anchor="middle">5. Acknowledge Broker (basicAck / commitOffset)</text>

  <!-- Branch 2: Duplicate Delivery -->
  <rect x="280" y="380" width="860" height="115" rx="6" fill="#1C1917" stroke="#EF4444" stroke-width="1"/>
  <text x="300" y="400" font-size="10" font-weight="700" fill="#F87171">Case B: Key already exists (Duplicate Redelivery / Rebalance: Return 0)</text>

  <path fill="none" d="M 770 425 L 460 425" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-r)"/>
  <text x="615" y="418" font-size="8" fill="#EF4444" text-anchor="middle">Returns 0 (Duplicate detected: Key exists)</text>

  <path fill="none" d="M 460 460 L 150 460" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>
  <text x="305" y="452" font-size="8" font-weight="700" fill="#7DD3FC" text-anchor="middle">6. Acknowledge Broker immediately &amp; Discard Payload (Zero duplicate DB charge!)</text>

  <!-- Bottom Invariant -->
  <rect x="50" y="530" width="1080" height="30" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="590" y="550" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Idempotency Invariant: Because messaging systems guarantee At-Least-Once delivery, consumers MUST be idempotent. Atomic SETNX protects downstream databases from duplicate side effects.</text>
</svg>