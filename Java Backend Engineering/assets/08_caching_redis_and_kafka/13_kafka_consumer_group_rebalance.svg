<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1180" height="520" rx="10" fill="url(#bg)"/>
  <rect width="1180" height="520" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="590" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">Kafka Consumer Group Scalability: Partition Allocation &amp; Idle Worker Trap</text>
  <text x="590" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">1:1 Partition-to-Consumer Rule: Scaling from 2 Consumers -&gt; 4 Consumers (Optimal) -&gt; 8 Consumers (Idle Overhead)</text>
  <line x1="40" y1="68" x2="1140" y2="68" stroke="#334155" stroke-width="1"/>

  <!-- Top: 4 Partitions of Topic "orders" -->
  <rect x="50" y="95" width="1080" height="110" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="50" y="95" width="1080" height="26" rx="8" fill="#0C4A6E" stroke="#0284C7" stroke-width="1"/>
  <text x="590" y="113" font-size="11" font-weight="700" fill="#7DD3FC" text-anchor="middle">Topic: "orders" (Fixed at 4 Partitions)</text>

  <!-- P0 -->
  <rect x="75" y="130" width="240" height="60" rx="5" fill="#1E293B" stroke="#38BDF8"/>
  <text x="195" y="155" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">Partition 0</text>
  <text x="195" y="175" font-size="8" fill="#CBD5E1" text-anchor="middle">Sequential Append Log</text>

  <!-- P1 -->
  <rect x="345" y="130" width="240" height="60" rx="5" fill="#1E293B" stroke="#38BDF8"/>
  <text x="465" y="155" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">Partition 1</text>
  <text x="465" y="175" font-size="8" fill="#CBD5E1" text-anchor="middle">Sequential Append Log</text>

  <!-- P2 -->
  <rect x="615" y="130" width="240" height="60" rx="5" fill="#1E293B" stroke="#38BDF8"/>
  <text x="735" y="155" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">Partition 2</text>
  <text x="735" y="175" font-size="8" fill="#CBD5E1" text-anchor="middle">Sequential Append Log</text>

  <!-- P3 -->
  <rect x="885" y="130" width="220" height="60" rx="5" fill="#1E293B" stroke="#38BDF8"/>
  <text x="995" y="155" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">Partition 3</text>
  <text x="995" y="175" font-size="8" fill="#CBD5E1" text-anchor="middle">Sequential Append Log</text>

  <!-- Bottom: 3 Scaling Scenarios -->
  <!-- Scenario A: 2 Consumers -->
  <rect x="50" y="230" width="340" height="215" rx="8" fill="#06201B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="50" y="230" width="340" height="26" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="220" y="248" font-size="10" font-weight="700" fill="#6EE7B7" text-anchor="middle">Scenario A: 2 Consumers (Under-provisioned)</text>

  <rect x="70" y="270" width="300" height="40" rx="4" fill="#0F172A" stroke="#10B981"/>
  <text x="220" y="295" font-size="9" fill="#34D399" text-anchor="middle">Consumer Pod 1 &#x2190; Assigned <tspan font-weight="700">P0, P1</tspan></text>

  <rect x="70" y="320" width="300" height="40" rx="4" fill="#0F172A" stroke="#10B981"/>
  <text x="220" y="345" font-size="9" fill="#34D399" text-anchor="middle">Consumer Pod 2 &#x2190; Assigned <tspan font-weight="700">P2, P3</tspan></text>

  <text x="220" y="385" font-size="8" fill="#CBD5E1" text-anchor="middle">&#x2022; Max throughput: 50% of partition capability</text>
  <text x="220" y="405" font-size="8" fill="#CBD5E1">&#x2022; Each pod handles 2 partitions concurrently</text>
  <text x="220" y="425" font-size="8" fill="#34D399">&#x2714; Zero idle consumers</text>

  <!-- Scenario B: 4 Consumers -->
  <rect x="420" y="230" width="340" height="215" rx="8" fill="#06201B" stroke="#10B981" stroke-width="2"/>
  <rect x="420" y="230" width="340" height="26" rx="8" fill="#047857" stroke="#10B981" stroke-width="1"/>
  <text x="590" y="248" font-size="10" font-weight="700" fill="#A7F3D0" text-anchor="middle">&#x2714; Scenario B: 4 Consumers (SWEET SPOT!)</text>

  <rect x="435" y="270" width="145" height="40" rx="4" fill="#0F172A" stroke="#10B981"/>
  <text x="507" y="295" font-size="8" fill="#34D399" text-anchor="middle">Pod 1 &#x2190; <tspan font-weight="700">P0</tspan></text>

  <rect x="600" y="270" width="145" height="40" rx="4" fill="#0F172A" stroke="#10B981"/>
  <text x="672" y="295" font-size="8" fill="#34D399" text-anchor="middle">Pod 2 &#x2190; <tspan font-weight="700">P1</tspan></text>

  <rect x="435" y="320" width="145" height="40" rx="4" fill="#0F172A" stroke="#10B981"/>
  <text x="507" y="345" font-size="8" fill="#34D399" text-anchor="middle">Pod 3 &#x2190; <tspan font-weight="700">P2</tspan></text>

  <rect x="600" y="320" width="145" height="40" rx="4" fill="#0F172A" stroke="#10B981"/>
  <text x="672" y="345" font-size="8" fill="#34D399" text-anchor="middle">Pod 4 &#x2190; <tspan font-weight="700">P3</tspan></text>

  <text x="590" y="385" font-size="8" font-weight="700" fill="#34D399" text-anchor="middle">&#x2714; Perfect 1:1 Partition-to-Pod Mapping</text>
  <text x="590" y="405" font-size="8" fill="#CBD5E1" text-anchor="middle">&#x2022; Maximum theoretical throughput attained</text>
  <text x="590" y="425" font-size="8" fill="#A7F3D0" text-anchor="middle">&#x2022; Zero lock contention, zero idle resources</text>

  <!-- Scenario C: 8 Consumers (Idle Trap) -->
  <rect x="790" y="230" width="340" height="215" rx="8" fill="#1C1917" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="790" y="230" width="340" height="26" rx="8" fill="#7F1D1D" stroke="#EF4444" stroke-width="1"/>
  <text x="960" y="248" font-size="10" font-weight="700" fill="#FCA5A5" text-anchor="middle">&#x26A0; Scenario C: 8 Consumers (Idle Worker Trap)</text>

  <rect x="805" y="270" width="145" height="30" rx="3" fill="#0F172A" stroke="#10B981"/>
  <text x="877" y="289" font-size="8" fill="#34D399" text-anchor="middle">Pods 1-4 &#x2190; Assigned P0-P3</text>

  <rect x="970" y="270" width="145" height="30" rx="3" fill="#1C1917" stroke="#EF4444"/>
  <text x="1042" y="289" font-size="8" font-weight="700" fill="#F87171" text-anchor="middle">Pods 5-8 &#x2190; IDLE!</text>

  <rect x="805" y="315" width="310" height="110" rx="4" fill="#0F172A" stroke="#EF4444"/>
  <text x="815" y="335" font-size="8" font-weight="700" fill="#EF4444">The Idle Consumer Rule:</text>
  <text x="815" y="350" font-size="8" fill="#CBD5E1">In Kafka, a single partition can NEVER be</text>
  <text x="815" y="363" font-size="8" fill="#CBD5E1">consumed by &gt;1 consumer in the SAME group!</text>
  <text x="815" y="380" font-size="8" fill="#FCA5A5">&#x2718; Extra 4 pods waste cloud CPU &amp; RAM without adding any throughput!</text>
  <text x="815" y="405" font-size="8" fill="#34D399">&#x2714; To scale to 8 pods, increase topic partitions to 8 first!</text>

  <!-- Connectors -->
  <path fill="none" d="M 195 190 L 195 230" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>
  <path fill="none" d="M 590 190 L 590 230" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>
  <path fill="none" d="M 960 190 L 960 230" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arr-r)"/>

  <!-- Bottom Invariant -->
  <rect x="50" y="465" width="1080" height="35" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="590" y="487" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Consumer Partition Law: Maximum parallel consumer concurrency for a group is strictly bounded by the number of partitions. Excess consumers sit completely dormant.</text>
</svg>