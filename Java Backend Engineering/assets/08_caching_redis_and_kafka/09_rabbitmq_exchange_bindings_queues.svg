<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1200" height="520" rx="10" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="600" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">RabbitMQ AMQP Architecture: Exchanges, Topic Bindings &amp; Queues</text>
  <text x="600" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">Producers Decoupled from Queues: Publishing to Topic Exchanges with Dot-Delimited Routing Keys (* and # Wildcards)</text>
  <line x1="40" y1="68" x2="1160" y2="68" stroke="#334155" stroke-width="1"/>

  <!-- Producer -->
  <rect x="40" y="105" width="220" height="340" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="40" y="105" width="220" height="30" rx="8" fill="#0C4A6E"/>
  <text x="150" y="125" font-size="11" font-weight="700" fill="#7DD3FC" text-anchor="middle">1. Producer Application</text>

  <rect x="55" y="155" width="190" height="85" rx="6" fill="#1E293B" stroke="#38BDF8"/>
  <text x="150" y="180" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">Event Publisher</text>
  <text x="65" y="202" font-size="9" fill="#CBD5E1">Routing Key:</text>
  <text x="65" y="222" font-size="9" font-family="'JetBrains Mono', monospace" fill="#FDE68A">order.eu.created</text>

  <rect x="55" y="255" width="190" height="170" rx="6" fill="#0F172A" stroke="#334155"/>
  <text x="65" y="280" font-size="10" font-weight="700" fill="#E2E8F0">AMQP Decoupling:</text>
  <text x="65" y="302" font-size="9" fill="#CBD5E1">&#x2022; Producers NEVER publish directly to queues.</text>
  <text x="65" y="325" font-size="9" fill="#CBD5E1">&#x2022; Publishes to Exchange with routing key.</text>
  <text x="65" y="360" font-size="9" fill="#34D399">&#x2714; Zero topology awareness needed by producer.</text>

  <!-- AMQP Topic Exchange -->
  <rect x="330" y="105" width="250" height="340" rx="8" fill="#06201B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="330" y="105" width="250" height="30" rx="8" fill="#064E3B"/>
  <text x="455" y="125" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">2. AMQP Topic Exchange</text>

  <rect x="345" y="155" width="220" height="110" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="455" y="180" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">Exchange: orders.topic</text>
  <text x="355" y="205" font-size="8" fill="#CBD5E1">&#x2022; Evaluates routing pattern</text>
  <text x="355" y="225" font-size="8" fill="#CBD5E1">&#x2022; Inspects bindings &amp; replicates</text>
  <text x="355" y="245" font-size="8" fill="#A7F3D0">&#x2714; Copies message to matching queues</text>

  <rect x="345" y="280" width="220" height="145" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="355" y="305" font-size="10" font-weight="700" fill="#F8FAFC">Wildcard Syntax Rules:</text>
  <text x="355" y="328" font-size="9" font-weight="700" fill="#FDE68A">* (Asterisk):</text>
  <text x="365" y="346" font-size="8" fill="#CBD5E1">Matches exactly ONE word</text>
  <text x="365" y="362" font-size="8" font-family="'JetBrains Mono', monospace" fill="#7DD3FC">order.*.created</text>
  <text x="355" y="385" font-size="9" font-weight="700" fill="#C084FC"># (Hash):</text>
  <text x="365" y="403" font-size="8" fill="#CBD5E1">Matches ZERO or more words</text>
  <text x="365" y="419" font-size="8" font-family="'JetBrains Mono', monospace" fill="#C4B5FD">order.#</text>

  <path fill="none" d="M 260 195 L 330 195" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>

  <!-- Queues Zone -->
  <rect x="650" y="105" width="260" height="340" rx="8" fill="#1C1917" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="650" y="105" width="260" height="30" rx="8" fill="#78350F"/>
  <text x="780" y="125" font-size="11" font-weight="700" fill="#FDE68A" text-anchor="middle">3. Bound Queues</text>

  <!-- Queue 1 -->
  <rect x="665" y="150" width="230" height="80" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
  <text x="780" y="172" font-size="10" font-weight="700" fill="#FBBF24" text-anchor="middle">BillingQueue</text>
  <text x="675" y="195" font-size="8" fill="#CBD5E1">Binding: <tspan font-family="'JetBrains Mono', monospace" fill="#FDE68A">order.*.created</tspan></text>
  <text x="675" y="215" font-size="8" fill="#34D399">&#x2714; Matches: order.eu.created</text>

  <!-- Queue 2 -->
  <rect x="665" y="245" width="230" height="80" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
  <text x="780" y="267" font-size="10" font-weight="700" fill="#FBBF24" text-anchor="middle">WarehouseQueue</text>
  <text x="675" y="290" font-size="8" fill="#CBD5E1">Binding: <tspan font-family="'JetBrains Mono', monospace" fill="#FDE68A">order.#</tspan></text>
  <text x="675" y="310" font-size="8" fill="#34D399">&#x2714; Matches: all order events</text>

  <!-- Queue 3 -->
  <rect x="665" y="340" width="230" height="80" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="780" y="362" font-size="10" font-weight="700" fill="#CBD5E1" text-anchor="middle">AuditQueue</text>
  <text x="675" y="385" font-size="8" fill="#CBD5E1">Binding: <tspan font-family="'JetBrains Mono', monospace" fill="#CBD5E1"># (Global Tap)</tspan></text>
  <text x="675" y="405" font-size="8" fill="#34D399">&#x2714; Copies every message</text>

  <!-- Connectors from Exchange to Queues -->
  <path fill="none" d="M 580 190 L 665 190" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr-a)"/>
  <path fill="none" d="M 580 205 L 620 205 L 620 285 L 665 285" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr-a)"/>
  <path fill="none" d="M 580 220 L 610 220 L 610 380 L 665 380" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr-a)"/>

  <!-- Consumers Zone -->
  <rect x="970" y="105" width="190" height="340" rx="8" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.5"/>
  <rect x="970" y="105" width="190" height="30" rx="8" fill="#4C1D95"/>
  <text x="1065" y="125" font-size="11" font-weight="700" fill="#DDD6FE" text-anchor="middle">4. Consumer Services</text>

  <rect x="985" y="150" width="160" height="80" rx="6" fill="#1E293B" stroke="#8B5CF6"/>
  <text x="1065" y="180" font-size="10" font-weight="700" fill="#C084FC" text-anchor="middle">Billing Service</text>
  <text x="995" y="205" font-size="8" fill="#CBD5E1">Emits invoice PDF</text>

  <rect x="985" y="245" width="160" height="80" rx="6" fill="#1E293B" stroke="#8B5CF6"/>
  <text x="1065" y="275" font-size="10" font-weight="700" fill="#C084FC" text-anchor="middle">Warehouse Service</text>
  <text x="995" y="300" font-size="8" fill="#CBD5E1">Allocates inventory</text>

  <rect x="985" y="340" width="160" height="80" rx="6" fill="#1E293B" stroke="#8B5CF6"/>
  <text x="1065" y="370" font-size="10" font-weight="700" fill="#C084FC" text-anchor="middle">Audit / SIEM</text>
  <text x="995" y="395" font-size="8" fill="#CBD5E1">Compliance archive</text>

  <path fill="none" d="M 895 190 L 985 190" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arr-p)"/>
  <path fill="none" d="M 895 285 L 985 285" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arr-p)"/>
  <path fill="none" d="M 895 380 L 985 380" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arr-p)"/>

  <!-- Bottom Invariant -->
  <rect x="40" y="465" width="1120" height="35" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="600" y="487" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Exchange Routing Invariant: If a message arrives at an exchange with no matching queue bindings, it is silently dropped unless configured with an Alternate Exchange or mandatory=true.</text>
</svg>