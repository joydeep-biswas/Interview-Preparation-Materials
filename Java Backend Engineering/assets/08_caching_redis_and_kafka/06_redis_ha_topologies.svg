<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1180" height="520" rx="10" fill="url(#bg)"/>
  <rect width="1180" height="520" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="590" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">Redis High-Availability Topologies: Sentinel vs. Clustered Sharding</text>
  <text x="590" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">Automatic Master-Replica Failover via Sentinel Quorum vs. 16,384 Hash Slot Horizontal Sharding</text>
  <line x1="40" y1="68" x2="1140" y2="68" stroke="#334155" stroke-width="1"/>

  <!-- Left Side: Redis Sentinel -->
  <rect x="40" y="105" width="530" height="360" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="40" y="105" width="530" height="30" rx="8" fill="#0C4A6E" stroke="#0284C7" stroke-width="1"/>
  <text x="305" y="125" font-size="11" font-weight="700" fill="#7DD3FC" text-anchor="middle">1. Redis Sentinel (Automatic Failover)</text>

  <!-- Sentinel Quorum -->
  <rect x="60" y="150" width="490" height="85" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
  <text x="305" y="172" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">Sentinel Monitor Quorum (3+ Nodes)</text>
  
  <rect x="75" y="185" width="130" height="35" rx="4" fill="#1E293B" stroke="#0284C7"/>
  <text x="140" y="207" font-size="9" fill="#7DD3FC" text-anchor="middle">Sentinel 1</text>

  <rect x="240" y="185" width="130" height="35" rx="4" fill="#1E293B" stroke="#0284C7"/>
  <text x="305" y="207" font-size="9" fill="#7DD3FC" text-anchor="middle">Sentinel 2</text>

  <rect x="405" y="185" width="130" height="35" rx="4" fill="#1E293B" stroke="#0284C7"/>
  <text x="470" y="207" font-size="9" fill="#7DD3FC" text-anchor="middle">Sentinel 3</text>

  <!-- Master and Replica -->
  <rect x="60" y="255" width="230" height="95" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="175" y="280" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">Redis Master (Read / Write)</text>
  <text x="75" y="305" font-size="9" fill="#CBD5E1">&#x2022; Accepts writes from clients</text>
  <text x="75" y="325" font-size="9" fill="#CBD5E1">&#x2022; Async replicates to replica</text>

  <rect x="320" y="255" width="230" height="95" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="435" y="280" font-size="11" font-weight="700" fill="#E2E8F0" text-anchor="middle">Redis Replica (Read-Only)</text>
  <text x="335" y="305" font-size="9" fill="#CBD5E1">&#x2022; Scalable read traffic</text>
  <text x="335" y="325" font-size="9" fill="#34D399">&#x2714; Promoted if master fails</text>

  <path fill="none" d="M 290 300 L 320 300" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="305" y="292" font-size="7" fill="#10B981" text-anchor="middle">Repl</text>

  <!-- Sentinel Heartbeats -->
  <path fill="none" d="M 175 235 L 175 255" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-b)"/>
  <path fill="none" d="M 435 235 L 435 255" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-b)"/>

  <rect x="60" y="365" width="490" height="85" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="75" y="390" font-size="10" font-weight="700" fill="#CBD5E1">Sentinel Architecture Characteristics:</text>
  <text x="75" y="410" font-size="9" fill="#CBD5E1">&#x2022; Quorum agreement (2 of 3) declares Master DOWN (ODOWN)</text>
  <text x="75" y="428" font-size="9" fill="#CBD5E1">&#x2022; Elects leader sentinel via Raft to perform automated failover</text>
  <text x="75" y="443" font-size="8" fill="#FCA5A5">&#x26A0; Single master write throughput bottleneck; limited to single node RAM</text>

  <!-- Right Side: Redis Cluster -->
  <rect x="610" y="105" width="530" height="360" rx="8" fill="#06201B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="610" y="105" width="530" height="30" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="875" y="125" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">2. Redis Cluster (Horizontal Partitioning)</text>

  <!-- Shards (Hash Slots) -->
  <rect x="630" y="150" width="155" height="150" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
  <text x="707" y="175" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">Shard A (Master)</text>
  <text x="640" y="200" font-size="9" fill="#CBD5E1">Hash Slots:</text>
  <text x="640" y="220" font-size="9" font-family="'JetBrains Mono', monospace" fill="#6EE7B7">0 - 5460</text>
  <text x="640" y="245" font-size="8" fill="#94A3B8">&#x2022; Has 1 replica</text>
  <text x="640" y="265" font-size="8" fill="#CBD5E1">&#x2022; Handles keys:</text>
  <text x="640" y="282" font-size="7" font-family="'JetBrains Mono', monospace" fill="#7DD3FC">user:101, cart:22</text>

  <rect x="795" y="150" width="160" height="150" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
  <text x="875" y="175" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">Shard B (Master)</text>
  <text x="805" y="200" font-size="9" fill="#CBD5E1">Hash Slots:</text>
  <text x="805" y="220" font-size="9" font-family="'JetBrains Mono', monospace" fill="#6EE7B7">5461 - 10922</text>
  <text x="805" y="245" font-size="8" fill="#94A3B8">&#x2022; Has 1 replica</text>
  <text x="805" y="265" font-size="8" fill="#CBD5E1">&#x2022; Handles keys:</text>
  <text x="805" y="282" font-size="7" font-family="'JetBrains Mono', monospace" fill="#7DD3FC">order:99, token:5</text>

  <rect x="965" y="150" width="155" height="150" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
  <text x="1042" y="175" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">Shard C (Master)</text>
  <text x="975" y="200" font-size="9" fill="#CBD5E1">Hash Slots:</text>
  <text x="975" y="220" font-size="9" font-family="'JetBrains Mono', monospace" fill="#6EE7B7">10923 - 16383</text>
  <text x="975" y="245" font-size="8" fill="#94A3B8">&#x2022; Has 1 replica</text>
  <text x="975" y="265" font-size="8" fill="#CBD5E1">&#x2022; Handles keys:</text>
  <text x="975" y="282" font-size="7" font-family="'JetBrains Mono', monospace" fill="#7DD3FC">inv:404, rate:88</text>

  <rect x="630" y="315" width="490" height="135" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="645" y="340" font-size="10" font-weight="700" fill="#34D399">Cluster Sharding Mechanics (16,384 Slots):</text>
  <text x="645" y="362" font-size="9" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">Slot = CRC16(key) % 16384</text>
  <text x="645" y="382" font-size="9" fill="#CBD5E1">&#x2022; Clients cache slot map locally; connect directly to responsible node</text>
  <text x="645" y="402" font-size="9" fill="#CBD5E1">&#x2022; If key resides elsewhere: Node returns <tspan font-family="'JetBrains Mono', monospace" fill="#FBBF24">-MOVED slot ip:port</tspan></text>
  <text x="645" y="422" font-size="9" fill="#34D399">&#x2714; Hash Tags guarantee multi-key co-location: <tspan font-family="'JetBrains Mono', monospace" fill="#6EE7B7">{user:101}.profile &amp; {user:101}.orders</tspan></text>

  <!-- Bottom Invariant Banner -->
  <rect x="40" y="480" width="1100" height="25" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="590" y="497" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Selection Rule: Use Sentinel when dataset fits on one machine (&lt;64GB) and operational simplicity is key. Use Redis Cluster when throughput or RAM demands multi-terabyte sharding.</text>
</svg>