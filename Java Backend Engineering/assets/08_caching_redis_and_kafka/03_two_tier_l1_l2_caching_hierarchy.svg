<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#22D3EE"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Base Card -->
  <rect width="1180" height="520" rx="10" fill="url(#bg)"/>
  <rect width="1180" height="520" rx="10" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title &amp; Subtitle Banner -->
  <text x="590" y="32" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5">Two-Tier L1/L2 Caching Pipeline Architecture</text>
  <text x="590" y="54" font-size="11" font-weight="400" fill="#94A3B8" text-anchor="middle">Tier 1 JVM Heap (~50ns) -&gt; Tier 2 Redis Cluster (~1ms) -&gt; Tier 3 Database (~20ms) with Asynchronous Invalidation</text>
  <line x1="40" y1="68" x2="1140" y2="68" stroke="#334155" stroke-width="1"/>

  <!-- App Request Ingress -->
  <rect x="40" y="105" width="180" height="90" rx="6" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <text x="130" y="130" font-size="11" font-weight="700" fill="#7DD3FC" text-anchor="middle">Application Code</text>
  <text x="55" y="155" font-size="9" fill="#CBD5E1">Incoming Read Request</text>
  <text x="55" y="175" font-size="9" font-family="'JetBrains Mono', monospace" fill="#38BDF8">cacheService.get(id)</text>

  <!-- Tier 1: Local In-Memory (Caffeine) -->
  <rect x="270" y="105" width="260" height="340" rx="8" fill="#06201B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="270" y="105" width="260" height="30" rx="8" fill="#064E3B"/>
  <text x="400" y="125" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">Tier 1: Local L1 Cache</text>

  <!-- Decision 1 -->
  <polygon points="400,165 445,195 400,225 355,195" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="400" y="193" font-size="9" font-weight="700" fill="#34D399" text-anchor="middle">L1 Hit?</text>

  <rect x="290" y="245" width="220" height="75" rx="5" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="400" y="270" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">&#x2714; Return L1 Value</text>
  <text x="305" y="292" font-size="8" fill="#CBD5E1">&#x2022; Latency: ~50ns (in-process)</text>
  <text x="305" y="308" font-size="8" fill="#A7F3D0">&#x2022; Resolves 90%+ of hot reads</text>

  <path fill="none" d="M 400 225 L 400 245" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="415" y="238" font-size="8" font-weight="700" fill="#34D399">Yes</text>

  <rect x="290" y="340" width="220" height="85" rx="5" fill="#1E293B" stroke="#334155"/>
  <text x="305" y="365" font-size="9" font-weight="700" fill="#E2E8F0">Caffeine Engine Specs:</text>
  <text x="305" y="385" font-size="8" fill="#94A3B8">&#x2022; Max Size: 10,000 items</text>
  <text x="305" y="402" font-size="8" fill="#94A3B8">&#x2022; ExpireAfterWrite: 60s</text>
  <text x="305" y="418" font-size="8" fill="#94A3B8">&#x2022; TinyLFU eviction algorithm</text>

  <path fill="none" d="M 220 150 L 270 150 L 270 195 L 355 195" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>

  <!-- Tier 2: Distributed (Redis) -->
  <rect x="580" y="105" width="260" height="340" rx="8" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.5"/>
  <rect x="580" y="105" width="260" height="30" rx="8" fill="#4C1D95"/>
  <text x="710" y="125" font-size="11" font-weight="700" fill="#DDD6FE" text-anchor="middle">Tier 2: Distributed L2 Cache</text>

  <!-- Decision 2 -->
  <polygon points="710,165 755,195 710,225 665,195" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="710" y="193" font-size="9" font-weight="700" fill="#C4B5FD" text-anchor="middle">L2 Hit?</text>

  <rect x="600" y="245" width="220" height="75" rx="5" fill="#0F172A" stroke="#8B5CF6" stroke-width="1"/>
  <text x="710" y="270" font-size="10" font-weight="700" fill="#C084FC" text-anchor="middle">&#x2714; Populate L1 &amp; Return</text>
  <text x="615" y="292" font-size="8" fill="#CBD5E1">&#x2022; Latency: ~1.0ms (Redis TCP)</text>
  <text x="615" y="308" font-size="8" fill="#DDD6FE">&#x2022; Warms local L1 for next call</text>

  <path fill="none" d="M 710 225 L 710 245" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arr-p)"/>
  <text x="725" y="238" font-size="8" font-weight="700" fill="#C4B5FD">Yes</text>

  <rect x="600" y="340" width="220" height="85" rx="5" fill="#1E293B" stroke="#334155"/>
  <text x="615" y="365" font-size="9" font-weight="700" fill="#E2E8F0">Redis Cluster Specs:</text>
  <text x="615" y="385" font-size="8" fill="#94A3B8">&#x2022; MaxMemory: allkeys-lru</text>
  <text x="615" y="402" font-size="8" fill="#94A3B8">&#x2022; TTL: 1 hour (with jitter)</text>
  <text x="615" y="418" font-size="8" fill="#94A3B8">&#x2022; Central source across pods</text>

  <!-- L1 Miss to L2 -->
  <path fill="none" d="M 445 195 L 665 195" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr-a)"/>
  <text x="555" y="185" font-size="8" font-weight="700" fill="#FBBF24" text-anchor="middle">L1 Miss</text>

  <!-- Tier 3: Database -->
  <rect x="890" y="105" width="250" height="340" rx="8" fill="#1C1917" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="890" y="105" width="250" height="30" rx="8" fill="#7F1D1D"/>
  <text x="1015" y="125" font-size="11" font-weight="700" fill="#FCA5A5" text-anchor="middle">Tier 3: Database (Truth)</text>

  <rect x="905" y="160" width="220" height="85" rx="5" fill="#0F172A" stroke="#EF4444" stroke-width="1"/>
  <text x="1015" y="185" font-size="10" font-weight="700" fill="#F87171" text-anchor="middle">Database Query</text>
  <text x="920" y="208" font-size="8" fill="#CBD5E1">&#x2022; SQL SELECT on PostgreSQL</text>
  <text x="920" y="225" font-size="8" fill="#FCA5A5">&#x2022; Latency: ~15ms - 50ms (Disk I/O)</text>

  <path fill="none" d="M 755 195 L 905 195" stroke="#EF4444" stroke-width="2" marker-end="url(#arr-r)"/>
  <text x="830" y="185" font-size="8" font-weight="700" fill="#EF4444" text-anchor="middle">L2 Miss</text>

  <rect x="905" y="265" width="220" height="155" rx="5" fill="#1E293B" stroke="#334155"/>
  <text x="920" y="290" font-size="9" font-weight="700" fill="#E2E8F0">Backfill Operations:</text>
  <text x="920" y="312" font-size="8" fill="#34D399">&#x2022; 1. Writes record to L2 (Redis)</text>
  <text x="920" y="332" font-size="8" fill="#34D399">&#x2022; 2. Populates local L1 (Caffeine)</text>
  <text x="920" y="352" font-size="8" fill="#CBD5E1">&#x2022; 3. Returns entity to Caller</text>
  <text x="920" y="380" font-size="8" font-weight="700" fill="#FBBF24">Mutation Invalidation:</text>
  <text x="920" y="400" font-size="7" fill="#FDE68A">On UPDATE: DB writes, updates L2, broadcasts eviction</text>

  <!-- Bottom Invariant Banner -->
  <rect x="40" y="465" width="1100" height="35" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="590" y="487" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Tiered Invariant: Never allow an L1 cache miss to directly hit the database; always traverse L2 first to prevent database connection pool starvation.</text>
</svg>