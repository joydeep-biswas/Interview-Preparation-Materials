<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1200" height="520" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Java Stream Pipeline Lazy Evaluation &amp; Sink Chaining Architecture</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Intermediate Ops Chain Push Sinks (Lazy) -&gt; Terminal Operation Pulls Elements Through Single Pass</text>

  <!-- Left Side: Stage 1 Pipeline Definition -->
  <rect x="50" y="95" width="540" height="380" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="50" y="95" width="540" height="32" rx="8" fill="#0C4A6E"/>
  <text x="320" y="117" font-size="12" font-weight="700" fill="#7DD3FC" text-anchor="middle">Stage 1: Stream Declaration &amp; Lazy Sink Chaining</text>

  <!-- Pipeline Stages -->
  <rect x="70" y="145" width="500" height="60" rx="6" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="85" y="170" font-size="11" font-weight="700" fill="#60A5FA">Data Source: List&lt;Order&gt; (100,000 items)</text>
  <text x="85" y="190" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">orders.stream()</text>

  <rect x="70" y="220" width="500" height="60" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="85" y="245" font-size="11" font-weight="700" fill="#FBBF24">Intermediate Op 1 (Stateless Filter):</text>
  <text x="85" y="265" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">.filter(Order::isPaid)</text>

  <rect x="70" y="295" width="500" height="60" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="85" y="320" font-size="11" font-weight="700" fill="#FBBF24">Intermediate Op 2 (Stateless Map):</text>
  <text x="85" y="340" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">.map(Order::getTotal)</text>

  <rect x="70" y="370" width="500" height="90" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="85" y="395" font-size="11" font-weight="700" fill="#F8FAFC">Lazy Evaluation Rule:</text>
  <text x="85" y="418" font-size="10" fill="#CBD5E1">Calling <tspan font-family="'JetBrains Mono', monospace">filter()</tspan> and <tspan font-family="'JetBrains Mono', monospace">map()</tspan> performs <tspan fill="#F87171" font-weight="700">ZERO</tspan> element processing.</text>
  <text x="85" y="438" font-size="10" fill="#CBD5E1">It merely builds a doubly-linked chain of downstream <tspan fill="#38BDF8" font-weight="700">Sink&lt;T&gt;</tspan> stages.</text>

  <!-- Right Side: Stage 2 Terminal Trigger -->
  <rect x="630" y="95" width="520" height="380" rx="8" fill="#06201B" stroke="#047857" stroke-width="1.5"/>
  <rect x="630" y="95" width="520" height="32" rx="8" fill="#064E3B"/>
  <text x="890" y="117" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">Stage 2: Terminal Evaluation &amp; Element Pushing</text>

  <!-- Terminal Operation -->
  <rect x="650" y="145" width="480" height="75" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="665" y="170" font-size="12" font-weight="700" fill="#34D399">Terminal Trigger: .collect(Collectors.toList())</text>
  <text x="665" y="195" font-size="10" fill="#CBD5E1">&#x2022; Signals pipeline start: <tspan font-family="'JetBrains Mono', monospace">Sink.begin(size)</tspan></text>
  <text x="665" y="210" font-size="10" fill="#CBD5E1">&#x2022; Traverses elements: <tspan font-family="'JetBrains Mono', monospace">Spliterator.forEachRemaining(sink)</tspan></text>

  <!-- Single Pass Fused Execution -->
  <rect x="650" y="235" width="480" height="110" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
  <text x="665" y="260" font-size="11" font-weight="700" fill="#34D399">Loop Fusion &amp; Horizontal Processing:</text>
  <text x="665" y="282" font-size="10" fill="#CBD5E1">Each item travels <tspan fill="#34D399" font-weight="700">HORIZONTALLY</tspan> through all stages in a single pass:</text>
  <text x="665" y="302" font-size="10" font-family="'JetBrains Mono', monospace" fill="#A7F3D0">Item 1: isPaid? -> Yes -> getTotal -> Collect</text>
  <text x="665" y="322" font-size="10" font-family="'JetBrains Mono', monospace" fill="#FCA5A5">Item 2: isPaid? -> No  -> DROPPED (never calls map!)</text>

  <!-- Performance Takeaway -->
  <rect x="650" y="360" width="480" height="100" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="665" y="385" font-size="11" font-weight="700" fill="#F8FAFC">Performance Invariants:</text>
  <text x="665" y="408" font-size="10" fill="#CBD5E1">&#x2022; <tspan fill="#34D399" font-weight="700">No Intermediate Collections:</tspan> Zero intermediate ArrayList buffers</text>
  <text x="665" y="428" font-size="10" fill="#CBD5E1">&#x2022; <tspan fill="#34D399" font-weight="700">Short-Circuiting:</tspan> findFirst() halts stream after 1st match</text>
  <text x="665" y="446" font-size="9" fill="#94A3B8">High CPU cache retention: item stays in L1 cache across all pipeline steps</text>

  <!-- Connectors from Left to Right -->
  <path fill="none" d="M 570.0 250.0 L 580.0 250.0 C 608.0 250.0, 608.0 180.0, 636.0 180.0 L 650.0 180.0" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>
  <rect x="575" y="200" width="80" height="22" rx="3" fill="#0B132B" stroke="#10B981" stroke-width="1"/>
  <text x="615" y="215" font-size="8" font-weight="700" fill="#6EE7B7" text-anchor="middle">Triggers Pull</text>
</svg>