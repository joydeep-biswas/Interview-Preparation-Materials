<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="500" viewBox="0 0 1180 500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1180" height="500" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Single Abstract Method (SAM) Contract &amp; Functional Interfaces</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">@FunctionalInterface Rules: Exactly 1 Abstract Method + Allowed Default, Static &amp; Object Methods</text>

  <!-- Left: Interface Definition -->
  <rect x="50" y="95" width="530" height="375" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="50" y="95" width="530" height="32" rx="8" fill="#0C4A6E"/>
  <text x="315" y="117" font-size="12" font-weight="700" fill="#7DD3FC" text-anchor="middle">&lt;&lt;@FunctionalInterface&gt;&gt; Anatomy</text>

  <!-- Annotation -->
  <rect x="70" y="145" width="490" height="50" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="85" y="167" font-size="11" font-family="'JetBrains Mono', monospace" fill="#FBBF24">@FunctionalInterface</text>
  <text x="85" y="183" font-size="10" font-family="'JetBrains Mono', monospace" fill="#38BDF8">public interface CryptoTransformer&lt;T, R&gt; {</text>

  <!-- 1. The SAM Method -->
  <rect x="70" y="205" width="490" height="75" rx="4" fill="#06201B" stroke="#10B981" stroke-width="1.5"/>
  <text x="85" y="228" font-size="11" font-weight="700" fill="#34D399">1. The Single Abstract Method (SAM):</text>
  <text x="85" y="248" font-size="11" font-family="'JetBrains Mono', monospace" fill="#F8FAFC">R transform(T rawInput); // EXACTLY ONE ABSTRACT METHOD</text>
  <text x="85" y="268" font-size="10" fill="#A7F3D0">Target for lambda expressions: (input) -&gt; compute(input)</text>

  <!-- 2. Default &amp; Static Methods -->
  <rect x="70" y="290" width="490" height="95" rx="4" fill="#1E293B" stroke="#0284C7" stroke-width="1"/>
  <text x="85" y="312" font-size="11" font-weight="700" fill="#7DD3FC">2. Allowed Supporting Methods (Zero Impact on SAM):</text>
  <text x="85" y="332" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">default void log(T val) { System.out.println(val); }</text>
  <text x="85" y="350" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">static &lt;T&gt; CryptoTransformer&lt;T, T&gt; identity() { return t -&gt; t; }</text>
  <text x="85" y="370" font-size="9" fill="#94A3B8">Interfaces can declare unlimited default and static methods with bodies</text>

  <!-- Closing brace -->
  <text x="70" y="405" font-size="11" font-family="'JetBrains Mono', monospace" fill="#38BDF8">}</text>

  <rect x="70" y="415" width="490" height="45" rx="4" fill="#0F172A" stroke="#334155" stroke-dasharray="2 2"/>
  <text x="85" y="435" font-size="10" fill="#CBD5E1">Object Class Methods: <tspan font-family="'JetBrains Mono', monospace" fill="#94A3B8">boolean equals(Object)</tspan> does not count as abstract!</text>

  <!-- Right: Lambda Binding &amp; invokedynamic -->
  <rect x="620" y="95" width="510" height="375" rx="8" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.5"/>
  <rect x="620" y="95" width="510" height="32" rx="8" fill="#4C1D95"/>
  <text x="875" y="117" font-size="12" font-weight="700" fill="#C4B5FD" text-anchor="middle">Lambda Binding &amp; invokedynamic Runtime Resolution</text>

  <!-- Lambda Expression -->
  <rect x="640" y="145" width="470" height="85" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="655" y="170" font-size="11" font-weight="700" fill="#A78BFA">Call Site Lambda Assignment:</text>
  <text x="655" y="195" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">CryptoTransformer&lt;String, String&gt; t = s -&gt; s.toUpperCase();</text>
  <text x="655" y="215" font-size="10" fill="#94A3B8">Target type inferred from SAM parameter (T) and return type (R)</text>

  <!-- invokedynamic details -->
  <rect x="640" y="245" width="470" height="215" rx="6" fill="#1E293B" stroke="#8B5CF6" stroke-width="1"/>
  <text x="655" y="270" font-size="12" font-weight="700" fill="#C4B5FD">Bytecode: invokedynamic (INDY)</text>
  <text x="655" y="295" font-size="10" fill="#CBD5E1">&#x2022; <tspan font-weight="700" fill="#F8FAFC">No anonymous inner class generation:</tspan> Lambdas do NOT generate</text>
  <text x="670" y="312" font-size="10" fill="#CBD5E1"><tspan font-family="'JetBrains Mono', monospace">MyClass$$Lambda$1.class</tspan> files on disk at compile-time!</text>
  
  <text x="655" y="335" font-size="10" fill="#CBD5E1">&#x2022; <tspan font-weight="700" fill="#F8FAFC">LambdaMetafactory Bootstrap:</tspan> On first execution,</text>
  <text x="670" y="352" font-size="10" fill="#CBD5E1">JVM dynamically links the call site to an in-memory method handle.</text>

  <text x="655" y="375" font-size="10" fill="#CBD5E1">&#x2022; <tspan font-weight="700" fill="#F8FAFC">Performance Benefit:</tspan> Zero classloader disk I/O overhead;</text>
  <text x="670" y="392" font-size="10" fill="#CBD5E1">allows JIT compiler to inline lambda body directly into the call site.</text>
  
  <rect x="655" y="410" width="440" height="35" rx="4" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
  <text x="670" y="432" font-size="10" font-weight="600" fill="#34D399">&#x2714; Clean SAM contract guarantees seamless INDY bytecode generation.</text>

  <!-- Connector Left to Right -->
  <path fill="none" d="M 580 240 L 640 240" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arr-p)"/>
  <rect x="585" y="228" width="50" height="22" rx="3" fill="#0B132B" stroke="#8B5CF6" stroke-width="1"/>
  <text x="610" y="243" font-size="9" font-weight="700" fill="#C4B5FD" text-anchor="middle">INDY</text>
</svg>