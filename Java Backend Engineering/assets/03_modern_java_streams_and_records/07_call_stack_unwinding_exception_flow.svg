<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1200" height="520" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">JVM Call Stack Unwinding &amp; Exception Propagation Mechanics</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Stack Frame Push on Method Invocation -&gt; Exception Throw -&gt; Frame Pop Unwinding Until Handler Found</text>

  <!-- Top: Invocation Flow (Push Phase) -->
  <rect x="50" y="95" width="1100" height="185" rx="8" fill="#0B132B" stroke="#0284C7" stroke-width="1.5"/>
  <rect x="50" y="95" width="1100" height="30" rx="8" fill="#0C4A6E" stroke="#0284C7" stroke-width="1"/>
  <text x="600" y="116" font-size="12" font-weight="700" fill="#7DD3FC" text-anchor="middle">Phase 1: Method Invocation (Stack Frame Push: Left -&gt; Right)</text>

  <!-- Frame 1: main() -->
  <rect x="75" y="140" width="280" height="120" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="215" y="165" font-size="12" font-weight="700" fill="#60A5FA" text-anchor="middle">Stack Frame 1: main()</text>
  <text x="90" y="190" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">try {</text>
  <text x="100" y="208" font-size="10" font-family="'JetBrains Mono', monospace" fill="#FBBF24">  processOrder(order);</text>
  <text x="90" y="226" font-size="10" font-family="'JetBrains Mono', monospace" fill="#34D399">} catch (ArithmeticException e) {</text>
  <text x="100" y="244" font-size="10" font-family="'JetBrains Mono', monospace" fill="#34D399">  log.error("Recovered: " + e);</text>
  <text x="90" y="258" font-size="10" font-family="'JetBrains Mono', monospace" fill="#34D399">}</text>

  <!-- Frame 2: processOrder() -->
  <rect x="440" y="140" width="280" height="120" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="580" y="165" font-size="12" font-weight="700" fill="#60A5FA" text-anchor="middle">Stack Frame 2: processOrder()</text>
  <text x="455" y="195" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">void processOrder(Order o) {</text>
  <text x="465" y="218" font-size="10" font-family="'JetBrains Mono', monospace" fill="#FBBF24">  double tax = calculateTax(o);</text>
  <text x="465" y="238" font-size="9" fill="#94A3B8">// No try-catch handler here</text>
  <text x="455" y="254" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">}</text>

  <!-- Frame 3: calculateTax() -->
  <rect x="805" y="140" width="320" height="120" rx="6" fill="#1C1917" stroke="#EF4444" stroke-width="1.5"/>
  <text x="965" y="165" font-size="12" font-weight="700" fill="#F87171" text-anchor="middle">Stack Frame 3: calculateTax() [ORIGIN]</text>
  <text x="820" y="195" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">double calculateTax(Order o) {</text>
  <text x="830" y="218" font-size="10" font-family="'JetBrains Mono', monospace" fill="#F87171">  return total / rate; // rate == 0!</text>
  <text x="830" y="238" font-size="10" font-weight="700" fill="#EF4444">throws ArithmeticException("/ by zero")</text>
  <text x="820" y="254" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">}</text>

  <!-- Push Arrows -->
  <path fill="none" d="M 355 200 L 440 200" stroke="#3B82F6" stroke-width="2" marker-end="url(#arr-b)"/>
  <path fill="none" d="M 720 200 L 805 200" stroke="#3B82F6" stroke-width="2" marker-end="url(#arr-b)"/>

  <!-- Bottom: Unwinding Flow (Pop Phase) -->
  <rect x="50" y="300" width="1100" height="160" rx="8" fill="#1C1917" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="50" y="300" width="1100" height="30" rx="8" fill="#7F1D1D" stroke="#EF4444" stroke-width="1"/>
  <text x="600" y="321" font-size="12" font-weight="700" fill="#FCA5A5" text-anchor="middle">Phase 2: Exception Propagation &amp; Stack Unwinding (Frame Pop: Right -&gt; Left)</text>

  <!-- Unwind Step 3 -->
  <rect x="805" y="345" width="320" height="95" rx="6" fill="#0F172A" stroke="#EF4444" stroke-width="1"/>
  <text x="820" y="370" font-size="11" font-weight="700" fill="#F87171">1. Frame 3 Popped</text>
  <text x="820" y="390" font-size="10" fill="#CBD5E1">No catch handler in calculateTax()</text>
  <text x="820" y="408" font-size="10" fill="#FCA5A5">Stack Frame 3 is POPPED and destroyed</text>
  <text x="820" y="425" font-size="9" fill="#94A3B8">Exception propagates up to caller</text>

  <!-- Unwind Step 2 -->
  <rect x="440" y="345" width="280" height="95" rx="6" fill="#0F172A" stroke="#EF4444" stroke-width="1"/>
  <text x="455" y="370" font-size="11" font-weight="700" fill="#F87171">2. Frame 2 Popped</text>
  <text x="455" y="390" font-size="10" fill="#CBD5E1">No catch handler in processOrder()</text>
  <text x="455" y="408" font-size="10" fill="#FCA5A5">Stack Frame 2 is POPPED and destroyed</text>
  <text x="455" y="425" font-size="9" fill="#94A3B8">Exception continues propagation</text>

  <!-- Unwind Step 1: Caught! -->
  <rect x="75" y="345" width="280" height="95" rx="6" fill="#06201B" stroke="#10B981" stroke-width="2"/>
  <text x="90" y="370" font-size="11" font-weight="700" fill="#34D399">3. Handler Matched in main()!</text>
  <text x="90" y="390" font-size="10" fill="#CBD5E1">catch(ArithmeticException) matched</text>
  <text x="90" y="408" font-size="10" font-weight="700" fill="#6EE7B7">Unwinding HALTS. Normal flow resumes!</text>
  <text x="90" y="425" font-size="9" fill="#A7F3D0">main() thread survives and handles error</text>

  <!-- Pop Arrows (Right to Left) -->
  <path fill="none" d="M 805 392 L 720 392" stroke="#EF4444" stroke-width="2" marker-end="url(#arr-r)"/>
  <path fill="none" d="M 440 392 L 355 392" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- Bottom Invariant -->
  <rect x="50" y="475" width="1100" height="35" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="600" y="497" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Performance Note: Throwable.fillInStackTrace() traverses native execution frames. Throwing exceptions for flow control is an antipattern.</text>
</svg>