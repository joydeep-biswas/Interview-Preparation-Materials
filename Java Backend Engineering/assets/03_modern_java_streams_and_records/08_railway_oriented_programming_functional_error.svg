<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="520" viewBox="0 0 1220 520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1220" height="520" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Functional Error Handling &amp; Railway-Oriented Programming (ROP)</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Success Track (Happy Path) vs. Failure Track (Short-Circuit Domain Egress without Exceptions)</text>

  <!-- Success Track Container -->
  <rect x="50" y="95" width="1120" height="165" rx="8" fill="#06201B" stroke="#047857" stroke-width="1.5"/>
  <rect x="50" y="95" width="1120" height="30" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="610" y="116" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">Success Track: Happy Path Pipeline (Result.success)</text>

  <!-- Step 0: Input Request -->
  <rect x="75" y="145" width="160" height="85" rx="6" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="155" y="170" font-size="11" font-weight="700" fill="#60A5FA" text-anchor="middle">Input Request</text>
  <text x="85" y="195" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">OrderCommand</text>
  <text x="85" y="215" font-size="9" fill="#94A3B8">Payload arrives</text>

  <!-- Step 1: Validate -->
  <rect x="300" y="145" width="180" height="85" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="390" y="170" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">1. Validate Payload</text>
  <text x="315" y="195" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">validate(cmd)</text>
  <text x="315" y="215" font-size="9" fill="#A7F3D0">&#x2714; Passes schema &amp; rules</text>

  <!-- Step 2: Payment -->
  <rect x="550" y="145" width="180" height="85" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="640" y="170" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">2. Charge Payment</text>
  <text x="565" y="195" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">charge(card)</text>
  <text x="565" y="215" font-size="9" fill="#A7F3D0">&#x2714; Gateway approved</text>

  <!-- Step 3: Kafka -->
  <rect x="800" y="145" width="180" height="85" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="890" y="170" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">3. Emit Order Event</text>
  <text x="815" y="195" font-size="10" font-family="'JetBrains Mono', monospace" fill="#CBD5E1">publish(event)</text>
  <text x="815" y="215" font-size="9" fill="#A7F3D0">&#x2714; Kafka ACK</text>

  <!-- Final Success -->
  <rect x="1030" y="145" width="120" height="85" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
  <text x="1090" y="170" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">HTTP 201</text>
  <text x="1090" y="195" font-size="10" fill="#F8FAFC" text-anchor="middle">Created</text>
  <text x="1090" y="215" font-size="9" fill="#6EE7B7" text-anchor="middle">Response</text>

  <!-- Green Success Track Arrows -->
  <path fill="none" d="M 235 187 L 300 187" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>
  <path fill="none" d="M 480 187 L 550 187" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>
  <path fill="none" d="M 730 187 L 800 187" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>
  <path fill="none" d="M 980 187 L 1030 187" stroke="#10B981" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- Failure Track Container -->
  <rect x="50" y="280" width="1120" height="165" rx="8" fill="#1C1917" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="50" y="280" width="1120" height="30" rx="8" fill="#7F1D1D" stroke="#EF4444" stroke-width="1"/>
  <text x="610" y="301" font-size="12" font-weight="700" fill="#FCA5A5" text-anchor="middle">Failure Track: Railway Switch &amp; Short-Circuit Egress (Result.failure)</text>

  <!-- Error 1 -->
  <rect x="300" y="325" width="180" height="85" rx="6" fill="#0F172A" stroke="#EF4444" stroke-width="1.5"/>
  <text x="390" y="350" font-size="11" font-weight="700" fill="#F87171" text-anchor="middle">Validation Error</text>
  <text x="315" y="375" font-size="10" font-family="'JetBrains Mono', monospace" fill="#FCA5A5">HTTP 400 Bad Request</text>
  <text x="315" y="395" font-size="9" fill="#94A3B8">Missing required field</text>

  <!-- Error 2 -->
  <rect x="550" y="325" width="180" height="85" rx="6" fill="#0F172A" stroke="#EF4444" stroke-width="1.5"/>
  <text x="640" y="350" font-size="11" font-weight="700" fill="#F87171" text-anchor="middle">Payment Charge Error</text>
  <text x="565" y="375" font-size="10" font-family="'JetBrains Mono', monospace" fill="#FCA5A5">HTTP 422 Unprocessable</text>
  <text x="565" y="395" font-size="9" fill="#94A3B8">Card declined / fraud</text>

  <!-- Short Circuit Terminal -->
  <rect x="800" y="325" width="350" height="85" rx="6" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="2"/>
  <text x="975" y="350" font-size="12" font-weight="700" fill="#C4B5FD" text-anchor="middle">Short-Circuit Error Egress (Bypasses Pipeline)</text>
  <text x="820" y="375" font-size="10" fill="#CBD5E1">Downstream steps (Payment, Kafka) are <tspan fill="#F87171" font-weight="700">NEVER</tspan> executed.</text>
  <text x="820" y="395" font-size="10" fill="#34D399">&#x2714; Zero exception throwing overhead. Deterministic monad flow!</text>

  <!-- Railway Switch Diverter Arrows -->
  <path fill="none" d="M 390 230 L 390 325" stroke="#EF4444" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arr-r)"/>
  <path fill="none" d="M 640 230 L 640 325" stroke="#EF4444" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arr-r)"/>

  <!-- Failure Track Flow Arrows -->
  <path fill="none" d="M 480 367 L 550 367" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <path fill="none" d="M 730 367 L 800 367" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arr-p)"/>

  <!-- Bottom Invariant -->
  <rect x="50" y="465" width="1120" height="40" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="610" y="490" font-size="10" font-weight="600" fill="#93C5FD" text-anchor="middle">Railway Model: Represented via Result&lt;Success, Failure&gt; or Either&lt;L, R&gt;. Functions bind to the success track; errors switch tracks automatically.</text>
</svg>