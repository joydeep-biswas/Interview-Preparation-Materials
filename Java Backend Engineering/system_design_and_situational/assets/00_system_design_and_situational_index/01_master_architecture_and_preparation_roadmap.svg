<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 370" width="100%" height="100%">
    <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <text x="550" y="32" class="title" font-size="19" text-anchor="middle">Java Backend System Design: Master Architecture &amp; Preparation Roadmap</text>
  <text x="550" y="52" class="subtitle" text-anchor="middle">Four-phase curriculum progression from distributed fundamentals to high-scale architecture, LLD, and incident leadership</text>

  <!-- Pillar 1 -->
  <g transform="translate(30, 75)">
    <rect width="240" height="260" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="240" height="34" rx="10" ry="10" fill="#1E3A8A"/>
    <text x="120" y="22" class="card-title" fill="#93C5FD" text-anchor="middle">Phase 1: Foundations (01)</text>
    <text x="16" y="56" class="card-body" font-weight="600" fill="#60A5FA">• Scalability Primitives (H/V)</text>
    <text x="16" y="78" class="card-body">• CAP &amp; PACELC Theorems</text>
    <text x="16" y="100" class="card-body">• Raft Consensus &amp; 2PC</text>
    <text x="16" y="122" class="card-body">• B+ Trees vs LSM Trees</text>
    <text x="16" y="144" class="card-body">• Consistent Hashing &amp; Rings</text>
    <text x="16" y="166" class="card-body">• Caching Topologies (L1/L2)</text>
    <text x="16" y="188" class="card-body">• Resilience4j Circuit Breakers</text>
    <text x="16" y="210" class="card-body">• Distributed Tracing &amp; Metrics</text>
    <rect x="16" y="226" width="208" height="22" rx="4" ry="4" fill="#1E293B"/>
    <text x="120" y="241" class="badge" fill="#93C5FD" text-anchor="middle">Distributed Fundamentals</text>
  </g>

  <!-- Pillar 2 -->
  <g transform="translate(300, 75)">
    <rect width="240" height="260" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="240" height="34" rx="10" ry="10" fill="#064E3B"/>
    <text x="120" y="22" class="card-title" fill="#A7F3D0" text-anchor="middle">Phase 2: High-Level HLD (02)</text>
    <text x="16" y="56" class="card-body" font-weight="600" fill="#34D399">• URL Shortener &amp; Key Gen (KGS)</text>
    <text x="16" y="78" class="card-body">• Twitter Snowflake 64-bit ID</text>
    <text x="16" y="100" class="card-body">• Distributed Notification Engine</text>
    <text x="16" y="122" class="card-body">• 50,000 TPS Idempotent Payments</text>
    <text x="16" y="144" class="card-body">• Flash Sale 2-Tier Inventory</text>
    <text x="16" y="166" class="card-body">• Sliding Window Rate Limiter</text>
    <text x="16" y="188" class="card-body">• Real-Time Chat (WebSocket/Netty)</text>
    <text x="16" y="210" class="card-body">• Strangler Fig Mainframe Migration</text>
    <rect x="16" y="226" width="208" height="22" rx="4" ry="4" fill="#1E293B"/>
    <text x="120" y="241" class="badge" fill="#A7F3D0" text-anchor="middle">Enterprise System Models</text>
  </g>

  <!-- Pillar 3 -->
  <g transform="translate(570, 75)">
    <rect width="240" height="260" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="240" height="34" rx="10" ry="10" fill="#78350F"/>
    <text x="120" y="22" class="card-title" fill="#FDE68A" text-anchor="middle">Phase 3: Low-Level LLD (03)</text>
    <text x="16" y="56" class="card-body" font-weight="600" fill="#FBBF24">• Java Memory Model &amp; Happens-Before</text>
    <text x="16" y="78" class="card-body">• ReentrantLock &amp; CAS Registers</text>
    <text x="16" y="100" class="card-body">• Lock-Free CAS Ring Buffers</text>
    <text x="16" y="122" class="card-body">• Sliding Window Deduplication</text>
    <text x="16" y="144" class="card-body">• Custom Thread Pools &amp; Stealing</text>
    <text x="16" y="166" class="card-body">• Spotify State Design Pattern</text>
    <text x="16" y="188" class="card-body">• Parking Garage Multi-Floor LLD</text>
    <text x="16" y="210" class="card-body">• Cache Eviction Strategies (LRU/LFU)</text>
    <rect x="16" y="226" width="208" height="22" rx="4" ry="4" fill="#1E293B"/>
    <text x="120" y="241" class="badge" fill="#FDE68A" text-anchor="middle">Concurrency &amp; OOP Patterns</text>
  </g>

  <!-- Pillar 4 -->
  <g transform="translate(840, 75)">
    <rect width="240" height="260" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="240" height="34" rx="10" ry="10" fill="#4C1D95"/>
    <text x="120" y="22" class="card-title" fill="#DDD6FE" text-anchor="middle">Phase 4: Situational (04)</text>
    <text x="16" y="56" class="card-body" font-weight="600" fill="#A78BFA">• Sev-1 Incident Commander Protocol</text>
    <text x="16" y="78" class="card-body">• Thread Pool Exhaustion Triage</text>
    <text x="16" y="100" class="card-body">• JVM Heap &amp; Metaspace Leak Triage</text>
    <text x="16" y="122" class="card-body">• Distributed Deadlock Detection</text>
    <text x="16" y="144" class="card-body">• Zero-Downtime Expand-Contract DB</text>
    <text x="16" y="166" class="card-body">• Cross-Team Engineering Conflicts</text>
    <text x="16" y="188" class="card-body">• Technical Debt vs Feature Velocity</text>
    <text x="16" y="210" class="card-body">• Cloud Cost Governance (FinOps)</text>
    <rect x="16" y="226" width="208" height="22" rx="4" ry="4" fill="#1E293B"/>
    <text x="120" y="241" class="badge" fill="#DDD6FE" text-anchor="middle">Leadership &amp; Incident Triage</text>
  </g>

  <!-- Runway Connectors -->
  <path d="M 270 205 L 288 205 L 300 205" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M 540 205 L 558 205 L 570 205" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  <path d="M 810 205 L 828 205 L 840 205" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
</svg>