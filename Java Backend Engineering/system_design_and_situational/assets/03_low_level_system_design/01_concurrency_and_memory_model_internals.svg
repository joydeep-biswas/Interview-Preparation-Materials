<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" width="100%" height="100%">
    <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>
  <rect width="100%" height="100%" fill="url(#bg-grad)"  rx="10" stroke="#1F2937" stroke-width="1.5"/>
  <text x="550" y="32" class="title" font-size="19" text-anchor="middle">Object-Oriented Concurrency &amp; Java Memory Model Internals</text>
  <text x="550" y="52" class="subtitle" text-anchor="middle">Thread interaction, ReentrantLock &amp; CAS primitives, cache-padded ring buffers, and work-stealing execution</text>

  <!-- Client Layer -->
  <g transform="translate(30, 75)">
    <rect width="230" height="280" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="230" height="34" rx="10" ry="10" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
    <text x="115" y="22" class="card-title" fill="#93C5FD" text-anchor="middle">1. Worker Ingress</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#60A5FA">• Concurrent Worker Threads:</text>
    <text x="24" y="78" class="card-body">  - Publishers, Readers, Schedulers</text>
    <text x="24" y="98" class="card-body">  - Carrier threads &amp; Virtual threads</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#60A5FA">• Java Memory Model (JMM):</text>
    <text x="24" y="146" class="card-body">  - Happens-before guarantees</text>
    <text x="24" y="166" class="card-body">  - volatile read/write fences</text>
    <text x="24" y="186" class="card-body">  - CPU cache coherency (MESI)</text>
    <rect x="16" y="244" width="198" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="115" y="259" class="badge" fill="#93C5FD" text-anchor="middle">Thread Scheduling</text>
  </g>

  <!-- Synchronization Tier -->
  <g transform="translate(290, 75)">
    <rect width="245" height="280" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="245" height="34" rx="10" ry="10" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="122" y="22" class="card-title" fill="#A7F3D0" text-anchor="middle">2. Synchronization Tier</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#34D399">• Locks &amp; Conditions:</text>
    <text x="24" y="78" class="card-body">  - ReentrantLock &amp; ReadWriteLock</text>
    <text x="24" y="98" class="card-body">  - Fair vs Non-Fair tryLock()</text>
    <text x="24" y="118" class="card-body">  - Conditions: notEmpty, notFull</text>
    <text x="16" y="146" class="card-body" font-weight="600" fill="#34D399">• Lock-Free CAS Registers:</text>
    <text x="24" y="166" class="card-body">  - AtomicInteger, AtomicReference</text>
    <text x="24" y="186" class="card-body">  - VarHandle atomic intrinsics</text>
    <text x="24" y="206" class="card-body">  - StampedLock optimistic reads</text>
    <rect x="16" y="244" width="213" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="122" y="259" class="badge" fill="#A7F3D0" text-anchor="middle">CAS &amp; Mutual Exclusion</text>
  </g>

  <!-- Data Structures Tier -->
  <g transform="translate(565, 75)">
    <rect width="240" height="280" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="240" height="34" rx="10" ry="10" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
    <text x="120" y="22" class="card-title" fill="#FDE68A" text-anchor="middle">3. Memory Structures</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#FBBF24">• LMAX Disruptor Ring:</text>
    <text x="24" y="78" class="card-body">  - Circular array with CAS barrier</text>
    <text x="24" y="98" class="card-body">  - False sharing cache-padding</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#FBBF24">• Concurrent Collections:</text>
    <text x="24" y="146" class="card-body">  - ConcurrentHashMap (Lock striping)</text>
    <text x="24" y="166" class="card-body">  - CopyOnWriteArrayList (Safe reads)</text>
    <text x="16" y="194" class="card-body" font-weight="600" fill="#FBBF24">• Zero GC Buffers:</text>
    <text x="24" y="214" class="card-body">  - DirectByteBuffers (Off-heap)</text>
    <rect x="16" y="244" width="208" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="120" y="259" class="badge" fill="#FDE68A" text-anchor="middle">High-Throughput Storage</text>
  </g>

  <!-- Thread Pools & Execution -->
  <g transform="translate(835, 75)">
    <rect width="235" height="280" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="235" height="34" rx="10" ry="10" fill="#4C1D95" stroke="#8B5CF6" stroke-width="1"/>
    <text x="117" y="22" class="card-title" fill="#DDD6FE" text-anchor="middle">4. Thread Pools &amp; Stealing</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#A78BFA">• Custom ThreadPoolExecutor:</text>
    <text x="24" y="78" class="card-body">  - Core vs Max pool configuration</text>
    <text x="24" y="98" class="card-body">  - Bounded ArrayBlockingQueue</text>
    <text x="24" y="118" class="card-body">  - CallerRunsPolicy backpressure</text>
    <text x="16" y="146" class="card-body" font-weight="600" fill="#A78BFA">• ForkJoinPool Work-Stealing:</text>
    <text x="24" y="166" class="card-body">  - Deque per worker thread</text>
    <text x="24" y="186" class="card-body">  - Idle workers steal from tails</text>
    <text x="16" y="214" class="card-body" font-weight="600" fill="#A78BFA">• Java 21 Virtual Threads</text>
    <rect x="16" y="244" width="203" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="117" y="259" class="badge" fill="#DDD6FE" text-anchor="middle">Work-Stealing Architecture</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 260 215 L 278 215 L 290 215" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M 535 215 L 553 215 L 565 215" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  <path d="M 805 215 L 823 215 L 835 215" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
</svg>