<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="100%">
    <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <text x="550" y="30" class="title" font-size="19" text-anchor="middle">Spotify Music Player: State Design Pattern &amp; Domain Model</text>
  <text x="550" y="50" class="subtitle" text-anchor="middle">Object-Oriented LLD: State Pattern decouples player context from playback transitions (Playing, Paused, Stopped)</text>

  <!-- Context: MusicPlayer -->
  <g transform="translate(40, 80)">
    <rect width="270" height="210" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="270" height="32" rx="10" ry="10" fill="#1E3A8A"/>
    <text x="135" y="21" class="card-title" fill="#93C5FD" text-anchor="middle">MusicPlayer (Context)</text>
    
    <text x="16" y="54" class="card-body" font-weight="700" fill="#93C5FD">- currentState : PlaybackState</text>
    <text x="16" y="74" class="card-body" font-weight="700" fill="#93C5FD">- currentQueue : Playlist</text>
    <text x="16" y="94" class="card-body" font-weight="700" fill="#93C5FD">- currentTrack : Track</text>
    <line x1="16" y1="104" x2="254" y2="104" stroke="#4B5563" stroke-width="1"/>
    
    <text x="16" y="124" class="card-body">+ play() : void</text>
    <text x="16" y="144" class="card-body">+ pause() : void</text>
    <text x="16" y="164" class="card-body">+ next() : void</text>
    <text x="16" y="184" class="card-body">+ setState(PlaybackState state) : void</text>
    <rect x="16" y="192" width="238" height="10" rx="2" ry="2" fill="#1E293B"/>
  </g>

  <!-- Interface: PlaybackState -->
  <g transform="translate(410, 80)">
    <rect width="280" height="150" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="280" height="32" rx="10" ry="10" fill="#064E3B"/>
    <text x="140" y="21" class="card-title" fill="#A7F3D0" text-anchor="middle">&lt;&lt;interface&gt;&gt; PlaybackState</text>
    
    <text x="16" y="58" class="card-body" font-weight="600" fill="#34D399">+ play(MusicPlayer player) : void</text>
    <text x="16" y="82" class="card-body" font-weight="600" fill="#34D399">+ pause(MusicPlayer player) : void</text>
    <text x="16" y="106" class="card-body" font-weight="600" fill="#34D399">+ next(MusicPlayer player) : void</text>
    <rect x="16" y="122" width="248" height="18" rx="3" ry="3" fill="#1E293B"/>
    <text x="140" y="135" class="badge" fill="#A7F3D0" text-anchor="middle">Encapsulates State Behaviors</text>
  </g>

  <!-- Concrete State 1: PlayingState -->
  <g transform="translate(760, 80)">
    <rect width="290" height="110" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
    <rect width="290" height="28" rx="10" ry="10" fill="#064E3B"/>
    <text x="145" y="19" class="card-title" fill="#A7F3D0" text-anchor="middle">PlayingState</text>
    <text x="14" y="48" class="card-body">+ play() : void (noop)</text>
    <text x="14" y="68" class="card-body">+ pause() : void -&gt; setState(PausedState)</text>
    <text x="14" y="88" class="card-body">+ next() : void -&gt; playNextTrack()</text>
  </g>

  <!-- Concrete State 2: PausedState -->
  <g transform="translate(760, 205)">
    <rect width="290" height="110" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
    <rect width="290" height="28" rx="10" ry="10" fill="#78350F"/>
    <text x="145" y="19" class="card-title" fill="#FDE68A" text-anchor="middle">PausedState</text>
    <text x="14" y="48" class="card-body">+ play() : void -&gt; setState(PlayingState)</text>
    <text x="14" y="68" class="card-body">+ pause() : void (noop)</text>
    <text x="14" y="88" class="card-body">+ next() : void -&gt; playNextTrack()</text>
  </g>

  <!-- Concrete State 3: StoppedState -->
  <g transform="translate(760, 330)">
    <rect width="290" height="110" rx="10" ry="10" fill="#111827" stroke="#EF4444" stroke-width="1.5"/>
    <rect width="290" height="28" rx="10" ry="10" fill="#7F1D1D"/>
    <text x="145" y="19" class="card-title" fill="#FCA5A5" text-anchor="middle">StoppedState</text>
    <text x="14" y="48" class="card-body">+ play() : void -&gt; setState(PlayingState)</text>
    <text x="14" y="68" class="card-body">+ pause() : void (noop)</text>
    <text x="14" y="88" class="card-body">+ next() : void (noop)</text>
  </g>

  <!-- Playlist & Track Domain Model (Bottom Left) -->
  <g transform="translate(40, 310)">
    <rect width="270" height="145" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="270" height="30" rx="10" ry="10" fill="#4C1D95"/>
    <text x="135" y="20" class="card-title" fill="#DDD6FE" text-anchor="middle">Playlist &amp; Track</text>
    <text x="14" y="52" class="card-body" font-weight="700" fill="#DDD6FE">Playlist: - tracks : List&lt;Track&gt;</text>
    <text x="14" y="72" class="card-body">+ getNextTrack() : Track</text>
    <line x1="14" y1="80" x2="256" y2="80" stroke="#4B5563" stroke-width="1"/>
    <text x="14" y="100" class="card-body" font-weight="700" fill="#DDD6FE">Track: - id, - title, - durationSec</text>
    <text x="14" y="120" class="card-body">+ getAudioStreamUrl() : String</text>
    <rect x="14" y="130" width="242" height="6" rx="2" ry="2" fill="#1E293B"/>
  </g>

  <!-- Connectors with Straight Runways -->
  <!-- Context to State Interface -->
  <path d="M 310 155 L 398 155 L 410 155" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="350" y="147" class="conn-label" fill="#A7F3D0">delegates</text>

  <!-- Interface to Concrete State 1 (Playing) -->
  <path d="M 690 135 L 748 135 L 760 135" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-green)"/>
  
  <!-- Interface to Concrete State 2 (Paused) -->
  <path d="M 690 155 L 725 155 Q 740 155 740 180 L 740 240 Q 740 260 748 260 L 760 260" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-yellow)"/>

  <!-- Interface to Concrete State 3 (Stopped) -->
  <path d="M 690 175 L 715 175 Q 730 175 730 200 L 730 365 Q 730 385 748 385 L 760 385" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-red)"/>

  <!-- MusicPlayer to Playlist (has-a) -->
  <path d="M 175 290 L 175 302 L 175 310" fill="none" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrow-purple)"/>
</svg>