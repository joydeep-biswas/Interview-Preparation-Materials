<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 370" width="100%" height="100%">
    <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <text x="550" y="32" class="title" font-size="19" text-anchor="middle">URL Shortener: Sub-5ms Read Redirection Architecture</text>
  <text x="550" y="52" class="subtitle" text-anchor="middle">High-throughput read path: 95% Redis cache hits, database fallback, and asynchronous Kafka click analytics</text>

  <!-- Client & Gateway -->
  <g transform="translate(30, 75)">
    <rect width="210" height="260" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="210" height="34" rx="10" ry="10" fill="#1E3A8A"/>
    <text x="105" y="22" class="card-title" fill="#93C5FD" text-anchor="middle">1. Client Request</text>
    <text x="16" y="60" class="card-body" font-weight="600" fill="#60A5FA">• Incoming HTTP GET:</text>
    <text x="24" y="80" class="card-body">  - GET /7aB9xQ</text>
    <text x="24" y="100" class="card-body">  - User-Agent, Referer, IP</text>
    <text x="16" y="130" class="card-body" font-weight="600" fill="#60A5FA">• Edge API Gateway:</text>
    <text x="24" y="150" class="card-body">  - SSL termination</text>
    <text x="24" y="170" class="card-body">  - Anycast routing</text>
    <text x="24" y="190" class="card-body">  - Token bucket rate limit</text>
    <rect x="16" y="226" width="178" height="22" rx="4" ry="4" fill="#1E293B"/>
    <text x="105" y="241" class="badge" fill="#93C5FD" text-anchor="middle">Edge Ingress</text>
  </g>

  <!-- Redis Cache -->
  <g transform="translate(275, 75)">
    <rect width="220" height="260" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="220" height="34" rx="10" ry="10" fill="#064E3B"/>
    <text x="110" y="22" class="card-title" fill="#A7F3D0" text-anchor="middle">2. Redis Cache L1/L2</text>
    <text x="16" y="60" class="card-body" font-weight="600" fill="#34D399">• O(1) Memory Lookup:</text>
    <text x="24" y="80" class="card-body">  - Key: "url:7aB9xQ"</text>
    <text x="24" y="100" class="card-body">  - Value: Long URL string</text>
    <text x="16" y="130" class="card-body" font-weight="600" fill="#34D399">• Cache Hit (95%):</text>
    <text x="24" y="150" class="card-body">  - Instant return (&lt; 2ms)</text>
    <text x="16" y="180" class="card-body" font-weight="600" fill="#34D399">• Cache Miss (5%):</text>
    <text x="24" y="200" class="card-body">  - Route query to DB</text>
    <rect x="16" y="226" width="188" height="22" rx="4" ry="4" fill="#1E293B"/>
    <text x="110" y="241" class="badge" fill="#A7F3D0" text-anchor="middle">In-Memory Cache</text>
  </g>

  <!-- Distributed DB (Miss Fallback) -->
  <g transform="translate(530, 75)">
    <rect width="220" height="260" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="220" height="34" rx="10" ry="10" fill="#78350F"/>
    <text x="110" y="22" class="card-title" fill="#FDE68A" text-anchor="middle">3. Distributed DB</text>
    <text x="16" y="60" class="card-body" font-weight="600" fill="#FBBF24">• CockroachDB / ScyllaDB:</text>
    <text x="24" y="80" class="card-body">  - Sharded primary key index</text>
    <text x="24" y="100" class="card-body">  - Read query latency ~10ms</text>
    <text x="16" y="130" class="card-body" font-weight="600" fill="#FBBF24">• Populate Cache:</text>
    <text x="24" y="150" class="card-body">  - SETEX url:7aB9xQ 86400</text>
    <text x="24" y="170" class="card-body">  - Prevents repeated misses</text>
    <rect x="16" y="226" width="188" height="22" rx="4" ry="4" fill="#1E293B"/>
    <text x="110" y="241" class="badge" fill="#FDE68A" text-anchor="middle">Durable Storage</text>
  </g>

  <!-- HTTP 302 & Analytics -->
  <g transform="translate(785, 75)">
    <rect width="285" height="260" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="285" height="34" rx="10" ry="10" fill="#4C1D95"/>
    <text x="142" y="22" class="card-title" fill="#DDD6FE" text-anchor="middle">4. Response &amp; Analytics</text>
    <text x="16" y="60" class="card-body" font-weight="600" fill="#A78BFA">• HTTP 302 Found Response:</text>
    <text x="24" y="80" class="card-body">  - Header Location: https://target.com</text>
    <text x="24" y="100" class="card-body">  - Uses 302 (Not 301) to ensure</text>
    <text x="24" y="120" class="card-body">    every click hits the server for analytics</text>
    <text x="16" y="150" class="card-body" font-weight="600" fill="#A78BFA">• Asynchronous Analytics Event:</text>
    <text x="24" y="170" class="card-body">  - Fire-and-forget emit to Kafka</text>
    <text x="24" y="190" class="card-body">  - ClickHouse real-time geo aggregation</text>
    <rect x="16" y="226" width="253" height="22" rx="4" ry="4" fill="#1E293B"/>
    <text x="142" y="241" class="badge" fill="#DDD6FE" text-anchor="middle">Sub-5ms End-to-End Latency</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <!-- Gateway to Cache -->
  <path d="M 240 205 L 263 205 L 275 205" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  
  <!-- Cache to DB (Miss) -->
  <path d="M 495 205 L 518 205 L 530 205" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>

  <!-- DB to Response -->
  <path d="M 750 205 L 773 205 L 785 205" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  
  <!-- Cache Hit Bypass (curves over top of DB directly to Response) -->
  <path d="M 430 75 L 430 60 Q 430 45 450 45 L 765 45 Q 785 45 785 60 L 785 75" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="560" y="35" width="130" height="20" rx="4" ry="4" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
  <text x="625" y="49" class="conn-label" fill="#A7F3D0" text-anchor="middle">Cache Hit 95% (&lt; 2ms)</text>
</svg>