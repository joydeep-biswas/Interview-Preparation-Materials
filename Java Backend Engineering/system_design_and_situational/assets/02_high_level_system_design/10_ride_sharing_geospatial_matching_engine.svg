<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" width="100%" height="100%">
    <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>
  <rect width="100%" height="100%" fill="url(#bg-grad)"  rx="10" stroke="#1F2937" stroke-width="1.5"/>
  <text x="550" y="32" class="title" font-size="19" text-anchor="middle">Ride-Sharing: High-Scale Geospatial Matching Engine (Uber / Lyft)</text>
  <text x="550" y="52" class="subtitle" text-anchor="middle">100k GPS pings/sec, Uber H3 hexagonal spatial indexing, sub-second k-ring search, and atomic driver dispatch</text>

  <!-- GPS Ingestion -->
  <g transform="translate(30, 75)">
    <rect width="230" height="280" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="230" height="34" rx="10" ry="10" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
    <text x="115" y="22" class="card-title" fill="#93C5FD" text-anchor="middle">1. Driver Location Ingress</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#60A5FA">• Driver Telemetry:</text>
    <text x="24" y="78" class="card-body">  - 100,000 GPS pings / sec</text>
    <text x="24" y="98" class="card-body">  - UDP / gRPC edge gateways</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#60A5FA">• Location Ingestion Svc:</text>
    <text x="24" y="146" class="card-body">  - Validates driver status: IDLE</text>
    <text x="24" y="166" class="card-body">  - Filters GPS jitter &amp; drift</text>
    <text x="24" y="186" class="card-body">  - Converts Lat/Lon to H3 Index</text>
    <rect x="16" y="244" width="198" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="115" y="259" class="badge" fill="#93C5FD" text-anchor="middle">High-Frequency GPS Stream</text>
  </g>

  <!-- H3 Spatial Index -->
  <g transform="translate(290, 75)">
    <rect width="250" height="280" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="250" height="34" rx="10" ry="10" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="125" y="22" class="card-title" fill="#A7F3D0" text-anchor="middle">2. Uber H3 Spatial Index</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#34D399">• Hexagonal Grid Hierarchy:</text>
    <text x="24" y="78" class="card-body">  - Resolution 8 (~460m radius)</text>
    <text x="24" y="98" class="card-body">  - Invariant: Equal distance to</text>
    <text x="24" y="118" class="card-body">    all 6 neighbor hexagons</text>
    <text x="16" y="146" class="card-body" font-weight="600" fill="#34D399">• Redis Geospatial Shards:</text>
    <text x="24" y="166" class="card-body">  - Set: "h3:&lt;hex_id&gt;:drivers"</text>
    <text x="24" y="186" class="card-body">  - Fast O(1) driver presence</text>
    <text x="24" y="206" class="card-body">  - 10-second TTL freshness</text>
    <rect x="16" y="244" width="218" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="125" y="259" class="badge" fill="#A7F3D0" text-anchor="middle">In-Memory Hexagonal Mesh</text>
  </g>

  <!-- Matching Engine -->
  <g transform="translate(570, 75)">
    <rect width="245" height="280" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="245" height="34" rx="10" ry="10" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
    <text x="122" y="22" class="card-title" fill="#FDE68A" text-anchor="middle">3. Matcher Service</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#FBBF24">• Rider Request Ingress:</text>
    <text x="24" y="78" class="card-body">  - Rider Lat/Lon -&gt; Hexagon H0</text>
    <text x="16" y="106" class="card-body" font-weight="600" fill="#FBBF24">• Concentric Ring Search:</text>
    <text x="24" y="126" class="card-body">  - Check Ring 0 (origin hex)</text>
    <text x="24" y="146" class="card-body">  - Expand to k-ring 1 (6 neighbors)</text>
    <text x="24" y="166" class="card-body">  - Expand to k-ring 2 (12 neighbors)</text>
    <text x="16" y="194" class="card-body" font-weight="600" fill="#FBBF24">• ETA &amp; Rank Optimization:</text>
    <text x="24" y="214" class="card-body">  - OSRM route ETA + driver rating</text>
    <rect x="16" y="244" width="213" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="122" y="259" class="badge" fill="#FDE68A" text-anchor="middle">K-Ring Neighbor Search</text>
  </g>

  <!-- Dispatch & Lock -->
  <g transform="translate(845, 75)">
    <rect width="225" height="280" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="225" height="34" rx="10" ry="10" fill="#4C1D95" stroke="#8B5CF6" stroke-width="1"/>
    <text x="112" y="22" class="card-title" fill="#DDD6FE" text-anchor="middle">4. Dispatch &amp; Lock</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#A78BFA">• Distributed Lock:</text>
    <text x="24" y="78" class="card-body">  - Redis atomic lock on driver_id</text>
    <text x="24" y="98" class="card-body">  - Prevents race conditions</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#A78BFA">• Offer Dispatch:</text>
    <text x="24" y="146" class="card-body">  - WebSocket push to driver</text>
    <text x="24" y="166" class="card-body">  - 15-second acceptance timer</text>
    <text x="16" y="194" class="card-body" font-weight="600" fill="#A78BFA">• State Transition:</text>
    <text x="24" y="214" class="card-body">  - Driver status -&gt; ASSIGNED</text>
    <rect x="16" y="244" width="193" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="112" y="259" class="badge" fill="#DDD6FE" text-anchor="middle">Atomic Driver Lock</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 260 215 L 278 215 L 290 215" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M 540 215 L 558 215 L 570 215" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  <path d="M 815 215 L 833 215 L 845 215" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
</svg>