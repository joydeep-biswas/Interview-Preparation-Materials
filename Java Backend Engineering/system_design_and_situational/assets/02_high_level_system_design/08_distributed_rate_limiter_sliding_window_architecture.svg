<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" width="100%" height="100%">
    <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>
  <rect width="100%" height="100%" fill="url(#bg-grad)"  rx="10" stroke="#1F2937" stroke-width="1.5"/>
  <text x="550" y="32" class="title" font-size="19" text-anchor="middle">Distributed Rate Limiter: Redis Sliding Window Architecture</text>
  <text x="550" y="52" class="subtitle" text-anchor="middle">Microsecond-precision sliding log via Redis Sorted Sets (ZSET) executing atomic Lua scripts at edge proxies</text>

  <!-- Ingress -->
  <g transform="translate(30, 75)">
    <rect width="230" height="280" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="230" height="34" rx="10" ry="10" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
    <text x="115" y="22" class="card-title" fill="#93C5FD" text-anchor="middle">1. Request Ingress</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#60A5FA">• Incoming Client API Call:</text>
    <text x="24" y="78" class="card-body">  - IP / UserID / API Key extracted</text>
    <text x="24" y="98" class="card-body">  - e.g. Client "user_9872"</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#60A5FA">• Envoy / Gateway Filter:</text>
    <text x="24" y="146" class="card-body">  - Rate limit filter intercepts</text>
    <text x="24" y="166" class="card-body">  - Evaluates tier policy:</text>
    <text x="24" y="186" class="card-body">    * Tier: 100 requests / min</text>
    <text x="24" y="206" class="card-body">    * Window: 60 seconds</text>
    <rect x="16" y="244" width="198" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="115" y="259" class="badge" fill="#93C5FD" text-anchor="middle">Edge Filter Intercept</text>
  </g>

  <!-- Redis ZSET Lua -->
  <g transform="translate(290, 75)">
    <rect width="260" height="280" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="260" height="34" rx="10" ry="10" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="130" y="22" class="card-title" fill="#A7F3D0" text-anchor="middle">2. Redis ZSET Sliding Log</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#34D399">• Atomic Lua Script Execution:</text>
    <text x="24" y="78" class="card-body">  1. ZREMRANGEBYSCORE key 0</text>
    <text x="24" y="98" class="card-body">     (now - 60s)  -- Purge expired</text>
    <text x="24" y="118" class="card-body">  2. current = ZCARD key</text>
    <text x="24" y="138" class="card-body">  3. IF current &lt; limit THEN</text>
    <text x="24" y="158" class="card-body">       ZADD key now uuid</text>
    <text x="24" y="178" class="card-body">       EXPIRE key 60</text>
    <text x="24" y="198" class="card-body">       RETURN 1 (Allowed)</text>
    <text x="24" y="218" class="card-body">     ELSE RETURN 0 (Denied)</text>
    <rect x="16" y="244" width="228" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="130" y="259" class="badge" fill="#A7F3D0" text-anchor="middle">Atomic Sliding Window</text>
  </g>

  <!-- Result: Allowed -->
  <g transform="translate(580, 75)">
    <rect width="235" height="135" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="235" height="30" rx="10" ry="10" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="117" y="20" class="card-title" fill="#A7F3D0" text-anchor="middle">Allowed: Return 1</text>
    <text x="16" y="52" class="card-body" font-weight="600" fill="#34D399">• Forward to Backend:</text>
    <text x="24" y="72" class="card-body">  - Injects RateLimit headers</text>
    <text x="24" y="92" class="card-body">  - X-RateLimit-Remaining: 42</text>
    <text x="24" y="112" class="card-body">  - Dispatches to Spring Boot Svc</text>
  </g>

  <!-- Result: Denied (HTTP 429) -->
  <g transform="translate(580, 225)">
    <rect width="235" height="130" rx="10" ry="10" fill="#111827" stroke="#EF4444" stroke-width="2"/>
    <rect width="235" height="30" rx="10" ry="10" fill="#7F1D1D" stroke="#EF4444" stroke-width="1"/>
    <text x="117" y="20" class="card-title" fill="#FCA5A5" text-anchor="middle">Denied: Return 0 (Rate Limited)</text>
    <text x="16" y="52" class="card-body" font-weight="600" fill="#F87171">• HTTP 429 Too Many Requests:</text>
    <text x="24" y="72" class="card-body">  - Header: Retry-After: 14</text>
    <text x="24" y="92" class="card-body">  - Short-circuits at edge</text>
    <text x="24" y="112" class="card-body">  - Zero backend CPU consumed</text>
  </g>

  <!-- Downstream Microservice Backend -->
  <g transform="translate(845, 75)">
    <rect width="225" height="280" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="225" height="34" rx="10" ry="10" fill="#4C1D95" stroke="#8B5CF6" stroke-width="1"/>
    <text x="112" y="22" class="card-title" fill="#DDD6FE" text-anchor="middle">3. Microservice Core</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#A78BFA">• Protected Service Pool:</text>
    <text x="24" y="78" class="card-body">  - Thread pools shielded from</text>
    <text x="24" y="98" class="card-body">    cascading exhaustion</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#A78BFA">• Predictable Latency:</text>
    <text x="24" y="146" class="card-body">  - P99 latency stays under SLA</text>
    <text x="24" y="166" class="card-body">  - Eliminates noisy neighbors</text>
    <text x="16" y="194" class="card-body" font-weight="600" fill="#A78BFA">• Audit &amp; Metric Logging:</text>
    <text x="24" y="214" class="card-body">  - Prometheus throttled counters</text>
    <rect x="16" y="244" width="193" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="112" y="259" class="badge" fill="#DDD6FE" text-anchor="middle">Protected Workload</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 260 215 L 278 215 L 290 215" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  
  <!-- ZSET to Allowed -->
  <path d="M 550 140 L 568 140 L 580 140" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- ZSET to Denied -->
  <path d="M 550 280 L 568 280 L 580 280" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- Allowed to Microservice Core -->
  <path d="M 815 140 L 833 140 L 845 140" fill="none" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrow-purple)"/>
</svg>