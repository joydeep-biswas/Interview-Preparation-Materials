<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" width="100%" height="100%">
    <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <text x="550" y="32" class="title" font-size="19" text-anchor="middle">Distributed Notification Service: High-Scale Fanout Architecture</text>
  <text x="550" y="52" class="subtitle" text-anchor="middle">Multi-tier priority workers, user preference filtering, rate-limiting gatekeepers, and third-party delivery gateways</text>

  <!-- Ingestion -->
  <g transform="translate(30, 75)">
    <rect width="230" height="280" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="230" height="34" rx="10" ry="10" fill="#1E3A8A"/>
    <text x="115" y="22" class="card-title" fill="#93C5FD" text-anchor="middle">1. Event Ingestion</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#60A5FA">• Upstream Microservices:</text>
    <text x="24" y="78" class="card-body">  - Ordering, Billing, Auth, Fraud</text>
    <text x="16" y="106" class="card-body" font-weight="600" fill="#60A5FA">• Ingestion REST API:</text>
    <text x="24" y="126" class="card-body">  - Validates payload schema</text>
    <text x="24" y="146" class="card-body">  - Idempotency key deduplication</text>
    <text x="16" y="174" class="card-body" font-weight="600" fill="#60A5FA">• Kafka Topic: notifications</text>
    <text x="24" y="194" class="card-body">  - Partitioned by user_id</text>
    <text x="24" y="214" class="card-body">  - Ensures user event ordering</text>
    <rect x="16" y="244" width="198" height="22" rx="4" ry="4" fill="#1E293B"/>
    <text x="115" y="259" class="badge" fill="#93C5FD" text-anchor="middle">Event Intake Spine</text>
  </g>

  <!-- Fanout & Priority Workers -->
  <g transform="translate(290, 75)">
    <rect width="240" height="280" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="240" height="34" rx="10" ry="10" fill="#064E3B"/>
    <text x="120" y="22" class="card-title" fill="#A7F3D0" text-anchor="middle">2. Fanout &amp; Workers</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#34D399">• Priority Worker Pools:</text>
    <text x="24" y="78" class="card-body">  - High: 2FA &amp; Password Resets</text>
    <text x="24" y="98" class="card-body">  - Medium: Order &amp; Delivery Updates</text>
    <text x="24" y="118" class="card-body">  - Low: Marketing &amp; Campaigns</text>
    <text x="16" y="146" class="card-body" font-weight="600" fill="#34D399">• User Preferences:</text>
    <text x="24" y="166" class="card-body">  - Checks opt-out &amp; quiet hours</text>
    <text x="24" y="186" class="card-body">  - Evaluates preferred channel</text>
    <text x="24" y="206" class="card-body">  - Template rendering (Mustache)</text>
    <rect x="16" y="244" width="208" height="22" rx="4" ry="4" fill="#1E293B"/>
    <text x="120" y="259" class="badge" fill="#A7F3D0" text-anchor="middle">Priority Dispatching</text>
  </g>

  <!-- Rate Limiter & Gatekeeper -->
  <g transform="translate(560, 75)">
    <rect width="240" height="280" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="240" height="34" rx="10" ry="10" fill="#78350F"/>
    <text x="120" y="22" class="card-title" fill="#FDE68A" text-anchor="middle">3. Rate Limiter &amp; Queue</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#FBBF24">• Provider Rate Limits:</text>
    <text x="24" y="78" class="card-body">  - Redis Token Bucket per provider</text>
    <text x="24" y="98" class="card-body">  - Prevents provider throttling</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#FBBF24">• User Fatigue Rules:</text>
    <text x="24" y="146" class="card-body">  - Max 3 marketing msgs / day</text>
    <text x="24" y="166" class="card-body">  - Redis sliding window counter</text>
    <text x="16" y="194" class="card-body" font-weight="600" fill="#FBBF24">• Delivery Buffers:</text>
    <text x="24" y="214" class="card-body">  - RabbitMQ / SQS dispatch buffer</text>
    <rect x="16" y="244" width="208" height="22" rx="4" ry="4" fill="#1E293B"/>
    <text x="120" y="259" class="badge" fill="#FDE68A" text-anchor="middle">Throttling Gatekeeper</text>
  </g>

  <!-- Gateways & DLQ -->
  <g transform="translate(830, 75)">
    <rect width="240" height="280" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="240" height="34" rx="10" ry="10" fill="#4C1D95"/>
    <text x="120" y="22" class="card-title" fill="#DDD6FE" text-anchor="middle">4. Gateways &amp; Tracking</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#A78BFA">• Third-Party Delivery:</text>
    <text x="24" y="78" class="card-body">  - Apple Push (APNs) HTTP/2</text>
    <text x="24" y="98" class="card-body">  - Firebase Cloud Messaging (FCM)</text>
    <text x="24" y="118" class="card-body">  - SMS (Twilio) &amp; Email (SendGrid)</text>
    <text x="16" y="146" class="card-body" font-weight="600" fill="#A78BFA">• Status Tracking &amp; DLQ:</text>
    <text x="24" y="166" class="card-body">  - Webhook delivery receipts</text>
    <text x="24" y="186" class="card-body">  - Cassandra notification history</text>
    <text x="24" y="206" class="card-body">  - Exponential backoff dead-letter</text>
    <rect x="16" y="244" width="208" height="22" rx="4" ry="4" fill="#1E293B"/>
    <text x="120" y="259" class="badge" fill="#DDD6FE" text-anchor="middle">Delivery &amp; Audit Trail</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 260 215 L 278 215 L 290 215" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M 530 215 L 548 215 L 560 215" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  <path d="M 800 215 L 818 215 L 830 215" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
</svg>