<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="100%" height="100%">
    <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>
  <rect width="100%" height="100%" fill="url(#bg-grad)"  rx="10" stroke="#1F2937" stroke-width="1.5"/>
  <text x="550" y="32" class="title" font-size="19" text-anchor="middle">Payment Timeout Dilemma: Two-Phase Reconciliation Protocol</text>
  <text x="550" y="52" class="subtitle" text-anchor="middle">Handling network drops during bank authorization: HTTP 504 recovery, active inquiry polling, and verified settlement</text>

  <!-- Three Swimlanes / Columns -->
  <!-- Column 1: Client Application -->
  <g transform="translate(40, 75)">
    <rect width="280" height="325" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="280" height="34" rx="10" ry="10" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
    <text x="140" y="22" class="card-title" fill="#93C5FD" text-anchor="middle">Client Application</text>
    
    <rect x="15" y="48" width="250" height="50" rx="6" ry="6" fill="#1E293B" stroke="#60A5FA"/>
    <text x="140" y="68" class="badge" fill="#93C5FD" text-anchor="middle">1. POST /payments ($100)</text>
    <text x="140" y="86" class="card-body" text-anchor="middle">Header: Idempotency-Key: K1</text>

    <rect x="15" y="115" width="250" height="60" rx="6" ry="6" fill="#1E293B" stroke="#EF4444"/>
    <text x="140" y="135" class="badge" fill="#FCA5A5" text-anchor="middle">4. HTTP 504 Gateway Timeout</text>
    <text x="140" y="152" class="card-body" fill="#F87171" text-anchor="middle">Dilemma: Did bank charge money?</text>
    <text x="140" y="167" class="badge" fill="#EF4444" text-anchor="middle">Enters "PAYMENT_PENDING" state</text>

    <rect x="15" y="245" width="250" height="50" rx="6" ry="6" fill="#1E293B" stroke="#10B981"/>
    <text x="140" y="265" class="badge" fill="#A7F3D0" text-anchor="middle">7. Webhook / Polling Result</text>
    <text x="140" y="283" class="card-body" fill="#34D399" text-anchor="middle">Payment Confirmed &amp; Receipt Emitted</text>
  </g>

  <!-- Column 2: Payment Gateway & Reconciler -->
  <g transform="translate(410, 75)">
    <rect width="300" height="325" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="300" height="34" rx="10" ry="10" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
    <text x="150" y="22" class="card-title" fill="#FDE68A" text-anchor="middle">Payment Gateway &amp; Reconciler</text>
    
    <rect x="15" y="48" width="270" height="50" rx="6" ry="6" fill="#1E293B" stroke="#FBBF24"/>
    <text x="150" y="68" class="badge" fill="#FDE68A" text-anchor="middle">2. Process Authorization</text>
    <text x="150" y="86" class="card-body" text-anchor="middle">Forwards to Acquiring Bank via ISO 8583</text>

    <rect x="15" y="115" width="270" height="60" rx="6" ry="6" fill="#1E293B" stroke="#EF4444"/>
    <text x="150" y="135" class="badge" fill="#FCA5A5" text-anchor="middle">Socket Timeout / Connection Drop</text>
    <text x="150" y="152" class="card-body" text-anchor="middle">No response received within 3000ms SLA</text>
    <text x="150" y="167" class="badge" fill="#EF4444" text-anchor="middle">Does NOT blind-retry! Prevents double charge</text>

    <rect x="15" y="190" width="270" height="50" rx="6" ry="6" fill="#1E293B" stroke="#8B5CF6"/>
    <text x="150" y="210" class="badge" fill="#DDD6FE" text-anchor="middle">5. Two-Phase Reconciliation Task</text>
    <text x="150" y="228" class="card-body" text-anchor="middle">Inquiry: GET /charges?idempotency_key=K1</text>

    <rect x="15" y="255" width="270" height="40" rx="6" ry="6" fill="#1E293B" stroke="#10B981"/>
    <text x="150" y="279" class="badge" fill="#A7F3D0" text-anchor="middle">6. Updates Local DB to "SUCCESS"</text>
  </g>

  <!-- Column 3: Acquiring Bank / PSP -->
  <g transform="translate(790, 75)">
    <rect width="270" height="325" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="270" height="34" rx="10" ry="10" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="135" y="22" class="card-title" fill="#A7F3D0" text-anchor="middle">Acquiring Bank / PSP</text>
    
    <rect x="15" y="48" width="240" height="50" rx="6" ry="6" fill="#1E293B" stroke="#34D399"/>
    <text x="135" y="68" class="badge" fill="#A7F3D0" text-anchor="middle">Processes $100 Charge</text>
    <text x="135" y="86" class="card-body" text-anchor="middle">Deducts funds &amp; commits record</text>

    <rect x="15" y="115" width="240" height="60" rx="6" ry="6" fill="#1E293B" stroke="#EF4444"/>
    <text x="135" y="135" class="badge" fill="#FCA5A5" text-anchor="middle">Network Drop / TCP Fin</text>
    <text x="135" y="152" class="card-body" text-anchor="middle">ACK dropped on network boundary</text>
    <text x="135" y="167" class="badge" fill="#EF4444" text-anchor="middle">Bank database HAS completed charge</text>

    <rect x="15" y="190" width="240" height="50" rx="6" ry="6" fill="#1E293B" stroke="#8B5CF6"/>
    <text x="135" y="210" class="badge" fill="#DDD6FE" text-anchor="middle">Status Inquiry Endpoint</text>
    <text x="135" y="228" class="card-body" text-anchor="middle">Matches K1 -&gt; Returns "SUCCESS"</text>
  </g>

  <!-- Sequence Arrows with Straight Runways -->
  <!-- 1. Client to GW (73) -->
  <path d="M 320 73 L 398 73 L 410 73" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  
  <!-- 2. GW to Bank (73) -->
  <path d="M 710 73 L 778 73 L 790 73" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow-yellow)"/>

  <!-- 3. Network Drop (Red X) -->
  <path d="M 790 145 L 750 145" fill="none" stroke="#EF4444" stroke-width="2.5"/>
  <text x="735" y="150" font-weight="900" fill="#EF4444" font-size="16">✕</text>

  <!-- 4. GW to Client 504 Timeout -->
  <path d="M 410 145 L 332 145 L 320 145" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- 5. GW Polling Reconcile to Bank -->
  <path d="M 710 215 L 778 215 L 790 215" fill="none" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- 6. Bank confirms SUCCESS back to GW -->
  <path d="M 790 275 L 722 275 L 710 275" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- 7. GW notifies Client -->
  <path d="M 410 270 L 332 270 L 320 270" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)"/>
</svg>