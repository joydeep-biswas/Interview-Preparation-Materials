<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
    <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <text x="500" y="32" class="title" font-size="19" text-anchor="middle">Twitter Snowflake: 64-Bit Globally Unique ID Layout</text>
  <text x="500" y="52" class="subtitle" text-anchor="middle">Bitwise distribution generating roughly 4,096 unique k-sorted IDs per millisecond per node without central coordination</text>

  <!-- 64-bit Ribbon -->
  <g transform="translate(50, 95)">
    <!-- Sign Bit: 1 bit -->
    <rect x="0" y="0" width="70" height="90" rx="8" ry="8" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
    <text x="35" y="30" class="card-title" fill="#CBD5E1" text-anchor="middle">1 Bit</text>
    <text x="35" y="52" class="card-body" font-weight="700" fill="#94A3B8" text-anchor="middle">Sign</text>
    <text x="35" y="74" class="badge" fill="#64748B" text-anchor="middle">(0)</text>

    <!-- Timestamp: 41 bits -->
    <rect x="80" y="0" width="370" height="90" rx="8" ry="8" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
    <text x="265" y="30" class="card-title" fill="#93C5FD" text-anchor="middle">41 Bits: Timestamp (ms epoch)</text>
    <text x="265" y="52" class="card-body" font-weight="700" fill="#60A5FA" text-anchor="middle">2^41 ms ≈ 69.7 Years Lifespan</text>
    <text x="265" y="74" class="badge" fill="#93C5FD" text-anchor="middle">Custom Epoch Delta (System Creation Time)</text>

    <!-- Datacenter ID: 5 bits -->
    <rect x="460" y="0" width="135" height="90" rx="8" ry="8" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
    <text x="527" y="30" class="card-title" fill="#A7F3D0" text-anchor="middle">5 Bits</text>
    <text x="527" y="52" class="card-body" font-weight="700" fill="#34D399" text-anchor="middle">Datacenter ID</text>
    <text x="527" y="74" class="badge" fill="#A7F3D0" text-anchor="middle">32 Datacenters</text>

    <!-- Worker ID: 5 bits -->
    <rect x="605" y="0" width="135" height="90" rx="8" ry="8" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <text x="672" y="30" class="card-title" fill="#FDE68A" text-anchor="middle">5 Bits</text>
    <text x="672" y="52" class="card-body" font-weight="700" fill="#FBBF24" text-anchor="middle">Worker ID</text>
    <text x="672" y="74" class="badge" fill="#FDE68A" text-anchor="middle">32 Nodes / DC</text>

    <!-- Sequence Number: 12 bits -->
    <rect x="750" y="0" width="150" height="90" rx="8" ry="8" fill="#1E293B" stroke="#8B5CF6" stroke-width="2"/>
    <text x="825" y="30" class="card-title" fill="#DDD6FE" text-anchor="middle">12 Bits</text>
    <text x="825" y="52" class="card-body" font-weight="700" fill="#A78BFA" text-anchor="middle">Sequence No.</text>
    <text x="825" y="74" class="badge" fill="#DDD6FE" text-anchor="middle">4,096 IDs / ms / node</text>
  </g>

  <!-- Explanatory Invariant Cards -->
  <g transform="translate(50, 215)">
    <!-- Invariant 1: Sorting -->
    <rect x="0" y="0" width="285" height="115" rx="8" ry="8" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="142" y="24" class="card-title" fill="#93C5FD" text-anchor="middle">1. Time-Ordered (K-Sorted)</text>
    <text x="14" y="50" class="card-body">• High bits contain millisecond epoch</text>
    <text x="14" y="70" class="card-body">• Primary key B-Tree index inserts append</text>
    <text x="14" y="90" class="card-body">  sequentially, eliminating page splits!</text>

    <!-- Invariant 2: Throughput -->
    <rect x="305" y="0" width="290" height="115" rx="8" ry="8" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
    <text x="150" y="24" class="card-title" fill="#A7F3D0" text-anchor="middle">2. 4,096,000 IDs / sec / DC</text>
    <text x="14" y="50" class="card-body">• 32 workers × 4,096 sequences / ms</text>
    <text x="14" y="70" class="card-body">• In-memory atomic integer increment</text>
    <text x="14" y="90" class="card-body">• Zero RPC or central database bottleck</text>

    <!-- Invariant 3: Clock Drift -->
    <rect x="615" y="0" width="285" height="115" rx="8" ry="8" fill="#111827" stroke="#EF4444" stroke-width="1.5"/>
    <text x="142" y="24" class="card-title" fill="#FCA5A5" text-anchor="middle">3. Clock Drift Protection</text>
    <text x="14" y="50" class="card-body">• If NTP backward drift detected:</text>
    <text x="14" y="70" class="card-body">• Generator throws ClockMovedBackwards</text>
    <text x="14" y="90" class="card-body">  or sleeps until caught up (prevents dups)</text>
  </g>
</svg>