<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" width="100%" height="100%">
    <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <text x="550" y="32" class="title" font-size="19" text-anchor="middle">Open Banking API: Edge Token &amp; Consent Validation Architecture</text>
  <text x="550" y="52" class="subtitle" text-anchor="middle">mTLS security, RS256 JWT signature verification, local in-memory Bloom filter revocation check (&lt; 2ms), and Account API</text>

  <!-- Third Party TPP -->
  <g transform="translate(30, 75)">
    <rect width="230" height="280" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="230" height="34" rx="10" ry="10" fill="#1E3A8A"/>
    <text x="115" y="22" class="card-title" fill="#93C5FD" text-anchor="middle">1. FinTech App (TPP)</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#60A5FA">• Authorized TPP Client:</text>
    <text x="24" y="78" class="card-body">  - e.g. Plaid, Mint, Yolt</text>
    <text x="24" y="98" class="card-body">  - Requests GET /accounts</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#60A5FA">• Security Headers:</text>
    <text x="24" y="146" class="card-body">  - Mutual TLS (mTLS) cert</text>
    <text x="24" y="166" class="card-body">  - Bearer Signed DPoP JWT</text>
    <text x="24" y="186" class="card-body">  - Consent ID: "cns_8821"</text>
    <rect x="16" y="244" width="198" height="22" rx="4" ry="4" fill="#1E293B"/>
    <text x="115" y="259" class="badge" fill="#93C5FD" text-anchor="middle">Regulated TPP Client</text>
  </g>

  <!-- Edge Auth Gateway -->
  <g transform="translate(290, 75)">
    <rect width="250" height="280" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="250" height="34" rx="10" ry="10" fill="#064E3B"/>
    <text x="125" y="22" class="card-title" fill="#A7F3D0" text-anchor="middle">2. Edge Validation (&lt; 2ms)</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#34D399">• Step 1: Crypto Verify:</text>
    <text x="24" y="78" class="card-body">  - RS256 / EdDSA public key</text>
    <text x="24" y="98" class="card-body">  - Expiration &amp; audience check</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#34D399">• Step 2: Bloom Filter:</text>
    <text x="24" y="146" class="card-body">  - In-memory revoked token filter</text>
    <text x="24" y="166" class="card-body">  - If NOT in Bloom: Guaranteed valid!</text>
    <text x="24" y="186" class="card-body">  - Bypasses DB for 99.9% of requests</text>
    <text x="24" y="206" class="card-body">  - Caffeine cache for consent state</text>
    <rect x="16" y="244" width="218" height="22" rx="4" ry="4" fill="#1E293B"/>
    <text x="125" y="259" class="badge" fill="#A7F3D0" text-anchor="middle">Zero DB Reads on Fast Path</text>
  </g>

  <!-- Central Token Registry -->
  <g transform="translate(570, 75)">
    <rect width="245" height="280" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="245" height="34" rx="10" ry="10" fill="#78350F"/>
    <text x="122" y="22" class="card-title" fill="#FDE68A" text-anchor="middle">3. Central Registry (Fallback)</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#FBBF24">• Disambiguation Path:</text>
    <text x="24" y="78" class="card-body">  - Only hit if Bloom says "Maybe"</text>
    <text x="24" y="98" class="card-body">  - Queries Redis Token Blacklist</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#FBBF24">• Consent Scopes Check:</text>
    <text x="24" y="146" class="card-body">  - Accounts:Read vs Payments:Write</text>
    <text x="24" y="166" class="card-body">  - Verifies user consent duration</text>
    <text x="16" y="194" class="card-body" font-weight="600" fill="#FBBF24">• Sync Broadcast:</text>
    <text x="24" y="214" class="card-body">  - Redis Pub/Sub updates Bloom</text>
    <rect x="16" y="244" width="213" height="22" rx="4" ry="4" fill="#1E293B"/>
    <text x="122" y="259" class="badge" fill="#FDE68A" text-anchor="middle">Definitive Revocation Store</text>
  </g>

  <!-- Account Service -->
  <g transform="translate(845, 75)">
    <rect width="225" height="280" rx="10" ry="10" fill="#111827" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="225" height="34" rx="10" ry="10" fill="#4C1D95"/>
    <text x="112" y="22" class="card-title" fill="#DDD6FE" text-anchor="middle">4. Account API Service</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#A78BFA">• Secure Core Dispatch:</text>
    <text x="24" y="78" class="card-body">  - Reads core banking balance</text>
    <text x="24" y="98" class="card-body">  - Masks PII data per consent</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#A78BFA">• Immutable Audit Log:</text>
    <text x="24" y="146" class="card-body">  - Emits access log to Kafka</text>
    <text x="24" y="166" class="card-body">  - Regulatory GDPR compliance</text>
    <text x="16" y="194" class="card-body" font-weight="600" fill="#A78BFA">• JSON Response to TPP</text>
    <rect x="16" y="244" width="193" height="22" rx="4" ry="4" fill="#1E293B"/>
    <text x="112" y="259" class="badge" fill="#DDD6FE" text-anchor="middle">Protected Financial API</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 260 215 L 278 215 L 290 215" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M 540 215 L 558 215 L 570 215" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  <path d="M 815 215 L 833 215 L 845 215" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
</svg>