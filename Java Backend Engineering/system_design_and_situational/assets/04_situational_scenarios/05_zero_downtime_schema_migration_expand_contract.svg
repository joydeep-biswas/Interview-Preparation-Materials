<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 370" width="100%" height="100%">
    <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>
  <rect width="100%" height="100%" fill="url(#bg-grad)"  rx="10" stroke="#1F2937" stroke-width="1.5"/>
  <text x="550" y="32" class="title" font-size="19" text-anchor="middle">Zero-Downtime Database Migration: Expand-Contract (Parallel Run) Pattern</text>
  <text x="550" y="52" class="subtitle" text-anchor="middle">Safe production schema evolution across distributed microservices without locking tables or breaking backward compatibility</text>

  <!-- Step 1: Expand -->
  <g transform="translate(30, 75)">
    <rect width="320" height="260" rx="10" ry="10" fill="#111827" stroke="#3B82F6" stroke-width="2"/>
    <rect width="320" height="34" rx="10" ry="10" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
    <text x="160" y="22" class="card-title" fill="#93C5FD" text-anchor="middle">Phase 1: Expand (Dual-Write)</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#60A5FA">• Add New Nullable Column:</text>
    <text x="24" y="78" class="card-body">  - ALTER TABLE users ADD COLUMN phone_v2</text>
    <text x="24" y="98" class="card-body">  - Nullable to avoid full table rewrite lock</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#60A5FA">• Application Dual-Writing:</text>
    <text x="24" y="146" class="card-body">  - Writes new data to BOTH v1 &amp; v2</text>
    <text x="24" y="166" class="card-body">  - Reads continue from v1</text>
    <text x="16" y="194" class="card-body" font-weight="600" fill="#60A5FA">• Deploy v1.1 Services:</text>
    <text x="24" y="214" class="card-body">  - Backward compatible with existing consumers</text>
    <rect x="16" y="226" width="288" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="160" y="241" class="badge" fill="#93C5FD" text-anchor="middle">Schema &amp; Contract Expanded</text>
  </g>

  <!-- Step 2: Migrate -->
  <g transform="translate(390, 75)">
    <rect width="320" height="260" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="320" height="34" rx="10" ry="10" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
    <text x="160" y="22" class="card-title" fill="#FDE68A" text-anchor="middle">Phase 2: Migrate (Backfill)</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#FBBF24">• Background Chunked Backfill:</text>
    <text x="24" y="78" class="card-body">  - Throttled batch worker copies historical</text>
    <text x="24" y="98" class="card-body">    rows: UPDATE phone_v2 = convert(phone)</text>
    <text x="24" y="118" class="card-body">  - Batches of 5,000 rows to prevent locks</text>
    <text x="16" y="146" class="card-body" font-weight="600" fill="#FBBF24">• Client Migration:</text>
    <text x="24" y="166" class="card-body">  - Fast teams cut over reads to phone_v2</text>
    <text x="24" y="186" class="card-body">  - Slow legacy teams remain on v1</text>
    <text x="16" y="214" class="card-body" font-weight="600" fill="#FBBF24">• Zero downtime during migration window</text>
    <rect x="16" y="226" width="288" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="160" y="241" class="badge" fill="#FDE68A" text-anchor="middle">Historical Data Backfilled</text>
  </g>

  <!-- Step 3: Contract -->
  <g transform="translate(750, 75)">
    <rect width="320" height="260" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="320" height="34" rx="10" ry="10" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="160" y="22" class="card-title" fill="#A7F3D0" text-anchor="middle">Phase 3: Contract (Prune)</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#34D399">• 100% Traffic on New Column:</text>
    <text x="24" y="78" class="card-body">  - All services read and write phone_v2</text>
    <text x="24" y="98" class="card-body">  - Stop writing to legacy phone v1 column</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#34D399">• Drop Legacy Artifacts:</text>
    <text x="24" y="146" class="card-body">  - Deprecate old REST endpoints</text>
    <text x="24" y="166" class="card-body">  - ALTER TABLE users DROP COLUMN phone</text>
    <text x="16" y="194" class="card-body" font-weight="600" fill="#34D399">• Final Clean State:</text>
    <text x="24" y="214" class="card-body">  - Schema lean and completely migrated</text>
    <rect x="16" y="226" width="288" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="160" y="241" class="badge" fill="#A7F3D0" text-anchor="middle">Legacy Artifacts Purged</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 350 205 L 378 205 L 390 205" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  <path d="M 710 205 L 738 205 L 750 205" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
</svg>