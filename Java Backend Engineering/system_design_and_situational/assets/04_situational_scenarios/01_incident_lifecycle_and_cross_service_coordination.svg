<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 370" width="100%" height="100%">
    <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>
  <rect width="100%" height="100%" fill="url(#bg-grad)"  rx="10" stroke="#1F2937" stroke-width="1.5"/>
  <text x="550" y="32" class="title" font-size="19" text-anchor="middle">Incident Lifecycle &amp; Cross-Service Coordination Protocol</text>
  <text x="550" y="52" class="subtitle" text-anchor="middle">Three-phase engineering incident protocol: Detection &amp; Triage, Remediation &amp; Bridge, and Post-Mortem Hardening</text>

  <!-- Phase 1 -->
  <g transform="translate(30, 75)">
    <rect width="320" height="260" rx="10" ry="10" fill="#111827" stroke="#EF4444" stroke-width="2"/>
    <rect width="320" height="34" rx="10" ry="10" fill="#7F1D1D" stroke="#EF4444" stroke-width="1"/>
    <text x="160" y="22" class="card-title" fill="#FCA5A5" text-anchor="middle">Phase 1: Detection &amp; Triage</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#F87171">• Metric Breach &amp; Alert:</text>
    <text x="24" y="78" class="card-body">  - p99 Latency &gt; 500ms, 5xx rate &gt; 1%</text>
    <text x="24" y="98" class="card-body">  - PagerDuty pages on-call engineer</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#F87171">• Incident Commander (IC):</text>
    <text x="24" y="146" class="card-body">  - Isolates trace IDs in Datadog</text>
    <text x="24" y="166" class="card-body">  - Captures thread dump &amp; heap metrics</text>
    <text x="16" y="194" class="card-body" font-weight="600" fill="#F87171">• Fast Mitigation:</text>
    <text x="24" y="214" class="card-body">  - Traffic shedding / Circuit breaker trip</text>
    <rect x="16" y="226" width="288" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="160" y="241" class="badge" fill="#FCA5A5" text-anchor="middle">Blast Radius Contained</text>
  </g>

  <!-- Phase 2 -->
  <g transform="translate(390, 75)">
    <rect width="320" height="260" rx="10" ry="10" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
    <rect width="320" height="34" rx="10" ry="10" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
    <text x="160" y="22" class="card-title" fill="#FDE68A" text-anchor="middle">Phase 2: Rectification &amp; Bridge</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#FBBF24">• Stakeholder Comms:</text>
    <text x="24" y="78" class="card-body">  - Dedicated Slack incident war-room</text>
    <text x="24" y="98" class="card-body">  - Statuspage update posted for clients</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#FBBF24">• Hotfix Deployment:</text>
    <text x="24" y="146" class="card-body">  - Rollback bad release or patch timeout</text>
    <text x="24" y="166" class="card-body">  - Canary verification on single pod</text>
    <text x="16" y="194" class="card-body" font-weight="600" fill="#FBBF24">• Service Verification:</text>
    <text x="24" y="214" class="card-body">  - Traffic ramp up to 100%</text>
    <rect x="16" y="226" width="288" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="160" y="241" class="badge" fill="#FDE68A" text-anchor="middle">Hotfix Verified in Production</text>
  </g>

  <!-- Phase 3 -->
  <g transform="translate(750, 75)">
    <rect width="320" height="260" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="320" height="34" rx="10" ry="10" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="160" y="22" class="card-title" fill="#A7F3D0" text-anchor="middle">Phase 3: Hardening &amp; Post-Mortem</text>
    <text x="16" y="58" class="card-body" font-weight="600" fill="#34D399">• Blameless Post-Mortem:</text>
    <text x="24" y="78" class="card-body">  - 5 Whys analysis of underlying trigger</text>
    <text x="24" y="98" class="card-body">  - Complete chronological timeline</text>
    <text x="16" y="126" class="card-body" font-weight="600" fill="#34D399">• Action Items &amp; SLO Tuning:</text>
    <text x="24" y="146" class="card-body">  - Configure strict client socket timeouts</text>
    <text x="24" y="166" class="card-body">  - Adjust thread pool bounds &amp; reject policy</text>
    <text x="16" y="194" class="card-body" font-weight="600" fill="#34D399">• Chaos Engineering:</text>
    <text x="24" y="214" class="card-body">  - Automated latency injection tests</text>
    <rect x="16" y="226" width="288" height="22" rx="4" ry="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="160" y="241" class="badge" fill="#A7F3D0" text-anchor="middle">System Resiliency Hardened</text>
  </g>

  <!-- Connectors with Straight Runways -->
  <path d="M 350 205 L 378 205 L 390 205" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  <path d="M 710 205 L 738 205 L 750 205" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
</svg>