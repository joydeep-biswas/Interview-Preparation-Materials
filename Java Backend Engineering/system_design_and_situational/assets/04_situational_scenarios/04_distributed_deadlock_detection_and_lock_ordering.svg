<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" width="100%" height="100%">
    <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06B6D4"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; fill: #F3F4F6; }
    .subtitle { fill: #9CA3AF; font-size: 13px; }
    .card-title { font-weight: 700; font-size: 14px; }
    .card-body { font-size: 12px; fill: #D1D5DB; }
    .badge { font-weight: 600; font-size: 11px; }
    .conn-label { font-size: 11px; font-weight: 600; fill: #9CA3AF; }
  </style>
  <rect width="100%" height="100%" fill="url(#bg-grad)"  rx="10" stroke="#1F2937" stroke-width="1.5"/>
  <text x="540" y="32" class="title" font-size="19" text-anchor="middle">Distributed Deadlocks: Circular Wait vs Canonical Lock Ordering</text>
  <text x="540" y="52" class="subtitle" text-anchor="middle">Preventing database and distributed lock deadlocks via deterministic lexicographical key ordering</text>

  <!-- Left Side: Deadlock Cycle -->
  <g transform="translate(40, 80)">
    <rect width="470" height="300" rx="10" ry="10" fill="#111827" stroke="#EF4444" stroke-width="2"/>
    <rect width="470" height="32" rx="10" ry="10" fill="#7F1D1D" stroke="#EF4444" stroke-width="1"/>
    <text x="235" y="21" class="card-title" fill="#FCA5A5" text-anchor="middle">Circular Wait Deadlock Condition (Failure)</text>
    
    <!-- Thread A Card -->
    <rect x="20" y="50" width="200" height="110" rx="8" ry="8" fill="#1E293B" stroke="#3B82F6"/>
    <text x="120" y="70" class="badge" fill="#93C5FD" text-anchor="middle">Thread A: Transfer U1 -&gt; U2</text>
    <text x="30" y="94" class="card-body">1. Acquires Lock: User 1</text>
    <text x="30" y="118" class="card-body" fill="#F87171">2. Blocks on Lock: User 2</text>
    <text x="30" y="140" class="badge" fill="#EF4444">Holds U1, Waits for U2</text>

    <!-- Thread B Card -->
    <rect x="250" y="50" width="200" height="110" rx="8" ry="8" fill="#1E293B" stroke="#F59E0B"/>
    <text x="350" y="70" class="badge" fill="#FDE68A" text-anchor="middle">Thread B: Transfer U2 -&gt; U1</text>
    <text x="260" y="94" class="card-body">1. Acquires Lock: User 2</text>
    <text x="260" y="118" class="card-body" fill="#F87171">2. Blocks on Lock: User 1</text>
    <text x="260" y="140" class="badge" fill="#EF4444">Holds U2, Waits for U1</text>

    <!-- Circular Wait Cross Links -->
    <path d="M 220 90 L 250 120" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="4,4"/>
    <path d="M 250 90 L 220 120" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="4,4"/>

    <!-- Failure Callout -->
    <rect x="20" y="180" width="430" height="95" rx="6" ry="6" fill="#1E293B" stroke="#EF4444"/>
    <text x="235" y="202" class="card-body" font-weight="700" fill="#FCA5A5" text-anchor="middle">Deadlock Invariant: Circular Dependency Cycle</text>
    <text x="30" y="224" class="card-body">• Neither thread can make progress without the other's lock</text>
    <text x="30" y="244" class="card-body">• Database throws: ERROR 40P01: deadlock detected</text>
    <text x="30" y="264" class="card-body">• Aborts one transaction randomly with severe performance hit</text>
  </g>

  <!-- Right Side: Canonical Ordering Solution -->
  <g transform="translate(570, 80)">
    <rect width="470" height="300" rx="10" ry="10" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect width="470" height="32" rx="10" ry="10" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="235" y="21" class="card-title" fill="#A7F3D0" text-anchor="middle">Canonical Lock Ordering Solution (Success)</text>
    
    <!-- Rule Definition -->
    <rect x="20" y="50" width="430" height="60" rx="8" ry="8" fill="#1E293B" stroke="#10B981"/>
    <text x="235" y="72" class="card-body" font-weight="700" fill="#A7F3D0" text-anchor="middle">Deterministic Lock Acquisition Rule</text>
    <text x="235" y="94" class="card-body" font-weight="600" fill="#FDE68A" text-anchor="middle">first = min(user1.id, user2.id); second = max(user1.id, user2.id);</text>

    <!-- Thread A Solution -->
    <rect x="20" y="125" width="200" height="85" rx="8" ry="8" fill="#1E293B" stroke="#10B981"/>
    <text x="120" y="145" class="badge" fill="#A7F3D0" text-anchor="middle">Thread A (U1 -&gt; U2)</text>
    <text x="30" y="169" class="card-body">1. Acquires Lock: User 1</text>
    <text x="30" y="191" class="card-body">2. Acquires Lock: User 2</text>

    <!-- Thread B Solution -->
    <rect x="250" y="125" width="200" height="85" rx="8" ry="8" fill="#1E293B" stroke="#10B981"/>
    <text x="350" y="145" class="badge" fill="#A7F3D0" text-anchor="middle">Thread B (U2 -&gt; U1)</text>
    <text x="260" y="169" class="card-body">1. Waits for Lock: User 1</text>
    <text x="260" y="191" class="card-body">2. Acquires U2 after U1</text>

    <!-- Success Callout -->
    <rect x="20" y="225" width="430" height="50" rx="6" ry="6" fill="#1E293B" stroke="#10B981"/>
    <text x="235" y="246" class="card-body" font-weight="700" fill="#A7F3D0" text-anchor="middle">Zero Deadlocks: Linear Wait Chain</text>
    <text x="235" y="264" class="card-body" text-anchor="middle">Eliminates circular hold-and-wait; transactions queue smoothly</text>
  </g>
</svg>