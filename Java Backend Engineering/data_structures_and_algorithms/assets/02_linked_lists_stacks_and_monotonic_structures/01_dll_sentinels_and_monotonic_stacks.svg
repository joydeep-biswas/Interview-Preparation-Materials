<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="490" viewBox="0 0 1120 490">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1120" height="490" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Doubly-Linked Sentinels &amp; Monotonic Stack / LRU Architecture</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Hardware memory disconnection vs algorithmic pointer manipulation in O(1) cache systems</text>

  <!-- Part 1: DLL Sentinel Architecture -->
  <g transform="translate(30, 85)">
    <rect width="1060" height="165" rx="8" fill="#0B132B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="530" y="26" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle">1. DOUBLY-LINKED LIST WITH DUMMY SENTINEL HEAD &amp; TAIL (O(1) REMOVAL &amp; INSERTION)</text>

    <!-- Head Dummy -->
    <rect x="35" y="50" width="150" height="85" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="110" y="75" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle">HEAD DUMMY</text>
    <text x="50" y="100" font-size="10" fill="#94A3B8">prev = null</text>
    <text x="50" y="118" font-size="10" fill="#34D399">next → Node 1</text>

    <!-- Node 1 -->
    <rect x="285" y="50" width="210" height="85" rx="6" fill="#0F172A" stroke="#34D399" stroke-width="1.5"/>
    <text x="390" y="75" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle">NODE 1 (MRU)</text>
    <text x="305" y="100" font-size="10" fill="#94A3B8">Key: "user_1" | Val: Object</text>
    <text x="305" y="118" font-size="10" fill="#38BDF8">prev ← Head | next → Node 2</text>

    <!-- Node 2 -->
    <rect x="595" y="50" width="210" height="85" rx="6" fill="#0F172A" stroke="#FBBF24" stroke-width="1.5"/>
    <text x="700" y="75" font-size="12" font-weight="700" fill="#FBBF24" text-anchor="middle">NODE 2 (LRU Candidate)</text>
    <text x="615" y="100" font-size="10" fill="#94A3B8">Key: "user_2" | Val: Object</text>
    <text x="615" y="118" font-size="10" fill="#34D399">prev ← Node 1 | next → Tail</text>

    <!-- Tail Dummy -->
    <rect x="905" y="50" width="150" height="85" rx="6" fill="#0F172A" stroke="#F87171" stroke-width="1.5"/>
    <text x="980" y="75" font-size="12" font-weight="700" fill="#F87171" text-anchor="middle">TAIL DUMMY</text>
    <text x="920" y="100" font-size="10" fill="#FBBF24">prev ← Node 2</text>
    <text x="920" y="118" font-size="10" fill="#94A3B8">next = null</text>

    <!-- Bidirectional Connectors -->
    <path d="M 185 85 L 195 85 C 235 85, 235 85, 273 85 L 285 85" fill="none" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
    <path d="M 285 105 L 275 105 C 235 105, 235 105, 197 105 L 185 105" fill="none" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>

    <path d="M 495 85 L 505 85 C 545 85, 545 85, 583 85 L 595 85" fill="none" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#arr-a)"/>
    <path d="M 595 105 L 585 105 C 545 105, 545 105, 507 105 L 495 105" fill="none" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>

    <path d="M 805 85 L 815 85 C 855 85, 855 85, 893 85 L 905 85" fill="none" stroke="#F87171" stroke-width="1.5" marker-end="url(#arr-r)"/>
    <path d="M 905 105 L 895 105 C 855 105, 855 105, 817 105 L 805 105" fill="none" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#arr-a)"/>
  </g>

  <!-- Part 2: Monotonic Stack & LRU Cache Map -->
  <g transform="translate(30, 265)">
    <rect width="1060" height="175" rx="8" fill="#1E1035" stroke="#C084FC" stroke-width="1.5"/>
    <text x="530" y="26" font-size="12" font-weight="700" fill="#C084FC" text-anchor="middle">2. MONOTONIC DECREASING STACK &amp; HASHMAP O(1) LOOKUP COUPLING</text>

    <!-- Subcard 1: Monotonic Decreasing Stack -->
    <rect x="35" y="45" width="470" height="115" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="270" y="68" font-size="11.5" font-weight="700" fill="#C084FC" text-anchor="middle">Monotonic Decreasing Stack Invariant</text>
    <rect x="60" y="80" width="80" height="30" rx="4" fill="#1E293B" stroke="#C084FC" stroke-width="1.2"/>
    <text x="100" y="100" font-size="11" font-weight="700" fill="#F8FAFC" text-anchor="middle">Top: 3</text>
    <rect x="170" y="80" width="80" height="30" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="210" y="100" font-size="11" font-weight="700" fill="#F8FAFC" text-anchor="middle">Mid: 5</text>
    <rect x="280" y="80" width="80" height="30" rx="4" fill="#1E293B" stroke="#34D399" stroke-width="1.2"/>
    <text x="320" y="100" font-size="11" font-weight="700" fill="#F8FAFC" text-anchor="middle">Base: 9</text>
    
    <text x="60" y="132" font-size="10" fill="#94A3B8">Incoming element X &gt; Top pops smaller elements.</text>
    <text x="60" y="148" font-size="10" fill="#34D399">Guarantees Next Greater Element resolved in amortized O(N).</text>

    <!-- Subcard 2: O(1) LRU Cache Mechanics -->
    <rect x="545" y="45" width="480" height="115" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="785" y="68" font-size="11.5" font-weight="700" fill="#34D399" text-anchor="middle">LRU Cache O(1) HashMap + DLL Pointer Hook</text>
    <rect x="570" y="80" width="200" height="30" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="670" y="100" font-size="10.5" fill="#93C5FD" font-weight="600" text-anchor="middle">HashMap&lt;Key, Node*&gt;</text>
    <path d="M 770 95 L 780 95 C 795 95, 795 95, 808 95 L 820 95" fill="none" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
    <rect x="820" y="80" width="180" height="30" rx="4" fill="#1E293B" stroke="#34D399" stroke-width="1"/>
    <text x="910" y="100" font-size="10.5" fill="#A7F3D0" font-weight="600" text-anchor="middle">Direct Node Reference</text>

    <text x="570" y="132" font-size="10" fill="#94A3B8">• get(K): Map returns Node* in O(1) → Splice to head (MRU)</text>
    <text x="570" y="148" font-size="10" fill="#94A3B8">• put(K, V): Evict tail.prev (LRU) in O(1) without scanning</text>
  </g>

  <!-- Invariant Banner -->
  <rect x="30" y="452" width="1060" height="24" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="560" y="468" font-size="10" fill="#93C5FD" font-weight="600" text-anchor="middle">Sentinel Invariant: Dummy head/tail nodes eliminate null checks and edge-case branching during boundary pointer mutations.</text>

</svg>