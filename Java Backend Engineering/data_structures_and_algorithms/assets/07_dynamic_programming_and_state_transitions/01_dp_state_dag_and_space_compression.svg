<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1120" height="480" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">DP State Transition DAG &amp; Rolling Memory Compression</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Overlapping subproblem resolution vs state space reduction from quadratic matrix to scalar registers</text>

  <!-- Container 1: State DAG -->
  <g transform="translate(30, 85)">
    <rect width="520" height="355" rx="8" fill="#0B132B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="260" y="28" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle">1. STATE TRANSITION DAG &amp; OVERLAPPING SUBPROBLEMS</text>

    <!-- Subproblems (i-2) and (i-1) -->
    <rect x="40" y="60" width="160" height="55" rx="6" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.2"/>
    <text x="120" y="82" font-size="11" font-weight="700" fill="#C084FC" text-anchor="middle">Subproblem (i - 2)</text>
    <text x="120" y="100" font-size="9.5" fill="#94A3B8" class="code" text-anchor="middle">memo[i-2] (Cached)</text>

    <rect x="40" y="145" width="160" height="55" rx="6" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.2"/>
    <text x="120" y="167" font-size="11" font-weight="700" fill="#C084FC" text-anchor="middle">Subproblem (i - 1)</text>
    <text x="120" y="185" font-size="9.5" fill="#94A3B8" class="code" text-anchor="middle">memo[i-1] (Cached)</text>

    <!-- Current State DP[i] -->
    <rect x="290" y="95" width="190" height="75" rx="6" fill="#062828" stroke="#34D399" stroke-width="2"/>
    <text x="385" y="122" font-size="12.5" font-weight="700" fill="#34D399" text-anchor="middle">CURRENT STATE: DP[i]</text>
    <text x="385" y="142" font-size="10" fill="#F8FAFC" class="code" text-anchor="middle">f(DP[i-1], DP[i-2], val)</text>
    <text x="385" y="158" font-size="9" fill="#94A3B8" text-anchor="middle">Optimal Substructure Combination</text>

    <!-- Transitions into DP[i] with runways -->
    <path d="M 200 87 L 210 87 C 240 87, 240 120, 276 120 L 290 120" fill="none" stroke="#C084FC" stroke-width="1.5" marker-end="url(#arr-p)"/>
    <path d="M 200 172 L 210 172 C 240 172, 240 145, 276 145 L 290 145" fill="none" stroke="#C084FC" stroke-width="1.5" marker-end="url(#arr-p)"/>

    <!-- Next State DP[i+1] -->
    <rect x="290" y="235" width="190" height="65" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="385" y="260" font-size="11.5" font-weight="700" fill="#38BDF8" text-anchor="middle">NEXT SUBPROBLEM: DP[i+1]</text>
    <text x="385" y="280" font-size="9.5" fill="#94A3B8" text-anchor="middle">Propagates to final answer DP[N]</text>

    <!-- DP[i] down to DP[i+1] -->
    <path d="M 385 170 L 385 235" fill="none" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>

    <!-- Invariant Box -->
    <rect x="40" y="235" width="220" height="95" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="150" y="258" font-size="10.5" font-weight="700" fill="#F8FAFC" text-anchor="middle">DP Taxonomy:</text>
    <text x="50" y="278" font-size="9.5" fill="#94A3B8">• 1D: Robber, Climb Stairs</text>
    <text x="50" y="294" font-size="9.5" fill="#94A3B8">• 2D: Edit Distance, LCS</text>
    <text x="50" y="310" font-size="9.5" fill="#34D399">• Knapsack: Bounded / Unbounded</text>
  </g>

  <!-- Container 2: Space Compression -->
  <g transform="translate(570, 85)">
    <rect width="520" height="355" rx="8" fill="#1E1035" stroke="#C084FC" stroke-width="1.5"/>
    <text x="260" y="28" font-size="12" font-weight="700" fill="#C084FC" text-anchor="middle">2. ROLLING STATE MEMORY COMPRESSION</text>

    <!-- Stage 1: Full 2D Grid -->
    <rect x="35" y="55" width="450" height="75" rx="6" fill="#0F172A" stroke="#EF4444" stroke-width="1.2"/>
    <text x="55" y="80" font-size="11.5" font-weight="700" fill="#F87171">Naive 2D State Matrix: int[N][W]</text>
    <text x="55" y="100" font-size="10" fill="#94A3B8">• Auxiliary Space: O(N × W) memory allocation</text>
    <text x="55" y="116" font-size="10" fill="#EF4444">• High GC churn &amp; L3 cache evictions on large grids</text>

    <!-- Arrow 1 to 2 -->
    <path d="M 260 130 L 260 155" fill="none" stroke="#FBBF24" stroke-width="2" marker-end="url(#arr-a)"/>

    <!-- Stage 2: 1D Rolling Buffer -->
    <rect x="35" y="155" width="450" height="75" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="55" y="180" font-size="11.5" font-weight="700" fill="#FBBF24">Compressed 1D Row Vector: int[W]</text>
    <text x="55" y="200" font-size="10" fill="#94A3B8">• Auxiliary Space: O(W) (Row-by-row traversal)</text>
    <text x="55" y="216" font-size="10" fill="#34D399">• 0/1 Knapsack: Traverse right-to-left to prevent reuse</text>

    <!-- Arrow 2 to 3 -->
    <path d="M 260 230 L 260 255" fill="none" stroke="#34D399" stroke-width="2" marker-end="url(#arr-g)"/>

    <!-- Stage 3: Two Registers O(1) -->
    <rect x="35" y="255" width="450" height="75" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <text x="55" y="280" font-size="11.5" font-weight="700" fill="#34D399">Scalar Register Compression: prev1, prev2</text>
    <text x="55" y="300" font-size="10" fill="#94A3B8">• Auxiliary Space: O(1) registers (Fibonacci / House Robber)</text>
    <text x="55" y="316" font-size="10" fill="#A7F3D0">• Zero heap allocations; fits directly into CPU registers</text>
  </g>

  <!-- Invariant Banner -->
  <rect x="30" y="448" width="1060" height="24" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="560" y="464" font-size="10" fill="#93C5FD" font-weight="600" text-anchor="middle">Optimal Substructure Invariant: If a state only references k previous steps, space complexity compresses from O(N) to O(k) without altering time complexity.</text>

</svg>