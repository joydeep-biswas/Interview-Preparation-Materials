<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1120" height="360" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Dutch National Flag: 3-Way Partitioning Invariant</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Dijkstra's strict 4-region pointer partitioning topology executed in a single O(N) scan</text>

  <!-- Visual Register Array -->
  <g transform="translate(60, 95)">
    <!-- Region 1: All 0s -->
    <rect x="0" y="0" width="220" height="120" rx="6" fill="#0B132B" stroke="#38BDF8" stroke-width="2"/>
    <text x="110" y="32" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="middle">REGION 1: ALL 0s</text>
    <rect x="25" y="48" width="170" height="30" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="110" y="68" font-size="11" fill="#F8FAFC" class="code" text-anchor="middle">Index 0 .. low - 1</text>
    <text x="110" y="102" font-size="10" fill="#94A3B8" text-anchor="middle">Strictly finalized zeros</text>

    <!-- Region 2: All 1s -->
    <rect x="250" y="0" width="220" height="120" rx="6" fill="#062828" stroke="#34D399" stroke-width="2"/>
    <text x="360" y="32" font-size="13" font-weight="700" fill="#34D399" text-anchor="middle">REGION 2: ALL 1s</text>
    <rect x="275" y="48" width="170" height="30" rx="4" fill="#1E293B" stroke="#34D399" stroke-width="1"/>
    <text x="360" y="68" font-size="11" fill="#F8FAFC" class="code" text-anchor="middle">Index low .. mid - 1</text>
    <text x="360" y="102" font-size="10" fill="#94A3B8" text-anchor="middle">Strictly finalized ones</text>

    <!-- Region 3: Unexamined Candidates -->
    <rect x="500" y="0" width="250" height="120" rx="6" fill="#2D1802" stroke="#FBBF24" stroke-width="2"/>
    <text x="625" y="32" font-size="13" font-weight="700" fill="#FBBF24" text-anchor="middle">REGION 3: UNEXAMINED</text>
    <rect x="525" y="48" width="200" height="30" rx="4" fill="#1E293B" stroke="#FBBF24" stroke-width="1"/>
    <text x="625" y="68" font-size="11" fill="#F8FAFC" class="code" text-anchor="middle">Index mid .. high</text>
    <text x="625" y="102" font-size="10" fill="#FDE68A" font-weight="600" text-anchor="middle">Active Scan Frontier (Shrinking)</text>

    <!-- Region 4: All 2s -->
    <rect x="780" y="0" width="220" height="120" rx="6" fill="#1E1035" stroke="#C084FC" stroke-width="2"/>
    <text x="890" y="32" font-size="13" font-weight="700" fill="#C084FC" text-anchor="middle">REGION 4: ALL 2s</text>
    <rect x="805" y="48" width="170" height="30" rx="4" fill="#1E293B" stroke="#C084FC" stroke-width="1"/>
    <text x="890" y="68" font-size="11" fill="#F8FAFC" class="code" text-anchor="middle">Index high + 1 .. n - 1</text>
    <text x="890" y="102" font-size="10" fill="#94A3B8" text-anchor="middle">Strictly finalized twos</text>
  </g>

  <!-- Connectors between regions -->
  <path d="M 280 155 L 290 155 C 298 155, 298 155, 302 155 L 310 155" fill="none" stroke="#34D399" stroke-width="2" marker-end="url(#arr-g)"/>
  <path d="M 530 155 L 540 155 C 548 155, 548 155, 552 155 L 560 155" fill="none" stroke="#FBBF24" stroke-width="2" marker-end="url(#arr-a)"/>
  <path d="M 810 155 L 820 155 C 828 155, 828 155, 832 155 L 840 155" fill="none" stroke="#C084FC" stroke-width="2" marker-end="url(#arr-p)"/>

  <!-- Decision Table Cards Below -->
  <g transform="translate(60, 235)">
    <rect width="1000" height="68" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
    <text x="165" y="24" font-size="11" font-weight="700" fill="#38BDF8">If nums[mid] == 0:</text>
    <text x="165" y="44" font-size="10.5" fill="#94A3B8">swap(low, mid); low++; mid++</text>

    <text x="500" y="24" font-size="11" font-weight="700" fill="#34D399">If nums[mid] == 1:</text>
    <text x="500" y="44" font-size="10.5" fill="#94A3B8">mid++ (already in correct region)</text>

    <text x="835" y="24" font-size="11" font-weight="700" fill="#F87171">If nums[mid] == 2:</text>
    <text x="835" y="44" font-size="10.5" fill="#94A3B8">swap(mid, high); high-- (do NOT advance mid!)</text>
  </g>

  <!-- Invariant Banner -->
  <rect x="60" y="318" width="1000" height="24" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="560" y="334" font-size="10.5" fill="#93C5FD" font-weight="600" text-anchor="middle">Termination Condition: Loop terminates when mid &gt; high. Region 3 completely collapses to 0 elements in exactly O(N) operations.</text>

</svg>