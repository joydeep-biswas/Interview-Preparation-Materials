<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1120" height="480" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Dual-Heaps Streaming Median &amp; Sweep-Line Interval Projection</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Real-time balanced priority queues vs 1D coordinate projection for interval intersections</text>

  <!-- Container 1: Dual Heaps Streaming Median -->
  <g transform="translate(30, 85)">
    <rect width="520" height="355" rx="8" fill="#0B132B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="260" y="28" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle">1. TWO-HEAPS REAL-TIME STREAMING MEDIAN ARCHITECTURE</text>

    <!-- Inbound Stream -->
    <rect x="160" y="50" width="200" height="36" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="260" y="72" font-size="11.5" font-weight="700" fill="#F8FAFC" text-anchor="middle">Unbounded Input Stream</text>

    <!-- Max-Heap (Lower Half) -->
    <rect x="35" y="125" width="215" height="135" rx="6" fill="#062828" stroke="#34D399" stroke-width="1.5"/>
    <text x="142" y="148" font-size="11.5" font-weight="700" fill="#34D399" text-anchor="middle">MAX-HEAP (Lower 50%)</text>
    <rect x="55" y="160" width="175" height="32" rx="4" fill="#0F172A" stroke="#34D399" stroke-width="1"/>
    <text x="142" y="180" font-size="10.5" fill="#34D399" font-weight="700" text-anchor="middle">Root = Max of Lower Half</text>
    <text x="45" y="210" font-size="10" fill="#94A3B8">• Stores values &lt;= median</text>
    <text x="45" y="226" font-size="10" fill="#94A3B8">• Size: k or k + 1</text>
    <text x="45" y="242" font-size="10" fill="#A7F3D0">• O(1) peek at lower max</text>

    <!-- Min-Heap (Upper Half) -->
    <rect x="270" y="125" width="215" height="135" rx="6" fill="#2D1802" stroke="#FBBF24" stroke-width="1.5"/>
    <text x="377" y="148" font-size="11.5" font-weight="700" fill="#FBBF24" text-anchor="middle">MIN-HEAP (Upper 50%)</text>
    <rect x="290" y="160" width="175" height="32" rx="4" fill="#0F172A" stroke="#FBBF24" stroke-width="1"/>
    <text x="377" y="180" font-size="10.5" fill="#FBBF24" font-weight="700" text-anchor="middle">Root = Min of Upper Half</text>
    <text x="280" y="210" font-size="10" fill="#94A3B8">• Stores values &gt;= median</text>
    <text x="280" y="226" font-size="10" fill="#94A3B8">• Size: k</text>
    <text x="280" y="242" font-size="10" fill="#FDE68A">• O(1) peek at upper min</text>

    <!-- Stream splitting connectors -->
    <path d="M 220 86 L 220 105 C 220 115, 142 110, 142 119 L 142 125" fill="none" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
    <path d="M 300 86 L 300 105 C 300 115, 377 110, 377 119 L 377 125" fill="none" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#arr-a)"/>

    <!-- Rebalance connector -->
    <path d="M 250 192 L 270 192" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>
    <path d="M 270 180 L 250 180" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arr-b)"/>

    <!-- Median Formula Box -->
    <rect x="35" y="275" width="450" height="65" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="260" y="295" font-size="11" font-weight="700" fill="#F8FAFC" text-anchor="middle">O(1) Median Calculation Invariant:</text>
    <text x="45" y="315" font-size="10" fill="#94A3B8">Odd Count:  median = MaxHeap.peek()</text>
    <text x="45" y="331" font-size="10" fill="#38BDF8">Even Count: median = (MaxHeap.peek() + MinHeap.peek()) / 2.0</text>
  </g>

  <!-- Container 2: Interval Sweep-Line -->
  <g transform="translate(570, 85)">
    <rect width="520" height="355" rx="8" fill="#1E1035" stroke="#C084FC" stroke-width="1.5"/>
    <text x="260" y="28" font-size="12" font-weight="700" fill="#C084FC" text-anchor="middle">2. SWEEP-LINE EVENT PROJECTION (MEETING ROOMS II)</text>

    <!-- Timeline Coordinate Axis -->
    <rect x="35" y="55" width="450" height="32" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <path fill="none" d="M 50 71 L 460 71" stroke="#64748B" stroke-width="2"/>
    <text x="55" y="65" font-size="9" fill="#94A3B8">t = 0</text>
    <text x="445" y="65" font-size="9" fill="#94A3B8">t = max</text>

    <!-- Discrete Event Points -->
    <!-- Event 1: Start (t=5, +1) -->
    <rect x="55" y="110" width="90" height="55" rx="4" fill="#062828" stroke="#34D399" stroke-width="1.5"/>
    <text x="100" y="128" font-size="10.5" font-weight="700" fill="#34D399" text-anchor="middle">t = 5 [START]</text>
    <text x="100" y="146" font-size="10" fill="#A7F3D0" text-anchor="middle">+1 Room</text>

    <!-- Event 2: Start (t=10, +1) -->
    <rect x="165" y="110" width="90" height="55" rx="4" fill="#062828" stroke="#34D399" stroke-width="1.5"/>
    <text x="210" y="128" font-size="10.5" font-weight="700" fill="#34D399" text-anchor="middle">t = 10 [START]</text>
    <text x="210" y="146" font-size="10" fill="#A7F3D0" text-anchor="middle">+1 Room</text>

    <!-- Event 3: End (t=15, -1) -->
    <rect x="275" y="110" width="90" height="55" rx="4" fill="#2D1802" stroke="#FBBF24" stroke-width="1.5"/>
    <text x="320" y="128" font-size="10.5" font-weight="700" fill="#FBBF24" text-anchor="middle">t = 15 [END]</text>
    <text x="320" y="146" font-size="10" fill="#FDE68A" text-anchor="middle">-1 Room</text>

    <!-- Event 4: End (t=20, -1) -->
    <rect x="385" y="110" width="90" height="55" rx="4" fill="#2D1802" stroke="#FBBF24" stroke-width="1.5"/>
    <text x="430" y="128" font-size="10.5" font-weight="700" fill="#FBBF24" text-anchor="middle">t = 20 [END]</text>
    <text x="430" y="146" font-size="10" fill="#FDE68A" text-anchor="middle">-1 Room</text>

    <!-- Event Sequence Connectors -->
    <path d="M 145 137 L 165 137" fill="none" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
    <path d="M 255 137 L 275 137" fill="none" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#arr-a)"/>
    <path d="M 365 137 L 385 137" fill="none" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#arr-a)"/>

    <!-- Active Room Concurrency Chart -->
    <rect x="35" y="185" width="450" height="145" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="50" y="208" font-size="11" font-weight="700" fill="#C084FC">Sweep-Line Concurrency Invariant:</text>
    <text x="50" y="228" font-size="10" fill="#94A3B8">• Sort Events by timestamp ascending</text>
    <text x="50" y="244" font-size="10" fill="#94A3B8">• Tie-Breaker: End events precede Start events if endpoints touch</text>
    <text x="50" y="260" font-size="10" fill="#94A3B8">• Running count: activeRooms += delta</text>
    <text x="50" y="276" font-size="10" fill="#34D399">• Peak concurrency: maxRooms = max(maxRooms, activeRooms)</text>
    <text x="50" y="296" font-size="10.5" font-weight="700" fill="#FDE68A">Complexity: O(N log N) time for sorting, O(N) space</text>
  </g>

  <!-- Invariant Banner -->
  <rect x="30" y="448" width="1060" height="24" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="560" y="464" font-size="10" fill="#93C5FD" font-weight="600" text-anchor="middle">Priority Ordering Invariant: Priority queues maintain continuous partial orders in O(log N) inserts; sweep-line projects multi-dimensional intervals onto a 1D scalar event timeline.</text>

</svg>