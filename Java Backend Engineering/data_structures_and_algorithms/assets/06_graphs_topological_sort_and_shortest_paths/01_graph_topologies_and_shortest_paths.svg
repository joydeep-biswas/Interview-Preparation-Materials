<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1120" height="500" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Graph Representations, Cycle Detection &amp; Shortest Paths</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Adjacency topology, 3-color DFS cycle guards, Kahn's topological sort, and weighted path relaxation</text>

  <!-- Col 1: Graph Representations -->
  <g transform="translate(30, 85)">
    <rect width="320" height="375" rx="8" fill="#0B132B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="160" y="28" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle">1. GRAPH DATA STRUCTURES</text>

    <!-- Adj List -->
    <rect x="20" y="50" width="280" height="135" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="160" y="74" font-size="11.5" font-weight="700" fill="#34D399" text-anchor="middle">Adjacency List (Standard)</text>
    <text x="35" y="98" font-size="10" fill="#94A3B8">• Type: Map&lt;Integer, List&lt;Edge&gt;&gt;</text>
    <text x="35" y="116" font-size="10" fill="#94A3B8">• Space: O(V + E) sparse optimal</text>
    <text x="35" y="134" font-size="10" fill="#94A3B8">• Out-degree iteration: O(deg(u))</text>
    <text x="35" y="152" font-size="10" fill="#34D399">• Industry Default for Web/Network graphs</text>

    <!-- Adj Matrix -->
    <rect x="20" y="205" width="280" height="145" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="160" y="229" font-size="11.5" font-weight="700" fill="#FBBF24" text-anchor="middle">Adjacency Matrix (Dense)</text>
    <text x="35" y="253" font-size="10" fill="#94A3B8">• Type: int[V][V] or boolean[V][V]</text>
    <text x="35" y="271" font-size="10" fill="#94A3B8">• Space: O(V²) quadratic footprint</text>
    <text x="35" y="289" font-size="10" fill="#94A3B8">• Edge Existence Check: O(1)</text>
    <text x="35" y="307" font-size="10" fill="#F87171">• Cache hostile when V &gt; 10,000</text>
  </g>

  <!-- Col 2: Core Traversals & 3-Color Cycle Detection -->
  <g transform="translate(380, 85)">
    <rect width="340" height="375" rx="8" fill="#062828" stroke="#34D399" stroke-width="1.5"/>
    <text x="170" y="28" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle">2. TRAVERSALS &amp; 3-COLOR DFS</text>

    <!-- BFS -->
    <rect x="20" y="50" width="300" height="95" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="170" y="74" font-size="11.5" font-weight="700" fill="#38BDF8" text-anchor="middle">Breadth-First Search (BFS)</text>
    <text x="35" y="96" font-size="10" fill="#94A3B8">• Frontier Queue: Level-by-level radial expansion</text>
    <text x="35" y="114" font-size="10" fill="#34D399">• Guarantees unweighted shortest path</text>

    <!-- DFS 3-Color -->
    <rect x="20" y="165" width="300" height="185" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="170" y="189" font-size="11.5" font-weight="700" fill="#C084FC" text-anchor="middle">DFS 3-Color Cycle Invariant</text>
    
    <rect x="35" y="202" width="270" height="32" rx="4" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/>
    <text x="45" y="222" font-size="10" fill="#F8FAFC"><tspan fill="#94A3B8" font-weight="700">WHITE (0):</tspan> Unvisited node</text>

    <rect x="35" y="242" width="270" height="32" rx="4" fill="#2D1802" stroke="#F59E0B" stroke-width="1"/>
    <text x="45" y="262" font-size="10" fill="#F8FAFC"><tspan fill="#FBBF24" font-weight="700">GRAY (1):</tspan> In current DFS stack (BACK-EDGE = CYCLE!)</text>

    <rect x="35" y="282" width="270" height="32" rx="4" fill="#062828" stroke="#10B981" stroke-width="1"/>
    <text x="45" y="302" font-size="10" fill="#F8FAFC"><tspan fill="#34D399" font-weight="700">BLACK (2):</tspan> Fully explored subtree</text>
  </g>

  <!-- Col 3: Dependency Resolution & Shortest Paths -->
  <g transform="translate(750, 85)">
    <rect width="340" height="375" rx="8" fill="#1E1035" stroke="#C084FC" stroke-width="1.5"/>
    <text x="170" y="28" font-size="12" font-weight="700" fill="#C084FC" text-anchor="middle">3. DEPENDENCIES &amp; SHORTEST PATHS</text>

    <!-- Kahn's Topo -->
    <rect x="20" y="50" width="300" height="95" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="170" y="74" font-size="11.5" font-weight="700" fill="#38BDF8" text-anchor="middle">Kahn's Topological Sort (BFS)</text>
    <text x="35" y="96" font-size="10" fill="#94A3B8">• Track in-degree[u]; push nodes with degree == 0</text>
    <text x="35" y="114" font-size="10" fill="#34D399">• If processed &lt; V → Graph contains a cycle!</text>

    <!-- DSU -->
    <rect x="20" y="160" width="300" height="95" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="170" y="184" font-size="11.5" font-weight="700" fill="#FBBF24" text-anchor="middle">Disjoint Set Union (DSU / Union-Find)</text>
    <text x="35" y="206" font-size="10" fill="#94A3B8">• Path Compression: parent[i] = find(parent[i])</text>
    <text x="35" y="224" font-size="10" fill="#A7F3D0">• Union by Rank: Near-constant α(V) &lt; 5 runtime</text>

    <!-- Dijkstra -->
    <rect x="20" y="270" width="300" height="95" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="170" y="294" font-size="11.5" font-weight="700" fill="#C084FC" text-anchor="middle">Dijkstra's Shortest Path</text>
    <text x="35" y="316" font-size="10" fill="#94A3B8">• Min-Heap priority on cumulative distance</text>
    <text x="35" y="334" font-size="10" fill="#38BDF8">• Relaxation: dist[v] = min(dist[v], dist[u] + w)</text>
  </g>

  <!-- Connectors with straight runways -->
  <path d="M 350 270 L 358 270 C 366 270, 366 270, 368 270 L 380 270" fill="none" stroke="#34D399" stroke-width="2" marker-end="url(#arr-g)"/>
  <path d="M 720 270 L 728 270 C 736 270, 736 270, 738 270 L 750 270" fill="none" stroke="#C084FC" stroke-width="2" marker-end="url(#arr-p)"/>

  <!-- Invariant Banner -->
  <rect x="30" y="468" width="1060" height="24" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="560" y="484" font-size="10" fill="#93C5FD" font-weight="600" text-anchor="middle">Graph Invariant: Tree = Connected Graph with exactly V - 1 edges; Kahn's algorithm detects deadlock cycles in task scheduling workflows.</text>

</svg>