<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#C084FC"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#F87171"/>
    </marker>
  </defs>
  <!-- Canvas Background -->
  <rect width="1120" height="480" rx="10" fill="url(#bg)" stroke="#1F2937" stroke-width="1.5"/>
  <text x="35" y="34" font-size="16" font-weight="700" fill="#F8FAFC">Monotonic Search Space Reduction &amp; Divide-and-Conquer Pipeline</text>
  <text x="35" y="54" font-size="11" fill="#94A3B8">Algorithmic halving: Binary search on answer predicates vs recursion tree divide-and-conquer</text>

  <!-- Container 1: Binary Search on Predicate -->
  <g transform="translate(30, 85)">
    <rect width="520" height="355" rx="8" fill="#0B132B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="260" y="28" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle">1. MONOTONIC SEARCH SPACE REDUCTION: O(log N)</text>

    <!-- Range Bar -->
    <rect x="35" y="55" width="450" height="42" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
    <rect x="45" y="62" width="75" height="28" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="82" y="80" font-size="10.5" fill="#38BDF8" font-weight="600" text-anchor="middle">Low (L)</text>
    
    <rect x="220" y="62" width="100" height="28" rx="4" fill="#1E293B" stroke="#FBBF24" stroke-width="1.2"/>
    <text x="270" y="80" font-size="10.5" fill="#FBBF24" font-weight="700" text-anchor="middle">Mid = L+(R-L)/2</text>

    <rect x="400" y="62" width="75" height="28" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="437" y="80" font-size="10.5" fill="#38BDF8" font-weight="600" text-anchor="middle">High (R)</text>

    <!-- Branch 1: Predicate Holds -->
    <rect x="35" y="130" width="215" height="110" rx="6" fill="#062828" stroke="#34D399" stroke-width="1.5"/>
    <text x="142" y="152" font-size="11.5" font-weight="700" fill="#34D399" text-anchor="middle">Predicate F(mid) = TRUE</text>
    <text x="45" y="174" font-size="10" fill="#94A3B8">• Feasible answer found!</text>
    <text x="45" y="190" font-size="10" fill="#94A3B8">• Record: ans = mid</text>
    <text x="45" y="206" font-size="10" fill="#34D399">• Try better: R = mid - 1</text>
    <text x="45" y="222" font-size="10" fill="#64748B">Shrinks search space left</text>

    <!-- Branch 2: Predicate Fails -->
    <rect x="270" y="130" width="215" height="110" rx="6" fill="#2D1802" stroke="#FBBF24" stroke-width="1.5"/>
    <text x="377" y="152" font-size="11.5" font-weight="700" fill="#FBBF24" text-anchor="middle">Predicate F(mid) = FALSE</text>
    <text x="280" y="174" font-size="10" fill="#94A3B8">• Midpoint infeasible!</text>
    <text x="280" y="190" font-size="10" fill="#94A3B8">• Discard left half entirely</text>
    <text x="280" y="206" font-size="10" fill="#FBBF24">• Advance: L = mid + 1</text>
    <text x="280" y="222" font-size="10" fill="#64748B">Shrinks search space right</text>

    <!-- Connectors -->
    <path d="M 250 97 L 250 112 C 250 122, 142 118, 142 124 L 142 130" fill="none" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
    <path d="M 290 97 L 290 112 C 290 122, 377 118, 377 124 L 377 130" fill="none" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#arr-a)"/>

    <!-- Bottom summary box -->
    <rect x="35" y="255" width="450" height="85" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="45" y="275" font-size="10.5" font-weight="700" fill="#38BDF8">Canonical Binary Search Invariants:</text>
    <text x="45" y="295" font-size="10" fill="#94A3B8">• Koko Eating Bananas: Monotonic speed vs total hours</text>
    <text x="45" y="311" font-size="10" fill="#94A3B8">• Capacity to Ship Packages: Capacity vs day limit</text>
    <text x="45" y="327" font-size="10" fill="#34D399">• Rotated Array: Find inflection where nums[mid] &gt; nums[R]</text>
  </g>

  <!-- Container 2: Divide & Conquer -->
  <g transform="translate(570, 85)">
    <rect width="520" height="355" rx="8" fill="#1E1035" stroke="#C084FC" stroke-width="1.5"/>
    <text x="260" y="28" font-size="12" font-weight="700" fill="#C084FC" text-anchor="middle">2. DIVIDE AND CONQUER RECURSION PIPELINE</text>

    <!-- Level 0: Problem Size N -->
    <rect x="180" y="55" width="160" height="36" rx="6" fill="#1E293B" stroke="#C084FC" stroke-width="1.5"/>
    <text x="260" y="77" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle">Problem (Size N)</text>

    <!-- Level 1: Split into N/2 -->
    <rect x="70" y="125" width="150" height="36" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="145" y="147" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">Subproblem (N / 2)</text>

    <rect x="300" y="125" width="150" height="36" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="375" y="147" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">Subproblem (N / 2)</text>

    <!-- Connectors Level 0 to Level 1 -->
    <path d="M 230 91 L 230 105 C 230 115, 145 110, 145 119 L 145 125" fill="none" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>
    <path d="M 290 91 L 290 105 C 290 115, 375 110, 375 119 L 375 125" fill="none" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arr-b)"/>

    <!-- Level 2: Base Cases (Size 1) -->
    <rect x="35" y="195" width="105" height="32" rx="4" fill="#0F172A" stroke="#34D399" stroke-width="1"/>
    <text x="87" y="215" font-size="10" fill="#A7F3D0" text-anchor="middle">Base Case [0]</text>

    <rect x="155" y="195" width="105" height="32" rx="4" fill="#0F172A" stroke="#34D399" stroke-width="1"/>
    <text x="207" y="215" font-size="10" fill="#A7F3D0" text-anchor="middle">Base Case [1]</text>

    <rect x="275" y="195" width="105" height="32" rx="4" fill="#0F172A" stroke="#34D399" stroke-width="1"/>
    <text x="327" y="215" font-size="10" fill="#A7F3D0" text-anchor="middle">Base Case [2]</text>

    <rect x="395" y="195" width="95" height="32" rx="4" fill="#0F172A" stroke="#34D399" stroke-width="1"/>
    <text x="442" y="215" font-size="10" fill="#A7F3D0" text-anchor="middle">Base Case [3]</text>

    <path d="M 120 161 L 120 175 C 120 185, 87 182, 87 189 L 87 195" fill="none" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
    <path d="M 170 161 L 170 175 C 170 185, 207 182, 207 189 L 207 195" fill="none" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
    <path d="M 350 161 L 350 175 C 350 185, 327 182, 327 189 L 327 195" fill="none" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>
    <path d="M 400 161 L 400 175 C 400 185, 442 182, 442 189 L 442 195" fill="none" stroke="#34D399" stroke-width="1.5" marker-end="url(#arr-g)"/>

    <!-- Combine / Merge Step -->
    <rect x="70" y="260" width="380" height="75" rx="6" fill="#062828" stroke="#34D399" stroke-width="1.5"/>
    <text x="260" y="280" font-size="11.5" font-weight="700" fill="#34D399" text-anchor="middle">COMBINE / MERGE RECOMBINATION: O(N)</text>
    <text x="90" y="302" font-size="10" fill="#94A3B8">• Two-Pointer sorted merge yields O(N log N) total runtime</text>
    <text x="90" y="318" font-size="10" fill="#94A3B8">• Master Theorem: T(N) = 2T(N/2) + O(N) → O(N log N)</text>
  </g>

  <!-- Invariant Banner -->
  <rect x="30" y="448" width="1060" height="24" rx="4" fill="#0B132B" stroke="#334155" stroke-width="1"/>
  <text x="560" y="464" font-size="10" fill="#93C5FD" font-weight="600" text-anchor="middle">Mathematical Invariant: Overflow avoidance (mid = low + (high - low) / 2); QuickSelect achieves expected O(N) by recurring into only one partition half.</text>

</svg>